name = "numlib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Numlib", "NumlibSurface"]
# Mathlib now requires the module system; this project knowingly stays on non-module files.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false      # no Mathlib copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[require]]
name = "tracker"
path = "tools/tracker"

[[lean_lib]]
name = "Numlib"

[[lean_lib]]
name = "NumlibSurface"
