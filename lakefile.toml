name = "numlib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Numlib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib copyright headers in this project
maxSynthPendingDepth = 3

# Progress tracker: the plan in `tracker/` is checked against the compiled library.
[[require]]
name = "tracker"
git = "https://github.com/bridgekat/tracker"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Numlib"
