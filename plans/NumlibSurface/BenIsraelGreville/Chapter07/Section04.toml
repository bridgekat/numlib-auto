namespace = "BenIsraelGreville.Chapter07"

desc = '''Prescribed-range outer inverses and their specializations. Delegate to the earlier range-and-kernel theorem, the maximal-pivot formula, and the spectral inverse constructions.'''

[[node]]
id = "outerInverse_eq_of_range_ker"
kind = "theorem"
desc = '''If nonzero X is an outer inverse of A, range U = range X and ker V = ker X, then rank U = rank V = rank(VAU), and X = UYV for every inner inverse Y of VAU.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (17)"

[[node]]
id = "pinv_eq_zlobec"
kind = "theorem"
desc = '''For every inner inverse Y of AᴴAAᴴ one has A† = AᴴYAᴴ.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (18), Zlobec formula"
deps = ["outerInverse_eq_of_range_ker"]

[[node]]
id = "drazin_eq_greville"
kind = "theorem"
desc = '''If l is positive and at least the matrix index, Aᴰ = A^l Y A^l for every inner inverse Y of A^(2l+1).'''
source = "Ben-Israel and Greville, Ch. 7, §4, (4.48), Greville formula"
deps = ["outerInverse_eq_of_range_ker"]

[[node]]
id = "pinv_eq_noble"
kind = "theorem"
desc = '''With P A Q = [I; S] A₁₁ [I T] and nonsingular maximal pivot A₁₁, express A† as Q[I;Tᴴ](I+TTᴴ)⁻¹ A₁₁⁻¹ (I+SᴴS)⁻¹[I Sᴴ]P, for row and column permutations P and Q.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (5.28), Noble formula"

[[node]]
id = "pinv_eq_macDuffee"
kind = "theorem"
desc = '''For a full rank factorization A = FG, A† = Gᴴ(FᴴAGᴴ)⁻¹Fᴴ.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (1.17), MacDuffee formula"

[[node]]
id = "groupInverse_eq_cline"
kind = "theorem"
desc = '''For a full rank factorization A = FG with GF nonsingular, the group inverse is F((GF)⁻¹)^2 G.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (4.22), Cline formula for the group inverse"

[[node]]
id = "drazin_eq_cline"
kind = "theorem"
desc = '''For positive index k, recursively factor A = B₁G₁ and GᵢBᵢ = Bᵢ₊₁Gᵢ₊₁ with full-rank factors. The last GₖBₖ is nonsingular and Aᴰ = B₁⋯Bₖ ((GₖBₖ)⁻¹)^(k+1) Gₖ⋯G₁.'''
source = "Ben-Israel and Greville, Ch. 7, §4, (4.46a)–(4.46c), Cline method"

[[node]]
id = "pinv_eq_of_thinSVD"
kind = "theorem"
desc = '''For a reduced SVD A = UᵣDᵣVᵣᴴ with all singular values in Dᵣ positive, prove A† = VᵣDᵣ⁻¹ Uᵣᴴ = Vᵣ(UᵣᴴAVᵣ)⁻¹ Uᵣᴴ and obtain the second equality from (17).'''
source = "Ben-Israel and Greville, Ch. 7, §4, Exercise 7, (6.30a)–(6.30b)"
deps = ["outerInverse_eq_of_range_ker"]
