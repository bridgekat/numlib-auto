[[node]]
id = "rationalLaplaceRepresentation"
kind = "theorem"
desc = '''
Construct a concrete causal signal class with a bijective Laplace transform for every
real rational function, including polynomial terms that represent impulses and their
derivatives. Prove the initial-data law in that class to specialize the inverse-transform
statement without an abstract representation assumption.
'''
source = "Ben-Israel and Greville, Chapter 8, §6, Equation (84), rational inverse Laplace transform with impulses"
deps = ["theorem_6_of_laplace_representation"]
