[[node]]
id = "exercise_40_polar_area_eq_hausdorff"
kind = "theorem"
desc = '''Identify the angular measure in the polar decomposition with normalized Hausdorff measure on the Euclidean sphere, so the radial derivative, Hausdorff scaling, and unit area theorems refer to the same surface measure.'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 40, (168)–(169)"
deps = ["graphMeasure_eq_hausdorff", "exercise_40_sphere_scaling", "exercise_40_unitSphereArea"]

[[node]]
id = "exercise_41_hemisphere_integral"
kind = "theorem"
desc = '''Prove the hemisphere integral for geometric sphere area, justify omitting the equator where the graph derivative is singular, and establish the stated Beta-function recurrence by the radial substitution.'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 41, (170)–(171)"
deps = ["exercise_41_hemisphere_density", "exercise_40_polar_area_eq_hausdorff", "exercise_39_beta_eq_gamma"]

