[[node]]
id = "exercise_33_line_integral"
kind = "theorem"
desc = '''Prove the weighted speed formula for line integrals on a parametrized arc, its arc length, and the graph specialization parametrized by the first coordinate. For image-based measure assume an injective chart or include multiplicity.'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 33, (149)–(150)"
deps = ["exercise_33_jacobian_volume", "integral_areaFormula"]

[[node]]
id = "exercise_34_surface_integral"
kind = "theorem"
desc = '''Differentiate the cylindrical chart for a continuously differentiable height and derive its geometric surface integral, using a nonnegative radius and an injective angle chart.'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 34, (151)–(155)"
deps = ["exercise_34_jacobian_volume", "integral_areaFormula"]

[[node]]
id = "exercise_35_surface_integral"
kind = "theorem"
desc = '''Specialize the cylindrical surface integral to a height depending only on radius.'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 35, (156) and the following integral"
deps = ["exercise_34_surface_integral", "exercise_35_jacobian_volume"]

[[node]]
id = "exercise_36_surface_integral"
kind = "theorem"
desc = '''Differentiate and integrate the stated radially symmetric spherical chart, with nonnegative radius and physical angle range. Remove the spurious extra radius in the printed definition of the pulled-back integrand in (159b).'''
source = "Ben-Israel and Greville, Chapter 8, §9, Exercise 36, (157)–(159)"
deps = ["exercise_36_jacobian_volume", "integral_areaFormula"]

