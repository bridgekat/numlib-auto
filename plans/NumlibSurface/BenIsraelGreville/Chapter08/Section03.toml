namespace = "BenIsraelGreville.Chapter08"

desc = '''Finite-dimensional L² regression. Use a probability measure, finite vectors in MemLp 2, coordinate expectations and covariance, and AlmostEverywhereEq for estimator uniqueness. Separate the covariance comparisons from the probability moments in the backbone.'''

[[node]]
id = "covarianceMatrix"
kind = "definition"
desc = '''Entry (i,j) is the expected product of the centered coordinates i and j.'''
source = "Ben-Israel and Greville, Ch. 8, §3, covariance definition before (10)"

[[node]]
id = "IsLinearStatisticalModel"
kind = "definition"
desc = '''The square-integrable observation family has mean Xβ for every parameter β and covariance V² with V symmetric PSD, equivalently it is Xβ plus centered error of that covariance. A parameterized observation family keeps the universal unbiasedness condition meaningful.'''
source = "Ben-Israel and Greville, Ch. 8, §3, (10)–(13)"
deps = ["covarianceMatrix"]

[[node]]
id = "IsLinearUnbiasedEstimator"
kind = "definition"
desc = '''The estimator A maps the observation to Ay and is unbiased for Bβ for every β, equivalently AX = B.'''
source = "Ben-Israel and Greville, Ch. 8, §3, (14)–(17)"
deps = ["IsLinearStatisticalModel"]

[[node]]
id = "IsEstimable"
kind = "definition"
desc = '''A linear function Bβ is estimable if there is an unbiased linear estimator, equivalently all rows of B belong to the row space of X.'''
source = "Ben-Israel and Greville, Ch. 8, §3, (16)–(17)"
deps = ["IsLinearUnbiasedEstimator"]

[[node]]
id = "IsBestLinearUnbiasedEstimator"
kind = "definition"
desc = '''An unbiased estimator whose covariance is minimal in Loewner order among unbiased linear estimators. In the scalar case this is minimum variance.'''
source = "Ben-Israel and Greville, Ch. 8, §3, definition after (16) and (19)"
deps = ["IsLinearUnbiasedEstimator"]

[[node]]
id = "estimatorClass"
kind = "definition"
desc = '''The estimator class E(X) consists of coefficients A of the form KXᵀ, whose rows lie in the column space of X.'''
source = "Ben-Israel and Greville, Ch. 8, §3, (20)"

[[node]]
id = "theorem_1"
kind = "theorem"
desc = '''For full-column-rank X and covariance σ²I, every Bβ is estimable, BX†y is BLUE, and its coefficient lies in E(X). Every LUE in E(X) gives the same estimator almost surely. Use the PSD covariance difference σ²A(I−XX†)Aᵀ.'''
source = "Ben-Israel and Greville, Ch. 8, §3, Theorem 1, (18)–(22)"
deps = ["IsEstimable", "IsBestLinearUnbiasedEstimator", "estimatorClass"]

[[node]]
id = "corollary_1"
kind = "theorem"
desc = '''Specialize Gauss–Markov to the scalar functional ⟨b,β⟩, obtaining minimum variance of ⟨b,X†y⟩ and almost-sure equality with every unbiased scalar estimator whose coefficient lies in range X. The extraneous B printed in the scalar expression has no role.'''
source = "Ben-Israel and Greville, Ch. 8, §3, Corollary 1"
deps = ["theorem_1"]

[[node]]
id = "generalizedBLUE"
kind = "definition"
desc = '''Set Q = I−XX† and define the estimator of the projected parameter by X†(I−(VQ)†V)ᵀ applied to the observation.'''
source = "Ben-Israel and Greville, Ch. 8, §3, (23)"
deps = ["IsLinearStatisticalModel"]

[[node]]
id = "theorem_2"
kind = "theorem"
desc = '''With arbitrary X and covariance V², each estimable scalar functional has a BLUE obtained by applying the functional to the generalized BLUE vector, unique up to almost-sure equality. The vector estimator lies in range Xᵀ and has covariance at most that of each estimator in that range unbiased for the projected parameter X†Xβ. Clarify the estimand in part (b) when X is rank deficient.'''
source = "Ben-Israel and Greville, Ch. 8, §3, Theorem 2, (23)–(32)"
deps = ["generalizedBLUE", "IsBestLinearUnbiasedEstimator", "IsEstimable"]

[[node]]
id = "corollary_2"
kind = "theorem"
desc = '''The generalized BLUE equals X†(I−(QV²Q)†QV²)ᵀy, and if V² is invertible it equals (Xᵀ(V²)⁻¹X)†Xᵀ(V²)⁻¹y. With scalar covariance the estimator reduces to X†y.'''
source = "Ben-Israel and Greville, Ch. 8, §3, Corollary 2, (33)–(35)"
deps = ["theorem_2"]
