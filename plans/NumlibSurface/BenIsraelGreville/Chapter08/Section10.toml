[[node]]
id = "imageDensity_graph_restricted"
kind = "theorem"
desc = "Extend the single-graph change of variables and Theorem 14 to a coordinate inverse defined only on attainable levels, with the fiber integration domains restricted accordingly. The global graph chart and the two restricted sphere branches are proved."
source = "Ben-Israel and Greville, Chapter 8, §10, Equations (178)–(185), chart restricted to attainable levels"
deps = ["imageDensity_graph", "theorem_14"]

[[node]]
id = "sphereLIntegral_eq_hemispheres"
kind = "theorem"
desc = '''For every positive radius and nonnegative measurable integrand, identify the angular sphere integral with the sum of the two hemisphere surface integrals at that radius. The two law-density statements and their almost-everywhere equality for probability densities are proved.'''
source = "Ben-Israel and Greville, Chapter 8, §10, Corollary 5, Equation (195), pointwise chart evaluation of the spherical integral"
deps = ["sphereLIntegral", "hemisphereLIntegral", "normSqImageDensity_ae_eq_hemisphereDensity"]

[[node]]
id = "exercise_8_45"
kind = "theorem"
desc = '''For λ>0 and n>0, show the mean of n independent rate-λ exponential variables has density (λn)^n y^(n−1) exp(−λny)/(n−1)! on the nonnegative ray. Identify the positive hyperplane slice as the simplex face in Equation (198) and compute its area factor.'''
source = "Ben-Israel and Greville, Chapter 8, §10, Exercise 45, Equation (198), mean of independent exponential variables"
deps = ["corollary_4"]

[[node]]
id = "exercise_8_46"
kind = "theorem"
desc = '''For |ρ|<1 and (a,b)≠(0,0), use the explicit centered bivariate Gaussian density with unit variances and correlation ρ to prove that aX₁+bX₂ has zero mean and variance a²+2abρ+b² and the univariate Gaussian density in Equation (200). Specialize to sums and differences.'''
source = "Ben-Israel and Greville, Chapter 8, §10, Exercise 46, Equations (199)–(200), correlated bivariate normal"
deps = ["corollary_4_radonTransformAll"]

[[node]]
id = "exercise_8_47"
kind = "theorem"
desc = '''For independent U([0,1]) coordinates and nonzero a and b, compute the linear-image density as the four absolute-value terms in Equation (201) divided by 2ab. Derive the triangular density for a=b=1. A zero coefficient needs the corresponding one-dimensional result because the displayed quotient requires ab≠0.'''
source = "Ben-Israel and Greville, Chapter 8, §10, Exercise 47, Equation (201), linear projection of the uniform square"
deps = ["corollary_4_nonvertical"]
