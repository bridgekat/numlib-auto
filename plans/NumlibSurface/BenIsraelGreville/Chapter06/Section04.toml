[[node]]
id = "exercise_6_50"
kind = "theorem"
desc = '''A contraction is a normal partial isometry exactly when its eigenvalue moduli are zero or one and taking the square preserves its rank.'''
deps = ["exercise_6_47", "IsContraction"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 50'

[[node]]
id = "exercise_6_51"
kind = "theorem"
desc = '''A normal partial isometry is exactly a unitary conjugate of a unitary block direct summed with a zero block.'''
deps = ["exercise_6_47"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 51'

