[[node]]
id = "polar_factors_of_larger_truncation"
kind = "theorem"
desc = '''Every truncation at least the rank gives a polar decomposition by a partial isometry, and the larger truncation construction yields nonuniqueness without range matching.'''
deps = ["theorem_6_7"]
source = 'Ben-Israel and Greville, Chapter 6, equations (82)–(83)'

[[node]]
id = "polar_left_factor_pinv"
kind = "theorem"
desc = '''The pseudoinverse of the supported left polar factor conjugates the inverse leading singular diagonal by the leading left singular vectors.'''
deps = ["theorem_6_7"]
source = 'Ben-Israel and Greville, Chapter 6, equation (85)'

