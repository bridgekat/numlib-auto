[[node]]
id = "exercise_6_41"
kind = "theorem"
desc = '''A matrix is a partial isometry exactly when all its positive singular values are one. All the nonzero entries of any corresponding complex diagonal then have unit modulus.'''
deps = ["theorem_6_5"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 41'

[[node]]
id = "exercise_6_42"
kind = "theorem"
desc = '''Partial isometries carry an orthonormal basis of the initial space to an orthonormal basis of the final space, and the existence of such bases characterizes them.'''
deps = ["IsPartialIsometry"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 42'

