[[node]]
id = "normal_polar_factors_range_nonunique"
kind = "theorem"
desc = '''The range constraints alone are insufficient for uniqueness when the polar factors are normal. Produce two sets of supported normal factors for one matrix.'''
deps = ["corollary_6_2"]
source = 'Ben-Israel and Greville, Chapter 6, Corollary 2, corrected uniqueness scope'

[[node]]
id = "polar_complex_scalar"
kind = "theorem"
desc = '''A nonzero complex number is its modulus times its unit complex phase. Use the complex argument to choose the correct quadrant.'''
source = 'Ben-Israel and Greville, Chapter 6, equation (88)'

