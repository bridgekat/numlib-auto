[[node]]
id = "polar_positive_factors_nonunique_without_matching_range"
kind = "theorem"
desc = '''For a rank-deficient matrix with both matrix dimensions above the rank, fix the partial isometry at the rank and vary either positive factor on the orthogonal complement of its support by adding a rank-one positive projector. The larger-truncation factorization and nonuniqueness of the partial isometry are proved separately.'''
