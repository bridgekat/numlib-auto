id = "exercise_6_43_projector"
kind = "theorem"
desc = '''A matrix is a contraction exactly when the orthogonal projector onto every subspace containing its range dominates the final Gram matrix.'''
deps = ["IsContraction"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 43(c)'

