[[node]]
id = "exercise_6_49"
kind = "theorem"
desc = '''The two-by-two nilpotent shift is a nonnormal partial isometry with only zero eigenvalues.'''
deps = ["theorem_6_5"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 49'

[[node]]
id = "exercise_6_50"
kind = "theorem"
desc = '''A contraction is a normal partial isometry exactly when its eigenvalue moduli are zero or one and taking the square preserves its rank.'''
deps = ["exercise_6_47", "IsContraction"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 50'

[[node]]
id = "exercise_6_51"
kind = "theorem"
desc = '''A normal partial isometry is exactly a unitary conjugate of a unitary block direct summed with a zero block.'''
deps = ["exercise_6_47"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 51'

[[node]]
id = "exercise_6_52"
kind = "theorem"
desc = '''A square matrix is normal exactly when its supported polar factors commute, in which case the partial isometry is also normal.'''
deps = ["IsCanonicalPolarDecomposition"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 52'

[[node]]
id = "exercise_6_53"
source = 'Ben-Israel and Greville, Chapter 6, Exercise 53, equation (91)'

[[node]]
id = "exercise_6_54"
kind = "theorem"
desc = '''Positive singular values are exactly the generalized eigenvalues of the two supported polar equations with nonzero vectors in the initial or final space.'''
deps = ["IsCanonicalPolarDecomposition.gram_and_recover"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 54, equations (92)–(93)'

[[node]]
id = "exercise_6_55"
kind = "theorem"
desc = '''Prove the nearest and farthest unitary polar-factor inequalities for unitarily invariant norms and their appropriate rectangular analogues.'''
deps = ["theorem_6_7"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 55'

[[node]]
id = "exercise_6_56"
kind = "theorem"
desc = '''The generalized Cayley transforms are inverse bijections between supported Hermitian matrices and normal partial isometries on the support excluding eigenvalue minus one.'''
deps = ["exercise_6_47"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 56, equations (94)–(97)'

[[node]]
id = "exercise_6_57"
kind = "theorem"
desc = '''Increasing the supporting subspace extends the partial Cayley transform, and its restriction to the original support is unchanged.'''
deps = ["exercise_6_56"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 57'

[[node]]
id = "exercise_6_58"
kind = "theorem"
desc = '''On a fixed common range, the Cayley transform is 2-Lipschitz in each unitarily invariant norm.'''
deps = ["exercise_6_56"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 58'

[[node]]
id = "exercise_6_59"
source = 'Ben-Israel and Greville, Chapter 6, Exercise 59, equations (98)–(99)'

[[node]]
id = "exercise_6_60"
kind = "theorem"
desc = '''Over maximal-rank partial isometries of the transposed dimension, the real trace of the product with a matrix attains the sum of its singular values. The maximizing product can be positive semidefinite.'''
deps = ["theorem_6_7", "exercise_6_59"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 60, equations (100)–(101)'

[[node]]
id = "exercise_6_61_upper"
source = 'Ben-Israel and Greville, Chapter 6, Exercise 61, upper bound'

[[node]]
id = "exercise_6_61"
kind = "theorem"
desc = '''The maximum of the real trace of AXBW over unitary X and W equals the sum of pairwise products of matching singular values and is attained.'''
deps = ["exercise_6_61_upper"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 61, attainment'

[[node]]
id = "exercise_6_62"
kind = "theorem"
desc = '''Symmetric gauge functions and unitarily invariant matrix norms correspond through the singular-value vector, including the dual norm and the triangle inequality.'''
source = 'Ben-Israel and Greville, Chapter 6, Exercise 62, equations (102)–(103)'

[[node]]
id = "exercise_6_63"
kind = "theorem"
desc = '''For every symmetric gauge function, its values on the ordered singular-value vectors satisfy a triangle inequality under matrix addition.'''
deps = ["exercise_6_62"]
source = 'Ben-Israel and Greville, Chapter 6, Exercise 63, equation (104)'
