id = "exercise_17"
kind = "theorem"
desc = '''Simultaneous complex unitary diagonalization of a pair of rectangular matrices is equivalent to the two polynomial relations between their cross products.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 17"

