[[node]]
id = "exercise_19"
kind = "theorem"
desc = '''For a normal matrix the complex diagonal entries can be chosen to be the sorted eigenvalues. The two singular-vector families can then be chosen to coincide.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 19, Equations (38)–(40)"
deps = ["BenIsraelGreville.Chapter06.exercise_6", "phaseSingularVectorPair"]

[[node]]
id = "exercise_20"
kind = "theorem"
desc = '''For a normal matrix the UDV decomposition with the eigenvalues on the diagonal is unitary similarity.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 20"
deps = ["exercise_19"]

[[node]]
id = "exercise_21_real"
source = "Ben-Israel and Greville, Chapter 6, Exercise 21, Equation (41), real case"

[[node]]
id = "exercise_21_complex"
kind = "theorem"
desc = '''Extend the volume defined by squared moduli of maximal minors to complex matrices, and prove the product formula and the stated root-volume interpretation.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 21, Equation (41)"

[[node]]
id = "exercise_22"
kind = "theorem"
desc = '''The singular values of the k-th compound are the k-fold products of the singular values of A. The top compound has rank one with its singular value equal to the volume.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 22"
deps = ["exercise_21_real"]

[[node]]
id = "exercise_23"
kind = "theorem"
desc = '''The top compound acts on the Plücker representatives of the paired singular bases by the volume, and the top compound of the Moore–Penrose inverse acts by its reciprocal.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 23, Equation (42)"
deps = ["exercise_22"]

[[node]]
id = "exercise_24"
kind = "theorem"
desc = '''Each of the leading rank-many singular values of an inner inverse is at least the corresponding singular value of A†. The same gives the lower bounds on k-volume.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 24, Equations (43)–(45)"
deps = ["exercise_14"]

[[node]]
id = "exercise_25"
kind = "theorem"
desc = '''The Moore–Penrose inverse uniquely minimizes each k-volume for positive k at most the rank of A among all real inner inverses.'''
source = "Ben-Israel and Greville, Chapter 6, Exercise 25"
deps = ["exercise_24"]

