[[node]]
id = "theorem_6_4_unique_iff_gap"
kind = "theorem"
desc = '''For a full-column-rank augmented matrix with an admissible least-stretch vector, the optimal perturbation is unique exactly when the least singular value is simple.'''
deps = ["theorem_6_4", "bestRankApproximation_unique_iff_gap"]
source = 'Ben-Israel and Greville, Chapter 6, Theorem 4, uniqueness'

[[node]]
id = "tls_nonzeroLastIndices_nonempty"
kind = "theorem"
desc = '''At least one vector in a full orthonormal right singular basis has a nonzero last component.'''
source = 'Ben-Israel and Greville, Chapter 6, equation (62)'

[[node]]
id = "tlsAugmentedError_svd_coordinates"
kind = "theorem"
desc = '''In singular-vector coordinates, the restricted perturbation formula gives a weighted sum of squared entries and the kernel equation becomes a fixed-point equation in the rescaled coordinates.'''
source = 'Ben-Israel and Greville, Chapter 6, equations (63)–(66)'

