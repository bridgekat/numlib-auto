[[node]]
id = "rectangular_contour_calculus_general_jordan_domains"
kind = "theorem"
desc = '''Relate the customary positive orientation and geometric enclosure of rectifiable Jordan contours to their winding numbers. The homological versions already handle arbitrary open holomorphy domains, while the inverse and iterated-integral formulas require winding zero at the origin. Continuous rectifiable curves admit increasing Lipschitz reparametrizations.'''
deps = ["lemma_6_5_path_grouped", "lemma_6_5_homological", "rectangularContourFamilyCalculus_inv", "corollary_6_4_homological", "lemma_6_7_homological", "theorem_6_20"]
source = 'Ben-Israel and Greville, Chapter 6, Lemmas 5 and 7, Corollary 4, Theorem 20, rectifiable Jordan contours'

