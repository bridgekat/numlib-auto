namespace = 'BenIsraelGreville.Chapter01'
desc = "The Gram matrices and Urquhart's constructions."

[[node]]
id = 'lemma_4'
kind = 'theorem'
desc = '''A, A*A and AA* all have the same rank.'''
source = 'Ben-Israel–Greville, Chapter 1, Lemma 4'

[[node]]
id = 'corollary_2'
kind = 'theorem'
desc = '''The range of AA* equals the range of A and the null space of AA* equals that of A*.'''
source = 'Ben-Israel–Greville, Chapter 1, Corollary 2'

[[node]]
id = 'theorem_3_a'
kind = 'theorem'
desc = '''Multiplying any {1}-inverse of A*A on the right by A* gives a {1,2,3}-inverse.'''
source = 'Ben-Israel–Greville, Chapter 1, Theorem 3, equation (12a)'

[[node]]
id = 'theorem_3_b'
kind = 'theorem'
desc = '''Multiplying any {1}-inverse of AA* on the left by A* gives a {1,2,4}-inverse.'''
source = 'Ben-Israel–Greville, Chapter 1, Theorem 3, equation (12b)'

[[node]]
id = 'theorem_4'
kind = 'theorem'
desc = '''For Z in A{1,4} and Y in A{1,3}, ZAY is the Moore–Penrose inverse.'''
source = 'Ben-Israel–Greville, Chapter 1, Theorem 4'

[[node]]
id = 'penroseInverses_nonempty'
kind = 'theorem'
desc = '''Every class of inverses defined by a subset of the Penrose equations is nonempty.'''
source = 'Ben-Israel–Greville, Chapter 1, §5'
