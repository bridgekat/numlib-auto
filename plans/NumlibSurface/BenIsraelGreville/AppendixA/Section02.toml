namespace = "BenIsraelGreville.AppendixA"

desc = '''Moore’s 1920 general reciprocal. Use the range and kernel characterization of the Moore–Penrose inverse, and share the maximal-minor expression with Chapter 3.'''

[[node]]
id = "IsMooreReciprocal"
kind = "definition"
desc = '''A general reciprocal X satisfies range X ⊆ range Aᴴ, range Xᴴ ⊆ range A, and AXA=A.'''
source = "Ben-Israel and Greville, Appendix A, §2, conditions (1)–(3), historical definition"

[[node]]
id = "existsUnique_mooreReciprocal"
kind = "theorem"
desc = '''Each complex matrix has a unique Moore reciprocal, equal to the Moore–Penrose inverse. The relation is mutual and both oppositely oriented range inclusions are equalities.'''
source = "Ben-Israel and Greville, Appendix A, §2, conditions (1)–(6)"
deps = ["IsMooreReciprocal"]

[[node]]
id = "mooreReciprocal_eq_minorSums"
kind = "theorem"
desc = '''For rank r>0, the (j,i) entry of the reciprocal is the sum of conjugate maximal minors with i,j prepended times the corresponding complementary minors, divided by the sum of squared absolute maximal minors. For r=1 the result is conj Aᵢⱼ over the squared Frobenius norm; for rank zero the reciprocal is zero.'''
source = "Ben-Israel and Greville, Appendix A, §2, rank cases following (6)"
deps = ["existsUnique_mooreReciprocal"]

[[node]]
id = "mooreReciprocal_range_equiv"
kind = "theorem"
desc = '''A and its reciprocal give mutually inverse linear isomorphisms between range Aᴴ and range A, with a dual right-action version for conjugate row vectors.'''
source = "Ben-Israel and Greville, Appendix A, §2, linear correspondences following the minor formula"
deps = ["existsUnique_mooreReciprocal"]
