[[node]]
id = "exercise_9_27"
kind = "theorem"
desc = '''Define the closed densely defined gradient H¹₀([0,π]²) → L²([0,π]²)², identify its adjoint with negative weak divergence on the maximal L² divergence domain, and identify the first Gram operator with the negative Dirichlet Laplacian. Construct the double sine-series kernel and establish its derivative representation for the Moore–Penrose inverse of the gradient. Smooth vector fields lie in the adjoint domain; the printed C¹ domain is generally a proper subspace of the Hilbert adjoint domain.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 27(a)–(e), Dirichlet gradient on the square"

[[node]]
id = "exercise_9_28"
kind = "theorem"
desc = '''Construct the closed densely defined scalar expression (49) on the order-n Sobolev space with homogeneous boundary matrix constraint (50). Under the stated continuous coefficient regularity and nowhere-zero leading coefficient, prove nullity n for the unrestricted differential expression and for the maximal realization of its formal differential adjoint. Obtain the corresponding constrained nullity bounds and closed range. Apply the carrier and normally solvable inverse results to obtain (e)–(g) for this concrete operator, including the bounded inverse on the range.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 28(a)–(g), ordinary scalar boundary problem"
deps = ["scalarDifferentialExpression", "scalarBoundaryValues"]

[[node]]
id = "exercise_9_29"
kind = "theorem"
desc = '''With a fundamental basis extending an orthonormal basis of the constrained null space, prove the causal Wronskian kernel (51) gives a particular solution of the unrestricted scalar equation. For forcing in range, prove that the coefficient correction (55), followed by projection off the constrained null space and extension by zero on the orthogonal complement of the range, yields the L² kernel of the maximal inverse.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 29, (51)–(55), Wronskian Green kernel"
deps = ["exercise_9_28", "boundaryCorrection_of_innerInverse", "maximalInverse_eq_project_greenKernel"]

[[node]]
id = "exercise_9_30_operator"
kind = "theorem"
desc = '''For continuous A₀, continuously differentiable pointwise invertible A₁, and a rank-m boundary matrix, prove closedness and density of the first-order realization, construct its adjoint, and derive the nullity bounds, index relation k + m = k* + n and closed primal and dual ranges. The adjoint expression is (57). The endpoint pairing uses A₁(t)*y(t) at t = a,b. In the matrix form use a full column basis of ker M as the test matrix.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 30(a)–(e), (57)–(58), vector boundary problem"
deps = ["matrixDifferentialExpression", "vectorBoundaryValues"]

[[node]]
id = "exercise_9_30_green"
kind = "theorem"
desc = '''For a fundamental matrix X, verify the sign kernel (59) with the factor A₁(t)⁻¹ on the right. Verify the kernel resulting from its boundary correction −X(s)(M X̂)⁽¹⁾ M applied to the actual two endpoint kernel values. With endpoint order (a,b) this amounts to adding (M X̂)⁽¹⁾ M diag(I,−I) X̂ inside the bracket in (60). The printed kernels omit the leading coefficient factor and (60) uses the opposite sign for this endpoint ordering.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 30(f)–(g), (59)–(60), vector fundamental matrix"
deps = ["exercise_9_30_operator", "boundaryCorrection_of_innerInverse"]

[[node]]
id = "exercise_9_32"
kind = "theorem"
desc = '''Under a common essentially bounded measurable kernel class, prove the almost-everywhere parametrization H−G = X₀(s)A(t)* + B(s)Y₀(t)* using bases of the primal and adjoint null spaces. The unrestricted L² notion of generalized Green kernel only controls forcing in range and therefore does not force the free coefficients to be essentially bounded.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 32, (61), class of generalized Green matrices"
deps = ["exercise_9_30_operator", "IsGeneralizedGreenKernel"]

[[node]]
id = "exercise_9_33"
kind = "theorem"
desc = '''For essentially bounded Θ and Ψ with invertible biorthogonality matrices ∫Θ*X₀ and ∫Y₀*Ψ, prove existence and uniqueness up to a.e. equality of the normalized kernel satisfying both integral null constraints. Establish the resulting operator's kernel span Ψ and exact range D(L) ∩ (span Θ)⊥; the ambient orthogonal complement is its closure when the differential domain is dense.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 33, (62), biorthogonal normalization"
deps = ["exercise_9_32"]

