[[node]]
id = "exercise_9_36"
kind = "theorem"
desc = '''For Lx=x′−Bx with x(0)=x(1)=0, prove the free-endpoint adjoint, its homogeneous basis X⁻*, the Gram projection kernel with middle factor (∫X⁻¹X⁻*)⁻¹, and the projected Green formula. A positive fundamental kernel is causal (t<s), or a negative kernel is anticausal (s<t); the positive anticausal kernel printed in (69) differentiates to minus the forcing.'''
source = "Ben-Israel and Greville, Ch. 9, §5, Exercise 36, (68)–(69), endpoint-zero first-order system"
deps = ["exercise_9_30_operator", "exercise_9_35_kernel_expansion"]

