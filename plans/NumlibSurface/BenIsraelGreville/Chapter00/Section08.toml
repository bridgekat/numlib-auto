namespace = "BenIsraelGreville.Chapter00"
desc = '''Use units in the integral matrix ring to encode unimodular equivalence. Adapt the Mathlib Smith normal form for the image submodule, choose a basis of the kernel and lift the image basis to recover both matrix factors.'''

[[node]]
id = "isIntegralUnit_iff"
kind = "theorem"
desc = '''A square integral matrix is an integral unit precisely when it has a two-sided matrix inverse with integral entries.'''
source = "Ben-Israel and Greville, Chapter 0 §8"

[[node]]
id = "equivalentOverIntegers"
kind = "definition"
desc = '''Two integer matrices of the same size are equivalent over ℤ if PAQ=S for integer matrix units P and Q.'''
source = "Ben-Israel and Greville, Chapter 0 §8, Equation (132)"

[[node]]
id = "IsSmithNormalForm"
kind = "definition"
desc = '''A Smith normal form is a rectangular diagonal matrix with nonzero entries in the first r diagonal positions, each dividing the next. Its nonzero diagonal entries are the invariant factors.'''
source = "Ben-Israel and Greville, Chapter 0 §8 after Theorem 4"

[[node]]
id = "theorem_4"
kind = "theorem"
desc = '''Every integer matrix of rank r is equivalent over ℤ to a Smith normal form with exactly r nonzero diagonal entries.'''
source = "Ben-Israel and Greville, Chapter 0 §8, Theorem 4"
deps = ["equivalentOverIntegers", "IsSmithNormalForm"]
