[[node]]
id = "smithNormalForm_algorithm"
kind = "theorem"
desc = '''Describe a terminating elementary-operation reduction to Smith form. Replace a pivot by a smaller nonzero remainder until it divides the relevant entries, clear its row and column, and recurse on the trailing submatrix.'''
source = "Ben-Israel and Greville, Chapter 0 §8, Ex. 84"
deps = ["exists_smithPivot_gcd", "IntegralElementaryStep"]
