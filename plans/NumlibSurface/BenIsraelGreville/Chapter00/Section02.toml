[[node]]
id = "inf_orthogonal_ne_bot_of_finrank_lt"
kind = "theorem"
desc = '''If the dimension of L strictly exceeds that of M, then L intersects the orthogonal complement of M nontrivially.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 12"

[[node]]
id = "exists_thin_qr_factorization_of_gramSchmidt"
kind = "theorem"
desc = '''The Gram–Schmidt basis that retains the nonzero residuals gives a thin QR factorization with full-row-rank upper trapezoidal R. Complete the orthonormal basis with vectors spanning the adjoint kernel.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 13, Equation (39)"

[[node]]
id = "exists_qr_factorization"
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 13, Equation (40)"

[[node]]
id = "range_ker_submodule"
kind = "theorem"
desc = '''The range and null space of a linear transformation are vector subspaces. Record how the bundled objects realize the unbundled sets.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 14"

[[node]]
id = "polynomialDegreeSpace_basis"
kind = "theorem"
desc = '''The space of real polynomials of degree at most n has basis 1, X, …, X^n and dimension n+1.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 15(a)–(b), Equation (41)"

[[node]]
id = "polynomialDerivative_toMatrix"
kind = "theorem"
desc = '''The derivative maps degree at most n+1 onto degree at most n, has kernel the constant polynomials, and has superdiagonal 1,…,n+1 in monomial bases.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 15(b)"

[[node]]
id = "polynomialIntegral_toMatrix"
kind = "theorem"
desc = '''Integration with zero constant maps degree at most n injectively to degree at most n+1 with image the polynomials with zero constant. Its subdiagonal coefficients are the reciprocals of 1,…,n+1.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 15(c)"

[[node]]
id = "polynomialDerivative_integral_compositions"
kind = "theorem"
desc = '''In monomial coordinates the derivative after integration is the identity, and integration after the derivative removes the constant coefficient.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 15(d)"

[[node]]
id = "toMatrix_orthonormalBasis_apply"
kind = "theorem"
desc = '''A matrix entry in orthonormal coordinates is the inner product of the corresponding output basis vector and transformed input basis vector.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 16(a)"

[[node]]
id = "adjoint_toMatrix_orthonormalBasis"
kind = "theorem"
desc = '''The adjoint in reversed orthonormal bases is represented by the conjugate transpose.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 16(b)"

[[node]]
id = "exists_orthonormalBasis_toMatrix_rectDiagonal"
kind = "theorem"
desc = '''A linear map has orthonormal bases in which its matrix is rectangular real diagonal with the positive singular values followed by zeros. The printed matrix shape reverses rows and columns.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 17, Equation (42)"

[[node]]
id = "existsUnique_changeOfBasis"
kind = "theorem"
desc = '''There is a unique invertible coordinate matrix expressing one basis in another, and its inverse expresses the reverse change.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 18, Equations (43)–(45)"

[[node]]
id = "isSimilar_iff_toMatrix"
kind = "theorem"
desc = '''Two complex matrices are similar precisely when they represent the same endomorphism in suitable bases. Unitary similarity is the specialization to a unitary change matrix.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 19, Equation (46)"

[[node]]
id = "exists_unitary_upperTriangular"
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 20"

[[node]]
id = "exists_similar_upperTriangular_sum_norm_offDiag_le"
kind = "theorem"
desc = '''By scaling a triangular Schur form diagonally, make the sum of absolute off-diagonal entries arbitrarily small.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 21"

[[node]]
id = "isStarNormal_iff_unitary_diagonal"
kind = "theorem"
desc = '''A complex matrix is normal precisely when it is unitarily similar to a diagonal matrix. Reuse Chapter 2 §7 for the forward direction.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 22(a)"

[[node]]
id = "isHermitian_iff_unitary_real_diagonal"
kind = "theorem"
desc = '''A complex matrix is Hermitian precisely when it is unitarily similar to a real diagonal matrix.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 22(b)"

[[node]]
id = "exists_not_realTriangularizable"
kind = "theorem"
desc = '''For every size at least two a real matrix with a planar rotation block is not similar over ℝ to a triangular matrix.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 23"

[[node]]
id = "toMatrix_changeOfBases"
kind = "theorem"
desc = '''Input and output changes of bases give the representing matrix S⁻¹AT.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 24, Equation (48)"

[[node]]
id = "equivalentMatrices_iff_toMatrix"
kind = "theorem"
desc = '''Two rectangular matrices are equivalent precisely when they represent the same linear map in suitable pairs of bases. The unitary specialization describes equivalence in orthonormal bases.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 25, Equation (49)"

[[node]]
id = "toMatrix_comp"
kind = "theorem"
desc = '''Composition of linear maps gives multiplication of matrices in matching bases.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 26"

[[node]]
id = "toMatrix_id"
kind = "theorem"
desc = '''The identity transformation in the same input and output basis is represented by the identity matrix.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 27"

[[node]]
id = "toMatrix_inverse"
kind = "theorem"
desc = '''The matrix of a linear equivalence in two bases is inverse to the matrix of its inverse map with those bases swapped.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 28"

[[node]]
id = "rotation_geometricMultiplicity"
kind = "theorem"
desc = '''The displayed 2 by 2 rotation has eigenvalue i and a one-dimensional eigenspace over ℂ, spanned by (1,i). It has no nonzero real eigenvector. Correct the printed multiplicity.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 29"

[[node]]
id = "intrinsic_matrixProperties"
kind = "theorem"
desc = '''Prove invariance of eigenvalues, geometric multiplicities, and rank under the appropriate basis changes. Relate transported eigenspaces and kernels and give a basis change that alters the sum of squared absolute entries.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 30"

[[node]]
id = "polynomial_partialSum_basis"
kind = "theorem"
desc = '''Build the partial sums of monomials as a basis by a triangular change of coordinates and apply the change-of-basis formula to differentiation and integration. Include the constant polynomial as the first partial sum.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 31"

[[node]]
id = "projection_isLinear"
kind = "theorem"
desc = '''Projection to a subspace along a complementary subspace is linear, with the decomposition obtained from the direct sum.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 32"

[[node]]
id = "projection_idempotent"
kind = "theorem"
desc = '''Projection to a subspace fixes every vector in that subspace and is idempotent.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 33"

[[node]]
id = "frobenius_norm_eq_sqrt_trace"
kind = "theorem"
desc = '''The Frobenius norm is the square root of trace AᴴA and is submultiplicative.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 34, Equation (50)"

[[node]]
id = "entryMaxNorm"
kind = "definition"
desc = '''The largest absolute entry defines a matrix norm and fails submultiplicativity in general.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 34, Equation (51)"

[[node]]
id = "inducedMatrixNorm"
kind = "definition"
desc = '''For an arbitrary vector norm the supremum of the norm ratio defines a submultiplicative matrix norm and is the least consistent norm.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 35, Equations (53)–(54)"

[[node]]
id = "inducedMatrixNorm_eq_max"
kind = "theorem"
desc = '''The unit ball and unit sphere yield the same attained maximum of the image norm. Omit the printed denominator on the unit ball, where the printed quotient is undefined at zero.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 36, Equation (55)"

[[node]]
id = "exists_consistentVectorNorm"
kind = "theorem"
desc = '''A submultiplicative matrix norm admits a consistent vector norm by applying it to matrices with one fixed nonzero column.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 37"

[[node]]
id = "inducedLpMatrixNorm"
kind = "theorem"
desc = '''The induced p-norm is the maximal image norm on the p-unit sphere. Specialize at 1, ∞, and 2 to largest column sum, largest row sum, and largest singular value.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 38, Equations (56)–(56.2)"

[[node]]
id = "consistentMatrixNorm_one"
kind = "theorem"
desc = '''Any consistent matrix norm assigns the identity at least one, and an induced norm gives exactly one in positive dimension.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 39, Equation (57)"

[[node]]
id = "frobenius_opNorm_unitarilyInvariant"
kind = "theorem"
desc = '''The Frobenius norm and the operator 2-norm are unitarily invariant.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 40"

[[node]]
id = "spectralRadius_eq_max"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (58)"

[[node]]
id = "spectralRadius_le_matrixNorm"
kind = "theorem"
desc = '''Every submultiplicative matrix norm bounds the spectral radius.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (59)"

[[node]]
id = "exists_matrixNorm_le_spectralRadius_add"
kind = "theorem"
desc = '''Conjugating by the diagonal rescaling in the approximate triangular diagonalization yields a submultiplicative matrix norm arbitrarily close to the spectral radius.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 42"

[[node]]
id = "spectralRadius_pow"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (60)"

[[node]]
id = "opNorm_eq_sqrt_gram_spectralRadius"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (61)"

[[node]]
id = "opNorm_eq_spectralRadius_of_isHermitian"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (62)"

[[node]]
id = "summable_pow_iff_isConvergent"
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 46, Equation (65)"

[[node]]
id = "hasSum_pow_inv_one_sub"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (65)"

[[node]]
id = "hasSum_alternating_pow_inv_one_add"
source = "Ben-Israel and Greville, Chapter 0 §2, Equation (66)"

[[node]]
id = "isConvergent_iff_exists_stein_posDef"
kind = "theorem"
desc = '''The powers of A tend to zero precisely when there is a positive definite H for which H-AᴴHA is positive definite. Construct H by the convergent sum of adjoint powers times powers.'''
source = "Ben-Israel and Greville, Chapter 0 §2, Ex. 48"
