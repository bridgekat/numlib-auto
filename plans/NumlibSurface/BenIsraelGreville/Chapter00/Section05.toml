[[node]]
id = "rankFactorization_fullRankIndices"
kind = "theorem"
desc = '''Under a full-rank factorization, the full-rank row selections are those of the first factor and the full-rank column selections are those of the second factor. Use rank-preserving multiplication by the full-rank factors.'''
source = "Ben-Israel and Greville, Chapter 0 §5, Ex. 64(a)–(b)"
deps = ["fullRankRowIndices", "fullRankColumnIndices", "IsRankFactorization"]

