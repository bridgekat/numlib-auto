[[node]]
id = "matrixVolume_sq_eq_sum_row_column_volumes"
kind = "theorem"
desc = '''In positive rank the squared volume is both the sum of squared volumes of its full-rank row selections and the sum of squared volumes of its full-rank column selections.'''
source = "Ben-Israel and Greville, Chapter 0 §5, Equations (106a)–(106b)"
deps = ["matrixVolume", "nonsingularMinorIndices_eq"]

[[node]]
id = "matrixVolume_fromCols_le"
kind = "theorem"
desc = '''If the two column blocks have positive ranks adding to the total rank, the volume is bounded by the product of their volumes, with equality precisely for orthogonal column ranges. The rank-zero convention in (89) requires the positive block ranks.'''
source = "Ben-Israel and Greville, Chapter 0 §5, Ex. 67, Equation (107)"
deps = ["matrixVolume", "det_norm_le_prod_col_norm"]
