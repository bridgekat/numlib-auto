[[node]]
id = 'theorem_15'
kind = 'theorem'
desc = '''A square complex matrix is normal iff it is a weighted sum of pairwise annihilating orthogonal projectors summing to I with weights its distinct eigenvalues. The projectors are the orthogonal eigenspace projections.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 15'
deps = ['lemma_3']

