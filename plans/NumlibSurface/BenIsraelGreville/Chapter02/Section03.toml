namespace = 'BenIsraelGreville.Chapter02'
desc = 'Outer inverses of fixed rank.'

[[node]]
id = 'outerInversesOfRank'
kind = 'definition'
desc = '''The matrices satisfying the selected Penrose equations and having rank s.'''
source = 'Ben-Israel and Greville, Ch. 2, §3, rank-bounded notation'

[[node]]
id = 'theorem_5'
kind = 'theorem'
desc = '''For 0<s≤rank A, X has rank s and is an outer inverse iff X=YZ for factors with intermediate dimension s and ZAY=I.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 5'

[[node]]
id = 'corollary_5'
kind = 'theorem'
desc = '''X is a reflexive inverse iff X=YZ with intermediate dimension rank A and ZAY=I.'''
source = 'Ben-Israel and Greville, Ch. 2, Corollary 5'
deps = ['theorem_5']

[[node]]
id = 'theorem_6'
kind = 'theorem'
desc = '''For 0<s≤rank A, X lies in A{2,3} and has rank s iff it is Y(AY)† for some Y such that AY has full column rank s.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 6'

[[node]]
id = 'theorem_7'
kind = 'theorem'
desc = '''For 0<s≤rank A, X lies in A{2,4} and has rank s iff it is (YA)†Y for some Y such that YA has full row rank s.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 7'
deps = ['theorem_6']
