[[node]]
id = "exercise_105"
kind = "theorem"
desc = "For an interval program with integral data and bounds on Ax, use the Smith inverse criterion to select attainable integer points of the bounded image box, optimize the induced objective over those points when bounded, and lift all optimal images to all integer solutions. The source omits A from the displayed constraint despite listing it among the input data."
source = "Ben-Israel and Greville, Ch. 2, §12, Exercise 105"
deps = ["corollary_15", "corollary_15_solutions"]

[[node]]
id = "exercise_106"
kind = "theorem"
desc = "Establish the analogue of Corollaries 13 and 15 over the real and complex polynomial rings, with the reflexive inverse over the appropriate rational function field and both products over the polynomial ring. Use the Smith form over a polynomial principal ideal domain and exhibit the same affine family."
source = "Ben-Israel and Greville, Ch. 2, §12, Exercise 106"
deps = ["corollary_13", "corollary_15"]
