[[node]]
id = "exercise_81"
kind = "theorem"
desc = "For the exact complex matrix of (0.80), verify the printed matrices F and K as null-space bases, compute the zero-parameter reflexive inverse of Exercise 1.6, and specialize the redundant and nonredundant inner-inverse formulas to the matrix."
source = "Ben-Israel and Greville, Ch. 2, §8, Exercise 81"
deps = ["innerInverse_parameters"]

[[node]]
id = "exercise_84"
kind = "theorem"
desc = "Use the prescribed-projector coordinate formula and a coordinate matrix of each integer rank from zero through min(m−r,n−r) to obtain all ranks from r through min(m,n). The rank identity for an arbitrary prescribed perturbation is proved."
source = "Ben-Israel and Greville, Ch. 2, §8, Exercise 84"
deps = ["exercise_83", "exercise_82_rank"]

[[node]]
id = "exercise_85"
kind = "theorem"
desc = "For an arbitrary full-rank factorization A=ST and the indicated inner inverses Y₀,Z₀, give the six exact displayed affine families including both products AA{1}, A{1}A, and prove uniqueness of every displayed parameter matrix."
source = "Ben-Israel and Greville, Ch. 2, §8, Exercise 85"
deps = ["innerInverse_parameters", "reflexiveInverse_parameters"]

[[node]]
id = "exercise_86"
kind = "theorem"
desc = "Specialize all six families of Exercise 85 to the matrix of (0.80) using the factorization of (0.85) and the exact stated Z₀."
source = "Ben-Israel and Greville, Ch. 2, §8, Exercise 86"
deps = ["exercise_81", "exercise_85"]
