namespace = 'BenIsraelGreville.Chapter02'
desc = 'Nonredundant parameterizations.'

[[node]]
id = 'innerInverse_parameters'
kind = 'theorem'
desc = '''Using F spanning ker A, K* spanning ker A*, and B spanning range UA for an inner inverse U, every inner inverse has a unique representation U+FY+BZK. There are mn−r² free scalars.'''
source = 'Ben-Israel and Greville, Ch. 2, §8, (105)–(109)'

[[node]]
id = 'hermitianInnerInverse_parameters'
kind = 'theorem'
desc = '''For the {1,3} class vary FY over the right null space and for the {1,4} class vary ZK over the left null space, with unique coordinates for fixed bases.'''
source = 'Ben-Israel and Greville, Ch. 2, §8, (110)–(111)'

[[node]]
id = 'reflexiveInverse_parameters'
kind = 'theorem'
desc = '''Parameterize reflexive inverses by complementary range and kernel using fixed bases and the prescribed projector construction, with r(m+n−2r) free scalars.'''
source = 'Ben-Israel and Greville, Ch. 2, §8, (112)–(115)'
