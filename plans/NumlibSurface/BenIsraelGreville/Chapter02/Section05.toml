[[node]]
id = 'theorem_11_rectifiable'
kind = 'theorem'
desc = '''Identify the customary orientation of a finite rectifiable Jordan boundary with the index-based enclosure: prove winding one in the enclosed domain, taking account of the orientations of hole boundaries. The winding index is integer valued, constant on complement components, zero on the unbounded component, and independent of the Lipschitz representative. The rectifiable index-based formula already handles arbitrary open holomorphy domains.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 11, equation (53), general rectifiable boundary'
deps = ['theorem_11_rectifiable_of_index_enclosure']

