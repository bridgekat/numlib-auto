[[node]]
id = 'theorem_11_rectifiable'
kind = 'theorem'
desc = '''Represent and integrate along a finite boundary of oriented closed rectifiable Jordan curves of an open spectral neighborhood U. Assume f is analytic on a domain containing the closure of U and prove the normalized resolvent integral equals matrixFunction. The path theorem accepts Lipschitz parametrizations, available for rectifiable paths, and assumes an open convex set of holomorphy for each loop. The geometric winding theorem for arbitrary oriented Jordan boundaries and the Cauchy theorem on nonconvex domains remain to be connected.'''
source = 'Ben-Israel and Greville, Ch. 2, Theorem 11, equation (53), general rectifiable boundary'
deps = ['theorem_11']
