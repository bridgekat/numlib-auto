[[node]]
id = "exercise_111"
kind = "theorem"
desc = "Define the two set-inclusion and set-intersection incidence matrices for r-element and c-element subsets of an n-element set. Prove the stated alternating sum for the Moore–Penrose inverse of the inclusion matrix for 0 ≤ r ≤ c ≤ n−r."
source = "Ben-Israel and Greville, Ch. 2, §13, Exercise 111"

[[node]]
id = "exercise_112"
kind = "theorem"
desc = "Characterize the spanning tree selected by m−1 independent columns, show every remaining incidence column has its unique signed tree-path decomposition, and derive a unique fundamental cycle for each extra branch."
source = "Ben-Israel and Greville, Ch. 2, §13, Exercise 112"
deps = ["exercise_110"]

[[node]]
id = "exercise_113"
kind = "theorem"
desc = "For a connected network, express det(A P_R(Mᵀ) + P_ker M) as the sum of products of branch weights over all spanning trees divided by the number of unweighted spanning trees. The printed formula omits this normalization. At A = I the determinant is one, while the unnormalized sum counts spanning trees."
source = "Ben-Israel and Greville, Ch. 2, §13, Exercise 113"
deps = ["networkVoltageSpace_eq_orthogonal", "exercise_112"]

