[[node]]
id = "exercise_3_4_double_then_single_rounding"
kind = "theorem"
desc = "Specify the machine arithmetic and prove that double-precision Gram multiplication followed by single-precision rounding maps both diagonal entries to 1 under the stated smallness condition. The rank loss and wrong-solution consequences of the entrywise rounding hypotheses are proved."
source = "Ben-Israel and Greville, Ch. 3, §1, Exercise 4, machine sensitivity"
deps = ["exercise_3_4"]

[[node]]
id = "exercise_3_5_augmented_gauss_jordan"
kind = "theorem"
desc = "Formalize the displayed augmented matrix reduction by row operations, with a nonzero pivot condition wherever a division occurs. Equations (12)–(13) and the exact criterion for the top block to solve the reduced normal equation are proved."
source = "Ben-Israel and Greville, Ch. 3, §1, Exercise 5, augmented Gauss–Jordan calculation"
deps = ["exercise_3_5", "exercise_3_5_reduction"]

[[node]]
id = "exercise_3_6_finite_precision_refinement"
kind = "theorem"
desc = "Model the mixed-precision residual and the reuse of the elimination factors for correction solves. The next iterate is proved exact given an exact residual solve. The printed numerical stopping suggestion has no specified error model or convergence bound."
source = "Ben-Israel and Greville, Ch. 3, §1, Exercise 6, finite-precision iterative refinement"
deps = ["exercise_3_6"]
