namespace = 'BenIsraelGreville.Chapter03'
desc = 'Euclidean least squares.'

[[node]]
id = 'leastSquaresSolution'
kind = 'definition'
desc = '''A least-squares solution minimizes the Euclidean norm of Ax−b. Reuse Matrix.IsLeastSquaresSolution.'''
source = 'Ben-Israel and Greville, Ch. 3, §1, (1)–(2)'

[[node]]
id = 'theorem_1'
kind = 'theorem'
desc = '''Xb solves least squares for every b iff X is a {1,3}-inverse of A.'''
source = 'Ben-Israel and Greville, Ch. 3, Theorem 1'
deps = ['leastSquaresSolution']

[[node]]
id = 'corollary_1'
kind = 'theorem'
desc = '''A vector x solves least squares iff Ax=AXb for an arbitrary {1,3}-inverse X of A. Give the affine solution family and the normal equations.'''
source = 'Ben-Israel and Greville, Ch. 3, Corollary 1'
deps = ['theorem_1']
