namespace = 'BenIsraelGreville.Chapter03'
desc = 'Bott–Duffin variational principles.'

[[node]]
id = 'theorem_13'
kind = 'theorem'
desc = '''For Hermitian A and subspace L, the existence of the Bott–Duffin inverse is equivalent to existence for every v,w of a stationary point on L of the real quadratic with linear term Re(w*x). Its unique stationary point is A_(L)⁻¹(Av+w).'''
source = 'Ben-Israel and Greville, Ch. 3, Theorem 13'

[[node]]
id = 'corollary_8'
kind = 'theorem'
desc = '''For positive definite A the stationary point is the unique minimizer on L.'''
source = 'Ben-Israel and Greville, Ch. 3, Corollary 8'
deps = ['theorem_13']

[[node]]
id = 'corollary_9'
kind = 'theorem'
desc = '''For a direct current network, branch voltages minimize the conductance energy on the row space of the incidence, and branch currents minimize the reciprocal energy on the incidence kernel. Each vector is the negative gradient of the other objective at its minimizer.'''
source = 'Ben-Israel and Greville, Ch. 3, Corollary 9'
deps = ['corollary_8']
