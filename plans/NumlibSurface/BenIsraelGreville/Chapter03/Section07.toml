[[node]]
id = "exercise_64b"
kind = "theorem"
desc = '''Prove the equivalence of the two-sided real directional derivative of the norm at every nonzero point and uniqueness of supporting hyperplanes at each unit boundary point. The derivative claim must exclude the origin for a nontrivial norm.'''
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 64(b), Gâteaux differentiability and smoothness"
deps = ["exercise_63"]

[[node]]
id = "exercise_65"
kind = "theorem"
desc = '''Verify the given intersecting-parabola example, or a mathematically equivalent explicit convex body, for balance, rotundity and nonsmoothness, and obtain failure of strict convexity for its polar gauge.'''
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 65, an essentially strictly convex norm with non-strict dual"
deps = ["exercise_63", "exercise_64a"]

