[[node]]
id = "exercise_68_upper_sharp"
kind = "theorem"
desc = "For every positive tolerance construct an essentially strictly convex norm whose projective bound is within that tolerance of two."
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 68(b), sharpness of the upper limit"
deps = ["exercise_68"]

[[node]]
id = "exercise_69"
kind = "theorem"
desc = '''Identify contractivity of all metric projectors with Q=1 for dimensions with proper positive-dimensional subspaces. Show that ellipsoidal norms are projective, prove the classification in dimension at least three, and verify the real two-dimensional piecewise ℓᵖ/ℓᑫ counterexample.'''
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 69, classification of projective norms"
deps = ["IsProjectiveNorm", "exercise_68"]

[[node]]
id = "exercise_73"
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 73"

[[node]]
id = "exercise_74"
kind = "theorem"
desc = '''Prove that all projections are linear in the Euclidean case, and construct a nonlinear projection onto a subspace for 1<p<∞ and p≠2 in dimensions sufficient for a counterexample. In dimension two every nontrivial proper subspace is a hyperplane.'''
source = "Ben-Israel and Greville, Ch. 3, §7, Exercise 74, linearity of all ℓᵖ projectors"
deps = ["corollary_6", "theorem_11"]

