[[node]]
id = "exercise_26"
kind = "theorem"
desc = '''For positive rank, the minimum of ‖Ax‖ over unit vectors in the range of Aᴴ and the maximum of ‖A†y‖ over unit target vectors are attained and have product one.'''
source = "Ben-Israel and Greville, Chapter 5, Exercise 26, Equations (119)–(121)"
deps = ["exercise_25"]

[[node]]
id = "exercise_27"
kind = "theorem"
desc = '''For an invertible matrix [B C; D 0], the bottom right inverse block vanishes iff B has rank m + p − n. Express the other inverse blocks as the indicated generalized inverses with prescribed ranges and kernels.'''
source = "Ben-Israel and Greville, Chapter 5, Exercise 27, Equations (122)–(124)"
deps = ["BenIsraelGreville.Chapter02.theorem_12"]

