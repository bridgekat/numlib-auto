[[node]]
id = "exercise_5"
kind = "theorem"
desc = '''For a rank-adapted partition M, write F = [A₁₁; A₂₁] and G = [A₁₁ A₁₂]. Then GMᴴF is invertible and M† = Gᴴ ((GMᴴF)⁻¹)ᴴ Fᴴ.'''
source = "Ben-Israel and Greville, Chapter 5, Exercise 5"
deps = ["eq_rank_factorization_of_isUnit_block"]

