## What the round changes for the other surfaces

The backbone planned here closes, once proved, blockers 4 (Eberlein–Šmulian: chapter 3), 7
(`L^p` duality: chapter 4) and the residue of 8 (`W^{m,p}(a,b)`: chapter 8) of
`notes/frontier.md`, the `C^1`-domain route of blocker 1 (chapter 9: the extension operator,
the embeddings, Rellich–Kondrachov and Poincaré under `IsContDiffDomain 1`, reached through the
graph ⇒ chart bridge), the classical half of blocker 9 (`Heat/Classical`), and — for `p = 2` on
`C²` domains — the elliptic regularity of blocker 18. It does not touch blocker 2 (the trace and
the surface measure), Bramble–Hilbert on a simplex (Decision A of `notes/fem-roadmap.md`) or the
Lipschitz hypothesis of Atkinson–Han's §7.3. The chapter groups name the Atkinson–Han and
Quarteroni–Sacco–Saleri nodes each closes and the restatement each needs.

## Order of attack

Backbone first, in this order of return on effort (sizes are the chapter groups' estimates):
chapter 4's `Duality` and `KolmogorovRiesz` and chapter 3's `Kakutani`/`EberleinSmulian` (the
three frontier blockers, ~4 000 lines); chapter 8's `Interval/*` (~10 000, independent of the
rest); chapter 9's §9.1–9.4 modules along the critical path
`Cutoff → Chart → Friedrichs → Calculus → Reflection → Extension → Embedding → EmbeddingDomain → Compactness`
with `Poincare` first (~18 000); chapter 9's `Elliptic/*` (~11 600) and chapter 7's
`MaximalMonotone`/`HilleYosida` (~3 000) in parallel; chapter 10 (~7 000) last. Chapters 1, 2, 5,
6 and 11 (~8 000 in all) are independent of the Sobolev spine and can be interleaved. The surface
sections follow their backbone; §8.1, §4.1–4.2, §5.1–5.2 and most of §1–2 are provable today.
