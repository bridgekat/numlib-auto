desc = '''
Brezis, *Functional Analysis, Sobolev Spaces and Partial Differential Equations*, Universitext,
Springer, 2011 ([brezis2011functional]): the surface library `NumlibSurface/Brezis/`, one module
per section of the book, `ChapterNN/SectionMM.lean` in the namespace `Brezis.ChapterNN`. The
source is `references/functional-analysis-sobolev-spaces-and-partial-differential-equations-brezis/`
(a Markdown conversion; the chapter and section line numbers are in the chapter group files).
Planned 2026-09-17; nothing is formalized yet. The chapter group files beside this one carry the
chapter designs, the correspondence to the backbone, what is not planned and why, the doubts about
the book, and each chapter's order of attack; the section groups carry every node.

## Naming

A declaration is named for the result it states: `theorem_8_2` is Theorem 8.2, `proposition_9_3`,
`lemma_8_1`, `corollary_9_19`; the chapter-local Remarks and Examples carry the chapter number,
`remark_8_4`, `example_1_2`; `exercise_8_2` and `problem_10` for the exercises and problems that
are in scope. Several clauses or the two directions of an equivalence are told apart by a
trailing word (`theorem_6_6_a`, `theorem_9_16_lt`, `proposition_9_18_i_ii`), the plain id staying
on the conjunction or the main clause. The book's unnumbered "Definition." paragraphs are nodes
named by content (`sobolevSpace`, `IsMaximalMonotone`, `dualityMap`), each with an equivalence
lemma to the backbone object it stands for. Within the library the dependencies run forwards in
the chapter order: a later chapter uses the earlier restatement rather than reaching past it.

## Scope

Every Theorem, Proposition, Lemma and Corollary of the main text of chapters 1–11 is a node
(734 nodes in 67 section groups; 2 are blocked). Numbered Remarks and Examples are nodes when
they assert a precise statement. Numbered results in the Comments sections are nodes only when
provable with today's Mathlib or a bounded task (Krein–Milman 1.13, Egorov 4.29, general Young
4.33, the polarization characterization 5.12); the rest — Theorems 3.33, 4.30–4.32, 5.13–5.17,
6.12–6.13, 7.8–7.10, 9.32–9.37, 10.9–10.14 — are listed as "Not planned" in the chapter groups
with the reason, almost always "quoted without proof". **Exercises and Problems are not nodes**
(decided 2026-09-17): the few the main text cites as proof steps become helper lemmas in the Lean
files, named for what they say, and the named results among the Problems (Eberlein–Šmulian,
Clarkson's inequalities, Poincaré–Wirtinger) are backbone nodes where the plan needs them.
**Results the book states without proof are deferred** unless a planned node depends on them:
the chapter groups mark them, and a formalizer skips them.

The book is real throughout; the surface states everything over `ℝ` (§11.4 over `ℂ`), the
backbone over `RCLike 𝕜` wherever the proof allows.

