id = "theorem_14_2"
kind = "theorem"
desc = '''Saad Theorem 14.2 (§14.3.1): for the vertex-based partitioning of §14.2.3, if the initial
guess of the multiplicative Schwarz procedure (Algorithm 14.3) is consistent, that is
`x_i^(0) = B_i⁻¹ (f_i - E_i y_i^(0))` (14.22), then the `y` iterates it produces are exactly those
of a Gauss-Seidel sweep on the Schur complement system (14.12).

This is real work rather than an exclusion: it is a translation between two exactly defined
iterations, and the book's two-paragraph proof is complete — the `y` components of the initial
residuals agree, and each subdomain solve then reproduces one block Gauss-Seidel update. The cost
is the vertex-based block structure (14.8)-(14.14) as objects: `s` subdomains with an
interior/interface splitting `z_i = (x_i, y_i)`, local matrices `A_i = fromBlocks B_i E_i F_i C_i`,
off-diagonal blocks with the single nonzero corner `E_ij` (14.10), and the assembled Schur
complement system. Build it once as a structure so that §14.2.3, §14.2.4 and §14.4.3 can share it;
§14.3's `restrictSubset`, `localMatrix` and `subdomainInverse` are the edge-based analogues and do
not serve. The Gauss-Seidel side is `Stationary.gaussSeidelSplitting` in block form.'''
