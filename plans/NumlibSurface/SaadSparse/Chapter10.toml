desc = '''
Saad, Chapter 10: preconditioning techniques. Sections with theorem content — §10.2 (the
Jacobi/SOR/SSOR preconditioners as splittings), §10.3 (ILU, Thm 10.1–10.3, Prop 10.4, MILU),
§10.4 (ILUT, Thm 10.8), §10.5 (approximate inverses, Prop 10.9–10.14, Lemma 10.15) and §10.8
(preconditioners for the normal equations, Prop 10.17).

Not covered, each with its obstruction; the longer discussion is in `plans/saadsparse-ch10-14.md`
§5.

* **Theorems 10.6 and 10.7** (§10.3.3), the fill-path characterizations of fill-in and of the level
  of fill. They need a symbolic model of Gaussian elimination on a graph — the sequence of
  elimination graphs, or reachable sets through eliminated vertices — which nothing else in the
  library would use, and which Mathlib does not have; `SimpleGraph.Walk` supplies "fill-path" and
  nothing else. Saad quotes Theorem 10.6 from Rose–Tarjan without proof.
* **(10.19)–(10.20)** (§10.3.4), the ILU(0) and MILU stencil recurrences for the five-diagonal
  matrix of a centered-difference elliptic problem. Formalizable and low value: it is the explicit
  solution of the `Matrix.IsILU0` constraints for one structured family, and its only difficulty is
  index bookkeeping at the grid boundary, where `d_{i-m}` is absent.
* **§10.4.3–10.4.6** (ILUT implementation, ILUTP, ILUS, Crout ILU) and **§10.5.6–10.5.8**
  (bordering, AINV, preconditioner improvement): data structures and dropping heuristics, no claim.
* **§10.6** (reorderings): Example 10.6 and prose; (10.74)–(10.75) state an optimization problem
  and no property of its solution.
* **Theorem 10.16** (§10.7): needs the block-tridiagonal splitting as an object, the recurrence
  (10.79)–(10.80), and the "tridiagonal part of the inverse of a tridiagonal matrix" construction of
  §10.7.1. Saad writes "the following theorem can be shown" and gives no proof. The trap a
  formalizer should know about: `Ω^{(3)}` is a *truncation* of the inverse, so `Δ_{i+1}` is not a
  Schur complement and the Schur-complement lemmas do not apply directly.
* **Theorem 10.18** (§10.8.3): the incomplete Gram–Schmidt side is built
  (`SaadSparse.Chapter10.imgsL` and friends), but the incomplete Cholesky side does not exist —
  there is no `IsIC` companion to `Matrix.IsILU` — and Saad states the theorem without proof,
  citing Wang–Gallivan–Bramley.
'''
