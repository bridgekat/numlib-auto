[[node]]
id = "example_12_2"
kind = "theorem"
desc = '''Example 12.2 (§12.3.4): a test run of ILU(0)-GMRES(20) accelerated by an adaptive
least-squares polynomial preconditioner of degree at most 10 on four of the test problems of §3.7,
reported as Table 12.1 (iterations, Kflops, residual and error) together with the vertices of the
convex hulls found. Not formalized: it is an illustration — measured iteration counts and floating
point timings, with no claim to state.'''

[[node]]
id = "example_12_1"
kind = "theorem"
desc = '''
Example 12.1 (§12.3.3): a table of the least-squares residual polynomials `s_k` for `k = 1, …, 8`,
computed for the Jacobi weight with `μ = 1/2`, `ν = -1/2`, listed on `[0, 4]` so that the
coefficients are integers and rescaled by `(3 + 2k)/4`; on a general `[0, β]` the degree `k`
polynomial is `s_k(4 λ / β)`, and the scaling is irrelevant when they are used as preconditioners.
(The node `equation_12_1` of this chapter is Saad's display (12.1), a different object with a
colliding number.) Not formalized: it is an illustration — a table of eight explicit polynomials,
and the coefficients rest on the closed form (12.15)-(12.16) for the Jacobi weight, which the
chapter group's desc records as needing `Polynomial.jacobi` and its orthogonality and norm
formulas.
'''
