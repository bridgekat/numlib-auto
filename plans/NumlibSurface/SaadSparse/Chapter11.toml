namespace = "SaadSparse.Chapter11"
desc = '''
Saad, Chapter 11: parallel implementations. The chapter is excluded from the surface in full, and
this group exists so that the exclusion is on the record rather than absent; no module corresponds
to it and none is planned.

**The exclusion was re-checked section by section against the book, and it holds.** The chapter
contains **no theorem, proposition, lemma, corollary or numbered definition** — a search for any of
those words followed by an `11.n` over the whole chapter returns nothing — exactly one tagged
display, (11.1), which is `L x = b`, Algorithms 11.1-11.8, and the two numbered examples below.
Section by section: §11.1 introduction; §11.2 forms of parallelism (functional units, pipelining,
vector processors, multiprocessing); §11.3 shared- and distributed-memory architectures; §11.4
types of operations; §11.5 storage formats and the matrix-vector product in each (CSR/CSC,
diagonal, Ellpack-Itpack, jagged diagonal, distributed sparse matrices); §11.6 the standard
preconditioning operations, parallelism in forward sweeps, and level scheduling for 5-point
matrices and for irregular graphs.

The one place with mathematical substance is §11.6.3, which defines the depth of a vertex of the
dependency graph of a triangular solve by `depth(i) = 1 + max {depth(j) : l_ij ≠ 0}` and calls a
*level* the set of vertices of equal depth. The book states no property of it: not that the levels
partition the vertices, not that their number bounds the parallel depth, not that the permuted
matrix is block strictly lower triangular. There is nothing to state faithfully to the book, so
nothing is missing here; a source that does state such a property would be planned with that source.
'''

[[node]]
id = "example_11_1"
kind = "theorem"
desc = '''Example 11.1: a 5 x 5 matrix, its row permutation `PA` sorting the rows by decreasing
number of nonzeros, and the jagged diagonal data structure `DJ`, `JDIAG`, `IDIAG` that results —
two j-diagonals of length five and one of length two. Not formalized: it is an illustration of a
storage layout, and asserts nothing about the matrix.'''

[[node]]
id = "example_11_2"
kind = "theorem"
desc = '''Example 11.2: level scheduling applied to the lower triangle of a finite element matrix of
size `n = 145`, obtained by one further level of refinement of the mesh of Figure 3.1, which yields
eight levels, the last of them a single node. Not formalized: it is an illustration — a reported
level count on one mesh, with the permuted matrix shown only in Figure 11.12.'''
