namespace = "SaadSparse.Chapter10"
desc = '''
Saad §10.7, block preconditioners: the block ILU preconditioner (10.77) of a block tridiagonal
matrix, the recurrence (10.78)-(10.80) for its diagonal blocks, and the closed form (10.81) for the
tridiagonal part of the inverse of a tridiagonal matrix.

No module corresponds to this group, and none is planned. §10.7.2 is a paragraph on general
matrices with no claim, and the one numbered result of the section is the theorem below, which the
chapter group's desc records as needing the block tridiagonal splitting as an object.
'''

[[node]]
id = "theorem_10_16"
kind = "theorem"
desc = '''
Saad Theorem 10.16 (§10.7.1): let `A` be symmetric positive definite with `a_ii > 0` and
`a_ij ≤ 0` for `j ≠ i`, block tridiagonal as in (10.76), and let every diagonal block `D_i` be
strictly diagonally dominant. Then each block `Δ_i` of the recurrence (10.79)-(10.80) is a
symmetric M-matrix, and the block ILU preconditioner `M` of (10.77) is positive definite.
Not formalized: the statement needs objects the library does not have — the block tridiagonal
splitting of a matrix, the recurrence (10.79)-(10.80), and the "tridiagonal part of the inverse of
a tridiagonal matrix" construction (10.81) it runs through. Saad writes "the following theorem can
be shown" and gives no proof. Trap for a formalizer: `Ω^{(3)}` is a *truncation* of the inverse,
so `Δ_{i+1}` is not a Schur complement and the Schur complement lemmas do not apply directly.
'''
