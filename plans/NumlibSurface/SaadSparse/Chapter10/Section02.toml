desc = '''Example 10.1 (§10.2): Table 10.1, the result of running GMRES with SGS (SSOR at `ω = 1`)
preconditioning on the five test problems of §3.7, reported as iteration counts, Kflops, residual
norms and error norms. (The node `theorem_10_1` of this chapter is Saad Theorem 10.1, a different
result with a colliding number.) Not formalized: the table records the output of a floating point
computation, and the only way to state it would be to assert those measured numbers, which is not a
mathematical claim about the preconditioner.'''

