desc = '''
Saad, Chapter 1: the linear-algebra background - matrices and eigenvalues, norms, canonical forms,
normal and Hermitian matrices, nonnegative matrices and M-matrices, positive definiteness,
projectors and conditioning. It is the best-covered chapter of the book: `Basics` holds §1.1-1.6
and `Section07`-`Section13` one module per section, and of the 39 numbered results 37 have a
declaration, the remaining two being the ones the book itself states without proof.

**Nothing here is skipped for want of infrastructure outside numerical analysis.** The four gaps
below are all linear algebra, and each is unwritten rather than unreachable except where noted.

* **Theorem 1.8, the Jordan canonical form.** The one gap that is a genuine missing-theory skip.
  The *outer* decomposition - a direct sum over the distinct eigenvalues, each summand `λ_i` plus a
  nilpotent - is Mathlib's `Module.End.iSup_maxGenEigenspace_eq_top` and the independence of the
  maximal generalized eigenspaces. What is absent is the *inner* structure: a cyclic basis for a
  nilpotent endomorphism, that is the bidiagonal blocks and the count of them. That is the theory
  of finitely generated modules over `k[X]` (or the equivalent combinatorics of a nilpotent
  Jordan type), which Mathlib does not have and this project would have to build from scratch, and
  nothing in the corpus consumes it: the book derives Theorems 1.10 and 1.11 from it, and both are
  proved here from Gelfand formula instead. Trap for a future planner: do not accept a statement
  that only asserts block-diagonality by eigenvalue - that is the easy half.
* **Proposition 1.18, the convexity of the field of values (Toeplitz-Hausdorff).** The containment
  clause is `proposition_1_18`; the convexity is stated by the book without proof and is not here.
  The standard argument restricts to the two-dimensional subspace spanned by two vectors realizing
  two points of the field of values and shows that the field of values of a `2 × 2` matrix is a
  filled ellipse. Self-contained plane geometry with nothing missing from Mathlib: unwritten, not
  unreachable. There is no second consumer - `theorem_1_17`, the normal case, is proved
  unconditionally from (1.34).
* **(1.36), Berger power inequality `ν(A^k) ≤ ν(A)^k`.** Attributed by the book to the literature
  and not proved. The classical route is through a unitary dilation, which Mathlib does not have,
  but Pearcy proof is elementary - an averaging over roots of unity - and needs nothing that is
  missing. Unwritten rather than unreachable, and with no consumer in the corpus.
* **§1.8.3, the quasi-Schur (real Schur) form.** Unnumbered in the book, stated without proof and
  illustrated only by decimal matrices. `Matrix.exists_unitary_conj_upperTriangular` is the complex
  form and does not specialize: the induction has to be redone over `ℝ`, peeling off a real
  invariant subspace of dimension one or two, which exists because a complex eigenvector `u + iv`
  gives the real invariant span of `u` and `v`. Nothing is missing from Mathlib; what the statement
  costs is an encoding of "block upper triangular with `1 × 1` and `2 × 2` diagonal blocks", and
  the work is the induction. Unwritten, not unreachable.
'''
