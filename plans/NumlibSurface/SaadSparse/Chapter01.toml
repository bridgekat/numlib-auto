desc = '''
Saad, Chapter 1: the linear-algebra background - matrices and eigenvalues, norms, canonical forms,
normal and Hermitian matrices, nonnegative matrices and M-matrices, positive definiteness,
projectors and conditioning. It is the best-covered chapter of the book: `Basics` holds §1.1-1.6
and `Section07`-`Section13` one module per section, and of the 39 numbered results 37 have a
declaration, the remaining two being the ones the book itself states without proof.

**Nothing here is skipped for want of infrastructure outside numerical analysis.** The gaps
below are all linear algebra, and each is unwritten rather than unreachable except where noted.
Proposition 1.18 is now complete: its convexity clause, the Toeplitz-Hausdorff theorem, is
`proposition_1_18_convex`, specializing the backbone's `LinearMap.convex_numericalRange`. The
`2 x 2` ellipse reduction the plan used to recommend is not the cheapest route - a phase rotation
makes the quadratic form real along a segment and the intermediate value theorem finishes, with
no finite dimensionality used.

* **Theorem 1.8, the Jordan canonical form.** The one gap that is a genuine missing-theory skip.
  The *outer* decomposition - a direct sum over the distinct eigenvalues, each summand `λ_i` plus a
  nilpotent - is Mathlib's `Module.End.iSup_maxGenEigenspace_eq_top` and the independence of the
  maximal generalized eigenspaces. What is absent is the *inner* structure: a cyclic basis for a
  nilpotent endomorphism, that is the bidiagonal blocks and the count of them. That is the theory
  of finitely generated modules over `k[X]` (or the equivalent combinatorics of a nilpotent
  Jordan type), which Mathlib does not have and this project would have to build from scratch, and
  nothing in the corpus consumes it: the book derives Theorems 1.10 and 1.11 from it, and both are
  proved here from Gelfand formula instead. Trap for a future planner: do not accept a statement
  that only asserts block-diagonality by eigenvalue - that is the easy half.
* **(1.36), Berger power inequality `nu(A^k) <= nu(A)^k`** is now proved, as `equation_1_36` over
  the backbone `LinearMap.norm_inner_pow_le`. Pearcy route is the right one and it is shorter than
  the plan feared. The only construction is: for `|z| < 1` and a primitive `k`-th root of unity
  `w`, the operators `B_j = 1 - w^j z A` are strictly accretive, hence invertible, and satisfy
  `B_j D_j = 1 - z^k A^k` for the geometric sum `D_j`; the `D_j` sum to `k` because the character
  sums `sum_j w^(jm)` vanish for `0 < m < k`, so `k^-1 sum_j B_j^-1` is a left inverse of
  `1 - z^k A^k`. The one lemma that does all the work is that an invertible accretive operator has
  an accretive inverse, which is one line: with `x = B^-1 y`, the two quadratic forms are complex
  conjugates.
* **§1.8.3, the quasi-Schur (real Schur) form** is now proved, as `realSchur` over the backbone
  `Matrix.exists_orthogonal_conj_quasiUpperTriangular`. The plan's route to the invariant subspace
  - complexify and take the real span of the real and imaginary parts of a complex eigenvector -
  was not the cheapest: Cayley-Hamilton plus "an irreducible real polynomial has degree at most
  two" (`Irreducible.natDegree_le_two`, which Mathlib has) gives an irreducible `q` and a nonzero
  `w` with `q(A) w = 0` directly, and then `span {w, A w}` is invariant. No complexification is
  used. The encoding of "block upper triangular with `1 x 1` and `2 x 2` diagonal blocks" is a
  monotone `p : Fin n -> Nat` with `Matrix.BlockTriangular` and fibres of at most two elements;
  the induction appends `d` vectors at once over `Fin (m + d)` with `Fin.addCases`, and the block
  bound travels through it in the counting-free form `p i = p j -> i <= j + 1`.
'''
