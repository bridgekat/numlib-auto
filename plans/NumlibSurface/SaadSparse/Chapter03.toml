desc = '''
Saad, Chapter 3: sparse matrices.

The chapter has exactly two numbered items, Definition 3.1 and Proposition 3.2, both about
permutation matrices and both essentially already in Mathlib. Everything else with theorem content
is asserted inline or deferred to the Problems, and it is concentrated in §3.2 and §3.3: the
adjacency graph, what a symmetric permutation does to it, and the three reorderings - level sets,
independent sets, multicolouring - with the bound each one comes with. That is what `Section02` and
`Section03` cover, on top of `Numlib/LinearAlgebra/Sparse` and `Numlib/Combinatorics/SimpleGraph`.

**Not planned, with reasons.**

* §3.4, storage schemes (coordinate, compressed sparse row and column, modified sparse row,
  diagonal, Ellpack-Itpack). The section states no theorem of any kind - it is data-structure
  description with three worked examples. The only formalizable content would be a round-trip
  correctness specification, which the book never writes and nothing in the corpus needs.
* §3.5, basic sparse matrix operations. Four code fragments and commentary on parallelism; no
  statement. Correctness of a sparse matrix-vector product against `Matrix.mulVec` is a
  specification the book does not state.
* §3.6, sparse direct solution methods. Minimum degree and nested dissection are described
  algorithmically; the only quasi-theoretical claim, that minimum degree "minimizes locally an
  upper bound" on the fill-in, never writes the bound down, and this edition states **no**
  complexity or fill-in result at all - no separator theorem, no operation count. The one piece
  that is a theorem, that the intermediate level sets of a breadth-first traversal are separators,
  is §3.3.3's and is planned there.
* §3.7, test problems: descriptive.
* The Frobenius normal form of §3.3.4 - the diagonal blocks of the reduced form are the strongly
  connected components in a topological order. The book states only the shape, without the
  ordering condition and without proof; the full statement needs a strongly-connected-component and
  topological-sort API for digraphs that Mathlib does not have. The two-block characterization,
  which is what "reducible" means and what Chapter 4 uses, is planned in
  `Numlib/LinearAlgebra/Sparse/Pattern`.
* Example 3.3's fill-in claim about the arrow matrix, and Problem P-3.12 (the structural inverse of
  an irreducible matrix is dense). Both need a formal notion of *structural* fill-in or of the
  structural inverse, which the chapter never defines. The mathematical kernel of P-3.12 -
  `(1 + A) ^ (n - 1)` is entrywise positive for an irreducible nonnegative `A` - is planned, as
  `Matrix.IsIrreducible.entrywisePos_one_add_pow`.
* Bandwidth, profile, envelope and skyline. This edition defines none of them and proves no bound
  about any of them; they appear only as informal remarks in Example 3.4.
'''
