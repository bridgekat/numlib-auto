[[node]]
id = "theorem_3_4_6"
kind = "theorem"
desc = '''Construct the inverse Jacobi algorithm using positive arithmetic on weights and consecutive
gaps to compute shifted diagonal entries and squared off-diagonal entries in (9/2)n²+O(n)
operations. Recover the off-diagonal entries by taking positive square roots. Prove the
componentwise rounding and relative input sensitivity bounds.'''
source = "Liesen and Strakoš, Theorem 3.4.6"

