namespace = "Brezis.Chapter01"
desc = '''
Brezis §1.3, the bidual and the orthogonality relations, over a real normed space `E`. The
canonical injection `J : E → E**` is Mathlib's `NormedSpace.inclusionInDoubleDual ℝ E`, with
`⟨Jx, f⟩ = ⟨f, x⟩` (`NormedSpace.dual_def`) and the isometry `NormedSpace.inclusionInDoubleDualLi`;
reflexivity (`J` onto) is the backbone's `NormedSpace.IsReflexive ℝ E` and is restated in
chapter 3, not here. The orthogonals `M^⊥ ⊆ E*` and `N^⊥ ⊆ E` are the backbone's
`Submodule.strongDualAnnihilator` and `Submodule.strongDualCoannihilator`
(`Numlib/Analysis/Normed/Module/Annihilator`, planned by this chapter — note the name: the
brief's `Submodule.annihilator` is Mathlib's ideal-valued annihilator and could not be used).
Proposition 1.9 and Remark 6's reflexive clause are the backbone's
`strongDualCoannihilator_strongDualAnnihilator`, `topologicalClosure_le_strongDualAnnihilator_strongDualCoannihilator`
and `strongDualAnnihilator_strongDualCoannihilator`; Remark 6's last sentence (`(N^⊥)^⊥` is the weak-*
closure of `N`) is chapter 3's and is not a node here.
'''

[[node]]
id = "canonicalInjection_apply"
kind = "theorem"
desc = '''The canonical injection `J : E → E**` of §1.3: for `x : E` and `f : StrongDual ℝ E`,
`NormedSpace.inclusionInDoubleDual ℝ E x f = f x` — the displayed identity
`⟨J x, f⟩_{E**,E*} = ⟨f, x⟩_{E*,E}`. Mathlib's `NormedSpace.dual_def`. Records that the book's
`J` is `inclusionInDoubleDual`, a `ContinuousLinearMap`, hence linear. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.3, Notation"

[[node]]
id = "norm_canonicalInjection"
kind = "theorem"
desc = '''`J` is an isometry: `‖NormedSpace.inclusionInDoubleDual ℝ E x‖ = ‖x‖` for every `x`.
Mathlib's `NormedSpace.inclusionInDoubleDualLi` (`LinearIsometry.norm_map`); the book derives it
from Corollary 1.4, which is the same computation. Injectivity of `J` follows
(`canonicalInjection_injective`, folded into this node). ★'''
deps = ["canonicalInjection_apply"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.3, Notation"

[[node]]
id = "mem_orthogonal_iff"
kind = "theorem"
desc = '''The two orthogonals of the Notation paragraph, read off the backbone: for
`M : Submodule ℝ E`, `f ∈ M.strongDualAnnihilator ↔ ∀ x ∈ M, f x = 0` (the book's `M^⊥ ⊆ E*`),
and for `N : Submodule ℝ (StrongDual ℝ E)`, `x ∈ N.strongDualCoannihilator ↔ ∀ f ∈ N, f x = 0` (the
book's `N^⊥ ⊆ E`, "a subset of `E` rather than `E**`"). Two clauses, `Submodule.mem_strongDualAnnihilator`
and `Submodule.mem_strongDualCoannihilator`; this node fixes the chapter's reading of `⊥`. ★'''
deps = ["Submodule.mem_strongDualAnnihilator", "Submodule.mem_strongDualCoannihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.3, Notation"

[[node]]
id = "isClosed_orthogonal"
kind = "theorem"
desc = '''"It is clear that `M^⊥` (resp. `N^⊥`) is a closed linear subspace of `E*` (resp. `E`)":
`IsClosed (M.strongDualAnnihilator : Set (StrongDual ℝ E))` and
`IsClosed (N.strongDualCoannihilator : Set E)`. The backbone's `Submodule.isClosed_strongDualAnnihilator`
and `Submodule.isClosed_strongDualCoannihilator`. ★'''
deps = ["Submodule.isClosed_strongDualAnnihilator", "Submodule.isClosed_strongDualCoannihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.3, Notation"

[[node]]
id = "proposition_1_9"
kind = "theorem"
desc = '''Proposition 1.9, first clause: for a subspace `M : Submodule ℝ E`,
`M.strongDualAnnihilator.strongDualCoannihilator = M.topologicalClosure`, the book's `(M^⊥)^⊥ = closure M`.
The backbone's `Submodule.strongDualCoannihilator_strongDualAnnihilator`, whose proof is the book's
(Theorem 1.7 separating `x₀ ∉ closure M` from `closure M`, in the form
`Submodule.exists_dual_eq_zero_of_notMem`). ★'''
deps = ["Submodule.strongDualCoannihilator_strongDualAnnihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 1.9"

[[node]]
id = "proposition_1_9_supset"
kind = "theorem"
desc = '''Proposition 1.9, second clause: for `N : Submodule ℝ (StrongDual ℝ E)`,
`N.topologicalClosure ≤ N.strongDualCoannihilator.strongDualAnnihilator`, the book's `(N^⊥)^⊥ ⊇ closure N`.
The backbone's `Submodule.topologicalClosure_le_strongDualAnnihilator_strongDualCoannihilator`. ★'''
deps = ["Submodule.topologicalClosure_le_strongDualAnnihilator_strongDualCoannihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 1.9"

[[node]]
id = "remark_1_6"
kind = "theorem"
desc = '''Remark 6, the precise clause: if `E` is reflexive (`NormedSpace.IsReflexive ℝ E`) then
`(N^⊥)^⊥ = closure N` for every `N : Submodule ℝ (StrongDual ℝ E)`:
`N.strongDualCoannihilator.strongDualAnnihilator = N.topologicalClosure`. The backbone's
`Submodule.strongDualAnnihilator_strongDualCoannihilator`, whose proof is the remark's own "try" carried
through with `ξ = J x₀`. The strictness in general (Exercise 1.16: `E = ℓ¹`, `N = c₀`) and the
identification of `(N^⊥)^⊥` with the weak-* closure of `N` (chapter 3) are not nodes here. ★'''
deps = ["Submodule.strongDualAnnihilator_strongDualCoannihilator", "NormedSpace.IsReflexive"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 1, Remark 6"
