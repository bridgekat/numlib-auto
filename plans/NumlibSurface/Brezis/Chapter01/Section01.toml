namespace = "Brezis.Chapter01"
desc = '''
Brezis §1.1, the analytic form of the Hahn–Banach theorem and its four corollaries, over a real
normed space `E` with dual `E* = StrongDual ℝ E`. Everything here is Mathlib's, restated in the
book's words: Theorem 1.1 is `exists_extension_of_le_sublinear` (stated for a `LinearPMap`),
Corollary 1.2 is `exists_extension_norm_eq`, Corollary 1.3 is `exists_dual_vector''` rescaled,
Corollary 1.4 is the isometry `NormedSpace.inclusionInDoubleDualLi` read through
`ContinuousLinearMap.sSup_unitClosedBall_eq_norm`. The two remarks with mathematical content are
nodes: Remark 2's uniqueness of the norming functional when `E*` is strictly convex, and Remark
3's attainment of the dual norm in a reflexive space, which is proved from the backbone's weak
sequential compactness (`NormedSpace.exists_subseq_forall_dual_tendsto`) rather than from
chapter 3. The book's duality map `F` (Remark 2) is defined, since Exercises 1.1, 3.28 and
Problem 13 refer to it. Remark 1 (on Zorn's lemma) and the James theorem quoted in Remark 3 are
not formalized.
'''

[[node]]
id = "theorem_1_1"
kind = "theorem"
desc = '''Theorem 1.1 (Helly, Hahn–Banach analytic form). Let `E` be a real vector space,
`p : E → ℝ` with `p (λ • x) = λ * p x` for `λ > 0` (1) and `p (x + y) ≤ p x + p y` (2), `G` a
subspace and `g : G →ₗ[ℝ] ℝ` with `g x ≤ p x` on `G`. Then there is `f : E →ₗ[ℝ] ℝ` extending
`g` (`∀ x : G, f x = g x`) with `f x ≤ p x` for all `x`. Statement over `[AddCommGroup E]
[Module ℝ E]`, `G : Submodule ℝ E`, no topology. This is Mathlib's
`exists_extension_of_le_sublinear (LinearPMap.mk G g) p` (`Mathlib/Analysis/Convex/Cone/Extension.lean`),
whose `N_hom` and `N_add` are (1) and (2) verbatim; the surface only unpacks the `LinearPMap`.
Lemma 1.1 (Zorn) is not needed for the delegation. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 1.1"

[[node]]
id = "lemma_1_1"
kind = "theorem"
desc = '''Lemma 1.1 (Zorn). Every nonempty ordered set that is inductive — every totally ordered
subset has an upper bound — has a maximal element. For `[Preorder P] [Nonempty P]` and
`h : ∀ c : Set P, IsChain (· ≤ ·) c → BddAbove c`, `∃ m : P, IsMax m` (the book's "maximal":
`m ≤ x → x = m`, which for a partial order is `IsMax m`; state it with `[PartialOrder P]` and
`∀ x, m ≤ x → x = m`). Mathlib's `zorn_le` (`Mathlib/Order/Zorn.lean`); the book's "inductive"
quantifies over all totally ordered subsets including the empty one, which is `zorn_le`'s
hypothesis exactly (`zorn_le_nonempty` is the variant with nonempty chains). ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 1.1"

[[node]]
id = "dualNorm_eq"
kind = "theorem"
desc = '''The dual norm, formula (5) of the Notation paragraph after Theorem 1.1:
`‖f‖ = sup {|f x| : ‖x‖ ≤ 1} = sup {f x : ‖x‖ ≤ 1}` for `f : StrongDual ℝ E`. Two clauses:
`‖f‖ = sSup ((fun x => |f x|) '' Metric.closedBall 0 1)` is
`ContinuousLinearMap.sSup_unitClosedBall_eq_norm` (with `‖f x‖ = |f x|` over `ℝ`), and
`‖f‖ = sSup ((fun x => f x) '' Metric.closedBall 0 1)` follows because the ball is symmetric
(`f (-x) = -f x`, so the two image sets have the same supremum). Records how the book's `E*`
and `‖·‖_{E*}` are read: `StrongDual ℝ E` with its operator norm. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.1, Notation (5)"

[[node]]
id = "corollary_1_2"
kind = "theorem"
desc = '''Corollary 1.2. For `G : Submodule ℝ E` of a normed space and `g : StrongDual ℝ G`
there is `f : StrongDual ℝ E` with `∀ x : G, f x = g x` and `‖f‖ = ‖g‖`. Mathlib's
`exists_extension_norm_eq G g` verbatim (`Mathlib/Analysis/Normed/Module/HahnBanach.lean`, over
any `IsRCLikeNormedField`). ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 1.2"

[[node]]
id = "corollary_1_3"
kind = "theorem"
desc = '''Corollary 1.3. For every `x₀ : E` there is `f₀ : StrongDual ℝ E` with `‖f₀‖ = ‖x₀‖` and
`f₀ x₀ = ‖x₀‖ ^ 2`. From `exists_dual_vector'' ℝ x₀` (`‖g‖ ≤ 1`, `g x₀ = ‖x₀‖`) with
`f₀ := ‖x₀‖ • g`: `f₀ x₀ = ‖x₀‖²` and `‖f₀‖ ≤ ‖x₀‖`, while `‖f₀‖ ≥ f₀ x₀ / ‖x₀‖ = ‖x₀‖` when
`x₀ ≠ 0` (`ContinuousLinearMap.le_opNorm`); at `x₀ = 0` take `f₀ = 0`. (Using
`exists_dual_vector` with `‖g‖ = 1` for `x₀ ≠ 0` is the same computation.) ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 1.3"

[[node]]
id = "dualityMap"
kind = "definition"
desc = '''The duality map of Remark 2: `dualityMap x₀ : Set (StrongDual ℝ E) :=
{f₀ | ‖f₀‖ = ‖x₀‖ ∧ f₀ x₀ = ‖x₀‖ ^ 2}`, the set of functionals produced by Corollary 1.3; it is
nonempty by `corollary_1_3` (`dualityMap_nonempty`, folded into this node). Exercises 1.1, 1.2,
3.28 and Problem 13 study it; only Remark 2's uniqueness clause is a node here.'''
deps = ["corollary_1_3"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 1, Remark 2"

[[node]]
id = "remark_1_2"
kind = "theorem"
desc = '''Remark 2, the precise clause: if `E*` is strictly convex (`StrictConvexSpace ℝ (StrongDual ℝ E)`,
the footnote's definition `‖t x + (1 - t) y‖ < 1` for `‖x‖ = ‖y‖ = 1`, `x ≠ y`, `t ∈ (0,1)` being
Mathlib's `StrictConvexSpace` through `StrictConvexSpace.of_norm_combo_lt_one`) then `dualityMap x₀`
is a singleton: `f₁ ∈ dualityMap x₀ → f₂ ∈ dualityMap x₀ → f₁ = f₂`. Proof: `‖f₁ + f₂‖ ≥ (f₁ + f₂) x₀ / ‖x₀‖ = 2 ‖x₀‖ = ‖f₁‖ + ‖f₂‖`
for `x₀ ≠ 0`, so `SameRay ℝ f₁ f₂` (`sameRay_iff_norm_add`) and equal norms give `f₁ = f₂`
(`eq_of_norm_eq_of_norm_add_eq`); for `x₀ = 0` both are `0`. The non-uniqueness "in general"
(Exercise 1.2) is not formalized. ★'''
deps = ["dualityMap"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 1, Remark 2"

[[node]]
id = "corollary_1_4"
kind = "theorem"
desc = '''Corollary 1.4, formula (6): for every `x : E`,
`‖x‖ = sSup ((fun f : StrongDual ℝ E => |f x|) '' Metric.closedBall 0 1)`, and the supremum is a
maximum: `∃ f, ‖f‖ ≤ 1 ∧ |f x| = ‖x‖` (`corollary_1_4_max`, folded into this node as a
conjunction, or split — keep the plain id on the conjunction). The sup: `‖x‖ = ‖J x‖`
(`NormedSpace.inclusionInDoubleDualLi`, `LinearIsometry.norm_map`) and
`ContinuousLinearMap.sSup_unitClosedBall_eq_norm (J x)` with `J x f = f x` (`NormedSpace.dual_def`).
The max: `exists_dual_vector'' ℝ x`. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 1.4"

[[node]]
id = "remark_1_3"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). Remark 3, the provable clause: in a reflexive Banach space the supremum in (5) is
achieved — for `[CompleteSpace E] [NormedSpace.IsReflexive ℝ E]` and every `f : StrongDual ℝ E`
there is `x` with `‖x‖ ≤ 1` and `f x = ‖f‖`. Proof from the backbone, without chapter 3: pick
`xₙ` in the closed unit ball with `f xₙ → ‖f‖` (`dualNorm_eq`, `exists_seq_tendsto_sSup`);
`NormedSpace.exists_subseq_forall_dual_tendsto` (`Numlib/Analysis/Normed/Module/Reflexive`)
extracts a weakly convergent subsequence `x_{φ n} ⇀ x`; then `f x = lim f x_{φ n} = ‖f‖` and
`‖x‖ ≤ liminf ‖x_{φ n}‖ ≤ 1` by `norm_le_liminf_norm_of_weak_tendsto`
(`Numlib/Analysis/Normed/Module/WeakDual`, through `tendsto_toWeakSpace_iff`). ★★, ~40 lines.
The converse (R. C. James) is quoted without proof and is not planned.'''
deps = ["dualNorm_eq", "NormedSpace.exists_subseq_forall_dual_tendsto", "norm_le_liminf_norm_of_weak_tendsto", "tendsto_toWeakSpace_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 1, Remark 3"
