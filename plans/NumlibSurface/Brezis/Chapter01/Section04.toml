[[node]]
id = "example_1_3"
kind = "theorem"
desc = '''Example 3, formula (19): for a nonempty convex `K : Set E` and `x₀ : E`,
`(Metric.infDist x₀ K : EReal) = ⨆ f ∈ {f : StrongDual ℝ E | ‖f‖ ≤ 1}, ((f x₀ : ℝ) : EReal) - conjugate (indicatorFn K) f`,
and the supremum is attained (`example_1_3_max`, folded in: `∃ f, ‖f‖ ≤ 1 ∧ … = infDist x₀ K`).
Here `infDist x₀ K = ⨅ x ∈ K, ‖x - x₀‖` (`Metric.infDist_eq_iInf`), which is
`⨅ x, φ x + ψ x` for `φ x = ‖x - x₀‖`, `ψ = indicatorFn K`. Apply `theorem_1_12` /
`theorem_1_12_max` (`φ` is finite, convex and continuous everywhere; `ψ` is proper convex since
`K ≠ ∅`; `x₀`-independent point of `K` for the qualification) and compute
`conjugate φ (-f) = indicatorFn (closedBall 0 1) (-f) - f x₀` by `example_1_1_conj` and the
backbone's `conj_comp_sub` (translation row of the conjugacy table); the terms with `‖f‖ > 1`
are `⊥` and drop out of the supremum, and the ball is symmetric. ★★, ~60 lines of `EReal`.'''
deps = ["theorem_1_12", "theorem_1_12_max", "example_1_1_conj", "ConvexAnalysis.conj_comp_sub"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.4, Example 3"

[[node]]
id = "example_1_3_submodule"
kind = "theorem"
desc = '''Example 3, the subspace case: for `M : Submodule ℝ E` and `x₀ : E`,
`Metric.infDist x₀ M = ⨆ f ∈ {f ∈ M.strongDualAnnihilator | ‖f‖ ≤ 1}, f x₀` (in `ℝ`, the set
of values being bounded by `‖x₀‖`), and the supremum is a maximum. The backbone's
`Submodule.exists_mem_strongDualAnnihilator_norm_le_one_apply_eq_infDist` and
`Submodule.norm_apply_le_infDist_of_mem_strongDualAnnihilator`
(`Numlib/Analysis/Normed/Module/Annihilator`), proved there by Hahn–Banach in `E ⧸ closure M`;
the book derives it from (19) with `example_1_2_conj` (`I_M* = I_{M^⊥}`), which the node may
also record as `example_1_3_submodule_of_example_1_3`. ★'''
deps = ["Submodule.exists_mem_strongDualAnnihilator_norm_le_one_apply_eq_infDist", "Submodule.norm_apply_le_infDist_of_mem_strongDualAnnihilator", "example_1_3", "example_1_2_conj"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §1.4, Example 3"

[[node]]
id = "example_1_4"
kind = "theorem"
desc = '''Example 4: for `φ : E → ℝ` convex and continuous (`ConvexOn ℝ univ φ`, `Continuous φ`,
read as the `EReal`-valued `ConvexFn (fun x => (φ x : EReal))` through `ConvexOn.convexFn_coe`)
