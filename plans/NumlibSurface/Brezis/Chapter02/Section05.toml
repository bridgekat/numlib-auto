namespace = "Brezis.Chapter02"
desc = '''
★ §2.5, orthogonality revisited: the annihilators of sums and intersections of closed subspaces
`G L` of a real Banach space `E`, in the notation of §1.3, `M^⊥ = M.strongDualAnnihilator ⊆ E*`
for `M ⊆ E` and `N^⊥ = N.strongDualCoannihilator ⊆ E` for `N ⊆ E*` (brief D4, with the name
`Submodule.annihilator` replaced by `Submodule.strongDualAnnihilator` because Mathlib already
uses the former for the ideal annihilator — see chapter 1's `Annihilator.toml`). All three
results are chapter 1's backbone `Numlib/Analysis/Normed/Module/Annihilator` (Propositions 1.9
and 2.14, Corollary 2.15 and Theorem 2.16, `Submodule.tfae_isClosed_sup`); the surface restates
over `ℝ`. Theorem 2.16's proof consumes this chapter's backbone — Theorem 2.10
(`Submodule.exists_add_eq_norm_le_of_isClosed_sup`), Corollary 2.11
(`Submodule.exists_infDist_inf_le_of_isClosed_sup`, applied in `E*`) and the second step of the
open mapping theorem (`LinearPMap.IsClosed.ball_subset_image_of_ball_subset_closure_image`) — as
well as Corollary 1.2 (`exists_extension_norm_eq`) and the distance formula
`dist (f, G^⊥) = ‖f|_G‖` (`Submodule.infDist_strongDualAnnihilator`, chapter 1), which the book
derives from Theorem 1.12 and chapter 1 proves by a direct Hahn–Banach extension.
'''

[[node]]
id = "proposition_2_14"
kind = "theorem"
desc = '''Proposition 2.14: for closed subspaces `G L : Submodule ℝ E` of a Banach space,
(16) `G ⊓ L = (G.strongDualAnnihilator ⊔ L.strongDualAnnihilator).strongDualCoannihilator`
and (17) `G.strongDualAnnihilator ⊓ L.strongDualAnnihilator = (G ⊔ L).strongDualAnnihilator`.
Chapter 1's `Submodule.strongDualCoannihilator_sup_strongDualAnnihilator_of_isClosed` (16) and
`Submodule.strongDualAnnihilator_sup` (17, no closedness needed); the surface restates both
clauses over `ℝ`, possibly split as `proposition_2_14_inf` and `proposition_2_14_sup`. ★'''
deps = ["Submodule.strongDualCoannihilator_sup_strongDualAnnihilator_of_isClosed", "Submodule.strongDualAnnihilator_sup"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 2.14"

[[node]]
id = "corollary_2_15"
kind = "theorem"
desc = '''Corollary 2.15: for closed subspaces `G L` of a Banach space,
(18) `(G.strongDualAnnihilator ⊔ L.strongDualAnnihilator).topologicalClosure ≤ (G ⊓ L).strongDualAnnihilator`
and (19) `(G.strongDualAnnihilator ⊓ L.strongDualAnnihilator).strongDualCoannihilator = (G ⊔ L).topologicalClosure`.
Chapter 1's `Submodule.topologicalClosure_sup_strongDualAnnihilator_le` (18) and
`Submodule.strongDualCoannihilator_inf_strongDualAnnihilator` (19), both from Propositions 1.9 and 2.14
as the book says. ★'''
deps = ["Submodule.topologicalClosure_sup_strongDualAnnihilator_le", "Submodule.strongDualCoannihilator_inf_strongDualAnnihilator", "proposition_2_14"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 2.15"

[[node]]
id = "theorem_2_16"
kind = "theorem"
desc = '''★ Theorem 2.16: for closed subspaces `G L` of a Banach space `E`, the following are equivalent:
(a) `IsClosed ((G ⊔ L : Submodule ℝ E) : Set E)`;
(b) `IsClosed ((G.strongDualAnnihilator ⊔ L.strongDualAnnihilator : Submodule ℝ (StrongDual ℝ E)) : Set (StrongDual ℝ E))`;
(c) `G ⊔ L = (G.strongDualAnnihilator ⊓ L.strongDualAnnihilator).strongDualCoannihilator`;
(d) `G.strongDualAnnihilator ⊔ L.strongDualAnnihilator = (G ⊓ L).strongDualAnnihilator`.
Chapter 1's `Submodule.tfae_isClosed_sup` (a `List.TFAE`), restated over `ℝ`. The book's proof
(lines 1633–1707) needs, from this chapter's backbone, Theorem 2.10 for (a) ⇒ (d)
(`Submodule.exists_add_eq_norm_le_of_isClosed_sup`, to bound the functional `x = a + b ↦ ⟨f, a⟩`
on `G + L` before extending it by `exists_extension_norm_eq`), and for (b) ⇒ (a) Corollary 2.11
in `E*` (`Submodule.exists_infDist_inf_le_of_isClosed_sup`), the distance formula (21), a
separation (`geometric_hahn_banach_closed_point`) to get `closure (B_G + B_L) ⊇ (1/C) B_{closure (G+L)}`,
and the open-mapping Step 2 `LinearPMap.IsClosed.ball_subset_image_of_ball_subset_closure_image`
for `T : G × L → closure (G + L)` — Mathlib's sup norm on `G × L` is exactly the book's
`‖[x, y]‖ = max {‖x‖, ‖y‖}`. ★★★ in the backbone (chapter 1 estimates 250 lines for (b) ⇒ (a));
★ here.'''
deps = ["Submodule.tfae_isClosed_sup", "Submodule.exists_add_eq_norm_le_of_isClosed_sup", "Submodule.exists_infDist_inf_le_of_isClosed_sup", "LinearPMap.IsClosed.ball_subset_image_of_ball_subset_closure_image"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 2.16"
