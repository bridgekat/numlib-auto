[[node]]
id = "remark_10_10"
kind = "theorem"
desc = '''Remark 10: the compatibility conditions of Theorem 10.8 are necessary and sufficient for a
solution `u ∈ C^∞(Ω̄ × [0,∞))` of (27)–(30). Sufficiency is `theorem_10_8`; necessity, "the proof
is the same as in Remark 4": if `u : ℝ^N × ℝ → ℝ` is `C^∞` (on `ℝ^N × ℝ`, as `remark_10_4`),
solves `∂ₜₜu = Δu` in `Q` and vanishes on `Σ`, then `Δ^j (u(·,0))` and `Δ^j (∂ₜu(·,0))` vanish on
`Γ` for every `j`. Backbone `Wave.IsClassicalSolution.iteratedLaplacian_eq_zero_frontier`. ★★

Blocked (2026-09-20, surf12): the backbone node
`Wave.IsClassicalSolution.iteratedLaplacian_eq_zero_frontier` (`PDE/Wave`, agent pde6) is open
in this worktree; the surface node is then the shape of `remark_10_4` with the wave equation
`deriv (deriv fun s ↦ u (x, s)) t = Δ (fun y ↦ u (y, t)) x` in place of the heat equation.'''
deps = ["theorem_10_8", "remark_10_4", "Wave.IsClassicalSolution.iteratedLaplacian_eq_zero_frontier"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 10"
