[[node]]
id = "remark_10_1_necessary"
kind = "theorem"
desc = '''Remark 1, the necessary condition (12): if the backward problem (9), (10), (11) has a
solution `u` on `[0,T]` in the class of Theorem 10.1 (continuous on `[0,T]` into `L²`, `C¹` on
`(0,T]` with `∂ₜu = Δu`, `u(t) ∈ D(A)` for `t > 0`, `u(T) = u_T`), then `u_T ∈ D(A^ℓ)` for every
`ℓ` — hence, by (7), `u_T ∈ H^{2ℓ}(Ω)` for all `ℓ` with `Δ^j u_T = 0` on `Γ` for all `j`, and
`u_T ∈ C^∞(Ω̄)` by Corollary 9.15: such a `u` is the forward solution with datum `u(0)`, so
`u_T = u(T)` is smooth by Theorem 10.1 (`Heat.IsSolution.contDiffOn_top`'s `exists_powDomain`
at `t = T`). The book's further claim that even then a solution need not exist is not planned
(no counterexample is given). ★'''
