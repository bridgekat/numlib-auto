namespace = "Brezis.Chapter10"
desc = '''
Brezis §10.1, the heat equation: existence, uniqueness and regularity. The problem (1)–(3) is
read, as the book instructs at line 12150, for a curve `u : ℝ → L²(Ω)`; the operator `A`,
`D(A) = H²(Ω) ∩ H¹₀(Ω)`, `Au = -Δu`, is `heatOperator Ω`, the backbone's Dirichlet Laplacian
`dirichletLaplacian Ω` (weak domain `{u ∈ H¹₀ : Δu ∈ L²}`) restricted to `H²(Ω)`, and
`heatOperator_eq_dirichletLaplacian` says the two coincide on a `C²` domain with bounded boundary
(Theorem 9.25). The standing hypothesis of the chapter, "`Ω` of class `C^∞` with `Γ` bounded",
is `Brezis.Chapter09.IsOfClassC ⊤ Ω ∧ Bornology.IsBounded (frontier Ω)` and is carried by the
theorems as the book states them; the backbone proves the existence, uniqueness and energy
clauses on every open set, and the surface records that as a remark in each `desc`. The classes
`C^k(I; V)` are `Bochner.ContDiffOnThrough`, `L²(I; V)` is `Bochner.MemLpThrough`, and
`C^∞(Ω̄ × [ε,∞))` is `ContDiffOnClosure ⊤ U (Ω ×ˢ Ioi ε)` for a function `U` of `(x,t)`
representing the curve. Nodes: the operator and its three properties (i)–(iii) of the proof of
Theorem 10.1, the solution class, Theorem 10.1 in four clauses (existence and uniqueness; (5);
(6); `L²(0,∞; H¹₀)`), the display (7), Theorem 10.2 (a)–(c), Remarks 1, 3, 4. Remarks 2 and 5
are discussion.
'''

