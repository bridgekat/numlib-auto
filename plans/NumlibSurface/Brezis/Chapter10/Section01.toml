[[node]]
id = "theorem_10_1"
kind = "theorem"
desc = '''Theorem 10.1, existence and uniqueness: for `Ω` of class `C^∞` with `Γ` bounded and
`u₀ ∈ L²(Ω)` there is a unique `u` with `IsHeatSolution Ω u₀ u` (unique on `Ici 0`:
`∃ u, IsHeatSolution Ω u₀ u ∧ ∀ v, IsHeatSolution Ω u₀ v → EqOn v u (Ici 0)`). The book's proof:
`A` is self-adjoint maximal monotone (`heatOperator_isSelfAdjoint`) and Theorem 7.7
(`Brezis.Chapter07.theorem_7_7`) applies; in the backbone, `Heat.isSolution_solution` and
`Heat.IsSolution.unique` through `isHeatSolution_iff`. The backbone proves it on every open set
for the weak class; the `C^∞` hypothesis only identifies the class with the book's. ★'''
