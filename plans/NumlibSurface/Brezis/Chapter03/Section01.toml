namespace = "Brezis.Chapter03"
desc = '''
Brezis §3.1, the coarsest topology for which a family of maps `φ i : X → Y i` becomes
continuous. Everything is Mathlib's: the topology of Problem 1 is `⨅ i, TopologicalSpace.induced (φ i) inferInstance`
(named `weakestTopology` here so that §3.2 and §3.4 can define `σ(E, E⋆)` and `σ(E⋆, E)` by the
book's words), Problem 2's construction is `TopologicalSpace.generateFrom` of the preimages,
Lemma 3.1 is `TopologicalSpace.isTopologicalBasis_of_subbasis`, Proposition 3.1 is `nhds_iInf`
with `nhds_induced` (or `tendsto_iInf` with `tendsto_comap_iff`), Proposition 3.2 is
`continuous_iInf_rng` with `continuous_induced_rng`. The neighbourhood-basis description after
Lemma 3.1 ("finite intersections of `φ i ⁻¹' V i`") is what Propositions 3.4 and 3.12 make
precise for the weak topologies and is not a separate node. Remark 1 is discussion.
'''

[[node]]
id = "weakestTopology"
kind = "definition"
desc = '''The coarsest topology on a set `X` making a family of maps continuous (Problem 1 of
§3.1): for `{ι : Type*} {Y : ι → Type*} [∀ i, TopologicalSpace (Y i)] (φ : ∀ i, X → Y i)`,
`weakestTopology φ : TopologicalSpace X := ⨅ i, TopologicalSpace.induced (φ i) inferInstance`.
Every `φ i` is continuous for it (`continuous_iInf_dom continuous_induced_dom`) and it is the
least such topology (`le_iInf_iff`, `continuous_iff_le_induced`): that is the "cheapest topology"
of the book, and both facts may be recorded as `continuous_weakestTopology` and
`weakestTopology_le` (folded into this node). ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.1, Problem 1"

[[node]]
id = "weakestTopology_eq_generateFrom"
kind = "theorem"
desc = '''Problem 2 of §3.1 solved: the coarsest topology containing the sets `φ i ⁻¹' ω`, `ω`
open in `Y i`, is `weakestTopology φ`:
`weakestTopology φ = TopologicalSpace.generateFrom {U | ∃ i (ω : Set (Y i)), IsOpen ω ∧ U = φ i ⁻¹' ω}`.
Mathlib: `TopologicalSpace.generateFrom_iUnion_isOpen` (a `⨅` of topologies is generated by the
union of their open sets) and `induced_generateFrom_eq`/`isOpen_induced_iff` (the open sets of
`induced (φ i) _` are the preimages). ★'''
deps = ["weakestTopology"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.1, Problem 2"

[[node]]
id = "lemma_3_1"
kind = "theorem"
desc = '''Lemma 3.1: the family `𝓕` of arbitrary unions of finite intersections of the sets
`U λ` is stable under finite intersections — i.e. the finite intersections of a subbasis form a
basis of the generated topology. For `s : Set (Set X)`,
`TopologicalSpace.IsTopologicalBasis[generateFrom s] ((fun f => ⋂₀ f) '' {f | f.Finite ∧ f ⊆ s})`,
which is Mathlib's `TopologicalSpace.isTopologicalBasis_of_subbasis` verbatim (stability of a
basis under finite intersections is `IsTopologicalBasis.exists_subset_inter`). The "delightful
exercise in set theory" the book leaves to the reader (line 2190). ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 3.1"

[[node]]
id = "proposition_3_1"
kind = "theorem"
desc = '''Proposition 3.1: a sequence converges for `weakestTopology φ` iff its images under every
`φ i` converge. For `x : ℕ → X` and `a : X`,
`Tendsto x atTop (@nhds X (weakestTopology φ) a) ↔ ∀ i, Tendsto (fun n => φ i (x n)) atTop (𝓝 (φ i a))`.
Mathlib: `nhds_iInf`, `nhds_induced`, `Filter.tendsto_iInf`, `Filter.tendsto_comap_iff`. Stated for
sequences as in the book; the same proof gives it for any filter. ★'''
deps = ["weakestTopology"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 3.1"

[[node]]
id = "proposition_3_2"
kind = "theorem"
desc = '''Proposition 3.2: a map `ψ : Z → X` from a topological space is continuous for
`weakestTopology φ` iff every `φ i ∘ ψ` is continuous:
`Continuous[_, weakestTopology φ] ψ ↔ ∀ i, Continuous (φ i ∘ ψ)`. Mathlib: `continuous_iInf_rng`
and `continuous_induced_rng`. This is the tool the whole chapter uses to check continuity into a
weak topology (`WeakBilin.continuous_of_continuous_eval` is its instance for `WeakSpace`/`WeakDual`). ★'''
deps = ["weakestTopology"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 3.2"
