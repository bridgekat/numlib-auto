[[node]]
id = "theorem_6_11"
kind = "theorem"
desc = '''Theorem 6.11: for `H : Type u` a separable real Hilbert space and `T : H →L[ℝ] H` compact
and self-adjoint, there is a Hilbert basis of `H` composed of eigenvectors of `T`:
`∃ (ι : Type u) (b : HilbertBasis ι ℝ H), ∀ i, ∃ μ : ℝ, T (b i) = μ • b i`. The backbone's
`ContinuousLinearMap.IsSymmetric.exists_type_hilbertBasis_eigenvectors` with
`ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric`; the coercion `((μ : ℝ) : ℝ)` disappears by
`simp`. The separability hypothesis `[TopologicalSpace.SeparableSpace H]` is carried as the book
states it and is not used (the theorem holds for every Hilbert space). Prototyped in
`notes/brezis/ch06/proto/Theorem611.lean` as `theorem_6_11`. ★'''
deps = ["ContinuousLinearMap.IsSymmetric.exists_type_hilbertBasis_eigenvectors"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 6.11"

[[node]]
id = "theorem_6_11_orthogonal"
kind = "theorem"
desc = '''Theorem 6.11, step (i) of the proof: the eigenspaces `E_n = N(T - λ_n I)` (including
`E_0 = N(T)`) of a self-adjoint `T : H →L[ℝ] H` are mutually orthogonal,
`OrthogonalFamily ℝ (fun μ : ℝ => Module.End.eigenspace (T : Module.End ℝ H) μ) (fun μ => (Module.End.eigenspace (T : Module.End ℝ H) μ).subtypeₗᵢ)`.
Mathlib's `LinearMap.IsSymmetric.orthogonalFamily_eigenspaces`. Compactness is not needed. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 6.11"

[[node]]
id = "theorem_6_11_dense"
kind = "theorem"
desc = '''Theorem 6.11, step (ii) of the proof: the space `F` spanned by the eigenspaces of a compact
self-adjoint `T : H →L[ℝ] H` is dense in `H`,
`(⨆ μ : ℝ, Module.End.eigenspace (T : Module.End ℝ H) μ)ᗮ = ⊥` (equivalently
`(⨆ μ, eigenspace T μ).topologicalClosure = ⊤`, by `Submodule.orthogonal_eq_bot_iff`). Mathlib's
`ContinuousLinearMap.orthogonalComplement_iSup_eigenspaces_eq_bot`. The book's argument — `T`
restricted to `F^⊥` is compact self-adjoint with spectrum `{0}`, hence zero by Corollary 6.10 —
is the proof Mathlib gives, with `eq_zero_of_forall_hasEigenvalue_eq_zero` in place of
Corollary 6.10. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 6.11"

[[node]]
id = "remark_6_8"
kind = "theorem"
desc = '''Remark 8: a compact self-adjoint operator is the norm limit of the finite-rank truncations
of its eigen-expansion. In the index-set form of Theorem 6.11: for `T : H →L[ℝ] H` compact
self-adjoint, `b : HilbertBasis ι ℝ H` and `μ : ι → ℝ` with `∀ i, T (b i) = μ i • b i`, and
`ε > 0`, the set `s := {i | ε < |μ i|}` is finite, and the finite-rank operator
`Tₛ := ∑ i ∈ s.toFinset, μ i • rankOne ℝ (b i) (b i)` (Mathlib's `rankOne`,
`Mathlib/Analysis/InnerProductSpace/LinearMap.lean`; `Tₛ u = ∑ᵢ μ i ⟪b i, u⟫ b i`) satisfies
`‖Tₛ - T‖ ≤ ε` — the book's `‖T_k - T‖ ≤ sup_{n ≥ k+1} |λ_n| → 0` with the truncation at
`|λ| > ε` instead of at the `k`-th distinct eigenvalue, since the index set is not ordered.

Proof route (★★, ~120 lines): `s` is finite because the values `{μ i | i ∈ s}` are eigenvalues of
modulus `> ε`, finitely many by `IsCompactOperator.finite_setOf_hasEigenvalue_norm_le`, and for
each such value `t ≠ 0` the `b i` with `μ i = t` are an orthonormal family inside the
finite-dimensional eigenspace (`ContinuousLinearMap.finite_dimensional_eigenspace`, Mathlib), so
finitely many (`Orthonormal.linearIndependent`, `LinearIndependent.finite`… or
`Module.Finite.finite_of_linearIndependent`). For the bound expand `u = ∑ᵢ ⟪b i, u⟫ b i`
(`HilbertBasis.hasSum_repr`), apply the continuous `T` termwise, and use Parseval
(`HilbertBasis.tsum_inner_mul_inner`/`hasSum_inner_mul_inner`): `(T - Tₛ) u = ∑_{i ∉ s} μ i ⟪b i, u⟫ b i`
has `‖(T - Tₛ) u‖ ^ 2 = ∑_{i ∉ s} |μ i|² |⟪b i, u⟫|² ≤ ε² ‖u‖²`. The unconditional statement
"every compact operator into a Hilbert space is a norm limit of finite-rank operators", which
the remark recalls at the end, is `remark_6_1`.'''
deps = ["theorem_6_11", "IsCompactOperator.finite_setOf_hasEigenvalue_norm_le", "remark_6_1"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 6, Remark 8"

[[node]]
id = "multiplicity_eq_of_isSelfAdjoint"
kind = "theorem"
desc = '''Comments on Chapter 6, 3, last sentence: for a self-adjoint `T : H →L[ℝ] H` (compact or
not) and `λ : ℝ`, the geometric and algebraic multiplicities coincide because the ascent is `1`:
`LinearMap.ker (((T - λ • 1) ^ 2 : H →L[ℝ] H) : H →ₗ[ℝ] H) = LinearMap.ker ((T - λ • 1 : H →L[ℝ] H) : H →ₗ[ℝ] H)`,
hence `ker ((T - λ • 1) ^ k) = ker (T - λ • 1)` for all `k ≥ 1`. As
`AtkinsonHan.Chapter02.theorem_2_8_15_index`: `T - λ • 1` is self-adjoint, so `(T - λ)² v = 0`
gives `‖(T - λ) v‖² = ⟪(T - λ)² v, v⟫ = 0`. ★, ~40 lines (the book refers to Problem 36, not
planned).'''
deps = ["isSelfAdjoint_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Comments on Chapter 6, 3"
