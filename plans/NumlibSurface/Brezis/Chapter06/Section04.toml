namespace = "Brezis.Chapter06"
desc = '''
Brezis §6.4, the spectral decomposition of self-adjoint compact operators, on a real Hilbert space
`H` (`[NormedAddCommGroup H] [InnerProductSpace ℝ H] [CompleteSpace H]`): the definition of a
self-adjoint bounded operator (Mathlib's `IsSelfAdjoint T`, the book's `T* = T` after the
identification `H* = H`), the numerical-range bounds `m = inf_{|u|=1} (Tu, u)`,
`M = sup_{|u|=1} (Tu, u)` of Proposition 6.9 — written with Mathlib's
`ContinuousLinearMap.rayleighQuotient` over the unit sphere, `⨅ x : Metric.sphere (0 : H) 1, T.rayleighQuotient x`
(which is `re ⟪T x, x⟫` there since `‖x‖ = 1`), and converted to the backbone's
`{ x // x ≠ 0 }` indexing by `ContinuousLinearMap.iInf_rayleigh_eq_iInf_rayleigh_sphere` — and
Theorem 6.11 in the form "there is a Hilbert basis of `H` consisting of eigenvectors of `T`",
with an index type in the universe of `H`. The book assumes `H` separable; the surface carries
`[TopologicalSpace.SeparableSpace H]` for faithfulness although the backbone theorem needs
nothing of it. The backbone is `Numlib/Analysis/InnerProductSpace/CompactSpectral/Basis.lean`;
the parent `CompactSpectral.lean` holds the `ℕ`-enumerated form the numerical-analysis surfaces
use, which is not the book's statement.
'''

[[node]]
id = "isSelfAdjoint_iff"
kind = "theorem"
desc = '''The definition of §6.4: `T : H →L[ℝ] H` is self-adjoint iff `⟪T u, v⟫ = ⟪u, T v⟫` for all
`u v`, `IsSelfAdjoint T ↔ ∀ u v : H, ⟪T u, v⟫_ℝ = ⟪u, T v⟫_ℝ`. Mathlib's
`ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric` and `LinearMap.IsSymmetric` unfolded. The
book's `T* = T` is `ContinuousLinearMap.adjoint T = T` after identifying `H*` with `H`
(`InnerProductSpace.toDual`), which is `ContinuousLinearMap.isSelfAdjoint_iff'`. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §6.4, Definition"

[[node]]
id = "proposition_6_9_subset"
kind = "theorem"
desc = '''Proposition 6.9, `σ(T) ⊆ [m, M]`: for `T : H →L[ℝ] H` self-adjoint on a nontrivial real
Hilbert space, `spectrum ℝ T ⊆ Set.Icc (⨅ x : Metric.sphere (0 : H) 1, T.rayleighQuotient x) (⨆ x : Metric.sphere (0 : H) 1, T.rayleighQuotient x)`.
The backbone's `IsSelfAdjoint.mem_Icc_of_ofReal_mem_spectrum` (over `ℝ` the coercion
`(t : ℝ) → ℝ` is the identity, `RCLike.ofReal_real_eq_id`) after
`ContinuousLinearMap.iInf_rayleigh_eq_iInf_rayleigh_sphere`/`iSup_rayleigh_eq_iSup_rayleigh_sphere`.
★'''
deps = ["ContinuousLinearMap.mem_Icc_of_ofReal_mem_spectrum"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 6.9"

