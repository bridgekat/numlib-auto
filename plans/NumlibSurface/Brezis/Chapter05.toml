desc = '''
**Policy (2026-09-17):** exercises and problems are not nodes — those the text cites as proof steps
become helper lemmas in the Lean files; results the book states without proof are deferred unless
a planned node depends on them (skip them in the order of attack).

Brezis, Chapter 5: Hilbert spaces. §5.1 projection onto a closed convex set, §5.2 the dual space,
§5.3 Stampacchia and Lax–Milgram, §5.4 Hilbert sums and orthonormal bases. Every numbered result
of the main text has a node in the section group beside this file, none is blocked, and all but
two backbone lemmas are routine: the chapter is the part of the book Mathlib and the backbone
already cover, and its surface is a dictionary between the book's vocabulary and theirs.

**Design.** The surface works over a real Hilbert space `[NormedAddCommGroup H]
[InnerProductSpace ℝ H] [CompleteSpace H]`, the book's `(u, v)` being `inner ℝ u v`; the
backbone it delegates to is over `RCLike 𝕜` wherever the argument allows (Hilbert sums, bases,
the subspace clause of the projection) and over `ℝ` where the projection theorem and the
variational inequalities are real (as Mathlib's `norm_eq_iInf_iff_real_inner_le_zero` is). The
book's four unnumbered Definition paragraphs are nodes named by content: `scalarProduct` and
`hilbertSpace` (read-back theorems, since the notions are Mathlib's classes), `BilinForm` with
`BilinForm.IsContinuousWith` and `BilinForm.IsCoerciveWith` (§5.3; the pattern of
`AtkinsonHan.BilinForm`, with `BilinForm.toSesqForm` bridging to the backbone's `SesqForm`),
`IsHilbertSumOf` and `IsOrthonormalBasis` (§5.4; predicates on `ℕ`-indexed families, each with an
`iff` to Mathlib's `IsHilbertSum` and `HilbertBasis ℕ ℝ H`). The recalled Cauchy–Schwarz
inequality, the parallelogram law and the Basic example (`L²`, `ℓ²`) are nodes too.

**Correspondence to the backbone.**

* §5.1. Theorem 5.2 is Mathlib's projection theorem (`exists_norm_eq_iInf_of_complete_convex`,
  `norm_eq_iInf_iff_real_inner_le_zero`) in the backbone's `IsBestApprox` vocabulary
  (`Numlib/Analysis/Normed/Module/BestApprox`: `isBestApprox_iff_inner_le_zero`,
  `IsBestApprox.unique`, `IsBestApprox.dist_le_dist`). The projection *map* `P_K`, used by
  Proposition 5.3, Corollary 5.4, the proof of Theorem 5.6 and Remark 5, existed in neither Mathlib
  nor the backbone (the Atkinson–Han surface built a local `projConvex` by `choose`); it is the
  new backbone module `Numlib/Analysis/InnerProductSpace/ConvexProjection` — `bestApprox K u`,
  its characterization `bestApprox_eq_iff`, nonexpansiveness `norm_bestApprox_sub_bestApprox_le`
  (Proposition 5.3) and `bestApprox_eq_starProjection` (Corollary 5.4). Proposition 5.1's
  uniform convexity is Mathlib's `InnerProductSpace.toUniformConvexSpace`; its "thus reflexive"
  is Milman–Pettis (chapter 3's `NormedSpace.isReflexive_of_uniformConvexSpace`), while Remark 4's
  direct route is the backbone instance `NormedSpace.instIsReflexiveOfInnerProductSpace`. Remark 2
  (projection in a uniformly convex Banach space) is `exists_isBestApprox_of_convex` of
  `Numlib/Variational/WeakMinimization` once Milman–Pettis lands; the book's Exercise 3.32 is
  chapter 3's to include or not.
* §5.2. Theorem 5.5 is `InnerProductSpace.toDual`. Remark 3, the pivot-space triple, is stated
  over chapter 2's `ContinuousLinearMap.strongDualMap` (brief D3) with an elementary proof of its
  three clauses; Remark 5 is Mathlib's orthogonal-complement API plus the identification of the
  §1.3 annihilator (chapter 1's `Submodule.strongDualAnnihilator`, brief D4's `Submodule.annihilator`
  under the name chapter 1 chose) with `Mᗮ` under `toDual`.
* §5.3. Theorem 5.6 is `existsUnique_isVariationalInequalitySolution_of_isCoercive` at `j = 0`
  (`Numlib/Variational/Inequality/Basic`; its proof is the book's, `P_K` and Banach's theorem)
  and, for symmetric forms, `SesqForm.isMinOn_energy_iff_forall_le` and
  `SesqForm.existsUnique_isMinOn_energy` (`Numlib/Variational/LaxMilgram`); Theorem 5.7 is
  Mathlib's `ContractingWith`; Corollary 5.8 is `SesqForm.laxMilgram` and
  `SesqForm.isMinOn_energy_iff`; Remark 8 is `ContinuousLinearMap.bijective_of_le_norm_of_orthogonal_range_eq_bot`.
  Remarks 6 and 7 add two nodes to `Numlib/Variational/LaxMilgram`: `SesqForm.convexOn_energy`
  (positive semidefinite, no symmetry) and `SesqForm.hasFDerivAt_energy` (the Euler equation).
* §5.4. Theorem 5.9 and Lemma 5.1 are the new backbone module
  `Numlib/Analysis/InnerProductSpace/HilbertSum`: Mathlib has the external sum `lp G 2`,
  `IsHilbertSum` and `OrthogonalFamily.linearIsometry` but never identifies the coordinates of a
  vector with its orthogonal projections, which is what `OrthogonalFamily.hasSum_starProjection`
  does, in the book's sharper form (without density, the projections sum to the projection onto
  the closed span). Corollary 5.10 is Mathlib's `HilbertBasis.hasSum_repr` and the backbone's
  `Numlib/Analysis/InnerProductSpace/OrthonormalSeries`. Theorem 5.11 is `exists_hilbertBasis`
  (Zorn) plus the countability of an orthonormal family in a separable space,
  `Orthonormal.countable_of_separableSpace`, giving `exists_hilbertBasis_countable` and, in
  infinite dimension, the book's `ℕ`-indexed form `exists_hilbertBasis_nat` through the missing
  `HilbertBasis.reindex`; Remarks 10 and 11 follow.

**Comments.** Theorem 5.12 (Fréchet–von Neumann–Jordan) is a node, Mathlib's
`InnerProductSpace.ofNorm`; Exercise 5.1, its proof, is subsumed. Not planned:
* Theorem 5.13 (Kakutani: norm-one projections onto every plane characterize Hilbert norms) —
  quoted without proof in the Comments; needs the two-dimensional characterization of inner
  product norms, of which Mathlib has nothing.
* Theorem 5.14 (de Figueiredo–Karlovitz: a nonexpansive radial projection characterizes Hilbert
  norms) — quoted without proof; same obstruction.
* Theorem 5.15 (Lindenstrauss–Tzafriri: every closed subspace complemented ⇒ Hilbertizable) —
  quoted without proof; needs Dvoretzky's theorem.
* Theorem 5.16 (Minty–Browder: a continuous, strictly monotone, coercive `A : E → E*` on a
  reflexive Banach space is bijective) — quoted without proof, with Problem 31 as the route.
  That route needs Kakutani's weak compactness of bounded closed convex sets in a reflexive space
  (Corollary 3.22, chapter 3, ★★★) for the finite-intersection step, plus the finite-dimensional
  min–max of Problem 30 and Minty's trick, several hundred lines on top of a ★★★ node — not
  bounded. What the backbone has is the Hilbert-space, Lipschitz special case (`zarantonello`,
  `Numlib/Nonlinear/FixedPoint`) and Minty's lemma (`IsVariationalInequalitySolution.iff_minty`).
* Theorem 5.17 (Carleson) — research-scale harmonic analysis.
* The weighted-`ℓ²` example of Remark 3 (`V = {∑ n² uₙ² < ∞}`, `V* = {∑ fₙ²/n² < ∞}`, the Riesz
  map `u ↦ (n² uₙ)`) — illustrative, needs an isometric identification of a weighted sequence
  space with a dual, and has no consumer.
* Comment 4's bases `√(2/π) sin nx` and `√(2/π) cos nx` of `L²(0, π)` are unnumbered: the cosine
  system is the backbone's `cosBasis` (`Numlib/Analysis/Fourier/CosineBasis`); the sine system
  belongs to chapter 8 (Theorem 8.22's Example).

**Exercises and problems.** None is a node. No exercise of chapter 5 is cited by any main text as
a step of a proof (Exercises 5.1 and 5.6 are cited from the Comments only, 5.10 from Remark 1 as
"see also", 5.15 from chapter 1's Comments, the rest from Problems); Remark 2 cites chapter 3's
Exercise 3.32 for its proof, and `remark_5_2` routes through Milman–Pettis instead. Problems
30–31 are outside the allowlist. The rest of the exercises is out of scope for this round.

**Unblocked.** No open node of the Atkinson–Han or Quarteroni–Sacco–Saleri surfaces is closed by
this chapter's backbone (`notes/frontier.md` lists none in this area). Two tidy-ups become
possible: `AtkinsonHan.Chapter03.projConvex` can be retired in favour of `bestApprox`, and the
private `convexOn_energy` of `Numlib/Variational/Inequality/Basic` in favour of the symmetric-free
`SesqForm.convexOn_energy`.

**Order of attack.** `Numlib/Analysis/InnerProductSpace/ConvexProjection` (~150 lines, all ★,
no dependency beyond Mathlib and `BestApprox`); the two appended nodes of
`Numlib/Variational/LaxMilgram` (~60 lines, ★); `Numlib/Analysis/InnerProductSpace/HilbertSum`
(~300 lines: `OrthogonalFamily.hasSum_starProjection` ★★ ~80, `exists_hilbertBasis_nat` ★★ ~50,
the rest ★). Then the four surface sections, ~700 lines in all; `Chapter05/Section01`'s
`proposition_5_1_reflexive` and `remark_5_2` wait for chapter 3's Milman–Pettis,
`Section02`'s `remark_5_3` for chapter 2's `strongDualMap` and `remark_5_5_annihilator` for
chapter 1's annihilator; everything else is ready once the backbone above is proved.
'''
