[[node]]
id = "remark_8_30_not_compact"
kind = "theorem"
desc = '''Remark 30, the negative half: the bounded self-adjoint operator `T : L²(ℝ) → L²(ℝ)`,
`f ↦ u` the solution of Example 8's problem (30) (`remark_8_30_bounded_selfAdjoint`), is not
compact: `¬ IsCompactOperator T`. `T` commutes with translations (`T (f(· + h)) = (T f)(· + h)`,
by uniqueness of the weak solution and translation invariance of the `H¹(ℝ)` inner product), so
for `φ ∈ C_c^∞`, `φ ≠ 0`, the translates `f_n = φ(· + n)` are bounded in `L²(ℝ)` while
`T f_n = (T φ)(· + n)` has no convergent subsequence in `L²(ℝ)`
(`‖(Tφ)(· + n) − (Tφ)(· + m)‖_2 → √2 ‖Tφ‖_2` as `|n − m| → ∞`, `T φ ≠ 0`; the argument of
Exercise 8.4 / Remark 10 (c)). The eigenvalues and the spectrum of `T` (Exercise 8.38) are not
planned. ★★★ (~300 lines, surface-level: the translation invariance and the non-Cauchy estimate)

Blocked: not attempted for budget reasons (★★★). The pieces needed: the translation
`τ_h : H¹(ℝ) → H¹(ℝ)` as an isometry of `SobolevIntervalLp 1 2 ⊤` (the backbone has only the
`L^p` estimate `SobolevIntervalLp.eLpNorm_translate_sub_le`), `Line.solution (τ_h f) = τ_h (Line.solution f)`
from `Line.eq_solution_of_forall`, and the `L²` non-Cauchy estimate for translates of a nonzero
`L²` function (`‖g(· + n) − g(· + m)‖² = 2 ‖g‖² − 2 ⟪g(· + n), g(· + m)⟫`, the cross term tending
to `0` — chapter 4's `L^p` continuity of translation does not give this decay; a truncation to a
compact set does).'''
deps = ["remark_8_30_bounded_selfAdjoint", "EllipticInterval.Line.form", "EllipticInterval.Line.solution"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 30"
