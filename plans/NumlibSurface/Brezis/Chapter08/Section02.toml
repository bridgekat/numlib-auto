namespace = "Brezis.Chapter08"
desc = '''
§8.2, The Sobolev space `W^{1,p}(I)`, with the `W^{m,p}` paragraph. `I` is an open interval,
possibly unbounded (`I : Opens ℝ` with `(hI : (I : Set ℝ).OrdConnected)`), `1 ≤ p ≤ ∞`
(`[Fact (1 ≤ p)]`). The space is `SobolevIntervalLp 1 p I` of `Numlib/Analysis/Sobolev/Interval/Basic`,
the book's set-theoretic definition is restated as `MemSobolevSpace` and identified with the
backbone's predicate; `u'` is `SobolevIntervalLp.deriv u 1`, the continuous representative `ũ`
is `SobolevIntervalLp.rep u`. Every numbered item of the section is a node (Proposition 8.1,
Theorem 8.2, Lemmas 8.1–8.4, Propositions 8.3–8.5, Theorems 8.6–8.8, Corollaries 8.9–8.11),
with Remarks 1, 2, 4–12 and the Examples; Remark 3 is not planned. The cited Exercises 8.2 (part
1), 8.3 and 8.6 (part 4) are nodes. Everything delegates to `Interval/{Basic,Extension,Density,
Embedding,Higher,DifferenceQuotient}`.
'''

[[node]]
id = "sobolevSpace"
kind = "definition"
desc = '''`abbrev sobolevSpace (p : ℝ≥0∞) (I : Opens ℝ) := SobolevIntervalLp 1 p I` — the book's
`W^{1,p}(I)`, and `abbrev H1 (I) := sobolevSpace 2 I` for `H¹(I)`. Notation-level; the surface
states its theorems on `SobolevIntervalLp 1 p I` directly. ★'''
deps = ["SobolevIntervalLp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Definition"

[[node]]
id = "MemSobolevSpace"
kind = "definition"
desc = '''The book's definition as a predicate on functions: `MemSobolevSpace p I u :=
MemLp u p (volume.restrict I) ∧ ∃ g, MemLp g p (volume.restrict I) ∧ ∀ φ : 𝓓(I, ℝ), ∫ x in I, u x * deriv φ x = -∫ x in I, g x * φ x`
— `u ∈ L^p(I)` with `g ∈ L^p(I)` such that `∫ u φ' = −∫ g φ` for every test function, the test
class being `𝓓(I, ℝ) = C_c^∞(I)` (brief D6; Remark 1). `memSobolevSpace_iff_memSobolevIntervalLp :
MemSobolevSpace p I u ↔ MemSobolevIntervalLp u 1 p I` by `memSobolevIntervalLp_one_iff` and
`hasWeakDerivOn_iff` (an `L^p` function is locally integrable, `MemLp.locallyIntegrableOn`). The
derivative `u' = g` is well defined a.e. (the book's footnote 2, Corollary 4.24):
`memSobolevSpace_deriv_unique`, from `HasWeakIteratedLineDerivOn.ae_eq`. ★'''
deps = ["sobolevSpace", "memSobolevIntervalLp_one_iff", "hasWeakDerivOn_iff", "HasWeakIteratedLineDerivOn.ae_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Definition"

[[node]]
id = "remark_8_1"
kind = "theorem"
desc = '''Remark 1: `C_c^1(I)` and `C_c^∞(I)` give the same space: for `u, g ∈ L^p(I)`,
`(∀ φ : 𝓓(I, ℝ), ∫ u φ' = −∫ g φ) ↔ ∀ φ : ℝ → ℝ, ContDiff ℝ 1 φ → HasCompactSupport φ → tsupport φ ⊆ I → ∫ u φ' = −∫ g φ`.
`←` is trivial. `→`: for `φ ∈ C_c^1(I)` the mollifications `ρ_n ⋆ φ` are test functions on `I`
for `n` large (support in `tsupport φ + closedBall 0 (1/n) ⊆ I`) and converge to `φ` in `C¹`:
`ρ_n ⋆ φ → φ` and `(ρ_n ⋆ φ)' = ρ_n ⋆ φ' → φ'` uniformly — the derivative identity is
`HasCompactSupport.hasDerivAt_convolution_right`, and the uniform convergence of the mollification
of a uniformly continuous compactly supported function is elementary (`|ρ_n ⋆ g − g| ≤ sup_{|t| ≤ 1/n} |g(· − t) − g|`
by `∫ ρ_n = 1`; the `TendstoUniformly` form is not in Mathlib, which has the pointwise
`ContDiffBump.convolution_tendsto_right`) — so both integrals pass to the limit (dominated
convergence on the compact support). ★★ (~200 lines). The uniform convergence on compacts of
`ρ_n ⋆ g` for continuous `g` is `Brezis.Chapter04.proposition_4_21` (Mathlib's
`MeasureTheory.convolution_tendsto_right`); apply it to `φ` and to `φ'` with the derivative
identity, and the compact support makes local uniform convergence uniform.'''
deps = ["MemSobolevSpace", "ContDiffBump.tendsto_eLpNorm_convolution_sub", "Brezis.Chapter04.proposition_4_21"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 1"

[[node]]
id = "remark_8_2"
kind = "theorem"
desc = '''Remark 2: `ContDiffOn ℝ 1 u I → MemLp u p (volume.restrict I) → MemLp (deriv u) p (volume.restrict I) → MemSobolevSpace p I u`,
with the weak derivative equal to `deriv u` (`remark_8_2_deriv`); and for a bounded `I = Opens.Ioo a b`,
`ContDiffOn ℝ 1 u (Icc a b) → MemSobolevSpace p (Opens.Ioo a b) u` for all `1 ≤ p ≤ ∞`
(`remark_8_2_Icc`). The backbone's `memSobolevIntervalLp_of_contDiffOn`. ★'''
deps = ["MemSobolevSpace", "memSobolevIntervalLp_of_contDiffOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 2"

