`¬ IsCompactOperator (SobolevIntervalLp.toContinuousMap (p := 1) zero_lt_one)`. Exercise 8.2 part 2's
sequence: `u n` equal to `0` on `[0, 1/2]`, `n (x − 1/2)` on `(1/2, 1/2 + 1/n)`, `1` after, is
bounded in `W^{1,1}` (`‖u n‖_1 ≤ 1`, `‖u n'‖_1 = 1`; `memSobolevIntervalLp_of_piecewise_contDiffOn`)
and converges pointwise to the step `1_{(1/2, 1]}`, so no subsequence converges uniformly (a
uniform limit would be continuous and equal to the step). ★★ (~150 lines; surface-only, a
counterexample)'''
deps = ["theorem_8_8", "memSobolevIntervalLp_of_piecewise_contDiffOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 10"

[[node]]
id = "remark_8_10_b"
kind = "theorem"
desc = '''Remark 10 (b), Helly's selection theorem: a bounded sequence in `W^{1,1}(I)` has a
subsequence converging at every point of `Ī`. Stated for bounded `I` (the book: "bounded or
unbounded"; the unbounded case follows from the bounded one on `I ∩ [−R, R]` by a diagonal
argument, `remark_8_10_b_unbounded`, optional). The backbone's
`SobolevIntervalLp.exists_subseq_tendsto_of_bounded_one`. ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.exists_subseq_tendsto_of_bounded_one"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 10"

[[node]]
id = "remark_8_10_c"
kind = "theorem"
desc = '''Remark 10 (c): for an unbounded `I` and `1 < p ≤ ∞`, the injection `W^{1,p}(I) → L^∞(I)` is
continuous but never compact: `¬ IsCompactOperator (SobolevIntervalLp.inclusionLinfty …)`. Exercise
8.4's sequence: for a fixed `φ ∈ C_c^∞(ℝ)`, `φ ≠ 0`, the translates `u n = φ(· + n)` (or `− n`,
towards the unbounded end) are bounded in `W^{1,p}(I)` and pairwise at `L^∞` distance `‖φ‖_∞`
once their supports are disjoint, so no subsequence is Cauchy in `L^∞`. ★★ (~150 lines;
surface-only)'''
deps = ["theorem_8_8", "SobolevIntervalLp.toLp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 10"

[[node]]
id = "remark_8_10_d"
kind = "theorem"
desc = '''Remark 10 (d): a bounded sequence in `W^{1,p}(I)`, `1 < p ≤ ∞`, has a subsequence
converging in `L^∞(J)` for every bounded `J ⊆ I` to some `u ∈ W^{1,p}(I)`. The backbone's
`SobolevIntervalLp.exists_subseq_tendsto_rep_of_bounded` (the uniform convergence of the
representatives on `closure I ∩ [−R, R]`, read as `L^∞(J)` convergence). ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.exists_subseq_tendsto_rep_of_bounded"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 10"

[[node]]
id = "remark_8_11"
kind = "theorem"
desc = '''Remark 11: for bounded `I` and `1 ≤ p, q ≤ ∞`, the norm `‖u'‖_p + ‖u‖_q` is equivalent to the
`W^{1,p}(I)` norm: `∃ C₁ C₂ > 0, ∀ u, ‖u‖ ≤ C₁ (‖deriv u 1‖ + ‖fn u‖_{L^q}) ∧ ‖deriv u 1‖ + ‖fn u‖_{L^q} ≤ C₂ ‖u‖`.
The backbone's `SobolevIntervalLp.norm_equiv_of_bounded`. ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.norm_equiv_of_bounded"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 11"

[[node]]
id = "remark_8_12"
kind = "theorem"
desc = '''Remark 12: for an unbounded `I`, `u ∈ W^{1,p}(I)` and `p ≤ q ≤ ∞`, `MemLp (fn u) q (volume.restrict I)`,
with `∫_I |u|^q ≤ ‖u‖_∞^{q−p} ‖u‖_p^p`. The backbone's `SobolevIntervalLp.toLp`'s
`memLp_of_le`. The "in general `u ∉ L^q` for `q < p`" (Exercise 8.1) is not planned. ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.toLp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 12"

[[node]]
id = "corollary_8_9"
kind = "theorem"
desc = '''Corollary 8.9: for an unbounded `I` and `u : SobolevIntervalLp 1 p I`, `1 ≤ p < ∞`,
`Tendsto (rep u) (Filter.cocompact ℝ ⊓ 𝓟 (I : Set ℝ)) (𝓝 0)` — `u(x) → 0` as `|x| → ∞`, `x ∈ I`.
The backbone's `SobolevIntervalLp.tendsto_rep_cocompact`. ★'''
deps = ["theorem_8_2", "SobolevIntervalLp.tendsto_rep_cocompact"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 8.9"

[[node]]
id = "corollary_8_10"
kind = "theorem"
desc = '''Corollary 8.10: for `u v : SobolevIntervalLp 1 p I`, `1 ≤ p ≤ ∞`: `MemSobolevSpace p I (rep u * rep v)`
with `(uv)' = u' v + u v'` (`corollary_8_10_deriv`), and integration by parts
`∫ t in y..x, deriv u 1 t * rep v t = rep u x * rep v x - rep u y * rep v y - ∫ t in y..x, rep u t * deriv v 1 t`
for all `x, y ∈ closure I` (`corollary_8_10_parts`). The backbone's
`SobolevIntervalLp.memSobolevIntervalLp_mul`, `hasWeakDerivOn_rep_mul`,
`integral_deriv_mul_add_mul_deriv`; footnote 8 ("`W^{1,p}` is a Banach algebra") is
`SobolevIntervalLp.mul`'s `norm_mul_le`. ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.memSobolevIntervalLp_mul", "SobolevIntervalLp.hasWeakDerivOn_rep_mul", "SobolevIntervalLp.integral_deriv_mul_add_mul_deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 8.10"

[[node]]
id = "corollary_8_11"
kind = "theorem"
desc = '''Corollary 8.11: for `G : ℝ → ℝ` with `ContDiff ℝ 1 G`, `G 0 = 0`, and `u : SobolevIntervalLp 1 p I`,
`1 ≤ p ≤ ∞`: `MemSobolevSpace p I (G ∘ rep u)` with `(G ∘ u)' = (G' ∘ u) u'`; footnote 9: without
`G 0 = 0` when `I` is bounded (`corollary_8_11_of_bounded`). The backbone's
`SobolevIntervalLp.memSobolevIntervalLp_comp`. ★'''
deps = ["theorem_8_8", "SobolevIntervalLp.memSobolevIntervalLp_comp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 8.11"

[[node]]
id = "sobolevSpaceHigher"
kind = "definition"
desc = '''The book's inductive `W^{m,p}(I) = {u ∈ W^{m−1,p} : u' ∈ W^{m−1,p}}`, `m ≥ 2`, as a predicate
`MemSobolevSpaceHigher p I : ℕ → (ℝ → ℝ) → Prop` defined by recursion (`m = 1` being
`MemSobolevSpace`), and `abbrev sobolevSpaceHigher (m p) (I) := SobolevIntervalLp m p I` with
`Hm (m) (I) := sobolevSpaceHigher m 2 I`; `memSobolevSpaceHigher_iff : MemSobolevSpaceHigher p I m u ↔ MemSobolevIntervalLp u m p I`
by `memSobolevIntervalLp_succ_iff` (induction on `m`). ★'''
deps = ["MemSobolevSpace", "memSobolevIntervalLp_succ_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}, Definition"

[[node]]
id = "memSobolevSpaceHigher_iff_forall_integral"
kind = "theorem"
desc = '''The "easily shown" characterization: `u ∈ W^{m,p}(I)` iff `u ∈ L^p(I)` and there are
`g_1, …, g_m ∈ L^p(I)` with `∫ u D^j φ = (−1)^j ∫ g_j φ` for all `φ : 𝓓(I, ℝ)`, `j = 1, …, m`;
the successive derivatives `D^j u = g_j` are `SobolevIntervalLp.deriv u j`. The backbone's
`SobolevIntervalLp.memSobolevIntervalLp_iff_forall_integral`. ★'''
deps = ["sobolevSpaceHigher", "SobolevIntervalLp.memSobolevIntervalLp_iff_forall_integral"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}"

[[node]]
id = "sobolevNormHigher"
kind = "theorem"
desc = '''The norm `‖u‖_{W^{m,p}} = ‖u‖_p + ∑_{α=1}^m ‖D^α u‖_p` as a function on `SobolevIntervalLp m p I`
(`sobolevNormHigher`), equivalent to the norm of the type (`sobolevNormHigher_equiv`, from
`SobolevIntervalLp.norm_deriv_le`'s comparisons), and the `H^m` scalar product
`(u, v)_{H^m} = (u, v)_{L²} + ∑_{α=1}^m (D^α u, D^α v)_{L²}` (`inner_Hm`, `SobolevIntervalLp.inner_eq`).
★'''
deps = ["sobolevSpaceHigher", "SobolevIntervalLp.norm_deriv_le", "SobolevIntervalLp.inner_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}"

[[node]]
id = "interpolationInequality"
kind = "theorem"
desc = '''The unnumbered interpolation inequality of the `W^{m,p}` paragraph: for `1 ≤ j ≤ m − 1` and
every `ε > 0` there is `C` (depending on `ε` and `|I| ≤ ∞`) with
`‖D^j u‖_p ≤ ε ‖D^m u‖_p + C ‖u‖_p` for all `u ∈ W^{m,p}(I)`; hence `‖u‖_p + ‖D^m u‖_p` is a norm
equivalent to `‖u‖_{W^{m,p}}` (`interpolationInequality_norm_equiv`). The backbone's
`SobolevIntervalLp.eLpNorm_deriv_le_mul_add` (direct mean-value route) and its corollary
`norm_equiv_top`; the book cites Adams and, for `|I| < ∞`, Exercise 8.6. ★'''
deps = ["sobolevNormHigher", "SobolevIntervalLp.eLpNorm_deriv_le_mul_add"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}"

[[node]]
id = "sobolevSpaceHigher_subset_contDiff"
kind = "theorem"
desc = '''The closing sentence of the `W^{m,p}` paragraph: for bounded `I = (a, b)`, `W^{m,p}(I) ⊂ C^{m−1}(Ī)`
