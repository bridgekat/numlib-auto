[[node]]
id = "sobolevNorm"
kind = "definition"
desc = '''The book's norm: `sobolevNorm (u : SobolevIntervalLp 1 p I) : ℝ := ‖deriv u 0‖ + ‖deriv u 1‖`
(`‖u‖_{W^{1,p}} = ‖u‖_{L^p} + ‖u'‖_{L^p}`), and its equivalence with the norm of the type
`(‖u‖_p^p + ‖u'‖_p^p)^{1/p}` — the book's "sometimes, if `1 < p < ∞`, the equivalent norm" —
`sobolevNorm_equiv : ‖u‖ ≤ sobolevNorm u ∧ sobolevNorm u ≤ 2 * ‖u‖`
(`SobolevIntervalLp.norm_deriv_le`'s two comparisons). `sobolevNorm_eq_norm_of_one : sobolevNorm u = ‖u‖` at `p = 1`. ★'''
deps = ["sobolevSpace", "SobolevIntervalLp.norm_deriv_le", "SobolevIntervalLp.norm_eq_sum"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Notation"

[[node]]
id = "inner_H1"
kind = "theorem"
desc = '''The scalar product of `H¹`: `⟪u, v⟫_ℝ = ∫ x in I, (fn u x * fn v x + deriv u 1 x * deriv v 1 x)`
for `u v : SobolevIntervalLp 1 2 I` (`(u, v)_{H¹} = (u, v)_{L²} + (u', v')_{L²}`), and
`norm_H1_sq : ‖u‖ ^ 2 = ‖deriv u 0‖ ^ 2 + ‖deriv u 1‖ ^ 2`. The backbone's
`SobolevIntervalLp.inner_eq`/`inner_eq_integral`. ★'''
deps = ["sobolevSpace", "SobolevIntervalLp.inner_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Notation"

