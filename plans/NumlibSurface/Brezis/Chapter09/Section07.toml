namespace = "Brezis.Chapter09"
desc = '''
Brezis §9.7, the maximum principle: Theorem 9.27 (Stampacchia's truncation for the Dirichlet
problem of `-Δu + u = f` on an arbitrary open set), Corollary 9.28, Remark 27 (the classical
proof, which extends to general operators), Proposition 9.29 (general elliptic operators with
`a₀ ≥ 0`), Proposition 9.30 (the Neumann problem). Everything delegates to
`Numlib/Analysis/PDE/Elliptic/MaximumPrinciple`.

The book writes `sup_Γ u` and `sup_Ω f` with "sup = essential sup"; the surface states the
bounds with an explicit `K` (`u ≤ K` on `Γ` and `f ≤ K` a.e. give `u ≤ K` on `Ω`), which is the
book's statement when `K < ∞` and vacuous otherwise, and the `iInf`/`iSup` displays of (70), (74),
(80), (81) are the same statements read at `K = sup …` under a boundedness hypothesis. "`u ∈ C(Ω̄)`"
is a representative continuous on `closure Ω`; the footnotes 35, 37, 38 ("the assumption
`u ∈ C(Ω̄)` can be removed if `u ∈ H^1_0(Ω)`") are the `_of_mem_zero` variants.

Proposition 9.29 is proved by the book only for `a_i ≡ 0`; the general statement is a node with
the route of Gilbarg–Trudinger, Theorem 8.1, in the backbone, and the drift-free case is a
separate node so that what the book proves is on the record on its own.
'''

[[node]]
id = "theorem_9_27"
kind = "theorem"
desc = '''Theorem 9.27 (maximum principle for the Dirichlet problem): for `Ω ⊆ ℝ^N` open,
`f ∈ L²(Ω)` and `u ∈ H^1(Ω) ∩ C(Ω̄)` with `∫ ∇u·∇φ + ∫ uφ = ∫ fφ` for all `φ ∈ H^1_0(Ω)` (70), for
all `x ∈ Ω`: `min {inf_Γ u, inf_Ω f} ≤ u(x) ≤ max {sup_Γ u, sup_Ω f}` (71). Stated as: if `u ≤ K`
on `frontier Ω` and `f ≤ K` a.e. on `Ω` then `u ≤ K` on `Ω`, and the symmetric lower bound;
`Elliptic.le_of_le_frontier` and `Elliptic.ge_of_ge_frontier`, both cases `|Ω| < ∞` and
`|Ω| = ∞` of the book's proof. The truncation `G ∈ C¹` of the proof is `Elliptic.exists_truncation`,
and the chain rule placing `G(u - K)` in `H^1(Ω)` is Proposition 9.5, its membership of
`H^1_0(Ω)` Theorem 9.17. The proof's "proceed as in the proof of Theorem 8.18" refers to the
one-dimensional maximum principle, which is Theorem 8.19. ★'''
deps = ["IsWeakSolutionDirichlet", "Elliptic.le_of_le_frontier", "proposition_9_5", "theorem_9_17", "Brezis.Chapter08.theorem_8_19"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.27"

[[node]]
id = "theorem_9_27_of_mem_zero"
kind = "theorem"
desc = '''Theorem 9.27, footnote 35: for `u ∈ H^1_0(Ω)` the assumption `u ∈ C(Ω̄)` can be removed —
if `f ≤ K` a.e. with `K ≥ 0` then `u ≤ K` a.e. on `Ω`, and if `K ≤ f` a.e. with `K ≤ 0` then
`K ≤ u` a.e. `Elliptic.le_of_mem_zero`, `Elliptic.ge_of_mem_zero`. ★'''
deps = ["theorem_9_27", "Elliptic.le_of_mem_zero"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.27"

[[node]]
id = "corollary_9_28"
kind = "theorem"
desc = '''Corollary 9.28, (73): for `f ∈ L²(Ω)` and `u ∈ H^1(Ω) ∩ C(Ω̄)` satisfying (70), if `u ≥ 0`
on `Γ` and `f ≥ 0` in `Ω` then `u ≥ 0` in `Ω`. `Elliptic.nonneg_of_nonneg_frontier`. ★'''
deps = ["theorem_9_27", "Elliptic.nonneg_of_nonneg_frontier"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.28"

[[node]]
id = "corollary_9_28_bound"
kind = "theorem"
desc = '''Corollary 9.28, (74): `‖u‖_{L^∞(Ω)} ≤ max {‖u‖_{L^∞(Γ)}, ‖f‖_{L^∞(Ω)}}`, for `u` bounded on
`Γ` and `f ∈ L^∞(Ω)`; with the two particular cases `corollary_9_28_zero_load` (`f = 0` gives
`‖u‖_{L^∞(Ω)} ≤ ‖u‖_{L^∞(Γ)}`) and `corollary_9_28_zero_boundary` (`u = 0` on `Γ` gives
`‖u‖_{L^∞(Ω)} ≤ ‖f‖_{L^∞(Ω)}`). `Elliptic.essSup_abs_le_max` and its two specializations. ★'''
deps = ["theorem_9_27", "Elliptic.nonneg_of_nonneg_frontier"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.28"

[[node]]
id = "remark_9_27"
kind = "theorem"
desc = '''Remark 27, the other proof of Theorem 9.27 for classical solutions: if `Ω` is bounded
and `u ∈ C(Ω̄) ∩ C²(Ω)` satisfies `-Δu + u = f` in `Ω` (76) with `f ≤ K` on `Ω` and `u ≤ K` on `Γ`,
then `u ≤ K` on `Ω` — at an interior maximum `x₀`, `∇u(x₀) = 0` and `Δu(x₀) ≤ 0`, so
`u(x₀) = f(x₀) + Δu(x₀) ≤ K`. `Elliptic.le_of_classical` at `a_ij = δ_ij`, `a_i = 0`. ★'''
deps = ["Elliptic.le_of_classical", "IsClassicalSolutionDirichlet"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 27"

[[node]]
id = "remark_9_27_general"
kind = "theorem"
desc = '''Remark 27, the general operator: the conclusion of Theorem 9.27 holds for classical
solutions `u ∈ C(Ω̄) ∩ C²(Ω)` of `-∑ ∂_j(a_ij ∂_i u) + ∑ a_i ∂_i u + u = f` in a bounded `Ω` (77),
with `a_ij ∈ C¹` symmetric elliptic and `a_i` continuous: at an interior maximum
`∑ a_ij(x₀) ∂_i∂_j u(x₀) ≤ 0` (78), by diagonalizing `a_ij(x₀)`. `Elliptic.le_of_classical`. The
remark's last sentence — the same for *weak* solutions of (77), "the proof is more delicate;
see Gilbarg–Trudinger" — is not a node; its drift-free instance is Proposition 9.29. ★'''
deps = ["Elliptic.le_of_classical", "ellipticityCondition"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 27"

[[node]]
id = "proposition_9_29_zero_drift"
kind = "theorem"
desc = '''Proposition 9.29, (79), in the case `a_i ≡ 0` the book proves: for `a_ij ∈ L^∞(Ω)`
elliptic, `a₀ ∈ L^∞(Ω)` with `a₀ ≥ 0`, `f ∈ L²(Ω)` and `u ∈ H^1(Ω) ∩ C(Ω̄)` with
`∫ ∑ a_ij ∂ᵢu ∂ⱼφ + ∫ a₀ u φ = ∫ f φ` for all `φ ∈ H^1_0(Ω)`: if `u ≥ 0` on `Γ` and `f ≥ 0` in `Ω`
then `u ≥ 0` in `Ω`. `Elliptic.nonneg_of_nonneg_frontier_general_zero_drift`; the proof tests
with `G(u)`, uses ellipticity, the auxiliary `H(t) = ∫₀ᵗ √G'`, and footnote 39
(`SobolevMultiIndexZero.eq_zero_of_gradient_eq_zero`: a `W^{1,p}_0` function with zero gradient
vanishes, by Proposition 9.18 and Remark 7). Footnote 38's `H^1_0` form is
`Elliptic.nonneg_of_mem_zero_general_zero_drift`. ★'''
deps = ["IsWeakSolutionGeneralElliptic", "ellipticityCondition", "Elliptic.nonneg_of_nonneg_frontier_general_zero_drift", "SobolevMultiIndexZero.eq_zero_of_gradient_eq_zero", "proposition_9_18", "remark_9_7"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.29"

[[node]]
id = "proposition_9_29"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). Proposition 9.29, (79), as stated — with `a_i ∈ L^∞(Ω)` arbitrary: under the hypotheses
of `proposition_9_29_zero_drift` with the drift term `∫ ∑ a_i ∂ᵢu φ` in the equation (78), if
`u ≥ 0` on `Γ` and `f ≥ 0` in `Ω` then `u ≥ 0` in `Ω`. The book proves only the case `a_i ≡ 0` and
refers to Gilbarg–Trudinger, Theorem 8.1, for the general one; the backbone node
`Elliptic.nonneg_of_nonneg_frontier_general` records that route (the truncation `(u - l)^+` and
the Sobolev inequality of Remark 20 on `W^{1,2}_0(Ω)`), ~600 lines, and is the lowest priority of
the section. ★'''
deps = ["proposition_9_29_zero_drift", "Elliptic.nonneg_of_nonneg_frontier_general", "remark_9_20"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.29"

[[node]]
id = "proposition_9_29_inf"
kind = "theorem"
desc = '''Proposition 9.29, (80): if moreover `a₀ ≡ 0` and `Ω` is bounded, then `f ≥ 0` in `Ω`
implies `u ≥ inf_Γ u` in `Ω` (stated as: `u ≥ K` on `Γ` gives `u ≥ K` on `Ω`).
`Elliptic.ge_iInf_frontier_of_nonneg`, from (79) applied to `u - K`, which satisfies (78) because
`a₀ = 0` and the constant `K` is in `H^1(Ω)` for bounded `Ω`; stated for general `a_i` on
`proposition_9_29` and, as `proposition_9_29_inf_zero_drift`, for `a_i ≡ 0` on the proved case.
★'''
deps = ["proposition_9_29", "proposition_9_29_zero_drift", "Elliptic.ge_iInf_frontier_of_nonneg"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.29"

[[node]]
id = "proposition_9_29_sup_inf"
kind = "theorem"
desc = '''Proposition 9.29, (81): if `a₀ ≡ 0`, `Ω` is bounded and `f = 0` in `Ω`, then
`inf_Γ u ≤ u ≤ sup_Γ u` in `Ω`: (80) for `u` and for `-u`. `Elliptic.le_iSup_frontier_of_zero`
with `proposition_9_29_inf`. ★'''
deps = ["proposition_9_29_inf", "Elliptic.ge_iInf_frontier_of_nonneg"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.29"

[[node]]
id = "proposition_9_30"
kind = "theorem"
desc = '''Proposition 9.30 (maximum principle for the Neumann problem): for `f ∈ L²(Ω)` and
`u ∈ H^1(Ω)` with `∫ ∇u·∇φ + ∫ uφ = ∫ fφ` for all `φ ∈ H^1(Ω)`, `inf_Ω f ≤ u(x) ≤ sup_Ω f` for
a.e. `x ∈ Ω` (82): stated as `f ≤ K` a.e. gives `u ≤ K` a.e. and symmetrically.
`Elliptic.le_of_neumann`, `Elliptic.ge_of_neumann`. ★'''
deps = ["IsWeakSolutionNeumann", "Elliptic.le_of_neumann"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.30"
