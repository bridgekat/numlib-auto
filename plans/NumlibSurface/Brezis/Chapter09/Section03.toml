[[node]]
id = "remark_9_16"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). Remark 16 (the limiting case `p = N`): on `Ω = {x ∈ ℝ^N : |x| < 1/2}`, `N ≥ 2`, and for
`0 < α < 1 − 1/N`, the function `u x = (log (1/|x|))^α` belongs to `W^{1,N}(Ω)` but not to
`L^∞(Ω)`. The backbone's `memSobolevMultiIndex_logRpow` (`EmbeddingDomain`, via the
removable-singularity lemma of `RemovableSingularity.lean`). Trudinger's inequality is quoted
without proof and is not planned. ★

Blocked (2026-09-19, surf9): the dependency `memSobolevMultiIndex_logRpow` is open (not
attempted by sob8/sob11, ~400 lines of backbone work); the surface restatement is the book's
sentence on the backbone node (an element of `sobolevSpace N N (ball 0 (1/2))` whose function is
`(log (1/|x|))^α` a.e., together with `¬ MemLp … ⊤`), ten lines once it lands.'''
deps = ["sobolevSpace", "memSobolevMultiIndex_logRpow"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 16"
