clause, `e_n ∈ L^∞(Ω)` for a general bounded `Ω`, is quoted without proof and is not a node. ★'''
deps = ["theorem_9_31", "IsOfClassC", "theorem_9_25_smooth", "Elliptic.exists_contDiffOn_closure_eigenfunction"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 29"

[[node]]
id = "remark_9_30"
kind = "theorem"
desc = '''Remark 30: for `a_ij ∈ L^∞(Ω)` elliptic and symmetric (`a_ij = a_ji`, a hypothesis the
book omits and without which there is no orthonormal basis of eigenfunctions) and
`a₀ ∈ L^∞(Ω)`, on a bounded nonempty `Ω`, there are a Hilbert basis `(e_n)` of `L²(Ω)` and reals
`λ_n → +∞` with `e_n ∈ H^1_0(Ω)` and `∫ ∑ a_ij ∂ᵢe_n ∂ⱼφ + ∫ a₀ e_n φ = λ_n ∫ e_n φ` for all
`φ ∈ H^1_0(Ω)` (84). `Elliptic.exists_hilbertBasis_eigen_general`, the same construction after
shifting the form by Gårding's constant. ★'''
deps = ["theorem_9_31", "ellipticityCondition", "Elliptic.exists_hilbertBasis_eigen_general"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 30"
