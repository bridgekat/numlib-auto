[[node]]
id = "example_9_1_stepA"
kind = "theorem"
desc = '''Example 1, Step A: every classical solution of (31) is a weak solution — for
`IsClassicalSolutionDirichlet Ω f u` (the faithful reading of `u ∈ C²(Ω̄)`: `ContDiffOnClosure ℝ 2 u Ω`
with `u` continuous on `closure Ω`) on a bounded `Ω`, with `f ∈ L²(Ω)`, there is `U ∈ H^1_0(Ω)`
whose function is `u` a.e. on `Ω` with `IsWeakSolutionDirichlet Ω f U`. The book's proof uses
Theorem 9.17 (i) ⇒ (ii) (and Remark 19, that this direction needs no regularity of `Ω`) to place
`u` in `H^1_0`, and the density of `C_c^1(Ω)` in `H^1_0(Ω)`. Proved under Mathlib's stronger
reading `ContDiffOn ℝ 2 u (closure Ω)` as `example_9_1_stepA_of_contDiffOn`. ★

Blocked (2026-09-20, surf10): the backbone's `Elliptic.isGalerkinSolution_laplace_of_classical`
takes `hu : ContDiffOn ℝ 2 u (closure Ω)`, which the faithful `ContDiffOnClosure` reading does not
imply; its proof uses the closure hypothesis only for the bounds on `u` and `∇u` over `Ω` and the
continuity of `u` on `closure Ω`, all of which `ContDiffOnClosure ℝ 2 u Ω ∧ ContinuousOn u (closure Ω)`
provides (the extension of `iteratedFDeriv 1 u` is continuous on the compact closure). Restating
that backbone theorem with the weaker hypotheses (~10 lines changed) closes this node in two
lines.'''
deps = ["IsClassicalSolutionDirichlet", "IsWeakSolutionDirichlet", "Elliptic.isGalerkinSolution_laplace_of_classical", "theorem_9_17"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 1"

