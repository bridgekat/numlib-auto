`a_ij : ℝ^N → ℝ`, `1 ≤ i, j ≤ N`: `∑ᵢⱼ a_ij x ξ_i ξ_j ≥ α |ξ|²` for all `x ∈ Ω`, all
`ξ ∈ ℝ^N`, with `α > 0`. Stated pointwise on `Ω` for functions; `ellipticityCondition_iff` relates
