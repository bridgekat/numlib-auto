[[node]]
id = "example_9_4_stepA"
kind = "theorem"
desc = '''Example 4, Step A: for `Ω` bounded of class `C¹`, every classical solution of the Neumann
problem (44) (`IsClassicalSolutionNeumann Ω n f u`, for the outward unit normal `n`) is the
function of a weak solution (`IsWeakSolutionNeumann Ω f U`). The proof is Green's formula
`∫_Ω (Δu) v = ∫_Γ (∂u/∂n) v dσ - ∫_Ω ∇u·∇v` for `u ∈ C²(Ω̄)`, `v ∈ C¹(Ω̄)`, followed by the
density of `C¹(Ω̄)` in `H^1(Ω)` (Corollary 9.8).

Blocked: Green's formula with a boundary term needs the surface measure `dσ` on `Γ` and the
divergence theorem on a `C¹` domain, neither of which Mathlib has
(`MeasureTheory.integral_divergence_of_hasFDerivAt_off_countable` is for boxes; `notes/frontier.md`
blocker 2, `notes/fem-roadmap.md` Decision C). The statement itself is meaningful, since the
classical solution's normal derivative is a pointwise object; only the proof is missing.
Estimate: the whole boundary-measure programme.'''
deps = ["IsClassicalSolutionNeumann", "IsWeakSolutionNeumann", "corollary_9_8"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 4"

