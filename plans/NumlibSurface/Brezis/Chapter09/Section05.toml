[[node]]
id = "example_9_3_stepA"
kind = "theorem"
desc = '''Example 3, "as above, any classical solution is a weak solution": for `Ω` bounded,
`a_ij ∈ C¹(Ω̄)`, `a₀ ∈ C(Ω̄)`, a classical solution of (37) (`IsClassicalSolutionElliptic Ω a a₀ f u`)
is the function of a weak solution (`IsWeakSolutionElliptic Ω a a₀ f U`). The integration by
parts `∫ ∂ⱼ(a_ij ∂ᵢu) v = −∫ a_ij ∂ᵢu ∂ⱼv` for `v ∈ 𝓓(Ω)` is the weak-derivative identity of the
`C¹` function `a_ij ∂ᵢu` (`ContDiffOn.hasWeakIteratedFDerivOn`), the rest is as in
`example_9_1_stepA`; there is no backbone node for it because Step A for the general operator
is only asserted, and it is the same 200 lines as the Laplacian case with the coefficients
carried along. ★★

Blocked (2026-09-20, surf10): no backbone node (the coefficient-carrying integration by parts and
the density argument are backbone work, ~200 lines in `Numlib/Analysis/PDE/Elliptic/Dirichlet.lean`,
beside `Elliptic.isGalerkinSolution_laplace_of_classical`); not surface material.'''
deps = ["IsClassicalSolutionElliptic", "IsWeakSolutionElliptic", "ContDiffOn.hasWeakIteratedFDerivOn", "theorem_9_17_mp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 3"

