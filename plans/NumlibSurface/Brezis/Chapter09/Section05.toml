namespace = "Brezis.Chapter09"
desc = '''
Brezis §9.5, variational formulation of some boundary value problems: the homogeneous Dirichlet
problem for `-Δu + u = f` (Example 1, Theorem 9.21), the inhomogeneous Dirichlet condition
(Example 2, Proposition 9.22), general second-order elliptic equations (Example 3, Theorem 9.23,
Remark 23), the homogeneous Neumann problem (Example 4, Proposition 9.24) and unbounded domains
(Example 5). Every statement is over `H^1(Ω) = SobolevEuclidean N 1 2 Ω` and
`H^1_0(Ω) = SobolevEuclideanZero N 1 2 Ω` of `Numlib/Analysis/PDE/Elliptic/Dirichlet`, the
book's integrals are the forms `Elliptic.laplaceForm`, `Elliptic.generalForm` and the load
`Elliptic.load` unfolded by their `_apply` lemmas, and the weak problems are `IsGalerkinSolution`;
the book's definitions are restated here with their integrals and bridged by `_iff` lemmas.

The four "Steps" of Example 1 are: A, a classical solution is a weak one
(`example_9_1_stepA`); B, Theorem 9.21; C, regularity, which is §9.6; D, a `C²` weak solution is
classical (`example_9_1_stepD`). Example 4's Step A (Green's formula) and the boundary half of
its Step D need the surface measure on `Γ` and are blocked (`notes/frontier.md` blocker 2);
its interior half is `example_9_4_stepD_interior`.

Not included as nodes: the discussion opening Example 5 (the condition at infinity "translates"
into `u ∈ H^1`), and footnote 22 (traces); Comment 10 (a), the duality method for `f ∈ L¹`, is a
Comment and is listed in the chapter description.
'''

[[node]]
id = "IsClassicalSolutionDirichlet"
kind = "definition"
desc = '''Definition (§9.5, Example 1): a classical solution of (31), `-Δu + u = f` in `Ω`, `u = 0`
on `Γ = ∂Ω`, for `Ω ⊆ ℝ^N` open and bounded: a function `u : EuclideanSpace ℝ (Fin N) → ℝ` with
`ContDiffOnClosure 2 u Ω` (the book's `u ∈ C²(Ω̄)`, chapter 9's footnote 16: `C²` on `Ω` with
the derivatives of order `≤ 2` extending continuously to `closure Ω` —
`Numlib/Analysis/Calculus/ContDiffOnClosure`; Mathlib's `ContDiffOn ℝ 2 u (closure Ω)` is a
stronger hypothesis on an irregular `Ω` and would weaken the "classical ⇒ weak" theorems that
consume this definition), `-Δ u x + u x = f x` for every `x ∈ Ω` with Mathlib's Laplacian `Δ`
(`InnerProductSpace.instLaplacian`), and `u x = 0` for every `x ∈ frontier Ω`. The datum `f` is a
function on `ℝ^N`, read on `Ω`. The same reading of `C^k(Ω̄)` applies to every classical-solution
definition of this section (Examples 2–4).'''
deps = ["ContDiffOnClosure"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.5, Definition"

[[node]]
id = "IsWeakSolutionDirichlet"
kind = "definition"
desc = '''Definition (§9.5, Example 1): a weak solution of (31): `u ∈ H^1_0(Ω)` with
`∫_Ω ∑ᵢ ∂ᵢu ∂ᵢv + ∫_Ω u v = ∫_Ω f v` for all `v ∈ H^1_0(Ω)` (32), for `f ∈ L²(Ω)`; stated with the
integrals of the weak derivatives `SobolevMultiIndex.weakDeriv`. The bridge
`isWeakSolutionDirichlet_iff : IsWeakSolutionDirichlet Ω f u ↔ IsGalerkinSolution (Elliptic.laplaceForm Ω) (Elliptic.load Ω f) (SobolevEuclideanZero N 1 2 Ω) u`
is `Elliptic.laplaceForm_apply` and `Elliptic.load_apply`.'''
deps = ["Elliptic.laplaceForm", "Elliptic.load", "IsGalerkinSolution"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.5, Definition"

[[node]]
id = "example_9_1_stepA"
kind = "theorem"
desc = '''Example 1, Step A: every classical solution of (31) is a weak solution — for
`IsClassicalSolutionDirichlet Ω f u` with `f ∈ L²(Ω)` there is `U ∈ H^1_0(Ω)` whose function is
`u` a.e. on `Ω` with `IsWeakSolutionDirichlet Ω f U`. This is
`Elliptic.isGalerkinSolution_laplace_of_classical`; the book's proof uses Theorem 9.17 (i) ⇒ (ii)
(and Remark 19, that this direction needs no regularity of `Ω`) to place `u` in `H^1_0`, and the
density of `C_c^1(Ω)` in `H^1_0(Ω)`. ★'''
deps = ["IsClassicalSolutionDirichlet", "IsWeakSolutionDirichlet", "Elliptic.isGalerkinSolution_laplace_of_classical", "theorem_9_17"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 1"

[[node]]
id = "theorem_9_21"
kind = "theorem"
desc = '''Theorem 9.21 (Dirichlet, Riemann, Poincaré, Hilbert): for `Ω ⊆ ℝ^N` open (bounded in the
book; not needed) and `f ∈ L²(Ω)` there is a unique weak solution `u ∈ H^1_0(Ω)` of (31):
`∃! u, IsWeakSolutionDirichlet Ω f u`. Through `isWeakSolutionDirichlet_iff` this is
`Elliptic.existsUnique_isGalerkinSolution_laplace`, i.e. Lax–Milgram (Corollary 5.8) for the
form `a(u, v) = ∫ (∇u·∇v + uv)`, which is the `H^1` inner product
(`Elliptic.laplaceForm_eq_innerSL`), on the Hilbert space `H^1_0(Ω)`. ★'''
deps = ["IsWeakSolutionDirichlet", "Elliptic.existsUnique_isGalerkinSolution_laplace", "Brezis.Chapter05.corollary_5_8"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.21"

[[node]]
id = "theorem_9_21_isMinOn"
kind = "theorem"
desc = '''Theorem 9.21, Dirichlet's principle: the weak solution `u` of (31) is the minimizer over
`H^1_0(Ω)` of `v ↦ ½ ∫_Ω (∑ᵢ (∂ᵢv)² + v²) - ∫_Ω f v`, and conversely a minimizer is the weak
solution: `IsMinOn E (H^1_0(Ω)) u ↔ IsWeakSolutionDirichlet Ω f u` for `u ∈ H^1_0(Ω)`.
`Elliptic.isMinOn_energy_iff_isGalerkinSolution_laplace`, with the energy unfolded to the book's
integral. ★'''
deps = ["theorem_9_21", "Elliptic.isMinOn_energy_iff_isGalerkinSolution_laplace"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.21"

[[node]]
id = "example_9_1_stepD"
kind = "theorem"
desc = '''Example 1, Step D, recovery of a classical solution: if `Ω` is bounded and of class `C¹`
and the weak solution `U ∈ H^1_0(Ω)` of (31) has a representative `u` with
`ContDiffOn ℝ 2 u (closure Ω)`, then `u = 0` on `frontier Ω` (Theorem 9.17 (ii) ⇒ (i)) and
`-Δu + u = f` a.e. on `Ω` (Corollary 4.24 through
`Elliptic.laplacian_ae_eq_of_isGalerkinSolution`); if `f` is continuous on `Ω` the equation holds
at every point of `Ω`, so `u` is a classical solution (`example_9_1_stepD_of_continuous`, with
`IsClassicalSolutionDirichlet`). The book's "in fact everywhere, since `u ∈ C²(Ω)`" presumes a
continuous `f`; `f ∈ L²` is a class and "everywhere" has no meaning for it. ★'''
deps = ["IsWeakSolutionDirichlet", "IsClassicalSolutionDirichlet", "Elliptic.laplacian_ae_eq_of_isGalerkinSolution", "theorem_9_17", "Brezis.Chapter04.corollary_4_24"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 1"

[[node]]
id = "admissibleSetInhomogeneous"
kind = "definition"
desc = '''Definition (§9.5, Example 2): for `g̃ ∈ H^1(Ω)` (the book: `g̃ ∈ H^1(Ω) ∩ C(Ω̄)` with
`g̃ = g` on `Γ`), the set `K = {v ∈ H^1(Ω) : v - g̃ ∈ H^1_0(Ω)}`, which is
`Elliptic.admissibleSet Ω g̃`.'''
deps = ["Elliptic.admissibleSet"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.5, Definition"

[[node]]
id = "example_9_2"
kind = "theorem"
desc = '''Example 2: `K` is a nonempty closed convex subset of `H^1(Ω)`, and it depends only on
`g`, not on the extension `g̃`: if `g̃₁, g̃₂ ∈ H^1(Ω)` have representatives continuous on
`closure Ω` that agree on `frontier Ω`, then `admissibleSetInhomogeneous Ω g̃₁ = admissibleSetInhomogeneous Ω g̃₂`.
The first three are `Elliptic.admissibleSet_nonempty`, `isClosed_admissibleSet`,
`convex_admissibleSet`; the last is `Elliptic.admissibleSet_eq_of_sub_mem` with
`g̃₁ - g̃₂ ∈ H^1_0(Ω)` by Theorem 9.17 (i) ⇒ (ii), which needs no regularity of `Ω`. ★'''
deps = ["admissibleSetInhomogeneous", "Elliptic.admissibleSet", "theorem_9_17"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 2"

[[node]]
id = "IsWeakSolutionInhomogeneous"
kind = "definition"
desc = '''Definition (§9.5, Example 2): a classical solution of (33) (`IsClassicalSolutionInhomogeneous`:
`u ∈ C²(Ω̄)`, `-Δu + u = f` in `Ω`, `u = g` on `Γ`) and a weak solution of (33): `u ∈ K` with
`∫ (∇u·∇v + uv) = ∫ f v` for all `v ∈ H^1_0(Ω)` (34). With `example_9_2_stepA`, "as above, any
classical solution is a weak solution": for `g̃` continuous on `closure Ω` with `g̃ = g` on `Γ`,
a classical solution `u` has `u - g̃ ∈ H^1 ∩ C(Ω̄)` vanishing on `Γ`, hence in `H^1_0` by Theorem
