[[node]]
id = "theorem_9_23"
kind = "theorem"
desc = '''Theorem 9.23 (the Fredholm alternative for (40)): for `Ω` bounded and `L^∞` coefficients
with `(a_ij)` elliptic, the set of weak solutions of (40) with `f = 0` is a finite-dimensional
subspace of `H^1_0(Ω)`, of dimension `d` say, and there is a subspace `F ⊆ L²(Ω)` of dimension `d`
such that (40) has a solution iff `∫ f v = 0` for all `v ∈ F`: `Elliptic.finiteDimensional_ker_general`
and `Elliptic.exists_orthogonality_iff_exists_solution`. The book's proof: Gårding's inequality
gives `λ` with `a + λ ∫ uv` coercive; the solution operator `T : L² → L²` is compact (Theorem
9.16 and Remark 20, the compactness of `H^1_0 ⊂ L²` on a bounded `Ω`); (40) is `v - λ T v = f`
with `v = f + λ u`; and the Fredholm alternative (Theorem 6.6) concludes. ★'''
deps = ["IsWeakSolutionGeneralElliptic", "Elliptic.finiteDimensional_ker_general", "Elliptic.exists_orthogonality_iff_exists_solution", "theorem_9_16", "remark_9_20", "Brezis.Chapter06.theorem_6_6_a", "Brezis.Chapter06.theorem_6_6_b", "Brezis.Chapter06.theorem_6_6_d"]
