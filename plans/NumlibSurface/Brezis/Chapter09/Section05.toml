[[node]]
id = "example_9_4_stepD"
kind = "theorem"
desc = '''Example 4, Step D, boundary clause: if a weak solution of (44) is `C²(Ω̄)` on a bounded
`C¹` domain then, beyond `-Δu + u = f`, `∂u/∂n = 0` on `Γ`, so `u` is a classical solution
(`IsClassicalSolutionNeumann`). The proof returns to (47) with `v ∈ C¹(Ω̄)` and reads
`∫_Γ (∂u/∂n) v dσ = 0` for all such `v`.

Blocked: as `example_9_4_stepA`, Green's formula with its boundary term and the surface measure
on `Γ` are not available (`notes/frontier.md` blocker 2); the interior clause is
`example_9_4_stepD_interior` and is not blocked.'''
deps = ["example_9_4_stepD_interior", "example_9_4_stepA", "IsClassicalSolutionNeumann"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 4"

