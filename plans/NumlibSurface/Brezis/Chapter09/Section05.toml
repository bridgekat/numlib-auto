desc = '''Example 5 (c), `Ω = ℝ^N_+` with the Neumann condition `∂u/∂x_N (x', 0) = 0`: for
`f ∈ L²(ℝ^N_+)` there is a unique `u ∈ H^1(ℝ^N_+)` with `∫ ∇u·∇v + ∫ uv = ∫ f v` for all
`v ∈ H^1(ℝ^N_+)`: `proposition_9_24` on the half space. ★'''
deps = ["proposition_9_24"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 5"
