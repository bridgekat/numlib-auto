[[node]]
id = "proposition_9_22"
kind = "theorem"
desc = '''Proposition 9.22: for every `f ∈ L²(Ω)` there is a unique weak solution `u ∈ K` of (33),
and `u` minimizes `½ ∫ (|∇v|² + v²) - ∫ f v` over `K`. This is
`Elliptic.existsUnique_isWeakSolution_inhomogeneous`. The book's proof (p. 11017): `u ∈ K` solves
(34) iff it solves the variational inequality (35) `∫ ∇u·∇(v - u) + ∫ u(v - u) ≥ ∫ f(v - u)` for
all `v ∈ K` (`proposition_9_22_iff`, the backbone's
`Elliptic.isWeakSolution_inhomogeneous_iff_forall_le`), and Stampacchia's theorem (Theorem 5.6)
on the nonempty closed convex `K` of `example_9_2` concludes. ★'''
deps = ["IsWeakSolutionInhomogeneous", "example_9_2", "Elliptic.existsUnique_isWeakSolution_inhomogeneous", "Brezis.Chapter05.theorem_5_6"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.22"

[[node]]
id = "ellipticityCondition"
