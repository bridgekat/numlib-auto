[[node]]
id = "example_9_4_stepA"
kind = "theorem"
desc = '''Example 4, Step A: for `Ω` bounded of class `C¹` — `hΩ : IsContDiffDomain 1 Ω`,
`hb : Bornology.IsBounded Ω` (the graph form, equivalent to `IsClassC1` by
`isContDiffDomain_of_isClassC1`), with the outward unit normal `n := hΩ.outwardNormal hb`
(`Numlib/Analysis/Sobolev/Boundary/GraphMeasure.lean`, defined at every point of `Γ`) — every
classical solution of the Neumann problem (44) (`IsClassicalSolutionNeumann Ω n f u`: `u ∈ C²(Ω̄)`,
`−Δu + u = f` on `Ω`, `∂u/∂n = 0` on `Γ`) is the function of a weak solution
(`IsWeakSolutionNeumann Ω f U` with `fn U =ᵐ u`, `f ∈ L²(Ω)` with `u`'s datum as
representative). Restated 2026-09-21 (boundary round). The proof is the book's: Green's formula
`∫_Ω (Δu) v = ∫_Γ (∂u/∂n) v dσ − ∫_Ω ∇u·∇v` for `u ∈ C²(Ω̄)`, `v ∈ C¹(Ω̄)` is
`BoundaryData.integral_laplacian_mul_add_eq` for `B := hΩ.boundaryData hb` (`Data.lean`; the
divergence theorem `IsContDiffDomain.integral_div_eq` on `F = v ∇u`), the boundary term vanishes
by the boundary condition, so `∫ ∇u·∇v + ∫ u v = ∫ f v` for every `v ∈ C_c^∞(ℝ^N)` restricted to
`Ω`, and the density of these in `H¹(Ω)` (`corollary_9_8`, or `SobolevEuclidean.HasSmoothDensity`)
with the continuity of both sides in `v` extends it to all `v ∈ H¹(Ω)`; `u ∈ H¹(Ω)` by
`ContDiffOnClosure.memSobolevMultiIndex_of_isBounded`. ★★, ~120 lines.'''
deps = ["IsClassicalSolutionNeumann", "IsWeakSolutionNeumann", "corollary_9_8", "BoundaryData.integral_laplacian_mul_add_eq", "IsContDiffDomain.boundaryData"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 4"

