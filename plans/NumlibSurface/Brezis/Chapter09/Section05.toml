[[node]]
id = "example_9_2_stepA"
kind = "theorem"
desc = '''Example 2, "as above, any classical solution is a weak solution": for `Ω` bounded, `g̃ ∈ H^1(Ω)`
with a representative continuous on `closure Ω` equal to `g` on `Γ`, and a classical solution `u`
of (33) (`IsClassicalSolutionInhomogeneous Ω f g u`), there is `U ∈ K` (`admissibleSetInhomogeneous Ω g̃`)
whose function is `u` a.e. with `IsWeakSolutionInhomogeneous Ω f g̃ U`: `u − g̃ ∈ H^1 ∩ C(Ω̄)` vanishes
on `Γ`, hence lies in `H^1_0` by Theorem 9.17 (i) ⇒ (ii), and the identity (34) is as in Example 1's
Step A. Split off `IsWeakSolutionInhomogeneous` (surf10, 2026-09-20). ★

Blocked (2026-09-20, surf10): the backbone's `Elliptic.isGalerkinSolution_laplace_of_classical`
bundles the interior identity with the homogeneous boundary condition; this node needs the
interior half on its own — "a `C²(Ω̄)` function `u` on a bounded `Ω` with `-Δu + u = f` in `Ω` is
the function of some `U ∈ H^1(Ω)` with `laplaceForm Ω U v = load Ω f v` for all `v ∈ H^1_0(Ω)`"
(the first two thirds of that proof, ~50 lines, under `ContDiffOnClosure`) — after which the
node is `theorem_9_17_mp` on `U − G` plus that identity, ten lines.'''
deps = ["IsClassicalSolutionInhomogeneous", "IsWeakSolutionInhomogeneous", "theorem_9_17_mp", "Elliptic.isGalerkinSolution_laplace_of_classical"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 2"

