[[node]]
id = "example_9_4_stepD"
kind = "theorem"
desc = '''Example 4, Step D, boundary clause: if a weak solution `U` of (44) on a bounded `C¹` domain
(`hΩ`, `hb`, `n := hΩ.outwardNormal hb`) has a representative `u ∈ C²(Ω̄)` (`ContDiffOnClosure ℝ 2 u Ω`,
`ContinuousOn u (closure Ω)`, with `∇u` extending continuously to `Γ`), then beyond
`−Δu + u = f` (`example_9_4_stepD_interior`) one has `∂u/∂n = 0` at every point of `Γ`, so `u` is
a classical solution (`IsClassicalSolutionNeumann Ω n f u`). Restated 2026-09-21 (boundary
round): return to (47) with `v ∈ C_c^∞(ℝ^N)`: Green's formula `BoundaryData.integral_laplacian_mul_add_eq`
and the interior equation give `∫_Γ (∂u/∂n) v dσ = 0` for all such `v`, so `∂u/∂n = 0` σ-a.e.
(`ae_eq_zero_of_integral_contDiff_smul_eq_zero` on `σ := hΩ.boundaryMeasure hb`, any measure),
and a function continuous on `Γ` vanishing σ-a.e. vanishes everywhere on `Γ` because every
relatively open piece of `Γ` has positive surface measure
(`IsContDiffDomain.boundaryMeasure_pos_of_isOpen`). ★★, ~100 lines.'''
deps = ["example_9_4_stepD_interior", "example_9_4_stepA", "IsClassicalSolutionNeumann", "BoundaryData.integral_laplacian_mul_add_eq", "IsContDiffDomain.boundaryMeasure_pos_of_isOpen"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Example 4"

