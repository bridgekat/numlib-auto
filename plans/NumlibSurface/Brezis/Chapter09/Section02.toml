[[node]]
id = "isContDiffDomain_of_isClassC1"
kind = "theorem"
desc = '''The two readings of "`C^1` domain" agree, the other way: an open set of class `C^1` in
Brezis's sense (`IsClassC1 Ω`, by local charts) is a `C^1` domain in Atkinson–Han's sense
(`IsContDiffDomain 1 Ω`, Definition 7.2.1, the graph definition of
`Numlib/Analysis/Sobolev/Domain`) — `IsContDiffChartDomain.isContDiffDomain`, the
implicit-function-theorem direction, the lowest-priority node of `Chart.toml`. The proved
direction is `isClassC1_of_isContDiffDomain`, the only one consumed (by the Atkinson–Han
restatements of Corollary 9.14, `Chapter09.toml`). ★

Blocked: the backbone dependency `IsContDiffChartDomain.isContDiffDomain` (`Chart.toml`,
deferred ★★★: Mathlib's implicit function theorem on `E₁ × E₂` plus the rotation and splitting
bookkeeping) is open; the surface node is its instance (one line once it lands).'''
deps = ["IsClassC1", "IsContDiffChartDomain.isContDiffDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.2, Definition; Atkinson–Han, Definition 7.2.1"

