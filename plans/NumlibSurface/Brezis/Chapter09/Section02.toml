[[node]]
id = "lemma_9_3"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). Lemma 9.3 (partition of unity): for a compact `Γ ⊆ ℝ^N` and an open cover `U_1, …, U_k`
of `Γ`, there are `θ_0, θ_1, …, θ_k ∈ C^∞(ℝ^N)` with `0 ≤ θ_i ≤ 1`, `∑_{i=0}^k θ_i = 1` on `ℝ^N`,
`supp θ_i` compact with `supp θ_i ⊆ U_i` for `i ≥ 1`, and `supp θ_0 ⊆ ℝ^N ∖ Γ`; and if `Ω` is open
and bounded with `Γ = ∂Ω`, then `θ_0|_Ω ∈ C_c^∞(Ω)` (`tsupport θ_0 ∩ closure Ω` is a compact
subset of `Ω`). The backbone's `IsCompact.exists_contDiff_partitionOfUnity` (`Chart`), from
Mathlib's `SmoothPartitionOfUnity.exists_isSubordinate`; the book gives no proof ("this lemma is
classical"). ★'''
deps = ["IsCompact.exists_contDiff_partitionOfUnity"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.3"

[[node]]
id = "corollary_9_8"
kind = "theorem"
desc = '''Corollary 9.8 (density): if `Ω` is of class `C^1` and `u ∈ W^{1,p}(Ω)`, `1 ≤ p < ∞`, there
is a sequence `u_n ∈ C_c^∞(ℝ^N)` with `u_n|_Ω → u` in `W^{1,p}(Ω)`; "in other words, the
restrictions to `Ω` of `C_c^∞(ℝ^N)` functions form a dense subspace of `W^{1,p}(Ω)`". The
backbone's `SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto` (`Extension`);
`corollary_9_8_bounded`, the bounded-`Γ` case proved through Theorem 9.7 directly,
`SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_isBounded_frontier`. This is
Atkinson–Han's Theorem 7.3.2 at `k = 1` under `C^1`, see `Chapter09.toml`. ★'''
deps = ["IsClassC1", "sobolevSpace", "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto", "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_isBounded_frontier"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.8"
