[[node]]
id = "dual_inclusions_of_le"
kind = "theorem"
desc = '''The Notation paragraph, second display: if `Ω` is bounded then
`W_0^{1,p}(Ω) ⊂ L^2(Ω) ⊂ W^{−1,p'}(Ω)` for `2N/(N+2) ≤ p < ∞` (unbounded `Ω`: for
`2N/(N+2) ≤ p ≤ 2`), with continuous and dense injections — the maps `u ↦ fn u`,
`W_0^{1,p}(Ω) → L^2(Ω)`, and `f ↦ (v ↦ ∫_Ω f v)`, `L^2(Ω) → W^{−1,p'}(Ω)`, are injective, bounded
and have dense range. Split off `dual_inclusions` (surf10, 2026-09-20), which is the `p = 2`
display `H_0^1(Ω) ⊂ L^2(Ω) ⊂ H^{−1}(Ω)`. Route: `W_0^{1,p}(Ω) ⊂ L^2(Ω)` is Remark 20's
`SobolevEuclideanZero.memLp_fn_of_le` (`1/p − 1/N ≤ 1/2` is `2N/(N+2) ≤ p`) with Hölder's
inequality on the finite measure for `p* > 2`; the second map is the transpose of the first
composed with the self-duality of `L^2(Ω)`, injective by the density of `𝓓(Ω)` in `L^2(Ω)`, and
of dense range by the reflexivity of `W_0^{1,p}(Ω)` for `1 < p < ∞` (a functional vanishing on the
range is a `v ∈ W_0^{1,p}(Ω)` orthogonal to `L^2(Ω)`), the case `p = 1` (`N = 2`) needing a
separate argument. ★★

Blocked (2026-09-20, surf10): no backbone node — the plan's `SobolevEuclideanZero.gelfandTriple_of_le`
does not exist in `Zero.lean` (only the `p = 2` `gelfandTriple` does); the general-`p` triple
(the `L^2` membership through Remark 20, the transpose map, its injectivity and density) is
~200 lines of backbone work in `Numlib/Analysis/Sobolev/Zero.lean`, not surface material.'''
deps = ["dualSpace", "sobolevZeroSpace", "SobolevEuclideanZero.gelfandTriple", "SobolevEuclideanZero.memLp_fn_of_le", "SobolevMultiIndexZero.instIsReflexive"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.4, The Dual Space of W_0^{1,p}(Ω), Notation"

