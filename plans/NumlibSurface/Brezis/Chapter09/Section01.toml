[[node]]
id = "remark_9_6"
kind = "theorem"
desc = '''Remark 6: when `p = 1` the implications (i) ⇒ (ii) ⇔ (iii) of Proposition 9.3 remain
true — stated as (i) ⇒ (ii), (i) ⇒ (iii) and (iii) ⇒ (ii) at `p = 1` (`q = ∞`), the three
backbone implications being valid for every `1 ≤ p ≤ ∞`: `proposition_9_3_i_ii` and
`proposition_9_3_i_iii` are already stated for every `p`. The implication (ii) ⇒ (iii) at
`p = 1` — that a function of bounded variation has the translation estimate — is the theory of
`BV` functions and is not planned; the remark's discussion of `BV` has no node. ★

Blocked: on `proposition_9_3_iii_ii` (its (iii) ⇒ (ii) clause); the other two clauses are the
proved nodes at `p = 1`.'''
deps = ["proposition_9_3_i_ii", "proposition_9_3_i_iii", "proposition_9_3_iii_ii"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 6"

