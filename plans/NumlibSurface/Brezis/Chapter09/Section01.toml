[[node]]
id = "remark_9_1"
kind = "theorem"
desc = '''Remark 1: `C_c^1(Ω)` test functions may be used in the definition — for `u ∈ W^{1,p}(Ω)`
and `φ : EuclideanSpace ℝ (Fin N) → ℝ` of class `C^1` with compact support and `tsupport φ ⊆ Ω`,
`∫_Ω u ∂_i φ = −∫_Ω (∂_i u) φ`. The backbone's
`HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one` (`Numlib/Analysis/Sobolev/Cutoff`).
Together with `sobolevSpace_iff` this is the equivalence of the book's definition (with `C_c^1`)
and the surface's (with `𝓓(Ω)`), the equivalence decision D6 asks to record. ★

Blocked: the backbone dependency `HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one`
(`Cutoff.toml`, Remark 1) is open; the surface node is its instance at `y = e_i` through
`hasWeakIteratedLineDerivOn_partialDeriv` (five lines once it lands).'''
deps = ["sobolevSpace", "HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 1"

