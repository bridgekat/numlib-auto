`λ ∈ resolventSet ℂ T` and `‖(T − λ • 1)⁻¹‖ ≤ 1 / Metric.infDist λ W(T)` (as
`Metric.infDist λ W(T) * ‖(T − λ • 1)⁻¹ v‖ ≤ ‖v‖` for all `v`, or the bound on
`resolvent T λ`); (iii) `Convex ℝ W(T)` (Toeplitz–Hausdorff). Backbone:
`ContinuousLinearMap.spectrum_subset_closure_numericalRange`,
`ContinuousLinearMap.mem_resolventSet_of_notMem_closure_numericalRange`,
`LinearMap.convex_numericalRange`; `W(T)` through `numericalRange_eq`. The book quotes (iii) from
Halmos; the backbone proves it. ★'''
