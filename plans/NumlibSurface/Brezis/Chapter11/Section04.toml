[[node]]
id = "proposition_11_26"
kind = "theorem"
desc = '''Proposition 11.26, projection onto a closed convex set of a complex Hilbert space:
for `K ⊆ H` nonempty closed convex (`Convex ℝ K`) and `f : H`, there is a unique `u ∈ K` with
`‖f − u‖ = ⨅ v : K, ‖f − v‖` (`= Metric.infDist f K`), and `u` is characterized by
`u ∈ K ∧ ∀ v ∈ K, (⟪f − u, v − u⟫_ℂ).re ≤ 0` (the book's `Re (f − u, v − u) ≤ 0`; both
inner-product conventions give the same real part). The book's Theorem 5.2 on `H_ℝ`: with
`attribute [local instance] InnerProductSpace.complexToReal` (as the section `Hilbert` of the
module does), chapter 5's `Brezis.Chapter05.theorem_5_2` applies verbatim and
`real_inner_eq_re_inner` reads `⟪·, ·⟫_ℝ` as `re ⟪·, ·⟫_ℂ`; Mathlib's
`exists_norm_eq_iInf_of_complete_convex` and `norm_eq_iInf_iff_real_inner_le_zero` would do
the same directly. ★

Blocked: the dependency `Brezis.Chapter05.theorem_5_2` (surface §5.1, written in parallel by
agent `surf5`) does not exist yet; the module's section `Hilbert` already carries the local
instance and the pattern (`proposition_11_28` reads Theorem 5.6 the same way).'''
deps = ["Brezis.Chapter05.theorem_5_2", "inner_identities"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.26"

