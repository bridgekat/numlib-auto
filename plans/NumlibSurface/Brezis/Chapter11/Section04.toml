namespace = "Brezis.Chapter11"
desc = '''
Brezis §11.4, "Banach spaces over `ℂ`: what is similar and what is different". Here and only here
the surface works over `ℂ`: `E` is a complex Banach space (`[NormedSpace ℂ E]`), `H` a complex
Hilbert space (`[InnerProductSpace ℂ H] [CompleteSpace H]`), and the book's `E_ℝ` is the same
type read through Mathlib's instance `NormedSpace.complexToReal` (for inner product spaces the
real structure `Re (u, v)` is the *definition* `InnerProductSpace.complexToReal`, brought in
locally with `letI`, and `real_inner_eq_re_inner`). The book's sesquilinear conventions are the
transpose of Mathlib's: its `(u, v)` is linear in `u`, Mathlib's `⟪u, v⟫` in `v`, so the book's
`(u, v)` is `⟪v, u⟫ = conj ⟪u, v⟫`; nodes state Mathlib's form and say so.

The section is uneven, and so is its plan. Propositions 11.22–11.29 are the real results of
chapters 1 and 5 applied to `E_ℝ` and transported by the isometry `f ↦ Re f` — each is a short
surface proof over Mathlib's `RCLike` versions (`ContinuousLinearMap.extendRCLikeₗᵢ`,
`exists_extension_norm_eq`, `geometric_hahn_banach_open`, `InnerProductSpace.toDual`) or over the
real surface nodes of chapters 1 and 5 through `complexToReal`. Propositions 11.30–11.37 are the
spectral theory that genuinely needs `ℂ`; there Mathlib is strong (`spectrum.nonempty`, Gelfand's
formula, the polynomial spectral mapping theorem, the C⋆-algebra `H →L[ℂ] H` with
`IsStarNormal.spectralRadius_eq_nnnorm`, `spectrum.subset_circle_of_unitary`) and the backbone
`Numlib/Analysis/Normed/Algebra/Spectrum` supplies what is missing: the eigenvalue half of the
spectral mapping theorem, the numerical-range bounds of 11.33 and Remark 1 (on the
Toeplitz–Hausdorff theorem of `Numlib/Eigen/NumericalRange`), the non-unitary isometry clause of
11.37; the spectral decomposition of compact normal operators (11.36, Remark 2) is
`Numlib/Analysis/InnerProductSpace/CompactSpectral/Normal`. Proposition
11.34 (compact self-adjoint over `ℂ`) is chapter 6's `RCLike` Theorem 6.11 at `𝕜 = ℂ`.

Not formalized: the prose comparisons ("Chapter 2. All the statements are unchanged…",
"Chapter 4. Totally unchanged", the Agmon reference for chapters 8–9), the finite-dimensional
motivation, the computation `W(T) = {|λ| ≤ 1/2}` for `T(u₁, u₂) = (u₂, 0)` (an unnumbered
example; the same operator's spectrum and norm after 11.30 *is* a node, `example_shift_two`),
and the non-compact half of Remark 2 (`closure W(T) = conv σ(T)` for every normal `T`, quoted
from Halmos). The two examples that are nodes, the right shift without eigenvalues and
`example_shift_two`, are cheap and illustrate the definitions.
'''

[[node]]
id = "proposition_11_22"
kind = "theorem"
desc = '''Proposition 11.22: `I : f ↦ Re f` is a bijective isometry of `E*` (the complex dual)
onto `E_ℝ*` (the real dual of `E` as a real space). Stated as: there is
`I : StrongDual ℂ E ≃ₗᵢ[ℝ] StrongDual ℝ E` with `I f x = re (f x)` for all `f, x`, whose inverse is
`φ ↦ (x ↦ φ x − I * φ (I • x))` (display (12)). It is Mathlib's
`(ContinuousLinearMap.extendRCLikeₗᵢ (𝕜 := ℂ) (F := E)).symm`
(`Mathlib/Analysis/Normed/Module/RCLike/Extend.lean`): `re_extendRCLike_apply` is the formula
for `I`, `extendRCLike_apply` the formula (12) for the inverse, `norm_extendRCLike` the isometry.
The book's estimate `|f x| ≤ √2 ‖φ‖ ‖x‖` before the sharp one is `norm_extendRCLike_bound`. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.22"

[[node]]
id = "proposition_11_23"
kind = "theorem"
desc = '''Proposition 11.23, Hahn–Banach over `ℂ`: for a subspace `G` of `E` and a continuous
linear `g : G →L[ℂ] ℂ` there is `f : StrongDual ℂ E` extending `g` with `‖f‖ = ‖g‖`. Mathlib's
`exists_extension_norm_eq G g`, which is stated over `RCLike 𝕜` and is proved exactly as the
book proves this proposition (the real theorem plus `extendRCLike`). Chapter 1's
`Brezis.Chapter01.corollary_1_2` is the same lemma at `ℝ`. ★'''
deps = ["Brezis.Chapter01.corollary_1_2"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.23"

[[node]]
id = "IsClosedRealHyperplane"
kind = "definition"
desc = '''"A closed real hyperplane `H` in `E` is a set of the form `H = {x ∈ E ; Re ⟨f, x⟩ = α}`
for some `f ∈ E*`, `f ≠ 0`, and some `α ∈ ℝ`":
`IsClosedRealHyperplane (H : Set E) : Prop := ∃ (f : StrongDual ℂ E) (α : ℝ), f ≠ 0 ∧ H = {x | re (f x) = α}`.
(By `proposition_11_22` this is the same as chapter 1's closed hyperplane `[φ = α]` of `E_ℝ`,
`Brezis.Chapter01.IsHyperplane` with a continuous `φ`; record that as `isClosedRealHyperplane_iff`.)
The warning that for `α = 0` it is a real but not a complex subspace is not a node. ★'''
deps = ["Brezis.Chapter01.IsHyperplane"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4, Definition"

[[node]]
id = "SeparatesRe"
kind = "definition"
desc = '''"`H` separates `A, B ⊆ E` if `Re ⟨f, x⟩ ≤ α` for `x ∈ A` and `Re ⟨f, x⟩ ≥ α` for `x ∈ B`":
`SeparatesRe (f : StrongDual ℂ E) (α : ℝ) (A B : Set E) : Prop := (∀ x ∈ A, re (f x) ≤ α) ∧ ∀ x ∈ B, α ≤ re (f x)`,
the hyperplane being carried by `(f, α)` as in chapter 1's `Brezis.Chapter01.Separates`. ★'''
deps = ["Brezis.Chapter01.Separates"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4, Definition"

[[node]]
id = "proposition_11_24"
kind = "theorem"
desc = '''Proposition 11.24, the geometric Hahn–Banach theorem over `ℂ`: for nonempty disjoint
convex `A, B ⊆ E` (`Convex ℝ A`, `Convex ℝ B` — convexity is a real notion) one of which is open,
there is a closed real hyperplane separating them: `∃ (f : StrongDual ℂ E) (α : ℝ), f ≠ 0 ∧ SeparatesRe f α A B`.
Proof as the book's: Theorem 1.6 on `E_ℝ` — Mathlib's `geometric_hahn_banach_open` (real, with
`NormedSpace.complexToReal`; or chapter 1's `Brezis.Chapter01.theorem_1_6`) gives
`φ : StrongDual ℝ E` and `α` with `φ < α` on the open set and `α ≤ φ` on the other; then
`f := extendRCLike φ` has `re (f x) = φ x` (`re_extendRCLike_apply`), and `f ≠ 0` since `φ ≠ 0`
(both sets nonempty and the strict inequality). ★'''
deps = ["SeparatesRe", "IsClosedRealHyperplane", "Brezis.Chapter01.theorem_1_6"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.24"

[[node]]
id = "orthogonal_complex"
kind = "theorem"
desc = '''"The definition of the orthogonal `M^⊥` of a linear subspace `M` of `E` is unchanged":
for `M : Submodule ℂ E`, `f ∈ M.strongDualAnnihilator ↔ ∀ x ∈ M, f x = 0`
(`Submodule.mem_strongDualAnnihilator` at `ℂ`), "and clearly `M^⊥ = {f ; Re ⟨f, x⟩ = 0 ∀ x ∈ M}`"
(replace `x` by `I • x`: `re (f (I • x)) = re (I * f x) = − im (f x)`), and "`M^⊥⊥ = M̄`"
(`Submodule.strongDualCoannihilator_strongDualAnnihilator` at `ℂ`, chapter 1's Proposition 1.9 over
`RCLike`). Three clauses. ★'''
deps = ["Submodule.mem_strongDualAnnihilator", "Submodule.strongDualCoannihilator_strongDualAnnihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "conjugateC"
kind = "definition"
desc = '''The conjugate of `φ : E → EReal` over `ℂ`, "`φ*(f) = sup_{x ∈ E} {Re ⟨f, x⟩ − φ(x)}`" on
`f : StrongDual ℂ E`: `conjugateC φ : StrongDual ℂ E → EReal := conj B φ` for the real pairing
`B : E →ₗ[ℝ] StrongDual ℂ E →ₗ[ℝ] ℝ`, `B x f := re (f x)`, with the backbone's `conj`
(`Numlib/Analysis/Convex/Duality/Conjugate`, `conj_apply`). Companion `conjugateC_eq`:
"`φ*(f) = φ_ℝ*(I f)`", i.e. `conjugateC φ f = conj (topDualPairing ℝ E).flip φ (I f)` with `I` of
`proposition_11_22` — the two pairings agree, `re (f x) = (I f) x`. (The book's `φ` takes values
in `(−∞, +∞]`; chapter 1's convention for such functions, `EReal`-valued with `φ ≠ ⊥`, is used.)
★'''
deps = ["proposition_11_22"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4, Definition"

[[node]]
id = "proposition_11_25"
kind = "theorem"
desc = '''Proposition 11.25, Fenchel–Moreau over `ℂ`: for `φ : E → EReal` convex, lower
semicontinuous and `≢ +∞` (and never `−∞`), `φ** = φ`: `conj B.flip (conjugateC φ) = φ` with
the pairing `B` of `conjugateC` (the biconjugate back on `E`, `x ↦ sup_f (re (f x) − φ*(f))`).
Proof, the book's first method: chapter 1's Theorem 1.11 on `E_ℝ` (`Brezis.Chapter01.theorem_1_11`,
or the backbone's `biconj_eq_clFn_topDual` — `clFn φ = φ` for a closed proper convex `φ`) and
`proposition_11_22`, which identifies the real dual pairing with `B` (`conjugateC_eq`), so that
the two biconjugates coincide (`conj` composed with the isometry `I`, a reindexing of the
supremum). ★★'''
deps = ["conjugateC", "proposition_11_22", "Brezis.Chapter01.theorem_1_11"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.25"

[[node]]
id = "conjugateC_indicator"
kind = "theorem"
desc = '''"If `M` is a linear subspace of `E` and `φ = I_M`, then `φ*(f) = sup_{x ∈ M} Re ⟨f, x⟩ = I_{M^⊥}`":
`conjugateC (indicator M) = indicator (M.strongDualAnnihilator : Set (StrongDual ℂ E))` in the
`EReal` indicator convention of chapter 1 (`0` on the set, `⊤` off it —
`Numlib/Analysis/Convex/Indicator`). The book's argument: on `M^⊥` the supremum is `0`; off it
some `x₀ ∈ M` has `re (f x₀) > 0` after replacing `x₀` by `I • x₀` or `−x₀`, and `λ x₀`,
`λ → ∞`, makes the supremum `+∞`. ★'''
deps = ["conjugateC", "orthogonal_complex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "inner_identities"
kind = "theorem"
desc = '''The displayed identities of the "Chapter 5" paragraph, for a complex inner product space:
`(λu, μv) = λ μ̄ (u, v)` — in Mathlib's convention `⟪λ • u, μ • v⟫ = conj λ * μ * ⟪u, v⟫`
(`inner_smul_left`, `inner_smul_right`); `‖u + v‖² = ‖u‖² + 2 re ⟪u, v⟫ + ‖v‖²` (`norm_add_sq`;
the book's display has a typo, `|v|²` for `|u|²`); Cauchy–Schwarz `‖⟪u, v⟫‖ ≤ ‖u‖ ‖v‖`
(`norm_inner_le_norm`); and `L²(Ω; ℂ)` with `(u, v) = ∫ u v̄` as the example
(`MeasureTheory.L2.innerProductSpace`, `MeasureTheory.L2.inner_def`). Also that `H_ℝ` with
`re ⟪u, v⟫` is a real Hilbert space: `InnerProductSpace.complexToReal` and
`real_inner_eq_re_inner`. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "proposition_11_26"
kind = "theorem"
desc = '''Proposition 11.26, projection onto a closed convex set of a complex Hilbert space: for
`K ⊆ H` nonempty closed convex (`Convex ℝ K`) and `f : H`, there is a unique `u ∈ K` with
`‖f − u‖ = ⨅ v : K, ‖f − v‖` (`= Metric.infDist f K`), characterized by
`u ∈ K ∧ ∀ v ∈ K, re ⟪f − u, v − u⟫ ≤ 0`. The book's Theorem 5.2 on `H_ℝ`: with
`letI := InnerProductSpace.complexToReal`, chapter 5's `Brezis.Chapter05.theorem_5_2` (or
Mathlib's `exists_norm_eq_iInf_of_complete_convex` and `norm_eq_iInf_iff_real_inner_le_zero`
directly), and `real_inner_eq_re_inner` to read `⟪·, ·⟫_ℝ` as `re ⟪·, ·⟫`. Note the two
inner-product conventions give the same real part. ★★ (instance bookkeeping only)'''
deps = ["Brezis.Chapter05.theorem_5_2", "inner_identities"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.26"

[[node]]
id = "proposition_11_27"
kind = "theorem"
desc = '''Proposition 11.27, the Riesz–Fréchet theorem over `ℂ`: for every `φ : StrongDual ℂ H`
there is a unique `f : H` with `φ u = ⟪f, u⟫` for all `u` (the book's `(u, f)`, linear in `u`),
and `‖f‖ = ‖φ‖`. Mathlib's `InnerProductSpace.toDual ℂ H : H ≃ₗᵢ⋆[ℂ] StrongDual ℂ H`
(`InnerProductSpace.toDual_apply`, `LinearIsometryEquiv.norm_map`, injectivity for uniqueness),
stated over `RCLike`; the book's proof through `Re φ` on `H_ℝ` is not needed. Chapter 5's
`Brezis.Chapter05.theorem_5_5` is the real instance. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.27"

[[node]]
id = "proposition_11_28"
kind = "theorem"
desc = '''Proposition 11.28, Stampacchia over `ℂ`: for a form `a` satisfying (13) — linear in the
first and conjugate-linear in the second argument, here `a : SesqForm ℂ H` with the book's
`a(u, v)` read as `a v u` (Mathlib's `SesqForm 𝕜 V = V →L⋆[𝕜] V →L[𝕜] 𝕜` is conjugate-linear in
the first slot) — (14) bounded (built into `SesqForm`) and (15) coercive
(`a.IsCoerciveWith α`, `α * ‖u‖ ^ 2 ≤ re (a u u)`, `α > 0`), a nonempty closed convex `K` and
`φ : StrongDual ℂ H`, there is a unique `u ∈ K` with `re (a (v − u) u) ≥ re (φ (v − u))` for all
`v ∈ K` (display (16), in the transposed convention). Proof as the book's: the real bilinear
form `(u, v) ↦ re (a v u)` on `H_ℝ` is bounded and coercive and `re ∘ φ` is a real functional
(`proposition_11_22`), so chapter 5's Theorem 5.6 applies — `Brezis.Chapter05.theorem_5_6`, or the
backbone's `stampacchia` / `existsUnique_isVariationalInequalitySolution_of_isCoercive`
(`Numlib/Variational/Inequality/Basic`) with `letI := InnerProductSpace.complexToReal`. ★★'''
deps = ["Brezis.Chapter05.theorem_5_6", "proposition_11_22", "inner_identities"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.28"

[[node]]
id = "proposition_11_28_symm"
kind = "theorem"
desc = '''Proposition 11.28, "Moreover": if `a` is Hermitian (`a.IsHermitian`, the book's
`a(v, w) = conj a(w, v)`) then the solution `u` of `proposition_11_28` is characterized by
`u ∈ K` and `½ re (a u u) − re (φ u) = min_{v ∈ K} (½ re (a v v) − re (φ v))` (`a v v` is real
for Hermitian `a`, `SesqForm.IsHermitian`). The real energy characterization on `H_ℝ`:
chapter 5's Theorem 5.6 second clause, or the backbone's `isMinOn_energy_add_iff` with `j = 0`
(`Numlib/Variational/Inequality/Basic`). ★★'''
deps = ["proposition_11_28", "Brezis.Chapter05.theorem_5_6"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.28"

[[node]]
id = "laxMilgram_complex"
kind = "theorem"
desc = '''"When `K = H`, (16) becomes `a(u, v) = conj ⟨φ, v⟩` for all `v`. In particular any
`T ∈ L(H)` with `Re (Tu, u) ≥ α |u|²` is bijective": two clauses. (i) For `a : SesqForm ℂ H`
coercive and `φ : StrongDual ℂ H`, `∃! u, ∀ v, a v u = conj (φ v)` — the backbone's
`SesqForm.laxMilgram` (over `RCLike`; the conjugate appears because of the transposed
convention, `a v u = conj (a' u v)`). (ii) For `T : H →L[ℂ] H` with
`∀ u, α * ‖u‖ ^ 2 ≤ re ⟪T u, u⟫` (`α > 0`), `Function.Bijective T` — apply (i) to the form
`a v u := ⟪v, T u⟫` (`ContinuousLinearMap.toSesqForm`-style), or the backbone's
`ContinuousLinearMap.bijective_of_le_norm_of_orthogonal_range_eq_bot` with `α ‖u‖ ≤ ‖T u‖` from
Cauchy–Schwarz. Chapter 5's `Brezis.Chapter05.corollary_5_8` is the real Lax–Milgram. ★'''
deps = ["SesqForm.laxMilgram", "ContinuousLinearMap.bijective_of_le_norm_of_orthogonal_range_eq_bot"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "proposition_11_29"
kind = "theorem"
desc = '''Proposition 11.29 (Lax–Milgram, modulus form): if `T : H →L[ℂ] H` satisfies
`|(Tu, u)| ≥ α |u|²` for all `u` with `α > 0` (display (18); `‖⟪T u, u⟫‖`, the same as
`‖⟪u, T u⟫‖`), then `T` is bijective. The book's proof is Remark 8 of chapter 5 — injective,
closed range (`α ‖u‖ ≤ ‖T u‖` by Cauchy–Schwarz), dense range (if `v ⊥ range T` then
`α ‖v‖² ≤ ‖⟪T v, v⟫‖ = 0`) — which is exactly the backbone's
`ContinuousLinearMap.bijective_of_le_norm_of_orthogonal_range_eq_bot`. ★'''
deps = ["ContinuousLinearMap.bijective_of_le_norm_of_orthogonal_range_eq_bot"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.29"

[[node]]
id = "remark_11_1"
kind = "theorem"
desc = '''Remark 1: (17) implies (18) trivially (`re z ≤ ‖z‖`); conversely, if (18) holds,
`∀ u, α * ‖u‖ ^ 2 ≤ ‖⟪T u, u⟫‖`, then there is `ξ : ℂ` with `‖ξ‖ = 1` and
`∀ u, α * ‖u‖ ^ 2 ≤ re ⟪(ξ • T) u, u⟫` (display (19)). Two clauses; the second is the backbone's
`ContinuousLinearMap.exists_re_inner_smul_ge_of_norm_inner_ge`, whose proof is the book's — the
convexity of the numerical range (Proposition 11.33, `LinearMap.convex_numericalRange`), the
projection `p` of `0` onto `closure W(T)`, and the rotation taking `p` to the positive real
axis. (`⟪(ξ • T) u, u⟫ = conj ξ * ⟪T u, u⟫` in Mathlib's convention; the statement is
insensitive to which unit `ξ` is named.) ★'''
deps = ["ContinuousLinearMap.exists_re_inner_smul_ge_of_norm_inner_ge"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 11, Remark 1"

[[node]]
id = "spectrum_eq_setOf_not_bijective"
kind = "theorem"
desc = '''The definitions for `T : E →L[ℂ] E` on a complex Banach space: the resolvent set
"`ρ(T) = {λ ; T − λI is bijective}`" is Mathlib's `resolventSet ℂ T`
(`resolventSet ℂ T = {λ | Function.Bijective (T - λ • 1)}`, by `spectrum.mem_resolventSet_iff`
and `ContinuousLinearMap.isUnit_iff_bijective` — the open mapping theorem makes "bijective" and
"invertible in `L(E)`" agree, which is why completeness of `E` is assumed), the spectrum
`σ(T) = ℂ ∖ ρ(T)` is `spectrum ℂ T` (`spectrum.mem_iff`), and the eigenvalues
`EV(T) = {λ | N(T − λI) ≠ {0}}` are `{λ | Module.End.HasEigenvalue (T : Module.End ℂ E) λ}`
(`Module.End.hasEigenvalue_iff`), with "clearly `EV(T) ⊆ σ(T)`": an eigenvalue makes `T − λ • 1`
non-injective, hence not a unit. Four clauses. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4, Definition"

[[node]]
id = "example_rightShift"
kind = "theorem"
desc = '''"It may happen that `EV(T) = ∅` (e.g. the right shift `T u = (0, u₁, u₂, …)`)": on
`ℓ²(ℕ, ℂ) = lp (fun _ : ℕ ↦ ℂ) 2`, the right shift `S : ℓ² →L[ℂ] ℓ²`, `(S u) 0 = 0`,
`(S u) (n + 1) = u n` (an isometry; build it with `LinearMap.mkContinuous` from the
`Memℓp` of the shifted sequence, or as `lp.mapCLM`-free explicit construction), has no
eigenvalue: `∀ λ, ¬ Module.End.HasEigenvalue (S : Module.End ℂ _) λ`. If `S u = λ u` then
`0 = λ u 0`, and `u n = λ u (n + 1)`, so either `λ = 0` (then `u n = (S u) (n + 1) = 0`) or
`u 0 = 0` and inductively `u = 0`. About 60 lines. ★'''
deps = ["spectrum_eq_setOf_not_bijective"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "proposition_11_30"
kind = "theorem"
desc = '''Proposition 11.30: for `T : E →L[ℂ] E` on a nontrivial complex Banach space, `σ(T)` is a
nonempty compact set with `σ(T) ⊆ {λ ; |λ| ≤ ‖T‖}`. Mathlib: `spectrum.nonempty` (the Liouville
argument the book omits; needs `[Nontrivial E]` for `NormOneClass (E →L[ℂ] E)`),
`spectrum.isCompact`, `spectrum.subset_closedBall_norm`. Three clauses. ★'''
deps = ["spectrum_eq_setOf_not_bijective"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.30"

[[node]]
id = "example_shift_two"
kind = "theorem"
desc = '''"In `ℂ²` the operator `T(u₁, u₂) = (u₂, 0)` satisfies `σ(T) = {0}` and `‖T‖ = 1`": on
`EuclideanSpace ℂ (Fin 2)`, for `T := (Matrix.toEuclideanCLM …) !![0, 1; 0, 0]` (or the explicit
map), `spectrum ℂ T = {0}` and `‖T‖ = 1`. `T ^ 2 = 0` gives `σ(T) ⊆ {0}` by
`spectrum.map_pow`/`spectrum.pow_nnnorm_pow_one_div_tendsto_nhds_spectralRadius` at `n = 2`
(or `spectrum.subset_polynomial_aeval`), nonempty by `spectrum.nonempty`; `‖T‖ = 1` from
`‖T u‖ = |u₂| ≤ ‖u‖` with equality at `u = (0, 1)` (`ContinuousLinearMap.opNorm_le_bound`,
`ContinuousLinearMap.le_opNorm`). About 60 lines. ★'''
deps = ["proposition_11_30"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §11.4"

[[node]]
id = "spectralRadius_eq_lim"
kind = "theorem"
desc = '''"`r(T) = lim ‖Tⁿ‖^{1/n}` exists (Exercise 6.23), and clearly `r(T) ≤ ‖T‖`": for
`T : E →L[ℂ] E`, `Tendsto (fun n => ‖T ^ n‖ ^ (1 / n : ℝ)) atTop (𝓝 (spectralRadius ℂ T).toReal)`
and `(spectralRadius ℂ T).toReal ≤ ‖T‖`. The backbone's
`spectrum.pow_norm_pow_one_div_tendsto_nhds_toReal_spectralRadius` (Gelfand's formula, real
form) with `spectrum.spectralRadius_ne_top`, and Mathlib's `spectrum.spectralRadius_le_nnnorm`.
The book *defines* `r(T)` as the limit; Mathlib defines `spectralRadius` as the supremum of the
