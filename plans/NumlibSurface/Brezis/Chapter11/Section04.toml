[[node]]
id = "proposition_11_25"
kind = "theorem"
desc = '''Proposition 11.25, Fenchel–Moreau over `ℂ`: for `φ : E → EReal` convex
(`ConvexAnalysis.ConvexFn φ`), lower semicontinuous, never `⊥` and not identically `⊤`,
`φ** = φ`: `biconjugateC φ = φ`, the biconjugate being `ConvexAnalysis.biconj (rePairing E) φ`
(back on `E`, `x ↦ sup_f (Re ⟨f, x⟩ − φ*(f))`). Proof, the book's first method: chapter 1's
Theorem 1.11 on `E_ℝ` (`Brezis.Chapter01.theorem_1_11 : biconjugate φ = φ`) and Proposition
11.22 — `conjugateC_eq` identifies `φ*(f)` with `φ_ℝ*(I f)`, so `biconjugateC φ x` is the real
biconjugate's supremum reindexed along the bijection `I = reDual E`
(`(reDual E).toEquiv.iSup_comp` or `Equiv.iSup_congr`), about ten lines. ★

Blocked: the dependency `Brezis.Chapter01.theorem_1_11` (surface §1.4, written in parallel by
agent `surf4`) does not exist yet; the statement, the pairing `rePairing E`, the conjugate
`conjugateC` and the biconjugate `biconjugateC` are in place.'''
deps = ["biconjugateC", "conjugateC_eq", "reDual", "Brezis.Chapter01.theorem_1_11"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.25"

