[[node]]
id = "example_4_3_solution"
kind = "theorem"
desc = '''Example 4.3, the exact statements in it: for the lower bidiagonal `A : Matrix (Fin 100) (Fin 100) ℝ`
with `A i i = 3/2`, `A (i+1) i = 1`, zero elsewhere, and `b i = 5/2`, the vector
`x i = 1 - (-2/3) ^ ((i : ℕ) + 1)` solves `A *ᵥ x = b` (the book's `x_i = 1 - (-2/3)^i`, `1`-based).
Check row by row: `3/2 (1 - t^{i+1}) + (1 - t^i) = 5/2 - t^i (3/2 · t + 1) = 5/2` for `t = -2/3`.
The divergence of Program 16 in floating point is a numerical experiment and is not a node. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 4.3'

[[node]]
id = "example_4_3_spectralRadius"
kind = "theorem"
desc = '''Example 4.3: for the same `A`, `complexSpectralRadius B(3/2) = ENNReal.ofReal (1/2)` — indeed for a
lower triangular `A` one has `F A = 0`, so `B(ω) = (1 - ω D⁻¹ E)⁻¹ (1 - ω) 1 = (1 - ω) • (unit lower triangular)`
has the single eigenvalue `1 - ω`; hence `ρ(B(ω)) = |1 - ω|` for every `ω`, `1/2` at `ω = 3/2`.
Eigenvalues of a triangular matrix are its diagonal entries (`Matrix.det_of_lowerTriangular` on the
resolvent). ★★'''
