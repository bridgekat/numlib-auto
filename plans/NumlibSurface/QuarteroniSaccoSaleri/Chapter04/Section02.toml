namespace = "QuarteroniSaccoSaleri.Chapter04"
desc = '''
Quarteroni–Sacco–Saleri §4.2: linear iterative methods from a splitting `A = P - N` (4.6)–(4.7),
Properties 4.1–4.2 (convergence and energy-norm monotonicity for symmetric positive definite `A`),
the Jacobi, JOR, Gauss–Seidel and SOR methods (4.10)–(4.17) and their convergence theory: strict
diagonal dominance (Theorem 4.2), symmetric positive definiteness (Theorems 4.3–4.5, Property 4.3,
Property 4.5, SSOR), the JOR relaxation (Theorem 4.6), Kahan's bound (Theorem 4.7), tridiagonal and
consistently ordered matrices ((4.18), Definition 4.3, Property 4.4 with the optimal parameter
(4.19)), the rounding-error decomposition of §4.2.4 ((4.20) and Example 4.3), block Jacobi (§4.2.5)
and the symmetric Gauss–Seidel and SSOR methods of §4.2.6 ((4.21)–(4.22)). Example 4.2 is a table of
numerically computed spectral radii and has no node; the Programs 15–16 are not nodes, the sweeps they
implement being `Matrix.jorSweep` and `Matrix.sorSweep` of the backbone.

Every convergence statement is `Tendsto (fun k => (step)^[k] x₀) atTop (𝓝 (A⁻¹ *ᵥ b))` for all `b`,
`x₀`, obtained from a spectral-radius bound through `theorem_4_1`; the spectral-radius bounds are the
backbone's, on the real iteration matrix through `Matrix.complexSpectralRadius`. Energy norms are the
real quadratic forms `(A *ᵥ e) ⬝ᵥ e`, and "monotone convergence in `‖·‖_A`" is stated as the strict
one-step decrease of that form on nonzero errors.
'''

[[node]]
id = "Splitting"
kind = "definition"
desc = '''`Splitting A := Stationary.Splitting A` for `A : Matrix (Fin n) (Fin n) ℝ`: the additive splitting
`A = P - N` with `P` nonsingular of §4.2, `P = s.m`, `N = s.n`. An `abbrev`, as in the Saad surface. ★'''
deps = ["Stationary.Splitting", "Stationary.Splitting.n"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.6'

[[node]]
id = "equation_4_6"
kind = "theorem"
desc = '''(4.6): the step `x_{k+1} = P⁻¹ (N x_k + b)` is `Stationary.Splitting.mulVecStep s b`, and the
iteration matrix is `B = P⁻¹ N` with `f = P⁻¹ b`:
`Stationary.Splitting.mulVecStep s b x = affineStep s.iterationOperator (s.m⁻¹ *ᵥ b) x` and
`s.iterationOperator = s.m⁻¹ * s.n`. From `Stationary.Splitting.mulVecStep_eq_iterationOperator_mulVec_add`
and `Stationary.Splitting.iterationOperator_eq`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.Splitting", "QuarteroniSaccoSaleri.Chapter04.affineStep", "Stationary.Splitting.mulVecStep", "Stationary.Splitting.mulVecStep_eq_iterationOperator_mulVec_add", "Stationary.Splitting.iterationOperator_eq"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.6'

[[node]]
id = "equation_4_7"
kind = "theorem"
desc = '''(4.7)–(4.8): `Stationary.Splitting.mulVecStep s b x = x + s.m⁻¹ *ᵥ (b - A *ᵥ x)`, the update by the
preconditioned residual `r = b - A x`; and the splitting iteration is consistent,
`mulVecStep s b x = x ↔ A *ᵥ x = b`. `Stationary.Splitting.mulVecStep_eq_add_inv_mulVec` and
`mulVecStep_fixed_iff`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.Splitting", "Stationary.Splitting.mulVecStep_eq_add_inv_mulVec", "Stationary.Splitting.mulVecStep_fixed_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.7'

[[node]]
id = "property_4_1_spectralRadius_lt_one"
kind = "theorem"
desc = '''Property 4.1, convergence: for `A.PosDef`, `s : Splitting A` with `s.m.PosDef` and
`(2 • s.m - A).PosDef`, `complexSpectralRadius s.iterationOperator < 1`, hence (by `theorem_4_1`)
convergence from every `x₀` for every `b`. Householder–John,
`Stationary.Splitting.complexSpectralRadius_lt_one_of_posDef`, with `s.m + s.mᵀ - A = 2 s.m - A` for
symmetric `s.m`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.Splitting", "QuarteroniSaccoSaleri.Chapter04.theorem_4_1", "QuarteroniSaccoSaleri.Chapter04.equation_4_6", "Stationary.Splitting.complexSpectralRadius_lt_one_of_posDef"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.1'

[[node]]
id = "property_4_1_energyNorm"
kind = "theorem"
desc = '''Property 4.1, `ρ(B) = ‖B‖_A = ‖B‖_P`, stated without a matrix operator norm: under the hypotheses of
`property_4_1_spectralRadius_lt_one`, with `B = s.iterationOperator`, `ρ = (complexSpectralRadius B).toReal`,
(i) `∀ e, (A *ᵥ (B *ᵥ e)) ⬝ᵥ (B *ᵥ e) ≤ ρ ^ 2 * ((A *ᵥ e) ⬝ᵥ e)` and `∃ e ≠ 0` with equality;
(ii) the same with `s.m` in place of `A`. These say exactly that the operator norms of `B` induced by
`‖·‖_A` and `‖·‖_P` equal `ρ(B)`. Backbone:
`Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.property_4_1_spectralRadius_lt_one", "Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.1'

[[node]]
id = "property_4_1_monotone"
kind = "theorem"
desc = '''Property 4.1, monotonicity: under the same hypotheses, for every `e ≠ 0`,
`(A *ᵥ (B *ᵥ e)) ⬝ᵥ (B *ᵥ e) < (A *ᵥ e) ⬝ᵥ e` and `(s.m *ᵥ (B *ᵥ e)) ⬝ᵥ (B *ᵥ e) < (s.m *ᵥ e) ⬝ᵥ e`,
i.e. `‖e_{k+1}‖_A < ‖e_k‖_A` and `‖e_{k+1}‖_P < ‖e_k‖_P` along the error sequence `e_{k+1} = B e_k`
of (4.4). The `A`-clause is `Stationary.Splitting.energyNorm_mulVec_iterationOperator_lt`; the
`P`-clause follows from `property_4_1_energyNorm` (ii) with `ρ < 1`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.property_4_1_spectralRadius_lt_one", "QuarteroniSaccoSaleri.Chapter04.property_4_1_energyNorm", "Stationary.Splitting.energyNorm_mulVec_iterationOperator_lt"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.1'

