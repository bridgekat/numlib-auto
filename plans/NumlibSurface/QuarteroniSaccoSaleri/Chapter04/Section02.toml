[[node]]
id = "property_4_4_optimal"
kind = "theorem"
desc = '''Property 4.4, (4.19) and the optimal radius: under the hypotheses of `property_4_4` with
`ρ_J = (complexSpectralRadius B_J).toReal < 1`, `ω_opt = 2 / (1 + √(1 - ρ_J²))`
(`Matrix.optimalRelaxation ρ_J`) minimizes `ω ↦ complexSpectralRadius B(ω)` over `0 < ω < 2`
(`IsMinOn … (Set.Ioo 0 2) ω_opt`) and
`complexSpectralRadius B(ω_opt) = ENNReal.ofReal ((1 - √(1 - ρ_J²)) / (1 + √(1 - ρ_J²)))`
(the book's form of `ω_opt - 1`). `Matrix.IsConsistentlyOrdered.isMinOn_complexSpectralRadius_sor`
and `spectralRadius_sor_optimalRelaxation`; the value needs the algebraic identity
`2/(1 + s) - 1 = (1 - s)/(1 + s)`. ★'''
