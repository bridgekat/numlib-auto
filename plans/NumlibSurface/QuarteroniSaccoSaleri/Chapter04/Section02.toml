and its preconditioning matrix is `P_SGS = (D A - E A) * (D A)⁻¹ * (D A - F A)`, i.e. the composite
is `mulVecStep (ssorSplitting A h one_ne_zero _) b`. `Matrix.ssorSweep_eq_mulVecStep`,
`Matrix.ssorSplitting_iterationOperator_eq_mul`, `Matrix.ssorSplitting_one_m`. ★★'''
