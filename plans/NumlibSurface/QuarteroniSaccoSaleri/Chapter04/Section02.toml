[[node]]
id = "equation_4_20"
kind = "theorem"
desc = '''(4.20) and the error decomposition of §4.2.4: for `s : Splitting A`, `IsUnit A`, a perturbation
sequence `ζ : ℕ → Fin n → ℝ` and the computed sequence `x̂ 0 = x₀`,
`x̂ (k+1) = s.m⁻¹ *ᵥ (s.n *ᵥ x̂ k + b - ζ k)`, the error `ê_{k+1} = x - x̂_{k+1}` with `x = A⁻¹ b`
satisfies `ê (k+1) = (B ^ (k+1)) *ᵥ (x - x₀) + ∑ j ∈ range (k+1), (B ^ j) *ᵥ (s.m⁻¹ *ᵥ ζ (k - j))`,
`B = s.iterationOperator`. It is `Stationary.sub_forcedIterate_eq` with `f = P⁻¹ b`, forcing
`f - P⁻¹ ζ_k`. The first term tends to `0` when `ρ(B) < 1` (`theorem_4_1`); the book stops there and
cites [Hig88] for the second, whose bound `ε/(1 - ‖B‖)` under `‖P⁻¹ ζ_k‖ ≤ ε`, `‖B‖ < 1` is
`Stationary.norm_perturbed_iterate_sub_le` of `Numlib/FloatingPoint/Stationary` and may be recorded
as `equation_4_20_bound`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.Splitting", "QuarteroniSaccoSaleri.Chapter04.equation_4_6", "Stationary.forcedIterate", "Stationary.sub_forcedIterate_eq", "Stationary.norm_perturbed_iterate_sub_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.20'

