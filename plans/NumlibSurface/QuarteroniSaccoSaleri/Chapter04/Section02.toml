deps = ["QuarteroniSaccoSaleri.Chapter04.property_4_2_isUnit", "Stationary.Splitting.complexSpectralRadius_lt_one_of_posDef", "Stationary.Splitting.energyNorm_mulVec_iterationOperator_lt"]
