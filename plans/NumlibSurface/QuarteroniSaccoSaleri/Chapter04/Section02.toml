[[node]]
id = "definition_4_3"
kind = "definition"
desc = '''Definition 4.3, as printed: `HasAProperty M : Prop` for `M : Matrix (Fin n) (Fin n) ℝ` is the
conjunction of (a) `M` is consistently ordered in the spectral sense the definition spells out —
`α D⁻¹ E + α⁻¹ D⁻¹ F` has eigenvalues independent of `α ≠ 0` — which is
`Matrix.IsConsistentlyOrdered (complexify M)` of `Numlib/LinearSolve/Stationary/ConsistentlyOrdered`
(note the backbone's `L = D⁻¹ E`, `U = D⁻¹ F` are the *same* matrices up to the sign convention
`E = -strictLower`, the spectrum of `α L + α⁻¹ U` being invariant under negation of both), and (b) `M`
can be partitioned in the `2 × 2` block form `[D̃₁ M₁₂; M₂₁ D̃₂]` with diagonal `D̃₁`, `D̃₂`:
`∃ k ≤ n, ∀ i j, i ≠ j → ((i < k ∧ j < k) ∨ (k ≤ i ∧ k ≤ j)) → M i j = 0`, the partition being
the printed contiguous one (no permutation). Saad's Definition 4.11 (`SaadSparse.Chapter04.HasPropertyA`)
is clause (b) up to permutation and *implies* consistent ordering of some permutation; QSS's
definition takes both as hypotheses. ★'''
