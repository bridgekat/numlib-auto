[[node]]
id = "property_4_5"
kind = "theorem"
desc = '''Property 4.5: for `A.PosDef` the symmetric Gauss–Seidel method converges from every `x₀` for every
`b`, and `B_SGS` is self-adjoint and positive semidefinite in the `A`-inner product:
`(A * B_SGS).IsSymm` and `(A * B_SGS).PosSemidef`. The printed clause "`B_SGS` is symmetric positive
definite" is not true as printed (for a diagonal `A`, `B_SGS = 0`; and `B_SGS` is not
Euclidean-symmetric in general), so this node states the reading that is true and that the book's
source (Hackbusch) proves: `B_SGS = I - P_SGS⁻¹ A` with `P_SGS` symmetric and `P_SGS - A = E D⁻¹ F ≥ 0`,
whence the eigenvalues of `B_SGS` lie in `[0, 1)`. `Matrix.ssorSplitting_complexSpectralRadius_lt_one`
and `Matrix.ssorSplitting_iterationOperator_posSemidef_energy` at `ω = 1`, `equation_4_21`,
`theorem_4_1`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.equation_4_21", "QuarteroniSaccoSaleri.Chapter04.theorem_4_1", "Matrix.ssorSplitting_complexSpectralRadius_lt_one", "Matrix.ssorSplitting_iterationOperator_posSemidef_energy"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.5'

