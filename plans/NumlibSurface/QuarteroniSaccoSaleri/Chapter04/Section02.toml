desc = '''Theorem 4.7 (Kahan): for `IsUnit (D A)`, `n ≠ 0` and every `ω ≠ 0`,
`ENNReal.ofReal |ω - 1| ≤ complexSpectralRadius B(ω)` with `B(ω) = (sorSplitting A h hω).iterationOperator`;
consequently SOR does not converge (`¬ complexSpectralRadius B(ω) < 1`) when `ω ≤ 0` or `ω ≥ 2`. At
`ω = 0` the printed "any `ω ∈ ℝ`" refers to `B(0) = 1`, of spectral radius `1 = |0 - 1|`, and is
recorded as the trivial clause `theorem_4_7_zero` on `Matrix.sorIterationMatrix (complexify A) 0`.
`Matrix.abs_one_sub_le_sorSplitting_complexSpectralRadius`, `Matrix.lt_two_of_sorSplitting_complexSpectralRadius_lt_one`.
★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.equation_4_15", "Matrix.abs_one_sub_le_sorSplitting_complexSpectralRadius", "Matrix.lt_two_of_sorSplitting_complexSpectralRadius_lt_one", "Matrix.sorIterationMatrix"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 4.7'

[[node]]
id = "property_4_3"
kind = "theorem"
desc = '''Property 4.3 (Ostrowski): for `A.PosDef` and `ω ≠ 0`, the SOR method converges (for all `b`, `x₀`)
iff `0 < ω < 2`; and then the convergence is monotone in `‖·‖_A`:
`(A *ᵥ (B(ω) *ᵥ e)) ⬝ᵥ (B(ω) *ᵥ e) < (A *ᵥ e) ⬝ᵥ e` for `e ≠ 0`. The equivalence is
`Matrix.sorSplitting_complexSpectralRadius_lt_one_iff` with `theorem_4_1`; monotonicity is
`property_4_2_monotone` for `P = ω⁻¹ D A - E A`, whose `P + Pᵀ - A = (2/ω - 1) D A` is positive
definite for `0 < ω < 2`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.equation_4_15", "QuarteroniSaccoSaleri.Chapter04.theorem_4_1", "QuarteroniSaccoSaleri.Chapter04.property_4_2_monotone", "Matrix.sorSplitting_complexSpectralRadius_lt_one_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.3'

