desc = '''(4.21), the symmetric Gauss–Seidel method: one forward sweep followed by one backward sweep,
`Matrix.backwardSorSweep A 1 b (Matrix.sorSweep A 1 b x)`, equals `affineStep B_SGS b_SGS x` with
