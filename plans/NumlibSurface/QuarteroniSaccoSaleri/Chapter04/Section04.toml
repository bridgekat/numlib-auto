[[node]]
id = "remark_4_5"
kind = "theorem"
desc = '''Remark 4.5: for `A.PosDef` the CG iterate is the Lanczos-method (FOM) iterate,
`IsFOMIterate A b x₀ k (cgX A b x₀ k)` (`CG.isGalerkinIterate` through `cg_eq_CG`), the CG residuals
are multiples of the Lanczos vectors (`cgR A b x₀ k = ((-1)^k * ‖r_k‖) • arnoldiV A v₁ k`,
`CG.arnoldi_vec_eq` with `arnoldi_eq_vec`), and the directions `p_j` are mutually `A`-conjugate
