namespace = "QuarteroniSaccoSaleri.Chapter04"
desc = '''
Quarteroni–Sacco–Saleri §4.4: Krylov subspaces from the Richardson residual polynomial
((4.51)–(4.54)), the dimension formula (Property 4.7) and Example 4.8, the Arnoldi algorithm
((4.55)–(4.56)) and its breakdown, the two Krylov specifications (4.57)–(4.58), the Arnoldi method
for linear systems (FOM: (4.62), Theorem 4.13, the residual formula (4.63)), GMRES ((4.64)–(4.66),
Property 4.8, the Givens form of the residual norm), projection methods (Remark 4.4), the Lanczos
method for symmetric systems and the conjugate residual method (§4.4.3, Remark 4.5). Example 4.9 is a
MATLAB run; Programs 21–24 are not nodes (the Arnoldi and Lanczos processes they implement are
`Arnoldi.vec`/`Lanczos.alpha, beta` of the backbone, restated here as `arnoldi`). FOM(m), IOM,
GMRES(m) and QGMRES are named without any result and have no node.

Vectors are `EuclideanSpace ℝ (Fin n)` with `op A = toEuclideanLin A`; the book's `K_m(A; v)` is
`Krylov.subspace (op A) v m` after `Matrix.krylov_subspace_toEuclideanLin`, its `deg_A(v)` is
`Krylov.grade`, its `V_k`, `H_k`, `Ĥ_k` are `Arnoldi.vec`, `Arnoldi.hessenbergSq`, `Arnoldi.hessenberg`
started at `r₀` (the backbone normalizes `v_1 = r₀/‖r₀‖` itself). The Saad surface's
`Chapter06/Common.lean` and `Section03.lean` do the same translation for the same book-level objects;
this file repeats only the definitions, not the proofs, which are the backbone's.
'''

[[node]]
id = "equation_4_51"
kind = "theorem"
desc = '''(4.51): for the nonstationary Richardson method with `P = 1` (`nonstationaryRichardson A 1 α b x₀`),
`r_k = (∏ j < k, (1 - α_j A)) r_0`, i.e. `b - op A x_k = aeval (op A) (∏ j ∈ range k, (1 - C (α j) * X)) r₀`,
so `r_k = p_k(A) r₀` with `p_k` of degree `k`, `p_k 0 = 1`. `Richardson.residual_iterate_eq_prod`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.nonstationaryRichardson", "Richardson.residual_iterate_eq_prod"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.51'

[[node]]
id = "krylovSubspace"
kind = "definition"
desc = '''(4.52): `krylovSubspace A v m = Submodule.span ℝ (Set.range fun i : Fin m => op (A ^ (i : ℕ)) v)`,
the Krylov subspace `K_m(A; v) = span {v, A v, …, A^{m-1} v}` of order `m`; `krylovSubspace_eq`
identifies it with `Krylov.subspace (op A) v m` (`Matrix.krylov_subspace_toEuclideanLin`), and the
sentence after (4.52) — it is `{p(A) v : deg p ≤ m - 1}` — is `Krylov.subspace_eq_map_degreeLT`. ★'''
deps = ["Krylov.subspace", "Matrix.krylov_subspace_toEuclideanLin", "Krylov.subspace_eq_map_degreeLT"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.52'

[[node]]
id = "equation_4_53"
kind = "theorem"
desc = '''(4.53)–(4.54): the Richardson iterate lies in `W_k = {x₀ + y : y ∈ K_k(A; r₀)}`, i.e.
`nonstationaryRichardson A 1 α b x₀ k - x₀ ∈ krylovSubspace A r₀ k`, and every element of `W_k` has
the form `x₀ + q_{k-1}(A) r₀` with `deg q_{k-1} ≤ k - 1` ("Krylov method"). `Richardson.iterate_sub_mem_subspace`,
`Krylov.mem_subspace_iff_exists_aeval`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.krylovSubspace", "QuarteroniSaccoSaleri.Chapter04.nonstationaryRichardson", "Richardson.iterate_sub_mem_subspace", "Krylov.mem_subspace_iff_exists_aeval"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.53'

[[node]]
id = "degree"
kind = "definition"
desc = '''The degree of `v` with respect to `A`, `deg_A(v)`: the minimum degree of a monic nonzero polynomial
`p : ℝ[X]` with `p(A) v = 0` (Property 4.7's definition), `sInf {d | ∃ p : ℝ[X], p.Monic ∧ p.natDegree = d ∧ aeval (op A) p v = 0}`;
`degree_eq_grade : degree A v = Krylov.grade (op A) v`, by `Krylov.natDegree_minpolyVec` and
`Krylov.pow_apply_mem_subspace_iff_exists_monic`. Its value is at most `n` (Cayley–Hamilton,
`Krylov.grade_le_finrank`), as the book remarks. ★'''
deps = ["Krylov.grade", "Krylov.minpolyVec", "Krylov.natDegree_minpolyVec", "Krylov.pow_apply_mem_subspace_iff_exists_monic", "Krylov.grade_le_finrank"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 4.7'

[[node]]
id = "property_4_7"
kind = "theorem"
desc = '''Property 4.7: `Module.finrank ℝ (krylovSubspace A v m) = m ↔ m ≤ degree A v`, and the sentence
after it, `Module.finrank ℝ (krylovSubspace A v m) = min m (degree A v)` (so the dimension is
nondecreasing in `m`). `Krylov.finrank_subspace` with `degree_eq_grade`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.krylovSubspace", "QuarteroniSaccoSaleri.Chapter04.degree", "Krylov.finrank_subspace"]
