[[node]]
id = "example_4_8"
kind = "theorem"
desc = '''Example 4.8: for `A = tridiag₄(-1, 2, -1)` and `v = ![1, 1, 1, 1]`, `(A² - 3A + 1) v = 0` and no monic
polynomial of degree `1` annihilates `v` (`A v = ![1, 0, 0, 1]` is not a multiple of `v`), so
`degree A v = 2` and `krylovSubspace A v m` has dimension `2` for every `m ≥ 2`; while
`w = ![1, 1, -1, 1]` has `degree A w = 4`. Finite computations (`decide`/`norm_num` on the explicit
Krylov vectors and `property_4_7`); the degree-`4` claim is the linear independence of
`w, A w, A² w, A³ w`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.degree", "QuarteroniSaccoSaleri.Chapter04.property_4_7", "QuarteroniSaccoSaleri.Chapter04.krylovSubspace"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 4.8'

[[node]]
id = "arnoldi"
kind = "definition"
desc = '''The Arnoldi algorithm (4.55) in the book's form, started from a unit vector `v₁`: the sequence
`arnoldiV A v₁ : ℕ → 𝔼` with `arnoldiV 0 = v₁`, coefficients `h i k = inner ℝ (arnoldiV i) (op A (arnoldiV k))`
for `i ≤ k`, `w k = op A (arnoldiV k) - ∑ i ≤ k, h i k • arnoldiV i`, `h (k+1) k = ‖w k‖`, and
`arnoldiV (k+1) = ‖w k‖⁻¹ • w k` (`0` at a breakdown `w k = 0`, since `0⁻¹ = 0`). `0`-based, so
`arnoldiV A v₁ (k - 1)` is the book's `v_k`. Together with `arnoldiH`, its coefficient function. ★'''
deps = ["Arnoldi.vec", "Arnoldi.coeff", "Arnoldi.w"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.55'

[[node]]
id = "arnoldi_eq_vec"
kind = "theorem"
desc = '''For `‖v₁‖ = 1`: `arnoldiV A v₁ k = Arnoldi.vec (op A) v₁ k` and `arnoldiH A v₁ i k = Arnoldi.coeff (op A) v₁ i k`
for all `i k`; hence the vectors are orthonormal up to the grade (`Arnoldi.orthonormal`), span the
Krylov subspaces (`Arnoldi.span_vec`: "if the method terminates at step `m` then `v_1, …, v_m` form a
basis of `K_m(A; v)`") and satisfy the Hessenberg relation (`Arnoldi.apply_vec`). Induction using
`Arnoldi.vec_succ_eq` and `Arnoldi.w`; the same identification as `SaadSparse.Chapter06.arnoldiCGS_eq_vec`.
★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.arnoldi", "Arnoldi.vec", "Arnoldi.coeff", "Arnoldi.vec_succ_eq", "Arnoldi.w", "Arnoldi.orthonormal", "Arnoldi.span_vec", "Arnoldi.apply_vec"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.55'

[[node]]
id = "equation_4_56"
kind = "theorem"
desc = '''(4.56): with `V_m` the `n × m` matrix of columns `v_1, …, v_m` and `Ĥ_m` the `(m+1) × m` matrix of
the coefficients `h_ij` (zero for `i > j + 1`), for `m ≤ degree A v₁`:
`V_mᵀ * A * V_m = H_m` (the leading `m × m` block) and `V_{m+1}ᵀ * A * V_m = Ĥ_m`, `Ĥ_m` being upper
Hessenberg (`Arnoldi.hessenberg_isUpperHessenbergRect`). `Arnoldi.hessenbergSq_eq_toMatrix_compression`,
`Arnoldi.coeff`, `Arnoldi.coeff_eq_zero_of_lt`, through `arnoldi_eq_vec`; the matrix `V_m` is
