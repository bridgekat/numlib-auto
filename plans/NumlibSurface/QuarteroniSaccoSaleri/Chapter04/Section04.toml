[[node]]
id = "theorem_4_13"
kind = "theorem"
desc = '''Theorem 4.13: for `IsUnit A`, the Arnoldi method yields the solution after at most `n` iterations:
at `m = degree A r₀ ≤ n` the FOM iterate exists uniquely and `op A x = b`; a fortiori for every
`k ≥ degree A r₀` (`k = n` included). The book's two cases — termination at `n` because `K_n = ℝⁿ`,
or breakdown at `m < n` where "inverting the first relation in (4.56)" gives `x^{(m)} = A⁻¹ b` — are
both `Krylov.existsUnique_isGalerkinIterate_of_grade_le` (existence needs `A` injective, which the
book uses silently) with `Krylov.grade_le_finrank`. ★'''
