[[node]]
id = "arnoldi_breakdown_iff"
kind = "theorem"
desc = '''"The algorithm terminates at an intermediate step `k < m` iff `deg_A(v_1) = k`": for `‖v₁‖ = 1`,
`w k = 0 ↔ degree A v₁ ≤ k + 1`, i.e. the first vanishing `w_k` (`0`-based) is at `k = deg - 1`,
