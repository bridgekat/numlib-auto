[[node]]
id = "equation_4_57"
kind = "definition"
desc = '''(4.57), the Arnoldi method for linear systems (FOM): `IsFOMIterate A b x₀ k x := x - x₀ ∈ krylovSubspace A r₀ k ∧ ∀ v ∈ krylovSubspace A r₀ k, inner ℝ v (b - op A x) = 0`,
with `r₀ = b - op A x₀`; it is `Krylov.IsGalerkinIterate (op A) b x₀ k x` (`isFOMIterate_iff`), and
(4.59)–(4.62): for `k ≤ degree A r₀` and `v₁ = r₀/‖r₀‖`, `x = x₀ + V_k z` is the FOM iterate iff
`H_k z = ‖r₀‖ e₁` (`Krylov.isGalerkinIterate_iff_mulVec_eq`), which has a unique solution iff `H_k` is
nonsingular (`Krylov.existsUnique_isGalerkinIterate_iff_isUnit`). ★'''
