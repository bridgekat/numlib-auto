deps = ["QuarteroniSaccoSaleri.Chapter04.arnoldi_eq_vec", "Arnoldi.hessenberg", "Arnoldi.hessenbergSq", "Arnoldi.hessenbergSq_eq_toMatrix_compression", "Arnoldi.coeff_eq_zero_of_lt", "Arnoldi.hessenberg_isUpperHessenbergRect"]
