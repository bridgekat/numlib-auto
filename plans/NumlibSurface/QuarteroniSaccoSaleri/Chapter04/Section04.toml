desc = '''(4.58), GMRES: `IsGMRESIterate A b x₀ k x := x - x₀ ∈ krylovSubspace A r₀ k ∧ ∀ y, y - x₀ ∈ krylovSubspace A r₀ k → ‖b - op A x‖ ≤ ‖b - op A y‖`;
