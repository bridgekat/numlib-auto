[[node]]
id = "cgStep"
kind = "definition"
desc = '''The conjugate gradient iteration of §4.3.4 in the book's letters, on the state `(x, r, p)`:
`α = inner ℝ p r / inner ℝ p (op A p)` (4.39), `x' = x + α • p`, `r' = r - α • op A p`,
`β = inner ℝ (op A p) r' / inner ℝ (op A p) p`, `p' = r' - β • p` (4.41) — note the *minus* sign,
which is the book's convention and makes its `β_k` the negative of the backbone's `CG.beta`. `cg A b x₀ k`
iterates `cgStep` from `(x₀, b - op A x₀, b - op A x₀)`; `cgX`, `cgR`, `cgP`, `cgAlpha`, `cgBeta`
read the components. ★'''
deps = ["CG.step", "CG.init", "CG.iterate"]
