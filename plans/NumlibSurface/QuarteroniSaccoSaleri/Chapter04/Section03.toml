[[node]]
id = "pcgStep"
kind = "definition"
desc = '''The preconditioned conjugate gradient iteration of §4.3.5 in the book's letters, for `P.PosDef`:
state `(x, r, p)`, `α = inner ℝ p r / inner ℝ p (op A p)`, `x' = x + α • p`, `r' = r - α • op A p`,
`z' = op P⁻¹ r'`, `β = inner ℝ (op A p) z' / inner ℝ (op A p) p`, `p' = z' - β • p`; `pcg A P b x₀ k`
iterates it from `(x₀, r₀, P⁻¹ r₀)`. ★'''
deps = ["Krylov.PCG.step", "Krylov.PCG.init", "Krylov.PCG.iterate"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 4.3.5'

[[node]]
