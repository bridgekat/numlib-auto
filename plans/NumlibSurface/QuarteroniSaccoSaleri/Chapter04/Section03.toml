componentwise (with `Krylov.IsPreconditioner (op P) (op P⁻¹)` from positive definiteness), the
book's `β` being the negative of `Krylov.PCG.beta`. Induction, as `cg_eq_CG`; the identity
`⟪p, r⟫ = ⟪r, P⁻¹ r⟫` along the iteration is the preconditioned form of
`CG.inner_residual_direction_eq` (`Krylov.PCG.iterate_eq_CG_iterate_withEnergy`). ★★'''
