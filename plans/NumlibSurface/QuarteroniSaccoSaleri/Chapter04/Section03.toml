[[node]]
id = "cg_eq_CG"
kind = "theorem"
desc = '''For `A.PosDef`, `cg A b x₀ k = CG.iterate (op A) b x₀ k` componentwise (`cgX = (CG.iterate …).x`,
`cgR = .r`, `cgP = .p`), `cgAlpha A b x₀ k = CG.alpha …` and `cgBeta A b x₀ k = -CG.beta …`. Induction
on `k`; the step-length identity `⟪p, r⟫ = ‖r‖²` is `CG.inner_residual_direction_eq` and the
`β` identity is `equation_4_45`. This is the pivot: every property of the backbone recurrence
transfers to the book's CG. Same shape as `SaadSparse.Chapter06.cg_eq_CG`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.cgStep", "CG.iterate", "CG.alpha", "CG.beta", "CG.inner_residual_direction_eq", "Matrix.posDef_iff_isSymmetricCoercive"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.41'

