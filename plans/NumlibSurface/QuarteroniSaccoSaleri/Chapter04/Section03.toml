[[node]]
id = "definition_4_4"
kind = "definition"
desc = '''Definition 4.4: `IsOptimalWrt A b x p : Prop := ∀ t : ℝ, energy A b x ≤ energy A b (x + t • p)`,
"`x` is optimal with respect to the direction `p`", and `IsOptimalWrtSubspace A b x V := ∀ p ∈ V, IsOptimalWrt A b x p`
