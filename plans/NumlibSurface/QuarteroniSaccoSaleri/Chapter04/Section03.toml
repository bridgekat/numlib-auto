[[node]]
id = "equation_4_46"
kind = "theorem"
desc = '''(4.46) and Exercise 14, the three-term recurrence of the residuals: while `cgR A b x₀ j ≠ 0` for
`j ≤ k`, with `α_j = cgAlpha`, `β_j = cgBeta` (book's sign) and `r_{-1}`-term absent at `k = 0`,
`op A (cgR A b x₀ k) = -(1/α_k) • r_{k+1} + (1/α_k - β_{k-1}/α_{k-1}) • r_k + (β_{k-1}/α_{k-1}) • r_{k-1}`
for `k ≥ 1`. The last coefficient is `β_{k-1}/α_{k-1}`, not the printed `β_k/α_{k-1}` (errata);
derived from `A p_k = (r_k - r_{k+1})/α_k` and `p_k = r_k - β_{k-1} p_{k-1}` as the solution of
Exercise 14 does. It is `CG.residual_succ_eq_three_term` (in Saad's `γ_k = ⟪r_k, r_k⟫/⟪A r_k, r_k⟫`,
