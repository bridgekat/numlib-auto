namespace = "QuarteroniSaccoSaleri.Chapter04"
desc = '''
Quarteroni–Sacco–Saleri §4.3: stationary and nonstationary Richardson methods (4.23)–(4.25) and their
convergence theory (Theorems 4.8–4.9, (4.29), Corollary 4.1), preconditioning (Remark 4.2 and the
generalized eigenvalue bound (4.33); the catalogue of preconditioners in §4.3.2 states no result and
its Programs 17–18 are not nodes), the gradient method ((4.34)–(4.37), Theorem 4.10), optimality and
conjugate directions (Definition 4.4, (4.41)–(4.46), Theorems 4.11–4.12, Property 4.6, Exercises
12–14, which the text cites), the preconditioned conjugate gradient method of §4.3.5 and the
alternating-direction method of §4.3.6 ((4.50) and its two spectral-radius bounds). Examples 4.4–4.7
are MATLAB experiments and Remark 4.3 is prose on rounding; none is a node.

Vectors are `EuclideanSpace ℝ (Fin n)`, written `𝔼`, matrices act through `op A = toEuclideanLin A`,
and the inner product is Mathlib's `inner ℝ`; the energy norm is `energyNorm (op A)`. Every
convergence rate is a specialization of `Numlib/LinearSolve/Stationary/Richardson`,
`Numlib/LinearSolve/Projection/{Optimality,OneDimensional,ConjugateDirection}`, `Numlib/Krylov/CG`,
`Numlib/Krylov/Convergence/CG`, `Numlib/Krylov/Preconditioned` and `Numlib/LinearSolve/Stationary/ADI`.
The CG and PCG algorithms are defined here in the book's own letters (its `β_k` carries the opposite
sign to the backbone's) and identified with `CG.iterate`/`Krylov.PCG.iterate`, as
`SaadSparse.Chapter06.cg_eq_CG` does for Saad's Algorithm 6.18.
'''

[[node]]
id = "richardsonStep"
kind = "definition"
desc = '''(4.23): `richardsonStep A P α b x = x + α • (P⁻¹ *ᵥ (b - A *ᵥ x))` on `Fin n → ℝ`, the stationary
preconditioned Richardson step with acceleration parameter `α`; for `IsUnit P`, `α ≠ 0` it is
`Stationary.Splitting.mulVecStep (preconditionedRichardson A hP hα) b`, with iteration matrix
`R_α = 1 - α • (P⁻¹ * A)` (`Stationary.Splitting.preconditionedRichardson_iterationOperator`); at
`P = D A` and `α = 1` it is Jacobi, at `P = D A - E A` Gauss–Seidel. A lemma `richardsonStep_eq`
records the identification. ★'''
deps = ["Stationary.Splitting.preconditionedRichardson", "Stationary.Splitting.preconditionedRichardson_iterationOperator", "Stationary.Splitting.mulVecStep_eq_add_inv_mulVec"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.23'

[[node]]
id = "nonstationaryRichardson"
kind = "definition"
desc = '''(4.24)–(4.25): `nonstationaryRichardson A P α b x₀ k` is the sequence `x_{k+1} = x_k + α_k P⁻¹ r_k`,
i.e. `Richardson.iterate (op A) (op P⁻¹) α b x₀`, and the residual satisfies
`r_{k+1} = r_k - α_k • A z_k` with `z_k = P⁻¹ r_k` (`Richardson.residual_iterate_succ`), which is the
algorithm (4.25). ★'''
deps = ["Richardson.iterate", "Richardson.residual_iterate_succ"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.24'

[[node]]
id = "theorem_4_8"
kind = "theorem"
desc = '''Theorem 4.8: for `IsUnit P` and every real `α`, the stationary Richardson method converges from
every `x₀` for every `b` iff `∀ λ ∈ spectrum ℂ (complexify (P⁻¹ * A)), 1 < 2 * λ.re / (α * ‖λ‖ ^ 2)`.
`Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff_forall` for `M = P⁻¹ A`,
`richardsonStep`, and `theorem_4_1` (for `α ≠ 0`; at `α = 0` both sides are false when `n ≠ 0`,
the iteration being stationary at `x₀`). ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.richardsonStep", "QuarteroniSaccoSaleri.Chapter04.theorem_4_1", "Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff_forall"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 4.8'

[[node]]
id = "theorem_4_9"
kind = "theorem"
desc = '''Theorem 4.9, convergence: if `IsUnit P` and `P⁻¹ * A` has real positive eigenvalues, all in
`[λ_n, λ_1]` with `0 < λ_n` and both attained
(`spectrum ℂ (complexify (P⁻¹ * A)) ⊆ Complex.ofReal '' Set.Icc λ_n λ_1`, `λ_n, λ_1 ∈ spectrum ℝ (P⁻¹ * A)`),
then the stationary Richardson method converges (from every `x₀`, for every `b`) iff `0 < α < 2 / λ_1`.
`Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff`, `theorem_4_1`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.richardsonStep", "QuarteroniSaccoSaleri.Chapter04.theorem_4_1", "Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 4.9'

[[node]]
id = "theorem_4_9_optimal"
kind = "theorem"
desc = '''Theorem 4.9, (4.27)–(4.28): under the same hypotheses `α_opt = 2 / (λ_1 + λ_n)` minimizes
`α ↦ complexSpectralRadius (1 - α • (P⁻¹ * A))` over `α > 0` (`IsMinOn … (Set.Ioi 0) α_opt`) and
`complexSpectralRadius (1 - α_opt • (P⁻¹ * A)) = ENNReal.ofReal ((λ_1 - λ_n) / (λ_1 + λ_n))`.
`Stationary.Splitting.isMinOn_complexSpectralRadius_one_sub_smul`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.theorem_4_9", "Stationary.Splitting.isMinOn_complexSpectralRadius_one_sub_smul"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.28'

[[node]]
id = "richardson_monotone_of_posDef"
kind = "theorem"
desc = '''The sentence after Theorem 4.9: if `P⁻¹ * A` is symmetric positive definite (`(P⁻¹ * A).PosDef`, the
book's hypothesis, which forces `A` and `P` to commute when both are symmetric), and `0 < α < 2/λ_1`,
then the Richardson iteration is monotone in `‖·‖₂` and, when also `A.PosDef`, in `‖·‖_A`:
`‖R_α *ᵥ e‖ ≤ ρ(R_α) ‖e‖` and `(A *ᵥ (R_α *ᵥ e)) ⬝ᵥ (R_α *ᵥ e) ≤ ρ(R_α)² ((A *ᵥ e) ⬝ᵥ e)` with `ρ(R_α) < 1`.
`R_α` is symmetric, so `‖R_α‖₂ = ρ(R_α)` (`Matrix.l2_opNorm_eq_complexSpectralRadius_of_isHermitian`);
for the `A`-norm, `A R_α = A - α A P⁻¹ A` is symmetric when `P⁻¹ A` is, so `R_α` is `A`-self-adjoint
and `Stationary.Splitting.energyInner_iterationOperator_comm`'s consequence applies — or simply
`Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius` when `P` is
symmetric. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.theorem_4_9", "Matrix.l2_opNorm_eq_complexSpectralRadius_of_isHermitian", "Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 4.9'

[[node]]
id = "equation_4_29"
kind = "theorem"
desc = '''(4.29): if `M = P⁻¹ * A` is symmetric positive definite then, with `K₂ = NormedRing.condNumber M`
(`ℓ²` operator norm), `ρ_opt = (K₂ - 1)/(K₂ + 1)` and `α_opt = 2 ‖A⁻¹ * P‖₂ / (K₂ + 1)`, i.e.
`complexSpectralRadius (1 - α_opt • M) = ENNReal.ofReal ((K₂ - 1) / (K₂ + 1))` and
`2 / (λ_1 + λ_n) = 2 * ‖M⁻¹‖ / (K₂ + 1)` (note `M⁻¹ = A⁻¹ P`).
`Stationary.Splitting.complexSpectralRadius_one_sub_smul_optimal_eq_condNumber`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.theorem_4_9_optimal", "Stationary.Splitting.complexSpectralRadius_one_sub_smul_optimal_eq_condNumber", "NormedRing.condNumber"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.29'

[[node]]
id = "corollary_4_1"
kind = "theorem"
desc = '''Corollary 4.1, unpreconditioned: for `A.PosDef` the stationary Richardson method with `P = 1`
converges for `0 < α < 2 / λ_max(A)` — the range the book omits and Theorem 4.9 supplies; without it
the "convergent" clause is false (`α = 3/λ_max` gives `ρ(R_α) ≥ 2`), see the errata — and for
*every* `α` the estimate (4.30) holds: `(A *ᵥ (R_α *ᵥ e)) ⬝ᵥ (R_α *ᵥ e) ≤ ρ(R_α) ^ 2 * ((A *ᵥ e) ⬝ᵥ e)`
with `R_α = 1 - α • A`, `ρ(R_α) = (complexSpectralRadius R_α).toReal`, i.e. `‖e_{k+1}‖_A ≤ ρ(R_α) ‖e_k‖_A`.
`Stationary.Splitting.energyNorm_preconditionedRichardson_mulVec_le` at `P = 1` (or the existing
`Stationary.Splitting.richardson_complexSpectralRadius_lt_one_iff` for the range) and `theorem_4_9`.
★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.theorem_4_9", "QuarteroniSaccoSaleri.Chapter04.richardsonStep", "Stationary.Splitting.energyNorm_preconditionedRichardson_mulVec_le", "Stationary.Splitting.richardson_complexSpectralRadius_lt_one_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Corollary 4.1'

[[node]]
id = "corollary_4_1_preconditioned"
kind = "theorem"
desc = '''Corollary 4.1, preconditioned, in the generality of the book's closing remark ("the inequality
(4.30) holds even if only `P` and `A` are symmetric positive definite"): for `A.PosDef`, `P.PosDef`
and every `α ≠ 0`, with `R_α = 1 - α • (P⁻¹ * A)`,
`(A *ᵥ (R_α *ᵥ e)) ⬝ᵥ (R_α *ᵥ e) ≤ ρ(R_α) ^ 2 * ((A *ᵥ e) ⬝ᵥ e)`. The book's own hypothesis adds
"`P⁻¹ A` symmetric positive definite", which is unnecessary (`R_α` is `A`-self-adjoint because
`A R_α = A - α A P⁻¹ A` is symmetric for symmetric `P`) and is dropped.
`Stationary.Splitting.energyNorm_preconditionedRichardson_mulVec_le`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.corollary_4_1", "Stationary.Splitting.energyNorm_preconditionedRichardson_mulVec_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Corollary 4.1'

[[node]]
id = "remark_4_2"
kind = "theorem"
desc = '''Remark 4.2, (4.32): for real symmetric `A` and `P.PosDef`, `λ ∈ spectrum ℂ (complexify (P⁻¹ * A))`
iff there is `x ≠ 0` with `A x = λ P x` (the generalized eigenvalue problem), every such `λ` is real,
and for a real eigenvector `x`, `λ = (A *ᵥ x ⬝ᵥ x) / (P *ᵥ x ⬝ᵥ x)` (the generalized Rayleigh quotient).
`Matrix.mem_spectrum_inv_mul_iff_exists_mulVec_eq_smul` and `Matrix.spectrum_inv_mul_subset_of_posDef`
of `Numlib/Eigen/Pencil`; the quotient formula is `dotProduct` of the eigenvalue equation with `x`.
★★'''
deps = ["Matrix.mem_spectrum_inv_mul_iff_exists_mulVec_eq_smul", "Matrix.spectrum_inv_mul_subset_of_posDef"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 4.2'

[[node]]
id = "equation_4_33"
kind = "theorem"
desc = '''(4.33): for real symmetric `A` and `P.PosDef`, every eigenvalue `λ` of `P⁻¹ A` satisfies
`λ_min(A) / λ_max(P) ≤ λ ≤ λ_max(A) / λ_min(P)`, where `λ_min`, `λ_max` are the extreme eigenvalues of
the symmetric matrices (`Matrix.IsHermitian.eigenvalues`); stated for `λ_min(A) ≥ 0` as printed (the
book's context has `A` positive definite; for indefinite `A` the lower bound is
`λ_min(A)/λ_min(P)`). `Matrix.spectrum_inv_mul_subset_Icc_div`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.remark_4_2", "Matrix.spectrum_inv_mul_subset_Icc_div"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.33'

[[node]]
id = "energy"
kind = "definition"
desc = '''The energy of the system, `Φ y = 1/2 * inner ℝ (op A y) y - inner ℝ y b` on `𝔼`
(`Φ(y) = ½ yᵀ A y - yᵀ b`). ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.34'

[[node]]
id = "equation_4_34"
kind = "theorem"
desc = '''(4.34): for symmetric `A` (`A.IsSymm`), `HasGradientAt (energy A b) (op A y - b) y` for every `y`
(the gradient of `Φ` is `A y - b`; for general `A` it is `½ (Aᵀ + A) y - b`). Fréchet derivative of a
quadratic form (`HasFDerivAt` of `inner` and `LinearMap`), then `HasGradientAt` via
`hasGradientAt_iff_hasFDerivAt`. Consequently a critical point of `Φ` solves `A x = b`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.energy"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.34'

[[node]]
id = "equation_4_35"
kind = "theorem"
desc = '''(4.35) and the display before it: for `A.PosDef` and `op A x = b`,
`energy A b y = energy A b x + 1/2 * inner ℝ (op A (y - x)) (y - x)` for all `y`, hence
`1/2 * energyNorm (op A) (y - x) ^ 2 = energy A b y - energy A b x`, and `x` is the strict global
minimizer of `Φ` (`energy A b x < energy A b y` for `y ≠ x`). Expand; it is
`LinearMap.IsSymmetricCoercive.energyNorm_error_sq_eq` in the book's letters, and the `⇒` direction of
`IsGalerkin.iff_energyNorm_min` with `K = ⊤`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter04.energy", "LinearMap.IsSymmetricCoercive.energyNorm_error_sq_eq", "Matrix.posDef_iff_isSymmetricCoercive"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation 4.35'

[[node]]
