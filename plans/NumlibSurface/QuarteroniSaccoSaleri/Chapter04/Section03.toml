desc = '''The two displays after Definition 4.4: for `A.PosDef` and `p ≠ 0`,
`IsOptimalWrt A b x p ↔ inner ℝ p (b - op A x) = 0` (`p ⟂ r`), and
`IsOptimalWrtSubspace A b x V ↔ b - op A x ∈ Vᗮ`; hence, for finite-dimensional `V` and
