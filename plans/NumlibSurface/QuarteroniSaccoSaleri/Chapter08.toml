desc = '''
Quarteroni–Sacco–Saleri, Chapter 8: polynomial interpolation.

Lagrange interpolation with its error formula and Lebesgue constant (§8.1), the Newton form and
divided differences (§8.2), piecewise Lagrange interpolation with the `L²` estimates of Theorem 8.3
(§8.3), Hermite–Birkhoff interpolation (§8.4), the two-dimensional extension (§8.5), splines,
interpolatory cubic splines and B-splines (§8.6), parametric splines and Bézier curves (§8.7). The
applications of §8.8 contribute the cubic Hermite basis (8.64); the exercises cited by the text
(1, 2, 3, 7, 10, 11) are nodes of the sections that cite them.

The backbone behind it: `Numlib/Approximation/Interpolation` (Theorems 8.1–8.2, Property 8.1
through the Lebesgue lemma of `Numlib/Analysis/Normed/Module/BestApprox`, the piecewise operator
of §8.3), `Numlib/Approximation/DividedDifference` and the new `Numlib/Approximation/NewtonForm`
(§8.2), the new `Numlib/Approximation/SobolevInterpolation` (Theorem 8.3),
`Numlib/Approximation/Hermite` (§8.4), `Numlib/Approximation/{NodalInterpolation, MvPolynomial}`
(§8.5), and the new `Numlib/Approximation/{Spline, BSpline, Bezier}` (§8.6–8.7). Mathlib supplies
`Lagrange.interpolate`, `Lagrange.nodal`, `Matrix.det_vandermonde` and `bernsteinPolynomial`.

Not formalized, each on its node: the Erdős lower bound on Lebesgue constants and Faber's theorem
(§8.1.2), the equispaced asymptotics `Λ_n ≃ 2^{n+1}/(e n log n)` (§8.1.3), the two-dimensional
error estimates (8.39)–(8.40), and the sharp constants of Property 8.3 (Hall–Meyer). Runge's
counterexample (Example 8.1) is stated with a real-variable proof route and left open.

Skipped (numerical tables, plots, software): Examples 8.2, 8.3, 8.4, 8.5, 8.7, 8.8, Remark 8.2,
Programs 65–70, the CG experiment of §8.8.1 and the tomography of §8.8.2.
'''
