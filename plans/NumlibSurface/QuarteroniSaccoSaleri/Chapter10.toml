desc = '''
Quarteroni–Sacco–Saleri, Chapter 10: orthogonal polynomials in approximation theory (§10.1–10.12).

Generalized Fourier series and the best `L²_w` approximation (§10.1), Jacobi's characterization of
the degree of exactness, Gauss and Gauss–Lobatto quadrature (§10.2), the Chebyshev and Legendre
instances with their discrete transforms (§10.3–10.4), Gauss–Laguerre and Gauss–Hermite rules
(§10.5), continuous and discrete least squares (§10.7), the polynomial of best uniform approximation
(§10.8), the discrete Fourier transform and the FFT (§10.9), finite-difference and pseudo-spectral
differentiation (§10.10), the Fourier, Laplace and Z transforms (§10.11) and wavelets (§10.12).
§10.6 (MATLAB programs) and §10.13 (applications) contribute no nodes.

Not formalized: the chapter's weighted-Sobolev spectral estimates at the Gauss–Lobatto nodes —
(10.22), (10.24) and (10.26)–(10.27) in §10.3, (10.36)–(10.37) with the Legendre forms of (10.22)
and (10.24) in §10.4, and (10.71) in §10.10 — are quoted from Canuto–Hussaini–Quarteroni–Zang
without proof and rest on a spectral-projection theory the library does not have. Their nodes were
removed in the closing round of 2026-09-23; the record, with the three missing layers (weighted
Sobolev seminorms on `(-1,1)`, the coefficient decay by the Sturm–Liouville symmetry, the aliasing
step from projection to interpolant) and the inventory of what exists, is in
`## Not formalized here` of `NumlibSurface/QuarteroniSaccoSaleri/Chapter10/Section03.lean`, with
the Legendre and derivative specifics in §10.4 and §10.10. Theorem 12.2 of chapter 12 is open for
the same reason. The four
estimates of §10.9 (the Fourier interpolation errors in `L²` and in the maximum norm, the
discrete-scalar-product error and the trapezoidal error) are proved, on the periodic Sobolev
scale of `Numlib/Analysis/Sobolev/Periodic` and the aliasing identity of
`Numlib/Analysis/Fourier/Aliasing`. Everything else is a specialization of
`Numlib/Approximation/{OrthogonalPolynomial, Quadrature, GaussLobatto, Chebyshev, Interpolation}`,
`Numlib/Analysis/Fourier/DFT`, `Numlib/FiniteDifference/Derivative`,
`Numlib/Analysis/SpecialFunctions/LaplaceTransform`,
`Numlib/Analysis/Wavelet/{ContinuousTransform, Multiresolution, Haar}`, or of Mathlib's Fourier
transform and Chebyshev polynomials.
'''
