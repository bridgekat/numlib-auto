[[node]]
id = "theorem_9_3_odd"
kind = "theorem"
desc = '''Theorem 9.3, odd `n` (9.27): for odd `n`, `f ∈ C^{n+1}([a, b])`,
`∃ η ∈ Icc a b, ∫_a^b f - compositeNewtonCotes n f a b m = (b - a)/(n + 1)! * K_n/n^{n+2} * H^{n+1} * f^{(n+1)}(η)`;
`n = 1` is the composite trapezoidal error `-(b - a) H²/12 f''`. ★
Blocked: the backbone companion `Quadrature.exists_sub_compositeNewtonCotes_eq_of_odd` is still
open; it waits on `Quadrature.exists_sub_closedNewtonCotes_eq_of_odd`, whose remaining gap (the
constant sign of the order-`n` Peano kernel) is recorded in that node's `desc`. The convergence
remark the book draws from (9.27) no longer waits on it: `theorem_9_3_tendsto_odd` is proved.'''
deps = ["Quadrature.exists_sub_compositeNewtonCotes_eq_of_odd", "QuarteroniSaccoSaleri.Chapter09.theorem_9_1"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 9.3 (9.27)'

