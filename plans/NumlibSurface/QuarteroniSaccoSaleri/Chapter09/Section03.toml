[[node]]
id = "theorem_9_2_open_odd"
kind = "theorem"
desc = '''Theorem 9.2, open formulae, odd `n` (9.20): `∃ η ∈ Ioo a b, ∫_a^b f - openNewtonCotes n f a b
= K_n/(n + 1)! * h^{n+2} * f^{(n+1)}(η)`, `K_n = ∫_{-1}^{n+1} π_{n+1} > 0`. Stated by the book
without proof. ★
Blocked: the backbone companion `Quadrature.exists_sub_openNewtonCotes_eq_of_odd` is still open;
it inherits the obstruction of `Quadrature.exists_sub_closedNewtonCotes_eq_of_odd`, recorded in
that node's `desc`.'''
deps = ["Quadrature.exists_sub_openNewtonCotes_eq_of_odd", "Quadrature.openNewtonCotesK_pos"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 9.2 (9.20), open'

