[[node]]
id = "theorem_9_2_closed_odd"
kind = "theorem"
desc = '''Theorem 9.2, closed formulae, odd `n` (9.20): for odd `n`, `f ∈ C^{n+1}([a, b])`,
`∃ η ∈ Ioo a b, ∫_a^b f - closedNewtonCotes n f a b = K_n/(n + 1)! * h^{n+2} * f^{(n+1)}(η)`,
`K_n = ∫_0^n π_{n+1} < 0`. Stated by the book without proof. ★
Blocked: the backbone companion `Quadrature.exists_sub_closedNewtonCotes_eq_of_odd` is still open
— what is missing is the constant sign of the order-`n` Peano kernel, whose reduction to a
statement about the partial sums of the weights is recorded in that node's `desc`. The two
consequences the book draws from (9.20) no longer wait on it: `theorem_9_2_degreeOfExactness_odd`
and `theorem_9_2_order_odd` are proved.'''
deps = ["Quadrature.exists_sub_closedNewtonCotes_eq_of_odd", "Quadrature.newtonCotesK_neg"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 9.2 (9.20), closed'

