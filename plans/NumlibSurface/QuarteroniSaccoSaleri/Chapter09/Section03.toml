[[node]]
id = "theorem_9_2_degreeOfExactness_odd"
kind = "theorem"
desc = '''The last sentence of Theorem 9.2 for odd `n`: the closed rule has degree of exactness
exactly `n` — exact on `ℙ_n` (`Quadrature.integral_eq_closedNewtonCotes_of_degree_le`) and not on
`x^{n+1}`, whose error is `h^{n+2} K_n` — and the order of infinitesimal is `n + 2`. ★
Blocked: the non-exactness on `x^{n+1}` and the order need `Quadrature.newtonCotesK_neg` and
`Quadrature.exists_sub_closedNewtonCotes_eq_of_odd`, both open in the backbone.'''
deps = ["Quadrature.integral_eq_closedNewtonCotes_of_degree_le", "Quadrature.newtonCotesK_neg", "Quadrature.exists_sub_closedNewtonCotes_eq_of_odd"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 9.2 (degree of exactness, odd `n`)'''

