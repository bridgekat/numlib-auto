desc = '''The unnumbered characterization after (7.46): `B_SPB = psbUpdate B_k s_k y_k` is the unique
solution of: find symmetric `B̄` with `B̄ s_k = y_k` minimizing `‖B̄ - B_k‖_F`.
`Matrix.frobenius_norm_psbUpdate_sub_le` (with its equality clause), for symmetric `B_k`. ★'''
deps = ["Matrix.frobenius_norm_psbUpdate_sub_le", "QuarteroniSaccoSaleri.Chapter07.equation_7_46"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 7.2.7'

[[node]]
id = "psbBoundedDeterioration"
kind = "theorem"
desc = '''The last display of §7.2.7: if `H` (the Hessian of `f`) is `L`-Lipschitz on the open
convex `D ∋ x_k, x_{k+1}` and `y_k = ∇f(x_{k+1}) - ∇f(x_k)`, `s_k = x_{k+1} - x_k`, then
`‖B_SPB - H(x_{k+1})‖_F ≤ ‖B_k - H(x_k)‖_F + 3 L ‖s_k‖`.
`Matrix.frobenius_norm_psbUpdate_sub_le_add` with `hessianMatrix`. ★'''
deps = ["Matrix.frobenius_norm_psbUpdate_sub_le_add", "QuarteroniSaccoSaleri.Chapter07.hessianMatrix", "QuarteroniSaccoSaleri.Chapter07.psbLeastChange"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 7.2.7'
