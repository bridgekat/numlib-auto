namespace = "QuarteroniSaccoSaleri.Chapter07"
desc = '''
§7.2, unconstrained optimization of `f : EuclideanSpace ℝ (Fin n) → ℝ`: the optimality conditions
of Property 7.4 with the Hessian matrix, descent methods (7.25)–(7.28) and Theorem 7.3, the line
search conditions (7.31)–(7.34) and Property 7.5, the quadratic case (7.35)–(7.39) with Lemma 7.1
(Kantorovich) and Property 7.6 (conjugate directions), the nonlinear CG coefficients of Remark
7.2, Newton's method for minimization (7.40), the global convergence Properties 7.7–7.8, and the
secant updates (7.42)–(7.46) of §7.2.7. Gradients are Mathlib's `HasGradientAt` / `gradient`, the
derivative data of the backbone being `f' x = InnerProductSpace.toDual ℝ _ (gradient f x)`; the
Hessian matrix is `hessianMatrix f x`, the matrix of the second derivative in the standard basis.
Backbone: `Numlib/Optimization/{Descent,LineSearch,ConjugateGradient,QuasiNewton}`,
`Numlib/Projection/{OneDimensional,ConjugateDirection}`, `Numlib/Krylov/CG`,
`Numlib/Analysis/InnerProductSpace/Energy`. §7.2.1 (Hooke–Jeeves, Nelder–Mead) states nothing and
has no nodes beyond the minimizer of the Rosenbrock function in Example 7.5.
'''

[[node]]
id = "hessianMatrix"
kind = "definition"
desc = '''The Hessian matrix `H(x)` of `f : EuclideanSpace ℝ (Fin n) → ℝ`:
`hessianMatrix f x i j := fderiv ℝ (fun y => fderiv ℝ f y (e j)) x (e i)` with `e = EuclideanSpace.single · 1`,
i.e. `∂²f/∂x_i∂x_j (x)`; with the bridge `hessianMatrix_apply : (hessianMatrix f x) i j =
(fderiv ℝ (fderiv ℝ f) x) (e i) (e j)` and, for `ContDiffAt ℝ 2 f x`, symmetry
(`Mathlib`: `ContDiffAt.isSymmSndFDerivAt`). ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 7.2'

[[node]]
id = "property_7_4_gradient"
kind = "theorem"
desc = '''Property 7.4 (a): if `IsLocalMin f xstar` and `f` is differentiable at `xstar` then
`gradient f xstar = 0`. Mathlib: `IsLocalMin.fderiv_eq_zero` / `IsLocalMin.hasFDerivAt_eq_zero`
(`Mathlib/Analysis/Calculus/LocalExtr/Basic.lean`), translated through
`hasGradientAt_iff_hasFDerivAt`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 7.4'

[[node]]
id = "property_7_4_hessian"
kind = "theorem"
desc = '''Property 7.4 (b): if `IsLocalMin f xstar` and `ContDiffAt ℝ 2 f xstar` (the book's
`f ∈ C²(B(x*; R))`), then `(hessianMatrix f xstar).PosSemidef`. From
`Descent.nonneg_apply_apply_of_isLocalMin` applied to `v = toEuclideanLin`-coordinates:
`0 ≤ f'' v v = vᵀ H v` for all `v`, and symmetry of `H` from `ContDiffAt 2`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter07.hessianMatrix", "Descent.nonneg_apply_apply_of_isLocalMin"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 7.4'

[[node]]
id = "property_7_4_sufficient"
kind = "theorem"
desc = '''Property 7.4 (c), corrected — the book's "if `x* ∈ B(x*; R)` and `H(x*)` is positive definite
then `x*` is a local minimizer" omits the hypothesis `∇f(x*) = 0` (false without it: `f x = x + x²`
at `0`): if `ContDiffAt ℝ 2 f xstar`, `gradient f xstar = 0` and `(hessianMatrix f xstar).PosDef`,
then `xstar` is a strict local minimizer, `∃ δ > 0, ∀ y ∈ ball xstar δ, y ≠ xstar → f xstar < f y`
(hence `IsLocalMin f xstar`). From `Descent.isLocalMin_of_coercive_second` with coercivity of the
Hessian form from `Matrix.posDef_iff_isSymmetricCoercive`
(`Numlib/Analysis/InnerProductSpace/Coercive`). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter07.hessianMatrix", "Descent.isLocalMin_of_coercive_second", "Matrix.posDef_iff_isSymmetricCoercive"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 7.4'

