[[node]]
id = "property_7_7"
kind = "theorem"
desc = '''Property 7.7 (Wolfe; Zoutendijk): if `f` is `C¹` with `L`-Lipschitz gradient,
`‖∇f x - ∇f y‖ ≤ L ‖x - y‖`, and `x_k` is generated by a descent method (`Descent.IsDescentSequence`)
