namespace = "QuarteroniSaccoSaleri.Chapter08"
desc = '''
QSS §8.1: Lagrange interpolation — existence and uniqueness (Theorem 8.1), the Lagrange form and
the nodal polynomial, the error formula (Theorem 8.2), the interpolation matrix, the Lebesgue
constant and the comparison with the best approximation (Property 8.1), the growth of Lebesgue
constants, Runge's counterexample (Example 8.1) and the stability estimate of §8.1.3; with the
cited Exercises 1–3.

Conventions: nodes are `x : Fin (n + 1) → ℝ`, injective (the book's "distinct"); the interpolant
of data `y` is Mathlib's `Lagrange.interpolate Finset.univ x y : ℝ[X]`, of a function `f` it is
`Lagrange.interpolate Finset.univ x (f ∘ x)`; `𝒫_n` on `[a, b]` is `polyLE (Icc a b) n`; the
interpolation operator on `C(Icc a b, ℝ)` is `Lagrange.interpolateCLM` of
`Numlib/Approximation/Interpolation`, whose nodes are points of the subtype `Icc a b`.
'''

[[node]]
id = "theorem_8_1"
kind = "theorem"
desc = '''Theorem 8.1: for injective `x : Fin (n + 1) → ℝ` and any `y : Fin (n + 1) → ℝ` there is exactly
one `p : ℝ[X]` with `p.degree ≤ n` and `p.eval (x i) = y i` for all `i`. Existence is
`Lagrange.interpolate Finset.univ x y` with `Lagrange.eval_interpolate_at_node` and
`Lagrange.degree_interpolate_le`; uniqueness is `Lagrange.eq_interpolate_of_eval_eq`
(a polynomial of degree `≤ n` vanishing at `n + 1` points is zero). ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 8.1'

[[node]]
id = "theorem_8_1_isUnisolvent"
kind = "theorem"
desc = '''Theorem 8.1 in the abstract form of the backbone: for injective nodes `x : Fin (n + 1) → Icc a b`,
the point evaluations at the nodes are unisolvent over `polyLE (Icc a b) n`,
`Approximation.IsUnisolvent (polyLE (Icc a b) n) (fun i => evalCLM (x i))`; this is
`Lagrange.isUnisolvent_polyLE`. ★'''
deps = ["Lagrange.isUnisolvent_polyLE"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 8.1'

[[node]]
id = "equation_8_3"
kind = "theorem"
desc = '''(8.3): the characteristic polynomials `l_i = Lagrange.basis Finset.univ x i` (Mathlib's
`∏_{j ≠ i} (X - C (x j)) / (x i - x j)`) satisfy `(l_i).eval (x j) = if i = j then 1 else 0` for
injective `x`; `Lagrange.eval_basis_self` and `Lagrange.eval_basis_of_ne`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.3)'

[[node]]
id = "equation_8_4"
kind = "theorem"
desc = '''(8.4), the Lagrange form: `Lagrange.interpolate Finset.univ x y = ∑ i, C (y i) * Lagrange.basis Finset.univ x i`;
`Lagrange.interpolate_apply`. ★'''
deps = []
