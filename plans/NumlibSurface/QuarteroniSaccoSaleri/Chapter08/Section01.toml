`(Lagrange.interpolate Finset.univ x y).eval t = ∑ i, (Lagrange.nodal Finset.univ x).eval t / ((t - x i) * (derivative (Lagrange.nodal Finset.univ x)).eval (x i)) * y i`;
`Lagrange.eval_interpolate_not_at_node` with `Lagrange.nodalWeight_eq_eval_derivative_nodal`. ★'''
