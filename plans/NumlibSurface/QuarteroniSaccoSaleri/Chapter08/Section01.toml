[[node]]
id = "lebesgueConstant_equispaced"
kind = "theorem"
desc = '''The equispaced asymptotics of §8.1.3: for the equispaced interpolation matrix
`X n j = a + j (b - a)/n`, `lebesgueConstant X n · (e n log n) / 2^{n+1} → 1` — the book's
`Λ_n(X) ≃ 2^{n+1}/(e n log n)`, which is Turetskii's theorem (1940; Natanson, *Constructive
Function Theory*). Not formalized: the asymptotic equivalence needs the precise evaluation of the
Lebesgue function near the ends of the interval and the book states it without proof. A rigorous
one-sided bound `lebesgueConstant X n ≥ 2^{n-3}/n²` (Schönhage) is provable by evaluating the
Lebesgue function at the midpoint of the first panel, and would suffice to show that equispaced
interpolation is unstable; it is not stated by the book and is not planned.

Blocked (2026-09-20, refreshed; blocker 17): unchanged, the book quotes Turetskii's asymptotics
without proof and the round did not take it up. Checked: no asymptotics of Lebesgue constants
exist in `Numlib/` or Mathlib; the Chebyshev upper bound `Lagrange.norm_interpolateCLM_chebyshev_le`
and the equispaced machinery of `Numlib/Approximation/RungePhenomenon.lean` (products of
`|t - x_j|` over equispaced nodes, `Runge.abs_sub_interpolate_eq`) are the nearest material. The
one-sided `Λ_n ≥ 2^{n-3}/n²` is about 200 lines (evaluate the Lebesgue function at the midpoint of
the first panel, where the basis product telescopes into factorials); the two-sided asymptotics
are a few pages of Natanson and are not bounded work.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.lebesgueConstant"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.3 (Natanson; Turetskii 1940)'
