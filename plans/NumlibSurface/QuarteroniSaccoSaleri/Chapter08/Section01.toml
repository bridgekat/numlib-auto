[[node]]
id = "theorem_8_2"
kind = "theorem"
desc = '''Theorem 8.2, the interpolation error: for injective `x : Fin (n + 1) → ℝ`, a point `t`, and
`f` of class `C^{n+1}` on an open set containing `I_t := Icc (min t (⨅ i, x i)) (max t (⨆ i, x i))`
(the smallest interval containing the nodes and `t`), there is `ξ ∈ I_t` with
`f t - (Lagrange.interpolate Finset.univ x (f ∘ x)).eval t = iteratedDeriv (n + 1) f ξ / (n + 1)! * ∏ i, (t - x i)`.
Backbone: `Lagrange.exists_sub_interpolate_eq_of_contDiffOn` on `[a, b] = I_t` when `I_t` has
nonempty interior; when `I_t` is a single point (`n = 0`, `t = x 0`) both sides vanish and any `ξ`
works. The book's `f ∈ C^{n+1}(I_x)` on a closed interval is read as `ContDiffOn` on an open
neighbourhood, as `AtkinsonHan.Chapter03.proposition_3_2_4` reads the same statement (with a
global `ContDiff`). ★★'''
deps = ["Lagrange.exists_sub_interpolate_eq_of_contDiffOn"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Theorem 8.2'

[[node]]
id = "IsInterpMatrix"
kind = "definition"
desc = '''The interpolation matrix on `[a, b]` of §8.1.2: `X : ℕ → ℕ → Icc a b` such that for every
`n` the row `fun j : Fin (n + 1) => X n j` is injective (the entries beyond `j = n` are unused,
which is the "lower triangular" of the book). `IsInterpMatrix X` is that property. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.2'

[[node]]
id = "interpRow"
kind = "definition"
desc = '''`interpRow X n := Lagrange.interpolateCLM (fun j : Fin (n + 1) => X n j) : C(Icc a b, ℝ) →L[ℝ] C(Icc a b, ℝ)`,
the interpolation operator `Π_n` of the `(n+1)`-st row of `X`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.IsInterpMatrix", "Lagrange.interpolateCLM"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.2'

[[node]]
id = "lebesgueConstant"
kind = "definition"
desc = '''(8.11): `lebesgueConstant X n := sSup (Set.range fun t : Icc a b => ∑ j, |Lagrange.basisCM (row n) j t|)`,
the maximum over `[a, b]` of the Lebesgue function `∑_j |l_j^{(n)}|`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.IsInterpMatrix", "Lagrange.basisCM"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.11)'

[[node]]
id = "lebesgueConstant_eq_norm"
kind = "theorem"
desc = '''For `hX : IsInterpMatrix X` and `a < b`, `lebesgueConstant X n = ‖interpRow X n‖`:
`Lagrange.norm_interpolateCLM`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.lebesgueConstant", "QuarteroniSaccoSaleri.Chapter08.interpRow", "Lagrange.norm_interpolateCLM"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.11)'

[[node]]
id = "property_8_1"
kind = "theorem"
desc = '''Property 8.1: for `a < b`, `hX : IsInterpMatrix X`, `f : C(Icc a b, ℝ)` and every `n`,
`‖f - interpRow X n f‖ ≤ (1 + lebesgueConstant X n) * Metric.infDist f (polyLE (Icc a b) n)`
— `E_{n,∞}(X) ≤ E_n^* (1 + Λ_n(X))`, with `E_n^* = ‖f - p_n^*‖_∞ = infDist f 𝒫_n` (the best
approximation `p_n^*` exists and is unique by `existsUnique_isBestApprox_polyLE` of
`Numlib/Approximation/Chebyshev`; state `property_8_1_bestApprox` with `‖f - p‖` for the best
approximation `p` as a second clause). The Lebesgue lemma `norm_sub_apply_le_of_isIdempotentElem`
for the projection `interpRow X n` (`Lagrange.isIdempotentElem_interpolateCLM`), whose range is
`polyLE (Icc a b) n` (`Lagrange.range_interpolateCLM`) and whose norm is the Lebesgue constant
(`lebesgueConstant_eq_norm`). ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.interpRow", "QuarteroniSaccoSaleri.Chapter08.lebesgueConstant_eq_norm", "norm_sub_apply_le_of_isIdempotentElem", "Lagrange.isIdempotentElem_interpolateCLM", "Lagrange.range_interpolateCLM", "existsUnique_isBestApprox_polyLE"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 8.1'

[[node]]
id = "erdos_lebesgueConstant"
kind = "theorem"
desc = '''The Erdős lower bound quoted in §8.1.2: for every interpolation matrix `X` on `[a, b]` there
is `C > 0` with `lebesgueConstant X n > (2/π) * Real.log (n + 1) - C` for all `n`. Not formalized:
this is Erdős's theorem (*Problems and results on the theory of interpolation II*, Acta Math.
Acad. Sci. Hungar. 12, 1961), several pages of hard analysis on the Lebesgue function, which the
book quotes without proof; neither Mathlib nor the backbone has any lower bound on algebraic
Lebesgue constants (the backbone's `PeriodicCont.log_le_lebesgueConstant` is the *trigonometric*
one, whose proof is an explicit Dirichlet-kernel integral with no algebraic analogue). Even the
weaker `¬ BddAbove (range (lebesgueConstant X))`, which is all Faber's theorem needs, is Bernstein's
or Faber's theorem and is not elementary.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.lebesgueConstant"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.2 (Erdős 1961)'

[[node]]
id = "faber"
kind = "theorem"
desc = '''Faber's theorem quoted in §8.1.2: for every interpolation matrix `X` on `[a, b]` (`a < b`)
there is `f : C(Icc a b, ℝ)` such that `¬ Tendsto (fun n => interpRow X n f) atTop (𝓝 f)` —
polynomial interpolation on any fixed node scheme fails to converge uniformly for some continuous
function. Not formalized: given the unboundedness of the Lebesgue constants it is five lines —
`ContinuousLinearMap.exists_not_tendsto_of_not_bddAbove` of
`Numlib/Analysis/Normed/Operator/BanachSteinhaus` with `L = 1` and `lebesgueConstant_eq_norm` —
but the unboundedness is `erdos_lebesgueConstant` (or Bernstein's weaker bound), which is out of
reach; the book quotes both without proof.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.erdos_lebesgueConstant", "QuarteroniSaccoSaleri.Chapter08.interpRow", "QuarteroniSaccoSaleri.Chapter08.lebesgueConstant_eq_norm", "ContinuousLinearMap.exists_not_tendsto_of_not_bddAbove"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.2 (Faber 1914)'

[[node]]
id = "example_8_1"
kind = "theorem"
desc = '''Example 8.1, Runge's counterexample: for `f t = 1 / (1 + t²)` on `[-5, 5]` and the equispaced
nodes `x_j^{(n)} = -5 + 10 j / n`, there is `t ∈ Icc (-5) 5` (indeed every `|t| > 3.63…`, but one
point suffices for the statement) such that
`¬ Tendsto (fun n => (Lagrange.interpolate Finset.univ (x n) (f ∘ x n)).eval t) atTop (𝓝 (f t))`.
Proof route (real-variable, no contour integral): (i) by `DividedDifference.sub_eval_interpolate_eq_newton`
the error is `ω_{n+1}(t) f[x_0, …, x_n, t]`; (ii) `f = Re (i/(s + i))` and
`DividedDifference.newton_inv_sub` over `ℂ` give `f[x_0, …, x_n, t] = Re (i · (-1)^{n+1} / ((t + i) ∏_j (x_j + i)))`,
whose modulus is at least `κ(t) / |ω_{n+1}(i)|` with `κ(t) = min(1, |t|)/(1 + t²)`, because the
symmetric node set makes `∏_j (x_j + i)` real or purely imaginary; (iii) so
`|E_n(t)| ≥ κ(t) exp(∑_j (log|t - x_j| - ½ log(1 + x_j²)))`, and Riemann-sum bounds for the two
monotone-on-pieces integrands show the exponent is `(n/10)(φ(t) - ψ) - O(log n)` with
`φ(t) = ∫_{-5}^{5} log|t - s| ds` and `ψ = ∫_0^5 log(1 + s²) ds = 5 log 26 - 10 + 2 arctan 5 ≈ 9.04`;
(iv) at `t = √20 ≈ 4.47` (irrational, so never a node), `φ(t) ≈ 11.0 > ψ` with margin `≈ 2`, which
crude bounds on `log` and `arctan` certify. The exact threshold `3.6334…` is where `φ(t) = ψ` and is
not part of the statement. ★★★ (500–800 lines; the book quotes the fact without proof, and it is
optional — see the report's open questions)'''
deps = ["DividedDifference.sub_eval_interpolate_eq_newton", "DividedDifference.newton_inv_sub"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 8.1'

[[node]]
id = "interpRow_sub_le_lebesgueConstant"
kind = "theorem"
desc = '''The stability estimate of §8.1.3: for `hX : IsInterpMatrix X` and `f g : C(Icc a b, ℝ)`,
`‖interpRow X n f - interpRow X n g‖ ≤ lebesgueConstant X n * (⨆ i : Fin (n + 1), |f (X n i) - g (X n i)|)`
(the supremum over the finitely many nodes is a maximum). Pointwise:
`|∑_j (f(x_j) - g(x_j)) l_j(t)| ≤ max_j |f(x_j) - g(x_j)| · ∑_j |l_j(t)|` and `∑_j |l_j(t)| ≤ Λ_n`
by `le_csSup` (`Lagrange.interpolateCLM_apply`, `bddAbove` of the Lebesgue function on a compact
set). The book's remark that `Λ_n` "plays the role of the condition number" is this bound. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.interpRow", "QuarteroniSaccoSaleri.Chapter08.lebesgueConstant", "Lagrange.interpolateCLM_apply"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.3'

[[node]]
id = "lebesgueConstant_equispaced"
kind = "theorem"
desc = '''The equispaced asymptotics of §8.1.3: for the equispaced interpolation matrix
`X n j = a + j (b - a)/n`, `lebesgueConstant X n · (e n log n) / 2^{n+1} → 1` — the book's
`Λ_n(X) ≃ 2^{n+1}/(e n log n)`, which is Turetskii's theorem (1940; Natanson, *Constructive
Function Theory*). Not formalized: the asymptotic equivalence needs the precise evaluation of the
Lebesgue function near the ends of the interval and the book states it without proof. A rigorous
one-sided bound `lebesgueConstant X n ≥ 2^{n-3}/n²` (Schönhage) is provable by evaluating the
Lebesgue function at the midpoint of the first panel, and would suffice to show that equispaced
interpolation is unstable; it is not stated by the book and is not planned.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.lebesgueConstant"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.1.3 (Natanson; Turetskii 1940)'
