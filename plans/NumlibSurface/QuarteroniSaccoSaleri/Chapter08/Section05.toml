[[node]]
id = "equation_8_39"
kind = "theorem"
desc = '''(8.39): for a triangle `T` of diameter `h_T`, `f ∈ C^{k+1}(T)` and the `𝒫_k` Lagrange
interpolant `Π_T^k f` at the `d_k` local nodes, `‖f - Π_T^k f‖_{∞,T} ≤ C h_T^{k+1} ‖f^{(k+1)}‖_{∞,T}`
with `C` independent of `h_T` and `f` (`‖f^{(k+1)}‖_{∞,T}` the supremum of the `(k+1)`-st
derivative tensor). Not formalized: the brief rules the two-dimensional interpolation estimates
out of scope, and the book quotes Ciarlet–Lions Theorem 16.1, whose proof is the Bramble–Hilbert
lemma over `W^{k+1,∞}`. Honest caveat for a future pass: the sup-norm case is elementary — Taylor's
theorem at a point of `T` (`taylor_mean_remainder_bound` in several variables via
`ContDiff` along segments) plus the boundedness of the reference basis functions, which are
polynomials in the barycentric coordinates and so bounded on `T` by a constant depending on `k`
only — and needs no shape regularity; it is a `★★★` bookkeeping project, not a blocker.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_38_comp"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.39)'

[[node]]
id = "equation_8_40"
kind = "theorem"
desc = '''(8.40): on a regular triangulation `𝒯_h` of a polygon `Ω` (`max_T h_T/ρ_T ≤ σ`) with mesh
`h`, `‖f - Π_h^k f‖_{∞,Ω} ≤ C h^{k+1} ‖f^{(k+1)}‖_{∞,Ω}` for every `f ∈ C^{k+1}(Ω)`. Not formalized:
it needs the triangulation and the global interpolant `Π_h^k` of (8.37), which are not planned
(no numbered one-dimensional result depends on them), and it rests on `equation_8_39`. Reading: for
the sup norm the regularity assumption is superfluous — (8.40) is the maximum of (8.39) over the
elements — and is inherited from the Sobolev-norm version of the cited theorem; recorded in the
report's errata.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_39"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.40)'
