[[node]]
id = "equation_8_56"
kind = "theorem"
desc = '''(8.55)–(8.56): with `2k` fictitious knots `x_{-k} ≤ ⋯ ≤ x_{-1} ≤ x_0 = a` and
`b = x_n ≤ x_{n+1} ≤ ⋯ ≤ x_{n+k}` (in the shifted indexing, a nondecreasing `x : ℕ → ℝ` with
