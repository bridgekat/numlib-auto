[[node]]
id = "bSpline_minimalSupport"
kind = "theorem"
desc = '''§8.6.2, quoted from Schoenberg: `B_{i,k+1}` is, up to a scalar, the unique nonzero spline of
degree `k` and class `C^{k-1}` on `ℝ` supported in `[x_i, x_{i+k+1}]`: if `s : ℝ → ℝ` is `C^{k-1}`,
a polynomial of degree `≤ k` on each `[x_j, x_{j+1}]` and outside `[x_i, x_{i+k+1}]`, and vanishes
outside `[x_i, x_{i+k+1}]`, then `s = c • BSpline.bspline x k i` for some `c`. Proof: by the
truncated-power representation (`Spline.span_truncPow_eq_splineSpace` on a large interval, with
vanishing to the left of `x_i` killing the polynomial part), `s = ∑_{j=i}^{i+k+1} c_j (t - x_j)_+^k`;
vanishing to the right of `x_{i+k+1}` says `∑_j c_j (t - x_j)^k = 0` as a polynomial, `k + 1`
linear conditions on `k + 2` unknowns whose matrix (the moments `∑_j c_j x_j^p = 0`, `p ≤ k`,
after binomial expansion) is a `(k+1) × (k+2)` Vandermonde of full rank, so the kernel is
one-dimensional, and (8.53) exhibits `B_{i,k+1}` in it. ★★★

Blocked: not attempted in this pass. The route above (truncated-power representation, a Vandermonde
kernel of dimension one) is a 300-line development with no backbone support for the kernel computation;
estimate one focused day.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_53", "Spline.span_truncPow_eq_splineSpace"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.6.2 (Schoenberg 1967)'

