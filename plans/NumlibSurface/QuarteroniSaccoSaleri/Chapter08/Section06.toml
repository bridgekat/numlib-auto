desc = '''(8.53): `B_{i,k+1}(t) = (x_{i+k+1} - x_i) ∑_{j=0}^{k+1} (x_{i+j} - t)_+^k / ∏_{l ≠ j} (x_{i+j} - x_{i+l})`
for strictly increasing knots and `1 ≤ k`; `BSpline.bspline_eq_sum_truncPow`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.definition_8_2", "BSpline.bspline_eq_sum_truncPow"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.53)'

