namespace = "QuarteroniSaccoSaleri.Chapter08"
desc = '''
QSS §8.6: approximation by splines — Definition 8.1 and the dimension `n + k` of `𝒮_k`, the
periodic (8.44) and natural (8.45) conditions, the truncated-power basis of Exercise 10;
interpolatory cubic splines (§8.6.1): the panel representation (8.46), the M-continuity system
(8.47)–(8.48) and its unique solvability for the natural, clamped and "prolonged" closures, the
not-a-knot closure, the cardinal spline basis, the Holladay minimum-norm Property 8.2 with its
clamped version (Exercise 11) and the best-approximation property of the clamped spline, and the
error bounds of Property 8.3; B-splines (§8.6.2): Definition 8.2, the explicit form (8.53),
support, positivity and minimal support, the Cox–de Boor recursion (8.54), coincident knots
(Remark 8.3), the uniform cubic B-spline (Example 8.9), the B-spline basis (8.55)–(8.57), and
knot insertion (Remark 8.4).

The backbone is `Numlib/Approximation/Spline` (`Spline.splineSpace`, `Spline.momentMatrix`,
`Spline.cubicInterp`, `Spline.holladay`, …) and `Numlib/Approximation/BSpline`
(`BSpline.bspline` by the recursion, Definition 8.2 as the theorem
`BSpline.bspline_eq_mul_newton_truncPow`). Conventions: the partition is
`a = x 0 < x 1 < ⋯ < x n = b` (`Spline.IsPartition a b n x`), `n` panels; the book's B-spline
`B_{i,k+1}` of degree `k` is `BSpline.bspline x k i`, and the book's fictitious knots
`x_{-k}, …, x_{-1}` are the knots `x 0, …, x (k-1)` of a shifted sequence with the data knots
at `x k, …, x (n + k)`. Example 8.8 (table) and Remark 8.2 (software) are skipped.
'''

[[node]]
id = "definition_8_1"
kind = "definition"
desc = '''Definition 8.1: `𝒮_k`, the splines of degree `k` relative to the nodes `a = x 0 < ⋯ < x n = b`
— functions on `[a, b]` that are polynomials of degree `≤ k` on every `[x j, x (j+1)]` (8.41) and
of class `C^{k-1}` on `[a, b]` (8.42): `splineSpaceQSS a b n x k := Spline.splineSpace a b n x k (k - 1)`,
a submodule of `C(Icc a b, ℝ)`, with `mem_definition_8_1_iff` unfolding (8.41)–(8.42). ★'''
deps = ["Spline.splineSpace"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Definition 8.1'

[[node]]
id = "definition_8_1_finrank"
kind = "theorem"
desc = '''`dim 𝒮_k = n + k`: for `Spline.IsPartition a b n x`, `1 ≤ n` and `1 ≤ k`,
`Module.finrank ℝ (splineSpaceQSS a b n x k) = n + k`. `Spline.finrank_splineSpace` at `r = k - 1`:
`n (k - (k - 1)) + (k - 1) + 1`. The book's count (8.43), `(k + 1) n - k (n - 1)`, is the same
number. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.definition_8_1", "Spline.finrank_splineSpace"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Definition 8.1 and (8.43)'

[[node]]
id = "equation_8_44"
kind = "definition"
desc = '''(8.44), periodic splines: `IsPeriodicSpline a b k s` for `s : ℝ → ℝ` says
`iteratedDeriv m s a = iteratedDeriv m s b` for all `m ≤ k - 1`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.44)'

[[node]]
id = "equation_8_45"
kind = "definition"
desc = '''(8.45), natural splines of odd degree `k = 2l - 1`, `l ≥ 2`: `IsNaturalSpline a b l s` says
`iteratedDeriv (l + j) s a = 0` and `iteratedDeriv (l + j) s b = 0` for all `j ≤ l - 2`; for `l = 2`
(cubic) this is `s''(a) = s''(b) = 0`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.45)'

[[node]]
id = "exercise_8_10"
kind = "theorem"
desc = '''Exercise 8.10 (cited in §8.6): `1, t, …, t^k, (t - x_1)_+^k, …, (t - x_{n-1})_+^k` form a
basis of `𝒮_k[a, b]`, so every `s_k ∈ 𝒮_k` is `∑_{i ≤ k} b_i t^i + ∑_{1 ≤ j ≤ n-1} c_j (t - x_j)_+^k`:
`Spline.exists_basis_truncPow`, for `Spline.IsPartition a b n x`, `1 ≤ n`, `1 ≤ k`. (The book's
`g` is the number of interior nodes, `n - 1`.) ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.definition_8_1", "Spline.exists_basis_truncPow"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Exercise 8.10'

[[node]]
id = "IsCubicInterpSpline"
kind = "definition"
desc = '''"The cubic spline interpolating the values `f_i`": `IsCubicInterpSpline a b n x f s :=
Spline.IsCubicInterp a b n x f s` — `s` is `C²` on `[a, b]`, a cubic on every panel, and
`s (x i) = f i` for `i ≤ n`; with the notation `m_i = s'(x_i)`, `M_i = s''(x_i)`. ★'''
deps = ["Spline.IsCubicInterp"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.6.1'

[[node]]
id = "equation_8_46"
kind = "theorem"
desc = '''(8.46): for `hs : IsCubicInterpSpline a b n x f s`, `M i := deriv (deriv s) (x i)` and
`1 ≤ i ≤ n`, on `[x (i-1), x i]` the second derivative is linear,
`deriv (deriv s) t = M (i-1) * (x i - t)/h_i + M i * (t - x (i-1))/h_i`, `h_i = x i - x (i-1)`; and
`equation_8_46_integrated`: `s = Spline.panelCubic x f M i` on that panel (the display following
(8.46) with `C_{i-1}, C̃_{i-1}` determined by the end values). `Spline.IsCubicInterp.eq_cubicSplineFun`
and `Spline.deriv2_panelCubic`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.IsCubicInterpSpline", "Spline.IsCubicInterp", "Spline.panelCubic_left"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.46)'

[[node]]
id = "equation_8_47"
kind = "theorem"
desc = '''(8.47), the M-continuity system: for `hs : IsCubicInterpSpline a b n x f s` and every
interior node `1 ≤ i ≤ n - 1`, `μ_i M_{i-1} + 2 M_i + λ_i M_{i+1} = d_i` with
`μ_i = h_i/(h_i + h_{i+1})`, `λ_i = h_{i+1}/(h_i + h_{i+1})`,
`d_i = (6/(h_i + h_{i+1})) ((f_{i+1} - f_i)/h_{i+1} - (f_i - f_{i-1})/h_i)`.
`Spline.IsCubicInterp.moment_eq` / `Spline.moment_eq_of_contDiffOn`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.IsCubicInterpSpline", "Spline.moment_eq_of_contDiffOn"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.47)'

[[node]]
id = "equation_8_48"
kind = "theorem"
desc = '''(8.48), the closed tridiagonal system and its unique solvability: for
`Spline.IsPartition a b n x`, `1 ≤ n`, closure parameters `0 ≤ λ_0 ≤ 1`, `0 ≤ μ_n ≤ 1` and any
`d_0, d_n`, the system `Spline.momentMatrix n h λ_0 μ_n *ᵥ M = Spline.momentRhs n h f d_0 d_n` has
exactly one solution (`Spline.isUnit_momentMatrix`, the matrix being strictly diagonally dominant),
and there is exactly one `s` with `IsCubicInterpSpline a b n x f s` whose moments satisfy the two
closure equations `2 M_0 + λ_0 M_1 = d_0`, `μ_n M_{n-1} + 2 M_n = d_n`
(`Spline.existsUnique_isCubicInterp_of_closure`). The book's "popular choice" `λ_0 = μ_n = 1`,
`d_0 = d_1`, `d_n = d_{n-1}` is the instance `equation_8_48_prolonged`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_47", "Spline.momentMatrix", "Spline.momentRhs", "Spline.isUnit_momentMatrix", "Spline.existsUnique_isCubicInterp_of_closure"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.48)'

[[node]]
id = "naturalCubicSpline_existsUnique"
kind = "theorem"
desc = '''The natural cubic spline (`s''(a) = s''(b) = 0`, i.e. `IsNaturalSpline a b 2 s`) interpolating
`f_0, …, f_n` exists and is unique: `equation_8_48` with `λ_0 = μ_n = d_0 = d_n = 0`
(`Spline.naturalInterp`). Likewise `clampedCubicSpline_existsUnique` for the constrained spline
with `s'(a) = f'_0`, `s'(b) = f'_n` (`Spline.clampedInterp`; the closure `λ_0 = μ_n = 1` with
`d_0 = (6/h_1)((f_1 - f_0)/h_1 - f'_0)`, `d_n = (6/h_n)(f'_n - (f_n - f_{n-1})/h_n)`, which is the
book's remark that (8.48) "can be of the form" above with `f'(a), f'(b)` available). ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_48", "QuarteroniSaccoSaleri.Chapter08.equation_8_45", "Spline.cubicInterp"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.6.1'

[[node]]
id = "notAKnotSpline_existsUnique"
kind = "theorem"
desc = '''The not-a-knot spline of §8.6.1: for `Spline.IsPartition a b n x` and `3 ≤ n` there is exactly
one `s` with `IsCubicInterpSpline a b n x f s` whose third derivative is continuous at `x 1` and at
`x (n-1)` (the cubic pieces on the first two and on the last two panels coincide, so the "active
knots" are `x_0, x_2, …, x_{n-2}, x_n`). `Spline.existsUnique_isCubicInterp_notAKnot`. The
hypothesis `3 ≤ n` is not in the book and is necessary (report, errata). ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.IsCubicInterpSpline", "Spline.existsUnique_isCubicInterp_notAKnot"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.6.1'

[[node]]
id = "cardinalSplineBasis"
kind = "theorem"
desc = '''The cardinal spline basis of §8.6.1: there are cubic splines `φ_0, …, φ_{n+2} ∈ 𝒮_3` with
`φ_i (x j) = δ_ij`, `φ_i'(x_0) = φ_i'(x_n) = 0` for `i ≤ n`, `φ_{n+1} (x j) = 0`, `φ_{n+1}'(x_0) = 1`,
`φ_{n+1}'(x_n) = 0`, `φ_{n+2} (x j) = 0`, `φ_{n+2}'(x_0) = 0`, `φ_{n+2}'(x_n) = 1`; they form a basis
of `𝒮_3`, and the clamped spline is `s_3 = ∑_{i ≤ n} f_i φ_i + f'_0 φ_{n+1} + f'_n φ_{n+2}`.
`Spline.cardinalBasis` and `Spline.clampedInterp_eq_sum_cardinalBasis`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.definition_8_1", "Spline.cardinalBasis"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §8.6.1'

[[node]]
id = "property_8_2"
kind = "theorem"
desc = '''Property 8.2 (Holladay): for `f` of class `C²` on `[a, b]` and `s_3` the natural cubic spline
interpolating `f` at the nodes, `∫ t in a..b, (deriv (deriv s_3) t)^2 ≤ ∫ t in a..b, (deriv (deriv f) t)^2`,
with equality iff `f = s_3` on `[a, b]` (`property_8_2_eq_iff`). `Spline.holladay` and
`Spline.holladay_eq_iff`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.naturalCubicSpline_existsUnique", "Spline.holladay"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 8.2'

