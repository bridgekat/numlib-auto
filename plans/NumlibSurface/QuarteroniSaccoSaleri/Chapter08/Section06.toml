`∑_{i=-k}^{n-1} c_i B_{i,k+1}` on `[a, b]`: the `n + k` B-splines `BSpline.bspline x k i`, `i < n + k`,
restricted to `[a, b]`, form a basis of `splineSpaceQSS a b n (fun j => x (j + k)) k`.
`BSpline.exists_basis_bspline`. ★'''
