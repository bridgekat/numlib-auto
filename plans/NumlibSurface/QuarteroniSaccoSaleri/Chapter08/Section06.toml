[[node]]
id = "equation_8_57"
kind = "theorem"
desc = '''(8.57), coincident fictitious knots: if `x_{-k} = ⋯ = x_0 = a` and `x_n = ⋯ = x_{n+k} = b`, then
`s_k(a) = c_{-k}` and `s_k(b) = c_{n-1}` for `s_k = ∑ c_i B_{i,k+1}` (the value at `b` as the
left limit, or as the value of the continuous extension to `[a, b]`).
`BSpline.sum_smul_bspline_left` and `_right`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_56", "BSpline.sum_smul_bspline_left"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (8.57)'

[[node]]
id = "remark_8_4"
kind = "theorem"
desc = '''Remark 8.4, Boehm's knot insertion: for a spline `s_k = ∑_{i=-k}^{n-1} c_i B_{i,k+1}` and a new
knot `x̃ ∈ [x_j, x_{j+1})`, the same function is `∑ d_i B̃_{i,k+1}` on the refined knots `y` with
`d_i = ω_i c_i + (1 - ω_i) c_{i-1}` (the book prints `c_i` twice; report, errata), where `ω_i = 1`
for `i ≤ j - k`, `ω_i = (y_{j+1} - y_i)/(y_{i+k+1} - y_i)` for `j - k < i ≤ j`, `ω_i = 0` for `i > j`.
`BSpline.sum_smul_bspline_insertKnot` with `BSpline.insertKnot`, `BSpline.insertKnotCoeff`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter08.equation_8_56", "BSpline.sum_smul_bspline_insertKnot", "BSpline.insertKnot"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 8.4'
