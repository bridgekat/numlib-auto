[[node]]
id = "property_8_3"
kind = "theorem"
desc = '''Property 8.3: for `f` of class `C⁴` on `[a, b]`, a partition with `h = max h_i`,
`β = h / min h_i`, and `s_3` the cubic spline interpolating `f`,
`‖f^{(r)} - s_3^{(r)}‖_∞ ≤ C_r h^{4-r} ‖f^{(4)}‖_∞` for `r = 0, 1, 2, 3` with `C_0 = 5/384`,
`C_1 = 1/24`, `C_2 = 3/8`, `C_3 = (β + β⁻¹)/2`. Reading: the constants are those of Hall and Meyer
(*Optimal error bounds for cubic spline interpolation*, J. Approx. Theory 16, 1976) for the
**clamped** (complete) spline `s_3'(a) = f'(a)`, `s_3'(b) = f'(b)`; the book does not say which
end conditions it means, and for the natural spline the statement is false unless
`f''(a) = f''(b) = 0` (the natural spline of `f(t) = t²` is not `t²`, and its error is `O(h²)`
near the ends). Not formalized: the sharp constants are the Hall–Meyer theorem, quoted by the
book without proof; the `O(h⁴)` bound with non-sharp constants for `r = 0, 1, 2` is planned as
`Spline.norm_sub_clampedInterp_le` (`★★★`) and the surface can state that version as
`property_8_3_weak` once it exists.'''
deps = ["QuarteroniSaccoSaleri.Chapter08.naturalCubicSpline_existsUnique", "Spline.norm_sub_clampedInterp_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 8.3'

[[node]]
id = "definition_8_2"
kind = "theorem"
desc = '''Definition 8.2: the normalized B-spline `B_{i,k+1}` of degree `k` on the distinct nodes
`x_i, …, x_{i+k+1}` is `(x_{i+k+1} - x_i) g[x_i, …, x_{i+k+1}]` with `g(s) = (s - t)_+^k` (8.51)–(8.52).
Define `bSplineQSS x k i t := (x (i+k+1) - x i) * DividedDifference.newton (fun s => Quadrature.truncPow k s t) (fun j : Fin (k+2) => x (i + j))`
and prove `bSplineQSS x k i = BSpline.bspline x k i` for strictly increasing `x` and `1 ≤ k`:
`BSpline.bspline_eq_mul_newton_truncPow`. (For `k = 0` the two differ at the knots; the book's
degree-`0` B-spline (8.54) is the indicator of a closed interval, which is not even a partition
of unity.) ★'''
deps = ["BSpline.bspline_eq_mul_newton_truncPow", "DividedDifference.newton", "Quadrature.truncPow"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Definition 8.2'

[[node]]
id = "equation_8_53"
