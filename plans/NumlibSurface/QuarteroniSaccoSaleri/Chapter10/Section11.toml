[[node]]
id = "equation_10_80"
kind = "theorem"
desc = '''(10.80): for a linear shift-invariant system `S` and admissible inputs `f, g`,
`S(f ⋆ g) = f ⋆ S(g)`. Not formalized: the book's "physical linear system" is not a defined
mathematical object — no domain, no continuity — and the identity requires `S` to commute with
the integral defining the convolution (true for a bounded translation-invariant operator on `L¹`
or `L²` by a Bochner-integral argument), which the book neither assumes nor proves. Its
consequences `u = i ⋆ h` and (10.81) are stated for a system *given* as a convolution.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_76"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.80)'

