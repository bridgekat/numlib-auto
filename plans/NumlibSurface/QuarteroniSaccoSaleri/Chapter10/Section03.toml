[[node]]
id = "equation_10_22"
kind = "theorem"
desc = '''(10.22): there is `C` independent of `n` with `‖f - Pi^{GL}_{n,w} f‖_w <= C n^{-s} ‖f‖_{s,w}` for
every `f` with `s >= 1` derivatives in `L^2_w`, where `Pi^{GL}_{n,w} f` is the interpolant of
degree `n` (the book prints "degree `n + 1`") at the Chebyshev-Gauss-Lobatto nodes (10.21). Quoted
from [CHQZ88] p. 298 without proof.

Blocked (2026-09-20, agent qss5; replaces the 2026-09-15 note). One of five nodes — (10.22),
(10.24), (10.26)–(10.27), (10.36)–(10.37), (10.71) — stating the spectral-approximation estimate for
the Chebyshev or the Legendre weight, all resting on a module `Approximation/SpectralProjection`
that does not exist and has no Mathlib counterpart. Checked in `Numlib/` on 2026-09-20 (agent qss5):
the `L²(-1,1)` orthogonal-polynomial Hilbert basis with its truncation as the best approximation
(`IsWeight.hilbertBasis`, `IsWeight.isBestApprox_truncation`,
`Numlib/Approximation/OrthogonalPolynomial`), the Chebyshev orthogonality
`integral_T_mul_T_div_sqrt` and Mathlib's operator identity
`Polynomial.Chebyshev.one_sub_X_sq_mul_derivative_derivative_T_eq_poly_in_T`; for Legendre the
operator identities `legendre_ode`, `quad_mul_derivative_legendre`, the coefficient layer on `ℙ_N` —
`Polynomial.legendreCoeff`, `eq_sum_legendreCoeff`, Parseval `integral_sq_eq_sum_legendreCoeff`,
`integral_derivative_legendre_mul_legendre`, the `L²` Markov inequality `integral_derivative_sq_le`
(`Numlib/Approximation/MarkovInequality`, agent qss1) — and the Gauss–Lobatto norm equivalence
`‖p‖ ≤ ‖p‖_n ≤ √3 ‖p‖` on `ℙ_n` (`Quadrature.integral_sq_le_discreteInner_self_legendre`,
`Quadrature.discreteInner_self_legendre_le_three_mul_integral_sq`,
`Numlib/Approximation/OrthogonalPolynomial/LegendreBounds`); on the surface, the discrete inner
products and their exactness on `ℙ_{2n-1}` (`equation_10_28`, `isExactOnMeasure_chebyshevLobatto`,
`equation_10_34`) and the discrete Chebyshev expansion (10.31). Nothing about the projection or
interpolation *error* exists. Two corrections to the 2026-09-15 three-layer route (projection
estimate in the non-uniformly weighted seminorm; Hardy-type comparison with the uniform norm
(10.23); aliasing from projection to interpolant). The comparison layer is not needed for the `L²`
statements: the seminorm `(∑_{k≤s} ‖(1−x²)^{k/2} f^{(k)}‖²_w)^{1/2}` is bounded by (10.23) termwise
because `(1 − x²)^{k/2} ≤ 1`, so the projection estimate in the seminorm gives the book's right-hand
side at once (a Hardy inequality would only serve the reverse comparison). The aliasing layer at the
*printed* rate `n^{-s}` is the expensive part: the elementary argument
(`Π_n f − P_n f = Π_n (P_n f − f)`, `‖Π_n g‖_w ≤ C ‖g‖_n ≤ C' ‖g‖_∞` by the discrete norm
equivalence, `‖f − P_n f‖_∞ ≤ ∑_{k>n} |f̂_k| sup|T_k|`) loses a factor `n^{1/2}` and yields
`‖f − Π_n f‖_w ≤ C n^{1/2−s} ‖f‖_{s,w}`; the printed rate is Canuto–Quarteroni's / Bernardi–Maday's
argument through the `H¹` projection and a Marcinkiewicz–Zygmund-type bound
`‖v‖_n ≤ C (‖v‖_w + n⁻¹ ‖v'‖_w)`, which needs the node-spacing estimate — a Sturm comparison for the
Chebyshev/Legendre equation, the gap `spectralForm_eigenvalue_*` (Chapter13/Section03) also records.
Missing now, in order: (i) the projection estimate `‖f − P_n f‖_w ≤ C n^{-s} ‖f‖_{s,w}` for
`f ∈ C^s[-1,1]`: the Sturm–Liouville symmetry `∫ (L u) v w = ∫ u (L v) w` with the boundary terms
killed by the factor `1 − x²`, iterated `⌊s/2⌋` times with one half-step
`∫ (L u) v w = −∫ (1−x²) u' v' w` for odd `s`, and the tail bound
`∑_{k>n} λ_k^{-2m} |ĝ_k|² ‖T_k‖² ≤ λ_{n+1}^{-2m} ‖g‖²_w` (`λ_k = k²` for Chebyshev, `k(k+1)` for
Legendre) — ~600–800 lines per weight, no missing theory; (iii) the aliasing layer, ~200 lines for
the `n^{1/2−s}` form on top of (i), well over 1000 for the printed one. Estimate for this node at
the printed rate: ~2000 lines and a plan of its own; a weakened statement at the rate `n^{1/2−s}` is
~1000 lines away and would have to be a new node beside this one, since (10.22) as printed is the
sharp rate quoted from [CHQZ88].'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_21", "QuarteroniSaccoSaleri.Chapter10.equation_10_23"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.22)'

[[node]]
id = "equation_10_24"
kind = "theorem"
desc = '''(10.24) (Exercise 3): `‖f - Pi^{GL}_{n,w} f‖_inf <= C n^{1/2 - s} ‖f‖_{s,w}`, and the same for the
interpolant at the Gauss nodes (10.20); hence pointwise convergence for `f` of class `C^1`.

Blocked (2026-09-20, agent qss5; replaces the 2026-09-15 note). Rests on (10.22) — see its note for
what exists and what is missing — and on the derivative estimate (10.71), joined by the
one-dimensional Gagliardo–Nirenberg inequality `‖v‖²_∞ ≤ ‖v‖²_{L²(-1,1)} + 2 ‖v‖ ‖v'‖`, which is
still absent (`Numlib/Analysis/Sobolev/Interval/Embedding` has the `L^∞` embedding
`‖u‖_∞ ≤ C ‖u‖_{W^{1,p}}` of Brezis Theorem 8.8 and the `L^p`–`L^∞` interpolation
`eLpNorm_le_eLpNorm_rpow_mul_eLpNorm_top_rpow`, not the product form; ~100 lines from the
fundamental theorem of calculus). With the weighted `L²` and `H¹` errors at the rates `n^{-s}` and
`n^{1-s}` the sup-norm rate `n^{1/2-s}` follows by that inequality; note that the elementary
aliasing argument recorded on (10.22) already gives the `L²_w` interpolation error at the rate
`n^{1/2-s}`, so this node's rate is *not* sharper than what that argument yields for (10.22), but
its sup-norm form still needs the `H¹` error (10.71). Estimate: gated on (10.22)/(10.71); ~300 lines
on top of them.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_22"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.24); Exercise 10.3'

