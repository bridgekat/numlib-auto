[[node]]
id = "equation_10_22"
kind = "theorem"
desc = '''(10.22): there is `C` independent of `n` with `‖f - Π^{GL}_{n,w} f‖_w ≤ C n^{-s} ‖f‖_{s,w}` for
every `f ∈ C^s[-1, 1]`, `s ≥ 1`, where `Π^{GL}_{n,w} f` is the interpolant of degree `n` (the book
prints "degree `n + 1`") at the nodes (10.21). Not formalized: a weighted-Sobolev spectral estimate
quoted from [CHQZ88] p. 298 without proof; it needs the Chebyshev projection error in weighted
`H^s` and the aliasing bound for the Chebyshev discrete transform, none of which exists here or in
Mathlib.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_21", "QuarteroniSaccoSaleri.Chapter10.equation_10_23"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.22)'

[[node]]
id = "equation_10_24"
kind = "theorem"
desc = '''(10.24) (Exercise 3): `‖f - Π^{GL}_{n,w} f‖_∞ ≤ C n^{1/2 - s} ‖f‖_{s,w}`, and the same for the
interpolant at the Gauss nodes (10.20). Not formalized: follows from (10.22) and its derivative
form `‖(f - Π f)'‖_w ≤ C n^{1-s} ‖f‖_{s,w}` through the Gagliardo–Nirenberg inequality
`‖f‖_∞ ≤ ‖f‖^{1/2} ‖f'‖^{1/2}`; the book leaves it to Exercise 3 and the derivative estimate is
quoted.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_22"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.24); Exercise 10.3'

[[node]]
id = "equation_10_25"
kind = "theorem"
desc = '''(10.25): `‖f - Π^G_n f‖_∞ ≤ (1 + Λ_n) E_n^*(f)` for the interpolant at the Chebyshev nodes
(10.20), with `Λ_n ≤ (2/π) log (n+1) + 1` (Rivlin). The first inequality is
`interpolation_error_le_lebesgue` (§10.8); the bound on the Lebesgue constant of the Chebyshev
nodes is `Lagrange.norm_interpolateCLM_chebyshev_le`. ★

Blocked: the backbone node `Lagrange.norm_interpolateCLM_chebyshev_le` (Rivlin's bound on the
Lebesgue constant of the Chebyshev nodes, ★★★ in `Approximation/Interpolation`) is open; the
surface node is a two-line restatement once it exists (the nodes (10.20) are
`chebyshevGaussNode n j` of this module, read as points of `Icc (-1) 1`).'''
deps = ["QuarteroniSaccoSaleri.Chapter10.interpolation_error_le_lebesgue", "Lagrange.norm_interpolateCLM_chebyshev_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.25)'

