[[node]]
id = "equation_10_22"
kind = "theorem"
desc = '''(10.22): there is `C` independent of `n` with `‖f - Pi^{GL}_{n,w} f‖_w <= C n^{-s} ‖f‖_{s,w}` for
every `f` with `s >= 1` derivatives in `L^2_w`, where `Pi^{GL}_{n,w} f` is the interpolant of
degree `n` (the book prints "degree `n + 1`") at the Chebyshev-Gauss-Lobatto nodes (10.21). Quoted
from [CHQZ88] p. 298 without proof.

Blocked: this is one of five nodes of chapter 10 ((10.22), (10.24), (10.26)-(10.27), (10.36)-(10.37)
and (10.71)) that state the same spectral-approximation estimate for the Chebyshev or the Legendre
weight. All five rest on a module that does not exist here and has no counterpart in Mathlib, call
it `Approximation/SpectralProjection`, with three layers:
(i) the *projection* estimate `‖f - P_n f‖_w <= C n^{-s} |f|_{s,w}` for the truncation `P_n` of the
orthogonal series, in the **non-uniformly** weighted seminorm
`|f|_{s,w} = (sum_{k<=s} ‖(1-x^2)^{k/2} f^{(k)}‖_w^2)^{1/2}`. It comes from repeating the
integration by parts against the singular Sturm-Liouville operator of the weight — for Chebyshev
`L u = (1-x^2)^{1/2} ((1-x^2)^{1/2} u')'` with `L T_k = -k^2 T_k`, for Legendre
`L u = ((1-x^2) u')'` with `L L_k = -k(k+1) L_k` — whose boundary terms vanish because the factor
`(1-x^2)` does. Only the Legendre operator identity exists here, as
`Polynomial.legendre_ode` and `Polynomial.quad_mul_derivative_legendre`.
(ii) the comparison of that seminorm with the **uniformly** weighted norm `‖f‖_{s,w}` of (10.23)
that the book states the estimates in: a Hardy-type inequality on `(-1, 1)`.
(iii) the *aliasing* step from the projection to the interpolant at the Gauss-Lobatto nodes, which
is (10.27)/(10.36) itself: the discrete inner product is the exact one on `P_{2n-1}`, so the
difference is controlled by the tail of the series, and the tail is estimated again by (i).
[CHQZ88] p. 298 and [BM92] give several pages to each layer; nothing here is a single lemma.
Estimated well over a thousand lines and a plan of its own. The surface nodes are restatements
once that module exists.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_21", "QuarteroniSaccoSaleri.Chapter10.equation_10_23"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.22)'

[[node]]
id = "equation_10_24"
kind = "theorem"
desc = '''(10.24) (Exercise 3): `‖f - Pi^{GL}_{n,w} f‖_inf <= C n^{1/2 - s} ‖f‖_{s,w}`, and the same for the
interpolant at the Gauss nodes (10.20); hence pointwise convergence for `f` of class `C^1`.

Blocked: on (10.22) and on its derivative form `‖(f - Pi f)'‖_w <= C n^{1-s} ‖f‖_{s,w}` (which is
(10.71)), joined by the Gagliardo-Nirenberg inequality `‖v‖_inf <= C ‖v‖^{1/2} ‖v'‖^{1/2}` on
`(-1, 1)` — the last of which is the only cheap ingredient and is not in the library either. See
the blocking note on `equation_10_22` for the missing module; this node adds nothing to it.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_22"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.24); Exercise 10.3'

[[node]]
id = "equation_10_25"
kind = "theorem"
desc = '''(10.25): `‖f - Pi^G_n f‖_inf <= (1 + Lambda_n) E_n^*(f)` for the interpolant at the Chebyshev
nodes (10.20). The first inequality is `interpolation_error_le_lebesgue` (§10.8) and is proved, as
`equation_10_25_interpolation_error`; this node is the combination with the bound on the Lebesgue
constant.

Ready (re-checked 2026-09-16, correcting a stale note that said otherwise). The backbone node
`Lagrange.norm_interpolateCLM_chebyshev_le` is **proved**, with the constant
`2 + (2/pi) log (2n+2)`; what was open was the variant `..._rivlin` carrying the book's printed
`(2/pi) log (n+1) + 1`, and that node has been removed, because at `n = 0` the Lebesgue constant is
exactly `1`, equal to the printed bound, so no step of any proof of it may give anything away, and
the two theorems it needs (Ehlich-Zeller monotonicity, Rivlin's cotangent-sum bound) are
research-level. See the `## Not formalized` section of `Numlib/Approximation/Interpolation.lean`.

So state this node with the proved constant and say in the doc comment that the book's is sharper
and why it is not available. Three steps, none long. (i) The book's nodes are a *permutation* of the
backbone's, not a reflection: `chebyshevGaussNode n j = Lagrange.chebNode n (n - j)`, so
`Lagrange.interpolateCLM_comp_equiv` at the reversal of `Fin (n+1)` identifies the two interpolation
operators. (ii) `Lagrange.norm_interpolateCLM` identifies the `sSup` of the Lebesgue
function appearing in `equation_10_25_interpolation_error` with the operator norm the backbone
bounds. (iii) Combine. The module doc's `## Not formalized` paragraph must be updated in the same
breath: it currently names `Lagrange.norm_interpolateCLM_chebyshev_le` as open, which it is not.'''
deps = ["QuarteroniSaccoSaleri.Chapter10.equation_10_25_interpolation_error", "Lagrange.norm_interpolateCLM_chebyshev_le", "Lagrange.interpolateCLM_comp_equiv", "Lagrange.norm_interpolateCLM"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (10.25)'

