[[node]]
id = "growthFactor_band"
kind = "theorem"
desc = '''§3.10 (1): for banded `A` with upper and lower bandwidth `p`, `ρ_n ≤ 2^{2p-1} - (p-1) 2^{p-2}`
(Bohte). The tridiagonal consequence `ρ_n ≤ 2` is `growthFactor_tridiagonal`. ★★★

Blocked: the book states it without proof and the printed constant is out of reach; see
`Matrix.growthFactor_le_of_hasBandwidth` for what is missing. The weaker rigorous band bound
`ρ_n ≤ 2^{p+q}` for lower bandwidth `p` and upper bandwidth `q` — which carries the point of the
book's item (1), that the growth factor of a banded matrix is bounded independently of `n` — is
`Matrix.growthFactor_le_two_pow_of_hasBandwidth` and is not restated here, since it is not the
book's statement.'''
deps = ["Matrix.growthFactor_le_of_hasBandwidth", "QuarteroniSaccoSaleri.Chapter03.equation_3_66"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.10'

