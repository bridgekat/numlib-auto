namespace = "QuarteroniSaccoSaleri.Chapter03"
desc = '''
§3.10, accuracy of GEM: the backward error of the solve (3.64)–(3.65), the growth factor (3.66)
with Wilkinson's bound (3.67) and the growth-factor bounds for special classes, Examples 3.7–3.8,
and the digit-count heuristic (3.69). Backbone: `Numlib/FloatingPoint/LU`,
`Numlib/LinearAlgebra/Matrix/LU/Pivoting`. The book's first-order displays (`+ O(u²)`) are stated in
their rigorous `γ`-forms (Higham Theorems 9.4–9.5), which imply them; the residual display before
Example 3.8 is `equation_3_21`.
'''

[[node]]
id = "equation_3_64"
kind = "theorem"
desc = '''(3.64), rigorous form: the solution `x̂` computed by GEM (admissible factors `FloatingPoint.RoundsLU m A
L̂ Û` and substitutions) solves `(A + δA) x̂ = b` with `|δA| ≤ γ_{3n} |L̂| |Û|` (`3 n u < 1`);
`FloatingPoint.exists_roundsLU_solve_eq`. The book's `|δA| ≤ n u (3|A| + 5|L̂||Û|) + O(u²)`
(Golub–Van Loan) is the first-order form: `γ_{3n} = 3 n u + O(u²)` and `|A| ≤ |L̂||Û| + O(u)` by
(3.40), so the rigorous bound implies it with a smaller constant. ★'''
deps = ["FloatingPoint.exists_roundsLU_solve_eq", "QuarteroniSaccoSaleri.Chapter03.equation_3_40", "QuarteroniSaccoSaleri.Chapter03.equation_3_24"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.64)'

[[node]]
id = "equation_3_65"
kind = "theorem"
desc = '''(3.65), rigorous form: with partial pivoting (`|l̂_ij| ≤ 1`, hence `‖L̂‖_∞ ≤ n`), `‖δA‖_∞ ≤ n γ_{3n}
‖Û‖_∞`; from `equation_3_64` by `Matrix.linfty_opNorm_le_of_abs_entrywiseLE` and
`‖|L̂||Û|‖_∞ ≤ ‖L̂‖_∞ ‖Û‖_∞`. The book's `n u (3‖A‖_∞ + 5 n ‖Û‖_∞) + O(u²)` follows. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter03.equation_3_64", "Matrix.linfty_opNorm_le_of_abs_entrywiseLE", "QuarteroniSaccoSaleri.Chapter03.equation_3_52"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.65)'

[[node]]
id = "equation_3_66"
kind = "definition"
desc = '''(3.66), the growth factor `ρ_n = max_{i,j,k} |â^{(k)}_ij| / max_{i,j} |a_ij|`: `Matrix.growthFactor A`
on the exact stages `Matrix.gemStage` (the book writes the computed `â^{(k)}_ij`; Higham explains
after his Theorem 9.5 why bounds are available only for the exact ones). For GEPP,
`growthFactor (P A)` with `P` the permutation `Matrix.gemPivotStage` produces. ★'''
deps = ["Matrix.growthFactor", "Matrix.gemStage"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.66)'

[[node]]
id = "equation_3_67"
kind = "theorem"
desc = '''(3.67), Wilkinson, conditional form: if the computed factors satisfy `|l̂_ij| ≤ 1` and `|û_ij| ≤ ρ
max_{i,j} |a_ij|`, then `‖δA‖_∞ ≤ n² γ_{3n} ρ ‖A‖_∞` for the `δA` of `equation_3_64`;
`FloatingPoint.linfty_opNorm_le_of_roundsLU_solve`. With `ρ = ρ_n` this is the book's `8 u n³ ρ_n
‖A‖_∞ + O(u²)` up to the constant (`n² γ_{3n} = 3 n³ u + O(u²)`); the hypotheses are exactly the
facts about `L̂`, `Û` that the book (like Higham) borrows from the exact factors. ★'''
deps = ["FloatingPoint.linfty_opNorm_le_of_roundsLU_solve", "QuarteroniSaccoSaleri.Chapter03.equation_3_66", "QuarteroniSaccoSaleri.Chapter03.equation_3_65"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.67)'

