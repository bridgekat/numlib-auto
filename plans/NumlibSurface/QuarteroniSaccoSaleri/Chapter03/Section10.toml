[[node]]
id = "example_3_7_cond"
kind = "theorem"
desc = '''Example 3.7, (3.68): for `ε > 0`, `A = !![ε, 1; 1, 0]` has `K_∞(A) = (1 + ε)²` (`A⁻¹ = !![0, 1; 1,
-ε]`, `‖A‖_∞ = ‖A⁻¹‖_∞ = 1 + ε`), and `x = ![1, 1]` solves `A x = ![1 + ε, 1]`. `norm_num` with the
row-sum formula `Matrix.linfty_opNorm_def`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 3.7'

[[node]]
id = "example_3_7_lu"
kind = "theorem"
desc = '''Example 3.7 with Exercise 6: the LU factorization of `!![ε, 1; 1, 0]` without pivoting is `L =
!![1, 0; ε⁻¹, 1]`, `U = !![ε, 1; 0, -ε⁻¹]` (`Matrix.IsLU`, unique by Theorem 3.4), whose entries are
of modulus `ε⁻¹`; with partial pivoting `P A = !![1, 0; ε, 1] * !![1, 0; 0, 1]` (rows exchanged),
whose factors are bounded by `1`. The numerical run of Example 3.7 is not a node. ★'''
deps = ["Matrix.IsLU", "QuarteroniSaccoSaleri.Chapter03.theorem_3_4", "QuarteroniSaccoSaleri.Chapter03.example_3_7_cond"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 3.7'

[[node]]
id = "example_3_8"
kind = "theorem"
desc = '''Example 3.8: `A = !![1, 1.0001; 1.0001, 1]` has `K_∞(A) = 20001` (`A⁻¹ = -(1/(1.0001² - 1)) !![1,
