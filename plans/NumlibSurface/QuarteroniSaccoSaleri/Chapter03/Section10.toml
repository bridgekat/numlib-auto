[[node]]
id = "growthFactor_completePivoting"
kind = "theorem"
desc = '''§3.10: with complete pivoting `ρ_n ≤ n^{1/2} (2 · 3^{1/2} ⋯ n^{1/(n-1)})^{1/2}` (Wilkinson). ★★★

Blocked: stated without proof in the book. The proof is reconstructed in the `desc` of the backbone
node `Matrix.growthFactor_le_of_completePivoting` (Hadamard's inequality on the leading blocks of
every reduced matrix, then a telescoping induction over the pivots); it is ordinary mathematics,
but three things are missing: a stage recurrence for complete pivoting (the library's
`Matrix.gemPivotStage` permutes rows only), Hadamard's determinant inequality (absent from Mathlib
and from this project, though cheap from `Matrix.exists_unitary_mul_upperTriangular`), and the
`rpow` bookkeeping of the induction. See the backbone node for the details.'''
deps = ["Matrix.growthFactor_le_of_completePivoting", "QuarteroniSaccoSaleri.Chapter03.completePivoting", "QuarteroniSaccoSaleri.Chapter03.equation_3_66"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.10'

