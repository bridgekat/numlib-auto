[[node]]
id = "growthFactor_band"
kind = "theorem"
desc = '''§3.10 (1): for banded `A` with upper and lower bandwidth `p`, `ρ_n ≤ 2^{2p-1} - (p-1) 2^{p-2}`
(Bohte). Not formalized: the book states it without proof; see
`Matrix.growthFactor_le_of_hasBandwidth` for the reason (a combinatorial band-propagation argument
with no library counterpart). The tridiagonal consequence `ρ_n ≤ 2` is `growthFactor_tridiagonal`.
★★★'''
deps = ["Matrix.growthFactor_le_of_hasBandwidth", "QuarteroniSaccoSaleri.Chapter03.equation_3_66"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.10'

