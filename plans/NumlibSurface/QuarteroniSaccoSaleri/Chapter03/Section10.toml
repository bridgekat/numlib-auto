20001`); and for `x̂ = ![-4.499775, 5.5002249]` the residual `b - A x̂` has `‖·‖_∞ ≤ 0.001`
although `‖x̂ - x‖_∞ ≥ 4` with `x = A⁻¹ ![1, 1]` (`x ≈ ![0.499975, 0.499975]`). `norm_num`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter03.equation_3_21"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Example 3.8'

