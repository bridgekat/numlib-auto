namespace = "QuarteroniSaccoSaleri.Chapter03"
desc = '''
§3.9, sparse matrices: the pattern graph, the envelope (3.59) and fill-in confinement (3.60), the
substructuring reduction (3.63) and Remark 3.6 on the Schur complement. Backbone:
`Numlib/LinearAlgebra/Sparse/Pattern` (`Matrix.adjDigraph`), `Numlib/LinearAlgebra/Matrix/LU`
(`envelope`), `Numlib/LinearAlgebra/Matrix/SchurComplement`. The Cuthill–McKee and nested
dissection algorithms (§3.9.1, §3.9.3) state no theorem — the fact they rest on, that a level-set
ordering is block tridiagonal, is `Matrix.apply_eq_zero_of_dist_lt` of
`Numlib/LinearAlgebra/Sparse/Reordering`; the operation count (3.61), the setup equation (3.62),
Remark 3.5 and Exercise 8 are not nodes.
'''

[[node]]
id = "adjacencyGraph"
kind = "definition"
desc = '''§3.9: the oriented graph `G(A)` of a square matrix, with an arrow `i → j` iff `a_ij ≠ 0` (a loop at
`i` iff `a_ii ≠ 0`): `Matrix.adjDigraph A`, with `Matrix.adjDigraph_adj`. The book allows rectangular
`A` with `max(m, n)` vertices; the square case is what the section uses. ★'''
deps = ["Matrix.adjDigraph"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.9'

[[node]]
id = "equation_3_59"
kind = "definition"
desc = '''(3.59): `m_i(A) = i - min {j < i : a_ij ≠ 0}` and the envelope (the book's "convex hull") `E(A) = {(i,
j) : 0 < i - j ≤ m_i(A)}`: `Matrix.envelope A`, with the equivalence to the book's description on
`Fin n` (`Matrix.mem_envelope_iff`). ★'''
deps = ["Matrix.envelope"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.59)'

[[node]]
id = "equation_3_60"
kind = "theorem"
desc = '''(3.60): for a symmetric positive definite `A` with Cholesky factor `H` (upper), `E(A) = E(H + Hᵀ)` —
fill-in is confined to the envelope and reaches its boundary. Through the unit-lower factor
(`Matrix.IsLU.envelope_eq`: `envelope L = envelope A`) and `Hᵀ = L D^{1/2}`, whose strict lower
pattern is that of `L`. ★'''
deps = ["Matrix.IsLU.envelope_eq", "QuarteroniSaccoSaleri.Chapter03.equation_3_59", "QuarteroniSaccoSaleri.Chapter03.theorem_3_6", "QuarteroniSaccoSaleri.Chapter03.theorem_3_4"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.60)'

[[node]]
id = "equation_3_63"
kind = "theorem"
desc = '''(3.63): for the block system `fromBlocks A₁₁ A₁₃ A₁₃ᵀ A₃₃'` of the first substructure with `A₁₁ = H₁₁ᵀ
H₁₁`, eliminating `x₁` leaves the interface system with matrix `A₃₃‴ = A₃₃ - H₂₁ᵀ H₂₁` where `H₂₁ =
H₁₁⁻ᵀ A₁₃`, i.e. `A₃₃ - A₁₃ᵀ A₁₁⁻¹ A₁₃`, the Schur complement (`Matrix.schurComplement`), and
right-hand side `b₃ - H₂₁ᵀ c₁ = b₃ - A₁₃ᵀ A₁₁⁻¹ b₁`; then `x₁` follows by back substitution in (3.62).
`Matrix.fromBlocks_eq_mul_schurComplement`. ★'''
deps = ["Matrix.schurComplement", "Matrix.fromBlocks_eq_mul_schurComplement", "QuarteroniSaccoSaleri.Chapter03.theorem_3_6"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.63)'

[[node]]
id = "remark_3_6_schur"
kind = "theorem"
desc = '''Remark 3.6: for `A = fromBlocks (blockDiagonal [A₁₁, A₂₂]) [A₁₃; A₂₃] [A₁₃ᵀ A₂₃ᵀ] A₃₃` with nonsingular
`A₁₁`, `A₂₂`, the Schur complement is `S = A₃₃ - A₁₃ᵀ A₁₁⁻¹ A₁₃ - A₂₃ᵀ A₂₂⁻¹ A₂₃`
(`Matrix.schurComplement_fromBlocks_blockDiagonal'`), and `A x = b` is equivalent to `S x₃ = b₃ -
A₁₃ᵀ A₁₁⁻¹ b₁ - A₂₃ᵀ A₂₂⁻¹ b₂` followed by `A₁₁ x₁ = b₁ - A₁₃ x₃`, `A₂₂ x₂ = b₂ - A₂₃ x₃`
(`Matrix.fromBlocks_eq_mul_schurComplement`). ★'''
deps = ["Matrix.schurComplement_fromBlocks_blockDiagonal'", "Matrix.fromBlocks_eq_mul_schurComplement", "QuarteroniSaccoSaleri.Chapter03.equation_3_63"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 3.6'

[[node]]
id = "remark_3_6_cond"
kind = "theorem"
desc = '''Remark 3.6, last display: if `A` is symmetric positive definite then `K₂(S) ≤ K₂(A)`;
`Matrix.PosDef.condNumber_schurComplement_le`. ★'''
deps = ["Matrix.PosDef.condNumber_schurComplement_le", "QuarteroniSaccoSaleri.Chapter03.remark_3_6_schur"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 3.6'
