namespace = "QuarteroniSaccoSaleri.Chapter03"
desc = '''
§3.2, triangular systems: forward and backward substitution (3.22)–(3.23) as the backbone functions
`Matrix.forwardSubst`, `Matrix.backSubst` of `Numlib/Direct/Substitution`, their
rounding-error analysis (3.24)–(3.25) and the improved componentwise bounds from
`Numlib/FloatingPoint/Substitution`, and the inverse of a triangular matrix (3.26)–(3.28). Programs
1–3 and the operation counts are not nodes.
'''

[[node]]
id = "equation_3_22"
kind = "theorem"
desc = '''(3.22), forward substitution: for lower triangular `L : Matrix (Fin n) (Fin n) ℝ` with nonzero
diagonal, `x := Matrix.forwardSubst L b` satisfies `x 0 = b 0 / L 0 0`, `x i = (b i - ∑ j < i, L i j
* x j) / L i i`, and `L *ᵥ x = b`; `Matrix.forwardSubst_apply`, `Matrix.mulVec_forwardSubst`. ★'''
deps = ["Matrix.forwardSubst", "Matrix.forwardSubst_apply", "Matrix.mulVec_forwardSubst"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.22)'

[[node]]
id = "equation_3_23"
kind = "theorem"
desc = '''(3.23), backward substitution: for upper triangular `U` with nonzero diagonal, `x := Matrix.backSubst
U b` satisfies `x (n-1) = b (n-1) / U (n-1) (n-1)`, `x i = (b i - ∑ j > i, U i j * x j) / U i i`, and
`U *ᵥ x = b`; `Matrix.mulVec_backSubst`. ★'''
deps = ["Matrix.backSubst", "Matrix.mulVec_backSubst"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.23)'

[[node]]
id = "equation_3_24"
kind = "theorem"
desc = '''(3.24), backward error of substitution: in a rounding model `m` with `n u < 1`, an admissible
computed solution `x̂` of `T x = b` by forward (or backward) substitution solves `(T + δT) x̂ = b`
exactly with `|δT| ≤ n u / (1 - n u) |T|` entrywise; `FloatingPoint.exists_roundsForwardSubst_eq` and
`FloatingPoint.exists_roundsBackSubst_eq` (`n u / (1 - n u) = FloatingPoint.gamma m.u n`). ★'''
deps = ["FloatingPoint.exists_roundsForwardSubst_eq", "FloatingPoint.exists_roundsBackSubst_eq"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.24)'

[[node]]
id = "equation_3_25"
kind = "theorem"
desc = '''(3.25): if moreover `n u K_∞(T) < 1`, then `‖x - x̂‖_∞ / ‖x‖_∞ ≤ n u K_∞(T) / (1 - n u K_∞(T))` (the
book also claims it for `‖·‖₁` and the Frobenius norm; state the `∞` case, the `1`-norm case being
the transpose). `equation_3_24` gives `‖δT‖_∞ ≤ γ_n ‖T‖_∞` by
`Matrix.linfty_opNorm_le_of_abs_entrywiseLE`, then `theorem_3_1` with `δb = 0`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter03.equation_3_24", "Matrix.linfty_opNorm_le_of_abs_entrywiseLE", "QuarteroniSaccoSaleri.Chapter03.theorem_3_1"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.25)'

[[node]]
id = "backSubst_componentwise_error"
kind = "theorem"
desc = '''§3.2.2, improved bound: if `|u_ii| ≥ |u_ij|` for all `j > i`, then the computed solution satisfies
`|x_i - x̂_i| ≤ 2^{n-i+1} (n u / (1 - n u)) max_{j ≥ i} |x̂_j|` (`1`-based `i`; on `Fin n` the exponent
is `#{j | i ≤ j}`); `FloatingPoint.abs_sub_le_of_roundsBackSubst_of_abs_le_diag`. The same for `L`
with `|l_ii| ≥ |l_ij|`, `j < i`, by transposition. ★'''
deps = ["FloatingPoint.abs_sub_le_of_roundsBackSubst_of_abs_le_diag", "QuarteroniSaccoSaleri.Chapter03.equation_3_24"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.2.2'

[[node]]
id = "backSubst_error_of_diagDominant"
kind = "theorem"
desc = '''§3.2.2, "the same result holds … if `L` and `U` are diagonally dominant": for a row diagonally
dominant triangular `T`, `|x_i - x̂_i| ≤ (2n - 1) (n u / (1 - n u)) ‖x̂‖_∞`;
`FloatingPoint.abs_sub_le_of_roundsBackSubst_of_isDiagDominant` (Higham Lemma 8.8). The book's
sentence suggests the `2^{n-i+1}` bound; what holds under dominance is the linear one. ★'''
deps = ["FloatingPoint.abs_sub_le_of_roundsBackSubst_of_isDiagDominant", "QuarteroniSaccoSaleri.Chapter03.equation_3_24"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 3.2.2'

[[node]]
id = "equation_3_26"
kind = "theorem"
desc = '''(3.26): the columns `v_i` of `U⁻¹` are the solutions of `U v_i = e_i`, i.e. `(fun r => U⁻¹ r i) =
Matrix.backSubst U (Pi.single i 1)`; `Matrix.inv_col_eq_backSubst`. ★'''
deps = ["Matrix.inv_col_eq_backSubst"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.26)'

[[node]]
id = "equation_3_27"
kind = "theorem"
desc = '''(3.27): the vector `v'_k` solving `U^{(k)} v'_k = l_k` (`l_k = e_1` of `ℝ^k`, `U^{(k)}` the leading
principal submatrix of order `k`) consists of the first `k` entries of column `k` of `U⁻¹`, because
`(U^{(k)})⁻¹` is the leading block of `U⁻¹`; `Matrix.inv_toBlock_le_of_isUpperTriangular`. ★'''
deps = ["Matrix.inv_toBlock_le_of_isUpperTriangular", "QuarteroniSaccoSaleri.Chapter03.equation_3_26"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.27)'

[[node]]
id = "equation_3_28"
kind = "theorem"
desc = '''(3.28), the inversion recurrence: `v'_kk = u_kk⁻¹` and `v'_ik = -u_ii⁻¹ ∑_{j=i+1}^{k} u_ij v'_jk` for
`i < k`, read on `U⁻¹`: `U⁻¹ k k = (U k k)⁻¹`, `U⁻¹ i k = -(U i i)⁻¹ ∑ j ∈ Ioc i k, U i j * U⁻¹ j k`;
`Matrix.inv_apply_of_isUpperTriangular`. ★'''
deps = ["Matrix.inv_apply_of_isUpperTriangular", "QuarteroniSaccoSaleri.Chapter03.equation_3_27"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (3.28)'
