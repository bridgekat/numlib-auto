[[node]]
id = "property_11_4"
kind = "theorem"
desc = '''The order of an `s`-stage explicit RK method is at most `s`, and there is no `s`-stage
explicit method of order `s` for `s ≥ 5`; the minimal stage numbers are `1, 2, 3, 4, 6, 7, 9, 11`
for orders `1, …, 8`. Not formalized: Butcher's order barriers rest on the rooted-tree order
conditions (a B-series theory, not in Mathlib nor in this library) and, for the `s ≥ 5` statement,
on a delicate case analysis of those conditions (Butcher 1965; Hairer–Nørsett–Wanner II.5); the
book states the property without proof (citing [But87]).

Blocked: not attempted — recorded as not formalized (notes/backbone.md §17.2.5); a B-series
framework is the prerequisite, and `rk4_hasOrderFor` is the first step towards one.'''
deps = ["QuarteroniSaccoSaleri.Chapter11.equation_11_71", "QuarteroniSaccoSaleri.Chapter11.rungeKutta_consistent_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 11.4'

