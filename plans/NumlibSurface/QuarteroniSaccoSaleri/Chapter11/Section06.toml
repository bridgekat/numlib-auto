[[node]]
id = "property_11_1"
kind = "theorem"
desc = '''First Dahlquist barrier: there is no zero-stable `p`-step linear multistep method of order
greater than `p + 1` if `p` is odd, `p + 2` if `p` is even; as a statement,
`M.p + 1 = p → M.SatisfiesRootCondition → M.HasOrder q → q ≤ p + (if Even p then 2 else 1)`.
Not formalized: the proof (Dahlquist 1956; Hairer–Nørsett–Wanner III.3) needs the
`(ζ+1)/(ζ-1)` transform of `ρ` and `σ`, the positivity of the coefficients of `(ξ/log((1+ξ)/(1-ξ)))`-type
series, and the counting of sign changes forced by the root condition — a substantial piece of
complex analysis with no Mathlib support; the book states it without proof (citing [Dah63]).

Blocked (2026-09-20, agent qss5; replaces the 2026-09-16 note). Checked in `Numlib/ODE/Multistep`:
the vocabulary is complete — `LinearMultistep`, `HasOrder`, the algebraic order conditions
`orderCondition i` with `orderCondition_iff_taylorCoeff_eq_zero` (Theorem 11.3), the characteristic
polynomials `ρ`, `σ` (`characteristicPolynomials`) and `Polynomial.SatisfiesRootCondition`
(Definition 11.10) — so the statement can be written as
`M.SatisfiesRootCondition → M.HasOrder q → q ≤ p + (if Even p then 2 else 1)`. What the proof needs
and the library does not have: the Möbius transform `ζ = (1+z)/(1−z)` carrying the closed unit disc
to the left half-plane, the expansion of `(ρ/σ)(ζ) − log ζ` in `z`, and the positivity of the
coefficients of `z/log((1+z)/(1−z))`-type power series together with a sign-change count forced by
the root condition (Dahlquist 1956; Hairer–Nørsett–Wanner I, III.3, Theorem 3.5); nothing named
Dahlquist, Herglotz or "positive real" is in Mathlib or in `Numlib/` outside the unrelated
Dahlquist–Golub–Nash identity of `Numlib/Krylov`. The book quotes the result without proof
([Dah63]), so it is out of scope for this round by policy. Estimate: 1500–2500 lines of complex
analysis on power series with real coefficients, a module of its own (`ODE/Multistep/Dahlquist`).'''
deps = ["QuarteroniSaccoSaleri.Chapter11.definition_11_10", "QuarteroniSaccoSaleri.Chapter11.definition_11_9"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 11.1'

