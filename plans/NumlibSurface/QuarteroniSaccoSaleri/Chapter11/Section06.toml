[[node]]
id = "bdf_zeroStable"
kind = "theorem"
desc = '''The BDF methods of Table 11.2 are zero-stable for `p ≤ 5` ([Cry73]): `(bdf k).SatisfiesRootCondition`
for `k : Fin 6`. Proved through `ODE.LinearMultistep.bdf_satisfiesRootCondition` for `k ≤ 2`; for
`k = 3, 4, 5` the spurious roots of `ρ` are the roots of a cubic, quartic and quintic and must be
located inside the unit disc by a Schur–Cohn/Jury test — real work (★★★), the backbone node
`ODE.LinearMultistep.bdf_satisfiesRootCondition_all`; the node stays open until it is proved. The
cases `k ≤ 2` are `bdf_zeroStable_of_le_two`. The book quotes the result without proof.

Blocked: no Schur–Cohn/Jury test in Mathlib or in this library; see
`ODE.LinearMultistep.bdf_satisfiesRootCondition_all`.'''
deps = ["QuarteroniSaccoSaleri.Chapter11.bdf", "QuarteroniSaccoSaleri.Chapter11.definition_11_10", "ODE.LinearMultistep.bdf_satisfiesRootCondition", "ODE.LinearMultistep.bdf_satisfiesRootCondition_all"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 11.6.3'

