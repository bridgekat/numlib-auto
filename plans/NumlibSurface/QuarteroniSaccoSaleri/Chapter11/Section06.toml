[[node]]
id = "property_11_2"
kind = "theorem"
desc = '''Second Dahlquist barrier: an explicit linear multistep method is neither A-stable nor
ϑ-stable; no A-stable linear multistep method has order greater than 2; for every
`ϑ ∈ (0, π/2)` there exist ϑ-stable `p`-step methods of order `p` only for `p = 3` and `p = 4`
(as printed; the standard statement, Widlund 1967, is that such methods exist for `p = 3, 4`,
with the trapezoidal rule having the smallest error constant among A-stable methods).
Not formalized: the order-2 barrier is Dahlquist's 1963 theorem, proved through the
`(ζ+1)/(ζ-1)` transform and the positivity of a real part (a Riesz–Herglotz-type argument),
and the ϑ-stability statement is Widlund's; neither has Mathlib support and the book quotes
both without proof ([Wid67]). The explicit clause alone is reachable — `Π` is then a polynomial
of degree `p + 1` in `r` whose roots cannot all stay in the disc as `|z| → ∞` (the product of the
roots is `-(a_p + z b_p)`, unbounded in `z`) — and is planned as `property_11_2_explicit` (★★).

Blocked (2026-09-20, agent qss5; replaces the 2026-09-16 note). The explicit clause is proved as
`property_11_2_explicit`. Checked in `Numlib/ODE/Multistep` and the surface: `absoluteStability` and
`thetaStable` (Definitions 11.11–11.13) exist, so the order-2 barrier reads
`M.IsAStable → M.HasOrder q → q ≤ 2`; its proof (Dahlquist 1963; Hairer–Wanner II, V.1, Theorem 1.4)
needs, beyond the first barrier's Möbius transform, the Riesz–Herglotz argument that a function with
nonnegative real part on the disc has a nonnegative error constant — nothing of which is in Mathlib
or `Numlib/`. The ϑ-stability clause is Widlund's theorem and is existential ("there exist ϑ-stable
`p`-step methods of order `p` for `p = 3, 4`"), a construction plus a stability-region computation
for two specific methods. The book quotes all of it without proof ([Wid67]), so it is out of scope
by policy. Estimate: 1500–2500 lines with the first barrier, of which ~500 for the order-2 barrier
once the transform is there.'''
deps = ["QuarteroniSaccoSaleri.Chapter11.thetaStable", "QuarteroniSaccoSaleri.Chapter11.absoluteStability", "QuarteroniSaccoSaleri.Chapter11.definition_11_9"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 11.2'

