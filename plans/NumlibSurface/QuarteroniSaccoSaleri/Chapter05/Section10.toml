[[node]]
id = "cyclicJacobi_quadratic"
kind = "theorem"
desc = '''The quadratic convergence of the cyclic Jacobi method: if `|λ_i - λ_j| ≥ δ` for `i ≠ j` then
`Ψ(A^{(k+N)}) ≤ Ψ(A^{(k)})² / (δ √2)`. Not formalized: Wilkinson's theorem ([Wil62], [Wil65]),
stated by the book without proof; its proof needs the asymptotic analysis of a full sweep near a
diagonal matrix, which nothing in the backbone approaches.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.cyclicJacobiSweep"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.10.1'

