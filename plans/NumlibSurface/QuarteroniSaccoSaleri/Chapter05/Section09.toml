[[node]]
id = "qrCholesky_stability"
kind = "theorem"
desc = '''The stability statement after the QR–Cholesky algorithm: a computed eigenvalue `λ̂` satisfies
`λ̂ ∈ σ(H⁻ᵀ A H⁻¹ + E)` with `‖E‖₂ ≃ u ‖A‖₂ ‖B⁻¹‖₂`. The book cites it from [GL89] p. 464
without proof.

Blocked, and out of scope as printed: the `≃` is not an inequality, so there is no proposition to
prove. Even the rigorous form behind it (the computed `λ̂` is an exact eigenvalue of
`Ĥ⁻ᵀ A Ĥ⁻¹ + E` with `‖E‖₂ ≤ c(n) u ‖A‖₂ ‖B⁻¹‖₂`) needs three floating-point analyses the
library does not have: the computed Cholesky factor `Ĥ` of `B` (available, `RoundsCholesky` in
`Numlib/FloatingPoint/LU`), the computed two-sided triangular solve `Ĥ⁻ᵀ A Ĥ⁻¹` (needs a
`RoundsBackSubst` analysis with a matrix right-hand side, not in the library), and the backward
stability of the symmetric QR iteration on the result — which is the same missing Householder
rounding model as `Chapter05.equation_5_46`. Estimate: not reachable without that model.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.theorem_5_7"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.9.2'

