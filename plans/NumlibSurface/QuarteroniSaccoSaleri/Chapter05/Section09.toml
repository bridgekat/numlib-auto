[[node]]
id = "qrCholesky_stability"
kind = "theorem"
desc = '''The stability statement after the QR–Cholesky algorithm: a computed eigenvalue `λ̂` satisfies
`λ̂ ∈ σ(H⁻ᵀ A H⁻¹ + E)` with `‖E‖₂ ≃ u ‖A‖₂ ‖B⁻¹‖₂`. The book cites it from [GL89] p. 464
without proof.

Blocked (re-examined 2026-09-20, agent qss7; blocker 12 of `notes/frontier.md`, now half open):
the `≃` is not an inequality, so the node stays under its printed id. Of the three floating-point
analyses a rigorous form needs, two are now in the backbone: the computed Cholesky factor `Ĥ`
(`FloatingPoint.RoundsCholesky`, `FloatingPoint.exists_roundsCholesky_eq_add` in
`Numlib/FloatingPoint/LU`) and the computed two-sided solve `Ĉ = fl(Ĥ⁻ᵀ A Ĥ⁻¹)`
(`FloatingPoint.RoundsTwoSidedSolve`, `FloatingPoint.frobenius_norm_sub_le_of_roundsTwoSidedSolve`
in `Numlib/FloatingPoint/Householder`), the latter with the bound
`‖Ĉ − Ĥ⁻ᵀ A Ĥ⁻¹‖_F ≤ (2θ/(1 − θ)²) ‖Ĥ⁻¹‖_F² ‖A‖_F`, `θ = γ_n ‖Ĥ⁻¹‖_F ‖Ĥ‖_F` — which shows that
the rigorous statement is **not** the desc's `‖E‖₂ ≤ c(n) u ‖A‖₂ ‖B⁻¹‖₂`: the triangular solves
contribute `κ(Ĥ) = κ(B)^{1/2}` on top of `‖B⁻¹‖₂ = ‖Ĥ⁻¹‖₂²` (the forward error of a solve is the
condition number times the backward error), so any faithful re-planning must carry `κ(Ĥ)` (or
assume `‖B‖₂ ≈ 1`). The third piece, the backward stability of the symmetric QR iteration on `Ĉ`
— `λ̂ ∈ σ(Ĉ + E₂)`, `‖E₂‖ ≤ c₂(n, s) u ‖Ĉ‖` for `s` computed shifted QR steps with deflation —
is still missing: it needs the Givens rounding model ([higham2002accuracy] Lemmas 19.7–19.9,
a `RoundsGivens` predicate on the pattern of `FloatingPoint.RoundsHouseholderApply`), the
computed shifted step `T̂' = fl(R̂ Q̂) + μ I` as a two-sided perturbed similarity (the
accumulation `FloatingPoint.exists_eq_prodRev_mul_add_mul_prodFwd` is already general enough),
the deflation criterion as an explicit perturbation, and the Householder tridiagonalization
(`FloatingPoint.exists_roundsHessenbergReduce_eq`, done). Estimate: 400–600 lines for the Givens
model and the QR step, then ~100 for the assembly under the same id with the corrected bound.
The exact-arithmetic Cholesky factor of `B` is `Matrix.exists_isCholesky` in
`Numlib/LinearAlgebra/Matrix/Cholesky`.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.theorem_5_7", "FloatingPoint.RoundsTwoSidedSolve", "FloatingPoint.frobenius_norm_sub_le_of_roundsTwoSidedSolve", "FloatingPoint.exists_roundsCholesky_eq_add"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.9.2'

