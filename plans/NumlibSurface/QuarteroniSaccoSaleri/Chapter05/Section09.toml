[[node]]
id = "qrCholesky_stability"
kind = "theorem"
desc = '''The stability statement after the QR–Cholesky algorithm: a computed eigenvalue `λ̂` satisfies
`λ̂ ∈ σ(H⁻ᵀ A H⁻¹ + E)` with `‖E‖₂ ≃ u ‖A‖₂ ‖B⁻¹‖₂`. The book cites it from [GL89] p. 464
without proof.

Blocked, and out of scope as printed (re-examined 2026-09-20, agent qss1): the `≃` is not an
inequality, so there is no proposition to prove, and the book names no source for a rigorous
form beyond [GL89] p. 464 (Golub–Van Loan state it as `‖E‖₂ ≈ u ‖A‖₂ ‖B⁻¹‖₂` too, so no single
reading is forced and the node stays under its printed id). The rigorous statement behind it —
the computed `λ̂` is an exact eigenvalue of `Ĥ⁻ᵀ A Ĥ⁻¹ + E` with `‖E‖₂ ≤ c(n) u ‖A‖₂ ‖B⁻¹‖₂` —
needs three floating-point analyses; checked in `Numlib/FloatingPoint/*` (`System`, `Model`,
`InnerProduct`, `Substitution`, `LU`, `Stationary`): the computed Cholesky factor `Ĥ` of `B` is
available (`RoundsCholesky` in `FloatingPoint/LU`), the computed two-sided triangular solve
`Ĥ⁻ᵀ A Ĥ⁻¹` needs a `RoundsBackSubst`-style analysis with a matrix right-hand side (not there),
and the backward stability of the symmetric QR iteration on the result is the missing
Householder/Givens rounding model of blocker 12 (`Chapter05.equation_5_46`,
`Chapter05.golubKahan_svd_stability`). Estimate: not reachable without that model; with it,
~300 lines for the two-sided solve and the assembly.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.theorem_5_7"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.9.2'

