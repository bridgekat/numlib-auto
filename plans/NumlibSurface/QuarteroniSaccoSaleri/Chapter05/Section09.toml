[[node]]
id = "generalizedRealSchur"
kind = "theorem"
desc = '''The generalized *real* Schur form stated after Property 5.10: for real `A`, `B` with `(A, B)`
regular there are orthogonal `Ũ`, `Z̃` with `Ũᵀ A Z̃` quasi upper triangular (`BlockTriangular p`
with blocks of size `≤ 2`) and `Ũᵀ B Z̃` upper triangular. The book states it without proof
(citing [GL89] §7.7).

Blocked: the case of a nonsingular `B` is proved, as `generalizedRealSchur_of_isUnit` — the real
Schur form of `B⁻¹ A` gives `Z̃`, a QR factorization `B Z̃ = Ũ R` gives `Ũ`, and `Ũᵀ A Z̃ = R T`
is triangular times quasi-triangular. What is left open is exactly the singular case, where there
is no `B⁻¹ A`: the pencil is still regular, but neither of the two natural repairs works. Shifting
(`A ↦ A - μ B` with `A - μ B` nonsingular) triangularizes the wrong pair, since recovering `B` from
a quasi-triangular and a triangular matrix gives a quasi-triangular `B`, not a triangular one; and
the rotation `(A cosθ - B sinθ, A sinθ + B cosθ)` has the same defect. Golub–Van Loan's proof
(Theorem 7.7.2) descends through real deflating subspaces of the pencil, a theory the backbone
does not have. Estimate: a `Eigen/Pencil` development of deflating subspaces, several hundred
lines; nothing downstream in the book uses it.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.property_5_10"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.9.1'

