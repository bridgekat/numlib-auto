namespace = "QuarteroniSaccoSaleri.Chapter05"
desc = '''
§5.12, applications. The buckling problem (§5.12.1) reduces to the smallest eigenvalue of
`tridiag_n(-1, 2, -1)`, whose eigenvalues (5.69) are the discrete sine spectrum of
`Numlib/LinearAlgebra/Matrix/TridiagonalToeplitz`; that is the section's one numbered result.
The bridge problem (§5.12.2) is a generalized eigenproblem (5.70) with diagonal positive `M`,
handled by `Section09`'s reduction to a standard problem; it states no numbered result.
'''

[[node]]
id = "equation_5_69"
kind = "theorem"
desc = '''(5.69): the eigenvalues of `A = tridiag_n(-1, 2, -1)` are `λ_j = 2 (1 - cos (j θ))`,
`θ = π/(n+1)`, `j = 1, …, n`: `Module.End.HasEigenvalue (toLin' (symmTridiagonalToeplitz n (-1) 2))
μ ↔ ∃ k : Fin n, μ = 2 + 2 * (-1) * cos ((k+1) π/(n+1))`, which is
`Matrix.symmTridiagonalToeplitz_hasEigenvalue_iff`; `2 - 2 cos x = 4 sin²(x/2)` gives the book's
other form. The book refers to Exercise 3 of Chapter 4 for the proof. ★'''
deps = ["Matrix.symmTridiagonalToeplitz_hasEigenvalue_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (5.69)'
