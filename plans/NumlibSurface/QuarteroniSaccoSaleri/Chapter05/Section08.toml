[[node]]
id = "golubKahan_svd_stability"
kind = "theorem"
desc = '''§5.8.3, the stability clause of the Golub–Kahan–Reinsch algorithm: the computed singular
values are those of `A + δA` with `‖δA‖₂ ≤ C_{mn} u ‖A‖₂`, for a constant `C_{mn}` depending on
`m`, `n` (and, as printed, on `u`). The book quotes it without proof and without naming `C_{mn}`;
the limit clause of the same paragraph is `golubKahan_svd` (split 2026-09-20).

Blocked (2026-09-20, agent qss1; blocker 12 of `notes/frontier.md`): there is no floating-point
model of an orthogonal transformation. Checked: `Numlib/FloatingPoint/*` carries `System`,
`Model`, `InnerProduct`, `Substitution`, `LU`, `Stationary` — dot products, triangular solves,
Gaussian elimination, stationary iterations — and nothing about Householder reflectors or Givens
rotations; `Numlib/LinearAlgebra/Matrix/QR` and `PlaneRotation` are exact. A faithful statement
needs (i) a relational `RoundsHouseholder`/`RoundsGivens` predicate for the computed application
of a reflector or rotation ([higham2002accuracy] Lemmas 19.2–19.3, 19.7), (ii) the accumulation
lemma "a product of computed orthogonal transformations is an exact orthogonal transformation of
a nearby matrix" (Lemma 19.3), applied to the `n + m − 3` reflectors of the direct phase and to
the rotations of every QR sweep, and (iii) the backward stability of the implicit-shift QR
iteration on a bidiagonal matrix (Demmel–Kahan), whose sweep count is unbounded, so the statement
must be for the exact limit of the computed iterates or for a fixed number of sweeps. Estimate: a
`FloatingPoint/Householder` module of several hundred lines on the model of
`FloatingPoint/Substitution` for (i)–(ii), which would also close `Chapter05.equation_5_46` and
`Chapter05.qrCholesky_stability`; (iii) is a separate analysis of comparable size.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.golubKahan_svd"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.8.3'

