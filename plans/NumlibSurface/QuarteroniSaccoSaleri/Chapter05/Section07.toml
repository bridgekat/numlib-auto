[[node]]
id = "equation_5_53_quadratic"
kind = "theorem"
desc = '''The quadratic convergence of the single-shift QR iteration (5.52)–(5.53), in the rigorous form
the book's `O(η_k²)` stands for (re-planned 2026-09-20 from the printed "if
`|t_{n,n-1}^{(k)}| / ‖T⁽⁰⁾‖₂ = η_k < 1` then `|t_{n,n-1}^{(k+1)}| / ‖T⁽⁰⁾‖₂ = O(η_k²)`", which
names a single `k` and no constant; the reading follows the source the book cites, [Dem97]
pp. 161–163): for `T⁽⁰⁾ = equation_5_53 A 0` unreduced upper Hessenberg with `λ_n` a simple real
eigenvalue, there are `c, ε₀ > 0` such that for every `k`, if `|t_{n,n-1}^{(k)}| ≤ ε₀ ‖T⁽⁰⁾‖₂`
then `|t_{n,n-1}^{(k+1)}| ≤ c |t_{n,n-1}^{(k)}|² / ‖T⁽⁰⁾‖₂`, where `T⁽ᵏ⁾ = equation_5_53 A k`.
The hypotheses (unreduced Hessenberg, simple eigenvalue) are the ones the book leaves implicit and
[Dem97] uses; for a defective `λ_n` (a nontrivial Jordan block) the convergence is only linear.

Blocked (re-examined 2026-09-20, agent qss1; blocker 13 of `notes/frontier.md`): checked in
`Numlib/`: the single-shift iteration itself is `equation_5_53` with `shiftedQrStep`
(`equation_5_53_eq`, `equation_5_53_eq_conj`, similarity preserved), the QR factorization of a
Hessenberg matrix by Givens rotations is `Matrix.hessenbergGivensQR_spec`
(`Numlib/LinearAlgebra/Matrix/QR`), and `Numlib/Eigen/PowerMethod` carries the power and inverse
iterations with a fixed shift and records Rayleigh quotient iteration as not formalized. The proof
([Dem97] pp. 161–163) identifies the last row of one shifted QR step with a step of Rayleigh
quotient iteration on `Tᵀ` from `e_n` (the shifted inverse `(T - μI)⁻¹` applied to `e_n`, with
`μ = t_{nn}` the Rayleigh quotient of `e_n`) and then quotes the local quadratic convergence of
that iteration for a simple eigenvalue. Missing: (i) the identification `(T - μI) = Q R` ⟹ the
last column of `Q` is proportional to `(T - μI)⁻ᵀ e_n`, and the bookkeeping expressing
`t_{n,n-1}^{(k+1)}` through it (~200 lines); (ii) the local quadratic convergence of Rayleigh
quotient iteration for a *nonsymmetric* matrix and a simple eigenvalue — a perturbation argument
on the angle to the eigenvector with the gap `min_{i<n} |λ_i - λ_n|` (~400 lines, an
`Eigen/RayleighQuotient` module); (iii) the translation to the book's normalization by `‖T⁽⁰⁾‖₂`
(small). Estimate: 600–800 lines; nothing downstream depends on it.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_53"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (5.53)'

