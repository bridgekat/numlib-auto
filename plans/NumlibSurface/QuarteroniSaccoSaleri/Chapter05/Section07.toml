[[node]]
id = "doubleShiftQr_quadratic"
kind = "theorem"
desc = '''The claim that the QR iteration with Francis shift converges quadratically. Not formalized: the
book states it without proof (citing [Fra61], [GL89] §7.5, [Dem97] §4.4.5), notes that special
matrices defeat it (Exercise 14), and calls a shift strategy that guarantees convergence for all
matrices an open problem.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_55"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.7.2'
