[[node]]
id = "doubleShiftQr_quadratic"
kind = "theorem"
desc = '''The claim that the QR iteration with Francis shift converges quadratically.

Blocked (re-examined 2026-09-20, agent qss1; blocker 13 of `notes/frontier.md`): the book
itself says why it cannot be stated as printed — it cites [Fra61], [GL89] §7.5 and [Dem97] §4.4.5
without proof, notes that special matrices defeat the strategy (the cyclic permutation matrix of
Exercise 14, `property_5_9_counterexample` here, is fixed by the iteration), and calls a shift
strategy that provably converges for *all* matrices an open problem. So any faithful statement
carries a genericity hypothesis the book does not supply, and no source it cites states one
(Golub–Van Loan and Demmel give the heuristic and the exceptional-shift remedy, not a theorem), so
the node is not re-planned to a rigorous form and stays open under its printed id. Checked in
`Numlib/`: the double-shift step is `equation_5_55` with `equation_5_55_eq`,
`equation_5_55_eq_conj` (one real step equals two complex single-shift steps), and
`Numlib/Eigen/PowerMethod` has no Rayleigh quotient iteration; the local statement that could be
proved — quadratic convergence of `t_{n-1,n-2}^{(k)}` to `0` once the trailing `2 × 2` block is
close to an invariant block with a simple pair of eigenvalues — is the single-shift argument of
`equation_5_53_quadratic` in `2 × 2` block form and is blocked on the same missing Rayleigh
quotient theory (subspace version). Estimate: `equation_5_53_quadratic` plus ~300 lines for the
block form.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_55"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.7.2'
