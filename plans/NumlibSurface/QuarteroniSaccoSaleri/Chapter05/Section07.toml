[[node]]
id = "equation_5_53_quadratic"
kind = "theorem"
desc = '''The quadratic convergence of the single-shift iteration (5.52)–(5.53): if
`|t_{n,n-1}^{(k)}| / ‖T⁽⁰⁾‖₂ = η_k < 1` then `|t_{n,n-1}^{(k+1)}| / ‖T⁽⁰⁾‖₂ = O(η_k²)`. Not
formalized: a local convergence theorem for Rayleigh quotient iteration on Hessenberg matrices
([Dem97] pp. 161–163), which the book states without proof and the backbone has no Rayleigh
quotient iteration for (`Numlib/Eigen/PowerMethod` records that it is not formalized either).'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_53"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (5.53)'

