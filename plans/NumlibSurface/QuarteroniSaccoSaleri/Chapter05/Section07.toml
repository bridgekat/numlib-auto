[[node]]
id = "equation_5_53_quadratic"
kind = "theorem"
desc = '''The quadratic convergence of the single-shift iteration (5.52)–(5.53): if
`|t_{n,n-1}^{(k)}| / ‖T⁽⁰⁾‖₂ = η_k < 1` then `|t_{n,n-1}^{(k+1)}| / ‖T⁽⁰⁾‖₂ = O(η_k²)`.

Blocked, on two counts. First, as printed the display is not a proposition: `O(η_k²)` for a *single*
`k`, with no constant and no neighbourhood, says nothing; the statement that is meant (and that
[Dem97] pp. 161–163 proves) is `∃ c ε₀ > 0, ∀ k, |t_{n,n-1}^{(k)}| ≤ ε₀ →
|t_{n,n-1}^{(k+1)}| ≤ c |t_{n,n-1}^{(k)}|²`, under the hypotheses the book leaves implicit: `T⁽⁰⁾`
unreduced upper Hessenberg and `λ_n` a simple eigenvalue (with `λ_n` real, or the double-shift
form). Second, the proof identifies the shifted QR step with a step of Rayleigh quotient iteration
on the last row and then quotes the local quadratic convergence of that iteration — which the
backbone does not have; `Numlib/Eigen/PowerMethod` records Rayleigh quotient iteration itself as
not formalized. Estimate: Rayleigh quotient iteration with its local convergence (a `Eigen/`
module of its own) plus the identification, several hundred lines.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_53"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Equation (5.53)'

