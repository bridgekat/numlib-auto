[[node]]
id = "doubleShiftQr_quadratic"
kind = "theorem"
desc = '''The claim that the QR iteration with Francis shift converges quadratically.

Blocked, and the book itself says why it cannot be stated as printed: it cites [Fra61], [GL89]
§7.5 and [Dem97] §4.4.5 without proof, notes that special matrices defeat the strategy (the cyclic
permutation matrix of Exercise 14, which is `property_5_9_counterexample` here — it is fixed by the
iteration), and calls a shift strategy that provably converges for *all* matrices an open problem.
So any faithful statement must carry a genericity hypothesis that the book does not supply. Beyond
that, the proof is the single-shift one (`equation_5_53_quadratic`) in the `2 × 2` block form, so it
is blocked on the same missing Rayleigh quotient iteration theory.'''
deps = ["QuarteroniSaccoSaleri.Chapter05.equation_5_55"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Section 5.7.2'
