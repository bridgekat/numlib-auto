`equation_12_34_posDef` (symmetric positive definite for `α ≥ α₀ > 0`, `γ ≥ 0`;
`FiniteDifference.variableCoeffMatrix_posDef`) and `equation_12_34_diagDominant` (strictly diagonally
dominant if `γ > 0`). ★'''
deps = ["FiniteDifference.variableCoeffOperator", "FiniteDifference.variableCoeffMatrix_posDef"]
