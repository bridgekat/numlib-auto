`T⁻¹ j k = h⁻¹ G(x_j, x_k) = (n) · min(x_j, x_k)(1 - max(x_j, x_k))`, exactly
`Matrix.inv_symmTridiagonalToeplitz_neg_one_two_apply` rewritten with `x_j = (j + 1)/(N + 1)`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_24", "QuarteroniSaccoSaleri.Chapter12.greenFunction", "Matrix.inv_symmTridiagonalToeplitz_neg_one_two_apply"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Exercise 12.6'

