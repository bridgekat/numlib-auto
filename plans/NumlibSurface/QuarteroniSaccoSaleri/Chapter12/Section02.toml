[[node]]
id = "equation_12_32"
kind = "definition"
desc = '''The variable-coefficient scheme (12.31)–(12.34) of §12.2.3 for `-(α u')' + γ u = f`, `u(0) = d₀`,
`u(1) = d₁`: the operator `L_h` with midpoint fluxes `J_{j+1/2}(w) = α_{j+1/2} (w_{j+1} - w_j)/h`
(`FiniteDifference.variableCoeffOperator 0 1 N α γ`), the solution predicate with the Dirichlet data,
and the matrix (12.34) `A_fd = h⁻² tridiag(a, d, a) + diag(c)` (`FiniteDifference.variableCoeffMatrix`;
