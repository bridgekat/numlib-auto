`v ∈ V`. `EllipticInterval.isWeakSolution_of_classical`. With the nonhomogeneous Dirichlet lifting
`ū(x) = x u₁ + (1 - x) u₀`, `ů = u - ū ∈ V`, `a(ů, v) = (f, v) - a(ū, v)` (`equation_12_43_lift`), and the
homogeneous Neumann case `u'(0) = u'(1) = 0` with `V = H^1(0,1)` (`equation_12_43_neumann`), both
