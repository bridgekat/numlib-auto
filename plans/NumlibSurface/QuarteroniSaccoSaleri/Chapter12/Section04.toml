namespace = "QuarteroniSaccoSaleri.Chapter12"
desc = '''
§12.4, the Galerkin method: the weak formulation (12.41)–(12.44) with `H^1_0(0,1)` (12.42), the
distributions of §12.4.2, the Galerkin problem (12.46) and its linear system (12.48), the
stability (12.51), Theorem 12.3, the Lax–Milgram and Céa lemmas (12.54)–(12.56), the positive
definiteness of the stiffness matrix, the finite element spaces `X_h^{k,0}` (12.57) with Property
12.1, the shape functions (12.61)–(12.66), the structure of `A_fe`, Example 12.1's exact
solution, and the spectral Galerkin method (12.68)–(12.69). The Sobolev spaces are
`Numlib/Analysis/Sobolev/Interval.lean`, the form and its theory
`Numlib/Variational/EllipticInterval.lean`, the finite elements
`Numlib/Variational/FiniteElementInterval.lean`, the abstract Galerkin theory
`Numlib/Variational/{LaxMilgram,Galerkin}.lean`, and the distributions Mathlib's
`Distribution` on `Opens.Ioo 0 1`.

Property 12.1's `H¹` estimate is Céa plus the interpolation estimate of Theorem 8.3, which chapter
8 states in `Numlib/Approximation/SobolevInterpolation.lean` (this plan expects the ids
`integral_sq_sub_piecewiseLinearInterpCLM_le` for `k = 1` and
`sobolevSeminorm_sub_piecewisePolyInterp_le` for general `k`); its `L²` estimate is
Aubin–Nitsche with the one-dimensional `H²` regularity. Both are quoted by the book from [QV94].
'''

