[[node]]
id = "property_12_1"
kind = "theorem"
desc = '''Property 12.1, the `H¹` estimate (12.59): for `u ∈ H^1_0(0,1) ∩ H^s(0,1)`, `s ≥ 2`, and `u_h` its
finite element approximation of degree `k ≥ 1`, `‖u - u_h‖_{H¹₀(0,1)} ≤ (M/α₀) C h^l ‖u‖_{H^{l+1}(0,1)}` with
`l = min(k, s - 1)`. Céa (`theorem_12_3`) plus Theorem 8.3's `|u - Π_h^k u|_{H¹} ≤ C h^l |u|_{H^{l+1}}`
(the interpolant of degree `k` applied to `u ∈ H^{l+1}`; chapter 8's expected
`sobolevSeminorm_sub_piecewisePolyInterp_le`, which the book proves for `k = 1` only and
quotes from [QV94] otherwise — so this node is proved for `k = 1` when chapter 8 proves (8.27), and
inherits "not formalized" from chapter 8 for `k ≥ 2` if chapter 8 does not prove (8.26)). ★ given the
interpolation estimate.

Blocked: waits on `Numlib/Variational/FiniteElementInterval.lean`, which is not yet written (this
round did not reach it); see the report of `agent/bvp` for the route.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_58", "QuarteroniSaccoSaleri.Chapter12.theorem_12_3", "sobolevSeminorm_sub_piecewisePolyInterp_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 12.1, equation (12.59)'

