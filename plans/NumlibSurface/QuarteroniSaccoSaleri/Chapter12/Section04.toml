[[node]]
id = "equation_12_68"
kind = "definition"
desc = '''The spectral (generalized Galerkin) method (12.68)–(12.69): find `u_n ∈ P_n^0` with `a_n(u_n, v_n) =
(f, v_n)_n` for all `v_n ∈ P_n^0`, where `a_n(u, v) = (α u', v')_n + (β u', v)_n + (γ u, v)_n` replaces the
integrals of (12.44) by the Gauss–Lobatto formula (12.37) — `IsGeneralizedGalerkinSolution` of
`Numlib/Variational/Galerkin.lean` with `W = P_n^0` (as a subspace of `H^1_0(-1,1)`), `aN = a_n`, `ℓN = (f,
·)_n`; and `equation_12_68_eq_collocation`: for `α = 1`, `β = γ = 0` it coincides with the collocation problem
(12.36), by `equation_12_38`. Its error estimate "of the same kind as (12.39)" is asserted through the
Strang lemma and [QV94] and is not a node beyond `theorem_12_2`'s status. ★

Blocked: needs §12.3's `equation_12_37`/`equation_12_38`, which are not written (that section is
not in this round's task).'''
deps = ["IsGeneralizedGalerkinSolution", "QuarteroniSaccoSaleri.Chapter12.equation_12_37", "QuarteroniSaccoSaleri.Chapter12.equation_12_38"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equations (12.68)–(12.69)'


