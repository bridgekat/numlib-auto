[[node]]
id = "equation_12_61_stiffness"
kind = "theorem"
desc = '''The structure of `A_fe` (§12.4.5): for `k = 1` the stiffness matrix in the hat basis is tridiagonal,
`a_ij = 0` for `j ∉ {i - 1, i, i + 1}`, because the supports of `φ_i` and `φ_j` do not overlap; for `k = 2` it
is pentadiagonal. `FiniteElement.stiffnessMatrix_eq_zero_of_lt`. And the conditioning claim
`K₂(A_fe) = O(h⁻²)`: `stiffnessMatrix_condNumber` states it for the model problem `-u'' = f` on the uniform
mesh, `K₂(A_fe) = cot²(πh/2) ≤ 4/(π² h²)` (`FiniteElement.condNumber_stiffnessMatrix_model`,
`Matrix.condNumber_symmTridiagonalToeplitz_neg_one_two`); the general-coefficient claim is quoted from
[QV94, §6.3.2] and is not a node. ★

Blocked: waits on `Numlib/Variational/FiniteElementInterval.lean`, which is not yet written (this
round did not reach it); see the report of `agent/bvp` for the route.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_61", "FiniteElement.stiffnessMatrix_eq_zero_of_lt", "Matrix.condNumber_symmTridiagonalToeplitz_neg_one_two"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §12.4.5, the structure and conditioning of the stiffness matrix'''

