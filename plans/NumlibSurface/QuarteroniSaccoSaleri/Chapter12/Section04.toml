[[node]]
id = "equation_12_68"
kind = "definition"
desc = '''The spectral (generalized Galerkin) method (12.68)-(12.69): find `u_n` in `P_n^0` with
`a_n(u_n, v_n) = (f, v_n)_n` for all `v_n` in `P_n^0`, where `a_n(u, v) = (alpha u', v')_n +
(beta u', v)_n + (gamma u, v)_n` replaces the integrals of (12.44) by the Gauss-Lobatto formula
(12.37); and `equation_12_68_eq_collocation`: for `alpha = 1`, `beta = gamma = 0` it coincides
with the collocation problem (12.36), by `equation_12_38`. *

Blocked: §12.3's `equation_12_37` and `equation_12_38` are now proved, so the obstacle is only
the shape of the backbone predicate. `IsGeneralizedGalerkinSolution` takes its space `W` with
`[NormedAddCommGroup W] [NormedSpace k W]`, while the natural `W` here is the polynomials
`R[X]` — the discrete form evaluates `u'` *pointwise* at the Gauss-Lobatto nodes, which no
element of `H^1(-1, 1)` or `L^2(-1, 1)` offers. Two ways out, neither attempted: generalize
`IsGeneralizedGalerkinSolution` (and the Strang lemma's statement, which does need the norm) to
a plain module for the definition alone; or instantiate `W` at `ContDiffMapIcc` (the `C^k` maps
on `[-1, 1]`, which is a normed space and carries `u'`) and take `K` to be the image of the
polynomials of degree at most `n` vanishing at the endpoints. The second needs the image
submodule and the bilinearity of the three discrete pairings; estimated half a day. The
collocation equivalence additionally needs the discrete integration by parts
`(p', q')_n = (-p'', q)_n`, which is `equation_12_37_exact` twice around the polynomial
integration by parts on `[-1, 1]`.'''
deps = ["IsGeneralizedGalerkinSolution", "QuarteroniSaccoSaleri.Chapter12.equation_12_37", "QuarteroniSaccoSaleri.Chapter12.equation_12_38"]
source = 'Quarteroni-Sacco-Saleri, Numerical Mathematics, equations (12.68)-(12.69)'

