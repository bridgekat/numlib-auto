[[node]]
id = "equation_12_45"
kind = "definition"
desc = '''§12.4.2: `𝒟(0,1) = 𝓓(Opens.Ioo 0 1, ℝ)` (Mathlib's `TestFunction`) and `𝒟'(0,1) = 𝓓'(Opens.Ioo 0 1, ℝ)`
(Mathlib's `Distribution`, the continuous linear functionals on `𝓓`), and the distributional derivative
(12.45): `equation_12_45 k T : 𝓓'(Opens.Ioo 0 1, ℝ)` is the `k`-fold `Distribution.lineDerivCLM 1`, with
`equation_12_45_apply : ⟪T^{(k)}, φ⟫ = (-1)^k ⟪T, φ^{(k)}⟫` (`Distribution.lineDerivCLM_apply` iterated, and
`iteratedDeriv` of the test function). Every distribution is infinitely differentiable by construction.
The two example functionals `⟨T, x⟩ = x(0)` and `⟨S, x⟩ = ∫ x sin` on `C[0,1]` are `ContinuousMap.evalCLM`
and an integral against a continuous function, both in Mathlib. ★

Blocked: not attempted. Mathlib's `Distribution` and `TestFunction` on `Opens.Ioo 0 1` carry the
whole statement (`Distribution.lineDerivCLM`, `Distribution.delta`), but the restatement needs the
distribution notation and the `TestFunction.lineDerivCLM` API, which this round had no budget
to learn.'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.45)'

[[node]]
id = "equation_12_45_heaviside"
kind = "theorem"
desc = '''The example after (12.45): the distributional derivative of the Heaviside function `H = indicator
(Ici 0)` is the Dirac mass at `0` — in the only form available without a "regular distribution"
constructor (Mathlib has `Distribution.delta` but no `L¹_loc → 𝓓'` map): for every `φ : 𝓓(⊤ : Opens ℝ, ℝ)`,
`-∫ x, H x * deriv φ x = φ 0` (`= Distribution.delta 0 φ`), by the fundamental theorem of calculus on
`[0, R]` with `φ(R) = 0`. And `equation_12_45_of_contDiff`: if `T` is (integration against) a `C¹` function
then its distributional derivative is its classical derivative — `hasWeakDerivOn_of_contDiffOn` of
`Numlib/Analysis/Sobolev/Interval.lean`, which is the same integration by parts. ★

Blocked: not attempted. Mathlib's `Distribution` and `TestFunction` on `Opens.Ioo 0 1` carry the
whole statement (`Distribution.lineDerivCLM`, `Distribution.delta`), but the restatement needs the
distribution notation and the `TestFunction.lineDerivCLM` API, which this round had no budget
to learn.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_45", "hasWeakDerivOn_of_contDiffOn"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §12.4.2, the Heaviside example after (12.45)'''

