[[node]]
id = "remark_12_6_piecewise_const"
kind = "theorem"
desc = '''Remark 12.6's general claim: if `f` is piecewise constant over the grid partition, the
Scharfetter-Gummel scheme yields a nodally exact solution of `-eps u'' + beta u' = f` with
`u(0) = 0`, `u(1) = 1`, irrespective of `h`.

Not formalized, and not merely unreached: the book quotes it from [HGR96, pp. 44-45] and proves
nothing, and the argument is not the one behind the homogeneous case.  What
`AdvectionDiffusion.sg_nodal_exact` uses is that the discrete amplification ratio
`(1 + Pe*)/(1 - Pe*)` equals `e^{2 Pe}` exactly, which fixes the *homogeneous* solution at the
nodes; for a piecewise constant `f` one needs in addition that the particular solution of the
two-point problem on each panel is reproduced exactly by the scheme's right-hand side, i.e. the
Green's function of `-eps u'' + beta u'` on a panel and the exactness of the trapezoidal/exponential
quadrature against a constant.  That is a new development (the exponentially fitted Green's
function of one panel), not a rearrangement of what is here; estimated one day, and it is used
nowhere in the book -- Theorem 12.4 needs only the homogeneous case, which is
`QuarteroniSaccoSaleri.Chapter12.remark_12_6_nodal_exact`.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.remark_12_6_nodal_exact"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 12.6'

