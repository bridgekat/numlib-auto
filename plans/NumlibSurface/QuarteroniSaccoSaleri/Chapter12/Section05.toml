[[node]]
id = "remark_12_6_piecewise_const"
kind = "theorem"
desc = '''Remark 12.6's general claim: if `f` is piecewise constant over the grid partition, the
Scharfetter–Gummel scheme yields a nodally exact solution, irrespective of `h`. Not formalized: the
book quotes it from [HGR96, pp. 44–45] and proves nothing; only the homogeneous case is needed by
Theorem 12.4 (the lifted problem's constant right-hand side `-β` reduces to it), and that case is
`QuarteroniSaccoSaleri.Chapter12.remark_12_6_nodal_exact`.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.remark_12_6_nodal_exact"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 12.6'

[[node]]
id = "theorem_12_4"
kind = "theorem"
desc = '''Theorem 12.4, (12.85): for `k = 1`, `|u - u_h|_{H1(0,1)} <= C h G(u)` with `C` independent of `h`
and `u`, where `G(u) = |u|_{H1} + |u|_{H2}` for the upwind method and `G(u) = |u|_{H2}` for the SG
method; and (12.86): for `k = 2` the SG method gives `|u - u_h|_{H1} <= C h^2 (|u|_{H1} + |u|_{H3})`.
The displayed statement is garbled in the source text and the sentence "where `u(x) = u(x) - x`"
should read `u*(x) = u(x) - x` (errata). **

Blocked: the upwind clause is proved as the backbone node
`AdvectionDiffusion.seminorm_sub_stabilized_le_upwind`; the Scharfetter-Gummel clauses are
`AdvectionDiffusion.seminorm_sub_stabilized_le_sg`, which is still open (see its `Blocked:`
paragraph). This surface node states both, so it waits on the SG half.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_84", "QuarteroniSaccoSaleri.Chapter12.remark_12_6_nodal_exact", "AdvectionDiffusion.seminorm_sub_stabilized_le_upwind", "AdvectionDiffusion.seminorm_sub_stabilized_le_sg"]
source = 'Quarteroni-Sacco-Saleri, Numerical Mathematics, Theorem 12.4'

