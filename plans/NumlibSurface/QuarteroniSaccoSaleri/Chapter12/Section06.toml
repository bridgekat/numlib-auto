[[node]]
id = "equation_12_94"
kind = "definition"
desc = '''The two-dimensional finite element space (12.94), `V_h = {v_h ∈ C⁰(Ω̄) : v_h|_T ∈ P_k(T) ∀ T ∈ 𝒯_h,
v_h|_∂Ω = 0}` over a triangulation `𝒯_h` of `Ω̄`, and the form `a(u_h, v_h) = ∫_Ω ∇u_h · ∇v_h`. Not
formalized: a triangulation of a plane domain and continuous piecewise polynomials on it do not
exist in the library (the Atkinson–Han plan's Chapter 10 group records the triangulation scaffold as a
deliberate scope exclusion), and `H^1_0(Ω)` with a boundary trace is `notes/frontier.md` blocker 2. The
book defines it and proves nothing about it.

Blocked (2026-09-20, agent qss5; replaces the 2026-09-16 note, whose verdict stands). Checked in
`Numlib/`: (i) still no triangulation of a plane domain —
`Numlib/Analysis/Convex/Polyhedral/Simplicial` triangulates a polytope as a finite union of
simplices for the convex-analysis purposes of Rockafellar, without the edge-to-edge conformity, the
affine reference map or any function space on it, and `Numlib/Approximation/TriangleQuadrature`
transports a rule to one triangle only (`notes/frontier.md` blocker 11); (ii) `H¹(Ω)` and `H¹₀(Ω)`
on a plane `Ω` exist as `SobolevEuclidean 2 1 2 Ω` and `SobolevEuclideanZero 2 1 2 Ω` (the closure
of the test functions), so the *space* side of (12.94) is nameable, but the membership criterion
`v_h|_∂Ω = 0` for a continuous `v_h` still needs the trace (blocker 2), unless the node is restated
with `H¹₀` as the closure and `v_h ∈ H¹₀` proved from a compact support or a
Lipschitz-continuous-vanishing-on-the-boundary argument (Brezis Theorem 9.17 is proved in both
directions for `C¹` domains, `Numlib/Analysis/Sobolev/Zero`, and a polygon is not `C¹`); (iii) a
continuous piecewise-`P_k` function on a triangulation is in `H¹(Ω)` — the divergence theorem on
each triangle with the interface terms cancelling, the same gap as `exercise_12_15`. The
one-dimensional counterpart is `Variational.FiniteElement.lagrangeSpace`; the two-dimensional
statement is a module of its own. Estimate: weeks, gated on the triangulation scaffold and on
Green's formula for a triangle (or on the alternative characterization of `H¹` by absolutely
continuous restrictions to lines, which avoids Green's formula for (iii)).'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.94)'

[[node]]
id = "exercise_12_15"
kind = "theorem"
desc = '''Green's formula (12.95), Exercise 12.15: `∫_Ω (-Δu) v = ∫_Ω ∇u · ∇v - ∫_∂Ω (∇u · n) v dγ` for `u, v`
smooth on a bounded plane domain `Ω`.

Blocked: the *rectangle* case is now proved, as `exercise_12_15_rectangle`, by the exercise's own
hint (`div (v ∇u) = v Δu + ∇u · ∇v`) over Mathlib's
`MeasureTheory.integral_divergence_prod_Icc_of_hasFDerivAt_off_countable_of_le`, with the boundary
integral written as the four sides each carrying its outward normal. What a *general* bounded plane
domain needs, and the library does not have, is exactly two objects and one theorem: the surface
measure `dγ` on `∂Ω` (`Measure.hausdorffMeasure 1` restricted to `frontier Ω` is definable today,
but nothing relates it to a parametrization of the boundary, so no `∫_∂Ω` can be computed or
integrated by parts), the outward unit normal `n` (no normal field for a `C¹` or Lipschitz boundary
exists), and the divergence theorem on `Ω` itself — Mathlib's divergence theorems are for boxes
(`MeasureTheory.integral_divergence_of_hasFDerivWithinAt_off_countable` and the plane corollary
used here) and for nothing else. `Numlib/Analysis/Calculus/CurvilinearLaplacian` carries the
Laplacian in polar and spherical coordinates and no integration theorem, so it does not help. This
is `notes/frontier.md` blocker 2 in its integration form. Estimate: a Mathlib-scale project.

Refreshed 2026-09-20 (agent qss5): the verdict stands. Checked in `Numlib/`: the Brezis round added
no boundary measure, no outward normal and no divergence theorem on a domain; Green's formula
remains blocker 2 in its integration form, and the Brezis nodes deferred on it
(`example_9_4_stepA/D`, Theorem 9.26's Neumann clause) are still open for the same reason.
`Numlib/Analysis/Sobolev/Zero` (Theorem 9.17) and `Numlib/Analysis/PDE/Elliptic/Regularity` (Theorem
9.25) work on `C¹`/`C²` domains through charts without ever integrating over the boundary, so they
do not help. Mathlib's divergence theorems are still box-only. Estimate: unchanged, a Mathlib-scale
project (surface measure on a `C¹` boundary via the charts, the normal field, the divergence theorem
by partition of unity).'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.95) and Exercise 12.15'

