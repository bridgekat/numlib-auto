[[node]]
id = "equation_12_94"
kind = "definition"
desc = '''The two-dimensional finite element space (12.94), `V_h = {v_h ∈ C⁰(Ω̄) : v_h|_T ∈ P_k(T) ∀ T ∈ 𝒯_h,
v_h|_∂Ω = 0}` over a triangulation `𝒯_h` of `Ω̄`, and the form `a(u_h, v_h) = ∫_Ω ∇u_h · ∇v_h`. Not
formalized: a triangulation of a plane domain and continuous piecewise polynomials on it do not
exist in the library (the Atkinson–Han plan's Chapter 10 group records the triangulation scaffold as a
deliberate scope exclusion), and `H^1_0(Ω)` with a boundary trace is `notes/frontier.md` blocker 2. The
book defines it and proves nothing about it.'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.94)'

[[node]]
id = "exercise_12_15"
kind = "theorem"
desc = '''Green's formula (12.95), Exercise 12.15: `∫_Ω (-Δu) v = ∫_Ω ∇u · ∇v - ∫_∂Ω (∇u · n) v dγ` for `u, v`
smooth on a bounded plane domain `Ω`. Not formalized for a general domain: it needs the divergence
theorem on `Ω` with a boundary measure and normal (Mathlib's divergence theorem is for boxes,
`MeasureTheory.integral_divergence_of_hasFDerivWithinAt_off_countable`; there is no surface measure
on a curve — `notes/frontier.md` blocker 2). On a rectangle, with the boundary integral written as four
line integrals, it is a corollary of Mathlib's box theorem applied to `v ∇u` with the identity
`div(v ∇u) = v Δu + ∇u · ∇v` (the exercise's hint), and could be stated if wanted.'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.95) and Exercise 12.15'

[[node]]
id = "property_12_2"
kind = "theorem"
desc = '''Property 12.2: for `u ∈ H^1_0(Ω) ∩ H^s(Ω)`, `s ≥ 2`, and its finite element approximation `u_h ∈ V_h` of
degree `k ≥ 1` on a triangulation, `‖u - u_h‖_{H¹₀(Ω)} ≤ (M/α₀) C h^l ‖u‖_{H^{l+1}(Ω)}` with `l = min(k, s -
1)` (12.96), and `‖u - u_h‖_{L²(Ω)} ≤ C h^{l+1} ‖u‖_{H^{l+1}(Ω)}` (12.97). Not formalized:
the two-dimensional finite element space (12.94) does not exist, and the interpolation estimate behind
(12.96) is the multi-dimensional Bramble–Hilbert / Deny–Lions theory that `notes/frontier.md` lists
under blocker 1; the `L²` estimate additionally needs `H²` regularity of the Poisson problem on a convex
polygon. The book quotes both from [QV94, Theorem 6.2.1]. Céa's lemma itself
(`IsGalerkinSolution.norm_sub_le_infDist`) is available.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_94"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 12.2, equations (12.96)–(12.97)'
