[[node]]
id = "property_12_2"
kind = "theorem"
desc = '''Property 12.2: for `u ∈ H^1_0(Ω) ∩ H^s(Ω)`, `s ≥ 2`, and its finite element approximation `u_h ∈ V_h` of
degree `k ≥ 1` on a triangulation, `‖u - u_h‖_{H¹₀(Ω)} ≤ (M/α₀) C h^l ‖u‖_{H^{l+1}(Ω)}` with `l = min(k, s -
1)` (12.96), and `‖u - u_h‖_{L²(Ω)} ≤ C h^{l+1} ‖u‖_{H^{l+1}(Ω)}` (12.97). The book quotes both from
[QV94, Theorem 6.2.1] and proves neither.

Blocked: re-examined 2026-09-16. The abstract half is available and is *not* the obstruction —
Céa’s lemma is `IsGalerkinSolution.norm_sub_le_infDist` and its seminorm form
`seminorm_sub_le_of_galerkin_orthogonal`, both proved, and they reduce (12.96) to the interpolation
estimate `inf_{v_h ∈ V_h} |u - v_h|_{H¹} ≤ C h^l |u|_{H^{l+1}}`. Three ingredients of that estimate
are missing, in increasing order of cost: (a) the space `V_h` itself, which is `equation_12_94`
and is blocked on the triangulation scaffold; (b) the multi-dimensional Bramble–Hilbert lemma —
the reachable route is Brenner–Scott’s averaged Taylor polynomial, which uses no compactness and
which `notes/lessons.md` already names as the single highest-leverage gap (blocker 1 of
`notes/frontier.md`); (c) for (12.97), the Aubin–Nitsche duality argument needs `H²` regularity of
the Poisson problem on a convex polygon, which is a genuine elliptic-regularity theorem nobody in
this corpus proves. The one-dimensional counterparts are all proved (`property_12_1`,
`property_12_1_l2`), so the shape of the argument is settled; only the two-dimensional analysis is
absent. Estimate: gated on (a) and (b), each a module of its own.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_94"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 12.2, equations (12.96)–(12.97)'
