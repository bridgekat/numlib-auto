[[node]]
id = "equation_12_94"
kind = "definition"
desc = '''The two-dimensional finite element space (12.94), `V_h = {v_h ∈ C⁰(Ω̄) : v_h|_T ∈ P_k(T) ∀ T ∈ 𝒯_h,
v_h|_∂Ω = 0}` over a triangulation `𝒯_h` of `Ω̄`, and the form `a(u_h, v_h) = ∫_Ω ∇u_h · ∇v_h`. Not
formalized: a triangulation of a plane domain and continuous piecewise polynomials on it do not
exist in the library (the Atkinson–Han plan's Chapter 10 group records the triangulation scaffold as a
deliberate scope exclusion), and `H^1_0(Ω)` with a boundary trace is `notes/frontier.md` blocker 2. The
book defines it and proves nothing about it.

Blocked: re-examined 2026-09-16 and the verdict stands. Three things are missing and none is
one-dimensional: (i) a triangulation of a plane domain — a finite family of nondegenerate triangles
with pairwise disjoint interiors whose union is `Ω̄` and which meet edge to edge — with the affine
map to a reference triangle, none of which is in Mathlib or in `Numlib`; (ii) `H¹(Ω)` for a plane
`Ω` *is* available (`Numlib/Analysis/Sobolev/MultiIndex` with `Ω : Opens (Fin 2 → ℝ)`), but
`H¹₀(Ω)` as "vanishing on `∂Ω`" needs the trace operator, which needs the surface measure on
`∂Ω` (`notes/frontier.md` blocker 2); the closure definition `SobolevMultiIndexZero` is available
and would let the *space* be defined, but not the membership criterion the book states; (iii) the
piecewise-polynomial subspace of `H¹(Ω)` needs the fact that a continuous piecewise-smooth function
on a triangulation is weakly differentiable, whose proof is the divergence theorem on each triangle
plus the cancellation of the interface terms — the same missing divergence theorem as
`exercise_12_15`. The one-dimensional counterpart is
`Variational.FiniteElement.lagrangeSpace`; a faithful two-dimensional statement is a module of its
own, not a node. Estimate: weeks, gated on the triangulation scaffold.'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.94)'

[[node]]
id = "exercise_12_15"
kind = "theorem"
desc = '''Green's formula (12.95), Exercise 12.15: `∫_Ω (-Δu) v = ∫_Ω ∇u · ∇v - ∫_∂Ω (∇u · n) v dγ` for `u, v`
smooth on a bounded plane domain `Ω`.

Blocked: the *rectangle* case is now proved, as `exercise_12_15_rectangle`, by the exercise's own
hint (`div (v ∇u) = v Δu + ∇u · ∇v`) over Mathlib's
`MeasureTheory.integral_divergence_prod_Icc_of_hasFDerivAt_off_countable_of_le`, with the boundary
integral written as the four sides each carrying its outward normal. What a *general* bounded plane
domain needs, and the library does not have, is exactly two objects and one theorem: the surface
measure `dγ` on `∂Ω` (`Measure.hausdorffMeasure 1` restricted to `frontier Ω` is definable today,
but nothing relates it to a parametrization of the boundary, so no `∫_∂Ω` can be computed or
integrated by parts), the outward unit normal `n` (no normal field for a `C¹` or Lipschitz boundary
exists), and the divergence theorem on `Ω` itself — Mathlib's divergence theorems are for boxes
(`MeasureTheory.integral_divergence_of_hasFDerivWithinAt_off_countable` and the plane corollary
used here) and for nothing else. `Numlib/Analysis/Calculus/CurvilinearLaplacian` carries the
Laplacian in polar and spherical coordinates and no integration theorem, so it does not help. This
is `notes/frontier.md` blocker 2 in its integration form. Estimate: a Mathlib-scale project.'''
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (12.95) and Exercise 12.15'

