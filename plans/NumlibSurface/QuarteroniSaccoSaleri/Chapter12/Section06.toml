[[node]]
id = "property_12_2"
kind = "theorem"
desc = '''Property 12.2: for `u ∈ H^1_0(Ω) ∩ H^s(Ω)`, `s ≥ 2`, and its finite element approximation `u_h ∈ V_h` of
degree `k ≥ 1` on a triangulation, `‖u - u_h‖_{H¹₀(Ω)} ≤ (M/α₀) C h^l ‖u‖_{H^{l+1}(Ω)}` with `l = min(k, s -
1)` (12.96), and `‖u - u_h‖_{L²(Ω)} ≤ C h^{l+1} ‖u‖_{H^{l+1}(Ω)}` (12.97). The book quotes both from
[QV94, Theorem 6.2.1] and proves neither.

Blocked (2026-09-20, agent qss5; replaces the 2026-09-16 note). Checked in `Numlib/`: the abstract
half is proved — Céa's lemma `IsGalerkinSolution.norm_sub_le_infDist` and
`seminorm_sub_le_of_galerkin_orthogonal` — so (12.96) reduces to the interpolation estimate
`inf_{v_h} |u − v_h|_{H¹} ≤ C h^l |u|_{H^{l+1}}` on a triangulation. Of its three ingredients: (a)
the space `V_h` is `equation_12_94`, still blocked on the triangulation scaffold (blocker 11); (b)
the Bramble–Hilbert lemma on the reference triangle — the Brezis round changed this:
Rellich–Kondrachov is proved for extension domains
(`SobolevEuclidean.isCompactEmbedding_toLp_of_hasSobolevExtensionOn`,
`Numlib/Analysis/Sobolev/Compactness`), agent ah1 is proving Deny–Lions / Bramble–Hilbert on a fixed
extension domain (`Numlib/Analysis/Sobolev/DenyLions.lean`, this round), and the affine change of
variables for Sobolev seminorms is `sobolevSeminorm_comp_affine_le` / `memSobolev_comp_affine_iff`
(AH `theorem_10_3_4`, `NumlibSurface/AtkinsonHan/Chapter10/Section03`, which belongs in the
backbone) — so what remains for (b) is that a triangle (a convex polygon, Lipschitz but not `C¹`) is
a Sobolev extension domain, which the `C¹`-chart route
`IsSobolevExtensionDomain.of_isContDiffChartDomain` does not give; a reflection or star-shaped
extension for a triangle is ~500 lines, and Brenner–Scott's averaged-Taylor route needs none of it;
(c) for (12.97), the Aubin–Nitsche argument needs `H²` regularity of the Poisson problem on a convex
polygon; `Elliptic.regularity_dirichlet` (`Numlib/Analysis/PDE/Elliptic/Regularity`, Brezis Theorem
9.25) now gives it on `C²` domains with a bounded boundary, not on polygons (Grisvard's theorem,
`notes/frontier.md` blocker 18). The book quotes both estimates from [QV94] without proof. Estimate:
(12.96) is gated on (a) and the extension property of a triangle, a few weeks once `DenyLions`
lands; (12.97) is gated on Grisvard-type regularity, research-scale.'''
deps = ["QuarteroniSaccoSaleri.Chapter12.equation_12_94"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 12.2, equations (12.96)–(12.97)'
