desc = '''
Quarteroni–Sacco–Saleri, Chapter 5: approximation of eigenvalues and eigenvectors. Localization
(§5.1: Hirsch, the three Gershgorin theorems, reducibility), conditioning of the eigenproblem
(§5.2: Bauer–Fike, the first-order perturbation of a simple eigenvalue and of its eigenvector, the
a posteriori residual bounds), the power and inverse iterations (§5.3), the QR iteration and its
convergence (§5.4–5.5), the Hessenberg–QR machinery of Householder reflectors and Givens
rotations (§5.6), shifts (§5.7), eigenvectors and the SVD (§5.8), matrix pencils (§5.9), the
Jacobi, Sturm–Givens and Lanczos methods for symmetric matrices (§5.10–5.11), and the two
applications of §5.12.

Almost all of §5.1–5.3 and §5.10–5.11 is a restatement of `Numlib/Eigen/{Perturbation,
PowerMethod, QRAlgorithm, Jacobi, KrylovEigen, MinMax, RayleighRitz, ReducedResolvent}` and of
`Numlib/LinearAlgebra/Sparse/Pattern`; §5.6–5.9 drive the new backbone modules
`LinearAlgebra/Matrix/PlaneRotation`, `Eigen/Pencil`, `Eigen/Sturm` and the extensions of
`LinearAlgebra/Matrix/{QR, Hessenberg, Schur, RealSchur}` and `Eigen/{QRAlgorithm, Deflation}`.

The book works over `ℂ^n` in §5.1–5.3 and §5.9 and over real matrices from §5.4 on; the surface
follows it: complex `Matrix n n ℂ` (or `EuclideanSpace ℂ n`) where the book says `ℂ^{n×n}`, real
`Matrix (Fin N) (Fin N) ℝ` where it says `ℝ^{n×n}`. Programs 26–45 are not nodes; the method each
implements is the backbone `iterate` that the corresponding theorem is about. Numerical examples
(5.1–5.13, 5.15–5.18) are skipped; Example 5.14 (three pencils) is a node.

Not formalized, each with the full record in the `## Not formalized here` section of its section
module: §5.7.2, the quadratic convergence of the Francis double shift — the book calls a provably
convergent shift strategy an open problem, so no faithful statement exists; §5.8.3, the backward
stability of the Golub–Kahan–Reinsch algorithm — its printed constant `C_{mn}` is allowed to
depend on the roundoff unit, which makes the bound empty as stated, and the Givens rounding model
and the computed bidiagonalization are missing; §5.9.2, the stability of the QR–Cholesky
algorithm — printed with `≃`, and the backbone shows the printed bound omits a factor `κ(B)^{1/2}`
from the triangular solves; §5.10.1, Wilkinson's quadratic convergence of the cyclic Jacobi
method — a sweep-indexed second-order invariant the library does not have. All four are quoted by
the book without proof.
'''
