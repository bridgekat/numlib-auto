namespace = "QuarteroniSaccoSaleri.Chapter13"
desc = '''
§13.4, space–time finite elements (cG(1)dG(q)) for the heat equation. The section defines the
space–time spaces `Q_q(S_k)`, `V_{h,Δt}`, `Y_{h,k}`, the jump `[v^k]`, the cG(1)dG(q) method and
its algebraic forms for `q = 0` (backward Euler with the projection matrix `B_{k,k-1}` on the right)
and `q = 1` (the `2 × 2` block system). None of these is numbered, and the only numbered result is
the error estimate (13.25), quoted from [EEHJ96] without proof. The section contributes that one
node, not formalized. Example 13.2 is a numerical experiment and is skipped.
'''

[[node]]
id = "equation_13_25"
kind = "theorem"
desc = '''(13.25): for the cG(1)dG(1) space–time discretization of the heat equation (13.12) on
`[0,1] × [0,T]` with time slabs `I_k`, piecewise linear continuous elements in space and
discontinuous piecewise linear elements in time, assuming `V_{h,k-1} ⊄ V_{h,k}` is allowed (the
meshes may change between slabs), `‖u(t^n) - U^n‖_{L²(0,1)} ≤ C(u_{0h}, f, u, n)(Δt² + h²)`.
Not formalized: the book quotes [EEHJ96]; the proof is a duality (Aubin–Nitsche in space–time)
argument needing the discrete backward parabolic problem and parabolic regularity of the heat
equation, i.e. the classical heat-equation theory recorded as a blocker in `notes/frontier.md`;
the space–time spaces themselves are not planned.

Blocked (2026-09-20, agent qss5; replaces the 2026-09-16 note). Three gaps, re-checked against the
Brezis backbone. (i) Unchanged: the space–time spaces `Q_q(S_k)`, `V_{h,Δt}`, `Y_{h,k}`, the time
jumps `[v^k]` and the cG(1)dG(q) form exist nowhere; per slab a tensor product of chapter 12's
`X_h^1` with `P_q(I_k)` on a slab-dependent mesh, with one-sided time traces —
`Approximation/BrokenPolynomial` has traces and jumps in one variable only. (ii) The exact solution
`u(t^n)`: `equation_13_12` is a definition. The Brezis round gives the *homogeneous* heat equation
on the Dirichlet Laplacian of `Ω : Opens (EuclideanSpace ℝ (Fin N))` (`Heat.IsSolution`,
`Heat.existsUnique_isSolution`, `Numlib/Analysis/PDE/Heat`), with `u ∈ C^∞((0,∞); L²)`,
`u(t) ∈ D(A^ℓ)` and `‖u^{(k)}(t)‖ ≤ (k/t)^k ‖u₀‖` (`LinearPMap.norm_applyL_semigroupLift_le`), and
`u ∈ C^{k−j}([0,∞); D(A^j))` for `u₀ ∈ D(A^k)`
(`LinearPMap.IsMaximalMonotone.contDiffOnPowDomain_semigroup`, Theorem 7.5); what (13.12) needs
beyond it is a source term `f ≠ 0` (no Duhamel formula `u = S(t)u₀ + ∫₀ᵗ S(t−s) f(s) ds` anywhere in
`Numlib/Analysis/ODE/HilleYosida`), the identification of the 1-D problem with that vocabulary (no
bridge between `SobolevInterval` on `Ioo 0 1 ⊆ ℝ` and `SobolevEuclidean` on
`EuclideanSpace ℝ (Fin 1)`, and no instance that an interval is an `IsContDiffChartDomain`), and,
for the weak formulation with `u' ∈ L²(0,T;H⁻¹)`, Lions' theorem, still absent
(`Numlib/Analysis/PDE/Bochner` has the classes `C^k(s;V)` and `L^p(s;V)` read through an embedding,
no `L²(0,T;V)` type and no existence theory). (iii) The [EEHJ96] proof is a space–time duality
argument over the discrete backward problem with a strong-stability estimate and parabolic
regularity in time for the *nonhomogeneous* problem; the semigroup smoothing above is the `f = 0`
piece of it. The constant `C(u_{0h}, f, u, n)` is unspecified by the book. Quoted without proof; out
of scope by policy. Estimate: weeks — the space–time discretization module (~1500 lines), Duhamel
plus the 1-D bridge (~800), and the duality argument (~1500).'''
