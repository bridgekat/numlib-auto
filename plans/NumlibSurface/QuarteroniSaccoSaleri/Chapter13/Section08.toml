[[node]]
id = "equation_13_48"
kind = "definition"
desc = '''The CFL condition (13.48): `|a λ| = |a Δt/Δx| ≤ 1`; the CFL number is `a λ`. For a variable
speed `a(x, t)`: `Δt ≤ Δx / sup |a|`; for the system (13.30): `|λ_k Δt/Δx| ≤ 1` for every eigenvalue.
`FiniteDifference.Hyperbolic.CFL a λ : Prop := |a * λ| ≤ 1`, and the two variants. ★'''
