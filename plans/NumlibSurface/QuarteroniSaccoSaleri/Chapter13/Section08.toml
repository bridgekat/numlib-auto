[[node]]
id = "forwardEulerCentred_not_isStable"
kind = "theorem"
desc = '''Forward Euler/centred is unconditionally unstable in `‖·‖_{Δ,2}`: for every `λ > 0`, `a ≠
0` and `T > 0`, the family `N ↦ periodicScheme (forwardEulerCentred a λ)` on `N` nodes (`h = 2π/N`,
`Δt = λh`) is not stable, because for `4 ∣ N` the mode `k = N/4` has `|γ_k| = √(1 + λ²a²)`
independent of `N`, so `‖Q_N^n‖₂ ≥ (1 + λ²a²)^{n/2}` with `n = ⌊T/Δt⌋ → ∞`, exceeding any `C_T`.
`FiniteDifference.norm_amplificationFactor_pow_le` for the lower bound, then the negation of
`IsStableFamily`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.amplificationFactor_forwardEulerCentred", "QuarteroniSaccoSaleri.Chapter13.equation_13_46", "FiniteDifference.norm_amplificationFactor_pow_le", "FiniteDifference.Hyperbolic.forwardEulerCentred_not_isStableFamily"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.4, "The centred discretization scheme (13.37) is thus unconditionally unstable"'''

