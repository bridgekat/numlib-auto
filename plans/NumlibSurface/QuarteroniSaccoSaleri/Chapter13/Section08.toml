[[node]]
id = "exercise_13_6"
kind = "theorem"
desc = '''Exercise 6 and the upwind amplification factor: `γ_k = 1 - λa(1 - e^{-iφ_k})` for `a > 0`
and `γ_k = 1 - λa(e^{iφ_k} - 1)` for `a < 0` (the book prints `e^{-ikh} - 1` in the second case; see
the group description), with `|γ_k|² = 1 - 2λ|a|(1 - λ|a|)(1 - cos φ_k)`; hence `|γ_k| ≤ 1` for all
`k` iff `λ|a| ≤ 1`, i.e. `Δt ≤ h/|a|`, the CFL condition (the "if" for all `N`; the "only if" as soon
as some `φ_k ≠ 0 mod 2π`, i.e. `N ≥ 2`). `FiniteDifference.Hyperbolic.amplificationFactor_upwind`,
