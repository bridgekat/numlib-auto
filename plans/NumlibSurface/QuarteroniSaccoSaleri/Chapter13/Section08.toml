[[node]]
id = "numericalDomainOfDependence"
kind = "theorem"
desc = '''The numerical domain of dependence: for a three-point stencil `c` (support in `{-1, 0,
1}`), `(c^n u)_j` depends only on `u_{j-n}, …, u_{j+n}`: if `u = v` on `{i | |i - j| ≤ n}` then `(c^n
u)_j = (c^n v)_j` (`Stencil.iterate_apply_congr_of_eqOn`), so `D_Δt(x_j, t^n) ⊆ {x : |x - x_j| ≤ n
Δx = t^n/λ}` (the display after (13.48)), and for fixed `λ`, `D₀(x̄, t̄) = {|x - x̄| ≤ t̄/λ}`. ★★'''
deps = ["FiniteDifference.Stencil.iterate_apply_congr_of_eqOn"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.3, D_Δt(x_j, t^n) ⊂ {|x − x_j| ≤ nΔx}'''

[[node]]
id = "equation_13_49"
kind = "theorem"
desc = '''(13.49): for the scalar equation, the CFL condition `|aλ| ≤ 1` holds iff the domain of
dependence `D(x̄, t̄) = {x̄ - a t̄}` (13.31) is contained in `D₀(x̄, t̄) = {x : |x - x̄| ≤ t̄/λ}` for
some/every `t̄ > 0`: `|a t̄| ≤ t̄/λ ↔ |a| λ ≤ 1`. For a system, iff every `x̄ - λ_k t̄` lies in `D₀`.
★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_48", "QuarteroniSaccoSaleri.Chapter13.equation_13_31"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.49)'

[[node]]
id = "cfl_necessary"
kind = "theorem"
desc = '''The CFL condition is necessary for convergence (the content of §13.8.3's claim, with
"sufficient" removed — see the group description): for any family of three-point explicit schemes
`c(Δt, Δx)` with fixed ratio `λ = Δt/Δx` and `|aλ| > 1`, there is a smooth compactly supported
`u₀` (a `ContDiffBump` centred at `-a` of radius `(|a| - 1/λ)/2`, so that `u₀` vanishes on `[-1/λ,
1/λ]` and `u₀(-a) = 1`) such that for every `Δt = 1/n`, `n ≥ 1`, the numerical solution at `(x, t) =
(0, 1)` is `(c^n u₀(x_·))_0 = 0` while the exact solution is `u(0, 1) = u₀(-a) = 1`; hence the
family is not convergent (`isConvergent` fails for this `u₀`). From
`numericalDomainOfDependence`: `(c^n u₀)_0` depends on `u₀` on `{|x| ≤ nΔx = 1/λ}`, where it
vanishes. `FiniteDifference.Hyperbolic.not_isConvergent_of_one_lt_abs_mul`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.numericalDomainOfDependence", "QuarteroniSaccoSaleri.Chapter13.isConvergent", "QuarteroniSaccoSaleri.Chapter13.equation_13_26_solution", "FiniteDifference.Hyperbolic.not_isConvergent_of_one_lt_abs_mul"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.3, the CFL condition as a necessary condition'''

