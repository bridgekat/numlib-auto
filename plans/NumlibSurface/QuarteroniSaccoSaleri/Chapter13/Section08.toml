kind = "theorem"
desc = '''(13.52), the von Neumann recursion on the periodic grid of `N` nodes: with `u_j^0 = ∑_k
α_k e^{ikjh}` (`h = 2π/N`, `k ∈ Fin N`), any constant-coefficient explicit scheme `Q = circulant c`
