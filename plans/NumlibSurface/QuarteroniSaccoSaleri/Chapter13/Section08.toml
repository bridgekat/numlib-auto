[[node]]
id = "theorem_13_1"
kind = "theorem"
desc = '''Theorem 13.1: if `|γ_k| ≤ 1` for all `k ∈ Fin N`, the scheme `Q = circulant c` on the
periodic grid is stable in `‖·‖_{Δ,2}`: `‖Q^n u‖₂ ≤ ‖u‖₂` for every `n` and `u`, i.e. (13.46) with
`C_T = 1`. Proof as the book: expand `u` in the Fourier modes, `Q^n` multiplies the `k`-th
coefficient by `γ_k^n`, and Lemma 10.1 (the orthogonality `∑_j e^{i(k-m)jh} = N δ_{km}`, i.e.
`Matrix.conjTranspose_dft_mul_dft`) is the discrete Parseval identity `‖u‖₂² = N⁻¹ ∑_k |û_k|²`.
`FiniteDifference.norm_toEuclideanLin_periodicScheme_pow_le`. ★★'''
