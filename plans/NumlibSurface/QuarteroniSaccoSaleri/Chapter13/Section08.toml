[[node]]
id = "leapFrog_truncation"
kind = "theorem"
desc = '''The leap-frog scheme (13.44) is second order for the wave equation: for `u : ℝ → ℝ → ℝ`
four times continuously differentiable with `|∂_t⁴ u| ≤ M`, `|∂_x⁴ u| ≤ M'`, the residual
`[u(x, t+Δt) - 2u(x,t) + u(x, t-Δt)]/Δt² - γ² [u(x+Δx, t) - 2u(x,t) + u(x-Δx, t)]/Δx² - (u_tt -
γ² u_xx)(x, t)` is bounded by `(M/12) Δt² + (γ² M'/12) Δx²`; the book says "second order if `Δt =
Δx`", which is this bound read with `Δt = Δx`. Two one-variable second-difference Taylor bounds
(chapter 10's `FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq`). ★★

Blocked: not attempted for lack of time. `FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq`
is the one-variable engine; what is missing is the two-variable interface — the iterated partial
derivatives of `u` as named functions and the restriction of `u` to the two coordinate lines
through `(x, t)` — the same interface `FiniteDifference.Hyperbolic.residual_threePoint_expansion`
waits on. Estimate: half a day once that exists.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_44", "FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, "The Leap-frog and Newmark methods are both second order accurate if Δt = Δx"'''

[[node]]
id = "newmark_truncation"
kind = "theorem"
desc = '''The Newmark scheme (13.45) is second order for the wave equation when `θ = 1/2` (any `β`):
inserting a smooth solution `u`, `v = u_t` of `u_tt = γ² u_xx` (`f = 0`) into (13.45), the residuals
of the two relations, divided by `Δt`, are `O(Δt² + Δx²)`; for `θ ≠ 1/2` the second relation
is only first order, with residual `(θ - 1/2) Δt u_ttt + O(Δt² + Δx²)`. The book states second order
for both methods without the condition `θ = 1/2`. ★★★

Blocked: not attempted; waits on the same two-variable Taylor interface as `leapFrog_truncation`,
and additionally on the algebra of the two Newmark relations.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_45", "FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, "The Leap-frog and Newmark methods are both second order accurate if Δt = Δx"'''

