namespace = "QuarteroniSaccoSaleri.Chapter13"
desc = '''
§13.8, analysis of the finite difference schemes for `u_t + a u_x = 0`: consistency and order
(§13.8.1, Table 13.1's truncation errors), the stability definition (13.46) in the discrete norms
(13.47) (§13.8.2), the CFL condition (13.48) and its geometric reading through the numerical
domain of dependence (13.49), the `ℓ¹` stability of upwind and Lax–Friedrichs under CFL (§13.8.3),
and the von Neumann analysis (§13.8.4): the amplification factors, Theorem 13.1 on the periodic
grid, the unconditional instability of forward Euler/centred, the CFL condition of upwind
(Exercise 6), the discrete maximum principle (13.53), and Remark 13.4 on leap-frog and Newmark.
Exercise 7 (backward Euler/centred is `ℓ²`-nonexpansive) is here too.

Two corrections of the book. (i) §13.8.3 says the CFL condition (13.48) is "necessary and
sufficient" for the stability of any explicit scheme (13.36); it is necessary, and the book's own
§13.8.4 shows forward Euler/centred satisfies it and is unstable. The nodes state necessity
(`cfl_necessary`) and sufficiency scheme by scheme. (ii) The upwind amplification factor for
`a < 0` is printed with `e^{-ikh} - 1`; the scheme `u_j - λa(u_{j+1} - u_j)` gives `1 - λa(e^{ikh} -
1)`; the modulus, hence the stability condition, is unaffected.

The truncation errors are stated for the exact solution `u(x, t) = u₀(x - at)`, so that every
Taylor expansion is of the single-variable function `u₀` at the foot `ξ = x_j - a t^n` of the
characteristic: `τ_j^n = [u₀(ξ - aΔt) - ∑_s c_s u₀(ξ - sΔx)] / Δt`
(`FiniteDifference.Hyperbolic.truncationError`). The periodic-grid statements use `N` nodes on
`[0, 2π]`, `h = 2π/N`, and the `k`-th Fourier mode `j ↦ e^{ikjh}` for `k ∈ Fin N`, which is the
book's `k ∈ [-N/2, N/2 - 1]` up to the period.
'''

[[node]]
id = "truncationError"
kind = "definition"
desc = '''The local truncation error of §13.8.1 for a stencil `c` and the exact solution `u₀(x -
at)`: `τ_j^n = [u(x_j, t^{n+1}) - (c u(·, t^n))_j] / Δt`, which in terms of the foot `ξ = x_j - a t^n`
is `FiniteDifference.Hyperbolic.truncationError c a Δt Δx u₀ ξ = (u₀ (ξ - a Δt) - c.sum (fun s cs =>
cs * u₀ (ξ - s Δx))) / Δt`; and `τ(Δt, Δx) = sup_ξ |τ|`. For (13.37) this is the book's displayed
formula. The scheme is consistent when `τ(Δt, Δx) → 0` as `(Δt, Δx) → 0` and of order `(p, q)` when
`τ(Δt, Δx) ≤ C (Δt^p + Δx^q)`: `FiniteDifference.Hyperbolic.IsConsistent`,
`FiniteDifference.Hyperbolic.IsOfOrder`. ★'''
deps = ["FiniteDifference.Hyperbolic.truncationError", "FiniteDifference.Hyperbolic.IsConsistent", "FiniteDifference.Hyperbolic.IsOfOrder"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, τ_j^n and τ(Δt, Δx)'

[[node]]
id = "table_13_1_truncation_forwardEulerCentred"
kind = "theorem"
desc = '''Forward (and backward) Euler/centred is `O(Δt + Δx²)`: for `u₀ : ℝ → ℝ` with `|u₀''| ≤ M₂`,
`|u₀⁽³⁾| ≤ M₃` everywhere, `|truncationError (forwardEulerCentred a λ) a Δt Δx u₀ ξ| ≤ (a²/2) M₂
Δt + (|a|/6) M₃ Δx²` for `λ = Δt/Δx`. Taylor: `u₀(ξ - aΔt) - u₀(ξ) = -aΔt u₀'(ξ) + O(Δt²)` and
`(u₀(ξ+Δx) - u₀(ξ-Δx))/(2Δx) = u₀'(ξ) + O(Δx²)` (`taylor_mean_remainder_bound`). The backward
scheme's error, defined with the centred difference at `t^{n+1}`, has the same bound. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.truncationError", "QuarteroniSaccoSaleri.Chapter13.equation_13_37", "FiniteDifference.Hyperbolic.abs_truncationError_forwardEulerCentred_le"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, the forward/backward Euler centred method is O(Δt + Δx²)'''

[[node]]
id = "table_13_1_truncation_laxFriedrichs"
kind = "theorem"
desc = '''Lax–Friedrichs is `O(Δx²/Δt + Δt + Δx²)` (Table 13.1 writes `Δx` for the last term): with
`|u₀''| ≤ M₂`, `|u₀⁽³⁾| ≤ M₃`, `|truncationError (laxFriedrichs a λ) …| ≤ (M₂/2) Δx²/Δt + (a²/2) M₂ Δt
+ (|a|/6) M₃ Δx²`; the extra term is `[u₀(ξ) - ½(u₀(ξ+Δx) + u₀(ξ-Δx))]/Δt = -(Δx²/(2Δt)) u₀''(η)`.
★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.truncationError", "QuarteroniSaccoSaleri.Chapter13.equation_13_39", "FiniteDifference.Hyperbolic.abs_truncationError_laxFriedrichs_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Table 13.1, Lax–Friedrichs τ(Δt, Δx)'

[[node]]
id = "table_13_1_truncation_laxWendroff"
kind = "theorem"
desc = '''Lax–Wendroff is `O(Δt² + Δx²)`: with `|u₀⁽³⁾| ≤ M₃` and `|u₀⁽⁴⁾| ≤ M₄`,
`|truncationError (laxWendroff a λ) …| ≤ C (Δt² + Δx²)` with `C` depending on `a, M₃, M₄` (the
`Δt`, `Δx` and `Δt²`-free parts of the expansion cancel exactly because `u₀(ξ - aΔt) - u₀ + aΔt u₀'
- (a²Δt²/2) u₀''` is third order and the stencil reproduces `-aΔt u₀' + (a²Δt²/2) u₀''` from the
centred first and second differences). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.truncationError", "QuarteroniSaccoSaleri.Chapter13.equation_13_40", "FiniteDifference.Hyperbolic.abs_truncationError_laxWendroff_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Table 13.1, Lax–Wendroff τ(Δt, Δx)'

[[node]]
id = "table_13_1_truncation_upwind"
kind = "theorem"
desc = '''Upwind is `O(Δt + Δx)`: with `|u₀''| ≤ M₂`, `|truncationError (upwind a λ) …| ≤ (a²/2) M₂
Δt + (|a|/2) M₂ Δx`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.truncationError", "QuarteroniSaccoSaleri.Chapter13.equation_13_41", "FiniteDifference.Hyperbolic.abs_truncationError_upwind_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Table 13.1, upwind τ(Δt, Δx)'

[[node]]
id = "leapFrog_truncation"
kind = "theorem"
desc = '''The leap-frog scheme (13.44) is second order for the wave equation: for `u : ℝ → ℝ → ℝ`
four times continuously differentiable with `|∂_t⁴ u| ≤ M`, `|∂_x⁴ u| ≤ M'`, the residual
`[u(x, t+Δt) - 2u(x,t) + u(x, t-Δt)]/Δt² - γ² [u(x+Δx, t) - 2u(x,t) + u(x-Δx, t)]/Δx² - (u_tt -
γ² u_xx)(x, t)` is bounded by `(M/12) Δt² + (γ² M'/12) Δx²`; the book says "second order if `Δt =
Δx`", which is this bound read with `Δt = Δx`. Two one-variable second-difference Taylor bounds
(chapter 10's `FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq`). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_44", "FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, "The Leap-frog and Newmark methods are both second order accurate if Δt = Δx"'''

[[node]]
id = "newmark_truncation"
kind = "theorem"
desc = '''The Newmark scheme (13.45) is second order for the wave equation when `θ = 1/2` (any `β`):
inserting a smooth solution `u`, `v = u_t` of `u_tt = γ² u_xx` (`f = 0`) into (13.45), the residuals
of the two relations, divided by `Δt`, are `O(Δt² + Δx²)`; for `θ ≠ 1/2` the second relation
(the velocity update `v^{n+1} - v^n = Δt [θ ü^{n+1} + (1-θ) ü^n]` up to the spatial error) is only
first order, with residual `(θ - 1/2) Δt u_ttt + O(Δt² + Δx²)`. The book states second order for
both methods without the condition `θ = 1/2`; its experiments (Table 13.3) are consistent with
`θ = 1/2`. ★★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_45", "FiniteDifference.iteratedDeriv_two_sub_secondCentredDiff_eq"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, "The Leap-frog and Newmark methods are both second order accurate if Δt = Δx"'''

[[node]]
id = "isConvergent"
kind = "definition"
desc = '''Convergence (end of §13.8.1): a family of schemes `(Δt, Δx) ↦ Q` is convergent for the
datum `u₀` when `sup_{j, nΔt ≤ T} |u(x_j, t^n) - u_j^n| → 0` as `(Δt, Δx) → 0`, where `u^n = Q^n
(u₀(x_·))`: `FiniteDifference.Hyperbolic.IsConvergent a u₀ Q T`. ★'''
deps = ["FiniteDifference.Hyperbolic.IsConvergent"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.8.1, the definition of convergence'

[[node]]
id = "equation_13_47"
kind = "definition"
desc = '''The discrete norms (13.47): `‖v‖_{Δ,p} = (Δx ∑_j |v_j|^p)^{1/p}` for `p = 1, 2` and
`‖v‖_{Δ,∞} = sup_j |v_j|`, on grid functions `v : ℤ → ℝ` in `lp (fun _ : ℤ => ℝ) p`:
`FiniteDifference.discreteNorm p Δx v = Δx ^ (1/p) * ‖v‖` (with `Δx^0 = 1` for `p = ∞`). ★'''
deps = ["FiniteDifference.discreteNorm"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.47)'

[[node]]
id = "equation_13_46"
kind = "definition"
desc = '''Stability (13.46): a family of schemes `Q : ι → (E i →L[ℝ] E i)` on grids with steps `Δt
i`, `Δx i` is stable when for every `T > 0` there are `C_T` and `δ₀ > 0` such that `‖Q i ^ n‖ ≤ C_T`
whenever `Δt i, Δx i ∈ (0, δ₀]` and `n Δt i ≤ T`, i.e. `‖u^n‖_Δ ≤ C_T ‖u^0‖_Δ` (the discrete norm
is a constant multiple of the `ℓ^p` norm, so operator-norm stability is the same in either):
`FiniteDifference.IsStableFamily Δt Δx Q`. ★'''
deps = ["FiniteDifference.IsStableFamily", "QuarteroniSaccoSaleri.Chapter13.equation_13_47"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.46)'

[[node]]
id = "exercise_13_7"
kind = "theorem"
desc = '''Exercise 7: for the backward Euler/centred scheme (13.43) on `ℓ²(ℤ)`, `‖u^{n+1}‖_{Δ,2} ≤
‖u^n‖_{Δ,2}` for every `n`, and hence the scheme is unconditionally stable in `‖·‖_{Δ,2}` with `C_T
= 1`. Proof, as the hint: `‖u^{n+1}‖² = ⟪B u^{n+1}, u^{n+1}⟫ = ⟪u^n, u^{n+1}⟫ ≤ ‖u^n‖ ‖u^{n+1}‖`
because the centred difference is skew-adjoint (`∑_j (u_{j+1} - u_{j-1}) u_j = 0`, the telescoping
sum): `FiniteDifference.Hyperbolic.norm_backwardEulerCentred_apply_le`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_43", "QuarteroniSaccoSaleri.Chapter13.equation_13_46", "FiniteDifference.Hyperbolic.norm_backwardEulerCentred_apply_le"]
