[[node]]
id = "remark_13_4_leapFrog"
kind = "theorem"
desc = '''Remark 13.4, leap-frog: the leap-frog scheme (13.44) for the wave equation is stable in
`‖·‖_{Δ,2}` under `γλ < 1`. Written as the two-level system for `(u^{n+1}, u^n)` on the periodic
grid, its `2 × 2` amplification matrix on the `k`-th mode is `G_k = !![2c_k, -1; 1, 0]` with `c_k =
1 - 2(γλ)² sin²(φ_k/2)`, whose eigenvalues are the roots of `z² - 2c_k z + 1`; for `|c_k| < 1` they
are distinct of modulus one and `‖G_k^n‖` is bounded uniformly in `n` and `k`. The book writes
`Δt ≤ Δx/|γ|`: at `γλ = 1` the mode `φ_k = π` has a double root `z = -1` with a Jordan block,
`‖G_k^n‖ ~ n`, and (13.46) fails; the strict inequality is needed. ★★★

Blocked: not attempted for lack of time. The block-circulant reduction exists
(`FiniteDifference.periodicBlockScheme_pow_mulVec_fourierMode`); what is missing is the uniform
bound on the powers of a `2 × 2` matrix with two distinct unimodular eigenvalues, uniform in `k` —
an explicit diagonalization whose conditioning is controlled by `1 - (γλ)²`. Estimate: two days.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_44", "QuarteroniSaccoSaleri.Chapter13.equation_13_46", "FiniteDifference.periodicBlockScheme_pow_mulVec_fourierMode"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 13.4, the Leap-Frog method'

[[node]]
id = "remark_13_4_newmark"
kind = "theorem"
desc = '''Remark 13.4, Newmark: the Newmark scheme (13.45) is unconditionally stable when `2β ≥ θ
≥ 1/2` (cited from [Joh90]). On the `k`-th mode the pair `(u, Δt v)` is advanced by a `2 × 2`
matrix `G_k(β, θ, s)`, `s = (γλ)² · 4 sin²(φ_k/2)`, and the condition `2β ≥ θ ≥ 1/2` is exactly the
condition that the characteristic polynomial of `G_k` has both roots in the closed unit disc for
every `s ≥ 0` with a uniform bound on `‖G_k^n‖` (a Schur–Cohn computation on a quadratic with
real coefficients). ★★★

Blocked: not attempted for lack of time; needs the same uniform power bound as
`remark_13_4_leapFrog` plus the Schur–Cohn criterion for a real quadratic, which the project does
not have. Estimate: three days.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_45", "QuarteroniSaccoSaleri.Chapter13.equation_13_46", "FiniteDifference.periodicBlockScheme_pow_mulVec_fourierMode"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 13.4, the Newmark method'
