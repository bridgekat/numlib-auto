[[node]]
id = "equation_13_53"
kind = "theorem"
desc = '''(13.53), the discrete maximum principle: under CFL `0 ≤ λa ≤ 1`, the upwind scheme
satisfies `min(u_j^n, u_{j-1}^n) ≤ u_j^{n+1} ≤ max(u_j^n, u_{j-1}^n)`, hence `inf_l u_l^0 ≤ u_j^n ≤
sup_l u_l^0` for all `j, n` and `‖u^n‖_{Δ,∞} ≤ ‖u^0‖_{Δ,∞}` (for bounded `u^0`):
`Stencil.IsMonotone.iInf_le_apply`, `Stencil.IsMonotone.apply_le_iSup`, iterated. ★'''
