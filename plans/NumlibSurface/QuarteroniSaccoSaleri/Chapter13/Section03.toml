[[node]]
id = "definition_13_1"
kind = "definition"
desc = '''Definition 13.1: `λ` is an eigenvalue and `w ∈ V` an eigenvector of the bilinear form `a`
when `w ≠ 0` and `a(w, v) = λ ⟪w, v⟫_{L²}` for all `v ∈ V`: `Variational.IsFormEigenpair a λ w` on
`V = H¹₀(0, 1)` with the `L²` inner product. The following sentence of the book (a symmetric
coercive form has an unbounded sequence of positive eigenvalues whose eigenfunctions form a
basis of `V`) is the spectral theorem for compact self-adjoint resolvents and is not claimed
(it needs Rellich on the interval; only the finite-dimensional statement (13.22) is used). ★'''
deps = ["Variational.IsFormEigenpair"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Definition 13.1'

[[node]]
id = "equation_13_22"
kind = "theorem"
desc = '''(13.22) and its algebraic form: `(λ_h, w_h)` with `w_h = ∑ ξ_j φ_j ∈ V_h` is an
eigenpair of `heatForm ν` on `V_h` iff `A_fe ξ = λ_h M ξ`, `ξ ≠ 0`
(`Variational.isFormEigenpair_iff_gramMatrix_mulVec`); all eigenvalues are positive
(`Variational.IsFormEigenpair.pos_of_coercive`), and `V_h` has an `L²`-orthonormal basis of
eigenvectors (`Variational.exists_orthonormalBasis_isFormEigenpair`, the spectral theorem for
the symmetric positive operator `toOperator a` on `V_h`). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.definition_13_1", "QuarteroniSaccoSaleri.Chapter13.equation_13_14", "Variational.isFormEigenpair_iff_gramMatrix_mulVec", "Variational.exists_orthonormalBasis_isFormEigenpair"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.22)'

[[node]]
id = "pencil_hasEigenvalue_iff"
kind = "theorem"
desc = '''The eigenvalues of the form `heatForm ν` on the uniform-mesh `P₁` space, i.e. of the
pencil `(A_fe, M)` with `A_fe = (ν/h) tridiag(-1,2,-1)`, `M = (h/6) tridiag(1,4,1)`, `h = 1/n`, are
`λ_h^i = (6 ν / h²) (1 - cos θ_i) / (2 + cos θ_i)`, `θ_i = i π h`, `i = 1, …, n - 1`. Proof: both
matrices are diagonalized by the sine vectors `Matrix.sineVec`
(`Matrix.symmTridiagonalToeplitz_mulVec_sineVec`), with eigenvalues `(ν/h)(2 - 2cos θ_i)` and
`(h/6)(4 + 2 cos θ_i)`, so the sine vectors are the generalized eigenvectors with the quotient
eigenvalues, and they span. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.massMatrix", "QuarteroniSaccoSaleri.Chapter13.equation_13_22", "Matrix.symmTridiagonalToeplitz_mulVec_sineVec", "Matrix.sineOrthonormalBasis"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, the eigenvalues λ_h^i'

[[node]]
id = "pencil_maxEigenvalue_bounds"
kind = "theorem"
desc = '''The unnumbered inverse estimate of §13.3.1 (cited from [QV94] §6.3.2), on the uniform
mesh with `n ≥ 2`: `3 ν h⁻² ≤ λ_h^{N_h} ≤ 12 ν h⁻²` for the largest eigenvalue `λ_h^{N_h} = max_i
λ_h^i`. Proof: `g(θ) = (1 - cos θ)/(2 + cos θ)` is increasing on `[0, π]` and `≤ 2`, so `λ_h^{N_h}
= (6ν/h²) g(π - πh) ≤ 12 ν h⁻²`; and `g(π - πh) = (1 + cos πh)/(2 - cos πh) ≥ 1/2` for `h ≤ 1/2`.
The book prints `λ_h^{N_h} = c₂ h⁻²` for the upper bound; read `≤`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.pencil_hasEigenvalue_iff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, c₁h⁻² ≤ λ_h^{N_h} ≤ c₂h⁻²'

[[node]]
id = "thetaMethod_eigen_recursion"
kind = "theorem"
desc = '''The θ-method in the eigenbasis (the display before the stability conclusion): if `u_h^k =
∑_i u_i^k w_h^i` in an `L²`-orthonormal eigenbasis `(λ_h^i, w_h^i)` of `a` on `V_h`, and `u_h^{k+1}`
is the θ-step of `u_h^k` with `F = 0`, then `u_i^{k+1} = u_i^k (1 - (1-θ) λ_h^i Δt) / (1 + θ λ_h^i
Δt)` for every `i` (for `θ ≥ 0`, `Δt > 0`, `λ_h^i > 0` the denominator is positive).
`Variational.IsThetaStep.inner_eq_of_isFormEigenpair`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_17", "QuarteroniSaccoSaleri.Chapter13.equation_13_22", "Variational.IsThetaStep.inner_eq_of_isFormEigenpair"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, u_i^{k+1} = u_i^k [1 - (1-θ)λΔt]/[1 + θλΔt]'''

[[node]]
id = "thetaMethod_stable_of_half_le"
kind = "theorem"
desc = '''Unconditional stability for `1/2 ≤ θ ≤ 1`: for every `Δt > 0` and every θ-step `u_h^{k+1}`
of `u_h^k` with `F = 0`, `‖u_h^{k+1}‖_{L²} ≤ ‖u_h^k‖_{L²}`, hence `‖u_h^n‖ ≤ ‖u_{0h}‖` for all `n`.
`Variational.IsThetaStep.norm_le_of_half_le`, whose proof is the energy identity `½(‖u'‖² - ‖u‖²)
= -Δt a(w,w) - (θ - ½)‖u' - u‖²` with `w = θu' + (1-θ)u`, valid for any positive form (no symmetry
needed; the book's eigenbasis proof assumes symmetry). ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_17", "Variational.IsThetaStep.norm_le_of_half_le"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, "if θ ≥ 1/2 the θ-method is unconditionally stable"'''

[[node]]
id = "thetaMethod_stable_iff_of_lt_half"
kind = "theorem"
desc = '''Conditional stability for `0 ≤ θ < 1/2`, for the symmetric form: with `λ_h^{N_h}` the
largest eigenvalue of `a` on `V_h`, the θ-step with `F = 0` satisfies `‖u_h^{k+1}‖ ≤ ‖u_h^k‖` for
every `u_h^k ∈ V_h` iff `Δt ≤ 2 / ((1 - 2θ) λ_h^{N_h})`. Proof: in the eigenbasis the step multiplies
the `i`-th coefficient by `r_i = (1 - (1-θ)λ_iΔt)/(1 + θλ_iΔt)`, and `|r_i| ≤ 1 ↔ (1-2θ)λ_iΔt ≤ 2`;
the norm of the step is `max_i |r_i|`, attained at `λ_{N_h}`. The book derives `< 1` and `Δt <
2/(…)` and concludes with `≤`; the stability inequality is the non-strict one.
`Variational.IsThetaStep.forall_norm_le_iff_of_lt_half`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.thetaMethod_eigen_recursion", "Variational.IsThetaStep.forall_norm_le_iff_of_lt_half"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, Δt ≤ 2/((1-2θ)λ_h^{N_h})'

[[node]]
id = "equation_13_23"
kind = "theorem"
desc = '''(13.23): for `0 ≤ θ < 1/2` on the uniform `P₁` mesh, the θ-method is stable (`‖u_h^{k+1}‖
≤ ‖u_h^k‖` for all data) whenever `Δt ≤ C₁(θ) h²` with `C₁(θ) = 1 / (6 ν (1 - 2θ))`, from
`thetaMethod_stable_iff_of_lt_half` and `λ_h^{N_h} ≤ 12 ν h⁻²`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.thetaMethod_stable_iff_of_lt_half", "QuarteroniSaccoSaleri.Chapter13.pencil_maxEigenvalue_bounds"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.23)'

[[node]]
id = "equation_13_24"
kind = "theorem"
desc = '''(13.24): for a pseudo-spectral Galerkin discretization of degree `N`, the θ-method with
`0 ≤ θ < 1/2` is stable only if `Δt ≤ C₂(θ) N⁻⁴`, because the largest eigenvalue of the spectral
stiffness matrix grows like `N⁴`. Not formalized: the plan has no spectral (Legendre/Chebyshev
Galerkin) stiffness matrix, and the `O(N⁴)` bound on its largest eigenvalue is a polynomial
inverse inequality (Markov's inequality in `L²` form, `‖p'‖ ≤ C N² ‖p‖`) that the book states
without proof, citing [QV94].'''
deps = ["QuarteroniSaccoSaleri.Chapter13.thetaMethod_stable_iff_of_lt_half"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.24)'

[[node]]
id = "thetaMethod_convergence"
kind = "theorem"
desc = '''The convergence estimates after (13.24): `‖u(t^k) - u_h^k‖_{L²} ≤ C(u₀, f, u)(Δt^{p(θ)} +
h^{r+1})` with `p(θ) = 1` for `θ ≠ 1/2`, `p(1/2) = 2`, and for `f = 0`, `θ ∈ {1, 1/2}`, the
improved `‖u(t^k) - u_h^k‖ ≤ C[(h/√t^k)^{r+1} + (Δt/t^k)^{p(θ)}] ‖u₀‖`. Not formalized: the book
quotes [QV94] pp. 394–395; the proofs need the `L²` projection error `O(h^{r+1})` in `H²`-type
norms of the exact solution and parabolic regularity (smoothing estimates `‖u_t(t)‖ ≤ C ‖u₀‖ / t`)
for the improved form, i.e. the classical theory of the heat equation that is a known blocker.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_17", "QuarteroniSaccoSaleri.Chapter13.equation_13_21"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, the convergence result ‖u(t^k) − u_h^k‖ ≤ C(Δt^{p(θ)} + h^{r+1})'''
