[[node]]
id = "equation_13_21"
kind = "theorem"
desc = '''(13.21), with source: for the backward Euler sequence with `F^k(v) = ⟪f^k, v⟫`, and `γ =
ν / C_P²` the `L²`-coercivity constant of `heatForm ν` (Poincaré), `‖u_h^n‖² + ν Δt ∑_{k<n}
‖∂_x u_h^{k+1}‖² ≤ C (‖u_{0h}‖² + ∑_{k=1}^n Δt ‖f^k‖²)` with `C = max 1 γ⁻¹`, independent of `h`
and `Δt`. From `Variational.IsThetaStep.norm_sq_add_sum_le_of_coercive`. The book's factor `2ν`
on the derivative sum becomes `ν` because the source is absorbed with Young's inequality against
