namespace = "QuarteroniSaccoSaleri.Chapter13"
desc = '''
§13.3, the finite element approximation of the heat equation and §13.3.1, the stability analysis
of the θ-method. The semi-discrete Galerkin problem (13.13) is a linear ODE on the
finite-dimensional trial space `V_h` with the `L²` inner product; its energy estimate, its matrix
form (13.14) with the mass matrix `M`, the θ-method (13.16)–(13.17), the backward Euler energy
inequalities (13.19)–(13.21), Definition 13.1, the discrete eigenproblem (13.22) and the θ-method
stability dichotomy with (13.23) are all specializations of `Numlib/Variational/Evolution`
(form level) and `Numlib/FiniteDifference/Parabolic` (matrix level). The weak problem (13.12) on
`V = H¹₀(0, 1)` is stated as a definition through chapter 12's `Analysis/Sobolev/Interval`; its
well-posedness is not claimed (Bochner-space theory).

The finite element space is chapter 12's (12.57) with `k = 1`, its hat basis `φ_j` and the
stiffness matrix `A_fe = (ν / h) tridiag(-1, 2, -1)` on the uniform mesh `h = 1 / n`; the mass
matrix `M = (h / 6) tridiag(1, 4, 1)` is new here. Both are `Matrix.symmTridiagonalToeplitz`, so
the generalized eigenvalues of the pencil `(A_fe, M)` are explicit, `λ_h^i = (6ν / h²)(1 - cos
θ_i) / (2 + cos θ_i)`, `θ_i = iπh`, and the unnumbered inverse estimate `c₁ h⁻² ≤ λ_h^{N_h} ≤ c₂
h⁻²` (cited from [QV94]) is proved outright with `c₁ = 3ν`, `c₂ = 12ν`
(`pencil_maxEigenvalue_bounds`). The pseudo-spectral estimate (13.24) is out of scope (no spectral
stiffness matrix in the plan) and the convergence estimates after (13.23) are not formalized.

Erratum: the hint of Exercise 2 gives `m_ij = (h/6)·{1/2 (i ≠ j), 1 (i = j)}`; the exact integrals
are `∫φ_i² = 2h/3` and `∫φ_iφ_{i±1} = h/6`, i.e. `M = (h/6) tridiag(1, 4, 1)`, which is what Program
100 assembles (`2h/(3k)` on the diagonal, `h/(6k)` off it). The nodes use the correct values.
'''

[[node]]
id = "heatForm"
kind = "definition"
desc = '''The bilinear form of (13.12), `a(u, v) = ν ∫₀¹ u' v'`, on `H¹₀(0, 1)` as a bounded form
`SesqForm ℝ (H¹₀(0,1))`, through chapter 12's `Analysis/Sobolev/Interval` (weak derivative in
`L²`). This is (12.44) with `α = ν`, `β = γ = 0`; if chapter 12 provides the form under a name
(`QuarteroniSaccoSaleri.Chapter12.diffusionForm` or similar), this node is that form at those
coefficients. ★'''
deps = ["SobolevIntervalZero"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.12), the form a(·,·)'

[[node]]
id = "equation_13_12"
kind = "definition"
desc = '''The weak heat equation (13.12): `u : ℝ → H¹₀(0, 1)` solves it on `[0, T]` with data
`f : ℝ → L²(0, 1)`, `u₀` when `u 0 = u₀` and, for `t ∈ [0, T]`, `u` has a derivative `u' t` in
`L²(0,1)` within `Icc 0 T` (as a curve in `L²`, `HasDerivWithinAt (fun t => (u t : L²)) (u' t)
(Icc 0 T) t`) with `⟪u' t, v⟫_{L²} + heatForm ν (u t) v = ⟪f t, v⟫_{L²}` for all `v ∈ H¹₀(0, 1)`.
Stated as `Variational.IsSemidiscreteGalerkin` with `K = H¹₀(0,1)` viewed inside `L²`; only the
definition is claimed — existence and uniqueness of weak solutions (Bochner-space theory,
Lions' theorem) are not formalized. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.heatForm", "Variational.IsSemidiscreteGalerkin"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.12)'

[[node]]
id = "equation_13_13"
kind = "definition"
desc = '''The semi-discrete Galerkin problem (13.13): for a finite-dimensional subspace `V_h ≤
H¹₀(0, 1)` and `u_{0h} ∈ V_h`, `u_h : ℝ → V_h` satisfies `⟪u_h' t, v_h⟫_{L²} + heatForm ν (u_h t)
v_h = ⟪f t, v_h⟫_{L²}` for all `v_h ∈ V_h`, `t ∈ [0, T]`, and `u_h 0 = u_{0h}`:
`Variational.IsSemidiscreteGalerkin (heatForm ν restricted to V_h) (t ↦ ⟪f t, ·⟫) u_{0h} T u_h`
on the inner product space `V_h` with the `L²` inner product. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.heatForm", "Variational.IsSemidiscreteGalerkin"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.13)'

[[node]]
id = "equation_13_13_energy"
kind = "theorem"
desc = '''The a priori estimate for the semi-discrete solution (the display after (13.13)):
`E_h(t) ≤ e^{-γt} E_h(0) + γ⁻¹ ∫₀ᵗ e^{γ(s-t)} F(s) ds` with `E_h(t) = ‖u_h t‖²_{L²}`, `F(s) = ‖f
s‖²_{L²}`, `γ = ν / C_P²`, where `C_P` is the Poincaré constant of (12.16) on `(0, 1)`. Proof:
`Variational.IsSemidiscreteGalerkin.norm_sq_le_exp` with the `L²`-coercivity `γ ‖v_h‖²_{L²} ≤
heatForm ν v_h v_h` from Poincaré, and `|⟪f t, v⟫| ≤ ‖f t‖ ‖v‖`. ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_13", "Variational.IsSemidiscreteGalerkin.norm_sq_le_exp", "SobolevIntervalZero.norm_deriv_zero_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3, the estimate for E_h(t)'

[[node]]
id = "massMatrix"
kind = "definition"
desc = '''The mass matrix of the piecewise linear space (12.57) on the uniform mesh `h = 1/n`,
`M_{ij} = ∫₀¹ φ_j φ_i`: `massMatrix n = (1 / (6 n)) • Matrix.symmTridiagonalToeplitz (n - 1) 1 4`,
i.e. `2h/3` on the diagonal and `h/6` on the two neighbouring diagonals. ★'''
deps = ["Matrix.symmTridiagonalToeplitz"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, equation (13.14), the mass matrix M'

[[node]]
id = "massMatrix_apply_eq_integral"
kind = "theorem"
desc = '''`massMatrix n i j = ∫ x in (0:ℝ)..1, φ_j x * φ_i x` for the hat functions `φ_i` of the
uniform mesh (chapter 12's basis of (12.57) with `k = 1`): `∫ φ_i² = 2h/3`, `∫ φ_i φ_{i+1} = h/6`,
`∫ φ_i φ_j = 0` for `|i - j| ≥ 2`. This corrects the hint of Exercise 2 (see the group
description). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.massMatrix", "FiniteElement.hatFunction"]
