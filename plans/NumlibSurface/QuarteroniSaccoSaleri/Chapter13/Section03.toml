[[node]]
id = "equation_13_24_lower"
kind = "theorem"
desc = '''The lower half of the eigenvalue estimate behind (13.24), which makes the stability condition
*necessary*: there is a `c > 0` such that for every `N ≥ 1` the pseudo-spectral form
`SpectralSpace.spectralForm N x w ν` on `ℙ_N^0` with the Gauss–Lobatto inner product has an
eigenvalue `λ ≥ c ν N⁴` (`∃ c > 0, ∀ N ≥ 1, ∀ x w, [IsLegendreLobatto N x w] → ∃ lam v,
definition_13_1 (SpectralSpace.spectralForm N x w ν) lam v ∧ c * ν * N ^ 4 ≤ lam`). With
`thetaMethod_stable_iff_of_lt_half` it gives "stable only if `Δt ≤ C₂(θ) N⁻⁴`", the reading of
(13.24) the book states; the sufficiency half is `equation_13_24`.

Blocked (2026-09-20, agent qss1): the upper half is proved. The lower half needs a test polynomial
`p ∈ ℙ_N^0` (vanishing at `±1`) with `∫ (p')² ≥ c N⁴ (p, p)_N`, i.e. a boundary layer of width
`N⁻²`. The `L²` Markov sharpness test `L_N'` of `Numlib/Approximation/MarkovInequality`
(`Polynomial.integral_derivative_derivative_legendre_sq_ge`) does not vanish at `±1`, and every
smooth correction (`L_N' - L_N'(±1)`, `(1 - x²) L_{N-2}''`, `(1 - x²) K_{N-2}(·, 1)` with the
Christoffel–Darboux kernel) was checked to give only `N²` or `N³`: the `L²` mass of the correction
dominates. The natural test function is the Lagrange basis polynomial `l_1` of the first interior
Gauss–Lobatto node, whose Rayleigh quotient is `≥ 1/(1 + x_1)²`, which needs the node location
`1 + x_1 ≤ C N⁻²` — a Sturm comparison for the Legendre equation in the variable `θ = arccos x`
(`u'' + ((N + ½)² + 1/(4 sin² θ)) u = 0` has zeros at most `π/(N + ½)` apart), not in Mathlib nor
in `Numlib/Approximation/OrthogonalPolynomial/*` (`Polynomial.inv_le_eval_legendre_sq` bounds the
value at the nodes, not their position). Estimate: a Sturm comparison theorem for
`u'' + q u = 0` (~300 lines) plus the transformation of the Legendre equation (~200) and the
Rayleigh-quotient computation for `l_1` through `Quadrature.legendreLobattoWeight_eq` (~150).'''
deps = ["QuarteroniSaccoSaleri.Chapter13.SpectralSpace.spectralForm_eigenvalue_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, "the largest eigenvalue of the spectral stiffness matrix grows like O(N⁴)"'

[[node]]
id = "thetaMethod_convergence"
kind = "theorem"
desc = '''The convergence estimates after (13.24): `‖u(t^k) - u_h^k‖_{L²} ≤ C(u₀, f, u)(Δt^{p(θ)} +
h^{r+1})` with `p(θ) = 1` for `θ ≠ 1/2`, `p(1/2) = 2`, and for `f = 0`, `θ ∈ {1, 1/2}`, the
improved `‖u(t^k) - u_h^k‖ ≤ C[(h/√t^k)^{r+1} + (Δt/t^k)^{p(θ)}] ‖u₀‖`. The book quotes both from
[QV94] pp. 394–395 and proves neither.

Blocked: re-read 2026-09-20 (agent qss1); the verdict stands. Checked in `Numlib/`: the two
stability ingredients are proved ((13.21) is `equation_13_21`, the θ-step `equation_13_17`), the
`L²` projection error for `r = 1` is `Numlib/Approximation/PiecewiseLinearL2` and
`sobolevSeminorm_sub_piecewisePolyInterp_le` (`Numlib/Approximation/SobolevInterpolation`) gives the
degree-`r` interpolation estimate in broken form, and the Brezis round (2026-09-17–20) added the
classical heat equation on the Dirichlet Laplacian (`Numlib/Analysis/PDE/Heat`, `PDE/Heat/Classical`)
and the semigroup smoothing estimate `‖A S(t) u₀‖ ≤ ‖u₀‖/t` (Brezis Theorem 7.7, in
`Numlib/Analysis/PDE/Heat`),
so ingredient (iii) — the parabolic smoothing bounds for `f = 0` — now has a semigroup-level
source to specialize. Still missing: (i) the time regularity `u_tt ∈ L²(0,1)` uniformly in `t`
(`u_ttt` for `θ = 1/2`) of the *weak* solution of (13.12), i.e. a Bochner-space vocabulary
`L²(0,T;V)`/`H¹(0,T;H⁻¹)` and Lions' theorem, which nothing in `Numlib/Analysis/PDE/*` has (the
Brezis heat module works with the semigroup on `L²(Ω)` and classical `C¹`-in-time solutions);
(ii) the time-truncation error of the θ-method against the semi-discrete problem (a Taylor
expansion of `u_h` in `t` with the `L²`-in-space remainder); (iii) the bridge from
`SobolevInterval`'s `H^{r+1}(0,1)` norm to the broken seminorm the interpolation estimate uses. A
faithful statement must quantify one constant `C(u₀, f, u)` over all `h`, `Δt`, so no weakened
form is available. Estimate: a Bochner-space module (several weeks) plus (ii) and (iii)
(~600 lines).'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_17", "QuarteroniSaccoSaleri.Chapter13.equation_13_21"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.3.1, the convergence result ‖u(t^k) − u_h^k‖ ≤ C(Δt^{p(θ)} + h^{r+1})'''

