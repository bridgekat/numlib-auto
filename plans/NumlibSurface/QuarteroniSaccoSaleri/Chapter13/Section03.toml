[[node]]
id = "remark_13_1"
kind = "theorem"
desc = '''Remark 13.1 and Exercise 4: for any bilinear form `a` on `V_h` that is coercive with
constant `α` in the `L²` norm (`α ‖v‖² ≤ a v v`), the backward Euler sequence satisfies `‖u_h^n‖²
+ 2 Δt ∑_{k<n} a(u_h^{k+1}, u_h^{k+1}) ≤ ‖u_{0h}‖²` (so (13.20) with `ν ‖∂_x ·‖²` replaced by
`a(·,·)`, hence with `α ‖·‖²_{H¹₀}`), and the (13.21) analogue with `C = max 1 α⁻¹`. Continuity of
`a` is not needed. These are exactly the backbone statements
`Variational.IsThetaStep.norm_sq_add_sum_le(_of_coercive)`, which assume only positivity or
coercivity. ★'''
deps = ["Variational.IsThetaStep.norm_sq_add_sum_le", "Variational.IsThetaStep.norm_sq_add_sum_le_of_coercive"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 13.1 and Exercise 13.4'

