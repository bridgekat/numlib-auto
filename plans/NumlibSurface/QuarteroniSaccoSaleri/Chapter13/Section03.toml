ξ`. From `FiniteDifference.isSemidiscreteGalerkin_iff_isSemidiscrete`. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_13", "QuarteroniSaccoSaleri.Chapter13.massMatrix", "FiniteDifference.isSemidiscreteGalerkin_iff_isSemidiscrete", "FiniteElement.stiffnessMatrix"]
