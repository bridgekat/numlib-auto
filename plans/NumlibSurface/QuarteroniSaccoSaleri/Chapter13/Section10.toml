[[node]]
id = "cG_convergence"
kind = "theorem"
desc = '''The continuous Galerkin error estimate quoted from [QV94] §14.3.1: for `r ≥ 1`,
`max_{t ≤ T} ‖u(t) - u_h(t)‖_{L²} + (∫₀ᵗ a |u(α,τ) - u_h(α,τ)|² dτ)^{1/2} = O(‖u₀ - u_{0,h}‖_{L²} +
h^r)` for a smooth solution `u`. Not formalized: the proof combines the stability estimate with
the interpolation error of degree-`r` piecewise polynomials in `H¹` for the *time-dependent*
exact solution and an error equation with the `L²` projection; the piecewise polynomial
interpolation estimates in Sobolev norms are chapter 8's Theorem 8.3
(`Approximation/SobolevInterpolation`, open) and the argument needs them for every `r`, plus
regularity of `u` that the book only assumes. The book states it without proof.

Blocked: the stability half is now proved (`equation_13_66`, `equation_13_67`), and the error
equation `⟪∂ₜ(u - u_h), v_h⟫ + b_t(u - u_h, v_h) = 0` for `v_h ∈ V_h^{in}` would follow from
`equation_13_64` once the exact solution is paired against the discrete space. **Correction
(2026-09-17):** the degree-`r` interpolation estimate is *not* missing —
`sobolevSeminorm_sub_piecewisePolyInterp_le` in `Approximation/SobolevInterpolation` gives
`∑_j ∫_{I_j} |(v - Π_h v)^{(m)}|² ≤ h^{2(r+1-m)} |v|²_{H^{r+1}}` for every degree `r` and every
`m ≤ r`, in broken form, and the `P_1`/`P_2` element layers of `Variational/FiniteElementInterval`
show how it is read on an element space. What is missing is (ii) a projection of the *time-dependent* exact solution
into `V_h^{in}` commuting with `∂ₜ`, which needs `u(·, t) ∈ H^{r+1}(α, β)` uniformly in `t` and a
Bochner-space argument the project has no vocabulary for; (iii) an explicit-constant form of the
`O(·)` statement. A multi-day task resting on an open chapter-8 group; the book quotes the result
from [QV94] without proof, so it is left open.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_65", "QuarteroniSaccoSaleri.Chapter13.equation_13_66"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.10.1, the error estimate for continuous finite elements of degree r'''

[[node]]
id = "dG_convergence"
kind = "theorem"
desc = '''The discontinuous Galerkin error estimate quoted from [QV94] §14.3.3: for `r ≥ 0`,
`max_{t ≤ T} ‖u - u_h‖_{L²} + (∫₀ᵀ ‖u - u_h‖²_{L²} + ∑_j a(x_j) [u - u_h]_j² dt)^{1/2} = O(‖u₀ -
u_{0,h}‖ + h^{r+1/2})` (the printed left side has a garbled `∫_{j=0}^{T_{n-1}}`; read `∫₀ᵀ
∑_{j=0}^{n-1}`). Not formalized: as for `cG_convergence`, with in addition the trace inequality
on each element that produces the half power `h^{r+1/2}`.

Blocked: everything `cG_convergence` is blocked on (see its correction: the interpolation
estimate exists for every degree; the Bochner-space projection is the gap), plus the elementwise
trace inequality
`|v(x_j)|² ≤ C (h_j⁻¹ ‖v‖²_{L²(I_j)} + h_j ‖v'‖²_{L²(I_j)})` for polynomials on a panel, which
`Approximation/BrokenPolynomial` does not have (it has only the inverse inequality
`inverseInequality_linear`, for `r = 1`). That trace inequality is a self-contained and
worthwhile addition to `BrokenPolynomial` for general `r`, but on its own it does not close this
node. The book quotes the result from [QV94] without proof, so it is left open.'''
deps = ["QuarteroniSaccoSaleri.Chapter13.equation_13_68", "QuarteroniSaccoSaleri.Chapter13.equation_13_69"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §13.10.1, the convergence estimate for discontinuous finite elements of degree r'''

