[[node]]
id = "machineOp"
kind = "definition"
desc = '''`machineOp (s : FloatingPoint.System) (f : ℝ → ℝ → ℝ) (x y : ℝ) : ℝ := s.round (f (s.round x)
(s.round y))`, the machine operation `x ∘ y = fl(fl(x) ∘ fl(y))` of §2.5.6, with `machineOp_eq :
