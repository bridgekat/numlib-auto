namespace = "QuarteroniSaccoSaleri.Chapter02"
desc = '''
Quarteroni–Sacco–Saleri §2.5: machine representation of numbers — the positional system
(§2.5.1), the floating-point number system `𝔽(β, t, L, U)` (§2.5.2), its distribution (§2.5.3),
the IEEE parameters (§2.5.4), rounding and Property 2.1 (§2.5.5), and the machine operations
(§2.5.6).

Everything specializes `Numlib/FloatingPoint/System`. The book's `𝔽` is defined by digit strings
`(-1)^s β^e ∑_{i=1}^t a_i β^{-i}`; the surface restates it in that form (`floatingPointNumbers`) and
proves it equal to the backbone's integer-mantissa form `FloatingPoint.System.numbers`. The
rounding (2.32) is restated digit-wise, for even `β` as the book assumes, and identified with
`FloatingPoint.System.round`. Property 2.1 is stated with the book's range hypothesis, although the
backbone bound needs none. Example 2.11 is decided over `ℚ`. The unnumbered facts the text asserts
— cardinality of `𝔽`, the smallest de-normalized number, the spacing bounds, `ε_M` as the gap
above `1`, commutativity and the failure of associativity of `⊕` — are nodes under descriptive
names.

Skipped: Example 2.10 (a numeral written in two bases), Remark 2.3 (MATLAB `eps`), Remark 2.4
(the IEC 559 closed arithmetic, NaN, Table 2.3), Tables 2.1–2.2, the flop counts and the
round-digit hardware discussion of §2.5.6.
'''

[[node]]
id = "positionalDensity"
kind = "theorem"
desc = '''**§2.5.1, finite positional expansions are dense**: for `2 ≤ β`, every `x : ℝ` and `ε > 0`, `∃
(m : ℤ) (k : ℕ), |m * (β : ℝ) ^ (-(k : ℤ)) - x| < ε` — "any real number can be approximated by
numbers having a finite representation". `FloatingPoint.exists_int_mul_zpow_sub_abs_lt` over `ℝ`.
★'''
deps = ["FloatingPoint.exists_int_mul_zpow_sub_abs_lt"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.1, the property after Example 2.10'

[[node]]
id = "floatingPointNumbers"
kind = "definition"
desc = '''`floatingPointNumbers (β t : ℕ) (L U : ℤ) : Set ℝ := {0} ∪ {x | ∃ (s : Bool) (e : ℤ) (a : Fin t →
ℕ), (∀ i, a i ≤ β - 1) ∧ a ⟨0, _⟩ ≠ 0 ∧ L ≤ e ∧ e ≤ U ∧ x = (-1) ^ s.toNat * β ^ e * ∑ i, a i * β ^
(-(i + 1 : ℤ))}` (for `t ≥ 1`): the book's `𝔽(β, t, L, U)` as digit strings, with the
normalization `a₁ ≠ 0`. ★'''
deps = []
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.2, the display defining 𝔽(β, t, L, U)'

[[node]]
id = "floatingPointNumbers_eq"
kind = "theorem"
desc = '''For `s : FloatingPoint.System`, `floatingPointNumbers s.β s.t s.L s.U = s.numbers ℝ`: the digit
form equals the integer-mantissa form `± m β^(e - t)`, `β^(t-1) ≤ m ≤ β^t - 1`. The mantissa is
`m = ∑ a_i β^(t - i)` (`Nat.ofDigits` of the reversed digit list), and every `m` in that range has
a unique such digit expansion of length `t` with a nonzero leading digit (`Nat.digits_len`,
`Nat.ofDigits_digits`, `Nat.digits_lt_base`, `Nat.getLast_digit_ne_zero`). ★★'''
deps = ["QuarteroniSaccoSaleri.Chapter02.floatingPointNumbers", "FloatingPoint.System.numbers"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.2'

[[node]]
id = "equation_2_30"
kind = "theorem"
desc = '''**(2.30)**: for `x ∈ s.numbers ℝ`, `x ≠ 0`, `s.xmin ℝ ≤ |x| ∧ |x| ≤ s.xmax ℝ` with `x_min =
β^(L-1)`, `x_max = β^U (1 - β^(-t))`. `FloatingPoint.System.xmin_le_abs`,
`FloatingPoint.System.abs_le_xmax`. ★'''
deps = ["FloatingPoint.System.xmin_le_abs", "FloatingPoint.System.abs_le_xmax"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (2.30)'

[[node]]
id = "cardFloatingPoint"
kind = "theorem"
desc = '''**§2.5.2, the cardinality of `𝔽`**: `(Set.ncard (s.numbers ℝ) : ℤ) = 2 (β - 1) β^(t-1) (U - L +
1) + 1`. `FloatingPoint.System.card_finset` with `coe_finset` and `Set.ncard_coe_finset`. ★'''
deps = ["FloatingPoint.System.card_finset", "FloatingPoint.System.coe_finset"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.2, the display for card 𝔽'

[[node]]
id = "denormalizedMin"
kind = "theorem"
desc = '''**§2.5.2, the smallest de-normalized number**: `IsLeast {x ∈ s.denormalized ℝ | 0 < x} ((β : ℝ) ^
(s.L - s.t))`, and every de-normalized number lies in `(-β^(L-1), β^(L-1)) = (-x_min, x_min)`.
Directly from `FloatingPoint.System.denormalized`: the mantissas are `1 ≤ m ≤ β^(t-1) - 1` at the
exponent `L`. ★'''
deps = ["FloatingPoint.System.denormalized", "FloatingPoint.System.xmin"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.2, the paragraph on 𝔽_D'

