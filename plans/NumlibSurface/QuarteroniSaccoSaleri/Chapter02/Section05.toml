deps = ["FloatingPoint.System.op"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.6, the display defining x ∘ y'

[[node]]
id = "equation_2_36"
kind = "theorem"
desc = '''**(2.36)**: for `x, y ∈ s.numbers ℝ` and each of `f ∈ {(·+·), (·-·), (·*·), (·/·)}`, `∃ δ : ℝ, |δ| ≤
s.unitRoundoff ℝ ∧ s.op f x y = f x y * (1 + δ)` — the machine result is the exact result up to a
relative error `u`. `FloatingPoint.System.exists_op_eq_mul_one_add`. The book says this "will require
an additional assumption … the round digit" for subtraction; in this idealized arithmetic the exact
difference is rounded, so the assumption is built in. ★'''
deps = ["QuarteroniSaccoSaleri.Chapter02.machineOp", "FloatingPoint.System.exists_op_eq_mul_one_add"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (2.36)'

[[node]]
id = "machineOp_comm"
kind = "theorem"
desc = '''**§2.5.6, commutativity is preserved**: `s.add x y = s.add y x` and `s.mul x y = s.mul y x`.
`FloatingPoint.System.add_comm`. ★'''
deps = ["FloatingPoint.System.add_comm"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.6, the paragraph on properties preserved and lost'''

[[node]]
id = "machineAdd_not_assoc"
kind = "theorem"
desc = '''**§2.5.6, associativity is lost**: in `𝔽(10, 2, -1, 2)` over `ℚ`, with `x = 1`, `y = z = 4/100`
(all three in `𝔽`), `s.add (s.add x y) z = 1` while `s.add x (s.add y z) = 11/10`, so `s.add (s.add x
y) z ≠ s.add x (s.add y z)`: `fl(1.04) = 1.0`, `fl(1.0 + 0.04) = 1.0`, but `fl(0.08) = 0.08` and
`fl(1.08) = 1.1`. Computation with `FloatingPoint.System.round` on `ℚ`: `Int.log 10` of the operands
(`Int.log` is defined through `Nat.log`/`Nat.clog` and evaluates by `norm_num`/`decide` on
concrete rationals) and `round` of the concrete mantissas `10.4 ↦ 10`, `10.8 ↦ 11`. ★★'''
deps = ["FloatingPoint.System.op", "FloatingPoint.System.round"]
source = '''Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.6, the display x ⊕ (y ⊕ z) ≠ (x ⊕ y) ⊕ z'''
