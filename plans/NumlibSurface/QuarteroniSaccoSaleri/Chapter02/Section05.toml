[[node]]
id = "spacing"
kind = "theorem"
desc = '''**§2.5.3, the distribution of the floating-point numbers**: for `L ≤ e ≤ U`, the numbers of `𝔽`
in `[β^(e-1), β^e)` are `m β^(e-t)`, `β^(t-1) ≤ m ≤ β^t - 1`, equally spaced with distance `β^(e -
t)` (`FloatingPoint.System.numbers_inter_Ico`); and for `x ≠ 0` the spacing `ulp x = β^(exponent x -
t)` near `x` satisfies `β⁻¹ ε_M |x| < ulp x ≤ ε_M |x|` (`FloatingPoint.System.ulp_bounds`), the book's
"at least `β⁻¹ ε_M |x|` and at most `ε_M |x|`". Stated in the mantissa convention (2.29), `x = 0.a₁…
× β^e`, in which the binade of exponent `e` is `[β^(e-1), β^e)`; the book's sentence "having
fixed an interval of the form `[β^e, β^(e+1)]` … distance `β^(e-t)`" uses the other convention (see
the report). ★'''
deps = ["FloatingPoint.System.numbers_inter_Ico", "FloatingPoint.System.ulp_bounds"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.3'

[[node]]
id = "equation_2_31"
kind = "theorem"
desc = '''**(2.31)**: for `x = σ m β^(e - t) ∈ 𝔽` with `β^(t-1) ≤ m ≤ β^t - 1`, `L ≤ e ≤ U`, the relative
distance to the next number is `ulp x / |x| = 1 / m` — it depends only on the mantissa, decreasing
from `β^(1-t)` at `m = β^(t-1)` across each binade (wobbling precision).
`FloatingPoint.System.ulp_div_eq_inv_mantissa`. ★'''
deps = ["FloatingPoint.System.ulp_div_eq_inv_mantissa"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (2.31)'

[[node]]
id = "machineEps_isLeast"
kind = "theorem"
desc = '''**§2.5.3, the machine epsilon**: if `L ≤ 1 ≤ U` then `IsLeast {δ : ℝ | 0 < δ ∧ 1 + δ ∈ s.numbers ℝ}
(s.machineEps ℝ)` with `ε_M = β^(1-t)`: "the distance between the number `1` and the nearest
floating-point number [above it], and therefore the smallest number of `𝔽` such that `1 + ε_M > 1`
[in `𝔽`]". `FloatingPoint.System.isLeast_machineEps`. ★'''
deps = ["FloatingPoint.System.isLeast_machineEps"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.3'

[[node]]
id = "ieeeUnitRoundoff"
kind = "theorem"
desc = '''**§2.5.4, the IEC 559 basic formats**: `FloatingPoint.System.ieeeSingle = ⟨2, 24, -125, 128, …⟩`,
`FloatingPoint.System.ieeeDouble = ⟨2, 53, -1021, 1024, …⟩`, with `ieeeSingle.unitRoundoff ℝ = 2 ^ (-24
: ℤ) ∧ ieeeDouble.unitRoundoff ℝ = 2 ^ (-53 : ℤ)`. `FloatingPoint.System.ieeeDouble_unitRoundoff`. ★'''
deps = ["FloatingPoint.System.ieeeSingle", "FloatingPoint.System.ieeeDouble", "FloatingPoint.System.ieeeDouble_unitRoundoff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.4'

[[node]]
id = "equation_2_32"
kind = "theorem"
desc = '''**(2.32), the rounding as a digit rule**: for even `β` (the book's standing assumption in
§2.5.1) and `x ≠ 0` with exponent `e = s.exponent x`, mantissa `μ = |x| β^(t - e)` and next digit
`a_{t+1} = ⌊μ β⌋ % β` (as a natural number), `s.round x = sign x * (⌊μ⌋ + if β / 2 ≤ a_{t+1} then 1
else 0) * β^(e - t)`: the book's "`ã_t = a_t` if `a_{t+1} < β/2`, `a_t + 1` if `a_{t+1} ≥ β/2`". For
even `β`, `a_{t+1} ≥ β/2 ⟺ fract μ ≥ 1/2 ⟺ round μ = ⌊μ⌋ + 1` (`round_eq`, `Int.floor` of `β μ`);
for odd `β` the digit rule is not rounding to nearest, which is why the hypothesis is there. ★★'''
deps = ["FloatingPoint.System.round", "FloatingPoint.System.exponent"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, (2.32)'

[[node]]
id = "fl_eq_self_of_mem"
kind = "theorem"
desc = '''**§2.5.5**: `x ∈ s.numbers ℝ → s.round x = x` ("`fl(x) = x` if `x ∈ 𝔽`").
`FloatingPoint.System.round_eq_self`. ★'''
deps = ["FloatingPoint.System.round_eq_self"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.5, the sentence after (2.32)'

[[node]]
id = "fl_mono"
kind = "theorem"
desc = '''**§2.5.5, the monotonicity property**: `x ≤ y → s.round x ≤ s.round y` for all real `x, y`.
`FloatingPoint.System.round_mono`. ★'''
deps = ["FloatingPoint.System.round_mono"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, §2.5.5, the sentence after (2.32)'

[[node]]
id = "remark_2_2"
kind = "theorem"
desc = '''**Remark 2.2 (overflow and underflow)**: (i) overflow — for `β^U ≤ |x|`, `s.round x ∉ s.numbers ℝ`
(`FloatingPoint.System.round_notMem_numbers`; the book's "`fl(x)` is not defined for `|x| > x_max`" is
read as: outside `𝔽`); (ii) underflow — for `0 < |x| < x_min` the rounding is still defined and
still satisfies `|s.round x - x| ≤ u |x|` (`FloatingPoint.System.abs_round_sub_le`, which has no range
hypothesis), "the operation of rounding is defined anyway". ★'''
deps = ["FloatingPoint.System.round_notMem_numbers", "FloatingPoint.System.abs_round_sub_le"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 2.2'

[[node]]
id = "property_2_1"
kind = "theorem"
desc = '''**Property 2.1, (2.33)–(2.34)**: if `s.xmin ℝ ≤ |x| ≤ s.xmax ℝ` then `∃ δ : ℝ, |δ| ≤ u ∧ s.round x
= x * (1 + δ)` with `u = s.unitRoundoff ℝ = (1/2) β^(1-t) = ε_M / 2`, and moreover `s.round x ∈ s.numbers
ℝ`. `FloatingPoint.System.exists_round_eq_mul_one_add` (which needs no range hypothesis) and
`FloatingPoint.System.round_mem_numbers` (which does). ★'''
deps = ["FloatingPoint.System.exists_round_eq_mul_one_add", "FloatingPoint.System.round_mem_numbers", "FloatingPoint.System.unitRoundoff"]
source = 'Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 2.1'

[[node]]
id = "property_2_1_chop"
kind = "theorem"
desc = '''**Property 2.1 for chopping** (the book's parenthetical "in the chopping one would take `ã_t =
a_t`", with the unit roundoff `β^(1-t)` of Higham Theorem 2.2): `∃ δ : ℝ, |δ| ≤ s.machineEps ℝ ∧ s.chop
