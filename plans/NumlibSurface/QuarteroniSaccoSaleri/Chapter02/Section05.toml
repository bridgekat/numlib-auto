desc = '''**Example 2.11**: the positive numbers of `𝔽(2, 3, -1, 2)` are the sixteen listed ones: `{x : ℚ |
x ∈ example_2_11_system.numbers ℚ ∧ 0 < x} = {7/2, 3, 5/2, 2, 7/4, 3/2, 5/4, 1, 7/8, 3/4, 5/8, 1/2,
7/16, 3/8, 5/16, 1/4}`. Over `ℚ` so that both inclusions are finite case analyses: `m ∈ {4, 5, 6,
