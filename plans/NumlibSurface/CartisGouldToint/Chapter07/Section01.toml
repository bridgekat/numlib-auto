namespace = "CartisGouldToint.Chapter07"
desc = '''
§7.1 The general constrained problem (7.1.1): `minimize_{x ∈ 𝒞} f(x)` subject to `c(x) = 0`,
`f : E → ℝ`, `c : E → EuclideanSpace ℝ (Fin m)`, `E = EuclideanSpace ℝ (Fin n)`. Feasible set
`ℱ(𝒞, c)`, Lagrangian (1.1.1) `ℒ(x,y) = f(x) - ⟨y, c(x)⟩`, Theorem 7.1.1, the first-order measure
(7.1.2) for the Lagrangian, and the (scaled) approximate first-order minimizer (7.1.4).

The bound `𝒞` "closed, bounded, nonempty convex" of (7.1.1) is never used in Chapter 7's results
(boundedness of `f` on the near-feasible region is assumed separately as f.B.Fb) and is not part of
the definitions. The heuristic perturbation argument motivating the scaling `‖(y,1)‖` (after (7.1.5),
footnote 52) is not formalized. Typo: in (7.1.3)–(7.1.4) the set `𝒞(x)` and the gradient are at
`x_*` / `x_ε`.
'''

[[node]]
id = "lagrangianVec"
kind = "def"
desc = '''
`lagrangianVec f c x y := f x - ⟪y, c x⟫_ℝ` (1.1.1) for `y : EuclideanSpace ℝ (Fin m)`. Bridges (part
of node): `lagrangianVec f c x y = Constrained.augmented f c 0 (-y) x`; componentwise
`= Chapter01.lagrangian f (fun i z => c z i) x (fun i => y i)`.
'''
deps = ["Constrained.augmented", "CartisGouldToint.Chapter01.lagrangian"]
source = "Cartis–Gould–Toint, (1.1.1), Section 7.1"

[[node]]
id = "feasibleSet"
kind = "def"
desc = '''
`feasibleSet S c : Set E := {x ∈ S | c x = 0}` (the book's `ℱ(𝒮, c)`).
'''
source = "Cartis–Gould–Toint, Section 7.1"

[[node]]
id = "theorem_7_1_1"
kind = "theorem"
desc = '''
Theorem 7.1.1. Let `S ⊆ C` (closedness not needed), `x* ∈ S`, `y*`, with
`IsMinOn (fun x => lagrangianVec f c x y*) S x*` and `c x* = 0`. Then `x* ∈ feasibleSet S c` and
`IsMinOn f (feasibleSet S c) x*`.
'''
deps = ["lagrangianVec", "feasibleSet", "Constrained.isMinOn_of_isMinOn_sub_inner"]
source = "Cartis–Gould–Toint, Theorem 7.1.1"

[[node]]
id = "omegaL"
kind = "def"
desc = '''
First-order measure of the Lagrangian (7.1.2)–(7.1.3): `omegaL f c C x y :=
Chapter06.omega1 (fun z => lagrangianVec f c z y) C x` `= -min_{d ∈ 𝒞(x) ∩ 𝓑} ⟨d, ∇ₓℒ(x,y)⟩`.
For `C = univ` (part of node): `omegaL f c univ x y = ‖∇f(x) - (Dc(x))ᵀ y‖` (the setting of (7.1.5)).
'''
deps = ["lagrangianVec", "CartisGouldToint.Chapter06.omega1", "Optimization.formCriticality_one_univ"]
source = "Cartis–Gould–Toint, (7.1.2), (7.1.3), (7.1.5)"

[[node]]
id = "IsFirstOrderMinimizerGC"
kind = "def"
desc = '''
First-order minimizer of (7.1.1) (7.1.3): `IsFirstOrderMinimizerGC f c C x : Prop := x ∈ C ∧
c x = 0 ∧ ∃ y, omegaL f c C x y = 0`.
'''
deps = ["omegaL"]
source = "Cartis–Gould–Toint, (7.1.3)"

[[node]]
id = "IsApproxFirstOrderGC"
kind = "def"
desc = '''
`(ε₀, ε₁)`-approximate first-order minimizer of `f` within `ℱ(𝒞, c)` (7.1.4), with the multiplier
as an explicit witness: `IsApproxFirstOrderGC f c C ε₀ ε₁ x y : Prop := x ∈ C ∧ ‖c x‖ ≤ ε₀ ∧
omegaL f c C x y ≤ ε₁ * √(‖y‖ ^ 2 + 1)`.
'''
deps = ["omegaL"]
source = "Cartis–Gould–Toint, (7.1.4)"
