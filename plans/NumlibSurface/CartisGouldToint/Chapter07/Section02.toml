namespace = "CartisGouldToint.Chapter07"
desc = '''
§7.2 Finding first-order approximate minimizers: the two-phase target-following algorithm TPp-GC
(Algorithm 7.2.1), its termination guarantees (Lemma 7.2.1) and evaluation complexity (Lemmas
7.2.2–7.2.6, Theorem 7.2.7). Objects: `f : E → ℝ`, `c : E → EuclideanSpace ℝ (Fin m)`, `C : Set E`,
`‖r(x,t)‖ = Constrained.targetResidual f c t x`, `μ₂(x,t) = Constrained.targetMerit f c t x`,
`Φ_ℓ = Chapter06.PhiEll c ℓ`.

**Modelling of Algorithm 7.2.1.** Phase 1 is an ARpLE-CC run (`Chapter06.algorithm_6_3_1`) on `c`
with tolerances `(θε₀, ε₁)` stopped at its first hit `k₁`; `x₁ := y k₁`. Phase 2 is a structure of
sequences indexed by the book's outer index `k ≥ 1`: outer iterates `X k` (`X 1 = x₁`), targets
`t k`, and for each outer `k` an inner ARp1-CC run `(xi k, si k, σi k)` on `μ₂(·, t k)` started at
`X k` with initial regularization `σ₀`, stopped at its first hit `e k` of the inner test (7.2.10);
`X (k+1) = xi k (e k)`. Evaluation counts: Phase 1 as in Chapter 6 (evaluations of `c`); Phase 2:
`1 + ∑_{k ≤ kε} e k` evaluations of `(f, c)` (one at `x₁`, one per inner iteration) and
`1 + ∑_{k ≤ kε} |{i < e k | inner iteration i successful}|` derivative evaluations.

**Corrections to the algorithm (needed for the printed proofs).** (1) Phase 2 Step 1 applies ARp1-CC
(Algorithm 6.2.2), not ARp-CC: the proof of Lemma 7.2.6 uses Lemma 6.2.4, i.e. the step rule
(6.2.29); ARp-CC's (6.2.10) with a fixed tolerance does not fit the relative test of (7.2.10).
(2) Step 2(a) is entered when `‖r(x_{k+1}, t_k)‖ ≤ θε₀` (printed `< θε₀`): with `<`, an inner run
stopped by `‖r‖ = θε₀` exactly, with `f ≥ t` and large `ω`, falls into Step 2(c) and terminates
without the guarantee (7.2.17), contradicting Lemma 7.2.1. With `≤`, Lemma 7.2.1's strict
`‖c(x_ε)‖ > θε₀` in (7.2.15) also follows (the printed proof only gives `≥`).

**Counting gap (Lemma 7.2.6, Theorem 7.2.7).** The printed block argument (7.2.35)–(7.2.47) bounds
only successful inner iterations whose new iterate fails the third test of (7.2.10) ("good"
iterations). It omits: the first block (before the first `k ∈ 𝒦_a`) and the last one; the restart
of `σ` at `σ₀` in every inner run (Lemma 2.4.1 must be applied per run, adding `κ^C` per run); the
`i = 0` elements of `ℐ^s_k` (so (7.2.39) fails whenever its right-hand side is `< 1`, e.g. for a
block consisting of one `𝒦_a` iteration); and outer iterations in `𝒦_b` whose inner run ends with a
successful iteration landing on a point that passes the third test ("bad" `𝒦_b` iterations) — for
these no decrease is guaranteed and the printed argument gives no bound on their number. The
corrected Lemma 7.2.6 / Theorem 7.2.7 below are provable and recover the book's order
`O(max[ε₀^{-1}, ε₀^{-1/p} ε₁^{-(p+1)/p}])` for both function and derivative evaluations (the
derivative bound acquires the `ε₀^{-1}` term: every `𝒦_a` block needs a successful iteration) when
the number of bad `𝒦_b` iterations is bounded; whether the book's unconditional claim holds is open
(check against [100], [103]).
'''

