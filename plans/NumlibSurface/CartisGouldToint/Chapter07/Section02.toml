source = "Cartis–Gould–Toint, Lemma 7.2.2"

[[node]]
id = "lemma_7_2_3"
kind = "theorem"
desc = '''
Lemma 7.2.3. For a Phase-2 run (corrected algorithm; inner runs satisfy `Optimization.IsARRun` with
model decrease, so `μ₂(·, t_k)` is nonincreasing along each inner run) and every outer `k ≥ 1` up to
the stopping index: `t (k+1) < t k` whenever `t (k+1)` is defined (strictly decreasing);
`f (X k) - t k ≥ 0` (7.2.26); `k ∈ 𝒦_a → targetResidual f c (t (k+1)) (X (k+1)) = ε₀` (7.2.27);
`k ∈ 𝒦_b → targetResidual f c (t (k+1)) (X (k+1)) = targetResidual f c (t k) (X (k+1)) ≤ ε₀`
(7.2.28); `‖c (X k)‖ ≤ ε₀` and `f (X k) - t k ≤ ε₀` (7.2.29); `k ∈ 𝒦_a → t k - t (k+1) ≥ (1-θ) ε₀`
(7.2.30, via `neg_add_sqrt_sq_sub_sq_ge` with `u = f(x_{k+1}) - t_k`, `v = ‖c(x_{k+1})‖`,
`ω = θε₀`). Under `AssumptionBFb f c C β flow fup` (and `ε₀ ≤ min 1 β`):
`t k ∈ [flow - 1, fup]` (7.2.31).
'''
deps = ["algorithm_7_2_1", "AssumptionBFb", "Constrained.targetResidual", "_root_.neg_add_sqrt_sq_sub_sq_ge", "Optimization.IsARRun.sub_ge_of_succ", "Constrained.IsTargetSequence.props"]
