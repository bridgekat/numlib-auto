[[node]]
id = "lemma_7_2_5"
kind = "theorem"
desc = '''
Lemma 7.2.5. Under `AssumptionMu2DpLC f c C p` (`p ≥ 1`) and f.B.Fb there is `Lμ ≥ 0` (namely
`max L_{flow-1} L_{fup}`) with `Chapter06.AssumptionDpLC (targetMerit f c t) C p Lμ` for every
`t ∈ [flow - 1, fup]` — by `Constrained.iteratedFDerivHolderOn_targetMerit_of_mem_Icc` (affine
dependence on `t`; "continuous dependence" as argued in the book would not suffice). Consequently,
with `σμmax := max σ₀ (γ₃ Lμ / (1 - η₂))`, every regularization parameter of every inner run of
Phase 2 satisfies `σ_min ≤ σi k i ≤ σμmax` (Lemma 7.2.3 (7.2.31) and `Optimization.IsARRun.sigma_le`).
(The hypothesis φℓ.DpL.C listed by the book is not needed.)
'''
deps = ["AssumptionMu2DpLC", "lemma_7_2_3", "Constrained.iteratedFDerivHolderOn_targetMerit_of_mem_Icc", "Optimization.IsARRun.sigma_le"]
source = "Cartis–Gould–Toint, Lemma 7.2.5"

[[node]]
id = "lemma_7_2_6"
kind = "theorem"
desc = '''
Lemma 7.2.6, **corrected** (see module description). C.CNe, μ₂.DpL.C, f.B.Fb, a Phase-2 run of the
corrected algorithm, `Lμ`, `σμmax` of Lemma 7.2.5, `κ₁ = η₁σ_min/(p+1)! (p!/(Lμ + σμmax +
θ₁p!))^{(p+1)/p}`, `κ^S_GC = κ₁⁻¹ θ^{-(p+2)/p}` (7.2.47), `G := κ^S_GC (1-θ) ε₀^{(p-1)/p}
ε₁^{-(p+1)/p}`. Call inner iteration `(j, s)` (`s < e j`) *good* if it is successful, the third test
of (7.2.10) fails at `xi j (s+1)` and `targetResidual f c (t j) (xi j (s+1)) > θε₀`. A *block* is a
maximal interval of outer indices `[a+1, b]` with `a ∈ 𝒦_a ∪ {0}` and no element of `𝒦_a` in
`[a+1, b)`. Then, before termination:
(i) every successful `(j, s)` with `s + 1 < e j` is good, and so is the last successful iteration of
a `𝒦_b` run unless that run is *bad* (its final iterate passes the third test of (7.2.10));
(ii) per block, the number of good inner iterations is `≤ G` ((7.2.39) for good iterations; via
(7.2.43) with Lemma 6.2.4 for `μ₂(·, t_j)` and telescoping of the residual from `ε₀` down to `θε₀`
across the block, (7.2.41)–(7.2.42));
(iii) per inner run, `e j ≤ (1 + |log γ₁|/log γ₂) · |{s < e j | successful}| + log(σμmax/σ₀)/log γ₂`
(Lemma 2.4.1 per run; σ restarts at `σ₀`);
(iv) per block, the number of outer iterations is `≤ G + 1 + (number of bad 𝒦_b iterations in it)`.
As printed, (7.2.39) fails when `G < 1`, because `ℐ^s_k` contains the `i = 0` element of the run of
the next `𝒦_a` iteration (with the proof's index range `[k+1 : k+ℓ(k)]`; with the printed range
`[k+1 : k+ℓ(k))` that run is not counted at all).
'''
deps = ["lemma_7_2_3", "lemma_7_2_5", "CartisGouldToint.Chapter06.lemma_6_2_4", "Optimization.succ_le_of_arUpdate", "Optimization.card_mul_le_of_decrease", "Constrained.card_le_of_residual_block"]
source = "Cartis–Gould–Toint, Lemma 7.2.6"

[[node]]
id = "theorem_7_2_7"
kind = "theorem"
desc = '''
Theorem 7.2.7, **corrected**. C.CNe, `AssumptionPhiDpLC c ℓ C p LΦ` with `ι₁(p,ℓ,i) ≥ 0`, μ₂.DpL.C,
f.B.Fb, tolerances (7.2.8). Let `Na := (fup - flow + 1)/((1-θ)ε₀)`, `G` as in Lemma 7.2.6,
`A₁ = 1 + |log γ₁|/log γ₂`, `C₁ = log(σμmax/σ₀)/log γ₂`. For every TPp-GC run:
(i) Phase 1 terminates within the bounds of Lemma 7.2.2 (if it stops the algorithm, its output
satisfies (7.2.14));
(ii) in Phase 2, every outer index `k` reached satisfies `k ≤ (Na + 1)(G + 1) + nbad(k)`, `nbad(k)` the
number of bad `𝒦_b` iterations before `k`; in particular, if the run has at most `M` bad `𝒦_b`
iterations, Phase 2 terminates at some `kε ≤ (Na + 1)(G + 1) + M` with output satisfying (7.2.15)
or (7.2.16) (Lemma 7.2.1);
(iii) if Phase 2 terminates at `kε`: `phase2DerivEvals kε ≤ 1 + (Na + 1) G + kε` and
`phase2FunEvals kε ≤ 1 + A₁ ((Na + 1) G + kε) + C₁ kε`; total evaluations of `(c, f)` are
`≤ #F_{ARpLE,1} + phase2 bound`, of derivatives `≤ #D_{ARpLE,1} + 2 + phase2 bound`.
With `M` bounded independently of `ε` (e.g. `M = 0`) both totals are
`O(max[ε₀^{-1/2^i}, ε₀^{-1}, ε₀^{-1/p} ε₁^{-(p+1)/p}])`, matching the order of (7.2.50); the book's
(7.2.51) (no `ε₀^{-1}` term, `2^4` read `2^i`) and the unconditional termination claim are not
established by the printed proof (module description).
'''
deps = ["lemma_7_2_1", "lemma_7_2_2", "lemma_7_2_4", "lemma_7_2_6", "algorithm_7_2_1"]
source = "Cartis–Gould–Toint, Theorem 7.2.7"
