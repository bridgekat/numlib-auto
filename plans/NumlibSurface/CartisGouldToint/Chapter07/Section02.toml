[[node]]
id = "lemma_7_2_5"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 7.2.5: Uniform Lipschitz and regularization bounds

Suppose that \( {\phi }_{\ell } \) .DpL.C, \( {\mu }_2 \) .DpL.C, and f.B.Fb hold. Then there exists a constant \( {L}_{\mu , p} \geq  0 \) such that the pth derivative of \( {\mu }_2\left( {x,{t}_k}\right) \) with respect to \( x \) is Lipschitz continuous with Lipschitz constant \( {L}_{{\mu }_2, p} \) for all values of \( {t}_k \) computed in Phase 2 of the TPp-GC algorithm. Furthermore, there exists a constant \( {\sigma }_{{\mu }_2,\max } > {\sigma }_{\min } \) such that all regularization parameters arising in the ARp-CC algorithm used within Step 1 of algorithm TPp-GC are bounded above by \( {\sigma }_{{\mu }_2,\max } \) .
'''
deps = ["lemma_4_1_2", "lemma_7_2_4", "targetResidual", "twoPhaseRun", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 7.2.5 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 8992)"

[[node]]
id = "lemma_7_2_6"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 7.2.6: Bound on the size of \( {\mathcal{I}}_k \)

Suppose that C.CNe, \( {\Phi }_{\ell } \) .DpL.C, \( {\mu }_2 \) .DpL.C, and f.B.Fb hold. Then there are constants \( {\kappa }_{\text{ ARpGC }}^{S},{\kappa }_{\text{ ARpGC }}^{A} \) , and \( {\kappa }_{\text{ ARpGC }}^{C} \) such that

\[
\left| {\mathcal{I}}_{k}^{s}\right|  \leq  {\kappa }_{\text{ ARpGC }}^{s}\left( {1 - \theta }\right) {\epsilon }_{0}^{\frac{p - 1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}}\tag{7.2.39}
\]

and

\[
\left| {\mathcal{I}}_{k}\right|  \leq  {\kappa }_{\text{ ARpGC }}^{A}\left( {1 - \theta }\right) {\epsilon }_{0}^{\frac{p - 1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}} + {\kappa }_{\text{ ARpGC }}^{C}\tag{7.2.40}
\]

for each \( k \in  {\mathcal{K}}_a \) before termination.

---

\( {}^{56} \) The terminal iterate from subproblem \( j \) is the same as the initial one for subproblem \( j + 1 \) by construction, so it is not counted twice.

---
'''
deps = ["lemma_7_2_5", "lemma_6_2_4", "lemma_2_4_1", "targetResidual", "twoPhaseRun", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 7.2.6 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 9026)"

[[node]]
id = "theorem_7_2_7"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 7.2.7: Complexity of finding first-order critical points by the TPp-GC algorithm

Suppose that C.CNe, \( {\Phi }_{\ell } \) .DpL.C, \( {\mu }_2 \) .DpL.C, and f.B.Fb hold. Then there are constants \( {\kappa }_{\text{ ARpGC }}^{F} \) and \( {\kappa }_{\text{ ARpGC }}^{D} \) such that, for any \( \left( {{\epsilon }_0,{\epsilon }_1}\right)  \in  (0,1{\rbrack }^2 \) , the TPp-GC algorithm (p. 198) requires at most

\[
{\# }_{\mathrm{{ARpGC}}}^{F}\overset{\text{ def }}{ = }{\# }_{\mathrm{{ARpLE}},1}^{F} + {\# }_{\mathrm{{ARpGC}},2}^{F} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-1},{\epsilon }_{0}^{-\frac{1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)\tag{7.2.50}
\]

evaluations of \( c \) and \( f \) and

\[
{\# }_{\mathrm{{ARpGC}}}^{D}\overset{\text{ def }}{ = }{\# }_{\mathrm{{ARpLE}},1}^{D} + {\# }_{\mathrm{{ARpGC}},2}^{D} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-\frac{1}{{2}^{4}}},{\epsilon }_{0}^{-\frac{1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)\tag{7.2.51}
\]

evaluations of their derivatives up to order \( p \) , where

\[
{\# }_{\mathrm{{ARpGC}},2}^{F}\overset{\text{ def }}{ = }\left( {{f}_{up} - {f}_{low} + 1}\right) \left( {{\kappa }_{\mathrm{{ARpGC}}}^{A}{\epsilon }_{0}^{-\frac{1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}} + \frac{{\kappa }_{\mathrm{{ARpGC}}}^{C}}{1 - \theta }{\epsilon }_{0}^{-1}}\right)  + 1\tag{7.2.52}
\]

and

\[
{\# }_{\mathrm{{ARpGC}},2}^{D}\overset{\text{ def }}{ = }\left( {{f}_{up} - {f}_{low} + 1}\right) {\kappa }_{\mathrm{{ARpGC}}}^{s}{\epsilon }_{0}^{-\frac{1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}} + 1;\tag{7.2.53}
\]

\( {\# }_{\mathrm{ARpLE},1}^F \) and \( {\# }_{\mathrm{ARpLE},1}^D \) are given by (7.2.23) and (7.2.24); and \( {\kappa }_{\mathrm{ARpGC}}^A,{\kappa }_{\mathrm{ARpGC}}^C \) , and \( {\kappa }_{\mathrm{ARpGC}}^S \) are given by (7.2.47)-(7.2.49), to compute a point \( {x}_{\epsilon } \) at which either (7.2.14) or (7.2.15) or (7.2.16) holds.

Referenced equation payloads:

Equation (7.2.14):
\[
{\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_{1}{\begin{Vmatrix}c\left( {x}_{\epsilon }\right) \end{Vmatrix}}^{\ell  - 1}\text{ and }\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} > \theta {\epsilon }_{0}.\tag{7.2.14}
\]

Equation (7.2.15):
\[
{\omega }_{{\Phi }_{2},\mathcal{C},1}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_{1}\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix}\text{ and }\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} > \theta {\epsilon }_{0}\tag{7.2.15}
\]

Equation (7.2.16):
\[
{\omega }_{\mathcal{L},\mathcal{C},1}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  {\epsilon }_{1}\begin{Vmatrix}\left( {{y}_{\epsilon },1}\right) \end{Vmatrix}\text{ and }\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_{0},\tag{7.2.16}
\]

Equation (7.2.23):
\[
{\# }_{\mathrm{{ARpLE}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARpLE}},1}^{A}\frac{\max \left\lbrack  {{\begin{Vmatrix}c\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{i}}},{\begin{Vmatrix}c\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\ell  - 1}{p}}}\right\rbrack  }{\min \left\lbrack  {{\theta }^{\frac{1}{{2}^{i}}}{\epsilon }_{0}^{\frac{1}{{2}^{i}}},{\epsilon }_{1}^{\frac{p + 1}{p}}}\right\rbrack  } + {\kappa }_{\mathrm{{ARpLE}} = }^{C}\mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-\frac{1}{{2}^{i}}},{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)
\]

Equation (7.2.24):
\[
{\# }_{\mathrm{{ARpLE},1}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARpLE},1}}^{S}\frac{\max \left\lbrack  {{\begin{Vmatrix}c\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{i}}},{\begin{Vmatrix}c\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\ell  - 1}{p}}}\right\rbrack  }{\min \left\lbrack  {{\theta }^{\frac{1}{{2}^{i}}}{\epsilon }_{0}^{\frac{1}{{2}^{i}}},{\epsilon }_{1}^{\frac{p + 1}{p}}}\right\rbrack  } = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-\frac{1}{{2}^{i}}},{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)
\]

Equation (7.2.47):
\[
\left| {\mathcal{I}}_{k}^{\mathrm{S}}\right|  \leq  {\kappa }_{\mathrm{{ARpGC}}}^{\mathrm{S}}\left( {1 - \theta }\right) {\epsilon }_{0}^{\frac{p - 1}{p}}{\epsilon }_{1}^{-\frac{p + 1}{p}},\text{ where }{\kappa }_{\mathrm{{ARpGC}}}^{\mathrm{S}}\overset{\text{ def }}{ = }{\kappa }_{1}^{-1}{\theta }^{-\frac{p + 2}{p}},\tag{7.2.47}
\]

Equation (7.2.49):
\[
{\kappa }_{\text{ ARpGGC }}^{\mathrm{C}}\overset{\text{ def }}{ = }\frac{1}{\log {\gamma }_{2}}\log \left( \frac{{\sigma }_{{\mu }_{2},\max }}{{\sigma }_{0}}\right) .\tag{7.2.49}
\]
'''
deps = ["lemma_7_2_2", "lemma_7_2_6", "theorem_4_1_5", "targetResidual", "twoPhaseRun", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 7.2.7 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 9140)"

