[[node]]
id = "algorithm_7_2_1"
kind = "def"
desc = '''
Algorithm 7.2.1 (TPp-GC), corrected as in the module description. Parts (all part of this node):
* `innerStop f c C θ ε₀ ε₁ t x : Prop := targetResidual f c t x ≤ θ ε₀ ∨ f x < t ∨
  Chapter06.omega1 (targetMerit f c t) C x ≤ ε₁ * targetResidual f c t x` (7.2.10);
* `IsTPpGCPhase1 … x₀ y s σ k₁ : Prop := Chapter06.IsARpLECCRun c ℓ C p P (θ ε₀) ε₁ y s σ ∧
  y 0 = x₀ ∧ IsFirstHit (fun k => stopLE c ℓ C (θ ε₀) ε₁ (y k)) k₁` (Phase 1, (7.2.9)); Phase 1
  terminates the algorithm with `x_ε = y k₁` iff `‖c (y k₁)‖ > θ ε₀`;
* `IsTPpGCPhase2 … x₁ X t xi si σi e : Prop`: `X 1 = x₁`, `t 1 = f x₁ - √(ε₀² - ‖c x₁‖²)` (Step 0),
  and for every `k ≥ 1` such that no outer `j ∈ [1, k)` stopped: `xi k 0 = X k`,
  `Optimization.IsARRun P.toARParams (fun i => innerStop … (t k) (xi k i)) (fun i =>
  Optimization.IsFirstOrderCCStep (targetMerit f c (t k)) C p θ₁ (xi k i) (σi k i) (si k i))
  (fun _ => False) (Optimization.taylorRatio (targetMerit f c (t k)) p (xi k) (si k)) (xi k) (si k)
  (σi k)`,
  `IsFirstHit (fun i => innerStop … (t k) (xi k i)) (e k)`, `X (k+1) = xi k (e k)`, and the target
  rule: case (a) `targetResidual f c (t k) (X (k+1)) ≤ θ ε₀` (corrected from `<`):
  `t (k+1) = f (X (k+1)) - √(ε₀² - ‖c (X (k+1))‖²)` (7.2.11); case (b) residual `> θ ε₀` and
  `f (X (k+1)) < t k`: `t (k+1) = 2 f (X (k+1)) - t k` (7.2.13); case (c) otherwise: stop with
  `t_ε = t k`. In cases (a)/(b) stop iff (7.2.12): `omega1 (targetMerit f c (t (k+1))) C (X (k+1))
  ≤ ε₁ * targetResidual f c (t (k+1)) (X (k+1))`, with `t_ε = t (k+1)`. `outerStop k`, `IsKa k`
  (case (a)), `IsKb k` (case (b)) are named (7.2.25); the outer bookkeeping is
  `Constrained.IsTargetSequence f c θ ε₀ X t IsKa K` (with `IsKa k :↔ targetResidual f c (t k)
  (X (k+1)) ≤ θ ε₀`, the corrected Step 2(a)), shared with Chapter 14's TPqp-GC;
* `IsTPpGCRun` := Phase 1 ∧ (`‖c x₁‖ ≤ θ ε₀` → Phase 2 from `x₁`); outputs `x_ε`, `t_ε`;
* counts `phase2FunEvals kε := 1 + ∑_{k ∈ [1, kε]} e k`, `phase2DerivEvals kε :=
  1 + ∑_{k ∈ [1, kε]} |{i < e k | arSucc (inner run k) i}|`.
'''
deps = ["TPpGCParams", "CartisGouldToint.Chapter06.algorithm_6_3_1", "CartisGouldToint.Chapter06.algorithm_6_2_2", "CartisGouldToint.Chapter06.omega1", "Constrained.targetResidual", "Optimization.IsARRun", "Optimization.IsFirstOrderCCStep", "Optimization.IsFirstHit", "Constrained.IsTargetSequence", "Optimization.taylorRatio"]
source = "Cartis–Gould–Toint, Algorithm 7.2.1"

