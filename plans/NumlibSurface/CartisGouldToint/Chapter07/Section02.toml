namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 7, Section 2.

TPp-GC has a feasibility Phase 1 and repeated residual-minimization Phase 2 with explicit decreasing target t_k. Preserve infeasible-critical termination as a valid outcome. Uniform smoothness constants for μ₂(x,t) must be proved for the generated bounded target range; do not assume the conclusions of Lemma 7.2.5 as algorithm fields. Separate outer target changes K_a,K_b from inner AR iteration sets I_k. The final result is a disjunction of infeasible criticality and scaled KKT approximate optimality; do not assume exact feasibility exists.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

Since generally constrained optimization is more complicated than the topics we have addressed thus far in this book, both in theory and in practice, we shall take things at a gentle pace. In this chapter, we consider the simplest case, in which we aim to compute an \( \left( {{\epsilon }_0,{\epsilon }_1}\right) \) -approximate first-order minimizer of \( f \) within \( \mathcal{F}\left( {\mathcal{C}, c}\right) \) ; that is, we aim to satisfy (7.1.4). It is fair to say that almost all the current research on evaluation complexity for generally constrained optimization focuses on achieving first-order optimality, but as we shall see later, in Chapter 14, there are hints of generalizations to higher-order conditions.

#### 7.2.1 The basic approach

Most, but not all, methods for generally-constrained optimization recognize that there is an unstated conflict between reducing the objective on one hand and satisfying the constraints on the other. A common ploy is to build an artificial function that balances these two conflicting goals; penalty-function and augmented-Lagrangian methods are cases in point, while interior-point and SQP methods depend on suitable merit functions of this kind. The method that will form the focus of this chapter is also of this flavour but differs in one key aspect. This is that it first tries to satisfy the constraints to a reasonable degree and, if it achieves this, thereafter reduces the objective as much as possible while keeping a tight rein on subsequent constraint infeasibility. This very cautious approach is the key to its reasonable worst-case behaviour but mitigates against the bravado that the best practical methods exhibit.

The essential idea is straightforward and dates back to a class of methods for nonlinear convex optimization from the 1960s [260,294]. Consider, for simplicity, the equality-constrained problem of minimizing \( f\left( x\right) \) subject to the equality constraints \( c\left( x\right)  = 0 \) , and let \( {f}_{\min } \) be the smallest value of \( f \) allowed by the constraints. Then, if \( t = {f}_{\min } \) , the roots of the nonlinear system

\[
c\left( x\right)  = 0\text{ and }f\left( x\right)  - t = 0\tag{7.2.1}
\]

are the global minimizers of the problem. If \( t < {f}_{\min },\left( {7.2.1}\right) \) has no solution, while if \( t > {f}_{\min },\left( {7.2.1}\right) \) may have many. In particular, if \( x = {x}_{\mathrm{F}} \) is any vector that satisfies

\[
c\left( x\right)  = 0,\tag{7.2.2}
\]

(7.2.1) has a solution when \( t = f\left( {x}_{\mathrm{F}}\right) \) .

Thus, our basic strategy is to find a solution to (7.2.2) if that is possible, to record the corresponding \( t = f\left( {x}_{\mathrm{F}}\right) \) , and then to gradually reduce \( t \) so long as (7.2.1) continues to hold. But rather than solving the nonlinear equations (7.2.2) and (7.2.1), we consider instead the equivalent optimization problems

\[
\mathop{\min }\limits_{x \in  {\mathbb{R}}^n}\parallel c\left( x\right) \parallel\tag{7.2.3}
\]

and, if the former (approximately) achieves (7.2.2),

\[
\mathop{\min }\limits_{{x \in  {\mathbb{R}}^{n}}}\parallel r\left( {x, t}\right) \parallel ,\text{ where }r\left( {x, t}\right) \overset{\text{ def }}{ = }\left( \begin{matrix} c\left( x\right) \\  f\left( x\right)  - t \end{matrix}\right) ,\tag{7.2.4}
\]

where the latter is solved for a well-chosen sequence of decreasing \( t \) . There is no difficulty, at least in principle, in adapting such a scheme to cope with additional convex constraints by restricting the minimizations in (7.2.3) and (7.2.4) to \( x \in  \mathcal{C} \) . Fortunately, as the reader will recall, we have already studied good methods for the problems (7.2.3) and (7.2.4) both with and without additional constraints in Sections 5.1 and 6.3.

#### 7.2.2 The TPp-GC algorithm and its complexity

##### 7.2.2.1 The TPp-GC algorithm

We now expand on the method we sketched in the previous section. To say anything more, we need to define more thoroughly the class of constrained optimization problems (7.1.1) that will be our focus in this chapter. We consider first the constraints on the problem and aim at solving (7.2.3) by solving the equivalent convexly constrained least-Euclidean-norm problem

\[
\mathop{\min }\limits_{{x \in  \mathcal{C}}}{\Phi }_{1}\left( x\right) \overset{\text{ def }}{ = }\parallel c\left( x\right) \parallel
\]

using the ARpLE-CC algorithm (p. 189). This requires that we choose a particular \( \ell \) satisfying either (5.1.38) or (5.1.39). Moreover, we must ensure the necessary smoothness conditions to be able to use the complexity result of Theorem 6.3.1, that is, \( {\Phi }_{\ell } \) .DpL.C (for the chosen \( \ell \) ). As we argued after the statement of assumption \( {\Phi }_{\ell } \) .DpL on p. 124, a sufficient condition for \( {\Phi }_{\ell } \) .DpL.C to hold is that \( \parallel c\left( x\right) \parallel \) remain bounded in \( \mathcal{C} \) and that the following hold.

c.D1pL.C

The constraint functions \( {c}_i\left( x\right) , i \in  \left\lbrack  {1 : m}\right\rbrack \) , are all \( p \) -times continuously differentiable in an open set \( \mathcal{D} \) containing \( \mathcal{C} \) , and their derivative tensors \( {\nabla }_x^j{c}_i\left( x\right) , j \in  \left\lbrack  {1 : p}\right\rbrack \) , are Lipschitz continuous and bounded in \( \mathcal{C} \) .

As in previous chapters, we prefer to use the weaker \( {\Phi }_{\ell } \) .DpL.C. This is then sufficient to try to find an approximately feasible point \( {x}_1 \) for which \( \begin{Vmatrix}{c\left( {x}_1\right) }\end{Vmatrix} \leq  {\epsilon }_0 \) for a predefined, small \( {\epsilon }_0 > 0 \) . If we fail, there is little more that we can do; indeed, we shall link failure to finding instead an infeasible approximately critical point of \( \parallel c\left( x\right) \parallel \) . But if we succeed, our focus then necessarily changes to the objective function.

Armed with the approximately feasible point \( {x}_1 \) , we may then consider using the ARp-CC or ARp1-CC algorithm once again to approximately solve the problem

\[
\mathop{\min }\limits_{{x \in  \mathcal{C}}}{\mu }_{2}\left( {x,{t}_{k}}\right) \overset{\text{ def }}{ = }\frac{1}{2}{\begin{Vmatrix}r\left( x,{t}_{k}\right) \end{Vmatrix}}^{2}\tag{7.2.5}
\]

or ARpLE-CC to tackle the equivalent

\[
\mathop{\min }\limits_{{x \in  \mathcal{C}}}{\mu }_{1}\left( {x,{t}_{k}}\right) \overset{\text{ def }}{ = }\begin{Vmatrix}{r\left( {x,{t}_{k}}\right) }\end{Vmatrix}\tag{7.2.6}
\]

for some monotonically decreasing sequence of targets \( \left\{  {t}_k\right\}  , k \geq  1 \) . Again this requires that we specify the assumptions on the objective function that make this possible. Let \( \beta  > {\epsilon }_0 > 0 \) , and consider the region of near feasibility

\[
{\mathcal{F}}_{\beta } = \{ x \in  \mathcal{C} \mid  \parallel c\left( x\right) \parallel  \leq  \beta \}\tag{7.2.7}
\]

We first require that the objective function satisfy an assumption on this region.

f.B.Fb If \( {\mathcal{F}}_{\beta } \neq  \varnothing , f\left( x\right) \) is bounded above and below on \( {\mathcal{F}}_{\beta } \) ; that is, there are constants \( {f}_{\text{ low }} \) and \( {f}_{\text{ up }} \) for which

\[
{f}_{\text{ low }} \leq  f\left( x\right)  \leq  {f}_{\text{ up }}
\]

for all \( x \in  {\mathcal{F}}_{\beta } \) .

In line with our approach for ensuring feasibility, we also require that \( {\mu }_2 \) .DpL.C hold, \( {}^{53} \) where \( {\mu }_2 \) is considered as a function of its first argument. We note once again, in the light of our comment on p. 124, that a sufficient condition to ensure \( {\mu }_2 \) .DpLC is that \( \left| {f\left( x\right)  - t}\right| \) is bounded \( {}^{54} \) in \( \mathcal{C} \) and that the following holds.

f.D1pL.C

The objective function \( f\left( x\right) \) is \( p \) -times continuously differentiable in an open set \( \mathcal{D} \) containing \( \mathcal{C} \) , and its derivative tensors \( {\nabla }_x^j{f}_i\left( x\right) \) , \( j \in  \left\lbrack  {1 : p}\right\rbrack \) , are Lipschitz continuous and bounded in \( \mathcal{C} \) .

However, we prefer to focus on \( {\mu }_2 \) .DpL.C. Of course, \( {\Phi }_{\ell } \) .DpL.C and \( {\mu }_2 \) .DpL.C ensure that \( f \) and the components of \( c \) are \( p \) -times continuously differentiable in \( \mathcal{C} \) .

Of course, this is simply a sketch of an algorithm, and we now need to fill in crucial details, most particularly of how we pick the targets \( {t}_k \) , how accurately we need to solve the crucial subproblems (7.2.5)-(7.2.6), and when to stop. Although, as we mention above, it is possible to apply a variety of algorithms during the feasibility and optimality phases, in the description below we have selected those that lead to the currently best complexity in each phase.

Algorithm 7.2.1: Two-phase adaptive-regularization algorithm using \( p \) th-order models for general constraints (TP \( p \) -GC)

Initialization: An initial point \( {x}_0 \in  \mathcal{C} \) , an infeasibility bound \( \beta  > 0 \) defining \( {\mathcal{F}}_{\beta } \) , and a constant \( \theta  \in  \left( {0,1}\right) \) are given. Infeasibility and optimality tolerances

\[
0 < {\epsilon }_{0} \leq  \min \left( {1,\beta }\right) \text{ and }0 < {\epsilon }_{1} \leq  1\tag{7.2.8}
\]

are also given.

---

\( {}^{53}\mathrm{\;{By}}{\mu }_2 \) .D1pL.C we mean \( {\Phi }_{\ell } \) .DpL.C on page 189 in the case where \( {\Phi }_{\ell } = {\mu }_2 \) . Assumption \( {\mu }_2 \) .DpL.C imposes smoothness requirements on \( {\mu }_2\left( {\cdot , t}\right) \) throughout \( \mathcal{C} \) . This is actually stronger than needed and made purely for simplicity. A more reasonable assumption might be that the required smoothness hold instead only for \( x \) in \( {\mathcal{F}}_{\beta } \) . To do so is delicate and needs the parameter \( \beta \) to be sufficiently large to ensure that iterates and trial points of the \( \mathrm{AR}p - \mathrm{CC} \) algorithm in Phase 2 of the forthcoming TP \( p \) -GC algorithm remain in this restricted subset. The construction of the AR \( p \) -CC algorithm ensures that this is trivially satisfied for successful iterates. At unsuccessful trial points, one needs to show that the length of the trial steps \( \begin{Vmatrix}{s}_{k, i}\end{Vmatrix} \) remains uniformly bounded above, and this is so provided that the derivatives of the generated iterates are bounded [105, Lem. 3.2]. Thus a suitable \( \beta \) ultimately depends on Lipschitz constants and other algorithmic parameters.

\( {}^{54} \) Note that boundedness of \( \left| {f\left( x\right) }\right| \) is ensured in \( {\mathcal{F}}_{\beta } \) by f.B.Fb and will ensure in what follows that \( t \) remains bounded.

---

Phase 1: Feasibility phase: Pick a Taylor degree \( p \) along with suitable values \( i \geq  0 \) and \( \ell  > 1 \) satisfying either (5.1.38) or (5.1.39), and apply the ARpLE-CC algorithm (p. 189), starting from \( {x}_0 \) , to find a point \( {x}_1 \in  \mathcal{C} \) for which

\[
\begin{Vmatrix}{c\left( {x}_{1}\right) }\end{Vmatrix} \leq  \theta {\epsilon }_{0}\text{ or }{\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{1}\right)  \leq  {\epsilon }_{1}{\begin{Vmatrix}c\left( {x}_{1}\right) \end{Vmatrix}}^{\ell  - 1}.\tag{7.2.9}
\]

If \( \begin{Vmatrix}{c\left( {x}_1\right) }\end{Vmatrix} > \theta {\epsilon }_0 \) , terminate with \( {x}_{\epsilon } = {x}_1 \) .

Phase 2: Optimality phase:

Step 0: Initialization. Set \( {t}_1 = f\left( {x}_1\right)  - \sqrt{{\epsilon }_0^2 - {\begin{Vmatrix}c\left( {x}_1\right) \end{Vmatrix}}^2} \) and \( k = 1 \) .

Step 1: Inner iteration to compute an improved objective value. Starting from \( {x}_k \) , apply the ARp-CC algorithm (p. 180) to minimize \( {\mu }_2\left( {x,{t}_k}\right) \) as a function of \( x \in  \mathcal{C} \) until an iterate \( {x}_{k + 1} \in  \mathcal{C} \) is found such that

\[
\begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_{k}}\right) }\end{Vmatrix} \leq  \theta {\epsilon }_{0}\text{ or }f\left( {x}_{k + 1}\right)  < {t}_{k}\text{ or }{\omega }_{{\mu }_{2},\mathcal{C},1}\left( {{x}_{k + 1},{t}_{k}}\right)  \leq  {\epsilon }_{1}\begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_{k}}\right) }\end{Vmatrix}.
\]

(7.2.10)

Step 2: Decrease the target and check for termination.

(a) If \( \begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_k}\right) }\end{Vmatrix} < \theta {\epsilon }_0 \) , set

\[
{t}_{k + 1} = f\left( {x}_{k + 1}\right)  - \sqrt{{\epsilon }_0^2 - {\begin{Vmatrix}c\left( {x}_{k + 1}\right) \end{Vmatrix}}^2},\tag{7.2.11}
\]

and terminate with \( \left( {{x}_{\epsilon },{t}_{\epsilon }}\right)  = \left( {{x}_{k + 1},{t}_{k + 1}}\right) \) if

\[
{\omega }_{{\mu }_2,\mathcal{C},1}\left( {{x}_{k + 1},{t}_{k + 1}}\right)  \leq  {\epsilon }_1\begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_{k + 1}}\right) }\end{Vmatrix}.\tag{7.2.12}
\]

(b) Otherwise, if \( \begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_k}\right) }\end{Vmatrix} \geq  \theta {\epsilon }_0 \) and \( f\left( {x}_{k + 1}\right)  < {t}_k \) , set

\[
{t}_{k + 1} = {2f}\left( {x}_{k + 1}\right)  - {t}_k\tag{7.2.13}
\]

and terminate with \( \left( {{x}_{\epsilon },{t}_{\epsilon }}\right)  = \left( {{x}_{k + 1},{t}_{k + 1}}\right) \) if (7.2.12) holds.

(c) Otherwise, if \( \begin{Vmatrix}{r\left( {{x}_{k + 1},{t}_k}\right) }\end{Vmatrix} \geq  \theta {\epsilon }_0 \) and \( f\left( {x}_{k + 1}\right)  \geq  {t}_k \) , terminate with \( \left( {{x}_{\epsilon },{t}_{\epsilon }}\right)  = \left( {{x}_{k + 1},{t}_k}\right) \) .

Step 3: Move to the next iteration. Set \( k = k + 1 \) , and go to Step 1.

Just to remind the reader, the function \( {\Phi }_{\ell } \) used by the ARpLE-CC algorithm and in the stopping test (7.2.9) is that defined by (5.1.3) (p. 120). Observe that the computation of \( {\omega }_{{\mu }_2,\mathcal{C},1}\left( {{x}_{k + 1},{t}_{k + 1}}\right) \) in Step 2 does not require that \( f\left( {x}_{k + 1}\right) , c\left( {x}_{k + 1}\right) \) , or any of their derivatives be reevaluated.

The mechanism devised to adjust the targets may seem at a first glance to be rather complicated. To reassure the reader that there is some purpose, it is relatively straightforward to show that if the algorithm terminates, it does so at either an \( \epsilon \) -approximate infeasible local minimizer of \( \parallel c\left( x\right) \parallel \) or an \( \epsilon \) -approximate KKT point.
'''

