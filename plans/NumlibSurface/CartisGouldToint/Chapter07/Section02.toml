Existence of TPp-GC runs. C.CNe, `x₀ ∈ C`, `ι₁(p,ℓ,i) ≥ 0`, `Chapter06.AssumptionPhiDpLC c ℓ C p
LΦ`, `AssumptionMu2DpLC f c C p`, tolerances (7.2.8). Then an `IsTPpGCRun` exists: Phase 1 by
