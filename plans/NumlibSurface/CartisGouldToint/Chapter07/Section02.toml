the outer sequence by `Optimization.exists_run_of_forall_exists` on states
`(X k, t k, inner run k)`.
'''
deps = ["algorithm_7_2_1", "AssumptionMu2DpLC", "CartisGouldToint.Chapter06.theorem_6_3_1", "CartisGouldToint.Chapter06.theorem_6_2_5", "CartisGouldToint.Chapter06.AssumptionPhiDpLC", "Optimization.exists_isFirstOrderCCStep", "Optimization.exists_run_of_forall_exists"]
source = "Cartis–Gould–Toint, Algorithm 7.2.1 (well-posedness)"

[[node]]
id = "lemma_7_2_1"
kind = "theorem"
desc = '''
Lemma 7.2.1 (for the corrected algorithm; `f`, `c` differentiable on an open set containing `C`).
If TPp-GC stops in Phase 1 then `omega1 (Chapter06.PhiEll c ℓ) C x_ε ≤ ε₁ ‖c x_ε‖^(ℓ-1)` and
`‖c x_ε‖ > θ ε₀` (7.2.14). If it stops in Phase 2 at outer `kε` with output `(x_ε, t_ε)` then
(7.2.17) holds (`targetResidual f c t_ε x_ε > θ ε₀` — strict, `f x_ε ≥ t_ε`,
`omega1 (targetMerit f c t_ε) C x_ε ≤ ε₁ targetResidual f c t_ε x_ε`), `targetResidual f c t_ε x_ε
≤ ε₀` (7.2.20), and either `f x_ε = t_ε`, `omega1 (Chapter06.PhiEll c 2) C x_ε ≤ ε₁ ‖c x_ε‖`,
`‖c x_ε‖ > θ ε₀` (7.2.15), or `f x_ε > t_ε` and `IsApproxFirstOrderGC f c C ε₀ ε₁ x_ε y_ε` with the
explicit multiplier `y_ε = -(f x_ε - t_ε)⁻¹ • c x_ε` (7.2.16), (7.2.22).
'''
deps = ["algorithm_7_2_1", "lemma_7_2_3", "IsApproxFirstOrderGC", "Constrained.fderiv_targetMerit", "Constrained.fderiv_targetMerit_eq_smul_lagrangian", "CartisGouldToint.Chapter06.PhiEll"]
source = "Cartis–Gould–Toint, Lemma 7.2.1"

