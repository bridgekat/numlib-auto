namespace = "CartisGouldToint.Chapter13"
desc = '''
§13.3 Inexact algorithms using explicit dynamic accuracy (EDA): TRqEDA (Algorithm 13.3.1) and
ARqpEDA (Algorithm 13.3.2). The derivative errors are enforceable and normalized, `κ_{∇,i} = 1`
(13.3.3)–(13.3.4) (`JetApprox … (fun i => h k i)`), function values are inexact with requested accuracy
`h_{k,0}` (13.3.1)–(13.3.2), and termination is certified (Steps 1.4.1/1.5.1).

Design: the runs reuse the iteration predicates `TRqDAStep` / `ARqpDAStep` of §13.1 (Steps 1, 2, 4, 5
are those of the IDA algorithms) under `Optimization.UntilHit stop`, plus the new Step 3:
`0 < h₀ k ≤ κs ΔT̄` ((13.3.9)/(13.3.18)), values `fx k` (`f̄(x_k)`) and `fxs k` (`f̄(x_k+s_k)`) within
`h₀ k` of `f`, and `ρ k = (fx k - fxs k) / ΔT̄` ((13.3.10)/(13.3.19)). `R k` records that `f̄(x_k)` was
(re)computed in Step 3 (otherwise it is a previously computed trial value at the same point), so the
function-value count is `edaFunEvalCount k = |(range k).filter T| + |(range k).filter (T ∧ R)| ≤ 2|T|`
(no evaluation at Step 0). Lemmas of §13.1 stated for the step predicates apply unchanged
(13.1.1, 13.1.2, 13.1.4 (with Lemma 13.3.1), 13.1.6, 13.1.9–13.1.13).

Source issue (ARqpEDA). The book proves Theorem 13.3.8 "identically" to Theorem 13.1.19, i.e. via
Lemmas 13.1.16–13.1.18, whose hypothesis is that `x_{k+1}` is *not approximately optimal*. For EDA the
count runs up to termination, and non-termination at `k+1` does not imply non-optimality of `x_{k+1}`
(the Step-1 test uses `ς ε/2` and inexact data). The corrected argument (`eda_radius_inequality`) uses
what non-termination gives: either Step 1 at `k+1` fails the test (13.3.15) at the inherited radius
`δ_{k+1} = δ_{s_k}` for some `j` — then `φ̄ > ς ε δ^j/(2 j!)` and, with the accuracies inherited from
iteration `k` ((13.1.46) at `s_k`), the radius inequality holds with `ς/2 - θ` in place of `1 - θ` and
`4κs` in place of `3κ_{∇,max}κs` — or Step 1 passes at all orders without halving and (13.3.17) fails,
an accuracy-improving iteration with large `h`, of which there are `O(|log ε_min|)`. This needs
`θ < ς/2` (an extra hypothesis of Lemma 13.3.7 and Theorem 13.3.8; the book only assumes
`θ ∈ (0,1)`, `ς ∈ (0,1]`). TRqEDA is not affected (its decrease bound needs no optimality hypothesis).
'''

[[node]]
id = "algorithm_13_3_1"
kind = "def"
desc = '''
Algorithm 13.3.1 (TRqEDA) as a run predicate `IsTRqEDARun f P ε x₀ x Δ h D dd jk s acc fx fxs h₀ R`
with `P : TRqIDAParams` and (13.3.5) `P.κs ≤ min P.η₁ (1 - P.η₂) / 4`; `ε j ∈ Ioc 0 1`,
`ε_min ≤ ϑ`; `x 0 = x₀`, `Δ 0 = Δ₀`, `h 0 = h₀`; oracle `∀ k, JetApprox (ftaylorSeries ℝ f (x k)) (D k)
q (fun i => h k i)` ((13.3.4), `κ_∇ = 1`); termination test (Steps 1.4–1.4.1, (13.3.8))
`edaStopTR k := (∀ j ∈ Icc 1 q, (D k).taylorDecrement j (dd k j) ≤ ς ε j δ_k^j / j! / 2) ∧
∑ i ∈ Icc 1 q, h k i * δ_k^i / i! ≤ ς ε_min δ_k^q / q! / 2` (`δ_k = min (Δ k) ϑ`); and
`UntilHit edaStopTR (fun k => TRqDAStep P ε x Δ h D dd jk s acc ρ k ∧ (¬ acc k → Step3 k))` where
`Step3 k`: `0 < h₀ k ≤ κs * ΔT̄` (13.3.9) with `ΔT̄ = (D k).taylorDecrement (jk k) (s k)`,
`|fxs k - f (x k + s k)| ≤ h₀ k` (13.3.2), `|fx k - f (x k)| ≤ h₀ k` (13.3.1),
`¬ R k → ∃ i < k, ¬ acc i ∧ x i + s i = x k ∧ fx k = fxs i` (reuse of `f̄(x_{k-1}+s_{k-1})`), and
`ρ k = (fx k - fxs k) / ΔT̄` (13.3.10). Output at termination: `x_ε = x k`, `δ_ε = δ_k`.
Existence (part of node): for every `C^q` `f` and every oracle as in `algorithm_13_1_1` (with
`κ∇ = 1`) and every value oracle with errors `≤` any requested `h₀ > 0` (e.g. exact values), a run
exists (as for TRqIDA; `h₀ k := κs ΔT̄ > 0`).
'''
deps = ["TRqDAStep", "TRqIDAParams", "Optimization.UntilHit", "Optimization.JetApprox", "Optimization.exists_run_of_forall_exists"]
source = "Cartis–Gould–Toint, Algorithm 13.3.1"

[[node]]
id = "lemma_13_3_1"
kind = "theorem"
desc = '''
Lemma 13.3.1. Let `AssumptionD0qL f q L`, `L_f = Lmax L q`, and a TRqEDA run. If `k ∈ T` is before
termination and (13.1.28) holds with `κ∇max = 1`: `Δ k ≤ min ϑ ((1 - η₂)/(L_f + 4 (q+1)! κs) φ̂ k)`,
then `η₂ ≤ ρ k` and `Δ k ≤ Δ (k+1)`. Proof: (13.3.12) (implied by (13.1.28) since `j_k + 1 ≥ 2`),
`Optimization.le_div_of_inexact_error_le` with value errors `≤ κs ΔT̄` each (absorbing
`2κs ≤ (1-η₂)/2`), (A.19), (13.1.11) and (13.1.27).
'''
deps = ["algorithm_13_3_1", "AssumptionD0qL", "lemma_13_1_2", "Optimization.le_div_of_inexact_error_le", "Optimization.abs_taylorDecrement_sub_le_of_stepAccuracy", "abs_sub_taylorPolynomial_le_of_lipschitz"]
source = "Cartis–Gould–Toint, Lemma 13.3.1"

[[node]]
id = "lemma_13_3_2"
kind = "theorem"
desc = '''
Lemma 13.3.2. Under f.D0qL, for a TRqEDA run and `k ∈ T` before termination, (13.1.34)
`(D k).taylorDecrement (jk k) (s k) ≥ (ς κ_δ)^(q+1)/q! ε_min^(q+1)` holds (with `κ_δ` of Lemma 13.1.4
