[[node]]
id = "explicitAccuracyVerifier"
kind = "definition"
desc = '''
Define VERIFY exactly from the source conditions (13.3.1)–(13.3.2): input absolute bounds on the approximate tensor errors, requested absolute/relative accuracy and trial decrement; return relative, absolute, or insufficient accuracy only after the corresponding finite sum of error bounds passes its test. The truth of the Taylor-error estimate is a theorem, not an assumed verifier field.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 13.3"
deps = ["implicitAccuracyOracle"]

[[node]]
id = "trqedaRun"
kind = "definition"
desc = '''
Algorithm 13.3.1: the explicit-accuracy variant of TRqIDA with VERIFY decisions, ω choice (13.3.3), inexact function evaluations satisfying (13.3.4), and the full absolute/relative/insufficient branches in Steps 1–5. Function values in the acceptance numerator are approximate; convergence and true decrease must be derived using their certified errors.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 13.3"
deps = ["explicitAccuracyVerifier", "trqidaRun"]

[[node]]
id = "arqpedaRun"
