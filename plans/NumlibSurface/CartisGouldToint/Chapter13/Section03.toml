[[node]]
id = "eda_radius_inequality"
kind = "theorem"
desc = '''
EDA replacement for Lemmas 13.1.16–13.1.17 (not a numbered item; see the module description).
Under f.D0pL, for an ARqpEDA run with `RadiiControl` and `θ < ς/2`, let `k ∈ S` with `‖s k‖ < 1` and
`k + 1` before termination such that Step 1 at `k+1` does not pass at all orders with unchanged radii
(i.e. not [branch (a) at `k+1` and `δ₁ (k+1) = δ (k+1)`]). Then there is `j ∈ Icc 1 q` with
`(ς/2 - θ) ε j (δ (k+1) j)^j / j! ≤ (L p + σmax + 4 κs) ∑ ℓ ∈ Icc 1 j, (δ (k+1) j)^ℓ/ℓ! *
‖s k‖^(p - ℓ + 1)`, `δ (k+1) = δs k`; consequently the step bounds (13.1.80) hold with `1 - θ`
replaced by `ς/2 - θ` and `3κ_{∇,max}κs` by `4κs`.
Proof: the first order `j` at which Step 1 at `k+1` halves or branches to Step 2 has a witness
`d₀ ∈ B(δ_{k+1,j})` with `ΔT̄_j(x_{k+1},d₀) > ς ε_j δ^j/(2 j!)` (`ARqpDAStep`), so
`φ̄^δ_j(x_{k+1}) > ς ε_j δ^j/(2 j!)`; `h_{k+1} = h_k` and (13.1.46) at `s_k` give
`φ^δ_j(x_{k+1}) > ς ε_j δ^j/(2 j!) - κs ∑_ℓ δ^ℓ/ℓ! ‖s_k‖^{p-ℓ+1}`
(`Optimization.taylorMeasure_le_add_of_jetApprox`); then
`Optimization.radius_inequality_of_measure_gt` with `a = ς/2`, `κ = 1`, and
`Optimization.pow_ge_of_measure_ineq` and `Optimization.MeasureIneq.div_le_of_le` (`B = 0`).
'''
deps = ["algorithm_13_3_2", "lemma_13_3_5", "Optimization.taylorMeasure_le_add_of_jetApprox", "Optimization.radius_inequality_of_measure_gt", "Optimization.pow_ge_of_measure_ineq", "Optimization.MeasureIneq.div_le_of_le"]
source = "Cartis–Gould–Toint, Section 13.3.2 (Lemmas 13.1.16–13.1.17 \"continue to hold\")"

[[node]]
id = "lemma_13_3_7"
kind = "theorem"
desc = '''
Lemma 13.3.7 (corrected hypotheses). Under f.D0pL, for an ARqpEDA run with `RadiiControl` and
`θ < ς/2`, and `k ∈ S` before termination such that `‖s k‖ ≥ 1` or Step 1 at `k+1` does not pass at all
orders with unchanged radii: `(D k).taylorDecrement p (s k) ≥ κ'_Δm * min_j ε j ^ π j` and
`f (x k) - f (x (k+1)) ≥ η₁ κ'_Δm / 2 * min_j ε j ^ π j`, where `κ'_Δm` is `κ_Δm` of Lemma 13.1.18 with
`ς/2 - θ` for `1 - θ`, `4 κs` for `3 κ∇max κs`, and `σmax` of Lemma 13.3.5. The remaining successful
iterations are followed by an accuracy-improving iteration at which (13.3.17) fails, hence (Lemma
13.3.6 (ii)) `h_{k+1,max} > ς κ_δ1(σmax)^q ε_min^{q+1}/(4 q!)`.
Correction: the book asserts (13.1.82)–(13.1.83) for every `k ∈ T` before termination by referring to
Lemma 13.1.18, whose proof needs `x_{k+1}` not approximately optimal (see the module description).
Proof: `eda_radius_inequality`, Lemma 13.1.13, `Optimization.sub_ge_of_inexact_ratio` (`κs ≤ η₁/4`).
'''
deps = ["eda_radius_inequality", "lemma_13_1_13", "lemma_13_3_5", "lemma_13_3_6_ii", "Optimization.le_sigma_of_arUpdate", "Optimization.sub_ge_of_inexact_ratio"]
source = "Cartis–Gould–Toint, Lemma 13.3.7"

[[node]]
id = "theorem_13_3_8_i"
kind = "theorem"
desc = '''
Theorem 13.3.8, case `q ∈ {1,2}` (corrected). Let `AssumptionD0pL f p L`, `AssumptionBb f flow`,
`ε j ∈ Ioc 0 1`, and `θ < ς/2`. For every ARqpEDA run with `RadiiControl` at every iteration there is
`kε` with `IsFirstHit edaStopAR kε`, `x kε` an `(ε, δ₁ kε)`-approximate `q`-th order minimizer
(Lemma 13.3.6 (i); the book's "`φ^1_{f,j}(x_ε) ≤ ε_j/j!`" is corrected to radii `δ₁ kε ∈ (0,1]^q` as in
Theorem 13.1.19), and with `N = (f x₀ - flow) / (η₁ κ'_Δm / 2 · min_j ε j^((p+1)/(p-j+1)))`,
`M = κ^E |log ε_min| + κ^F + 1` (bound on the accuracy-improving iterations, `κ_acc` of Theorem 13.1.19
with `κ∇max = 1` and `σmax` of Lemma 13.3.5), `c = 1 + |log γ₁|/log γ₂`:
`edaFunEvalCount kε ≤ 2 ((N + M + 1) c + log (σmax/σ₀)/log γ₂)` and
`derivEvalCount (S ∨ A) kε ≤ N + 2 M + 2`. Both are `O(max_j ε_j^{-(p+1)/(p-j+1)})` (the `M` terms are
`O(|log ε_min|)`), the order claimed by the book; the book's explicit constants
(`κ^A_EDA = 2κ^A_IDA`, …) rest on the gap described in the module description.
Proof: successes before `kε` are bounded by `N` (Lemma 13.3.7, telescoping) plus the number of
accuracy-improving iterations (`≤ M`) plus one; trials by Lemma 13.1.9 with Lemma 13.3.5;
`Optimization.card_accuracyImproving_le` (Lemmas 13.1.12 (4), 13.3.6 (ii));
`Optimization.exists_firstHit_le_of_dynamicAccuracy`.
'''
