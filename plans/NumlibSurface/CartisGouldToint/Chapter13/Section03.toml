[[node]]
id = "theorem_13_3_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 13.3.8: qth-order complexity for the ARqpEDA algorithm


Suppose that f.D0pL and f.Bb hold. Suppose also that the algorithm ensures that
(13.1.69) and (13.1.70) hold.
   1. If \( q \in  \{ 1,2\} \) ,then there exist positive constants \( {\kappa }_{\text{ ARqpEDA,1 }}^{S},{\kappa }_{\text{ ARqpEDA,1 }}^{A},{\kappa }_{\text{ ARqpEDA }}^{C} \) ,
     \( {\kappa }_{\text{ ARqpEDA }}^{E} \) ,and \( {\kappa }_{\text{ ARqpEDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpEDA algorithm
     requires at most
                     \[{\# }_{\mathrm{{ARqpEDA}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},1}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + {\kappa }_{\mathrm{{ARqpEDA}} }^{C}\]


                             \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

     evaluations of \( \bar{f} \) and at most
        \[{\# }_{\text{ ARqpEDA },1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\text{ ARqpEDA },1}^{S}\underset{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\underbrace{\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{p + 1}}} + {\kappa }_{\text{ ARqpEDA }}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\text{ ARqpEDA }}^{F}\]


                 \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

     evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to ter-
     minate with an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f,j}^1\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
   2. If \( q > 2 \) ,then there exist positive constants \( {\kappa }_{\mathrm{ARqpEDA},2}^s,{\kappa }_{\mathrm{ARqpEDA},2}^A,{\kappa }_{\mathrm{ARqpEDA},2}^C \)
     \( {\kappa }_{\text{ ARqpEDA }}^{E} \) ,and \( {\kappa }_{\text{ ARqpEDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpEDA algorithm
     requires at most
                     \[{\# }_{\mathrm{{ARqpEDA}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},2}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{j\left( {p + 1}\right) }{p}}} + {\kappa }_{\mathrm{{ARqpEDA}} }^{C}\]


                             \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\]

     evaluations of \( \bar{f} \) and at most
        \[{\# }_{\mathrm{{ARpqEDA}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},2}^{S}\underset{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\underbrace{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}} + {\kappa }_{\mathrm{{ARqpEDA}}}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\mathrm{{ARqpEDA}}}^{F}\]


                 \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\]

     evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to termi-
     nate with an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f,j}^{{\delta }_{\epsilon ,j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon ,j}^j/j \) ! for some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \)
     and for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .


Documented source/OCR correction and formalization requirements: OCR repair: in the derivative-evaluation bounds, restore denominator min_j ε_j^((p+1)/(p−j+1)) in case q≤2 and min_j ε_j^(j(p+1)/p) in case q>2. The OCR underbrace lines lost these denominators; the following O-expressions and IDA analogue specify them. Preserve the logarithmic accuracy-improvement terms.
