(from `Optimization.sub_ge_of_inexact_ratio`, `κs ≤ η₁/4`).
'''
deps = ["algorithm_13_3_1", "lemma_13_3_1", "lemma_13_1_4", "lemma_13_1_5", "Optimization.sub_ge_of_inexact_ratio"]
source = "Cartis–Gould–Toint, Lemma 13.3.2"

[[node]]
id = "lemma_13_3_3_i"
kind = "theorem"
desc = '''
Lemma 13.3.3 (i). If the Step-1 data at iteration `k` satisfy (13.3.6), Step 1 passes at all orders
and (13.3.8) holds (i.e. `edaStopTR k`), with `JetApprox (ftaylorSeries ℝ f (x k)) (D k) q (h k)`,
then `IsEpsDeltaApprox (ftaylorSeries ℝ f (x k)) univ q ε (fun _ => δ_k)`: `x_k` is an
`(ε, δ_k)`-approximate `q`-th order minimizer. Proof: `∑_{i ≤ j} h_i δ^i/i! ≤ ς ε_min δ^q/(2 q!) ≤
ς ε_j δ^j/(2 j!)` (`δ ≤ 1`), then `Optimization.taylorMeasure_le_of_inexact_certificate`.
(Typo in the source proof: `δ_k^2` for `δ_k^j`.)
'''
deps = ["algorithm_13_3_1", "Optimization.taylorMeasure_le_of_inexact_certificate"]
source = "Cartis–Gould–Toint, Lemma 13.3.3 (i)"

