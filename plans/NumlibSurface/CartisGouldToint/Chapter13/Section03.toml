[[node]]
id = "lemma_13_3_6"
wrong = "The literal printed-cap assertion is false for a complete actual 383-iteration IDA and EDA execution. Formal arqpedaPassingCheckCounterexample: p=q=3, epsilon_j=1/2, zeta=1/2, theta=9/10, kappa_s=1/16, known error bound=1, H=2^80, sigma0=sigmaMin=H, gamma3=H, initial error cap=2H. The globally smooth objective f(x)=(G-1)x+sin(x)+B(1-cos(x)), G=2^(-300), B=16/H^2, has all zeroth-through-third derivative Lipschitz constants three. The initial ghost jet (-H,B,-1) admits a large rejected step2, legally increasing sigma to H^2; the reused ghost then forces a short accuracy-only step. Subsequent computed jets (0,B,-1) have globally nonnegative regularized models and actual passing ordered checks with positive third radius delta<=4B. Accuracy halvings reach G at iteration382, which satisfies the exact printed13.1.78 threshold: sigmaMax=48H, kappaDelta^(1)=1/(2560H). Nevertheless actual true third criticality exceeds epsilon_3 delta^3/3!, and the actual EDA finite verification budget fails, so Step1 branches to Step5. Both complete Run proofs include actual Step1/Step2 computations, every oracle bound, both function evaluations, rejection, jet reuse, all parameter/radius/accuracy updates, and the final exact refresh. This refutes the literal sufficient condition; corrected companions using a genuine parameter cap and the valid clause13.3.6(i) remain proved. It does not refute an existential complexity or termination statement."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.3.6: The outcome of Step 1.5 of the ARqpEDA algorithm

(i) Suppose that (13.3.17) holds. Then \( {x}_k \) is an \( \left( {\epsilon ,{\delta }_k}\right) \) -approximate qth-order minimizer.

(ii) Additionally, suppose that f.D0pL holds. If (13.1.78) holds with the choice (13.3.3), \( {\sigma }_{\max } \) as defined in (13.1.77), and \( {\kappa }_{\delta }^{\left( 1\right) }\left( \sigma \right) \) as in (13.1.72), then the ARqpEDA algorithm terminates in Step 1.5.1 rather than branching to Step 5 via Step 1.5.2.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.3.6 (OCR Markdown line 15377)"
deps = ["arqpedaRun"]

[[node]]
id = "lemma_13_3_7"
wrong = "The literal fixed constants are false for an actual full 125-iteration IDA and EDA Run. Formal arqpedaPrintedDecreaseCounterexample: f=sin, p=q=1, all zeroth/first derivative Lipschitz constants=1, lower bound=-1, epsilon=1/2, zeta=1/2, theta=9/10, kappa_s=1/16, known error bound=1, initial derivative cap=2^40, sigma0=sigmaMin=1, eta1=1/4, eta2=3/4, gamma1=1/2, gamma2=2, gamma3=3. Forty legal rejected large global-model steps increase sigma to 2^40; 84 legal accuracy-only iterations make the final exact short global-model minimizer admissible. Its accepted step and computed decrement equal 2^(-40), while all true criticality tests fail at all produced points. The exact printed 13.1.77 cap is 30, so the printed 13.1.79 coefficient is 499/16. The actual step violates 13.1.79/80 and both computed and true decreases violate 13.1.82/83. Both complete operational Run proofs include every Step1/Step2 check, oracle bound, derivative reuse, function request, ratio and update. Corrected companions with the genuine cap remain valid; this finite example does not refute existential complexity theorems."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.3.7: Model and function decreases (ARqpEDA)

Suppose that f.D0pL holds. Then the model decrease (13.1.82) holds, with the choice (13.3.3), for every iteration \( k \in  \mathcal{T} \) of the ARqpEDA algorithm before termination. If, in addition, \( k \in  \mathcal{S} \) , then (13.1.83) holds as well.


Coverage note: the literal fixed-coefficient result is refuted by the actual finite counterexample below. Coarse unconditional stopping and effective-margin sharper-rate companions remain valid.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.3.7 (OCR Markdown line 15423)"
deps = ["lemma_13_3_5", "lemma_13_1_18"]

[[node]]
id = "theorem_13_3_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 13.3.8: qth-order complexity for the ARqpEDA algorithm


Suppose that f.D0pL and f.Bb hold. Suppose also that the algorithm ensures that
(13.1.69) and (13.1.70) hold.
   1. If \( q \in  \{ 1,2\} \) ,then there exist positive constants \( {\kappa }_{\text{ ARqpEDA,1 }}^{S},{\kappa }_{\text{ ARqpEDA,1 }}^{A},{\kappa }_{\text{ ARqpEDA }}^{C} \) ,
     \( {\kappa }_{\text{ ARqpEDA }}^{E} \) ,and \( {\kappa }_{\text{ ARqpEDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpEDA algorithm
     requires at most
                     \[{\# }_{\mathrm{{ARqpEDA}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},1}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + {\kappa }_{\mathrm{{ARqpEDA}} }^{C}\]


                             \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

     evaluations of \( \bar{f} \) and at most
        \[{\# }_{\text{ ARqpEDA },1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\text{ ARqpEDA },1}^{S}\underset{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\underbrace{\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{p + 1}}} + {\kappa }_{\text{ ARqpEDA }}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\text{ ARqpEDA }}^{F}\]


                 \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

     evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to ter-
     minate with an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f,j}^1\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
   2. If \( q > 2 \) ,then there exist positive constants \( {\kappa }_{\mathrm{ARqpEDA},2}^s,{\kappa }_{\mathrm{ARqpEDA},2}^A,{\kappa }_{\mathrm{ARqpEDA},2}^C \)
     \( {\kappa }_{\text{ ARqpEDA }}^{E} \) ,and \( {\kappa }_{\text{ ARqpEDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpEDA algorithm
     requires at most
                     \[{\# }_{\mathrm{{ARqpEDA}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},2}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{j\left( {p + 1}\right) }{p}}} + {\kappa }_{\mathrm{{ARqpEDA}} }^{C}\]


                             \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\]

     evaluations of \( \bar{f} \) and at most
        \[{\# }_{\mathrm{{ARpqEDA}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpEDA}},2}^{S}\underset{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\underbrace{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}} + {\kappa }_{\mathrm{{ARqpEDA}}}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\mathrm{{ARqpEDA}}}^{F}\]


                 \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\]

     evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to termi-
     nate with an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f,j}^{{\delta }_{\epsilon ,j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon ,j}^j/j \) ! for some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \)
     and for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .


Documented source/OCR correction and formalization requirements: OCR repair: in the derivative-evaluation bounds, restore denominator min_j ε_j^((p+1)/(p−j+1)) in case q≤2 and min_j ε_j^(j(p+1)/p) in case q>2. The OCR underbrace lines lost these denominators; the following O-expressions and IDA analogue specify them. Preserve the logarithmic accuracy-improvement terms.


Coverage note: the unrestricted original sharper-rate/fixed-coefficient result remains open. Literal stopping and all initialized evaluation counts are proved without an extra theta-versus-zeta margin by theorem_13_3_8_current_check, with the explicitly coarser epsilon_min^(-(q+1)) rate from current Step1 reference decrease. The effective-margin companion separately retains the sharper source rates under theta<zeta/2. Corrected guarded caps and safe radius coefficients remain explicit; no printed-cap result is assumed.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 13.3.8 (OCR Markdown line 15449)"
deps = ["lemma_13_3_6", "lemma_13_3_7", "theorem_13_1_19"]

