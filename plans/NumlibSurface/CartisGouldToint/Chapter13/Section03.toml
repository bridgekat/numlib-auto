[[node]]
id = "theorem_13_3_4"
kind = "theorem"
desc = '''
Theorem 13.3.4 (TRqEDA complexity). Let `AssumptionD0qL f q L`, `AssumptionBb f flow`,
`ε j ∈ Ioc 0 1`. For every TRqEDA run there is `kε` with `IsFirstHit edaStopTR kε`, `x kε` an
`(ε, δ_kε)`-approximate `q`-th order minimizer (Lemma 13.3.3 (i)), and
`edaFunEvalCount kε ≤ 2 κ^A (f x₀ - flow)/ε_min^(q+1) + 2 κ^B |log ε_min| + 2 κ^C`,
`derivEvalCount (S ∨ A) kε ≤ κ^A (f x₀ - flow)/ε_min^(q+1) + κ^E |log ε_min| + κ^F + 2`,
with the constants of Theorem 13.1.8 for `κ∇max = 1` (`κ_acc = min (ς^(q+1)κ_δ^q/(4 q!))
(κs (ς^(q+1) κ_δ^q/(4 q! Lbar))^q)`, `Lbar = L_f + κh`). Bounds `O(ε_min^{-(q+1)})`; sharp in order
by Theorem 12.2.6 (TRq with exact values is a TRqEDA run).
Corrections: the OCR constants `κ^B_TRqEDA = 6!/(2!2!) · 2κ^B`, `κ^C = 6!/2 · 2κ^C` are garbled; the proof
gives the factor 2 only (at most two value evaluations per trial iteration). Derivative count `+ 2` as
in Theorem 13.1.8; conclusion `φ^{δ_ε}_{f,q}` is `φ^{δ_ε}_{f,j}`.
Proof: as Theorem 13.1.8 with Lemmas 13.3.2, 13.1.1, 13.1.4, 13.1.6 and 13.3.3 (ii) (an
accuracy-improving iteration before termination has large `h`).
'''
deps = ["lemma_13_3_2", "lemma_13_3_3_i", "lemma_13_3_3_ii", "lemma_13_1_1", "lemma_13_1_4", "lemma_13_1_6", "theorem_13_1_8", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.card_mul_le_of_decrease", "Optimization.card_accuracyImproving_le", "Optimization.exists_firstHit_le_of_dynamicAccuracy"]
source = "Cartis–Gould–Toint, Theorem 13.3.4"

