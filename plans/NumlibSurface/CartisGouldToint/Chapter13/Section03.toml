wrong = "The printed coefficient omits the initial request cap on large steps, where Step 2 skips its relative tensor-accuracy check. The formal arqpedaPrintedBoundCounterexample has p=q=1, zero objective, computed derivative -1000, accuracy cap 1000, kappa_s=1/16, sigma_0=32, exact model minimizer s=125/4, exact objective values with positive error request 1 and ratio zero. A legal update gives sigma_1=64, exceeding the printed bound 32. Corrected lemma_13_3_5_corrected retains the short-step guard and replaces kappa_s by max(kappa_s,kappa_h); lemma_13_3_5_of_cap_le restores the printed bound under explicit kappa_h<=kappa_s. The final Step 2 index range 1:q is repaired to 1:p as required by referenced equation13.1.46."

[[node]]
id = "lemma_13_3_6"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.3.6: The outcome of Step 1.5 of the ARqpEDA algorithm

Clause(i) is implemented separately as lemma_13_3_6_optimality. The complete numbered result remains open: clause(ii) still needs a genuine solver/radius-history proof, including the radius floor from13.1.12. The explicit-floor budget transfer lemmas do not supply that operational prerequisite.

(i) Suppose that (13.3.17) holds. Then \( {x}_k \) is an \( \left( {\epsilon ,{\delta }_k}\right) \) -approximate qth-order minimizer.

(ii) Additionally, suppose that f.D0pL holds. If (13.1.78) holds with the choice (13.3.3), \( {\sigma }_{\max } \) as defined in (13.1.77), and \( {\kappa }_{\delta }^{\left( 1\right) }\left( \sigma \right) \) as in (13.1.72), then the ARqpEDA algorithm terminates in Step 1.5.1 rather than branching to Step 5 via Step 1.5.2.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.3.6 (OCR Markdown line 15377)"
deps = ["arqpedaRun"]

