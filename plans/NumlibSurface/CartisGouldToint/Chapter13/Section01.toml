[[node]]
id = "ARqpDAStep"
kind = "def"
desc = '''
One iteration of Steps 1, 2, 4 and 5 of Algorithm 13.1.2, shared by ARqpIDA and ARqpEDA.
Sequences: `x s : ℕ → E`, `σ ρ : ℕ → ℝ`, radii `δ δ₁ δs : ℕ → ℕ → ℝ` (`δ k = δ^{(0)}_k` at the start
of Step 1 (13.1.60), `δ₁ k = δ^{(1)}_k` at its end (13.1.61), `δs k = δ_{s_k}`), `h : ℕ → ℕ → ℝ`,
`D : ℕ → FormalMultilinearSeries ℝ E ℝ`, `dd : ℕ → ℕ → E`, `jk : ℕ → ℕ`, `acc : ℕ → Prop`; model
`m̄_k := regularizedModel (D k) p (σ k)`, `Δm̄_k v := m̄_k 0 - m̄_k v`, `ΔT̄ j v := (D k).taylorDecrement j v`.
* Step 1 radii (halving loop, Steps 1.1–1.4): for `j ∈ Icc 1 q`, `0 < δ₁ k j ≤ δ k j`, and if
  `δ₁ k j < δ k j` then `2 δ₁ k j ≤ δ k j` and there is `d' ∈ closedBall 0 (2 δ₁ k j)` with
  `ΔT̄ j d' > ς ε j (2δ₁ k j)^j / j! / 2` and `Δm̄_k d' < ς ε j (2δ₁ k j)^j / j! / 4` (witness of the
  last halving: both (13.1.53) and (13.1.54) failed at radius `2 δ₁`), and there is
  `d₀ ∈ closedBall 0 (δ k j)` with `ΔT̄ j d₀ > ς ε j (δ k j)^j / j! / 2` (witness of the first halving:
  (13.1.53) failed at the original radius; needed for the EDA step-length argument in §13.3);
* (13.1.52) `∀ j ∈ Icc 1 q, dd k j ∈ closedBall 0 (δ₁ k j) ∧ ς * taylorMeasure (D k) j (δ₁ k j) univ
  ≤ ΔT̄ j (dd k j)`; `pass j := ΔT̄ j (dd k j) ≤ ς ε j (δ₁ k j)^j / j! / 2` (13.1.53); either
  (a) `∀ j ∈ Icc 1 q, pass j` and `acc k` (Step 1 → Step 5), or
  (b) `jk k ∈ Icc 1 q`, `¬ pass (jk k)`, `pass j` for `j < jk k`, `δ₁ k j = δ k j` for `j > jk k`,
  (13.1.54) `Δm̄_k (dd k (jk k)) ≥ ς ε (jk k) (δ₁ k (jk k))^(jk k) / (jk k)! / 4`; Step 2:
  (13.1.55) `Δm̄_k (s k) ≥ Δm̄_k (dd k (jk k))`, and either (13.1.56) `1 ≤ ‖s k‖ ∧ δs k = δ₁ k`, or
  (13.1.57) `∀ ℓ ∈ Icc 1 q, δs k ℓ ∈ Ioc 0 1 ∧ ∃ dm ∈ closedBall 0 (δs k ℓ),
  ς * taylorMeasure (ftaylorSeries ℝ m̄_k (s k)) ℓ (δs k ℓ) univ ≤
  (ftaylorSeries ℝ m̄_k (s k)).taylorDecrement ℓ dm ≤ ς θ ε ℓ (δs k ℓ)^ℓ / ℓ!`; and
  `acc k ↔ (‖s k‖ < 1 ∧ ∃ i ∈ Icc 1 p, κs * ‖s k‖^(p - i + 1) < h k i)`;
* (Steps 3–4, `¬ acc k`) `x (k+1) = if η₁ ≤ ρ k then x k + s k else x k`,
  `δ (k+1) = if η₁ ≤ ρ k ∧ ‖s k‖ < 1 then δs k else δ₁ k`,
  `ARUpdate η₁ η₂ γ₁ γ₂ γ₃ σmin (ρ k) (σ k) (σ (k+1))` ((13.1.59) = (2.4.4)), `h (k+1) = h k`,
  `ρ k < η₁ → D (k+1) = D k`;
* (Step 5, `acc k`) `x (k+1) = x k`, `δ (k+1) = δ k`, `σ (k+1) = σ k`, `h (k+1) i = γh * h k i`.
Source fix: Step 2 tests (13.1.46) for `i ∈ [1:q]`, but (13.1.46) and Step 5 concern `i ∈ [1:p]`, and
the proofs of Lemmas 13.1.14 and 13.1.16 need all `i ∈ [1:p]` (else the derivatives of orders
`q+1..p` are uncontrolled); the predicate uses `[1:p]`.
Radii control (the hypothesis "the algorithm ensures (13.1.69)–(13.1.70)" of Theorem 13.1.19), a
separate predicate `RadiiControl Lbar k := ¬ acc k → ‖s k‖ < 1 → (∀ j ∈ Icc 1 (min 2 q),
δs k j = 1) ∧ ∀ j ∈ Icc 3 q, ς θ ε j / (24 max Lbar (σ k)) ≤ δs k j`, is part of this node.
'''
deps = ["ARqpIDAParams", "Optimization.regularizedModel", "Optimization.taylorMeasure", "Optimization.ARUpdate", "FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, Algorithm 13.1.2, (13.1.60)–(13.1.61), (13.1.69)–(13.1.70)"

[[node]]
