namespace = "CartisGouldToint"

# Planning conventions for the remaining declarations:
# Implicit dynamic accuracy for high-order trust-region and regularization algorithms. Documented source repairs for Lemmas 13.1.1 and 13.1.9: count a half-open prefix of N updates and use the terminal parameter at N. An inclusive source count T_k corresponds to N=k+1 and terminal index k+1; the printed terminal index k is off by one. Algorithm 13.1.1 initialization accidentally gives regularization-factor ranges, while its trust-region update and proof require 0<gamma1<=gamma2<1<=gamma3. The Lean trace records use these trust-region ranges and the exact capped interval update. Accuracy-improving steps leave the radius/regularization parameter unchanged. f.D0rL means C^r with every derivative order 0,…,r globally Lipschitz (including f itself); Lf is the maximum of their constants, all ≥1. Approximate tensors obey ||Dbar^i f−D^i f||≤κ_(∇,i) h_(k,i); unknown positive κ_(∇,i) are fixed oracle constants. Accuracy parameters decrease geometrically in Step 5. Count T (ordinary trial) and A (accuracy-improvement) iterations separately; S contains successful trial iterations. The true Taylor criticality, rather than the approximate tensor model alone, must satisfy the final certificate.

[[node]]
id = "implicitAccuracyOracle"
kind = "definition"
desc = '''
For order r≥1 an implicit-accuracy derivative oracle returns symmetric tensors Dbar^i f(x) at requested h_i>0 with ||Dbar^i f(x)−D^i f(x)||≤κ_(∇,i)h_i for fixed unknown κ_(∇,i)>0. Define the approximate Taylor polynomial/decrement from these actual tensors, including the degree-zero convention. Accuracy updates h_(k+1,i)≤γh h_(k,i), 0<γh<1, are part of the algorithm.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 13.1"
deps = []

