namespace = "CartisGouldToint.Chapter13"
desc = '''
§13.1 Inexact algorithms using implicit dynamic accuracy (IDA): the trust-region method TRqIDA
(Algorithm 13.1.1) and the adaptive-regularization method ARqpIDA (Algorithm 13.1.2), with exact
function values and inexact derivatives satisfying (13.1.2) `‖∇̄^i f(x_k) - ∇^i f(x_k)‖ ≤ κ_{∇,i}
h_{k,i}` for constants `κ_{∇,i} ≥ 0` unknown to the algorithm and requested accuracies `h_{k,i}`
controlled by it. IDA methods have no termination rule: complexity theorems bound the evaluations
needed until the first iterate that is (truly) approximately optimal.

Design.
* The inexact derivatives are part of the run: `D : ℕ → FormalMultilinearSeries ℝ E ℝ` with
  `Optimization.JetApprox (ftaylorSeries ℝ f (x k)) (D k) r (fun i => κ∇ i * h k i)` (`r = q` for TR,
  `p` for AR), `κ∇ : ℕ → ℝ` the oracle's (unknown) constants, `κ∇max = max_{i ∈ Icc 1 r} κ∇ i`. After an
  unsuccessful iteration the jet is reused (`D (k+1) = D k`), so the derivative-count convention
  "once per successful or accuracy-improving iteration" is honest.
* One iteration of Steps 1, 2, 4, 5 is the predicate `TRqDAStep` (resp. `ARqpDAStep`), given the
  value `ρ k` of the ratio; IDA runs (`algorithm_13_1_1`, `algorithm_13_1_2`) add the exact-value
  ratio `ρ k = Optimization.reductionRatio f (x k) (s k) (ΔT̄)` at every iteration, EDA runs (§13.3)
  add inexact values and termination. Lemmas 13.1.1, 13.1.2, 13.1.4, 13.1.6, 13.1.9–13.1.13,
  13.1.16–13.1.17 are stated for sequences satisfying the `…DAStep` predicates (so §13.3 reuses them
  verbatim, as the book does); lemmas mentioning `ρ`'s formula are stated for IDA runs.
* Step 1 records displacements `dd k j` for **all** `j ∈ Icc 1 q` (the book computes them only up to
  the first failing order `j_k`; any book run extends to a run of the predicate, since admissible
  displacements always exist). This makes the Step-1 outcome a function of the run data.
* Termination tests: TR: `trTest k := IsEpsDeltaApprox (ftaylorSeries ℝ f (x k)) univ q ε
  (fun _ => min (Δ k) ϑ)`; AR: `arTest k := ∃ δ', (∀ j ∈ Icc 1 q, δ' j ∈ Ioc 0 1) ∧
  IsEpsDeltaApprox (ftaylorSeries ℝ f (x k)) univ q ε δ'` (existential radius, see theorem_13_1_19_i).
* Constants are written out explicitly in the nodes (the book's `κ_Δ, κ_δ, κ^S, …`); the Lean files
  should introduce them as `noncomputable def`s with the same names (unplanned helpers).
'''

[[node]]
id = "AssumptionD0qL"
kind = "def"
desc = '''
f.D0qL: `AssumptionD0qL (f : E → ℝ) (q : ℕ) (L : ℕ → ℝ) : Prop := ContDiff ℝ q f ∧ ∀ j ≤ q,
1 ≤ L j ∧ IteratedFDerivLipschitzOn f j (L j) univ` (all derivatives of orders `0..q`, including `f`
itself, are Lipschitz with constants `L_{f,j} ≥ 1`). The maximal constant (13.1.23)
`Lmax L q := (Finset.range (q + 1)).sup' _ L` (`≥ 1`) is part of this node. f.D0pL is the same
predicate with `p` (`AssumptionD0pL`). Consequence used throughout ((13.1.24) via Theorem A.8.5):
`‖iteratedFDeriv ℝ i f x‖ ≤ L (i - 1)` for `i ∈ Icc 1 q`.
'''
deps = ["IteratedFDerivHolderOn", "norm_iteratedFDeriv_succ_le_of_lipschitzOn"]
source = "Cartis–Gould–Toint, Assumption f.D0qL, (13.1.23)"

[[node]]
id = "AssumptionD0pL"
kind = "def"
desc = '''
f.D0pL: `AssumptionD0pL f p L := AssumptionD0qL f p L` (abbreviation; `L_f = Lmax L p`, used by
ARqpIDA/ARqpEDA).
'''
deps = ["AssumptionD0qL"]
source = "Cartis–Gould–Toint, Assumption f.D0pL"

[[node]]
id = "TRqIDAParams"
kind = "def"
desc = '''
Constants of Algorithm 13.1.1 (Step 0): a structure with `q : ℕ` (`1 ≤ q`), `ϑ Δ₀ Δmax γh κs κh η₁ η₂
γ₁ γ₂ γ₃ ς : ℝ` and `h₀ : ℕ → ℝ` with `ϑ ≤ Δ₀ ≤ Δmax`, `ϑ ≤ 1`, `0 < η₁ ≤ η₂ < 1`,
`0 < γ₁ ≤ γ₂ < 1 < γ₃`, `ς ∈ Ioc 0 1`, `γh ∈ Ioo 0 1`, `0 < κs`, and `0 < h₀ i ≤ κh` for `i ∈ Icc 1 q`.
The tolerance-dependent requirement `ϑ ∈ [ε_min, 1]` is a hypothesis of the run predicate.
Source fix: Step 0 prints `0 < γ₁ < 1 < γ₂ < γ₃` (the regularization convention); the trust-region
update (13.1.17) (`Δ_{k+1} ∈ [γ₁Δ_k, γ₂Δ_k]` on unsuccessful iterations) and the proof of
Lemma 13.1.1 (`γ₂ ∈ (0,1)`) require `γ₁ ≤ γ₂ < 1`, as in TRq (Algorithm 12.2.1).
'''
source = "Cartis–Gould–Toint, Algorithm 13.1.1, Step 0"

[[node]]
id = "phiHat"
kind = "def"
desc = '''
(13.1.25) `phiHat (D : FormalMultilinearSeries ℝ E ℝ) (j : ℕ) (δ : ℝ) (d : E) : ℝ :=
j ! * D.taylorDecrement j d / δ ^ j` (the book's `φ̂_{f,k}` with `D = D k`, `j = j_k`, `δ = δ_k`,
`d = d_k`).
'''
deps = ["FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, (13.1.25)"

[[node]]
id = "TRqDAStep"
kind = "def"
desc = '''
One iteration of Steps 1, 2, 4 and 5 of Algorithm 13.1.1, shared by TRqIDA and TRqEDA.
`TRqDAStep P ε x Δ h D dd jk s acc ρ k : Prop` for sequences `x s : ℕ → E`, `Δ ρ : ℕ → ℝ`,
`h : ℕ → ℕ → ℝ`, `D : ℕ → FormalMultilinearSeries ℝ E ℝ`, `dd : ℕ → ℕ → E`, `jk : ℕ → ℕ`,
`acc : ℕ → Prop`; with `δ k := min (Δ k) P.ϑ`, `ΔT̄ j v := (D k).taylorDecrement j v`:
* (Step 1.1, (13.1.13)) `∀ j ∈ Icc 1 q, dd k j ∈ closedBall 0 (δ k) ∧
  ς * taylorMeasure (D k) j (δ k) univ ≤ ΔT̄ j (dd k j)`;
* (Step 1.2–1.3, (13.1.14)) `fail j := ς * ε j * δ k ^ j / j! / 2 < ΔT̄ j (dd k j)`; either
  (a) `∀ j ∈ Icc 1 q, ¬ fail j` and `acc k` (branch to Step 5), or
  (b) `jk k ∈ Icc 1 q`, `fail (jk k)`, `∀ j ∈ Icc 1 q, j < jk k → ¬ fail j`; then (Step 2, (13.1.15))
  `s k ∈ closedBall 0 (Δ k)`, `ΔT̄ (jk k) (s k) ≥ ΔT̄ (jk k) (dd k (jk k))`, and
  `acc k ↔ ∃ i ∈ Icc 1 q, P.κs * ‖s k‖ ^ (q - i + 1) < h k i` (accuracy test (13.1.9) fails);
* (Steps 3–4, trial iteration, `¬ acc k`) `x (k+1) = if η₁ ≤ ρ k then x k + s k else x k`,
  `TRUpdate η₁ η₂ γ₁ γ₂ γ₃ (ρ k) (Δ k) (Δ (k+1))`, `Δ (k+1) ≤ Δmax`, `h (k+1) = h k`, and
  `ρ k < η₁ → D (k+1) = D k` (no new derivative estimate at an unchanged iterate);
* (Step 5, (13.1.18), `acc k`) `x (k+1) = x k`, `Δ (k+1) = Δ k`, `∀ i, h (k+1) i = γh * h k i`.
The book's shortcut "go to Step 2 with `d_{k+1} = d_k`" after an unsuccessful iteration with
`Δ_{k+1} ≥ ϑ` is covered (`δ`, `x`, `D` are unchanged, so `dd (k+1) = dd k` is admissible).
Iteration classes: `S = {k | ¬ acc k ∧ η₁ ≤ ρ k}`, `U = {k | ¬ acc k ∧ ρ k < η₁}`, `A = acc`, `T = ¬ acc`
(13.1.19)–(13.1.21).
'''
deps = ["TRqIDAParams", "Optimization.taylorMeasure", "Optimization.TRUpdate", "FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, Algorithm 13.1.1, (13.1.19)–(13.1.21)"

[[node]]
id = "algorithm_13_1_1"
kind = "def"
desc = '''
Algorithm 13.1.1 (TRqIDA) as a run predicate `IsTRqIDARun f κ∇ P ε x₀ x Δ h D dd jk s acc`:
admissibility `ε j ∈ Ioc 0 1` for `j ∈ Icc 1 q` and `ε_min ≤ P.ϑ`; `x 0 = x₀`, `Δ 0 = P.Δ₀`,
`h 0 = P.h₀`; oracle (13.1.2) `∀ k, JetApprox (ftaylorSeries ℝ f (x k)) (D k) q (fun i => κ∇ i *
h k i)` with `0 ≤ κ∇ i`; and `∀ k, TRqDAStep P ε x Δ h D dd jk s acc ρ k` with the exact-value ratio
(13.1.16) `ρ k = reductionRatio f (x k) (s k) ((D k).taylorDecrement (jk k) (s k))`.
No termination rule (the book: certifying (12.1.25) is impossible without knowing `κ∇`).
Test of approximate optimality (not observable by the method):
`trTest f q ε x Δ ϑ k := IsEpsDeltaApprox (ftaylorSeries ℝ f (x k)) univ q ε (fun _ => min (Δ k) ϑ)`.
Counts up to iteration `k`: function values `derivEvalCount (fun i => ¬ acc i) k` (initial `f(x₀)`
plus one per trial iteration before `k`), derivative estimates
`derivEvalCount (fun i => acc i ∨ (¬ acc i ∧ η₁ ≤ ρ i)) k`.
Existence (part of node): for every `C^q` function `f`, `κ∇ ≥ 0`, admissible `P`, `ε`, `x₀`, and every
deterministic oracle `O : E → (ℕ → ℝ) → FormalMultilinearSeries ℝ E ℝ` with
`JetApprox (ftaylorSeries ℝ f y) (O y h') q (fun i => κ∇ i * h' i)` for all `y, h'` (e.g. the exact
jet), there is a run with `D k = O (x k) (h k)`: Step-1 displacements from `exists_taylorMeasure_eq`
(`ς ≤ 1`, measure `≥ 0`), `s k = dd k (jk k)` is admissible (`δ k ≤ Δ k`) and has positive predicted
decrease; `exists_run_of_forall_exists`.
'''
deps = ["TRqDAStep", "Optimization.JetApprox", "Optimization.reductionRatio", "Optimization.IsEpsDeltaApprox", "Optimization.funEvalCount", "Optimization.exists_taylorMeasure_eq", "Optimization.exists_run_of_forall_exists"]
source = "Cartis–Gould–Toint, Algorithm 13.1.1"

[[node]]
id = "lemma_13_1_1"
kind = "theorem"
desc = '''
Lemma 13.1.1. For sequences satisfying `TRqDAStep` at every iteration `≤ k` (in particular TRqIDA
runs, and TRqEDA runs before termination), if `Δmin ∈ Ioc 0 Δ₀` and `Δmin ≤ Δ (k+1)` then
`|T_k| ≤ |S_k| (1 + log γ₃ / |log γ₂|) + |log (Δmin / Δ₀)| / |log γ₂|` (13.1.22), where
`T_k = successSet (fun i => ¬ acc i) k`, `S_k = successSet (fun i => ¬ acc i ∧ η₁ ≤ ρ i) k`.
Index fix: the book assumes `Δ_k ≥ Δmin`, but its proof (Appendix B, `Δ_min ≤ Δ_k ≤ Δ₀ γ₃^{|S_k|}
γ₂^{|U_k|}`) needs the radius after iteration `k`, i.e. `Δ_{k+1}`; in all uses the bound holds for
every index. Proof: core counting lemma with neutral iterations (`A`; Lean name
`card_successSet_or_le_of_upper_ratio`).
'''
deps = ["TRqDAStep", "Optimization.succ_le_card_successSet_of_upper_ratio", "Optimization.successSet"]
source = "Cartis–Gould–Toint, Lemma 13.1.1"

[[node]]
id = "lemma_13_1_2"
kind = "theorem"
desc = '''
Lemma 13.1.2. Under `TRqDAStep` at iteration `k` with `k ∈ T` (`¬ acc k`), with
`φ̂ k := phiHat (D k) (jk k) (δ k) (dd k (jk k))`: `φ̂ k ≥ ς ε_min / 2` (hence (13.1.26)
`min_{i ∈ T_k} φ̂ i ≥ ς ε_min / 2` whenever the step predicate holds up to `k`), and (13.1.27)
`(D k).taylorDecrement (jk k) (s k) ≥ φ̂ k * δ k ^ (jk k) / (jk k)!`.
'''
deps = ["TRqDAStep", "phiHat"]
source = "Cartis–Gould–Toint, Lemma 13.1.2"

[[node]]
id = "lemma_13_1_3"
kind = "theorem"
desc = '''
Lemma 13.1.3. Let `AssumptionD0qL f q L`, `L_f = Lmax L q`, and an IDA run (`algorithm_13_1_1`).
If `k ∈ T` and (13.1.28) `Δ k ≤ min ϑ ((1 - η₂) / (L_f + 4 (q+1)! κs κ∇max) * φ̂ k)`, then
`η₂ ≤ ρ k` (very successful) and `Δ k ≤ Δ (k+1)`. Proof: `δ k = Δ k ≤ 1`; error decomposition with
exact values (`Optimization.abs_div_sub_one_le_of_inexact` with `a = f x_k`, `b = f(x_k+s_k)`), (A.19)
at order `j_k`, (13.1.11) (`abs_taylorDecrement_sub_le_of_stepAccuracy`, (13.1.9) holds since
`k ∈ T`), (13.1.27); the printed bound (13.1.28) is stronger than needed (footnote 86).
'''
deps = ["algorithm_13_1_1", "AssumptionD0qL", "lemma_13_1_2", "Optimization.le_div_of_inexact_error_le", "Optimization.abs_taylorDecrement_sub_le_of_stepAccuracy", "abs_sub_taylorPolynomial_le_of_lipschitz"]
source = "Cartis–Gould–Toint, Lemma 13.1.3"

[[node]]
id = "lemma_13_1_4"
kind = "theorem"
desc = '''
Lemma 13.1.4. Let `AssumptionD0qL f q L` and a TRqIDA run. With
`κ_Δ = min 1 (γ₁ (1 - η₂) / (L_f + 4 (q+1)! κs κ∇max)) * min ϑ (Δ₀ * min_{j ∈ Icc 1 q} δ₀^j /
(2 q (max_{i ∈ Icc 1 q} ‖iteratedFDeriv ℝ i f x₀‖ + κ∇max κh)))` ((13.1.31), `δ₀ = min Δ₀ ϑ = ϑ`):
for all `k`, `Δ k ≥ min (γ₁ ϑ) (κ_Δ * min_{i ∈ T_k} φ̂ i)` if `T_k ≠ ∅` and `Δ k ≥ γ₁ ϑ` otherwise
(13.1.30); and `δ k ≥ ς κ_δ ε_min` with `κ_δ = κ_Δ / 2` ((13.1.32)–(13.1.33)).
Remark on the source proof (Appendix B): the bound (B.13.1) on `φ̂_{f,k₀}` drops a factor `j!`
(`2q` should be `2 q!`), but the case `k = k₀` holds trivially (`Δ₀ ≥ ϑ > γ₁ϑ`), and the induction only
uses `κ_Δ ≤ γ₁(1-η₂)/(L_f + 4(q+1)!κsκ∇max)` (the second factor of `κ_Δ` is `≤ ϑ ≤ 1`), so the statement
holds as printed. Proof: `Optimization.le_delta_of_trUpdate_of_neutral` with
`θ_k = min ϑ (κ_Δ/γ₁ · min_{i ∈ T_k} φ̂ i)` (antitone), Lemma 13.1.3, Lemma 13.1.2.
The lemma holds verbatim for TRqEDA (with `κ∇max = 1`), using Lemma 13.3.1 instead of 13.1.3; state the
core as a lemma about `TRqDAStep` sequences with the success condition as a hypothesis.
'''
deps = ["lemma_13_1_3", "lemma_13_1_2", "Optimization.le_delta_of_trUpdate_of_neutral", "norm_iteratedFDeriv_succ_le_of_lipschitzOn"]
source = "Cartis–Gould–Toint, Lemma 13.1.4"

[[node]]
id = "lemma_13_1_5"
kind = "theorem"
desc = '''
Lemma 13.1.5. Under f.D0qL, for every trial iteration `k ∈ T` of a TRqIDA run:
`(D k).taylorDecrement (jk k) (s k) ≥ (ς κ_δ)^(q+1) / q! * ε_min^(q+1)` (13.1.34); if moreover `k ∈ S`
then `f (x k) - f (x (k+1)) ≥ η₁ (ς κ_δ)^(q+1) / (2 q!) * ε_min^(q+1)` (13.1.35) (the `1/2` is not
needed for IDA, footnote 87). No optimality hypothesis is needed. Proof (Appendix B): cases
`Δ_k > ϑ` / `Δ_k ≤ ϑ` with Lemmas 13.1.2, 13.1.4 and `ϑ ≥ ε_min`.
'''
deps = ["lemma_13_1_2", "lemma_13_1_4", "Optimization.sub_le_of_le_reductionRatio"]
source = "Cartis–Gould–Toint, Lemma 13.1.5"

[[node]]
id = "lemma_13_1_6"
kind = "theorem"
desc = '''
Lemma 13.1.6. Under f.D0qL, with `Lbar = L_f + κ∇max κh` ((13.1.24); the book writes `L̄_f` before
defining it in (13.1.63)): if branch (b) of `TRqDAStep` occurs at iteration `k` (of a TRqIDA or
TRqEDA run) and
`h k i ≤ κs * (ς^(q+1) κ_δ^q / (4 q! Lbar))^q * ε_min^(q(q+1))` for all `i ∈ Icc 1 q` (13.1.36), then
the accuracy test (13.1.9) holds, i.e. `¬ acc k` (no branching from Step 2 to Step 5).
Proof: `ΔT̄_{j_k}(s_k) ≤ 2 Lbar ‖s_k‖` for `‖s_k‖ ≤ 1` (sum bound (A.34), `‖D k i‖ ≤ Lbar` by
`Optimization.norm_le_of_jetApprox`), (13.1.32), hence `‖s_k‖ ≥ ς^{q+1}κ_δ^q ε_min^{q+1}/(4 q! Lbar)`
(`≤ 1`), and `‖s_k‖^{q-i+1} ≥ (that)^q`.
'''
deps = ["TRqDAStep", "lemma_13_1_4", "Optimization.norm_le_of_jetApprox", "sum_pow_div_factorial_le_two_mul_pow"]
source = "Cartis–Gould–Toint, Lemma 13.1.6"

[[node]]
id = "lemma_13_1_7"
kind = "theorem"
desc = '''
Lemma 13.1.7. Under f.D0qL, for a TRqIDA run: if branch (a) of Step 1 occurs at iteration `k` and
(13.1.37) `κ∇max * h k i ≤ ς^(q+1) κ_δ^q / (4 q!) * ε_min^(q+1)` for all `i ∈ Icc 1 q` (written
without division so that `κ∇max = 0` is allowed), then `trTest k`:
`taylorMeasure (ftaylorSeries ℝ f (x k)) j (δ k) univ ≤ ε j * δ k ^ j / j!` for all `j ∈ Icc 1 q`.
Proof: `Optimization.taylorMeasure_le_of_inexact_certificate` with (13.1.32) and `ς ≤ 1`
(the extra `ς` in (13.1.37) is for §13.3, footnote 88).
'''
deps = ["algorithm_13_1_1", "lemma_13_1_4", "Optimization.taylorMeasure_le_of_inexact_certificate"]
source = "Cartis–Gould–Toint, Lemma 13.1.7"

[[node]]
id = "theorem_13_1_8"
kind = "theorem"
desc = '''
Theorem 13.1.8 (TRqIDA complexity). Let `AssumptionD0qL f q L`,
`CartisGouldToint.Chapter02.AssumptionBb f flow`, `ε j ∈ Ioc 0 1` (`j ∈ Icc 1 q`). For every TRqIDA run
there is `kε` with `IsFirstHit trTest kε` (so `x_ε = x kε`, `δ_ε = min (Δ kε) ϑ ∈ (0,1]` satisfy
(12.1.25)) and
`derivEvalCount (¬ acc ·) kε ≤ κ^A (f x₀ - flow) / ε_min^(q+1) + κ^B |log ε_min| + κ^C` (13.1.38),
`derivEvalCount (S ∨ A) kε ≤ κ^A (f x₀ - flow) / ε_min^(q+1) + κ^E |log ε_min| + κ^F + 2` (13.1.39),
with `κ^S = 2 q! / (η₁ (ς κ_δ)^(q+1))` (13.1.40), `κ^A = κ^S (1 + log γ₃ / |log γ₂|)`,
`κ^B = 1/|log γ₂|` (13.1.42), `κ^C = |log (ς κ_δ / Δ₀)| / |log γ₂| + 1` (13.1.43),
`κ^E = q(q+1)/|log γh|`, `κ^F = |log (κ_acc / κh)| / |log γh|` (13.1.44),
`κ_acc = min (ς^(q+1) κ_δ^q / (4 q! κ∇max)) (κs (ς^(q+1) κ_δ^q / (4 q! Lbar))^q)` (first term omitted
if `κ∇max = 0`). Both bounds are `O(max_j ε_j^{-(q+1)}) = O(ε_min^{-(q+1)})`.
Corrections: the derivative count includes the initial estimate and the last accuracy-improving
iteration (`|A| ≤ i_{h,ε} + 1`), hence `+ 2` (the book's (13.1.39) has `κ^F`); the conclusion's
`φ^δ_{f,q}` is `φ^δ_{f,j}`. Proof: `|S| ≤ κ^S (f x₀ - flow)/ε_min^{q+1}` (Lemma 13.1.5, telescoping),
`|T|` by Lemma 13.1.1 with `Δmin = ς κ_δ ε_min` (Lemma 13.1.4), `|A|` by
`Optimization.card_accuracyImproving_le` (Lemmas 13.1.6, 13.1.7: an accuracy-improving iteration
before `kε` has `h_max > κ_acc ε_min^{q(q+1)}`), `Optimization.exists_firstHit_le_of_dynamicAccuracy`.
'''
deps = ["lemma_13_1_1", "lemma_13_1_4", "lemma_13_1_5", "lemma_13_1_6", "lemma_13_1_7", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.card_mul_le_of_decrease", "Optimization.card_accuracyImproving_le", "Optimization.exists_firstHit_le_of_dynamicAccuracy", "Optimization.IsFirstHit"]
source = "Cartis–Gould–Toint, Theorem 13.1.8"

[[node]]
id = "ARqpIDAParams"
kind = "def"
desc = '''
Constants of Algorithm 13.1.2 (Step 0, (13.1.51)): `q p : ℕ` with `1 ≤ q ≤ p`, `σ₀ σmin κh κs θ ς η₁
η₂ γ₁ γ₂ γ₃ γh : ℝ`, `δ₀ h₀ : ℕ → ℝ` with `0 < σmin ≤ σ₀`, `0 < η₁ ≤ η₂ < 1`, `0 < γ₁ < 1 < γ₂ < γ₃`,
`γh ∈ Ioo 0 1`, `θ ∈ Ioo 0 1`, `ς ∈ Ioc 0 1` (missing from the book's Step-0 list), `0 < κs`,
`0 ≤ κh`, `δ₀ j ∈ Ioc 0 1` for `j ∈ Icc 1 q`, `0 ≤ h₀ i ≤ κh` for `i ∈ Icc 1 p`. The requirement
