desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.16: A useful inequality for the ARqpIDA algorithm

Suppose that f.D0pL holds. Suppose also that iteration \( k \in  \mathcal{T} \) is successful, that approximate optimality is not achieved at iteration \( k + 1 \) (i.e.,(12.1.25) (p. 285) does not hold), and that \( \begin{Vmatrix}{s}_k\end{Vmatrix} < 1 \) . Then there exists \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\left( {1 - \theta }\right) {\epsilon }_j\frac{{\left( {\delta }_{k + 1, j}^{\left( 0\right) }\right) }^j}{j!} \leq  \left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_s}\right) \mathop{\sum }\limits_{\ell  = 1}^j\frac{{\left( {\delta }_{k + 1, j}^{\left( 0\right) }\right) }^{\ell }}{\ell !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - \ell  + 1},
\]

(13.1.79)

where \( {\sigma }_{\max } \) is given by (13.1.77).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.16 (OCR Markdown line 14566)"
deps = ["lemma_13_1_14"]

[[node]]
id = "lemma_13_1_17"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.17: Lower bound on the length of the step for ARqpIDA

Suppose that f.D0pL holds, that iteration \( k \) is successful, and that approximate optimality is not achieved at iteration \( k + 1 \) . Suppose also that the algorithm ensures that (13.1.69) and (13.1.70) hold. Then there exists a \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\begin{Vmatrix}{s}_{k}\end{Vmatrix} \geq  \left\{  \begin{array}{ll} {\left( \frac{1 - \theta }{{2j}!\left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_{s}}\right) }\right) }^{\frac{1}{p - j + 1}}{\epsilon }_{j}^{\frac{1}{p - j + 1}} & \text{ if }q \in  \{ 1,2\} , \\  {\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{j - 1}}{{2j}!\left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_{s}}\right) }\right) }^{\frac{1}{p}}{\epsilon }_{j}^{\frac{j}{p}} & \text{ if }q > 2, \end{array}\right.
\]

(13.1.80)

where

\[
{\kappa }_{\delta ,\min }\overset{\text{ def }}{ = }\frac{\varsigma \theta }{{24}\max \left\lbrack  {{\bar{L}}_{f},{\sigma }_{\max }}\right\rbrack  }\tag{13.1.81}
\]

and \( {\sigma }_{\max } \) is given by (13.1.77).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.17 (OCR Markdown line 14610)"
deps = ["lemma_13_1_16"]

[[node]]
id = "lemma_13_1_18"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.18: Model and function decreases (ARqpIDA)

Suppose that f.D0pL holds. Then

\[
{\overline{\Delta T}}_{f, p}\left( {{x}_{k},{s}_{k}}\right)  \geq  {\kappa }_{\Delta m}\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{{\pi }_{j}}\tag{13.1.82}
\]

for every iteration \( k \in  \mathcal{T} \) of algorithm ARqpIDA before reaching approximate optimality, where

\[
{\kappa }_{\Delta m}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{1 - \theta }{{2q}!\left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_{s}}\right) }\right) }^{\frac{p + 1}{p - q + 1}} & \text{ if }q \in  \{ 1,2\} , \\  \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{q - 1}}{{2q}!\left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_{s}}\right) }\right) }^{\frac{q\left( {p + 1}\right) }{p}} & \text{ if }q > 2, \end{array}\right.
\]

with \( {\kappa }_{\delta ,\min } \) being given by (13.1.81) and \( {\sigma }_{\max } \) by (13.1.77), and

\[
{\pi }_{j}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{p + 1}{p - j + 1} & \text{ if }q \in  \{ 1,2\} , \\  \frac{j\left( {p + 1}\right) }{p} & \text{ if }q > 2. \end{array}\right.
\]

If, in addition, \( k \in  \mathcal{S} \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  \frac{1}{2}{\eta }_1{\kappa }_{\Delta m}\mathop{\min }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{{\pi }_j}.\tag{13.1.83}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.18 (OCR Markdown line 14632)"
deps = ["lemma_13_1_17"]

[[node]]
id = "theorem_13_1_19"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 13.1.19: qth-order complexity for the ARqpIDA algorithm


Suppose that f.D0pL and f.Bb hold. Suppose also that the algorithm ensures that
(13.1.69) and (13.1.70) hold.
   1. If \( q \in  \{ 1,2\} \) ,then there exist positive constants \( {\kappa }_{\text{ AraplDA,1 }}^{S},{\kappa }_{\text{ AraplDA,1 }}^{A},{\kappa }_{\text{ AraplDA }}^{C} \) ,
      \( {\kappa }_{\text{ ARqpIDA }}^{E} \) ,and \( {\kappa }_{\text{ ARqpIDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpIDA algorithm
      requires at most
                  \[{\# }_{\mathrm{{ARqpIDA}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpIDA}},1}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{kw}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + {\kappa }_{\mathrm{{ARqpIDA}}1}^{C}\] (13.1.84)


                          \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

      evaluations of \( f \) and at most
          \[{\# }_{\mathrm{{ARqpIDA}},1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpIDA}},1}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + {\kappa }_{\mathrm{{ARqpIDA}}1}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\mathrm{{ARqpIDA}}1}^{F}\]


                  \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right)\]

                                                                      (13.1.85)
      evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to pro-
      duce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f,j}^1\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
   2. If \( q > 2 \) ,then there exist positive constants \( {\kappa }_{\mathrm{ARqpIDA},2}^S,{\kappa }_{\mathrm{ARqpIDA},2}^A,{\kappa }_{\mathrm{ARqpIDA},2}^C,{\kappa }_{\mathrm{ARqpIDA},}^E \)
      and \( {\kappa }_{\text{ ARqpIDA }}^{F} \) such that,for any \( \epsilon  \in  (0,1{\rbrack }^q \) ,the ARqpIDA algorithm requires at
      most
                  \[{\# }_{\mathrm{{ARqIDAp}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpIDA}},2}^{A}\underset{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\underbrace{\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{p\left( {p + 1}\right) } + {\kappa }_{\mathrm{{ARqpIDA}} }^{C}}}\] (13.1.86)


                          \[= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\]



evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{ARqIDAp}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpDA}},2}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{j\left( {p + 1}\right) }{p}}} + {\kappa }_{\mathrm{{ARqpIDA}}1}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\mathrm{{ARqpIDA}}1}^{F}
\]

\[
= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right)
\]

(13.1.87)

evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( p \) to produce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^{{\delta }_{\epsilon , j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon , j}^j/j \) ! for some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \) and all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

Documented source/OCR correction and formalization requirements: OCR repair for (13.1.86): the missing denominator is min_(1≤j≤q) ε_j^(j(p+1)/p); the bound is κ_(ARqpIDA,2)^A (f(x0)−f_low)/(min_j ε_j^(j(p+1)/p))+κ^C. This is forced by (13.1.83), the following O-expression, and the derivation immediately after the theorem. Restore f_low for the corrupted f_kw. Keep both function counts and derivative counts including the latter logarithmic accuracy term.
