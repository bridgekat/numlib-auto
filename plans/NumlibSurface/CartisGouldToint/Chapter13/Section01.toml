Lemma 13.1.6: Finite loop in Step 2 of the TRqIDA algorithm

Suppose that f.D0qL holds. Then branching from Step 2 to Step 5 of the TRqIDA algorithm cannot occur if

\[
{h}_{k,\max } \leq  {\kappa }_{s}{\left( \frac{{\varsigma }^{q + 1}{\kappa }_{\delta }^{q}}{{4q}!{\bar{L}}_{f}}\right) }^{q}{\epsilon }_{\min }^{q\left( {q + 1}\right) }.\tag{13.1.36}
\]
'''
