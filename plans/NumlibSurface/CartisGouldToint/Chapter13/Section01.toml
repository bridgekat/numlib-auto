[[node]]
id = "lemma_13_1_14"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.14: Condition for success (ARqpIDA)

Suppose that f.D0pL holds. Then

\[
{\sigma }_{k} \leq  {\sigma }_{\max }\overset{\text{ def }}{ = }\max \left\lbrack  {{\sigma }_{0},{\gamma }_{3}\frac{2{L}_{f, p} + 4\left( {p + 1}\right) !{\kappa }_{s}{\kappa }_{\nabla ,\max }}{1 - {\eta }_{2}}}\right\rbrack\tag{13.1.77}
\]

for all \( k \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.14 (OCR Markdown line 14488)"
deps = ["lemma_13_1_13"]

wrong = "With the literal short-step guard, the printed constant omits the initial request cap. Formal arqpidaPrintedBoundCounterexample: f=0,p=q=1,computed gradient=-1000,cap=1000,stepCoefficient=1,errorBound=1,sigma0=32,eta2=1/2,gamma3=3. The exact computed-model step125/4 is large, so no accuracy check occurs; actual ratio0 allows sigma1=64, exceeding printed max(32,60)=60. The corrected theorem replaces stepCoefficient by max(stepCoefficient,initialCap), retaining the guard. The printed bound has a separate companion under initialCap<=stepCoefficient. The final Step2 index q must also be p to check every derivative required in13.1.46."

[[node]]
id = "lemma_13_1_15"
wrong = "The literal printed-cap assertion is false for a complete actual 383-iteration IDA and EDA execution. Formal arqpidaPassingCheckCounterexample: p=q=3, epsilon_j=1/2, zeta=1/2, theta=9/10, kappa_s=1/16, known error bound=1, H=2^80, sigma0=sigmaMin=H, gamma3=H, initial error cap=2H. The globally smooth objective f(x)=(G-1)x+sin(x)+B(1-cos(x)), G=2^(-300), B=16/H^2, has all zeroth-through-third derivative Lipschitz constants three. The initial ghost jet (-H,B,-1) admits a large rejected step2, legally increasing sigma to H^2; the reused ghost then forces a short accuracy-only step. Subsequent computed jets (0,B,-1) have globally nonnegative regularized models and actual passing ordered checks with positive third radius delta<=4B. Accuracy halvings reach G at iteration382, which satisfies the exact printed13.1.78 threshold: sigmaMax=48H, kappaDelta^(1)=1/(2560H). Nevertheless actual true third criticality exceeds epsilon_3 delta^3/3!, and the actual EDA finite verification budget fails, so Step1 branches to Step5. Both complete Run proofs include actual Step1/Step2 computations, every oracle bound, both function evaluations, rejection, jet reuse, all parameter/radius/accuracy updates, and the final exact refresh. This refutes the literal sufficient condition; corrected companions using a genuine parameter cap and the valid clause13.3.6(i) remain proved. It does not refute an existential complexity or termination statement."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.15: The optimality loop in Step 1 of the ARqpIDA algorithm

Suppose that f.D0pL holds. If

\[
{h}_{k,\max } \leq  \varsigma \frac{{\left( {\kappa }_{\delta }^{\left( 1\right) }\left( {\sigma }_{\max }\right) \right) }^q}{{4q}!{\kappa }_{\nabla ,\max }}{\epsilon }_{\min }^{q + 1},\tag{13.1.78}
\]

then branching from Step 1 to Step 5 of the ARqpIDA algorithm achieves the desired approximate optimality condition, \( {\phi }_{f, j}^{{\delta }_k}\left( {x}_k\right)  \leq  {\epsilon }_j\frac{{\delta }_k^j}{j!} \) , for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.15 (OCR Markdown line 14532)"
deps = ["arqpidaRun"]

[[node]]
id = "lemma_13_1_16"
wrong = "The literal fixed constants are false for an actual full 125-iteration IDA and EDA Run. Formal arqpidaPrintedBoundsCounterexample: f=sin, p=q=1, all zeroth/first derivative Lipschitz constants=1, lower bound=-1, epsilon=1/2, zeta=1/2, theta=9/10, kappa_s=1/16, known error bound=1, initial derivative cap=2^40, sigma0=sigmaMin=1, eta1=1/4, eta2=3/4, gamma1=1/2, gamma2=2, gamma3=3. Forty legal rejected large global-model steps increase sigma to 2^40; 84 legal accuracy-only iterations make the final exact short global-model minimizer admissible. Its accepted step and computed decrement equal 2^(-40), while all true criticality tests fail at all produced points. The exact printed 13.1.77 cap is 30, so the printed 13.1.79 coefficient is 499/16. The actual step violates 13.1.79/80 and both computed and true decreases violate 13.1.82/83. Both complete operational Run proofs include every Step1/Step2 check, oracle bound, derivative reuse, function request, ratio and update. Corrected companions with the genuine cap remain valid; this finite example does not refute existential complexity theorems."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 13.1.16: A useful inequality for the ARqpIDA algorithm

Suppose that f.D0pL holds. Suppose also that iteration \( k \in  \mathcal{T} \) is successful, that approximate optimality is not achieved at iteration \( k + 1 \) (i.e.,(12.1.25) (p. 285) does not hold), and that \( \begin{Vmatrix}{s}_k\end{Vmatrix} < 1 \) . Then there exists \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\left( {1 - \theta }\right) {\epsilon }_j\frac{{\left( {\delta }_{k + 1, j}^{\left( 0\right) }\right) }^j}{j!} \leq  \left( {{L}_{f, p} + {\sigma }_{\max } + 3{\kappa }_{\nabla ,\max }{\kappa }_s}\right) \mathop{\sum }\limits_{\ell  = 1}^j\frac{{\left( {\delta }_{k + 1, j}^{\left( 0\right) }\right) }^{\ell }}{\ell !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - \ell  + 1},
\]

(13.1.79)

where \( {\sigma }_{\max } \) is given by (13.1.77).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.16 (OCR Markdown line 14566)"
deps = ["lemma_13_1_14"]

[[node]]
