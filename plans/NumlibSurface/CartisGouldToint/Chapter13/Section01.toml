Lemma 13.1.10: Relationship between model and Taylor decrements

Suppose that f.D0pL holds, that \( {\bar{m}}_{k}\left( s\right) \) is the inexact model (13.1.45) corresponding to some approximate derivative values \( {\left\{  {\nabla }_x^{\ell }f\left( {x}_k\right) \right\}  }_{\ell  = 1}^p \) , and that \( {\bar{L}}_{f} \) is given by (13.1.63). Given \( \alpha  > 0 \) and

\[
\delta  \in  \left( {0,\min \left( {1,\frac{\alpha }{4\max \left\lbrack  {{\bar{L}}_{f},{\sigma }_{k}}\right\rbrack  }}\right) }\right\rbrack  ,\tag{13.1.64}
\]

suppose that there is a displacement \( d \in  {\mathcal{B}}_{\delta } \) for which

\[
{\overline{\Delta T}}_{f, j}\left( {{x}_{k}, d}\right)  \geq  \alpha \frac{{\delta }^{j}}{j!}
\]

for some \( j \in  \left\lbrack  {1 : q}\right\rbrack \) . Then

\[
\Delta {\bar{m}}_{k}\left( d\right)  \geq  \frac{1}{2}\alpha \frac{{\delta }^{j}}{j!}.\tag{13.1.65}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 13.1.10 (OCR Markdown line 14286)"
deps = ["arqpidaRun"]

