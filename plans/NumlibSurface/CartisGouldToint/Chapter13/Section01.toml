desc = '''
Algorithm 13.1.2 (ARqpIDA) as a run predicate `IsARqpIDARun f κ∇ P ε x₀ x σ δ δ₁ δs h D dd jk s acc`:
`ε j ∈ Ioc 0 1` and `ε j ≤ P.δ₀ j` (`j ∈ Icc 1 q`); `x 0 = x₀`, `σ 0 = σ₀`, `δ 0 = δ₀`, `h 0 = h₀`;
oracle `∀ k, JetApprox (ftaylorSeries ℝ f (x k)) (D k) p (fun i => κ∇ i * h k i)`; `∀ k, ARqpDAStep …
k` with (13.1.58) `ρ k = reductionRatio f (x k) (s k) ((D k).taylorDecrement p (s k))`. No
termination; test `arTest k := ∃ δ', (∀ j ∈ Icc 1 q, δ' j ∈ Ioc 0 1) ∧
IsEpsDeltaApprox (ftaylorSeries ℝ f (x k)) univ q ε δ'`. Counts as for TRqIDA (function values
`derivEvalCount (¬ acc ·) k`, derivative estimates `derivEvalCount (S ∨ A) k`).
Existence (part of node): under `AssumptionD0pL f p L` (`E` finite-dimensional), for every oracle as
in `algorithm_13_1_1` (order `p`) there is a run with `D k = O (x k) (h k)` which moreover satisfies
`RadiiControl` at every iteration: Step 1 by Lemma 13.1.11 (finitely many halvings), Step 2 by
`Optimization.exists_highOrderStep` (global model minimizer) with `L = Lbar`.
'''
