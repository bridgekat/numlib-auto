[[node]]
id = "theorem_13_1_19_i"
kind = "theorem"
desc = '''
Theorem 13.1.19, case `q ∈ {1, 2}`. Let `AssumptionD0pL f p L`, `AssumptionBb f flow`,
`ε j ∈ Ioc 0 1`. For every ARqpIDA run satisfying `RadiiControl Lbar` at every iteration there is
`kε` with `IsFirstHit arTest kε` (so `x kε` is an `(ε, δ_ε)`-approximate `q`-th order minimizer for
some `δ_ε ∈ (0,1]^q`) and
`derivEvalCount (¬ acc ·) kε ≤ κ^A (f x₀ - flow) / min_j ε j^((p+1)/(p-j+1)) + κ^C` (13.1.84),
`derivEvalCount (S ∨ A) kε ≤ κ^S (f x₀ - flow) / min_j ε j^((p+1)/(p-j+1)) + κ^E |log ε_min| + κ^F + 3`
(13.1.85), with `κ^S = 2/(η₁ κ_Δm)`, `κ^A = κ^S (1 + |log γ₁| / log γ₂)` (13.1.88),
`κ^C = log (σmax/σ₀)/log γ₂ + 2 + |log γ₁|/log γ₂` (corrected (13.1.89)), `κ^E = p(q+1)/|log γh|`,
`κ^F = |log (κ_acc/κh)|/|log γh|` (13.1.90), `κ_acc = min (ς κ_δ1(σmax)^q/(4 q! κ∇max))
(κs (ς κ_δ1(σmax)^q/(12 q! max Lbar σmax))^p)` (first term omitted if `κ∇max = 0`).
Corrections: (1) the book's conclusion "`φ^1_{f,j}(x_ε) ≤ ε_j/j!`" (radius one) is not proved: the
certified radii are `δ^{(1)}_k`, which may be `< 1` (initial radii `δ₀`, Step-1 halvings); the
statement is with some radius `δ_ε ∈ (0,1]^q`, as in case (ii). (2) The first-hit index is that of
the existential test `arTest`: the proof needs "`x_{k+1}` not optimal for the radii `δ_{s_k}`"
(Lemma 13.1.16) and "Step 1 → Step 5 with small `h` certifies optimality for `δ^{(1)}_k`"
(Lemma 13.1.15); the book's "(12.1.25) with `δ = δ_{k_ε}`" conflates `δ^{(0)}` and `δ^{(1)}`.
(3) `|S_{kε-1}| ≤ N + 1` (successes up to `kε - 2` decrease `f`), so the `+1` in the trial count
carries the factor `1 + |log γ₁|/log γ₂` (corrected `κ^C`); the derivative count includes the
initial estimate, the `+1` on `|S|` and the last accuracy-improving iteration (`+ 3`).
Proof: Lemmas 13.1.18 (telescoping), 13.1.9 with Lemma 13.1.14, 13.1.12(4), 13.1.15,
`Optimization.card_accuracyImproving_le`, `Optimization.exists_firstHit_le_of_dynamicAccuracy`.
'''
