[[node]]
id = "theorem_13_1_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 13.1.8: \( q \) th-order complexity for the TRqIDA algorithm

Suppose that f.D0qL and f.Bb hold. Then there exist positive constants \( {\kappa }_{\text{ TRIDA }}^{\mathbf{A}} \) , \( {\kappa }_{\text{ TRqIDA }}^{B},{\kappa }_{\text{ TRqIDA }}^{C},{\kappa }_{\text{ TRqIDA }}^{E} \) , and \( {\kappa }_{\text{ TRqIDA }}^{F} \) such that, for any \( \epsilon  \in  (0,1{\rbrack }^q \) , the TRqIDA algorithm (p. 329) requires at most

\[
\begin{gathered}{\# }_{\text{ TrqIDA }}^{F}\overset{\text{ def }}{ = }{\kappa }_{\text{ TRqIDA }}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{q + 1}} + {\kappa }_{\text{ TRqIDA }}^{B}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\text{ TRqIDA }}^{C} \\ = \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {q + 1}\right) }}\right)\end{gathered}\tag{13.1.38}
\]

evaluations of \( f \) and at most

\[
\begin{gathered}{\# }_{\text{ TRqIDA }}^{D}\overset{\text{ def }}{ = }{\kappa }_{\text{ TRqIDA }}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{q + 1}} + {\kappa }_{\text{ TRqIDA }}^{E}\left| {\log \left( {\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}}\right) }\right|  + {\kappa }_{\text{ TRqIDA }}^{F} \\ = \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {q + 1}\right) }}\right)\end{gathered}\tag{13.1.39}
\]

evaluations of the inexact derivatives \( \overline{{\nabla }_{x}^{i}f} \) of order \( i \) from one to \( q \) to produce an iterate \( {x}_{\epsilon } \) and an optimality radius \( {\delta }_{\epsilon } \in  (0,1\rbrack \) such that \( {\phi }_{f, q}^{\delta }\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon }^j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

Documented source/OCR correction and formalization requirements: OCR correction: replace φ_(f,q)^δ in the final condition with φ_(f,j)^(δepsilon), for each j. Function evaluation and derivative evaluation counters differ by accuracy-improvement iterations and their logarithmic terms; retain both.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 13.1.8 (OCR Markdown line 13994)"
deps = ["lemma_13_1_1", "lemma_13_1_5", "lemma_13_1_6", "lemma_13_1_7"]

