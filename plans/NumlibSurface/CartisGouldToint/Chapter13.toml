desc = '''
Cartis–Gould–Toint Chapter 13, "Inexact Function Values and Derivatives": trust-region (TRqIDA) and
adaptive-regularization (ARqpIDA) methods for `(ε,δ)`-approximate `q`-th order minimizers with
inexact derivatives under *implicit dynamic accuracy* (§13.1), the consequence that low-degree
oracles suffice for the high-order complexity bounds (§13.2), and the *explicit dynamic accuracy*
variants TRqEDA/ARqpEDA with inexact function values and certified termination (§13.3). Appendix B
contains only proofs for this chapter (no separately numbered lemmas), so there is no
`AppendixB/Chapter13` module.

Conventions (all sections, namespace `CartisGouldToint.Chapter13`): `E = EuclideanSpace ℝ (Fin n)`;
tolerances `ε : ℕ → ℝ` indexed by orders `j ∈ Icc 1 q`, `ε_min = (Icc 1 q).inf' _ ε`; radii
`δ : ℕ → ℝ` likewise; approximate optimality is `Optimization.IsEpsDeltaApprox (ftaylorSeries ℝ f x)
univ q ε δ` (12.1.25). Inexact jets are `FormalMultilinearSeries ℝ E ℝ` (`D k`), their decrements
`(D k).taylorDecrement j s` (`\overline{ΔT}_{f,j}(x_k,s)`), their measures
`Optimization.taylorMeasure (D k) j δ univ` (`\overline{φ}^δ_{f,j}(x_k)`, (13.1.5)); the oracle
error model is `Optimization.JetApprox`. Algorithms are run predicates; iterations are successful
(`S`), unsuccessful (`U`) or accuracy-improving (`A`, the Prop field `acc`), `T = S ∪ U`.
Function-value counts are `Optimization.derivEvalCount (¬ acc ·) k` (initial value plus one per
trial iteration) in IDA and `|T| + |T ∩ R|` (at most two per trial iteration, no initial value) in
EDA; derivative-estimate counts are `derivEvalCount (S ∨ A) k`.

Main source issues (details in the nodes and in `notes/cgt/reports/plan-ch13.md`):
* Algorithm 13.1.1 Step 0 prints `0 < γ₁ < 1 < γ₂ < γ₃` (the AR convention); the TR update (13.1.17)
  and Lemma 13.1.1 need `0 < γ₁ ≤ γ₂ < 1 < γ₃` (as in TRq, Algorithm 12.2.1).
* Lemmas 13.1.1/13.1.9: the radius/parameter hypothesis must be on `Δ_{k+1}`/`σ_{k+1}` (index slip).
* Theorems 13.1.8/13.1.19/13.3.4/13.3.8: derivative-evaluation bounds omit the initial estimate and
  the `+1` of the accuracy count (constants `κ^F + 2`, resp. `+ 3`); 13.1.19's `κ^C` misses the factor
  `(1 + |log γ₁|/log γ₂)` on the `+1` from `|S_k| ≤ |S_{k-1}| + 1`; OCR-damaged constants restored.
* ARqpIDA Step 2 checks (13.1.46) only for `i ∈ [1:q]` and only when `‖s_k‖ < 1`; the proof of
  Lemma 13.1.14 needs (13.1.47) for all `i ∈ [1:p]` and for long steps: corrected check `i ∈ [1:p]`
  and `σ_max` with `max(κ_s, κ_h)` in place of `κ_s`.
* Theorem 13.1.19(1) claims `φ^1_{f,j}(x_ε) ≤ ε_j/j!` (radius 1); only "for some `δ_ε ∈ (0,1]^q`" is
  proved (initial radii and Step 1 halvings may be `< 1`); the termination index is the first iterate
  that is `(ε,δ)`-approximate for *some* radius (the book's proof conflates `δ^{(0)}_k` and `δ^{(1)}_k`).
* Lemma 13.1.18 states the model decrease for all `k ∈ T`; it is proved (and used) only for successful
  `k` whose successor is not approximately optimal.
* §13.3.2: the EDA proofs reuse Lemma 13.1.16, whose hypothesis "`x_{k+1}` not approximately optimal"
  is not implied by non-termination of ARqpEDA; the corrected argument uses the inexact Step-1 test at
  `x_{k+1}` and needs `θ < ς/2` (constant `ς/2 - θ` for `1 - θ`, `4κ_s` for `3κ_{∇,max}κ_s`).
* Theorem 13.2.1 writes `min_j ε_j^{-…}` for `max_j ε_j^{-…}`.
'''
