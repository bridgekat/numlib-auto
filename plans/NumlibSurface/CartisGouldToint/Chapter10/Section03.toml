namespace = "CartisGouldToint"
desc = '''
Trust-region minimization over nested Lanczos spaces. Multipliers are nonnegative and satisfy complementary slackness; a zero multiplier may give an interior minimizer. Residual estimates use the dual M⁻¹ norm.
'''

[[node]]
id = "lemma_10_3_1"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 10.3.1: Nested subspace trust-region solutions norm increase

[279, Thm. 2.6],[343, Thm. 2.1]: Let \( {s}_{k} = {Q}_{k}{\bar{s}}_{k} \) , where \( {\bar{s}}_{k} \) satisfies (10.1.5); let \( {\lambda }_k \) be the corresponding Lagrange multiplier for the trust-region constraint; and let \( {s}_{ * } \) be a global solution of (8.1.2) with corresponding multiplier \( {\lambda }_{ * } \) . Then \( {\lambda }_k \leq \; {\lambda }_{\ell } \leq  {\lambda }_{ * } \) and \( {\begin{Vmatrix}{s}_k\end{Vmatrix}}_M \leq  {\begin{Vmatrix}{s}_{\ell }\end{Vmatrix}}_M \leq  {\begin{Vmatrix}{s}_{ * }\end{Vmatrix}}_M \) for \( 1 \leq  k \leq  \ell  \leq  \operatorname{grade}\left( {{M}^{-1}H,{M}^{-1}g}\right) \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 10.3.1 (OCR Markdown line 10941)"
deps = ["lanczosSubspaceData", "theorem_8_2_7"]

[[node]]
id = "theorem_10_3_2"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 10.3.2: Bound on the residual at the subspace minimizer

[Appendix to Chapter 10, p. 481]: The residual (10.3.1) for the \( k \) th iterate \( {s}_k = \; {Q}_{k}{\bar{s}}_{k} \) , generated by the trust-region subproblem (10.1.5), satisfies the bound

\[
{\begin{Vmatrix}g + \left( H + {\lambda }_{k}M\right) {s}_k\end{Vmatrix}}_{{M}^{-1}} \leq  2\begin{Vmatrix}{{M}^{-1}H}\end{Vmatrix}{\kappa }_k\Delta {\left( \frac{\sqrt{{\kappa }_k} - 1}{\sqrt{{\kappa }_k} + 1}\right) }^{k - 1},
\]

where \( {\lambda }_k \) is the Lagrange multiplier for (10.1.5) and \( {\kappa }_k \) is given by (10.2.8).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 10.3.2 (OCR Markdown line 10963)"
deps = ["lanczosSubspaceData", "lemma_10_3_1"]

[[node]]
id = "corollary_10_3_3"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Corollary 10.3.3: Iteration bound for the trust-region subspace approximation

[Appendix to Chapter 10, p. 481]: The iteration defined by \( {s}_{k} = {Q}_{k}{\bar{s}}_{k} \) and the subspace trust-region minimization (10.1.5) satisfies (10.3.2) for some

\[
k \leq  \min \left\lbrack  {\left\lceil  \frac{\log \left( \frac{2\begin{Vmatrix}{{M}^{-1}H}\end{Vmatrix}{\kappa }_{ * }\Delta }{\epsilon }\right) }{\log \left( \frac{\sqrt{{\kappa }_{ * }} + 1}{\sqrt{{\kappa }_{ * }} - 1}\right) }\right\rceil   + 1,\;\operatorname{grade}\left( {{M}^{-1}H,{M}^{-1}g}\right) }\right\rbrack  ,
\]

where \( {\kappa }_{ * } \) is given by (10.2.10).

Documented source/OCR correction and formalization requirements: Make κ*>1 explicit for the displayed logarithmic bound, and separately handle κ*=1 by exact termination in one Lanczos step. The grade bound covers finite-dimensional termination and should not depend on division by zero.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Corollary 10.3.3 (OCR Markdown line 10975)"
deps = ["theorem_10_3_2"]
