[[node]]
id = "corollary_10_2_3"
wrong = "The ordinary integer ceiling in the printed bound may be negative because theta1 in (9.3.14) is only required positive. A genuine two-dimensional symmetric swap Hessian, nonzero first-coordinate gradient, identity metric, sigma=1 and r=3 has actual global cubic minima in every Lanczos subspace and the ambient space. Its true maximum shifted condition number is greater than one. corollary_10_2_3_counterexample chooses a permitted positive tolerance for which the displayed ceiling plus one equals -1, excluding every iteration. The separately proved natural-ceiling companion supplies the nonnegative budget."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Corollary 10.2.3: Iteration bound for the subspace approximation

[Appendix to Chapter 10, p. 480]: The iteration defined by \( {s}_{k} = {Q}_{k}{\bar{s}}_{k} \) and the subspace minimization (10.1.6) satisfies (9.3.14b) for some

![262_290_417_1030_209_0.jpg](images/262_290_417_1030_209_0.jpg)

\[
\left. {\operatorname{grade}\left( {{M}^{-1}H,{M}^{-1}g}\right) }\right\rbrack  \text{ , }
\]

where \( {\kappa }_{ * } \) is given by (10.2.10).

Documented source/OCR correction and formalization requirements: The main formula is an image in the Markdown. Transcription from images/262_290_417_1030_209_0.jpg: k ≤ min(ceil(log((4 ||M⁻¹H|| κ*/θ1) (λ*/σ)^(1/(r−2)) ((λmax[H,M]+λ*)/||g||_(M⁻¹))²) / log((sqrt κ*+1)/(sqrt κ*−1)))+1, grade(M⁻¹H,M⁻¹g)). This yields the gradient stopping rule ||∇m^R(sk)||_(M⁻¹)≤(θ1/2) ||sk||_M² from (9.3.14b). State g≠0 and κ*>1 for the logarithmic formula; handle κ*=1 by exact one-dimensional Krylov convergence. The image supplies the first entry of min; the following Markdown supplies its grade entry.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Corollary 10.2.3 (OCR Markdown line 10915)"
