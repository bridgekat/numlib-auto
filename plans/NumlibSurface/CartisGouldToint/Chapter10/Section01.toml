namespace = "CartisGouldToint"
desc = '''
Preconditioned Lanczos and Krylov subspaces. Keep the M-orthonormal basis, tridiagonal projection, and grade finite index explicit. Lanczos breakdown ends the current invariant Krylov space rather than creating an arbitrary next vector.
'''

[[node]]
id = "lanczosSubspaceData"
kind = "definition"
desc = '''
For symmetric H, M positive definite, and g≠0, define K_k=span{M⁻¹g,(M⁻¹H)M⁻¹g,…,(M⁻¹H)^(k−1)M⁻¹g}. The grade is the first k at which this sequence stabilizes. An M-orthonormal basis Qk generated by Algorithm 10.1.1 gives Tk=Qkᵀ H Qk tridiagonal and Qkᵀg=γ1 e1, γ1=||g||_(M⁻¹). Projected subproblems (10.1.5),(10.1.6) minimize γ1<sbar,e1>+<sbar,Tk sbar>/2 with respectively ||sbar||≤Δ or plus (σ/r)||sbar||^r. sk=Qk sbar_k, λk the corresponding multiplier.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 10.1"
deps = ["weightedNorm", "regularizationSubproblemModel"]
