namespace = "CartisGouldToint.Chapter14"
desc = '''
§14.3 High-order criticality for nonconvex constraints: `min_{x ∈ X} f(x)` s.t. `c(x) = 0`
(14.3.1), `E := EuclideanSpace ℝ (Fin n)`, `F := EuclideanSpace ℝ (Fin m)`, `c : E → F`,
Lagrangian `ℒ(x, y) = f(x) - ⟪y, c(x)⟫` (book (1.1.1) sign; the existing `Optimization.lagrangian`
uses `f + Σ λ h` and is not used here), `‖(1, yᵀ)‖ := √(1 + ‖y‖²)`. Measures of the Lagrangian:
`Optimization.taylorMeasure (ftaylorSeries ℝ (fun z => f z - ⟪y, c z⟫) x) j δ V` with
`V ⊆ X(x) := {d | x + d ∈ X}`; `T(x) := X(x) ∩ ker Dc(x)`, `M(x) := T(x) ∩ ker Df(x)` (14.3.45)
(sets, not subspaces, for nonconvex `X`). Residual and merit: `Constrained.targetResidual`,
`Constrained.targetMerit` (`r(x,t) = (c(x), f(x) - t)`, `μ = ½‖r‖²`, `ν = ½‖c‖²`).

Algorithms with a "nonspecific" inner solver INNER (§14.3.2.1) are run predicates in which every
inner call is an abstract object constrained by a *contract*: its output condition (14.3.19)/(14.3.22)/
(14.3.32) and, as hypotheses of the complexity theorems, either the total-cost bounds (14.3.20)–
(14.3.21) (LENq-SC) or the per-iteration conclusions of Lemmas 14.2.2–14.2.3 (Phase 2 of
TPqp-GC, as the book's proof of Lemma 14.3.8 uses). The algorithmic parameters `β`, `θ` and
tolerances `ε : ℕ → ℝ` (`ε 0` = primal, `ε j` dual, `j ∈ Icc 1 q`) are explicit arguments; `q ≤ 3` for
the optimality conclusions, general `q` for the complexity counts. The book ignores `O(log ε)` terms
in (14.3.20) (footnote 114); the contract is taken as stated.
'''

[[node]]
id = "theorem_14_3_1"
kind = "theorem"
desc = '''
Theorem 14.3.1 (corrected; see `Optimization.curveCoeff_lagrangian_nonneg_of_isLocalMinOn` for the
counterexample to the printed form). If `f` and the `c_i` are `C^q` on an open set containing `X`
and `x⋆` is a local minimizer of (14.3.1) (`IsLocalMinOn f (X ∩ {x | c x = 0}) x⋆`), then
`c x⋆ = 0`, and for every `y⋆ : F`, `j ∈ Icc 1 q` and `s : ℕ → E` such that
`Optimization.IsFeasibleArc (X ∩ {x | c x = 0}) x⋆ j s` (the arc is feasible for *all* constraints)
and the Lagrangian coefficients of orders `1..j-1` vanish (14.3.5):
`0 ≤ Optimization.curveCoeff (ftaylorSeries ℝ (fun z => f z - ⟪y⋆, c z⟫) x⋆) s j` (14.3.4); moreover
such arcs satisfy (14.3.3) (`Optimization.curveCoeff_eq_zero_of_isFeasibleArc`). X.CQ ("the set of
nonzero tuples in 𝒟^j satisfying (14.3.3) is nonempty") is not needed for the statement (it only
excludes vacuity) and is defined as `AssumptionXCQ` for reference.
'''
deps = ["Optimization.curveCoeff_lagrangian_nonneg_of_isLocalMinOn", "Optimization.curveCoeff_eq_zero_of_isFeasibleArc"]
source = "Cartis–Gould–Toint, Theorem 14.3.1"

[[node]]
id = "AssumptionXCQ"
kind = "def"
desc = '''
X.CQ at `x⋆ ∈ X` for orders `≤ q`: `∀ j ∈ Icc 1 q, ∃ s : ℕ → E, (∃ i ∈ Icc 1 j, s i ≠ 0) ∧
Optimization.IsFeasibleArc X x⋆ j s ∧ ∀ i ∈ Icc 1 j, Optimization.curveCoeff (ftaylorSeries ℝ c x⋆) s i = 0`
(as printed: `X`-feasible arcs satisfying (14.3.3)). Remark (part of node): implied by LICQ for
`q = 1` when `X` is given by inequalities (book; via `Constrained.exists_contDiff_feasible_arc`).
'''
deps = ["Optimization.IsFeasibleArc", "Optimization.curveCoeff", "Constrained.exists_contDiff_feasible_arc"]
source = "Cartis–Gould–Toint, assumption X.CQ"

[[node]]
id = "example_14_3_1"
kind = "theorem"
desc = '''
Example 14.3.1 (`n = 3`, `m = 2`, `X = univ`): `f x = x₁ + x₂² + x₂³ - x₃`,
`c x = (-x₁ - x₂² + x₁x₂ + x₃, x₁ + x₂² + x₁x₂ + x₃)`. Facts: (i) the arc `α ↦ (-α², α, α³)`
(`s₁ = e₂, s₂ = -e₁, s₃ = e₃`) is feasible for all `α` and (14.3.7) holds; (ii) the feasible set is
exactly `{(-t², t, t³) | t ∈ ℝ}` and `f` vanishes on it, so `0` is a (non-strict, global)
minimizer — the book's "high-order saddle point" is wrong; (iii) with `y₀ = (-1, 0)` (the book's
`(1, 0)ᵀ` corresponds to `ℒ = f + ⟨y, c⟩`) `∇ℒ(0, y₀) = 0`, `ker Dc(0) = span{e₂}`,
`∇²ℒ(0, y₀) = [[0,1,0],[1,0,0],[0,0,0]]`, `∇³ℒ(0,y₀)` has the single nonzero entry `(2,2,2) = 6`;
(iv) (14.3.5) holds for `i = 1, 2`, and `∇²ℒ(0,y₀)[s₁,s₂] = -1`, `∇³ℒ(0,y₀)[s₁]³ = 6`, so the
third-order condition (14.3.6) `∇²ℒ[s₁,s₂] + (1/6)∇³ℒ[s₁]³ = 0` holds with both terms nonzero.
'''
deps = ["Optimization.curveCoeff"]
source = "Cartis–Gould–Toint, Example 14.3.1"

[[node]]
id = "theorem_14_3_2"
kind = "theorem"
desc = '''
Theorem 14.3.2. `X` closed nonempty, `x_ε ∈ X`, `j ∈ {1,2,3}`, `f`, `c` `C^j` near `x_ε` with
`∇^j f`, `∇^j c` Lipschitz (constants `L_{f,j}`, `L_{c,j}`, the latter for the vector-valued
derivative) on a ball of radius `δ_j > 0` around `x_ε` (book: "diameter"), `V ⊆ X(x_ε)` with
`0 ∈ V`, `‖c x_ε‖ ≤ ε₀` (14.3.8), `y_ε : F`, `η ≥ 0` and `taylorMeasure (ftaylorSeries ℝ ℒ(·, y_ε) x_ε)
j δ_j V ≤ ε_j √(1+‖y_ε‖²) δ_j^j/j! + η` (14.3.9). Then for all `d ∈ V` with `‖c(x_ε + d)‖ ≤ ε₀`
and `‖d‖ ≤ δ_j`, `√2 max(L_{f,j}, L_{c,j}) ‖d‖ ≤ (j+1) ε_j` (14.3.11):
`f(x_ε + d) ≥ f(x_ε) - 2 ε₀ ‖y_ε‖ - 2 ε_j √(1+‖y_ε‖²) δ_j^j/j! - η` (14.3.10), and without the
`2 ε₀ ‖y_ε‖` term if `c(x_ε + d) = c(x_ε)` or (`c(x_ε + d) = 0` and `⟪y_ε, c x_ε⟫ ≤ 0`) (14.3.12).
'''
deps = ["Optimization.le_of_lagrangian_taylorMeasure_le"]
source = "Cartis–Gould–Toint, Theorem 14.3.2"

[[node]]
id = "innerEvalBound"
kind = "def"
desc = '''
The INNER cost contract (14.3.20)–(14.3.21): `innerEvalBound κ π q (gap : ℝ) (ε : ℕ → ℝ) : ℝ :=
κ * gap * ⨆ j ∈ Icc 1 q, ε j ^ (-π j)` (`Finset.sup'`, `Real.rpow`), where `gap = f(x^S) - flow`;
"INNER(f, X, q, x^S, ε) uses at most `innerEvalBound κ^F π q gap ε` evaluations of `f` and
`innerEvalBound κ^D π q gap ε` of its derivatives to find `x_ε ∈ X`, `δ ∈ (0,1]^q` with
`taylorMeasure (ftaylorSeries ℝ f x_ε) j δ_j X(x_ε) ≤ ε_j δ_j^j/j!` (14.3.19)". Here `π_j > 1` are
the exponents of (14.2.12) for the chosen INNER method.
'''
source = "Cartis–Gould–Toint, (14.3.19)–(14.3.21)"

[[node]]
id = "algorithm_14_3_1"
kind = "def"
desc = '''
Algorithm 14.3.1 (LENq-SC) as a run predicate `IsLENRun r X q ε β x δ nF nD : Prop` for a residual
`r : E → F` (`Φ₂ = ½‖r‖²`, `Φ₁ = ‖r‖`), `x : ℕ → E`, radii `δ : ℕ → ℕ → ℝ`, per-call costs
`nF nD : ℕ → ℕ`; with `stop k := ‖r (x k)‖ ≤ ε 0 ∨ ∀ j ∈ Icc 1 q, taylorMeasure (ftaylorSeries ℝ Φ₂
(x k)) j (δ k j) X(x k) ≤ ε j * ‖r (x k)‖ * δ k j ^ j / j!` (14.3.23) (`k = 0`: only the first
alternative, "if ‖r(x₀)‖ ≤ ε₀ stop"): `x 0 ∈ X`, `0 < β < 1` and `β * ‖r (x 0)‖ < 1` (book: `β < min(1, 1/‖r(x₀)‖)`, written multiplicatively so that `r(x₀) = 0` is allowed), `ε j ∈ (0,1)`; and for
every `k ≥ 1` with `∀ i < k, ¬ stop i`: `x k ∈ X`, `δ k j ∈ (0,1]` and (14.3.22)
`taylorMeasure (ftaylorSeries ℝ Φ₂ (x k)) j (δ k j) X(x k) ≤ β ‖r (x (k-1))‖ ε j δ k j ^ j / j!` for
`j ∈ Icc 1 q` (output of `INNER(Φ₂, X, q, x_{k-1}, β ‖r(x_{k-1})‖ ε)`, whose costs are `nF k`,
`nD k`). Existence (part of node): given an INNER that always returns, runs exist
(`Optimization.exists_run_of_forall_exists`).
'''
deps = ["innerEvalBound", "Optimization.taylorMeasure", "Optimization.exists_run_of_forall_exists"]
source = "Cartis–Gould–Toint, Algorithm 14.3.1"

