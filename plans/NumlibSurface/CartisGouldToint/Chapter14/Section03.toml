namespace = "CartisGouldToint"
[[node]]
id = "feasibleCurveJet"
kind = "definition"
desc = '''
D_X^j(x) consists of vector tuples (s1,…,sj) for which an X-feasible path α↦x+Σ_(i=1)^j α^i si+o(α^j) exists as α→0+. Equality Taylor feasibility imposes the ordered-composition coefficient conditions (14.3.3). Define the printed X.CqQ separately from the stronger equality-jet realizability needed to repair Theorem 14.3.1; nonempty jets alone do not establish realization.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.3"
deps = ["orderedCompositions"]

[[node]]
id = "leastSquaresMerit"
kind = "definition"
desc = '''
For c:R^n→R^m and f:R^n→R define ν(x)=||c(x)||²/2, r(x,t)=(c(x),f(x)−t), and μ(x,t)=||r(x,t)||²/2. Generalize to residual map r in LENq-SC. Keep the parameter t explicit in derivatives and level sets.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.3"
deps = []

[[node]]
id = "lenqscRun"
kind = "definition"
desc = '''
Algorithm 14.3.1 LENq-SC local rules for minimizing ||r(x)|| over X: inner minimization of ||r||²/2 using the selected SC algorithm; target εk=β^k ε0, β∈(0,1); termination and continuation tests are exactly (14.3.18)–(14.3.23). Inputs include the choice of an inner algorithm, its operational run and call counters; its generic decrease/complexity assumptions are explicit hypotheses of later theorems rather than built-in conclusions.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.3"
deps = ["leastSquaresMerit", "constrainedCriticality"]

[[node]]
id = "tpqpgcRun"
kind = "definition"
desc = '''
Algorithm 14.3.2 TPqp-GC with 1≤q≤3 and q≤p. Phase 1 drives ν using LENq-SC toward feasibility ε0; Phase 2 minimizes μ(x,t) with the prescribed target-update formulas, inner solver tests and tolerances ε1,…,εq. Define Ik and Ik^s from the actual target updates and successful inner iterations. Preserve separate infeasible stationary termination (14.3.41) and feasible approximate KKT termination (14.3.42)–(14.3.47), including multiplier scaling, tangent subspaces and radii.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.3"
deps = ["lenqscRun"]

[[node]]
id = "theorem_14_3_1"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.1: Curve-based necessary conditions for a constrained minimum

[104, Thm. 2.2]: Suppose that \( f \) and each of the \( {\left\{  {c}_i\right\}  }_{i = 1}^m \) are \( q \) -times continuously differentiable in an open set containing \( \mathcal{X} \) and that \( {x}_{ * } \) is a local minimizer for problem (14.3.1) at which X.CQ holds. Then we have that \( c\left( {x}_{ * }\right)  = 0 \) and, for all \( {y}_{ * } \in  {\mathbb{R}}^m \) and all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) ,

\[
\mathop{\sum }\limits_{k = 1}^j\frac{1}{k!}\left( {\mathop{\sum }\limits_{\left( {{\ell }_1,\ldots ,{\ell }_k}\right)  \in  \mathcal{P}\left( {j, k}\right) }{\nabla }_x^k\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) \left\lbrack  {{s}_{{\ell }_1},\ldots ,{s}_{{\ell }_k}}\right\rbrack  }\right)  \geq  0\tag{14.3.4}
\]

for all \( \left( {{s}_1,\ldots ,{s}_j}\right)  \in  {\mathcal{D}}_{\mathcal{X}}^j \) and such that

\[
\mathop{\sum }\limits_{k = 1}^i\frac{1}{k!}\left( {\mathop{\sum }\limits_{\left( {{\ell }_1,\ldots ,{\ell }_k}\right)  \in  \mathcal{P}\left( {i, k}\right) }{\nabla }_x^k\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) \left\lbrack  {{s}_{{\ell }_1},\ldots ,{s}_{{\ell }_k}}\right\rbrack  }\right)  = 0\;\left( {i \in  \left\lbrack  {1 : j - 1}\right\rbrack  }\right) ,({14.3.5} \tag{14.3.5}
\]

and (14.3.3) hold for \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

Documented source/OCR correction and formalization requirements: The printed X.CqQ assumption only requires nonempty nonzero Taylor-feasible jets and is insufficient for the claimed necessary condition. Counterexample q=1, X=R, c(x)=x², f(x)=x, x*=0. The equality feasible set is {0}, so 0 is a local constrained minimizer and every nonzero s satisfies Dc(0)s=0, fulfilling the printed qualification. But for s=−1 and any multiplier, D_x L(0,y)s=−1<0. A corrected theorem needs realizability of every admissible jet by an actual equality-feasible path (or an appropriate regularity condition implying this). Do not replace mere nonemptiness by the theorem conclusion.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.1 (OCR Markdown line 16617)"
deps = ["feasibleCurveJet", "orderedCompositions"]
wrong = '''
False under the printed nonemptiness-only X.CqQ: q=1, c(x)=x², f(x)=x, X=R gives a local feasible minimizer at zero with a Taylor-feasible direction of negative objective derivative. Jet realizability is missing.
'''

