`H_δ := sup_{d ∈ T, ‖d‖ ≤ δ} |∇²f(x_ε)[d]²|`. Moreover `⟪y_ε, c x_ε⟫ ≤ 0`. (Termination analysis
(14.3.48)–(14.3.52) via `Constrained.IsTargetSequence.props`; measure algebra via the backbone
