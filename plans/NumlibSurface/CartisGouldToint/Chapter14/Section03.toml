desc = '''
Lemma 14.3.7 (with the Theorem 14.3.4 correction). Under X.CNe, c.D1pLB.X, and the LEN cost
contract for `ν` with constants `κF κD` (which by Lemma 14.3.6(i) may be chosen depending only on
the c-constants and `‖c x₀‖`), Phase 1 terminates at `x 1` satisfying (14.3.64) with at most
`½ κF ‖c x₀‖ ∑_{j ∈ Icc 1 q} β₁^{1-2π_j}/(β₁^{1-π_j} - 1) θ^{1-π_j} ε₀^{1-π_j} ε_j^{-π_j}` evaluations
of `c` (14.3.65) and the same with `κD` for derivatives (14.3.66): Theorem 14.3.4 for `r = c` with
primal tolerance `θ ε₀`.
'''
