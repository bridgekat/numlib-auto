[[node]]
id = "theorem_14_3_3"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.3: Convergence of the LENq-SC algorithm

The LENq-SC algorithm terminates at a point satisfying (14.3.18) after at most \( {\# }_{\text{ LENq-SC }}^{I}\overset{\text{ def }}{ = }\max \left( {0,\log \left( {{\epsilon }_{0}/\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}}\right) /\log \beta }\right) \) iterations.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.3 (OCR Markdown line 16961)"
deps = ["lenqscRun"]
wrong = "The unrounded real iteration bound can be smaller than one although an inner call is required. With r(x)=1/2 on R, X=R, q=1, epsilon0=1/4, epsilon1=1/2, beta=1/4, the initial primal test fails and one exact inner call returns zero true criticality, whereas the printed bound equals 1/2. Formal actual-run counterexample and natural-ceiling companion are provided."

[[node]]
id = "theorem_14_3_4"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.4: Evaluation complexity of the LEN \( q \) -SC algorithm

Suppose that \( {\Phi }_2 \) .D1qLaB.X (for trust-region INNER algorithms) or \( {\Phi }_2 \) .D1pLaB.X (for regularization INNER algorithms) holds, and that each call to the INNER algorithm satisfies the evaluation bounds (14.3.20) and (14.3.21). Then the LENq-SC algorithm requires at most \( {}^{116} \)

\[
{\# }_{\text{ LENq-SC }}^{F} = \frac{1}{2}{\kappa }_{\text{ INNER }}^{F}\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.27}
\]

evaluations of \( {\Phi }_2\left( x\right) \) and at most

\[
{\# }_{\text{ LENq-SC }}^{D} = \frac{1}{2}{\kappa }_{\text{ INNER }}^{D}\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.28}
\]

evaluations of its derivatives to compute an iterate \( {x}_k \) satisfying (14.3.23).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.4 (OCR Markdown line 17019)"
deps = ["lenqscRun", "theorem_14_3_3"]

wrong = "The printed maximum of geometric sums does not bound the sum of the actual per-call maxima for arbitrary allowed exponents. The formal smooth affine-residual two-call execution with q=2, exponents 8 and 50, beta=0.9, primal tolerance 0.898 and dual tolerances 1/3 and 0.99 has actual counts 7620 and 26583. Each call satisfies both source bounds with constants one and every actual criticality test; all source smoothness and level-set tensor bounds hold. Its total 34203 exceeds the printed bound about 31407.86. A uniform geometric companion preserves all accuracy exponents."

[[node]]
id = "lemma_14_3_5"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.5: Consequences of the termination of the TPqp-GC algorithm

Suppose that X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold. Suppose also that the TPqp-GC algorithm terminates at iteration \( {k}_{\epsilon } \) . Then one of the two following situations will occur.

1. Infeasible approximate local minimizer of the constraint violation:

\[
\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} > \theta {\epsilon }_{0}\;\text{ and }\;{\phi }_{\nu ,\mathcal{X}\left( {x}_{\epsilon }\right) , j}^{{\delta }_{{k}_{\epsilon }, j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_{j}\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix}\frac{{\delta }_{{k}_{\epsilon }, j}^{j}}{j!}.\tag{14.3.41}
\]

2. Approximate problem solution:

\[
\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_{0}\text{ and }{\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },1}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  {\epsilon }_{1}\begin{Vmatrix}\left( {1,{y}_{\epsilon }^{T}}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },1}\tag{14.3.42}
\]

for some \( {y}_{\epsilon } \in  {\mathbb{R}}^m \) . Moreover, if \( q > 1 \) , then

\[
{\phi }_{\mathcal{L},\mathcal{T}\left( {x}_{\epsilon }\right) ,2}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{2}\left\lbrack  {{\epsilon }_2\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },2}^2 + {\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right) \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },2}}\right\rbrack
\]

(14.3.43)

and

\[
{\phi }_{\mathcal{L},\mathcal{M}\left( {x}_{\epsilon }\right) ,2}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{2}{\epsilon }_2\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },2}^2,\tag{14.3.44}
\]

where

\[
\mathcal{T}\left( x\right) \overset{\text{ def }}{ = }\mathcal{X}\left( x\right)  \cap  {\ker }^{1}\left\lbrack  {{\nabla }_{x}^{1}c\left( x\right) }\right\rbrack  \;\text{ and }\;\mathcal{M}\left( x\right) \overset{\text{ def }}{ = }\mathcal{T}\left( x\right)  \cap  {\ker }^{1}\left\lbrack  {{\nabla }_{x}^{1}f\left( x\right) }\right\rbrack  .
\]

(14.3.45)

In addition, if \( q = 3 \) ,

\[
{\phi }_{\mathcal{L},\mathcal{T}\left( {x}_{\epsilon }\right) ,3}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{6}\left\lbrack  {{\epsilon }_3\parallel \left( {1,{y}_{\epsilon }^T}\right) \parallel {\delta }_{{k}_{\epsilon },3}^3}\right.
\]

\[
+ 3{\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right) \left. \left( {\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },3} + \begin{Vmatrix}{{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },3}^2}\right) \right\rbrack
\]

(14.3.46)

and

\[
{\phi }_{\mathcal{L},\mathcal{M}\left( {x}_{\epsilon }\right) ,3}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{6}{\epsilon }_3\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },3}^{3}. \tag{14.3.47}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.5 (OCR Markdown line 17237)"
deps = ["tpqpgcRun"]

wrong = "False for an actual two-phase q=p=2 execution on the Euclidean plane: f(x)=sin(x0)/10, c(x)=x1, all tolerances 1/10, theta=1/2 and beta=1/4. Both global objective bounds and all smoothness, global derivative bounds and Lipschitz bounds hold. Phase one returns (pi/2,0), one exact old-merit inner call returns zero, and branch2(a) resets the target to -1/10. The actual reset-merit checks pass at unit radii. The first printed Lagrangian bound forces every admissible multiplier to zero; tangent direction (-1,0) then gives second-order criticality at least 1/10 versus the printed upper bound 11/200. The formal verified_counterexample packages all regularity and execution facts. The proof drops a target-gap scaling factor in the tangent cross term."

