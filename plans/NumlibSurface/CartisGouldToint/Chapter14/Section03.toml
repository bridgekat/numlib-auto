[[node]]
id = "lemma_14_3_7"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.7: Evaluation complexity of Phase 1 of the TPqp-GC algorithm

Suppose that X.CNe and c.D1pLB.X hold. Then there are constants \( {\kappa }_{\mathrm{NNER}}^{F,\nu } \) and \( {\kappa }_{\text{ INNER }}^{D,\nu } \) depending on \( \begin{Vmatrix}{c\left( {x}_0\right) }\end{Vmatrix} \) such that Phase 1 of the TPqp-GC algorithm terminates at a point \( {x}_1 \) for which either

\[
\begin{Vmatrix}{c\left( {x}_{1}\right) }\end{Vmatrix} \leq  \theta {\epsilon }_{0}\;\text{ or }\;{\phi }_{\nu ,\mathcal{X}\left( {x}_{1}\right) , j}^{{\delta }_{{k}_{1}, j}\left( {x}_{1}\right) } \leq  {\epsilon }_{j}\begin{Vmatrix}{c\left( {x}_{1}\right) }\end{Vmatrix}\frac{{\delta }_{k, j}^{j}}{j!}\tag{14.3.64}
\]

in at most

\[
{\# }_{\text{ INNER },1}^{F}\overset{\text{ def }}{ = }\frac{1}{2}{\kappa }_{\text{ INNER }}^{F,\nu }\left( \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\right) \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\theta }^{1 - {\pi }_{j}}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}
\]

\[
= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_0^{1 - {\pi }_j}{\epsilon }_j^{-{\pi }_j}}\right)
\]

(14.3.65)

evaluations of \( c \) and at most

\[
{\# }_{\text{ INNER,1 }}^{D}\overset{\text{ def }}{ = }\frac{1}{2}{\kappa }_{\text{ INNER }}^{D,\nu }\left( \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\right) \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\theta }^{1 - {\pi }_{j}}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}
\]

\[
= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_0^{1 - {\pi }_j}{\epsilon }_j^{-{\pi }_j}}\right)
\]

(14.3.66)

evaluations of its derivatives.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.7 (OCR Markdown line 17481)"
deps = ["theorem_14_3_4", "lemma_14_3_6"]

[[node]]
id = "lemma_14_3_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.8: Bounds on the size of \( {\mathcal{I}}_k \) and \( {\mathcal{I}}_k^{\mathrm{s}} \)

Suppose that X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold. Then there are constants \( {\kappa }_{\text{ INNER },2}^{s},{\kappa }_{\text{ INNER },2}^{A} \) , and \( {\kappa }_{\text{ INNER },2}^{C} \) such that, for each \( k \in  {\mathcal{K}}_a \) before termination,

\[
\left| {\mathcal{I}}_{k}^{s}\right|  \leq  {\kappa }_{\text{ INNER },2}^{s}\left( {1 - \theta }\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{2 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.71}
\]

and

\[
\left| {\mathcal{I}}_{k}\right|  \leq  {\kappa }_{\text{ INNER },2}^{A}\left( {1 - \theta }\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{2 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + {\kappa }_{\text{ INNER },2}^{C}.\tag{14.3.72}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.8 (OCR Markdown line 17559)"
deps = ["theorem_14_3_4", "lemma_14_3_6"]

[[node]]
id = "theorem_14_3_9"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.9: Complexity of finding \( q \) th-order approximate minimizers by the TP \( {qp} \) -GC algorithm

Suppose that the INNER algorithm is of regularization type and X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold, or that the INNER algorithm is of trust-region type and X.CNe, c.D1qLB.X, f.D1qLB.Fb, and f.B.Fb hold. Then there exist constants \( {\kappa }_{\text{ INNER },2}^{S},{\kappa }_{\text{ INNER },2}^{A} \) , and \( {\kappa }_{\text{ INNER },2}^{C} \) such that, for any \( {\epsilon }_0 \in  (0,1\rbrack \) and \( \epsilon  \in  (0,1{\rbrack }^q \) , the TP \( {qp} \) -GC algorithm requires at most

\[
{\# }_{\text{ TPqpGC@TPqpGC }}^{F}\overset{\text{ def }}{ = }{\# }_{\text{ INNER,1 }}^{F} + {\# }_{\text{ INNER,2 }}^{F} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-1},\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}}\right\rbrack  }\right)
\]

evaluations of \( f \) and \( c \) and at most

\[
{\# }_{\text{ TPqpGC@TPqpGC }}^{D}\overset{\text{ def }}{ = }{\# }_{\text{ INNER },1}^{D} + {\# }_{\text{ INNER },2}^{D} = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}}\right)
\]

evaluations of their derivatives, where the \( {\left\{  {\pi }_j\right\}  }_{j = 1}^q \) are defined in (14.2.12), \( {\# }_{\text{ INNER },1}^{F} \)


and \( {\# }_{\text{ INNER },1}^{D} \) are given by (14.3.65) and (14.3.66), and

\[
{\# }_{\mathrm{{INNER}},2}^{F}\overset{\text{ def }}{ = }\left( {{f}_{up} - {f}_{low} - 1}\right) \left( {{\kappa }_{\mathrm{{INNER}},2}^{A}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + {\kappa }_{\mathrm{{INNER}},2}^{C}{\epsilon }_{0}^{-1}}\right)  + 1
\]

and

\[
{\# }_{\mathrm{{INNER}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{INNER}},2}^{S}\left( {{f}_{up} - {f}_{low} - 1}\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + 1,
\]

to compute a point \( {x}_{\epsilon } \) such that either (14.3.41) holds, or (14.3.42) holds for some \( {y}_{\epsilon } \) together with (14.3.43) and (14.3.44) if \( q > 1 \) , and (14.3.46) and (14.3.47) if \( q = 3 \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.9 (OCR Markdown line 17583)"
deps = ["lemma_14_3_5", "lemma_14_3_7", "lemma_14_3_8"]

