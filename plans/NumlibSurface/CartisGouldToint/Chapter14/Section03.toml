desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.3: Convergence of the LENq-SC algorithm

The LENq-SC algorithm terminates at a point satisfying (14.3.18) after at most \( {\# }_{\text{ LENq-SC }}^{I}\overset{\text{ def }}{ = }\max \left( {0,\log \left( {{\epsilon }_{0}/\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}}\right) /\log \beta }\right) \) iterations.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.3 (OCR Markdown line 16961)"
deps = ["lenqscRun"]

[[node]]
id = "theorem_14_3_4"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.4: Evaluation complexity of the LEN \( q \) -SC algorithm

Suppose that \( {\Phi }_2 \) .D1qLaB.X (for trust-region INNER algorithms) or \( {\Phi }_2 \) .D1pLaB.X (for regularization INNER algorithms) holds, and that each call to the INNER algorithm satisfies the evaluation bounds (14.3.20) and (14.3.21). Then the LENq-SC algorithm requires at most \( {}^{116} \)

\[
{\# }_{\text{ LENq-SC }}^{F} = \frac{1}{2}{\kappa }_{\text{ INNER }}^{F}\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.27}
\]

evaluations of \( {\Phi }_2\left( x\right) \) and at most

\[
{\# }_{\text{ LENq-SC }}^{D} = \frac{1}{2}{\kappa }_{\text{ INNER }}^{D}\begin{Vmatrix}{r\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.28}
\]

evaluations of its derivatives to compute an iterate \( {x}_k \) satisfying (14.3.23).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.4 (OCR Markdown line 17019)"
deps = ["lenqscRun", "theorem_14_3_3"]

[[node]]
id = "lemma_14_3_5"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.5: Consequences of the termination of the TPqp-GC algorithm

Suppose that X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold. Suppose also that the TPqp-GC algorithm terminates at iteration \( {k}_{\epsilon } \) . Then one of the two following situations will occur.

1. Infeasible approximate local minimizer of the constraint violation:

\[
\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} > \theta {\epsilon }_{0}\;\text{ and }\;{\phi }_{\nu ,\mathcal{X}\left( {x}_{\epsilon }\right) , j}^{{\delta }_{{k}_{\epsilon }, j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_{j}\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix}\frac{{\delta }_{{k}_{\epsilon }, j}^{j}}{j!}.\tag{14.3.41}
\]

2. Approximate problem solution:

\[
\begin{Vmatrix}{c\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_{0}\text{ and }{\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },1}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  {\epsilon }_{1}\begin{Vmatrix}\left( {1,{y}_{\epsilon }^{T}}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },1}\tag{14.3.42}
\]

for some \( {y}_{\epsilon } \in  {\mathbb{R}}^m \) . Moreover, if \( q > 1 \) , then

\[
{\phi }_{\mathcal{L},\mathcal{T}\left( {x}_{\epsilon }\right) ,2}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{2}\left\lbrack  {{\epsilon }_2\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },2}^2 + {\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right) \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },2}}\right\rbrack
\]

(14.3.43)

and

\[
{\phi }_{\mathcal{L},\mathcal{M}\left( {x}_{\epsilon }\right) ,2}^{{\delta }_{{k}_{\epsilon },2}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{2}{\epsilon }_2\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },2}^2,\tag{14.3.44}
\]

where

\[
\mathcal{T}\left( x\right) \overset{\text{ def }}{ = }\mathcal{X}\left( x\right)  \cap  {\ker }^{1}\left\lbrack  {{\nabla }_{x}^{1}c\left( x\right) }\right\rbrack  \;\text{ and }\;\mathcal{M}\left( x\right) \overset{\text{ def }}{ = }\mathcal{T}\left( x\right)  \cap  {\ker }^{1}\left\lbrack  {{\nabla }_{x}^{1}f\left( x\right) }\right\rbrack  .
\]

(14.3.45)

In addition, if \( q = 3 \) ,

\[
{\phi }_{\mathcal{L},\mathcal{T}\left( {x}_{\epsilon }\right) ,3}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{6}\left\lbrack  {{\epsilon }_3\parallel \left( {1,{y}_{\epsilon }^T}\right) \parallel {\delta }_{{k}_{\epsilon },3}^3}\right.
\]

\[
+ 3{\phi }_{\mathcal{L},\mathcal{X}\left( {x}_{\epsilon }\right) ,1}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right) \left. \left( {\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },3} + \begin{Vmatrix}{{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\end{Vmatrix}{\delta }_{{k}_{\epsilon },3}^2}\right) \right\rbrack
\]

(14.3.46)

and

\[
{\phi }_{\mathcal{L},\mathcal{M}\left( {x}_{\epsilon }\right) ,3}^{{\delta }_{{k}_{\epsilon },3}}\left( {{x}_{\epsilon },{y}_{\epsilon }}\right)  \leq  \frac{1}{6}{\epsilon }_3\begin{Vmatrix}\left( {1,{y}_{\epsilon }^T}\right) \end{Vmatrix}{\delta }_{{k}_{\epsilon },3}^{3}. \tag{14.3.47}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.5 (OCR Markdown line 17237)"
deps = ["tpqpgcRun"]

[[node]]
id = "lemma_14_3_6"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.6: Smoothness of \( \nu \) and \( \mu \)

(i) Suppose that c.D1pLB.X holds. Given \( {x}_0 \in  \mathcal{X} \) , let \( {\mathcal{L}}_{\nu }\left( {x}_{0}\right) \overset{\text{ def }}{ = }\{ x \in  \mathcal{X} \mid \; \parallel c\left( x\right) \parallel  \leq  \begin{Vmatrix}{c\left( {x}_0\right) }\end{Vmatrix}\} \) . Then \( \nu \left( x\right) \) is \( p \) -times continuously differentiable in an open, convex set \( {\mathcal{X}}_0 \) containing \( \mathcal{X} \) , and there are constants \( {L}_{\nu , j}^A \geq  1,{L}_{\nu , j}^B \geq  1 \) , \( {B}_{\nu , j}^A \geq  1 \) , and \( {B}_{\nu , j}^B \geq  1 \) such that

\[
\begin{Vmatrix}{{\nabla }_x^j\nu \left( x\right)  - {\nabla }_x^j\nu \left( y\right) }\end{Vmatrix} \leq  \left( {{L}_{\nu , j}^A + {L}_{\nu , j}^B\begin{Vmatrix}{c\left( {x}_0\right) }\end{Vmatrix}}\right) \parallel x - y\parallel\tag{14.3.60}
\]

and

\[
\begin{Vmatrix}{{\nabla }_x^j\nu \left( x\right) }\end{Vmatrix} \leq  {B}_{\nu , j}^A + {B}_{\nu , j}^B\begin{Vmatrix}{c\left( {x}_0\right) }\end{Vmatrix}\tag{14.3.61}
\]

for all \( x \in  {\mathcal{L}}_{\nu }\left( {x}_0\right) \) , all \( y \in  {\mathcal{X}}_0 \) , and every \( j \in  \left\lbrack  {1 : p}\right\rbrack \) .

(ii) Suppose that c.D1pLB.X and f.D1pLB.X hold. Let \( {\mathcal{L}}_{\mu }\overset{\text{ def }}{ = }\{ x \in  \mathcal{X} \mid \; \parallel r\left( {x, t}\right) \parallel  \leq  1 \mid  \} \) . Then \( \mu \left( {x, t}\right) \) is \( p \) -times continuously differentiable in an open, convex set \( {\mathcal{X}}_0 \) containing \( \mathcal{X} \) , and there are constants \( {L}_{\mu , j} \geq  1 \) and \( {B}_{\mu , j} \geq  1 \) , independent of \( t \) , such that

\[
\begin{Vmatrix}{{\nabla }_x^j\mu \left( {x, t}\right)  - {\nabla }_x^j\mu \left( {y, t}\right) }\end{Vmatrix} \leq  {L}_{\mu , j}\parallel x - y\parallel\tag{14.3.62}
\]

and

\[
\begin{Vmatrix}{{\nabla }_x^j\nu \left( x\right) }\end{Vmatrix} \leq  {B}_{\mu , j}\tag{14.3.63}
\]

for all \( x \in  {\mathcal{L}}_{\mu } \) , all \( y \in  {\mathcal{X}}_0 \) , and every \( j \in  \left\lbrack  {1 : p}\right\rbrack \) .

Documented source/OCR correction and formalization requirements: OCR correction: (14.3.63) bounds ||∇_x^j μ(x,t)|| by B_(μ,j), not ||∇_x^j ν(x)||. μ has the additional target parameter t. The set Lμ(t)={x∈X:||r(x,t)||≤1} depends on t; all Lipschitz and derivative bounds are uniform in t on their stated level sets.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.6 (OCR Markdown line 17443)"
deps = ["leastSquaresMerit"]

[[node]]
id = "lemma_14_3_7"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.7: Evaluation complexity of Phase 1 of the TPqp-GC algorithm

Suppose that X.CNe and c.D1pLB.X hold. Then there are constants \( {\kappa }_{\mathrm{NNER}}^{F,\nu } \) and \( {\kappa }_{\text{ INNER }}^{D,\nu } \) depending on \( \begin{Vmatrix}{c\left( {x}_0\right) }\end{Vmatrix} \) such that Phase 1 of the TPqp-GC algorithm terminates at a point \( {x}_1 \) for which either

\[
\begin{Vmatrix}{c\left( {x}_{1}\right) }\end{Vmatrix} \leq  \theta {\epsilon }_{0}\;\text{ or }\;{\phi }_{\nu ,\mathcal{X}\left( {x}_{1}\right) , j}^{{\delta }_{{k}_{1}, j}\left( {x}_{1}\right) } \leq  {\epsilon }_{j}\begin{Vmatrix}{c\left( {x}_{1}\right) }\end{Vmatrix}\frac{{\delta }_{k, j}^{j}}{j!}\tag{14.3.64}
\]

in at most

\[
{\# }_{\text{ INNER },1}^{F}\overset{\text{ def }}{ = }\frac{1}{2}{\kappa }_{\text{ INNER }}^{F,\nu }\left( \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\right) \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\theta }^{1 - {\pi }_{j}}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}
\]

\[
= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_0^{1 - {\pi }_j}{\epsilon }_j^{-{\pi }_j}}\right)
\]

(14.3.65)

evaluations of \( c \) and at most

\[
{\# }_{\text{ INNER,1 }}^{D}\overset{\text{ def }}{ = }\frac{1}{2}{\kappa }_{\text{ INNER }}^{D,\nu }\left( \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\right) \begin{Vmatrix}{c\left( {x}_{0}\right) }\end{Vmatrix}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}\frac{{\beta }^{1 - 2{\pi }_{j}}}{{\beta }^{1 - {\pi }_{j}} - 1}{\theta }^{1 - {\pi }_{j}}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}
\]

\[
= \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_0^{1 - {\pi }_j}{\epsilon }_j^{-{\pi }_j}}\right)
\]

(14.3.66)

evaluations of its derivatives.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.7 (OCR Markdown line 17481)"
deps = ["theorem_14_3_4", "lemma_14_3_6"]

[[node]]
id = "lemma_14_3_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.3.8: Bounds on the size of \( {\mathcal{I}}_k \) and \( {\mathcal{I}}_k^{\mathrm{s}} \)

Suppose that X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold. Then there are constants \( {\kappa }_{\text{ INNER },2}^{s},{\kappa }_{\text{ INNER },2}^{A} \) , and \( {\kappa }_{\text{ INNER },2}^{C} \) such that, for each \( k \in  {\mathcal{K}}_a \) before termination,

\[
\left| {\mathcal{I}}_{k}^{s}\right|  \leq  {\kappa }_{\text{ INNER },2}^{s}\left( {1 - \theta }\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{2 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}\tag{14.3.71}
\]

and

\[
\left| {\mathcal{I}}_{k}\right|  \leq  {\kappa }_{\text{ INNER },2}^{A}\left( {1 - \theta }\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{2 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + {\kappa }_{\text{ INNER },2}^{C}.\tag{14.3.72}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.3.8 (OCR Markdown line 17559)"
deps = ["theorem_14_3_4", "lemma_14_3_6"]

[[node]]
id = "theorem_14_3_9"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.3.9: Complexity of finding \( q \) th-order approximate minimizers by the TP \( {qp} \) -GC algorithm

Suppose that the INNER algorithm is of regularization type and X.CNe, c.D1pLB.X, f.D1pLB.X, and f.B.Fb hold, or that the INNER algorithm is of trust-region type and X.CNe, c.D1qLB.X, f.D1qLB.Fb, and f.B.Fb hold. Then there exist constants \( {\kappa }_{\text{ INNER },2}^{S},{\kappa }_{\text{ INNER },2}^{A} \) , and \( {\kappa }_{\text{ INNER },2}^{C} \) such that, for any \( {\epsilon }_0 \in  (0,1\rbrack \) and \( \epsilon  \in  (0,1{\rbrack }^q \) , the TP \( {qp} \) -GC algorithm requires at most

\[
{\# }_{\text{ TPqpGC@TPqpGC }}^{F}\overset{\text{ def }}{ = }{\# }_{\text{ INNER,1 }}^{F} + {\# }_{\text{ INNER,2 }}^{F} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-1},\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}}\right\rbrack  }\right)
\]

evaluations of \( f \) and \( c \) and at most

\[
{\# }_{\text{ TPqpGC@TPqpGC }}^{D}\overset{\text{ def }}{ = }{\# }_{\text{ INNER },1}^{D} + {\# }_{\text{ INNER },2}^{D} = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}}}\right)
\]

evaluations of their derivatives, where the \( {\left\{  {\pi }_j\right\}  }_{j = 1}^q \) are defined in (14.2.12), \( {\# }_{\text{ INNER },1}^{F} \)


and \( {\# }_{\text{ INNER },1}^{D} \) are given by (14.3.65) and (14.3.66), and

\[
{\# }_{\mathrm{{INNER}},2}^{F}\overset{\text{ def }}{ = }\left( {{f}_{up} - {f}_{low} - 1}\right) \left( {{\kappa }_{\mathrm{{INNER}},2}^{A}\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + {\kappa }_{\mathrm{{INNER}},2}^{C}{\epsilon }_{0}^{-1}}\right)  + 1
\]

and

\[
{\# }_{\mathrm{{INNER}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{INNER}},2}^{S}\left( {{f}_{up} - {f}_{low} - 1}\right) \mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{0}^{1 - {\pi }_{j}}{\epsilon }_{j}^{-{\pi }_{j}} + 1,
\]

to compute a point \( {x}_{\epsilon } \) such that either (14.3.41) holds, or (14.3.42) holds for some \( {y}_{\epsilon } \) together with (14.3.43) and (14.3.44) if \( q > 1 \) , and (14.3.46) and (14.3.47) if \( q = 3 \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.3.9 (OCR Markdown line 17583)"
deps = ["lemma_14_3_5", "lemma_14_3_7", "lemma_14_3_8"]
