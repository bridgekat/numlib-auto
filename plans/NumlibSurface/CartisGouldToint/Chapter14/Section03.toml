[[node]]
id = "theorem_14_3_4"
kind = "theorem"
desc = '''
Theorem 14.3.4 (corrected). Suppose Φ₂.D1qLaB.X (`AssumptionD1qLaBX Φ₂ X X₀ x₀ 1 q`, trust-region
INNER) or Φ₂.D1pLaB.X (regularization INNER), `π_j > 1`, and every call satisfies the contract
`nF k ≤ innerEvalBound κF π q (Φ₂(x_{k-1})) (β ‖r(x_{k-1})‖ ε)` (with `flow = 0`), likewise `nD`.
Then a LENq-SC run terminating at `k_max` uses
`∑_{k ∈ Icc 1 k_max} nF k ≤ ½ κF ‖r(x₀)‖ ∑_{j ∈ Icc 1 q} β^{1-2π_j}/(β^{1-π_j} - 1) ε₀^{1-π_j} ε_j^{-π_j}`
evaluations of Φ₂ ((14.3.27) with `max_j` replaced by `∑_j`), and likewise for derivatives (14.3.28).
Correction: the book's proof exchanges `∑_k max_j` for `max_j ∑_k`, which is invalid (the maximizing
`j` depends on `‖r(x_{k-1})‖`); with `∑_j` (or `q · max_j`) the bound and its order are correct.
Proof: (14.3.29) `‖r(x_{k-1})‖ > β^{k-k_max} ε₀`, `Optimization.sum_rpow_le_of_geometric_lower`
per `j`.
'''
deps = ["theorem_14_3_3", "innerEvalBound", "AssumptionD1qLaBX", "Optimization.sum_rpow_le_of_geometric_lower"]
