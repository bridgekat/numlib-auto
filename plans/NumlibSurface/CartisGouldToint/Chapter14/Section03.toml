[[node]]
id = "IsInnerPhaseRun"
kind = "def"
desc = '''
Contract for the inner runs of Phase 2 (abstraction of Lemmas 14.2.2–14.2.3 for INNER applied to
`μ(·, t_k)`, with constants independent of `t_k` by Lemma 14.3.6(ii)): for outer index `k`, inner
iterates `xin k : ℕ → E` with `xin k 0 = x k`, `xin k (e k) = x (k+1)`, success flags
`sin k : ℕ → Prop`, constants `κdecr κuns κunc > 0`, exponents `π`, and `β`:
(mono) `targetMerit f c (t k)` is nonincreasing along `xin k i`, `i ≤ e k`, and unchanged at
unsuccessful `i`; (count) `i + 1 ≤ κuns * |{i' ≤ i | sin k i'}| + κunc` for `i < e k`;
(decrease) for successful `i < e k` such that the third test of (14.3.32) fails at
`xin k (i+1)` (with target `t k`):
`targetMerit (xin k i) - targetMerit (xin k (i+1)) ≥ κdecr * min_{l ∈ Icc 1 q}
(β * targetResidual f c (t k) (x k) * ε l) ^ π l` ((B.14.21); the book applies Lemma 14.2.2 "so
long as the third termination test in (14.3.32) has not been satisfied").
A 𝒦_b call whose final point passes the third test gets no decrease guarantee on its last iteration
("bad" 𝒦_b call); the printed proof does not bound their number (same gap as Lemma 7.2.6, found
independently by the Chapter 6–7 planner), so the corrected Lemma 14.3.8 / Theorem 14.3.9 carry
their number `n_bad` explicitly.
'''
deps = ["Constrained.targetResidual"]
source = "Cartis–Gould–Toint, Lemmas 14.2.2–14.2.3 as used in the proof of Lemma 14.3.8"

[[node]]
id = "algorithm_14_3_2"
kind = "def"
desc = '''
Algorithm 14.3.2 (TPqp-GC) as a run predicate `IsTPqpGCRun f c X q θ β₁ β ε x t δ …` with
`ε j ∈ (0,1]`, `θ ∈ (0,1)`, `β ∈ (0, θ]`, `q ∈ {1,2,3}` for the conclusions:
Phase 1: an `algorithm_14_3_1` run on `r = c` (Φ₂ = ν) from `x 0 ∈ X` with
`β₁ ∈ (0,1)`, `β₁ ‖c(x 0)‖ < 1` and primal tolerance `θ ε₀`, whose terminal point is `x 1` with radii
`δ 1` satisfying (14.3.31); if `‖c (x 1)‖ > θ ε₀` the run terminates (Phase-1 exit).
Phase 2: `Constrained.IsTargetSequence f c θ ε₀ x t Ka K` with `Ka k :↔ targetResidual f c (t k) (x (k+1)) < θ ε₀` (the printed `<` of Step 2(a)) (Step 0, Step 2 (a)/(b) target updates);
for each `k ∈ [1, K)` the call satisfies (14.3.32): `x (k+1) ∈ X`, `δ (k+1) ∈ (0,1]^q`, and
`targetResidual f c (t k) (x (k+1)) < θ ε₀ ∨ f (x (k+1)) < t k ∨ ∀ j ∈ Icc 1 q,
taylorMeasure (ftaylorSeries ℝ (targetMerit f c (t k)) (x (k+1))) j (δ (k+1) j) X(x (k+1)) ≤
ε j * targetResidual f c (t k) (x (k+1)) * δ (k+1) j ^ j / j!` (and is produced by INNER with
tolerance `β ‖r(x_k, t_k)‖ ε`, inner data as in `IsInnerPhaseRun`); termination at outer `K`:
Step 2(a)/(b) with (14.3.34) at `(x K, t K)`, or Step 2(c) with `(x_ε, t_ε) = (x K, t (K-1))`.
Existence (part of node) given INNER solvers for `ν` and `μ(·,t)` that always return.
'''
deps = ["algorithm_14_3_1", "IsInnerPhaseRun", "Constrained.IsTargetSequence", "Constrained.targetResidual"]
source = "Cartis–Gould–Toint, Algorithm 14.3.2"

