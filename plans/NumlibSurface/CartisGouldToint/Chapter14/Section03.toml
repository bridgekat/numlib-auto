[[node]]
id = "lemma_14_3_8"
kind = "theorem"
desc = '''
Lemma 14.3.8 (corrected). Under X.CNe, c.D1pLB.X, f.D1pLB.X, f.B.Fb and the inner contract
`IsInnerPhaseRun` (constants `κdecr, κuns, κunc`, exponents `π_l > 1`, `π_max = max π_l`), for each
block of Phase 2 — the calls `k+1, …, k+ℓ(k)` between an index `k ∈ 𝒦_a ∪ {0}` (Phase-2 start
treated as `𝒦_a`) and the next `𝒦_a` index or termination, *including* the call that ends in `𝒦_a` —
the number of "good" successful inner iterations (decrease guaranteed and
`‖r_{i+1}‖ ≥ θ‖r_i‖`) is at most `G := κ^S (1-θ) max_l ε₀^{2-π_l} ε_l^{-π_l}` (14.3.71), with
`κ^S := κdecr⁻¹ β^{-π_max} θ^{1-2π_max}` (book: `(βθ)^{-π_max}`, see
`Constrained.card_le_of_residual_block`); the block has at most `G + 1 + nb` calls and as many
successful inner iterations, and at most `(κuns + κunc) (G + 1 + nb)` inner iterations (14.3.72),
where `nb` is the number of bad 𝒦_b calls of the block (`IsInnerPhaseRun`). The `+1` is the
call ending in `𝒦_a` (its last iteration breaks the ratio condition); `κunc` is paid per call
because each INNER call is a fresh run (the book's single `κ^C_{INNER,2} = κ_unc` treats a block as
one run); each good 𝒦_b call contains a good iteration, which bounds the number of calls.
'''
deps = ["algorithm_14_3_2", "lemma_14_3_6_ii", "Constrained.IsTargetSequence.props", "Constrained.card_le_of_residual_block"]
source = "Cartis–Gould–Toint, Lemma 14.3.8 (proof in Appendix B)"

[[node]]
id = "theorem_14_3_9"
kind = "theorem"
desc = '''
Theorem 14.3.9 (corrected constants; orders as in the book when `n_bad` is bounded independently of
`ε`). Under the assumptions of Lemmas 14.3.5–14.3.8 (regularization-type INNER with c.D1pLB.X,
f.D1pLB.X; or trust-region-type with the `q` versions), for `ε₀ ∈ (0,1]` and `ε j ∈ (0,1]`, every
TPqp-GC run that terminates (conclusions of Lemma 14.3.5) uses at most `#F := #F₁ + #F₂`
evaluations of `f` and `c` and `#D := #D₁ + #D₂` of their derivatives, where `#F₁, #D₁` are the
Phase-1 bounds of Lemma 14.3.7, `N_a := (fup - flow + 1)/((1-θ) ε₀)` bounds `|𝒦_a|`
(`Constrained.IsTargetSequence.card_Ka_le`; the book's `fup - flow - 1` is a sign slip), there are
at most `N_a + 1` blocks, `n_bad` is the number of bad 𝒦_b calls of the run, `G` is as in Lemma
14.3.8, and `#F₂ := (κuns + κunc) ((N_a + 1)(G + 1) + n_bad) + 1`,
`#D₂ := (N_a + 1)(G + 1) + n_bad + 1`. Asymptotically (part of node, `ε₀, ε_l ≤ 1`, `n_bad`
bounded): `#F = O(max(ε₀^{-1}, max_l ε₀^{1-π_l} ε_l^{-π_l}))` as in the book, and
`#D = O(max(ε₀^{-1}, max_l ε₀^{1-π_l} ε_l^{-π_l}))` (the book's `O(max_l ε₀^{1-π_l} ε_l^{-π_l})`
drops the `ε₀^{-1}` coming from at least one success per block; the book's explicit `#F₂` also omits
the `1/(1-θ)` of its `κ^C ε₀^{-1}` term). Whether `n_bad` is bounded is not established by the book
(see `IsInnerPhaseRun`); compare with the source paper [105] before formalizing.
'''
