[[node]]
id = "lemma_14_2_2"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.2.2: Function decrease at successful iterations (in the presence of simple constraints)

Suppose that f.D1qLaB.X (for TR algorithms) or f.D1pLaB.X (for AR algorithms) holds. Then there exist algorithm-dependent constants \( {\kappa }_{\text{ decr }} \) so that

\[
f\left( {x}_{k}\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_{\text{ decr }}\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{{\pi }_{j}}\tag{14.2.11}
\]

for each \( k \in  \mathcal{S} \) , where

\[
{\pi }_{j} = \left\{  \begin{array}{lll} \frac{p + 1}{p - j + 1} & \text{ for ARqp-SC } & \text{ for }q = 1,\mathcal{X}\text{ convex } \\  \frac{j\left( {p + 1}\right) }{p} & \text{ for ARqp-SC } & \text{ in all other cases; } \\  \frac{j\left( {p + 1}\right) }{p - j + 1} & \text{ for ARqp-SC } & \text{ in all other cases; } \\  \frac{p + 1}{p - j + 1} & \text{ for ARqpC-SC } & \text{ for }q = 1, h,\mathcal{X}\text{ convex; } \\  j + 1 & \text{ for TRq-SC. } &  \end{array}\right.\tag{14.2.12}
\]

Suppose instead that f.D0qLaB.X (for TR algorithms) or f.D0pLaB.X (for AR algorithms) holds. Then the guaranteed decreases for the TRqIDA-SC and TRqEDA-SC algorithms are identical to those stated for TRq-SC, and the decreases for the ARqpIDA-SC and ARqpEDA-SC algorithms are identical to those stated for ARqp-SC.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.2.2 (OCR Markdown line 16315)"
deps = ["highOrderConstrainedCriticality", "lemma_12_2_4", "lemma_12_2_13"]

[[node]]
id = "lemma_14_2_3"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.2.3: Count of successful iterations

Suppose that the TRq-SC algorithm is applied and f.D1qLaB.X holds or that the ARqp-SC algorithm is applied and f.D1pLaB.X holds. Then there are algorithm-dependent constants \( {\kappa }_{\text{ uns }} \) and \( {\kappa }_{\text{ unc }} \) for which

\[
k \leq  {\kappa }_{\text{ uns }}\left| {\mathcal{S}}_{k}\right|  + {\kappa }_{\text{ unc }}\tag{14.2.13}
\]

where \( {\mathcal{S}}_k = \mathcal{S} \cap  \left\lbrack  {0 : k}\right\rbrack \) and \( \mathcal{S} \) is the index set of successful iterations. The same is true for the TRqIDA-SC and TRqEDA-SC algorithms under f.D0qLaB.X and the ARqpIDA-SC and ARqpEDA-SC algorithms under f.D0pLaB.X.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.2.3 (OCR Markdown line 16335)"
deps = ["lemma_14_2_2"]

[[node]]
id = "theorem_14_2_4"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.2.4: Complexity in the presence of simple constraints

Suppose that the feasible set \( \mathcal{X} \) corresponds to simple constraints, that \( \mathbf{X} \) .CNe, f.bB.X, and f.D0pLaB.X (or f.D0qLaB.X in the trust-region case) hold, and that \( {\phi }_{f,\mathcal{X}\left( x\right) , j}^{{\delta }_j}\left( x\right) \) is as defined by (14.2.2). Suppose also that, for all iterations \( k \) of regularization algorithms, either \( {\delta }_{k, j} = 1 \) for \( j \in  \left\lbrack  {1 : q}\right\rbrack \) if \( q = 1 \) and \( \mathcal{X} \) is convex or \( q = 2 \) and \( \mathcal{X} = {\mathbb{R}}^n \) (as discussed above) or that (12.2.51) holds (as allowed by Lemma 12.2.9). Then the complexity results for the \( \mathrm{AR}{qp},\mathrm{AR}{qp}\mathrm{C},\mathrm{AR}{qp}\mathrm{IDA} \) , \( \mathrm{AR}{qp}\mathrm{EDA},\mathrm{TR}q,\mathrm{TR}q\mathrm{IDA} \) , and \( \mathrm{TR}q\mathrm{EDA} \) algorithms extend to their variants for simple constraints, with the aim of finding an \( {x}_{\epsilon } \in  \mathcal{X} \) for which

\[
{\phi }_{f,\mathcal{X}\left( {x}_{\epsilon }\right) , j}^{{\delta }_{j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_{j}\frac{{\delta }_{j}^{j}}{j!}\;\text{ for all }\;j \in  \left\lbrack  {1 : q}\right\rbrack  ,
\]

as indicated in the following table.

<table><tr><td>Adapted algorithm</td><td>Applicable result</td><td>Evaluation-complexity order with simple constraints</td></tr><tr><td>ARqp-SC</td><td>Thm. 12.2.14 (p. 311)</td><td>( \( q = 1;\mathcal{X} \) convex or <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right) \; \left. {q = 2;\mathcal{X} = {\mathbb{R}}^n}\right) \) <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right) \) (otherwise)</td></tr><tr><td>ARqpC-SC</td><td>Thm. 14.1.10 (p. 384)</td><td>\( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right) \; \left( {q = 1;h,\mathcal{X}\text{ convex }}\right) \) <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {j + 1}\right) }}\right) \) (otherwise)</td></tr><tr><td>ARqpIDA-SC</td><td>Thm. 13.1.19 (p. 349)</td><td>\( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right) \; (q = 1;\mathcal{X} \) convex or \( \left. {q = 2;\mathcal{X} = {\mathbb{R}}^n}\right) \) <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right) \) (otherwise)</td></tr></table>

(continued)

<table><tr><td>Adapted algorithm</td><td>Applicable result</td><td>Evaluation-complexity order with simple constraints</td></tr><tr><td>ARqpEDA-SC</td><td>Thm. 13.3.8 (p. 368)</td><td>\( (q = 1;\mathcal{X} \) convex or <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{p + 1}{p - j + 1}}}\right) \; \left. {q = 2;\mathcal{X} = {\mathbb{R}}^n}\right) \) <br> \( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\frac{j\left( {p + 1}\right) }{p}}}\right) \) (otherwise)</td></tr><tr><td>TRq-SC</td><td>Thm. 12.2.5 (p. 297)</td><td>\( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {q + 1}\right) }}\right) \)</td></tr><tr><td>TRqIDA-SC</td><td>Thm. 13.1.8 (p. 335)</td><td>\( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {q + 1}\right) }}\right) \)</td></tr><tr><td>TRqEDA-SC</td><td>Thm. 13.3.4 (p. 362)</td><td>\( \mathcal{O}\left( {\mathop{\max }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{-\left( {q + 1}\right) }}\right) \)</td></tr></table>

Moreover, the orders of complexity mentioned in the last column of the table are sharp.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.2.4 (OCR Markdown line 16349)"
