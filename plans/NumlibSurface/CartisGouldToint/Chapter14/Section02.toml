[[node]]
id = "sparseMeasure_eq"
kind = "theorem"
desc = '''
(14.2.17)–(14.2.18) on `Fin n → ℝ` (sup norm): for `x ∈ Subproblem.sparseSet n nnz` and `f`
differentiable at `x`, `Optimization.taylorMeasure (ftaylorSeries ℝ f x) 1 δ
{d | x + d ∈ sparseSet n nnz} = -min_{‖d‖_∞ ≤ δ, ‖x+d‖₀ ≤ nnz} ⟨∇f(x), d⟩` (the book writes
`max ℓ(d)`; it must be `min` — or `max -ℓ(d)`), and the minimizing displacement of Lemma 14.2.5 is
an admissible TR1-SP step. (Bridge from `EuclideanSpace` gradients to `Fin n → ℝ` coordinates via
`WithLp.equiv`.)
'''
deps = ["Subproblem.isMinOn_sparseLinearStep", "Optimization.taylorMeasure"]
source = "Cartis–Gould–Toint, (14.2.17)–(14.2.19)"

[[node]]
id = "lemma_14_2_5"
kind = "theorem"
desc = '''
Lemma 14.2.5. For `x` with `‖x‖₀ ≤ n_nz`, `g = ∇f(x)`, `δ ≥ 0` and `τ` solving the knapsack
(14.2.21), the vector (14.2.20) `Subproblem.sparseLinearStep x g δ τ` solves the minimization
version of (14.2.18): it is feasible (`‖d‖_∞ ≤ δ`, `‖x + d‖₀ ≤ n_nz`) and minimizes
`d ↦ ⟨g, d⟩` there. (Statement of `Subproblem.isMinOn_sparseLinearStep`; the book's `max` in
(14.2.18) is a slip for `min`.)
'''
deps = ["Subproblem.isMinOn_sparseLinearStep"]
source = "Cartis–Gould–Toint, Lemma 14.2.5"
