[[node]]
id = "lemma_14_1_7"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.1.7: A useful inequality (for the ARqpC algorithm)

Suppose that f.D1pL, c.D1pL, h.L, and h.S0 hold. Suppose also that iteration \( k \) is successful and that the ARqpC algorithm does not terminate at iteration \( k + 1 \) . Then there exists a \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\left( {1 - \theta }\right) {\epsilon }_j\frac{{\delta }_{k + 1, j}^j}{j!} \leq  \left( {{L}_{w, p} + {\sigma }_{\max }}\right) \mathop{\sum }\limits_{\ell  = 1}^j\frac{{\delta }_{k + 1, j}^{\ell }}{\ell !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - \ell  + 1} + \frac{\sqrt{m}{L}_{h,0}{L}_{c, p}}{\left( {p + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1},
\]

(14.1.30)

where \( {\sigma }_{\max } \) is given by (14.1.26).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.1.7 (OCR Markdown line 16015)"
deps = ["lemma_14_1_6"]

wrong = "The literal outer Algorithm14.1.1 allows a nonunit convex first-order model radius, and then the single residual value-error term in14.1.30 is insufficient. Formal lemma_14_1_7_counterexample uses f(t)=-251t/1000,c(t)=t/4-1/4000-t^2/100,h=abs,p=q=1,s=1/1000,sigma=1,Lf=1,Lc=1/50,theta=1/10,epsilon=2/5,zeta=1,delta0=1/2000,deltaNext=1/24998000. The actual model is globally minimized at s, both true initial/next tests fail, the true ratio50099/50100 accepts and all updates are legal; printed sigmaMax=153/25 yields a false rational inequality. The optional detailed Algorithm14.1.2 convex unit-radius choice excludes this example but is not a hypothesis of14.1.7. A generally valid criticality transfer includes twice the residual value error."

[[node]]
id = "lemma_14_1_8"
wrong = "The literal general-branch step floor in (14.1.31) omits its accuracy factor. lemma_14_1_8_counterexample gives p=q=1, globally smooth f(x)=x^2/2, c=0, and the nonconvex globally unit Lipschitz subadditive outer function min(abs(t),1). A genuine detailed ARqpC trial from -10^(-6) uses parameter2 and its true global model minimum step5*10^(-7), is accepted at ratio3/4, and remains nonterminal at epsilon=2.5*10^(-7). All actual unit radii satisfy the exact source floor; printed cap24, radius coefficient1/480 and general-branch step floor1/74880 are retained. The step is below that floor. The alternative OCR parsing of 3j! as (3j)! is also refuted. The valid accuracy-dependent bounds remain distinct."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.1.8: Lower bound on the step for the ARqpC algorithm

Suppose that f.D1pL, c.D1pL, h.L, and h.S0 hold, that iteration \( k \) is successful, and that the ARqpC algorithm does not terminate at iteration \( k + 1 \) . In addition, suppose the algorithm ensures for each \( k \) that either \( {\delta }_{{s}_k,1} = 1 \) , if \( q = 1 \) and \( h \) is convex, or otherwise (14.1.28) holds for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) (as is possible, according to Lemma 14.1.3). Then there exists a \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\begin{Vmatrix}{s}_{k}\end{Vmatrix} \geq  \left\{  \begin{array}{ll} {\left( \frac{1 - \theta }{{3j}!\left( {{L}_{w, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{1}{p}}{\epsilon }_{j}^{\frac{1}{p}} & \text{ if }q = 1\text{ and }h\text{ is convex, } \\  {\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{j}}{{3j}!\left( {{L}_{w, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{1}{p - j + 1}} & \text{ otherwise, } \end{array}\right.
\]

(14.1.31)

where \( {\kappa }_{\delta ,\min } \) is defined by (14.1.29), \( {L}_{w, p} \) by (14.1.27), and \( {\sigma }_{\max } \) by (14.1.26).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.1.8 (OCR Markdown line 16031)"
deps = ["lemma_14_1_7"]

[[node]]
id = "lemma_14_1_9"
wrong = "The literal Equation14.1.33 claims decrease of f rather than the full composite objective w. Formal lemma_14_1_9_counterexample has f(x)=x/2,c(x)=x-1,h=abs,p=q=1,sigma=1/2,epsilon=1/4,unit radii and a genuine global model minimizing step1. The actual detailed run has ratio1, legal constant parameter updates, initial criticality1/2 and terminal criticality0. Its full objective decreases by1/2 while f increases by1/2, violating the printed positive bound. The trial is the final accepted trial before the endpoint check; the literal numbered statement includes every trial before termination and does not assume failure of the next-iterate test. Valid full-objective decrease and rate results remain in RunBudget and the detailed-solver complexity companion."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 14.1.9: Model and function decreases (ARqpC)

Suppose that f.D1qL holds. Then

\[
\Delta {T}_{w, p}\left( {{x}_k,{s}_k}\right)  \geq  {\kappa }_{\Delta m}\mathop{\min }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{{\pi }_j}\tag{14.1.32}
\]

for every iteration of algorithm ARqpC before termination, where

\[
{\kappa }_{\Delta m}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{1 - \theta }{{3q}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{p + 1}{p}} & \text{ if }q = 1\text{ and }h\text{ is convex, } \\  \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{q}}{{3q}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{p + 1}{p - q + 1}} & \text{ otherwise, } \end{array}\right.
\]

with \( {\kappa }_{\delta ,\min } \) given by (14.1.29), \( {\sigma }_{\max } \) given by (14.1.26), and

\[
{\pi }_{j}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{p + 1}{p} & \text{ if }q = 1\text{ and }h\text{ is convex, } \\  j + 1 & \text{ otherwise. } \end{array}\right.
\]

If, in addition, \( k \in  \mathcal{S} \) ,

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\eta }_1{\kappa }_{\Delta m}\mathop{\min }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{{\pi }_j}.\tag{14.1.33}
\]

Documented source/OCR correction and formalization requirements: OCR correction: the successful decrease in (14.1.33) is w(xk)−w(x_(k+1)), the composite objective, rather than f(xk)−f(x_(k+1)). The acceptance ratio concerns w and alone gives no such lower bound for f.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 14.1.9 (OCR Markdown line 16047)"
deps = ["lemma_14_1_8"]

[[node]]
id = "theorem_14_1_10"
wrong = "The literal outer Algorithm14.1.1 Step2 permits nonincrease plus the norm(s)>=1 bypass, and exits at zero decrease. Formal counterexample uses p=q=1, f(x)=(x-2)^2/2, c=0, h=abs, x0=0, sigma0=sigmaMin=1, epsilon=1/2 and all radii1. The actual model is 2-2s+s^2/2; returned s=4 has the same model value as0 and norm4, but actual criticality at x0 is2*delta for every positive delta. The initial computed direction1 exactly attains criticality2 and fails the test. All global smoothness, derivative Lipschitz, bounded-below and outer assumptions hold. The immediate exit precedes any acceptance ratio or parameter update and produces only x0, which has no certifying radius. Detailed Algorithm14.1.2 excludes this return by its positive global-gap fraction, and its valid companion is retained."
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 14.1.10: qth-order complexity for the ARqpC algorithm

Suppose that f.D1pL, c.D1pL, h.L, h.S0, and w.Bb hold. Suppose also that the \( \mathrm{AR}{qp}\mathrm{C} \) (p. 376) algorithm ensures, for each \( k \) , that either \( {\delta }_{{s}_k,1} = 1 \) if \( q = 1 \) and \( h \) is convex or otherwise (14.1.28) holds for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

1. Suppose \( q = 1 \) and \( h \) is convex. Then there exist positive constants \( {\kappa }_{\mathrm{ARqpC}}^{s,1} \) , \( {\kappa }_{\text{ ARqpC }}^{a,1} \) , and \( {\kappa }_{\text{ ARqpC }}^{c} \) such that, for any \( \epsilon  \in  (0,1\rbrack \) , the ARqpC algorithm requires at most

\[
{\# }_{\mathrm{{ARqpC}}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpC}}}^{a,1}\frac{w\left( {x}_{0}\right)  - {w}_{\mathrm{{low}}}}{{\epsilon }^{\frac{p + 1}{p}}} + {\kappa }_{\mathrm{{ARqpC}}}^{c,1} = \mathcal{O}\left( {\epsilon }^{-\frac{p + 1}{p}}\right)\tag{14.1.34}
\]

evaluations of \( f \) and \( c \) and at most

\[
{\# }_{\mathrm{{ARqpC}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpC}}}^{s,1}\frac{w\left( {x}_{0}\right)  - {w}_{\text{ low }}}{{\epsilon }^{\frac{p + 1}{p}}} + 2 = \mathcal{O}\left( {\epsilon }^{-\frac{p + 1}{p}}\right)\tag{14.1.35}
\]

evaluations of the derivatives of \( f \) and \( c \) of orders one to \( p \) to produce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{w, j}^1\left( {x}_{\epsilon }\right)  \leq  \epsilon \) for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

2. Suppose that \( h \) is nonconvex or that \( q > 1 \) . Then there exist positive constants \( {\kappa }_{\text{ ARqp }}^{s,2},{\kappa }_{\text{ ARqp }}^{a,2} \) , and \( {\kappa }_{\text{ ARqp }}^{c} \) such that, for any \( \epsilon  \in  (0,1{\rbrack }^q \) , the ARqpC algorithm requires at most

\[
{\# }_{\text{ ARqpC }}^{F}\overset{\text{ def }}{ = }{\kappa }_{\text{ ARqpC }}^{a,2}\frac{w\left( {x}_{0}\right)  - {w}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{j + 1}} + {\kappa }_{\text{ ARqpC }}^{c} = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\left( {j + 1}\right) }}\right)\tag{14.1.36}
\]

evaluations of \( f \) and \( c \) and at most

\[
{\# }_{\mathrm{{ARqpC}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARqpC}}}^{s,2}\frac{w\left( {x}_{0}\right)  - {w}_{\mathrm{{low}}}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{j + 1}} + 2 = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\left( {j + 1}\right) }}\right)\tag{14.1.37}
\]

evaluations of the derivatives of \( f \) and \( c \) of orders one to \( p \) to produce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{w, j}^{{\delta }_{\epsilon }}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon , j}^j/j \) ! for some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \) and all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 14.1.10 (OCR Markdown line 16083)"
deps = ["lemma_14_1_4", "lemma_14_1_9"]


