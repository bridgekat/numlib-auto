(and `X`) convex, `π_j = j + 1` otherwise, and
`κ_{Δm} = σ_min/(p+1)! ((ς-θ)/(3 q! (L_{w,p} + σ_max)))^{(p+1)/p}`, resp.
`σ_min/(p+1)! ((ς-θ) κ_{δ,min}^q/(3 q! (L_{w,p} + σ_max)))^{(p+1)/(p-q+1)}` (uniform in `j` since
the base is `≤ 1`). Corrections: the book writes `L_{f,p}` and `f` for `L_{w,p}` and `w`, assumes
only f.D1qL, and claims (14.1.32) "for every iteration before termination".
'''
deps = ["lemma_14_1_8", "lemma_14_1_5", "Optimization.le_sigma_of_arUpdate", "Optimization.sub_le_of_le_reductionRatio"]
source = "Cartis–Gould–Toint, Lemma 14.1.9"

[[node]]
id = "theorem_14_1_10_i"
kind = "theorem"
desc = '''
Theorem 14.1.10, part 1 (`q = 1`, `h` convex; `X = univ` or convex for -SC). Under f.D1pL,
c.D1pL, h.L, h.S0, w.Bb (`wlow`), with `δ_{s_k,1} = 1` (and `δ₀ 1 = 1`), for every ARqpC run and
`ε₁ ∈ (0,1]` there is `k_ε` with `IsFirstHit test k_ε`, `stopTest k_ε` (no Step-2 termination),
`compositeTaylorMeasure Dfk_ε Dck_ε h 1 1 Xk_ε ≤ ε₁`,
`funEvalCount k_ε ≤ κ^{a,1} (w(x₀) - wlow) ε₁^{-(p+1)/p} + κ^c` (14.1.34) and
`derivEvalCount succ k_ε ≤ κ^{s,1} (w(x₀) - wlow) ε₁^{-(p+1)/p} + 2` (14.1.35), where
`κ^{s,1} = (p+1)!/(η₁ σ_min) (3 (L_{w,p} + σ_max)/(ς - θ))^{(p+1)/p}`,
`κ^{a,1} = κ^{s,1} (1 + |log γ₁|/log γ₂)`, `κ^c = (|log γ₁| + log(σ_max/σ₀))/log γ₂ + 2`
(book's constants with `(1-θ)` replaced by `(ς-θ)`; `j! = 1`). Asymptotic form
`O(ε₁^{-(p+1)/p})` as a corollary (part of node).
'''
deps = ["lemma_14_1_9", "lemma_14_1_6", "lemma_14_1_4", "Optimization.IsFirstHit", "Optimization.funEvalCount", "Optimization.exists_hit_le_of_counting", "Optimization.succ_le_of_arUpdate", "Optimization.card_mul_le_of_decrease", "AssumptionWBb"]
