namespace = "CartisGouldToint"

# Planning conventions for the remaining declarations:
# Composite objectives w(x)=f(x)+h(c(x)). f,c are C^p, derivatives of orders 1,…,p are globally Lipschitz componentwise for c. h is Lipschitz, subadditive, and h(0)=0; convexity is an additional hypothesis only in the favorable first-order case. w.Bb supplies w_low≤w. The generalized Taylor model preserves h exactly and Taylor-approximates f and c. Its model decrement and criticality must not be replaced by smooth f criticality.

[[node]]
id = "compositeCriticality"
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.1"

[[node]]
id = "arqpcRun"
kind = "definition"
desc = '''
Algorithm 14.1.1 with detailed Step 2 Algorithm 14.1.2: replace smooth objective and model checks of ARqp by composite w and its generalized Taylor model; keep the parameters, per-order radii, model decrease, acceptance ratio and σ update. Inner tests are exactly (14.1.10)–(14.1.16), using finite component Taylor tensors for f,c and h evaluations. No iteration-count or step-existence theorem is assumed in the run record.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 14.1"
deps = ["compositeCriticality", "arqpRun"]

