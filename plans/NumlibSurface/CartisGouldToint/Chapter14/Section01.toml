Lemma 14.1.5. For an ARqpC run and every `k` at which Step 2 is executed:
`compositeTaylorDecrement Dfk Dck h p (s k) ≥ σ k / (p + 1)! * ‖s k‖ ^ (p + 1)` (14.1.25), and the
decrement is positive unless Step 2 terminates.
'''
