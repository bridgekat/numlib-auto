[[node]]
id = "lemma_14_1_4"
kind = "theorem"
desc = '''
Lemma 14.1.4. For an ARqpC(-SC) run under h.L, h.S0: (i) if `q = 1` and `h` (and `X`) are convex,
termination never happens in Step 2: for `k` with `¬ stopTest k`, `m̂_k (s k) < m̂_k 0`;
(ii) otherwise, if `¬ stopTest k` and `m̂_k (s k) = m̂_k 0`, there is `δ'` with `δ' j ∈ (0,1]`
and `Optimization.IsEpsDeltaApproxComposite Dfk Dck h Xk q ε δ'` ((14.1.9) at `x_ε = x k`).
Proof: `IsDetailedStepOutput.spec` gives that `0` minimizes `m̂_k` over `Xk`; then
`Optimization.exists_radius_of_isMinOn_compositeRegularizedModel_zero`.
'''
deps = ["algorithm_14_1_1", "Optimization.IsDetailedStepOutput.spec", "Optimization.exists_radius_of_isMinOn_compositeRegularizedModel_zero", "Optimization.IsEpsDeltaApproxComposite"]
source = "Cartis–Gould–Toint, Lemma 14.1.4 (proof in Appendix B)"

[[node]]
