[[node]]
id = "lemma_14_1_6"
kind = "theorem"
desc = '''
Lemma 14.1.6. Under f.DpL (`IteratedFDerivLipschitzOn f p (Lf p) univ`), c.DpL (componentwise
`Lc p`), h.L: for an ARqpC run, `σ k ≤ σ_max := max σ₀ (γ₃ L_{w,p} / (1 - η₂))` (14.1.26) for every
`k` up to the first termination index, `L_{w,p} = compositeLipschitzWp Lf Lc Lh p m` (14.1.27).
Proof: `|ρ_k - 1| ≤ L_{w,p}/σ_k` from `Optimization.abs_sub_compositeTaylor_le_of_lipschitz` and
Lemma 14.1.5, then `Optimization.sigma_le_max_of_arUpdate`.
'''
deps = ["lemma_14_1_5", "compositeLipschitzW", "AssumptionCD1pL", "AssumptionHLip", "Optimization.abs_sub_compositeTaylor_le_of_lipschitz", "Optimization.le_reductionRatio_of_abs_sub_le", "Optimization.sigma_le_max_of_arUpdate"]
source = "Cartis–Gould–Toint, Lemma 14.1.6 (proof in Appendix B)"

[[node]]
id = "lemma_14_1_7"
kind = "theorem"
desc = '''
Lemma 14.1.7 (corrected). Under f.D1pL, c.D1pL, h.L, h.S0, for an ARqpC run with `θ < ς`, if `k`
is successful and the run does not terminate at `k + 1` (`¬ stopTest (k+1)`), there is
`j ∈ Icc 1 q` with
`(ς - θ) ε_j δ_{k+1,j}^j / j! ≤ (L_{w,p} + σ_max) ∑ ℓ ∈ Icc 1 j, δ_{k+1,j}^ℓ / ℓ! ‖s_k‖^{p-ℓ+1}
+ 2 √m L_{h,0} L_{c,p} / (p+1)! ‖s_k‖^{p+1}`.
Corrections: the book's `(1 - θ)` presumes that non-termination certifies
`φ_{w,j}(x_{k+1}) > ε_j δ^j/j!`, while Step 1 only certifies `> ς ε_j δ^j/j!` (equal when `ς = 1`);
the factor `2` on the last term (see `Optimization.compositeTaylorDecrement_le_of_step`).
Proof: apply that backbone lemma to `d = d_{k+1,j}` with the model test (14.1.13)
(`δs k = δ (k+1)` on success) and `σ_k ≤ σ_max` (Lemma 14.1.6).
'''
deps = ["lemma_14_1_6", "Optimization.compositeTaylorDecrement_le_of_step", "Optimization.IsDetailedStepOutput.spec"]
source = "Cartis–Gould–Toint, Lemma 14.1.7 (proof in Appendix B)"

[[node]]
id = "lemma_14_1_8"
kind = "theorem"
desc = '''
Lemma 14.1.8 (corrected). Under the hypotheses of Lemma 14.1.7, if the run ensures `δ_{s_k,1} = 1`
when `q = 1` and `h` (and `X`) convex, and otherwise (14.1.28) — `‖s_k‖ > 1 ∨ δ_{s_k,j} ≥
κ_{δ,min} ε_j` for all `j ∈ Icc 1 q`, `κ_{δ,min} := ς θ / (8 (3 L_w + σ_max))` (14.1.29) — then there
is `j ∈ Icc 1 q` with `‖s_k‖ ≥ ((ς - θ) ε_j / (3 j! (L_{w,p} + σ_max)))^{1/p}` in the first case and
`‖s_k‖ ≥ ((ς - θ) κ_{δ,min}^j / (3 j! (L_{w,p} + σ_max)))^{1/(p-j+1)} ε_j^{(j+1)/(p+1)}` otherwise
((14.1.31); the printed second case omits `ε_j^{(j+1)/(p+1)}`, which Appendix B derives). Proof:
`Optimization.norm_step_ge_of_measure_ineq` with `A = L_{w,p} + σ_max`,
`B = 2√m L_{h,0} L_{c,p}/(p+1)! ≤ A` (uses `1 ≤ L_{f,p}`), `a = ς - θ`, after disposing of
`‖s_k‖ ≥ 1`.
'''
deps = ["lemma_14_1_7", "lemma_14_1_3", "Optimization.norm_step_ge_of_measure_ineq"]
source = "Cartis–Gould–Toint, Lemma 14.1.8 (proof in Appendix B)"

[[node]]
id = "lemma_14_1_9"
kind = "theorem"
desc = '''
Lemma 14.1.9 (corrected). Under f.D1pL, c.D1pL, h.L, h.S0 and the radius policy of Lemma 14.1.8,
for every successful `k` of an ARqpC run that does not terminate at `k + 1`:
`compositeTaylorDecrement Dfk Dck h p (s k) ≥ κ_{Δm} min_{j ∈ Icc 1 q} ε_j^{π_j}` (14.1.32) and
