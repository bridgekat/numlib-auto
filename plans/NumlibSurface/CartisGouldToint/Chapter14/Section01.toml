desc = '''
Theorem 14.1.10, part 2 (`h` nonconvex or `q > 1`). Under the same assumptions and (14.1.28) for
all `j ∈ Icc 1 q`, for every ARqpC run and `ε` with `ε j ∈ (0,1]`, there is `k_ε` with
`IsFirstHit test k_ε`, some `δ_ε` with `δ_ε j ∈ (0,1]` and
`Optimization.IsEpsDeltaApproxComposite Dfk_ε Dck_ε h Xk_ε q ε δ_ε`, and
`funEvalCount k_ε ≤ κ^{a,2} (w(x₀) - wlow) / min_j ε_j^{j+1} + κ^c` (14.1.36),
`derivEvalCount succ k_ε ≤ κ^{s,2} (w(x₀) - wlow) / min_j ε_j^{j+1} + 2` (14.1.37), where
`κ^{s,2} = (p+1)!/(η₁ σ_min) (3 q! (L_{w,p} + σ_max)/((ς - θ) κ_{δ,min}^q))^{(p+1)/(p-q+1)}`
(book: `3j!`, read `3q!`), `κ^{a,2} = κ^{s,2} (1 + |log γ₁|/log γ₂)`, `κ^c` as in part 1.
(`δ_ε = δ_{k_ε}` when Step 1 terminates, from Lemma 14.1.4 when Step 2 terminates.)
'''
