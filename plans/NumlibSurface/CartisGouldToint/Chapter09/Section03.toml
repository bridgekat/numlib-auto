[[node]]
id = "theorem_9_3_1"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 9.3.1: Fast convergence in the hard case

[196, Thm. 7]: \( {}^{64} \) Let \( {\lambda }_1 \) be the leftmost eigenvalue of the pencil \( \left( {H, M}\right) \) . Suppose that there exist positive constants \( \overline{\gamma } \) and \( \bar{n} \) such that \( {\gamma }_{k} = \overline{\gamma } \) and \( {n}_{k} = \bar{n} \) for all \( k \) sufficiently large. Then the sequence \( \left\{  {\lambda }_k^G\right\} \) generated by Algorithm 9.3.1 converges to \( - {\lambda }_1 \) with \( Q \) -rate equal to \( \overline{\gamma } \) provided that \( {\lambda }_0^G \) is chosen sufficiently close to \( - {\lambda }_1 \) .

Documented source/OCR correction and formalization requirements: Include the spectral-start condition z0 in Z1 required by Algorithm 9.3.1 and source footnote 64: the initial inverse-iteration vector has a nonzero projection onto the leftmost eigenspace. Keep the algorithmic bounds ωL≤ωk≤ωU, 1<γL≤γk≤2nk−γU and the eventual constancy assumptions. Q-rate here is convergence order γbar, not a linear contraction factor.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 9.3.1 (OCR Markdown line 10323)"
deps = ["hardCaseInverseIterationRun"]
wrong = "The printed Euclidean projection in Z1 is insufficient for a general metric. Actual matrices M=[[1,-1],[-1,2]], H=[[-1,1],[1,-1]], least vector(1,0), and start(1,1) satisfy all source conditions, but every normalized inverse step fixes the higher eigenvector and legal fixed n=2,gamma=2,omega=1 gives shift_next=shift squared. Arbitrarily close shifts above1 fail to converge to1. See theorem_9_3_1_counterexample. The corrected target requires metric projection."

[[node]]
id = "theorem_9_3_2"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 9.3.2: Constructive early termination test

[Appendix to Chapter 9, p. 477]: Let \( s\left( \lambda \right) \) satisfy (8.2.2) and \( \pi \left( \lambda \right)  = \parallel s\left( \lambda \right) {\parallel }_M^2 \) . Suppose that \( {\lambda }_C \in  \mathcal{F} \) satisfies the conditions

\[
\pi \left( {\lambda }_c\right)  \leq  {\left( \frac{r}{2}\right) }^{2/\left( {r - 2}\right) }{\left( \frac{{\lambda }_c}{\sigma }\right) }^{2/\left( {r - 2}\right) },\tag{9.3.15a}
\]

\[
\left| {{\left\lbrack  \pi \left( {\lambda }_{c}\right) \right\rbrack  }^{\left( {r - 2}\right) /2} - \frac{{\lambda }_{c}}{\sigma }}\right|  \leq  \frac{{\theta }_{1}}{2\sigma }{\left\lbrack  \pi \left( {\lambda }_{c}\right) \right\rbrack  }^{1/2},\text{ and }\tag{9.3.15b}
\]

\[
{\left\lbrack  \pi \left( {\lambda }_C\right) \right\rbrack  }^{\left( {r - 2}\right) /2} - \frac{{\lambda }_C}{\sigma } \geq   - \frac{{\theta }_2}{\sigma }{\left\lbrack  \pi \left( {\lambda }_C\right) \right\rbrack  }^{1/2}.\tag{9.3.15c}
\]

Then \( s = s\left( {\lambda }_c\right) \) satisfies the stopping rules (9.3.14).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 9.3.2 (OCR Markdown line 10385)"
deps = ["secularFunction", "regularizationStepTermination"]
wrong = '''
Take E=R²,M=4I,H=−8I,τ=2,σ=1,r=3,g=0,s=(1/2,0),θ1=2,θ2=1.
The shifted pencil is zero and π=1. The scalar tests are1≤9,1≤1 and−1≤−1.
The actual Euclidean Hessian on v=(0,1) equals−4, whereas9.3.14c requires≥−1.
The weighted Hessian bound is correct and recovers the Euclidean result forM=I.
'''

