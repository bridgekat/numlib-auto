# Appendix A.9: Hermite interpolation with constants uniform over interval length, data count and interpolation data. Reuse Polynomial.IsJetInterpolant, Polynomial.interpolateJet and derivative conversions in Numlib.Analysis.Calculus.HermiteInterpolation. Uniform dependence means constants are quantified before s and the data, not chosen after them. Require s>0, an implicit condition in the interval construction. In A.9.2 correct the step index to k<k_e (not k<=k_e) and x in R (not R^n). Derivative factorials in (A.28) contain an inconsistent extra 1/p!; use the subsequent proof constant (p+1)(2p+1)! norm(A_p^-1)_infinity.

