source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 3.4"

[[node]]
id = "lemma_3_4_1"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 3.4.1: Decrease in the Taylor-series model

At every iteration \( k \) of the TR \( \epsilon \) algorithm, one has that

\[
{T}_{f,2}\left( {{x}_k,0}\right)  - {T}_{f,2}\left( {{x}_k,{s}_k}\right)  \geq  \frac{1}{2}{\epsilon }_{ * }{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{2}.\tag{3.4.7}
\]
'''
deps = ["trEpsilonRun", "inexactRegularizedNewtonRun", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 3.4.1 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 3581)"

[[node]]
id = "lemma_3_4_2"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 3.4.2: Lower bound on the trust-region radius

Suppose that f.HL holds, as well as that, in the TR \( \epsilon \) algorithm,

\[
{\Delta }_k < \frac{3\left( {1 - {\eta }_2}\right) }{{L}_{f,2}}{\epsilon }_{ * }.\tag{3.4.8}
\]

Then \( {\rho }_k \geq  {\eta }_2 \) , iteration \( k \) is successful, and \( {\Delta }_{k + 1} \geq  {\Delta }_k \) . Furthermore, for all iterations of the TR \( \epsilon \) algorithm, we have

\[
{\Delta }_k \geq  \frac{\left( {1 - {\eta }_2}\right) {\gamma }_1}{{L}_{f,2}}{\epsilon }_{ * }.\tag{3.4.9}
\]

---

\( {}^{20} \) Note that in this case, \( \begin{Vmatrix}{s}_k\end{Vmatrix} = \begin{Vmatrix}{{t}_k^E{u}_k}\end{Vmatrix} = {t}_k^E \) , where \( {u}_k \) is normalized. Also, \( {m}_k{\left( t{u}_k\right) }^{\prime \prime } = \; {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_k\right) }\right\rbrack   + {\epsilon }_{ * } < 0 \) and so the model along \( t > 0 \) is concave and achieves its minimum on the boundary of the trust-region constraint.

---
'''
deps = ["lemma_3_2_5", "trEpsilonRun", "inexactRegularizedNewtonRun", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 3.4.2 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 3599)"

[[node]]
id = "lemma_3_4_3"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 3.4.3: Lower bound on the length of the strictly feasible step

Suppose that f.HL holds. Then, if iteration \( k \) of the TR \( \epsilon \) algorithm is successful and \( \begin{Vmatrix}{s}_k\end{Vmatrix} < {\Delta }_k \) , we have that

\[
\begin{Vmatrix}{s}_k\end{Vmatrix} \geq  \frac{1}{\sqrt{1 + 2\left( {{L}_{f,2} + {\theta }_1}\right) }}\min \left\lbrack  {{\epsilon }_{ * },\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{k + 1}\right) }\end{Vmatrix}{\epsilon }_{ * }^{-1}}\right\rbrack  .\tag{3.4.10}
\]
'''
deps = ["trEpsilonRun", "inexactRegularizedNewtonRun", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 3.4.3 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 3629)"

[[node]]
id = "lemma_3_4_4"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 3.4.4: Lower bound on the function decrease

Suppose that f.HL holds. Then, on each successful iteration \( k \) of the TR \( \epsilon \) algorithm, we have the sufficient function decrease

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_{\Delta f}\min \left\lbrack  {{\epsilon }_{ * }^3,{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_{k + 1}\right) \end{Vmatrix}}^2{\epsilon }_{ * }^{-1}}\right\rbrack\tag{3.4.13}
\]

whenever \( {x}_{k + 1} \) is in the interior of the trust-region ball and

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_{\Delta f}{\epsilon }_{ * }^3\tag{3.4.14}
\]

when \( {x}_{k + 1} \) is on the trust-region boundary, where

\[
{\kappa }_{\Delta f}\overset{\text{ def }}{ = }\frac{{\eta }_{1}}{2}\min \left\lbrack  {\frac{{\gamma }_{1}^{2}{\left( 1 - {\eta }_{2}\right) }^{2}}{{L}_{f,2}^{2}},\frac{1}{1 + 2\left( {{L}_{f,2} + {\theta }_{1}}\right) }}\right\rbrack  .\tag{3.4.15}
\]
'''
deps = ["trEpsilonRun", "inexactRegularizedNewtonRun", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 3.4.4 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 3687)"

[[node]]
id = "theorem_3_4_5"
kind = "theorem"
