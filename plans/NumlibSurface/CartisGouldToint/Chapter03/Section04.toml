\]

Equation (3.4.28):
\[
{\sigma }_k^{\mathrm{L}}\begin{Vmatrix}{s}_k\end{Vmatrix} \leq  {\lambda }_k \leq  {\sigma }_k^{\mathrm{U}}\begin{Vmatrix}{s}_k\end{Vmatrix}.\tag{3.4.28}
\]

Equation (3.4.32):
