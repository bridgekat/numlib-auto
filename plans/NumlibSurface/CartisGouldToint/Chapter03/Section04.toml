Theorem 3.4.6: Second-order complexity of the TR \( \epsilon \) algorithm

Suppose that f.Bb and f.HL hold. Then there exist positive constants \( {\kappa }_{\mathrm{TR\varepsilon }}^s,{\kappa }_{\mathrm{TR\varepsilon }}^A \) , \( {\kappa }_{\mathrm{TR}\epsilon }^C \) , and \( {\kappa }_{\mathrm{TR}\epsilon }^D \) such that, for any \( \left( {{\epsilon }_1,{\epsilon }_2}\right)  \in  (0,1{\rbrack }^2 \) , the \( \mathrm{TR}\epsilon \) algorithm (p. 76) with \( {\epsilon }_{ * } = {\epsilon }_2 \) requires at most

\[
{\# }_{\mathrm{{TR}}\epsilon ,2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR\epsilon }}}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\mathrm{{low}}}}{\min \left\lbrack  {{\epsilon }_{1}^{2}{\epsilon }_{2}^{-1},{\epsilon }_{2}^{3}}\right\rbrack  } + {\kappa }_{\mathrm{{TR\epsilon }}}^{D}\left| {\log {\epsilon }_{2}}\right|  + {\kappa }_{\mathrm{{TR\epsilon }}}^{C} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-2}{\epsilon }_{2},{\epsilon }_{2}^{-3}}\right\rbrack  }\right)\tag{3.4.23}
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}}\epsilon ,2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\min \left\lbrack  {{\epsilon }_{1}^{2}{\epsilon }_{2}^{-1},{\epsilon }_{2}^{3}}\right\rbrack  } + 1 = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-2}{\epsilon }_{2},{\epsilon }_{2}^{-3}}\right\rbrack  }\right)\tag{3.4.24}
\]

evaluations of \( {\nabla }_x^{1}f \) and \( {\nabla }_x^{2}f \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\right\rbrack   \geq   - {\epsilon }_2 \) (i.e.,(3.4.4) is satisfied).

Referenced equation payloads:

Equation (3.4.4):
\[
\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \leq  {\epsilon }_{1}\;\text{ and }\;{\lambda }_{\min }\left\lbrack  {{\nabla }_{x}^{2}f\left( {x}_{k}\right) }\right\rbrack   \geq   - {\epsilon }_{2},\tag{3.4.4}
\]
'''
