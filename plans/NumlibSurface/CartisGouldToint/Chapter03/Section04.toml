namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 3, Section 4.

This section has two independent algorithms, TRε (Algorithm 3.4.1, a radius tied to ε) and iRN (Algorithm 3.4.2). Preserve their separate parameter sets and inexact step conditions. Do not conflate an ε-dependent algorithm with the accuracy-independent model parameters in the universal AR family.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

Thus far in our journey of discovery, the best-known bound for the number of evaluations to find an \( {\epsilon }_1 \) -approximate first-order minimizer that we have exhibited is \( \mathcal{O}\left( {\epsilon }_1^{-3/2}\right) \) , which is achieved by the AR2 algorithm. The same algorithm also achieves the best-known \( \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_1^{-3/2},{\epsilon }_2^{-3}}\right\rbrack  }\right) \) bound for the number of evaluations to find an \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer among the methods that we have described.

Leaving aside the question of whether there are methods that achieve better, or even optimal, bounds, it is of interest to know at least if the AR2 algorithm is alone. Encouraged by the improved complexity of the AR2 algorithm compared to its predecessors, complexity-efficient variants of more traditional approaches, such as those based on trust-region and quadratic regularization-Levenberg-Morrison-Marquardt-type methods-have been developed, often with the additional intention of promoting good performance in practice. This is the focus of this section.

#### 3.4.1 TR \( \epsilon \) , a tolerance-dependent trust-region variant

The first variant was introduced by Curtis, Robinson, Royer, and Wright [136] and is a simple modification of the TR2 algorithm that satisfies the best-known first-order complexity bound - and second-order bound when the first- and second-order criticality tolerances \( {\epsilon }_1 \) and \( {\epsilon }_2 \) are suitably coupled. The method introduces a small regularization term in the trust-region subproblem and the step calculation. The subproblem approximately solved on each iteration of TR \( \epsilon \) uses the model

\[
\begin{gathered}{m}_{k}\left( s\right) \overset{\text{ def }}{ = }f\left( {x}_{k}\right)  + \left\langle  {{\nabla }_{x}^{1}f\left( {x}_{k}\right) , s}\right\rangle   + \frac{1}{2}\left\langle  {s,{\nabla }_{x}^{2}f\left( {x}_{k}\right) s}\right\rangle   + \frac{1}{2}{\epsilon }_{ * }\parallel s{\parallel }^{2} \\ = {T}_{f,2}\left( {{x}_k, s}\right)  + \frac{1}{2}{\epsilon }_{ * }{\begin{Vmatrix}s\end{Vmatrix}}^2,\end{gathered}\tag{3.4.1}
\]

where \( {\epsilon }_{ * } > 0 \) is a fixed regularization weight, reminiscent of the lower bound \( {\sigma }_{\min } \) in the AR2 algorithm. The model (3.4.2) is then approximately minimized over a trust-region ball:

\[
\mathop{\min }\limits_{{s \in  {\mathbb{R}}^{n}}}{m}_{k}\left( s\right) \text{ subject to }{x}_{k} + s \in  {R}_{k} = \left\{  {s : \parallel s\parallel  \leq  {\Delta }_{k}}\right\}  .\tag{3.4.2}
\]

We formally state the TR \( \epsilon \) algorithm as follows.

Algorithm 3.4.1: Trust-region algorithm with a regularized second-order model (TRE)

Step 0: Initialization. An initial point \( {x}_0 \) , accuracy thresholds \( {\epsilon }_1 \in  (0,1\rbrack ,{\epsilon }_2 \in \; (0,1\rbrack \) , a regularization threshold \( {\epsilon }_{ * } \in  (0,1\rbrack \) , and an initial trust-region radius \( {\Delta }_0 > {\epsilon }_{ * } \) are given. The constants \( {\eta }_1,{\eta }_2,{\gamma }_1,{\gamma }_2 \) , and \( {\theta }_1 \) are also given and satisfy

\[
0 < {\eta }_{1} \leq  {\eta }_{2} < 1,\;{\theta }_{1} > 0,\text{ and }0 < {\gamma }_{1} \leq  {\gamma }_{2} < 1 < {\gamma }_{3}.
\]

Compute \( f\left( {x}_0\right) ,{\nabla }_x^{1}f\left( {x}_0\right) \) , and \( {\nabla }_x^{2}f\left( {x}_0\right) \) , and set \( k = 0 \) .

Step 1: Test for termination. If \( {\epsilon }_2 =  + \infty \) and \( {\epsilon }_{ * } = \sqrt{{\epsilon }_1} \) , then if

\[
\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix} \leq  {\epsilon }_1\tag{3.4.3}
\]

terminate with the \( {\epsilon }_1 \) -approximate first-order minimizer \( {x}_{\epsilon } = {x}_k \) .

If \( {\epsilon }_2 < \infty \) and \( {\epsilon }_{ * } = {\epsilon }_2 \) , then if

\[
\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \leq  {\epsilon }_{1}\;\text{ and }\;{\lambda }_{\min }\left\lbrack  {{\nabla }_{x}^{2}f\left( {x}_{k}\right) }\right\rbrack   \geq   - {\epsilon }_{2},\tag{3.4.4}
\]

terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer \( {x}_{\epsilon } = {x}_k \) .

Step 2: Step computation. Compute a step \( {s}_k \in  {\mathcal{B}}_{{\Delta }_k} \) such that \( {m}_k\left( {s}_k\right)  < \; {m}_k\left( 0\right) \) , and whenever \( \begin{Vmatrix}{s}_k\end{Vmatrix} < {\Delta }_k \) ensure also that

\[
\begin{Vmatrix}{{\nabla }_s^1{m}_k\left( {s}_k\right) }\end{Vmatrix} \leq  \frac{1}{2}{\theta }_1{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{2}.\tag{3.4.5}
\]

If \( {\epsilon }_2 <  + \infty \) and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_k\right) }\right\rbrack   <  - {\epsilon }_2 \) , calculate \( {s}_k \) such that \( \begin{Vmatrix}{s}_k\end{Vmatrix} = {\Delta }_k \) .

Step 3: Acceptance of the trial point. Compute \( f\left( {{x}_k + {s}_k}\right) \) and define

\[
{\rho }_k = \frac{f\left( {x}_k\right)  - f\left( {{x}_k + {s}_k}\right) }{f\left( {x}_k\right)  - {T}_{f,2}\left( {{x}_k,{s}_k}\right) }.\tag{3.4.6}
\]

If \( {\rho }_k \geq  {\eta }_1 \) , then define \( {x}_{k + 1} = {x}_k + {s}_k \) and compute \( {\nabla }_x^{1}f\left( {x}_{k + 1}\right) \) and \( {\nabla }_x^{2}f\left( {x}_{k + 1}\right) \) . Otherwise define \( {x}_{k + 1} = {x}_k \) .

Step 4: Trust-region radius update. Set

\[
{\Delta }_{k + 1} \in  \left\{  \begin{array}{ll} \left\lbrack  {{\Delta }_{k},{\gamma }_{3}{\Delta }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \geq  {\eta }_{2}, \\  \left\lbrack  {{\gamma }_{2}{\Delta }_{k},{\Delta }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \in  \left\lbrack  {{\eta }_{1},{\eta }_{2}}\right) , \\  \left\lbrack  {{\gamma }_{1}{\Delta }_{k},{\gamma }_{2}{\Delta }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} < {\eta }_{1}. \end{array}\right.
\]

Increment \( k \) by one and go to Step 1.

Clearly the global minimizer of (3.4.2), or even a nonzero local minimizer, satisfies the step conditions in Step 2 of the TR \( \epsilon \) algorithm. Furthermore, in the case when \( {\epsilon }_2 <  + \infty \) , \( {\epsilon }_{ * } = {\epsilon }_2 \) , and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_k\right) }\right\rbrack   >  - {\epsilon }_2 \) in Step 2 of TR \( \epsilon \) , the requirement that \( \begin{Vmatrix}{s}_k\end{Vmatrix} = {\Delta }_k \) can be achieved by a variant of the eigenpoint condition of the TR2 algorithm, namely, (3.2.5) with \( {T}_{f,2} \) replaced by the regularized model \( {m}_k \) of the TR \( \epsilon \) algorithm. \( {}^{20} \)

As for the TR2 and AR2 algorithms, we define successful and unsuccessful iterations by (2.3.9)-(2.3.10) and note that Lemma 2.3.1 still applies to the TR \( \epsilon \) algorithm because it uses the same updating rules for \( {\Delta }_k \) as did the TR2 algorithm.

We now proceed to analyze the evaluation complexity of the TR \( \epsilon \) algorithm, and we will see that we will follow common paths to both the TR2 and AR2 algorithms. Firstly, a familiar bound on the model decrease, similar to that for the AR2 algorithm, is derived.
'''

