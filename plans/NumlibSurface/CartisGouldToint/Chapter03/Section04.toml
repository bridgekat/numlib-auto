Lemma 3.4.9: Lower bound on the length of the step

Suppose that f.HL holds. Then, if iteration \( k \) of the iRN algorithm is successful,

\[
{\begin{Vmatrix}{s}_k\end{Vmatrix}}^2 \geq  \frac{2}{{L}_{f,2} + 4{\sigma }_{\max }^U + 2{\kappa }_3}\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{k + 1}\right) }\end{Vmatrix},\tag{3.4.39}
\]

where \( {\sigma }_{\max }^U \) is defined as in (3.4.38). If (3.4.32) holds,

\[
\begin{Vmatrix}{s}_k\end{Vmatrix} \geq   - \frac{1}{{\kappa }_4 + {\sigma }_{\max }^U}{\lambda }_{\min }\left\lbrack  {{Q}_k^T{\nabla }_x^{2}f\left( {x}_k\right) {Q}_k}\right\rbrack  .\tag{3.4.40}
\]

Referenced equation payloads:

Equation (3.4.32):
\[
{\lambda }_{\min }\left\lbrack  {{Q}_k^T{\nabla }_s^{2}m\left( {s}_k\right) {Q}_k}\right\rbrack   \geq   - {\kappa }_4\begin{Vmatrix}{s}_k\end{Vmatrix}\tag{3.4.32}
\]

Equation (3.4.38):
\[
{\sigma }_{\mathbf{k}}^{U} \leq  {\sigma }_{\max }^{U}\overset{\text{ def }}{ = }\max \left\lbrack  {{\sigma }_{\max },{\gamma }_{2}\left( {{2\eta } + {\kappa }_{2} + {L}_{f,2}}\right) }\right\rbrack  .\tag{3.4.38}
\]
'''
