kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 3.3.9: Second-order complexity of the AR2 algorithm

Suppose that f.Bb and f.HL hold. Then there exist positive constants \( {\kappa }_{\mathrm{AR}2}^T,{\kappa }_{\mathrm{AR}2}^D \) , \( {\kappa }_{\mathrm{AR}2}^E \) , and \( {\kappa }_{\mathrm{AR}2}^F \) such that, for any \( \left( {{\epsilon }_1,{\epsilon }_2}\right)  \in  (0,1{\rbrack }^2 \) , the AR2 algorithm (p. 65) requires at most

\[
