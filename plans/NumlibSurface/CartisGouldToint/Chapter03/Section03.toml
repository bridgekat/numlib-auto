\]

evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{AR}}2,2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR2}}}^{T}\frac{f\left( {x}_{0}\right)  - {f}_{\mathrm{{low}}}}{\min \left\lbrack  {{\epsilon }_{1}^{3/2},{\epsilon }_{2}^{3}}\right\rbrack  } + 1 = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-3/2},{\epsilon }_{2}^{-3}}\right\rbrack  }\right)  + 2\tag{3.3.30}
