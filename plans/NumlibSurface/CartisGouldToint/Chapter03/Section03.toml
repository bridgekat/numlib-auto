desc = '''
Define the set of finite traces satisfying Algorithm 3.3.1, including initialization, derivative compatibility, enabled termination tests, allowed steps, trial evaluations, acceptance and parameter updates. Derive positivity, existence and iteration bounds in theorems, never in this predicate. Exact source program and its immediate mathematical specifications:

## Algorithm 3.3.1: Adaptive-regularization algorithm with a \(\text{ second-order model (AR2) }\)

```
Step 0: Initialization. An initial point \( {x}_0 \) ; accuracy thresholds \( {\epsilon }_1 \in  (0,1\rbrack ,{\epsilon }_2 > \)
     0 ; and an initial regularization parameter \( {\sigma }_0 > 0 \) are given. The constants
     \( {\eta }_1,{\eta }_2,{\gamma }_1,{\gamma }_2,{\gamma }_3,{\theta }_1,{\theta }_2 \) ,and \( {\sigma }_{\min } \) are also given and satisfy
              \[{\sigma }_{\min } \in  \left( {0,{\sigma }_0}\right\rbrack  ,{\theta }_1 > 0,{\theta }_2 > 0,0 < {\eta }_1 \leq  {\eta }_2 < 1,\]
                                                                   (3.3.3)
                        \[\text{ and }0 < {\gamma }_{1} < 1 < {\gamma }_{2} < {\gamma }_{3}\text{ . }\]
     Compute \( f\left( {x}_0\right) ,{\nabla }_x^{1}f\left( {x}_0\right) \) ,and \( {\nabla }_x^{2}f\left( {x}_0\right) \) ,and set \( k = 0 \) .
Step 1: Test for termination. If \( {\epsilon }_2 < \infty \) and
                    \[\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \leq  {\epsilon }_{1}\text{ and }{\lambda }_{\min }\left\lbrack  {{\nabla }_{x}^{2}f\left( {x}_{k}\right) }\right\rbrack   > {\epsilon }_{2},\]

     terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate strict local minimizer \( {x}_{\epsilon } = {x}_k \) . Oth-
     erwise, if
                   \[\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \leq  {\epsilon }_{1}\text{ and }{\lambda }_{\min }\left\lbrack  {{\nabla }_{x}^{2}f\left( {x}_{k}\right) }\right\rbrack   \geq   - {\epsilon }_{2},\] (3.3.4)
     terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer \( {x}_{\epsilon } = {x}_k \) .
Step 2: Step computation. Compute a step \( {s}_k \) such that \( {m}_k\left( {s}_k\right)  < {m}_k\left( 0\right) \) ,
                           \[\begin{Vmatrix}{{\nabla }_s^1{m}_k\left( {s}_k\right) }\end{Vmatrix} \leq  \frac{1}{2}{\theta }_1{\begin{Vmatrix}{s}_k\end{Vmatrix}}^2,\] (3.3.5)

     and,if \( {\epsilon }_2 < \infty \) ,
                          \[{\lambda }_{\min }\left\lbrack  {{\nabla }_s^2{m}_k\left( {s}_k\right) }\right\rbrack   \geq   - {\theta }_2\begin{Vmatrix}{s}_k\end{Vmatrix}.\] (3.3.6)

Step 3: Acceptance of the trial point. Compute \( f\left( {{x}_k + {s}_k}\right) \) and define
                        \[{\rho }_k = \frac{f\left( {x}_k\right)  - f\left( {{x}_k + {s}_k}\right) }{{T}_{f,2}\left( {{x}_k,0}\right)  - {T}_{f,2}\left( {{x}_k,{s}_k}\right) }.\] (3.3.7)


     If \( {\rho }_k \geq  {\eta }_1 \) ,then define \( {x}_{k + 1} = {x}_k + {s}_k \) and compute \( {\nabla }_x^{1}f\left( {x}_{k + 1}\right) \) and
     \( {\nabla }_x^{2}f\left( {x}_{k + 1}\right) \) . Otherwise define \( {x}_{k + 1} = {x}_k \) .
Step 4: Regularization parameter update. Set
            \[{\sigma }_{k + 1} \in  \left\{  \begin{array}{ll} \left\lbrack  {\max \left( {{\sigma }_{\min },{\gamma }_{1}{\sigma }_{k}}\right) ,{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \geq  {\eta }_{2}, \\  \left\lbrack  {{\sigma }_{k},{\gamma }_{2}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \in  \left\lbrack  {{\eta }_{1},{\eta }_{2}}\right) , \\  \left\lbrack  {{\gamma }_{2}{\sigma }_{k},{\gamma }_{3}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} < {\eta }_{1}. \end{array}\right.\] (3.3.8)


     Increment \( k \) by one and go to Step 1.
```

The AR2 algorithm is very similar in structure to AR1. Indeed, since \( \begin{Vmatrix}{{\nabla }_s^1{m}_k\left( s\right) }\end{Vmatrix} \) must be zero at a local minimizer of \( {m}_k\left( s\right) \) , the step computation in AR2 is a relaxed equivalent of the exact requirement (2.4.5); that is,

\[
{s}_k = \underset{s \in  {\mathbb{R}}^n}{\arg \min }{m}_k\left( s\right) ,\tag{3.3.9}
\]

from AR1. Moreover, (3.3.7) is the same as (2.4.3) for the models under consideration. As for the TR2 algorithm, we have left open the possibility of using AR2 simply to find an approximate first-order minimizer by selecting \( {\epsilon }_2 =  + \infty \) , which deactivates the second part of (3.3.4) and (3.3.6). As is now usual, we define the sets of successful and unsuccessful iterations by (2.3.9)-(2.3.10).
'''
