[[node]]
id = "theorem_3_3_5"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 3.3.5: First-order complexity of the AR2 algorithm

Suppose that \( f,{Bb} \) and \( f,{HL} \) hold. Then there exist positive constants \( {\kappa }_{AR2}^S \) (see Lemma 3.3.4), \( {\kappa }_{AR2}^A,{\kappa }_{AR2}^B \) , and \( {\kappa }_{AR2}^C \) such that, for any \( {\epsilon }_1 \in  (0,1\rbrack \) , the AR2 algorithm (p. 65) with \( {\epsilon }_2 =  + \infty \) requires at most

\[
{\# }_{\mathrm{{AR}}1,1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR2}}}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{low}}{{\epsilon }_{1}^{3/2}} + {\kappa }_{\mathrm{{AR2}}}^{C} = \mathcal{O}\left( {\epsilon }_{1}^{-3/2}\right)\tag{3.3.21}
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{AR}}2,2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR2}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }_{1}^{3/2}} + 2 = \mathcal{O}\left( {\epsilon }_{1}^{-3/2}\right)\tag{3.3.22}
\]

evaluations of \( {\nabla }_x^{1}f\left( x\right) \) and \( {\nabla }_x^{2}f\left( x\right) \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_{1}. \)
'''
