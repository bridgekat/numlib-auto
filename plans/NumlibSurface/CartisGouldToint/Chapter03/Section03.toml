Lemma 3.3.8: Lower bound on the length of the step (second order)

Suppose that f.HL holds. Then, if iteration \( k \) of the AR2 algorithm with \( {\epsilon }_2 \in  (0,1\rbrack \) is successful and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{k + 1}\right) }\right\rbrack   < 0 \) , one has that

\[
