Theorem 3.2.6: Second-order complexity of the TR2 algorithm

Suppose that f.Bb, f.HBa, and f.HL hold. Then there exist positive constants \( {\kappa }_{\mathrm{TR}2}^T,{\kappa }_{\mathrm{TR}2}^D,{\kappa }_{\mathrm{TR}2}^E \) , and \( {\kappa }_{\mathrm{TR}2}^F \) such that, for any \( {\epsilon }_1 > 0,{\epsilon }_2 \in  (0,1\rbrack \) , the TR2 algorithm (p. 55) requires at most

\[
\begin{gathered}{\# }_{\mathrm{{TR}}2,2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}2}^{D}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\min \left\lbrack  {{\epsilon }_{1}^{2}{\epsilon }_{2},{\epsilon }_{2}^{3}}\right\rbrack  } + {\kappa }_{\mathrm{{TR}}2}^{E}\left| {\log \left( {\min \left\lbrack  {{\epsilon }_{1},{\epsilon }_{2}}\right\rbrack  }\right) }\right|  + {\kappa }_{\mathrm{{TR}}2}^{F} \\ = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_1^{-2}{\epsilon }_2^{-1},{\epsilon }_2^{-3}}\right\rbrack  }\right)\end{gathered}\tag{3.2.20}
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}}2,2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR2}}}^{T}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\min \left\lbrack  {{\epsilon }_{1}^{2}{\epsilon }_{2},{\epsilon }_{2}^{3}}\right\rbrack  } + 1 = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-2}{\epsilon }_{2}^{-1},{\epsilon }_{2}^{-3}}\right\rbrack  }\right)\tag{3.2.21}
\]

evaluations of the gradient and Hessian to produce an iterate \( {x}_e \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_k\right) }\right\rbrack   \geq   - {\epsilon }_2 \) .
'''
