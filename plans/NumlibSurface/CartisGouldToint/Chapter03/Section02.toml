source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 3.2"

[[node]]
id = "theorem_3_2_1"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 3.2.1: First-order complexity of the TR2 algorithm

Suppose that f.Bb and f.HBa hold. Then there exist positive constants \( {\kappa }_{\mathrm{TR2}}^s,{\kappa }_{\mathrm{TR2}}^A \) , \( {\kappa }_{\mathrm{TR}2}^B \) , and \( {\kappa }_{\mathrm{TR}2}^C \) for which the TR2 algorithm (p. 55) with \( {\epsilon }_2 = \infty \) requires at most

\[
{\# }_{\mathrm{{TR}}2,1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}2}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }_{1}^{2}} + {\kappa }_{\mathrm{{TR}}2}^{B}\left| {\log {\epsilon }_{1}}\right|  + {\kappa }_{\mathrm{{TR}}2}^{C} = \mathcal{O}\left( {\epsilon }_{1}^{-2}\right)
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}}2,1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}2}^{s}\frac{f\left( {x}_{0}\right)  - {f}_{low}}{{\epsilon }_{1}^{2}} + 1 = \mathcal{O}\left( {\epsilon }_{1}^{-2}\right)
\]

evaluations of the gradient and Hessian to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_{1}. \)

In this statement, the constants \( {\kappa }_{\mathrm{TR}2}^{\mathrm{A}},{\kappa }_{\mathrm{TR}2}^{\mathrm{B}},{\kappa }_{\mathrm{TR}2}^{\mathrm{C}} \) , and \( {\kappa }_{\mathrm{TR}2}^{\mathrm{S}} \) are now given by

\[
{\kappa }_{\mathrm{{TR}}2}^{\mathrm{A}}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}2}^{\mathrm{S}}\left( {1 + \frac{\log {\gamma }_{3}}{\left| \log {\gamma }_{2}\right| }}\right) ,\;{\kappa }_{\mathrm{{TR}}2}^{\mathrm{B}}\overset{\text{ def }}{ = }\frac{1}{\left| \log {\gamma }_{2}\right| },
\]

\[
{\kappa }_{\mathrm{{TR}}2}^{\mathrm{C}}\overset{\text{ def }}{ = }\frac{1}{\left| \log {\gamma }_{2}\right| }\left| {\log \left( {\frac{{\gamma }_{1}\left( {1 - {\eta }_{2}}\right) }{4{\Delta }_{0}{\kappa }_{H}}\min \left\lbrack  {1,\frac{{\Delta }_{0}}{\begin{Vmatrix}{\nabla }_{x}^{1}f\left( {x}_{0}\right) \end{Vmatrix}}}\right\rbrack  }\right) }\right|  + 1,
\]

and

\[
{\kappa }_{\mathrm{{TR2}}}^{\mathrm{S}}\overset{\text{ def }}{ = }\frac{8{\kappa }_{H}}{{\gamma }_{1}{\eta }_{1}\left( {1 - {\eta }_{2}}\right) }\max \left\lbrack  {1,\frac{\begin{Vmatrix}{\nabla }_{x}^{1}f\left( {x}_{0}\right) \end{Vmatrix}}{{\Delta }_{0}}}\right\rbrack
\]

(see (2.3.22),(2.3.23), and (2.3.21)), where we have used the relationship \( {\kappa }_B = {\kappa }_H = {L}_{f,1} \) .

We pause here to reflect. As it stands, the evaluation-complexity bound given by Theorem 3.2.1 for TR2 is no better than that for the first-order trust-region method recorded in Theorem 2.3.7, despite using exact second derivatives. Might this simply be that our analysis is insufficient, and that a better bound is possible with more care? As we now see, the answer is no-the bound in Theorem 3.2.1 is accurate.

Referenced equation payloads:

Equation (2.3.21):
\[
{\kappa }_{\mathrm{{TR1}}}^{\mathrm{S}}\overset{\text{ def }}{ = }{\left( {\eta }_{1}{\kappa }_{\mathrm{{decr}}}\right) }^{-1} = \frac{4\left( {{L}_{f,1} + {\kappa }_{B}}\right) }{{\gamma }_{1}{\eta }_{1}\left( {1 - {\eta }_{2}}\right) }\max \left\lbrack  {1,\frac{\begin{Vmatrix}{\nabla }_{x}^{1}f\left( {x}_{0}\right) \end{Vmatrix}}{{\Delta }_{0}}}\right\rbrack  ,\tag{2.3.21}
\]

Equation (2.3.22):
\[
{\kappa }_{\mathrm{{TR}}1}^{\mathrm{A}}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}}1}^{\mathrm{S}}\left( {1 + \frac{\log {\gamma }_{3}}{\left| \log {\gamma }_{2}\right| }}\right) ,\;{\kappa }_{\mathrm{{TR}}1}^{\mathrm{B}}\overset{\text{ def }}{ = }\frac{1}{\left| \log {\gamma }_{2}\right| },\tag{2.3.22}
\]

Equation (2.3.23):
\[
{\kappa }_{\mathrm{{TR1}}}^{\mathrm{C}}\overset{\text{ def }}{ = }\frac{1}{\left| \log {\gamma }_{2}\right| }\left| {\log \left( {\frac{{\gamma }_{1}\left( {1 - {\eta }_{2}}\right) }{2{\Delta }_{0}\left( {{L}_{f,1} + {\kappa }_{B}}\right) }\min \left\lbrack  {1,\frac{{\Delta }_{0}}{\begin{Vmatrix}{\nabla }_{x}^{1}f\left( {x}_{0}\right) \end{Vmatrix}}}\right\rbrack  }\right) }\right|  + 1.\tag{2.3.23}
\]
'''
