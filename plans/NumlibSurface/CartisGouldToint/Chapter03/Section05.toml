namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 3, Section 5.

The method class M is defined by an approximate shifted Newton system, residual controls, shifted-Hessian PSD, and the multiplier upper control (3.5.2)–(3.5.4). These structural assumptions do not include complexity bounds. Theorem 3.5.4 constructs a uniformly smooth difficult function for each permitted method; Corollary 3.5.5 combines upper and lower bounds with the correct class-membership assumptions.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

Having considered a number of methods that use second-order derivatives and shown that the bounds on their worst-case evaluation complexity can differ materially, it is now time to take a step back and ask ourselves two general questions. The first is, "What exactly do we mean by a second-order method?" In other words, is there an underlying structure which is common to the methods we have considered so far, and possibly to others that we have not considered here? The second is, "Which second-order methods have the best evaluation complexity?" We have already seen in Sections 3.1 and 3.2 that, sadly, Newton's method does not qualify for the second accolade, and neither does the traditional trust-region method, but are the other algorithms we have considered in the succeeding Sections 3.3 and 3.4 the absolutely best possible given the information available? Would the underlying structure of the best second-order methods we have studied so far provide a clue? This section aims at providing some answers to these questions.

#### 3.5.1 The \( \mathcal{M} \) class of second-order methods

We start by addressing the first question, describing a class of methods we believe is a reasonable attempt to unify second-order methods. Our intention is, as we have done throughout this chapter, to apply these methods to the minimization of twice continuously differentiable functions \( f \) that are bounded below, with Lipschitz-continuous gradient and Hessian, and thus satisfy f.Bb, f.gL, and f.HL.

We say that the \( \mathcal{M} \) class of second-order methods consists of all methods which satisfy the following generic conditions. Given some initial \( {x}_0 \in  {\mathbb{R}}^n \) , a method in the \( \mathcal{M} \) class generates a sequence of iterates \( \left\{  {x}_k\right\} \) such that

\[
{x}_{k + 1} = {x}_k + {s}_k,\;k \geq  0,\tag{3.5.1}
\]

where the step \( {s}_k \) satisfies

\[
\left( {{\nabla }_{x}^{2}f\left( {x}_{k}\right)  + {\lambda }_{k}I}\right) {s}_{k} =  - {\nabla }_{x}^{1}f\left( {x}_{k}\right)  + {r}_{k}\text{ with }\begin{Vmatrix}{r}_{k}\end{Vmatrix} \leq  \min \left\lbrack  {{\kappa }_{rg}\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix},{\kappa }_{rs}{\begin{Vmatrix}{s}_{k}\end{Vmatrix}}^{2}}\right\rbrack \tag{3.5.2}
\]

for some residual \( {r}_k \) and constants \( {\kappa }_{rg} \in  \lbrack 0,1) \) and \( {\kappa }_{rs} > 0 \) and for some \( {\lambda }_k \) such that

\[
{\lambda }_{k} \geq  0,{\nabla }_{x}^{2}f\left( {x}_{k}\right)  + {\lambda }_{k}I\text{ is positive semidefinite }\tag{3.5.3}
\]

and

\[
{\lambda }_{\min }\left( {{\nabla }_x^{2}f\left( {x}_k\right) }\right)  + {\lambda }_k \leq  {\kappa }_{\lambda }\max \left\{  {\left| {{\lambda }_{\min }\left( {{\nabla }_x^{2}f\left( {x}_k\right) }\right) }\right| ,{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_k\right) \end{Vmatrix}}^{\frac{1}{2}}}\right\}\tag{3.5.4}
\]

for some \( {\kappa }_{\lambda } > 1 \) independent of \( k \) . Without loss of generality, we assume that \( {s}_k \neq  0 \) .

Does this framework cover existing methods? Do conditions (3.5.2)-(3.5.4) relate to local and/or global minimization of the local models/subproblems we have encountered until now? We defer this discussion to Section 3.5.1.2 (p. 92), and consider properties of methods in the class \( \mathcal{M} \) here.

##### 3.5.1.1 Properties of methods in class \( \mathcal{M} \)

The algorithms we have explored in this chapter allow successful and unsuccessful iterations, where the latter are used to adjust algorithm parameters so as to facilitate progress. In order to simplify exposition, in the \( \mathcal{M} \) -class framework we focus only on successful iterations, when the step is accepted. There is no loss of generality in doing so since although local refinement of the model may be required to ensure function decrease, as we have seen in Chapters 2 and 3, the number of function evaluations to do so does not increase the overall worst-case evaluation complexity by more than a constant multiple and thus does not affect quantitatively the worst-case bounds derived; see, for example, Lemmas 2.3.1 and 2.4.1. Furthermore, the examples of slow convergence we have presented in this book, and those that we propose here, are constructed in such a way that each iteration of the method is successful and provides sufficient decrease of \( f \) in a local second-order model of the form

\[
{m}_{k,\beta }\left( s\right)  = f\left( {x}_k\right)  + {\nabla }_x^{1}f{\left( {x}_k\right) }^{T}s + \frac{1}{2}{s}^T\left( {{\nabla }_x^{2}f\left( {x}_k\right)  + {\beta }_k{\lambda }_{k}I}\right) s\tag{3.5.5}
\]

of \( f\left( {{x}_k + s}\right) \) , where \( 0 \leq  {\beta }_k \leq  1 \) and its choice is method dependent.

Since the requirement (3.5.4) may at first glance seem rather obscure, we start by giving a sufficient, more concise, condition on the algorithm-generated \( {\lambda }_k \) that implies this awkward-looking bound. All missing proofs can be found in Appendix B.
'''

