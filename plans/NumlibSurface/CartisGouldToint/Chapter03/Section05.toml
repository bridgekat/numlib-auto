[[node]]
id = "theorem_3_5_4"
kind = "theorem"
desc = '''Every deterministic method in class M has a one-dimensional epsilon-dependent uniformly bounded-below objective with uniformly Lipschitz gradient/Hessian requiring exactly ceil(epsilon1^(−3/2)) iterates. Adversarial Hermite interpolation prescribes f_k,g_k,H_k adapted to legal multipliers/residuals; maintain uniform constants. Execution must be that of the deterministic oracle rule in secondOrderMethodClass. Any smoothness-class uniformity needed for a family of adversarial objectives must be an explicit additional premise such as uniformSecondOrderMethodClass, not substituted for literal membership. The supplied proof also has endpoint rounding and sign issues to audit before formalization.'''
deps = ["secondOrderMethodClass", "uniformSecondOrderMethodClass"]
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 3.5.4"

[[node]]
id = "corollary_3_5_5"
kind = "theorem"
desc = '''Under the stated accurate subproblem conditions AR2, TR-epsilon and iRN attain the optimal first-order epsilon1^(−3/2) order within class M. Combine their membership, upper bounds and adversarial lower bound; avoid claiming optimality for all unconstrained oracle methods here.'''
deps = ["theorem_3_5_4"]
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Corollary 3.5.5"
