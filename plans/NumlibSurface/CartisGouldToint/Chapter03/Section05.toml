Corollary 3.5.5: Optimal complexity

When applied to a function satisfying f.Bb, f.gL, and f.HL, the AR2, TR \( \epsilon \) , and iRN variants have optimal evaluation complexity within the \( \mathcal{M} \) class for generating approximate first-order critical points.
