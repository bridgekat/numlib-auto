[[node]]
id = "lemma_3_5_1"
kind = "theorem"
desc = '''The printed explicit constant is κλ = 2 sqrt(κλ(1+κrg)). The corrected theorem lemma_3_5_1_corrected uses barκλ inside the square root, as required by the Appendix B.3.5 quadratic.'''
wrong = '''The printed self-reference forces κλ=4(1+κrg), independent of barκλ. This is false for unrestricted barκλ: in one dimension take H=0, g=1, r=0, κrg=0, κrs=1, λ=10, s=-1/10 and barκλ=100. The residual equation, PSD and λ≤barκλ|s| hold, while λ=10>4. This jet is realized by f(x)=sin(x) at x=0, which also satisfies global f.Bb/f.gL/f.HL with normalized gradient/Hessian Lipschitz constants 1. Appendix B.3.5 explicitly uses barκλ(1+κrg). See lemma_3_5_1_corrected.'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 3.5.1"

[[node]]
id = "lemma_3_5_1_corrected"
source = "Cartis, Gould and Toint, Lemma 3.5.1, corrected explicit constant from Appendix B.3.5"

