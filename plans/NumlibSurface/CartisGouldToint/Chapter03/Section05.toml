[[node]]
id = "theorem_3_5_4"
kind = "theorem"
desc = '''
Scope audit: the accepted-history-only ScalarMethod interface does not represent rejected or off-trajectory oracle queries used by the full source class (AR2, trust-region and linesearch methods). The separate oracle-controller companion proves a genuine uniform lower bound for its explicitly narrower controller class; this full original remains OPEN pending an interactive-oracle/resisting construction.

Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 3.5.4: A complexity lower bound for methods in \( \mathcal{M} \)

For every \( {\epsilon }_1 \in  \left( {0,1}\right) \) and every method in \( \mathcal{M} \) , there is a function \( {f}_{\epsilon }^{\mathcal{M}} : \mathbb{R} \rightarrow  \mathbb{R} \) that satisfies f.Bb, f.gL, and f.HL with values in a bounded interval independent of \( {\epsilon }_1 \) , for which the method under consideration terminates exactly at iteration

\[
{k}_{\epsilon } = \left\lceil  {\epsilon }_1^{-\frac{3}{2}}\right\rceil
\]

where \( {x}_{{k}_{\epsilon }} \) is the first iterate that satisfies \( \begin{Vmatrix}{{\nabla }_x{f}_{\epsilon }^{\mathcal{M}}\left( {x}_{{k}_{\epsilon }}\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) .
'''
deps = ["secondOrderMethodClass", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 3.5.4 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 4282)"

