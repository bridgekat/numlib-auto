namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 3, Section 1.

The slow-Newton statement is an adversarial construction, not an upper-complexity theorem. Newton steps must solve the true Hessian system and the construction must retain f.Bb, f.gL, and f.HL with constants independent of accuracy.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

What happens to the worst-case evaluation complexity for methods where we now allow the use of (true) second derivatives? The answer to this question is somewhat surprising. Indeed, many second-order algorithms do not converge faster, in the worst case, than first-order ones, in their worst case.

To substantiate this claim, we shall construct an example showing that Newton's method, the prototype of most second-order algorithms, may require at least \( \mathcal{O}\left( {\epsilon }_1^{-2}\right) \) evaluations of the objective function, as well as its gradient and Hessian, before finding an \( {\epsilon }_1 \) -approximate first-order minimizer. Note the use of \( {\epsilon }_1 \) in the previous sentence, rather than \( \epsilon \) (as in the previous chapter): this is because convergence to second-order points will involve both first- and second-order optimality tests, for which we will use different tolerances \( {\epsilon }_1 \) and \( {\epsilon }_2 \) . The need for \( {\epsilon }_1 \) and \( {\epsilon }_2 \) will become clearer when we discuss the globalized version of Newton's method in Sections 3.2 and 3.3. We will also return to the question of choosing optimality goals in Section 12.1.

Of course the reader might reasonably contend that because the unfettered Newton iteration is known to diverge in many cases [172], it is hardly surprising that a poor worst-case bound could arise without precautions, even in favourable circumstances. However, this is not the point, but rather that many of the methods we shall consider later in this chapter reduce to Newton's method when close to a minimizer, indeed sometimes even globally, throughout the run of the algorithm, under suitable conditions such as the presence of positive curvature. It is thus helpful to consider what might happen under these supposedly favourable circumstances.

The standard Newton iteration for solving the unconstrained minimization problem uses the following assumption.

f.C2 \( f \) is twice continuously differentiable.

The method is outlined in Algorithm 3.1.1.

Algorithm 3.1.1: Newton's method for unconstrained minimization

Step 0: Initialization. A starting point \( {x}_0 \in  {\mathbb{R}}^n \) is given. Set \( k = 0 \) .

Step 1: Test for termination. Compute \( {\nabla }_x^{1}f\left( {x}_k\right) \) . If \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) , terminate with \( {x}_k \) as the \( {\epsilon }_1 \) -approximate first-order minimizer.

Step 2: Step computation. Compute \( {\nabla }_x^{2}f\left( {x}_k\right) \) and the step \( {s}_k \) as the solution of the linear system

\[
{\nabla }_x^{2}f\left( {x}_k\right) {s}_k =  - {\nabla }_x^{1}f\left( {x}_k\right) .\tag{3.1.1}
\]

Step 3: Acceptance of the trial point. Set \( {x}_{k + 1} = {x}_k + {s}_k \) , increment \( k \) by one, and go to Step 1.

Of course, the method as described in this outline makes strong (favourable) assumptions: it presumes that the matrix \( {\nabla }_x^{2}f\left( {x}_k\right) \) is positive definite for each \( k \) and that \( f\left( {{x}_k + {s}_k}\right) \) is sufficiently smaller than \( f\left( {x}_k\right) \) without any specific globalization procedure, such as a linesearch or a shrinking trust region. However, since our example will ensure both of these properties, the above description is sufficient for our purpose. It is important, for what follows, that the step defined by (3.1.1) be equivalently defined by

\[
{s}_k = \underset{s \in  {\mathbb{R}}^n}{\arg \min }{T}_{f,2}\left( {{x}_k, s}\right)  = \underset{s \in  {\mathbb{R}}^n}{\arg \min }f\left( {x}_k\right)  + \left\langle  {{\nabla }_x^{1}f\left( {x}_k\right) , s}\right\rangle   + \frac{1}{2}\left\langle  {s,{\nabla }_x^{2}f\left( {x}_k\right) s}\right\rangle\tag{3.1.2}
\]

whenever \( {\nabla }_x^{2}f\left( {x}_k\right) \) is positive definite. \( {}^{15} \)

The complexity result we are about to present is actually true for a more restrictive class of twice continuously differentiable functions, those with Lipschitz-continuous Hessians. These are defined as follows.

---

\( {}^{15}\mathrm{\;A} \) globalization technique, such as that in the TR2 algorithm discussed later in this chapter, is necessary when \( {\nabla }_x^{2}f\left( {x}_k\right) \) is not positive definite.

---

---

f.HL

---

\( f\left( x\right) \) is twice continuously differentiable in \( {\mathbb{R}}^n \) , and its Hessian \( {\nabla }_x^{2}f\left( x\right) \) is Lipschitz continuous on \( {\mathbb{R}}^n \) ; that is, there exists a constant \( {L}_{f,2} \geq  1 \) such that

\[
\begin{Vmatrix}{{\nabla }_x^{2}f\left( x\right)  - {\nabla }_x^{2}f\left( y\right) }\end{Vmatrix} \leq  {L}_{f,2}\parallel x - y\parallel\tag{3.1.3}
\]

for all \( x, y \in  {\mathbb{R}}^n \) .

Of course f.HL subsumes f.C2, and f.HL holds if \( f \in  {C}^3 \) with bounded third derivatives. The assumption that \( {L}_{f,2} \geq  1 \) is made without losing generality and simply saves us all from a sequence of expressions involving terms such as \( \max \left\lbrack  {1,{L}_{f,2}}\right\rbrack \) .
'''

