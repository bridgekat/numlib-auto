[[node]]
id = "theorem_1_1_2_source_converse"
kind = "theorem"
desc = '''
The uncorrected converse of Theorem 1.1.2: first-order inequality on C(x*) and strict Hessian positivity for nonzero feasible displacements orthogonal to grad f imply strict local minimality. This is false for arbitrary closed convex C.
'''
deps = ["feasibleDisplacements"]
wrong = '''
Counterexample: C={(u,v)∈ℝ²|v≥u⁴}, x*=0, f(u,v)=v−u². C is nonempty, closed and convex; grad f(0)=(0,1), hence the first-order inequality holds. The only d∈C with grad f(0)·d=0 is d=0, so strict positivity on nonzero such d holds vacuously. Yet f(t,t⁴)=t⁴−t²<0=f(0) for 0<|t|<1.
'''
source = "Cartis–Gould–Toint, Theorem 1.1.2, converse"

[[node]]
id = "theorem_1_1_2_tangentCone_sufficient"
kind = "theorem"
desc = '''
Corrected sufficient clause: let C be closed convex, x*∈C, f C² on an open neighborhood, and ⟪grad f x*,y−x*⟫≥0 for all y∈C. Let T be the closure of {t • (y−x*) | t≥0, y∈C}. If D²f(x*)[d,d]>0 for every nonzero d∈T with ⟪grad f x*,d⟫=0, then x* is a strict local minimizer of f on C. This explicitly strengthens the faulty source condition from actual displacements to the closed tangent cone; prove by compactness of normalized feasible displacements and a second-order Taylor contradiction.
'''
deps = ["feasibleDisplacements"]
source = "Cartis–Gould–Toint, Theorem 1.1.2, corrected converse"

[[node]]
id = "theorem_1_1_3"
kind = "theorem"
desc = '''
Semantic specification: Use explicit LICQ for the unspecified constraint qualification and require d≠0 in (1.1.15); both necessary and sufficient statements must be exposed with their own regularity assumptions.

Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 1.1.3: Equality-constrained optimality conditions

Let \( \mathcal{S} \) be an open set containing the feasible region \( \{ x \mid  c\left( x\right)  = 0\} \) , let \( f : {\mathbb{R}}^n \rightarrow  \mathbb{R} \) and \( c : {\mathbb{R}}^n \rightarrow  {\mathbb{R}}^m \in  {C}^1\left( \mathcal{S}\right) \) , suppose that \( {x}_{ * } \in  {\mathbb{R}}^n \) is a local minimizer of \( f\left( x\right) \) subject to \( c\left( x\right)  = 0 \) , and suppose that a constraint qualification is satisfied at \( {x}_{ * } \) . Then there exist Lagrange multipliers \( {y}_{ * } \in  {\mathbb{R}}^m \) for which

\[
{\nabla }_{x}^{1}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right)  = 0\text{ and }c\left( {x}_{ * }\right)  = 0.\tag{1.1.13}
\]

If \( f, c \in  {C}^2\left( \mathcal{S}\right) \) , then

\[
\left\langle  {d,{\nabla }_{x}^{2}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) d}\right\rangle   \geq  0\text{ for all }d\text{ such that }{\nabla }_{x}^{1}c\left( {x}_{ * }\right) d = 0\text{ . }\tag{1.1.14}
\]

Conversely, if, for given \( {x}_{ * } \in  {\mathbb{R}}^n,{y}_{ * } \in  {\mathbb{R}}^m \) , and \( f, c \in  {C}^2\left( \mathcal{S}\right) \) ,(1.1.13) holds and

\[
\left\langle  {d,{\nabla }_{x}^{2}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) d}\right\rangle   > 0\text{ for all }d\text{ such that }{\nabla }_{x}^{1}c\left( {x}_{ * }\right) d = 0,\tag{1.1.15}
\]

then \( {x}_{ * } \) is a strict local minimizer of \( f\left( x\right) \) subject to \( c\left( x\right)  = 0 \) .
'''
deps = ["lagrangian", "feasibleDisplacements"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 1.1.3 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 863)"

[[node]]
id = "theorem_1_1_4"
kind = "theorem"
desc = '''
Semantic specification: Use linear independence of the active gradients for the unspecified constraint qualification and require d≠0 in (1.1.18). Preserve nonnegative multipliers and componentwise feasibility, stationarity and complementarity.

Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 1.1.4: Inequality-constrained optimality conditions

Let \( \mathcal{S} \) be an open set containing the feasible region \( \{ x \mid  c\left( x\right)  \geq  0\} \) , let \( f : {\mathbb{R}}^n \rightarrow  \mathbb{R} \) and \( c : {\mathbb{R}}^n \rightarrow  {\mathbb{R}}^m \in  {C}^1\left( \mathcal{S}\right) \) , suppose that \( {x}_{ * } \in  {\mathbb{R}}^n \) is a local minimizer of \( f\left( x\right) \) subject to \( c\left( x\right)  \geq  0 \) , and suppose that a constraint qualification is satisfied at \( {x}_{ * } \) . Then there exist Lagrange multipliers \( {y}_{ * } \in  {\mathbb{R}}^m \) for which

\[
{\nabla }_{x}^{1}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right)  = 0, c\left( {x}_{ * }\right)  \geq  0,{y}_{ * } \geq  0,\text{ and }\left\langle  {{y}_{ * }, c\left( {x}_{ * }\right) }\right\rangle   = 0.\tag{1.1.16}
\]

If \( f, c \in  {C}^2\left( \mathcal{S}\right) \) , then

\[
\left\langle  {d,{\nabla }_{x}^{2}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) d}\right\rangle   \geq  0\text{ for all }d \in  {\mathcal{N}}_{ + },\tag{1.1.17}
\]

where

\[
{\mathcal{N}}_{ + } = \left\{  {d \in  {\mathbb{R}}^{n} \mid  \begin{array}{l} \left\langle  {d,{\nabla }_{x}^{1}{c}_{i}\left( {x}_{ * }\right) }\right\rangle   = 0\text{ for all }i \in  \mathcal{A}\left( {x}_{ * }\right) \text{ with }{\left\lbrack  {y}_{ * }\right\rbrack  }_{i} > 0\text{ and } \\  \left\langle  {d,{\nabla }_{x}^{1}{c}_{i}\left( {x}_{ * }\right) }\right\rangle   \geq  0\text{ for all }i \in  \mathcal{A}\left( {x}_{ * }\right) \text{ with }{\left\lbrack  {y}_{ * }\right\rbrack  }_{i} = 0 \end{array}}\right\}  .
\]

Conversely, if, for given \( {x}_{ * } \in  {\mathbb{R}}^n,{y}_{ * } \in  {\mathbb{R}}^m \) , and \( f, c \in  {C}^2\left( \mathcal{S}\right) \) ,(1.1.16) holds and

\[
\left\langle  {d,{\nabla }_{x}^{2}\mathcal{L}\left( {{x}_{ * },{y}_{ * }}\right) d}\right\rangle   > 0\text{ for all }d \in  {\mathcal{N}}_{ + },\tag{1.1.18}
\]

then \( {x}_{ * } \) is a strict local minimizer of \( f\left( x\right) \) subject to \( c\left( x\right)  \geq  0 \) .
'''
deps = ["theorem_1_1_2", "theorem_1_1_1", "lagrangian", "feasibleDisplacements"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 1.1.4 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 903)"
