[[node]]
id = "theorem_5_4_4"
wrong = "The literal total iteration count fails at a permitted epsilon below zeta but above zeta/2. theorem_5_4_4_counterexample realizes f(x)=x^2/2 with a genuine one-trial AR2 execution, tightened model derivative zero, ratio one, all five finite local threshold terms, and every produced point inside Qstar. With step scale2^(-40), zeta equal to the initial gradient and epsilon=zeta/sqrt(2), the printed double logarithm equals -1. It cancels the final +1, leaving the exact global term below one, although the initial point fails and one accepted trial is necessary. This refutes the displayed total count; the separate global count of large-gradient successful iterations is not refuted."
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 5.4.4: Global complexity bound for locally convex functions

Suppose that f.Bb and f.HL hold, that \( {x}_{ * } \) is a local minimizer of \( f\left( x\right) \) for which \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{ * }\right) }\right\rbrack   > 0 \) , and that the AR2 algorithm (p. 65) with the model-termination test (5.4.3) is applied to minimize \( f \) . Then there are at most

\[
{\# }_{\mathrm{{AR}}2,\mathrm{G}}^{\mathrm{{SI}}}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR}}2}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\zeta }^{3/2}} + 1\tag{5.4.16}
\]

successful iterations \( k \) of the AR2 algorithm for which \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix} > \zeta \) for some positive constant \( {\kappa }_{\mathrm{AR}2}^s \) defined as in Lemma 3.3.4, and where \( \zeta  \leq  {\zeta }_{ * }/2 \) with \( {\zeta }_{ * } \) defined as in (5.4.5). Furthermore, the AR2 algorithm takes at most

\[
{\# }_{\mathrm{{AR}}2,\mathrm{\;L}}^{\mathrm{{SI}}}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR2}}}^{s}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\zeta }^{3/2}} + {\log }_{2}\left( {{\log }_{2}\left( \frac{\zeta }{\epsilon }\right) }\right)  + 1\tag{5.4.17}
\]

successful iterations to generate \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_j\right) }\end{Vmatrix} < \epsilon \) , for given \( \epsilon  > 0 \) , so long as there are no \( {x}_k \) such that

\[
\begin{Vmatrix}{{x}_{k} - {x}_{ * }}\end{Vmatrix} > {q}_{ * }\text{ and }\epsilon  < \begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \leq  \zeta ,\tag{5.4.18}
\]

with \( {q}_{ * } \) given in (5.4.1).

Referenced equation payloads:

Equation (5.4.1):
\[
{\mathcal{Q}}_{ * }\overset{\text{ def }}{ = }\left\{  {x : \begin{Vmatrix}{x - {x}_{ * }}\end{Vmatrix} \leq  {q}_{ * }}\right\}  ,\text{ where }{q}_{ * }\overset{\text{ def }}{ = }\frac{{\lambda }_{\min , * }}{4{L}_{f,2}},\tag{5.4.1}
\]

Equation (5.4.3):
\[
\begin{Vmatrix}{{\nabla }_s^1{m}_k\left( {s}_k\right) }\end{Vmatrix} \leq  {\theta }_1\min \left( {\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix},\frac{1}{2}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^2}\right)\tag{5.4.3}
\]

Equation (5.4.5):
\[
\begin{gathered}{\zeta }_{ * }\overset{\text{ def }}{ = }\min \left\lbrack  {\frac{2}{{L}_{f,2} + {\theta }_{1} + {\sigma }_{\max }}{\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_{1}}\right) }^{2},}\right. \\ \frac{{\lambda }_{\min , * }}{4{L}_{f,2}}\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) ,\frac{{\lambda }_{\min , * }^2}{{16}{L}_{f,2}}, \\ \frac{3\left( {1 - {\eta }_2}\right) {\lambda }_{\min , * }}{4{L}_{f,2}}\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) , \\ \left. {\frac{{\lambda }_{\min , * }}{4\max \left( {{\theta }_1 - {\sigma }_{\min },0}\right) }\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) }\right\rbrack  ,\end{gathered}\tag{5.4.5}
\]
'''
