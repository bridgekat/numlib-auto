\[
\begin{Vmatrix}{{x}_{{k}_{0}} - {x}_{ * }}\end{Vmatrix} \leq  {q}_{ * }\text{ and }\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{{k}_{0}}\right) }\end{Vmatrix} \leq  \zeta ,\tag{5.4.13}
\]

where \( {q}_{ * } \) and \( {\zeta }_{ * } \) are defined as in (5.4.1) and (5.4.5) and \( \zeta  \leq  {\zeta }_{ * }/2 \) , then the AR2 algorithm takes at most

\[
{\# }_{\mathrm{{AR}}2,\mathrm{A}}^{\mathrm{{SI}}}\overset{\text{ def }}{ = }{\log }_{2}\left( {{\log }_{2}\left( \frac{\zeta }{\epsilon }\right) }\right)\tag{5.4.14}
\]

(successful) iterations from iteration \( {k}_0 \) onward to generate \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_j\right) }\end{Vmatrix} \leq  \epsilon \) for given \( \epsilon  > 0 \) .

Referenced equation payloads:

