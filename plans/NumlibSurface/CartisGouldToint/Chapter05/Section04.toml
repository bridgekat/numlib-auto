[[node]]
id = "lemma_5_4_2"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.4.2: Region of quadratic convergence

Suppose that f.HL holds, that \( {x}_{ * } \) is a local minimizer of \( f\left( x\right) \) for which \( {\lambda }_{\min , * } = \; {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{ * }\right) }\right\rbrack   > 0 \) , and that the AR2 algorithm (p. 65), with the more stringent model-termination test

\[
\begin{Vmatrix}{{\nabla }_s^1{m}_k\left( {s}_k\right) }\end{Vmatrix} \leq  {\theta }_1\min \left( {\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix},\frac{1}{2}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^2}\right)\tag{5.4.3}
\]

replacing (3.3.5), is applied to minimize \( f \) . Furthermore, suppose that \( {x}_k \in  {\mathcal{Q}}_{ * } \) , where the set \( {\mathcal{Q}}_{ * } \) is as given in (5.4.1), and that iteration \( k \) is successful. Then

\[
\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{k + 1}\right) }\end{Vmatrix} \leq  \frac{1}{{\zeta }_{ * }}{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_k\right) \end{Vmatrix}}^2,\tag{5.4.4}
\]

where

\[
\begin{gathered}{\zeta }_{ * }\overset{\text{ def }}{ = }\min \left\lbrack  {\frac{2}{{L}_{f,2} + {\theta }_{1} + {\sigma }_{\max }}{\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_{1}}\right) }^{2},}\right. \\ \frac{{\lambda }_{\min , * }}{4{L}_{f,2}}\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) ,\frac{{\lambda }_{\min , * }^2}{{16}{L}_{f,2}}, \\ \frac{3\left( {1 - {\eta }_2}\right) {\lambda }_{\min , * }}{4{L}_{f,2}}\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) , \\ \left. {\frac{{\lambda }_{\min , * }}{4\max \left( {{\theta }_1 - {\sigma }_{\min },0}\right) }\left( \frac{{\lambda }_{\min , * } + \frac{1}{2}{\sigma }_{\min }}{1 + {\theta }_1}\right) }\right\rbrack  ,\end{gathered}\tag{5.4.5}
\]

\( {\sigma }_{\min } \) and \( {\theta }_1 > 0 \) are as specified for the algorithm, and \( {\sigma }_{\max } \) is given by (3.3.14). Furthermore, let

\[
{\mathcal{Q}}_{ * }^{1}\overset{\text{ def }}{ = }{\mathcal{Q}}_{ * } \cap  \left\{  {x : \begin{Vmatrix}{{\nabla }_{x}^{1}f\left( x\right) }\end{Vmatrix} \leq  {\zeta }_{ * }}\right\}\tag{5.4.6}
\]

and suppose that \( {x}_{{k}_0} \in  {\mathcal{Q}}_{ * }^1 \) for some \( {k}_0 \geq  0 \) . Then \( {x}_k \in  {\mathcal{Q}}_{ * }^1 \) for all iterations \( k \geq  {k}_0 \) , each of these iterations is successful, and (5.4.4) holds for all.

Referenced equation payloads:

Equation (3.3.5):
\[\begin{Vmatrix}{{\nabla }_s^1{m}_k\left( {s}_k\right) }\end{Vmatrix} \leq  \frac{1}{2}{\theta }_1{\begin{Vmatrix}{s}_k\end{Vmatrix}}^2,\]

Equation (3.3.14):
\[
{\sigma }_{k} \leq  {\sigma }_{\max }\overset{\text{ def }}{ = }\max \left\lbrack  {{\sigma }_{0},\frac{{\gamma }_{3}{L}_{f,2}}{1 - {\eta }_{2}}}\right\rbrack  .\tag{3.3.14}
\]

Equation (5.4.1):
\[
{\mathcal{Q}}_{ * }\overset{\text{ def }}{ = }\left\{  {x : \begin{Vmatrix}{x - {x}_{ * }}\end{Vmatrix} \leq  {q}_{ * }}\right\}  ,\text{ where }{q}_{ * }\overset{\text{ def }}{ = }\frac{{\lambda }_{\min , * }}{4{L}_{f,2}},\tag{5.4.1}
\]
'''
deps = ["lemma_5_4_1", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 5.4.2 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 6832)"

[[node]]
id = "lemma_5_4_3"
wrong = "The literal double logarithm is zero at epsilon=zeta/2, although an accepted iteration can be necessary. The formal actual AR2 counterexample uses f(x)=x^2/2, true least eigenvalue1 at minimizer0, L=1, sigmaMin=sigmaInitial=1/4, theta=1/2, eta2=3/4 and gamma3=3. All five printed local threshold terms are finite and their minimum is1/16; the source parameter cap is12. The initial point and gradient zeta=513/32768 lie in the radius1/4 ball and satisfy zeta<=zetaStar/2. Actual model-stationary step -1/64 is strictly improving, has objective ratio1, obeys every update and tightened model test, and produces endpoint gradient1/32768 below epsilon=zeta/2. The initial point fails that accuracy; no natural index at most the printed zero count can certify it. A ceiling alone does not repair the zero expression: a positive correction inside or outside the double logarithm is needed."
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.4.3: Asymptotic evaluation count

