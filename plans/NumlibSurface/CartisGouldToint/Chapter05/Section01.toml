Lemma 5.1.6: Good exponents of \( \begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \) in residual-decrease bounds

Let \( p \in  \mathbb{N} \) . If

\[
\ell  = p\text{ and }i > {\log }_{2}p\tag{5.1.38}
\]

then the exponent (5.1.21) of \( \begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \) in (5.1.20) is strictly positive. If \( p \) is even and

\[
\ell  = 1 + o \cdot  \left( {{2}^{i} - 1}\right) ,\text{ where }p = o \cdot  {2}^{i},\tag{5.1.39}
\]

then the same exponent is zero and \( \ell  > 1 \) . If \( p \) is even and

\[
\ell  = \frac{1}{2}p\text{ and }i > {\log }_{2}\left( {p - 1}\right) ,\tag{5.1.40}
\]

then (5.1.21) and the exponent (5.1.23) of \( \begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \) in (5.1.22) are both strictly positive. If \( p - 1 \) is divisible by four and

\[
\ell  = 1 + {o}_{2} \cdot  \left( {{2}^{i} - 1}\right) ,\text{ where }p - 1 = {o}_{2} \cdot  {2}^{i + 1},\tag{5.1.41}
\]

then (5.1.23) is zero,(5.1.21) is strictly positive, and \( \ell  > 1 \) . If \( p \) is a multiple of three and

\[
\ell  = \frac{1}{3}p\text{ and }i > {\log }_{2}\left( {p - 2}\right) ,\tag{5.1.42}
\]

then (5.1.21),(5.1.23), and the exponent (5.1.25) of \( \begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \) in (5.1.24) are all strictly positive. If the power of two in the prime factorization of \( p - 2 \) is positive and even and

\[
\ell  = 1 + {o}_{3} \cdot  \mathop{\sum }\limits_{{k = 0}}^{{j - 1}}{2}^{2k},\text{ where }p - 2 = {o}_{3} \cdot  {2}^{i}\text{ and }j = \lfloor i/2\rfloor ,\tag{5.1.43}
\]

then (5.1.25) is zero,(5.1.21) and (5.1.23) are strictly positive, and \( \ell  > 1 \) .

Referenced equation payloads:

Equation (5.1.20):
\[
{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{1/{2}^i} - {\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{1/{2}^i} \geq  {\kappa }_{r1}\frac{{\left\lbrack  {\psi }_{\ell ,1}\left( {x}_{k + 1}\right) \right\rbrack  }^{\frac{p + 1}{p}}}{{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{{\iota }_1\left( {p,\ell , i}\right) }},\tag{5.1.20}
\]

Equation (5.1.21):
\[
{\iota }_{1}\left( {p,\ell , i}\right) \overset{\text{ def }}{ = }\frac{{2}^{i} - 1}{{2}^{i}} - \frac{\ell  - 1}{p}\text{ and }{\kappa }_{r1}\overset{\text{ def }}{ = }\frac{{\kappa }_{1}{\beta }^{\frac{\left( {\ell  - 1}\right) \left( {p + 1}\right) }{p}}}{{2}^{i}},\tag{5.1.21}
\]

Equation (5.1.22):
\[
{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{1/{2}^i} - {\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{1/{2}^i} \geq  {\kappa }_{r2}\frac{\max {\left\lbrack  0, - {\psi }_{\ell ,2}\left( {x}_{k + 1}\right) \right\rbrack  }^{\frac{p + 1}{p - 1}}}{{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{{\iota }_2\left( {p,\ell , i}\right) }},\tag{5.1.22}
\]

Equation (5.1.23):
\[
{\iota }_{2}\left( {p,\ell , i}\right) \overset{\text{ def }}{ = }\frac{{2}^{i} - 1}{{2}^{i}} - 2\frac{\ell  - 1}{p - 1}\text{ and }{\kappa }_{r2}\overset{\text{ def }}{ = }\frac{{\kappa }_{2}{\beta }^{\frac{\left( {\ell  - 1}\right) \left( {p + 1}\right) }{p - 1}}}{{2}^{i}}\tag{5.1.23}
\]

Equation (5.1.24):
\[
{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{1/{2}^i} - {\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{1/{2}^i} \geq  {\kappa }_{r3}\frac{{\left\lbrack  {\psi }_{\ell ,3}\left( {x}_{k + 1}, d\right) \right\rbrack  }^{\frac{p + 1}{p - 2}}}{{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{{\iota }_3\left( {p,\ell , i}\right) }}\tag{5.1.24}
\]

Equation (5.1.25):
\[
{\iota }_{3}\left( {p,\ell , i}\right) \overset{\text{ def }}{ = }\frac{{2}^{i} - 1}{{2}^{i}} - 3\frac{\ell  - 1}{p - 2}\text{ and }{\kappa }_{r3}\overset{\text{ def }}{ = }\frac{{\kappa }_{3}{\beta }^{\frac{\left( {\ell  - 1}\right) \left( {p + 1}\right) }{p - 2}}}{{2}^{i}}\tag{5.1.25}
\]
'''
