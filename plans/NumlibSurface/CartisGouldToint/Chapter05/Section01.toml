[[node]]
id = "theorem_5_1_7"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 5.1.7: Complexity of finding first- to third-order critical points of \( \parallel r\left( x\right) \parallel \) by the \( {ARpLE} \) algorithm

Suppose that \( i \geq  0 \) and \( \ell  > 1 \) satisfy either (5.1.42) or (5.1.43) for an appropriate \( p \) , that \( {\Phi }_{\ell }.D\mathbf{pL} \) holds, and that \( \beta  \in  \left( {0,1}\right) \) is a fixed, problem-independent constant. Then there exist positive constants \( {\kappa }_{\mathrm{ARpLE},3}^s,{\kappa }_{\mathrm{ARpLE},3}^A \) , and \( {\kappa }_{\mathrm{ARpLE}}^C \) such that, for any \( \left( {{\epsilon }_0,{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right)  \in  (0,1{\rbrack }^4 \) , the \( \mathrm{AR}p\mathrm{LE} \) algorithm (p. 123) requires at most

\[
{\# }_{\mathsf{{ARPLE},3}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathsf{{ARPLE},3}}^{C}\frac{\max \left\lbrack  {{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{4}}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\ell  - 1}{p}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - 2\frac{\ell  - 1}{p - 1}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - 3\frac{\ell  - 1}{p - 2}}}\right\rbrack  }{\min \left\lbrack  {{\epsilon }_{0}^{\frac{1}{{2}^{4}}},{\epsilon }_{1}^{\frac{p + 1}{p}},{\epsilon }_{2}^{\frac{p + 1}{p - 1}},{\epsilon }_{3}^{\frac{p + 1}{p - 2}}}\right\rbrack  } + {\kappa }_{\mathsf{{ARPLE}}}^{C}
\]

\[
= \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_0^{-\frac{1}{{2}^{ * }}},{\epsilon }_1^{-\frac{p + 1}{p}},{\epsilon }_2^{-\frac{p + 1}{p - 1}},{\epsilon }_3^{-\frac{p + 1}{p - 2}}}\right\rbrack  }\right)
\]

(5.1.44)evaluations of \( r \) and at most

\[
{\# }_{\mathtt{{ARplE}},3}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathtt{{ARplE}},3}^{S}\frac{\max \left\lbrack  {{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{s}}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\varepsilon  - 1}{p}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - 2\frac{\varepsilon  - 1}{p - 1}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - 3\frac{\varepsilon  - 1}{p - 2}}}\right\rbrack  }{\min \left\lbrack  {{\epsilon }_{0}^{\frac{1}{{2}^{s}}},{\epsilon }_{1}^{\frac{p + 1}{p}},{\epsilon }_{2}^{\frac{p + 1}{p - 1}},{\epsilon }_{3}^{\frac{p + 1}{p - 2}}}\right\rbrack  } + 2
\]

\[
= \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_0^{-\frac{1}{{2}^{ * }}},{\epsilon }_1^{-\frac{p + 1}{p}},{\epsilon }_2^{-\frac{p + 1}{p - 1}},{\epsilon }_3^{-\frac{p + 1}{p - 2}}}\right\rbrack  }\right)
\]

(5.1.45)

evaluations of derivatives of order one to \( p \) of \( r \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{r\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_0 \) or (together) \( {\psi }_{\ell ,1}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_1,{\psi }_{\ell ,2}\left( {x}_{\epsilon }\right)  \geq   - {\epsilon }_2 \) , and \( {\psi }_{\ell ,3}\left( {{x}_{\epsilon }, d}\right)  \leq  {\epsilon }_3 \) for all \( d \in  {\mathcal{M}}_{\epsilon } \) , where \( {\mathcal{M}}_{\epsilon } \subseteq  {\mathcal{Z}}_{\epsilon } = \left\{  {d : \parallel d\parallel  = 1}\right. \) and \( \left. {{\psi }_{\ell ,2}\left( {{x}_{\epsilon }, d}\right)  \leq  {\epsilon }_2}\right\} \) .

Referenced equation payloads:

Equation (5.1.42):
\[
\ell  = \frac{1}{3}p\text{ and }i > {\log }_{2}\left( {p - 2}\right) ,\tag{5.1.42}
\]

Equation (5.1.43):
\[
\ell  = 1 + {o}_{3} \cdot  \mathop{\sum }\limits_{{k = 0}}^{{j - 1}}{2}^{2k},\text{ where }p - 2 = {o}_{3} \cdot  {2}^{i}\text{ and }j = \lfloor i/2\rfloor ,\tag{5.1.43}
\]
'''
deps = ["lemma_4_1_4", "lemma_5_1_3", "lemma_2_4_1", "theorem_4_1_5", "residualPowerObjective", "arpLeastEuclideanRun", "objectiveRegularity", "taylorModel"]
