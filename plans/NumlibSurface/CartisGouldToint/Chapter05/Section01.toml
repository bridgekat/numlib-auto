[[node]]
id = "arpLeastEuclideanRun"
kind = "definition"
desc = '''
Define the set of finite traces satisfying Algorithm 5.1.1, including initialization, derivative compatibility, enabled termination tests, allowed steps, trial evaluations, acceptance and parameter updates. Derive positivity, existence and iteration bounds in theorems, never in this predicate. Exact source program and its immediate mathematical specifications:

Algorithm 5.1.1: Adaptive-regularization algorithm with \( p \) th-order
                models for least Euclidean norm problems (ARpLE)
Apply Algorithm 4.1.1 (ARp,on p. 100) to \( f\left( x\right)  = {\Phi }_{\ell }\left( x\right) \) for a given \( \ell  \geq  2 \) using
the model
                 \[{m}_k\left( s\right)  = {T}_{{\Phi }_{\ell },p}\left( {{x}_k,s}\right)  + \frac{{\sigma }_k}{\left( {p + 1}\right) !}\parallel s{\parallel }^{p + 1},\] (5.1.8)

but replace the termination tests (Step 1) with the following:
Step 1: Test for termination. If
                              \[\begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \leq  {\epsilon }_0,\] (5.1.9)

     terminate with the \( {\epsilon }_0 \) -approximate global minimizer \( {x}_{\epsilon } = {x}_k \) .
     If \( {\epsilon }_2 = {\epsilon }_3 = \infty \) and
                              \[{\psi }_{\ell ,1}\left( {x}_k\right)  \leq  {\epsilon }_1\] (5.1.10)
     terminate with the \( {\epsilon }_1 \) -approximate first-order minimizer \( {x}_{\epsilon } = {x}_k \) .
     If \( {\epsilon }_2 < \infty ,\left( {5.1.10}\right) \) holds,and
                              \[{\psi }_{\ell ,2}\left( {x}_k\right)  > {\epsilon }_2\] (5.1.11)

     terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate strict local minimizer \( {x}_{\epsilon } = {x}_k \) .
     If \( {\epsilon }_2 < \infty \) and \( {\epsilon }_3 = \infty ,\left( {5.1.10}\right) \) holds,and (5.1.11) fails but
                             \[{\psi }_{\ell ,2}\left( {x}_k\right)  \geq   - {\epsilon }_2\] (5.1.12)

     terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer \( {x}_{\epsilon } = {x}_k \) .
     If \( {\epsilon }_3 < \infty ,\left( {5.1.10}\right) ,\left( {5.1.12}\right) \) ,and \( {\mathcal{M}}_k \neq  \varnothing \) hold,where \( {\mathcal{M}}_k \) is defined as in
     (4.1.14), and
                             \[{\psi }_{\ell ,3}\left( {{x}_k,d}\right)  \leq  {\epsilon }_3\] (5.1.13)
     and
                             \[{\psi }_{\ell ,2}\left( {{x}_k,d}\right)  \leq  {\epsilon }_2\] (5.1.14)
     for all \( d \in  {\mathcal{M}}_k \) ,terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right) \) -approximate third-order min-
     imizer \( {x}_{\epsilon } = {x}_k \) .
```

Just as when we applied ARp to general objectives, the third-order conditions (5.1.13) and (5.1.14) differ from the requirement (5.1.6) in that the latter can only be guaranteed along directions of small curvature for the model, namely, those in \( {\mathcal{M}}_k \) . Again, we will be able to show that at termination, \( {\mathcal{M}}_k \subseteq  {\mathcal{Z}}_{\epsilon } \) , where \( {\mathcal{Z}}_{\epsilon } \) is defined as in (5.1.7), and so model directions of small curvature also lead to small curvature for the true objective.

Given \( p \) , we will consider the choice of \( \ell \) in some detail in Section 5.1.3. For the time being, it suffices to say that if one wishes to obtain a first-, second-, or third-order approximate minimizer, it is clear that \( p \) should be at least 1,2, or 3 (respectively). If \( p \) is a multiple of 1,2, or 6, then \( \ell  = p,\frac{1}{2}p \) , and \( \frac{1}{3}p \) (respectively) is reasonable. The larger the \( p \) , the better the (order of) worst-case evaluation complexity, but at the cost of more expensive subproblem solves.
'''
deps = []
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 5.1"

