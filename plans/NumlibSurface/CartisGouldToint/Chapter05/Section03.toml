namespace = "CartisGouldToint.Chapter05"
desc = '''
§5.3 Measure-dominated problems. Surface forms of the backbone `Optimization.MeasureDominated`
(domination (5.3.1), classes `ARψ,ν`, `TRψ,ν`) and the gap/measure complexity results, all reduced
to the scalar recurrences of `Optimization.GapRecurrence` with `c = κν/κψ^{ν/μ}`, `τ = ν/μ`,
`α = τ - 1 = (ν-μ)/μ`, `Γ_k = f(x_k) - f_*`.

Standing hypotheses of every result ("`f` is `ψ`-dominated of level `μ` and an `ARψ,ν`
(resp. `TRψ,ν`) algorithm is applied"): `f ψ : EuclideanSpace ℝ (Fin n) → ℝ`, `ψ ≥ 0`, `μ ≥ 1`,
`κψ > 0`, `Optimization.IsMeasureDominated f ψ fstar μ κψ (range x)` (domination is only needed at
the iterates, as the book remarks), `IsARpsiNuRun f ψ κν ν κR κA x S` (resp. `IsTRpsiNuRun`) with
`κν > 0`, `ν ≥ 1`, `κR ≥ 1`, `κA ≥ 0`.

Formalization choices: rates are *upper* bounds along successful iterations (the inequalities do
not exclude faster or finite convergence); "the algorithm needs at most `N` successful iterations
(resp. iterations) to compute `x_ε` with `Γ_ε ≤ ε`" is "`Γ_k ≤ ε` for every `k` with
`N ≤ |𝒮 ∩ [0, k)|` (resp. `N ≤ k`)" — gaps are nonincreasing, so this is the first-hit bound —
and for `ψ(x_ε) ≤ ε`: "some `k ≤ N` has `ψ(x_k) ≤ ε`". Bounds of the form `log |log ε|` are stated
with `log (max 1 |log ε|)` (the book's footnote to Theorem 5.3.10 assumes `|log ε| ≥ 1`), for all
`ε ∈ (0, 1)`. The leading constants (`κ^E`, `κ^B`) are the book's; the additive ones (`κ^F`, `κ^C`)
are the corrected values of the backbone counts (the book's Appendix B constants contain the slips
listed in `Optimization.GapRecurrence`). The unnumbered examples of §5.3.1 other than full-rank
least squares (convex functions on a ball, strongly convex functions, `‖x‖^{2i}` with the measure
`φ^1_{f,2}`) are not formalized.
'''

[[node]]
id = "IsDominated"
kind = "def"
desc = '''
`IsDominated f ψ fstar μ κψ : Prop := Optimization.IsMeasureDominated f ψ fstar μ κψ univ` with
`fstar = ⨅ x, f x` the global minimum value: `f` is `ψ`-dominated of level `μ` (5.3.1).
'''
deps = ["Optimization.IsMeasureDominated"]
source = "Cartis–Gould–Toint, (5.3.1)"

