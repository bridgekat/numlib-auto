source = "Cartis–Gould–Toint, Theorem 5.3.9 and its proof (Appendix B)"

[[node]]
id = "Phi_isMeasureDominated"
kind = "theorem"
desc = '''
§5.3.1 / §5.3.4, (5.3.2)–(5.3.3): if `ℓ > 1`, `ψmin > 0` and `psiOne r ℓ x ≥ ψmin` (5.1.62) at
every point of `A`, then `Optimization.IsMeasureDominated (Phi r ℓ) (fun x => ‖gradient (Phi r ℓ) x‖)
0 (ℓ/(ℓ-1)) (ψmin^(-(ℓ/(ℓ-1)))/ℓ) A` (level `μ = ℓ/(ℓ-1) ∈ (1, 2]` for `ℓ ≥ 2`, reference value
`0 ≤ Φ_ℓ`; the book's "`min Φ_ℓ = 0`" is not needed — and does not follow from (5.1.62) at the
iterates only).
'''
