Theorem 5.3.8: Complexity for measure-dominated problems (trust region-like methods, \( \nu  = \mu \) )

[Appendix to Chapter 5, p. 471]: Suppose that the objective function \( f \) is \( \psi \) - dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that a TR \( \psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( \nu  = \mu \) . Then either the gap is zero after the first successful iteration or the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge linearly to zero with factor \( 1 - {\kappa }_{\nu }/{\kappa }_{\psi } \) , and there exist positive constants \( {\kappa }_{\mathrm{TR},\mathrm{gap},2}^B,{\kappa }_{\mathrm{TR},\mathrm{gap},2}^C \) , \( {\kappa }_{\mathrm{TR},\mathrm{gap},2}^{\mathrm{E}} \) , and \( {\kappa }_{\mathrm{TR},\mathrm{gap},2}^{\mathrm{F}} \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{gap}},2}^{B}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{TR}},\mathrm{{gap}},2}^{C} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.39}
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{gap}},2}^{E}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{TR}},\mathrm{{gap}},2}^{F} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.40}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( {\Gamma }_{\epsilon } = f\left( {x}_{\epsilon }\right)  - {f}_{ * } \leq  \epsilon \) . Moreover, there exist positive constants \( {\kappa }_{\mathrm{{TR}},\text{ dom, }2}^{B},{\kappa }_{\mathrm{{TR}},\text{ dom, }2}^{C} \) , \( {\kappa }_{\mathrm{{TR}},\text{ dom, }2}^{E} \) , and \( {\kappa }_{\mathrm{{TR}},\text{ dom, }2}^{F} \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{dom}},2}^{B}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{TR}},\mathrm{{dom}},2}^{C} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.41}
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{dom}},2}^{E}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{TR}},\mathrm{{dom}},2}^{F} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.42}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( \psi \left( {x}_{\epsilon }\right)  \leq  \epsilon \) .
'''
