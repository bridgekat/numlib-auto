namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 5, Section 3.

For domination require a specified attained global minimum value f_* and nonnegative ψ, with f(x)−f_*≤κψ ψ(x)^μ, μ≥1, κψ>0. The ARψ,ν and TRψ,ν classes have different decrease tests (new-point versus historical minimum measure). In rates, handle finite attainment of zero separately; do not divide by zero gaps. The Υ subscript in OCR (5.3.14) is corrupt: use Υ_{κν/κψ^(ν/μ),ν/μ}(Γ₀,ε), the hitting time of κ t_(n+1)^τ+t_(n+1)=t_n. Equation (5.3.94) in its proof means (5.3.9). Logarithmic complexity claims are for sufficiently small ε, with explicit positive domain thresholds or truncated logs. Keep linear-rate upper bounds as upper rates; do not assert equality of asymptotic orders for every algorithm.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

There is another class of structured problems where complexity results can be improved substantially: the class of "measure-dominated" problems. While, as we will see, this class is somewhat restrictive, its associated complexity analysis provides significantly better bounds than what we have seen so far. Moreover, by introducing an additional assumption on the global behaviour of the objective function, it also provides a stepping stone to the well-mannered world of convex problems. This, we feel, is enough to justify our interest.

Consider an unconstrained optimization problem with global minimum value \( {f}_{ * } \) and some nonnegative optimality measure \( \psi \left( x\right) \) ; typical examples of the latter when searching for first- or second-order minimizers are \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( x\right) }\end{Vmatrix} \) and \( \min \left\lbrack  {0, - {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( x\right) }\right\rbrack  }\right\rbrack \) . We say that \( f \) is measure dominated of level \( {}^{39}\mu \) for a real \( \mu  \geq  1 \) if there is a constant \( {\kappa }_{\psi } > 0 \) for which

\[
f\left( x\right)  - {f}_{ * } \leq  {\kappa }_{\psi }{\left\lbrack  \psi \left( x\right) \right\rbrack  }^{\mu }\tag{5.3.1}
\]

for all \( x \in  {\mathbb{R}}^n \) . When \( \psi \left( x\right)  = \parallel g\left( x\right) \parallel \) and \( \mu  \in  \left\lbrack  {1,2}\right\rbrack \) , the requirement (5.3.1) is sometimes known as the Polyak-Lojasiewicz property \( \left\lbrack  {{275},{317}}\right\rbrack \) or gradient domination [305]. The restriction \( \mu  \in  \left\lbrack  {1,2}\right\rbrack \) in this case is motivated by considering the univariate situation (see [160] for details).

Because it is simple to do so, we discuss domination for more general optimality measures \( \psi \left( x\right) \) . A related but different approach is taken in [135], which we briefly discuss in the notes of this section.

#### 5.3.1 Some examples

As we intimated above, many problems are not measure dominated. For instance, functions having saddle points or local but nonglobal minimizers are not measure dominated of level \( \mu \) for any \( \mu \) when \( \psi \left( x\right)  = \begin{Vmatrix}{{\nabla }_x^{1}f\left( x\right) }\end{Vmatrix} \) . However, there exist interesting classes of functions which are measure dominated. Perhaps the most frequently occurring are nonlinear least-squares problems with uniform full rank. Indeed, more generally, if, as in Section 5.1, we consider minimizing

\[
{\Phi }_{\ell }\left( x\right)  = \frac{1}{\ell }\parallel r\left( x\right) {\parallel }^{\ell },\text{ where }r : {\mathbb{R}}^{n} \rightarrow  {\mathbb{R}}^{m}\text{ is continuously differentiable, }
\]

and assume, as in Section 5.1.5, that condition (5.1.62) holds, \( {}^{40} \) then it follows from (5.1.63) and (5.1.64) that \( \min {\Phi }_{\ell }\left( x\right)  = 0 \) and

\[
\begin{Vmatrix}{{\nabla }_x^1{\Phi }_{\ell }\left( x\right) }\end{Vmatrix} \geq  {\psi }_{\min }\parallel r\left( x\right) {\parallel }^{\ell  - 1}.\tag{5.3.2}
\]

Hence \( {\Phi }_{\ell }\left( x\right) \) is measure dominated of level \( \mu  = \ell /\left( {\ell  - 1}\right) \) for \( \psi \left( x\right)  = \begin{Vmatrix}{{\nabla }_x^1{\Phi }_{\ell }\left( x\right) }\end{Vmatrix} \) , since

\[
{\Phi }_{\ell }\left( x\right)  - \min {\Phi }_{\ell }\left( x\right)  = {\Phi }_{\ell }\left( x\right)  = \frac{1}{\ell }\parallel r\left( x\right) {\parallel }^{\ell } \leq  \frac{1}{\ell }{\left( \frac{1}{{\psi }_{\min }}\right) }^{\ell /\left( {\ell  - 1}\right) }{\begin{Vmatrix}{\nabla }_x^1{\Phi }_{\ell }\left( x\right) \end{Vmatrix}}^{\ell /\left( {\ell  - 1}\right) }.\tag{5.3.3}
\]

---

\( {}^{39} \) Other authors use the term "degree" instead of "level," but we prefer the latter here in order to avoid confusion with the notion of a model's degree.

\( {}^{40} \) That is, the smallest singular value of the Jacobian of \( r\left( x\right) \) is bounded away from zero at all points \( x \) encountered by the algorithm; see the discussion on p. 136.

---

Another class of measure-dominated problems includes those involving convex continuously differentiable functions on the bounded domain \( \left\{  {x \in  {\mathbb{R}}^n \mid  \parallel x\parallel  \leq  {\kappa }_u}\right\} \) for some \( {\kappa }_u > 0 \) . For then

\[
f\left( x\right)  - {f}_{ * } \leq  \left\langle  {{\nabla }_x^{1}f\left( x\right) , x - {x}_{ * }}\right\rangle   \leq  2{\kappa }_u\begin{Vmatrix}{{\nabla }_x^{1}f\left( x\right) }\end{Vmatrix}
\]

from (1.2.1) (p. 11), and \( f \) is measure dominated of level one with \( \psi \left( x\right)  = \begin{Vmatrix}{{\nabla }_x^{1}f\left( x\right) }\end{Vmatrix} \) . In the same vein, if \( f \) is strongly convex, then one can verify from the definition (1.2.2) (p. 11) that

\[
f\left( z\right)  - f\left( x\right)  \geq  \left\langle  {z - x,{\nabla }_x^{1}f\left( x\right) }\right\rangle   + \frac{1}{2}{\lambda }_{\mathrm{L}}\parallel z - x{\parallel }^2
\]

\[
\geq  \min \left\langle  {z - x,{\nabla }_x^{1}f\left( x\right) }\right\rangle   + \frac{1}{2}{\lambda }_{\mathrm{L}}\parallel z - x{\parallel }^2
\]

\[
=  - \frac{1}{2{\lambda }_{\mathrm{L}}}{\begin{Vmatrix}{\nabla }_x^{1}f\left( x\right) \end{Vmatrix}}^2
\]

and thus, if \( z \) is a global minimizer of \( f \) , that

\[
f\left( x\right)  - {f}_{ * } \leq  \frac{1}{2{\lambda }_{\mathrm{L}}}{\begin{Vmatrix}{\nabla }_x^{1}f\left( x\right) \end{Vmatrix}}^2,
\]

where \( {\lambda }_{\mathrm{L}} > 0 \) is the constant defining the strong convexity of \( f \) . The function \( f \) is now measure dominated of level two with \( \psi \left( x\right)  = \begin{Vmatrix}{{\nabla }_x^{1}f\left( x\right) }\end{Vmatrix} \) .

Finally, we note that measure-dominated functions for measures differing from the gradient also exist. For instance, the function \( f\left( x\right)  = \parallel x{\parallel }^{2i}\left( {i \geq  2}\right) \) is measure dominated of level one for the optimality measure \( \psi \left( x\right)  = {\phi }_{f,2}^1\left( x\right) \) , where, as we shall see in Section 12.1.3 (p. 278) of Chapter 12,

\[
{\phi }_{f,2}^{1}\left( x\right) \overset{\text{ def }}{ = }f\left( x\right)  - \mathop{\min }\limits_{{\parallel d\parallel  \leq  1}}{T}_{f,2}\left( {x, d}\right)
\]

and \( {T}_{f,2}\left( {x, d}\right)  = f\left( x\right)  + \left\langle  {{\nabla }_x^{1}f\left( x\right) , d}\right\rangle   + \frac{1}{2}\left\langle  {d,{\nabla }_x^{2}f\left( x\right) d}\right\rangle \) is the second-degree Taylor expansion (4.1.1) of \( f \) around \( x \) within the domain \( \mathcal{D} = \{ x \mid  \parallel x\parallel  \leq  1 + 2\left( {i - 1}\right) \} \) . Indeed,

\[
{\nabla }_{x}^{1}f\left( x\right)  = {2i}\parallel x{\parallel }^{{2i} - 2}x\text{ and }{\nabla }_{x}^{2}f\left( x\right)  = {2i}\parallel x{\parallel }^{{2i} - 2}I + {4i}\left( {i - 1}\right) \parallel x{\parallel }^{{2i} - 4}x{x}^{T}
\]

so that

\[
{T}_{f,2}\left( {x, d}\right)  = \parallel x{\parallel }^{2i} + {2i}\parallel x{\parallel }^{{2i} - 2}{x}^{T}d + i\parallel x{\parallel }^{{2i} - 2}\parallel d{\parallel }^2 + {2i}\left( {i - 1}\right) \parallel x{\parallel }^{{2i} - 4}{\left( {x}^{T}d\right) }^2,
\]

and it is easy to verify that \( {T}_{f,2}\left( {x, d}\right) \) is convex and attains its minimum value

\[
{T}_{f,2}\left( {x,{d}_{ * }}\right)  = \left( {1 - \frac{i}{1 + 2\left( {i - 1}\right) }}\right) \parallel x{\parallel }^{2i}\;\text{ for }\;{d}_{ * } =  - \frac{x}{1 + 2\left( {i - 1}\right) }.
\]

We therefore obtain that

\[
{\phi }_{f,2}^1\left( x\right)  = {T}_{f,2}\left( {x,0}\right)  - {T}_{f,2}\left( {x,{d}_{ * }}\right)  = \frac{i}{1 + 2\left( {i - 1}\right) }f\left( x\right)  = \frac{i}{1 + 2\left( {i - 1}\right) }\left( {f\left( x\right)  - {f}_{ * }}\right)
\]

if \( x \in  \mathcal{D} \) , and (5.3.1) holds for \( \psi \left( x\right)  = {\phi }_{f,2}^1\left( x\right) ,\mu  = 1 \) , and \( {\kappa }_{\psi } = \frac{1 + 2\left( {i - 1}\right) }{i} \) within \( \mathcal{D} \) .

#### 5.3.2 Applying adaptive regularization-like methods

We now examine what can be said of the rate at which the objective-function gap

\[
{\Gamma }_k = f\left( {x}_k\right)  - {f}_{ * }\tag{5.3.4}
\]

converges to zero for iterates \( \left\{  {x}_k\right\} \) generated by our two favourite classes of optimization methods, those broadly based on adaptive regularization and those on trust-region globalization.

Consider first the case of our archetypal adaptive-regularization methods. These derive a bound on the minimal decrease at successful iterations from the inequalities

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\eta }_1\left\lbrack  {{T}_{f, p}\left( {{x}_k,0}\right)  - {T}_{f, p}\left( {{x}_k,{s}_k}\right) }\right\rbrack   \geq  {\eta }_1{\sigma }_{\min }{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1}
\]

and then compute a lower bound on \( \begin{Vmatrix}{s}_k\end{Vmatrix} \) that depends on the value of the chosen optimality measure at \( {x}_{k + 1} \) . The proofs of Lemmas 2.4.3 (p. 45) and 3.3.8 (p. 73) illustrate this fact for AR1 and AR2. It is even more obvious for the ARp algorithm (p. 100), for which a minimal decrease per successful iteration of the form

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_{\nu }{\left\lbrack  \psi \left( {x}_{k + 1}\right) \right\rbrack  }^{\nu }\tag{5.3.5}
\]

is guaranteed by Lemma 4.1.4 (p. 106). In particular, we have the following three cases:

1. Condition (4.1.31) ensures that (5.3.5) holds for

\[
{\psi }_{1}\left( x\right)  = \begin{Vmatrix}{{\nabla }_{x}^{1}f\left( x\right) }\end{Vmatrix}\;\text{ with }\;\nu  = \frac{p + 1}{p}\text{ and }{\kappa }_{\nu } = {\kappa }_{1}.\tag{5.3.6}
\]

2. Condition (4.1.33) ensures that (5.3.5) holds for

\[
{\psi }_{2}\left( x\right)  = \max \left( {0, - {\lambda }_{\min }\left\lbrack  {{\nabla }_{x}^{2}f\left( {x}_{k + 1}\right) }\right\rbrack  }\right) \;\text{ with }\;\nu  = \frac{p + 1}{p - 1}\text{ and }{\kappa }_{\nu } = {\kappa }_{2}\tag{5.3.7}
\]

3. Condition (4.1.35) ensures that (5.3.5) holds for

\[
{\psi }_{3}\left( x\right)  = \mathop{\max }\limits_{{d \in  {\mathcal{M}}_{k + 1}}}\left| {{\nabla }_{x}^{3}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^{3}}\right| \text{ with }\nu  = \frac{p + 1}{p - 2}\text{ and }{\kappa }_{\nu } = {\kappa }_{3}.\tag{5.3.8}
\]

For full generality, we let \( \mathrm{AR}\psi ,\nu \) be the class of monotonic minimization algorithms for which (a) the decrease (5.3.5) is guaranteed for each \( k \) in an infinite subset \( \mathcal{S} \) of the iterations,(b) \( {x}_{k + 1} = {x}_k \) for all \( k \notin  \mathcal{S} \) , and (c) \( {\mathcal{S}}_k = \mathcal{S} \cap  \left\lbrack  {0 : k}\right\rbrack \) is dense enough in \( \left\lbrack  {0 : k}\right\rbrack \) in the sense that

\[
k \leq  {\kappa }_{\mathrm{R}}^{\mathcal{S}}\left| {\mathcal{S}}_k\right|  + {\kappa }_{\mathrm{A}}^{\mathcal{S}}\tag{5.3.9}
\]

for some \( {\kappa }_{\mathrm{R}}^{\mathcal{S}} \geq  1 \) and \( {\kappa }_{\mathrm{A}}^{\mathcal{S}} \geq  0 \) . These properties are obviously satisfied by the \( \mathrm{AR}p \) algorithm, but also by other variants discussed in Section 3.4. In particular, (5.3.9) is a generic version of the crucial bound (2.4.8) from Lemma 2.4.1 (p. 44).

As the next lemma shows, the combination of these decrease properties and corresponding \( \psi \) -domination for \( \mathrm{AR}\psi ,\nu \) algorithms has profound consequences for the rate of decrease of the objective-function gap.
'''

