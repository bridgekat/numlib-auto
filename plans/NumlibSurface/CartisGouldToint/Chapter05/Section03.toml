[[node]]
id = "lemma_5_3_6"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.3.6: Gap-decrease rates for measure-dominated problems (trust region-like methods)

Suppose that the objective function \( f \) is \( \psi \) -dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that a \( \operatorname{TR}\psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( {\Gamma }_0 > 0 \) , and let

\[
{\Gamma }_{\square }\overset{\text{ def }}{ = }{\left( \frac{{\kappa }_{\psi }^{\nu /\mu }}{{\kappa }_{\nu }}\right) }^{\frac{\mu }{\nu  - \mu }}.
\]

Then the following conclusions hold.

(i) If \( \nu  = \mu \) , then \( {\kappa }_{\nu } \leq  {\kappa }_{\psi } \) and the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge linearly to zero with factor \( 1 - {\kappa }_{\nu }/{\kappa }_{\psi } \) when \( {\kappa }_{\nu } < {\kappa }_{\psi } \) . If \( {\kappa }_{\nu } = {\kappa }_{\psi } \) , then \( f\left( {x}_{{k}_{S,1} + 1}\right)  = {f}_{ * } \) , where \( {k}_{\mathcal{S},1} \) is the index of the first successful iteration.

---

\( {}^{41} \) Similarly, as we shall see,(12.2.20) in the proof of Lemma 12.2.4 (p. 297) for the TRq algorithm described in Chapter 12 does the same. In particular, (12.2.20) implies that, at successful iterations of the \( \mathrm{TR}q \) algorithm,

\[
f\left( {x}_{k}\right)  - f\left( {x}_{k + 1}\right)  \geq  \frac{{\eta }_{1}}{q!}\min {\left\lbrack  1,{\kappa }_{\delta }\mathop{\min }\limits_{{i \in  \left\lbrack  {0 : k}\right\rbrack  }}{\widehat{\phi }}_{f, i}\right\rbrack  }^{q + 1} \geq  \frac{{\eta }_{1}{\kappa }_{\delta }^{q}}{q!}\mathop{\min }\limits_{{i \in  \left\lbrack  {0 : k}\right\rbrack  }}\min {\left\lbrack  1,{\widehat{\phi }}_{f, i}\right\rbrack  }^{q + 1}
\]

for some constants \( {\eta }_1 \) and \( {\kappa }_{\Delta } \) in \( \left( {0,1}\right) \) , where \( {\widehat{\phi }}_{f, k} \) is an optimality measure defined in (12.2.8) (p. 294) (note that, for \( q = 1,{\widehat{\phi }}_{f, k} = \begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix} \) ), and we may define

\[
\psi \left( {x}_{k}\right)  = \min \left\lbrack  {1,{\widehat{\phi }}_{f, k}}\right\rbrack
\]

and obtain that successful iterations of the \( \mathrm{TR}q \) algorithm guarantee an objective function decrease of the form (5.3.28), where \( {\kappa }_{\nu } = {\eta }_1{\kappa }_{\delta }^q/q! \in  \left( {0,1}\right) \) and \( \nu  = q + 1 \) .

---

(ii) If \( \nu  < \mu \) , then

\[
{\Gamma }_0 \geq  {\Gamma }_{\square }.\tag{5.3.29}
\]

If, in addition, inequality (5.3.29) holds as an equality, then \( f\left( {x}_{{k}_{S,1} + 1}\right)  = {f}_{ * } \) . If the inequality is strict, then

\[
{\Gamma }_{k + 1} \leq  {\Gamma }_k\left\lbrack  {1 - \frac{{\kappa }_{\nu }}{{\kappa }_{\psi }^{\nu /\mu }}{\Gamma }_k^{\frac{\nu  - \mu }{\mu }}}\right\rbrack\tag{5.3.30}
\]

for all \( k \in  \mathcal{S} \) such that

\[
{\Gamma }_k \geq  {\Gamma }_{\square }\tag{5.3.31}
\]

and the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) start converging superlinearly to zero until a final value \( {\Gamma }_{{k}_{\square }} \geq  1 \) is reached, after which \( f\left( {x}_{{k}_{\square } + 1}\right)  = {f}_{ * } \) .

(iii) If \( \nu  > \mu \) , then

\[
{\Gamma }_0 \leq  {\Gamma }_{\square }.\tag{5.3.32}
\]

If, in addition, inequality (5.3.32) holds as an equality, then \( f\left( {x}_{{k}_{S,1} + 1}\right)  = {f}_{ * } \) . If the inequality is strict, then (5.3.30) holds for all \( k \in  \mathcal{S} \) and the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge sublinearly to zero.

Referenced equation payloads:

Equation (5.3.28):
\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_{\nu }{\left\lbrack  \mathop{\min }\limits_{i \in  \left\lbrack  {0 : k}\right\rbrack  }\psi \left( {x}_i\right) \right\rbrack  }^{\nu }\tag{5.3.28}
\]
'''
deps = ["lemma_5_3_1", "theorem_3_2_1", "measureDominated", "arMeasureRun", "trMeasureRun", "implicitGapHittingTime", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 5.3.6 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 6476)"

[[node]]
id = "theorem_5_3_7"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 5.3.7: Complexity for measure-dominated problems (trust region-like methods, \( \nu  < \mu \) )

[Appendix to Chapter 5, p. 470]: Suppose that the objective function \( f \) is \( \psi \) - dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that a \( \operatorname{TR}\psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( \nu  < \mu \) . Then either the gap is zero after the first successful iteration or the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) start converging superlinearly to zero until a final iteration \( {k}_{\square } \) such that (5.3.29) holds, after which it is identically zero. Thus there exist positive constants \( {\kappa }_{\mathrm{TR},1}^C \) and \( {\kappa }_{\mathrm{TR},1}^F \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},1}^{C} = \mathcal{O}\left( 1\right)\tag{5.3.35}
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},1}^{F} = \mathcal{O}\left( 1\right)\tag{5.3.36}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( {\Gamma }_{\epsilon } = f\left( {x}_{\epsilon }\right)  - {f}_{ * } = 0 \) . Moreover, the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},1}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},1}^{C} = \mathcal{O}\left( 1\right)\tag{5.3.37}
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},1}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},1}^{F} = \mathcal{O}\left( 1\right)\tag{5.3.38}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( \psi \left( {x}_{\epsilon }\right)  = 0 \) .

Referenced equation payloads:

Equation (5.3.29):
\[
{\Gamma }_0 \geq  {\Gamma }_{\square }.\tag{5.3.29}
\]
'''
deps = ["measureDominated", "arMeasureRun", "trMeasureRun", "implicitGapHittingTime", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 5.3.7 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 6576)"

