[[node]]
id = "theorem_5_3_10"
kind = "theorem"
desc = '''
Theorem 5.3.10. Let `ℓ ≤ p` be an even positive integer, `ψmin > 0`, and `x, S` an `ARψ,ν` run for
`f = Phi r ℓ`, `ψ = ‖∇Φ_ℓ‖`, `ν = (p+1)/p` (constants `κν, κR, κA`), with `psiOne r ℓ (x k) ≥ ψmin`
for all `k` (5.1.62). Then (`ν < μ = ℓ/(ℓ-1)` since `ℓ < p + 1`) `‖r(x_k)‖` converges superlinearly
along `𝒮` (`∀ η > 0, ∃ K, ∀ k ≥ K, S k → ‖r(x_{k+1})‖ ≤ η ‖r(x_k)‖`), and for `ε₀ ∈ (0,1)`:
`‖r(x_k)‖ ≤ ε₀` whenever `κ^E log(max 1 (|log ε₀| + log ℓ/ℓ)) + κ^F + κ^E log ℓ ≤ |𝒮 ∩ [0,k)|`
(5.3.45) and whenever `κ^B log(max 1 (|log ε₀| + log ℓ/ℓ)) + κ^C + κ^B log ℓ ≤ k` (5.3.44), the
constants being those of Theorem 5.3.3 with `μ = ℓ/(ℓ-1)`, `κψ = ψmin^{-ℓ/(ℓ-1)}/ℓ`, `f_* = 0`
(apply it with `ε = ε₀^ℓ/ℓ` and `log(max 1 (ℓ y)) ≤ log ℓ + log(max 1 y)`).
'''
deps = ["theorem_5_3_3", "lemma_5_3_1", "Phi_isMeasureDominated"]
source = "Cartis–Gould–Toint, Theorem 5.3.10"

[[node]]
id = "theorem_5_3_11"
