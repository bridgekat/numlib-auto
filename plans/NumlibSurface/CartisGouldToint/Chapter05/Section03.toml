[[node]]
id = "theorem_5_3_9"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 5.3.9: Complexity for measure-dominated problems (trust region-like methods, \( \nu  > \mu \) )

[Appendix to Chapter 5, p. 472]: Suppose that the objective function \( f \) is \( \psi \) - dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that a \( \mathrm{TR}\psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( \nu  > \mu \) . Then the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge sublinearly to zero, and there exist positive constants \( {\kappa }_{\mathrm{TR},\mathrm{gap},3}^B \) , \( {\kappa }_{\mathrm{TR},\mathrm{gap},3}^C,{\kappa }_{\mathrm{TR},\mathrm{gap},3}^E \) , and \( {\kappa }_{\mathrm{TR},\mathrm{gap},3}^F \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},3}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{gap}},3}^{B}{\epsilon }^{-\frac{\nu  - \mu }{\mu }} + {\kappa }_{\mathrm{{TR}},\mathrm{{gap}},3}^{C} = \mathcal{O}\left( {\epsilon }^{-\frac{\nu  - \mu }{\mu }}\right)
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{gap}},3}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{gap}},3}^{E}{\epsilon }^{-\frac{\nu  - \mu }{\mu }} + {\kappa }_{\mathrm{{TR}},\mathrm{{gap}},3}^{F} = \mathcal{O}\left( {\epsilon }^{-\frac{\nu  - \mu }{\mu }}\right)\tag{5.3.43}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( {\Gamma }_{\epsilon } = f\left( {x}_{\epsilon }\right)  - {f}_{ * } \leq  \epsilon \) . Moreover, the optimality measures \( {\left\{  \psi \left( {x}_k\right) \right\}  }_{k \in  \mathcal{S}} \) also converge to zero sublinearly and there exist positive constants \( {\kappa }_{\mathrm{TR},\mathrm{dom},3}^B,{\kappa }_{\mathrm{TR},\mathrm{dom},3}^C \) , \( {\kappa }_{\mathrm{TR},\mathrm{dom},3}^E \) , and \( {\kappa }_{\mathrm{TR},\mathrm{dom},3}^F \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},3}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{dom}},3}^{B}{\epsilon }^{-\left( {\nu  - \mu }\right) } + {\kappa }_{\mathrm{{TR}},\mathrm{{dom}},3}^{C} = \mathcal{O}\left( {\epsilon }^{-\left( {\nu  - \mu }\right) }\right)
\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{TR}},\mathrm{{dom}},3}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR}},\mathrm{{dom}},3}^{E}{\epsilon }^{-\left( {\nu  - \mu }\right) } + {\kappa }_{\mathrm{{TR}},\mathrm{{dom}},3}^{F} = \mathcal{O}\left( {\epsilon }^{-\left( {\nu  - \mu }\right) }\right)
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( \psi \left( {x}_{\epsilon }\right)  \leq  \epsilon \) .

In the linear and sublinear cases, the complexities of adaptive regularization-like and trust region-like methods applied to measure-dominated functions are therefore identical in order, the main difference being that, barring convergence in a finite number of successful iterations, superlinear convergence (and thus much improved complexity) is only guaranteed to occur for the former.
'''
deps = ["theorem_5_1_7", "theorem_5_3_3", "measureDominated", "arMeasureRun", "trMeasureRun", "implicitGapHittingTime", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 5.3.9 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 6632)"
wrong = "The actual successful measures need not converge to zero under historical-minimum decrease. theorem_5_3_9_counterexample gives a globally smooth quadratic on the real plane and a continuous nonnegative measure vanishing exactly at global minimizers, with level2 domination and an all-success TR run of exponent4. The gaps and historical minimum converge to zero, but every even current measure is one. The gap and first-hitting complexity claims require a separate corrected companion; they are not refuted by this example."

