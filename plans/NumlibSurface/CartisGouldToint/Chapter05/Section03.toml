Theorem 5.3.4: Complexity for measure-dominated problems (adaptive regularization-like methods, \( \nu  = \mu \) )

[Appendix to Chapter 5, p. 467]: Suppose that the objective function \( f \) is \( \psi \) - dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that an \( \mathrm{AR}\psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( \nu  = \mu \) . Then the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge linearly to zero with factor \( {\left( 1 + \left( {\kappa }_{\nu }/{\kappa }_{\psi }\right) \right) }^{-1} \) , and there exist positive constants \( {\kappa }_{\mathrm{AR},\mathrm{gap},2}^{\mathrm{B}},{\kappa }_{\mathrm{AR},\mathrm{gap},2}^{\mathrm{C}},{\kappa }_{\mathrm{AR},\mathrm{gap},2}^{\mathrm{E}} \) , and \( {\kappa }_{\mathrm{AR},\mathrm{gap},2}^{\mathrm{F}} \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{AR}},\mathrm{{gap}},2}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR}},\mathrm{{gap}},2}^{B}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{AR}},\mathrm{{gap}},2}^{C} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.20}
\]

iterations and evaluations of \( f \) and at most

\[
