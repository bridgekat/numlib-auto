Theorem 5.3.11. Let `ℓ > 2` be an even integer, `ψmin > 0`, and `x, S` a `TRψ,ν` run for
`f = Phi r ℓ`, `ψ = ‖∇Φ_ℓ‖`, `ν = 2`, with (5.1.62) at all iterates. Then `‖r(x_k)‖ → 0` along `𝒮`
with the sublinear rate of Lemma 5.3.6 (iii), and for `ε₀ ∈ (0,1)`: `‖r(x_k)‖ ≤ ε₀` whenever
`ℓ^((ℓ-2)/ℓ) κ^E ε₀^(-(ℓ-2)) + κ^F ≤ |𝒮 ∩ [0,k)|` and whenever
`κR (ℓ^((ℓ-2)/ℓ) κ^E ε₀^(-(ℓ-2)) + κ^F) + κA + 1 ≤ k`, with `κ^E, κ^F` of Theorem 5.3.9 for
`μ = ℓ/(ℓ-1)`, `κψ = ψmin^{-ℓ/(ℓ-1)}/ℓ` (`(ν-μ)/μ = (ℓ-2)/ℓ`, `ε = ε₀^ℓ/ℓ`).
'''
deps = ["theorem_5_3_9", "lemma_5_3_6", "Phi_isMeasureDominated"]
source = "Cartis–Gould–Toint, Theorem 5.3.11"

