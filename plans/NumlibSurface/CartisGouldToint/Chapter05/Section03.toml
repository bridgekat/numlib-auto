termination (`Optimization.isARLikeRun_of_isARpRun`, cases (5.3.6)–(5.3.7)).
'''
deps = ["Optimization.IsARLikeRun", "Optimization.isARLikeRun_of_isARpRun"]
source = "Cartis–Gould–Toint, Section 5.3.2 (class ARψ,ν)"

