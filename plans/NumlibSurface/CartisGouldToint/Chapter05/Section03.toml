id = "trMeasureRun"
kind = "definition"
desc = '''
A monotonic TRψ,ν trace has ν≥1, κν>0, infinite successful set S before possible termination, x_(k+1)=x_k off S, the same density bound as ARψ,ν, and f(x_k)−f(x_(k+1))≥κν*min_{0≤i≤k}(ψ(x_i)^ν) for k∈S, exactly (5.3.28). The run terminates if ψ(x_k)=0. Use finite traces and continued traces consistently so termination does not conflict with an infinite S.
'''
