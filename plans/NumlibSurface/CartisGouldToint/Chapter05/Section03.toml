\]

iterations and evaluations of \( f \) and at most

\[
{\# }_{\mathrm{{AR}},\mathrm{{dom}},2}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR}},\mathrm{{dom}},2}^{E}\left| {\log \left( \epsilon \right) }\right|  + {\kappa }_{\mathrm{{AR}},\mathrm{{dom}},2}^{F} = \mathcal{O}\left( \left| {\log \left( \epsilon \right) }\right| \right)\tag{5.3.23}
\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( \psi \left( {x}_{\epsilon }\right)  \leq  \epsilon \) .
