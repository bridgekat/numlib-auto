Theorem 5.3.5: Complexity for measure-dominated problems (adaptive regularization-like methods, \( \nu  > \mu \) )

[Appendix to Chapter 5, p. 467]: Suppose that the objective function \( f \) is \( \psi \) - dominated of level \( \mu \) for some \( \mu  \geq  1 \) and that an \( \mathrm{AR}\psi ,\nu \) algorithm for which \( \nu  \geq  1 \) is applied to minimize \( f \) . In addition, suppose that \( \nu  > \mu \) . Then the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge sublinearly to zero, and there exist positive constants \( {\kappa }_{\mathrm{AR},\mathrm{gap},3}^B \) , \( {\kappa }_{\mathrm{AR},\mathrm{gap},3}^C,{\kappa }_{\mathrm{AR},\mathrm{gap},3}^E \) , and \( {\kappa }_{\mathrm{AR},\mathrm{gap},3}^F \) such that the algorithm needs at most

\[
{\# }_{\mathrm{{AR}},\mathrm{{gap}},3}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR}},\mathrm{{gap}},3}^{B}{\epsilon }^{-\frac{\nu  - \mu }{\mu }} + {\kappa }_{\mathrm{{AR}},\mathrm{{gap}},3}^{C} = \mathcal{O}\left( {\epsilon }^{-\frac{\nu  - \mu }{\mu }}\right)\tag{5.3.24}
\]

iterations and evaluations of \( f \) and at most

\[
