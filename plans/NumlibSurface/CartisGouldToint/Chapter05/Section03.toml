\]

successful iterations (and derivative evaluations) to compute an iterate \( {x}_{\epsilon } \) such that \( {\Gamma }_{\epsilon } = f\left( {x}_{\epsilon }\right)  - {f}_{ * } \leq  \epsilon \) . Moreover, there exist positive constants \( {\kappa }_{\mathrm{{AR}},\text{ dom, }2}^{B},{\kappa }_{\mathrm{{AR}},\text{ dom, }2}^{C} \) , \( {\kappa }_{\mathrm{{AR}},\text{ dom, }2}^{E} \) , and \( {\kappa }_{\mathrm{{AR}},\text{ dom, }2}^{F} \) such that the algorithm needs at most

