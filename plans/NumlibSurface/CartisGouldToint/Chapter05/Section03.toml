and the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) start converging superlinearly to zero until a final value \( {\Gamma }_{{k}_{\square }} \geq  1 \) is reached, after which \( f\left( {x}_{{k}_{\square } + 1}\right)  = {f}_{ * } \) .

(iii) If \( \nu  > \mu \) , then

\[
{\Gamma }_0 \leq  {\Gamma }_{\square }.\tag{5.3.32}
\]

If, in addition, inequality (5.3.32) holds as an equality, then \( f\left( {x}_{{k}_{S,1} + 1}\right)  = {f}_{ * } \) . If the inequality is strict, then (5.3.30) holds for all \( k \in  \mathcal{S} \) and the gaps \( {\left\{  {\Gamma }_k\right\}  }_{k \in  \mathcal{S}} \) converge sublinearly to zero.

