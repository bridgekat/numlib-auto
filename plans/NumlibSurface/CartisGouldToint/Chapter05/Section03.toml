[[node]]
id = "lemma_5_3_1"
kind = "theorem"
desc = '''
Lemma 5.3.1. Under the standing AR hypotheses, with `c = κν/κψ^(ν/μ)`:
(5.3.10) `Γ_{k+1} ≤ Γ_k (1 + c Γ_{k+1}^((ν-μ)/μ))⁻¹` for every successful `k`; `Γ_k → 0`; and
(i) `ν < μ`: `∀ η > 0, ∃ K, ∀ k ≥ K, S k → Γ_{k+1} ≤ η Γ_k` (superlinear);
(ii) `ν = μ`: `Γ_{k+1} ≤ (1 + κν/κψ)⁻¹ Γ_k` for successful `k` (linear);
(iii) `ν > μ`, `Γ₀ > 0`: `Γ_{k+1} ≤ (Γ₀^(-α) + c κdom |𝒮_k|)^(-1/α)` (sublinear rate
`O(|𝒮_k|^{-μ/(ν-μ)})`, `κdom` of `Optimization.IsImplicitGapDecrease.rates`).
'''
deps = ["IsARpsiNuRun", "Optimization.isImplicitGapDecrease_of_isARLikeRun", "Optimization.IsImplicitGapDecrease.le_div", "Optimization.IsImplicitGapDecrease.rates"]
source = "Cartis–Gould–Toint, Lemma 5.3.1"

[[node]]
id = "theorem_5_3_2"
kind = "theorem"
desc = '''
Theorem 5.3.2. Under the standing AR hypotheses, let `N = Optimization.implicitGapHitIndex c (ν/μ)
Γ₀ ε` (the book's `Υ_{κν/κψ^{ν/μ}, ν/μ}(Γ₀, ε)`, (5.3.12)–(5.3.13)), `ε > 0`. Then `Γ_k ≤ ε`
whenever `N ≤ |𝒮 ∩ [0,k)|` (5.3.14), and whenever `κR N + κA + 1 ≤ k` (5.3.15) (the book cites
"(5.3.94)" for (5.3.9) and omits the `+1`).
'''
deps = ["lemma_5_3_1", "Optimization.implicitGapSeq", "Optimization.IsImplicitGapDecrease.le_implicitGapSeq", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.2"

[[node]]
id = "theorem_5_3_3"
kind = "theorem"
desc = '''
Theorem 5.3.3 (`1 ≤ ν < μ`). Under the standing AR hypotheses with `Γ₀ > 0` (if `Γ₀ = 0` all gaps
vanish): the gaps converge superlinearly (Lemma 5.3.1 (i)) and, for every `ε ∈ (0,1)`,
`Γ_k ≤ ε` whenever `κ^E log(max 1 |log ε|) + κ^F ≤ |𝒮 ∩ [0,k)|` (5.3.17) and whenever
`κ^B log(max 1 |log ε|) + κ^C ≤ k` (5.3.16), with `κ^E = 1/(log μ - log ν)` (book's
`κ^E_{AR,gap,1}`), `κ^F` the constant `F` of `Optimization.IsImplicitGapDecrease.le_of_superlinear_count`
(`ω₀ = c^{μ/(ν-μ)} Γ₀`), `κ^B = κR κ^E`, `κ^C = κR κ^F + κA + 1`. Measure version ((5.3.18)–(5.3.19)):
for every `ε ∈ (0,1)` with `κν ε^ν < 1` there is `k ≥ 1` with `ψ(x_k) ≤ ε`,
`|𝒮 ∩ [0,k)| ≤ κ^E log(max 1 |log (κν ε^ν)|) + κ^F + 1` and
`k ≤ κ^B log(max 1 |log(κν) + ν log ε|) + κ^C + κR` (via (B.5.11): a successful `k` with
`Γ_k ≤ κν ε^ν` gives `ψ(x_{k+1}) ≤ ε`).
'''
deps = ["lemma_5_3_1", "Optimization.IsImplicitGapDecrease.le_of_superlinear_count", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.3 and its proof (Appendix B)"

[[node]]
id = "theorem_5_3_4"
kind = "theorem"
desc = '''
Theorem 5.3.4 (`ν = μ`). Under the standing AR hypotheses, `Γ₀ > 0`: linear convergence with factor
`(1 + κν/κψ)⁻¹` (Lemma 5.3.1 (ii)); for `ε ∈ (0,1)`, `Γ_k ≤ ε` whenever
`κ^E |log ε| + κ^F ≤ |𝒮 ∩ [0,k)|` (5.3.21), `κ^E = 1/log(1 + κν/κψ)`,
`κ^F = log Γ₀ / log(1 + κν/κψ) + 1`, and whenever `κR κ^E |log ε| + κR κ^F + κA + 1 ≤ k` (5.3.20);
measure version (5.3.22)–(5.3.23): some `k ≥ 1` with `ψ(x_k) ≤ ε`, `|𝒮 ∩ [0,k)| ≤ ν κ^E |log ε| +
κ^E |log κν| + κ^F + 1` and `k ≤ κR (that bound) + κA + 1`.
'''
deps = ["lemma_5_3_1", "Optimization.IsImplicitGapDecrease.le_of_linear_count", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.4 and its proof (Appendix B)"

[[node]]
id = "theorem_5_3_5"
kind = "theorem"
desc = '''
Theorem 5.3.5 (`ν > μ`). Under the standing AR hypotheses, `Γ₀ > 0`: sublinear convergence
(Lemma 5.3.1 (iii)); for `ε > 0`, `Γ_k ≤ ε` whenever `κ^E ε^(-(ν-μ)/μ) + κ^F ≤ |𝒮 ∩ [0,k)|`
(5.3.25) and whenever `κR κ^E ε^(-(ν-μ)/μ) + κR κ^F + κA + 1 ≤ k` (5.3.24), with
`κ^E = 1/min(Γ₀^(-α) (2^α - 1), min 1 α · c/2)` and `κ^F = -κ^E Γ₀^(-α)` (corrected: the book's
`κ^E_{AR,gap,3}` has `κψ^{ν/μ}/κν` for `Γ₀^{-α}` and `α` for `min 1 α`, see
`Optimization.GapRecurrence`). The measures `ψ(x_{k+1})`, `k ∈ 𝒮`, also go to zero, and there is a
successful `k` with `ψ(x_{k+1}) ≤ ε`, `|𝒮_k| ≤ 2 M + 2`, `M = (c κdom)^(-μ/ν) κν^(-(ν-μ)/ν)
ε^(-(ν-μ))` ((5.3.27), corrected factor 2), and `k ≤ κR (2M + 2) + κA` ((5.3.26)).
'''
deps = ["lemma_5_3_1", "Optimization.IsImplicitGapDecrease.le_of_sublinear_count", "Optimization.exists_le_of_halving", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.5 and its proof (Appendix B)"

[[node]]
id = "lemma_5_3_6"
kind = "theorem"
desc = '''
Lemma 5.3.6. Under the standing TR hypotheses with `Γ₀ > 0`, let `Γ□ = (κψ^(ν/μ)/κν)^(μ/(ν-μ))`
(for `ν ≠ μ`), `k₁` the first successful index (exists by density); (5.3.33):
`0 ≤ Γ_{k+1} ≤ Γ_k (1 - c Γ_k^((ν-μ)/μ))` for successful `k`.
(i) `ν = μ`: `κν ≤ κψ`; if `κν < κψ`, `Γ_{k+1} ≤ (1 - κν/κψ) Γ_k` for successful `k`; if `κν = κψ`,
`Γ_{k₁+1} = 0`.
(ii) `ν < μ`: `Γ₀ ≥ Γ□` (5.3.29); if equal, `Γ_{k₁+1} = 0`; every successful `k` has `Γ_k = 0` or
`Γ_k ≥ Γ□` (5.3.31) and (5.3.30) holds; and `Γ_k = 0` for all large `k` (finite termination; the
book's "final value `Γ_{k□} ≥ 1`" is `Γ_{k□} ≥ Γ□`, i.e. `ω ≥ 1` in the scaled gap).
(iii) `ν > μ`: `Γ₀ ≤ Γ□` (5.3.32); if equal, `Γ_{k₁+1} = 0`; (5.3.30) holds and `Γ_k → 0` with
`Γ_{k+1} ≤ (Γ₀^(-α) + α c |𝒮_k|)^(-1/α)` (sublinear).
'''
deps = ["IsTRpsiNuRun", "Optimization.isImplicitGapDecrease_of_isARLikeRun", "Optimization.IsImplicitGapDecrease.le_div", "Optimization.IsImplicitGapDecrease.le_of_linear_count", "Optimization.IsExplicitGapDecrease.eq_zero_of_lt_one", "Optimization.IsImplicitGapDecrease.le_of_sublinear_count"]
source = "Cartis–Gould–Toint, Lemma 5.3.6"

[[node]]
id = "theorem_5_3_7"
kind = "theorem"
desc = '''
Theorem 5.3.7 (`ν < μ`, TR). Under the standing TR hypotheses: with `ω₀ = Γ₀/Γ□` and
`κ^F_{TR,1} = log ω₀ / |log (1 - ω₀^((ν-μ)/μ))| + 1` (if `Γ₀ > 0`; `0` if `Γ₀ = 0`):
`Γ_k = 0` whenever `κ^F_{TR,1} ≤ |𝒮 ∩ [0,k)|` (5.3.36) and whenever
`κ^C_{TR,1} := κR κ^F_{TR,1} + κA + 1 ≤ k` (5.3.35); and some `i ≤ κR (κ^F_{TR,1} + 1) + κA` has
`ψ(x_i) = 0` ((5.3.37)–(5.3.38); from (5.3.28) at a successful `k` with `Γ_k = 0`, the minimizing
`i ≤ k` — not necessarily `x_k` itself).
'''
deps = ["lemma_5_3_6", "Optimization.IsExplicitGapDecrease.eq_zero_of_lt_one", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.7 and its proof (Appendix B)"

[[node]]
id = "theorem_5_3_8"
kind = "theorem"
desc = '''
Theorem 5.3.8 (`ν = μ`, TR). Under the standing TR hypotheses, `Γ₀ > 0`: either `κν = κψ` and
`Γ_{k₁+1} = 0`, or linear convergence with factor `1 - κν/κψ`, and for `ε ∈ (0,1)`: `Γ_k ≤ ε`
whenever `κ^E |log ε| + κ^F ≤ |𝒮 ∩ [0,k)|` (5.3.40), `κ^E = 1/|log(1 - κν/κψ)|`,
`κ^F = log Γ₀ / |log(1 - κν/κψ)| + 1` (book omits the `+1` of the ceiling), and whenever
`κR (κ^E |log ε| + κ^F) + κA + 1 ≤ k` (5.3.39); measure version (5.3.41)–(5.3.42): some `i` with
`ψ(x_i) ≤ ε` and `i ≤ κR (ν κ^E |log ε| + κ^E |log κν| + κ^F + 1) + κA`.
'''
deps = ["lemma_5_3_6", "Optimization.IsImplicitGapDecrease.le_of_linear_count", "Optimization.le_card_of_density"]
source = "Cartis–Gould–Toint, Theorem 5.3.8 and its proof (Appendix B)"

[[node]]
id = "theorem_5_3_9"
kind = "theorem"
desc = '''
Theorem 5.3.9 (`ν > μ`, TR). Under the standing TR hypotheses, `Γ₀ > 0`: sublinear convergence and,
for `ε > 0`, `Γ_k ≤ ε` whenever `κ^E ε^(-(ν-μ)/μ) + κ^F ≤ |𝒮 ∩ [0,k)|` (5.3.43), with
