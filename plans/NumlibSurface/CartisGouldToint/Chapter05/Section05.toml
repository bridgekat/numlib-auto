Step 1: Step computation. Compute a step \( {s}_k \) such that

\[
{m}_k\left( {s}_k\right)  < {m}_k\left( 0\right)\tag{5.5.4}
\]

where \( {m}_k\left( s\right) \) is given by (5.5.1);

\[
