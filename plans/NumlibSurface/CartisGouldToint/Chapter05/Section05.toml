[[node]]
id = "lemma_5_5_4"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.5.4: A lower bound on \( {\sigma }_k \) to ensure success

Suppose that \( r \geq  p + {\beta }_p \) , that \( \mathbf{f}.\mathbf{DpH} \) holds, and that the \( \mathrm{AR}p - \mathrm{H} \) algorithm has not terminated. (i) If \( {\epsilon }_2 = \infty \) and

\[
{\sigma }_k \geq  \max \left\lbrack  {{\theta }_1\left( {r - 1}\right) !,{\kappa }_{\beta ,1}{\epsilon }_1^{\frac{p + {\beta }_p - r}{p + {\beta }_p - 1}}}\right\rbrack  ,\tag{5.5.27}
\]

where

\[
{\kappa }_{\beta ,1}\overset{\text{ def }}{ = }{\left( \frac{\left( {r - 1}\right) !}{3}\right) }^{\frac{p + {\beta }_{p} - r}{p + {\beta }_{p} - 1}}{\kappa }_{\beta }^{\frac{r - 1}{p + {\beta }_{p} - 1}}\tag{5.5.28}
\]

and \( {\kappa }_{\beta } \) is defined by (5.5.19), then (5.5.18) holds, and consequently iteration \( k \) is very successful.

(ii) If \( {\epsilon }_2 < \infty \) and

\[
{\sigma }_k \geq  \max \left\lbrack  {{\theta }_1\left( {r - 1}\right) !,{\theta }_2\left( {r - 2}\right) !,{\kappa }_{\beta ,1}{\epsilon }_1^{\frac{p + {\beta }_p - r}{p + {\beta }_p - 1}},{\kappa }_{\beta ,2}{\epsilon }_2^{\frac{p + {\beta }_p - r}{p + {\beta }_p - 2}}}\right\rbrack  ,\tag{5.5.29}
\]

where

\[
{\kappa }_{\beta ,2}\overset{\text{ def }}{ = }{\left( \frac{\left( {r - 2}\right) !}{3}\right) }^{\frac{p + {\beta }_{p} - r}{p + {\beta }_{p} - 2}}{\kappa }_{\beta }^{\frac{r - 2}{p + {\beta }_{p} - 2}},\tag{5.5.30}
\]

then (5.5.20) holds, and once again iteration \( k \) is very successful.

Referenced equation payloads:

Equation (5.5.18):
\[
{\sigma }_k \geq  \max \left\lbrack  {{\theta }_1\left( {r - 1}\right) !,{\kappa }_{\beta }{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + {\beta }_p - r}}\right\rbrack  ,\tag{5.5.18}
\]

Equation (5.5.19):
\[
{\kappa }_{\beta }\overset{\text{ def }}{ = }\frac{r!{H}_{f, p}}{\left( {p + {\beta }_{p} - 1}\right) !\left( {1 - {\eta }_{2}}\right) },\tag{5.5.19}
\]

Equation (5.5.20):
\[
{\sigma }_k \geq  \max \left\lbrack  {{\theta }_1\left( {r - 1}\right) !,{\theta }_2\left( {r - 2}\right) !,{\kappa }_{\beta }{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + {\beta }_p - r}}\right\rbrack  ,\tag{5.5.20}
\]
'''
