[[node]]
id = "lemma_5_5_1"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.5.1: Sufficient decrease

Each iteration of the ARp-H algorithm guarantees the decrease

\[
f\left( {x}_k\right)  - {T}_p\left( {{x}_k,{s}_k}\right)  \geq  \frac{{\sigma }_k}{r!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{r}.\tag{5.5.12}
\]
'''
deps = ["universalArpRun", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 5.5.1 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 7194)"

[[node]]
id = "lemma_5_5_2"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.5.2: Lower bound on the step

Suppose that f.DpH holds. Then on each iteration of the ARp-H algorithm, the step \( {s}_k \) calculated in Step 1 satisfies

\[
\begin{Vmatrix}{{\nabla }_x^{1}f\left( {{x}_k + {s}_k}\right) }\end{Vmatrix} \leq  \frac{{H}_{f, p}}{\left( {p + {\beta }_p - 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + {\beta }_p - 1} + \frac{{\sigma }_k}{\left( {r - 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{r - 1} + {\theta }_1{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{r - 1}.
\]

(5.5.13)

If additionally \( {\epsilon }_2 < \infty \) , then

\[
- {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {{x}_k + {s}_k}\right) }\right\rbrack   \leq  \frac{{H}_{f, p}}{\left( {p + {\beta }_p - 2}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + {\beta }_p - 2} + \frac{{\sigma }_k}{\left( {r - 2}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{r - 2} + {\theta }_2{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{r - 2}.
\]

(5.5.14)
'''
deps = ["universalArpRun", "objectiveRegularity", "taylorModel"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 5.5.2 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 7216)"

[[node]]
id = "lemma_5_5_3"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 5.5.3: Successful iterations

Suppose that \( r \geq  p + {\beta }_p \) and f.DpH hold. (i) If \( {\epsilon }_2 = \infty \) and

\[
{\sigma }_k \geq  \max \left\lbrack  {{\theta }_1\left( {r - 1}\right) !,{\kappa }_{\beta }{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + {\beta }_p - r}}\right\rbrack  ,\tag{5.5.18}
\]

where

\[
{\kappa }_{\beta }\overset{\text{ def }}{ = }\frac{r!{H}_{f, p}}{\left( {p + {\beta }_{p} - 1}\right) !\left( {1 - {\eta }_{2}}\right) },\tag{5.5.19}
\]

