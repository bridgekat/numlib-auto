desc = '''
Cartis–Gould–Toint, *Evaluation Complexity of Algorithms for Nonconvex Optimization*, Chapter 9,
"Step Computation with Factorizations": derivatives of the secular function from `LDLᵀ` factors
(§9.1), safeguarded bracketing to reach `𝓛` (§9.2), the regularization subproblem — initial
bounds, inverse iteration in the (potential) hard case, early termination (§9.3) — and the
trust-region subproblem (§9.4). Conventions as in Chapter 8 (`CartisGouldToint.Chapter08`
definitions are reused). Proofs: `Subproblem.Bracketing`, `Subproblem.InverseIteration`,
`Subproblem.Stopping`, `Subproblem.TrustRegion`.

Source corrections: Algorithm 9.1.1 computes the derivative vectors up to sign (harmless for the
`π⁽ʲ⁾` it outputs; Corollary 9.1.1's alternative odd formula needs the true derivatives) and the
Cholesky remark after it has a spurious factor `2`; Algorithm 9.3.1/Theorem 9.3.1 need
`z₀ ∈ 𝒵₁` with the `M`-inner product and the theorem must assume it; Theorem 9.3.2's conclusion
(9.3.14c) holds for the `M`-generalized smallest eigenvalue, not the Euclidean one; (9.4.5) is
only an implication.
'''
