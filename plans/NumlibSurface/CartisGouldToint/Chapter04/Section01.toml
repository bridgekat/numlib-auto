[[node]]
id = "theorem_4_1_5_i"
kind = "theorem"
desc = '''
Theorem 4.1.5, first-order mode (`ε₂ = ε₃ = none`, `p ≥ 1`). Under `Chapter02.AssumptionBb f flow`
and `AssumptionDpL f p L`, for every ARp run with `ε₁ > 0` there is `k_ε` with
`IsFirstHit test k_ε` (so `‖∇f(x_{k_ε})‖ ≤ ε₁`),
`funEvalCount k_ε ≤ κ^A (f(x_0) - flow)/ε₁^{(p+1)/p} + κ^C` and
`derivEvalCount succ k_ε ≤ κ^S (f(x_0) - flow)/ε₁^{(p+1)/p} + 2`, where
`κ^S = (p+1)!/(η₁ σ_min) ((L + σ_max + θ₁ p!)/p!)^{(p+1)/p}`, `κ^A = κ^S (1 + |log γ₁|/log γ₂)`,
`κ^C = (|log γ₁| + log(σ_max/σ₀))/log γ₂ + 2`, `σ_max` of (4.1.19). (Successful iterations
`j ≤ k_ε - 2` decrease `f` by `≥ κ₁ ε₁^{(p+1)/p}`, so `|𝒮_{k_ε - 2}| ≤ κ^S (f(x_0)-flow)/ε₁^{(p+1)/p}`;
`derivEvalCount k_ε = |𝒮_{k_ε-1}| + 1`; `Optimization.succ_le_of_arUpdate` at `k_ε - 1`.)
'''
deps = ["lemma_4_1_4_i", "lemma_4_1_2", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.IsARRun.exists_isFirstHit_of_decrease"]
source = "Cartis–Gould–Toint, Theorem 4.1.5"

