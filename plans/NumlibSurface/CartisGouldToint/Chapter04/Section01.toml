[[node]]
id = "IsApproxThirdOrderMinimizer"
kind = "def"
desc = '''
(4.1.3)–(4.1.4): `smallCurvatureSet f x ε₂ : Set E := Optimization.smallCurvatureDirections (iteratedFDeriv ℝ 2 f x) ε₂`
(`= {d | ‖d‖ = 1 ∧ |iteratedFDeriv ℝ 2 f x (fun _ => d)| ≤ ε₂}`)
(the book's `𝒵_ε`) and `IsApproxThirdOrderMinimizer f x ε₁ ε₂ ε₃ : Prop :=
Chapter03.IsApproxSecondOrderMinimizer f x ε₁ ε₂ ∧ ∀ d ∈ smallCurvatureSet f x ε₂,
|iteratedFDeriv ℝ 3 f x (fun _ => d)| ≤ ε₃` (vacuous when `𝒵_ε = ∅`, which with (3.2.6) means
`λ_min > ε₂`, the approximate strict local minimizer case). Also the relative version
`IsApproxThirdOrderMinimizerOn f x ε₁ ε₂ ε₃ M` (the cubic condition only on `M ⊆ 𝒵_ε`), which is
what ARp certifies.
'''
deps = ["CartisGouldToint.Chapter03.IsApproxSecondOrderMinimizer", "Optimization.smallCurvatureDirections"]
source = "Cartis–Gould–Toint, (4.1.3)–(4.1.4)"

[[node]]
id = "arpStopTest"
kind = "def"
desc = '''
Step 1 of Algorithm 4.1.1. `arpStopTest f ε₁ ε₂ ε₃ (M : Set E) x : Prop :=
‖gradient f x‖ ≤ ε₁ ∧ ∀ e₂ ∈ ε₂, (e₂ < λ_min(x) ∨ (-e₂ ≤ λ_min(x) ∧ ∀ e₃ ∈ ε₃, ∀ d ∈ M,
|∇³f(x)[d]³| ≤ e₃ ∧ |∇²f(x)[d]²| ≤ e₂))`, `λ_min(x) = Chapter01.hessianMinEig f x`
(prototype in `drafts/cgt/plan-ch04/Proto.lean`). The four branches (4.1.5); (4.1.5)+(4.1.6);
(4.1.5)+(4.1.7) with `ε₃ = ∞`; (4.1.5)+(4.1.7)+(4.1.8)+(4.1.9) are the disjuncts.
**Correction:** the book also requires `𝓜_k ≠ ∅` in the last branch; with that requirement a run
can get stuck (e.g. `f(x) = x²` on `ℝ²` reached with `𝓜_k ∋ e₁`, or `𝓜_0 = ∅` with
`λ_min ∈ [-ε₂, ε₂]`), and the proof of Theorem 4.1.5 uses the vacuous reading. Certificate
(part of node): `arpStopTest f ε₁ (some e₂) (some e₃) M x → (e₂ < λ_min(x) ∨ (M ⊆ smallCurvatureSet f x e₂
∧ IsApproxThirdOrderMinimizerOn f x ε₁ e₂ e₃ M))` and with `ε₃ = none` it is
`Chapter03.stopTest f ε₁ ε₂ x`.
'''
deps = ["IsApproxThirdOrderMinimizer", "CartisGouldToint.Chapter01.hessianMinEig", "CartisGouldToint.Chapter03.IsApproxSecondOrderMinimizer"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1 (Step 1), (4.1.5)–(4.1.9)"

[[node]]
id = "algorithm_4_1_1"
kind = "def"
desc = '''
Algorithm 4.1.1 (ARp) as a run predicate `algorithm_4_1_1 f p P ε₁ ε₂ ε₃ x s σ` (`p ≥ 1`;
`ε₂ = none → ε₃ = none`; `p ≥ 2` if `ε₂ ≠ none`, `p ≥ 3` if `ε₃ ≠ none`):
`Optimization.IsARpRun f p P.toARpParams q test x s σ` with `q = 1, 2, 3` according to the
tolerances (number of finite `ε`'s) and `test` below. Spelled out, with
`m k := Optimization.regularizedModel (ftaylorSeries ℝ f (x k)) p (σ k)`, the curvature sets
`curvSet 0 := smallCurvatureSet f (x 0) e₂` and
`curvSet (k+1) := {d | ‖d‖ = 1 ∧ |iteratedFDeriv ℝ 2 (m k) (s k) (fun _ => d)| ≤ θ₂ ‖s k‖^(p-1)}`
((4.1.14); defined as functions of the run), and `test k := arpStopTest f ε₁ ε₂ ε₃ (curvSet k) (x k)`:
`σ 0 = P.σ₀` and `Optimization.UntilHit test` of the rule at `k`:
(4.1.10) `m k (s k) < m k 0`; (4.1.11) `‖fderiv ℝ (m k) (s k)‖ ≤ θ₁ ‖s k‖^p`; if `ε₂ ≠ none`,
(4.1.12) `-θ₂ ‖s k‖^(p-1) ≤ minCurvature (iteratedFDeriv ℝ 2 (m k) (s k))`; if `ε₃ ≠ none`,
(4.1.13) `∀ d ∈ curvSet (k+1), |iteratedFDeriv ℝ 3 (m k) (s k) (fun _ => d)| ≤ θ₃ ‖s k‖^(p-2)`;
`ρ k = Optimization.reductionRatio f (x k) (s k) ((ftaylorSeries ℝ f (x k)).taylorDecrement p (s k))`
(4.1.15); `x (k+1) = if η₁ ≤ ρ k then x k + s k else x k`; `Optimization.ARUpdate … (ρ k) (σ k) (σ (k+1))`
(4.1.16). Success predicate `succ k := η₁ ≤ ρ k`. Counts: `Optimization.funEvalCount`,
`Optimization.derivEvalCount` (derivatives of orders `1..p` recomputed after successful iterations).
'''
deps = ["ARpParams", "arpStopTest", "Optimization.IsARpRun", "Optimization.smallCurvatureDirections", "Optimization.funEvalCount", "Optimization.derivEvalCount"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1"

[[node]]
id = "exists_isARpRun"
kind = "theorem"
desc = '''
Well-posedness for `ε₃ = none`. If `f` is `C^p` (`p ≥ 1`; `p ≥ 2` when `ε₂ ≠ none`), `P : ARpParams`,
`ε₁ > 0`, then from every `x₀` there is an ARp run (`algorithm_4_1_1 … x s σ` with `x 0 = x₀`). Proof: when
the test fails at `x_k`, a global minimizer `s*` of `m_k` (`Optimization.exists_isMinOn_regularizedModel`)
satisfies (4.1.11)–(4.1.12) with `∇m_k(s*) = 0`, `∇²m_k(s*) ⪰ 0`, and `m_k(s*) < m_k(0)` because `0`
is not a local minimizer of `m_k` (either `∇f(x_k) ≠ 0`, or `λ_min(∇²f(x_k)) < -ε₂ < 0` and
`∇²m_k(0) = ∇²f(x_k)` as `∇²‖·‖^{p+1}(0) = 0` for `p ≥ 2`); `σ_{k+1} = σ_k` or `γ₂ σ_k` is
admissible. This is `Optimization.exists_isARpRun` (a) (via `Optimization.exists_isARpStep`).
'''
deps = ["algorithm_4_1_1", "Optimization.exists_isARpRun"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1 (well-posedness, implicit)"

[[node]]
id = "not_exists_isARpRun_third_order"
kind = "theorem"
desc = '''
ARp's third-order mode is not always well posed (new; motivates the `wrong`-free reading of
Theorem 4.1.5 (iii) as a statement about runs, which may not exist). For `p = 3`,
`E = EuclideanSpace ℝ (Fin 1)`, any `P : ARpParams` and `e₂, e₃ ∈ (0, 1]` with
`4 e₃² ≤ 3 e₂ σ₀`, the function `f x = e₂ x²/2 + e₃ x³/3 + x⁴` (f.Bb, f.DpL with `L = 24`) admits
no ARp run with `ε₂ = some e₂`, `ε₃ = some e₃` from `x₀ = 0`: the test fails at `0`
(`∇f(0) = 0`, `λ_min = e₂` not `> e₂`, `𝓜_0 = {±1}`, `|∇³f(0)[1]³| = 2 e₃ > e₃`), and
`m_0(s) - m_0(0) = s² (e₂/2 + e₃ s/3 + σ₀ s²/24) ≥ 0` for all `s` (discriminant
`e₃²/9 - e₂ σ₀/12 ≤ 0`), so (4.1.10) cannot hold.
'''
deps = ["algorithm_4_1_1"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1 (counterexample to well-posedness for ε₃ < ∞)"

