namespace = "CartisGouldToint.Chapter04"
desc = '''
§4.1 The ARp algorithm and its complexity. Model (4.1.2):
`m_k(s) = Optimization.regularizedModel (ftaylorSeries ℝ f (x k)) p (σ k) s`, step conditions
(4.1.10)–(4.1.14) on `fderiv`, `minCurvature (iteratedFDeriv ℝ 2 m_k (s k))` and
`iteratedFDeriv ℝ 3 m_k (s k)`, ratio (4.1.15) with `(ftaylorSeries ℝ f (x k)).taylorDecrement p (s k)`,
update `Optimization.ARUpdate` (4.1.16). Surface on `E = EuclideanSpace ℝ (Fin n)`.

ARp is the backbone run predicate `Optimization.IsARpRun` (`ModelBased/ARpRun`, an instance of the
generic AR run `Optimization.IsARRun`) with the Step-1 test (4.1.5)–(4.1.9); Lemmas 4.1.1–4.1.4 and
the existence result are specializations of `IsARRun.sub_ge_of_succ`, `IsARRun.sigma_le`,
`IsARpRun.step_lower_bounds`, `IsARpRun.decrease_ge`, `exists_isARpRun`, and Theorem 4.1.5's
counting is `IsARRun.exists_isFirstHit_of_decrease`. The one-iteration estimates are backbone
(`Optimization.TaylorModel`): Lemmas 4.1.1–4.1.3 are instances; the third-order parts use `Optimization.abs_iteratedFDeriv_apply_le_of_regularizedModel`
with the bound on the third derivative of `‖s‖^{p+1}` (`norm_iteratedFDeriv_norm_pow_le` with
`ℓ = 3`, Lemma B.4.1 with `j = 3`). Counting uses `Optimization.succ_le_of_arUpdate` (Lemma 2.4.1 in the
form `k + 1 ≤ |𝒮_k|(1 + |log γ₁|/log γ₂) + log(σ_max/σ₀)/log γ₂`), which yields the book's
constants (4.1.46) exactly.

§4.1.3 ("A TRp algorithm?") contains no numbered statement: it argues informally that a
trust-region method with a `p`-th degree model is still `O(ε^{-2})` on the example of Theorem 2.2.3;
no TRp algorithm is defined, so nothing is planned (the corresponding formal content is the
Chapter 2/3 sharpness results).
'''

