Lemma 4.1.4: Bounds on the successful function decrease for \( \mathrm{AR}p \)

Suppose that f.DpL holds and that iteration \( k \) of the \( \mathrm{AR}p \) algorithm is successful. Then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_1{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_{k + 1}\right) \end{Vmatrix}}^{\frac{p + 1}{p}},\tag{4.1.31}
\]

where

\[
{\kappa }_{1}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{p!}{{L}_{f, p} + {\sigma }_{\max } + {\theta }_{1}p!}\right) }^{\frac{p + 1}{p}}.\tag{4.1.32}
\]

If additionally \( {\epsilon }_2 < \infty \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_2\max {\left( 0, - {\lambda }_{\min }\left\lbrack  {\nabla }_x^{2}f\left( {x}_{k + 1}\right) \right\rbrack  \right) }^{\frac{p + 1}{p - 1}},\tag{4.1.33}
\]

where

\[
{\kappa }_{2}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{\left( {p - 1}\right) !}{{L}_{f, p} + {\sigma }_{\max } + {\theta }_{2}\left( {p - 1}\right) !}\right) }^{\frac{p + 1}{p - 1}},\tag{4.1.34}
\]

and, if \( {\epsilon }_3 < \infty \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\kappa }_3{\left| {\nabla }_x^{3}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^3\right| }^{\frac{p + 1}{p - 2}},\tag{4.1.35}
\]

where

\[
{\kappa }_{3}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{\left( {p - 2}\right) !}{{L}_{f, p} + {\sigma }_{\max } + {\theta }_{3}\left( {p - 2}\right) !}\right) }^{\frac{p + 1}{p - 2}}\tag{4.1.36}
\]

for all \( d \) in the set \( {\mathcal{M}}_{k + 1} \) given by (4.1.14).

