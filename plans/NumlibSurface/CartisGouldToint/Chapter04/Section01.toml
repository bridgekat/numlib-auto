Lemma 4.1.1. If `m_k(s) ≤ m_k(0)` (model (4.1.2)) then
`T_{f,p}(x_k, 0) - T_{f,p}(x_k, s) ≥ σ_k/(p+1)! ‖s‖^{p+1}` (4.1.18); in an ARp run this holds (strictly,
