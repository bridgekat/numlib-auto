desc = '''
Theorem 4.1.5, third-order mode (`ε₂ = some e₂`, `ε₃ = some e₃`, `p ≥ 3`, all tolerances `> 0`;
the book assumes `(ε₁,ε₂,ε₃) ∈ (0,1]³`). For every ARp run there is `k_ε` with `IsFirstHit test k_ε`,
the evaluation bounds of (i) with denominator `min(ε₁^{(p+1)/p}, e₂^{(p+1)/(p-1)}, e₃^{(p+1)/(p-2)})`
and `κ^S` the full maximum (4.1.45); at `x_ε = x_{k_ε}` with `𝓜_ε = curvSet k_ε`:
`‖∇f(x_ε)‖ ≤ ε₁`, `λ_min ≥ -e₂`, and either `λ_min > e₂` (strict local minimizer, `𝒵_ε = ∅`) or
`𝓜_ε ⊆ 𝒵_ε` and `|∇³f(x_ε)[d]³| ≤ e₃` for all `d ∈ 𝓜_ε` (the book's conclusion; not the full
