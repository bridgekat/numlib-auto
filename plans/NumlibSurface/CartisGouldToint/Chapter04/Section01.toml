`λ_min < -e₂`, or `‖s_j‖^{p-1} > κ_{s2} e₂` ((4.1.43), decrease `≥ κ₂ e₂^{(p+1)/(p-1)}` by
(4.1.37)), or else all `d ∈ 𝓜_{j+1}` satisfy (4.1.9) (Lemma 4.1.3 (4.1.23)) and some
`d ∈ 𝓜_{j+1}` violates (4.1.8). (The statement is about runs; by `not_exists_isARpRun_third_order`
runs need not exist.)
'''
