Theorem 4.1.6: Slow convergence of the \( \mathrm{AR}p \) algorithm when finding first- to third-order critical points

The ARp algorithm (p. 100) applied to minimize a function \( f \) satisfying f.Bb and f.DpL may require

\[
{\epsilon }_1^{-\frac{p + 1}{p}}
\]

iterations and evaluations of \( f \) and its derivatives of order 1 to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) . It may also require

\[
\max \left\lbrack  {{\epsilon }_1^{-\frac{p + 1}{p}},{\epsilon }_2^{-\frac{p + 1}{p - 1}}}\right\rbrack
\]

iterations and evaluations of \( f \) and its derivatives of order 1 to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1 \) and \( {\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\right\rbrack   \geq   - {\epsilon }_2 \) . Finally, it may require

\[
\max \left\lbrack  {{\epsilon }_1^{-\frac{p + 1}{p}},{\epsilon }_2^{-\frac{p + 1}{p - 1}},{\epsilon }_3^{-\frac{p + 1}{p - 2}}}\right\rbrack
\]

iterations and evaluations of \( f \) and its derivatives of order 1 to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1,{\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\right\rbrack   \geq   - {\epsilon }_2 \) , and \( \left| {{\nabla }_x^{3}f\left( {x}_{\epsilon }\right) {\left\lbrack  d\right\rbrack  }^3}\right|  \leq  {\epsilon }_3 \) for all \( d \in  {\mathcal{Z}}_{\epsilon } = \left\{  {d : \parallel d\parallel  = 1}\right. \) and \( \left. {\left| {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) {\left\lbrack  d\right\rbrack  }^2}\right|  \leq  {\epsilon }_2}\right\} \) .
'''
