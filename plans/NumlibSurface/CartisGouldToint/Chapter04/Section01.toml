[[node]]
id = "theorem_4_1_6_i"
kind = "theorem"
desc = '''
Theorem 4.1.6, first order (sharpness; the book defers the proof to §12.2.2.4). For every `p ≥ 1`
and `P : ARpParams` there are `flow`, `L ≥ 1` (independent of `ε₁`) such that for every
`ε₁ ∈ (0, 1]` there are `f : EuclideanSpace ℝ (Fin 1) → ℝ` with `Chapter02.AssumptionBb f flow`,
