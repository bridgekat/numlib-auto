Theorem 4.1.5: Complexity of finding first- to third-order critical points by the \( \mathrm{AR}p \) algorithm

Suppose that \( f.{Bb} \) and \( f.{DpL} \) hold. Then there exist positive constants \( {\kappa }_{\mathrm{ARb}}^s,{\kappa }_{\mathrm{ARb}}^A \) , and \( {\kappa }_{\mathrm{ARp}}^c \) such that, for any \( \left( {{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right)  \in  (0,1{\rbrack }^3 \) , the \( \mathrm{ARp} \) algorithm (p. 100) requires at most

\[
{\# }_{\mathsf{{ARp},3}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathsf{{ARp}}}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\mathsf{{low}}}}{\min \left\lbrack  {{\epsilon }_{1}^{\frac{p + 1}{p}},{\epsilon }_{2}^{\frac{p + 1}{p - 1}},{\epsilon }_{3}^{\frac{p + 1}{p - 2}}}\right\rbrack  } + {\kappa }_{\mathsf{{ARp}}}^{C} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-\frac{p + 1}{p}},{\epsilon }_{2}^{-\frac{p + 1}{p - 1}},{\epsilon }_{3}^{-\frac{p + 1}{p - 2}}}\right\rbrack  }\right)
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathsf{{ARp}},3}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathsf{{ARp}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\mathsf{{low}}}}{\min \left\lbrack  {{\epsilon }_{1}^{\frac{p + 1}{p}},{\epsilon }_{2}^{\frac{p + 1}{p - 1}},{\epsilon }_{3}^{\frac{p + 1}{p - 2}}}\right\rbrack  } + 2 = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{1}^{-\frac{p + 1}{p}},{\epsilon }_{2}^{-\frac{p + 1}{p - 1}},{\epsilon }_{3}^{-\frac{p + 1}{p - 2}}}\right\rbrack  }\right)
\]

(4.1.38)

evaluations of derivatives of order one to \( p \) of \( f \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_1,{\lambda }_{\min }\left\lbrack  {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) }\right\rbrack   \geq   - {\epsilon }_2 \) , and \( \left| {{\nabla }_x^{3}f\left( {x}_{\epsilon }\right) {\left\lbrack  d\right\rbrack  }^3}\right|  \leq  {\epsilon }_3 \) for all \( d \in  {\mathcal{M}}_{\epsilon } \) , where \( {\mathcal{M}}_{\epsilon } \subseteq  {\mathcal{Z}}_{\epsilon } = \left\{  {d : \parallel d\parallel  = 1}\right. \) and \( \left. {\left| {{\nabla }_x^{2}f\left( {x}_{\epsilon }\right) {\left\lbrack  d\right\rbrack  }^2}\right|  \leq  {\epsilon }_2}\right\} \) .
'''
