[[node]]
id = "lemma_4_1_3"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 4.1.3: Lower bounds on the length of the step for ARp

Suppose that f.DpL holds. Then on every successful iteration \( k \) of the ARp algorithm, the step \( {s}_k \) calculated in Step 2 satisfies

\[
