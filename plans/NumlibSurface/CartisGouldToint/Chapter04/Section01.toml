global minimizer of `m_k`, every iteration very successful, `ρ_k = 1`) with
`IsFirstHit test ⌈ε₁^{-(p+1)/p}⌉₊`; hence `⌈ε₁^{-(p+1)/p}⌉₊ + 1` evaluations of `f` and of its
derivatives. Data: `Optimization.exists_slowTaylorOrder_interpolant` with `q = 1`,
`c = p!/σ₀`, lifted by `Optimization.ridge`.
'''
deps = ["algorithm_4_1_1", "AssumptionDpL", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.exists_slowTaylorOrder_interpolant", "Optimization.ridge"]
source = "Cartis–Gould–Toint, Theorem 4.1.6"

[[node]]
id = "theorem_4_1_6_ii"
kind = "theorem"
desc = '''
Theorem 4.1.6, second order. For every `p ≥ 2` and `P` there are `flow`, `L` such that for all
`ε₁, e₂ ∈ (0, 1]` there are `f : EuclideanSpace ℝ (Fin 1) → ℝ` (f.Bb, f.DpL) and an ARp run with
`ε₂ = some e₂`, `ε₃ = none` from `0` whose first termination index is exactly
`max ⌈ε₁^{-(p+1)/p}⌉₊ ⌈e₂^{-(p+1)/(p-1)}⌉₊`: the example of (i) if the first term dominates
(`∇²f(x_k) = 0`, so `λ_min = 0 ≥ -e₂`), otherwise the `q = 2` data of
`Optimization.exists_slowTaylorOrder_interpolant` (`∇f(x_k) = 0`, `λ_min = -(e₂ + ω_k)`; the book's
"`λ_min = f_k^{(2)} = ε + ω_k`" has a sign slip), `c = p!/σ₀`.
'''
deps = ["theorem_4_1_6_i", "Optimization.exists_slowTaylorOrder_interpolant"]
source = "Cartis–Gould–Toint, Theorem 4.1.6"

[[node]]
id = "theorem_4_1_6_iii"
kind = "theorem"
desc = '''
Theorem 4.1.6, third order, **with a restriction on the constants**. For every `p ≥ 3` and `P` with
`σ₀ ≤ (p-2)! min(θ₂, θ₃)` there are `flow`, `L` such that for all `ε₁, e₂, e₃ ∈ (0, 1]` there are
`f : EuclideanSpace ℝ (Fin 1) → ℝ` (f.Bb, f.DpL) and an ARp run with `ε₂ = some e₂`,
`ε₃ = some e₃` from `0` whose first termination index is exactly
`max ⌈ε₁^{-(p+1)/p}⌉₊ ⌈e₂^{-(p+1)/(p-1)}⌉₊ ⌈e₃^{-(p+1)/(p-2)}⌉₊` (examples with `q = 1, 2, 3`,
`c = p!/((q-1)! σ₀)`). Why the restriction: on the `q = 3` data the model curvature at the step
along `±1` is `σ₀ (p-2)/p! ‖s‖^{p-1}`, so `±1 ∈ 𝓜_{k+1}` (needed to keep the third-order test
failing) iff `σ₀ (p-2)/p! ≤ θ₂`; and (4.1.13) at the global model minimizer needs
`σ₀ (p(p-1)-2)/p! ≤ θ₃` (`q = 3`), resp. `σ₀ ≤ θ₃ (p-2)!` (`q = 1, 2`, when `±1 ∈ 𝓜_{k+1}`). For other
constants the book's claim is unproved (the global minimizer need not satisfy (4.1.13), and if
`𝓜_{k+1} = ∅` the run terminates as soon as `‖∇f‖ ≤ ε₁` and `λ_min ≥ -e₂`).
'''
deps = ["theorem_4_1_6_ii", "Optimization.exists_slowTaylorOrder_interpolant"]
source = "Cartis–Gould–Toint, Theorem 4.1.6"
