namespace = "CartisGouldToint.Chapter04"
desc = '''
§4.2 A lower complexity bound for finding first-order stationary points (Carmon, Duchi, Hinder,
Sidford [77]). All general content is in the backbone: `Optimization.ZeroChain` (method and function
classes of variable dimension, `#_ε` (4.2.2), zero-respecting methods, zero chains, Lemmas
4.2.1–4.2.3), `Optimization.ResistingOracle` (Theorem 4.2.4, the book cites [77] for the proof) and
`Optimization.CarmonChain` (the hard function (4.2.6), Lemma 4.2.5, the lower bound). Surface nodes
are specializations with the book's notation: `𝓕(Δ,p)` carries its Lipschitz constant `L`
explicitly (the book's `L_{f,p}` "associated with functions in `𝓕(Δ,p)`").

Formal reading of the book's notions: a method in `𝓜(p)` is a family over all dimensions of
deterministic oracle methods with `x₀ = 0` receiving the `p`-jet at each iterate (`M^{(k)}` of
§4.2.1.2; footnote 31: no measurability); `k_ε(M,f) ∈ ℕ∞` (`⊤` if never `ε`-stationary).
'''

[[node]]
id = "functionClass"
kind = "def"
desc = '''
`functionClass Δ L p := Optimization.smoothClass Δ L p` — the book's `𝓕(Δ, p)` (§4.2.1.1):
`C^∞` functions on `ℝⁿ` (any `n`) satisfying f.DpL with constant `L`, f.Bb with `f_low = inf f`, and
`f(0) - f_low ≤ Δ`. Orthogonal invariance (footnote 30) is `Optimization.comp_adjoint_mem_smoothClass`.
'''
deps = ["Optimization.smoothClass", "Optimization.comp_adjoint_mem_smoothClass"]
source = "Cartis–Gould–Toint, Section 4.2.1.1"

[[node]]
id = "methodClasses"
kind = "def"
desc = '''
`methodClassM p := Optimization.methodClass p` (`𝓜(p)`) and
`methodClassZR p := Optimization.zeroRespectingClass p` (`𝓜_ZR(p)`, (4.2.1)), and the complexity
`complexity 𝓜 𝓕 ε := Optimization.classComplexity 𝓜 𝓕 ε` (`#_ε(𝓜, 𝓕)`, (4.2.2)); the zero-chain
property (4.2.4) is `Optimization.IsZeroChain f p`.
'''
deps = ["Optimization.JetMethod", "Optimization.IsZeroRespectingFor", "Optimization.classComplexity", "Optimization.IsZeroChain"]
source = "Cartis–Gould–Toint, Sections 4.2.1.2–4.2.1.3, (4.2.1), (4.2.2), (4.2.4)"

[[node]]
id = "lemma_4_2_1"
kind = "theorem"
desc = '''
Lemma 4.2.1. If `f : EuclideanSpace ℝ (Fin n) → ℝ` is a `p`-th order zero chain, `μ₁ : ℝ` and
`μ₂ ≠ 0`, then `x ↦ μ₁ f(x/μ₂)` is a `p`-th order zero chain.
'''
deps = ["methodClasses", "Optimization.IsZeroChain.comp_smul"]
source = "Cartis–Gould–Toint, Lemma 4.2.1"

[[node]]
id = "lemma_4_2_2"
kind = "theorem"
desc = '''
Lemma 4.2.2. If `M ∈ methodClassZR p` and `⟨n, f⟩ ∈ functionClass Δ L p` is a `p`-th order zero chain
(`p ≥ 1`), then the iterates `x_k` of `M n` on `f` satisfy `[x_k]_j = 0` for all `j ∈ [k+1 : n]`
(1-based) and all `k ≤ n - 1`. (Only the zero-chain property and zero-respect for `f` are used.)
'''
deps = ["methodClasses", "functionClass", "Optimization.IsZeroRespectingFor.iterate_apply_eq_zero"]
source = "Cartis–Gould–Toint, Lemma 4.2.2"

[[node]]
id = "lemma_4_2_3"
kind = "theorem"
desc = '''
Lemma 4.2.3. Let `ε > 0`, `p ≥ 1` and `⟨n, f⟩ ∈ functionClass Δ L p` a `p`-th order zero chain with
`‖∇f(x)‖ > ε` whenever `[x]_n = 0` (4.2.5). Then
`complexity (methodClassZR p) (functionClass Δ L p) ε ≥ complexity (methodClassZR p) {⟨n,f⟩} ε ≥ n`
(the book refers to "(4.2.3)" for the definition of `#_ε`; it is (4.2.2)).
'''
deps = ["methodClasses", "functionClass", "Optimization.le_firstStationaryIndex_of_isZeroChain"]
source = "Cartis–Gould–Toint, Lemma 4.2.3"

[[node]]
id = "theorem_4_2_4_i"
kind = "theorem"
desc = '''
Theorem 4.2.4 (first part). For every `ε > 0`:
`complexity (methodClassM p) (functionClass Δ L p) ε ≥ complexity (methodClassZR p) (functionClass Δ L p) ε`.
(The book cites [77, Props. 1, 2]; its displayed sketch exchanges inf and sup loosely; the planned
proof uses a simulating zero-respecting method for each horizon `T`, see
`Optimization.classComplexity_zeroRespecting_le`.)
'''
deps = ["methodClasses", "functionClass", "Optimization.classComplexity_zeroRespecting_le"]
source = "Cartis–Gould–Toint, Theorem 4.2.4"

[[node]]
id = "theorem_4_2_4_ii"
kind = "theorem"
desc = '''
Theorem 4.2.4 (second part). If `⟨n, f⟩ ∈ functionClass Δ L p` and
`complexity (methodClassZR p) {⟨n, f⟩} ε ≥ k̄` (`k̄ : ℕ`), then with
`𝓕_U = {⟨n + k̄, f ∘ Uᵀ⟩ | U : ℝⁿ →ₗᵢ[ℝ] ℝ^{n+k̄}}` (the book's `U ∈ O(n + k̄, n)`):
`complexity (methodClassM p) (functionClass Δ L p) ε ≥ complexity (methodClassM p) 𝓕_U ε ≥ k̄`.
'''
deps = ["methodClasses", "functionClass", "Optimization.le_classComplexity_comp_adjoint", "Optimization.comp_adjoint_mem_smoothClass"]
source = "Cartis–Gould–Toint, Theorem 4.2.4"

[[node]]
id = "hardFunction"
kind = "def"
desc = '''
The difficult function (4.2.6): `hardFunction k̄ := Optimization.CarmonChain.chain k̄` on
`EuclideanSpace ℝ (Fin k̄)`, with `Ψ`, `Φ` as in the book (`Optimization.CarmonChain.psi`).
**Correction:** the first term is `-Ψ(1) Φ([x]_1)` (as in [77]), not the printed
`-Ψ([x]_1) Φ([x]_1)`, with which `∇f^D(0) = 0` and Lemma 4.2.5 (ii) fails at `x = 0`.
'''
deps = ["Optimization.CarmonChain.chain"]
source = "Cartis–Gould–Toint, (4.2.6)"

[[node]]
id = "lemma_4_2_5_i"
kind = "theorem"
desc = '''
Lemma 4.2.5 (i). For every `p ≥ 1`, `hardFunction k̄` is a `p`-th order zero chain.
'''
deps = ["hardFunction", "Optimization.CarmonChain.isZeroChain_chain"]
source = "Cartis–Gould–Toint, Lemma 4.2.5 (i)"

[[node]]
id = "lemma_4_2_5_ii"
kind = "theorem"
desc = '''
Lemma 4.2.5 (ii). If `|[x]_i| < 1` for some `i ≤ k̄`, there is `j ≤ i` with `|[x]_j| < 1` and
`‖∇f^D(x)‖ ≥ |∂f^D/∂[x]_j (x)| > 1`.
'''
deps = ["hardFunction", "Optimization.CarmonChain.exists_abs_partial_chain_gt_one"]
source = "Cartis–Gould–Toint, Lemma 4.2.5 (ii)"

[[node]]
id = "lemma_4_2_5_iii"
kind = "theorem"
desc = '''
Lemma 4.2.5 (iii). `f^D` is bounded below and `f^D(0) - f^D_low ≤ 12 k̄` (`f^D_low = inf f^D`).
'''
deps = ["hardFunction", "Optimization.CarmonChain.chain_zero_sub_iInf_le"]
source = "Cartis–Gould–Toint, Lemma 4.2.5 (iii)"

[[node]]
id = "lemma_4_2_5_iv"
kind = "theorem"
desc = '''
Lemma 4.2.5 (iv). There is `c₁ > 0` such that for every `p ≥ 1` and every `k̄`, `∇^p f^D` is
Lipschitz with constant `L^D_p := Optimization.CarmonChain.lipschitzConst p` (independent of `k̄`)
and `L^D_p ≤ exp(5/2 p log p + c₁ p)` (f.DpL holds with `max 1 L^D_p`).
'''
deps = ["hardFunction", "Optimization.CarmonChain.lipschitzOn_iteratedFDeriv_chain", "Optimization.CarmonChain.lipschitzConst_le_exp"]
source = "Cartis–Gould–Toint, Lemma 4.2.5 (iv)"

[[node]]
id = "theorem_4_2_6_i"
kind = "theorem"
desc = '''
Theorem 4.2.6 (lower bound), **corrected**. Let `p ≥ 1`, `Δ, L, ε₁ > 0`, `L^D_p` as in Lemma 4.2.5 (iv),
`Y := Δ (L / L^D_p)^{1/p} ε₁^{-(p+1)/p}`. Then
`complexity (methodClassM p) (functionClass Δ L p) ε₁ ≥ complexity (methodClassZR p) (functionClass Δ L p) ε₁
≥ ⌊Y / 12⌋₊`, hence `≥ c₀ Y` with `c₀ = 1/24` whenever `Y ≥ 12` (i.e. for `ε₁` small enough).
Proof as in the book with `f(x) = μ^{p+1} (L/L^D_p) f^D(x/μ)`, `μ = (L^D_p ε₁ / L)^{1/p}`, `k̄ = ⌊Y/12⌋₊`,
hard instance of dimension `k̄` for `𝓜_ZR(p)` and `2 k̄` for `𝓜(p)`
(`Optimization.CarmonChain.le_classComplexity_smoothClass`). Corrections: the book concludes
`#_ε(𝓜(p),𝓕) ≥ 2 k̄` from Theorem 4.2.4 (ii), which only gives `≥ k̄`; the floor makes the
`c₀`-form false for large `ε₁` (then `k̄ = 0`, and indeed for `Δ` small relative to
`ε₁^{(p+1)/p} L^{-1/p}` every `f ∈ 𝓕` has `‖∇f(0)‖ ≤ ε₁`, so `#_ε = 0`); the OCR's `μ` and
`(L_{f,p}/L_{f,p})^{1/p}` are garbled.
'''
deps = ["lemma_4_2_1", "lemma_4_2_3", "theorem_4_2_4_i", "theorem_4_2_4_ii", "lemma_4_2_5_i", "lemma_4_2_5_ii", "lemma_4_2_5_iii", "lemma_4_2_5_iv", "Optimization.CarmonChain.le_classComplexity_smoothClass"]
source = "Cartis–Gould–Toint, Theorem 4.2.6"

[[node]]
id = "arpOracleMethod"
kind = "def"
desc = '''
ARp (first-order mode) as a deterministic method in `𝓜(p)` (for (4.2.3) and the tightness claim of
Theorem 4.2.6). For `P : ARpParams` and `ε₁`, `arpOracleMethod P ε₁ : Optimization.JetMethod p`:
in dimension `n`, start at `0`; the state `(x_k, σ_k, jet at x_k)` is reconstructed from the answer
history by recursion; the next query is the trial point `x_k + s_k`, `s_k` a (classically chosen)
global minimizer of `m_k` (`Optimization.exists_isMinOn_regularizedModel`); acceptance by the ratio
(4.1.15) using the answer's value; `σ_{k+1} = σ_k` if `ρ_k ≥ η₁`, `γ₂ σ_k` otherwise; after the
Step-1 test holds, the method repeats `x_k`. Lemma (part of node): the reconstructed sequences form
an ARp run (`algorithm_4_1_1`, `ε₂ = ε₃ = none`) whose queries are `y_0 = x_0`,
`y_{k+1} = x_k + s_k`; every accepted iterate `x_k` is a query `y_j` with `j ≤ k`, so
`Optimization.firstStationaryIndex` of the queries is at most the run's termination index.
'''
deps = ["algorithm_4_1_1", "exists_isARpRun", "Optimization.JetMethod", "Optimization.exists_isMinOn_regularizedModel"]
source = "Cartis–Gould–Toint, (4.2.3)"

[[node]]
id = "theorem_4_2_6_ii"
kind = "theorem"
desc = '''
Theorem 4.2.6 (tightness: "the bound (4.2.3) is tight, and ARp has the optimal order of evaluation
complexity for methods in `𝓜(p)`"). For `p ≥ 1`, `P : ARpParams`, `Δ, L > 0`:
(a) (4.2.3) `complexity (methodClassM p) (functionClass Δ L p) ε₁ ≤ κ^A Δ ε₁^{-(p+1)/p} + κ^C` for all
`ε₁ > 0`, with `κ^A`, `κ^C` of Theorem 4.1.5 (i) for `L' = max 1 L` (via `arpOracleMethod` and
`theorem_4_1_5_i`; uniform over the class since `f(0) - inf f ≤ Δ` and the constants do not depend
on `n` or `f`); (b) with Theorem 4.2.6 (i): there are `c, C > 0` and `ε₀ > 0` (depending on
`p, Δ, L, P`) with `c ε₁^{-(p+1)/p} ≤ complexity (methodClassM p) (functionClass Δ L p) ε₁ ≤ C ε₁^{-(p+1)/p}`
for all `ε₁ ∈ (0, ε₀]`. (The book's `O(Δ L^{(p+1)/p} ε^{-(p+1)/p})` in (4.2.3) and the lower bound
`Δ L^{1/p}` differ in their dependence on `L`; only the order in `ε₁` is tight.)
'''
deps = ["theorem_4_2_6_i", "arpOracleMethod", "theorem_4_1_5_i"]
source = "Cartis–Gould–Toint, Theorem 4.2.6, (4.2.3)"
