Lemma 4.2.3: Zero-respecting methods are slow on zero chains

[77, Obs. 2] Let \( {\epsilon }_1 > 0 \) and let \( f \in  \mathcal{F}\left( {\Delta , p}\right) \) be a pth-order zero chain for which

\[
\begin{Vmatrix}{{\nabla }_{x}f\left( x\right) }\end{Vmatrix} > {\epsilon }_{1}\text{ for each }x\text{ such that }{\left\lbrack  x\right\rbrack  }_{n} = 0.\tag{4.2.5}
\]

Then

\[
{\# }_{\epsilon }\left( {{\mathcal{M}}_{{z}_R}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right)  \geq  {\# }_{\epsilon }\left( {{\mathcal{M}}_{{z}_R}\left( p\right) ,\{ f\} }\right)  \geq  n,
\]

where the best worst-case complexity bound \( {\# }_{\epsilon } \) is defined by (4.2.3).

