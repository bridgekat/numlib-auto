Theorem 4.2.4: Connecting the complexity of \( \mathcal{M}\left( p\right) \) and \( {\mathcal{M}}_{\mathrm{ZR}}\left( p\right) \)

For any \( {\epsilon }_1 > 0 \) , we have

\[
{\# }_{\epsilon }\left( {\mathcal{M}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right)  \geq  {\# }_{\epsilon }\left( {{\mathcal{M}}_{\mathrm{ZR}}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right) .
\]

Furthermore, for any function \( f : {\mathbb{R}}^n \rightarrow  \mathbb{R} \in  \mathcal{F}\left( {\Delta , p}\right) \) for which \( {\# }_{\epsilon }\left( {{\mathcal{M}}_{ZR}\left( p\right) ,\{ f\} }\right)  \geq \; \bar{k} \) for some \( \bar{k} \) , we have

\[
{\# }_{\epsilon }\left( {\mathcal{M}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right)  \geq  {\# }_{\epsilon }\left( {\mathcal{M}\left( p\right) ,\left\{  {f}_{u}\right\}  }\right)  \geq  \bar{k},
\]

where \( \left\{  {f}_U\right\} \) is the set of all functions \( {f}_{U} : {\mathbb{R}}^{n + \bar{k}} \rightarrow  \mathbb{R} \) for which \( {f}_U\left( z\right)  = f\left( {{U}^{T}z}\right) \) with \( U \in  O\left( {n + \bar{k}, n}\right) \) .
'''
