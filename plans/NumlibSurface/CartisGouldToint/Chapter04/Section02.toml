Lemma 4.2.5: Properties of the difficult example function

Let \( {f}^D\left( x\right) \) be as defined in (4.2.6). Then

(i) \( {f}^D\left( x\right) \) is a \( p \) th-order zero chain, namely, it satisfies (4.2.4) for any \( p \geq  1 \) ;

(ii) if \( x \in  {\mathbb{R}}^{\bar{k}} \) with \( \left| {\left\lbrack  x\right\rbrack  }_i\right|  < 1 \) for any \( i \leq  \bar{k} \) , then there exists \( j \leq  i \) such that \( \left| {\left\lbrack  x\right\rbrack  }_j\right|  < 1 \) and

\[
\begin{Vmatrix}{{\nabla }_x^1{f}^D\left( x\right) }\end{Vmatrix} \geq  \left| {\frac{\partial {f}^D}{\partial {\left\lbrack  x\right\rbrack  }_j}\left( x\right) }\right|  > 1;
\]

(iii) \( {f}^{\mathrm{D}}\left( 0\right)  - {f}_{\text{ low }}^{\mathrm{D}} \leq  {12}\bar{k} \) ; and

(iv) for every \( p \geq  1,{\nabla }_x^p{f}^{\mathrm{D}}\left( x\right) \) satisfies f.DpL with Lipschitz constant \( {L}_{f,{}^{D}p} \leq \; \exp \left( {\frac{5}{2}p\log p + {c}_{1}p}\right) \) for some constant \( {c}_1 > 0 \) .

