Lemma 4.2.1: Scale-invariance of zero chains

Let \( {\mu }_1 \) and \( {\mu }_2 \neq  0 \) , and suppose that \( f \) is a pth-order zero chain. Then the function \( {\mu }_{1}f\left( {x/{\mu }_2}\right) \) for all \( x \in  {\mathbb{R}}^n \) is also a pth-order zero chain.
'''
