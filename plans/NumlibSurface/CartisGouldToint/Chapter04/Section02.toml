Theorem 4.2.6: Lower complexity bound

Let \( p \geq  1,\Delta  > 0 \) , and \( {\epsilon }_1 > 0 \) . Then there exist positive constants \( {c}_0 \) and \( {c}_1 \) such that

\[
{\# }_{\epsilon }\left( {\mathcal{M}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right)  \geq  {\# }_{\epsilon }\left( {{\mathcal{M}}_{{z}_R}\left( p\right) ,\mathcal{F}\left( {\Delta , p}\right) }\right)  \geq  {c}_0\Delta {\left( \frac{{L}_{f, p}}{{L}_{f, p}^{{D}_p}}\right) }^{1/p}{\epsilon }_1^{-\frac{p + 1}{p}},\tag{4.2.7}
\]

where \( {L}_{f, p} > 0 \) is the Lipschitz constant associated with functions in \( \mathcal{F}\left( {\Delta , p}\right) \) and \( {L}_{f, p} \leq  \exp \left( {\frac{5}{2}p\log p + {c}_{1}p}\right) \) . Furthermore, the bound (4.2.3) is tight, and the ARp algorithm has the optimal order of evaluation complexity for methods in \( \mathcal{M}\left( p\right) \) .

Referenced equation payloads:

Equation (4.2.3):
\[
{\# }_{\epsilon }\left( {\mathcal{M},\mathcal{F}\left( {\Delta , p}\right) }\right)  \leq  \mathop{\sup }\limits_{f \in  \mathcal{F}\left( {\Delta , p}\right) }{k}_{\epsilon }\left( {\mathrm{AR}p, f}\right)  = \mathcal{O}\left( {\Delta {L}_{f, p}^{\frac{p + 1}{p}}{\epsilon }_1^{-\frac{p + 1}{p}}}\right) ,\tag{4.2.3}
\]
'''
