Lemma 4.2.2: Zero-respecting methods applied to zero chains

[77, Obs. 1] Consider a method \( M \in  {\mathcal{M}}_{\mathrm{ZR}}\left( p\right) \) and an objective function \( f : {\mathbb{R}}^n \rightarrow \; \mathbb{R} \in  \mathcal{F}\left( {\Delta , p}\right) \) that is also a pth-order zero chain. Then the iterates \( {\left\{  {x}_k\right\}  }_{k > 0} \) generated by \( M \) satisfy \( {\left\lbrack  {x}_k\right\rbrack  }_j = 0 \) for all \( j \in  \left\lbrack  {k + 1 : n}\right\rbrack \) and all \( k \leq  n - 1 \) .
