[[node]]
id = "theorem_8_2_6"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 8.2.6: Derivatives of the secular function

[Appendix to Chapter 8, p. 477]: Suppose that \( H + {\lambda M} \) is positive definite, that \( s\left( \lambda \right) \) satisfies (8.2.2), and that \( {s}^{\left( 0\right) }\left( \lambda \right) \overset{\text{ def }}{ = }s\left( \lambda \right) \) and \( {\alpha }_{0}\overset{\text{ def }}{ = }1 \) . Then, for \( k = 0,1,\ldots \) , the derivatives of \( \pi \left( \lambda \right)  = \langle s\left( \lambda \right) ,{Ms}\left( \lambda \right) \rangle \) satisfy

\[
{\pi }^{\left( 2k + 1\right) }\left( \lambda \right)  = 2{\alpha }_k\left\langle  {{s}^{\left( k\right) }\left( \lambda \right) , M{s}^{\left( k + 1\right) }\left( \lambda \right) }\right\rangle\tag{8.2.27}
\]

\[
\text{ and }{\pi }^{\left( 2k + 2\right) }\left( \lambda \right)  = {\alpha }_{k + 1}\left\langle  {{s}^{\left( k + 1\right) }\left( \lambda \right) , M{s}^{\left( k + 1\right) }\left( \lambda \right) }\right\rangle  \text{ , }\tag{8.2.28}
\]

where

\[
\left( {H + {\lambda M}}\right) {s}^{\left( k + 1\right) }\left( \lambda \right)  =  - \left( {k + 1}\right) M{s}^{\left( k\right) }\left( \lambda \right)\tag{8.2.29}
\]

and

\[
{\alpha }_{k + 1} = 2\frac{\left( 2k + 3\right) }{\left( k + 1\right) }{\alpha }_{k}.\tag{8.2.30}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 8.2.6 (OCR Markdown line 9754)"
deps = ["secularFunction"]

[[node]]
id = "theorem_8_2_7"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 8.2.7: Trust-region subproblem global optimality

[178, Thm. 2.1],[292, Lem. 2.1]: Any global minimizer \( {s}_{ * } \) of (8.1.2) satisfies the equation

\[
\left( {H + {\lambda }_{ * }M}\right) {s}_{ * } =  - g,\tag{8.2.31}
\]

where \( H + {\lambda }_{ * }M \) is positive semidefinite, \( {\lambda }_{ * } \geq  0 \) , and

\[
{\lambda }_{ * }\left( {{\begin{Vmatrix}{s}_{ * }\end{Vmatrix}}_M^2 - {\Delta }^2}\right)  = 0.\tag{8.2.32}
\]

If \( H + {\lambda }_{ * }M \) is positive definite, then \( {s}_{ * } \) is unique.

Documented source/OCR correction and formalization requirements: Make the ambient feasibility condition explicit: s* belongs to the M-norm closed ball of radius Δ>0; the multiplier characterization is an equivalence for such feasible s*. H is symmetric and M positive definite.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 8.2.7 (OCR Markdown line 9784)"
deps = ["quadraticModel", "weightedNorm"]

[[node]]
id = "theorem_8_2_8"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 8.2.8: Regularization subproblem global optimality

[84, Thm. 3.1],[305, Lem. 10] when \( r = 3 \) ,[151, Thm. 2.3],[218, Sect. 3] for general \( r > 2\rbrack \) : Any global minimizer \( {s}_{ * } \) of (8.1.3) when \( r > 2 \) satisfies (8.2.31), where \( H + {\lambda }_{ * }M \) is positive semidefinite and

\[
{\lambda }_{ * } = \sigma {\begin{Vmatrix}{s}_{ * }\end{Vmatrix}}_M^{r - 2}.\tag{8.2.33}
\]

If \( H + {\lambda }_{ * }M \) is positive definite, then \( {s}_{ * } \) is unique.

Documented source/OCR correction and formalization requirements: Retain the model hypotheses σ>0 and r>2 and all directions in the global-minimum quantifier. The multiplier characterization is an equivalence; positive definiteness implies uniqueness, while semidefiniteness suffices for global optimality.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 8.2.8 (OCR Markdown line 9800)"
deps = ["regularizationSubproblemModel"]

