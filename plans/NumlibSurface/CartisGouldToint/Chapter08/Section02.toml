namespace = "CartisGouldToint"
desc = '''
Secular equations and global optimality characterizations. The secular model is a resolvent of H+λM. Transfer to the M inner product or conjugate by M^(−1/2); no arbitrary inverse at a singular endpoint. Package the spectral representation once. Check strictness and multiple eigenvalues explicitly. Equations retain the textbook numbering.
'''

[[node]]
id = "secularFunction"
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 8.2"

[[node]]
id = "transformedSecularFunction"
kind = "definition"
desc = '''
For real β≠0 define π(λ;β)=π(λ)^β on λ>λs, with g≠0 whenever β<0. Keep the exponent convention 2β on ||s(λ)||_M, from (8.2.17). Define the kth Taylor polynomial t_k(δ)=Σ_(j=0)^k π^(j)(λc)δ^j/j! and transformed first-order t1(δ;β)=π(λc;β)+π′(λc;β)δ.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 8.2"
deps = ["secularFunction"]

