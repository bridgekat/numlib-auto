desc = '''The printed universal SDBA bound needs correction: a tiny t_ini invalidates the claimed accepted-step lower bound independent of t_ini, and a nonpositive ceiling may give zero or negative function budgets. Retain this numbered node as wrong; implement the separately planned corrected theorem.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 2.2.2"
wrong = '''Supplied transcription equations (2.2.6)–(2.2.9) omit the t_ini-limited accepted step and nonnegative ceiling/trial count corrections. For arbitrarily small t_ini the claimed universal per-step lower bound fails and its function budget can be zero or negative. Formalize theorem_2_2_2_corrected.'''

