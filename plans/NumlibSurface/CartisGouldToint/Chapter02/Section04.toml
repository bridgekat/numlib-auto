Lemma 2.4.3: Bound on the number of successful AR1 iterations

Suppose that f.Bb and f.gL hold. Then there exists a positive constant \( {\kappa }_{\mathrm{ARI}}^s \) such that the AR1 algorithm (p. 42) requires at most

\[
{\# }_{\mathrm{{AR1}}}^{SI}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR1}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}}\tag{2.4.11}
\]

successful iterations before an iterate \( {x}_{\epsilon } \) is computed for which \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .
'''
