Lemma 2.4.2: Upper bound on the regularization parameter

Suppose that f.gL holds. Then, for all \( k \geq  0 \) ,

\[
{\sigma }_{k} \leq  {\sigma }_{\max }\overset{\text{ def }}{ = }\max \left\lbrack  {{\sigma }_{0},\frac{{\gamma }_{3}{L}_{f,1}}{2\left( {1 - {\eta }_{2}}\right) }}\right\rbrack  .\tag{2.4.9}
\]
'''
deps = ["ar1Run", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 2.4.2 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 2207)"

[[node]]
id = "lemma_2_4_3"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 2.4.3: Bound on the number of successful AR1 iterations

Suppose that f.Bb and f.gL hold. Then there exists a positive constant \( {\kappa }_{\mathrm{ARI}}^s \) such that the AR1 algorithm (p. 42) requires at most

\[
{\# }_{\mathrm{{AR1}}}^{SI}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR1}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}}\tag{2.4.11}
\]

successful iterations before an iterate \( {x}_{\epsilon } \) is computed for which \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .
'''
deps = ["lemma_2_3_6", "lemma_2_4_2", "lemma_2_4_1", "ar1Run", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 2.4.3 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 2233)"

[[node]]
id = "theorem_2_4_4"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 2.4.4: Complexity of the first-order adaptive-regularization algorithm

Suppose that f.Bb and f.gL hold. Then there exist positive constants \( {\kappa }_{\text{ AR1 }}^{s} \) (see Lemma 2.4.3), \( {\kappa }_{\mathrm{AR1}}^A \) , and \( {\kappa }_{\mathrm{AR1}}^C \) such that the AR1 algorithm (p. 42) requires at most

\[
{\# }_{\mathrm{{AR1}}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR1}}}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}} + {\kappa }_{\mathrm{{AR1}}}^{C} = \mathcal{O}\left( {\epsilon }^{-2}\right)\tag{2.4.12}
\]

function evaluations and at most

\[
{\# }_{\mathrm{{AR1}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{AR1}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}} + 1 = \mathcal{O}\left( {\epsilon }^{-2}\right)
\]

gradient evaluations to compute an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .
'''
deps = ["lemma_2_4_3", "lemma_2_4_1", "lemma_2_4_2", "theorem_2_2_3", "ar1Run", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 2.4.4 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 2283)"

[[node]]
id = "theorem_2_4_5"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 2.4.5: Slow first-order convergence of the AR1 algorithm

The AR1 algorithm (p. 42) applied to minimize a function \( f \) satisfying f.Bb and f.gL may require as many as \( {\epsilon }^{-2} \) evaluations of \( f\left( x\right) \) and \( {\nabla }_x^{1}f\left( x\right) \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .

Thus far, the reader may be unconvinced by the hyperbole with which we started the section. There seems little to choose between linesearch methods such as the SDBA algorithm, trust-region ones like the TR1 algorithm, and the much-heralded AR1 regularization algorithm that we have just encountered. Each of these appears to require at most \( \mathcal{O}\left( {\epsilon }^{-2}\right) \) evaluations to find an \( \epsilon \) -first-order approximate minimizer, and for each there are examples for which this pessimistic bound may be achieved. The most important lessons here are more how each of these methods is structured, and the different tricks at our disposal for analyzing them. Fear not - significant differences that justify our interest will start to emerge from the next chapter onward.
'''
deps = ["lemma_2_3_1", "ar1Run", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 2.4.5 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 2319)"
