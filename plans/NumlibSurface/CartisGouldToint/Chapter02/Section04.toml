[[node]]
id = "lemma_2_4_1"
kind = "theorem"
desc = '''
Semantic specification: Use the generic multiplicative regularization-update counting theorem in Numlib.Optimization.EvaluationComplexity.Updates. Keep σ_min>0 and all logarithm sign conditions; normalize inclusive prefixes explicitly.

Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 2.4.1: Successful and unsuccessful adaptive-regularization iterations

Suppose that the AR1 algorithm is used and that \( {\sigma }_k \leq  {\sigma }_{\max } \) for some \( {\sigma }_{\max } > 0 \) . Then

\[
k \leq  \left| {\mathcal{S}}_k\right| \left( {1 + \frac{\left| \log {\gamma }_1\right| }{\log {\gamma }_2}}\right)  + \frac{1}{\log {\gamma }_2}\log \left( \frac{{\sigma }_{\max }}{{\sigma }_0}\right) .\tag{2.4.8}
\]
'''
deps = ["ar1Run", "objectiveRegularity"]
source = "Cartis–Gould–Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 2.4.1 (evaluation-complexity-of-algorithms-for-nonconvex-optimization.md, line 2171)"

