namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 2, Section 4.

Separate the general multiplicative regularization-update counting theorem into Numlib.Optimization.EvaluationComplexity.Updates; its source leaf is Lemma 2.4.1. AR1 is quadratic regularization of the linear Taylor polynomial and its exact model minimizer is −g/σ. Retain the minimum regularization parameter and all three acceptance cases.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

The last class of methods we shall describe in this chapter are adaptive-regularization algorithms. As we will discover as the book evolves, these are highly significant. In particular, to date, they provide the lowest \( {}^{13} \) worst-case evaluation-complexity bounds of all known algorithms for unconstrained problems, independent of the order of derivatives used.

Adaptive-regularization algorithms are closely related to trust-region methods in that they also use a model whose purpose is to approximate the objective function in a neighbourhood of the current iterate. While trust-region methods define this neighbourhood explicitly (by specifying a trust-region radius), adaptive-regularization methods define it implicitly by penalizing long steps. This is achieved by adding a regularization term, comprising a regularization parameter \( {}^{14} \) multiplied by a specific power of the steplength, to an unregularized model of \( f \) . A trial point is then computed by (approximately) minimizing this regularized model. As for trust-region methods, the achieved objective-function reduction at the trial point is compared to that predicted by the unregularized model. The trial point is accepted as the next iterate if the ratio of actual to predicted reductions is large enough, and the regularization parameter allowed to decrease, thereby encouraging longer steps. Conversely, if this ratio is small, the trial point is rejected, and the regularization parameter increased, with the aim of shortening the next attempted step.

The rationale behind the regularization parameter update is given by the important overestimation property (A.19) in Corollary A.8.4 (p. 437): this property states that the regularized model must be an overestimate of the true objective function whenever the regularization parameter is large enough (and exceeds the associated Lipschitz constant). While this argument may seem somewhat fuzzy at this stage, in particular because we have not yet defined the unregularized and regularized models, the power of that estimation property will become clear as we proceed.

#### 2.4.1 The AR1 algorithm

When solving the unconstrained minimization problem (2.1.1) using first-order information, the corresponding adaptive-regularization algorithm (AR1) once again proceeds by iteration. Given an iterate \( {x}_k \) , the method uses the regularized model

\[
{m}_{k}\left( s\right) \overset{\text{ def }}{ = }f\left( {x}_{k}\right)  + \left\langle  {{\nabla }_{x}^{1}f\left( {x}_{k}\right) , s}\right\rangle   + \frac{1}{2}{\sigma }_{k}\parallel s{\parallel }^{2} = {T}_{f,1}\left( {{x}_{k}, s}\right)  + \frac{1}{2}{\sigma }_{k}\parallel s{\parallel }^{2},\tag{2.4.1}
\]

where \( {T}_{f,1}\left( {{x}_k, s}\right) \) is the first-order Taylor-series expansion of \( f \) around \( {x}_k \) (the unregularized model) and where \( \frac{1}{2}{\sigma }_k\parallel s{\parallel }^2 \) is the regularization term involving the regularization parameter \( {\sigma }_k > 0 \) . A step \( {s}_k \) is then computed by minimizing \( {m}_k\left( s\right) \) . The remainder of the AR1 algorithm proceeds as we have outlined in the paragraph above. The complete AR1 algorithm is formally stated as follows.

Algorithm 2.4.1: Adaptive-regularization algorithm with a first-order model (AR1)

Step 0: Initialization. An initial point \( {x}_0 \) , an accuracy level \( \epsilon  > 0 \) , and an initial regularization parameter \( {\sigma }_0 > 0 \) are given. The constants \( {\eta }_1,{\eta }_2,{\gamma }_1 \) , \( {\gamma }_2,{\gamma }_3 \) , and \( {\sigma }_{\min } \) are also given and satisfy

\[
{\sigma }_{\min } \in  \left( {0,{\sigma }_{0}}\right\rbrack  ,\;0 < {\eta }_{1} \leq  {\eta }_{2} < 1,\text{ and }0 < {\gamma }_{1} < 1 < {\gamma }_{2} < {\gamma }_{3}.\tag{2.4.2}
\]

Compute \( f\left( {x}_0\right) \) and \( {\nabla }_x^{1}f\left( {x}_0\right) \) , and set \( k = 0 \) .

---

\( {}^{13} \) Recent competitors, often hybrids, have sometimes achieved as good bounds, but never better ones. We shall discuss these at the appropriate time.

\( {}^{14} \) Sometimes referred to as the regularization weight.

---

Step 1: Test for termination. If \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix} \leq  \epsilon \) , terminate with the \( \epsilon \) - approximate first-order minimizer \( {x}_{\epsilon } = {x}_k \) .

Step 2: Step computation. Let

\[
{s}_k = \underset{s \in  {\mathbb{R}}^n}{\arg \min }{m}_k\left( s\right) .
\]

Step 3: Acceptance of the trial point. Compute \( f\left( {{x}_k + {s}_k}\right) \) , and define

\[
{\rho }_k = \frac{f\left( {x}_k\right)  - f\left( {{x}_k + {s}_k}\right) }{{T}_{f,1}\left( {{x}_k,0}\right)  - {T}_{f,1}\left( {{x}_k,{s}_k}\right) }.\tag{2.4.3}
\]

If \( {\rho }_k \geq  {\eta }_1 \) , then define \( {x}_{k + 1} = {x}_k + {s}_k \) and compute \( {\nabla }_x^{1}f\left( {x}_{k + 1}\right) \) . Otherwise define \( {x}_{k + 1} = {x}_k \) .

Step 4: Regularization parameter update. Set

\[
{\sigma }_{k + 1} \in  \left\{  \begin{array}{ll} \left\lbrack  {\max \left( {{\sigma }_{\min },{\gamma }_{1}{\sigma }_{k}}\right) ,{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \geq  {\eta }_{2}, \\  \left\lbrack  {{\sigma }_{k},{\gamma }_{2}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \in  \left\lbrack  {{\eta }_{1},{\eta }_{2}}\right) , \\  \left\lbrack  {{\gamma }_{2}{\sigma }_{k},{\gamma }_{3}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} < {\eta }_{1}. \end{array}\right.\tag{2.4.4}
\]

Increment \( k \) by one and go to Step 1.

In this description, reasonable values for the constants of (2.4.2) might be \( {\eta }_1 = {0.01} \) , \( {\eta }_2 = {0.9},{\gamma }_1 = 2 \) , and \( {\gamma }_2 = {\gamma }_3 = {0.5} \) .

For this very simple first-order case, it is easy to verify that \( {m}_k\left( s\right) \) is strongly convex and that its (global) minimizer is obtained at

\[
{s}_k = \underset{s \in  {\mathbb{R}}^n}{\arg \min }{m}_k\left( s\right)  =  - \frac{{\nabla }_x^{1}f\left( {x}_k\right) }{{\sigma }_k}.\tag{2.4.5}
\]

Observe that (2.4.5) and the definition of \( {T}_{f,1}\left( {{x}_k, s}\right) \) in (2.4.1) ensure that

\[
{T}_{f,1}\left( {{x}_k,0}\right)  - {T}_{f,1}\left( {{x}_k,{s}_k}\right)  = \frac{{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_k\right) \end{Vmatrix}}^2}{{\sigma }_k}\tag{2.4.6}
\]

and hence that we may rewrite (2.4.3) as

\[
{\rho }_k = {\sigma }_k\frac{f\left( {x}_k\right)  - f\left( {{x}_k + {s}_k}\right) }{{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_k\right) \end{Vmatrix}}^2}.\tag{2.4.7}
\]

Notice that (2.4.3) is identical to (2.3.6), and that the TR1 and AR1 algorithms are similar in many other aspects. However, the AR1 algorithm differs from the gradient-related linesearch methods of Section 2.2.3.5 and the TR1 algorithm in that its step is always a multiple of the steepest-descent direction because of (2.4.5). Indeed, it may not have escaped the reader's attention that the AR1 algorithm may also be viewed as a reformulation of the SDBA method where an attempt is made - via the minimization of the regularized model (2.4.1), which itself depends on the adaptive-regularization parameter \( {\sigma }_k \) -to determine a good value of \( {t}_{\text{ ini }} \) at each iteration. Such similarities between line-search and regularization methods are peculiar to first-order models; as we shall see in later chapters, the search directions resulting from higher-order regularized models almost always change direction as the regularization parameter increases, while a linesearch method persists in the same direction until it succeeds.

We now define the sets of successful and unsuccessful iterations as with the TR1 algorithm using (2.3.10). As was the case then, we bound the number of unsuccessful iterations by a multiple of the number of successful ones. The proof of the next lemma is very close in spirit to that of Lemma 2.3.1.
'''

