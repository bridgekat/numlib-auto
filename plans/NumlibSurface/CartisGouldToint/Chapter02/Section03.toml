Lemma 2.3.4: Lower bound for the trust-region radius

Suppose that f.gL and m.HBa hold. Then we have that

\[
{\Delta }_k \geq  \frac{{\gamma }_1\left( {1 - {\eta }_2}\right) }{2\left( {{L}_{f,1} + {\kappa }_B}\right) }\min \left\lbrack  {1,\frac{{\Delta }_0}{\begin{Vmatrix}{\nabla }_x^{1}f\left( {x}_0\right) \end{Vmatrix}}}\right\rbrack  \mathop{\min }\limits_{i \in  \left\lbrack  {0 : k}\right\rbrack  }\begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_i\right) }\end{Vmatrix}\tag{2.3.17}
\]

for all \( k \geq  0 \) .
'''
