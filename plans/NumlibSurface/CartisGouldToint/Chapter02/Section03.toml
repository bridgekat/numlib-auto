Lemma 2.3.6: Bound on the number of successful TR1 iterations

Suppose that f.Bb, f.gL, and m.HBa hold. Then there exists a positive constant \( {\kappa }_{\mathrm{TR1}}^s \) such that, for any \( \epsilon  > 0 \) , the TR1 algorithm (p. 35) requires at most

\[
{\# }_{\mathrm{{TR1}}}^{SI}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR1}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}}
\]

successful iterations before an iterate \( {x}_{\epsilon } \) is computed for which \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .
'''
