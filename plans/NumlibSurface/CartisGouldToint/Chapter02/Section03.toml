[[node]]
id = "theorem_2_3_7"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 2.3.7: Complexity of the first-order trust-region algorithm

Suppose that f.Bb, f.gL, and m.HBa hold. Then there exist positive constants \( {\kappa }_{\mathrm{TR}1}^S \) (see Lemma 2.3.6), \( {\kappa }_{\mathrm{TR}1}^A,{\kappa }_{\mathrm{TR}1}^B \) , and \( {\kappa }_{\mathrm{TR}1}^C \) such that the TR1 algorithm (p. 35) requires at most

\[
{\# }_{\mathrm{{TRI}}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TRI}}}^{A}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}} + {\kappa }_{\mathrm{{TRI}}}^{B}\left| {\log \epsilon }\right|  + {\kappa }_{\mathrm{{TRI}}}^{C} = \mathcal{O}\left( {\epsilon }^{-2}\right)
\]

function evaluations and at most

\[
{\# }_{\mathrm{{TR1}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{TR1}}}^{S}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{{\epsilon }^{2}} + 1 = \mathcal{O}\left( {\epsilon }^{-2}\right)
\]

gradient evaluations to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  \epsilon \) .
'''
