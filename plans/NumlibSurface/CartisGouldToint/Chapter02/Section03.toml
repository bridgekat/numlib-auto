Lemma 2.3.3: Condition for a successful iteration

Suppose that f.gL and m.HBa hold and that

\[
{\Delta }_k < \frac{\left( {1 - {\eta }_2}\right) \begin{Vmatrix}{{\nabla }_x^{1}f\left( {x}_k\right) }\end{Vmatrix}}{2\left( {{L}_{f,1} + {\kappa }_B}\right) }.\tag{2.3.15}
\]

Then \( {\rho }_k \geq  {\eta }_2 \) , iteration \( k \) is successful, and \( {\Delta }_{k + 1} \geq  {\Delta }_k \) .
'''
