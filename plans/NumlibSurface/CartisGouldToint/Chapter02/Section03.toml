kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 2.3.5: Model decrease (TR1)

Suppose that f.gL and m.HBa hold. Then we have that, for all \( k \geq  0 \) ,

\[
{m}_{k}\left( {x}_{k}\right)  - {m}_{k}\left( {{x}_{k} + {s}_{k}}\right)  \geq  {\kappa }_{\text{ decr }}\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{k}\right) }\end{Vmatrix}\mathop{\min }\limits_{{i \in  \left\lbrack  {0 : k}\right\rbrack  }}\begin{Vmatrix}{{\nabla }_{x}^{1}f\left( {x}_{i}\right) }\end{Vmatrix},\tag{2.3.19}
\]

where

\[
{\kappa }_{\text{ decr }}\overset{\text{ def }}{ = }\frac{1}{2}\min \left\lbrack  {\frac{1}{1 + {\kappa }_{B}},\frac{{\gamma }_{1}\left( {1 - {\eta }_{2}}\right) }{2\left( {{L}_{f,1} + {\kappa }_{B}}\right) }\min \left\lbrack  {1,\frac{{\Delta }_{0}}{\begin{Vmatrix}{\nabla }_{x}^{1}f\left( {x}_{0}\right) \end{Vmatrix}}}\right\rbrack  }\right\rbrack  .\tag{2.3.20}
\]
'''
