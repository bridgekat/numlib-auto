namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 6, Section 1.

The first- and third-order measures in OCR (6.1.5) and (6.1.9) have missing leading minus signs. Use minus the minimum so all measures are nonnegative (d=0 is feasible); this agrees with (7.1.2) and all decrease bounds. C.CNe alone does not guarantee an objective minimizer (contrary to introductory prose); require attainment only where it is actually used. Compactness of feasible directions intersected with the unit ball ensures the criticality minima exist.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

We next consider how we might modify the regularization methods introduced in Chapters 2,3, and 4 to cope with the additional restriction that the variables \( x \) might be constrained. We start with the simple case in which the constraints are convex, and in particular \( x \in  \mathcal{C} \) , where we assume the following throughout.

C.CNe The constraint set \( \mathcal{C} \) is a closed, convex, nonempty subset of \( {\mathbb{R}}^n \) .

This ensures that the optimization problem in question,

\[
\mathop{\operatorname{minimize}}\limits_{{x \in  \mathcal{C}}}f\left( x\right)\tag{6.1.1}
\]

has a solution, and we remind the reader that Theorem 1.1.2 provides both necessary and sufficient optimality conditions in this case.

#### 6.1.1 Approximate optimality conditions

Before we develop a suitable algorithm for (6.1.1), we need to formalize our aims. We consider

\[
\mathcal{C}\left( x\right) \overset{\text{ def }}{ = }\left\{  {d \in  {\mathbb{R}}^{n} \mid  x + d \in  \mathcal{C}}\right\}  ,\tag{6.1.2}
\]

the set of feasible steps from a given \( x \in  \mathcal{C} \) (as we defined in (1.1.7) on p. 4), as well as the Euclidean unit ball

\[
\mathcal{B}\overset{\text{ def }}{ = }\left\{  {d \in  {\mathbb{R}}^{n} \mid  \parallel d\parallel  \leq  1}\right\}\tag{6.1.3}
\]

In view of (1.1.10), we say that \( {x}_{\epsilon } \) is an \( {\epsilon }_1 \) -approximate first-order minimizer of \( f \) within \( \mathcal{C} \) if

\[
{\omega }_{f,\mathcal{C},1}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_1\tag{6.1.4}
\]

holds for given \( {\epsilon }_1 > 0 \) , where the first-order criticality measure [131, Thm. 12.1.6] is

\[
{\omega }_{f,\mathcal{C},1}\left( x\right) \overset{\text{ def }}{ = }\mathop{\min }\limits_{{d \in  \mathcal{C}\left( x\right)  \cap  \mathcal{B}}}\left\langle  {d,{\nabla }_{x}^{1}f\left( x\right) }\right\rangle   \geq  0.\tag{6.1.5}
\]

By analogy, and in view of (1.1.11), \( {x}_{\epsilon } \) is an \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer if (6.1.4) and

\[
{\omega }_{f,\mathcal{C},2}\left( {{x}_{\epsilon },{\epsilon }_1}\right)  \leq  {\epsilon }_2\tag{6.1.6}
\]

hold for given \( \left( {{\epsilon }_1,{\epsilon }_2}\right)  > 0 \) , where the second-order measure is

\[
{\omega }_{f,\mathcal{C},2}\left( {x,{\epsilon }_{1}}\right) \overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{C}}^{1}\left( {x,{\epsilon }_{1}}\right)  \cap  \mathcal{B}}}\left\langle  {d,{\nabla }_{x}^{2}f\left( x\right) d}\right\rangle   \geq  0\tag{6.1.7}
\]

and the set of first-order \( \alpha \) -restricted feasible steps is

\[
{\mathcal{C}}^{1}\left( {x,\alpha }\right) \overset{\text{ def }}{ = }\left\{  {d \in  \mathcal{C}\left( x\right) \left| \right| \left\langle  {d,{\nabla }_{x}^{1}f\left( x\right) }\right\rangle   \mid   \leq  {\tau }_{1}\alpha }\right\}\tag{6.1.8}
\]

for a prespecified \( {\tau }_1 \in  \left( {0,1}\right) \) and for some \( \alpha  > 0 \) that may depend on \( {\epsilon }_1 \) . Strictly, we must be cautious as it is by no means obvious that \( {\omega }_{f,\mathcal{C},2}\left( {x,{\epsilon }_1}\right) \) is a criticality measure. Indeed, a simple example [309, Rem. 2.4] illustrates that the related measure \( {\omega }_{f,\mathcal{C},2}\left( {x,0}\right) \) might not necessarily be continuous. For this example, there is a path to the (exact) first-order minimizer that does not reveal negative curvature in \( {\mathcal{C}}^1\left( {x,0}\right) \) until the limit is reached. However the enlarged feasibility set \( {\mathcal{C}}^1\left( {x,{\epsilon }_1}\right) \) for \( {\epsilon }_1 > 0 \) prevents such unfortunate behaviour, since feasible negative curvature is always exposed to some extent.

More generally, and bearing in mind (1.1.12), \( {x}_{\epsilon } \) is an \( \left( {{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right) \) -approximate third-order minimizer if (6.1.4), (6.1.6), and

\[
{\omega }_{f,\mathcal{C},3}\left( {{x}_{\epsilon },{\epsilon }_1,{\epsilon }_2}\right)  \leq  {\epsilon }_3
\]

hold for given \( \left( {{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right)  > 0 \) , where the third-order measure is

\[
{\omega }_{f,\mathcal{C},3}\left( {x,{\epsilon }_{1},{\epsilon }_{2}}\right) \overset{\text{ def }}{ = }\mathop{\min }\limits_{{d \in  {\mathcal{C}}^{2}\left( {x,{\epsilon }_{1},{\epsilon }_{2}}\right)  \cap  \mathcal{B}}}{\nabla }_{x}^{3}f\left( x\right) {\left\lbrack  d\right\rbrack  }^{3} \geq  0\tag{6.1.9}
\]

and the set of second-order \( \left( {{\alpha }_1,{\alpha }_2}\right) \) -restricted feasible steps is

\[
{\mathcal{C}}^{2}\left( {x,{\alpha }_{1},{\alpha }_{2}}\right) \overset{\text{ def }}{ = }\left\{  {d \in  {\mathcal{C}}^{1}\left( {x,{\alpha }_{1}}\right) \left| \right| \left\langle  {d,{\nabla }_{x}^{2}f\left( x\right) d}\right\rangle   \mid   \leq  {\tau }_{2}{\alpha }_{2}}\right\}\tag{6.1.10}
\]

for a prespecified \( {\tau }_2 \in  \left( {0,1}\right) \) and for some \( \left( {{\alpha }_1,{\alpha }_2}\right)  > 0 \) that may depend on \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) . Letting \( {\tau }_1\alpha  = {\tau }_1{\alpha }_1 = {\epsilon }_1 \) and \( {\tau }_2{\alpha }_2 = {\epsilon }_2 \) in these conditions is equivalent to our previously stated conditions in the unconstrained case, namely, (3.2.6), (4.1.3), and (4.1.4).

It is worth remarking at this point that computing the first-order measure \( {\omega }_{f,\mathcal{C},1}\left( x\right) \) requires the solution of a convex optimization problem and is thus achievable in polynomial time [299, Sect. 2.2]. By contrast, the problems that define \( {\omega }_{f,\mathcal{C},2}\left( {x,{\epsilon }_1}\right) \) and \( {\omega }_{f,\mathcal{C},3}\left( {x,{\epsilon }_1,{\epsilon }_2}\right) \) are nonconvex, and certainly the former may be NP-hard \( {}^{45} \) even for simple convex sets \( \mathcal{C}\left\lbrack  {{295},{309}}\right\rbrack \) . Additionally, although we defined the unit ball (6.1.3) that we use to assess criticality in terms of the Euclidean norm, this is by no means necessary \( {}^{46} \) since all norms are equivalent in finite dimensions (see Appendix A.2). In particular, it is sometimes convenient to pick a norm that aligns with \( \mathcal{C} \) -for example, the infinity norm \( \parallel  \cdot  {\parallel }_{\infty } \) is often preferred in practice for box constraints/simple bounds \( \mathcal{C} = \left\{  {x \mid  {x}^{\mathrm{L}} \leq  x \leq  {x}^{\mathrm{U}}}\right\}  . \)
'''

