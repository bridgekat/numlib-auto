namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 6, Section 2.

Use the corrected signed criticality measures from Section 6.1. The algorithm maintains x_k and x_k+s_k in C and uses model criticality measures on translated feasible sets. f.DpL.C is ContDiff on an open neighborhood of C and a D^p Lipschitz bound for x,y∈C; C need not be bounded. ARp1-CC is the first-order variant with its distinct step test.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

#### 6.2.1 The ARp-CC algorithm

The resulting ARp-CC algorithm is the obvious generalization of the ARp algorithm (p. 100) to cope with convex constraints. Progress at the \( k \) th iteration is ensured by computing a step \( {s}_k \) to approximately minimize the model \( {m}_k\left( s\right) \) defined in (4.1.2) within the region \( {x}_k + s \in  \mathcal{C} \) . To be precise, consider the model counterpart of the special feasible sets (6.1.2), (6.1.8), and (6.1.10), namely,

\[
\begin{gathered}{\mathcal{M}}_{k}^{0}\left( s\right) \overset{\text{ def }}{ = }\mathcal{C}\left( {{x}_{k} + s}\right) \\ {\mathcal{M}}_{k}^{1}\left( s\right) \overset{\text{ def }}{ = }\left\{  {d \in  {\mathcal{M}}_{k}^{0}\left( s\right) \left| \right| \left\langle  {d,{\nabla }_{s}^{1}{m}_{k}\left( s\right) }\right\rangle   \mid   \leq  {\theta }_{1}{\epsilon }_{1}}\right\}\end{gathered}\tag{6.2.1}
\]

and

\[
{\mathcal{M}}_{k}^{2}\left( s\right) \overset{\text{ def }}{ = }\left\{  {d \in  {\mathcal{M}}_{k}^{1}\left( s\right) \left| \right| \left\langle  {d,{\nabla }_{s}^{2}{m}_{k}\left( s\right) d}\right\rangle   \mid   \leq  {\theta }_{2}{\epsilon }_{2}}\right\}\tag{6.2.2}
\]

for given \( {\theta }_1,{\theta }_2 > 0 \) . We stop as soon as all of the approximate first- to third-order criticality measures,

\[
{\omega }_{{m}_{k},\mathcal{M},1}\left( s\right) \overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{0}\left( s\right)  \cap  \mathcal{B}}}\left\langle  {d,{\nabla }_{s}^{1}{m}_{k}\left( s\right) }\right\rangle   \geq  0,\tag{6.2.3}
\]

\[
{\omega }_{{m}_{k},\mathcal{M},2}\left( s\right) \overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{1}\left( s\right)  \cap  \mathcal{B}}}\left\langle  {d,{\nabla }_{s}^{2}{m}_{k}\left( s\right) d}\right\rangle   \geq  0\tag{6.2.4}
\]

and

\[
{\omega }_{{m}_{k},\mathcal{M},3}\left( s\right) \overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{2}\left( s\right)  \cap  \mathcal{B}}}{\nabla }_{s}^{3}{m}_{k}\left( s\right) {\left\lbrack  d\right\rbrack  }^{3} \geq  0,\tag{6.2.5}
\]

are sufficiently small. Notice that these are appropriate variants of (6.1.5), (6.1.7), and (6.1.9) for the model, and in particular, these will all be small in the neighbourhood of any third-order critical point or global minimizer of \( {m}_k\left( s\right) \) .

We state the algorithm formally on the following page. But before we do so, it is important to recognize that we are making the tacit assumption that computing the criticality measures for the objective function \( f \) in the previous section and those for the model \( {m}_k \) here is easy. In particular, it requires that ensuring feasibility does not constitute a significant cost. The measures themselves only depend on \( f \) and its derivatives at the current iterate (a cost that we shall consider), but they also require that we maintain feasibility with respect to \( \mathcal{C} \) (a cost that we shall discount). For some convex regions (e.g., when the minimization variables have lower and upper bounds or must stay inside a hypersphere), this is a reasonable assumption, but for others it might not be. We will make this distinction more precise in Section 14.2, where we refer to such constraints as simple. The abstract setting " \( x \in  \mathcal{C} \) " is usually realized either by consulting an inclusion oracle (to answer the question "is \( x \) in \( \mathcal{C} \) or not?") or by requiring a means to find the projection \( {P}_{\mathcal{C}}\left\lbrack  x\right\rbrack \) of any \( x \) into \( \mathcal{C} \) , that is, to compute

\[
{P}_{\mathcal{C}}\left\lbrack  x\right\rbrack   = \underset{y \in  \mathcal{C}}{\arg \min }\parallel x - y\parallel\tag{6.2.6}
\]

---

\( {}^{45} \) This need not always be the case; some sets \( \mathcal{C} \) are special [288].

\( {}^{46} \) Although other norms may change constants in the stated complexity bounds.

---

the set \( \mathcal{C} \) may have either a geometric or an algebraic description. If convex constraints are so expensive to evaluate that we cannot discount the cost of the inclusion oracle or projection, then we may be forced instead to consider them as general constraints, a topic that we shall not embrace until our next chapter.

Algorithm 6.2.1: Adaptive-regularization algorithm with \( p \) th-order models and convex constraints (ARp-CC)

Step 0: Initialization. An initial point \( {x}_0 \in  \mathcal{C} \) ; accuracy thresholds \( {\epsilon }_1 > 0 \) , \( {\epsilon }_2 > 0,{\epsilon }_3 > 0,{\tau }_1 \in  \left( {0,1}\right) ,{\tau }_2 \in  \left( {0,1}\right) \) ; and an initial regularization parameter \( {\sigma }_0 > 0 \) are given. The constants \( {\eta }_1,{\eta }_2,{\gamma }_1,{\gamma }_2,{\gamma }_3,{\theta }_1,{\theta }_2,{\theta }_3 \) , and \( {\sigma }_{\min } \) are also given and satisfy

\[
\begin{gathered}{\sigma }_{\min } \in  \left( {0,{\sigma }_0}\right\rbrack  ,{\theta }_1,{\theta }_2,{\theta }_3 \in  \left( {0,1}\right) ,0 < {\eta }_1 \leq  {\eta }_2 < 1 \\ 0 < {\gamma }_1 < 1 < {\gamma }_2 < {\gamma }_3 \\ \frac{1}{2}\left\lbrack  {1 + {\tau }_{1}}\right\rbrack   \leq  {\theta }_{1} < 1,\text{ and }\frac{1}{2}\left\lbrack  {1 + {\tau }_{2}}\right\rbrack   \leq  {\theta }_{2} < 1.\end{gathered}\tag{6.2.7}
\]

Compute \( f\left( {x}_0\right) \) , and set \( k = 0 \) .

Step 1: Test for termination. If \( {\epsilon }_2 = {\epsilon }_3 = \infty \) and

\[
{\omega }_{f,\mathcal{C},1}\left( {x}_k\right)  \leq  {\epsilon }_1\tag{6.2.8}
\]

terminate with the \( {\epsilon }_1 \) -approximate first-order minimizer \( {x}_{\epsilon } = {x}_k \) .

If \( {\epsilon }_2 < \infty \) and \( {\epsilon }_3 = \infty ,\left( {6.2.8}\right) \) holds, and

\[
{\omega }_{f,\mathcal{C},2}\left( {{x}_k,{\epsilon }_1}\right)  \leq  {\epsilon }_2\tag{6.2.9}
\]

terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2}\right) \) -approximate second-order minimizer \( {x}_{\epsilon } = {x}_k \) . If \( {\epsilon }_3 < \infty ,\left( {6.2.8}\right) \) and (6.2.9) hold, and

\[
{\omega }_{f,\mathcal{C},3}\left( {{x}_k,{\epsilon }_1,{\epsilon }_2}\right)  \leq  {\epsilon }_3
\]

terminate with the \( \left( {{\epsilon }_1,{\epsilon }_2,{\epsilon }_3}\right) \) -approximate third-order minimizer \( {x}_{\epsilon } = {x}_k \) .

Step 2: Step computation. Compute a step \( {s}_k \in  \mathcal{C}\left( {x}_k\right) \) such that

\[
{m}_k\left( {s}_k\right)  < {m}_k\left( 0\right)
\]

where \( {m}_k\left( s\right) \) is given by (4.1.2), and

\[
{\omega }_{{m}_k,\mathcal{M},1}\left( {s}_k\right)  \leq  {\theta }_1{\epsilon }_1\tag{6.2.10}
\]

and, if \( {\epsilon }_2 < \infty \) ,

\[
{\omega }_{{m}_k,\mathcal{M},2}\left( {s}_k\right)  \leq  {\theta }_2{\epsilon }_2\tag{6.2.11}
\]

and, if also \( {\epsilon }_3 < \infty \) ,

\[
{\omega }_{{m}_k,\mathcal{M},3}\left( {s}_k\right)  \leq  {\theta }_3{\epsilon }_3\tag{6.2.12}
\]

Step 3: Acceptance of the trial point. Compute \( f\left( {{x}_k + {s}_k}\right) \) , and define

\[
{\rho }_k = \frac{f\left( {x}_k\right)  - f\left( {{x}_k + {s}_k}\right) }{{T}_{f, p}\left( {{x}_k,0}\right)  - {T}_{f, p}\left( {{x}_k,{s}_k}\right) }.
\]

If \( {\rho }_k \geq  {\eta }_1 \) , then define \( {x}_{k + 1} = {x}_k + {s}_k \) . Otherwise define \( {x}_{k + 1} = {x}_k \) .

Step 4: Regularization parameter update. Set

\[
{\sigma }_{k + 1} \in  \left\{  \begin{array}{ll} \left\lbrack  {\max \left( {{\sigma }_{\min },{\gamma }_{1}{\sigma }_{k}}\right) ,{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \geq  {\eta }_{2}, \\  \left\lbrack  {{\sigma }_{k},{\gamma }_{2}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} \in  \left\lbrack  {{\eta }_{1},{\eta }_{2}}\right) \\  \left\lbrack  {{\gamma }_{2}{\sigma }_{k},{\gamma }_{3}{\sigma }_{k}}\right\rbrack  & \text{ if }{\rho }_{k} < {\eta }_{1}. \end{array}\right.
\]

Increment \( k \) by one and go to Step 1 .

#### 6.2.2 Complexity of finding approximate first- to third-order minimizers over convex sets

Much of the analysis follows the same pattern as that given in Section 4.1.2 for the unconstrained case. We do need, however, to adjust the objective boundedness and Lipschitz assumptions that we rely on.

f.bB.C

\( f\left( x\right) \) is bounded below on \( \mathcal{C} \) ; that is, there exists a constant \( {f}_{\text{ low }} \) such that, for all \( x \in  \mathcal{C} \) ,

\[
f\left( x\right)  \geq  {f}_{\text{ low }}.
\]

f.DpL.C

\( f\left( x\right) \) is \( p \) -times continuously differentiable on an open set \( {}^a\mathcal{D} \) containing \( \mathcal{C} \) , and its \( p \) th-order derivative tensor \( {\nabla }_x^{p}f\left( x\right) \) is Lipschitz continuous on \( \mathcal{C} \) ; that is, there exists a constant \( {L}_{f, p} \geq  0 \) such that

\[
\begin{Vmatrix}{{\nabla }_x^{p}f\left( x\right)  - {\nabla }_x^{p}f\left( y\right) }\end{Vmatrix} \leq  {L}_{f, p}\parallel x - y\parallel
\]

for all \( x, y \in  \mathcal{C} \) .

\( {}^a \) The set \( \mathcal{D} \) is a convenience; we could instead have relied on properties in \( \mathcal{C} \) had we used Jordan's definition of continuity rather than Weierstrass's.

Lemmas 4.1.1 and (under f.DpL.C) 4.1.2 continue to hold, so we turn to deriving useful lower bounds on the step generated by the algorithm.
'''

