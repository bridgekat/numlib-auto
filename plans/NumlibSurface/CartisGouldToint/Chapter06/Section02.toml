kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 6.2.2: Bounds on the successful function decrease for \( {\mathrm{AR}}_P - \mathrm{CC} \)

Suppose that C.CNe and f.DpL.C hold and that iteration \( k \) of the ARp-CC algorithm is successful. Then if \( {\omega }_{f,\mathcal{C},1}\left( {x}_{k + 1}\right)  > {\epsilon }_1 \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  > {\kappa }_1^{cc}{\epsilon }_1^{\frac{p + 1}{p}},
\]

where

\[
{\kappa }_{1}^{cc}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{p!}{\left( \frac{p!\left( {1 - {\theta }_{1}}\right) }{{L}_{f, p} + {\sigma }_{\max }}\right) }^{\frac{p + 1}{p}}.
\]

If additionally \( {\epsilon }_2 < \infty \) and \( {\omega }_{k + 1,2} > {\epsilon }_2 \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  > {\kappa }_2^{cc}{\epsilon }_2^{\frac{p + 1}{p - 1}},
\]

where

\[
{\kappa }_{2}^{\mathrm{{CC}}}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{p!}{\left( \frac{\left( {p - 1}\right) !\left( {1 - {\theta }_{2}}\right) }{{L}_{f, p} + {\sigma }_{\max }}\right) }^{\frac{p + 1}{p - 1}}
\]

and \( {\omega }_{k + 1,2} \) is defined in (6.2.14), and if \( {\epsilon }_3 < \infty \) and \( {\omega }_{k + 1,3} > {\epsilon }_3 \) , then

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  > {\kappa }_3^{cc}{\epsilon }_3^{\frac{p + 1}{p - 2}},
\]

where

\[
{\kappa }_{3}^{\mathrm{{CC}}}\overset{\text{ def }}{ = }\frac{{\eta }_{1}{\sigma }_{\min }}{p!}{\left( \frac{\left( {p - 2}\right) !\left( {1 - {\theta }_{3}}\right) }{{L}_{f, p} + {\sigma }_{\max }}\right) }^{\frac{p + 1}{p - 2}}
\]

and \( {\omega }_{k + 1,3} \) is defined by (6.2.16).

We are now ready to establish an evaluation-complexity bound for the ARp-CC algorithm.

Referenced equation payloads:

Equation (6.2.14):
\[
{\omega }_{k + 1,2}\overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{1}\left( {s}_{k}\right)  \cap  \mathcal{B}}}{\nabla }_{x}^{2}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^{2} \geq  0,\tag{6.2.14}
\]

Equation (6.2.16):
\[
{\omega }_{k + 1,3}\overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{2}\left( {s}_{k}\right)  \cap  \mathcal{B}}}{\nabla }_{x}^{3}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^{3} \geq  0,\tag{6.2.16}
\]
'''
