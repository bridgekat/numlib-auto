[[node]]
id = "lemma_6_2_1"
kind = "theorem"
desc = '''
Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Lemma 6.2.1: Lower bounds on the length of the step for ARp-CC

Suppose that C.CNe and f.DpL.C hold. Then on every successful iteration \( k \) of the ARp-CC algorithm (p. 180), if \( {\omega }_{f,\mathcal{C},1}\left( {x}_{k + 1}\right)  > {\epsilon }_1 \) , the step \( {s}_k \) calculated in Step 2 satisfies

\[
{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p > \frac{p!\left( {1 - {\theta }_1}\right) }{{L}_{f, p} + {\sigma }_{\max }}{\epsilon }_1,\tag{6.2.13}
\]

where \( {\sigma }_{\max } \) is given by (4.1.19). If additionally \( {\epsilon }_2 < \infty \) and \( {\omega }_{k + 1,2} > {\epsilon }_2 \) , where

\[
{\omega }_{k + 1,2}\overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{1}\left( {s}_{k}\right)  \cap  \mathcal{B}}}{\nabla }_{x}^{2}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^{2} \geq  0,\tag{6.2.14}
\]

then

\[
{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - 1} > \frac{\left( {p - 1}\right) !\left( {1 - {\theta }_2}\right) }{{L}_{f, p} + {\sigma }_{\max }}{\epsilon }_{2}.\tag{6.2.15}
\]

Furthermore, if \( {\epsilon }_3 < \infty \) and if \( {\omega }_{k + 1,3} > {\epsilon }_3 \) , where

\[
{\omega }_{k + 1,3}\overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  {\mathcal{M}}_{k}^{2}\left( {s}_{k}\right)  \cap  \mathcal{B}}}{\nabla }_{x}^{3}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^{3} \geq  0,\tag{6.2.16}
\]

then

\[
{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - 2} > \frac{\left( {p - 2}\right) !\left( {1 - {\theta }_3}\right) }{{L}_{f, p} + {\sigma }_{\max }}{\epsilon }_{3}.\tag{6.2.17}
\]

Moreover, for any \( d \in  {\mathcal{C}}^1\left( {{x}_{k + 1},{\epsilon }_1}\right) \) ,

\[
\left| {{\nabla }_s^1{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^1}\right|  \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p + {\tau }_1{\epsilon }_1,\tag{6.2.18}
\]

while for any \( d \in  {\mathcal{C}}^2\left( {{x}_{k + 1},{\epsilon }_1,{\epsilon }_2}\right) \) ,

\[
\left| {{\nabla }_s^2{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^2}\right|  \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - 1} + {\tau }_2{\epsilon }_{2}.\tag{6.2.19}
\]

in the above statement involve \( f \) , while the constraint sets are based on the model \( {m}_k \) .

We note, for clarity, that the objective functions in the definitions of \( {\omega }_{k + 1,2} \) and \( {\omega }_{k + 1,3} \) Proof. The fact that \( k \in  \mathcal{S} \) and the definition of the trial point give that \( {x}_{k + 1} = \; {x}_k + {s}_k \) . Clearly,

\[
\begin{gathered}\left| {{\nabla }_x^{j}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^j - {\nabla }_s^j{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^j}\right|  =  \mid  \left\lbrack  {{\nabla }_x^{j}f\left( {x}_{k + 1}\right)  - {\nabla }_s^j{T}_{f, p}\left( {{x}_k,{s}_k}\right) \rbrack {\left\lbrack  d\right\rbrack  }^j}\right. \\ + \frac{{\sigma }_k}{\left( {p + 1}\right) !}{\nabla }_s^j\left( {-{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1}}\right) {\left\lbrack  d\right\rbrack  }^j \\ \leq  \left| {\left\lbrack  {{\nabla }_x^{j}f\left( {x}_{k + 1}\right)  - {\nabla }_s^j{T}_{f, p}\left( {{x}_k,{s}_k}\right) }\right\rbrack  {\left\lbrack  d\right\rbrack  }^j}\right| \\ + \frac{{\sigma }_k}{\left( {p + 1}\right) !}\left| {{\nabla }_s^j\left( {-{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1}}\right) {\left\lbrack  d\right\rbrack  }^j}\right|\end{gathered}\tag{6.2.20}
\]

for all \( d \in  \mathcal{B} \) , where here and hereafter \( j \in  \left\lbrack  {1 : q}\right\rbrack \) with \( q = 1 \) if \( {\epsilon }_2 = {\epsilon }_3 = \infty , q = 2 \) if \( {\epsilon }_2 < \infty \) and \( {\epsilon }_3 = \infty \) , and \( q = 3 \) otherwise. Furthermore, for all \( d \in  \mathcal{B} \) , we have that both

\[
\begin{gathered}\left| {\left\lbrack  {{\nabla }_x^{j}f\left( {x}_{k + 1}\right)  - {\nabla }_s^j{T}_{f, p}\left( {{x}_k,{s}_k}\right) }\right\rbrack  {\left\lbrack  d\right\rbrack  }^j}\right|  \leq  \begin{Vmatrix}{{\nabla }_x^{j}f\left( {x}_{k + 1}\right)  - {\nabla }_s^j{T}_{f, p}\left( {{x}_k,{s}_k}\right) }\end{Vmatrix} \\ \leq  \frac{{L}_{f, p}}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1}\end{gathered}\tag{6.2.21}
\]

and

\[
\begin{gathered}\left| {{\nabla }_s^j\left( {-{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1}}\right) {\left\lbrack  d\right\rbrack  }^j}\right|  \leq  \begin{Vmatrix}{{\nabla }_s^j\left( {-{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p + 1}}\right) }\end{Vmatrix} \\ \leq  \frac{\left( {p + 1}\right) !}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1}\end{gathered}\tag{6.2.22}
\]

where we used the definition of the norm (A.7); the Taylor-series error bound (A.20), which relies on f.DpL.C; and Lemma B.4.1 (p. 461) with \( \beta  = 1 \) . Combining (6.2.20)- (6.2.22) and using the guaranteed upper bound (4.1.19) on \( {\sigma }_k \) , it follows that, for all \( d \in  \mathcal{B} \) ,

\[
\left| {{\nabla }_x^{j}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^j - {\nabla }_s^j{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^j}\right|  \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1}.\tag{6.2.23}
\]

When \( j = 1 \) , we deduce from (6.2.23) that

\[
{\omega }_{f,\mathcal{C},1}\left( {x}_{k + 1}\right)  =  - \mathop{\min }\limits_{d \in  \mathcal{C}\left( {x}_{k + 1}\right)  \cap  \mathcal{B}}{\nabla }_x^{1}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^1
\]

\[
\leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p - \mathop{\min }\limits_{d \in  \mathcal{C}\left( {x}_{k + 1}\right)  \cap  \mathcal{B}}{\nabla }_s^1{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^1
\]

\[
= \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p - \mathop{\min }\limits_{d \in  {\mathcal{M}}_k^0\left( {s}_k\right)  \cap  \mathcal{B}}\left\langle  {d,{\nabla }_s^1{m}_k\left( {s}_k\right) }\right\rangle
\]

\[
= \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p + {\omega }_{{m}_k,\mathcal{M},1}\left( {s}_k\right) ,
\]

since \( \left\langle  {d,{\nabla }_x^{1}f\left( {x}_{k + 1}\right) }\right\rangle   = {\nabla }_x^{1}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^1,\left\langle  {d,{\nabla }_s^1{m}_k\left( {s}_k\right) }\right\rangle   = {\nabla }_s^1{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^1 \) , and \( {\mathcal{M}}_k^0\left( {s}_k\right)  \equiv \; \mathcal{C}\left( {x}_{k + 1}\right) \) . The desired bound (6.2.13) then follows by combining this inequality with the requirement (6.2.10) and the assumption \( {\omega }_{f,\mathcal{C},1}\left( {x}_{k + 1}\right)  > {\epsilon }_1 \) and rearranging terms.

When \( j = 2 \) and 3,(6.2.23) together with (6.2.11) and (6.2.12) gives that

\[
- \mathop{\min }\limits_{d \in  {\mathcal{M}}_k^{j - 1}\left( {s}_k\right)  \cap  \mathcal{B}}{\nabla }_x^{j}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^j \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1} - \mathop{\min }\limits_{d \in  {\mathcal{M}}_k^{j - 1}\left( {s}_k\right)  \cap  \mathcal{B}}{\nabla }_s^j{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^j
\]

\[
= \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1} + {\omega }_{{m}_k,\mathcal{M}, j}\left( {s}_k\right)
\]

\[
\leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - j + 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - j + 1} + {\theta }_j{\epsilon }_j,
\]

which, together with the assumptions \( {\omega }_{k + 1,2}\left( {x}_{k + 1}\right)  > {\epsilon }_2 \) and \( {\omega }_{k + 1,3}\left( {x}_{k + 1}\right)  > {\epsilon }_3 \) , gives (6.2.15) and (6.2.17).

For any \( d \in  {\mathcal{C}}^1\left( {{x}_{k + 1},{\epsilon }_1}\right) \) ,(6.2.23) with \( j = 1 \) , using (6.1.8), leads to

\[
\left| {{\nabla }_s^j{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^1}\right|  \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p + \left| {{\nabla }_x^{1}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^1}\right|
\]

\[
\leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{p!}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^p + {\tau }_1{\epsilon }_1
\]

which is (6.2.18).

Similarly, if \( d \in  {\mathcal{C}}^2\left( {{x}_{k + 1},{\epsilon }_1,{\epsilon }_2}\right) ,\left( {6.2.23}\right) \) with \( j = 2 \) , using (6.1.10), gives

\[
\left| {{\nabla }_s^j{m}_k\left( {s}_k\right) {\left\lbrack  d\right\rbrack  }^2}\right|  \leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - 1} + \left| {{\nabla }_x^{2}f\left( {x}_{k + 1}\right) {\left\lbrack  d\right\rbrack  }^2}\right|
\]

\[
\leq  \frac{{L}_{f, p} + {\sigma }_{\max }}{\left( {p - 1}\right) !}{\begin{Vmatrix}{s}_k\end{Vmatrix}}^{p - 1} + {\tau }_2{\epsilon }_2
\]

which is (6.2.19).

Lemma 6.2.1 then leads directly to the following guaranteed reduction in the objective function following a successful step of the ARp-CC algorithm; the proof is identical to that of Lemma 4.1.4.

