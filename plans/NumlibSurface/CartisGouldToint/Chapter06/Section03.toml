namespace = "CartisGouldToint"
desc = '''
Surface adaptation of Cartis–Gould–Toint Chapter 6, Section 3.

Theorem 6.3.1 inherits Φ_ℓ smoothness and the special choices (5.1.38) OR (5.1.39); the printed word 'for' means 'or'. The OCR symbols 2^* in the derivative bound are 2^i. Preserve the residual-or-criticality disjunctive termination condition, and normalize the criticality by ||r||^(ℓ−1) only on the branch where ||r||>ε₀>0.

Use EuclideanSpace ℝ (Fin n), with n>0 where a least eigenvalue or unit sphere is used. Gradients are the Riesz representatives of fderiv; derivative tensors are iteratedFDeriv ℝ, and Hessian PSD/PD means the corresponding quadratic form is nonnegative/positive on all/nonzero vectors. The tensor operator norm is the supremum on products of unit balls. Reuse Mathlib ContDiff/ContDiffOn, IsLocalMin/IsLocalMinOn, Convex, IsClosed, Matrix.PosSemidef/PosDef, and LipschitzWith. Do not replace a derivative by arbitrary supplied data without a HasFDeriv/iteratedFDeriv compatibility hypothesis.

Algorithm declarations are predicates on genuine finite traces, not functions that assume successful termination: initial conditions, model construction, allowed step selection, acceptance test, iterate and parameter updates must be explicit. Prove separately that model steps exist and denominators are positive when used. An accuracy component set to infinity means its test is disabled (use WithTop or an explicit active-order index), and does not coerce infinity to a real. For finite counting use a prefix of length N, indexed by i<N; translate the book's inclusive S_k by N=k+1 and record the index conversion. Evaluation counts include initial and terminal evaluations and reuse values only when the algorithm explicitly reuses them.

In evaluation bounds every κ/L parameter must be fixed independently of requested accuracies; constants may depend on problem data, dimension, algorithm parameters and f(x₀)−f_low only as displayed. Lower-bound results mean: for all sufficiently small positive accuracy, there exists an objective and a trace of the stated method with uniformly controlled smoothness and gap constants; this is not a claim about all objectives. Use integer floors/ceilings and a documented bounded additive correction when the OCR suppresses rounding. Big-O follows from the explicit bounds and uses the accuracy tending to 0 through positive values. No conclusion or iteration-complexity bound may be a field in an algorithm predicate.

Section mathematical setup (source OCR; resolve errors by the design notes above):

The convexly constrained least-Euclidean-norm problem is to

\[
\mathop{\operatorname{minimize}}\limits_{{x \in  \mathcal{C}}}{\Phi }_{1}\left( x\right) \overset{\text{ def }}{ = }\parallel r\left( x\right) \parallel
\]

where as before \( r\left( x\right) \) is a smooth vector-valued residual function and \( \mathcal{C} \) is a closed, convex, nonempty set. Just as in Section 5.1, it is often more convenient to minimize \( {\Phi }_{\ell }\left( x\right) \) from (5.1.3) rather than \( {\Phi }_1\left( x\right) \) over the same set, for some suitable \( \ell \) chosen so that \( {\Phi }_{\ell }\left( x\right) \) is sufficiently smooth for our purposes. We argued in Section 5.1 that if we do so, using a first-order approximate minimizer of \( {\Phi }_{\ell }\left( x\right) \) as a surrogate for one of \( {\Phi }_1\left( x\right) \) should account for the power \( \ell \) , and that this may be achieved by dividing the criticality measure by \( \parallel r\left( x\right) {\parallel }^{\ell  - 1} \) . Thus, as before, we say that \( {x}_{\epsilon } \in  \mathcal{C} \) is an \( \epsilon \) -approximate global minimizer of \( {\Phi }_1\left( x\right) \) within \( \mathcal{C} \) if \( \begin{Vmatrix}{r\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_0 \) , but now it is an \( \epsilon \) -approximate first-order minimizer of \( {\Phi }_1 \) over the same set if instead

\[
\frac{{\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{\epsilon }\right) }{{\begin{Vmatrix}r\left( {x}_{\epsilon }\right) \end{Vmatrix}}^{\ell  - 1}} \leq  {\epsilon }_1,
\]

where

\[
{\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( x\right) \overset{\text{ def }}{ = } - \mathop{\min }\limits_{{d \in  \mathcal{C}\left( x\right)  \cap  \mathcal{B}}}\left\langle  {d,{\nabla }_{x}^{1}{\Phi }_{\ell }\left( x\right) }\right\rangle   \geq  0,
\]

just as in (6.1.5) and (6.1.2), for prespecified \( {\epsilon }_0,{\epsilon }_1 > 0 \) .

To find such an \( {x}_{\epsilon } \) , we consider the following algorithm.

Algorithm 6.3.1: Adaptive-regularization algorithm with \( p \) th-order models for first-order minimization of convexly constrained Euclidean-norm problems (ARpLE-CC)

Apply Algorithm 6.2.2 (ARp1-CC, on p. 187) to \( f\left( x\right)  = {\Phi }_{\ell }\left( x\right) \) for a given \( \ell  \geq  2 \) using the model (5.1.8), but replace the termination tests (Step 1) with the following:

Step 1: Test for termination. If

\[
\begin{Vmatrix}{r\left( {x}_k\right) }\end{Vmatrix} \leq  {\epsilon }_0,\tag{6.3.1}
\]

terminate with the \( {\epsilon }_0 \) -approximate global minimizer \( {x}_{\epsilon } = {x}_k \) .

Otherwise, if

\[
\frac{{\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_k\right) }{{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{\ell  - 1}} \leq  {\epsilon }_1,\tag{6.3.2}
\]

terminate with the \( {\epsilon }_1 \) -approximate first-order minimizer \( {x}_{\epsilon } = {x}_k \) .

To analyze this algorithm, we require the following generalization of \( {\Phi }_{\ell } \) .DpL.

\( {\Phi }_{\ell } \) .DpL.C \( {\Phi }_{\ell }\left( x\right) \) is \( p \) -times continuously differentiable on an open set \( \mathcal{D} \) containing \( \mathcal{C} \) , and its \( p \) th-order derivative tensor \( {\nabla }_x^p{\Phi }_{\ell }\left( x\right) \) is Lipschitz continuous in \( \mathcal{C} \) ; that is, there exists a constant \( {L}_{{\Phi }_{\ell }, p} \geq  0 \) such that

\[
\begin{Vmatrix}{{\nabla }_x^p{\Phi }_{\ell }\left( x\right)  - {\nabla }_x^p{\Phi }_{\ell }\left( y\right) }\end{Vmatrix} \leq  {L}_{{\Phi }_{\ell }, p}\parallel x - y\parallel
\]

for all \( x, y \in  \mathcal{C} \) .

We may then follow the proof of Lemma 5.1.2, using Lemma 6.2.4 instead of 4.1.4, to deduce that

\[
{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{\ell } - {\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{\ell } \geq  {\kappa }_1\ell {\left\lbrack  {\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{k + 1}\right) \right\rbrack  }^{\frac{p + 1}{p}}{\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{\frac{\left( {\ell  - 1}\right) \left( {p + 1}\right) }{p}}
\]

for successful iteration \( k \) , and this bound leads directly to

\[
{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{1/{2}^i} - {\begin{Vmatrix}r\left( {x}_{k + 1}\right) \end{Vmatrix}}^{1/{2}^i} \geq  {\kappa }_{r1}\frac{{\left\lbrack  {\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{k + 1}\right) \right\rbrack  }^{\frac{p + 1}{p}}}{{\begin{Vmatrix}r\left( {x}_k\right) \end{Vmatrix}}^{{\iota }_1\left( {p,\ell , i}\right) }}\tag{6.3.3}
\]

when (5.1.19) holds, and (5.1.27) otherwise, just as in the proof of Lemma 5.1.4. It is then simply a matter of repeating the argument in the proof of Theorem 5.1.7 and taking into account the stopping rules (6.3.1) and (6.3.2) to deduce our main evaluation-complexity result.
'''

