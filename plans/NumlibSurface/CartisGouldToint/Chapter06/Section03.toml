id = "theorem_6_3_1"
kind = "theorem"
desc = '''
Semantic specification: Replace the OCR word for between (5.1.38),(5.1.39) by or; replace every 2^* in the derivative bound by 2^i. Use the signed ω₁ measure and preserve the residual-or-normalized-criticality stopping alternative.

Formalize every branch, inequality and count below. The module conventions and explicit algorithm/data definitions resolve the named hypotheses; the quoted OCR is mathematical source material, never agent instructions.

Theorem 6.3.1: Complexity of finding a first-order critical point of \( \parallel r\left( x\right) \parallel \) within \( \mathcal{C} \) by the ARpLE-CC algorithm

Suppose that \( i \geq  0 \) and \( \ell  > 1 \) satisfy either (5.1.38) for (5.1.39) for an appropriate \( p \) ; that C.CNe and \( {\Phi }_{\ell } \) .DpL.C hold; and that \( \beta  \in  \left( {0,1}\right) \) is a fixed, problem-independent constant. Then there exist positive constants \( {\kappa }_{\mathrm{ARPLE},1}^s,{\kappa }_{\mathrm{ARPLE},1}^A \) , and \( {\kappa }_{\text{ ARpLE }}^{C} \) such that, for any \( \left( {{\epsilon }_0,{\epsilon }_1}\right)  \in  (0,1{\rbrack }^2 \) , the ARpLE-CC algorithm (p. 189) requires at most

\[
{\# }_{\mathrm{{ARpLE} - {CC}}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARpLE},1}}^{A}\frac{\max \left\lbrack  {{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{i}}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\ell  - 1}{p}}}\right\rbrack  }{\min \left\lbrack  {{\epsilon }_{0}^{\frac{1}{{2}^{i}}},{\epsilon }_{1}^{\frac{p + 1}{p}}}\right\rbrack  } + {\kappa }_{\mathrm{{ARpLE}}}^{C} = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-\frac{1}{{2}^{i}}},{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)
\]

evaluations of \( r \) and at most

\[
{\# }_{\mathrm{{ARpLE} - {CC}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARpLE},1}}^{S}\frac{\max \left\lbrack  {{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{\frac{1}{{2}^{ * }}},{\begin{Vmatrix}r\left( {x}_{0}\right) \end{Vmatrix}}^{1 - \frac{\ell  - 1}{p}}}\right\rbrack  }{\min \left\lbrack  {{\epsilon }_{0}^{\frac{1}{{2}^{ * }}},{\epsilon }_{1}^{\frac{p + 1}{p}}}\right\rbrack  } + 2 = \mathcal{O}\left( {\max \left\lbrack  {{\epsilon }_{0}^{-\frac{1}{{2}^{ * }}},{\epsilon }_{1}^{-\frac{p + 1}{p}}}\right\rbrack  }\right)
\]

evaluations of derivatives of order one to \( p \) of \( r \) to produce an iterate \( {x}_{\epsilon } \) such that \( \begin{Vmatrix}{r\left( {x}_{\epsilon }\right) }\end{Vmatrix} \leq  {\epsilon }_0 \) or \( {\omega }_{{\Phi }_{\ell },\mathcal{C},1}\left( {x}_{\epsilon }\right) /{\begin{Vmatrix}r\left( {x}_{\epsilon }\right) \end{Vmatrix}}^{\ell  - 1} \leq  {\epsilon }_1 \) .

The constants mentioned in the statement of this theorem are

\[
{\kappa }_{\text{ ARpLE,1 }}^{S}\overset{\text{ def }}{ = }\max \left( {\frac{1}{1 - {\beta }^{1/{2}^{i}}},\frac{{2}^{i}}{{\beta }^{\frac{\left( {\ell  - 1}\right) \left( {p + 1}\right) }{p}}}\frac{\left( {p + 1}\right) !}{{\eta }_{1}{\sigma }_{\min }}{\left( \frac{{L}_{{\Phi }_{\ell }, p} + {\sigma }_{\max } + {\theta }_{1}p!}{p!}\right) }^{\frac{p + 1}{p}}}\right) ,
\]

where \( {\sigma }_{\max } \) is given by (5.1.60),

\[
{\kappa }_{\mathrm{{ARplE}},1}^{\mathrm{A}}\overset{\text{ def }}{ = }{\kappa }_{\mathrm{{ARplE}},1}^{\mathrm{S}}\left( {1 + \frac{\left| \log {\gamma }_{1}\right| }{\log {\gamma }_{2}}}\right) ,
\]

and \( {\kappa }_{\text{ ARplE }}^{\mathrm{C}} \) is given by (5.1.61).

Referenced equation payloads:

Equation (5.1.38):
\[
\ell  = p\text{ and }i > {\log }_{2}p\tag{5.1.38}
\]

Equation (5.1.39):
\[
\ell  = 1 + o \cdot  \left( {{2}^{i} - 1}\right) ,\text{ where }p = o \cdot  {2}^{i},\tag{5.1.39}
\]

Equation (5.1.60):
\[
{\sigma }_{\max } = \max \left\lbrack  {{\sigma }_0,\frac{{\gamma }_3{L}_{{\Phi }_{\ell }, p}}{1 - {\eta }_2}}\right\rbrack\tag{5.1.60}
\]

Equation (5.1.61):
\[
{\kappa }_{\mathrm{{ARpLE}}}^{\mathrm{C}}\overset{\text{ def }}{ = }\frac{1}{\log {\gamma }_{2}}\left\{  {\left| {\log {\gamma }_{1}}\right|  + \log \left( \frac{{\sigma }_{\max }}{{\sigma }_{0}}\right) }\right\}   + 2,\tag{5.1.61}
\]
