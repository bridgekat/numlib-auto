[[node]]
id = "lemma_B_3_1"
kind = "theorem"
desc = '''
Lemma B.3.1. For `a, b > 0`, `c ≥ 0`: `-b + √(b² + a c) ≥ (-b + √(b² + a)) min(1, c)` (B.3.1).
'''
