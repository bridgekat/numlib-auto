`x₀ = 0` with `σ_k = σ₀`, `ρ_k = 1`, whose first stop is at `k_ε = ⌈ε^{-(p+1)/(p-q+1)}⌉₊`, where
`phiMeasure f j 1 (x k_ε) ≤ ε/j!` (and `> ε/q!` at order `q` before). Data:
`Optimization.exists_slowTaylorOrder_interpolant` with scale `c = 1`; witnesses: maximizer `d = 1` at order `q` before `k_ε`, a
witness with `ΔT = ς φ` at `k_ε`. Note: for `q ≥ 3` the hypothesis of the printed theorem fails
for this very example (`theorem_12_2_15_counterexample`), so only the global-step formulation is
meaningful there; for `q ≤ 2` see `corollary_12_2_16`.
'''
