desc = '''
Lemma 12.2.7 (as printed, operator norms). Under `AssumptionD1pL f p L`, the model
`m_k = regularizedModel (ftaylorSeries ℝ f (x_k)) p σ_k` is `ContDiff ℝ p`, `∇^p m_k` is
`σ_k`-Lipschitz, and `‖iteratedFDeriv ℝ ℓ m_k s‖ ≤ 3 L_f + σ_k` for `‖s‖ ≤ 1`, `ℓ ∈ [2:p]` (12.2.38).
The operator-norm claims about `‖·‖^{p+1}` are `norm_iteratedFDeriv_norm_pow_le` (sharp operator
norm, no Banach theorem needed), `iteratedFDerivLipschitzOn_norm_pow` (`∇^p ‖s‖^{p+1}` is
`(p+1)!`-Lipschitz) and `contDiff_norm_pow`. Later results use the diagonal form
`Optimization.abs_iteratedFDeriv_regularizedModel_apply_le`.
'''
