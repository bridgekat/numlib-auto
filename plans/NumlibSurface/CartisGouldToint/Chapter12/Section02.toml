namespace = "CartisGouldToint.Chapter12"
desc = '''
§12.2 Finding approximate minimizers of arbitrary `q`th order: TRq (§12.2.1) and ARqp (§12.2.2),
complexity and sharpness. Functions on `𝔼 = EuclideanSpace ℝ (Fin n)`; sharpness examples on
`EuclideanSpace ℝ (Fin 1)` (book: `ℝ → ℝ`).

Algorithms are the backbone run predicates with exact data:
`algorithm_12_2_1 = Optimization.IsTRqRun f (fun k => ftaylorSeries ℝ f (x k)) (fun _ => univ) …`,
`algorithm_12_2_2 = Optimization.IsARqpRun f (fun k => ftaylorSeries ℝ f (x k)) …`
(read the backbone `desc`s for the run conventions and the normalizations of the printed ARqp
algorithm: strict Step-1 test, sound Step-2 termination, reconciled long-step branch, carried
witnesses after failures). Evaluation counts: `Optimization.funEvalCount` (one `f` per iteration +
initial), `Optimization.derivEvalCount` (initial + one per successful iteration before the final
one), as in the book's proofs.

Constants: tolerances `ε j ∈ (0,1]`, `ε_min = min_{j ∈ [1:q]} ε_j`; Lipschitz constants
`L : ℕ → ℝ` (f.D1qL / f.D1pL / f.D1rL, all `≥ 1`), `L_f = max_j L j` ((12.2.6), (12.2.25)),
`L_{f,p} = L p`. Corrections (details in nodes): Theorem 12.2.5 conclusion `φ_q → φ_j`;
Theorem 12.2.6 data; Lemma 12.2.11 `(1 - θ) → (ς - θ)` with `θ < ς`; Lemma 12.2.12/12.2.13/
Theorem 12.2.14 constant `κ_{δ,min} → κ̂`; Lemma 12.2.13 hypotheses; Theorem 12.2.15 for `q ≥ 3`;
Example 12.2.2 expansion.
'''

[[node]]
id = "AssumptionD1pL"
kind = "def"
desc = '''
Assumptions f.D1qL / f.D1pL / f.D1rL (same shape, different order): `AssumptionD1pL (f : 𝔼 → ℝ)
(p : ℕ) (L : ℕ → ℝ) : Prop := ContDiff ℝ p f ∧ ∀ j ∈ Finset.Icc 1 p, 1 ≤ L j ∧
IteratedFDerivHolderOn f j (L j) 1 Set.univ` (`IteratedFDerivLipschitzOn f j (L j) univ`).
Consequences (part of node, Theorem A.8.5): `‖iteratedFDeriv ℝ j f x‖ ≤ L (j - 1)` for
`j ∈ [2:p]` (12.2.24), and `AssumptionD1pL f r L → AssumptionD1pL f p L` for `p ≤ r`.
`lipschitzMax L p := (Finset.Icc 1 p).sup' _ L` is the book's `L_f`.
'''
deps = ["IteratedFDerivHolderOn", "norm_iteratedFDeriv_succ_le_of_lipschitzOn"]
source = "Cartis–Gould–Toint, Assumptions f.D1qL (Section 12.2.1.2), f.D1pL (Section 12.2.2.1), f.D1rL (Section 12.2.2.4)"

[[node]]
id = "algorithm_12_2_1"
kind = "def"
desc = '''
Algorithm 12.2.1 (TRq): `algorithm_12_2_1 (f : 𝔼 → ℝ) (P : Optimization.TRqParams) (q : ℕ)
(ε : ℕ → ℝ) (ϑ : ℝ) (x s : ℕ → 𝔼) (Δ : ℕ → ℝ) (jk : ℕ → ℕ) (d : ℕ → ℕ → 𝔼) : Prop :=
Optimization.IsTRqRun f (fun k => ftaylorSeries ℝ f (x k)) (fun _ => Set.univ) P q ε ϑ x s Δ jk d`,
used with `ε j ∈ (0,1]` and `ϑ ∈ [ε_min, 1]`. Its termination test is
`trqStop f P q ε ϑ x Δ d k := MeasureTestPasses (ftaylorSeries ℝ f (x k)) q P.ς ε
(fun _ => min (Δ k) ϑ) (d k)` (part of node); `δ_k = min Δ_k ϑ`; successful iterations
`P.η₁ ≤ ρ_k`. Existence (part of node): for every `f`, `x₀` a run exists
(`Optimization.exists_isTRqRun` with `J y = ftaylorSeries ℝ f y`, `C' y = univ`).
'''
deps = ["Optimization.IsTRqRun", "Optimization.exists_isTRqRun", "Optimization.MeasureTestPasses"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1"

[[node]]
id = "lemma_12_2_1"
kind = "theorem"
desc = '''
Lemma 12.2.1. For a TRq run and `k` before termination (`∀ i ≤ k, ¬ trqStop … i`), with
`φ̂_i = Optimization.trqGap (ftaylorSeries ℝ f (x i)) (jk i) δ_i (d i (jk i))` (12.2.8):
`min_{i ∈ [0:k]} φ̂_i ≥ ς ε_min` (12.2.9) and `ΔT_{f,j_k}(x_k, s_k) ≥ φ̂_k δ_k^{j_k}/j_k!` (12.2.10).
'''
deps = ["algorithm_12_2_1", "Optimization.IsTRqRun.trqGap_ge"]
source = "Cartis–Gould–Toint, Lemma 12.2.1"

[[node]]
id = "lemma_12_2_2"
kind = "theorem"
desc = '''
Lemma 12.2.2. Under `AssumptionD1pL f q L`, for a TRq run and `k` before termination, if
`Δ_k ≤ min ϑ ((1 - η₂) φ̂_k / L_f)` (12.2.11) then `η₂ ≤ ρ_k` (very successful) and `Δ_k ≤ Δ_{k+1}`.
(Model fidelity from (A.19) with `L_{f,j_k} ≤ L_f`, `abs_sub_taylorPolynomial_le_of_lipschitz`.)
'''
deps = ["lemma_12_2_1", "AssumptionD1pL", "Optimization.IsTRqRun.le_reductionRatio", "abs_sub_taylorPolynomial_le_of_lipschitz"]
source = "Cartis–Gould–Toint, Lemma 12.2.2"

[[node]]
id = "lemma_12_2_3"
kind = "theorem"
desc = '''
Lemma 12.2.3. Under `AssumptionD1pL f q L` (`L_f ≥ 1`), `0 < ϑ ≤ 1`, for a TRq run whose test fails
at `k = 0`, with `κ_Δ = γ₁(1 - η₂)/L_f · min(ϑ, Δ₀ δ₀^q / (2 · q! · max_{i ∈ [1:q]} ‖∇^i f(x₀)‖))`
(12.2.14) (`δ₀ = min Δ₀ ϑ`): `κ_Δ ∈ (0,1)` and for every `k` before termination
`Δ_k ≥ min(γ₁ ϑ, κ_Δ min_{i ∈ [0:k]} φ̂_i)` (12.2.13).
'''
deps = ["lemma_12_2_2", "Optimization.IsTRqRun.radius_ge"]
source = "Cartis–Gould–Toint, Lemma 12.2.3"

[[node]]
id = "lemma_12_2_4"
kind = "theorem"
desc = '''
Lemma 12.2.4. Under `AssumptionD1pL f q L`, `ε j ∈ (0,1]`, `ϑ ∈ [ε_min, 1]`, for a TRq run and every
`k` before termination: `ΔT_{f,j_k}(x_k, s_k) ≥ (ς κ_Δ)^{q+1} ε_min^{q+1} / q!` (12.2.18), and if `k`
is successful, `f(x_k) - f(x_{k+1}) ≥ η₁ (ς κ_Δ)^{q+1} ε_min^{q+1} / q!` (12.2.19).
'''
deps = ["lemma_12_2_3", "lemma_12_2_1", "Optimization.IsTRqRun.taylorDecrement_ge"]
source = "Cartis–Gould–Toint, Lemma 12.2.4"

[[node]]
id = "theorem_12_2_5"
kind = "theorem"
desc = '''
Theorem 12.2.5. Assume `Chapter02.AssumptionBb f flow`, `AssumptionD1pL f q L`, `ε j ∈ (0,1]` for
`j ∈ [1:q]`, `ϑ ∈ [ε_min, 1]`. For every TRq run there is `k_ε` with
`IsFirstHit (trqStop f P q ε ϑ x Δ d) k_ε`, `x_{k_ε}` is an `(ε, δ_ε)`-approximate `q`th-order
minimizer with the constant radius vector `δ_ε = min Δ_{k_ε} ϑ ∈ (0,1]`
(`IsEpsDeltaApproxMinimizer f q ε (fun _ => δ_ε) (x k_ε)`, i.e. `φ^{δ_ε}_{f,j}(x_ε) ≤ ε_j δ_ε^j/j!`
for all `j` — the printed `φ_{f,q}` is a typo for `φ_{f,j}`), and
`funEvalCount k_ε ≤ κ^A (f(x₀) - flow)/ε_min^{q+1} + κ^B |log ε_min| + κ^C` (12.2.21),
`derivEvalCount succ k_ε ≤ κ^S (f(x₀) - flow)/ε_min^{q+1} + 1` (12.2.22), with
`κ^S = q!/(η₁ (ς κ_Δ)^{q+1})`, `κ^A = κ^S (1 + log γ₃/|log γ₂|)`, `κ^B = 1/|log γ₂|`,
`κ^C = |log(ς κ_Δ/Δ₀)|/|log γ₂| + 1` (`κ_Δ` of Lemma 12.2.3, which depends on `x₀` through
`‖∇^i f(x₀)‖`; if all vanish the run stops at `k = 0` and the bounds hold trivially).
Proof: decrease (12.2.19) on the successful iterations before `k_ε` (`card_mul_le_of_decrease`),
`Δ_k ≥ Δ_min = ς κ_Δ ε_min` up to `k_ε`, and Lemma 2.3.1 (`succ_le_of_trUpdate`) at `k = k_ε - 1`.
Also the `O(max_j ε_j^{-(q+1)})` form (part of node, `Asymptotics.IsBigO` optional).
'''
deps = ["lemma_12_2_4", "lemma_12_2_3", "IsEpsDeltaApproxMinimizer", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.isEpsDeltaApprox_of_measureTestPasses", "Optimization.succ_le_of_trUpdate", "Optimization.card_mul_le_of_decrease", "Optimization.exists_hit_le_of_counting", "Optimization.IsFirstHit", "Optimization.funEvalCount"]
source = "Cartis–Gould–Toint, Theorem 12.2.5"

[[node]]
id = "theorem_12_2_6"
kind = "theorem"
desc = '''
Theorem 12.2.6 (TRq sharpness). For `q ≥ 1` there are `flow` and `L ≥ 1` (depending only on `q`)
such that for every `ε ∈ (0, 1/q!]` (tolerances `ε_j = j! ε`) and all TRq constants `P` with
`P.Δ₀ = ε`, there are `f : EuclideanSpace ℝ (Fin 1) → ℝ` with `AssumptionBb f flow`,
`AssumptionD1pL f q (fun _ => L)`, and a TRq run with `ϑ = 1`, `x₀ = 0`, `Δ_k = s_k = δ_k = ε`,
`x_k = k ε`, all iterations successful with `ρ_k = 1`, and
`IsFirstHit (trqStop …) ⌈ε^{-(q+1)}⌉₊`: TRq may need `ε^{-(q+1)}` iterations and evaluations.
Data: `Optimization.exists_slowTRq_interpolant` (corrected Appendix-B data). Witnesses: `d_{k,j} = 0`
for `j < q` (`φ_j = 0`), the maximizer `d_{k,q} = ε` for `k < k_ε` (`φ_q = ε c_k δ^q > ε δ^q`), and at
`k_ε` a witness with `ΔT = ς φ_q` exactly (`exists_isApproxMeasureStep`), so the test passes.
'''
deps = ["algorithm_12_2_1", "AssumptionD1pL", "Optimization.exists_slowTRq_interpolant", "Optimization.exists_isApproxMeasureStep", "CartisGouldToint.Chapter02.AssumptionBb", "Optimization.IsFirstHit"]
source = "Cartis–Gould–Toint, Theorem 12.2.6 (proof in Appendix B)"

[[node]]
id = "algorithm_12_2_2"
kind = "def"
desc = '''
Algorithm 12.2.2 (ARqp): `algorithm_12_2_2 (f : 𝔼 → ℝ) (P : Optimization.ARqpParams) (p q : ℕ)
(ε δ₀ : ℕ → ℝ) (x s : ℕ → 𝔼) (σ : ℕ → ℝ) (δ δs : ℕ → ℕ → ℝ) (d dm : ℕ → ℕ → 𝔼) : Prop :=
Optimization.IsARqpRun f (fun k => ftaylorSeries ℝ f (x k)) P p q ε δ₀ x s σ δ δs d dm`, used with
`1 ≤ q ≤ p`, `ε j ∈ (0,1]`, `δ₀ j ∈ (0,1]`. Stopping predicate `arqpStop … k := test₁ k ∨ test₂ k`
(Step 1 measure test or Step 2 `m_k(s_k) = m_k(0)`; part of node); model
`m_k = Optimization.regularizedModel (ftaylorSeries ℝ f (x k)) p (σ k)` (12.2.23). Normalizations of
the printed algorithm are listed in the backbone `IsARqpRun` (notably the strict Step-1 test and
the global-minimality guarantee for Step-2 termination). Existence (part of node):
`Optimization.exists_isARqpRun`.
'''
deps = ["Optimization.IsARqpRun", "Optimization.exists_isARqpRun"]
source = "Cartis–Gould–Toint, Algorithm 12.2.2"

[[node]]
id = "example_12_2_1"
kind = "theorem"
desc = '''
Example 12.2.1. Data `f(x_k) = 0`, `∇f(x_k) = -β e₁`, `∇^j f(x_k) = 0` (`j ∈ [2:p]`): the model is
Example 12.1.3's `m` with `σ = σ_k`, global minimizer `s* = (β p!/σ_k)^{1/p} e₁`. For `p = 5`,
`σ_k = 5!`, `β = 1` (so `‖s*‖ = 1`) and `θ ε₃ ≤ 1`: for every `δ ∈ (15/19, 1]`,
`phiMeasure m 3 δ s* > θ ε₃ δ³/3!` (witness `d = -δ s*`: `ΔT_{m,3}(s*, -δ s*) = -5δ²/2 + 10δ³/3`),
so (12.2.29) fails at `s*` for `j = 3` with any radius `δ_{s,3} > 15/19`; in particular `δ_{s,3} = 1`
is not admissible.
'''
deps = ["example_12_1_3", "phiMeasure"]
source = "Cartis–Gould–Toint, Example 12.2.1, (12.2.33)"

[[node]]
id = "example_12_2_2"
kind = "theorem"
desc = '''
Example 12.2.2 (corrected). On `EuclideanSpace ℝ (Fin 1)`, `m(s) = s²(s - ½)² = ¼ s²(1 - 4s) + s⁴`
is the ARqp model (12.2.23) with `p = 3`, `σ = 4!` for data `f(x_k) = 0`, `∇f(x_k) = 0`,
`∇²f(x_k) = ½`, `∇³f(x_k) = -6`; its global minimizers are exactly `0` and `½`;
`phiMeasure m 3 1 0 = ¾ > 0`, while `phiMeasure m 3 δ 0 = 0` for `δ ≤ ¼`. (The printed expansion
`½ s²(1 - 2s) + s⁴`, the value `-½` and the threshold `½` are inconsistent with `s²(s - ½)²`; with
that expansion the model has the unique minimizer `0`.) Hence the Step-1 test at `x_k` with radius
`1` does not stop, while a Step-2 model minimizer `s_k = 0` stops the algorithm.
'''
deps = ["phiMeasure", "Optimization.regularizedModel"]
source = "Cartis–Gould–Toint, Example 12.2.2"

[[node]]
id = "algorithm_12_2_3"
kind = "def"
desc = '''
Algorithm 12.2.3 (detailed Step 2) as a run predicate of the inner procedure on events `t : ℕ`
(each execution of Step 2.4.1). Given the model `m` (any `m : 𝔼 → ℝ` bounded below; ARqp: `m_k`),
`q`, `ς`, `θ`, `ε`: sequences `μ : ℕ → ℝ`, `sμ : ℕ → 𝔼`, `jt : ℕ → ℕ`, `δt : ℕ → ℕ → ℝ`,
`dt : ℕ → 𝔼` and a return predicate, with: Step 2.1 `μ 0 ∈ (0,1]`, `δt 0 = 1`, `jt 0 = 1`;
Step 2.2 every new trial point satisfies `μ (m 0 - ⨅ m) ≤ m 0 - m sμ` (12.2.34); Step 2.3 return
`(sμ, δt)` if `‖sμ‖ ≥ 1`; Step 2.4.1 `dt t` is an `IsApproxMeasureStep (ftaylorSeries ℝ m (sμ t))
(jt t) (δt t (jt t)) univ ς` witness (12.2.35); Step 2.4.2 if `ΔT ≤ ς θ ε_j δ^j/j!` (12.2.36) go to
`j + 1` or return (Step 2.5) when `j = q`; Step 2.4.3 else if `j ≥ 3` and
`m(sμ) - m(sμ + dt) < ½ ς θ ε_j δ^j/j!` (12.2.37) halve `δ_j` and repeat with the same `j`;
Step 2.4.4 else `μ ← (1 + μ)/2`, new trial point, `j ← 1` (radii kept). (Step 2.3's `≥ 1` is the
long-step branch `1 ≤ ‖s‖` of `IsARqpRun`.)
'''
deps = ["Optimization.IsApproxMeasureStep"]
source = "Cartis–Gould–Toint, Algorithm 12.2.3"

[[node]]
id = "lemma_12_2_7"
