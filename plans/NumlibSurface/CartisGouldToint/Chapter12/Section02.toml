[[node]]
id = "lemma_12_2_9_algorithm"
kind = "theorem"
desc = '''
Lemma 12.2.9, algorithmic form: every run of `algorithm_12_2_3` for the model `m_k` (under
`AssumptionD1pL f p L`, `σ_k > 0`, `𝔼` finite-dimensional) returns after finitely many events, and
the returned pair satisfies (12.2.27)–(12.2.29), (12.2.44), (12.2.45). Proof (book): a halving at
order `j ≥ 3` happens only while `δ_{s,j} > ςθε_j/(4(3L_f + σ_k))` (Lemma 12.2.8 with `α = ςθε_j`),
so radii stay `≥ κ_δ ε_j`; infinitely many `μ`-updates force `μ → 1`, `m(s_μ) → m*`; an order
`j ≥ 3` violating (12.2.37) infinitely often contradicts `m ≥ m*`; an order `j ≤ 2` infinitely
often contradicts continuity of `s ↦ φ^1_{m,j}(s)` (`abs_taylorMeasure_sub_le` and continuity of
the jet) at a limit point `s*` of `s_μ` (bounded sublevel set), a global minimizer where
`φ^1_{m,j}(s*) = 0` (Theorem 12.1.4). Effort: substantial (compactness, subsequences).
'''
deps = ["algorithm_12_2_3", "lemma_12_2_8", "lemma_12_2_9", "Optimization.abs_taylorMeasure_sub_le", "Optimization.taylorMeasure_eq_zero_of_isLocalMin", "Optimization.exists_isMinOn_regularizedModel"]
source = "Cartis–Gould–Toint, Lemma 12.2.9 (proof)"

[[node]]
id = "lemma_12_2_10"
kind = "theorem"
desc = '''
Lemma 12.2.10. For an ARqp run under `AssumptionD1pL f p L` and the first stopping index `k` with
`¬ test₁ k ∧ test₂ k` (termination in Step 2): if `q ≤ 2` this is impossible; if `q ≥ 3` there is
`δ ∈ (0,1]^q` with `IsEpsDeltaApproxMinimizer f q ε δ (x k)`. Proof: by the run's Step-2 guarantee
`0` globally minimizes `m_k`, and `T_{m_k,j}(0,·) = T_{f,j}(x_k,·)` for `j ≤ p` (12.2.49). For
`q ≤ 2`, `φ^δ_{f,j}(x_k) = 0` for `j ≤ 2` (Theorem 12.1.4 for `m_k` at `0`), contradicting the
failed Step-1 test (`ΔT ≤ φ = 0 < ς ε δ^j/j!`). For `q ≥ 3` take `δ_j = min 1 (ε_j/(4(3L_f + σ_k)))`
(`Optimization.taylorMeasure_le_of_isMinOn_regularizedModel` with `α = ε_j` at `s* = 0`). (The
printed proof's "(12.2.29) for `s_k = 0`" assumes the returned step is `0`, which need not hold —
see Example 12.2.2 with `s_k = ½`.)
'''
deps = ["algorithm_12_2_2", "AssumptionD1pL", "IsEpsDeltaApproxMinimizer", "Optimization.taylorMeasure_le_of_isMinOn_regularizedModel", "Optimization.taylorMeasure_eq_zero_of_isLocalMin"]
source = "Cartis–Gould–Toint, Lemma 12.2.10"

