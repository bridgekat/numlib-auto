Lemma 12.2.8. Under `AssumptionD1pL f p L`, for `‖s‖ ≤ 1`, `α > 0`,
`δ ∈ (0, min 1 (α / (4 (3 L_f + σ_k)))]`, `‖d‖ ≤ δ`, `j ∈ [1:q]` (`q ≤ p`): if
