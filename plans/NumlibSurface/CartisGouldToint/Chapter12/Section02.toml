[[node]]
id = "lemma_12_2_12"
kind = "theorem"
desc = '''
The scalar implication from (12.2.60) to the stated high-order coefficient requires an extra coefficient comparison not implied by kappa_delta_min<1. Keep this literal target open. The proved lemma_12_2_12_corrected uses min(kappa_delta_min,(1-theta)/(2*q!*(Lf,p+sigma_max))) and retains both source accuracy rates.

Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 12.2.12: Lower bound on the length of step for \( \mathrm{AR}{qp} \)

Suppose that iteration \( k \) is successful and that the \( \mathrm{AR}{qp} \) algorithm does not terminate at iteration \( k + 1 \) . Suppose also that (as Lemma 12.2.9 allows) the algorithm ensures that \( {\delta }_{k + 1, j} = 1 \) for \( j \in  \left\lbrack  {1 : \min \left( {q,2}\right) }\right\rbrack \) and that (12.2.51) holds for \( j \in  \left\lbrack  {3 : q}\right\rbrack \) . Then there exists a \( j \in  \left\lbrack  {1 : q}\right\rbrack \) such that

\[
\begin{Vmatrix}{s}_{k}\end{Vmatrix} \geq  \left\{  \begin{array}{ll} {\left( \frac{1 - \theta }{{2j}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{1}{p - j + 1}}{\epsilon }_{j}^{\frac{1}{p - j + 1}} & \text{ if }q \in  \{ 1,2\} , \\  {\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{j - 1}}{{2j}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{1}{p}}{\epsilon }_{j}^{\frac{j}{p}} & \text{ if }q > 2, \end{array}\right.\tag{12.2.57}
\]

where \( {\kappa }_{\delta ,\min } \) is defined as in (12.2.51) and \( {\sigma }_{\max } \) as in (4.1.19).
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 12.2.12 (OCR Markdown line 12864)"
deps = ["lemma_12_2_11"]

[[node]]
id = "lemma_12_2_13"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Lemma 12.2.13: Model and function decreases (ARqp)

Suppose that f.D1qL holds. Then

\[
\Delta {T}_{f, p}\left( {{x}_k,{s}_k}\right)  \geq  {\kappa }_{\Delta m}\mathop{\min }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{{\pi }_j}\tag{12.2.61}
\]


for every iteration of algorithm ARqp before termination, where

\[
{\kappa }_{\Delta m}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{1 - \theta }{{2q}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{p + 1}{p - q + 1}} & \text{ if }q \in  \{ 1,2\} , \\  \frac{{\sigma }_{\min }}{\left( {p + 1}\right) !}{\left( \frac{\left( {1 - \theta }\right) {\kappa }_{\delta ,\min }^{q - 1}}{{2q}!\left( {{L}_{f, p} + {\sigma }_{\max }}\right) }\right) }^{\frac{q\left( {p + 1}\right) }{p}} & \text{ if }q > 2, \end{array}\right.
\]

with \( {\kappa }_{\delta ,\min } \) being given by (12.2.51), \( {\sigma }_{\max } \) by (4.1.19) on p. 103, and

\[
{\pi }_{j}\overset{\text{ def }}{ = }\left\{  \begin{array}{ll} \frac{p + 1}{p - j + 1} & \text{ if }q \in  \{ 1,2\} , \\  \frac{j\left( {p + 1}\right) }{p} & \text{ if }q > 2. \end{array}\right.
\]

If, in addition, \( k \in  \mathcal{S} \) ,

\[
f\left( {x}_k\right)  - f\left( {x}_{k + 1}\right)  \geq  {\eta }_1{\kappa }_{\Delta m}\mathop{\min }\limits_{j \in  \left\lbrack  {1 : q}\right\rbrack  }{\epsilon }_j^{{\pi }_j}.\tag{12.2.62}
\]
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Lemma 12.2.13 (OCR Markdown line 12910)"
deps = ["lemma_12_2_12"]

[[node]]
id = "theorem_12_2_14"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 12.2.14: qth-order complexity for the ARqp algorithm

Suppose that f.Bb and f.D1pL hold. Suppose also that the ARqp algorithm ensures, for each \( k \) , either that \( {\delta }_{k + 1, j} = 1 \) for \( j \in  \left\lbrack  {1 : q}\right\rbrack \) if \( q \in  \{ 1,2\} \) (as allowed by Lemma 12.2.9) or that (12.2.51) holds otherwise.

1. If \( q \in  \{ 1,2\} \) , then there exist positive constants \( {\kappa }_{\mathrm{ARqp}}^{s,1},{\kappa }_{\mathrm{ARqp}}^{a,1} \) , and \( {\kappa }_{\mathrm{ARqp}}^c \) such that, for any \( \epsilon  \in  (0,1{\rbrack }^q \) , the \( \mathrm{AR}{qp} \) algorithm requires at most

\[
{\# }_{\mathsf{{ARqp}}}^{F}\overset{\text{ def }}{ = }{\kappa }_{\mathsf{{ARqp}}}^{a,1}\frac{f\left( {x}_{0}\right)  - {f}_{\mathsf{{low}}}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + {\kappa }_{\mathsf{{ARqp}}}^{c} = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\frac{p + 1}{p - j + 1}}}\right)\tag{12.2.63}
\]

evaluations of \( f \) and at most

\[
{\# }_{\mathsf{{ARqp}}}^{D}\overset{\text{ def }}{ = }{\kappa }_{\mathsf{{ARqp}}}^{s,1}\frac{f\left( {x}_{0}\right)  - {f}_{\mathsf{{low}}}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{p + 1}{p - j + 1}}} + 2 = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\frac{p + 1}{p - j + 1}}}\right)\tag{12.2.64}
\]

evaluations of the derivatives of \( f \) of orders one to \( p \) to produce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^1\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .

2. If \( q > 2 \) , then there exist positive constants \( {\kappa }_{\text{ ARqp }}^{s,2},{\kappa }_{\text{ ARqp }}^{a,2} \) and \( {\kappa }_{\text{ ARqp }}^{c} \) such that, for any \( \epsilon  \in  (0,1{\rbrack }^q \) , the ARqp algorithm requires at most

\[
{k}_{\text{ ARqp }}\overset{\text{ def }}{ = }{\kappa }_{\text{ ARqp }}^{a,2}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{j\left( {p + 1}\right) }{p}}} + {\kappa }_{\text{ ARqp }}^{c} = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\frac{j\left( {p + 1}\right) }{p}}}\right)\tag{12.2.65}
\]

evaluations of \( f \) and at most

\[
{\kappa }_{\text{ ARqp }}^{s,2}\frac{f\left( {x}_{0}\right)  - {f}_{\text{ low }}}{\mathop{\min }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{\frac{j\left( {p + 1}\right) }{p}}} + 2 = \mathcal{O}\left( {\mathop{\max }\limits_{{j \in  \left\lbrack  {1 : q}\right\rbrack  }}{\epsilon }_{j}^{-\frac{j\left( {p + 1}\right) }{p}}}\right) \tag{12.2.66}
\]

evaluations of the derivatives of \( f \) of orders one to \( p \) to produce an iterate \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^{{\delta }_{\epsilon }}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon , j}^j/j \) ! for some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \) and all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 12.2.14 (OCR Markdown line 12952)"
deps = ["lemma_12_2_13", "lemma_12_2_10"]

[[node]]
id = "theorem_12_2_15"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 12.2.15: Slow qth-order convergence of the ARqp algorithm (good case)

Suppose that the choice \( {\delta }_{{s}_k, j} = 1 \) is possible (and made) for all \( k \) and all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) and that \( {\epsilon }_j = \epsilon  \leq  \frac{1}{2} \) for all \( j \) . Then the ARqp algorithm applied to minimize a function \( f \) satisfying \( f.{Bb} \) and \( F.{D1pL} \) may require

\[
{\epsilon }^{-\frac{p + 1}{p - q + 1}}
\]

iterations and evaluations of \( f \) and of its derivatives of order one up to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^1\left( {x}_{\epsilon }\right)  \leq  \epsilon /j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 12.2.15 (OCR Markdown line 13054)"
deps = ["arqpRun"]

[[node]]
id = "corollary_12_2_16"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Corollary 12.2.16: Slow \( q \) th-order convergence of the ARqp algorithm for

\[
q \in  \{ 1,2\}
\]

Suppose that \( q \in  \{ 1,2\} \) and that \( {\epsilon }_j = \epsilon  \leq  \frac{1}{2} \) for \( j \leq  2 \) . Then the ARqp algorithm applied to minimize a function \( f \) satisfying F.Bb and f.D1pL may require

\[
{\epsilon }^{-\frac{p + 1}{p - q + 1}}
\]

iterations and evaluations of \( f \) and of its derivatives of orders one up to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^1\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Corollary 12.2.16 (OCR Markdown line 13206)"
deps = ["theorem_12_2_15"]

[[node]]
id = "theorem_12_2_17"
kind = "theorem"
desc = '''
Formalize every hypothesis and conclusion in the following numbered statement, with the mathematical objects and run predicates described by this module and its dependencies. Keep all cases, constants and equation references; positivity and order bounds in the ambient algorithm remain hypotheses.

Theorem 12.2.17: Slow qth-order convergence of the ARqp algorithm (general case)

Let \( 1 \leq  q \leq  p \leq  r \) . If \( {\epsilon }_j = \epsilon  \in  \left( {0,1}\right) \) is sufficiently small for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) , and if the ARqp algorithm is applied to minimize a function \( f \) satisfying f.Bb and f.D1rL, and we can choose an arbitrary \( {\delta }_{k, j} > 0 \) satisfying (12.251), it may then require

\[
{\epsilon }^{-\frac{q\left( {p + 1}\right) }{p}}
\]

iterations and evaluations of \( f \) and of its derivatives of orders one up to \( p \) to produce a point \( {x}_{\epsilon } \) such that \( {\phi }_{f, j}^{{\delta }_{\epsilon , j}}\left( {x}_{\epsilon }\right)  \leq  {\epsilon }_j{\delta }_{\epsilon , j}^j/j \) ! for all \( j \in  \left\lbrack  {1 : q}\right\rbrack \) and some \( {\delta }_{\epsilon } \in  (0,1{\rbrack }^q \) .
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Theorem 12.2.17 (OCR Markdown line 13262)"
deps = ["arqpRun"]

