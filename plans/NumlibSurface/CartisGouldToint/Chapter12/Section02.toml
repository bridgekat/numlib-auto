Lemma 12.2.9 (existence of a step). Under `AssumptionD1pL f p L`, for any iterate `x_k`, `σ_k > 0`,
radii `δ_k`: there is a pair `(s_k, δ_{s_k})` (with witnesses `d^m`) satisfying the Step-2
