namespace = "CartisGouldToint"

# Planning conventions for the remaining declarations:
# High-order TRq and ARqp evaluation complexity. Always assume integers 1≤q≤p for regularization, q≥1 for trust regions, tolerances εj∈(0,1], and all initialization/update inequalities of the respective algorithms. f.Bb is a uniform lower bound f_low≤f(x). f.D1rL means C^r and each derivative order 1,…,r globally Lipschitz with constants L_(f,j)≥1; Lf is their finite maximum. Evaluation counters count calls, not arithmetic work. Existence of positive constants precedes universal ε. Lower-complexity examples require constructed objectives and legal runs.

[[node]]
id = "trqRun"
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 12.2"

[[node]]
id = "arqpRun"
kind = "definition"
desc = '''
Bundle Algorithm 12.2.2 and its detailed Step 2 (Algorithm 12.2.3), with 1≤q≤p, σmin>0, σ0≥σmin, θ∈(0,1), ς∈(0,1], 0<η1≤η2<1 and 0<γ1<1<γ2<γ3. mk(s)=T_(f,p)(xk,s)+σk||s||^(p+1)/(p+1)!. Step 1 applies the per-order approximate optimality checks (12.2.26); Step 2 demands mk(sk)≤mk(0), and either ||sk||>1 or fractional qth-order model criticality tests (12.2.29) with radii δ_(sk,j)∈(0,1]. Step 3 accepts using the true function/Taylor-decrement ratio (12.2.30); successful steps update x and optimality radii; unsuccessful steps keep them. σ updates in exactly the three intervals (12.2.31). Model-equality termination is separate from normal Step 1 termination. No existence, progress or complexity guarantees are stored as fields.
'''
source = "Cartis, Gould and Toint, Evaluation Complexity of Algorithms for Nonconvex Optimization, Section 12.2"
deps = ["isApproximateHighOrderMinimizer"]

