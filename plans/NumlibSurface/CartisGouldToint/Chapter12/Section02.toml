[[node]]
id = "lemma_12_2_10"
kind = "theorem"
desc = '''
Lemma 12.2.10: Termination in Step 2

Termination cannot occur in Step 2 of the ARqp algorithm if \( q \leq  2 \) . If \( q \geq  3 \) and the ARqp algorithm terminates in Step 2 of iteration \( k \) with \( {x}_{\epsilon } = {x}_k \) , then there exists a \( \delta  \in  (0,1{\rbrack }^q \) such that (12.1.25) holds for \( x = {x}_{\epsilon } \) and \( {x}_{\epsilon } \) is an \( \left( {\epsilon ,\delta }\right) \) -approximate \( q \) th-order minimizer.
'''
source = "Cartis, Gould and Toint, Lemma 12.2.10: Termination in Step 2"
wrong = "The formal arqpOuterZeroExitCounterexample uses p=q=1, f(x)=(x-2)^2/2, x0=0, sigma=1, epsilon=1/2 and unit radii. The actual initial relative Taylor check fails. Step s=4 has norm>1, unchanged radii and m(4)=m(0), so it satisfies literal outer Algorithm12.2.2 Step2 and immediately exits at x0. Actual criticality phi1(0,delta)=2delta exceeds epsilon*delta for every positive radius, and no other iterate is produced. Thus even certificate attainment fails for the literal outer contract. The valid lemma_12_2_10_detailed_solver companion assumes the additional positive-global-gap rule from Algorithm12.2.3, which genuinely excludes this return."

