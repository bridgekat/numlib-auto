namespace = "CartisGouldToint.Chapter12"
desc = '''
§12.1 Optimality conditions revisited. Functions `f : EuclideanSpace ℝ (Fin n) → ℝ` (`𝔼`), the
measure `phiMeasure f j δ x = φ^δ_{f,j}(x)` (12.1.10) as an abbreviation of
`Optimization.taylorMeasure (ftaylorSeries ℝ f x) j δ univ`, `(ε,δ)`-approximate minimizers (12.1.25)
via `Optimization.IsEpsDeltaApprox`. Curve-based conditions use `Optimization.curveCoeff` (Mathlib
`Composition` for the index sets `P(j,k)` of (12.1.5)). Tensor norms are Mathlib operator norms;
projected norms (12.1.13) are read in diagonal form (see `theorem_12_1_3_iii`).
Examples stating facts are planned as theorems `example_12_1_x`. The weak approximate minimizers
of (12.1.40) (Notes) are not planned. Theorem 12.1.5 as printed is false
(`theorem_12_1_5_counterexample`); `theorem_12_1_5` is the corrected statement.
'''

[[node]]
id = "phiMeasure"
kind = "def"
desc = '''
`phiMeasure (f : 𝔼 → ℝ) (j : ℕ) (δ : ℝ) (x : 𝔼) : ℝ := Optimization.taylorMeasure (ftaylorSeries ℝ f x) j δ
Set.univ` — the book's `φ^δ_{f,j}(x) = f(x) - min_{‖d‖≤δ} T_{f,j}(x,d) = max_{‖d‖≤δ} ΔT_{f,j}(x,d)`
(12.1.10)–(12.1.11). Lemma (part of node): `phiMeasure f j δ x = sSup ((fun d => f x -
taylorPolynomial f j x d) '' closedBall 0 δ)` and `0 ≤ phiMeasure f j δ x` (`δ ≥ 0`).
'''
deps = ["Optimization.taylorMeasure", "Optimization.taylorMeasure_nonneg", "taylorPolynomial"]
source = "Cartis–Gould–Toint, (12.1.10)–(12.1.11)"

[[node]]
id = "example_12_1_1"
kind = "theorem"
desc = '''
Example 12.1.1 (Hancock). Let `f x = x₂ (x₂ - exp(-1/x₁²))` for `x₁ ≠ 0` and `f x = x₂²` for
`x₁ = 0` on `ℝ²` (`EuclideanSpace ℝ (Fin 2)`). Then: (a) `ContDiff ℝ ⊤ f`; (b) for every direction
`d`, `0` is a local minimizer of `t ↦ f (t • d)` (no straight descent line); (c) `0` is not a local
minimizer of `f` (`f (t, ½ exp(-1/t²)) = -¼ exp(-2/t²) < 0`); (d) `f` and `g x = x₂²` have the same
derivatives of every order at `0` (`iteratedFDeriv ℝ k f 0 = iteratedFDeriv ℝ k g 0`), while `0` is a
(global) minimizer of `g`: no condition on the Taylor coefficients at `0` decides local
minimality. (The printed curve `αe₂ + ½exp(-1/2α²)e₁` is garbled; any curve
`(t, c exp(-1/t²))`, `0 < c < 1`, works.)
'''
deps = ["phiMeasure"]
source = "Cartis–Gould–Toint, Example 12.1.1, (12.1.2)"

[[node]]
id = "example_12_1_1_variant"
kind = "theorem"
desc = '''
Variant (12.1.3) of Example 12.1.1 (A. Lewis). Let `f x = x₂ (x₂ - sin(1/x₁) exp(-1/x₁²))` for
`x₁ ≠ 0`, `f x = x₂²` for `x₁ = 0`. Then `ContDiff ℝ ⊤ f`, `0` is not a local minimizer, and there is
no continuous descent curve: no `γ : ℝ → 𝔼` continuous on `[0,1]` with `γ 0 = 0` and
`f (γ α) < f 0` for all `α ∈ (0, 1]`. Proof: `f < 0` forces `x₁ ≠ 0`, `sin(1/x₁) ≠ 0`; the connected
set `γ₁((0,1])` then lies in one gap `(1/((k+1)π), 1/(kπ))` (or its negative), whose closure
avoids `0`, contradicting `γ₁(α) → 0`.
'''
source = "Cartis–Gould–Toint, (12.1.3)"

[[node]]
id = "IsQthOrderMinimizer"
kind = "def"
desc = '''
`IsQthOrderMinimizer (f : 𝔼 → ℝ) (x : 𝔼) (q : ℕ) : Prop :=
Optimization.IsCurveCritical (ftaylorSeries ℝ f x) q` — the conclusions of Theorem 12.1.1 hold for
all `j ∈ [1:q]` (the book's "`x` is a `q`th-order minimizer").
'''
deps = ["Optimization.IsCurveCritical"]
source = "Cartis–Gould–Toint, Section 12.1.2 (definition after Theorem 12.1.1)"

[[node]]
id = "theorem_12_1_1"
kind = "theorem"
desc = '''
Theorem 12.1.1. If `ContDiffAt ℝ q f x` and `IsLocalMin f x`, then for every `j ∈ [1:q]` and every
`s : ℕ → 𝔼` (the vectors `s_1, …, s_j`; the book's nonzero restriction is unnecessary) such that
`Optimization.curveCoeff (ftaylorSeries ℝ f x) s i = 0` for `i ∈ [1:j-1]` (12.1.7), one has
`0 ≤ Optimization.curveCoeff (ftaylorSeries ℝ f x) s j` (12.1.6), where
`curveCoeff D s j = ∑_{k=1}^{j} (1/k!) ∑_{(ℓ_1..ℓ_k) ∈ P(j,k)} D k [s_{ℓ_1}, …, s_{ℓ_k}]`
(`P(j,k)` (12.1.5) = compositions of `j` with `k` parts). Equivalently `IsQthOrderMinimizer f x q`.
(The book skips the proof; route via polynomial curves and the Peano remainder.)
'''
deps = ["IsQthOrderMinimizer", "Optimization.IsLocalMin.isCurveCritical"]
source = "Cartis–Gould–Toint, Theorem 12.1.1"

[[node]]
id = "peanoQuartic"
kind = "def"
desc = '''
Peano's quartic (12.1.8): `peanoQuartic (κ₁ κ₂ : ℝ) (x : 𝔼₂) : ℝ := x₂² - κ₁ x₁² x₂ + κ₂ x₁⁴` on
`EuclideanSpace ℝ (Fin 2)`.
'''
source = "Cartis–Gould–Toint, (12.1.8)"

[[node]]
id = "example_12_1_2"
kind = "theorem"
desc = '''
Example 12.1.2 (facts). For `f = peanoQuartic κ₁ κ₂`: `∇f(0) = 0`, `∇²f(0) = diag(0, 2)`, the only
nonzero third and fourth derivative entries at `0` are `∂³f/∂x₁²∂x₂ = -2κ₁` and `∂⁴f/∂x₁⁴ = 24κ₂`;
with `s₁ = e₁`, `s₂ = (κ₁/2) e₂`, `s₃ = e₁` the curve coefficients satisfy `c₁ = c₂ = c₃ = 0` and
`c₄ = curveCoeff … 4 = κ₂ - κ₁²/4` ((12.1.9)); `f (t e₁ + (κ₁/2) t² e₂) = (κ₂ - κ₁²/4) t⁴`; and for
every `d`, `0` is a local minimizer of `t ↦ f (t • d)` when `κ₂ ≥ 0`. Hence for `κ₁² > 4κ₂ ≥ 0` (e.g.
`κ₁ = 3, κ₂ = 2`, as in the curve `x₂ = 3/2 x₁²` and Figure 12.1.2) the origin is minimal along every
line but is a saddle. Correction: the printed choice "`κ₁ = 1` and `κ₂ = 2`" does not give a saddle
(`f = (x₂ - x₁²/2)² + 7x₁⁴/4 ≥ 0`).
'''
deps = ["peanoQuartic", "Optimization.curveCoeff"]
source = "Cartis–Gould–Toint, Example 12.1.2, (12.1.8)–(12.1.9)"

[[node]]
id = "theorem_12_1_2"
kind = "theorem"
desc = '''
Theorem 12.1.2 (formal content: linesearch methods cannot detect high-order minimizers). For
`f = peanoQuartic 3 2`: (i) every straight line through `0` is a non-descent line: for each `d`
there is `τ > 0` with `f 0 ≤ f (t • d)` for `t ∈ [0, τ]` (so a linesearch started at `0` along any
direction finds no decrease and stops there); (ii) `IsQthOrderMinimizer f 0 3`; (iii)
`¬ IsQthOrderMinimizer f 0 4`; (iv) `¬ IsLocalMin f 0`. The meta-statement "cannot be proved to be
locally convergent" is represented by these facts.
'''
deps = ["example_12_1_2", "IsQthOrderMinimizer", "theorem_12_1_1"]
source = "Cartis–Gould–Toint, Theorem 12.1.2"

[[node]]
id = "theorem_12_1_3_i"
kind = "theorem"
desc = '''
Theorem 12.1.3 (i). If `f` is differentiable at `x` and `δ > 0`: `‖gradient f x‖ = phiMeasure f 1 δ x / δ`
(12.1.12); hence `phiMeasure f 1 δ x = 0 ↔ gradient f x = 0`.
'''
deps = ["phiMeasure", "Optimization.taylorMeasure_one_eq", "Optimization.taylorMeasure_one_eq_zero_iff"]
source = "Cartis–Gould–Toint, Theorem 12.1.3 (i), (12.1.12)"

[[node]]
id = "theorem_12_1_3_ii"
kind = "theorem"
desc = '''
Theorem 12.1.3 (ii). If `ContDiffAt ℝ 2 f x` (actually only the second derivative data matter),
`δ > 0` and `phiMeasure f 2 δ x = 0`, then `gradient f x = 0` and `0 ≤ Chapter01.hessianMinEig f x`
(`λ_min[∇²f(x)] ≥ 0`): `x` is a first- and second-order minimizer. (Converse also holds:
`Optimization.taylorMeasure_two_eq_zero_iff`.)
'''
deps = ["phiMeasure", "Optimization.taylorMeasure_two_eq_zero_iff", "CartisGouldToint.Chapter01.hessianMinEig"]
source = "Cartis–Gould–Toint, Theorem 12.1.3 (ii), (12.1.14)"

[[node]]
id = "theorem_12_1_3_iii"
kind = "theorem"
desc = '''
Theorem 12.1.3 (iii). Let `ContDiffAt ℝ 3 f x`, `gradient f x = 0`, `∇²f(x)` positive semidefinite,
`M(x) = {d | ∇²f(x)[d,d] = 0}` (`= ker¹[∇f(x)] ∩ ker²[∇²f(x)]`, a subspace). Then for every `δ > 0`,
`(δ ^ 3 / 3!) * ‖P_M[∇³f(x)]‖ ≤ phiMeasure f 3 δ x` (12.1.13), where `‖P_M[T]‖ :=
⨆ (d ∈ M(x), ‖d‖ ≤ 1), |T (fun _ => d)|` (diagonal form of the projected tensor norm). Consequently,
if `phiMeasure f 3 δ x / δ ^ 3 → 0` as `δ → 0⁺`, then `∇³f(x)[d]^3 = 0` for all `d ∈ M(x)` (third-order
condition of Theorem 1.1.1).
'''
deps = ["phiMeasure", "Optimization.abs_apply_three_le_taylorMeasure"]
source = "Cartis–Gould–Toint, Theorem 12.1.3 (iii), (12.1.13), (12.1.15)"

[[node]]
id = "theorem_12_1_4"
kind = "theorem"
desc = '''
Theorem 12.1.4. If `IsLocalMin f x` and `ContDiffAt ℝ j f x`: (12.1.16) for `j ∈ {1, 2}`,
`phiMeasure f j δ x = 0` for all `δ > 0`; (12.1.17) for all `j ≥ 1`,
`Tendsto (fun δ => phiMeasure f j δ x / δ ^ j) (𝓝[>] 0) (𝓝 0)`.
'''
deps = ["phiMeasure", "Optimization.taylorMeasure_eq_zero_of_isLocalMin", "Optimization.tendsto_taylorMeasure_div_pow_of_isLocalMin"]
source = "Cartis–Gould–Toint, Theorem 12.1.4"

[[node]]
id = "example_12_1_3"
kind = "theorem"
desc = '''
Example 12.1.3. For `p ≥ 1`, `β σ > 0`, `m x = -β ⟪e₁, x⟫ + σ ‖x‖^{p+1}/(p+1)!` (`‖e₁‖ = 1`):
(i) `m` has the unique global minimizer `x* = (β p!/σ)^{1/p} e₁` with
`m x* = -p (p!/σ)^{1/p} β^{(p+1)/p}/(p+1)` (12.1.19)–(12.1.20); (ii) along `x*`, (12.1.21):
`ΔT_{m,3}(x*, α x*) = -σα²‖x*‖^{p+1}/(2(p-1)!) - σα³‖x*‖^{p+1}/(6(p-2)!)` (`p ≥ 2`), so for `p > 4`
and `‖x*‖ = 1`: `phiMeasure m 3 1 x* ≥ (p - 4) σ/(6 (p-1)!) > 0` — (12.1.16) fails for `j = 3` with `δ = 1`;
(iii) in one variable (`𝔼 = EuclideanSpace ℝ (Fin 1)`), `phiMeasure m j δ x* = 0` for all `j ∈ [1:p]` and
`δ ≤ 3‖x*‖/(p-1)` (`δ̄₃`; no restriction for `j ≤ 2` or `p ≤ 2`). (In higher dimension the book
appeals to the convexity part of Lemma B.4.1 for directions orthogonal to `x*`; not planned.)
'''
deps = ["phiMeasure", "Optimization.taylorMeasure_linearRegModel_eq_zero", "iteratedFDeriv_norm_pow_apply_self"]
source = "Cartis–Gould–Toint, Example 12.1.3, (12.1.18)–(12.1.21)"

[[node]]
id = "theorem_12_1_5_counterexample"
kind = "theorem"
desc = '''
Theorem 12.1.5 is false as printed. Let `f x = (x₂ - x₁²)² + x₂⁶ - x₁⁷` on `EuclideanSpace ℝ (Fin 2)`
and `j = 6`, `x = 0`: `f` is a polynomial (so `C^∞`, `‖∇⁷f(0)‖ ≤ L` for some `L`), `s = 0` is an
isolated (strict) minimizer of `T_{f,6}(0, s) = (s₂ - s₁²)² + s₂⁶`, but `f (t, t²) = t¹² - t⁷ < 0`
for `t ∈ (0,1)`: `0` is neither an isolated minimizer of `T_{f,7}(0,·) = f` nor a local minimizer of
`f`. (The printed proof chooses `|α|` small for each direction separately; the radius is not
uniform.) Counterexample from the earlier late-chapter report, verified by plan-ch12.
'''
source = "Cartis–Gould–Toint, Theorem 12.1.5"

[[node]]
id = "theorem_12_1_5"
kind = "theorem"
desc = '''
Theorem 12.1.5 (corrected). Let `f` be `(j+1)` times continuously differentiable near `x`
(`ContDiffAt ℝ (j+1) f x`), `‖∇^{j+1} f(x)‖ ≤ L`, and suppose `s = 0` is a *uniformly* isolated
minimizer of `T_{f,j}(x, ·)`: there are `c > 0`, `r > 0` with
`c ‖s‖ ^ j ≤ taylorPolynomial f j x s - f x` for `‖s‖ ≤ r`. Then `s = 0` is a strict local minimizer
of `T_{f,j+1}(x, ·)` and `x` is a strict (isolated) local minimizer of `f`. (Fix: the printed
hypothesis "isolated minimizer" is replaced by order-`j` growth; see
`theorem_12_1_5_counterexample`. The consequence stated after the proof — the origin is then an
isolated minimizer of `T_{f,ℓ}` for `ℓ ∈ [j:p]` — follows by induction under the same correction,
the growth `c/2 ‖s‖^j` propagating on smaller balls.)
'''
deps = ["Optimization.isStrictLocalMin_taylorPolynomial_succ_of_growth", "Optimization.isStrictLocalMin_of_taylorPolynomial_growth", "theorem_12_1_5_counterexample"]
source = "Cartis–Gould–Toint, Theorem 12.1.5"

[[node]]
id = "IsEpsDeltaApproxMinimizer"
kind = "def"
desc = '''
Key Definition (12.1.25): `IsEpsDeltaApproxMinimizer (f : 𝔼 → ℝ) (q : ℕ) (ε δ : ℕ → ℝ) (x : 𝔼) :
Prop := (∀ j ∈ Icc 1 q, ε j ∈ Ioc 0 1 ∧ δ j ∈ Ioc 0 1) ∧
Optimization.IsEpsDeltaApprox (ftaylorSeries ℝ f x) Set.univ q ε δ`, i.e.
`phiMeasure f j (δ j) x ≤ ε j * δ j ^ j / j!` for `j ∈ [1:q]` ("`x` is an `(ε,δ)`-approximate `q`th-order
minimizer with optimality radii `δ`"). Nested optimality (part of node): it implies the same for
every `q' ≤ q`.
'''
deps = ["phiMeasure", "Optimization.IsEpsDeltaApprox"]
source = "Cartis–Gould–Toint, Key Definition (12.1.25)"

[[node]]
id = "theorem_12_1_6_i"
kind = "theorem"
desc = '''
Theorem 12.1.6 (i). If `f` is differentiable at `x`, `δ₁ > 0` and `phiMeasure f 1 δ₁ x ≤ ε₁ δ₁`, then
`‖gradient f x‖ ≤ ε₁` (12.1.22).
'''
deps = ["theorem_12_1_3_i"]
source = "Cartis–Gould–Toint, Theorem 12.1.6 (i)"

[[node]]
id = "theorem_12_1_6_ii"
kind = "theorem"
desc = '''
Theorem 12.1.6 (ii) (with explicit `κ`). Let `f` be twice differentiable at `x` (the printed
"continuously differentiable" is insufficient for `∇²f` to make sense), `δ > 0`, `ε₂ ∈ (0,1]`, and
`phiMeasure f 2 δ x ≤ ε₂ δ² / 2`. Then `-ε₂ ≤ Chapter01.hessianMinEig f x` (12.1.23) and
`‖gradient f x‖ ≤ δ * κ x * √ε₂` with `κ x = √(max ‖iteratedFDeriv ℝ 2 f x‖ 1)` (depends only on
`∇²f(x)`, as in (12.1.28) `√λ_max`); more precisely `‖∇f(x)‖² ≤ δ² ε₂ max(‖∇²f(x)‖, ε₂)`. The
asymptotic remark (12.1.29) (`O(ε₂)` as `δ → 0`) is not planned.
'''
deps = ["phiMeasure", "Optimization.neg_le_minCurvature_of_taylorMeasure_two_le", "Optimization.norm_sq_le_of_taylorMeasure_two_le", "CartisGouldToint.Chapter01.hessianMinEig"]
source = "Cartis–Gould–Toint, Theorem 12.1.6 (ii)"

[[node]]
id = "theorem_12_1_7"
kind = "theorem"
desc = '''
Theorem 12.1.7 (cascading). Let `j ≥ 2`, `ε_j ∈ (0,1]`, `δ_j ∈ (0,1]`, `ε_j ≤ ε_{j-1}`,
`phiMeasure f j δ_j x ≤ ε_j δ_j^j / j!` (12.1.30) and `2 * δ_j * ‖iteratedFDeriv ℝ j f x‖ ≤ j * ε_j`
(the printed `δ_j ≤ min[1, jε_j/(2‖∇^j f(x)‖)]`, written multiplicatively so that `∇^j f(x) = 0` is
allowed). Then `phiMeasure f (j-1) δ_j x ≤ ε_{j-1} δ_j^{j-1}/(j-1)!` (12.1.31). (The recursive use described
after the theorem needs `ε_q ≤ … ≤ ε_1`; the printed `ε_1 ≤ … ≤ ε_q` is reversed.)
'''
deps = ["phiMeasure", "Optimization.taylorMeasure_le_taylorMeasure_succ_add"]
source = "Cartis–Gould–Toint, Theorem 12.1.7 (proof in Appendix B)"

[[node]]
id = "example_12_1_4"
kind = "theorem"
desc = '''
Example 12.1.4. For `f t = t⁴/24` on `EuclideanSpace ℝ (Fin 1)` and `x ≠ 0`:
`phiMeasure f 4 ‖x‖ x = ‖x‖⁴/24` (optimality displacement `d = -x`), so (12.1.25) at order `4` with
`δ₄ = ‖x‖` holds iff `ε₄ ≥ 1`: with radii shrinking like `‖x_k‖` no `x_k ≠ 0` is ever detected as
approximately optimal for `ε₄ < 1`.
'''
deps = ["phiMeasure"]
source = "Cartis–Gould–Toint, Example 12.1.4"

[[node]]
id = "theorem_12_1_8"
kind = "theorem"
desc = '''
Theorem 12.1.8 (stability). Let `f` be `C^j` (`j ≥ 1`) and `∇^j f` `L`-Lipschitz on an open ball
`ball x r` with `r > δ_j`, `δ_j, ε_j ∈ (0,1]`, and `phiMeasure f j δ_j x ≤ ε_j δ_j^j/j!` (12.1.34). If
`L > 0` then `f (x + d) ≥ f x - 2 ε_j δ_j^j/j!` for all `d` with `‖d‖ ≤ min δ_j ((j+1) ε_j / L)`
(12.1.35) (the printed `δ^j` means `δ_j^j`); if `L = 0`, `f (x + d) ≥ f x - ε_j δ_j^j/j!` for
`‖d‖ ≤ δ_j` (12.1.36).
'''
deps = ["phiMeasure", "Optimization.le_of_taylorMeasure_le"]
source = "Cartis–Gould–Toint, Theorem 12.1.8"
