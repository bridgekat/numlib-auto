# Planning conventions for the remaining declarations:
# High-order necessary, sufficient, approximate, and stable optimality conditions. Define actual Taylor models from iterated Frechet derivatives and criticality by optimization over a compact ball. The Euclidean Hessian uses the self-adjoint operator associated with the second derivative; cubic norms use the diagonal definition in the first equality of (A.7), applied to the actual orthogonally projected derivative tensors; its closed-unit-ball and unit-sphere forms are proved equal for positive tensor order in nonzero dimension. Theorem 12.1.5 is false as transcribed and is recorded with a counterexample, pending a corrected source statement.

