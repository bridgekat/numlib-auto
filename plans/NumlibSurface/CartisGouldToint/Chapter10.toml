desc = '''
Cartis–Gould–Toint, *Evaluation Complexity of Algorithms for Nonconvex Optimization*, Chapter 10,
"Step Computation without Factorizations": subproblems restricted to the Krylov subspaces
`𝒦ₖ = 𝒦(M⁻¹H, M⁻¹g, k)` computed by the preconditioned Lanczos method (§10.1), the shifted
tridiagonal factorizations and the monotonicity/convergence theory for regularization (§10.2) and
trust-region (§10.3) subproblems. Conventions as in Chapter 8; Krylov subspaces are
`Krylov.subspace`, grades `Krylov.grade` (`Numlib/Krylov/Subspace`), transported by
`Krylov.IsPreconditioner.subspace_energyEnd`. Proofs: `Subproblem.Krylov`,
`Subproblem.KrylovConvergence`, `Matrix.TridiagonalLDL`, `Matrix.InverseDecay`.

Source corrections: in (10.1.7) the leading block is `T_{k-1}` (not `T_{k-1}⁻¹`) and the nesting of
Krylov spaces is a span of a union; (B.10.4) asserts `‖M^{-T/2} H M^{-1/2}‖ = ‖M⁻¹H‖` by similarity,
which is false in general (only `≤` holds, which suffices); Corollaries 10.2.3/10.3.3 need `⌈·⌉₊`,
a separate `κ* = 1` case, and `g ≠ 0`.
'''
