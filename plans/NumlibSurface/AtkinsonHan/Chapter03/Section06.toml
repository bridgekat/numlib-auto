[[node]]
id = "example_3_6_5"
kind = "theorem"
desc = '''Example 3.6.5: Lagrange interpolation at `n + 1` distinct nodes is a projection operator on
`C[a, b]` onto `𝒫_n`, with `‖𝓟‖` the Lebesgue constant.'''
deps = ["IsProjectionOperator", "Lagrange.interpolateCLM", "Lagrange.norm_interpolateCLM"]

[[node]]
id = "example_3_6_6"
kind = "theorem"
desc = '''Example 3.6.6: piecewise-linear interpolation on a partition is a projection operator on `C[a, b]`
of norm `1`.'''
deps = ["IsProjectionOperator", "piecewiseLinearInterpCLM"]

[[node]]
id = "example_3_6_8"
kind = "theorem"
desc = '''Example 3.6.8: the Fourier projection `𝓕_n` is a projection operator on `C_p(2π)` onto the
trigonometric polynomials of degree `≤ n`, and the orthogonal projection in `L²`.'''
deps = ["IsProjectionOperator", "PeriodicCont.fourierProj"]
