[[node]]
id = "equation_3_7_20"
kind = "theorem"
desc = '''(3.7.20), Rivlin's bound `‖𝓘_n‖ ≤ 1 + (2/π) log n` on the operator norm of the trigonometric
interpolatory projection at the equispaced nodes. The Lagrange formula (3.7.19) that the book pairs
it with is proved, as `equation_3_7_19`; the norm bound waits on the backbone node
`norm_trigInterpCLM_le`, whose plan entry records what is missing. (3.7.21)–(3.7.22), the resulting
uniform error bounds, are composition once it lands.'''
deps = ["trigInterpCLM", "norm_trigInterpCLM_le"]

[[node]]
id = "example_3_7_4"
kind = "theorem"
desc = '''Example 3.7.4: for the Chebyshev weight the least-squares projection `P_N` on `C[-1, 1]` has
`‖P_N‖ = (4/π²) log N + O(1)`, by the change of variables `x = cos θ` reducing it to `𝓕_N`.'''
deps = ["PeriodicCont.norm_fourierProj", "equation_3_7_9"]

