namespace = "AtkinsonHan.Ch03"
desc = '''
Atkinson-Han §3.1: the Weierstrass and Stone-Weierstrass approximation theorems and their two
corollaries, the density of polynomials in `C(D)` for compact `D ⊆ ℝ^d` and of trigonometric
polynomials in `C_p(2π)`.

All of this is Mathlib, and it is what §2.4.4 (convergence of quadrature), §3.7 (uniform error
bounds) and §4.1 (Theorem 4.1.2) rest on, so it is worth having under the book's numbers. The one
piece of work is Corollary 3.1.3 in `d` variables: Mathlib's `polynomialFunctions_closure_eq_top`
is one-dimensional, so the multivariate case goes through
`ContinuousMap.subalgebra_topologicalClosure_eq_top_of_separatesPoints` applied to the subalgebra
generated by the coordinate functions, which separates points of `ℝ^d`.

Theorem 3.1.5, Müntz's theorem, is **not planned**: the Müntz-Szász theorem is not in Mathlib, its
proof is a development of its own, and no other result in the corpus uses it.
'''

[[node]]
id = "theorem_3_1_1"
kind = "theorem"
desc = '''Theorem 3.1.1, Weierstrass: the polynomials are dense in `C[a, b]` with the uniform norm. Mathlib's
`polynomialFunctions_closure_eq_top`; state the `∀ ε > 0, ∃ p, ‖f - p‖ ≤ ε` form the book gives,
which is `exists_polynomial_near_continuousMap`.'''

[[node]]
id = "theorem_3_1_2"
kind = "theorem"
desc = '''Theorem 3.1.2, Stone-Weierstrass: a subalgebra of `C(D, ℝ)` for compact `D` that contains the
constants and separates points is dense. Mathlib's
`ContinuousMap.subalgebra_topologicalClosure_eq_top_of_separatesPoints`; the book states it for a
subspace closed under products, which is a subalgebra.'''

[[node]]
id = "corollary_3_1_3"
kind = "theorem"
desc = '''Corollary 3.1.3: the polynomials in `d` variables are dense in `C(D, ℝ)` for compact `D ⊆ ℝ^d`.
Theorem 3.1.2 applied to the image of `MvPolynomial (Fin d) ℝ` in `C(D, ℝ)`, which contains the
constants and separates points because the coordinates do.'''
deps = ["theorem_3_1_2"]

[[node]]
id = "corollary_3_1_4"
kind = "theorem"
desc = '''Corollary 3.1.4: the trigonometric polynomials are dense in `C_p(2π)`, the continuous `2π`-periodic
functions with the uniform norm. Mathlib's `span_fourier_closure_eq_top` on `C(AddCircle (2π), ℂ)`,
restricted to real-valued functions and real trigonometric polynomials through
`realFourierCoeff_eq_fourierCoeff`; this is what makes the trigonometric system complete in
Theorem 1.3.13 and what Theorem 4.1.2 needs.'''
deps = ["theorem_3_1_2", "realFourierCoeff_eq_fourierCoeff"]
