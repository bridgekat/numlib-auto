desc = '''
Atkinson–Han, Chapter 6: the finite difference method. All three sections are formalized in full.

* Section 6.1 introduces the forward, backward and Crank–Nicolson schemes for the heat equation.
  Its only mathematical content is the four unnumbered truncation-order claims (6.1.1)–(6.1.4),
  which are formalized with explicit constants in place of the book's `O(h)`, `O(h²)`. Its one
  numbered item, Example 6.1.1, is the scheme listings themselves; together with the
  explicit/implicit distinction and the two error figures it states nothing, and it is tracked as
  an open node rather than written.
* Section 6.2, the Lax equivalence theorem, is Banach-space functional analysis from beginning to
  end and is formalized in full: the initial value problem and its solutions, well-posedness, the
  solution operators and the generalized solution, consistency, stability, convergence, the
  equivalence theorem and the convergence-order corollary. Its running example, the heat equation
  `u_t = ν u_xx` on `(0, π)` in `C₀[0, π]` (Examples 6.2.4, 6.2.8, 6.2.13), is formalized on the
  sine-series backbone `Numlib/Analysis/PDE/Heat/SineSeries` and the classical maximum principle
  `Numlib/Analysis/PDE/Heat/Classical`: well-posedness with `c₀ = 1`, the forward and backward
  schemes as operators on `C₀[0, π]` with their norm bounds and consistency, and the Lax
  equivalence theorem applied to them.
* Section 6.3 contributes Theorem 6.3.2, the elementary two-level convergence theorem, together
  with the definitions of consistency, order, stability and convergence for a family of schemes
  (Definition 6.3.1) that give it its meaning, Exercise 6.3.1, the eigenvalues of a tridiagonal
  Toeplitz matrix, which specializes the backbone module of that name, and Examples 6.3.3–6.3.4,
  the error bounds `c (h_x² + h_t)` of the forward and backward schemes in the maximum norm and in
  the discrete weighted `2`-norm, for an exact solution with `u_tt, u_xxxx` continuous (the book's
  hypothesis) and for the sine-series solutions of Example 6.2.4.

Not formalized: the remaining exercises of the chapter (Crank–Nicolson and the generalized
midpoint scheme); Exercise 6.2.3 is proved as helpers of Example 6.2.13.
'''
