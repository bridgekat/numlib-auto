[[node]]
id = "scaling_exists"
kind = "theorem"
desc = '''
The existence half of the construction: a sequence `{p_k}` is the dilation-coefficient sequence of
an actual scaling function — a `φ ∈ L²(ℝ)` with orthonormal integer translates satisfying the
scaling equation (4.5.1).

OPEN, and the description above is deliberately vaguer than the book's phrasing, because the
obvious reading is not a theorem.  "The scaling equation has a solution in `L²`" is trivially true
(take `φ = 0`), and the orthonormality condition of Exercise 4.5.2 alone does *not* give a scaling
function: `m₀(ξ) = (1 + e^{3iξ})/2`, that is `p₀ = p₃ = 1/√2` and `p_k = 0` otherwise, satisfies
`∑_k p_k p_{k-2l} = δ_{0l}`, and the cascade limit is `(1/3) 1_[0,3]`, whose integer translates are
not orthonormal.  A correct statement needs a further hypothesis — Cohen's condition, or `m₀`
nonvanishing on `[-π/2, π/2]`.  Whatever the hypothesis, the standard proofs (the infinite product
`φ̂(ξ) = ∏_{j≥1} m₀(2^{-j}ξ)`, or `L²` convergence of the cascade iteration) need the Fourier-side
theory of the symbol: the periodisation `∑_k |φ̂(ξ + 2πk)|² = 1` characterising orthonormality of
the integer translates, and the identity `φ̂(ξ) = m₀(ξ/2) φ̂(ξ/2)`.  That theory is what remains of
§4.5; it is a self-contained harmonic-analysis project and is not needed for anything else in the
chapter — in particular Mallat's theorem (`theorem_wavelet_spaces`) is proved without it, from the
two-channel algebra of `Numlib/Analysis/Wavelet/QuadratureMirror`.
'''
deps = ["exercise_4_5_2"]

[[node]]
id = "equation_4_5_6"
kind = "theorem"
desc = '''
The existence of the Daubechies `D4` scaling function: a continuous `φ` with `supp φ = [0, 3]`
satisfying the four-term scaling equation (4.5.6) and the normalisation (4.5.7).

OPEN, and downstream of `scaling_exists`: the book introduces `φ` by its properties and shows how
to compute its values, which is `exercise_4_5_5`; that such a `φ` exists is Daubechies'
construction.  `exercise_4_5_5` and `exercise_4_5_6_subset` are stated under the hypothesis that
`φ` has these properties, so they are faithful and unconditional on this node.

For this particular mask there is also an elementary route that avoids the Fourier side: the vector
`v(x) = (φ(x), φ(x+1), φ(x+2))` on `[0,1]` satisfies `v(x) = T₀ v(2x)` on `[0,1/2]` and
`v(x) = T₁ v(2x-1)` on `[1/2,1]` for two explicit `3 × 3` matrices, so `φ` is given by infinite
products of `T₀` and `T₁` along the binary expansion of `x`; the work is the contractivity of those
products on the subspace where the differences live.  Either route is a project of its own.
'''
deps = ["scaling_exists"]
