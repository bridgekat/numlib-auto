namespace = "AtkinsonHan.Ch04"
desc = '''
Atkinson-Han §4.4: the Haar wavelets — the scaling function `φ = 1_{[0,1)}`, the scaling spaces
`V_j`, the wavelet `ψ` and the wavelet spaces `W_j`, and the decomposition and reconstruction
formulas.

Everything is the backbone `Numlib/Analysis/Wavelet/Haar`. One reading has to be fixed here: the
book's `V_j` is the set of *finite* linear combinations of the `φ(2^j x - k)`, which is not closed
in `L²(ℝ)`, and the book itself says (in the paragraph after the definition) that one may equally
take the `ℓ²`-coefficient version. The surface uses the closed subspace, which is what makes
"orthonormal basis of `V_j`" (Theorem 4.4.1 (1)) and `⋂ V_j = {0}` (Theorem 4.4.1 (5)) true as
stated, and records the book's span as its dense subspace.
'''

[[node]]
id = "equation_4_4_1"
kind = "theorem"
desc = '''(4.4.1) and the definition of the scaling spaces: the Haar scaling function `φ = 1_{[0,1)}`, its
dilates and translates `2^{j/2} φ(2^j x - k)`, and `V_j` as the closed span of the latter, with the
lemma that the book's space of finite linear combinations is dense in it. The backbone
`Haar.scalingFun` and `Haar.V`.'''
deps = ["Haar.scalingFun", "Haar.V"]

[[node]]
id = "theorem_4_4_1"
kind = "theorem"
desc = '''Theorem 4.4.1, the five properties of the Haar scaling spaces: (1) `{2^{j/2} φ(2^j x - k)}` is an
orthonormal basis of `V_j`; (2) `f ∈ V_j ↔ f (2^{-j} ·) ∈ V_0`; (3) `V_j ⊊ V_{j+1}`;
(4) `closure (⋃ V_j) = L²(ℝ)`; (5) `⋂ V_j = {0}`. The backbone `Haar.orthonormal_scalingFun`,
`Haar.V_eq_map_dilation`, `Haar.V_le_V_succ`, `Haar.topologicalClosure_iSup_V` and
`Haar.iInf_V_eq_bot`; five declarations `theorem_4_4_1_1` … `theorem_4_4_1_5`.'''
deps = ["Haar.orthonormal_scalingFun", "Haar.V_eq_map_dilation", "Haar.V_le_V_succ", "Haar.topologicalClosure_iSup_V", "Haar.iInf_V_eq_bot", "equation_4_4_1"]

[[node]]
id = "theorem_4_4_2"
kind = "theorem"
desc = '''Theorem 4.4.2: an element `∑ a_k φ(2^{j+1} x - k)` of `V_{j+1}` is orthogonal to `V_j` if and only
if `a_{2k+1} = -a_{2k}` for every `k`, so that the orthogonal complement `W_j = V_{j+1} ⊖ V_j`
is spanned by the `ψ(2^j x - k)` for the Haar wavelet `ψ = φ(2·) - φ(2· - 1)` of (4.4.2). The
backbone `Haar.mem_W_iff` with `Haar.waveletFun` and `Haar.W`.'''
deps = ["Haar.mem_W_iff", "Haar.waveletFun", "Haar.W"]

[[node]]
id = "equation_4_4_3"
kind = "theorem"
desc = '''The wavelet decomposition of `L²(ℝ)` that Theorem 4.4.1 (3)-(4) and Theorem 4.4.2 give:
`V_j = V_i ⊕ W_i ⊕ ⋯ ⊕ W_{j-1}` for `i < j`, and `L²(ℝ) = V_j ⊕ W_j ⊕ W_{j+1} ⊕ ⋯` for every `j`,
all sums orthogonal. The backbone `Haar.isCompl_V_W`.'''
deps = ["Haar.isCompl_V_W", "theorem_4_4_1", "theorem_4_4_2"]

[[node]]
id = "theorem_4_4_3"
kind = "theorem"
desc = '''Theorem 4.4.3, the decomposition step: `f_j = ∑ a_k^j φ(2^j x - k)` splits as `f_{j-1} + w_{j-1}`
with `a_k^{j-1} = (a_{2k}^j + a_{2k+1}^j)/2` and `b_k^{j-1} = (a_{2k}^j - a_{2k+1}^j)/2` in the
book's unnormalised basis. The backbone `Haar.decomposition`.'''
deps = ["Haar.decomposition", "theorem_4_4_2"]

[[node]]
id = "theorem_4_4_4"
kind = "theorem"
desc = '''Theorem 4.4.4 with (4.4.16)-(4.4.17), the reconstruction step, inverse to Theorem 4.4.3:
`ã_{2k}^{j+1} = ã_k^j + b̃_k^j` and `ã_{2k+1}^{j+1} = ã_k^j - b̃_k^j`. The backbone
`Haar.reconstruction`.'''
deps = ["Haar.reconstruction", "theorem_4_4_3"]
