[[node]]
id = "definition_1_3_1"
kind = "definition"
desc = '''
Definition 1.3.1: an inner product on a linear space over `𝕂 = ℝ` or `ℂ` is positive definite,
conjugate symmetric, and linear in its first argument; the pair is an inner product space.
Not formalized: this is Mathlib's `Inner` bundled as `InnerProductSpace`, named in §1.3's module
doc, which also records that the book's `(u, v)` is Mathlib's `inner 𝕜 v u` because the two
conventions put linearity in opposite slots.
'''

[[node]]
id = "definition_1_3_5"
kind = "definition"
desc = '''
Definition 1.3.5: a Hilbert space is a complete inner product space, i.e. one that is a Banach
space under the induced norm `‖v‖ = √(v, v)`.  Not formalized: this is Mathlib's `CompleteSpace`
beside `InnerProductSpace`, named in §1.3's module doc; Mathlib bundles no `HilbertSpace`, and that
hypothesis pair is what this surface carries.
'''

[[node]]
id = "example_1_3_6"
kind = "theorem"
desc = '''
Example 1.3.6: `ℂ^d` with `(x, y) = ∑ xᵢ conj yᵢ`, the sequence space `ℓ²`, `L²(0, 1)`, `L²(Ω)`,
and the weighted space `L²_w(Ω)` with `(u, v)_w = ∫_Ω u conj v w` are Hilbert spaces.
Not formalized: an illustration of Definition 1.3.5, and Mathlib has each instance already —
`EuclideanSpace 𝕜 (Fin d)`, `lp G 2` (`lp.instInnerProductSpace`), and `MeasureTheory.Lp E 2 μ`
(`MeasureTheory.L2.innerProductSpace`), the weighted case being that last one at the measure
`μ.withDensity w`.
'''

[[node]]
id = "example_1_3_7"
kind = "theorem"
desc = '''
Example 1.3.7: `Hᵐ(a, b) = W^{m,2}(a, b)` is a Hilbert space under
`(f, g)_{Hᵐ} = ∑_{j≤m} (f^{(j)}, g^{(j)})_{L²(a,b)}`.  Not formalized: §1.3's module doc puts it out
of scope with Example 1.2.28 (b).  It needs Sobolev spaces on an interval — weak derivatives, which
Mathlib does not have there — and the project's plan places Sobolev theory outside its scope.
'''

[[node]]
id = "definition_1_3_8"
kind = "definition"
desc = '''
Definition 1.3.8: `u` and `v` are orthogonal when `(u, v) = 0`, and `v` is orthogonal to a subset
`U` when it is orthogonal to every element of `U`.  Not formalized: this is `inner 𝕜 u v = 0` in
Mathlib, named in §1.3's module doc; the Pythagoras identity the book records beside it is
`norm_add_sq_eq_norm_sq_add_norm_sq_of_inner_eq_zero`.
'''

[[node]]
id = "definition_1_3_9"
kind = "definition"
desc = '''
Definition 1.3.9: the orthogonal complement `Uᗮ = {v | (v, u) = 0 for all u ∈ U}`, always a closed
subspace.  Not formalized: this is Mathlib's `Submodule.orthogonal`, named in §1.3's module doc,
and its closedness is `Submodule.isClosed_orthogonal`.
'''

[[node]]
id = "definition_1_3_10"
kind = "definition"
desc = '''
Definition 1.3.10: `(vᵢ)` is an orthonormal system when `(vᵢ, vⱼ) = δᵢⱼ`, and an orthonormal basis
when it is in addition a basis in the sense of Definition 1.2.20.  Not formalized: this is
Mathlib's `Orthonormal`, named in §1.3's module doc, with `HilbertBasis` for the basis form;
`theorem_1_3_11`, `theorem_1_3_12` and `theorem_1_3_13` are the numbered results about it.
'''

[[node]]
id = "example_1_3_17"
kind = "theorem"
desc = '''
Example 1.3.17: Gram–Schmidt applied to `1, x, x²` in `L²(-1, 1)` gives `1/√2`, `√(3/2) x` and
`(3/2)√(5/2) (x² - 1/3)`, and the next is `(1/2)√(7/2) (5x³ - 3x)` — the first four orthonormal
Legendre polynomials.  Not formalized: a worked arithmetic illustration of `theorem_1_3_16`.  The
family itself is in the backbone as `Polynomial.legendre` with
`Polynomial.integral_legendre_mul_legendre` for the orthogonality, which §3.5 of this surface uses;
the book's `vₙ` are `√((2n+1)/2)` times those, and no result needs the first four by name.
'''
