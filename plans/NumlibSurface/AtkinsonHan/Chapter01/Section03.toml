[[node]]
id = "example_1_3_17"
kind = "theorem"
desc = '''
Example 1.3.17: Gram-Schmidt applied to `1, x, x²` in `L²(-1, 1)` gives `1/√2`, `√(3/2) x` and
`(3/2)√(5/2) (x² - 1/3)`, and the next is `(1/2)√(7/2) (5x³ - 3x)` — the first four orthonormal
Legendre polynomials.  Not formalized: a worked arithmetic illustration of `theorem_1_3_16`.  It
would need the three monomials read as elements of `L²(-1, 1)`, the `gramSchmidtNormed` recursion
unfolded three steps, and each inner product and norm evaluated as an integral of a polynomial;
the answer is used nowhere.  The family itself is in the backbone as `Polynomial.legendre` with
`Polynomial.integral_legendre_mul_legendre` for the orthogonality, which §3.5 of this surface uses;
the book's `vₙ` are `√((2n+1)/2)` times those.
'''
