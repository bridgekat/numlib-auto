[[node]]
id = "example_1_2_28"
kind = "theorem"
desc = '''
Example 1.2.28: (a) `Cᵐ[a, b]` and `C_p^k(2π)` with the norms of Example 1.2.5 (b) are Banach
spaces; (b) under `‖f‖ = [∑_{j≤m} ‖f^{(j)}‖_p^p]^{1/p}`, `Cᵐ[a, b]` is not complete, and its
completion is the Sobolev space `W^{m,p}(a, b)`.  Not formalized: §1.2's module doc puts both
clauses out of scope.  Clause (a) needs `Cᵐ[a, b]` as a normed space, which Mathlib does not have —
it has `C(X, ℝ)` for compact `X`, hence only `m = 0`; clause (b) needs Sobolev spaces on an
interval, and Mathlib has no weak derivative there.
'''
