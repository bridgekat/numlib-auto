desc = '''
Atkinson–Han, Chapter 4: Fourier analysis and wavelets (§4.1–4.5).

`notes/backbone.md` §0.2 used to put this chapter out of scope "until Mathlib has Sobolev
spaces", and records the amendment. That reason does not apply: nothing in Chapter 4 uses a Sobolev
space. What the chapter needs is `L¹`, `L²`, the Fourier transform, the Schwartz space and tempered
distributions, and Mathlib now has all of them — `SchwartzMap`, `𝓢'(E, F)` with its Fourier
transform, `Lp.fourierTransformₗᵢ` (Plancherel), `Integrable.fourierInv_fourier_eq` (inversion) and
`ZMod.dft` with its inversion theorem.

Section by section: §4.2 (the Fourier transform) is almost entirely a matter of translating between
the book's `(2π)^{-d/2} e^{-i x·ξ}` normalisation and Mathlib's `e^{-2πi x·ξ}`; §4.3 (the discrete
transform) is Mathlib's `ZMod.dft` in matrix clothes plus the radix-2 identity; §4.1 needs the real
trigonometric system and the Dirichlet kernel, which are the backbone modules
`Numlib/Analysis/Fourier/TrigonometricBasis` and `.../Dirichlet`; §4.4 needs the Haar system, which
is elementary but entirely absent from Mathlib and is `Numlib/Analysis/Wavelet/Haar`; §4.5's
general wavelet construction is the one part of the chapter that is genuinely out of reach, and the
book states it without proof.

Not formalized: the existence half of §4.5's construction (4.5.1)–(4.5.3), that a coefficient
sequence `{p_k}` is the dilation sequence of an actual scaling function — the obvious reading is
false (`φ = 0` solves the scaling equation; the mask `p₀ = p₃ = 1/√2` satisfies Exercise 4.5.2 but
its cascade limit `(1/3) 1_[0,3]` has non-orthonormal translates), so the statement needs Cohen's
condition and the Fourier-side symbol theory, of which `L¹` uniqueness on the circle and the
infinite product `φ̂(ξ) = ∏_{j≥1} m₀(2^{-j}ξ)` are still missing; the record is the
`## Not formalized here` section of `NumlibSurface/AtkinsonHan/Chapter04/Section05.lean`.
'''
