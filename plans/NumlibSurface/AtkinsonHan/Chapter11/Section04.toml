[[node]]
id = "theorem_11_4_5"
kind = "theorem"
desc = '''
Theorem 11.4.5: with `Λ = {μ ∈ L^∞(Γ) : |μ| ≤ 1 a.e. on Γ}`, the simplified friction problem
(11.4.10) is equivalent to finding `u ∈ V` and `λ ∈ Λ` with (11.4.21)
`∫_Ω (∇u · ∇v + u v) dx + g ∫_Γ λ v ds = ∫_Ω f v dx` for all `v ∈ V` and (11.4.22) `λ u = |u|` a.e.
on `Γ`; the Lagrange multiplier `λ` is unique.

Blocked (2026-09-21, agent fem2; replaces the 2026-09-15 note, whose verdict stands). The
statement lives on the boundary: the space `L^∞(Γ)` and the integrals `∫_Γ λ v ds` need the
surface measure on `Γ = ∂Ω` and the trace `v ↦ v|_Γ` (Theorem 7.3.10, `theorem_7_3_10`, itself
open on blocker 2), and the proof runs on the trace space `H^{1/2}(Γ)`, its density in `L²(Γ)`, a
Hahn–Banach extension into `(L¹(Γ))'` and the duality `(L¹(Γ))' = L^∞(Γ)` (the last exists,
`MeasureTheory.Lp.toDual_surjective` for `p = 1` on a σ-finite measure). Checked in `Numlib/`
(2026-09-21): no boundary measure, no trace and no `H^{1/2}(Γ)` — `notes/frontier.md` blocker 2;
`Numlib/Analysis/Sobolev/Slobodeckij.lean` has the fractional spaces on open sets of `ℝ^N`, not on
a boundary. Exercise 11.4.4 is a second proof through the regularization (11.4.14), on the same
objects. Estimate: after blocker 2 (trace, `L^p(Γ)`), ~250 lines.
'''
deps = ["example_11_3_11", "AtkinsonHan.Chapter07.theorem_7_3_10"]
