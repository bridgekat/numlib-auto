[[node]]
id = "example_11_4_4"
kind = "theorem"
desc = '''
Example 11.4.4: Theorem 11.4.2 applied to the friction problem (11.1.13) on a polygonal
`Ω ⊆ ℝ²` with `Γ = ⋃ᵢ Γᵢ` a union of segments and `V_h` a piecewise linear finite element space on
a regular partition. An integration by parts turns the residual into
`R(v_h, u) = ∫_Γ [(∂u/∂ν)(v_h - u) + g (|v_h| - |u|)] ds + ∫_Ω (-Δu + u - f)(v_h - u) dx`, whence
`|R(v_h, u)| ≤ (‖∂u/∂ν‖_{L²(Γ)} + g √(meas Γ)) ‖v_h - u‖_{L²(Γ)}`, and with the regularity
`u ∈ H²(Ω)`, `u|_{Γᵢ} ∈ H²(Γᵢ)` the error estimate has order `h` in `H¹(Ω)`.

Blocked (2026-09-21, agent fem2; replaces the 2026-09-15 note). What now exists: the
triangulation scaffold with the linear element and its finite element space `V_h`
(`Triangulation.polySpace`, `Numlib/Analysis/Sobolev/Triangulation.lean`), Falk's lemma in its
pointwise form (`norm_sub_le_of_isVariationalInequalitySolution`), the interpolation estimates
of Theorem 10.3.9 for the linear element (`Chapter10.theorem_10_3_9_linear`), and the obstacle
analogue `example_11_4_3` proved with the same tools. What is missing is everything that lives
on `Γ`: the friction problem itself (`example_11_3_11`, the functional `j(v) = g ∫_Γ |v| ds`)
needs the trace `v ↦ v|_Γ` and the surface measure `ds` on the polygon's boundary, the
integration by parts of the residual needs the normal derivative `∂u/∂ν ∈ L²(Γ)` and Green's
formula on a polygon, and the estimate needs the trace inequality `‖v_h − u‖_{L²(Γ)} ≤ c
‖v_h − u‖_{H¹(Ω)}` and the one-dimensional interpolation estimate on each side `Γᵢ` — all of
`notes/frontier.md` blocker 2 (no boundary measure, trace or Green formula on a domain in
`Numlib/`, checked: `Numlib/Analysis/Sobolev/Zero.lean` reads boundary values only through
continuous representatives, and Mathlib's divergence theorems are box-only). Estimate: after
blocker 2, ~300 lines on the model of `example_11_4_3`.
'''
deps = ["theorem_11_4_2", "example_11_3_11", "AtkinsonHan.Chapter10.theorem_10_3_9"]

