[[node]]
id = "example_11_4_4"
kind = "theorem"
desc = '''
Example 11.4.4: Theorem 11.4.2 applied to the friction problem (11.1.13) on a polygonal
`Ω ⊆ ℝ²` with `Γ = ⋃ᵢ Γᵢ` a union of segments and `V_h` a piecewise linear finite element space on
a regular partition. An integration by parts turns the residual into
`R(v_h, u) = ∫_Γ [(∂u/∂ν)(v_h - u) + g (|v_h| - |u|)] ds + ∫_Ω (-Δu + u - f)(v_h - u) dx`, whence
`|R(v_h, u)| ≤ (‖∂u/∂ν‖_{L²(Γ)} + g √(meas Γ)) ‖v_h - u‖_{L²(Γ)}`, and with the regularity
`u ∈ H²(Ω)`, `u|_{Γᵢ} ∈ H²(Γᵢ)` the error estimate has order `h` in `H¹(Ω)`. Not formalized: it is
`theorem_11_4_2` on a domain, needing the trace and the normal derivative on `Γ` and the finite
element interpolation estimates of §10.3; §11.4's module doc records the same.
'''
deps = ["theorem_11_4_2", "example_11_3_11", "AtkinsonHan.Chapter10.theorem_10_3_9"]

[[node]]
id = "example_11_4_3"
kind = "theorem"
desc = '''
Example 11.4.3: Theorem 11.4.2 applied to the obstacle problem on a polygon `Ω` with linear
elements on a regular family of triangulations and the discrete admissible set
`K_h = {v_h piecewise linear, v_h = 0 on Γ, v_h(x) ≥ ψ(x) at every node}`, which need not be
contained in `K`. With `R(v, w) = ∫_Ω (-Δu - f)(v - w) dx` the inequality (11.4.7) gives the bound
(11.4.9), and with `u, ψ ∈ H²(Ω)` the interpolant `Π_h u ∈ K_h` makes the error `O(h)`.
Not formalized: it is `theorem_11_4_2` on a domain, needing `H¹₀(Ω)`, `H²(Ω)` and the finite element
interpolation estimates of §10.3; §11.4's module doc records the same. Beware the near-match:
`exercise_11_4_3` is Exercise 11.4.3, the regularization bound (11.4.20), a different result with
the same number, and it is formalized.
'''
deps = ["theorem_11_4_2", "example_11_3_10", "AtkinsonHan.Chapter10.theorem_10_3_9"]

[[node]]
id = "theorem_11_4_5"
kind = "theorem"
desc = '''
Theorem 11.4.5: with `Λ = {μ ∈ L^∞(Γ) : |μ| ≤ 1 a.e. on Γ}`, the simplified friction problem
(11.4.10) is equivalent to finding `u ∈ V` and `λ ∈ Λ` with (11.4.21)
`∫_Ω (∇u · ∇v + u v) dx + g ∫_Γ λ v ds = ∫_Ω f v dx` for all `v ∈ V` and (11.4.22) `λ u = |u|` a.e.
on `Γ`; the Lagrange multiplier `λ` is unique. Not formalized: the proof runs on the trace space
`H^{1/2}(Γ)`, its density in `L²(Γ)`, a Hahn–Banach extension into `(L¹(Γ))'` and the duality
`(L¹(Γ))' = L^∞(Γ)`, and Mathlib has neither the trace space nor the surface measure on `Γ`; the
chapter's group description records the same, and Exercise 11.4.4 is a second proof of it.
'''
deps = ["example_11_3_11", "AtkinsonHan.Chapter07.theorem_7_3_10"]
