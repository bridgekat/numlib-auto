[[node]]
id = "example_11_1_2"
kind = "theorem"
desc = '''
Example 11.1.2, the simplified friction problem: on `V = H¹(Ω)`, with `g > 0` and `f ∈ L²(Ω)`,
minimize `E v = ∫_Ω (½ (|∇v|² + v²) - f v) dx + g ∫_Γ |v| ds` over `V` (11.1.12); the minimizer is
characterized by the variational inequality (11.1.13),
`∫_Ω [∇u · ∇(v - u) + u (v - u)] dx + g ∫_Γ (|v| - |u|) ds ≥ ∫_Ω f (v - u) dx` for all `v ∈ V`, and
pointwise by `-Δu + u = f` in `Ω` with `|∂u/∂ν| ≤ g` and `(∂u/∂ν) u + g |u| = 0` on `Γ`. This is the
book's model of a variational inequality of the second kind, the one §11.3 and §11.4 return to.
Not formalized: the boundary term needs the trace of an `H¹(Ω)` function and the surface measure on
`Γ`, and the pointwise form needs the normal derivative there; the abstract content is
`theorem_11_2_1` and, for solvability, `theorem_11_3_7`.

Blocked: rechecked 2026-09-20 after the Brezis backbone. The space is there
(`SobolevEuclidean (d + 1) 1 2 Ω` with `Elliptic.laplaceForm Ω = ⟪·,·⟫_{H¹}`, the form of
`−Δ + 1`), and the abstract theorem is `theorem_11_2_1` / `theorem_11_3_7` (proved). What is still
missing is blocker 2 of `notes/frontier.md`: no trace operator `H¹(Ω) → L²(Γ)` and no surface
measure on `∂Ω` exist anywhere in `Numlib/` (the only "trace" is the half-space inequality
`eLpNorm_lastZero_le_of_contDiff` of `Numlib/Analysis/Sobolev/Reflection.lean`, Brezis's
Lemma 9.9, which is not a bounded operator on a domain), so `j(v) = g ∫_Γ |v| ds` cannot be
written; the pointwise clause needs the normal derivative on `Γ` as well. Estimate: the trace
theorem on a `C¹` domain (charts, the half-space inequality, density of `C¹(Ω̄)`) is several
hundred lines of backbone; the example is then `theorem_11_2_1` with `j` the trace composed with
`‖·‖_{L¹(Γ)}`.
'''
deps = ["AtkinsonHan.Chapter07.theorem_7_3_10", "AtkinsonHan.Chapter07.definition_7_2_2_multiIndex"]
