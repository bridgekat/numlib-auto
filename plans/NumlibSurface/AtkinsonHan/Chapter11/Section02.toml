id = "example_11_2_4"
kind = "theorem"
desc = '''
Example 11.2.4: the same argument applied to the simplified friction problem of §11.1 gives the
variational inequality (11.1.13) on `V = H¹(Ω)`, with the boundary functional `j v = g ∫_Γ |v| ds`,
exactly one solution. Not formalized: it is `theorem_11_2_2` on a domain, and its `j` needs the
trace of an `H¹(Ω)` function and the surface measure on `Γ`; §11.2's module doc records the same.

Blocked: rechecked 2026-09-20 after the Brezis backbone. The obstacle problem beside it is now
`example_11_2_3`, so the abstract part (`theorem_11_2_2` at `j ≠ 0`, `theorem_11_3_7`) is the
only thing this example needs beyond `example_11_1_2` — and that one is blocked on blocker 2 of
`notes/frontier.md`: no trace operator `H¹(Ω) → L²(Γ)` and no surface measure on `∂Ω` exist in
`Numlib/`, so `j(v) = g ∫_Γ |v| ds` is not statable. Once a bounded trace `T : H¹(Ω) → L¹(Γ)` on
a `C¹` domain exists, `j = g ‖T ·‖_{L¹(Γ)}` is convex and continuous and the example is one
application of `theorem_11_2_2` with `a = Elliptic.laplaceForm Ω` (bounded, symmetric, elliptic
with `α = 1` on all of `H¹(Ω)`, `Elliptic.laplaceForm_isCoerciveWith_one`); estimate 60 lines
after the trace.
'''
deps = ["theorem_11_2_2", "example_11_1_2"]
