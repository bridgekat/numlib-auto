[[node]]
id = "theorem_11_3_12"
kind = "theorem"
desc = '''
Theorem 11.3.12: on a `C^{1,1}` domain `Ω ⊆ ℝ^d`, for `a_ij ∈ C(Ω̄)` uniformly elliptic, `p ∈ [2, ∞)`,
`f ∈ L^p(Ω)` and `ψ ∈ W^{2,p}(Ω)` with `ψ ≤ 0` on `Γ`, the solution of the obstacle problem on
`K = {v ∈ H¹₀(Ω) : v ≥ ψ a.e.}` lies in `W^{2,p}(Ω)` and satisfies
`‖u‖_{2,p} ≤ C_p (‖f‖_{0,p} + ‖ψ‖_{2,p})` with `C_p` independent of `u`, `f` and `ψ`.
Not formalized: it needs `W^{2,p}(Ω)` and `L^p(Ω)` on a `C^{1,1}` domain and the elliptic regularity
theory behind them, and the book gives no proof, citing Brezis–Stampacchia and Gilbarg–Trudinger
Theorem 9.14; the chapter's group description records the same.

Blocked: rechecked 2026-09-20 after the Brezis backbone. The obstacle problem it speaks of is now
`example_11_3_10` on `obstacleSet Ω ψ` (`Chapter11/Section01`), and linear elliptic regularity
exists for `p = 2` on `C²` domains: `Elliptic.regularity_dirichlet` of
`Numlib/Analysis/PDE/Elliptic/Regularity.lean` (`H²` with `‖u‖_{H²} ≤ C ‖f‖_{L²}` for the Dirichlet
problem of `−Δ + 1`, Brezis's Theorem 9.25). What is still missing, even for the `p = 2` clause
with `a_ij = δ_ij`: the Brezis–Stampacchia argument itself — the Lewy–Stampacchia inequality
`f ≤ −Δu ≤ max (f, −Δψ)` a.e. (by penalization or by the dual estimate), which shows `−Δu ∈ L²(Ω)`
and reduces the obstacle problem to the linear one — is in no library, and it is the whole
content of the theorem; `W^{2,p}` regularity for `p ≠ 2` (Gilbarg–Trudinger Theorem 9.14,
Calderón–Zygmund) and the `C^{1,1}` class are further away (blocker 18 of `notes/frontier.md`).
The `p = 2` clause on a `C²` domain is a bounded task once the Lewy–Stampacchia inequality is
proved: estimate 300–500 lines of backbone (`Numlib/Analysis/PDE/Elliptic/Obstacle.lean`: the
penalized problems `−Δu_ε + β_ε(u_ε − ψ) = f`, their `L²` bounds, the passage to the limit) and
then one application of `Elliptic.regularity_dirichlet`. The book quotes the theorem without proof.
'''
deps = ["example_11_3_10", "AtkinsonHan.Chapter07.definition_7_2_2_multiIndex"]
