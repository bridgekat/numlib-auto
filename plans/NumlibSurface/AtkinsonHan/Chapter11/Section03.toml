[[node]]
id = "theorem_11_3_12"
kind = "theorem"
desc = '''
Theorem 11.3.12: on a `C^{1,1}` domain `Ω ⊆ ℝ^d`, for `a_ij ∈ C(Ω̄)` uniformly elliptic, `p ∈ [2, ∞)`,
`f ∈ L^p(Ω)` and `ψ ∈ W^{2,p}(Ω)` with `ψ ≤ 0` on `Γ`, the solution of the obstacle problem on
`K = {v ∈ H¹₀(Ω) : v ≥ ψ a.e.}` lies in `W^{2,p}(Ω)` and satisfies
`‖u‖_{2,p} ≤ C_p (‖f‖_{0,p} + ‖ψ‖_{2,p})` with `C_p` independent of `u`, `f` and `ψ`.
Not formalized: it needs `W^{2,p}(Ω)` and `L^p(Ω)` on a `C^{1,1}` domain and the elliptic regularity
theory behind them, and the book gives no proof, citing Brezis–Stampacchia and Gilbarg–Trudinger
Theorem 9.14; the chapter's group description records the same.

Blocked: rechecked 2026-09-21 (closing round, ah6). The `p = 2` clause with `a_ij = δ_ij` on a
`C²` domain is now proved as `theorem_11_3_12_two` below: the Lewy–Stampacchia inequality
`f ≤ −Δu ≤ max (f, −Δψ)` is `Elliptic.IsObstacleSolution.exists_dirichletForm_eq_load` of
`Numlib/Analysis/PDE/Elliptic/Obstacle.lean` (by the truncation `min (εΦ, u − ψ)` and Hahn–Banach,
not by penalization), which gives `−Δu ∈ L²(Ω)` and reduces the obstacle problem to
`Elliptic.regularity_dirichlet`; `Elliptic.regularity_obstacle_sobolev_two` is the backbone form
of the theorem, with the a priori bound `Elliptic.IsObstacleSolution.norm_le` and
`‖ψ⁺‖_{H¹} ≤ ‖ψ‖_{H¹} ≤ ‖ψ‖_{H²}`. What remains is exactly the book's generality: `W^{2,p}(Ω)` and
`L^p(Ω)` regularity for `p ≠ 2` (Gilbarg–Trudinger Theorem 9.14, Calderón–Zygmund), general
uniformly elliptic `a_ij ∈ C(Ω̄)` (the linear regularity theory `Elliptic.regularity_dirichlet`
is for `−Δ + 1` only) and the `C^{1,1}` class in place of `C²` — blocker 18 of `notes/frontier.md`.
The book quotes the theorem without proof.
'''
deps = ["example_11_3_10", "AtkinsonHan.Chapter07.definition_7_2_2_multiIndex"]

