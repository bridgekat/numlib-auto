[[node]]
id = "theorem_10_3_5"
kind = "theorem"
desc = '''
Theorem 10.3.5: for `k > 0`, `m ≤ k + 1` and `ℙ_k(K̂) ⊆ X̂`, the element-wise interpolation operator
`Π_K` of (10.3.2) satisfies (10.3.7), `|v - Π_K v|_{m,K} ≤ c h_K^{k+1} ρ_K^{-m} |v|_{k+1,K}` for
every `v ∈ H^{k+1}(K)`, with `c` depending only on `K̂` and `Π̂`. Not formalized: it is Theorem
10.3.1 combined with Theorems 10.3.3 and 10.3.4 and Lemma 10.2.2, so it is blocked by those two,
not by the `H^m` seminorm, which is available.

Blocked: rechecked 2026-09-20; `theorem_10_3_4` is proved, so this is downstream of
`theorem_10_3_3` alone (Theorem 10.3.1 and Lemma 10.2.2 are proved). The Brezis backbone (2026-09-20) proves the missing §7.3 theory on `C¹` domains and on
Sobolev extension domains (`IsSobolevExtensionDomain N p Ω`, `Numlib/Analysis/Sobolev/Cutoff.lean`;
instances: `C¹` chart domains by `IsSobolevExtensionDomain.of_isContDiffChartDomain`, the unit
square by `SobolevEuclidean.exists_extensionL_unitSquare` of `Extension.lean`): the embeddings
(`EmbeddingDomain.lean`), Rellich–Kondrachov with `W^{k+1,p} ⊂⊂ W^{k,p}` (`Compactness.lean`), and
agent `ah1` is restating Deny–Lions (AH 7.3.12) and, if time allows, 7.3.17/7.3.18 on a fixed
extension domain. The reference simplex is a Lipschitz domain, not `C¹`, and no simplex extension
operator exists, so the reachable restatement of this node is on rectangular (`Q_k`) reference
elements — the unit square `EuclideanSpace.rect 0 1 0 1` — or waits for a simplex (Lipschitz)
extension operator (Stein, or reflection across the faces of a simplex). The proof
is then the book's: (10.3.5), (10.3.3) on `K̂`, (10.3.6) and Lemma 10.2.2's bounds
`‖T_K‖ ≤ h_K/ρ̂`, `‖T_K⁻¹‖ ≤ ĥ/ρ_K`; estimate 100–150 lines once `theorem_10_3_3` exists.
'''
deps = ["theorem_10_3_1", "theorem_10_3_3", "theorem_10_3_4", "lemma_10_2_2"]

[[node]]
id = "corollary_10_3_7"
kind = "theorem"
desc = '''
Corollary 10.3.7: under the assumptions of Theorem 10.3.5 and for a regular family `{𝒯_h}` of
finite elements there is a `c` with (10.3.10),
`‖v - Π_K v‖_{m,K} ≤ c h_K^{k+1-m} |v|_{k+1,K}` for every `v ∈ H^{k+1}(K)` and every `K ∈ 𝒯_h`:
regularity turns the `h_K` and `ρ_K` of (10.3.7) into a bound in `h_K` alone. Not formalized: it is
Theorem 10.3.5 read on a regular family, so it is blocked by that theorem and, through it, by
Theorem 10.3.3; `IsRegularFamily`, the Definition 10.3.6 half of its hypotheses, is formalized
here.

Blocked: rechecked 2026-09-20; downstream of `theorem_10_3_5`, hence of `theorem_10_3_3`
(`theorem_10_3_4` is proved). The Brezis backbone (2026-09-20) proves the missing §7.3 theory on `C¹` domains and on
Sobolev extension domains (`IsSobolevExtensionDomain N p Ω`, `Numlib/Analysis/Sobolev/Cutoff.lean`;
instances: `C¹` chart domains by `IsSobolevExtensionDomain.of_isContDiffChartDomain`, the unit
square by `SobolevEuclidean.exists_extensionL_unitSquare` of `Extension.lean`): the embeddings
(`EmbeddingDomain.lean`), Rellich–Kondrachov with `W^{k+1,p} ⊂⊂ W^{k,p}` (`Compactness.lean`), and
agent `ah1` is restating Deny–Lions (AH 7.3.12) and, if time allows, 7.3.17/7.3.18 on a fixed
extension domain. The reference simplex is a Lipschitz domain, not `C¹`, and no simplex extension
operator exists, so the reachable restatement of this node is on rectangular (`Q_k`) reference
elements — the unit square `EuclideanSpace.rect 0 1 0 1` — or waits for a simplex (Lipschitz)
extension operator (Stein, or reflection across the faces of a simplex). Estimate 50 lines once `theorem_10_3_5` exists,
`IsRegularFamily` being formalized.
'''
deps = ["theorem_10_3_5", "IsRegularFamily"]

[[node]]
