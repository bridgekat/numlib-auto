[[node]]
id = "example_10_3_8"
kind = "theorem"
desc = '''
Example 10.3.8: for a triangle `K` in a regular family of affine finite elements whose nodes are
its three vertices and whose local space is `X_K = ℙ₁(K)`, Corollary 10.3.7 at `k = 1` gives
(10.3.11), `‖v - Π_K v‖_{m,K} ≤ c h_K^{2-m} |v|_{2,K}` for every `v ∈ H²(K)`, and the book notes it
holds for `m = 0` and `m = 1`. Not formalized: it is Corollary 10.3.7 instantiated, so it is
blocked by that corollary and, through it, by Theorem 10.3.3. `H²(K)` itself, with its norm and
seminorm, is available: `AtkinsonHan.Chapter07.definition_7_2_2_multiIndex` and
`definition_7_2_2_multiIndex_norm` are proved.

Blocked: rechecked 2026-09-20; downstream of `corollary_10_3_7`, hence of `theorem_10_3_3`
(`theorem_10_3_4` is proved). Note that the example is on *triangles*, the simplex case: The Brezis backbone (2026-09-20) proves the missing §7.3 theory on `C¹` domains and on
Sobolev extension domains (`IsSobolevExtensionDomain N p Ω`, `Numlib/Analysis/Sobolev/Cutoff.lean`;
instances: `C¹` chart domains by `IsSobolevExtensionDomain.of_isContDiffChartDomain`, the unit
square by `SobolevEuclidean.exists_extensionL_unitSquare` of `Extension.lean`): the embeddings
(`EmbeddingDomain.lean`), Rellich–Kondrachov with `W^{k+1,p} ⊂⊂ W^{k,p}` (`Compactness.lean`), and
agent `ah1` is restating Deny–Lions (AH 7.3.12) and, if time allows, 7.3.17/7.3.18 on a fixed
extension domain. The reference simplex is a Lipschitz domain, not `C¹`, and no simplex extension
operator exists, so the reachable restatement of this node is on rectangular (`Q_k`) reference
elements — the unit square `EuclideanSpace.rect 0 1 0 1` — or waits for a simplex (Lipschitz)
extension operator (Stein, or reflection across the faces of a simplex).
'''
deps = ["corollary_10_3_7"]

[[node]]
id = "theorem_10_3_3"
kind = "theorem"
desc = '''
Theorem 10.3.3: for nonnegative integers `k > 0` and `m ≤ k + 1` with `ℙ_k(K̂) ⊆ X̂`, the nodal
interpolation operator `Π̂` of (10.3.1) on the reference element satisfies (10.3.3),
`|v̂ - Π̂ v̂|_{m,K̂} ≤ c |v̂|_{k+1,K̂}` for every `v̂ ∈ H^{k+1}(K̂)`. Not formalized: `H^{k+1}(K̂)` is
available, `AtkinsonHan.Chapter07.definition_7_2_2_multiIndex` being proved, and what blocks this
is the §7.3 theory over it — the embedding `H^{k+1}(K̂) ↪ C(K̂)` that makes `Π̂ v̂` meaningful
(`AtkinsonHan.Chapter07.theorem_7_3_7`) and the Bramble–Hilbert quotient-norm estimate
(`AtkinsonHan.Chapter07.theorem_7_3_17`, which rests on Deny–Lions, `theorem_7_3_12`), all open.
Beware the near-match: `exercise_10_3_3` is Exercise 10.3.3, the angle criterion for regularity, a
different result with the same number, and it *is* formalized.

Blocked: rechecked 2026-09-20. Theorem 10.3.4 is now proved (`theorem_10_3_4`, with the general
`sobolevSeminorm_comp_affine_le`), and the seminorm `|·|_{m,K̂}` of this section is the backbone's
`sobolevSeminorm` (tensor form). The Brezis backbone (2026-09-20) proves the missing §7.3 theory on `C¹` domains and on
Sobolev extension domains (`IsSobolevExtensionDomain N p Ω`, `Numlib/Analysis/Sobolev/Cutoff.lean`;
instances: `C¹` chart domains by `IsSobolevExtensionDomain.of_isContDiffChartDomain`, the unit
square by `SobolevEuclidean.exists_extensionL_unitSquare` of `Extension.lean`): the embeddings
(`EmbeddingDomain.lean`), Rellich–Kondrachov with `W^{k+1,p} ⊂⊂ W^{k,p}` (`Compactness.lean`), and
agent `ah1` is restating Deny–Lions (AH 7.3.12) and, if time allows, 7.3.17/7.3.18 on a fixed
extension domain. The reference simplex is a Lipschitz domain, not `C¹`, and no simplex extension
operator exists, so the reachable restatement of this node is on rectangular (`Q_k`) reference
elements — the unit square `EuclideanSpace.rect 0 1 0 1` — or waits for a simplex (Lipschitz)
extension operator (Stein, or reflection across the faces of a simplex). With Bramble–Hilbert on the square in hand, this node is the
book's four-line argument: the polynomial invariance (10.3.4) of `Approximation.nodalInterp` plus
the boundedness of `Π̂ : H^{k+1}(K̂) → H^m(K̂)`, which needs the embedding `H^{k+1}(K̂) ↪ C(K̂)`
(`SobolevEuclidean.isCompactEmbedding_toContinuousMapL_of_gt` on an extension domain, `k + 1 > d/2`).
Estimate 200–300 lines on the square once `ah1`'s 7.3.17 lands; the simplex case waits.
'''
deps = ["AtkinsonHan.Chapter07.theorem_7_3_17", "AtkinsonHan.Chapter07.theorem_7_3_7", "AtkinsonHan.Chapter07.definition_7_2_2_multiIndex"]

