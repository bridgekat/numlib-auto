[[node]]
id = "example_10_2_3"
kind = "theorem"
desc = '''
Example 10.2.3: the linear element space `X_h = {v_h : v_h|_K ∈ ℙ₁(K) for every K ∈ 𝒯_h}` on a
triangulation, with each `v_h|_K` determined by its values at the three vertices, satisfies the
representation formula (10.2.28) `v_h|_K = ∑_i v_h(aᵢ) λᵢ` in barycentric coordinates and is
globally continuous — the difference of two restrictions is linear along a shared edge and vanishes
at its endpoints — so `X_h` is an affine-equivalent finite element space of continuous piecewise
linear functions; the book adds that the same holds for `ℙ_k` determined on the nodal set
`N_k(K)` of (10.2.29). The reference-element half — the nodal bases and their duality — is
`quadraticShape`, `cubicShape` and `latticeShape` here, and (10.2.28) on one element is
`Chapter10.example_10_3_2` with `nodalInterp_coord_affineMap`. Beware the near-match:
`exercise_10_2_3` is Exercise 10.2.3, the `ℚ_{1,1}` nodal basis on the reference square, a
different result with the same number.

Blocked: rechecked 2026-09-20 (ah7; blocker 11 of `notes/frontier.md`). The reason stands and is a
scope decision, not a mathematical gap: a triangulation of a plane domain (a finite family of
nondegenerate triangles meeting edge to edge, the affine maps to the reference triangle) and the
conformity `X_h ⊆ C(Ω̄)` of a piecewise polynomial space over it are not formalized anywhere in
`Numlib/` — checked this round: `Chapter10/Section02.lean` has no triangulation type,
`Chapter10.IsRegularFamily` is a family of collections of sets with no covering or
face-matching structure, and `Numlib/Geometry/Euclidean/TriangleShape.lean` is about one
triangle's angles and inradius. The interpolation estimates of §10.3 (`theorem_10_3_3`,
`theorem_10_3_5`, `corollary_10_3_7`, proved this round) are elementwise and do not need this
node; `theorem_10_3_9`, `theorem_10_4_1`, `example_10_4_2` and the chapter-11 concrete
variational inequalities do. A `Numlib/Geometry/Triangulation` scaffold is the prerequisite:
estimate 800–1500 lines for the scaffold (elements, faces, the global nodes, the global
interpolant glued from `Approximation.nodalInterp`, and the continuity across a shared edge
from the unisolvence of `ℙ_k` on the edge's lattice, `eq_zero_of_eval_latticePoint` restricted
to a line), then ~150 for this node.
'''
deps = ["lemma_10_2_2", "refBary", "latticeShape"]
