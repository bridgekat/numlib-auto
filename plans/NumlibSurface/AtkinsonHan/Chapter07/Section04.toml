[[node]]
id = "example_7_4_2"
kind = "theorem"
desc = '''Example 7.4.2: on a Lipschitz domain `Ω ⊆ ℝ^d` with `k > d/2`, `H^k(Ω) ↪ C(closure Ω)`,
i.e. `‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^k(Ω)}` (7.4.3). The proof inverts the Fourier transform,
applies Cauchy-Schwarz against `∫ (1+|ξ|^2)^{-k} dξ < ∞ ↔ k > d/2`, extends by density from
`C_0^∞(ℝ^d)`, and then transfers to `Ω` by the extension operator. Not formalized: Step 3 is
Theorem 7.3.5 and Step 2 is Theorem 7.3.4, so this is the §7.3 embedding on a domain again -- the
chapter's obstruction, not the Fourier analysis.

Blocked: re-checked 2026-09-15 against Mathlib at this pin. Step 3 is the extension operator of
Theorem 7.3.5, which does not exist here or in Mathlib (`Stein`, `Calderon`, `extensionOperator`:
zero relevant occurrences), so the statement *on a domain* stays out of reach. Steps 1 and 2 --
the whole-space embedding `H^k(R^d)` into the bounded continuous functions for `k > d/2` -- are
*not* blocked: Mathlib's `TemperedDistribution.MemSobolev.fourier_memL1` (needing
`finrank R E < 2 s`) is exactly the Cauchy-Schwarz step, built on
`integrable_rpow_neg_one_add_norm_sq`, and what remains is to read the continuous representative
off the inverse Fourier transform of an `L^1` function and bound it by the `L^1` norm. The
friction there is that `MeasureTheory.Lp.fourierInv_toTemperedDistribution_eq`
(`Mathlib/Analysis/Fourier/LpSpace.lean`) is stated for `p = 2` only, so the `L^1` end of that
bridge -- that the distributional inverse Fourier transform of an `L^1` function is the pointwise
integral, which `VectorFourier.fourierIntegral_continuous` then makes a bounded continuous
function -- has to be built. Estimated 150-250 lines for that whole-space clause, which would be
a new node; the domain node itself still needs 7.3.5.'''
deps = ["theorem_7_4_1", "theorem_7_3_4", "theorem_7_3_5", "definition_7_3_6"]

[[node]]
id = "example_7_4_3"
kind = "theorem"
desc = '''Example 7.4.3: on a Lipschitz domain `Ω ⊆ ℝ^d`,
`‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^d(Ω)}^{1/2} ‖v‖_{L^2(Ω)}^{1/2}` for `v ∈ H^d(Ω)` (7.4.4), by the
argument of Example 7.4.2 with the scaled multiplier `(1+λ|ξ|^2)^{d/2}` and the optimal
`λ = (‖v‖_{L^2}/‖v‖_{H^d})^{2/d}`. Not formalized: like Example 7.4.2 it reaches the domain only
through the extension operator of Theorem 7.3.5 and the density of Theorem 7.3.4, which are the
chapter's obstruction.

Blocked: re-checked 2026-09-15. Same obstruction as `example_7_4_2` and downstream of it; the
scaling argument adds nothing that is missing, the extension operator of Theorem 7.3.5 is what
is missing.'''
deps = ["example_7_4_2", "theorem_7_3_5"]
