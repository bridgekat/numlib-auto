[[node]]
id = "equation_7_4_1"
kind = "theorem"
desc = '''(7.4.1), the norm equivalence that the book states after the membership criterion of
Theorem 7.4.1: there are `c_1, c_2 > 0` with
`c_1 ||v||_{H^k(R^d)} <= || (1 + |xi|^2)^{k/2} Fv ||_{L^2(R^d)} <= c_2 ||v||_{H^k(R^d)}`
for every `v` in `H^k(R^d)`, the left-hand norm being the one Definition 7.2.2 displays,
`[sum_{|a| <= k} ||d^a v||_{L^2}^2]^{1/2}`, which is the norm of
`SobolevMultiIndex R (stdBasis d) k 2 (top) volume` by `definition_7_2_2_multiIndex_norm`.

The *membership* half of Theorem 7.4.1 is proved, as `theorem_7_4_1`, and does not give this: it
goes through Mathlib's `TemperedDistribution.MemSobolev.fourierMultiplierCLM_of_bounded`, which
is a soft statement about bounded symbols and carries no constants. What (7.4.1) needs on top is

(1) **Exercise 7.4.2**, the two-sided symbol inequality
`c_1 (sum_{|a| <= k} |xi^a|^2)^{1/2} <= (1 + |xi|^2)^{k/2} <= c_2 (sum_{|a| <= k} |xi^a|^2)^{1/2}`.
The upper bound is easy: `|xi^a|^2 <= (1 + |xi|^2)^{|a|} <= (1 + |xi|^2)^k` for `|a| <= k`, and the
sum has `#{a : |a| <= k}` terms. For the lower bound the multinomial expansion is *not* needed --
the cheap route is the largest coordinate. With `t = max_i |xi_i|` one has `|xi|^2 <= d t^2`, so
`(1 + |xi|^2)^k <= (1 + d)^k max(1, t^2)^k = (1 + d)^k max(1, t^{2k})`, and `t^{2k} = (xi^a)^2` for
the multi-index `a = k e_i` at a maximizing `i`, which has `|a| = k`; since the sum also contains
the term `a = 0`, whose value is `1`, the whole of `max(1, t^{2k})` is bounded by
`sum_{|a| <= k} (xi^a)^2`. So `c_1 = (1 + d)^{-k/2}` works, with no combinatorics at all.

(2) **The Fourier transform of a weak derivative on the whole space**,
`F(d^a v) = (2 pi i xi)^a Fv` in `L^2`, which follows from Mathlib's
`TemperedDistribution.fourier_lineDerivOp_eq` iterated, once the weak derivative is identified with
the distributional one by `MeasureTheory.Lp.iteratedLineDerivOp_eq_iff_hasWeakIteratedLineDerivOn`
of `Numlib/Analysis/Sobolev/Tempered.lean`, and once the `L^2` representative is read off as in
`fourier_aeEq_symbol_mul_fourier_of_besselPotential_eq`.

With those two, Plancherel (`MeasureTheory.Lp.norm_fourier_eq`, as used in `equation_7_4_2_norm`)
turns `sum_{|a| <= k} ||d^a v||_{L^2}^2` into `int sum_{|a| <= k} (2 pi)^{2|a|} |xi^a|^2 |Fv|^2`
and the symbol inequality compares it with `int (1 + |xi|^2)^k |Fv|^2`.'''
deps = ["theorem_7_4_1", "definition_7_2_2_multiIndex_norm", "equation_7_4_2_norm"]

[[node]]
id = "example_7_4_2"
kind = "theorem"
desc = '''Example 7.4.2: on a Lipschitz domain `Ω ⊆ ℝ^d` with `k > d/2`, `H^k(Ω) ↪ C(closure Ω)`,
i.e. `‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^k(Ω)}` (7.4.3). The proof inverts the Fourier transform,
applies Cauchy-Schwarz against `∫ (1+|ξ|^2)^{-k} dξ < ∞ ↔ k > d/2`, extends by density from
`C_0^∞(ℝ^d)`, and then transfers to `Ω` by the extension operator. Not formalized: Step 3 is
Theorem 7.3.5 and Step 2 is Theorem 7.3.4, so this is the §7.3 embedding on a domain again -- the
chapter's obstruction, not the Fourier analysis.'''
deps = ["theorem_7_4_1", "theorem_7_3_4", "theorem_7_3_5", "definition_7_3_6"]

[[node]]
id = "example_7_4_3"
kind = "theorem"
desc = '''Example 7.4.3: on a Lipschitz domain `Ω ⊆ ℝ^d`,
`‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^d(Ω)}^{1/2} ‖v‖_{L^2(Ω)}^{1/2}` for `v ∈ H^d(Ω)` (7.4.4), by the
argument of Example 7.4.2 with the scaled multiplier `(1+λ|ξ|^2)^{d/2}` and the optimal
`λ = (‖v‖_{L^2}/‖v‖_{H^d})^{2/d}`. Not formalized: like Example 7.4.2 it reaches the domain only
through the extension operator of Theorem 7.3.5 and the density of Theorem 7.3.4, which are the
chapter's obstruction.'''
deps = ["example_7_4_2", "theorem_7_3_5"]
