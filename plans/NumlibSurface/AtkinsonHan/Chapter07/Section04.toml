[[node]]
id = "theorem_7_4_1"
kind = "theorem"
desc = '''Theorem 7.4.1: `v` in `L^2(R^d)` lies in `H^k(R^d)` if and only if
`(1 + |xi|^2)^{k/2} Fv` lies in `L^2(R^d)`, and the two norms are equivalent (7.4.1), so `H^s(R^d)`
may be *defined* by the Fourier condition for any real `s` (7.4.2), with `H^0 = L^2` and, on
tempered distributions, for `s < 0`.

Half of this is formalized and half is not, and the halves must not be confused. The book's
`H^k(R^d)` is the `W^{k,2}(R^d)` of Definition 7.2.2, cut out by the weak derivatives `d^a v` of
order `|a| <= k`; `equation_7_4_2` and `equation_7_4_2_norm` prove the displayed Fourier condition
and its norm identity against a *different* reading of `H^s(R^d)`, Mathlib's Bessel potential space
`TemperedDistribution.MemSobolev s 2`. What this node still asks for is that the two readings
coincide for integer `s = k`, which is the content of Theorem 7.4.1 and of the norm equivalence
(7.4.1). Two pieces are missing and neither is in Mathlib.

(1) **The bridge**: the distributional derivative `d_{m}` of
`Mathlib/Analysis/Distribution/TemperedDistribution.lean`, which tests against the Schwartz class,
agrees on the whole space with `HasWeakIteratedLineDerivOn` of
`Numlib/Analysis/Sobolev/WeakDeriv.lean`, which tests against `C_0^inf(R^d)`. One direction is free
(a test function is Schwartz); the other is a truncation argument -- multiply a Schwartz function
`f` by `chi(x/n)` for a `ContDiffBump` `chi`, so that `chi(./n) f` is a test function, and pass to
the limit in the integral by dominated convergence, the cross term carrying a factor `1/n` from
`d_m chi(./n)`. About 150-250 lines, and it is the piece worth doing first: it is what any later
transfer between this project's `W^{k,p}` and Mathlib's tempered-distribution theory will need. It
needs no convolution theory, so it is not blocked the way section 7.3 is.

(2) **The symbol inequality of Exercise 7.4.2**, `(1 + |xi|^2)^{k/2} <= c sum_{|a| <= k} |xi^a|`,
which is the multinomial theorem, needed for the direction that reconstructs membership of `H^k`
from the derivatives; the opposite direction is `memLp_iteratedLineDerivOp`, which is proved. A
cleaner route than the multinomial estimate is an induction on `k` over the multiplier identity
`(1 + |xi|^2)^{1/2} = (1 + |xi|^2)^{-1/2} + sum_i xi_i * [xi_i (1 + |xi|^2)^{-1/2}]`, whose
summands are all bounded symbols, so that
`TemperedDistribution.MemSobolev.fourierMultiplierCLM_of_bounded` and `MemSobolev.add` carry the
step.

A third, smaller wrinkle: the book's `H^k(R^d)` is real-valued and Mathlib's tempered distributions
are complex-valued, so the statement also needs the complexification of an `L^2(R^d; R)` function
and the fact that it preserves weak derivatives.'''
deps = ["equation_7_4_2", "definition_7_2_2_multiIndex", "definition_7_1_3_multiIndex"]

[[node]]
id = "example_7_4_2"
kind = "theorem"
desc = '''Example 7.4.2: on a Lipschitz domain `Ω ⊆ ℝ^d` with `k > d/2`, `H^k(Ω) ↪ C(closure Ω)`,
i.e. `‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^k(Ω)}` (7.4.3). The proof inverts the Fourier transform,
applies Cauchy-Schwarz against `∫ (1+|ξ|^2)^{-k} dξ < ∞ ↔ k > d/2`, extends by density from
`C_0^∞(ℝ^d)`, and then transfers to `Ω` by the extension operator. Not formalized: Step 3 is
Theorem 7.3.5 and Step 2 is Theorem 7.3.4, so this is the §7.3 embedding on a domain again -- the
chapter's obstruction, not the Fourier analysis.'''
deps = ["theorem_7_4_1", "theorem_7_3_4", "theorem_7_3_5", "definition_7_3_6"]

[[node]]
id = "example_7_4_3"
kind = "theorem"
desc = '''Example 7.4.3: on a Lipschitz domain `Ω ⊆ ℝ^d`,
`‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^d(Ω)}^{1/2} ‖v‖_{L^2(Ω)}^{1/2}` for `v ∈ H^d(Ω)` (7.4.4), by the
argument of Example 7.4.2 with the scaled multiplier `(1+λ|ξ|^2)^{d/2}` and the optimal
`λ = (‖v‖_{L^2}/‖v‖_{H^d})^{2/d}`. Not formalized: like Example 7.4.2 it reaches the domain only
through the extension operator of Theorem 7.3.5 and the density of Theorem 7.3.4, which are the
chapter's obstruction.'''
deps = ["example_7_4_2", "theorem_7_3_5"]
