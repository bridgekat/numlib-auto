[[node]]
id = "example_7_4_3"
kind = "theorem"
desc = '''Example 7.4.3: on a Lipschitz domain `Ω ⊆ ℝ^d`,
`‖v‖_{C(closure Ω)} ≤ c ‖v‖_{H^d(Ω)}^{1/2} ‖v‖_{L^2(Ω)}^{1/2}` for `v ∈ H^d(Ω)` (7.4.4), by the
argument of Example 7.4.2 with the scaled multiplier `(1+λ|ξ|^2)^{d/2}` and the optimal
`λ = (‖v‖_{L^2}/‖v‖_{H^d})^{2/d}`.

Blocked: 2026-09-20. Two pieces are missing. (1) Step 1 on `ℝ^d`: the pointwise bound
`|v(x)| ≤ c ∫ |ℱv|` for the continuous representative of `v ∈ H^k(ℝ^d)`, `k > d/2` — Mathlib has
`TemperedDistribution.MemSobolev.fourier_memL1` (`ℱv ∈ L^1` for `finrank < 2s`) and
`theorem_7_4_1`/`equation_7_4_1` identify `∫ (1+|ξ|²)^k |ℱv|²` with `‖v‖²_{H^k}`, but the
inverse Fourier representation `v = ℱ⁻¹(ℱv)` of the continuous representative of an `L²`
function with `ℱv ∈ L¹` (`Mathlib/Analysis/Fourier/LpSpace.lean` is `p = 2` only) is not
written (150–250 lines); the scaling `ξ ↦ λ^{1/2} ξ` of that bound and the optimization in `λ`
are then elementary (`SobolevEuclidean.eLpNorm_comp_smul_eq` of `Translate.lean` is the scaling
device). (2) Step 3, the transfer to `Ω`, needs the extension operator at order `d`
(`theorem_7_3_5_universal`, open; the backbone's is order one), so the domain statement is out
of reach for `d ≥ 2` even with (1); for `d = 1` the order-one operator suffices. Neither the
Deny–Lions module nor `example_7_4_2` (proved by the Sobolev embedding instead of the Fourier
route) helps here: the inequality is a genuine Fourier statement, whose whole-space form on
`ℝ^d` would be a new node.'''
deps = ["example_7_4_2", "theorem_7_4_1", "theorem_7_3_5_universal"]
