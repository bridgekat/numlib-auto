[[node]]
id = "theorem_7_3_2"
kind = "theorem"
desc = '''Theorem 7.3.2: on a Lipschitz domain, `C^∞(closure Ω)` is dense in `W^{k,p}(Ω)` for
`1 ≤ p < ∞`, so `W^{k,p}(Ω)` is the completion of `C^∞(closure Ω)` under `‖·‖_{k,p}`. Not
formalized: density up to the boundary is the Calderon-Stein apparatus -- a translation-and-mollify
argument in boundary charts -- and Mathlib has neither Sobolev spaces on a domain nor Lipschitz
boundary charts. The book states it without proof (citing [78]).

Blocked: re-checked 2026-09-15 against Mathlib at this pin (grep over the whole library:
`Calderon`, `Calderón`, `Meyers`, `Serrin`, `Rellich`, `Kondrachov`, `Korn` all have zero
occurrences, and `Stein` only in unrelated names). The domain-side apparatus this needs is the
same as Theorem 7.3.5's. The boundary charts themselves are *available* here --
`definition_7_2_1_finite_cover` produces the `(x_i, r_i)` and the graph functions `g_i` -- so what
is missing is the translation-and-mollify argument in a chart and the partition of unity gluing
it, not the hypothesis. `notes/fem-roadmap.md` Decision B applies: the `C^1`-domain version
(Evans §5.4) is elementary and `IsContDiffDomain` already exists in
`Numlib/Analysis/Sobolev/Domain.lean`, so a weaker-hypothesis restatement is the cheap route.'''
deps = ["definition_7_2_1", "theorem_7_3_1"]

