[[node]]
id = "example_7_3_15_boundary"
kind = "theorem"
desc = '''Example 7.3.15, the boundary clause: on an open bounded `Ω ⊆ ℝ^d` with Lipschitz
boundary, Theorem 7.3.13 with `k = 1`, `p = 2`, `J = 1` and `f_1(v) = ∫_Γ |v| ds` gives a
constant `c > 0` with `‖v‖_{1,Ω} ≤ c (|v|_{1,Ω} + ‖v‖_{L^1(Γ)})` for all `v ∈ H^1(Ω)`. The
`H_0^1` clause (7.3.10) that the book derives from it is `example_7_3_15`, proved directly by
Poincaré's inequality.

Blocked: 2026-09-21 (blocker 2 of `notes/frontier.md`; re-checked, unchanged by the closing
round): `f_1` is the boundary integral of the trace, which needs `theorem_7_3_10`. Everything else is in place: with a trace
`γ : W^{1,2}(Ω) → L^1(Γ)` bounded (`(H1)`), the seminorm `f_1 = ‖γ ·‖_{L^1(Γ)}` satisfies (H2)′
because a constant with zero trace is zero (`Γ` has positive surface measure), and
`theorem_7_3_13` gives the inequality in ten lines.'''
deps = ["theorem_7_3_13", "theorem_7_3_10"]

[[node]]
id = "example_7_3_16"
kind = "theorem"
desc = '''Example 7.3.16: with `Γ_0 ⊆ Γ` open and nonempty and `f_1(v) = ∫_{Γ_0} |v| ds`, Theorem
7.3.12 gives `‖v‖_{1,Ω} ≤ c (|v|_{1,Ω} + ‖v‖_{L^1(Γ_0)})` on `H^1(Ω)` and hence
`‖v‖_{1,Ω} ≤ c |v|_{1,Ω}` on `H^1_{Γ_0}(Ω) = {v ∈ H^1(Ω) : v = 0 a.e. on Γ_0}` -- the
Poincare-Friedrichs inequality under a mixed boundary condition. Not formalized: as Example 7.3.15,
it needs the trace of Theorem 7.3.10.

Blocked: 2026-09-21 (blocker 2; re-checked, unchanged by the closing round). `theorem_7_3_12`
is proved; what is missing is only the trace
`γ` of `theorem_7_3_10` (the seminorm `f_1(v) = ‖γ v‖_{L^1(Γ_0)}` and the fact that a constant
vanishing on `Γ_0` of positive surface measure is zero), and "`v = 0` a.e. on `Γ_0`" is not
statable before the boundary measure exists. Ten lines after `theorem_7_3_10`.'''
deps = ["theorem_7_3_12", "theorem_7_3_10"]

