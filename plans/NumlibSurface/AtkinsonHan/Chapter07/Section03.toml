[[node]]
id = "example_7_3_15_boundary"
kind = "theorem"
desc = '''Example 7.3.15, the boundary clause, on a bounded `C¹` domain (`hΩ : IsContDiffDomain 1 Ω`,
`hb : Bornology.IsBounded Ω`, `Ω` connected as in `theorem_7_3_13`; the book's "Lipschitz"
restated as `C¹`): with `γ := (hΩ.traceFamily hb).traceL 2 _ : H¹(Ω) →L L²(Γ)` and
`f₁ v := ∫ |γ v| dσ` (`σ := hΩ.boundaryMeasure hb`, finite, so `L²(σ) ⊆ L¹(σ)` and `f₁` is a
seminorm bounded by `√(σ Γ) ‖γ‖ ‖v‖`), Theorem 7.3.13 with `k = 1`, `p = 2`, `J = 1` gives a
constant `c > 0` with `‖v‖_{1,Ω} ≤ c (|v|_{1,Ω} + ∫_Γ |γ v| dσ)` for all `v ∈ H¹(Ω)`. Restated
2026-09-21 (boundary round): (H1) is the boundedness of the trace; (H2)′ — a constant `v` with
`f₁ v = 0` is `0` — holds because the trace of the constant `c` is the constant `c` on `Γ`
(`traceL_ae_eq` for the continuous representative) and `σ Γ > 0`
(`IsContDiffDomain.boundaryMeasure_pos_of_isOpen` with `U = univ`, `Ω` nonempty). The `H¹₀` clause
(7.3.10) is `example_7_3_15`, proved directly. ★, ~40 lines after `theorem_7_3_13`.'''
deps = ["theorem_7_3_13", "theorem_7_3_10", "IsContDiffDomain.boundaryMeasure_pos_of_isOpen"]

[[node]]
id = "example_7_3_16"
kind = "theorem"
desc = '''Example 7.3.16 on a bounded `C¹` domain (`hΩ`, `hb`, `Ω` connected; "Lipschitz" restated as
`C¹`): for an open `U ⊆ ℝ^d` meeting `∂Ω` — the book's "open non-empty `Γ₀ ⊆ Γ`" is
`Γ₀ := U ∩ frontier Ω` — and `f₁ v := ∫ x in U, |γ v x| ∂σ` (`γ := (hΩ.traceFamily hb).traceL 2 _`,
`σ := hΩ.boundaryMeasure hb`), Theorem 7.3.12 with `k = 1`, `p = 2`, `J = 1` gives `c > 0` with
`‖v‖_{1,Ω} ≤ c (|v|_{1,Ω} + f₁ v)` on `H¹(Ω)`, hence `‖v‖_{1,Ω} ≤ c |v|_{1,Ω}` on
`H¹_{Γ₀}(Ω) := {v ∈ H¹(Ω) : γ v = 0 σ-a.e. on U}` — the Poincaré–Friedrichs inequality under a
mixed boundary condition. Restated 2026-09-21 (boundary round): "`v = 0` a.e. on `Γ₀`" is
`(γ v : E → ℝ) =ᵐ[σ.restrict U] 0`; (H2) for `theorem_7_3_12` — a polynomial of degree `≤ 0`
(a constant) with `f₁ = 0` is zero — uses `σ U > 0`
(`IsContDiffDomain.boundaryMeasure_pos_of_isOpen`) and the trace of a constant. ★, ~40 lines
after `theorem_7_3_12`.'''
deps = ["theorem_7_3_12", "theorem_7_3_10", "IsContDiffDomain.boundaryMeasure_pos_of_isOpen"]

