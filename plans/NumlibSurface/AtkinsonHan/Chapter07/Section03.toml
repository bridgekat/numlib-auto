[[node]]
id = "theorem_7_3_10"
kind = "theorem"
desc = '''Theorem 7.3.10 (trace theorem): on a Lipschitz domain with boundary `Γ` and
`1 ≤ p < ∞` there is a continuous linear `γ : W^{1,p}(Ω) → L^p(Γ)` with (a) `γ v = v|_Γ` for
`v ∈ W^{1,p}(Ω) ∩ C(closure Ω)`, (b) `‖γ v‖_{L^p(Γ)} ≤ c ‖v‖_{W^{1,p}(Ω)}`, and (c) `γ` compact;
its range is `W^{1-1/p,p}(Γ)`, and `H^{1/2}(Γ) = γ(H^1(Ω))` with the quotient norm (7.3.2). Not
formalized: Mathlib has no surface measure on a Lipschitz boundary, so `L^p(Γ)` is not available,
and no trace operator (`traceMap` is unused); the book states the theorem without proof.

Blocked: 2026-09-20 (blocker 2 of `notes/frontier.md`). Checked: the Brezis round left the trace
untouched — `Numlib/Analysis/Sobolev/` has no boundary measure, no `trace`, no Gauss–Green on a
domain (grep `trace`, `hausdorffMeasure`, `divergence`, `frontier` in `Numlib/`: only the
`IsContDiffChartDomain` charts of `Chart.lean` and the `frontier`-of-`Ω` bookkeeping of
`Extension.lean`). `L^p(Γ)` is nameable as
`Lp F p ((μH[d] : Measure (EuclideanSpace ℝ (Fin (d+1)))).restrict (frontier Ω))`, and what is
missing is the area formula relating `μH[d]` on a `C¹` graph piece to Lebesgue measure on the
chart (Mathlib has `MeasureTheory.Measure.hausdorffMeasure` and
`LipschitzWith.hausdorffMeasure_image_le`, no equality on graphs), after which the trace
inequality on a chart is the one-dimensional `|u(x', g(x'))|^p ≤ ∫ |∂_N u| + |u|^p` argument
(Evans §5.5) glued by the partition of unity of `Extension.lean`: estimated 1500–2500 lines, the
`C¹` case first. Nothing else in the corpus provides it.'''
deps = ["definition_7_2_1", "theorem_7_3_2", "definition_7_2_13"]

[[node]]
id = "theorem_7_3_11"
kind = "theorem"
desc = '''Theorem 7.3.11: on a bounded open set with `C^{k,1}` boundary `Γ`, for `1 ≤ p ≤ ∞`,
`s - 1/p > 1` non-integer and `k ≥ s - 1`, there are unique bounded linear surjections
`γ_0 : W^{s,p}(Ω) → W^{s-1/p,p}(Γ)` and `γ_1 : W^{s,p}(Ω) → W^{s-1-1/p,p}(Γ)` extending
`v ↦ v|_Γ` and `v ↦ (∂v/∂ν)|_Γ` -- the generalized normal derivative needed for fourth-order
problems. Not formalized: it needs everything Theorem 7.3.10 needs, plus the fractional Sobolev
spaces over the boundary of Definition 7.2.13; the book quotes it from [98] without proof.

Blocked: 2026-09-20 (blocker 2). Downstream of `theorem_7_3_10` and of `definition_7_2_13`
(fractional spaces on `Γ`), both waiting on the boundary measure; nothing of the Brezis round
touches it. After the trace, the surjectivity onto the fractional spaces is a further
Gagliardo-type theorem (1000+ lines).'''
deps = ["theorem_7_3_10", "definition_7_2_13"]

