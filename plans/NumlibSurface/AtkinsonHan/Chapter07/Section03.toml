[[node]]
id = "theorem_7_3_5_universal"
kind = "theorem"
desc = '''Theorem 7.3.5 (universal extension theorem, Stein): for `Ω` an open half-space or a
Lipschitz domain there is one linear operator `E` that is continuous
`W^{k,p}(Ω) → W^{k,p}(ℝ^d)` for every `k ≥ 0` and every `p ∈ [1,∞]`, with `Ev = v` on `Ω`, `Ev`
smooth off `closure Ω`, and `‖Ev‖_{W^{k,p}(ℝ^d)} ≤ c ‖v‖_{W^{k,p}(Ω)}`. The order-one operator,
one per `p`, on a bounded `C¹` domain is `theorem_7_3_5`; the order-`k` operator, one per `k`
and `p`, on a bounded `C^k` domain is `theorem_7_3_5_order`.

Blocked: 2026-09-21. What exists is Brezis's Theorem 9.7 at every order
(`SobolevEuclidean.exists_extensionL_of_order`, `Numlib/Analysis/Sobolev/ExtensionHigher.lean`:
the higher-order reflection of Exercise 7.3.2 with Vandermonde coefficients of order `k`, in the
`C^k` charts, with the bound from the closed graph theorem): one bounded operator
`W^{k,p}(Ω) → W^{k,p}(ℝ^d)` for each `k ≥ 1` and each `p`, on a `C^k` domain, which is neither
smooth off `closure Ω` nor independent of `k` (the reflection coefficients depend on `k`), and
whose construction is uniform in `p` (only the `∃ P` statement is per `p`). Stein's universal
operator on a Lipschitz domain is a Calderón-kernel regularization of the reflection (Stein,
*Singular Integrals*, VI.3), research-scale here; "one operator for all `p`" at a fixed `k` is
in reach (~150 lines: state `exists_extensionL_of_order` with the operator built before `p`),
"all `k`" is not.'''
deps = ["theorem_7_3_5", "theorem_7_3_5_order"]

