Poincare-Friedrichs inequality under a mixed boundary condition. Not formalized: as Example 7.3.15,
it needs the compact embedding 7.3.9 and the trace of Theorem 7.3.10.

Blocked: re-checked 2026-09-15; as `example_7_3_15`, and additionally "`v = 0` a.e. on `Γ_0`" is
not statable until the boundary measure of `theorem_7_3_10` exists.'''
deps = ["theorem_7_3_12", "theorem_7_3_10"]

[[node]]
id = "theorem_7_3_17"
kind = "theorem"
desc = '''Theorem 7.3.17: for `1 ≤ p < ∞` and `Ω` a Lipschitz domain, `|v|_{k+1,p,Ω}` (independent
of the representative) is a norm on the quotient `V = W^{k+1,p}(Ω)/ℙ_k(Ω)` equivalent to the
quotient norm `inf_{q ∈ ℙ_k} ‖v + q‖_{k+1,p,Ω}` -- the **Bramble-Hilbert** estimate (7.3.13) that
drives finite element interpolation error bounds. The book gives two proofs, one via Hahn-Banach
and one constructing `q̄` with `∫_Ω ∂^α (v + q̄) = 0` for `|α| ≤ k`. Not formalized: both proofs go
through Theorem 7.3.12, hence through the compact embedding 7.3.9, which Mathlib lacks.

Blocked: re-checked 2026-09-15. Both of the book's proofs go through `theorem_7_3_12`. But note
`notes/fem-roadmap.md` Decision A: Brenner and Scott prove Bramble-Hilbert constructively, by
averaged Taylor polynomials and a Riesz potential estimate, using no compactness at all. That
route is independent of everything else open in §7.3 and would unblock this node, `corollary_7_3_18`
and the whole interpolation spine of chapter 10 (`AtkinsonHan.Chapter10.theorem_10_3_3`,
`theorem_10_3_5`, `corollary_10_3_7`, `theorem_10_3_9`, `example_10_3_8`). It is a self-contained
project of its own -- the averaged Taylor polynomial, its error representation as a Riesz
potential, and the boundedness of that potential on `L^p` over a star-shaped domain -- estimated
at 800-1500 lines, and it is the highest-leverage item in this group.'''
deps = ["theorem_7_3_12"]

