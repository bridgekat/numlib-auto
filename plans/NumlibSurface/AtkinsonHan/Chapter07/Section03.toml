[[node]]
id = "theorem_7_3_5"
kind = "theorem"
desc = '''Theorem 7.3.5 (universal extension theorem): for `Ω` an open half-space or a Lipschitz
domain there is one linear operator `E` that is continuous `W^{k,p}(Ω) → W^{k,p}(ℝ^d)` for every
`k ≥ 0` and every `p ∈ [1,∞]`, with `Ev = v` on `Ω`, `Ev` smooth off `closure Ω`, and
`‖Ev‖_{W^{k,p}(ℝ^d)} ≤ c ‖v‖_{W^{k,p}(Ω)}`. Not formalized: Mathlib has no extension operator; the
book quotes Stein [211, Theorem 5, p. 181] without proof, and Stein's construction (a reflection
across a Lipschitz graph regularized by a Calderon kernel) is a substantial analysis project.

Blocked: re-checked 2026-09-15. Mathlib at this pin has no extension operator under any name
(`extensionOperator`: zero occurrences) and nothing of Stein's singular-integral apparatus. This
is the single node that gates most of chapters 8-11, and it is the critical path of
`notes/fem-roadmap.md` step 2. The realistic move is Decision B there: prove the
reflection-and-cutoff extension for a `C^1` domain (Evans §5.4) under the already-existing
`IsContDiffDomain` hypothesis, which unblocks the same consumers with a stronger hypothesis that
can be relaxed later without restating any consumer. The Lipschitz case as the book states it is
research-scale.'''
deps = ["definition_7_2_1", "theorem_7_3_2"]

