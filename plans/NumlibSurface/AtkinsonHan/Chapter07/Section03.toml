[[node]]
id = "theorem_7_3_7_c_integer"
kind = "theorem"
desc = '''Theorem 7.3.7 (c), the case `(d+1)/p` an integer: if `k > (d+1)/p = ℓ ∈ ℕ` then
`W^{k,p}(Ω) ↪ C^{k−ℓ−1,β}(closure Ω)` for every `0 < β < 1`, on a bounded extension domain
(the book's Lipschitz domain); read on representatives as in `theorem_7_3_7_c`. The non-integer
case, with the sharp `β = [(d+1)/p] + 1 − (d+1)/p`, is `theorem_7_3_7_c`.

Blocked: 2026-09-20. The backbone's `C^j(closure Ω)` representative
(`SobolevEuclidean.exists_forall_contDiffOn_closure_ae_eq_of_order`,
`Numlib/Analysis/Sobolev/EmbeddingDomain.lean`) produces *one* Hölder exponent `θ ∈ (0, 1]`,
sharp only when `k − (d+1)/p − j < 1`; in the integer case `θ = 1` is not what it returns. The
route to every `β < 1` is `W^{k,p}(Ω) ↪ W^{j+1,q}(Ω)` for every `q < ∞` (the critical case of
Corollary 9.15) followed by Morrey at exponent `q > d + 1`, which needs the order-lowering map
`W^{k,p}(Ω) → W^{j+1,q}(Ω)`; the backbone lowers only to order one
(`SobolevEuclidean.exists_continuousLinearMap_orderOne`, `DenyLions.lean`). Generalizing that
map to a target order `j + 1` by the same induction: ~150 lines; then this node is ~60 lines.
For `j = 0` (`k = ℓ + 1`) it is provable today from `exists_continuousLinearMap_orderOne` and
`SobolevEuclidean.exists_continuousOn_closure_holderWith_ae_eq`.'''
deps = ["theorem_7_3_7_c"]

