[[node]]
id = "theorem_7_3_5_universal"
kind = "theorem"
desc = '''Theorem 7.3.5 (universal extension theorem, Stein): for `Ω` an open half-space or a
Lipschitz domain there is one linear operator `E` that is continuous
`W^{k,p}(Ω) → W^{k,p}(ℝ^d)` for every `k ≥ 0` and every `p ∈ [1,∞]`, with `Ev = v` on `Ω`, `Ev`
smooth off `closure Ω`, and `‖Ev‖_{W^{k,p}(ℝ^d)} ≤ c ‖v‖_{W^{k,p}(Ω)}`. The order-one operator,
one per `p`, on a bounded `C¹` domain is `theorem_7_3_5`.

Blocked: 2026-09-20. What exists is Brezis's Theorem 9.7 (`SobolevEuclidean.exists_extensionL`,
`Numlib/Analysis/Sobolev/Extension.lean`; the half-space `IsSobolevExtensionDomain.upperHalfSpace`
in `Reflection.lean`): one bounded operator `W^{1,p}(Ω) → W^{1,p}(ℝ^d)` for each `p`, built by
even reflection, which is neither `W^{k,p}`-bounded for `k ≥ 2` nor smooth off `closure Ω`, and
whose partition of unity does not depend on `p` — so "one operator for all `p`" is in reach
(the construction is uniform in `p`; only the `∃ P` statement is per `p`) while "all `k`" is
not. Stein's universal operator on a Lipschitz domain is a Calderón-kernel regularization of the
reflection (Stein, *Singular Integrals*, VI.3), research-scale here. A per-`k` operator for a
`C^k` domain is the route of `theorem_7_3_2_higher` (600–900 lines).'''
deps = ["theorem_7_3_5"]

