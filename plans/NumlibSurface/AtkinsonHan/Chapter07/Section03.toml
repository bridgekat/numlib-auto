[[node]]
id = "theorem_7_3_7"
kind = "theorem"
desc = '''Theorem 7.3.7 (Sobolev embedding theorem) on a Lipschitz domain `Ω ⊆ ℝ^d`: (a) if
`k < d/p` then `W^{k,p}(Ω) ↪ L^q(Ω)` for `q ≤ p^*` with `1/p^* = 1/p - k/d`; (b) if `k = d/p` then
`W^{k,p}(Ω) ↪ L^q(Ω)` for every `q < ∞`; (c) if `k > d/p` then
`W^{k,p}(Ω) ↪ C^{k-[d/p]-1,β}(Ω)` with `β = [d/p] + 1 - d/p` when `d/p` is not an integer and any
`β < 1` otherwise. In one dimension `W^{k,p}(a,b) ↪ C[a,b]` for all `k, p ≥ 1`. Not formalized:
this needs Gagliardo-Nirenberg-Sobolev on a domain, obtained from the whole-space inequality
through the extension operator 7.3.5. Mathlib's `SobolevInequality.lean` has GNS only for
compactly supported `C^1` functions on the whole space; the book states the theorem without proof
(citing [78]).

Blocked: re-checked 2026-09-15. `Mathlib/Analysis/FunctionalSpaces/SobolevInequality.lean` is
still whole-space and compactly-supported-`C^1` only, and the transfer to a domain is Theorem
7.3.5. Note that the one-dimensional sentence is a *remark* after the theorem, not one of its
clauses (a)-(c), so it is not what this node states; the `k = 1`, `p = 2` instance of it is
already proved in the backbone as `SobolevInterval.norm_toContinuousMap_le`
(`Numlib/Analysis/Sobolev/Interval.lean`), with the explicit constant
`(b-a)^{-1/2} + (b-a)^{1/2}`. Making the remark a node in its stated generality would first need a
`W^{1,p}(a,b)` theory for `p ≠ 2`, which `Interval.lean` (built at `p = 2` throughout) does not
have.'''
deps = ["definition_7_3_6", "theorem_7_3_5", "theorem_7_3_4"]

[[node]]
id = "theorem_7_3_8"
kind = "theorem"
desc = '''Theorem 7.3.8 (compact Sobolev embedding, Rellich-Kondrachov) on a Lipschitz domain:
(a) `W^{k,p}(Ω) ↪↪ L^q(Ω)` for `q < p^*` when `k < d/p`; (b) `W^{k,p}(Ω) ↪ L^q(Ω)` for all
`q < ∞` when `k = d/p`; (c) `W^{k,p}(Ω) ↪↪ C^{k-[d/p]-1,β}(Ω)` for `β < [d/p] + 1 - d/p` when
`k > d/p`. Not formalized: Rellich-Kondrachov has no Mathlib counterpart (`Rellich`, `Kondrachov`
have zero occurrences), and it rests on Theorem 7.3.7 and the extension operator 7.3.5, neither of
which exists here. The book states it without proof.

Blocked: re-checked 2026-09-15; `Rellich` and `Kondrachov` still have zero occurrences in Mathlib
at this pin, and nothing else in the library provides a compactness criterion for a bounded family
in `W^{k,p}`. Downstream of 7.3.7 and 7.3.5.'''
deps = ["definition_7_3_6_compact", "theorem_7_3_7", "theorem_7_3_5"]

[[node]]
id = "theorem_7_3_9"
kind = "theorem"
desc = '''Theorem 7.3.9: for integers `k > l ≥ 0`, `p ∈ [1,∞]` and `Ω ⊆ ℝ^d` a nonempty open
bounded Lipschitz domain, `W^{k,p}(Ω) ↪↪ W^{l,p}(Ω)`. This is the compactness that every norm
equivalence in §7.3.5 and §7.3.6 uses. Not formalized: a direct consequence of Theorem 7.3.8,
which is itself out of reach -- it is the Rellich-Kondrachov compactness, absent from Mathlib.

Blocked: re-checked 2026-09-15. The book's own Exercise 7.3.4 derives it from Theorem 7.3.8, and
that theorem is the obstruction.'''
deps = ["definition_7_3_6_compact", "theorem_7_3_8"]

[[node]]
id = "theorem_7_3_10"
kind = "theorem"
desc = '''Theorem 7.3.10 (trace theorem): on a Lipschitz domain with boundary `Γ` and
`1 ≤ p < ∞` there is a continuous linear `γ : W^{1,p}(Ω) → L^p(Γ)` with (a) `γ v = v|_Γ` for
`v ∈ W^{1,p}(Ω) ∩ C(closure Ω)`, (b) `‖γ v‖_{L^p(Γ)} ≤ c ‖v‖_{W^{1,p}(Ω)}`, and (c) `γ` compact;
its range is `W^{1-1/p,p}(Γ)`, and `H^{1/2}(Γ) = γ(H^1(Ω))` with the quotient norm (7.3.2). Not
formalized: Mathlib has no surface measure on a Lipschitz boundary, so `L^p(Γ)` is not available,
and no trace operator (`traceMap` is unused); the book states the theorem without proof.

Blocked: re-checked 2026-09-15. One correction to the reason: `L^p(Γ)` is in fact *nameable*
today, as `Lp F p ((μH[(d-1 : ℝ)] : Measure (EuclideanSpace ℝ (Fin d))).restrict (frontier Ω))`,
Mathlib having `MeasureTheory.Measure.hausdorffMeasure`. What is missing is every fact about it:
no area formula relating that measure to the chart integrals over the `g_i` of
`definition_7_2_1_finite_cover`, no Gauss-Green (Mathlib's divergence theorem,
`integral_divergence_of_hasFDerivAt_off_countable`, is for boxes), and `finite perimeter` /
`reducedBoundary` both have zero occurrences, so De Giorgi's theory is absent too. The trace
inequality itself therefore has no route, and `notes/fem-roadmap.md` Decision C (build the
boundary measure from sets of finite perimeter) remains the recommendation.'''
deps = ["definition_7_2_1", "theorem_7_3_2", "definition_7_2_13"]

[[node]]
id = "theorem_7_3_11"
kind = "theorem"
desc = '''Theorem 7.3.11: on a bounded open set with `C^{k,1}` boundary `Γ`, for `1 ≤ p ≤ ∞`,
`s - 1/p > 1` non-integer and `k ≥ s - 1`, there are unique bounded linear surjections
`γ_0 : W^{s,p}(Ω) → W^{s-1/p,p}(Γ)` and `γ_1 : W^{s,p}(Ω) → W^{s-1-1/p,p}(Γ)` extending
`v ↦ v|_Γ` and `v ↦ (∂v/∂ν)|_Γ` -- the generalized normal derivative needed for fourth-order
problems. Not formalized: it needs everything Theorem 7.3.10 needs, plus the fractional Sobolev
spaces over the boundary of Definition 7.2.13; the book quotes it from [98] without proof.

Blocked: re-checked 2026-09-15. Downstream of `theorem_7_3_10` and of `definition_7_2_13`, both
of which need the boundary measure; see their `Blocked` notes.'''
deps = ["theorem_7_3_10", "definition_7_2_13"]

[[node]]
id = "theorem_7_3_12"
kind = "theorem"
desc = '''Theorem 7.3.12 (Deny-Lions norm equivalence): for a Lipschitz domain `Ω` (connected),
`k ≥ 1`, `1 ≤ p < ∞`, and seminorms `f_j` on `W^{k,p}(Ω)` with (H1) `0 ≤ f_j(v) ≤ c ‖v‖_{k,p,Ω}`
and (H2) `v ∈ ℙ_{k-1}(Ω)` with all `f_j(v) = 0` implies `v = 0`, both `|v|_{k,p,Ω} + ∑_j f_j(v)`
(7.3.3) and `(|v|^p_{k,p,Ω} + ∑_j f_j(v)^p)^{1/p}` (7.3.4) are norms equivalent to `‖v‖_{k,p,Ω}`.
Not formalized: the book's proof is a compactness contradiction using `W^{k,p}(Ω) ↪↪ W^{k-1,p}(Ω)`
(Theorem 7.3.9) and the fact that `|v|_{k,p,Ω} = 0` forces `v ∈ ℙ_{k-1}` on a connected `Ω`; the
compact embedding is exactly what Mathlib lacks.

Blocked: re-checked 2026-09-15. Two ingredients, both missing: the compact embedding
`theorem_7_3_9`, and "`|v|_{k,p,Ω} = 0` on a connected open set implies `v` is a polynomial of
degree `< k`", which is the weak-derivative form of "vanishing `k`-th derivative implies
polynomial" and has no Mathlib counterpart either (the closest, `Polynomial.funext`-style
statements, are about polynomials already known to exist). The second is the cheaper of the two
and would be a useful backbone node on its own.'''
deps = ["theorem_7_3_9", "definition_7_2_2_multiIndex_norm"]

[[node]]
id = "theorem_7_3_13"
kind = "theorem"
desc = '''Theorem 7.3.13: the same conclusion as Theorem 7.3.12 on an open bounded `Ω` with
Lipschitz boundary, with (H2) weakened to (H2)' -- `|v|_{k,p,Ω} = 0` together with all
`f_j(v) = 0` implies `v = 0` -- so connectedness is not needed. It is the form that yields the
Poincare-Friedrichs inequality of Example 7.3.15. Not formalized: the same compactness argument as
Theorem 7.3.12, hence blocked by the compact embedding 7.3.9.

Blocked: re-checked 2026-09-15; downstream of `theorem_7_3_12`.'''
deps = ["theorem_7_3_12"]

[[node]]
