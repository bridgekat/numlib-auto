[[node]]
id = "theorem_7_3_2_higher"
kind = "theorem"
desc = '''Theorem 7.3.2 at every order: on a Lipschitz domain (here: an extension domain), for
`k ≥ 2` and `1 ≤ p < ∞`, `C^∞(closure Ω)` is dense in `W^{k,p}(Ω)`. The order `k = 1` is
`theorem_7_3_2`, from Brezis's Corollary 9.8.

Blocked: 2026-09-20. The backbone's density up to the boundary
(`SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_hasSobolevExtensionOn`,
`Numlib/Analysis/Sobolev/Cutoff.lean`) goes through the extension operator of Brezis's
Theorem 9.7, which exists at order one only (`SobolevEuclidean.exists_extensionL`,
`Extension.lean`: an even reflection across the `C¹` charts, which is not `C²`). A `W^{k,p}`
extension operator for a `C^k` domain needs the higher-order reflection
`u(x', -x_N) ↦ ∑_j c_j u(x', -2^j x_N)` of the book's Exercise 7.3.2 in a chart, plus the
`C^k` chart transport of `Numlib/Analysis/Sobolev/Calculus.lean`
(`memSobolevMultiIndex_comp_chart_of_order` exists in `PDE/Elliptic/Regularity.lean`): estimated
600–900 lines, after which this node and `theorem_7_3_5` at every order follow as at `k = 1`.
Alternatively the translation-and-mollify argument of Evans §5.3.3 in each chart, of similar
size.'''
deps = ["theorem_7_3_2"]

