[[node]]
id = "example_7_2_7"
kind = "theorem"
desc = '''Example 7.2.7, on a triangulated polygon (the book's "bounded Lipschitz `Ω` partitioned into
Lipschitz sub-domains", restated with `𝒯 : Triangulation Ω`; scope note: Lipschitz domains in
general stay out of scope, cf. `notes/boundary/planning-brief.md` §1): for `k : ℕ`,
`1 ≤ p ≤ ∞`, and `v : ℝ² → ℝ` with `v ∈ C^k(closure Ω)` (`ContDiffOn ℝ k v` on a neighbourhood
of `closure Ω`, or, for `k = 0`, `ContinuousOn v (closure Ω)`) and
`v|_{K T} ∈ W^{k+1,p}(K T)` for every element (`definition_7_2_2_multiIndex (k + 1) p (𝒯.Kopens T) v`),
one has `definition_7_2_2_multiIndex (k + 1) p Ω v`, i.e. `v ∈ W^{k+1,p}(Ω)`. Restated 2026-09-21
(boundary round). The case `k = 0` is the backbone's
`Triangulation.memSobolevMultiIndex_of_continuousOn_of_forall` (`Numlib/Analysis/Sobolev/Boundary/PolygonTrace.lean`):
the book's proof — integrate by parts on each element against a test function `φ ∈ C_0^∞(Ω)`,
`∫_{Ω_n} v ∂ᵢφ = −∫_{Ω_n} ∂ᵢv φ + ∫_{∂Ω_n} v φ νᵢ ds`, and cancel the interface integrals — with
Green's formula on a triangle against a fixed smooth test function
(`BoundaryData.TraceFamily.green_contDiff` of `EuclideanSpace.triangleTraceFamily`), the trace
of the continuous `v` on `∂K T` being its restriction (`traceL_ae_eq`), the boundary edges carrying
`φ = 0` (`Triangulation.segment_subset_frontier_of_isBoundaryEdge`) and the interior edges
cancelling in partner pairs (`Triangulation.partner_unique`, `edgeNormal_partner`). No slit
hypothesis is needed for this direction. General `k` by applying the `k = 0` case to the
derivatives `∂^β v`, `|β| = k` (`Triangulation.memSobolevMultiIndex_succ_of_contDiffOn_of_forall`
in the same module, and `memSobolevMultiIndex_succ_iff`). ★★, ~80 lines over the backbone nodes.'''
deps = ["definition_7_2_1", "definition_7_2_2_multiIndex", "Triangulation.memSobolevMultiIndex_of_continuousOn_of_forall"]

[[node]]
id = "example_7_2_8"
kind = "theorem"
desc = '''Example 7.2.8, the converse of Example 7.2.7 on a triangulated polygon without slits: for
`𝒯 : Triangulation Ω` with `𝒯.InteriorEdgesSubset` (the relative interior of every interior
edge lies in `Ω`; `Numlib/Analysis/Sobolev/Boundary/Polygon.lean`), `1 ≤ p < ∞`,
`v ∈ W^{1,p}(Ω)` (an element `u : SobolevEuclidean 2 1 p Ω`) and continuous representatives on
the closed elements — `w : 𝒯.elems → ℝ² → ℝ` with `ContinuousOn (w T) (𝒯.closedK T)` and
`fn u =ᵐ w T` on `K T` — the pieces agree along every interior edge: for every partner pair
`𝒯.IsPartner T a T' a'`, `EqOn (w T) (w T') (segment ℝ (T.1 a) (T.1 (a + 1)))`; hence, for the
book's `k`, `∂^β v` (`|β| ≤ k`) glue continuously across the edges. Restated 2026-09-21
(boundary round): the book's argument — a nonzero interface integral
`∫_γ (v|_{Ω_{n₁}} − v|_{Ω_{n₂}}) φ νᵢ` would contradict `v ∈ W^{1,p}(Ω)` — is exactly the
backbone's `Triangulation.traceL_partner_ae_eq` (the one-sided traces of a `W^{1,p}(Ω)` function
agree on an interior edge whose relative interior lies in `Ω`), packaged as
`Triangulation.eqOn_partner_of_memSobolev_of_continuousOn` (`PolygonTrace.lean`). Caveat recorded as
an erratum (`notes/boundary/plan-report.md`): the book's conclusion "`v ∈ C^k(closure Ω)`" as a
single continuous function on the closure also needs the elements around each vertex to be connected
through shared edges; at a pinch vertex (two elements meeting only at a point, allowed by the axioms
of `Triangulation` but not by the book's Lipschitz hypothesis) a `W^{1,p}` function may take two
different limits. On a polygon in the book's sense the edge-wise agreement gives continuity on
`closure Ω` minus the vertices and, by the fan argument, everywhere; that last step is not
planned. ★★, ~60 lines over the backbone node for the edge-wise statement.'''
deps = ["example_7_2_7", "Triangulation.eqOn_partner_of_memSobolev_of_continuousOn", "Triangulation.InteriorEdgesSubset"]

