[[node]]
id = "example_7_2_7"
kind = "theorem"
desc = '''Example 7.2.7: if a bounded Lipschitz `Ω` is partitioned into Lipschitz sub-domains
`Ω_n`, `v|_{Ω_n} ∈ W^{k+1,p}(Ω_n)` for each `n` and `v ∈ C^k(closure Ω)`, then `v ∈ W^{k+1,p}(Ω)`
-- the global regularity of a conforming finite element function from its element-wise regularity.
Not formalized: the proof integrates by parts on each `Ω_n` and cancels the interface integrals
`∫_{∂Ω_n} v φ ν_i`, so it needs surface measure on a Lipschitz boundary and the integration by
parts formula of §7.6, which rests on the trace of Theorem 7.3.10. The Lipschitz hypothesis itself
is now available, as `definition_7_2_1_lipschitzDomain`.

Blocked: rechecked 2026-09-20 (blocker 2 of `notes/frontier.md`); the reason stands. The Brezis round (2026-09-17–20) left blocker 2 untouched: `Numlib/` has no surface measure on a
boundary (`hausdorffMeasure`, `Gauss`, `divergence`, `perimeter` occur only in the quadrature and
Fourier modules, for unrelated reasons), no trace operator (`theorem_7_3_10` is still open) and no
integration by parts on a domain; Mathlib on this pin still has the divergence theorem for boxes
only (`MeasureTheory.integral_divergence_of_hasFDerivAt_off_countable`) and the new
`CurveIntegral/Poincare` for plane curves, nothing for a Lipschitz or `C¹` hypersurface. The
Brezis surface's own boundary nodes (`example_9_4_stepA/D`, Theorem 9.26's Neumann clause,
`regularity_neumann`) are deferred on the same gap. `notes/fem-roadmap.md` Decision C stands.
A `C¹`-domain version would need at least the divergence theorem on a `C¹` domain; estimate one to
two thousand lines for the boundary measure and Gauss–Green on `C¹` chart domains, after which
this node and `example_7_1_9` are ~200 lines each.
'''
deps = ["definition_7_2_1", "definition_7_2_2_multiIndex", "proposition_7_6_1"]

[[node]]
id = "example_7_2_8"
kind = "theorem"
desc = '''Example 7.2.8: the converse of Example 7.2.7 -- if `v ∈ W^{k+1,p}(Ω)` and
`v ∈ C^k(closure Ω_n)` for each sub-domain, then `v ∈ C^k(closure Ω)`; together the two give
`v ∈ C^k(closure Ω) ↔ v ∈ W^{k+1,p}(Ω)` under element-wise regularity. Not formalized: the
argument produces a nonzero interface integral `∫_γ (v|_{Ω_{n₁}} - v|_{Ω_{n₂}}) φ ν_i`, so it
needs surface measure on a Lipschitz boundary and the trace of Theorem 7.3.10.

Blocked: rechecked 2026-09-20 (blocker 2); the same obstruction as `example_7_2_7`, of which this is
the converse, and downstream of it.
'''
deps = ["example_7_2_7", "proposition_7_6_1"]

