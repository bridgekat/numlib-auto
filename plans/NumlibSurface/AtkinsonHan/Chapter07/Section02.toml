[[node]]
id = "definition_7_2_13"
kind = "definition"
desc = '''Definition 7.2.13: given a patch system `∂Ω ∩ B(x_i,r_i) = {x_d = g_i(x_1,…,x_{d-1})}`
with `g_i ∈ C^{k,α}(D_i)` covering `∂Ω`, and `s ≤ k + α`, `W^{s,p}(∂Ω) = {v ∈ L^2(∂Ω) : v ∘ g_i ∈
W^{s,p}(D_i)}` with `‖v‖ = max_i ‖v ∘ g_i‖_{W^{s,p}(D_i)}`; `H^s(∂Ω) ≡ W^{s,2}(∂Ω)`, and
`H^{1/2}(∂Ω)` is the one used later. Not formalized: this needs surface measure on a Lipschitz
boundary before `L^2(∂Ω)` is even definable. The patch system itself is now available --
`definition_7_2_1_finite_cover` produces exactly the `(x_i, r_i)` and the `g_i` -- and so are the
`W^{s,p}(D_i)` of the patches, `SobolevSlobodeckij`; what is missing is the measure on `∂Ω`, and
with it the independence of the norm from the choice of patches.

Blocked: re-checked 2026-09-15, and the reason above needs one correction. `L^2(∂Ω)` *is*
nameable at this pin: `Lp ℝ 2 ((μH[(d : ℝ)] : Measure (EuclideanSpace ℝ (Fin (d+1)))).restrict
(frontier Ω))`, Mathlib having `MeasureTheory.Measure.hausdorffMeasure`. Two things still stand in
the way of a faithful transcription. (1) The pullback `v ∘ g_i` of the display is `x' ↦ v (T_i⁻¹
(x', g_i x'))` in the rigid motion `T_i` that `IsBoundaryGraphAt` carries, and its domain `D_i` --
the projection `EuclideanSpace.init '' (T_i '' ball x_i r_i)` -- is *not* exposed by
`IsBoundaryGraphAt`, which quantifies `T` and `g` existentially and names no chart domain; stating
the definition therefore needs either a bundled patch structure or an `Opens` argument supplied by
hand. (2) Nothing could be proved about the result: the independence of the norm from the choice
of patches, and even that the chart conditions are consistent with membership of `L^2(∂Ω)`, need
the area formula relating `μH[d]` on `frontier Ω` to Lebesgue measure on `D_i` through the graph
map, which Mathlib does not have (no Gauss-Green beyond boxes, `finite perimeter` and
`reducedBoundary` with zero occurrences). Writing the definition is perhaps 100 lines of
bookkeeping; writing a *usable* one is `notes/fem-roadmap.md` Decision C.'''
deps = ["definition_7_2_1_finite_cover", "definition_7_2_10"]
