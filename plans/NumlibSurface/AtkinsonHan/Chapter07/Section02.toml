namespace = "AtkinsonHan.Chapter07"

[[node]]
id = "definition_7_2_1"
kind = "definition"
desc = '''Definition 7.2.1: for `Ω ⊆ ℝ^d` open bounded and `V` a function space on `ℝ^{d-1}`, the
boundary `∂Ω` is of class `V` when each `x_0 ∈ ∂Ω` has an `r > 0` and a `g ∈ V` with
`Ω ∩ B(x_0,r) = {x ∈ B(x_0,r) : x_d > g(x_1,…,x_{d-1})}` after a change of coordinates; `V`
Lipschitz gives a Lipschitz domain, `V = C^k` a `C^k` domain, `V = C^{k,α}` a Hölder boundary.
Compactness of `∂Ω` then yields a finite cover by such balls. Not formalized: statable today as a
local graph condition, but its only role in the book is as the hypothesis of §7.3's theorems,
which are the chapter's gap, so nothing would consume it.'''

[[node]]
id = "definition_7_2_2"

[[node]]
id = "definition_7_2_2_iff"

[[node]]
id = "theorem_7_2_3"
kind = "theorem"
desc = '''Theorem 7.2.3: `W^{k,p}(Ω)` is a Banach space. The book's proof takes a Cauchy sequence,
uses completeness of `L^p` on each `∂^α v_n`, and passes to the limit in the defining identity to
identify the limits as weak derivatives. Not formalized: Definition 7.2.2 and its norm exist now,
but the theorem needs `W^{k,p}(Ω)` as a *type* -- naturally the subspace of a product of `L^p(Ω)`
spaces cut out by the weak-derivative relation -- and hence the one analytic ingredient the backbone
lacks: that pairing with a fixed test function is a continuous linear functional on `L^p(Ω)`, by
Hölder against that test function, which is what makes the relation closed. None of §7.3 is
involved.'''

[[node]]
id = "corollary_7_2_4"
kind = "theorem"
desc = '''Corollary 7.2.4: `H^k(Ω)` is a Hilbert space with the inner product
`(u,v)_k = ∫_Ω ∑_{|α|≤k} ∂^α u ∂^α v`. The book adds, without proof, that `W^{k,p}(Ω)` is reflexive
exactly for `p ∈ (1,∞)`. Not formalized: it needs Theorem 7.2.3, and on top of that a norm indexed
by multi-indices, because the backbone measures all the derivatives of a given order by the
operator norm of a single tensor and that norm is not induced by an inner product.'''

[[node]]
id = "example_7_2_5"
kind = "theorem"
desc = '''Example 7.2.5: on the unit ball of `ℝ^d`, `v(x) = |x|^λ` satisfies `v ∈ L^p(Ω) ↔
λ > -d/p` and, more generally, `v ∈ W^{k,p}(Ω) ↔ λ > k - d/p` (7.2.1) -- so for `d = 2` and
`p ∈ [1,2)` there are `W^{1,p}` functions that are not continuous. The book leaves (7.2.1) to
Exercise 7.2.7. Not formalized: a radial integrability computation over Definition 7.2.2, which
exists now; unwritten because nothing in the corpus consumes it while §7.3 is missing.'''

[[node]]
id = "example_7_2_6"
kind = "theorem"
desc = '''Example 7.2.6: on `Ω = B(0,β) ⊆ ℝ^2` with `β < 1`, `v(x) = log(log(1/r))` has
`∫_Ω |∇v|^2 = -2π/log β < ∞` and `‖v‖_{L^2(Ω)} < ∞`, so `v ∈ H^1(Ω)` while `v` is unbounded at the
origin: an `H^1` function in the plane need not be continuous. Not formalized: an explicit integral
over Definition 7.2.2, which exists now; unwritten for want of a consumer while §7.3 is missing.'''

[[node]]
id = "example_7_2_7"
kind = "theorem"
desc = '''Example 7.2.7: if a bounded Lipschitz `Ω` is partitioned into Lipschitz sub-domains
`Ω_n`, `v|_{Ω_n} ∈ W^{k+1,p}(Ω_n)` for each `n` and `v ∈ C^k(closure Ω)`, then `v ∈ W^{k+1,p}(Ω)`
-- the global regularity of a conforming finite element function from its element-wise regularity.
Not formalized: the proof integrates by parts on each `Ω_n` and cancels the interface integrals
`∫_{∂Ω_n} v φ ν_i`, so it needs surface measure on a Lipschitz boundary and the integration by
parts formula of §7.6, which rests on the trace of Theorem 7.3.10.'''

[[node]]
id = "example_7_2_8"
kind = "theorem"
desc = '''Example 7.2.8: the converse of Example 7.2.7 -- if `v ∈ W^{k+1,p}(Ω)` and
`v ∈ C^k(closure Ω_n)` for each sub-domain, then `v ∈ C^k(closure Ω)`; together the two give
`v ∈ C^k(closure Ω) ↔ v ∈ W^{k+1,p}(Ω)` under element-wise regularity. Not formalized: the
argument produces a nonzero interface integral `∫_γ (v|_{Ω_{n₁}} - v|_{Ω_{n₂}}) φ ν_i`, so it
needs surface measure on a Lipschitz boundary and the trace of Theorem 7.3.10.'''

[[node]]
id = "definition_7_2_9"
kind = "definition"
desc = '''Definition 7.2.9: `W_0^{k,p}(Ω)` is the closure of `C_0^∞(Ω)` in `W^{k,p}(Ω)`, with
`H_0^k(Ω) ≡ W_0^{k,2}(Ω)`; informally the functions whose derivatives of order `≤ k-1` vanish on
`∂Ω`, a reading the trace theorems make precise. Not formalized: a closure needs a topology on
`W^{k,p}(Ω)`, hence `W^{k,p}(Ω)` as a normed type, which is exactly what Theorem 7.2.3 is still
missing; and the point of the space is the boundary-value reading, which needs the trace of §7.3.'''

[[node]]
id = "definition_7_2_10"
kind = "definition"
desc = '''Definition 7.2.10: for `s = k + σ` with `k ≥ 0` an integer and `σ ∈ (0,1)`, `W^{s,p}(Ω)`
is the set of `v ∈ W^{k,p}(Ω)` whose `k`-th derivatives have finite Sobolev-Slobodeckij seminorm,
`∫_{Ω×Ω} |∂^α v(x) - ∂^α v(y)|^p / ‖x-y‖^{σp+d} dx dy < ∞` for `|α| = k`, normed accordingly; the
book states without proof that it is Banach, reflexive exactly for `p ∈ (1,∞)`, and Hilbert for
`p = 2`. Not formalized: a double integral over Definition 7.2.2, which exists now, but the book
introduces these spaces solely to state the trace theorems and Definition 7.2.13, both of which are
§7.3 material.'''

[[node]]
id = "definition_7_2_11"
kind = "definition"
desc = '''Definition 7.2.11: for `s ≥ 0`, `W_0^{s,p}(Ω)` is the closure of `C_0^∞(Ω)` in
`W^{s,p}(Ω)`, with `H_0^s(Ω) ≡ W_0^{s,2}(Ω)`. Not formalized: the real-order analogue of Definition
7.2.9, blocked for the same two reasons -- there is no normed type `W^{s,p}(Ω)` to take a closure
in, and the point of the space is to carry boundary conditions, which need the trace of §7.3.'''

[[node]]
id = "definition_7_2_12"
kind = "definition"
desc = '''Definition 7.2.12: for `s ≥ 0` and conjugate exponents `p, p'`, `W^{-s,p'}(Ω)` is the
dual of `W_0^{s,p}(Ω)`, with `H^{-s}(Ω) ≡ W^{-s,2}(Ω)`; in particular `H^{-1}(Ω)` is the dual of
`H_0^1(Ω)`, `L^2(Ω)` embeds in it by `⟨f,v⟩ = ∫_Ω f v`, and every `ℓ ∈ H^{-1}(Ω)` is
`ℓ_0 - ∑_i ∂_i ℓ_i` for `L^2` functions `ℓ_0,…,ℓ_d` (stated without proof). Not formalized: the
dual space is Mathlib's `NormedSpace.Dual` once Definition 7.2.11 exists, and that waits on the
normed structure of Theorem 7.2.3.'''

[[node]]
id = "definition_7_2_13"
kind = "definition"
desc = '''Definition 7.2.13: given a patch system `∂Ω ∩ B(x_i,r_i) = {x_d = g_i(x_1,…,x_{d-1})}`
with `g_i ∈ C^{k,α}(D_i)` covering `∂Ω`, and `s ≤ k + α`, `W^{s,p}(∂Ω) = {v ∈ L^2(∂Ω) : v ∘ g_i ∈
W^{s,p}(D_i)}` with `‖v‖ = max_i ‖v ∘ g_i‖_{W^{s,p}(D_i)}`; `H^s(∂Ω) ≡ W^{s,2}(∂Ω)`, and
`H^{1/2}(∂Ω)` is the one used later. Not formalized: this needs surface measure on a Lipschitz
boundary before `L^2(∂Ω)` is even definable, plus the patch system and the independence of the
norm from it; Mathlib has none of that.'''
