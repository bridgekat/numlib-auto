[[node]]
id = "definition_7_2_13"
kind = "definition"
desc = '''Definition 7.2.13, the Sobolev spaces on the boundary of a `C¹` domain, relative to a patch
system: for `hΩ : IsContDiffDomain 1 Ω`, `hb : Bornology.IsBounded Ω` (the book's `C^{k,α}`
patches restated as `C¹`, `k = 1`, `α = 0`, so `0 ≤ s ≤ 1`), the atlas
`a := hΩ.graphAtlas hb : GraphAtlas Ω` (`Numlib/Analysis/Sobolev/Boundary/GraphMeasure.lean` —
the finite patch system `∂Ω ∩ B(xᵢ, rᵢ) = {x_d = gᵢ(x')}` of `definition_7_2_1_finite_cover`
with the graph functions `gᵢ` and the parameter domains `Dᵢ := a.graphDomain i`), `s ∈ [0, 1]`,
`1 ≤ p < ∞`: `W^{s,p}(∂Ω) := {v ∈ L^p(σ) : ∀ i, v ∘ graphParam (a.T i) (a.g i) ∈ W^{s,p}(Dᵢ)}`
with the norm `‖v‖ := max_i ‖v ∘ graphParam …‖_{W^{s,p}(Dᵢ)}`, where `L^p(∂Ω) = Lp ℝ p (hΩ.boundaryMeasure hb)`
(the surface measure of the boundary round) and `W^{s,p}(Dᵢ)` is `definition_7_2_10` on the open
bounded `Dᵢ ⊆ ℝ^{d-1}` (`SobolevSlobodeckij`), the composition `v ∘ graphParam` being the book's
`v ∘ gᵢ` read as `x' ↦ v (x', gᵢ x')`. `H^s(∂Ω) := W^{s,2}(∂Ω)`. Restated 2026-09-21 (boundary
round): definable now — a Submodule of `Lp ℝ p σ` (closed under the operations since each patch
space is), with the book's norm as a function; the book's `L²(∂Ω)` in the definition is read as
`L^p(∂Ω)` (an inconsistency of the printed definition, `v ∈ L²(∂Ω)` for a `W^{s,p}` space with
`p ≠ 2`). ★★, ~120 lines. What is not in scope is the independence of the space and (up to
equivalence) of the norm from the patch system, split off as `definition_7_2_13_indep`.'''
deps = ["definition_7_2_1_finite_cover", "definition_7_2_10", "IsContDiffDomain.graphAtlas", "IsContDiffDomain.boundaryMeasure"]

[[node]]
id = "definition_7_2_13_indep"
kind = "theorem"
desc = '''Definition 7.2.13, the clause the book leaves implicit: the space `W^{s,p}(∂Ω)` of
`definition_7_2_13` does not depend on the patch system, and two patch systems give equivalent
norms. For `s = 0` this is `boundaryMeasure_restrict_ball` (the surface measure is
chart-independent) and needs nothing more; for `0 < s ≤ 1` it needs the invariance of the
Slobodeckij seminorm of `definition_7_2_10` under the `C¹` transition maps
`EuclideanSpace.graphTransition` between patches (a bi-Lipschitz change of variables in the double
integral `∬ |v(x) − v(y)|^p / |x − y|^{d−1+sp}`), which `Numlib/Analysis/Sobolev/Slobodeckij.lean`
does not have.

Blocked (2026-09-21, boundary round): the invariance of fractional Sobolev norms under `C¹`
(bi-Lipschitz) diffeomorphisms — ~400 lines on top of `Slobodeckij.lean` (the double-integral
change of variables with the Jacobian bounds of `EuclideanSpace.graphDensity_graphTransition`);
not needed by any consumer of this round (`H^{1/2}(Γ)` is used only through `theorem_7_3_10_range`
and `theorem_7_3_11_fractional`, both blocked).'''
deps = ["definition_7_2_13", "IsContDiffDomain.boundaryMeasure_restrict_ball"]
