[[node]]
id = "example_7_2_5"
kind = "theorem"
desc = '''Example 7.2.5, the `W^{k,p}` half: on the unit ball of `ℝ^d`, `|x|^λ ∈ W^{k,p}(Ω) ↔
λ > k - d/p` (7.2.1), which the book leaves to Exercise 7.2.7. The `L^p` half, `λ > -d/p`, is
`example_7_2_5_memLp`, and it is also all that is left once the weak derivatives are known, since
each order of differentiation lowers the exponent by one. What blocks the rest is the step the book
passes over with "it can be verified": that the classical `v_{x_i}(x) = λ |x|^{λ-2} x_i` on
`Ω` minus the origin is the *weak* derivative on all of `Ω`, origin included. That is an
integration by parts against a cutoff vanishing near the origin, plus a passage to the limit, and
no mollification or cutoff machinery on a domain exists in the project yet. The same missing step
blocks `example_7_2_6`.'''
deps = ["definition_7_2_2_multiIndex", "example_7_2_5_memLp"]

[[node]]
id = "example_7_2_6"
kind = "theorem"
desc = '''Example 7.2.6: on `Ω = B(0,β) ⊆ ℝ^2` with `β < 1`, `v(x) = log(log(1/r))` has
`∫_Ω |∇v|^2 = -2π/log β < ∞` and `‖v‖_{L^2(Ω)} < ∞`, so `v ∈ H^1(Ω)` while `v` is unbounded at the
origin: an `H^1` function in the plane need not be continuous. Not formalized. The two displayed
quantities are reachable -- the gradient integral is `∫_0^β dr/(r log^2 r) = -1/log β` after
`MeasureTheory.integral_fun_norm_addHaar`, an improper integral at `0` whose antiderivative is
`-1/log r` -- but the conclusion `v ∈ H^1(Ω)` needs the classical gradient on `Ω` minus the origin
to be shown to be the weak gradient on `Ω`, the same removable-singularity step that blocks
`example_7_2_5`.'''
deps = ["definition_7_2_2_multiIndex"]

[[node]]
id = "example_7_2_7"
kind = "theorem"
desc = '''Example 7.2.7: if a bounded Lipschitz `Ω` is partitioned into Lipschitz sub-domains
`Ω_n`, `v|_{Ω_n} ∈ W^{k+1,p}(Ω_n)` for each `n` and `v ∈ C^k(closure Ω)`, then `v ∈ W^{k+1,p}(Ω)`
-- the global regularity of a conforming finite element function from its element-wise regularity.
Not formalized: the proof integrates by parts on each `Ω_n` and cancels the interface integrals
`∫_{∂Ω_n} v φ ν_i`, so it needs surface measure on a Lipschitz boundary and the integration by
parts formula of §7.6, which rests on the trace of Theorem 7.3.10. The Lipschitz hypothesis itself
is now available, as `definition_7_2_1_lipschitzDomain`.'''
deps = ["definition_7_2_1", "definition_7_2_2_multiIndex", "proposition_7_6_1"]

[[node]]
id = "example_7_2_8"
kind = "theorem"
desc = '''Example 7.2.8: the converse of Example 7.2.7 -- if `v ∈ W^{k+1,p}(Ω)` and
`v ∈ C^k(closure Ω_n)` for each sub-domain, then `v ∈ C^k(closure Ω)`; together the two give
`v ∈ C^k(closure Ω) ↔ v ∈ W^{k+1,p}(Ω)` under element-wise regularity. Not formalized: the
argument produces a nonzero interface integral `∫_γ (v|_{Ω_{n₁}} - v|_{Ω_{n₂}}) φ ν_i`, so it
needs surface measure on a Lipschitz boundary and the trace of Theorem 7.3.10.'''
deps = ["example_7_2_7", "proposition_7_6_1"]

