[[node]]
id = "definition_7_2_13"
kind = "definition"
desc = '''Definition 7.2.13: given a patch system `∂Ω ∩ B(x_i,r_i) = {x_d = g_i(x_1,…,x_{d-1})}`
with `g_i ∈ C^{k,α}(D_i)` covering `∂Ω`, and `s ≤ k + α`, `W^{s,p}(∂Ω) = {v ∈ L^2(∂Ω) : v ∘ g_i ∈
W^{s,p}(D_i)}` with `‖v‖ = max_i ‖v ∘ g_i‖_{W^{s,p}(D_i)}`; `H^s(∂Ω) ≡ W^{s,2}(∂Ω)`, and
`H^{1/2}(∂Ω)` is the one used later. Not formalized: this needs surface measure on a Lipschitz
boundary before `L^2(∂Ω)` is even definable. The patch system itself is now available --
`definition_7_2_1_finite_cover` produces exactly the `(x_i, r_i)` and the `g_i` -- and so are the
`W^{s,p}(D_i)` of the patches, `SobolevSlobodeckij`; what is missing is the measure on `∂Ω`, and
with it the independence of the norm from the choice of patches.

Blocked: rechecked 2026-09-20 (blocker 2); the reason above stands unchanged. The Brezis round (2026-09-17–20) left blocker 2 untouched: `Numlib/` has no surface measure on a
boundary (`hausdorffMeasure`, `Gauss`, `divergence`, `perimeter` occur only in the quadrature and
Fourier modules, for unrelated reasons), no trace operator (`theorem_7_3_10` is still open) and no
integration by parts on a domain; Mathlib on this pin still has the divergence theorem for boxes
only (`MeasureTheory.integral_divergence_of_hasFDerivAt_off_countable`) and the new
`CurveIntegral/Poincare` for plane curves, nothing for a Lipschitz or `C¹` hypersurface. The
Brezis surface's own boundary nodes (`example_9_4_stepA/D`, Theorem 9.26's Neumann clause,
`regularity_neumann`) are deferred on the same gap. `notes/fem-roadmap.md` Decision C stands.
What the Brezis round did add is the trace-free part of the fractional theory: the interior
Slobodeckij spaces `SobolevSlobodeckij` (`Numlib/Analysis/Sobolev/Slobodeckij.lean`) on the
patches `D_i` are proved, so only the boundary measure and the area formula are missing.
'''
deps = ["definition_7_2_1_finite_cover", "definition_7_2_10"]
