[[node]]
id = "example_7_2_7"
kind = "theorem"
desc = '''Example 7.2.7: if a bounded Lipschitz `Ω` is partitioned into Lipschitz sub-domains
`Ω_n`, `v|_{Ω_n} ∈ W^{k+1,p}(Ω_n)` for each `n` and `v ∈ C^k(closure Ω)`, then `v ∈ W^{k+1,p}(Ω)`
-- the global regularity of a conforming finite element function from its element-wise regularity.
Not formalized: the proof integrates by parts on each `Ω_n` and cancels the interface integrals
`∫_{∂Ω_n} v φ ν_i`, so it needs surface measure on a Lipschitz boundary and the integration by
parts formula of §7.6, which rests on the trace of Theorem 7.3.10. The Lipschitz hypothesis itself
is now available, as `definition_7_2_1_lipschitzDomain`.

Blocked: re-checked 2026-09-15 against Mathlib at this pin. The obstruction is the boundary
integral `∫_{∂Ω_n} v φ ν_i` of the proof: Mathlib's divergence theorem
(`MeasureTheory.integral_divergence_of_hasFDerivAt_off_countable`) is for boxes only, there is no
Gauss-Green on a Lipschitz domain, and `finite perimeter` / `reducedBoundary` have zero
occurrences. `MeasureTheory.Measure.hausdorffMeasure` exists, so the boundary *measure* can be
named, but no theorem relates it to the boundary charts. See the `Blocked` note on
`theorem_7_3_10` for the full inventory.'''
deps = ["definition_7_2_1", "definition_7_2_2_multiIndex", "proposition_7_6_1"]

[[node]]
id = "example_7_2_8"
kind = "theorem"
desc = '''Example 7.2.8: the converse of Example 7.2.7 -- if `v ∈ W^{k+1,p}(Ω)` and
`v ∈ C^k(closure Ω_n)` for each sub-domain, then `v ∈ C^k(closure Ω)`; together the two give
`v ∈ C^k(closure Ω) ↔ v ∈ W^{k+1,p}(Ω)` under element-wise regularity. Not formalized: the
argument produces a nonzero interface integral `∫_γ (v|_{Ω_{n₁}} - v|_{Ω_{n₂}}) φ ν_i`, so it
needs surface measure on a Lipschitz boundary and the trace of Theorem 7.3.10.

Blocked: re-checked 2026-09-15; the same obstruction as `example_7_2_7`, of which this is the
converse, and downstream of it.'''
deps = ["example_7_2_7", "proposition_7_6_1"]

