[[node]]
id = "definition_7_5_8"
kind = "definition"
desc = '''Definition 7.5.8: a spherical polynomial of degree `≤ N` is the restriction to the unit
sphere `U ⊆ ℝ^3` of a polynomial in `(x,y,z)` of degree `≤ N`; `𝕊_N` is the set of them, the
analogue of the trigonometric polynomials. Not formalized: §7.5.5 is about spherical harmonics,
of which Mathlib has none (zero occurrences), and nothing in this corpus uses the sphere; unlike
the rest of §7.5 it is not a weighted `ℓ^2` and shares no machinery with it.

Blocked (2026-09-20): rechecked, unchanged (blocker 3). The definition itself — the image of
`MvPolynomial (Fin 3) ℝ` of degree `≤ N` under restriction to the unit sphere `Metric.sphere 0 1`
— could be written in 30 lines (`Numlib/Approximation/MvPolynomial` has multivariate polynomial
spaces of bounded degree), but without spherical harmonics and a surface measure nothing of
Definition 7.5.9 or Theorem 7.5.10 follows, so it is left with them.'''

[[node]]
id = "definition_7_5_9"
kind = "definition"
desc = '''Definition 7.5.9: a spherical harmonic of degree `n` is the restriction to `U` of a
homogeneous harmonic polynomial of degree `n` in `(x,y,z)`; there are `2n+1` independent ones, the
span `𝕊̂_N` of those of degree `≤ N` equals `𝕊_N` (7.5.20) with `dim 𝕊_N = (N+1)^2` (7.5.21), and
the standard `L^2(U)`-orthonormal basis (7.5.22) is built from Legendre polynomials and associated
Legendre functions. Not formalized: Mathlib has no spherical harmonics, no associated Legendre
functions and no surface measure on the sphere for the `L^2(U)` orthonormality; the book quotes
(7.5.20) and (7.5.21) from MacRobert [161] without proof.

Blocked (2026-09-20): blocker 3 of `notes/frontier.md`, unchanged by the Brezis round. Checked:
`grep -rn 'sphericalHarmonic\|SphericalHarmonic' Numlib .lake/packages/mathlib/Mathlib` is empty;
`Numlib/Approximation/OrthogonalPolynomial` has the Legendre polynomials on `[-1, 1]` but no
associated Legendre functions; there is no surface measure on `S^2` in the corpus (the Brezis
round's `IsContDiffDomain` boundary work stopped short of a surface measure, blocker 2). A
faithful statement needs the space of homogeneous harmonic polynomials restricted to the sphere
and its dimension count `2n + 1`; research-scale, out of scope.'''
deps = ["definition_7_5_8"]

[[node]]
id = "theorem_7_5_10"
kind = "theorem"
desc = '''Theorem 7.5.10: for `g ∈ C^{k,γ}(U)` the best uniform approximation by spherical
polynomials satisfies `ρ_N(g) ≤ c_k H_{k,γ}(g) N^{-(k+γ)}` for `N ≥ 1` (7.5.31), with `c_k`
depending only on `k`; the rates (7.5.32)-(7.5.33) for the Laplace expansion follow. Not
formalized: it rests on Definitions 7.5.8-7.5.9, which need spherical harmonics that Mathlib does
not have, and the book states it without proof, citing Gronwall [100] for `k = 0` and Ragozin
[190, Theorem 3.3] in general.

Blocked (2026-09-20): blocker 3 and blocker 17 (quoted without proof) of `notes/frontier.md`,
unchanged by the Brezis round; the Jackson-type argument on the sphere (Ragozin) is a research
project on top of the missing spherical harmonics and the `C^{k,γ}(U)` Hölder spaces on the sphere,
which the corpus does not have either (`Numlib/Analysis/Sobolev/Slobodeckij` is on domains of
`ℝ^d`).'''
deps = ["definition_7_5_8", "definition_7_5_9"]
