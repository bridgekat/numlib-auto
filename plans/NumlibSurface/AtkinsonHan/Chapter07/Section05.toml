[[node]]
id = "example_7_5_3"
kind = "theorem"
desc = '''Example 7.5.3: the square wave `φ = 0` on `((2k-1)π, 2kπ)` and `1` on `(2kπ, (2k+1)π)`
has Fourier series `1/2 - (i/π) ∑_{k≥0} (2k+1)^{-1} [e^{(2k+1)it} - e^{-(2k+1)it}]`, whose
distributional derivative is the Dirac comb `∑_j (-1)^j δ(t - πj)`, `δ` acting on `H^s(2π)` for
`s > 1/2` by `δ[φ] = φ(0)`. Not formalized: this needs distributions on the circle, and Mathlib's
`TemperedDistribution` lives on `ℝ^d` only; the module doc of `Chapter07/Section05` records the
same exclusion.

Blocked (2026-09-20): still no distributions on the circle. Checked: `Numlib/Analysis/Sobolev/Periodic`
has the dual pairing `PeriodicSobolev.dualPairing` (`H^{-t}` as functionals on `H^t`, Exercise
7.5.4) and `PeriodicSobolev.eval` for `s > 1/2`, so `δ` is representable as the element of
`H^{-t}` with all coefficients `(2π)^{-1/2}`, and the square wave's coefficients are computable
from `fourierCoeffOn` of a step function; what is missing is the distributional derivative
`𝒟 : H^s → H^{s-1}` (the operator of (7.5.3), not built, see the module doc) and the identity
`𝒟 φ = ∑_j (-1)^j δ(· − πj)` in `H^{-t}`. A coefficient-level statement (`(i m) a_m` equals the
coefficients of the Dirac comb) would be 150–250 lines once `𝒟` exists; the example is
illustrative and no node depends on it.'''
deps = ["theorem_7_5_2"]

