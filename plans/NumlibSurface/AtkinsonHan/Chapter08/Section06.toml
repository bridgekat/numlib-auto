[[node]]
id = "theorem_8_6_3"
kind = "theorem"
desc = '''Theorem 8.6.3: existence of a saddle point. If `V` and `Q` are reflexive Banach spaces,
`A ⊆ V` and `B ⊆ Q` are non-empty, closed and convex, `L(·, q)` is convex and lower
semicontinuous on `A` for each `q`, `L(v, ·)` is concave and upper semicontinuous on `B` for each
`v`, and the two coercivity conditions (f) and (g) hold — `A` bounded or `L(v, q₀) → ∞` as
`‖v‖ → ∞`, `B` bounded or `L(v₀, q) → -∞` as `‖q‖ → ∞` — then `L` has a saddle point on
`A × B`, whose first component is unique if the convexity is strict and whose second is unique if
the concavity is strict; (f) and (g) may be replaced by the sup/inf forms (f)' and (g)'.
Not formalized: the hypotheses can now be stated — reflexivity is `NormedSpace.IsReflexive` of
`Numlib/Analysis/Normed/Module/Reflexive`, which is `AtkinsonHan.Chapter02.definition_2_7_4` — but
the proof cannot be given here. It consumes the *topological* weak compactness of a closed bounded
convex set in a reflexive space, that is Kakutani's theorem together with Eberlein-Smulian, of
which only the sequential half is available (`AtkinsonHan.Chapter02.theorem_2_7_5_mp`); the book
states the theorem without proof, citing Ekeland-Temam.'''
deps = ["IsSaddlePoint", "AtkinsonHan.Chapter02.definition_2_7_4", "AtkinsonHan.Chapter02.theorem_2_7_5"]
