namespace = "AtkinsonHan.Chapter08"
desc = '''
Atkinson-Han §8.8, a nonlinear problem. No module is planned: the section studies
`-div[(1 + |∇u|²)^{p/2-1} ∇u] = f` in `Ω` with `u = 0` on `Γ`, whose weak form (8.8.6) and energy
(8.8.10) live on `V = W^{1,p}₀(Ω)` for `p ∈ (1, ∞)`, normed by `‖v‖_V = (∫_Ω |∇v|^p)^{1/p}`. That
space needs weak derivatives on an open set, the Poincaré inequality of AH Theorem 7.3.13 for the
norm equivalence, and reflexivity, none of which Mathlib has; the reflexivity in particular cannot
even be stated. The abstract content of the section is AH Theorem 3.3.12 — a coercive, continuous,
strictly convex functional on a reflexive space has a unique minimizer — together with
`AtkinsonHan.Chapter05.theorem_5_3_19`, which is proved. The group exists so that the section's
numbered results are on the record.
'''

[[node]]
id = "lemma_8_8_1"
kind = "theorem"
desc = '''Lemma 8.8.1: the energy functional `E(v) = (1/p) ∫_Ω (1 + |∇v|²)^{p/2} - ∫_Ω f v` of
(8.8.10) is coercive on `V = W^{1,p}₀(Ω)`, since `E(v) ≥ (1/p) ‖v‖_V^p - ‖f‖_{V'} ‖v‖_V` and
`p > 1`. Not formalized: the space `W^{1,p}₀(Ω)` does not exist in Mathlib, which has no weak
derivative on an open set.'''

[[node]]
id = "lemma_8_8_2"
kind = "theorem"
desc = '''Lemma 8.8.2: the energy functional (8.8.10) is continuous on `V = W^{1,p}₀(Ω)`, by an
integral mean-value form of `E(u) - E(v)` bounded through Hölder's inequality.
Not formalized: the space `W^{1,p}₀(Ω)` does not exist in Mathlib, which has no weak derivative
on an open set.'''

[[node]]
id = "lemma_8_8_3"
kind = "theorem"
desc = '''Lemma 8.8.3: the energy functional (8.8.10) is strictly convex, which the book reduces
to strict convexity of `ξ ↦ (1/p)(1 + |ξ|²)^{p/2}` on `ℝ^d` (Exercise 5.3.13). Not formalized: the
space `W^{1,p}₀(Ω)` does not exist in Mathlib, which has no weak derivative on an open set; the
finite-dimensional ingredient is separable from it and is elementary.'''

[[node]]
id = "lemma_8_8_4"
kind = "theorem"
desc = '''Lemma 8.8.4: the energy functional (8.8.10) is Gateaux differentiable, with
`⟨E'(u), v⟩ = ∫_Ω (1 + |∇u|²)^{p/2-1} ∇u · ∇v - ∫_Ω f v` (8.8.11); the proof dominates the
difference quotient by `[1 + (|∇u| + |∇v|)²]^{(p-1)/2} |∇v| ∈ L¹(Ω)` and passes to the limit by
dominated convergence. Not formalized: the space `W^{1,p}₀(Ω)` does not exist in Mathlib, which
has no weak derivative on an open set.'''

[[node]]
id = "theorem_8_8_5"
kind = "theorem"
desc = '''Theorem 8.8.5: for `f ∈ V'` and `p ∈ (1, ∞)`, the weak formulation (8.8.6) and the
minimization problem (8.8.9) are equivalent and both have a unique solution — by AH Theorem 3.3.12
applied to the coercive, continuous, strictly convex `E` on the reflexive `V`, and by AH Theorem
5.3.19 for the equivalence. Not formalized: it needs `W^{1,p}₀(Ω)` and its reflexivity, which
Mathlib cannot express — there is no reflexivity class for Banach spaces — while the abstract half
is `AtkinsonHan.Chapter05.theorem_5_3_19` together with AH Theorem 3.3.12.'''
