[[node]]
id = "theorem_8_5_1"
kind = "theorem"
desc = '''Theorem 8.5.1: under the symmetry, boundedness and pointwise ellipticity conditions
(8.5.6)-(8.5.8) on the elasticity tensor `C`, the regularity (8.5.14) of the data and
`meas(Γ_D) > 0`, the weak problem (8.5.15) — `u ∈ V`, `∫_Ω [C ε(u)] : ε(v) = ∫_Ω f · v + ∫_{Γ_N}
g · v` for all `v ∈ V` — has a unique solution, equivalent to minimizing the energy (8.5.17).
The book leaves the proof to Exercise 8.5.3 (apply Lax-Milgram), and the `V`-ellipticity step
needs Korn's inequality on a Lipschitz domain, alongside the trace on `Γ_D` and surface measure
on `Γ_N`.

Blocked: rechecked 2026-09-20 (agent ah6). **The pure displacement case `Γ_D = Γ`, `g` absent,
is proved as `theorem_8_5_1_dirichlet`** in this module, on a bounded open `Ω ⊆ B(0, R) ⊆ ℝ^{d+1}`:
the space is `[H¹₀(Ω)]^{d+1} = SobolevEuclideanZeroVec (d + 1) Ω`, the form `elasticityForm Ω C`,
the load `elasticityLoad Ω f`, and the `V`-ellipticity is Korn's *first* inequality
`½ ∫ |∇v|² ≤ ∫ |ε(v)|²` on `[H¹₀(Ω)]^{d+1}` (`SobolevEuclideanZeroVec.korn_first`,
`Numlib/Analysis/Sobolev/Korn.lean`: the identity `∫ |ε(v)|² = ½ ∫ |∇v|² + ½ ∫ (div v)²` by two
integrations by parts against test functions and density) with Poincaré's inequality
(`SobolevEuclideanZeroVec.norm_sq_le_sum_norm_strainL_sq`), then `theorem_8_3_4` and
Theorem 8.3.3 (`existsUnique_and_isMinOn_iff`). What is still missing for the mixed case of the
book's statement, `meas(Γ_D) > 0` with a traction `g ∈ [L²(Γ_N)]^d`: (1) blocker 2 of
`notes/frontier.md` — the trace `H¹(Ω) → L²(Γ)` and the surface measure on `Γ_N`, which define
the space `V = {v ∈ [H¹(Ω)]^d : v = 0 on Γ_D}` and the load term `∫_{Γ_N} g · v`; neither exists
in `Numlib/` or Mathlib (grep `trace`, `hausdorffMeasure`, `surfaceMeasure`); (2) Korn's *second*
inequality `‖v‖_{H¹} ≤ C (‖v‖_{L²} + ‖ε(v)‖_{L²})` on `H¹(Ω)` of a Lipschitz (or `C¹`) domain and
its consequence `‖v‖_{H¹} ≤ C ‖ε(v)‖_{L²}` on `V` for `meas(Γ_D) > 0` (a compactness argument
through Rellich–Kondrachov, `Numlib/Analysis/Sobolev/Compactness.lean`, plus the characterization
of the kernel of `ε` as the rigid motions), which is what fails on `H¹(Ω)` since the boundary terms
of the two integrations by parts no longer vanish. Estimate after the trace: 400–700 lines for
Korn's second inequality on a `C¹` domain, then one application as in the Dirichlet case.'''
deps = ["AtkinsonHan.Chapter08.theorem_8_3_4", "AtkinsonHan.Chapter07.theorem_7_3_10", "AtkinsonHan.Chapter07.definition_7_2_2_multiIndex"]
