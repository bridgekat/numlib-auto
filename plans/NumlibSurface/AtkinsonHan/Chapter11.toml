desc = '''
Atkinson–Han, Chapter 11: elliptic variational inequalities and their numerical approximations.

The chapter splits cleanly. Sections 11.2, 11.3 and 11.4 are abstract Hilbert-space theory —
convex minimization, existence and uniqueness for a family of variational inequalities, Minty's
lemma, convergence and error estimates for their approximations — and are formalized here, one
file per section. Sections 11.1 and 11.5 are the applications: the obstacle problem, the
simplified friction problem, the elasto-plastic torsion problem, the Signorini problem, and the
contact problems of elasticity. They live in `H¹₀(Ω)` and `H¹(Ω)^d` with pointwise constraints and
boundary integrals, and are out of scope for want of Sobolev spaces; the pointwise complementarity
relations (11.1.9) additionally need the regularity theory of elliptic equations.

Also out of scope: Theorem 11.3.12 in the book's generality — the `W^{2,p}` regularity of the
obstacle problem on a `C^{1,1}` domain for `a_ij ∈ C(Ω̄)`, quoted by the book from
Brezis–Stampacchia and Gilbarg–Trudinger 9.14 without proof; its node was removed in the closing
round (2026-09-23), the `p = 2`, `a_ij = δ_ij`, `C²`-domain case being proved as
`theorem_11_3_12_two` through the Lewy–Stampacchia inequality, and what is left being `L^p`
regularity for `p ≠ 2` (Calderón–Zygmund), variable coefficients and the `C^{1,1}` class — see
the `## Not formalized here` section of `NumlibSurface/AtkinsonHan/Chapter11/Section03.lean`; and
every exercise of the chapter that names a domain (11.3.4–11.3.9, 11.3.11, 11.3.12, 11.4.1,
11.4.4, 11.4.5). (This paragraph used to list Theorem 11.4.5, the Lagrange-multiplier form of the
friction problem, as out of scope for want of the trace space `H^{1/2}(Γ)`; that is stale — the
boundary round proved it as `theorem_11_4_5`, through Hahn–Banach on `L¹(Γ)` and
`(L¹)' = L^∞`, as the closing paragraph of this description records.)

The surface works over a real Hilbert space `V` throughout, with a real bilinear form
`a : BilinForm V` where the book uses one, reusing the vocabulary of `Chapter08/Section03`
(`IsBoundedWith`, `IsEllipticWith`, `IsSymm`) and its bridges to `SesqForm ℝ V`.

**Boundary round (2026-09-21).** The friction problem's boundary functional `j(v) = g ∫_Γ |v| ds`
is now stated over the trace interface `BoundaryData.TraceFamily` of
`Numlib/Analysis/Sobolev/Boundary/Data.lean` (instances: bounded `C¹` domains, polygons without
slits): `example_11_1_2` (with the pointwise form `example_11_1_2_pointwise` on `C¹` domains),
`example_11_2_4`, `example_11_3_11`, `example_11_4_4` (on a triangulated polygon, with the `H²`
regularity as explicit hypotheses) and `theorem_11_4_5` — the last through Hahn–Banach on
`L¹(Γ)` and `(L¹)' = L^∞` rather than through `H^{1/2}(Γ)`, so it no longer waits on the
fractional trace space.
'''
