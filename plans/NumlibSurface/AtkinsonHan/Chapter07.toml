desc = '''
Atkinson–Han, Chapter 7: Sobolev spaces. §7.1, the integer-order half of §7.2 and §7.5.1–§7.5.3
are formalized; the rest of the chapter is not, and the obstruction differs by section, §7.3 being
the one that blocks nearly everything downstream. Every numbered result has a node in the section
group beside this file, carrying the book's statement and, where it is open, the reason.

* **§7.1, weak derivatives on an open `Ω`.** Definitions 7.1.1 and 7.1.3, Lemmas 7.1.2, 7.1.4 and
  7.1.5 and Proposition 7.1.10 are formalized, in `Chapter07/Section01` over
  `Numlib/Analysis/Sobolev/WeakDeriv`; the uniqueness of the weak derivative is Mathlib's
  `IsOpen.ae_eq_zero_of_integral_contDiff_smul_eq_zero`. Definition 7.1.3 is there twice, bundled
  over the multi-indices of a given length and one multi-index at a time, because §7.2 needs the
  second to state the norm the book displays. The examples are unwritten because nothing consumes
  them: every result that would is blocked further down by §7.3. The one result of §7.1 that is
  itself blocked is Example 7.1.9, the weak derivatives of a piecewise-polynomial function, which
  matches traces across sub-domain interfaces.
* **§7.2, the spaces `W^{k,p}(Ω)`.** Definition 7.2.2, Theorem 7.2.3 and Corollary 7.2.4 are
  formalized, in `Chapter07/Section02`. Definition 7.2.2 is there in two readings, over the two
  indexings of the derivative in the backbone: `Numlib/Analysis/Sobolev/Space` bundles all the
  derivatives of order `n` into one tensor, and `Numlib/Analysis/Sobolev/MultiIndex` keeps the
  `∂^α` separate. Both are closed subspaces of an `ℓ^p` product of `L^p(Ω)` spaces, closed because
  pairing against a fixed test function is continuous on `L^p(Ω)` by Hölder, so Theorem 7.2.3
  holds for both. They differ in the *norm*: only the multi-index one is the norm the definition
  displays, and for `k ≥ 2` and `d ≥ 2` only it is an inner-product norm at `p = 2`, the operator
  norm on the tensors being a spectral norm; that is what Corollary 7.2.4 is stated over, its
  inner product being the one an `ℓ²` product of `L²(Ω)` spaces already carries. The two readings
  of the *space* agree mathematically, and the bundled one implies the multi-index one; the
  converse waits on the symmetry of the derivatives of a `C^∞` test function in its arguments,
  which Mathlib has only up to order two, so the equivalence of the two norms is not formalized
  either. The spaces remain unusable without §7.3. Definition 7.2.9 (`W_0^{k,p}(Ω)`) is
  formalized as the closure of the image of `C_0^∞(Ω)` in that space; only its reading as a space
  of boundary conditions waits on the trace of §7.3. Definition 7.2.13 (Sobolev spaces over a
  boundary, by local charts) additionally needs surface measure on a Lipschitz boundary, and so do
  Examples 7.2.7–7.2.8, which integrate by parts over the sub-domains of a partition.
* **§7.3, the structural theorems.** This is the obstruction itself, and Mathlib has none of it:
  density of `C^∞(Ω)` (Meyers–Serrin, Theorem 7.3.1) and of `C^∞(Ω̄)` on a Lipschitz domain
  (Calderón–Stein, Theorem 7.3.2), the extension operator, the continuous and compact Sobolev
  embeddings, Rellich–Kondrachov, the trace `γ : W^{1,p}(Ω) → L^p(Γ)`, and the Deny–Lions norm
  equivalences with Poincaré–Friedrichs and Bramble–Hilbert on top of them. Each is a substantial
  analysis project, and each is needed by §8.1, §8.4, §8.5, §8.8, chapter 10 and chapter 13.
* **§7.4, the Fourier characterization of `H^k(ℝ^d)`.** The one domain for which Mathlib does have
  a weak derivative is `Ω = ℝ^d`: `TemperedDistribution.MemSobolev s 2` with
  `memSobolev_two_iff_fourier` is one side of Theorem 7.4.1 and `MemSobolev.lineDerivOp` the
  other, so the theorem is statable. Not written; it has no consumer in this corpus either, and
  Examples 7.4.2–7.4.3 and Exercises 7.4.3–7.4.4 are the §7.3 embeddings on a domain again.
* **§7.5.1–§7.5.3, periodic Sobolev spaces — formalized**, in `Chapter07/Section05`. These are
  defined by the decay of Fourier coefficients, so no domain, boundary or weak derivative enters
  them, and they need no §7.3. Three numbered results of §7.5 are outside that: Example 7.5.3, the
  square wave and its Dirac comb, needs distributions on the circle; Theorem 7.5.7 needs a
  trigonometric interpolation operator the project does not have; and §7.5.5 — Definitions
  7.5.8–7.5.9 and Theorem 7.5.10, spherical polynomials, spherical harmonics and the Ragozin
  approximation rate on the unit sphere — is a separate gap, Mathlib having no spherical harmonics.
* **§7.6, integration by parts on a Lipschitz domain.** Green's and divergence formulas
  `∫_Ω u_{x_i} v = ∫_Γ u v ν_i − ∫_Ω u v_{x_i}` need surface measure on a Lipschitz boundary and
  the trace; Mathlib's divergence theorem is for boxes.
'''
