[[node]]
id = "example_2_8_16"
kind = "theorem"
desc = '''Example 2.8.16: on the unit sphere `D ⊆ ℝ³`, the single-layer operator
`K v(x) = ∫_D v(y) / ‖x - y‖ dS_y` (2.8.33) is compact on `L²(D)`; its eigenfunctions are the
spherical harmonics, with `K φ_k = 4π/(2k + 1) φ_k` (2.8.34) and `dim N(μ_k - K) = 2k + 1` for
`μ_k = 4π/(2k + 1)`, and they form a basis of `L²(D)` in agreement with Theorem 2.8.15. Not
formalized: the book states it without proof, citing Mikhlin for the compactness, and it needs both
the surface measure of the sphere as an integration theory — Mathlib has `Measure.toSphere` but no
integration formula in this shape — and spherical harmonics, of which Mathlib has none.

Blocked: rechecked 2026-09-20 (blocker 3 of `notes/frontier.md`); the reason stands. The Brezis
round added no spherical harmonics and no integration formula on the sphere: Mathlib on this pin
still has `SphericalHarmonic`, `sphericalHarmonic`, `Gegenbauer`: zero occurrences (its
`Legendre` is `legendreSym`), and `Numlib/` has only the one-dimensional Legendre polynomials
(`Numlib/Approximation/OrthogonalPolynomial`) and the planar single-layer kernel of
`Numlib/Analysis/Fourier/LogSingleLayer`. What the node needs is the surface measure of `S²` as an
integration theory, the spherical harmonics as a Hilbert basis of `L²(S²)` with the dimension
count `2k + 1`, and the Funk–Hecke eigenvalue computation `K φ_k = 4π/(2k + 1) φ_k`; the
compactness alone would follow from `isCompactOperator_of_isAdmissibleKernel` once `L²(S²)` is
available. A self-contained harmonic-analysis project shared with `definition_7_5_8`,
`theorem_7_5_9`, `theorem_7_5_10`, `theorem_14_1_1`, `theorem_14_2_5`; estimate two to three
thousand lines.
'''
deps = ["theorem_2_8_15", "isCompactOperator_of_isAdmissibleKernel"]
