[[node]]
id = "example_2_5_1"
kind = "theorem"
desc = '''Example 2.5.1: for a bounded open `Ω ⊆ ℝ^d` and `1 ≤ p < ∞`, every `ℓ ∈ (Lᵖ(Ω))'` is
`ℓ(v) = ∫_Ω u v` (2.5.1) for a unique `u ∈ L^{p'}(Ω)` with `1/p + 1/p' = 1`, and every such `u`
gives a bounded functional, so `(Lᵖ(Ω))' = L^{p'}(Ω)`; the dual of `L^∞(Ω)` is strictly larger
than `L¹(Ω)`. Not formalized: the book states it without proof as "a well-known result", and
Mathlib has no `Lᵖ`–`L^{p'}` duality isometry — nothing under `MeasureTheory/Function/LpSpace/`
provides one — so a proof would be a Radon–Nikodym development of its own. §2.5's module doc
records the exclusion.

Blocked: rechecked 2026-09-15; the reason stands. `MeasureTheory/Function/LpSpace/` still carries
only `ContinuousLinearMap.lpPairing`, the easy direction, and no Radon–Nikodym derivative for a
functional on `L^p`. This node is what `AtkinsonHan.Chapter08.theorem_8_8_5` needs to get the
reflexivity of `W^{1,p}_0(Ω)` for `p ≠ 2`.
'''

[[node]]
id = "example_2_5_3"
kind = "theorem"
desc = '''Example 2.5.3: on the subspace `V₀ ⊆ L^∞(0, 1)` of cosets of continuous functions, point
evaluation `ℓ_c([v]) = v(c)` (2.5.3) is well defined with `‖ℓ_c‖ = 1`, so Theorem 2.5.2 extends it
to `ℓ̂_c ∈ (L^∞(0, 1))'` of norm `1` — a point evaluation for merely measurable functions, which
keeps the bounds `m ≤ ℓ̂_c([v]) ≤ M` from a neighbourhood of `c` and agrees with `v(c)` at a point
of continuity. Not formalized: its point is that `ℓ̂_c` lies in `(L^∞)'` outside `L¹`, which needs
the `Lᵖ` duality of Example 2.5.1 to have content, as §2.5's module doc records; the extension
step itself is `theorem_2_5_2`.

Blocked: rechecked 2026-09-15; the reason stands, and it is `example_2_5_1` alone — the
extension step is `theorem_2_5_2`, which is proved.
'''
deps = ["theorem_2_5_2", "example_2_5_1"]

