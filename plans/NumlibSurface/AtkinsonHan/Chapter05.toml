desc = '''
Atkinson–Han, Chapter 5: nonlinear equations and iterative methods (§5.1–5.6).

§5.5 is a summary section: Brouwer's theorem (5.5.1), Schauder's theorem (5.5.4) and the rotation
of a completely continuous vector field are quoted there without proof, and Mathlib has neither a
Brouwer fixed-point theorem nor degree theory, so `Chapter05/Section05` holds only Definition 5.5.3,
Proposition 5.5.5 and the counterexample of Example 5.5.2.

Not formalized, with the record in the "Not formalized here" section of `Chapter05/Section05`:

* **Theorem 5.5.1** (Brouwer) — Mathlib has no Brouwer fixed-point theorem and none of the
  simplicial or degree-theoretic machinery for one; estimate 1500–3000 lines.
* **Theorem 5.5.4** (Schauder) — blocked by 5.5.1 alone; the Schauder-projection half is proved as
  `Brezis.Chapter06.remark_6_1_nonlinear`, leaving 150–250 lines.
* **§5.5.1**, the rotation of a completely continuous vector field and P1–P5 — degree theory.
'''
