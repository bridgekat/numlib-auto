desc = '''
Atkinson–Han, Chapter 10: finite element analysis. Four sections: one-dimensional worked examples
(10.1), triangulations, shape functions and affine-equivalent families (10.2), interpolation error
estimates via the reference element (10.3), and convergence of the finite element solution (10.4).

The general theory is the backbone's `Numlib/FiniteElement/`: the `ℙ_k` Lagrange element on the
principal lattice (`LagrangeElement`, Proposition 10.2.1 and the conformity of Example 10.2.3),
the reference-element estimates (`Interpolation`: Theorems 10.3.3, 10.3.5 and 10.3.9, Corollary
10.3.7, Definition 10.3.6, Lemma 10.2.2) and Céa plus interpolation on a triangulation
(`Triangle`: Theorem 10.4.1 and the Poisson error estimate of Example 10.4.2), on the
triangulation scaffold of `Numlib/Geometry/Triangulation.lean` and
`Numlib/Analysis/Sobolev/Triangulation.lean`. The section files restate each numbered result in
the book's terms — its `BilinForm` and `GalerkinProblem` of Chapters 8 and 9, its mesh parameter
`meshSize` — and prove it by delegation. What is the book's own stays here: the §10.1 algebra, the
low-degree nodal representations (10.2.23), Exercises 10.2.1 and 10.2.3, Example 10.2.3, Theorem
10.3.1, Theorem 10.3.4, Exercise 10.3.3, Example 10.3.8 and its `Q₁` counterpart, the
Aubin–Nitsche lemma (Theorem 10.4.3) with Corollary 10.4.4 in abstract form, and Exercise 10.4.5.

The reference element is assumed to be a Sobolev extension domain (the reference triangle and the
unit square are proved to be), and functions of `H^{k+1}` are read on a representative continuous
up to the boundary. Out of scope: the model Neumann problems of §10.1–10.2, whose boundary terms
need traces on a general boundary; Exercise 10.2.5; Corollary 10.4.4 in the book's form, whose
hypothesis (10.4.9) is `H²` regularity on a convex polygon (`notes/frontier.md` blocker 18); and
the exercises that name a domain. The entries in `Chapter10/Section0{1,2,3,4}.toml` carry each
item.
'''
