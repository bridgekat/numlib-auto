desc = '''
Example 12.6.2 (§12.6.3): the two-grid iteration of §12.6.1 applied to
`λ u(x) - ∫_0^1 k_γ(x + y) u(y) dy = y(x)` with the Poisson kernel `k_γ`, whose eigenvalues and
eigenfunctions are known, reporting the measured iteration counts and error reduction.
Not formalized: it is an illustration — a numerical run of the iteration on one kernel, with no
claim beyond the tables.
