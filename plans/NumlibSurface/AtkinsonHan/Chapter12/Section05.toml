id = "theorem_12_5_4"
kind = "theorem"
desc = '''
Theorem 12.5.4, the regularity of the solution of a weakly singular equation: for (12.5.26) with
`g_gamma(u) = u^{gamma - 1}` (`0 < gamma < 1`) or `log |u|` (`gamma = 1`), a `C^{k+1}` coefficient
`l` and data `f` of the stated class, the solution satisfies
`u` in `C^{(0,gamma)}[a, b] cap C^k(a, b)` with `(x - a)^i (b - x)^i u^{(i)}(x)` in
`C^{(0,gamma)}[a, b]` vanishing at the endpoints, and `|u^{(i)}(x)| <= c_i (x - a)^{gamma - i}`
near `a`.

Obstruction (sharpened, `agent/ah12d`). This is now the *only* open node of chapter 12, and the
only one whose mathematics, rather than whose supporting API, is missing. Two claims of the
previous note are stale and one has been overtaken:

* "`Numlib/IntegralEquations/WeaklySingular` deliberately proves no concrete kernel admissible, so
  even `|x - y|^{gamma - 1}` is not yet available" -- it is:
  `IntegralOperator.isAdmissibleKernel_abs_sub_rpow` is exactly that kernel on an interval, and
  `isAdmissibleKernel_of_abs_le_rpow` together with `abs_log_le_two_mul_rpow` covers
  `log |x - y|` as well. The "elementary but genuinely several pages of interval-integral
  estimates" of item (1) of the old note are done.
* "the pragmatic route -- taking 12.5.4 as a hypothesis of `theorem_12_5_6`" is what
  `theorem_12_5_6` now does, so this node unlocks nothing: proving it would turn a hypothesis of
  12.5.6 into a consequence, not enable a new result.

What remains is the mathematics, and the book does not carry it out either -- it cites Schneider
[202, p. 63]. Two pieces:

1. **Differentiation under the weakly singular integral sign.** Every step of the bootstrap needs
   `d/dx int_a^b l(x, y) g_gamma(x - y) u(y) dy`, and the derivative is *not* the integral of the
   differentiated integrand: differentiating the kernel in `x` produces `|x - y|^{gamma - 2}`,
   which is not integrable, so Mathlib's
   `intervalIntegral.hasDerivAt_integral_of_dominated_loc_of_deriv_le` does not apply -- its
   dominating function cannot exist. The classical fix is to substitute `y = x + s`, splitting the
   integral at `y = x`, and to differentiate in the shifted variable, where the `x`-dependence sits
   in the *limits* as well as in `l`; the endpoint weights `(x - a)^i (b - x)^i` of the conclusion
   are exactly the boundary terms this produces. That change of variables for an interval integral
   with a moving singularity is what the library lacks, and it is the whole of the work.
2. **The log-modified Holder class `C^{(0,1)}[a, b]`** of the paragraph preceding the theorem,
   whose modulus is `|x - xi| log |B/(x - xi)|` for some `B > b - a`.
   `AtkinsonHan.Chapter03.HolderClass` covers only `0 < beta < 1`, and the `gamma = 1` half of the
   statement needs the modified class. This part is cheap once the class is defined.

A worthwhile intermediate target, and the only consequence chapter 12 actually consumes: that
`y |-> l(x, y) u(y)` is of Rice's type `(gamma, m + 1)` uniformly in `x` whenever `u` is. That is
the hypothesis `theorem_12_5_6` carries, and deriving it from 12.5.4 needs only the Leibniz rule
and the smoothness of `l`.

Blocked: rechecked 2026-09-20 (blocker 18, "one-offs", of `notes/frontier.md`); the note above
stands, and the route it describes is neither complete nor short, so the node was not attempted
this round. Checked: `Numlib/IntegralEquations/WeaklySingular.lean` still carries the admissible
kernels (`isAdmissibleKernel_abs_sub_rpow`, `abs_log_le_two_mul_rpow`) and nothing about
differentiating a weakly singular integral in its parameter; the only parameter-differentiation
lemma in the tree is Mathlib's `intervalIntegral.hasDerivAt_integral_of_dominated_loc_of_deriv_le`
(used in `Numlib/Analysis/SpecialFunctions/LaplaceTransform.lean`), which needs a dominating
function that the differentiated kernel `|x - y|^{γ-2}` does not admit; the log-modified class
`C^{(0,1)}[a, b]` is still undefined (`AtkinsonHan.Chapter03.HolderClass` covers `0 < β < 1`); and
the Brezis round added nothing on either point. The book itself quotes the theorem from Schneider
without proof, and its full statement is a `k`-step bootstrap over the weighted Hölder classes
(12.5.27). Estimate: (1) the moving-singularity change of variables and one differentiation
step, 300–500 lines; (2) the log-modified class, 50; (3) the bootstrap to order `k` with the
endpoint weights, 500–800 more — a task of its own, not a bounded one.
'''
