[[node]]
id = "theorem_12_5_4"
kind = "theorem"
desc = '''
Theorem 12.5.4, the regularity of the solution of a weakly singular equation: for (12.5.26) with
`g_gamma(u) = u^{gamma - 1}` (`0 < gamma < 1`) or `log |u|` (`gamma = 1`), a `C^{k+1}` coefficient
`l` and data `f` of the stated class, the solution satisfies
`u` in `C^{(0,gamma)}[a, b] cap C^k(a, b)` with `(x - a)^i (b - x)^i u^{(i)}(x)` in
`C^{(0,gamma)}[a, b]` vanishing at the endpoints, and `|u^{(i)}(x)| <= c_i (x - a)^{gamma - i}`
near `a`.

Obstruction (sharpened, `agent/ah12c`): this is the one item of the chapter whose *mathematics*,
not whose supporting API, is missing. The book proves it over several pages by differentiating
`u = (1/lambda)(f + K u)` under the singular integral sign and bootstrapping on `k`, and every
step of that needs a differentiation theorem for `x -> int_a^b l(x, y) g_gamma(x - y) u(y) dy`
whose hypotheses are exactly the ones being established. Nothing in
`Numlib/IntegralEquations/WeaklySingular` touches differentiability: its (A1)-(A2) framework is
about `L^1` moduli of continuity only, and it deliberately proves no concrete kernel admissible,
so even `|x - y|^{gamma - 1}` is not yet available as an instance.

What is needed, in order: (1) the two examples, `int_a^b |log|x - y|| dy` and
`int_a^b |x - y|^{gamma - 1} dy` bounded uniformly in `x`, with the matching `omega(h) -> 0` --
elementary but genuinely several pages of interval-integral estimates; (2) differentiation under
the integral sign for such a kernel, which is where the endpoint weights `(x - a)^i` come from;
(3) the log-modified Holder class `C^{(0,1)}[a, b]` of the paragraph preceding the theorem, which
`AtkinsonHan.Chapter03.HolderClass` does not cover.

The pragmatic route -- taking 12.5.4 as a hypothesis of `theorem_12_5_6` -- is what the book's own
use of it amounts to, and is what `theorem_12_5_6` should do.
'''
deps = ["theorem_12_5_1"]

[[node]]
id = "lemma_12_5_5"
kind = "theorem"
desc = '''
Lemma 12.5.5, graded-mesh interpolation: for the mesh `x_j = a + (2j/n)^q (b - a)/2` and piecewise
polynomial interpolation of degree `m`, a function of Rice's type `(gamma, m + 1)` -- that is,
`u` in `C^{(0,gamma)}[0, 1] cap C^{m+1}(0, 1]` with `|u^{(m+1)}(x)| <= c x^{gamma - (m+1)}` --
satisfies `norm (u - P_n u)_inf <= c n^{-(m+1)}` once `q >= (m + 1)/gamma`, and
`norm (u - P_n u)_p <= c n^{-(m+1)}` once `q > p(m + 1)/(1 + p gamma)`.

The book states it without proof, citing Atkinson and Rice, so formalizing means reconstructing the
argument: split off the first panel `[x_0, x_1]`, where the Holder bound is used directly, and apply
the Lagrange error formula panel by panel on the rest, where the grading makes
`h_j^{m+1} sup |u^{(m+1)}|` uniform.

Obstruction (sharpened, `agent/ah12c`): the single missing piece is a *piecewise polynomial
interpolation operator of degree `m`* on `C(Icc a b, R)`. The mesh is not the obstacle --
`piecewiseLinearInterpCLM` already takes an arbitrary node sequence -- and neither is the panel
error formula, which is `Lagrange.exists_sub_interpolate_eq` applied on one subinterval, exactly as
`norm_sub_piecewiseLinearInterpCLM_le` does it for `m = 1`. What has to be built is the operator
itself: `piecewiseLinearInterpCLM` is written as a sum of clamped ramps, a device special to
`m = 1`, and the degree-`m` version needs instead a genuine gluing (a `dite` over the panel
containing the point, continuous at the breakpoints because the two interpolants agree at the
shared node) together with its idempotence, its norm and its error bound. That is a self-contained
addition to `Numlib/Approximation/Interpolation` of perhaps 300 lines, and it also unblocks
`theorem_12_3_3` (piecewise quadratic) and the degree-`m` half of `example_12_5_2`, (12.5.19).
'''
deps = ["Lagrange.exists_sub_interpolate_eq"]

[[node]]
id = "theorem_12_5_6"
kind = "theorem"
desc = '''
Theorem 12.5.6: for the weakly singular equation (12.5.26) solved by graded-mesh piecewise
polynomial product integration, the approximating equations are uniquely solvable for large `n`
with uniformly bounded inverses, and `norm (u - u_n)_inf <= c n^{-(m+1)}` once
`q >= (m + 1)/gamma` (or `q > m + 1` when `gamma = 1`).

The proof really is "12.5.1 gives `norm (u - u_n) <= c norm (K u - K_n u)`, then 12.5.4 puts `u` in
Rice's class and 12.5.5 bounds the interpolation error".

Obstruction (sharpened, `agent/ah12c`): `theorem_12_5_1` is now proved, and it is stated for an
*arbitrary* sequence of uniformly bounded, pointwise convergent operators `P_n`, so it already
covers graded meshes and any degree; the family assumptions A1-A3 are
`isCollectivelyCompactFamily_productCLM`. What remains is therefore exactly `lemma_12_5_5`: the
degree-`m` operator and its graded-mesh error bound. With 12.5.4 taken as a hypothesis (as the
book's own use of it amounts to) this node is then a short composition, in the shape of
`example_12_5_2`.
'''
deps = ["theorem_12_5_1", "theorem_12_5_4", "lemma_12_5_5"]
