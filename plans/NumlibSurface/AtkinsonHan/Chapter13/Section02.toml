[[node]]
id = "exercise_13_2_5"
kind = "theorem"
source = "Atkinson-Han, Theoretical Numerical Analysis, (13.2.20) and Exercise 13.2.5"
desc = '''
Exercise 13.2.5 and (13.2.20): for a bounded *convex* region with smooth boundary the double layer
operator has `norm K = pi` exactly, so that `norm ((-pi + K)^{-1})` cannot be obtained from a
Neumann series and the compactness argument of Chapter 12 is necessary rather than convenient.

**Obstruction (sharpened; the earlier note here was wrong).** `IntegralOperator.norm_kernelCLM`
reduces the statement to `sup_t int_0^L abs (k (t, s)) ds = pi`, and
`AtkinsonHan.Chapter13.doubleLayerKernel_eq_neg_im_div` identifies the integrand: writing the curve
as `r(s) = xi(s) + i eta(s)`, off the diagonal `k(t, s) = -Im (r^(1)(s) / (r(s) - r(t)))`, which is
minus `d/ds arg (r(s) - r(t))`. So the row integral is **minus the total turning of the chord
direction seen from the boundary point `r(t)`**, hence `-pi` for a counterclockwise regular simple
closed curve, whose chord direction turns by `+pi` -- a boundary-point form of Hopf''s Umlaufsatz --
and the absolute value may be dropped exactly when the
region is convex, so that the turning is monotone. What is missing is therefore a continuous
argument (a lift along the covering `R -> S^1`) for a plane curve and a turning number; Mathlib has
neither, and neither is numerical analysis.

The previous note here claimed that "the `<= pi` half for a general smooth curve follows from the
same computation with `abs k`" and that this was the part worth attempting first. That is **false**:
for a non-convex smooth curve the chord direction reverses, so
`int_0^L abs (k (t, s)) ds > abs (int_0^L k (t, s) ds) = pi` and `norm K > pi`. Convexity is used
for the whole statement, not only for the lower bound.

Blocked: rechecked 2026-09-20 (blocker 18, "one-offs"); the reason stands — a continuous argument
and a turning number for a plane curve, with the monotonicity of the chord direction under
convexity. Checked 2026-09-20: Mathlib on this pin now has curve integrals of 1-forms and the Poincaré lemma on
convex sets (`Mathlib/MeasureTheory/Integral/CurveIntegral/{Basic,Poincare}`) and the maximum
principle for harmonic functions continuous up to the boundary
(`Mathlib/Analysis/InnerProductSpace/Harmonic/HarmonicContOnCl`), but still no Green's theorem for
a region bounded by a smooth closed curve (the divergence theorem remains
`integral_divergence_of_hasFDerivAt_off_countable`, boxes only), no arclength measure on a curve as
a boundary measure, no normal field and no winding number; `Numlib/` has none of these either, and
the Brezis round (2026-09-17–20) worked on Sobolev spaces and did not touch blocker 2. Mathlib's `Complex.arg` and the covering `ℝ → S¹` are available for the local
lift; the global lift along a closed curve and the Umlaufsatz at a boundary point are unwritten,
estimate 400–600 lines.
'''
deps = ["doubleLayerKernel", "doubleLayerKernel_eq_neg_im_div", "IntegralOperator.norm_kernelCLM"]

[[node]]
id = "equation_13_2_19"
kind = "theorem"
source = "Atkinson-Han, Theoretical Numerical Analysis, (13.2.14)-(13.2.21)"
desc = '''
Section 13.2.1, (13.2.19): with `u_n` the double layer potential of the Nystrom density `rho_n`,
`max_{closure D_i} abs (u - u_n) <= (pi + norm K) * norm (rho - rho_n)_infinity`.

**Obstruction (sharpened; the earlier note here described the wrong argument).** The book's
derivation is (13.2.16) plus (13.2.17): `u - u_n` is harmonic on `D_i` and continuous on its
closure, so by the maximum principle its sup is attained on `S`; and on `S` its value is given by
the **jump relation** `u(P) - u_n(P) = -pi (rho - rho_n)(P) + int_S (rho - rho_n)(Q) d/dn_Q log
norm (P - Q) dS_Q`. The jump relations (13.1.7)-(13.1.8) are exactly the potential theory the rest
of Section 13.1 is skipped for. The maximum principle alone is within range of Mathlib's
`HarmonicContOnCl`; the jump relation is not.

There is no singularity subtraction in Atkinson-Han Section 13.2.1; the earlier note here described
a scheme from Atkinson's own monograph instead. This node belongs on the skip list beside the rest
of the potential theory.

Blocked: rechecked 2026-09-21 (boundary round, agent bsurf11). What changed: the double layer
potential as a function on the region, `u(P) = ∫_S ρ(Q) ∂/∂n_Q log |P − Q| dS_Q`, is now
*definable* on a bounded `C¹` plane domain — the arclength measure `dS` is
`IsContDiffDomain.boundaryMeasure` and the normal `n_Q` is `IsContDiffDomain.outwardNormal` (up
to the chapter's inner-normal sign; `−ν` is continuous on `S`,
`IsContDiffDomain.continuousOn_outwardNormal`), `Numlib/Analysis/Sobolev/Boundary/`; Green's
theorem is `theorem_13_1_2` (proved, on `C¹` domains and polygons) and Green's identities are
`BoundaryData.integral_laplacian_mul_add_eq`. Nothing of (13.2.19) follows from Green's formula
alone: its derivation is the maximum principle for `u − u_n` (Mathlib's `HarmonicContOnCl`) plus
the jump relation (13.2.17) of the double layer potential across `S` (the limit of the potential
at a boundary point from inside equals `−π ρ(P) + ∫_S …`), a singular-integral argument (the
principal value of the kernel at the boundary, `theorem_13_1_1`'s potential route) that neither
Mathlib nor `Numlib/` has; estimate 800+ lines on the `C²` boundary.
'''
deps = ["equation_13_2_7", "AtkinsonHan.Chapter13.theorem_13_1_2"]

