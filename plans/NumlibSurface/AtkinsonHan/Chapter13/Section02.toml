[[node]]
id = "example_13_2_2"
kind = "theorem"
desc = '''
Example 13.2.2 (§13.2.1): a continuation of Example 13.2.1 for `(a, b) = (1, 5)` and `n = 32`,
tabulating the error in the potentials `u_n` and `u_{n, m}` along the radial line
`c(q) = q (a cos (pi/4), b sin (pi/4))` and observing that the error is some twenty times smaller
than the bound (13.2.21) predicts, and that increasing `m` reduces the error until the error of
`u - u_n` dominates.

Not formalized: a numerical table, not a theorem. Everything the example asserts is measured --
two tables and three figures of errors in `u_n` and `u_{n, m}` along one radial line, and the
observation that they are some twenty times smaller than a bound predicts. The bound is (13.2.21),
which is itself part of the potential theory this chapter skips: its derivation is the maximum
principle plus the jump relation, as `equation_13_2_19` records. There is no claim in the example
that does not name a measured number.
'''

