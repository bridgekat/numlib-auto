[[node]]
id = "doubleLayerKernelCP"
kind = "definition"
desc = '''
The parametrized double layer kernel of a regular simple *closed* curve of period `L`, as an element
of `C(AddCircle L x AddCircle L, R)` -- the form Section 13.2 uses, and the form in which the book
states that `K` is compact from `C_p(L)` to `C_p(L)`.

`doubleLayerKernel` and `isCompactOperator_doubleLayer` give the statement on a parameter *interval*
on which the curve is simple; what is missing is the descent to the circle.

**`doubleLayerKernel` is not separately `L`-periodic, so the obvious plan -- prove biperiodicity,
then lift along the quotient map -- does not work.** At `s = t` one has `k(t + L, t) = 0`, because
`equation_13_1_33` applies (the real parameters `t` and `t + L` are distinct) and both its numerator
and its denominator vanish, while `k(t, t)` is half the curvature. The divided-difference formula
divides by `s - t`, and for a closed curve `s - t` and `s - t - L` are different divisors of the
same vanishing chord.

The construction that does work chooses the representative of the *difference*: for
`(T, S) : AddCircle L x AddCircle L`, take any representative `t` of `T` and the representative `d`
of `S - T` in `[-L/2, L/2)`, and set `K (T, S) = doubleLayerKernel t (t + d)`. Three things to
check, each within reach:

1. **Well-definedness in `t`.** `doubleLayerKernel (t + m L) (s + m L) = doubleLayerKernel t s` for
   every integer `m`: `firstOrder xi' (s + m L) (t + m L)` is `int_0^1 xi' ((s - t) th + t + m L)`,
   which is `firstOrder xi' s t` by periodicity of `xi'` alone, and the same for `secondOrder`. The
   kernel *is* invariant under the diagonal action, which is all this step needs.
2. **Continuity away from the seam** is `continuous_doubleLayerKernel` composed with the local
   section `AddCircle.equivIco` or `AddCircle.equivIoc`, homeomorphisms off one point.
3. **The seam `d = -L/2`.** Continuity there is the equality
   `doubleLayerKernel t (t - L/2) = doubleLayerKernel t (t + L/2)`; both arguments are off the
   diagonal, so `equation_13_1_33` reduces it to the periodicity of `xi` and `eta`.

With this, `IntegralOperator.kernelCLM volume doubleLayerKernelCP` is the operator of
`AtkinsonHan.Chapter13.equation_13_2_7`, and its compactness is
`IntegralOperator.isCompactOperator_kernelCLM`. Until it exists, Section 13.2's theorem is stated for
an arbitrary continuous kernel on `AddCircle L`, which is honest but does not say that the double
layer kernel is one.
'''
deps = ["doubleLayerKernel", "equation_13_1_33", "IntegralOperator.isCompactOperator_kernelCLM"]

[[node]]
id = "kelvin"
kind = "definition"
desc = '''
The **Kelvin transform** in the plane, `kelvin u x = u (x / norm x ^ 2)`, carrying a function on a
region to a function on its image under inversion in the unit circle. In dimension two it carries no
`norm x ^ (2 - d)` weight, so the definition is as clean as it gets.
'''

[[node]]
id = "kelvin_harmonic"
kind = "theorem"
desc = '''
Section 13.1.2: the Kelvin transform preserves harmonicity, so the exterior Dirichlet and Neumann
problems on `D_e` become interior problems on the image of `D_e` under inversion; together with the
removable singularity statement, that a bounded harmonic function on a punctured neighbourhood of
the origin extends across it.

Reachable: Mathlib has `HarmonicOnNhd` and `HarmonicAt`
(`Analysis/InnerProductSpace/Harmonic/{Basic,Constructions}.lean`) and, in dimension two, the
identification of harmonic with locally the real part of a holomorphic function
(`Analysis/Complex/Harmonic/Analytic.lean`), which reduces the claim to "harmonic composed with
antiholomorphic is harmonic" for `z -> 1 / conj z`. The removable singularity is
`Complex.differentiableOn_update_limUnder_of_bddAbove` transported through the same identification.

Genuinely isolated: nothing else in the corpus consumes it, and everything the book uses it *for*
(existence for the exterior problems) rests on Theorem 13.1.1, which is skipped. It is the one item
of this module that is not on the path to Section 13.2.
'''
deps = ["kelvin"]
