[[node]]
id = "theorem_13_1_2_piecewise"
kind = "theorem"
desc = '''
Theorem 13.1.2 in the chapter's generality: a multiply connected planar region whose boundary is a
finite union of piecewise `C²` (or merely `C¹`) Jordan curves with corners.

Blocked (2026-09-21, boundary round; the `C¹` and polygonal cases are `theorem_13_1_2`): a
region bounded by curves with corners that are neither straight (polygon) nor `C¹` — a curved
polygon — is a Lipschitz domain and falls under the Lipschitz theory left out of scope; an
arclength measure on a parametrized `C¹` curve as a `BoundaryData` (the plane case of a
chart-based, Brezis-style definition through `EuclideanSpace.gram`) would cover the smooth
multiply connected case at ~600 lines, and the curved-corner case needs the piecewise gluing of
`Polygon.lean` for curved edges. Nothing in the chapter's proved part depends on it.
'''
deps = ["theorem_13_1_2"]
