desc = '''
Atkinson–Han, Chapter 12: numerical solution of Fredholm integral equations of the second kind.

The chapter has an abstract spine and a concrete body, and the spine is formalized. The abstract
results are Theorem 12.1.2 with Lemmas 12.1.3 and 12.1.4 (projection methods), Lemma 12.3.1 with
the iterated projection solution of Section 12.3, Theorem 12.4.3 with the collectively compact
framework A1–A3 and Lemma 12.4.7 of Section 12.4.3, the two-grid iteration of Section 12.6.2, and
Lemma 12.7.1 in Section 12.7. They are all statements about bounded and compact operators on a
Banach space, they do not mention a kernel or a quadrature rule, and they are what the whole
chapter rests on.

The concrete body is the estimation, for a particular family of subspaces, of the approximation
error `‖u - P_n u‖` or the quadrature error `‖(K - K_n) u‖`. It is now formalized except at four
nodes:

* Section 12.2 entire (`Chapter12/Section02`): piecewise linear collocation and Galerkin on
  `Numlib/Approximation/Interpolation` and the `L²(a, b)` bridge built there from
  `IntegralOperator.iccMeasure` and `ContinuousMap.toLp`; trigonometric collocation and the two
  halves of the Fourier method on `Numlib/Approximation/{Jackson, TrigonometricInterpolation}` and
  `Numlib/Analysis/Fourier/Truncation`.
* Section 12.4 entire (`Chapter12/Section04`), on `Numlib/IntegralEquations/Nystrom` and
  `Numlib/Approximation/CompositeQuadrature`, including the asymptotic expansion of the Nyström
  error (Example 12.4.6) -- whose last clause carries the smoothness of the auxiliary solution
  `gamma` as a hypothesis, that being the book's own unproved "by a similar argument".
* Theorem 12.5.1 and Example 12.5.2 (`Chapter12/Section05`), on
  `Numlib/IntegralEquations/WeaklySingular`; the product integration operator itself is defined
  there, in the surface, and belongs beside `IntegralOperator.admissibleKernelCLM`.
* Sections 12.6 and 12.7.1 (`Chapter12/Section06`, `Chapter12/Section07`), including the sharp
  error bound (12.7.13).

Not formalized: **Theorem 12.5.4**, the regularity of the solution of a weakly singular equation,
which the book itself quotes from Schneider without proof; its node was removed in the closing
round (2026-09-23). It is the one item of the chapter whose mathematics, rather than whose
supporting API, is missing — differentiation under a weakly singular integral sign with a *moving*
singularity, the differentiated kernel `|x − y|^{γ−2}` being non-integrable so that no dominating
function exists for Mathlib's `intervalIntegral.hasDerivAt_integral_of_dominated_loc_of_deriv_le`,
plus the log-modified Hölder class `C^{(0,1)}[a, b]` for `γ = 1`. Nothing downstream waits on it:
`theorem_12_5_6` already carries its conclusion as a hypothesis, which is what the book's own use
of it amounts to. The record is the `## Not formalized here` section of
`NumlibSurface/AtkinsonHan/Chapter12/Section05.lean`. (This paragraph used to list Theorem 12.3.3,
Lemma 12.5.5 and Theorem 12.5.6 as waiting on a piecewise polynomial interpolation operator of
degree `m`; that is stale — the operator exists and all three are proved.)

Also left out: Section 12.7.2, the homotopy argument, which needs the rotation and index of a
completely continuous vector field (Section 5.5.1) — no Mathlib degree theory, and the book quotes
the properties without proof; and Section 12.7.3 and Section 12.6.3–12.6.4, which are the
translation into linear systems and an operation count.
'''
