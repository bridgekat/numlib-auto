desc = '''
Atkinson–Han, Chapter 12: numerical solution of Fredholm integral equations of the second kind.

The chapter has an abstract spine and a concrete body, and the spine is formalized. The abstract
results are Theorem 12.1.2 with Lemmas 12.1.3 and 12.1.4 (projection methods), Lemma 12.3.1 with
the iterated projection solution of Section 12.3, Theorem 12.4.3 with the collectively compact
framework A1–A3 and Lemma 12.4.7 of Section 12.4.3, the two-grid iteration of Section 12.6.2, and
Lemma 12.7.1 in Section 12.7. They are all statements about bounded and compact operators on a
Banach space, they do not mention a kernel or a quadrature rule, and they are what the whole
chapter rests on.

The concrete body is the estimation, for a particular family of subspaces, of the approximation
error `‖u - P_n u‖` or the quadrature error `‖(K - K_n) u‖`. Three of its four parts are now
formalized:

* Section 12.2.1, piecewise linear collocation (`Chapter12/Section02`), on
  `Numlib/Approximation/Interpolation`;
* Lemma 12.4.2 and Theorem 12.4.4, the Nyström operators (`Chapter12/Section04`), on the new
  `Numlib/IntegralEquations/Nystrom` — which is where the collective compactness of the Nyström
  family and the composed quadrature error `e_n` live;
* Example 12.4.5 and its Euler–Maclaurin form (12.4.39) (`Chapter12/Section04`), on the new
  `Numlib/Approximation/CompositeQuadrature` — which is where composite rules, the Riemann sum
  theorem and the Peano identities for the trapezoidal rule live.

What is left, with the obstruction recorded on each node: Sections 12.2.2–12.2.4 (trigonometric
collocation and the two Galerkin methods — the `O(log n)` Lebesgue constant, and an `L²(a, b)`
bridge that the library does not have; note that the *trigonometric* half of the `L²` bridge now
exists, as `trigProjCLM` of `Numlib/Analysis/Fourier/Truncation`, and that the piecewise linear
half additionally needs an `L²` interpolation estimate, since the book's bound is against
`‖u''‖_{L²}` and the library's is against `‖u''‖_∞`); Theorem 12.3.3 (piecewise *quadratic*
interpolation, absent from the backbone, and the odd-moment cancellation (12.3.31)); Example 12.4.6
(the expansion of the Nyström error, for which the scalar Euler–Maclaurin expansion is now
available but its uniformity in the row variable is not); and the whole of Section 12.5 (product
integration for weakly singular kernels), which waits on
`Numlib/IntegralEquations/WeaklySingular` and on piecewise polynomial interpolation of degree `m`.

Also left out: Section 12.7.2, the homotopy argument, which needs the rotation and index of a
completely continuous vector field (Section 5.5.1) — no Mathlib degree theory, and the book quotes
the properties without proof; and Section 12.7.3 and Section 12.6.3–12.6.4, which are the
translation into linear systems and an operation count.
'''
