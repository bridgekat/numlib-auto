desc = '''
The surface library for Alfio Quarteroni, Riccardo Sacco and Fausto Saleri, *Numerical
Mathematics* (Texts in Applied Mathematics 37, Springer, 2000; bib key `quarteroni2000numerical`),
one module per section of the book that states a numbered result, in
`NumlibSurface/QuarteroniSaccoSaleri/ChapterNN/SectionMM.lean` (`ChapterNN/Basics.lean` where a run
of definition-only sections is merged, as in chapters 1 and 6). Every numbered Theorem, Property,
Lemma, Corollary, Proposition and Definition of the thirteen chapters is a node, together with the
Examples, Remarks, equations and Exercises that state something the text relies on; the numbered
MATLAB Programs are not nodes, and the applications sections (3.14, 4.7, …, 13.11) contribute nodes
only where they state a numbered result.

Naming follows the other surfaces: `theorem_3_4` is Theorem 3.4, `property_1_13` Property 1.13,
`definition_2_1`, `lemma_11_2`, `corollary_4_1`, `proposition_2_1`, `example_2_1`, `remark_1_1`,
`equation_3_51` is (3.51) and `exercise_3_5` is Exercise 5 of chapter 3; a result that needs several
declarations carries a trailing word (`theorem_4_1_mp`, `property_1_18_minors`). Objects the book
names but does not number get descriptive lowerCamelCase names. Declarations live in
`QuarteroniSaccoSaleri.ChapterNN`. The book's generality is kept: real matrices `Matrix (Fin n)
(Fin n) ℝ`, vectors `Fin n → ℝ` or `EuclideanSpace ℝ (Fin n)`, functions on intervals `[a, b]`; each
proof specializes a backbone theorem, and the definitions the book makes in its own terms (a
splitting written as `A = P - N`, a one-step method as an increment function, a spline as a
piecewise polynomial) carry equivalence lemmas to the backbone's.

This book is the central reference of the 2026-09 planning round: the backbone directories
`Numlib/Conditioning`, `Numlib/ODE`, `Numlib/Optimization`, `Numlib/Probability`,
`Numlib/Algebra`, `Numlib/Direct` and `Numlib/Analysis/PDE`, and some eighty new modules
under the existing directories, were laid out from its thirteen chapters; `notes/backbone.md` §17
records the decisions, `notes/book-errata.md` the book's misprints found on the way, and every
node that quotes a result the book states without proof and that is out of reach (the Dahlquist
barriers, Butcher's barrier, the Faber theorem, the weighted-Sobolev spectral estimates, the
two-dimensional finite element estimates) says so in its description.

A surface library does not import another surface library: where this book and Saad's need the
same glue (matrix `p`-norms, complexification of real splittings, the componentwise Jacobi and SOR
sweeps, similarity), the glue is planned in the backbone and the Saad copies are marked deprecated.
'''
