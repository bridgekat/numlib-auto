## What this chapter closes

The `Eigen/QRAlgorithm` module doc's "The real-arithmetic Francis implementation is not defined": its
specification becomes `Matrix.IsFrancisStep` and its implementation Algorithm 7.5.1. The complex
generalized Schur form of a singular pencil, which the `GeneralizedSchur` doc says "is not written out".
No `notes/frontier.md` item is closed (the Givens rounding model, the one relevant frontier item, is
chapter 5's).
