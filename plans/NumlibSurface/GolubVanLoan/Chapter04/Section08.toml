namespace = "GolubVanLoan.Chapter04"
desc = '''
§4.8, circulant and discrete Poisson systems: solving through an eigenvalue decomposition ((4.8.2)),
the inverse DFT (§4.8.1), circulants and their diagonalization by the DFT ((4.8.3)–(4.8.4), Lemma
4.8.1, Theorem 4.8.2, Algorithm 4.8.1), the one- and two-dimensional discrete Poisson problems
((4.8.6)–(4.8.12)), the fast Poisson framework (Algorithm 4.8.2), the DST/DCT inverses (§4.8.5), the
four fast eigenvalue decompositions (Lemma 4.8.3, (4.8.16)–(4.8.25)) and the symmetrization of
`𝒯^{(DN)}` (§4.8.7). Backbone: `LinearAlgebra/Matrix/{Toeplitz,TridiagonalToeplitz,KroneckerSum}`,
`Analysis/Fourier/{DFT,Circulant,SineCosineTransform}`, `Direct/FastPoisson`. The transform matrices are the backbone's
one scheme `Matrix.dst1` (chapter 1's `S_n`), `Matrix.dst2` (the book's `DST2(n)`), `Matrix.dct1`, `Matrix.dct2`; the
second-difference matrices live in `TridiagonalToeplitz` (namespace `Matrix`) with their eigensystems beside the
transforms, and the periodic one's diagonalization in `Analysis/Fourier/Circulant`.

Conventions: the book's `F_n` (`ω_n = e^{−2πi/n}`) is `(Matrix.dft n)ᴴ` and its conjugate `F̄_n` is
`Matrix.dft n`; the book's `C(z)` (first column `z`) is Mathlib's `Matrix.circulant z`; `𝒟_n` is
`Matrix.downshift n`; `𝒯^{(DD)}_n = Matrix.symmTridiagonalToeplitz n (-1) 2` and the other three
second-difference matrices are `Matrix.secondDifferenceDN/NN/Periodic n`; `s(θ)`, `c(θ)` of
(4.8.15) are `Matrix.sinAngleVec n θ`, `Matrix.cosAngleVec n θ`; `e_1`, `e_n` are `Pi.single 0 1`,
`Pi.single ⟨n−1, _⟩ 1`. `reshape(u, n₁, n₂)` is Mathlib's column-major `Matrix.vec` read backwards,
and `I_{n₂} ⊗ A₁ + A₂ ⊗ I_{n₁}` is the Kronecker sum `A₂ ⊕ₖ A₁` on `Fin n₂ × Fin n₁`. "Fast"
(the `O(n log n)` counts), Figure 4.8.1 and the `m = 5` displays are not formalized.
'''

