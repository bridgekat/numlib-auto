deps = ["Matrix.inv_conjTranspose_dft_mul_secondDifferencePeriodic_mul_conjTranspose_dft"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.8.22)'

[[node]]
id = "equation_4_8_23"
kind = "theorem"
desc = '''(4.8.23): `F̄_n(:, j) = F_n(:, n + 2 − j)` for `j = 2 … n` (`ω^{n−k} = ω̄^k`), with `F_n` chapter 1's
`GolubVanLoan.Chapter01.fourierMatrix n`; `fourierMatrix_apply`. ★'''
deps = ["GolubVanLoan.Chapter01.fourierMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.8.23)'

[[node]]
id = "equation_4_8_25"
kind = "theorem"
desc = '''(4.8.24)–(4.8.25): with `m = ⌈(n + 1)/2⌉` and `V^{(P)}_n = [Re F_n(:, 1:m) | Im F_n(:, m+1:n)]`,
`𝒯^{(P)}_n V^{(P)}_n(:, j) = λ_j V^{(P)}_n(:, j)` for `j = 1 … n`;
`Matrix.secondDifferencePeriodic_mulVec_realDftCol`. ★'''
deps = ["Matrix.secondDifferencePeriodic_mulVec_realDftCol"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.8.25)'

[[node]]
id = "dn_symmetrizable"
kind = "theorem"
desc = '''§4.8.7: with `D = diag(I_{n−1}, √2)`, `D⁻¹ 𝒯^{(DN)}_n D` is symmetric (`2 ≤ n`): the only asymmetric pair
`(−1 at (n−1, n), −2 at (n, n−1))` becomes `(−√2, −√2)`. Entrywise; `Matrix.inv_diagonal`. ★'''
deps = ["Matrix.secondDifferenceDN"]
source = 'Golub–Van Loan, Matrix Computations, §4.8.7, Display'
