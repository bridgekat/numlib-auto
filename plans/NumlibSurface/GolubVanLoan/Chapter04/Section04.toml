[[node]]
id = "equation_4_4_21"
kind = "theorem"
desc = '''(4.4.21): for `B` of full column rank there is `ψ_B`, independent of `C`, with
`‖(Bᵀ C⁻¹ B)⁻¹ Bᵀ C⁻¹‖₂ ≤ ψ_B` for every positive diagonal `C`; `Matrix.exists_forall_l2_opNorm_weightedLeastSquaresOp_le`
at `d = C⁻¹`'s diagonal (★★★ in the backbone; the book quotes it). ★

Blocked: waits on the backbone node `Matrix.exists_forall_l2_opNorm_weightedLeastSquaresOp_le`
(★★★, module `Numlib/Direct/SymmetricIndefinite`, not yet written); a restatement at `d = C⁻¹`'s
diagonal once it exists.'''
deps = ["Matrix.exists_forall_l2_opNorm_weightedLeastSquaresOp_le"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.4.21)'
