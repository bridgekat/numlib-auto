namespace = "GolubVanLoan.Chapter04"
desc = '''
§4.2, positive definite systems: unsymmetric positive definiteness (Theorems 4.2.1–4.2.6), the
Cholesky factorization (Theorem 4.2.7) and gaxpy Cholesky (Algorithm 4.2.1) with its stability
(§4.2.6), the pivoted outer-product `L D Lᵀ` (Algorithm 4.2.2, (4.2.10)), the semidefinite case
(Theorem 4.2.8, (4.2.11)–(4.2.17)), and block Cholesky (Algorithms 4.2.3–4.2.4, (4.2.18)–(4.2.19)).
Backbone: `LinearAlgebra/Matrix/{Cholesky,HermitianPart,PosDef,SchurComplement}`,
`FloatingPoint/LU`. "Positive definite" for an unsymmetric matrix is the surface's
`IsPositiveDefinite` (chapter conventions); "symmetric positive (semi)definite" is Mathlib's
`Matrix.PosDef`/`PosSemidef`. The book's lower Cholesky factor `G` is `Matrix.cholesky A`.
§4.2.4 (square roots), §4.2.10 (packed formats) and the flop discussions are not formalized
(chapter group). The book's "Algorithm 4.1.2" in §4.2.3 is Algorithm 4.1.1.
'''

[[node]]
id = "IsPositiveDefinite"
kind = "definition"
desc = '''§4.2, Definition: `A : Matrix (Fin n) (Fin n) ℝ` is *positive definite* if `∀ x ≠ 0, 0 < x ⬝ᵥ (A *ᵥ x)`
(no symmetry). (The book's "positive semidefinite" and "indefinite" for unsymmetric matrices are
used nowhere else in the chapter; the symmetric semidefinite notion of §4.2.8 is Mathlib's
`Matrix.PosSemidef`.) ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §4.2, Definition'

[[node]]
id = "isPositiveDefinite_iff"
kind = "theorem"
desc = '''`IsPositiveDefinite A ↔ (Matrix.hermitianPart A).PosDef` ("the positive definiteness of a general matrix
is inherited from its symmetric part", §4.2.2; `xᵀ S x = 0` for the skew part);
`Matrix.posDef_hermitianPart_iff_forall_dotProduct_mulVec_pos`, now over `RCLike 𝕜` with the condition
`∀ x ≠ 0, 0 < RCLike.re (star x ⬝ᵥ (A *ᵥ x))`: at `𝕜 = ℝ`, `star x = x` and `RCLike.re_to_real` give the
surface's `0 < x ⬝ᵥ (A *ᵥ x)`. For symmetric `A`, also `IsPositiveDefinite A ↔ A.PosDef`. ★'''
deps = ["IsPositiveDefinite", "Matrix.posDef_hermitianPart_iff_forall_dotProduct_mulVec_pos"]
source = 'Golub–Van Loan, Matrix Computations, §4.2.2, Display'

[[node]]
id = "theorem_4_2_1"
kind = "theorem"
desc = '''Theorem 4.2.1: if `A` is positive definite (`IsPositiveDefinite A`) and `X : Matrix (Fin n) (Fin k) ℝ` has
rank `k` (`X.rank = k`, equivalently `Function.Injective X.mulVec`), then `Xᵀ A X` is positive definite.
The book's proof verbatim (`(Xz)ᵀ A (Xz) > 0` for `z ≠ 0`), or `Matrix.hermitianPart_conjTranspose_mul_mul`
with `Matrix.PosDef.conjTranspose_mul_mul_same`. ★'''
deps = ["IsPositiveDefinite", "Matrix.hermitianPart_conjTranspose_mul_mul"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 4.2.1'

[[node]]
id = "corollary_4_2_2"
kind = "theorem"
desc = '''Corollary 4.2.2: if `A` is positive definite then every principal submatrix `A(v, v)`, `v` a strictly
increasing index vector (`A.submatrix e e` for `e : Fin k ↪o Fin n`, or any injective `e`), is
positive definite; in particular `0 < A i i`. From `theorem_4_2_1` with `X = I(:, v)` (the book's
proof), or `Matrix.PosDef.submatrix` on the Hermitian part. ★'''
deps = ["theorem_4_2_1", "IsPositiveDefinite"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 4.2.2'

[[node]]
id = "theorem_4_2_3"
kind = "theorem"
desc = '''Theorem 4.2.3: `A` is positive definite iff the symmetric matrix `T = (A + Aᵀ)/2` has positive
eigenvalues: `IsPositiveDefinite A ↔ ∀ i, 0 < (Matrix.hermitianPart_isHermitian A).eigenvalues i`.
`isPositiveDefinite_iff` and Mathlib's `Matrix.IsHermitian.posDef_iff_eigenvalues_pos`. ★'''
deps = ["isPositiveDefinite_iff", "Matrix.hermitianPart_isHermitian"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 4.2.3'

[[node]]
id = "corollary_4_2_4"
kind = "theorem"
desc = '''Corollary 4.2.4: if `A` is positive definite, it has an LU factorization and the diagonal entries of `U`
are positive: `∃ L U, Matrix.IsLU A L U ∧ ∀ i, 0 < U i i`. `Matrix.exists_isLU_of_posDef_hermitianPart`.
★'''
deps = ["isPositiveDefinite_iff", "Matrix.exists_isLU_of_posDef_hermitianPart"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 4.2.4'

[[node]]
id = "theorem_4_2_5"
kind = "theorem"
desc = '''Theorem 4.2.5 with (4.2.1)–(4.2.3): for positive definite `A = [α vᵀ; v B] + [0 −wᵀ; w C]` (`B` symmetric,
`C` skew; over `Fin 1 ⊕ Fin (n−1)` via `finSumFinEquiv`), (4.2.1) `A = [1 0; (v+w)/α I] [α (v−w)ᵀ;
0 B₁ + C₁]` with (4.2.2) `B₁ = B − (v vᵀ − w wᵀ)/α` symmetric positive definite and (4.2.3)
`C₁ = C − (w vᵀ − v wᵀ)/α` skew-symmetric. The identity is block multiplication; definiteness is
`Matrix.posDef_hermitianPart_schurComplementSingle` (with `hermitianPart (B₁ + C₁) = B₁`). ★★'''
deps = ["Matrix.posDef_hermitianPart_schurComplementSingle", "isPositiveDefinite_iff"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 4.2.5'

[[node]]
id = "theorem_4_2_6"
