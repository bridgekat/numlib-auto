[[node]]
id = "algorithm_4_2_3"
kind = "definition"
desc = '''Algorithm 4.2.3 (recursive block Cholesky), D4, the shape of `notes/gvl/ch04/proto/Shapes.lean` §4
(elaborates): `algorithm_4_2_3 (rnd) (r : ℕ) (hr : 0 < r) : (n : ℕ) → Matrix (Fin n) (Fin n) ℝ → M
(Matrix (Fin n) (Fin n) ℝ)` by well-founded recursion on `n`: if `n ≤ r`, the lower part `F − Matrix.strictUpper F` of
`F ← algorithm_4_2_1 rnd A` (zeroing the untouched upper triangle is exact, not rounded — algo
review L5: Algorithm 4.2.1's array keeps `A`'s upper triangle, so returning it unmasked would break
`= Matrix.cholesky A`); else with `e : Fin r ⊕ Fin (n − r) ≃ Fin n` (`finSumFinEquiv` and `finCongr`) and
`B := A.submatrix e e`: `G₁₁ ←` the lower part of `algorithm_4_2_1 rnd B.toBlocks₁₁`; `G₂₁` row by row by
`Chapter03.algorithm_3_1_3 rnd G₁₁` (each row `g` of `G₂₁` solves `G₁₁ gᵀ = a`); `Ã ←` entrywise
`rnd (B₂₂ i j − rnd (G₂₁ i k * G₂₁ j k))` running differences over `k`; `G₂₂ ← algorithm_4_2_3 rnd r hr
(n − r) Ã`; return `(fromBlocks G₁₁ 0 G₂₁ G₂₂).submatrix e.symm e.symm`. ★

Blocked: the program calls chapter 3's surface (agent s03, not on this branch's base) `GolubVanLoan.Chapter03.algorithm_3_1_3`
for the multiple-right-hand-side triangular solve (convention 5: a step delegated to an earlier chapter
calls that chapter's program). The block equations it implements are proved (`equation_4_2_18`,
`equation_4_2_19`).'''
deps = ["algorithm_4_2_1", "GolubVanLoan.Chapter03.algorithm_3_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.3'

[[node]]
id = "algorithm_4_2_3_spec"
