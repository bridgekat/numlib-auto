[[node]]
id = "theorem_4_2_7"
kind = "theorem"
desc = '''Theorem 4.2.7 (Cholesky factorization): if `A` is symmetric positive definite (`A.PosDef`), there is a
unique lower triangular `G` with positive diagonal and `A = G Gᵀ`:
`∃! G, G.IsLowerTriangular ∧ (∀ i, 0 < G i i) ∧ A = G * Gᵀ`, and it is `Matrix.cholesky A`.
`Matrix.existsUnique_isCholesky` with `H = Gᵀ` (`Matrix.cholesky_eq_of_isCholesky`,
`Matrix.isCholesky_cholesky`). ★'''
deps = ["Matrix.existsUnique_isCholesky", "Matrix.cholesky_eq_of_isCholesky", "Matrix.isCholesky_cholesky"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 4.2.7'

[[node]]
id = "equation_4_2_9"
kind = "theorem"
desc = '''(4.2.9): if `A = G Gᵀ` with `G` lower triangular, then for every `j`,
`G j j • G(:, j) = A(:, j) − ∑_{k < j} G j k • G(:, k)` (as functions of the row index, entries `≥ j`
meaningful; the identity holds for all rows). From `A(:, j) = ∑_{k ≤ j} G(j,k) G(:,k)`
(`Matrix.IsCholesky.apply_eq_sum`, or directly `Matrix.mul_apply` with lower triangularity). ★'''
deps = ["theorem_4_2_7", "Matrix.IsCholesky.apply_eq_sum"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.2.9)'

[[node]]
id = "algorithm_4_2_1"
kind = "definition"
desc = '''Algorithm 4.2.1 (gaxpy Cholesky), D4: `algorithm_4_2_1 (rnd : ℝ → M ℝ) (A : Matrix (Fin n) (Fin n) ℝ) :
M (Matrix (Fin n) (Fin n) ℝ)`, a `List.foldlM` over `j`: for `i ≥ j`, `A i j ←` the running
difference of `A i j` with `rnd (A i k * A j k)`, `k < j` (the gaxpy `A(j:n,j) − A(j:n,1:j−1) ·
A(j,1:j−1)ᵀ`, empty for `j = 0`); then `s ← rnd (Real.sqrt (A j j))` and `A i j ← rnd (A i j / s)` for
`i ≥ j`, the diagonal included (the book's `A(j:n,j)/sqrt(A(j,j))`). Returns the matrix whose lower
triangle is `G`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.1'

[[node]]
id = "algorithm_4_2_1_rounds"
kind = "theorem"
desc = '''The rounding bridge of Algorithm 4.2.1, with its hypothesis on the returned diagonal (convention 9;
the running differences `t_j` before the square root are overwritten and cannot be a hypothesis):
every `F ∈ (algorithm_4_2_1 fp.round A).run` with `∀ j, F j j ≠ 0` satisfies
`FloatingPoint.RoundsCholeskyDiv fp A (F − Matrix.strictUpper F)` (the diagonal is `fl(t / fl(√t))`,
which is why the relation is not `RoundsCholesky`). The hypothesis forces `t_j > 0`, which is what
the relation's exact root `s_j = √t_j`, `s_j * s_j = t_j` needs: if `t_j ≤ 0` then `√t_j = 0`, its
rounding is `0` (`fp.Rounds 0 y → y = 0`), and `F j j = fl(t_j / 0) = fl(0) = 0`. The column update
writes one entry per step, reading only the frozen row `j` (`SetM.mem_run_foldlM_update_of_nodup`).
★★ (~150 lines)'''
deps = ["algorithm_4_2_1", "FloatingPoint.RoundsCholeskyDiv", "SetM.mem_run_bind", "SetM.mem_run_foldlM_update_of_nodup", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.1'

[[node]]
id = "algorithm_4_2_1_run_nonempty"
kind = "theorem"
desc = '''Nonemptiness (review `notes/gvl/review/algo.md` M8): for a total model the run set of gaxpy Cholesky
is nonempty, `fp.IsTotal → (algorithm_4_2_1 fp.round A).run.Nonempty` (for every `A`, positive
definite or not: a negative pivot gives `√ = 0` and junk, not an empty run set), so
`algorithm_4_2_1_rounds` and `cholesky_backward_error` are not vacuous. `SetM.run_foldlM_nonempty`,
`SetM.run_bind_nonempty`, `FloatingPoint.RoundingModel.run_round_nonempty`. ★'''
deps = ["algorithm_4_2_1", "SetM.run_foldlM_nonempty", "SetM.run_bind_nonempty", "FloatingPoint.RoundingModel.run_round_nonempty", "FloatingPoint.RoundingModel.IsTotal"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.1'

[[node]]
id = "algorithm_4_2_1_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.2.1: for symmetric positive definite `A`,
`F − Matrix.strictUpper F = Matrix.cholesky A` with `F = Id.run (algorithm_4_2_1 pure A)`. The exact
