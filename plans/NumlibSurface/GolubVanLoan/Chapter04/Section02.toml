[[node]]
id = "algorithm_4_2_2"
kind = "definition"
desc = '''Algorithm 4.2.2 (outer product `L D Lᵀ` with pivoting), D4: state `(A, piv) : Matrix (Fin n) (Fin n) ℝ ×
(Fin n → Fin n)`; `List.foldlM` over `k`: `j :=` the first index `≥ k` maximizing `A i i` (exact
comparison of computed values), `piv k := j`, `A ← A.submatrix (Equiv.swap k j) (Equiv.swap k j)`
(rows and columns interchanged), `α := A k k`, `v i := A i k` (`i > k`), `A i k ← rnd (v i / α)` and
`A i l ← rnd (A i l − rnd (rnd (v i * v l) / α))` for `i, l > k` (the update `− v vᵀ/α` in the book's
order). No guard on `α = 0` (for a semidefinite input the trailing block then vanishes and Lean's
`x / 0 = 0` is the right value). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.2'

[[node]]
id = "algorithm_4_2_2_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.2.2: for symmetric positive semidefinite `A`, with
`(F, piv) = Id.run (algorithm_4_2_2 pure A)`, `σ := GolubVanLoan.Chapter03.pivPerm piv` (the product
of the interchanges in the order applied), `L := Chapter03.packedL F`, `d := F.diag`:
`Matrix.IsLDM (A.submatrix σ σ) L (diagonal d) L`, `0 ≤ d i`, `i ≤ j → d j ≤ d i`, and if `A` is
positive definite then `0 < d i`. (The book writes `P = P₁ ⋯ P_n` and `d_n > 0` for a semidefinite
input; the permutation is the product in the order applied and `d_n = 0` when `A` is singular —
ch04 report, Doubts.) Invariant: after `k` steps `A.submatrix σ_k σ_k = L_k diag(D_k, A_k) L_kᵀ`
((4.2.16)) with `A_k` positive semidefinite and its diagonal dominated by the previous one
(`Matrix.PosSemidef.schurComplementSingle`). ★★★ (~250 lines)'''
deps = ["algorithm_4_2_2", "equation_4_2_16", "GolubVanLoan.Chapter03.pivPerm", "GolubVanLoan.Chapter03.packedL"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.2'

