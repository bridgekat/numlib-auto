[[node]]
id = "equation_4_2_17_algorithm"
kind = "theorem"
desc = '''(4.2.17) for the output of Algorithm 4.2.2 (split from `equation_4_2_17` by agent s04): for a
symmetric positive semidefinite `A` of rank `r`, the exact run of `algorithm_4_2_2` returns `d_i > 0`
for `i < r`, `d_i = 0` and a vanishing trailing block for `i ≥ r`, so its `P`, `L(:, 1:r)` and `D_r`
realize (4.2.17). From `algorithm_4_2_2_spec` and `equation_4_2_16` (the book's argument: a zero pivot
means a zero diagonal of `A_k`, hence `A_k = 0` by (4.2.15)). ★★

Blocked: waits on `algorithm_4_2_2_spec` and `equation_4_2_16` (open).'''
