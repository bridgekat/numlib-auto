[[node]]
id = "algorithm_4_2_4"
kind = "definition"
desc = '''Algorithm 4.2.4 (nonrecursive block Cholesky), D4: for `n = N * r` (the book's `n = N r`; the input is
`Matrix (Fin (N * r)) (Fin (N * r)) ℝ`, blocks through `finProdFinEquiv`), `List.foldlM` over block
columns `j : Fin N`, inner `List.foldlM` over `i : Fin N` with `j ≤ i`: `S ←` entrywise running
differences `rnd (A_ij p q − rnd (G_ik p s * G_jk q s))` over `k < j` and `s`; if `i = j`,
`G_jj ←` the lower part `F − strictUpper F` of `algorithm_4_2_1 rnd S`, else `G_ij` row by row by
`Chapter03.algorithm_3_1_3 rnd G_jj`; `A_ij ← G_ij` (overwriting the lower block triangle). ★

Blocked: the program calls chapter 3's surface (agent s03, not on this branch's base) `GolubVanLoan.Chapter03.algorithm_3_1_3`
for the multiple-right-hand-side triangular solve (convention 5: a step delegated to an earlier chapter
calls that chapter's program). The block equations it implements are proved (`equation_4_2_18`,
`equation_4_2_19`).'''
deps = ["algorithm_4_2_1", "GolubVanLoan.Chapter03.algorithm_3_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.2.4'

[[node]]
id = "algorithm_4_2_4_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.2.4: for symmetric positive definite `A` with `n = N r`, the lower
triangle of `Id.run (algorithm_4_2_4 pure N r A)` is `Matrix.cholesky A`. Induction over the block
columns with `equation_4_2_19` as the invariant (block columns `< j` equal those of `G`),
`algorithm_4_2_1_spec`, `Chapter03.algorithm_3_1_3_spec`. The book's remark that the algorithm "can
be easily modified" for `r ∤ n` is not formalized. ★★★ (~200 lines)

