[[node]]
id = "equation_4_2_16"
kind = "theorem"
desc = '''(4.2.16): after `k` steps of the pivoted outer-product `L D Lᵀ` on a symmetric positive semidefinite
`A`, `P̃ A P̃ᵀ = [L₁₁ 0; L₂₁ I] [D_k 0; 0 A_k] [L₁₁ 0; L₂₁ I]ᵀ` with `d₁ ≥ … ≥ d_k ≥ 0`, `A_k`
positive semidefinite, and `A_k = 0` as soon as `d_k = 0` (by (4.2.15), since the pivot is the
largest diagonal entry). Stated about the state of `algorithm_4_2_2` at `Id` after `k` iterations
(the loop invariant of `algorithm_4_2_2_spec`), with the one-step fact
`Matrix.PosSemidef.schurComplementSingle`. ★★

Blocked (not attempted in this round, effort): the invariant of the
exact run of `algorithm_4_2_2` after `k` steps, ~150 lines of state bookkeeping through the swaps
(`Matrix.PosSemidef.schurComplementSingle` for the trailing block). The rank-revealing factorization
itself is proved from the backbone (`equation_4_2_17`).'''
deps = ["algorithm_4_2_2", "Matrix.PosSemidef.schurComplementSingle", "theorem_4_2_8_d"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.2.16)'

