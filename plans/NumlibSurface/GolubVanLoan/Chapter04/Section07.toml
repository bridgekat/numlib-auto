namespace = "GolubVanLoan.Chapter04"
desc = '''
§4.7, classical methods for Toeplitz systems: persymmetry (§4.7.1), Durbin's algorithm for the
Yule–Walker equations ((4.7.1), Algorithm 4.7.1), Levinson's algorithm ((4.7.2)–(4.7.3), Algorithm
4.7.2), Trench's algorithm for the inverse ((4.7.4)–(4.7.5), Algorithm 4.7.3), Cybenko's bounds
((4.7.6)–(4.7.7)), the Cybenko–Van Loan minimum-eigenvalue method (§4.7.7) and the unsymmetric
bordering ((4.7.12)–(4.7.13)). Backbone: `LinearAlgebra/Matrix/Toeplitz`, `Direct/Levinson`,
`Nonlinear/ScalarNewton`, and `Eigen/DivideConquer` for the bordered secular function of §4.7.7
(`Matrix.borderedSecularFunction` and its lemmas, beside `Matrix.secularFunction`; moved there from
`Direct/Levinson` at the review, statements unchanged).

Conventions: `T_k = Matrix.symmToeplitz k r` with `r : ℕ → ℝ`, `r 0 = 1` (the book normalizes the
diagonal); "`T_n` positive definite" is `(symmToeplitz n r).PosDef`. The book's `y^{(k)}`, `β_k`, `α_k`
of (4.7.1) are `Durbin.sol r k`, `Durbin.beta r k`, `Durbin.alpha r k` (0-based, recurrence started at
the empty solution); in §4.7.6 the book reuses `α_j` for `y^{(j)}_j = Durbin.alpha r (j − 1)`. The
exchange matrix is `Matrix.exchange`. The error approximations of §4.7.6 (`≈`), the `O(log n)`
iteration count and lookahead are not formalized (chapter group).
'''

