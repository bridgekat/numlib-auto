[[node]]
id = "equation_4_7_11"
kind = "theorem"
desc = '''(4.7.11), the bisection for a starting value: let `m(λ)` (surface definition `bisectionIndex T λ`, part of
this node) be the least `k < n` with `β_k ≤ 0` for Durbin's recurrence on `T_λ = (T − λI)/(1 − λ)`, and
`n` if there is none. For `λ < 1`: `m(λ) ≥ n − 1 ↔ B − λI` is positive definite, and
`m(λ) = n − 1 ↔ λ_min(T) ≤ λ < λ_min(B)` — "if `m(λ⁽⁰⁾) = n − 1` then `B − λ⁽⁰⁾I` is positive definite
and `T − λ⁽⁰⁾I` is not, thereby establishing (4.7.9)"; `m` is antitone in `λ`, so the loop keeps
`m(R) ≤ n − 1 ≤ m(L)` with `L = 0`, `R = 1 − |r₁|` initially (`lambdaMin_bracket`). The book prints the
invariant as `m(L) ≤ n − 1 ≤ m(R)`, the reverse of what its update rule (`m(μ) < n − 1 ⇒ R = μ`)
maintains (ch04 report, Doubts). From `durbin_beta_pos_iff` (definiteness of the leading blocks of
`T_λ` read off the `β_k`), the leading `(n−1)` block of `T` being `B`
(`Matrix.leadingPrincipal_symmToeplitz`), and eigenvalue monotonicity of `T − λI` in `λ`. ★★'''
deps = ["durbin_beta_pos_iff", "Matrix.leadingPrincipal_symmToeplitz"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.7.11)'

