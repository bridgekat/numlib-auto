[[node]]
id = "durbin_step"
kind = "theorem"
desc = '''§4.7.3, the Yule–Walker bordering: if `T_k y = −(r_1, …, r_k)` and `1 + rᵀy ≠ 0`, then with
`α = −(r_{k+1} + rᵀℰ_k y)/(1 + rᵀy)` and `z = y + α ℰ_k y`, the vector `[z; α]` solves the
`(k+1)`st order Yule–Walker system `T_{k+1} [z; α] = −(r_1, …, r_{k+1})`; `Durbin.bordered_solve`. ★'''
deps = ["Durbin.bordered_solve"]
source = 'Golub–Van Loan, Matrix Computations, §4.7.3, Display'

[[node]]
id = "durbin_denominator_pos"
kind = "theorem"
desc = '''§4.7.3: "the denominator is positive because `T_{k+1}` is positive definite and because
`[I ℰ_k y; 0 1]ᵀ T_{k+1} [I ℰ_k y; 0 1] = diag(T_k, 1 + rᵀy)`": the congruence identity (from
`T_k y = −r`) and `0 < 1 + rᵀy` for `T_{k+1}` positive definite; `Durbin.det_symmToeplitz_succ`,
`Durbin.beta_pos`. ★'''
deps = ["Durbin.det_symmToeplitz_succ", "Durbin.beta_pos"]
source = 'Golub–Van Loan, Matrix Computations, §4.7.3, Display'

[[node]]
id = "equation_4_7_1"
kind = "theorem"
desc = '''(4.7.1): if `T_n` is positive definite (`r 0 = 1`), Durbin's recurrence produces the solutions of the
Yule–Walker systems of every order: `T_k y^{(k)} = −r^{(k)}` for `k = 1 … n`, with `y^{(k)} =
Durbin.sol r k`, `β_k = Durbin.beta r k > 0`; `Durbin.symmToeplitz_mulVec_sol`, `Durbin.beta_pos`. ★'''
deps = ["Durbin.symmToeplitz_mulVec_sol", "Durbin.beta_pos"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.7.1)'

[[node]]
id = "durbin_beta_succ"
kind = "theorem"
desc = '''§4.7.3, the derivation before Algorithm 4.7.1: `β_k = (1 − α_{k−1}²) β_{k−1}`; `Durbin.beta_succ`. ★'''
deps = ["Durbin.beta_succ"]
source = 'Golub–Van Loan, Matrix Computations, §4.7.3, Display'

[[node]]
id = "algorithm_4_7_1"
kind = "definition"
desc = '''Algorithm 4.7.1 (Durbin), D4, the program of `notes/gvl/ch04/proto/Shapes.lean` §3 (elaborates):
`algorithm_4_7_1 (rnd) (n : ℕ) (r : ℕ → ℝ) : M (Fin n → ℝ)` with state `(y, α, β) : (Fin n → ℝ) × ℝ ×
ℝ`, `y` holding `y(1:k)` in its first `k` entries; start `y 0 = −r 1`, `β = 1`, `α = −r 1`; for
`k = 1 … n−1` (a `List.range (n − 1)` fold): `β ← rnd (rnd (1 − rnd (α * α)) * β)`, `α ← rnd (−s / β)` with
`s` the running sum from `r (k+1)` of `rnd (r (k + 1 − j) * y j)`, `j < k` (the book's
`r(k:−1:1)ᵀ y(1:k)`), `z i ← rnd (y i + rnd (α * y (k − 1 − i)))` for `i < k`, `y ← [z; α]`. Every flop is rounded
(convention 1), so the `β` update is `β ← rnd (rnd (1 − rnd (α * α)) * β)` — three roundings; the
formula written first in this description is shorthand for it (algo review L5: the first plan said
both that `1 − fl(α²)` is and is not rounded). The prototype shows the shape. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.1'

[[node]]
id = "algorithm_4_7_1_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.7.1: if `T_n` is positive definite with `r 0 = 1`, then
`symmToeplitz n r *ᵥ Id.run (algorithm_4_7_1 pure n r) = −(fun i => r (i + 1))`. By induction, the exact state after
the `k`-th pass (book index `k = 1 … n−1`) is `(Durbin.sol r (k+1), Durbin.alpha r k, Durbin.beta r k)`,
with `Durbin.beta_succ` identifying the algorithm's update `β ← (1 − α²) β` (`β_{k−1} ≠ 0` from
`Durbin.beta_pos`); then `equation_4_7_1`. ★★ (~120 lines)'''
deps = ["algorithm_4_7_1", "Durbin.sol", "Durbin.beta_succ", "Durbin.beta_pos", "equation_4_7_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.1'

[[node]]
id = "equation_4_7_3"
kind = "theorem"
desc = '''(4.7.2)→(4.7.3): if `T_k x = b` (4.7.2) and `T_k y = −r`, then `(4.7.3)` is solved by
`v = x + μ ℰ_k y`, `μ = (b_{k+1} − rᵀℰ_k x)/(1 + rᵀy)` ("we can effect the transition from (4.7.2) to
(4.7.3) in `O(k)` flops"); `Levinson.bordered_solve`. ★'''
deps = ["Levinson.bordered_solve"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.7.3)'

[[node]]
id = "algorithm_4_7_2"
kind = "definition"
desc = '''Algorithm 4.7.2 (Levinson), D4: state `(x, y, α, β)`; start `y 0 = −r 1`, `x 0 = b 0`, `β = 1`, `α = −r 1`;
for `k = 1 … n−1`: `β ← rnd ((rnd (1 − rnd (α * α))) * β)`, `μ ← rnd ((b k − s) / β)` with `s` the
rounded running sum of `rnd (r (j+1) * x (k − 1 − j))`, `j < k` (so `rnd (b k − s)` first), `v i ←
rnd (x i + rnd (μ * y (k − 1 − i)))`, `x ← [v; μ]`; and if `k < n − 1`: `α ← rnd (−t'/β)`
with `t'` the rounded running sum from `r (k+1)` of `rnd (r (j+1) * y (k − 1 − j))` (the addition of
`r (k+1)` is rounded too — convention 1; the negation is exact), `z i ← rnd (y i + rnd (α * y (k − 1 −
i)))`, `y ← [z; α]`. Same state encoding as `algorithm_4_7_1`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.2'

[[node]]
id = "algorithm_4_7_2_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.7.2: if `T_n` is positive definite with `r 0 = 1`, then
`symmToeplitz n r *ᵥ Id.run (algorithm_4_7_2 pure n r b) = b`. The exact state after pass `k` is
`(Levinson.sol r b (k+1), Durbin.sol r (k+1), Durbin.alpha r k, Durbin.beta r k)`;
`Levinson.symmToeplitz_mulVec_sol`. ★★'''
deps = ["algorithm_4_7_2", "Levinson.sol", "Levinson.symmToeplitz_mulVec_sol", "algorithm_4_7_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.2'

[[node]]
id = "equation_4_7_4"
kind = "theorem"
desc = '''(4.7.4) and the formulas after it: for positive definite `T_n` (`r 0 = 1`), writing
`T_n⁻¹ = [B v; vᵀ γ]` and `y` the solution of the order-`(n−1)` Yule–Walker system:
`γ = 1/(1 + rᵀy)`, `v = γ ℰ y`, `B = T_{n−1}⁻¹ + v vᵀ/γ`; `Trench.inv_symmToeplitz_last`,
`Trench.inv_symmToeplitz_eq`. ★'''
deps = ["Trench.inv_symmToeplitz_last", "Trench.inv_symmToeplitz_eq"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.7.4)'

[[node]]
id = "equation_4_7_5"
kind = "theorem"
desc = '''(4.7.5): `b_ij = b_{n−j, n−i} + (v_i v_j − v_{n−j} v_{n−i})/γ` (1-based, `B` of size `n − 1`);
`Trench.inv_symmToeplitz_apply_succ`. ★'''
deps = ["Trench.inv_symmToeplitz_apply_succ"]
source = 'Golub–Van Loan, Matrix Computations, Equation (4.7.5)'

[[node]]
id = "algorithm_4_7_3"
kind = "definition"
desc = '''Algorithm 4.7.3 (Trench), D4: `y ← algorithm_4_7_1 rnd (n − 1) r`; `γ ← rnd (1 / rnd (1 + s))` with `s` the
running sum of `rnd (r (j+1) * y j)`; `v i ← rnd (γ * y (n − 2 − i))`; `B 0 0 := γ`,
`B 0 j := v (n − 1 − j)` for `j ≥ 1`; for `i = 1 … ⌊(n−1)/2⌋`, `j = i … n − 1 − i`:
`B i j ← rnd (B (i−1) (j−1) + rnd (rnd (rnd (v (n − 1 − j) * v (n − 1 − i)) − rnd (v (i−1) * v (j−1))) / γ))`
(0-based from the book's `B(i,j) = B(i−1,j−1) + (v(n+1−j) v(n+1−i) − v(i−1) v(j−1))/γ`). Entries
outside the "upper wedge" are left `0`. ★'''
deps = ["algorithm_4_7_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.3'

[[node]]
id = "algorithm_4_7_3_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 4.7.3: for positive definite `T_n` (`r 0 = 1`, `n ≥ 1`), the computed
`B := Id.run (algorithm_4_7_3 pure n r)` agrees with `T_n⁻¹` on the wedge: `B i j = (symmToeplitz n
r)⁻¹ i j` whenever `i ≤ j` and `i + j ≤ n − 1` (0-based form of the book's `i ≤ j`, `i + j ≤ n + 1`);
the other entries follow by symmetry and persymmetry (`isPersymmetric_inv_of_isToeplitz`). Induction
along the diagonals with `equation_4_7_5` and `equation_4_7_4` (the first row), after
`algorithm_4_7_1_spec` for `y`. ★★ (~150 lines, index bookkeeping)'''
deps = ["algorithm_4_7_3", "algorithm_4_7_1_spec", "equation_4_7_4", "equation_4_7_5", "isPersymmetric_inv_of_isToeplitz"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 4.7.3'

[[node]]
