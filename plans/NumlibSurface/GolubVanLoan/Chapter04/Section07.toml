[[node]]
id = "equation_4_7_6_lower"
kind = "theorem"
desc = '''(4.7.6), left-hand side: for positive definite `T_n`, with `α_j` (`j = 1 … n−1`) Cybenko's reflection
coefficients, `max{1/∏(1 − α_j²), 1/∏(1 − α_j)} ≤ ‖T_n⁻¹‖₁` — stronger than the printed bound, which
carries an extra factor `1/(n − 1)` in both terms (ch04 report, Doubts);
`Durbin.inv_beta_le_lpOpNorm_one_inv`. **Index shift**: Cybenko's `α_j = y^{(j)}_j` (the last entry of the
`j`-th Durbin solution, `j = 1 … n`) is the backbone's `Durbin.alpha r (j − 1)` — the book reuses the
letter `α` of Algorithm 4.7.1 (whose `α_k`, `k = 0 … n−1`, is `Durbin.alpha r k`) with this shift of
index (`Numlib/Direct/Levinson`'s description); the products run over `Durbin.alpha r k`,
`k = 0 … n − 2`. ★'''
deps = ["Durbin.inv_beta_le_lpOpNorm_one_inv"]
