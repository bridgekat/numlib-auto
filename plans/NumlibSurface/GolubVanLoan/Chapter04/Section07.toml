[[node]]
id = "equation_4_7_6_upper"
kind = "theorem"
desc = '''(4.7.6), right-hand side: for positive definite `T_n`, `‖T_n⁻¹‖₁ ≤ ∏_{j=1}^{n−1} (1 + |α_j|)/(1 − |α_j|)`
with Cybenko's `α_j = Durbin.alpha r (j − 1)` (the index shift of `equation_4_7_6_lower`: the product
runs over `Durbin.alpha r k`, `k = 0 … n − 2`); `Durbin.lpOpNorm_one_inv_le` (★★★ in the backbone;
quoted from Cybenko without proof). ★'''
deps = ["Durbin.lpOpNorm_one_inv_le"]
