[[node]]
id = "equation_11_5_11"
kind = "theorem"
desc = '''
(11.5.11) and the factorization after it: for the 5×5 block matrix of the nonoverlapping decomposition
(interior blocks `A₁, A₂, A₃` nonsingular, interface blocks `Q₄, Q₅`, couplings `B, C, D, E, F, G, H, K`
as printed), `A = L U` with `L` unit block lower triangular (`FA₁⁻¹, HA₂⁻¹, GA₁⁻¹, KA₃⁻¹` below the
diagonal) and `U` block upper with the Schur complements `S₄ = Q₄ − FA₁⁻¹B − HA₂⁻¹D`,
`S₅ = Q₅ − GA₁⁻¹C − KA₃⁻¹E` on the diagonal. Block multiplication, assembled with `Matrix.fromBlocks`
twice (interior ⊕ interface) and the backbone's `DomainDecomposition.fromBlocks_eq_blockLower_mul`
for the 2×2 interior/interface form. The printed right-hand-side vectors are garbled (Doubts). ★★
(~60 lines, mostly block bookkeeping)
'''
deps = ["DomainDecomposition.fromBlocks_eq_blockLower_mul"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.5.11)'

[[node]]
id = "ddPreconditioner_rank_le"
kind = "theorem"
desc = '''
§11.5.11, "a consequence of (b) is that `A − M` has low rank": with `M = L U_M`, `U_M` equal to `U`
except `S̃₄, S̃₅` in place of `S₄, S₅`, `A − M = L (U − U_M)` has rank at most `rank(S₄ − S̃₄) + rank(S₅ − S̃₅)
≤` the number of interface unknowns. `Matrix.rank_mul_le_right` and the block-diagonal support of
`U − U_M`. The conclusion "this translates into rapid convergence" is Corollary 11.3.2-type
reasoning and is not a statement. ★
'''
deps = ["equation_11_5_11"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.11'

[[node]]
id = "schwarz_update_affine"
kind = "theorem"
desc = '''
§11.5.11: "for either the multiplicative or additive approach, it is possible to relate `u^(new)` to
`u^(old)` via `u^(new) = u^(old) + M⁻¹(f − Au^(old))`": for SPD `A` and subspaces `V_1, …, V_s`
(exact subdomain solves = `A`-orthogonal projections), the multiplicative and additive Schwarz sweeps
satisfy `u_new = u_old + B (f − A u_old)` for a fixed linear `B` (the book's `M⁻¹`, not nec. invertible),
namely `B = (I − E)A⁻¹` with `E` the error propagation operator. From
`Schwarz.error_multiplicativeStep_eq_errorOp`, `Schwarz.error_additiveStep_eq` on
`Projection.multiplicativeStep`/`Projection.additiveStep`. The book's block example with seven unknown
groups is an instance and is not separately formalized. ★★ (~40 lines)
'''
deps = ["Schwarz.error_multiplicativeStep_eq_errorOp", "Schwarz.error_additiveStep_eq", "Schwarz.errorOp",
  "Projection.multiplicativeStep", "Projection.additiveStep"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.11'
