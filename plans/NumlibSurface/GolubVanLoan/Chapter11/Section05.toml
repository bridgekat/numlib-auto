[[node]]
id = "ssorPreconditioner_posDef"
kind = "theorem"
desc = '''
§11.5.3: for symmetric `A = D − L − Lᵀ` with positive diagonal `D` (here `L = −strictLower A`, the
Saad sign convention of this subsection, unlike §11.2) and any real `ω`, `M = (D − ωL) D⁻¹ (D − ωL)ᵀ`
is symmetric positive definite, hence usable with PCG. `D − ωL` is lower triangular with positive
diagonal (nonsingular) and `M = X D⁻¹ Xᵀ`, `D⁻¹ ≻ 0`. It is `ω(2−ω)` times the SSOR splitting's `M`
(`Matrix.ssorSplitting`) for `0 < ω < 2`. ★
'''
