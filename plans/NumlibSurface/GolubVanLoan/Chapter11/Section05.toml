[[node]]
id = "incChol"
kind = "definition"
desc = '''
The recursive `incChol(A, Z, n)` of §11.5.8, D4 program by recursion on `n`
(`Matrix (Fin (n+1)) (Fin (n+1)) ℝ`, the trailing block `A.submatrix Fin.succ Fin.succ`): `n = 1`:
`H = √A` (one `√`, one `rnd`); else `α = A₁₁`, `v = A(2:n, 1)`, `B = A(2:n, 2:n)`,
`w = (v/√α) .* Z(2:n, 1)`, `A₁ = (B − wwᵀ) .* Z(2:n, 2:n)`, `H₁ = incChol(A₁, Z(2:n,2:n), n−1)`,
`H = [√α 0; w H₁]` (`Matrix.fromBlocks` reindexed by `Fin.cons`). ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'

[[node]]
id = "incChol_spec"
kind = "theorem"
desc = '''
§11.5.8, "if the algorithm runs to completion then (11.5.6)–(11.5.8) are satisfied" and "this is the
case if `A` is a Stieltjes matrix": for `A.IsStieltjes` and a symmetric 0–1 matrix `Z` with unit
diagonal, every pivot `α` met by the exact run is positive (no breakdown), and `H :=
Id.run (incChol pure A Z)` satisfies `Matrix.IsIC P A H` with positive diagonal, where
`P = {(i,j) : Z i j = 0}`; if moreover `P` avoids the nonzeros of `A`, `IsIncompleteCholesky`. With `Z`
all ones, `H` is the Cholesky factor ("recursive Cholesky"). Proof: induction on `n`; the Stieltjes
invariant passes to `A₁` by Theorem 11.5.2 (dropping entries of `v`) and then by
`Matrix.IsStieltjes.of_entrywiseLE` (dropping the off-diagonal entries of `B − wwᵀ`, which are
`≤ 0`, moves the matrix up entrywise — a step the book's proof omits: Theorem 11.5.2 alone does not
cover the `.* Z(2:n,2:n)` of `A₁`; Doubts); the factorization identity is (11.5.9) off the pattern.
[the book's P11.5.4]. ★★★ (~120 lines)
'''
deps = ["incChol", "theorem_11_5_2", "Matrix.IsStieltjes.of_entrywiseLE", "equation_11_5_9", "Matrix.IsIC",
  "IsIncompleteCholesky", "isIncompleteCholesky_iff_isIC"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'

