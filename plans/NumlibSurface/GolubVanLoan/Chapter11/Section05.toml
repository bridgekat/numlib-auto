[[node]]
id = "linMoreIC_nnz_le"
kind = "theorem"
desc = '''
§11.5.8: the number of nonzeros of the Lin–Moré factor is at most `p·n + N₁ + ⋯ + N_n`. Holds for
every run (any rounding), since column `j` keeps at most `N_j + p` entries: stated for `SetM` runs
(`∀ H ∈ (linMoreIC fp.round A p).run, …`), a counting argument per column. ★
'''
deps = ["linMoreIC"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'
wrong = '''
False as printed: the selection keeps `N_j + p` entries of `v(j+1:n)` besides the diagonal `H(j,j)`
when `v(j)` is not among the `N_j + p` largest of `|v(j:n)|`. For `A = [1 .9 .9; .9 1 0; .9 0 10]`,
`p = 0`: `N = (3, 1, 1)`, column 2 has `v(2:3) = (.19, −.81)` and keeps `H(3,2)` besides `H(2,2)`,
so `nnz(H) = 6 > 5` (exact arithmetic; all pivots positive). Corrected node: `linMoreIC_nnz_le_add`,
bound `p·n + N₁ + ⋯ + N_n + n`.
'''

[[node]]
id = "linMoreIC_nnz_le_add"
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'

