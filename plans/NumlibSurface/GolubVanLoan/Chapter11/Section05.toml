[[node]]
id = "linMoreIC"
kind = "definition"
desc = '''
The Lin–Moré incomplete Cholesky of §11.5.8, D4 program: for `j = 1:n`,
`v(j:n) = A(j:n, j) − H(j:n, 1:j−1)H(j, 1:j−1)ᵀ`, `H(j,j) = √v(j)`, `N_j = nnz(A(j:n, j))`, keep only
the `N_j + p` largest entries of `|v(j:n)|` (ties by index; a selection on computed values),
`H(j+1:n, j) = v(j+1:n)/H(j,j)`. ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'

[[node]]
id = "linMoreIC_nnz_le"
kind = "theorem"
desc = '''
§11.5.8: the number of nonzeros of the Lin–Moré factor is at most `p·n + N₁ + ⋯ + N_n`. Holds for
every run (any rounding), since column `j` keeps at most `N_j + p` entries: stated for `SetM` runs
(`∀ H ∈ (linMoreIC fp.round A p).run, …`), a counting argument per column. ★
'''
