§11.5.1: for nonsingular `M₁, M₂`, `Ã = M₁⁻¹AM₂⁻¹`, `b̃ = M₁⁻¹b`: `Ã x̃ = b̃ ↔ A (M₂⁻¹ x̃) = b`
(solve the tilde problem, then `M₂ x = x̃`). Algebra with `Matrix.nonsing_inv_mul`. ★
'''
