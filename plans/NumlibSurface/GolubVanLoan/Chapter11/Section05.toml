source = 'Golub–Van Loan, Matrix Computations, §11.5.1'

[[node]]
id = "equation_11_5_1"
kind = "theorem"
desc = '''
(11.5.1) and the derivation of PCG: for SPD `A`, `M`, `C = M^{1/2}` (the SPD square root, Mathlib's
`CFC.sqrt M`), `Ã = C⁻¹AC⁻¹`, `b̃ = C⁻¹b`: the CG iterates of the tilde system from `x̃₀ = C x₀`,
transported back by `x = C⁻¹x̃`, `r = C r̃`, `p = C⁻¹p̃`, are the PCG iterates:
`C⁻¹ (CG.iterate Ã b̃ x̃₀ k).x = (Krylov.PCG.iterate A M⁻¹ b x₀ k).x` (and likewise for `r`, `p`).
Induction on `k` using `r̃ᵀr̃ = rᵀM⁻¹r` and `p̃ᵀÃp̃ = pᵀAp`. The printed (11.5.1) mixes the gradient
and residual sign conventions (`x̃₊ = x̃_c − μp̃_c`, `r̃₊ = r̃_c + μÃp̃_c`) and has `p̃₊ = r̃_c + τp̃_c` for
`r̃₊ + τp̃_c` (Doubts); the statement is the consistent one. The backbone's own route
(`Krylov.PCG.iterate_eq_CG_iterate_withEnergy`, CG for `M⁻¹A` in the `M`-inner product) is the
alternative the formalizer may prefer. ★★ (~80 lines)
'''
deps = ["Krylov.PCG.iterate", "CG.iterate", "Krylov.PCG.iterate_eq_CG_iterate_withEnergy"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.5.1)'

[[node]]
id = "algorithm_11_5_1"
kind = "definition"
desc = '''
Algorithm 11.5.1 (PCG), D4 program with fuel and a preconditioner routine
`solveM : (Fin n → ℝ) → M (Fin n → ℝ)` (exact semantics `M⁻¹`; the box "Solve `Mz = r`"): `r₀ = b − Ax₀`,
`z₀ = solveM r₀`; while `‖r_k‖₂ > 0`: `p₁ = z₀` or `τ = r_{k−1}ᵀz_{k−1}/r_{k−2}ᵀz_{k−2}`,
`p_k = z_{k−1} + τp_{k−1}`; `μ = r_{k−1}ᵀz_{k−1}/p_kᵀAp_k`, `x_k = x_{k−1} + μp_k`,
`r_k = r_{k−1} − μAp_k`, `z_k = solveM r_k`. The printed `x_k = x_{k−1} − μp_k` contradicts
`r_k = r_{k−1} − μAp_k` (with `r = b − Ax`); the program uses `+` (Doubts). ★
'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1", "GolubVanLoan.Chapter01.algorithm_1_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.5.1'

[[node]]
id = "algorithm_11_5_1_spec"
kind = "theorem"
desc = '''
Exact semantics for SPD `A`, `M` and `solveM = M⁻¹`: after `k` steps the state is
`Krylov.PCG.iterate (toEuclideanLin A) (toEuclideanLin M⁻¹) b x₀ k` (book's `p_k` = backbone's
`p_{k−1}`), hence (`Krylov.PCG.isGalerkinIterate`) `x_k` minimizes `‖x − x*‖_A` over
`x₀ + 𝒦(M⁻¹A, M⁻¹r₀, k)`; the loop stops (`r = 0`) after at most `grade (M⁻¹A) (M⁻¹r₀)` steps with
`Ax = b`. ★★ (~80 lines, the Algorithm 11.3.3 invariant plus the `z` component)
'''
deps = ["algorithm_11_5_1", "Krylov.PCG.iterate", "Krylov.PCG.isGalerkinIterate", "Krylov.IsPreconditioner",
  "algorithm_11_3_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.5.1'

