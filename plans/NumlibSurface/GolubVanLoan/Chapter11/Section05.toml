[[node]]
id = "equation_11_5_11"
kind = "theorem"
desc = '''
(11.5.11) and the factorization after it: for the 5×5 block matrix of the nonoverlapping decomposition
(interior blocks `A₁, A₂, A₃` nonsingular, interface blocks `Q₄, Q₅`, couplings `B, C, D, E, F, G, H, K`
as printed), `A = L U` with `L` unit block lower triangular (`FA₁⁻¹, HA₂⁻¹, GA₁⁻¹, KA₃⁻¹` below the
diagonal) and `U` block upper with the Schur complements `S₄ = Q₄ − FA₁⁻¹B − HA₂⁻¹D`,
`S₅ = Q₅ − GA₁⁻¹C − KA₃⁻¹E` on the diagonal. ★★
'''
deps = ["DomainDecomposition.fromBlocks_eq_blockLower_mul"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.5.11)'
wrong = '''
False as printed: the `(4, 5)` block of `LU` is `FA₁⁻¹C` (row 4 of `L` against column 5 of `U`), while
that of `A` is `0`; both interfaces touch `Ω₁`. Formal counterexample with all blocks `1 × 1` equal
to `1`: `equation_11_5_11_counterexample`. Corrected statement `equation_11_5_11_blockLU`: the
interface block of `U` is the full Schur complement, with diagonal blocks `S₄`, `S₅` and off-diagonal
blocks `−FA₁⁻¹C`, `−GA₁⁻¹B`.
'''

