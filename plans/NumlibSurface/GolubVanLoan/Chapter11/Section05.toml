[[node]]
id = "isIncompleteCholesky_iff_isIC"
kind = "theorem"
desc = '''
If `P` is contained in the zero pattern of `A` (`∀ (i,j) ∈ P, a_ij = 0`) and symmetric, then
`IsIncompleteCholesky P A H ↔ Matrix.IsIC (P ∪ Pᵀ) A H` for lower triangular `H`. Unfolding;
`Matrix.IsIC.sub_eq_zero_of_notMem`. ★
'''
deps = ["IsIncompleteCholesky", "Matrix.IsIC"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'
wrong = '''
The `→` direction is false: (11.5.7) constrains `HHᵀ` only at the nonzeros of `A`, while `IsIC`
also asks `(HHᵀ)_ij = 0` at the zeros of `A` outside `P`. With `P = ∅`, `A = I₂`,
`H = [1 0; 1/2 √3/2]` satisfies (11.5.6)–(11.5.8) but `(HHᵀ)₂₁ = 1/2 ≠ 0`. The true direction is the
node `isIncompleteCholesky_of_isIC` (which is all `incChol_spec` needs).
'''

[[node]]
id = "isIncompleteCholesky_of_isIC"
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'

