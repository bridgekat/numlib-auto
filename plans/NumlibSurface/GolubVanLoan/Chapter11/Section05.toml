namespace = "GolubVanLoan.Chapter11"
desc = '''
Golub–Van Loan §11.5, *Preconditioning*: the transformed system (§11.5.1), PCG and preconditioned
GMRES (Algorithms 11.5.1–11.5.2, (11.5.1)–(11.5.2)), Jacobi/SSOR preconditioners, sparse approximate
inverses, polynomial preconditioners ((11.5.3)), PCG as an accelerated splitting ((11.5.4)–(11.5.5)),
incomplete Cholesky ((11.5.6)–(11.5.9), Lemma 11.5.1, Theorem 11.5.2), incomplete block
preconditioners ((11.5.10)), saddle-point and domain-decomposition preconditioners ((11.5.11)).

Backbone: `Numlib/Krylov/Preconditioned` (`Krylov.IsPreconditioner`, `Krylov.PCG.iterate`, "PCG is
CG in the `M`-inner product"), `Numlib/Preconditioner/{ILU,Polynomial,Chebyshev,ApproximateInverse}`,
`Numlib/LinearAlgebra/Matrix/{MMatrix,SchurComplement,Cholesky}`, `Numlib/DomainDecomposition/{Schur,
Schwarz}`. New backbone content staged by this chapter: Stieltjes matrices in `MMatrix`
(`Matrix.IsStieltjes`, Lemma 11.5.1 and Theorem 11.5.2 in backbone form, the symmetric-M-matrix
positive-definiteness they need), incomplete Cholesky existence for Stieltjes matrices in
`Preconditioner/ILU`, the PCG orthogonality relations (11.5.2) in `Krylov/Preconditioned`, and the
column decoupling of the Frobenius least-squares problem in `Preconditioner/ApproximateInverse`.

Conventions as in §11.3. The book's incomplete Cholesky factor `H` is lower triangular with
`HHᵀ ≈ A`; the backbone's `Matrix.IsIC P A H` is exactly that shape (lower `H`, zero on `P`, `HHᵀ`
agreeing with `A` off `P`). The book's pattern `P` is a set of subdiagonal pairs; the backbone's
zero pattern is a set of pairs of `n × n`, and a symmetric `P` (both `(i, j)` and `(j, i)`) is what
the recursive `incChol` uses through its 0–1 matrix `Z`.

Not formalized here (recorded in the chapter group): §11.5.4 (Toeplitz and circulant preconditioners —
T. Chan's and Strang's choices are definitions with no claim in the text), the drop-tolerance and
`ILU(ℓ)` variants (no claim), the saddle-point HSS preconditioner (effectiveness is cited), the
cost inequality of §11.5.1, and the Criteria 1–2.
'''

