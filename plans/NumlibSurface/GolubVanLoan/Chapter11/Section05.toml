[[node]]
id = "blockTridiagonal_cholesky"
kind = "theorem"
desc = '''
§11.5.9: for a block tridiagonal SPD `A` (diagonal blocks `A_k`, subdiagonal `E_k`), the recurrences
`G₁G₁ᵀ = A₁`, `F_k = E_kG_k⁻ᵀ`, `G_{k+1}G_{k+1}ᵀ = A_{k+1} − E_k(G_kG_kᵀ)⁻¹E_kᵀ` give its block Cholesky
factorization `A = G Gᵀ` with `G` block lower bidiagonal (`G_k` diagonal, `F_k` subdiagonal blocks).
Block form of Cholesky: induction on the number of blocks with the Schur complement
(`Matrix.fromBlocks_eq_mul_schurComplement`). Blocks as `Fin p → Matrix (Fin q) (Fin q) ℝ`, assembled
over `Fin p × Fin q`. ★★ (~80 lines)
'''
deps = ["Matrix.fromBlocks_eq_mul_schurComplement", "Matrix.IsCholesky"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.9'

[[node]]
id = "equation_11_5_10"
kind = "theorem"
desc = '''
(11.5.10): with the `(G_kG_kᵀ)⁻¹` of `blockTridiagonal_cholesky` replaced by symmetric tridiagonal
`Λ_k`, and `A_k` tridiagonal, `E_k` diagonal, if each `A_{k+1} − E_kΛ_kE_kᵀ` is positive definite then
it is tridiagonal and its Cholesky factor `G̃_{k+1}` is lower bidiagonal ("with this strategy each
`G̃_k` is lower bidiagonal"). Tridiagonal ⇒ bidiagonal Cholesky factor: `Matrix.IsCholesky` of a
tridiagonal matrix (fill theorem `Matrix.IsCholesky.apply_eq_zero_of_not_isCholeskyFill`: a tridiagonal
pattern has no fill). ★★ (~40 lines)
'''
deps = ["blockTridiagonal_cholesky", "Matrix.IsCholesky.apply_eq_zero_of_not_isCholeskyFill"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.5.10)'

[[node]]
id = "blockIC_forwardSolve"
kind = "theorem"
desc = '''
§11.5.9, the display after (11.5.10): the block lower bidiagonal system `[G̃₁; F̃₁ G̃₂; …] w = r` with
`F̃_k = E_kG̃_k⁻ᵀ` is solved by `G̃₁w₁ = r₁`, `G̃_{k+1}w_{k+1} = r_{k+1} − E_kG̃_k⁻ᵀw_k` (the `F̃_k` never
formed). Block forward substitution. ★
'''
deps = ["equation_11_5_10"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.9'

[[node]]
id = "saddlePoint_factorization"
kind = "theorem"
desc = '''
§11.5.10: for `A` nonsingular and `C = 0`, `[A B₁; B₂ᵀ 0] = [I 0; B₂ᵀA⁻¹ I][A 0; 0 S][I A⁻¹B₁; 0 I]`
with `S = −B₂ᵀA⁻¹B₁` (the book's `K` is first written `[A B₁ᵀ; B₂ −C]` and then transposes the
off-diagonal blocks; Doubts). The block LDU of `Numlib/LinearAlgebra/Matrix/SchurComplement`
(`Matrix.fromBlocks_eq_mul_schurComplement`) with `D = 0`. ★
'''
deps = ["Matrix.fromBlocks_eq_mul_schurComplement"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.10'

[[node]]
id = "saddlePoint_splitting"
kind = "theorem"
desc = '''
§11.5.10: with `H₁ = (A + Aᵀ)/2`, `H₂ = (A − Aᵀ)/2`, `[A B; −Bᵀ C] = [H₁ 0; 0 C] + [H₂ B; −Bᵀ 0]`, the
first summand symmetric (positive definite when `A` and `C` are, `A` in the sense `xᵀAx > 0`) and the
second skew-symmetric. `Matrix.fromBlocks_add`, `Matrix.hermitianPart`. The HSS preconditioner built
on it is not formalized (its effectiveness is cited). ★
'''
