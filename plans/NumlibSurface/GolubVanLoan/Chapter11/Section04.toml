[[node]]
id = "bicgstab"
kind = "definition"
desc = '''
The BiCGstab column of Figure 11.4.1, D4 program with fuel: `p = r = r₀`; `μ = r̃₀ᵀr_c/r̃₀ᵀAp_c`,
`s_c = r_c − μAp_c`, `ω = s_cᵀAs_c/(As_c)ᵀ(As_c)`, `x₊ = x_c + μp_c + ωs_c`, `r₊ = s_c − ωAs_c`,
`τ = (r̃₀ᵀr₊)μ/((r̃₀ᵀr_c)ω)`, `p₊ = r₊ + τ(p_c − ωAp_c)` (Saad Alg 7.7). ★
'''
