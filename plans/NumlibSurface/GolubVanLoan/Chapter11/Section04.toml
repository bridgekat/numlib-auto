[[node]]
id = "bicg_eq_cg"
kind = "theorem"
desc = '''
§11.4.5: "BiCG collapses to CG if `A` is symmetric positive definite and `r̃₀ = r₀`": then
`r̃_k = r_k`, `p̃_k = p_k` for all `k` and the `x, r, p` of `bicg` are those of Algorithm 11.3.3
(`CG.iterate`). Induction: the starred recurrence is the unstarred one when `Aᵀ = A`. ★
'''
deps = ["bicg_spec", "algorithm_11_3_3_spec", "CG.iterate"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.5'

[[node]]
id = "equation_11_4_14"
kind = "theorem"
desc = '''
(11.4.14): for the BiCG run there are polynomials `ψ_k, φ_k` of degree `≤ k` with `r_k = ψ_k(A)r₀`,
`p_k = φ_k(A)r₀`, `r̃_k = ψ_k(Aᵀ)r̃₀`, `p̃_k = φ_k(Aᵀ)r̃₀` and `ψ_k(0) = 1`. The printed `φ_k(0) = 1` is
false (`φ₁ = ψ₁ + τ₀`, `φ₁(0) = 1 + τ₀`; Doubts) and is not part of the statement. The polynomials
are defined by the recurrences `ψ_{k+1} = ψ_k − μ_k X φ_k`, `φ_{k+1} = ψ_{k+1} + τ_k φ_k`: the backbone
`BCG.residualPoly`, `BCG.directionPoly` of `Numlib/Krylov/TransposeFree` for `T = toEuclideanLin A`,
`B = toEuclideanLin Aᵀ`, and the theorem is `BCG.residual_eq_aeval` through `bicg_spec` (over `ℝ`
the conjugated polynomials are the polynomials themselves). ★
'''
deps = ["bicg_spec", "BCG.residualPoly", "BCG.directionPoly", "BCG.residual_eq_aeval"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.4.14)'

[[node]]
id = "bicg_inner_eq_poly"
kind = "theorem"
desc = '''
§11.4.5: `r̃_kᵀr_k = r̃₀ᵀ(ψ_k(A)² r₀)` and `p̃_kᵀAp_k = r̃₀ᵀ(A φ_k(A)² r₀)` — transposing a polynomial
across the inner product (`(p(Aᵀ)u)ᵀv = uᵀp(A)v`). From `equation_11_4_14`. ★
'''
deps = ["equation_11_4_14"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.5'

[[node]]
id = "cgs"
