[[node]]
id = "algorithm_11_4_2"
kind = "definition"
desc = '''
Algorithm 11.4.2 (`m`-step GMRES), D4 program: `r₀ = b − Ax₀`, `β₀ = ‖r₀‖₂`; while `β_k > 0` and
`k < m`: `q_{k+1} = r_k/β_k`, `k ← k+1`, `r_k = Aq_k`, the modified Gram–Schmidt loop (11.4.11)
`h_ik = q_iᵀr_k`, `r_k ← r_k − h_ik q_i` (`i = 1:k`, in order, `r_k` updated in place), `β_k = ‖r_k‖₂`,
`h_{k+1,k} = β_k`, apply `G₁, …, G_{k−1}` to `H(1:k, k)` and determine `G_k` by ch05's Algorithm 5.1.3,
update `p_k`, `ρ_k`; after the loop solve `R_k y_k = p_k` (back substitution, ch03's Algorithm 3.1.2)
and return `x̃ = x₀ + Q_k y_k`. (11.4.11) is a step of this program and not a separate node. ★★

Blocked: the program calls chapter 3's back substitution (`GolubVanLoan.Chapter03.algorithm_3_1_2`)
and chapter 5's `givens` (`GolubVanLoan.Chapter05.algorithm_5_1_3`) — convention 5 — and neither
surface module exists on this branch (agents s03/s05 are writing them). The mathematics it relies
on is proved here (`equation_11_4_8`–`gmres_givens_prefix`). Estimate once they land: ~60 lines.
'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter03.algorithm_3_1_2",
  "GolubVanLoan.Chapter01.algorithm_1_1_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.4.2'

[[node]]
id = "algorithm_11_4_2_spec"
kind = "theorem"
desc = '''
Exact semantics for nonsingular `A`: the run takes `k = min m (Krylov.grade T r₀)` steps; the
`q_j`, `h_ij` are the Arnoldi vectors and coefficients (`Arnoldi.vec`, `Arnoldi.coeff`: MGS and the
backbone's Gram–Schmidt agree in exact arithmetic, ch10's spec of Algorithm 10.5.1), the rotations
and `p_k, ρ_k` are the backbone's (`Krylov.givensQ`, `Krylov.gvec`, `Krylov.gamma`), and
`Krylov.IsMinResidualIterate T b x₀ k x̃`; if the loop stopped with `β_k = 0` then `A x̃ = b`
(`Krylov.IsMinResidualIterate.apply_eq_of_grade_le`). This is the book's "either `x̃` solves `Ax = b`
or minimizes `‖Ax − b‖₂` over `x₀ + 𝒦(A, r₀, m)`". ★★★ (~150 lines: MGS = Arnoldi, the Givens state,
back substitution)

Blocked: on `algorithm_11_4_2` (chapters 3 and 5's programs) and on chapter 10's
`algorithm_10_5_1_spec` (MGS = Arnoldi). The Givens/least-squares half is proved here
(`equation_11_4_10`, whose `R_k y_k = p_k` solve is exactly what the program's back substitution
computes). Estimate once the three programs exist: ~150 lines (MGS loop invariant, Givens state,
back substitution).
'''
deps = ["algorithm_11_4_2", "equation_11_4_10", "gmres_givens_prefix", "Arnoldi.vec", "Arnoldi.coeff",
  "Krylov.IsMinResidualIterate.apply_eq_of_grade_le", "GolubVanLoan.Chapter10.algorithm_10_5_1_spec",
  "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.4.2'

