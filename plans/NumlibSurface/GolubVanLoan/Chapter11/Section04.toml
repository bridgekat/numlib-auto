[[node]]
id = "symmlq_minNorm_solution"
kind = "theorem"
desc = '''
§11.4.1: for `k ≤ grade` (all `β_j > 0`), `H_{k−1}ᵀ ∈ ℝ^{(k−1)×k}` has full row rank; with the Givens
rotations of the QR of `H_{k−1}`, `H_{k−1}ᵀ G₁⋯G_{k−1} = [L_{k−1} | 0]` with `L_{k−1}` lower
triangular, nonsingular and of lower bandwidth 2; and `y_k = G₁⋯G_{k−1} [w; 0]` with
`L_{k−1} w = β₀e₁` is the minimum-norm solution of (11.4.5). Transpose of the Givens QR of the
Hessenberg `H_{k−1}` (`Krylov.givensQ_mul_hessenbergOf`; the triangular factor is nonsingular by
the Lean lemmas `Krylov.isUnit_hessenbergSqOf_rotated`), plus the minimum-norm characterization
(`y ⟂ ker H_{k−1}ᵀ`). ★★ (~80 lines)
'''
deps = ["equation_11_4_5", "Krylov.givensQ_mul_hessenbergOf", "minres_givens_update"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.1'

