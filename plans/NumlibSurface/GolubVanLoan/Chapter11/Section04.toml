The CGS column of Figure 11.4.1, D4 program with fuel: `p = r = u = r₀`; `μ = r̃₀ᵀr_c/r̃₀ᵀAp_c`,
`q_c = u_c − μAp_c`, `x₊ = x_c + μ(u_c + q_c)`, `r₊ = r_c − μA(u_c + q_c)`, `τ = r̃₀ᵀr₊/r̃₀ᵀr_c`,
