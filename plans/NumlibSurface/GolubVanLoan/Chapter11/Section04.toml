[[node]]
id = "bicg_spec"
kind = "theorem"
desc = '''
The exact run of `bicg` is the backbone's `BCG.iterate` (Saad Alg 7.3, identical recurrence, real
case with `B = Aᵀ`), hence its residuals are biorthogonal (`BCG.inner_residual_dualResidual_eq_zero`),
its directions `A`-biconjugate (`BCG.inner_dualDirection_apply_direction_eq_zero`) and its iterate is
the Petrov–Galerkin iterate of `bicg_residual_orthogonal`. ★★ (~40 lines)
'''
deps = ["bicg", "BCG.iterate", "BCG.inner_residual_dualResidual_eq_zero", "BCG.inner_dualDirection_apply_direction_eq_zero",
  "bicg_residual_orthogonal"]
