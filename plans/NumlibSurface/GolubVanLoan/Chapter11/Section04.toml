[[node]]
id = "minres_givens_update"
kind = "theorem"
desc = '''
§11.4.1: the transition `{H_{k−1}, R_{k−1}, p_{k−1}, ρ_{k−1}} → {H_k, R_k, p_k, ρ_k}` needs one new
rotation: `R_{k−1}` is the leading block of `R_k`, `p_{k−1}` the leading part of `p_k`
(`Krylov.rotated_eq_of_le`, prefix stability of the ℕ-indexed rotations), and `R_k` has upper
bandwidth 2 (the rotated tridiagonal: `R_k i j = 0` for `j > i + 2`). The bandwidth clause is new
content: induction on the rotations, each touching two adjacent rows of a matrix whose column `j`
is supported on rows `j−1, j, j+1`. The `O(1)` flop count is not formalized. ★★ (~50 lines)
'''
deps = ["Krylov.rotated_eq_of_le", "Krylov.rotated", "equation_11_4_1"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.1'

[[node]]
id = "equation_11_4_5"
kind = "theorem"
desc = '''
