[[node]]
id = "bicgstab_residual_eq"
kind = "theorem"
desc = '''
§11.4.5 (van der Vorst): the exact BiCGstab run has `r_k = (1 − ω_kA)⋯(1 − ω₁A) ψ_k(A) r₀` with `ψ_k`
the BiCG residual polynomial, provided BiCG does not break down and no `ω_j` vanishes (the two
hypotheses of the backbone `BiCGSTAB.residual_eq` of `Numlib/Krylov/TransposeFree`, to which the exact
run of `bicgstab` — the backbone `BiCGSTAB.iterate`, identical recurrence — delegates); and each
`ω_k` minimizes `‖s_k − ωAs_k‖₂` over `ω` ([the book's P11.4.2]; `Projection.minResStep`,
`Projection.norm_residual_minResStep_sq_eq`). ★★ (~60 lines)
'''
deps = ["bicgstab", "equation_11_4_14", "Projection.minResStep", "BiCGSTAB.iterate", "BiCGSTAB.residual_eq"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.5'

[[node]]
