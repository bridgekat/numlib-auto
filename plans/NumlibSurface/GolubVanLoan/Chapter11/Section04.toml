namespace = "GolubVanLoan.Chapter11"
desc = '''
Golub–Van Loan §11.4, *Other Krylov Methods*: MINRES and SYMMLQ ((11.4.1)–(11.4.5)), LSQR and LSMR
((11.4.6)–(11.4.7)), GMRES ((11.4.8)–(11.4.11), Algorithm 11.4.2), the polynomial view (§11.4.4), and
BiCG, CGS, BiCGstab, QMR ((11.4.12)–(11.4.14), Figure 11.4.1).

There is no Algorithm 11.4.1 in the source: §11.4.1 describes MINRES and SYMMLQ in prose and the
first numbered algorithm of the section is 11.4.2 (Doubts; either a numbering gap of the book or a
header lost in conversion, and nothing in the text around it reads as an algorithm).

Backbone: the specifications are `Krylov.IsMinResidualIterate` (MINRES, GMRES),
`Krylov.IsGalerkinIterate`, `Krylov.IsMinErrorIterate` in `Numlib/Krylov/Iterate`; the Lanczos,
Arnoldi and two-sided Lanczos relations and the Givens least-squares layer are
`Numlib/Krylov/{Lanczos,Arnoldi,Hessenberg,BiLanczos,QuasiMinRes,Singular}`; the normal-equation
methods `Numlib/Krylov/NormalEquations`; monotonicity `Numlib/Krylov/Monotonicity`. The
Golub–Kahan / Paige–Saunders bidiagonalization is ch10's new `Numlib/Krylov/Bidiagonalization`
(`GolubKahan.rightVec := Arnoldi.vec (Aᴴ ∘ A)`, `GolubKahan.span_leftVec`); the Paige–Saunders process
is its instance for the pair `(Aᵀ, A)` (ch10's `algorithm_10_4_2_spec`).

The transpose-free methods (CGS, BiCGstab) exist today only in the Saad surface
(`SaadSparse.Chapter07.cgs`, `bicgstab`, `cgs_residual_eq`, `bicgstab_residual_eq`, and the BiCG
polynomials `bcgResidualPoly`, `bcg_residual_eq_aeval`), in recurrences *identical* to Figure 11.4.1
(checked line by line: `μ, q, x₊, r₊, τ, u₊, p₊` of CGS are Saad Alg 7.6's `α, q, x, r, β, u, p`;
BiCGstab's are Alg 7.7's). By `notes/backbone.md` §1.2 (two sources in identical form) they belong
in the backbone, and the Golub–Van Loan consolidation planned them there: `Numlib/Krylov/TransposeFree`
(`BCG.residualPoly`, `BCG.residual_eq_aeval`, `CGS.iterate`, `CGS.residual_eq_aeval_sq`,
`BiCGSTAB.iterate`, `BiCGSTAB.residual_eq`, for an operator `A` with adjoint `B`). The Figure 11.4.1
nodes here identify the exact runs of the D4 programs with those iterations and delegate.

Conventions as in §11.3 (`T = Matrix.toEuclideanLin A`, `r₀ = b − Ax₀`, 0-based Krylov indices).
The book's `𝒦(A, b, k)` in the first line of §11.4.3 means `𝒦(A, r₀, k)` (Doubts).
'''

[[node]]
id = "energyFunctional_unbounded_of_indefinite"
kind = "theorem"
desc = '''
§11.4.1: for symmetric `A` with a negative eigenvalue (`A x = λ_min x`, `λ_min < 0`, `x ≠ 0`),
`φ(α x) → −∞` as `α → ∞`, so `φ` has no lower bound (the book's `φ(αx) = α²λ_min − αxᵀb` omits the
factor `½‖x‖²`). Quadratic in `α` with negative leading coefficient. ★
'''
deps = ["energyFunctional"]
source = 'Golub–Van Loan, Matrix Computations, §11.4.1'

