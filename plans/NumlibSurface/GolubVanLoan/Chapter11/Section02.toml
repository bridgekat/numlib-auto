[[node]]
id = "theorem_11_2_1"
kind = "theorem"
desc = '''
Theorem 11.2.1: `A = M − N` a splitting (`s : Stationary.Splitting A`) of a nonsingular
`A ∈ ℝ^{n×n}`; then `(∀ x⁽⁰⁾, Tendsto (fun k => (s.mulVecStep b)^[k] x⁽⁰⁾) atTop (𝓝 (A⁻¹ *ᵥ b))) ↔
Matrix.complexSpectralRadius s.iterationOperator < 1`. Proof: by `equation_11_2_7` convergence
for all `x⁽⁰⁾` is `G^k e → 0` for all `e`, which is `G^k → 0`
(`Matrix.tendsto_zero_iff_forall_mulVec_tendsto_zero`), which is `ρ(G) < 1`
(`Matrix.tendsto_pow_iff_complexSpectralRadius_lt_one`). The book's proof through the Schur form
and (11.2.9) is the quantitative bound `equation_11_2_9`, not needed here. ★
'''
deps = ["equation_11_2_7", "Matrix.tendsto_zero_iff_forall_mulVec_tendsto_zero",
  "Matrix.tendsto_pow_iff_complexSpectralRadius_lt_one", "Matrix.complexSpectralRadius"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 11.2.1'

[[node]]
id = "equation_11_2_9"
kind = "theorem"
desc = '''
(11.2.9): for `G ∈ ℂ^{n×n}` with Schur form `Qᴴ G Q = T = D + E` (`D` diagonal, `E` strictly upper;
`Matrix.exists_unitary_conj_upperTriangular`) and `ρ(G) < 1`:
`‖G^k‖₂ ≤ (1 + 2‖E‖_F/(1 − ρ(G)))^{n−1} ((1 + ρ(G))/2)^k`. From Lemma 7.3.2 (7.3.15) with
`μ = 2‖E‖_F/(1 − ρ)`, since `‖E‖_F/(1+μ) ≤ (1−ρ)/2`. The book writes `E = A − D` (should be
`T − D`) and `μ = 2‖E‖₂/(1−ρ)` (with `‖E‖₂` the displayed bound does not follow; `‖E‖_F` is needed):
both recorded in Doubts; the statement uses `‖E‖_F`. Norms: scoped `Matrix.Norms.L2Operator` and
`Matrix.Norms.Frobenius`. ★
'''
deps = ["GolubVanLoan.Chapter07.lemma_7_3_2", "Matrix.exists_unitary_conj_upperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.2.9)'

