source = 'Golub–Van Loan, Matrix Computations, §11.2.8'

[[node]]
id = "chebyshevSemiIterative_spec"
kind = "theorem"
desc = '''
Exact semantics (fuel large enough, `tol = 0`, `solveM = M⁻¹`): `y⁽ᵏ⁾ − x = p_k(G)(x⁽⁰⁾ − x)` with
`p_k(z) = c_k(z/β)/c_k(1/β)`, the `α = −β` case of `chebyshevSemiIterative_norm_le`'s polynomial;
in particular `y⁽⁰⁾ = x⁽⁰⁾`, `y⁽¹⁾ = x⁽¹⁾`, and the bound of `chebyshevSemiIterative_norm_le` holds.
Proof: induction with the three-term recurrence `T_{k+1} = 2X T_k − T_{k−1}`
(`Polynomial.Chebyshev.T_add_two`); `ω_{k+1} c_{k+1} = (2/β) c_k` gives the polynomial recurrence
`p_{k+1}(z) = ω_{k+1} z p_k(z) + (1 − ω_{k+1}) p_{k−1}(z)`, which is the `y` update since
`y + z − ... = G y + M⁻¹ b`. Same content as the backbone's `Preconditioner.Chebyshev` (Saad
Alg 12.1, residual `shifted` polynomial) applied to `M⁻¹A` on `[1−β, 1+β]`, but the recurrence is
written differently, so the identification is by the polynomial, not the state. ★★ (~80 lines)
'''
