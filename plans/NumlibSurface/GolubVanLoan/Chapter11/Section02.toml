[[node]]
id = "chebyshevSemiIterative"
kind = "definition"
desc = '''
The Chebyshev semi-iterative recurrence of §11.2.8 (case `α = −β`), D4 program with fuel and
tolerance: `c₀ = 1`, `c₁ = 1/β`, `y⁽⁰⁾ = x⁽⁰⁾`, `M y⁽¹⁾ = N y⁽⁰⁾ + b`, then while `‖r⁽ᵏ⁾‖₂ > tol` (the norm computed as `rnd (√(rnd (rᵀr)))` and compared exactly with `tol`;
`fuel` the last argument):
`c_{k+1} = (2/β) c_k − c_{k−1}`, `ω_{k+1} = 1 + c_{k−1}/c_{k+1}`, `M z⁽ᵏ⁾ = r⁽ᵏ⁾`,
`y⁽ᵏ⁺¹⁾ = y⁽ᵏ⁻¹⁾ + ω_{k+1}(y⁽ᵏ⁾ + z⁽ᵏ⁾ − y⁽ᵏ⁻¹⁾)`, `r⁽ᵏ⁺¹⁾ = b − A y⁽ᵏ⁺¹⁾`. The `M`-solves are a
parameter `solveM : (Fin n → ℝ) → M (Fin n → ℝ)` (a preconditioner routine; exact semantics
`M⁻¹`), everything else through `rnd`. ★
'''
