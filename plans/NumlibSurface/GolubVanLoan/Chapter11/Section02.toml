namespace = "GolubVanLoan.Chapter11"
desc = '''
Golub–Van Loan §11.2, *The Classical Iterations*: Jacobi, Gauss–Seidel and their block forms,
splittings and Theorem 11.2.1, the diagonal-dominance and positive-definiteness theorems
11.2.2–11.2.3, the Poisson model problem (11.2.10)–(11.2.17) with its ADI variant, SOR/SSOR and
Theorem 11.2.4, and the Chebyshev semi-iterative method (11.2.28)–(11.2.30).

Everything here already exists in the backbone `Numlib/Stationary/*` (from Saad Ch. 4 and QSS
Ch. 4) and `Numlib/LinearAlgebra/Matrix/{TridiagonalToeplitz,KroneckerSum,Complexify}`; the section
is correspondence. Conventions: the book's `L_A, D_A, U_A` are `strictLower A`, `diagPart A`,
`strictUpper A` (Saad's `E = −L_A`, `F = −U_A`); a splitting `A = M − N` is
`Stationary.Splitting A` (determined by `M`, `N := M − A`), its iteration matrix `G = M⁻¹N` is
`s.iterationOperator`, one step `M x⁺ = N x + b` is `s.mulVecStep b x`; `ρ(G)` is
`Matrix.complexSpectralRadius G` (the spectral radius of the complexification, an `ℝ≥0∞`; the real
spectrum is the wrong object for convergence, `notes/backbone.md` §1.1). The book's SOR splitting
(11.2.18) is `Matrix.sorSplitting` (`M_ω = ω⁻¹ D + L`), SSOR is `Matrix.ssorSplitting`.

The componentwise loops (11.2.2), (11.2.3), (11.2.20) and the backward SOR loop are D4 programs
(every product, sum and quotient through `rnd`); their exact semantics is the backbone sweep
(`Matrix.jorSweep`, `Matrix.sorSweep`, `Matrix.backwardSorSweep`), whose matrix forms are the
`…_eq_mulVecStep` theorems of `Numlib/Stationary/Sweep`.

Model problem: `T_m = tridiag(−1, 2, −1)` is `Matrix.symmTridiagonalToeplitz m (−1) 2`,
`E_m = tridiag(1, 0, 1)` is `Matrix.symmTridiagonalToeplitz m 1 0`, and `I_{n₁} ⊗ T_{n₂} + T_{n₁} ⊗
I_{n₂}` is the Kronecker sum `Matrix.kroneckerSum (T n₁) (T n₂)` on `Fin n₁ × Fin n₂` (lexicographic
order = the book's row-by-row grid order). The sine transform matrix `S_m` of (11.2.13) is ch01's backbone `Matrix.dst1 m`
(`Numlib/Analysis/Fourier/SineCosineTransform`, entries `sin((k+1)(j+1)π/(m+1))`, 0-based, columns
`Matrix.sineVec`, `S_m S_m = ((m+1)/2) I` by `Matrix.dst1_mul_self`).
'''

[[node]]
id = "jacobiSweep"
kind = "definition"
desc = '''
The Jacobi sweep (11.2.2), D4 program: `def jacobiSweep {M} [Monad M] (rnd : ℝ → M ℝ)
(A : Matrix (Fin n) (Fin n) ℝ) (b x : Fin n → ℝ) : M (Fin n → ℝ)`; for `i` in `List.finRange n`,
`s ← b i`, then `s ← rnd (s − rnd (a_ij x_j))` over `j < i` and over `j > i` in increasing order, then
`x⁺ i ← rnd (s / a_ii)`; every `x_j` read is the *old* vector. ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (11.2.2)'

[[node]]
id = "gaussSeidelSweep"
kind = "definition"
desc = '''
The Gauss–Seidel sweep (11.2.3), D4 program with the same arithmetic as `jacobiSweep` but
updating `x` in place (`Function.update`), so that `x_j`, `j < i`, is already the new value. ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (11.2.3)'

[[node]]
id = "equation_11_2_4"
kind = "theorem"
desc = '''
(11.2.4): if `IsUnit (diagPart A)` (all `a_ii ≠ 0`), the exact Jacobi sweep is the step of the
Jacobi splitting `M_J = D_A`, `N_J = −(L_A + U_A)`:
`Id.run (jacobiSweep pure A b x) = (Matrix.jacobiSplitting A h).mulVecStep b x`, and
`(jacobiSplitting A h).m = diagPart A`, `.n = −(strictLower A + strictUpper A)`. Proof: the program
at `Id` is `Matrix.jorSweep A 1` (componentwise), then `Matrix.jorSweep_one_eq_mulVecStep`. ★
'''
deps = ["jacobiSweep", "Matrix.jorSweep", "Matrix.jorSweep_one_eq_mulVecStep",
  "Matrix.jacobiSplitting"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.2.4)'

[[node]]
id = "equation_11_2_5"
kind = "theorem"
desc = '''
(11.2.5): with `a_ii ≠ 0`, the exact Gauss–Seidel sweep is the step of `M_GS = D_A + L_A`,
`N_GS = −U_A`: `Id.run (gaussSeidelSweep pure A b x) = (Matrix.gaussSeidelSplitting A h).mulVecStep
b x`. Proof: induction along `List.finRange n` identifies the program with the componentwise
recursion `Matrix.sorSweep_apply` at `ω = 1`; then `Matrix.sorSweep_one_eq_mulVecStep`. ★★
(~40 lines)
'''
deps = ["gaussSeidelSweep", "Matrix.sorSweep", "Matrix.sorSweep_apply",
