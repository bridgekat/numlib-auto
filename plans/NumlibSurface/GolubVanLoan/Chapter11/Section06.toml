namespace = "GolubVanLoan.Chapter11"
desc = '''
Golub–Van Loan §11.6, *The Multigrid Framework*: the one-dimensional model problem with its explicit
eigen-decomposition ((11.6.2)–(11.6.10)), weighted Jacobi as a smoother ((11.6.11)–(11.6.12), the
choice `ω = 2/3`), restriction and prolongation ((11.6.13)–(11.6.15)), the two-grid cycle and its
error operator ((11.6.16)–(11.6.19)), Lemma 11.6.1 and Theorem 11.6.2 with the mode-by-mode damping
analysis ((11.6.20)–(11.6.22)).

Unlike Saad Ch. 13 — whose two-grid theory is the abstract energy-norm argument of the backbone
`Numlib/Multigrid/{Basic,TwoGrid}` — the book's analysis is an exact computation in the sine basis
for `n = 2^k − 1`. So the section is surface computation over the backbone's sine eigenbasis
(`Numlib/LinearAlgebra/Matrix/TridiagonalToeplitz`), with one bridge to the abstract theory:
the book's `E^h` is the backbone's coarse-grid correction `Multigrid.coarseCorrection` for the
prolongation `P^h_{2h}` (because `R^{2h}_h = ½ (P^h_{2h})ᵀ` and `R A^h P = A^{2h}`, the Galerkin
property of this pair), `twoGridError_eq_coarseCorrection`. Lemma 11.6.1, Theorem 11.6.2, (11.6.9)
and (11.6.10) were checked numerically during planning (`k = 4`, errors `~1e-15`).

Conventions: `k ≥ 1`, `n = 2^k − 1`, `m = 2^{k−1} − 1`, `h = 1/2^k` (`n + 1 = 2(m + 1)`); vectors on the
fine grid are `Fin n → ℝ`, the book's index `j = 1:n` is `j − 1`; the even fine points `2:2:2m` are
`fun i : Fin m => ⟨2i + 1, _⟩`. `A^h = h⁻² T_n` with `T_n = Matrix.symmTridiagonalToeplitz n (−1) 2`
(ch04's `𝒯_n^{DD}` of (4.8.7)); `Q^h` has columns `√(2/(n+1)) · Matrix.sineVec n j`. The exchange
permutation `ℰ_m` is ch04's `Matrix.exchange m` (`Numlib/LinearAlgebra/Matrix/Toeplitz`,
`exchange m i j = if j = Fin.rev i then 1 else 0`). Block matrices `[S 0 C; 0 1 0; …]` over `Fin m ⊕ Fin 1 ⊕ Fin m` reindexed to
`Fin n`.

Not formalized here (chapter group): the PDE (11.6.1) and its discretization claim, the V-cycle
`mgV`, full multigrid and §11.6.5 (the text states no property of them beyond the `O(n)` flop count
and the heuristic "rate independent of `n`"), and the `n = 7` example matrices of (11.6.13).
'''

[[node]]
id = "modelA"
kind = "definition"
desc = '''
(11.6.2)–(11.6.3): `A^h = (1/h²) tridiag(−1, 2, −1) ∈ ℝ^{n×n}` for `n = 2^k − 1`, `h = 2^{−k}`, as a
function of `k` (`modelA k`); the coarse matrix `A^{2h}` is `modelA (k − 1)`. Chapter 4 writes the same matrix `𝒯^{(DD)}_m` directly as the backbone `Matrix.symmTridiagonalToeplitz`
(its (4.8.6), `GolubVanLoan.Chapter04.equation_4_8_6`, is the difference-equation identity, not a definition), so there is no
earlier surface definition to depend on; the ch04 facts about it are used through `GolubVanLoan.Chapter04.dd_eigen`. ★
'''
deps = ["Matrix.symmTridiagonalToeplitz"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.3)'

[[node]]
id = "modelAEigenvalues"
kind = "definition"
desc = '''
(11.6.5): `λ^h_j = (4/h²) sin²(jπ/(2(n+1)))`, `j = 1:n`, as `Fin n → ℝ`. ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.5)'

[[node]]
id = "modelQ"
kind = "definition"
desc = '''
(11.6.6): `Q^h = [q₁ ⋯ q_n]`, `q_j = √(2/(n+1)) (sin θ_j, …, sin nθ_j)ᵀ`, `θ_j = jπ/(n+1)`: the matrix
whose `j`-th column is `√(2/(n+1)) • Matrix.sineVec n (j−1)`. ★
'''
deps = ["Matrix.sineVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.6)'

[[node]]
id = "equation_11_6_4"
kind = "theorem"
desc = '''
(11.6.4): `Q^h` is orthogonal (`(Q^h)ᵀ Q^h = 1`) and `(Q^h)ᵀ A^h Q^h = diagonal λ^h`. From
`Matrix.dotProduct_sineVec` (orthogonality, squared norm `(n+1)/2`) and
`Matrix.symmTridiagonalToeplitz_mulVec_sineVec` (via the earlier chapter's restatement `GolubVanLoan.Chapter04.dd_eigen`) (eigenvalue `2 − 2cos θ_j = 4 sin²(θ_j/2)`). ★
'''
deps = ["modelA", "modelAEigenvalues", "modelQ", "Matrix.dotProduct_sineVec",
  "GolubVanLoan.Chapter04.dd_eigen"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.4)'

[[node]]
id = "modelS"
kind = "definition"
desc = '''
(11.6.7): `s_j = sin(jπ/(2(n+1)))`, `S^h = diag(s₁², …, s_m²)` (`m × m`). Its twin `C^h` of (11.6.8) is
the separate node `modelC`. ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.7)'

[[node]]
id = "modelC"
kind = "definition"
desc = '''
(11.6.8): `c_j = cos(jπ/(2(n+1)))`, `C^h = diag(c₁², …, c_m²)` (`m × m`), the twin of `modelS`
(`S^h + C^h = I`). ★
'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.8)'

[[node]]
id = "equation_11_6_9"
kind = "theorem"
desc = '''
(11.6.9): `Λ^h = diag(λ^h) = (4/h²) · diag(S^h, 1/2, ℰ_m C^h ℰ_m)` (block form over
`Fin m ⊕ Fin 1 ⊕ Fin m`). Trigonometry: `s_{m+1}² = sin²(π/4) = 1/2` since `m + 1 = (n+1)/2`, and
`s_{n+1−j} = c_j`. [the book's P11.6.1]. ★
'''
deps = ["modelAEigenvalues", "modelS", "modelC"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.9)'

[[node]]
id = "equation_11_6_10"
kind = "theorem"
desc = '''
(11.6.10): the even rows of `Q^h` are scaled copies of `Q^{2h}`:
`Q^h(2:2:2m, :) = [Q^{2h} | 0 | −Q^{2h}ℰ_m]/√2`. Trigonometry: `sin(2i·jπ/(n+1)) = sin(i·jπ/(m+1))`,
`sin(2i(m+1)π/(n+1)) = sin(iπ) = 0`, `sin(2i(n+1−j)π/(n+1)) = −sin(2ijπ/(n+1))`, and
`√(2/(n+1)) = √(2/(m+1))/√2`. [the book's P11.6.1]. ★★ (~40 lines)
'''
deps = ["modelQ"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.10)'

[[node]]
id = "equation_11_6_11"
kind = "theorem"
desc = '''
(11.6.11): the weighted Jacobi iteration `u⁽ᵏ⁾ = Gu⁽ᵏ⁻¹⁾ + c`, `G = (1−ω)I − ωD⁻¹(L + U)`,
`c = ωD⁻¹b`, is the iteration of `Matrix.jorSplitting` (`M = ω⁻¹D`), and for `A^h`:
`G^{h,ω} = I − (ωh²/2) A^h`. `Matrix.jorSplitting` unfolded, `diagPart A^h = (2/h²) I`. ★
'''
deps = ["modelA", "Matrix.jorSplitting", "Stationary.Splitting.iterationOperator"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.11)'

[[node]]
id = "equation_11_6_12"
kind = "theorem"
desc = '''
(11.6.12): `(Q^h)ᵀ G^{h,ω} Q^h = diag(τ^{h,ω})`, `τ_j^{h,ω} = 1 − 2ω sin²(jπ/(2(n+1)))`; hence the error
expansion `u_p − u = ∑_j α_j (τ_j)^p q_j` for `u₀ − u = ∑_j α_j q_j` (the display after (11.6.12)).
From `equation_11_6_4` and `equation_11_6_11`. ★
'''
deps = ["equation_11_6_4", "equation_11_6_11"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.12)'

[[node]]
id = "weightedJacobi_tau_mem"
kind = "theorem"
desc = '''
§11.6.2: for `0 < ω ≤ 1`, `−1 < τ_n < ⋯ < τ_1 < 1` (strictly decreasing in `j`), hence
`ρ(G^{h,ω}) < 1`. `sin²` strictly increasing on `(0, π/2)`; the spectral radius by
`Matrix.complexSpectralRadius_conj` and `Matrix.complexSpectralRadius_diagonal` (staged). ★
'''
deps = ["equation_11_6_12", "Matrix.complexSpectralRadius_conj", "Matrix.complexSpectralRadius_diagonal"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.2'

[[node]]
id = "weightedJacobi_optimalOmega"
kind = "theorem"
desc = '''
§11.6.2, the rigorous version of "this is essentially solved by `ω_opt = 2/3`": the high-frequency
damping factor `μ(ω) = max_{m < j ≤ n} |τ_j^{h,ω}|` equals `max(|1 − ω|, |1 − 2ω s_n²|)` (monotonicity,
`s_{m+1}² = 1/2`), and over `0 < ω ≤ 1` it is minimized exactly at `ω* = 2/(1 + 2s_n²)`, where
`τ_{m+1} = −τ_n` (the book's equation) and `μ(ω*) = (2s_n² − 1)/(2s_n² + 1) < 1/3`; `ω* → 2/3` as
`k → ∞` (`s_n → 1`). ★★ (~50 lines)
'''
deps = ["weightedJacobi_tau_mem", "equation_11_6_9"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.2'

[[node]]
id = "weightedJacobi_twoThirds"
kind = "theorem"
desc = '''
§11.6.2: at `ω = 2/3`, `μ(2/3) = 1/3` exactly (`τ_{m+1} = 1 − (4/3)(1/2) = 1/3` and `|τ_j| ≤ 1/3` for
`j > m`), so the high-frequency error components after `p` steps are at most `(1/3)^p` times the
initial ones: `‖P_high(u_p − u)‖₂ ≤ (1/3)^p ‖P_high(u₀ − u)‖₂`, `P_high` the orthogonal projector onto
`span{q_{m+1}, …, q_n}`. From `equation_11_6_12` and `weightedJacobi_optimalOmega`'s monotonicity. ★
'''
deps = ["equation_11_6_12", "weightedJacobi_optimalOmega"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.2'

[[node]]
id = "modelB"
kind = "definition"
desc = '''
(11.6.15): `B^h = 4I_n − h² A^h` (`= tridiag(1, 2, 1)`). ★
'''
deps = ["modelA"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.15)'

[[node]]
id = "restrictionMatrix"
kind = "definition"
desc = '''
(11.6.14), the restriction: `R^{2h}_h = ¼ B^h(2:2:2m, :) ∈ ℝ^{m×n}` (`Matrix.submatrix` with the
even-point embedding `j ↦ 2j + 1`, 0-based). Bridge (a clause of this node): for `n = 2m + 1`,
`restrictionMatrix = Multigrid.fullWeighting m` (the backbone's full weighting, `¼ [1 2 1]` on the rows;
entrywise, one line). The book's (11.6.13) (the `n = 7` instances) is a numerical example and not a node. ★
'''
deps = ["modelB", "Multigrid.fullWeighting"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.14)'

[[node]]
id = "prolongationMatrix"
kind = "definition"
desc = '''
(11.6.14), the prolongation: `P^h_{2h} = ½ B^h(:, 2:2:2m) ∈ ℝ^{n×m}`, the twin of `restrictionMatrix`
(same even-point embedding; `P = 2 Rᵀ` since `B^h` is symmetric, a one-line lemma in this node's
docstring). Bridge (a clause of this node): for `n = 2m + 1`, `prolongationMatrix = Multigrid.linearInterpolation m`
(entrywise, one line). ★
'''
deps = ["modelB", "Multigrid.linearInterpolation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.14)'

[[node]]
id = "restriction_prolongation_apply"
kind = "theorem"
desc = '''
§11.6.3: `(R u)_i = (u_{2i−1} + 2u_{2i} + u_{2i+1})/4` (weighted average around each even fine point) and
`(P v)_{2i} = v_i`, `(P v)_{2i+1} = (v_i + v_{i+1})/2` with the end conditions `v₀ = v_{m+1} = 0`
(1-based); and `R = ½ Pᵀ`. Through the bridges of `restrictionMatrix`/`prolongationMatrix`, from the backbone
definitions (`Multigrid.fullWeighting = ½ (linearInterpolation)ᵀ` and `Multigrid.fullWeighting_apply`). ★
'''
deps = ["restrictionMatrix", "prolongationMatrix", "Multigrid.fullWeighting"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.3'

[[node]]
id = "galerkin_coarse_eq"
kind = "theorem"
desc = '''
`R^{2h}_h A^h P^h_{2h} = A^{2h}` — the coarse matrix is the Galerkin product of the fine one (not stated
by the book, but it is what makes `E^h` a projector and connects §11.6 to the backbone). Delegates, through the
bridges of `restrictionMatrix`/`prolongationMatrix`, to the backbone Galerkin identity
`Multigrid.fullWeighting_mul_mul_linearInterpolation` (`fullWeighting m * T_{2m+1} * linearInterpolation m =
¼ T_m`) after the `h`-scaling `A^h = h⁻² T_n`, `A^{2h} = (2h)⁻² T_m`. ★
'''
deps = ["restrictionMatrix", "prolongationMatrix", "modelA", "Multigrid.fullWeighting_mul_mul_linearInterpolation"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.3'

[[node]]
id = "twoGridCycle"
kind = "definition"
desc = '''
(11.6.16), the two-grid cycle, D4 program: pre-smooth `u_{p₁} = WJ(p₁, u_c)` (weighted Jacobi with
`ω = 2/3`, `p₁` sweeps), `r^h = b^h − A^h u_{p₁}`, `r^{2h} = R r^h`, solve `A^{2h} z^{2h} = r^{2h}` (a
coarse-solver argument; exact semantics `(A^{2h})⁻¹`), `z^h = P z^{2h}`, `u₊ = u_{p₁} + z^h`,
post-smooth `u₊₊ = WJ(p₂, u₊)`. The printed update `u₊ = u_c + z^h` uses the pre-smoothing input
instead of `u_{p₁}` (Doubts); the program and (11.6.17) use `u_{p₁}`, as the book's own next display
does. ★
'''
deps = ["restrictionMatrix", "prolongationMatrix", "equation_11_6_11"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.16)'

[[node]]
id = "twoGridErrorOperator"
kind = "definition"
desc = '''
(11.6.18): the two-grid error operator `E^h = I_n − P (A^{2h})⁻¹ R A^h`. ★
'''
deps = ["restrictionMatrix", "prolongationMatrix", "modelA"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.18)'

[[node]]
id = "equation_11_6_17"
kind = "theorem"
desc = '''
(11.6.17) and the display before it: for the exact two-grid cycle with `A^h u = b^h`,
`u₊ = u_{p₁} + P(A^{2h})⁻¹RA^h(u − u_{p₁})` and `u₊ − u = E^h(u_{p₁} − u)`. Algebra. ★
'''
deps = ["twoGridCycle", "twoGridErrorOperator"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.17)'

[[node]]
id = "equation_11_6_19"
kind = "theorem"
desc = '''
(11.6.19): `u₊₊ − u = (G^h)^{p₂} E^h (G^h)^{p₁} (u_c − u)`, `G^h = G^{h,2/3}`. From `equation_11_6_17` and
the error propagation of weighted Jacobi (`equation_11_2_7` for `Matrix.jorSplitting`). ★
'''
deps = ["equation_11_6_17", "equation_11_6_11", "equation_11_2_7"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.6.19)'

[[node]]
id = "twoGridError_eq_coarseCorrection"
kind = "theorem"
desc = '''
Bridge to the backbone: `E^h` is the coarse-grid correction `Multigrid.coarseCorrection` of
`Numlib/Multigrid/Basic` for `A = toEuclideanLin A^h` and the prolongation `Pr = toEuclideanLin P^h_{2h}`
(the `A`-orthogonal projector complement onto `range P`), and the two-grid error operator of (11.6.19)
is `Multigrid.twoGridOperator` with the weighted-Jacobi smoother (`Multigrid.smootherOperator`).
From `galerkin_coarse_eq` (`R = ½Pᵀ`, so `P(RA^hP)⁻¹RA^h = P(PᵀA^hP)⁻¹PᵀA^h`) and
`Multigrid.coarseProjection_apply_eq`. Consequently `E^h` is idempotent and `A^h`-self-adjoint, which
the eigen-structure (11.6.21) exhibits. ★★ (~40 lines)
'''
deps = ["twoGridErrorOperator", "galerkin_coarse_eq", "Multigrid.coarseCorrection", "Multigrid.coarseProjection_apply_eq",
  "Multigrid.twoGridOperator", "Multigrid.smootherOperator"]
source = 'Golub–Van Loan, Matrix Computations, §11.6.3'

[[node]]
id = "lemma_11_6_1"
kind = "theorem"
desc = '''
Lemma 11.6.1 ((11.6.20)): for `n = 2^k − 1`, `m = 2^{k−1} − 1`,
`(Q^h)ᵀ P Q^{2h} = √2 [C^h; 0; −ℰ_m S^h]` and `(Q^{2h})ᵀ R Q^h = (1/√2)[C^h; 0; −ℰ_m S^h]ᵀ`. The book's
proof: `(Q^h)ᵀB^hQ^h = 4I − h²Λ^h = 4 diag(C^h, 1/2, ℰ_m S^h ℰ_m) =: D^h` by (11.6.4), (11.6.9), (11.6.15),
then `(Q^h)ᵀB^h(:, idx) = D^h Q^h(idx, :)ᵀ` and (11.6.10). Numerically confirmed. Delegates instead to the
backbone mode identities `Multigrid.linearInterpolation_mulVec_sineVec` and `Multigrid.fullWeighting_mulVec_sineVec`
(`Numlib/Multigrid/ModelProblem`), through the bridges of `prolongationMatrix`/`restrictionMatrix`: the DST-block form
is those identities column by column, with the column normalizations `√(2/(n+1))` of `Q^h` and `√(2/(m+1))` of
`Q^{2h}` (their ratio `1/√2`, since `n + 1 = 2(m + 1)`, gives the `√2`), `c_j² = cos²(θ/2)`, `s_j² = sin²(θ/2)`, and
the 0-based alias index `2m − j` being the book's `n + 1 − j`. ★
'''
deps = ["equation_11_6_4", "equation_11_6_9", "restrictionMatrix", "prolongationMatrix", "Multigrid.linearInterpolation_mulVec_sineVec", "Multigrid.fullWeighting_mulVec_sineVec"]
source = 'Golub–Van Loan, Matrix Computations, Lemma 11.6.1'

[[node]]
id = "theorem_11_6_2"
kind = "theorem"
desc = '''
Theorem 11.6.2 ((11.6.21)): `E^h Q^h = Q^h [S^h 0 C^hℰ_m; 0 1 0; ℰ_mS^h 0 ℰ_mC^hℰ_m]`. Proof: substitute
(11.6.4), (11.6.9), (11.6.20) and `(Q^{2h})ᵀA^{2h}Q^{2h}` into `(Q^h)ᵀE^hQ^h`. The printed value
`(Q^{2h})ᵀA^{2h}Q^{2h} = (1/(2h²))(I_m − √C^h)` is wrong; the correct one is `(4/h²) S^h C^h` (the
coarse eigenvalues `(1/h²) sin²(jπ/(n+1)) = (4/h²)s_j²c_j²`; Doubts, checked numerically). With it the
block computation is `C^h(S^hC^h)⁻¹S^h`-type cancellations and `s² + c² = 1`. [the book's P11.6.2].
Numerically confirmed (`k = 4`). Delegates to the backbone `Multigrid.coarseCorrection_mulVec_sineVec`, whose three
mode identities are the columns of (11.6.21) (with the bridges of `prolongationMatrix`/`restrictionMatrix` and the
scaling `A^h = h⁻² T_n`, `A^{2h} = (2h)⁻² T_m`, the book's `E^h` is the backbone's `E`); the block matrix is their
assembly against the normalized columns of `Q^h`. ★
'''
deps = ["twoGridErrorOperator", "equation_11_6_4", "Multigrid.coarseCorrection_mulVec_sineVec", "restrictionMatrix", "prolongationMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 11.6.2'

[[node]]
id = "equation_11_6_22"
kind = "theorem"
desc = '''
(11.6.22): `E^h q_j = s_j²(q_j + q_{n−j+1})`, `E^h q_{m+1} = q_{m+1}`, `E^h q_{n−j+1} = c_j²(q_j + q_{n−j+1})`,
