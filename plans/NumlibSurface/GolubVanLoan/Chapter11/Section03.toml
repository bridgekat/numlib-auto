residual of the algorithm). From `algorithm_11_3_2_spec`: `g_i = −r^{CG}_i` and
`CG.inner_residual_eq_zero`; `ν_k r_k = −r^{CG}_k` by the dictionary. (The book's proof — `g_k =
(e_kᵀy_k) r_k` from (11.3.13) and `e_kᵀy_k = ν_k` — is an alternative, not needed.) ★★ (~40 lines)
'''
