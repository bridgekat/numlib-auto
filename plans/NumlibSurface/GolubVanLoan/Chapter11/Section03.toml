[[node]]
id = "algorithm_11_3_2"
kind = "definition"
desc = '''
Algorithm 11.3.2 (CG, Lanczos version), D4 program with fuel: state
`(k, x, q, qPrev, r, β, βPrev, α, d, ν, c, done)`; the loop body exactly as printed:
`q_{k+1} = r_k/β_k`, `k ← k+1`, `α_k = q_kᵀAq_k`, then (`k = 1`) `d₁ = α₁`, `ν₁ = β₀/d₁`, `c₁ = q₁` or
(`k > 1`) `ℓ_{k−1} = β_{k−1}/d_{k−1}`, `d_k = α_k − β_{k−1}ℓ_{k−1}`, `ν_k = −β_{k−1}ν_{k−1}/d_k`,
`c_k = q_k − ℓ_{k−1}c_{k−1}`; `x_k = x_{k−1} + ν_k c_k`, `r_k = Aq_k − α_k q_k − β_{k−1}q_{k−1}`,
`β_k = ‖r_k‖₂` (one `√` then `rnd`); stop when `β_k = 0`. ★
'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1", "GolubVanLoan.Chapter01.algorithm_1_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.3.2'

[[node]]
id = "algorithm_11_3_2_spec"
kind = "theorem"
desc = '''
Exact semantics for SPD `A`, `r₀ = b − Ax₀ ≠ 0`: the run takes `k = min fuel (grade T r₀)` steps, and
for `1 ≤ j ≤ k`: `q_j = Arnoldi.vec T r₀ (j−1)`, `α_j = Lanczos.alpha T r₀ (j−1)`,
`β_j = Lanczos.beta T r₀ (j−1)`, `(d_j, ℓ_j)` are the `ldlTridiag` factors of `T_k`,
`d_j = 1/α^{CG}_{j−1}`, `ν_j c_j = α^{CG}_{j−1} p^{CG}_{j−1}`, and `x_j = (CG.iterate T b x₀ j).x`
(so `x_j` is the Galerkin iterate, and at exit `A x = b`). Proof: induction on the loop, with the
dictionary `CG.lanczos_alpha_zero_eq`, `CG.lanczos_alpha_succ_eq`, `CG.lanczos_beta_eq` and
`CG.arnoldi_vec_eq` (the signs `(−1)^{j−1}` cancel in `ν_j c_j`). ★★★ (~150 lines)
'''
deps = ["algorithm_11_3_2", "CG.iterate", "CG.arnoldi_vec_eq", "CG.lanczos_alpha_zero_eq",
  "CG.lanczos_alpha_succ_eq", "CG.lanczos_beta_eq", "ldlTridiag", "cgLDL_x_succ", "CG.isGalerkinIterate",
  "GolubVanLoan.Chapter01.algorithm_1_1_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.3.2'

