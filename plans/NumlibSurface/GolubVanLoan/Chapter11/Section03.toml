[[node]]
id = "kappa_c_le"
kind = "theorem"
desc = '''
§11.3.2: `κ_c ≤ λ_max(A)/λ_min(A) = κ₂(A)` for `g_c ≠ 0`: each Rayleigh quotient `gᵀAg/gᵀg` lies in
`[λ_min, λ_max]` and `gᵀA⁻¹g/gᵀg ≤ 1/λ_min`. From `Matrix.IsHermitian.isSymmetricBoundedBy_toEuclideanLin`
(for `A` and `A⁻¹`) and `Matrix.PosDef.condNumber_l2_eq_div_eigenvalues` (via the earlier chapter's restatement `GolubVanLoan.Chapter04.condNumber_eq_div_eigenvalues`). ★
'''
deps = ["Matrix.IsHermitian.isSymmetricBoundedBy_toEuclideanLin", "GolubVanLoan.Chapter04.condNumber_eq_div_eigenvalues"]
source = 'Golub–Van Loan, Matrix Computations, §11.3.2'

[[node]]
id = "equation_11_3_9"
kind = "theorem"
desc = '''
(11.3.9): `‖x₊ − x*‖_A² ≤ (1 − 1/κ₂(A)) ‖x_c − x*‖_A²` for the steepest-descent step. The book's
route: subtract `φ(x*)` from (11.3.8), use (11.3.5) and `kappa_c_le`. (The backbone's
`Projection.energyNorm_steepestDescentStep_le` gives the sharper Kantorovich factor
`((κ−1)/(κ+1))²`; either proof is acceptable.) ★
'''
deps = ["equation_11_3_8", "equation_11_3_5", "kappa_c_le", "Projection.energyNorm_steepestDescentStep_le"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.9)'

[[node]]
id = "algorithm_11_3_1"
kind = "definition"
desc = '''
Algorithm 11.3.1 (steepest descent with exact line search), D4 program with fuel:
`algorithm_11_3_1 rnd A b x₀ τ fuel` (`τ` the tolerance, `fuel` last): `x = x₀`, `g = A x − b` (gaxpy,
Algorithm 1.1.3), then while `‖g‖₂ > τ` — **the test as printed**: the computed norm
`rnd (√(rnd (gᵀg)))` (Algorithm 1.1.1, then one rounded square root, convention 1) compared exactly
with `τ` (the squared form `gᵀg > τ²` is not used: it would round `τ²` and change the test) —
`μ = rnd (gᵀg / gᵀAg)`, `x ← x − μ g`, `g ← A x − b` (recomputed, as printed). State `(k, x, g, done)`. ★
'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1", "GolubVanLoan.Chapter01.algorithm_1_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.3.1'

[[node]]
id = "algorithm_11_3_1_spec"
kind = "theorem"
desc = '''
Exact semantics for SPD `A`: (i) the `k`-th loop state has `x = (Projection.steepestDescentStep T b)^[k]
x₀` (as long as the test has not failed); (ii) the book's claim "produces `x` with `‖Ax − b‖₂ ≤ τ`":
for `τ > 0` there is `N` (explicitly, from `steepestDescent_rate`, `N = ⌈2 log(‖x₀ − x*‖_A √λ_max/τ)
/ −log(1 − 1/κ₂)⌉`) such that for `fuel ≥ N` the output satisfies `‖A x − b‖₂ ≤ τ`. ★★ (~60 lines)
'''
deps = ["algorithm_11_3_1", "steepestDescent_mu_eq", "steepestDescent_rate",
  "GolubVanLoan.Chapter01.algorithm_1_1_1_spec", "GolubVanLoan.Chapter01.algorithm_1_1_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 11.3.1'

[[node]]
id = "steepestDescent_rate"
kind = "theorem"
desc = '''
§11.3.2, "a convergence rate characterized by `(1 − 1/κ₂(A))^{k/2}`": the steepest-descent iterates
satisfy `‖x_k − x*‖_A ≤ (1 − 1/κ₂(A))^{k/2} ‖x₀ − x*‖_A`, hence converge ("globally convergent", by
induction). Induction on `equation_11_3_9`. ★
'''
deps = ["equation_11_3_9"]
source = 'Golub–Van Loan, Matrix Computations, §11.3.2'

[[node]]
id = "equation_11_3_11"
kind = "theorem"
desc = '''
(11.3.10)–(11.3.11): if `x_{k+1}` minimizes `φ` over `x₀ + S_{k+1}` and `x_k − x₀, g_k ∈ S_{k+1}`, then
`φ(x_{k+1}) ≤ min_μ φ(x_k − μ g_k)`; with nested `S_k` the minima are nonincreasing and
`S_n = ℝⁿ` gives `x_n = x*`. Immediate from minimality (`Krylov.IsGalerkinIterate.energyNorm_error_eq_iInf`
reading of `φ`). ★
'''
deps = ["equation_11_3_2", "Krylov.IsGalerkinIterate.energyNorm_error_eq_iInf"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.11)'

[[node]]
id = "gradient_mem_krylov"
kind = "theorem"
desc = '''
§11.3.3, the precise content of "the only way to satisfy this requirement is `S_k = 𝒦(A, g₀, k)`":
the Krylov spaces satisfy it — if `x_k − x₀ ∈ 𝒦(A, g₀, k)` then `g_k = A x_k − b ∈ 𝒦(A, g₀, k+1)`
(so `x_k − μ g_k − x₀ ∈ 𝒦(A, g₀, k+1)`). `Krylov.residual_mem_subspace_succ`. The uniqueness claim
("the only way") has no precise statement in the text and is not formalized. ★
'''
deps = ["Krylov.residual_mem_subspace_succ", "Krylov.subspace"]
source = 'Golub–Van Loan, Matrix Computations, §11.3.3'

[[node]]
id = "equation_11_3_13"
kind = "theorem"
desc = '''
(11.3.12)–(11.3.13), recalled from §10.1: after `k ≤ grade` Lanczos steps from `q₁ = r₀/‖r₀‖`,
`A Q_k = Q_k T_k + r_k e_kᵀ` with `Q_k` orthonormal columns, `T_k` = `Lanczos.tridiag T r₀ k` and
`Q_kᵀ r_k = 0`. Restates ch10's (10.1.4) (`GolubVanLoan.Chapter10.equation_10_1_4`; backbone
`Lanczos.apply_vec`, `Arnoldi.w`). ★
'''
deps = ["GolubVanLoan.Chapter10.equation_10_1_4", "Lanczos.tridiag", "Lanczos.apply_vec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.13)'

[[node]]
id = "lanczos_tridiag_posDef"
kind = "theorem"
desc = '''
§11.3.4: "the tridiagonal matrix `Q_kᵀAQ_k = T_k` is positive definite" for SPD `A` and `k ≤ grade`.
`T_k` is the compression of `A` to `𝒦_k` in the orthonormal Arnoldi basis
(`Lanczos.hessenbergSq_eq_map_tridiag`, `Arnoldi.hessenbergSq_eq_toMatrix_compression`), and a
compression of a coercive operator is coercive. ★★ (~30 lines)
'''
