[[node]]
id = "theorem_11_3_1"
kind = "theorem"
desc = '''
Theorem 11.3.1: if `k*` is the dimension of the smallest invariant subspace containing `r₀`, the CG
iteration (11.3.14) terminates with `x_{k*} = x*`. Formally: `k* = Krylov.grade T r₀`, which is the
