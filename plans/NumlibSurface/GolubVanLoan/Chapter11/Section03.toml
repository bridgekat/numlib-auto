source = 'Golub–Van Loan, Matrix Computations, §11.3.4'

[[node]]
id = "cg_lanczos_coordinates"
kind = "theorem"
desc = '''
§11.3.4: minimizing `φ(x₀ + Q_k y)` over `y ∈ ℝ^k` is `T_k y = β₀ e₁` (`φ(x₀ + Q_k y) = ½ yᵀT_k y −
