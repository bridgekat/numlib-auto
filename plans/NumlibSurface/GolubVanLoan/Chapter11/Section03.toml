`Krylov.IsGalerkinIterate T b x₀ k x_k`. From `Krylov.isGalerkinIterate_iff_mulVec_eq` (Galerkin in
Arnoldi coordinates) with `Lanczos.hessenbergSq_eq_map_tridiag`. ★
'''
deps = ["Krylov.isGalerkinIterate_iff_mulVec_eq", "Lanczos.hessenbergSq_eq_map_tridiag", "lanczos_tridiag_posDef",
  "Krylov.IsGalerkinIterate"]
source = 'Golub–Van Loan, Matrix Computations, §11.3.4'

