[[node]]
id = "steepestDescent_mu_eq"
kind = "theorem"
desc = '''
(11.3.6) and the line after: for `g_c = A x_c − b ≠ 0`, `μ ↦ φ(x_c − μ g_c)` is minimized exactly at
`μ_c = g_cᵀg_c / g_cᵀAg_c`, and `x_c − μ_c g_c = Projection.steepestDescentStep T b x_c` (the
one-dimensional Galerkin step with `r = −g`). From `energyFunctional_add_smul` (a quadratic in `μ`)
and `Projection.steepestDescentStep_isGalerkin`. ★
'''
deps = ["Projection.steepestDescentStep", "Projection.steepestDescentStep_isGalerkin", "energyFunctional"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.6)'

[[node]]
id = "equation_11_3_7"
kind = "theorem"
desc = '''
(11.3.7): `φ(x₊) = φ(x_c) − ½ (g_cᵀg_c)² / (g_cᵀAg_c)` (the book prints `r_cᵀAr_c` in the
denominator; `r_c = −g_c` makes them equal). Expansion of the quadratic at `μ_c`. ★
'''
deps = ["steepestDescent_mu_eq"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.7)'

[[node]]
id = "equation_11_3_8"
kind = "theorem"
desc = '''
(11.3.8): with `κ_c = (g_cᵀAg_c/g_cᵀg_c)(g_cᵀA⁻¹g_c/g_cᵀg_c)`: `g_cᵀA⁻¹g_c = 2φ(x_c) + bᵀA⁻¹b` and
`φ(x₊) = φ(x_c) − (1/κ_c)(φ(x_c) + ½ bᵀA⁻¹b)`. Algebra from `equation_11_3_7`. ★
'''
deps = ["equation_11_3_7"]
