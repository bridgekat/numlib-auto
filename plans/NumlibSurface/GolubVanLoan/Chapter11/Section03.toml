namespace = "GolubVanLoan.Chapter11"
desc = '''
Golub–Van Loan §11.3, *The Conjugate Gradient Method*: the quadratic `φ` and the `A`-norm, steepest
descent (Algorithm 11.3.1, (11.3.7)–(11.3.9)), the Krylov subspace strategy, CG as Lanczos plus an
`LDLᵀ` of `T_k` ((11.3.14)–(11.3.22), Algorithm 11.3.2, Theorems 11.3.1–11.3.5, Corollary 11.3.2),
the Hestenes–Stiefel form (Algorithm 11.3.3, (11.3.23)–(11.3.25)), the practical loop (11.3.26), the
Chebyshev bound (11.3.27), and CGNR/CGNE (Figure 11.3.1, (11.3.28)).

Backbone: everything the section proves is already in `Numlib/Krylov/{Iterate,CG,Lanczos,Arnoldi,
Hessenberg,Singular,NormalEquations,Convergence/CG}`, `Numlib/Projection/OneDimensional` (steepest
descent, Kantorovich) and `Numlib/Analysis/InnerProductSpace/Energy` (`energyFunctional`,
`energyNorm`). The one gap is the *dictionary* between the Lanczos coefficients and the CG
coefficients (Saad (6.101)–(6.103), today proved only in the Saad surface): it is what makes the
book's Lanczos-`LDLᵀ` derivation (Algorithm 11.3.2, Theorems 11.3.4–11.3.5) a correspondence rather
than a second CG theory, and it is staged as appends to `Numlib/Krylov/CG`
(`CG.lanczos_alpha_zero_eq`, `CG.lanczos_alpha_succ_eq`, `CG.lanczos_beta_eq`,
`CG.lanczos_tridiag_eq_ldl`). With them: `q_k = ±r_{k−1}/‖r_{k−1}‖` (`CG.arnoldi_vec_eq`),
`d_k = 1/α^{CG}_{k−1}`, `ℓ_k = ‖r_k‖/‖r_{k−1}‖`, `c_k = ±p_{k−1}/‖r_{k−1}‖`,
`ν_k = ±α^{CG}_{k−1}‖r_{k−1}‖`, and `x_k` of Algorithm 11.3.2 is `(CG.iterate k).x`.

Conventions. Real SPD `A : Matrix (Fin n) (Fin n) ℝ`; Krylov statements are about
`T := Matrix.toEuclideanLin A` on `EuclideanSpace ℝ (Fin n)` with vectors transported by
`WithLp.toLp 2` (`notes/gvl/ch11/proto/Shapes.lean` (a)). `φ(x) = ½ xᵀAx − xᵀb` is
`energyFunctional T b x`, `‖v‖_A` is `energyNorm T v`, `κ₂(A) = λ_max/λ_min` is
`NormedRing.condNumber A` under scoped `Matrix.Norms.L2Operator` (equal to the eigenvalue ratio by
`Matrix.PosDef.condNumber_l2_eq_div_eigenvalues`). Indices: the book's Lanczos `q_j, α_j, β_j`
(`j ≥ 1`) are the backbone's `Arnoldi.vec T r₀ (j−1)`, `Lanczos.alpha T r₀ (j−1)`,
`Lanczos.beta T r₀ (j−1)` for `r₀ = b − A x₀`; the book's Hestenes–Stiefel `p_k, μ_k` (`k ≥ 1`) are
the backbone's `(CG.iterate (k−1)).p`, `CG.alpha` at step `k−1`; `x_k`, `r_k` agree. The "smallest
invariant subspace containing `r₀`" is `Krylov.fullSubspace T r₀`, of dimension `Krylov.grade T r₀`.

Algorithms (D4): Algorithms 11.3.1–11.3.3, (11.3.14) and (11.3.26) are monadic programs over the
rounding hook, built from ch01's Algorithms 1.1.1 (dot), 1.1.2 (saxpy) and 1.1.3 (gaxpy); `while`
loops get a fuel argument and a `done` flag (shape: `notes/gvl/ch11/proto/Shapes.lean` (a)). Their
specs are exact-arithmetic identifications with the backbone recurrences; the book gives no rounding
analysis of any of them (§11.3.8 only says orthogonality is lost), so none is planned.
'''

[[node]]
id = "equation_11_3_2"
kind = "theorem"
desc = '''
(11.3.1)–(11.3.3): for SPD `A`, `A x = b ↔ ∀ y, φ x ≤ φ y` (`x` minimizes `φ = energyFunctional`).
From `LinearMap.IsSymmetricCoercive.energyFunctional_sub_eq` (φ y − φ x* = ½‖y − x*‖_A²) and
uniqueness of the solution. ★
'''
deps = ["energyFunctional", "LinearMap.IsSymmetricCoercive.energyFunctional_sub_eq",
  "Matrix.PosDef.isSymmetricCoercive_toEuclideanLin"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.3.2)'

[[node]]
id = "gradient_energyFunctional"
kind = "theorem"
desc = '''
§11.3.1: `∇φ(x) = A x − b` (`HasGradientAt φ (A x − b) x` on `EuclideanSpace ℝ (Fin n)`), and `φ` is
convex. Delegates to `hasGradientAt_energyFunctional_of_finiteDimensional`
(tracked as `hasGradientAt_energyFunctional`) and convexity of a PSD quadratic. ★
'''
deps = ["hasGradientAt_energyFunctional"]
source = 'Golub–Van Loan, Matrix Computations, §11.3.1'

[[node]]
id = "equation_11_3_5"
kind = "theorem"
desc = '''
(11.3.5): `φ(x_c) = ½ ‖x_c − x*‖_A² + φ(x*)` with `φ(x*) = −½ bᵀA⁻¹b`.
`LinearMap.IsSymmetricCoercive.energyFunctional_sub_eq` plus the value at `x*`. ★
'''
deps = ["LinearMap.IsSymmetricCoercive.energyFunctional_sub_eq", "energyNorm"]
