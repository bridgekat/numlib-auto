  as hypotheses, (4.8.1), (4.8.5), (4.8.7), (4.8.11), (4.8.13)–(4.8.15), (4.8.24)).
* Problems are not nodes; P4.1.2, P4.3.11, P4.4.1, P4.4.6, P4.5.1, P4.7.2/P4.7.12, P4.7.11,
