## Not formalized

* Operation counts and flop estimates (everywhere); the Notes and References; numerical caveats
  (disparate weights, ill-conditioned `B`, large `λ` in the weighting method, hyperbolic rotations
  with `|x₁| ≈ |x₂|`).
* Heuristic claims without a rigorous reading: van der Sluis's "`κ₂(AG₀⁻¹)` is approximately
  minimized" (§6.1.3), the choice of `λ` by minimizing `C(λ)` (§6.1.4), the threshold `1 − δ` for a
  unit singular value (§6.4.4), the rank-revealing smallness in (6.5.16) and the whole ULV updating
  procedure of §6.5.5 ("`‖pᵀL̃‖₂ ≈ σ_min(L̃)`", condition estimation, zero chasing to a "small" row).
* Statements quoted without proof and without a precise reading: Paige's stability (§6.1.2), the
  Lagrange argument for (6.2.6) ("if it exists"), the TLS variants (6.3.7) (a problem definition),
  (6.3.8) (defined through "the largest index `p` with `V(n+1, p) ≠ 0`", which depends on the
  choice of `V` under repeated singular values; solvability quoted from Van Huffel 1992) and (6.3.9)
  ("leads to a system of the form"), "there may not be a solution if `rank(B) < m₂`".
* Displays that only name data: (6.1.6), (6.1.13), (6.1.15) (becomes the definition `ridgeDeleted`),
  (6.1.24)–(6.1.25) (proof steps of Theorem 6.1.1), (6.2.2), (6.2.5), (6.2.9) (backbone predicates),
  (6.4.4)–(6.4.5), (6.5.4), (6.5.5), (6.5.8), (6.5.9).
* The displaced fragment of P6.3.1(b) printed after §6.3.4 (line 17354).

