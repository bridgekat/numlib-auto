namespace = "GolubVanLoan.Chapter07"
desc = '''
§7.9, pseudospectra: matrix powers and the spectral radius ((7.9.1)–(7.9.3), the `2 × 2` bound), the
`ε`-pseudospectrum and its three definitions ((7.9.5)–(7.9.7)), monotonicity and the connected
components, the elementary properties (Theorems 7.9.1–7.9.8 with Corollaries 7.9.3, 7.9.5, 7.9.7),
computing `σ_min(zI - A)` through a Schur form (§7.9.5), the pseudospectral abscissa and radius
((7.9.8)–(7.9.9)), the Hamiltonian eigenvalue test (7.9.10), and transient growth (7.9.11).

Complex `A : Matrix (Fin n) (Fin n) ℂ`, 2-norm (scoped `Matrix.Norms.L2Operator`),
`σ_min(M) = ⨅ i, M.singularValues i` (backbone `Matrix.singularValues`, and the staged SVD bridge
`Matrix.iInf_singularValues_eq_iInf_norm`). The surface defines `pseudospectrum ε A` literally by
(7.9.5), `{z | σ_min(A - z I) ≤ ε}` (the book writes `λ` for `z` inside the set-builder, a misprint),
and proves it equal to the backbone's `(toEuclideanCLM A).closedPseudospectrum ε` (the approximate
eigenvector form; `Numlib/Eigen/Pseudospectrum`). The resolvent form (7.9.6) is stated for `ε > 0` and
`z ∉ λ(A)` separately from `λ(A) ⊆ Λ_ε(A)`, since `‖(zI - A)⁻¹‖ ≥ 1/ε` has no meaning at an eigenvalue
(Lean's `Ring.inverse` returns `0` there).

Not formalized here: (7.9.4) (it repeats (7.9.1) and adds "`A^k` may grow substantially before
exponential decay sets in", which is illustrated, not stated); the three Eigtool plots and the Kahan,
Demmel and `Gallery(5)` matrices (numerical illustrations; the eigenvalues of `Kah_n(s)` are read off
its triangular form but nothing is claimed about them beyond the pictures); the strategies 1–3 of
§7.9.5 for computing pseudospectra and the Burke–Lewis–Overton and Mengi–Overton algorithms (no
statements); "`σ_min(zI - T) ≈ 1/‖y‖₂` if `d` has a significant component along `u_min`" (heuristic).
'''

[[node]]
id = "equation_7_9_1"
kind = "theorem"
desc = '''(7.9.1), rigorous: for every `ε > 0` there is `C` with `‖A^k‖₂ ≤ C (ρ(A) + ε)^k` for all `k`, and
`‖A^k‖₂^{1/k} → ρ(A)` (Gelfand); so if `ρ(A) < 1` then `A^k → 0` and the decay is "like `ρ(A)^k`" in this
sense. `Matrix.exists_inducedNorm_le_spectralRadius_add` (the book's P7.3.7 route) and
`spectrum.pow_nnnorm_pow_one_div_tendsto_nhds_spectralRadius`; `spectralRadius` of Section 1. ★'''
deps = ["Matrix.exists_inducedNorm_le_spectralRadius_add", "GolubVanLoan.Chapter07.spectralRadius"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.9.1)'

[[node]]
id = "two_by_two_power_bound"
kind = "theorem"
desc = '''§7.9.1: for `A = [λ₁ M; 0 λ₂]` with `M > 0`, (a) `‖A^k‖₂ → 0` iff `|λ₁| < 1` and `|λ₂| < 1`; (b)
`‖A^k‖₂ ≤ (M/ε)(ρ(A) + ε)^k` for all `k` and every `0 < ε ≤ M` — the book says "for any `ε > 0`", but at
`k = 0` the bound reads `1 ≤ M/ε`, false for `ε > M` (report, Doubts). From Lemma 7.3.2 with `n = 2`,
`1 + μ = M/ε` (the book cites it as "Lemma 7.3.1"). ★★'''
deps = ["GolubVanLoan.Chapter07.lemma_7_3_2", "GolubVanLoan.Chapter07.equation_7_9_1"]
source = 'Golub–Van Loan, Matrix Computations, §7.9.1'

[[node]]
id = "equation_7_9_2"
kind = "theorem"
desc = '''(7.9.2): for `λ₁ ≠ λ₂`, `[λ₁ M; 0 λ₂] = X diag(λ₁, λ₂) X⁻¹` with `X = [1 M/(λ₂ - λ₁); 0 1]`. `Matrix.inv_fin_two`-level
computation (or `lemma_7_1_5_blockDiagonal` with `Z = M/(λ₂ - λ₁)`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (7.9.2)'

[[node]]
id = "equation_7_9_3"
kind = "theorem"
desc = '''(7.9.3): `[λ₁ M; 0 λ₂]^k = [λ₁^k, M ∑_{j=0}^{k-1} λ₁^{k-1-j} λ₂^j; 0, λ₂^k]` (induction on `k`;
no hypothesis `λ₁ ≠ λ₂` is needed, although the book derives it from (7.9.2)). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (7.9.3)'

[[node]]
id = "pseudospectrum"
kind = "definition"
desc = '''(7.9.5): `pseudospectrum ε A = {z : ℂ | ⨅ i, (A - z • 1).singularValues i ≤ ε}`, with the bridge
`pseudospectrum_eq : pseudospectrum ε A = (toEuclideanCLM A).closedPseudospectrum ε` for `n ≥ 1`
(`Matrix.mem_closedPseudospectrum_iff_iInf_singularValues`, `σ_min(A - z) = σ_min(z - A)`). An
`ε`-pseudoeigenvalue is a member; an `ε`-pseudoeigenvector a unit `v` with `‖(A - λ I) v‖₂ = ε`. ★'''
deps = ["ContinuousLinearMap.closedPseudospectrum", "Matrix.mem_closedPseudospectrum_iff_iInf_singularValues"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.9.5)'

[[node]]
id = "pseudospectrum_zero"
kind = "theorem"
desc = '''§7.9.2: `Λ₀(A) = Λ(A)` (`pseudospectrum 0 A = spectrum ℂ A`); and §7.9.3: `ε₁ ≤ ε₂ → Λ_{ε₁} ⊆ Λ_{ε₂}`.
`ContinuousLinearMap.closedPseudospectrum_zero`, `ContinuousLinearMap.closedPseudospectrum_mono`. ★'''
deps = ["GolubVanLoan.Chapter07.pseudospectrum", "ContinuousLinearMap.closedPseudospectrum_zero", "ContinuousLinearMap.closedPseudospectrum_mono"]
source = 'Golub–Van Loan, Matrix Computations, §7.9.2'

