[[node]]
id = "equation_7_9_10"
kind = "theorem"
desc = '''(7.9.10): for `θ r : ℝ` and `M = [i e^{iθ} Aᴴ, -ε I; ε I, i e^{-iθ} A]`, if `M [f; g] = (i r) [f; g]`
with `[f; g] ≠ 0` then `(A - r e^{iθ} I)ᴴ (A - r e^{iθ} I) g = ε² g` (the book's computation) and `ε` is a
singular value of `A - r e^{iθ} I` (for `ε ≠ 0`, `g ≠ 0`; `g = 0` forces `f = 0`); conversely every `r`
with `ε` a singular value of `A - r e^{iθ} I` gives an eigenvalue `i r` of `M` (from a singular pair). Block
computation and `Matrix.sq_singularValues`. ★★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); block
computation of `M [f; g] = i r [f; g]` and the singular pair of `A - r e^{iθ} I`
(`Matrix.sq_singularValues` via an eigenvector of `Bᴴ B`). Estimate ~150 lines.'''
deps = ["Matrix.sq_singularValues"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.9.10)'

[[node]]
id = "equation_7_9_10_max"
kind = "theorem"
desc = '''§7.9.6, "if `i r_max` is the largest pure imaginary eigenvalue of `M`, then `ε = σ_min(A - r_max e^{iθ} I)`"
(stated "it can be shown"): for `ε > 0`, if `i r_max` is an eigenvalue of `M` and no `i r` with `r > r_max` is,
then `σ_min(A - r_max e^{iθ} I) = ε`. Proof: `≤` from `equation_7_9_10`; if `<`, the continuous
`r ↦ σ_min(A - r e^{iθ} I)` (`Matrix.iInf_singularValues_sub_le`) tends to `∞` and so takes the value `ε`
at some `r > r_max` (intermediate value theorem), which by the converse of `equation_7_9_10` is an
eigenvalue `i r` of `M`. Hence the intersection of the ray `{r e^{iθ}}` with the boundary of `Λ_ε(A)`
farthest out is `r_max e^{iθ}`. ★★

Blocked: needs (7.9.10) of this section (open) and the continuity lemma
`Matrix.iInf_singularValues_sub_le` (open in the backbone on main 55f7ad05).'''
deps = ["GolubVanLoan.Chapter07.equation_7_9_10", "Matrix.iInf_singularValues_sub_le"]
source = 'Golub–Van Loan, Matrix Computations, §7.9.6'

