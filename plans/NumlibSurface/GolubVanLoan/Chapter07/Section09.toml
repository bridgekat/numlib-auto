`dist(z₀, Λ_ε(A)) ≥ σ_min(z₀ I - A) - ε`. `ContinuousLinearMap.le_infDist_closedPseudospectrum` (the
book's proof with its Corollary 2.4.4). ★'''
deps = ["GolubVanLoan.Chapter07.pseudospectrum", "ContinuousLinearMap.le_infDist_closedPseudospectrum", "Matrix.iInf_singularValues_sub_le"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.9.8'

