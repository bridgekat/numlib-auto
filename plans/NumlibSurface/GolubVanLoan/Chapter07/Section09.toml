[[node]]
id = "two_by_two_power_bound"
kind = "theorem"
desc = '''§7.9.1: for `A = [λ₁ M; 0 λ₂]` with `M > 0`, (a) `‖A^k‖₂ → 0` iff `|λ₁| < 1` and `|λ₂| < 1`; (b)
`‖A^k‖₂ ≤ (M/ε)(ρ(A) + ε)^k` for all `k` and every `0 < ε ≤ M` — the book says "for any `ε > 0`", but at
`k = 0` the bound reads `1 ≤ M/ε`, false for `ε > M` (report, Doubts). From Lemma 7.3.2 with `n = 2`,
`1 + μ = M/ε` (the book cites it as "Lemma 7.3.1"). ★★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); (b) is Lemma
7.3.2 at `n = 2` with `1 + μ = M/ε`; (a) needs the limit of `‖A^k‖` from (b) and the diagonal
entries of `A^k` for the converse. Estimate ~120 lines.'''
deps = ["GolubVanLoan.Chapter07.lemma_7_3_2", "GolubVanLoan.Chapter07.equation_7_9_1"]
source = 'Golub–Van Loan, Matrix Computations, §7.9.1'

