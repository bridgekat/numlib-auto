[[node]]
id = "theorem_7_9_8"
kind = "theorem"
desc = '''Theorem 7.9.8: for `z₀ ∉ λ(A)` and `ε ≥ 0` (`n ≥ 1`), `dist(z₀, Λ_ε(A)) ≥ 1/‖(z₀ I - A)⁻¹‖₂ - ε`
