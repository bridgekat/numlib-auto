[[node]]
id = "hamiltonian_deflation_structure"
kind = "theorem"
desc = '''§7.8.1, the displayed deflation step: if `M` is Hamiltonian, `M x = λ x` with `λ` real and `‖x‖₂ = 1`, and
`Q₁` is orthogonal symplectic with `Q₁ᵀ x = e₁`, then `Q₁ᵀ M Q₁` has first column `λ e₁` and row `n + 1`
equal to `-λ e_{n+1}ᵀ` (the "extra" zeros from Hamiltonian structure: the `(2,1)` block is symmetric and
the `(2,2)` block is minus the transpose of the `(1,1)` block); the remaining rows/columns
`2:n, n+2:2n` form a `(2n-2) × (2n-2)` Hamiltonian matrix. Block computation with
`hamiltonian_symplectic_conj` and `Matrix.isHamiltonian_fromBlocks_iff`. ★★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); block
computation from `hamiltonian_symplectic_conj` and `Matrix.isHamiltonian_fromBlocks_iff`, with the
reindexing of rows/columns `2:n, n+2:2n` to a `(2n-2) × (2n-2)` Hamiltonian block. Estimate ~150
lines.'''
deps = ["GolubVanLoan.Chapter07.hamiltonian_symplectic_conj", "GolubVanLoan.Chapter07.symplectic_householder_givens", "Matrix.isHamiltonian_fromBlocks_iff"]
source = 'Golub–Van Loan, Matrix Computations, §7.8.1'

