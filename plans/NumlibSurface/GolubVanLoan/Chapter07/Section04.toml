namespace = "GolubVanLoan.Chapter07"
desc = '''
§7.4, the Hessenberg and real Schur forms: the real Schur decomposition (Theorem 7.4.1), the
Hessenberg QR step (Algorithm 7.4.1), the Householder reduction to Hessenberg form (Algorithm 7.4.2,
(7.4.3), and Wilkinson's backward error bound), the implicit Q theorem (7.4.2), Krylov matrices and
unreduced Hessenberg matrices (7.4.3), geometric multiplicity one (7.4.4), and the companion matrix
(7.4.4).

Real: `Matrix (Fin n) (Fin n) ℝ`, `orthogonalGroup`, `Qᵀ`. Upper quasi-triangular is the backbone
predicate `Matrix.IsQuasiUpperTriangular` (staged for `RealSchur`); unreduced is
`Matrix.IsUnreducedUpperHessenberg` (`Numlib/LinearAlgebra/Matrix/UnreducedHessenberg`). Indices are
0-based: the book's `H(k+1, k)`, `k = 1:n-1`, is `H ⟨k+1, _⟩ ⟨k, _⟩`, `k < n - 1`.

**Algorithms (D4).** Each is a `noncomputable def` `{M : Type → Type} [Monad M] (rnd : ℝ → M ℝ)`
following the numbered conventions of `NumlibSurface/GolubVanLoan` (every `+ − × / √` result rounded,
negation, `|·|`, `sign`, copies and comparisons exact; loops `List.foldlM` over `List.finRange`
filtered to index lists). A block `A(k+1:n, k:n)` is the full matrix with the index lists of its rows
and columns (convention 10), and every update calls **chapter 5's shared helpers** (convention 13):
`GolubVanLoan.Chapter05.givensApplyLeft rnd i k c s cols A` (`A([i,k], cols) ← G(i,k,θ)ᵀ A([i,k], cols)`),
`givensApplyRight rnd i k c s rows A` (`A(rows, [i,k]) ← A(rows, [i,k]) G(i,k,θ)`),
`houseOn rnd o x` (the book's `house` on the entries of `x` listed by `o`, pivot `o.head`),
`householderApplyLeft rnd v β rows cols A` and `householderApplyRight rnd v β rows cols A`; the
Givens data are `algorithm_5_1_3` (`givens`, `(c, s)`), the book's rotation matrix is
`givensRotation i k c s`, and Householder data are `List ((Fin n → ℝ) × ℝ)` in order of
application, carrying the `β` that `house` returned (`householderProduct data = P₁ ⋯ P_r`). So
chapter 5's exact specs and rounding lemmas apply to every step. The shape of Algorithm 7.4.1 is
settled by the prototype `notes/gvl/ch07/proto/Shapes.lean` (there with the block helpers of the
first plan, which the shared helpers replace).

Not formalized here: §7.4.4 (level-3 block Hessenberg reduction, the WY form and the
Dongarra–Hammarling–Sorensen scheme: the BLAS-level discussion excluded by the brief's rule 5); flop
counts; "this calculation can be highly unstable" for companion-matrix methods (no statement).
'''

[[node]]
id = "theorem_7_4_1"
kind = "theorem"
desc = '''Theorem 7.4.1 (real Schur decomposition) (7.4.2): for `A : Matrix (Fin n) (Fin n) ℝ` there is an
orthogonal `Q` with `Qᵀ A Q` upper quasi-triangular, each `2 × 2` diagonal block having a pair of
complex conjugate (nonreal) eigenvalues. `Matrix.exists_orthogonal_conj_quasiUpperTriangular_of_irreducible_blocks`
(a real `2 × 2` matrix without a real eigenvalue has nonreal conjugate eigenvalues — its characteristic
polynomial is a real quadratic with negative discriminant), repackaged with
`Matrix.exists_orthogonal_conj_isQuasiUpperTriangular`. ★'''
deps = ["Matrix.exists_orthogonal_conj_quasiUpperTriangular_of_irreducible_blocks", "Matrix.exists_orthogonal_conj_isQuasiUpperTriangular", "Matrix.IsQuasiUpperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.4.1'

[[node]]
id = "algorithm_7_4_1"
kind = "definition"
desc = '''Algorithm 7.4.1 (Hessenberg QR step): for `k = 0 .. n-2`: `(c_k, s_k) ← givens(H k k, H (k+1) k)`
(chapter 5's Algorithm 5.1.3), `H([k,k+1], k:n-1) = [c s; -s c]ᵀ H([k,k+1], k:n-1)`
(`GolubVanLoan.Chapter05.givensApplyLeft rnd k (k+1) c s cols H`, `cols` the indices `≥ k`); then for
`k = 0 .. n-2`: `H(0:k+1, [k,k+1]) = H(0:k+1, [k,k+1]) [c s; -s c]` (`givensApplyRight`, `rows` the
indices `≤ k+1`). State: the matrix and the list of rotations. `noncomputable def algorithm_7_4_1 {M}
[Monad M] (rnd : ℝ → M ℝ) {n} (H : Matrix (Fin n) (Fin n) ℝ) : M (Matrix (Fin n) (Fin n) ℝ)`; elaborates
in the prototype (`notes/gvl/ch07/proto/Shapes.lean`). ★'''
deps = ["GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.1'

[[node]]
id = "algorithm_7_4_1_spec"
kind = "theorem"
desc = '''Algorithm 7.4.1 computes a QR step: for `H` upper Hessenberg, `H' = Id.run (algorithm_7_4_1 pure H)`
satisfies `Matrix.IsShiftedQrStep 0 H H'` with an orthogonal `Q = G₁ ⋯ G_{n-1}`
(`G_k = GolubVanLoan.Chapter05.givensRotation k (k+1) c_k s_k`) that is upper Hessenberg ("It is easy to
confirm that `Q` is upper Hessenberg"), and `H'` is upper Hessenberg. Statement (as in the prototype):
`∃ Q ∈ orthogonalGroup, ∃ R, R.IsUpperTriangular ∧ H = Q * R ∧ H' = R * Q ∧ Q.IsUpperHessenberg` (and
`H'.IsUpperHessenberg` by `IsUpperTriangular.mul_isUpperHessenberg`). Proof: invariant of the first loop —
after step `k` the matrix is `Gₖᵀ ⋯ G₁ᵀ H`, upper triangular in columns `≤ k` and Hessenberg beyond
(`GolubVanLoan.Chapter05.algorithm_5_1_3_spec` zeroes `H (k+1) k`; `givensApplyLeft_spec` on the columns
`≥ k`, the columns `< k` having zeros in rows `k, k+1`); the second loop multiplies by `G₁ ⋯ G_{n-1}` on
the right (`givensApplyRight_spec`, the restriction to rows `0:k+1` being harmless because `R` is upper
triangular). No rounding analysis in the book. ★★'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_1", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec", "GolubVanLoan.Chapter05.givensRotation", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "Matrix.IsShiftedQrStep", "Matrix.IsUpperTriangular.mul_isUpperHessenberg"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.1'

[[node]]
id = "equation_7_4_3"
kind = "theorem"
desc = '''(7.4.3), the Hessenberg decomposition exists: `∃ U₀ ∈ orthogonalGroup, (U₀ᵀ * A * U₀).IsUpperHessenberg`
with `U₀` fixing `e₀` (`U₀ *ᵥ Pi.single 0 1 = Pi.single 0 1`). Backbone `Matrix.hessenbergQ_mem_orthogonalGroup`,
`Matrix.isUpperHessenberg_hessenbergReduce`, `Matrix.hessenbergReduce_eq_conj` (the tail reflectors
fix `e₀`). ★'''
deps = ["Matrix.hessenbergQ_mem_orthogonalGroup", "Matrix.isUpperHessenberg_hessenbergReduce", "Matrix.hessenbergReduce_eq_conj"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.4.3)'

[[node]]
id = "hessenbergPart"
kind = "definition"
desc = '''Helper: `hessenbergPart A i j = if (i : ℕ) ≤ j + 1 then A i j else 0` — the book's reading of an array
that holds `H` in its upper Hessenberg part and the essential parts of the Householder vectors below
the subdiagonal (§7.4.3: "The kth Householder matrix can be represented in `A(k+2:n, k)`"). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §7.4.3'

[[node]]
id = "algorithm_7_4_2"
kind = "definition"
desc = '''Algorithm 7.4.2 (Householder reduction to Hessenberg form): `noncomputable def algorithm_7_4_2 {M}
[Monad M] (rnd : ℝ → M ℝ) {n} (A : Matrix (Fin n) (Fin n) ℝ) : M (Matrix (Fin n) (Fin n) ℝ ×
List ((Fin n → ℝ) × ℝ))`. For `k = 0 .. n-3`, with `T_k` the index list `[k+1, …, n-1]`
(`List.finRange n` filtered, convention 10): `(v, β) ← houseOn rnd T_k (A.col k)` (chapter 5's `house` on
`A(k+1:n, k)`: `v` zero off `T_k`, `1` at `k+1`); `A(k+1:n, k:n) = (I - β v vᵀ) A(k+1:n, k:n)`
(`householderApplyLeft rnd v β T_k cols_k A`, `cols_k = [k, …, n-1]`);
`A(1:n, k+1:n) = A(1:n, k+1:n) (I - β v vᵀ)` (`householderApplyRight rnd v β (List.finRange n) T_k A`);
then store `v(k+2:n)` in `A(k+2:n, k)` (copies, not rounded; the book's remark — column `k` is never
read again); append `(v, β)` to the returned data. The data carry the `β` that `house` returned, so the
reflectors are never rebuilt from the stored vectors (convention 13; surface review Major 2: when
`house` returns `β = 0`, the rebuilt `I - 2 e₁e₁ᵀ` is not the identity it applied). ★'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.householderApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.2'

[[node]]
id = "algorithm_7_4_2_spec"
kind = "theorem"
desc = '''Algorithm 7.4.2 computes a Hessenberg decomposition: with `(A', data) := Id.run (algorithm_7_4_2 pure A)`,
`H := hessenbergPart A'` and `U₀ := GolubVanLoan.Chapter05.householderProduct data` (the reflectors built
from the **returned** `(v, β)`): `U₀ ∈ orthogonalGroup`, `H = U₀ᵀ * A * U₀`, `H.IsUpperHessenberg`,
`U₀ e₀ = e₀`, and `data` has length `n - 2` with `v_k` zero on the indices `≤ k`. Each factor
`1 - β_k v_k v_kᵀ` is orthogonal (`β_k = 0` or `β_k (v_kᵀ v_k) = 2`, `houseOn_spec`) and acts on the
coordinates `≥ k+1` only. Invariant: after step `k` the matrix is Hessenberg through its first `k+1`
columns (`houseOn_spec`: the reflector maps the tail of column `k` to `‖·‖₂ e_{k+1}`;
`householderApplyLeft_spec`, `householderApplyRight_spec`); the stored entries of column `k` are outside
every later update and outside `hessenbergPart`. **Not** stated with `β = 2/(vᵀv)` recomputed from the
stored vectors (the book's §5.1.6 retrieval): for `A = [[1,2,3],[4,5,6],[0,7,8]]`, `house` returns
`β = 0` at `k = 0` (`x = (4, 0)`), `H = A`, and the rebuilt `U₀ = diag(1, -1, 1)` has
`U₀ᵀ A U₀ ≠ H` (surface review Major 2). Convention 11: the bare conjugation `∃ Q orthogonal, H = Qᵀ A Q`
is `algorithm_7_4_2_rounding` at `FloatingPoint.RoundingModel.exact` (`round_exact`, `u = 0`, so
`E = 0`); the identification `Q = householderProduct data` and `U₀ e₀ = e₀` are not in the bridge's
conclusion and are proved by the invariant. ★★'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2", "GolubVanLoan.Chapter07.hessenbergPart", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "GolubVanLoan.Chapter05.householderApplyRight_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.2'

[[node]]
id = "algorithm_7_4_2_rounds"
kind = "theorem"
desc = '''The bridge of Algorithm 7.4.2 (convention 12): for `fp : FloatingPoint.RoundingModel ℝ` with
`fp.IsIdempotent` (`house`'s tail sum and the application dot products start from `0`, convention 6)
and `((18 n + 31 : ℕ) : ℝ) * fp.u < 1`, every run `(A', data) ∈ (algorithm_7_4_2 fp.round A).run` has a
sequence `Â : ℕ → Matrix (Fin n) (Fin n) ℝ` with `Â (n - 2) = hessenbergPart A'` and
`FloatingPoint.RoundsHessenbergReducePert fp (18 n + 31) A Â` — `Â k` is the run's array after `k`
steps with the stored vectors in columns `< k` replaced by `0` (they are never read again, so the zeroed
arrays follow the same arithmetic). Per step, on the subtype `T_k = {i // k + 1 ≤ i}` of the active rows:
`GolubVanLoan.Chapter05.houseOn_rounds` gives `FloatingPoint.RoundsHouseholderVectorParlett` for the tail
column, hence `IsReflectorPert` of order `18 |T_k| + 31 ≤ 18 n + 31`
(`FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert`, raised to the common order by
`IsRelPert.mono`); `householderApplyLeft_rounds` / `householderApplyRight_rounds` give the column and
row sweeps as `RoundsHouseholderApplyScaled` on `T_k`; the rows and columns outside `T_k` are untouched
exactly, as `RoundsHessenbergStepPert` requires. Unfolding by `SetM.forall_mem_run_foldlM_finRange`. ★★
(~150 lines)'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2", "GolubVanLoan.Chapter07.hessenbergPart", "GolubVanLoan.Chapter05.houseOn_rounds", "GolubVanLoan.Chapter05.householderApplyLeft_rounds", "GolubVanLoan.Chapter05.householderApplyRight_rounds", "FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert", "FloatingPoint.RoundsHessenbergReducePert", "FloatingPoint.RoundingModel.IsIdempotent", "SetM.forall_mem_run_foldlM_finRange"]
source = 'Golub–Van Loan, Matrix Computations, §7.4.3'

[[node]]
id = "algorithm_7_4_2_rounding"
kind = "theorem"
desc = '''§7.4.3, Wilkinson's backward error of the Hessenberg reduction, rigorous: for
`fp : FloatingPoint.RoundingModel ℝ` with `fp.IsIdempotent`, `K = 18 n + 31`,
`((3K + n + 3 : ℕ) : ℝ) * fp.u < 1` and `2 (n - 2) ε < 1` for `ε = 3 γ_{3K+n+3}`, every run
`(A', data) ∈ (algorithm_7_4_2 fp.round A).run` satisfies `hessenbergPart A' = Qᵀ (A + E) Q` with `Q`
orthogonal, `hessenbergPart A'` upper Hessenberg, and `‖E‖_F ≤ γ_{2(n-2)}(ε) ‖A‖_F` — the book's
`‖E‖_F ≤ c n² u ‖A‖_F` with the constant explicit (`γ_{2(n-2)}(ε) ≈ 6 (55 n + 96) (n - 2) u`).
`algorithm_7_4_2_rounds` and the backbone `FloatingPoint.exists_roundsHessenbergReducePert_eq`
(Higham's Theorem 19.4 route, stated once for every reflector formula). The constants are the
relational calculus's, not Wilkinson's. ★'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2_rounds", "FloatingPoint.exists_roundsHessenbergReducePert_eq"]
source = 'Golub–Van Loan, Matrix Computations, §7.4.3'

[[node]]
id = "IsUnreduced"
kind = "definition"
desc = '''§7.4.5, Definition: an upper Hessenberg matrix is *unreduced* if it has no zero subdiagonal entries —
`IsUnreduced H := H.IsUnreducedUpperHessenberg` (the backbone predicate at `Fin n`, `ℝ`), with
`isUnreduced_iff : IsUnreduced H ↔ H.IsUpperHessenberg ∧ ∀ k (hk : k + 1 < n), H ⟨k+1, hk⟩ ⟨k, _⟩ ≠ 0`
(`Matrix.isUnreducedUpperHessenberg_iff_fin`). ★'''
deps = ["Matrix.IsUnreducedUpperHessenberg", "Matrix.isUnreducedUpperHessenberg_iff_fin"]
source = 'Golub–Van Loan, Matrix Computations, §7.4.5, Definition'

[[node]]
id = "theorem_7_4_2"
kind = "theorem"
desc = '''Theorem 7.4.2 (implicit Q theorem): `Q = [q₁ | ⋯ | q_n]`, `V = [v₁ | ⋯ | v_n]` orthogonal with
`Qᵀ A Q = H` and `Vᵀ A V = G` upper Hessenberg; `k` the smallest positive integer with `h_{k+1,k} = 0`
(`k = n` if `H` is unreduced). If `q₁ = v₁` then `q_i = ± v_i` and `|h_{i,i-1}| = |g_{i,i-1}|` for
`i = 2:k`, and `g_{k+1,k} = 0` if `k < n`. `Matrix.implicitQ_of_apply_eq_zero_real` (0-based, `k`
counted as there; `Numlib/LinearAlgebra/Matrix/KrylovDecomposition`, a corollary of the engine
`Matrix.IsArnoldiDecomposition.implicitQ`). ★'''
deps = ["Matrix.implicitQ_of_apply_eq_zero_real"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.4.2'

[[node]]
id = "theorem_7_4_2_essential"
kind = "theorem"
desc = '''The gist after Theorem 7.4.2: if `Qᵀ A Q = H` and `Zᵀ A Z = G` are unreduced upper Hessenberg and `Q`,
`Z` have the same first column, then `G = D⁻¹ H D` with `D = diag(±1, …, ±1)`. `Matrix.implicitQ_real`. ★'''
deps = ["Matrix.implicitQ_real", "GolubVanLoan.Chapter07.IsUnreduced"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.4.2'

