[[node]]
id = "algorithm_7_4_2"
kind = "definition"
desc = '''Algorithm 7.4.2 (Householder reduction to Hessenberg form): `noncomputable def algorithm_7_4_2 {M}
[Monad M] (rnd : ℝ → M ℝ) {n} (A : Matrix (Fin n) (Fin n) ℝ) : M (Matrix (Fin n) (Fin n) ℝ ×
List ((Fin n → ℝ) × ℝ))`. For `k = 0 .. n-3`, with `T_k` the index list `[k+1, …, n-1]`
(`List.finRange n` filtered, convention 10): `(v, β) ← houseOn rnd T_k (A.col k)` (chapter 5's `house` on
`A(k+1:n, k)`: `v` zero off `T_k`, `1` at `k+1`); `A(k+1:n, k:n) = (I - β v vᵀ) A(k+1:n, k:n)`
(`householderApplyLeft rnd v β T_k cols_k A`, `cols_k = [k, …, n-1]`);
`A(1:n, k+1:n) = A(1:n, k+1:n) (I - β v vᵀ)` (`householderApplyRight rnd v β (List.finRange n) T_k A`);
then store `v(k+2:n)` in `A(k+2:n, k)` (copies, not rounded; the book's remark — column `k` is never
read again); append `(v, β)` to the returned data. The data carry the `β` that `house` returned, so the
reflectors are never rebuilt from the stored vectors (convention 13; surface review Major 2: when
`house` returns `β = 0`, the rebuilt `I - 2 e₁e₁ᵀ` is not the identity it applied). ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.houseOn`,
`GolubVanLoan.Chapter05.householderApplyLeft`, `GolubVanLoan.Chapter05.householderApplyRight`,
`GolubVanLoan.Chapter05.algorithm_5_1_1` are not on main 55f7ad05 (convention 13: every update calls
chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is chapter 3's).'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.householderApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.2'

[[node]]
id = "algorithm_7_4_2_spec"
kind = "theorem"
desc = '''Algorithm 7.4.2 computes a Hessenberg decomposition: with `(A', data) := Id.run (algorithm_7_4_2 pure A)`,
`H := hessenbergPart A'` and `U₀ := GolubVanLoan.Chapter05.householderProduct data` (the reflectors built
from the **returned** `(v, β)`): `U₀ ∈ orthogonalGroup`, `H = U₀ᵀ * A * U₀`, `H.IsUpperHessenberg`,
`U₀ e₀ = e₀`, and `data` has length `n - 2` with `v_k` zero on the indices `≤ k`. Each factor
`1 - β_k v_k v_kᵀ` is orthogonal (`β_k = 0` or `β_k (v_kᵀ v_k) = 2`, `houseOn_spec`) and acts on the
coordinates `≥ k+1` only. Invariant: after step `k` the matrix is Hessenberg through its first `k+1`
columns (`houseOn_spec`: the reflector maps the tail of column `k` to `‖·‖₂ e_{k+1}`;
`householderApplyLeft_spec`, `householderApplyRight_spec`); the stored entries of column `k` are outside
every later update and outside `hessenbergPart`. **Not** stated with `β = 2/(vᵀv)` recomputed from the
stored vectors (the book's §5.1.6 retrieval): for `A = [[1,2,3],[4,5,6],[0,7,8]]`, `house` returns
`β = 0` at `k = 0` (`x = (4, 0)`), `H = A`, and the rebuilt `U₀ = diag(1, -1, 1)` has
`U₀ᵀ A U₀ ≠ H` (surface review Major 2). Convention 11: the bare conjugation `∃ Q orthogonal, H = Qᵀ A Q`
is `algorithm_7_4_2_rounding` at `FloatingPoint.RoundingModel.exact` (`round_exact`, `u = 0`, so
`E = 0`); the identification `Q = householderProduct data` and `U₀ e₀ = e₀` are not in the bridge's
conclusion and are proved by the invariant. ★★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.householderProduct`,
`GolubVanLoan.Chapter05.houseOn_spec`, `GolubVanLoan.Chapter05.householderApplyLeft_spec`,
`GolubVanLoan.Chapter05.householderApplyRight_spec` are not on main 55f7ad05 (convention 13: every
update calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is
chapter 3's); it needs `algorithm_7_4_2` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2", "GolubVanLoan.Chapter07.hessenbergPart", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "GolubVanLoan.Chapter05.householderApplyRight_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.2'

[[node]]
id = "algorithm_7_4_2_rounds"
kind = "theorem"
desc = '''The bridge of Algorithm 7.4.2 (convention 12): for `fp : FloatingPoint.RoundingModel ℝ` with
`fp.IsIdempotent` (`house`'s tail sum and the application dot products start from `0`, convention 6)
and `((18 n + 31 : ℕ) : ℝ) * fp.u < 1`, every run `(A', data) ∈ (algorithm_7_4_2 fp.round A).run` has a
sequence `Â : ℕ → Matrix (Fin n) (Fin n) ℝ` with `Â (n - 2) = hessenbergPart A'` and
`FloatingPoint.RoundsHessenbergReducePert fp (18 n + 31) A Â` — `Â k` is the run's array after `k`
steps with the stored vectors in columns `< k` replaced by `0` (they are never read again, so the zeroed
arrays follow the same arithmetic). Per step, on the subtype `T_k = {i // k + 1 ≤ i}` of the active rows:
`GolubVanLoan.Chapter05.houseOn_rounds` gives `FloatingPoint.RoundsHouseholderVectorParlett` for the tail
column, hence `IsReflectorPert` of order `18 |T_k| + 31 ≤ 18 n + 31`
(`FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert`, raised to the common order by
`IsRelPert.mono`); `householderApplyLeft_rounds` / `householderApplyRight_rounds` give the column and
row sweeps as `RoundsHouseholderApplyScaled` on `T_k`; the rows and columns outside `T_k` are untouched
exactly, as `RoundsHessenbergStepPert` requires. Unfolding by `SetM.forall_mem_run_foldlM_finRange`. ★★
(~150 lines)

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.houseOn_rounds`,
`GolubVanLoan.Chapter05.householderApplyLeft_rounds`,
`GolubVanLoan.Chapter05.householderApplyRight_rounds` are not on main 55f7ad05 (convention 13: every
update calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is
chapter 3's); it needs `algorithm_7_4_2` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2", "GolubVanLoan.Chapter07.hessenbergPart", "GolubVanLoan.Chapter05.houseOn_rounds", "GolubVanLoan.Chapter05.householderApplyLeft_rounds", "GolubVanLoan.Chapter05.householderApplyRight_rounds", "FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert", "FloatingPoint.RoundsHessenbergReducePert", "FloatingPoint.RoundingModel.IsIdempotent", "SetM.forall_mem_run_foldlM_finRange"]
source = 'Golub–Van Loan, Matrix Computations, §7.4.3'

[[node]]
id = "algorithm_7_4_2_rounding"
kind = "theorem"
desc = '''§7.4.3, Wilkinson's backward error of the Hessenberg reduction, rigorous: for
`fp : FloatingPoint.RoundingModel ℝ` with `fp.IsIdempotent`, `K = 18 n + 31`,
`((3K + n + 3 : ℕ) : ℝ) * fp.u < 1` and `2 (n - 2) ε < 1` for `ε = 3 γ_{3K+n+3}`, every run
`(A', data) ∈ (algorithm_7_4_2 fp.round A).run` satisfies `hessenbergPart A' = Qᵀ (A + E) Q` with `Q`
orthogonal, `hessenbergPart A'` upper Hessenberg, and `‖E‖_F ≤ γ_{2(n-2)}(ε) ‖A‖_F` — the book's
`‖E‖_F ≤ c n² u ‖A‖_F` with the constant explicit (`γ_{2(n-2)}(ε) ≈ 6 (55 n + 96) (n - 2) u`).
`algorithm_7_4_2_rounds` and the backbone `FloatingPoint.exists_roundsHessenbergReducePert_eq`
(Higham's Theorem 19.4 route, stated once for every reflector formula). The constants are the
relational calculus's, not Wilkinson's. ★

Blocked: needs `algorithm_7_4_2_rounds` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_2_rounds", "FloatingPoint.exists_roundsHessenbergReducePert_eq"]
source = 'Golub–Van Loan, Matrix Computations, §7.4.3'

