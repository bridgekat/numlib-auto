[[node]]
id = "theorem_7_4_4"
kind = "theorem"
desc = '''Theorem 7.4.4: if `λ ∈ ℂ` is an eigenvalue of an unreduced upper Hessenberg `H : Matrix (Fin n) (Fin n) ℝ`,
its geometric multiplicity is `1`: `finrank ℂ (eigenspace (toLin' H.complexify) λ) = 1`. The book's proof
("`rank(H - λI) ≥ n - 1` because the first `n - 1` columns are independent") is
`Matrix.IsUnreducedUpperHessenberg.finrank_eigenspace_le_one` after `IsUnreducedUpperHessenberg.map`
(the book writes `A - λI` for `H - λI` in the proof). ★'''
deps = ["Matrix.IsUnreducedUpperHessenberg.finrank_eigenspace_le_one", "Matrix.IsUnreducedUpperHessenberg.map", "GolubVanLoan.Chapter07.IsUnreduced"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.4.4'

[[node]]
id = "companion"
kind = "definition"
desc = '''(7.4.4), the companion matrix in the book's layout: for `c : Fin n → ℝ`, `companion c` has ones on the
