the backbone's `Matrix.companion p n` (first-row layout of Quarteroni–Sacco–Saleri) conjugated by the
reversal permutation, `p = X^n + ∑ c_i X^i`, so that `Matrix.charpoly_companion` transfers
(`Matrix.charpoly_transpose`, `Matrix.charpoly_reindex`). ★'''
deps = ["Matrix.companion", "Matrix.charpoly_companion"]
