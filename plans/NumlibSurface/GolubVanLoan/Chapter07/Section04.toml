[[node]]
id = "equation_7_4_4"
kind = "theorem"
desc = '''§7.4.6 with (7.4.4): if the Krylov matrix `K = K(A, x, n)` is nonsingular and `K c = -A^n x`, then
`A K = K (companion c)`, and `det(z I - companion c) = c₀ + c₁ z + ⋯ + c_{n-1} z^{n-1} + z^n` for all `z`
(`(companion c).charpoly = X^n + ∑ C (c i) X^i`); hence `K⁻¹ A K = companion c` displays `A`'s
characteristic polynomial. `A K e_j = A^{j+1} x = K e_{j+1}` for `j < n-1` and `A K e_{n-1} = A^n x = -K c`. ★★'''
deps = ["GolubVanLoan.Chapter07.companion", "GolubVanLoan.Chapter07.krylovMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.4.4)'

