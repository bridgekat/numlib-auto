[[node]]
id = "algorithm_7_4_1"
kind = "definition"
desc = '''Algorithm 7.4.1 (Hessenberg QR step): for `k = 0 .. n-2`: `(c_k, s_k) ← givens(H k k, H (k+1) k)`
(chapter 5's Algorithm 5.1.3), `H([k,k+1], k:n-1) = [c s; -s c]ᵀ H([k,k+1], k:n-1)`
(`GolubVanLoan.Chapter05.givensApplyLeft rnd k (k+1) c s cols H`, `cols` the indices `≥ k`); then for
`k = 0 .. n-2`: `H(0:k+1, [k,k+1]) = H(0:k+1, [k,k+1]) [c s; -s c]` (`givensApplyRight`, `rows` the
indices `≤ k+1`). State: the matrix and the list of rotations. `noncomputable def algorithm_7_4_1 {M}
[Monad M] (rnd : ℝ → M ℝ) {n} (H : Matrix (Fin n) (Fin n) ℝ) : M (Matrix (Fin n) (Fin n) ℝ)`; elaborates
in the prototype (`notes/gvl/ch07/proto/Shapes.lean`). ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.givensApplyLeft`,
`GolubVanLoan.Chapter05.givensApplyRight`, `GolubVanLoan.Chapter05.algorithm_5_1_3` are not on main
55f7ad05 (convention 13: every update calls chapter 5's shared helpers, which the chapter 5 surface
adds; back substitution is chapter 3's).'''
deps = ["GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.1'

[[node]]
id = "algorithm_7_4_1_spec"
kind = "theorem"
desc = '''Algorithm 7.4.1 computes a QR step: for `H` upper Hessenberg, `H' = Id.run (algorithm_7_4_1 pure H)`
satisfies `Matrix.IsShiftedQrStep 0 H H'` with an orthogonal `Q = G₁ ⋯ G_{n-1}`
(`G_k = GolubVanLoan.Chapter05.givensRotation k (k+1) c_k s_k`) that is upper Hessenberg ("It is easy to
confirm that `Q` is upper Hessenberg"), and `H'` is upper Hessenberg. Statement (as in the prototype):
`∃ Q ∈ orthogonalGroup, ∃ R, R.IsUpperTriangular ∧ H = Q * R ∧ H' = R * Q ∧ Q.IsUpperHessenberg` (and
`H'.IsUpperHessenberg` by `IsUpperTriangular.mul_isUpperHessenberg`). Proof: invariant of the first loop —
after step `k` the matrix is `Gₖᵀ ⋯ G₁ᵀ H`, upper triangular in columns `≤ k` and Hessenberg beyond
(`GolubVanLoan.Chapter05.algorithm_5_1_3_spec` zeroes `H (k+1) k`; `givensApplyLeft_spec` on the columns
`≥ k`, the columns `< k` having zeros in rows `k, k+1`); the second loop multiplies by `G₁ ⋯ G_{n-1}` on
the right (`givensApplyRight_spec`, the restriction to rows `0:k+1` being harmless because `R` is upper
triangular). No rounding analysis in the book. ★★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.givensApplyLeft_spec`,
`GolubVanLoan.Chapter05.givensApplyRight_spec`, `GolubVanLoan.Chapter05.givensRotation`,
`GolubVanLoan.Chapter05.algorithm_5_1_3_spec` are not on main 55f7ad05 (convention 13: every update
calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is chapter
3's); it needs `algorithm_7_4_1` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_4_1", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec", "GolubVanLoan.Chapter05.givensRotation", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "Matrix.IsShiftedQrStep", "Matrix.IsUpperTriangular.mul_isUpperHessenberg"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.4.1'

