[[node]]
id = "departureFromNormality_eq"
kind = "theorem"
desc = '''§7.1.3: `‖N‖_F` is independent of the Schur decomposition: if `Qᴴ A Q = diagonal d + N` with `Q`
unitary and `N` strictly upper triangular, then `‖N‖_F² = ‖A‖_F² - ∑ i, ‖d i‖² = departureFromNormality A ^ 2`.
Unitary invariance of the Frobenius norm (`Matrix.frobenius_norm_unitary_mul_mul_unitary`), orthogonality
of the diagonal and strictly upper parts in the Frobenius inner product, and `d` listing the roots
(`Matrix.charpoly_of_isUpperTriangular`). ★'''
deps = ["GolubVanLoan.Chapter07.departureFromNormality", "Matrix.frobenius_norm_unitary_mul_mul_unitary"]
source = 'Golub–Van Loan, Matrix Computations, §7.1.3'

