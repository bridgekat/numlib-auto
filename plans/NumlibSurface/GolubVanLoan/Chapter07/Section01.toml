[[node]]
id = "theorem_7_1_6"
kind = "theorem"
desc = '''Theorem 7.1.6 (block diagonal decomposition) (7.1.9)–(7.1.10): if `Qᴴ A Q = T` with `Q` unitary and
`T` block upper triangular for a monotone block index `b : Fin n → Fin q` (square diagonal blocks
`Tᵢᵢ = T.toBlock (b · = i) (b · = i)`), and `spectrum ℂ Tᵢᵢ ∩ spectrum ℂ Tⱼⱼ = ∅` for `i ≠ j`, then there
is a nonsingular `Y` with `(Q Y)⁻¹ A (Q Y) = diag(T₁₁, …, T_qq)` (the block diagonal part of `T`).
The book prints the hypothesis as `λ(T_ij) ∩ λ(T_jj) = ∅` — a misprint for `λ(T_ii)` (report, Doubts).
Backbone `Matrix.exists_isUnit_conj_eq_blockDiagonalPart` (the book's proof is P7.1.2, induction with
Lemma 7.1.5). ★'''
deps = ["Matrix.exists_isUnit_conj_eq_blockDiagonalPart"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.1.6'

[[node]]
id = "corollary_7_1_7"
kind = "theorem"
desc = '''Corollary 7.1.7 (7.1.11): for `A : Matrix (Fin n) (Fin n) ℂ` there are distinct `λ : Fin q → ℂ`,
sizes `n_i` with `∑ n_i = n`, strictly upper triangular `N_i : Matrix (Fin n_i) (Fin n_i) ℂ` and a
nonsingular `X` with `X⁻¹ A X = blockDiagonal' fun i => λ i • 1 + N i` (reindexed `(Σ i, Fin n_i) ≃ Fin n`).
From the grouped Jordan form `Matrix.exists_conj_blockDiagonal'_jordanForm` (each outer block is
`ν_i • 1 + jordanForm e 0`, strictly upper triangular part `jordanForm e 0`) — a shorter route than
the book's Theorem 7.1.6 + ordered Schur. ★★'''
deps = ["Matrix.exists_conj_blockDiagonal'_jordanForm"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 7.1.7'

[[node]]
id = "algebraicMultiplicity"
kind = "definition"
desc = '''§7.1.4, Definition: the algebraic multiplicity `A.charpoly.rootMultiplicity λ` and the geometric
multiplicity `Module.finrank ℂ (Module.End.eigenspace (toLin' A) λ)` (`geometricMultiplicity`, same
node); `λ` is *simple* if the algebraic multiplicity is `1`, *defective* if the geometric multiplicity
is smaller, and `A` is *defective* if it has a defective eigenvalue (`IsDefective`); nondefective =
diagonalizable (Corollary 7.1.8). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §7.1.4, Definition'

