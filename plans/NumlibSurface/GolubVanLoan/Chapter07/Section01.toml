namespace = "GolubVanLoan.Chapter07"
desc = '''
§7.1, properties and decompositions: the spectrum and its attributes (spectral radius and abscissa,
numerical radius and range), invariant subspaces, block triangular decoupling (Lemma 7.1.1), the
unitary reductions (Lemma 7.1.2, the Schur decomposition 7.1.3 with any order of the diagonal, the
normal matrices 7.1.4, the departure from normality), the nonunitary ones (the Sylvester operator
7.1.5, block diagonalization 7.1.6, Corollaries 7.1.7–7.1.8, the Jordan decomposition 7.1.9 with its
uniqueness), the example (7.1.13), and singular values against eigenvalues (§7.1.6).

Complex throughout: `A : Matrix (Fin n) (Fin n) ℂ`, `λ(A) = spectrum ℂ A` (Mathlib's spectrum of a
matrix in the algebra `Matrix (Fin n) (Fin n) ℂ`), eigenvalues with multiplicity `A.charpoly.roots`,
unitary `Q ∈ Matrix.unitaryGroup (Fin n) ℂ` with `Qᴴ = star Q`. Block partitions `[T₁₁ T₁₂; 0 T₂₂]`
with `T₁₁` `p × p` are `Matrix.fromBlocks` on `Fin p ⊕ Fin q`, reindexed by `finSumFinEquiv` where the
book's matrix is `n × n`, `n = p + q`.

Backbone: `Numlib/LinearAlgebra/Matrix/{Schur,Jordan,Similar,Sylvester}`, `Numlib/Eigen/{Normal,NumericalRange}`.
'''

[[node]]
id = "det_eq_prod_eigenvalues"
kind = "theorem"
desc = '''§7.1.1: `det A = λ₁ ⋯ λ_n` and `tr A = λ₁ + ⋯ + λ_n` for `A : Matrix (Fin n) (Fin n) ℂ`, the
eigenvalues counted with multiplicity: `A.det = A.charpoly.roots.prod` and
`A.trace = A.charpoly.roots.sum` (Mathlib `Matrix.det_eq_prod_roots_charpoly`,
`Matrix.trace_eq_sum_roots_charpoly`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §7.1.1'

[[node]]
