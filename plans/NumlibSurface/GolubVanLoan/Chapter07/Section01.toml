source = 'Golub–Van Loan, Matrix Computations, Lemma 7.1.2'

[[node]]
id = "theorem_7_1_3"
kind = "theorem"
desc = '''Theorem 7.1.3 (Schur decomposition) (7.1.7): for `A : Matrix (Fin n) (Fin n) ℂ` there is a unitary
`Q` with `Qᴴ A Q = D + N`, `D = diagonal λ`, `N` strictly upper triangular (i.e. `Qᴴ A Q` upper
triangular with diagonal `λ`), and "Q can be chosen so that the eigenvalues appear in any order":
for every `λ : Fin n → ℂ` with `A.charpoly = ∏ i, (X - C (λ i))` such a `Q` exists with
`(Qᴴ A Q) i i = λ i`. Backbone `Matrix.exists_unitary_conj_upperTriangular_diag_eq`
(`Matrix.exists_unitary_conj_upperTriangular` is the unordered form). ★'''
deps = ["Matrix.exists_unitary_conj_upperTriangular_diag_eq", "Matrix.exists_unitary_conj_upperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.1.3'

[[node]]
id = "equation_7_1_8"
kind = "theorem"
desc = '''(7.1.8) and the paragraph after it: if `Qᴴ A Q = T` is upper triangular (a Schur decomposition,
`q_k = Q.col k`), then (a) `A *ᵥ q_k = T k k • q_k + ∑ i < k, T i k • q_i` (columns of `A Q = Q T`);
(b) each `S_k = span {q_0, …, q_k}` is `A`-invariant (`LinearMap.exists_orthonormalBasis_forall_mem_span`
is the operator form); (c) the spectrum of `Q_kᴴ A Q_k` (the leading `k × k` block of `T`) is
`{T i i | i < k}`; (d) `q_k` is an eigenvector of `A` iff column `k` of the strictly upper part of `T`
is zero. ★'''
deps = ["LinearMap.exists_orthonormalBasis_forall_mem_span"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.1.8)'

[[node]]
id = "corollary_7_1_4"
kind = "theorem"
desc = '''Corollary 7.1.4: `A` is normal (`Aᴴ A = A Aᴴ`, `IsStarNormal A`) iff `∃ Q ∈ unitaryGroup, ∃ d,
Qᴴ A Q = diagonal d`. Backbone `Matrix.IsStarNormal.spectral_theorem` (the book's route through P7.1.1,
"an upper triangular normal matrix is diagonal", is not needed). ★'''
deps = ["Matrix.IsStarNormal.spectral_theorem"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 7.1.4'

[[node]]
id = "departureFromNormality"
kind = "definition"
desc = '''§7.1.3, Definition (departure from normality): `departureFromNormality A = √(‖A‖_F² - ∑ i, ‖λ_i‖²)`,
`λ` the roots of `A.charpoly` as a multiset (`(A.charpoly.roots.map (‖·‖ ^ 2)).sum`), Frobenius norm
