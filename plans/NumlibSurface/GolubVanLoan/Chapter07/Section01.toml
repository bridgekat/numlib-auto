[[node]]
id = "spectrum_subset_of_mul_eq_mul"
kind = "theorem"
desc = '''§7.1.1, invariant subspaces from `A X = X B` (`X : Matrix (Fin n) (Fin k) ℂ`, `B : Matrix (Fin k)
(Fin k) ℂ`): (a) the column space of `X` is `A`-invariant,
`LinearMap.range (toLin' X) ∈ (toLin' A).invtSubmodule` (Mathlib's invariant submodules);
(b) `B *ᵥ y = λ • y → A *ᵥ (X *ᵥ y) = λ • (X *ᵥ y)`; (c) if `X` has full column rank
(`X.rank = k`) then `spectrum ℂ B ⊆ spectrum ℂ A`; (d) if `k = n` and `X` is nonsingular then
`spectrum ℂ A = spectrum ℂ B` (`Matrix.IsSimilar.charpoly_eq`). ★'''
deps = ["Matrix.IsSimilar.charpoly_eq"]
source = 'Golub–Van Loan, Matrix Computations, §7.1.1'

[[node]]
id = "lemma_7_1_1"
kind = "theorem"
desc = '''Lemma 7.1.1: for `T = fromBlocks T₁₁ T₁₂ 0 T₂₂` (`T₁₁ : Matrix (Fin p) (Fin p) ℂ`,
`T₂₂ : Matrix (Fin q) (Fin q) ℂ`), `spectrum ℂ T = spectrum ℂ T₁₁ ∪ spectrum ℂ T₂₂`, and with
multiplicity `T.charpoly = T₁₁.charpoly * T₂₂.charpoly` (Mathlib `Matrix.charpoly_fromBlocks_zero₂₁`;
the book's "same cardinality" argument is the multiset statement). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Lemma 7.1.1'

[[node]]
id = "lemma_7_1_2"
kind = "theorem"
desc = '''Lemma 7.1.2: for `A : Matrix (Fin (p + q)) (Fin (p + q)) ℂ`, `B : Matrix (Fin p) (Fin p) ℂ`,
`X : Matrix (Fin (p + q)) (Fin p) ℂ` with `A * X = X * B` and `X.rank = p` (7.1.5), there is a unitary
`Q` with `Qᴴ A Q = fromBlocks T₁₁ T₁₂ 0 T₂₂` (after `reindex finSumFinEquiv.symm`) (7.1.6) and
