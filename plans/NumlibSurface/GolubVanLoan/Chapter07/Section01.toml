[[node]]
id = "dense_diagonalizable"
kind = "theorem"
desc = '''§7.1.5: "The set of n-by-n diagonalizable matrices is dense in ℂ^{n×n}": `Dense {A : Matrix (Fin n)
(Fin n) ℂ | ∃ X, IsUnit X ∧ ∃ d, X⁻¹ * A * X = diagonal d}`. Schur form `Qᴴ A Q = T`, perturb the
diagonal of `T` by arbitrarily small amounts to make the diagonal entries distinct; distinct eigenvalues
give a basis of eigenvectors (`Matrix.isSimilar_diagonal_iff_exists_basis_eigenvectors`,
`Module.End.eigenvectors_linearIndependent`). The book's P7.1.5. ★★'''
deps = ["GolubVanLoan.Chapter07.theorem_7_1_3", "Matrix.isSimilar_diagonal_iff_exists_basis_eigenvectors"]
source = 'Golub–Van Loan, Matrix Computations, §7.1.5'

[[node]]
id = "equation_7_1_13"
kind = "theorem"
desc = '''(7.1.13): for `0 < ε`, every `X` diagonalizing `A = !![1 + ε, 1; 0, 1 - ε]` has
`κ₂(X) ≥ 1 / (2 ε)` — the rigorous reading of "a 2-norm condition of order `1/ε`" (a matching upper
bound `κ₂(X) ≤ C/ε` holds for the column-normalized `X`, and is stated as a clause). If `X⁻¹ A X` is
diagonal, the first column `x` of `X` and first row `yᴴ` of `X⁻¹` are right/left eigenvectors with
`yᴴ x = 1`, so `κ₂(X) = ‖X‖ ‖X⁻¹‖ ≥ ‖x‖ ‖y‖ ≥ 1/s` with `s = |ŷᴴ x̂| = 2ε/√(1 + 4ε²)` for the unit
eigenvectors `x̂ = e₁`, `ŷ = (2ε, 1)/√(1 + 4ε²)` of `λ = 1 + ε`. ★★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (7.1.13)'

