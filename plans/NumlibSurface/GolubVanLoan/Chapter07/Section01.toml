kind = "definition"
desc = '''(7.1.1): `spectralRadius A = sSup ((‖·‖) '' spectrum ℂ A)` (`0` for `n = 0`), with the bridge
`spectralRadius_eq : spectralRadius A = (_root_.spectralRadius ℂ A).toReal` (Mathlib's
`ℝ≥0∞`-valued spectral radius in the Banach algebra of matrices; any matrix norm instance; finite
spectrum so the supremum is a maximum). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (7.1.1)'

[[node]]
id = "spectralAbscissa"
kind = "definition"
desc = '''(7.1.2): `spectralAbscissa A = sSup (Complex.re '' spectrum ℂ A)`, a maximum for `n ≥ 1`
(`spectralAbscissa_mem`: `∃ λ ∈ spectrum ℂ A, λ.re = spectralAbscissa A`, finite nonempty
spectrum). ★'''
deps = []
