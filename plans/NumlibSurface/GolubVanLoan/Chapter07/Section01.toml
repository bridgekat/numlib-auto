`λ_j - λ_i ≠ 0` making the other blocks invertible. ★★'''
deps = ["GolubVanLoan.Chapter07.corollary_7_1_7", "GolubVanLoan.Chapter07.algebraicMultiplicity", "Matrix.IsSimilar.charpoly_eq", "Matrix.IsSimilar.finrank_ker_mulVecLin_eq"]
