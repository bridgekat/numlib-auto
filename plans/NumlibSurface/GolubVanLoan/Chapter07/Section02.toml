[[node]]
id = "theorem_7_2_4"
kind = "theorem"
desc = '''Theorem 7.2.4 (Stewart): let `Qᴴ A Q = [T₁₁ T₁₂; 0 T₂₂]` (7.2.3) with `Q = [Q₁ Q₂]` unitary (7.2.4),
`T₁₁` of size `r`, and for `E` let `Qᴴ E Q = [E₁₁ E₁₂; E₂₁ E₂₂]`. If `sep(T₁₁, T₂₂) > 0` and
`‖E‖_F (1 + 5 ‖T₁₂‖_F / sep) ≤ sep / 5`, there is `P : Matrix (Fin (n - r)) (Fin r) ℂ` with
`‖P‖_F ≤ 4 ‖E₂₁‖_F / sep` such that the columns of `Q̃₁ = (Q₁ + Q₂ P)(I + Pᴴ P)^{-1/2}` are an
orthonormal basis of an `(A + E)`-invariant subspace. The inverse square root is
`(CFC.sqrt (1 + Pᴴ * P))⁻¹` (positive definite, scoped `Matrix.Norms.L2Operator` for the C*-algebra
instance); orthonormality is `Q̃₁ᴴ Q̃₁ = S⁻¹ (I + Pᴴ P) S⁻¹ = I`. Backbone
`Matrix.exists_invariant_graph_of_sep` in the coordinates of `Q` (`Frobenius` unitary invariance of
`E`'s blocks). ★★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); needs the CFC
inverse square root `(CFC.sqrt (1 + Pᴴ P))⁻¹` and its orthonormality identity, plus the transport of
`Matrix.exists_invariant_graph_of_sep` through `Q` with Frobenius invariance of the blocks of `E`.
Estimate ~200 lines.'''
deps = ["Matrix.exists_invariant_graph_of_sep", "Matrix.sep_unitary_conj", "GolubVanLoan.Chapter07.equation_7_2_5"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.2.4'

[[node]]
id = "equation_7_2_6"
kind = "theorem"
desc = '''(7.2.6): for `P : Matrix (Fin k) (Fin r) ℂ`, `‖P (I + Pᴴ P)^{-1/2}‖₂ ≤ ‖P‖₂ ≤ ‖P‖_F`. Singular
values of `P (I + PᴴP)^{-1/2}` are `σ_i/√(1 + σ_i²) ≤ σ_i` (SVD `Matrix.exists_svd`, or the CFC:
`(P S⁻¹)ᴴ (P S⁻¹) = S⁻¹ Pᴴ P S⁻¹ ≤ Pᴴ P` in the Loewner order since `S⁻² ≤ I` commutes with `PᴴP`),
and `Matrix.l2_opNorm_le_frobenius_norm`. ★★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); needs the
Loewner-order argument `S⁻¹ Pᴴ P S⁻¹ ≤ Pᴴ P` for `S = (1 + Pᴴ P)^{1/2}` (commuting CFC functions of
`Pᴴ P`). Estimate ~100 lines.'''
deps = ["Matrix.l2_opNorm_le_frobenius_norm"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.2.6)'

[[node]]
id = "corollary_7_2_5"
kind = "theorem"
desc = '''Corollary 7.2.5: under the hypotheses of Theorem 7.2.4, `dist(ran Q₁, ran Q̃₁) ≤ 4 ‖E₂₁‖_F / sep(T₁₁, T₂₂)`,
with `dist = Submodule.gap` of the column spaces in `EuclideanSpace ℂ (Fin n)`. Backbone
`Matrix.gap_range_fromRows_le` (`gap ≤ ‖P‖₂ ≤ ‖P‖_F`) transported by `Q`
(`Submodule.gap_map_linearIsometryEquiv`). The book's "the required distance is the 2-norm of
`Q₂ᴴ Q̃₁`" is chapter 2's Theorem 2.5.1; the backbone route avoids it. ★

Blocked: needs Theorem 7.2.4 and (7.2.6) of this section, both open.'''
deps = ["GolubVanLoan.Chapter07.theorem_7_2_4", "Matrix.gap_range_fromRows_le", "Submodule.gap_map_linearIsometryEquiv", "GolubVanLoan.Chapter07.equation_7_2_6"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 7.2.5'

