source = 'Golub–Van Loan, Matrix Computations, §7.2.5'

[[node]]
id = "corollary_7_2_6"
kind = "theorem"
desc = '''Corollary 7.2.6: with `Q = [q₁ | Q₂]` unitary, `Qᴴ A Q = [λ vᴴ; 0 T₂₂]`, `Qᴴ E Q = [ε γᴴ; δ E₂₂]`,
`σ = σ_min(T₂₂ - λ I) > 0` and `‖E‖_F (1 + 5 ‖v‖₂ / σ) ≤ σ / 5`, there is `p` with `‖p‖₂ ≤ 4 ‖δ‖₂ / σ`
such that `q̃₁ = (q₁ + Q₂ p)/√(1 + pᴴ p)` is a unit eigenvector of `A + E`, and
`dist(span{q₁}, span{q̃₁}) ≤ 4 ‖δ‖₂ / σ`. `r = 1` in Theorem 7.2.4 and Corollary 7.2.5 with
`sep_one_eq_sigmaMin` (a one-dimensional invariant subspace is spanned by an eigenvector). ★

Blocked: needs `sep_one_eq_sigmaMin` (itself blocked on `Matrix.sep_eq_iInf_singularValues`) and
Theorem 7.2.4 / Corollary 7.2.5 of this section.'''
deps = ["GolubVanLoan.Chapter07.theorem_7_2_4", "GolubVanLoan.Chapter07.corollary_7_2_5", "GolubVanLoan.Chapter07.sep_one_eq_sigmaMin"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 7.2.6'
