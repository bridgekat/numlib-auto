[[node]]
id = "theorem_7_2_2"
kind = "theorem"
desc = '''Theorem 7.2.2 (Bauer–Fike): for `1 ≤ p` (`p : ℝ≥0∞`), `X⁻¹ A X = diagonal λ` and
`μ ∈ spectrum ℂ (A + E)`: `∃ i, ‖λ i - μ‖ ≤ condNumberLp p X * lpOpNorm p E` (the book's
`min_{λ ∈ λ(A)} |λ - μ| ≤ κ_p(X) ‖E‖_p`). `Matrix.bauer_fike_lpOpNorm` with `A = X D X⁻¹`. ★

Blocked: the backbone node `Matrix.bauer_fike_lpOpNorm` (Eigen/Perturbation append) is still open
on main 55f7ad05 (only the 2-norm `Matrix.bauer_fike` exists). A one-line instance once it lands.'''
deps = ["Matrix.bauer_fike_lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.2.2'

