kind = "theorem"
desc = '''(7.7.6), the linearization identity: for `A₀, …, A_d` (`d ≥ 1`) and `P_k(λ) = A_k + λ A_{k+1} + ⋯ + λ^{d-k} A_d`,
the block matrices `S(λ)` (identity blocks on the diagonal, `-λ I` on the superdiagonal) and `T(λ)`
(first block row `[0 ⋯ 0 I]`, `-I` on the subdiagonal, last block column `[I; P₁(λ); …; P_{d-1}(λ)]`)
satisfy `S(λ) diag(P(λ), I_{(d-1)n}) T(λ) = L(λ)` with `L(λ)` the companion-form pencil (first block row
`[λI 0 ⋯ A₀]`, then `[-I λI ⋯ A₁]`, …, last `[0 ⋯ -I, A_{d-1} + λ A_d]`), and `det S(λ) = 1`,
`det T(λ) = ±1` for every `λ`: `L(λ)` is a linearization of `P(λ)`. Stated pointwise in `λ : ℂ` on
`Matrix (Fin d × Fin n) (Fin d × Fin n) ℂ`; induction on `d` along the book's two displayed steps. ★★'''
