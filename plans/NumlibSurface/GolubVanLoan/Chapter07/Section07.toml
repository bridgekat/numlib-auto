[[node]]
id = "qzZeroChase"
kind = "definition"
desc = '''§7.7.5, zero chasing (unnumbered; needed by Algorithm 7.7.3's "if `B₂₂` is singular, zero
`a_{n-q, n-q-1}`"): for a Hessenberg–triangular `(A, B)` with `b_kk = 0`, the rotations the book displays —
for `j = k .. n-2`: a row rotation in rows `(j, j+1)` zeroing `b_{j+1,j+1}` (moving the zero down the
diagonal), and a column rotation in columns `(j-1, j)` restoring `A`'s Hessenberg form — ending with a
column rotation in `(n-2, n-1)` that zeroes `a_{n-1,n-2}`. Stated on a window `w` of consecutive indices
(the unreduced block of Algorithm 7.7.3; the book's display is `w = List.finRange n`), with chapter 5's
`givensApplyLeft`/`givensApplyRight` on index lists and `givens` (Algorithm 5.1.3); returns
`(A, B, Q, Z)`. ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.givensApplyLeft`,
`GolubVanLoan.Chapter05.givensApplyRight`, `GolubVanLoan.Chapter05.algorithm_5_1_3` are not on main
55f7ad05 (convention 13: every update calls chapter 5's shared helpers, which the chapter 5 surface
adds; back substitution is chapter 3's).'''
deps = ["GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_3"]
source = 'Golub–Van Loan, Matrix Computations, §7.7.5'

[[node]]
id = "qzZeroChase_spec"
kind = "theorem"
desc = '''§7.7.5, "This zero-chasing technique is perfectly general and can be used to zero `a_{n,n-1}` regardless
of where the zero appears along B's diagonal": for Hessenberg–triangular `(A, B)` with `b_kk = 0`, the
output is `(Qᵀ A Z, Qᵀ B Z)`, still Hessenberg–triangular, with `(Qᵀ A Z)_{n,n-1} = 0` and `(Qᵀ B Z)_{nn} = 0`
(`Q`, `Z` orthogonal). ★★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.givensApplyLeft_spec`,
