[[node]]
id = "algorithm_7_7_3"
kind = "definition"
desc = '''Algorithm 7.7.3 (QZ algorithm, Moler–Stewart): `algorithm_7_7_3 rnd ε A B fuel` (fuel last, convention 3)
returns `(Q, Z, T, S, done)`: `algorithm_7_7_1`; then at most `fuel` passes of: zero every `a_{i,i-1}` with
`|a_{i,i-1}| ≤ fl(ε · fl(|a_{i-1,i-1}| + |a_ii|))` (right side rounded, `|·|` and the comparison exact —
convention 1); find the largest `q` and smallest `p` with `A₃₃` quasi-triangular and `A₂₂` unreduced
