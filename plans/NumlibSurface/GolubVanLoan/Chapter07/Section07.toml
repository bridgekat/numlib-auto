[[node]]
id = "algorithm_7_7_1"
kind = "definition"
desc = '''Algorithm 7.7.1 (Hessenberg–triangular reduction), real `A`, `B`: `B = QR` by chapter 5's Algorithm 5.2.1
(Householder QR; `B` overwritten by `R` above the diagonal and the Householder vectors below, and the
returned `β`; its reflector data are `GolubVanLoan.Chapter05.storedReflectors B' β` — the stored vectors
with the `β` that `house` computed), `A` overwritten by
`Qᵀ A` (each `(v, β)` of the data applied in order with `GolubVanLoan.Chapter05.householderApplyLeft`,
rows the support of `v`, all columns — never rebuilt from the stored vectors), `B` by its upper
triangular part; then for `j = 0 .. n-3`, `i = n-1` down to `j+2`: `(c, s) ← givens(A (i-1) j, A i j)`,
`A(i-1:i, j:n-1) = [c s; -s c]ᵀ A(i-1:i, j:n-1)`, `B(i-1:i, i-1:n-1) = [c s; -s c]ᵀ B(i-1:i, i-1:n-1)`
(`givensApplyLeft` on the column lists `[j, …]`, `[i-1, …]`), `(c, s) ← givens(-B i i, B i (i-1))` (the
negation exact), `B(0:i, i-1:i) = B(0:i, i-1:i) [c s; -s c]`, `A(0:n-1, i-1:i) = A(0:n-1, i-1:i) [c s; -s c]`
(`givensApplyRight` on the row lists `[0, …, i]`, all rows). Returns `(A, B)`. ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.algorithm_5_2_1`,
`GolubVanLoan.Chapter05.algorithm_5_1_3`, `GolubVanLoan.Chapter05.givensApplyLeft`,
`GolubVanLoan.Chapter05.givensApplyRight`, `GolubVanLoan.Chapter05.householderApplyLeft`,
`GolubVanLoan.Chapter05.storedReflectors` are not on main 55f7ad05 (convention 13: every update
calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is chapter
3's).'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_2_1", "GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.storedReflectors"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.1'

[[node]]
id = "algorithm_7_7_1_spec"
kind = "theorem"
desc = '''Algorithm 7.7.1, exact semantics: `(A', B') = Id.run (algorithm_7_7_1 pure A B)` satisfies
`A' = Qᵀ A Z`, `B' = Qᵀ B Z` with `Q`, `Z` orthogonal, `A'` upper Hessenberg and `B'` upper triangular.
Invariants: after the QR step `B` is upper triangular and `A` is `(householderProduct data)ᵀ A` (`GolubVanLoan.Chapter05.algorithm_5_2_1_spec`, `householderApplyLeft_spec`);
each row rotation zeroes `A i j` and creates at most the fill-in `B i (i-1)`, which the column rotation
removes (`givens(-b_ii, b_{i,i-1})` makes `b_{i,i-1} c - b_ii s = 0`), the column rotation touching only
columns `i-1, i` of `A` below row `j` (the zeros of `A` in columns `< j` are kept). ★★★ (~350 lines).

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.algorithm_5_2_1_spec`,
`GolubVanLoan.Chapter05.algorithm_5_1_3_spec`, `GolubVanLoan.Chapter05.givensApplyLeft_spec`,
`GolubVanLoan.Chapter05.givensApplyRight_spec`, `GolubVanLoan.Chapter05.householderApplyLeft_spec`,
`GolubVanLoan.Chapter05.householderProduct` are not on main 55f7ad05 (convention 13: every update
calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is chapter
3's); it needs `algorithm_7_7_1` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_7_1", "GolubVanLoan.Chapter05.algorithm_5_2_1_spec", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "GolubVanLoan.Chapter05.householderProduct"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.1'

