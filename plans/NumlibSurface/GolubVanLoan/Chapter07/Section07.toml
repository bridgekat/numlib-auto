not on main 55f7ad05 (convention 13: every update calls chapter 5's shared helpers, which the
chapter 5 surface adds; back substitution is chapter 3's); it needs `qzZeroChase` of this chapter,
itself blocked.'''
deps = ["GolubVanLoan.Chapter07.qzZeroChase", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, §7.7.5'

[[node]]
id = "algorithm_7_7_2"
kind = "definition"
desc = '''Algorithm 7.7.2 (QZ step) on a window `w` of consecutive indices (the book's is `w = List.finRange n`;
Algorithm 7.7.3 runs it on its unreduced block), `A` unreduced upper Hessenberg and `B` nonsingular upper
triangular there (spec hypotheses): `M = A B⁻¹` enters only through `(M - aI)(M - bI) e₁ = [x, y, z, 0, …]ᵀ`
with `a + b`, `a b` the trace and determinant of `M`'s trailing `2 × 2` block (the design of the group
desc); for `k = 0 .. N-3` (`o_k = [w_k, w_{k+1}, w_{k+2}]`): `Q_k` from `houseOn rnd o_k` of `[x, y, z]`
applied to rows `o_k` of `A` and `B` (`householderApplyLeft`); `Z_{k1}` from `houseOn` on the reversed
list `[w_{k+2}, w_{k+1}, w_k]` of row `w_{k+2}` of `B` applied to columns `o_k` of `A` and `B`
(`householderApplyRight`); `Z_{k2}` from the reversed list `[w_{k+1}, w_k]` of row `w_{k+1}` of `B` on
columns `w_k, w_{k+1}`; `x = a_{k+1,k}`, `y = a_{k+2,k}`, `z = a_{k+3,k}` if `k < N-3`; finally `Q_{N-1}`
from `houseOn` of `[x, y]` on the last two rows and `Z_{N-1}` from the reversed last row of `B` on the last
two columns. Returns `(A, B)` and the two reflector data lists `List ((Fin n → ℝ) × ℝ)` (convention 13). ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.houseOn`,
`GolubVanLoan.Chapter05.householderApplyLeft`, `GolubVanLoan.Chapter05.householderApplyRight`,
`GolubVanLoan.Chapter05.algorithm_5_1_1`, `GolubVanLoan.Chapter03.algorithm_3_1_2` are not on main
55f7ad05 (convention 13: every update calls chapter 5's shared helpers, which the chapter 5 surface
adds; back substitution is chapter 3's).'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.householderApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_1", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.2'

[[node]]
id = "algorithm_7_7_2_spec"
kind = "theorem"
desc = '''Algorithm 7.7.2, exact semantics: for `A` unreduced upper Hessenberg and `B` nonsingular upper
triangular, `(A', B', dQ, dZ) = Id.run (algorithm_7_7_2 pure (List.finRange n) A B)` satisfies `A' = Qᵀ A Z`, `B' = Qᵀ B Z` with
`Q = householderProduct dQ`, `Z = householderProduct dZ` orthogonal, `A'` upper Hessenberg, `B'` upper triangular, and `Q` has the same first column as the
Francis step on `M = A B⁻¹`, so `Matrix.IsFrancisStep s t M (A' B'⁻¹)` with `s`, `t` the trace and
determinant of `M`'s trailing `2 × 2` block — "`Ā B̄⁻¹` is essentially the same matrix that would result if
a Francis QR step were explicitly applied to `A B⁻¹`". Proof: `A' B'⁻¹ = Qᵀ (A B⁻¹) Q` is upper Hessenberg
(Hessenberg times triangular), `Q e₁ = Q₀ e₁ ∥ (M - aI)(M - bI) e₁`, so
`Matrix.IsUnreducedUpperHessenberg.isUpperTriangular_star_mul_aeval` gives the triangularity of
`Qᵀ p(M)`; the zero-chasing invariant (bulge in `A` below the subdiagonal, in `B` below the diagonal) as in
`algorithm_7_5_1_spec`. ★★★ (~500 lines).

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.householderApplyLeft_spec`,
`GolubVanLoan.Chapter05.householderApplyRight_spec`, `GolubVanLoan.Chapter05.houseOn_spec`,
`GolubVanLoan.Chapter05.householderProduct`, `GolubVanLoan.Chapter03.algorithm_3_1_2_spec` are not
on main 55f7ad05 (convention 13: every update calls chapter 5's shared helpers, which the chapter 5
surface adds; back substitution is chapter 3's); it needs `algorithm_7_7_2` of this chapter, itself
blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_7_2", "Matrix.IsFrancisStep", "Matrix.IsUnreducedUpperHessenberg.isUpperTriangular_star_mul_aeval", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "GolubVanLoan.Chapter05.householderApplyRight_spec", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.2'

[[node]]
id = "algorithm_7_7_3"
kind = "definition"
desc = '''Algorithm 7.7.3 (QZ algorithm, Moler–Stewart): `algorithm_7_7_3 rnd ε A B fuel` (fuel last, convention 3)
returns `(Q, Z, T, S, done)`: `algorithm_7_7_1`; then at most `fuel` passes of: zero every `a_{i,i-1}` with
`|a_{i,i-1}| ≤ fl(ε · fl(|a_{i-1,i-1}| + |a_ii|))` (right side rounded, `|·|` and the comparison exact —
convention 1); find the largest `q` and smallest `p` with `A₃₃` quasi-triangular and `A₂₂` unreduced
Hessenberg (sizes `p, n-p-q, q`; the partition in the book's image, reconstructed from the text); if
`q = n` stop; with `w = [p, …, n-q-1]` the window of the middle block: if `B₂₂` is singular (a zero on its
diagonal, an exact test) run `qzZeroChase` on `w`, else `algorithm_7_7_2` on `w`, and apply the returned
rotations / reflector data to the off-diagonal blocks and to `Q`, `Z` (`householderApplyLeft/Right`,
`givensApplyLeft/Right` on index lists; `diag(I_p, Q, I_q)ᵀ A diag(I_p, Z, I_q)` etc.). ★

Blocked: the chapter 3/5 surface nodes `GolubVanLoan.Chapter05.householderApplyLeft`,
`GolubVanLoan.Chapter05.householderApplyRight` are not on main 55f7ad05 (convention 13: every update
calls chapter 5's shared helpers, which the chapter 5 surface adds; back substitution is chapter
3's); it needs `algorithm_7_7_1`, `algorithm_7_7_2`, `qzZeroChase` of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_7_1", "GolubVanLoan.Chapter07.algorithm_7_7_2", "GolubVanLoan.Chapter07.qzZeroChase", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.householderApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.3'

[[node]]
id = "algorithm_7_7_3_spec"
kind = "theorem"
desc = '''Algorithm 7.7.3, exact semantics: `Q`, `Z` orthogonal, `S = Qᵀ B Z` upper triangular, `T = Qᵀ (A + E) Z`
upper Hessenberg with `‖E‖_F ≤ ((1 + 2ε)^(n * fuel) - 1) ‖A‖_F` (`E = 0` when `ε = 0`; the zero chase and the QZ
steps are exact equivalences), and if `done` then `T` is upper quasi-triangular — the generalized real Schur
form of `(A + E, B)` (Theorem 7.7.2 made constructive up to the deflation perturbation). Invariants
from `algorithm_7_7_1_spec`, `qzZeroChase_spec`, `algorithm_7_7_2_spec`, `pencil_decouple`. ★★★ (~400
lines).

Blocked: needs `algorithm_7_7_3`, `algorithm_7_7_1_spec`, `qzZeroChase_spec`, `algorithm_7_7_2_spec`
of this chapter, itself blocked.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_7_3", "GolubVanLoan.Chapter07.algorithm_7_7_1_spec", "GolubVanLoan.Chapter07.qzZeroChase_spec", "GolubVanLoan.Chapter07.algorithm_7_7_2_spec", "GolubVanLoan.Chapter07.pencil_decouple", "Matrix.IsQuasiUpperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.3'

