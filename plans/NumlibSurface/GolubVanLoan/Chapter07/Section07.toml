[[node]]
id = "algorithm_7_7_3_spec"
kind = "theorem"
desc = '''Algorithm 7.7.3, exact semantics: `Q`, `Z` orthogonal, `S = Qᵀ B Z` upper triangular, `T = Qᵀ (A + E) Z`
upper Hessenberg with `‖E‖_F ≤ ((1 + 2ε)^(n * fuel) - 1) ‖A‖_F` (`E = 0` when `ε = 0`; the zero chase and the QZ
steps are exact equivalences), and if `done` then `T` is upper quasi-triangular — the generalized real Schur
form of `(A + E, B)` (Theorem 7.7.2 made constructive up to the deflation perturbation). Invariants
from `algorithm_7_7_1_spec`, `qzZeroChase_spec`, `algorithm_7_7_2_spec`, `pencil_decouple`. ★★★ (~400
lines).

Blocked (c07 round, paused by the user): `algorithm_7_7_3`, `algorithm_7_7_1_spec` and
`qzZeroChase_spec` are proved, but it needs `algorithm_7_7_2_spec` (open), a spec of `qzDeflate`
(each zeroing perturbs `A` by at most `ε(|a_{i-1,i-1}| + |a_ii|)`), the choice of `p`, `q` by
`Nat.findGreatest`, and the accumulation of the block's reflector data into `Q`, `Z`. Estimate ~400
lines after `algorithm_7_7_2_spec`.'''
deps = ["GolubVanLoan.Chapter07.algorithm_7_7_3", "GolubVanLoan.Chapter07.algorithm_7_7_1_spec", "GolubVanLoan.Chapter07.qzZeroChase_spec", "GolubVanLoan.Chapter07.algorithm_7_7_2_spec", "GolubVanLoan.Chapter07.pencil_decouple", "Matrix.IsQuasiUpperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 7.7.3'

