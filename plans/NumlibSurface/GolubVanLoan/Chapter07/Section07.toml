`q = n` stop; with `w = [p, …, n-q-1]` the window of the middle block: if `B₂₂` is singular (a zero on its
diagonal, an exact test) run `qzZeroChase` on `w`, else `algorithm_7_7_2` on `w`, and apply the returned
rotations / reflector data to the off-diagonal blocks and to `Q`, `Z` (`householderApplyLeft/Right`,
`givensApplyLeft/Right` on index lists; `diag(I_p, Q, I_q)ᵀ A diag(I_p, Z, I_q)` etc.). ★'''
