namespace = "GolubVanLoan.Chapter07"
desc = '''
§7.7, the generalized eigenvalue problem: the spectrum `λ(A, B)` and its basic properties, equivalent
pencils (7.7.2), the generalized Schur decomposition (Theorem 7.7.1, for every pair) and its real form
(7.7.2), the Hessenberg–triangular reduction (Algorithm 7.7.1), the zero-chasing deflation of §7.7.5,
the QZ step (Algorithm 7.7.2) and the QZ algorithm (7.7.3), generalized inverse iteration, deflating
subspaces, and the linearization of polynomial eigenvalue problems ((7.7.3)–(7.7.6)).

`λ(A, B)` is the backbone's `Matrix.pencilSpectrum A B` (`{z | det (A - z B) = 0}`), eigenvectors
`Matrix.HasPencilEigenvector` ((7.7.1)); complex `Matrix (Fin n) (Fin n) ℂ` for the theory, real for the
algorithms. The algorithms follow the numbered conventions of `NumlibSurface/GolubVanLoan`, with
chapter 5's shared helpers on index lists (`houseOn`, `householderApplyLeft/Right`,
`givensApplyLeft/Right`); Algorithm 7.7.1 starts with chapter 5's Householder QR
`GolubVanLoan.Chapter05.algorithm_5_2_1`, whose returned reflector data (the `β` that `house`
returned, convention 13) are applied to `A`. The QZ step's `M = A B⁻¹` entries are computed
from `B⁻¹ e_j` for `j ∈ {1, 2, n-1, n}` by back substitution (chapter 3's `algorithm_3_1_2`) — the book
says only "`v` can be calculated in `O(1)` flops"; the design is recorded in the report. A Householder
matrix acting on a *row* vector from the right, "`[b_{k+2,k} b_{k+2,k+1} b_{k+2,k+2}] Z_{k1} = [0 0 *]`",
is `houseOn` on the **reversed index list** `[k+2, k+1, k]` (pivot `k+2`, convention 10): no exchange
permutation is needed.

Like Algorithm 7.5.2, Algorithm 7.7.3 gets tolerance `ε` and, last, `fuel`, runs Algorithm 7.7.2 and
the zero chase on the window of the unreduced block, and its exact semantics carry
the perturbation `E` of the deflations of `A`'s subdiagonal (the test on `B`'s diagonal is exact,
`B₂₂` singular, handled by zero chasing, an orthogonal equivalence).

Not formalized here: the Kronecker canonical form (mentioned, not stated); the `7`-digit example
(`κ₂(B) ≈ 2 × 10⁶`); Stewart's chordal-metric bound `chord(λ, λ_ε) ≤ ε/√((yᴴAx)² + (yᴴBx)²) + O(ε²)`
(first order, quoted without proof) and Wilkinson's remark on `t_kk = s_kk = 0`; the backward stability
of QZ (`Q₀ᵀ(A + E)Z₀ = T`, `‖E‖₂ ≈ u ‖A‖₂`, stated without derivation); flop counts.
'''

