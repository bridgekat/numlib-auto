[[node]]
id = "equation_7_7_5"
kind = "theorem"
desc = '''(7.7.3)–(7.7.5): for `P(λ) = A₀ + λ A₁ + λ² A₂ + λ³ A₃` (7.7.4) and `L(λ)` of (7.7.5)
(`[0 0 A₀; -I 0 A₁; 0 -I A₂] + λ [I 0 0; 0 I 0; 0 0 A₃]`, on `Fin 3 × Fin n` or `(Fin n ⊕ Fin n) ⊕ Fin n`),
`L(λ) [u₁; u₂; x] = 0` implies `P(λ) x = 0` (7.7.3) (the rows give `u₂ = (A₂ + λ A₃) x`,
`u₁ = A₁ x + λ u₂`, `λ u₁ + A₀ x = P(λ) x`), and conversely `P(λ) x = 0` with these `u₁`, `u₂` gives
`L(λ) [u₁; u₂; x] = 0`, `x ≠ 0` iff the stacked vector is nonzero; so the eigenvalues agree. (The book's chain writes `A₀ + λ(…)` for `A₀ x + λ(…)`.) ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (7.7.5)'

[[node]]
