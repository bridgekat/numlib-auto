[[node]]
id = "algorithm_7_7_2"
kind = "definition"
desc = '''Algorithm 7.7.2 (QZ step) on a window `w` of consecutive indices (the book's is `w = List.finRange n`;
Algorithm 7.7.3 runs it on its unreduced block), `A` unreduced upper Hessenberg and `B` nonsingular upper
triangular there (spec hypotheses): `M = A B⁻¹` enters only through `(M - aI)(M - bI) e₁ = [x, y, z, 0, …]ᵀ`
with `a + b`, `a b` the trace and determinant of `M`'s trailing `2 × 2` block (the design of the group
desc); for `k = 0 .. N-3` (`o_k = [w_k, w_{k+1}, w_{k+2}]`): `Q_k` from `houseOn rnd o_k` of `[x, y, z]`
applied to rows `o_k` of `A` and `B` (`householderApplyLeft`); `Z_{k1}` from `houseOn` on the reversed
list `[w_{k+2}, w_{k+1}, w_k]` of row `w_{k+2}` of `B` applied to columns `o_k` of `A` and `B`
(`householderApplyRight`); `Z_{k2}` from the reversed list `[w_{k+1}, w_k]` of row `w_{k+1}` of `B` on
columns `w_k, w_{k+1}`; `x = a_{k+1,k}`, `y = a_{k+2,k}`, `z = a_{k+3,k}` if `k < N-3`; finally `Q_{N-1}`
from `houseOn` of `[x, y]` on the last two rows and `Z_{N-1}` from the reversed last row of `B` on the last
two columns. Returns `(A, B)` and the two reflector data lists `List ((Fin n → ℝ) × ℝ)` (convention 13). ★'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft", "GolubVanLoan.Chapter05.householderApplyRight", "GolubVanLoan.Chapter05.algorithm_5_1_1", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
