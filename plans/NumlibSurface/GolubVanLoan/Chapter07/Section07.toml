[[node]]
id = "algorithm_7_7_2_spec"
kind = "theorem"
desc = '''Algorithm 7.7.2, exact semantics: for `A` unreduced upper Hessenberg and `B` nonsingular upper
triangular, `(A', B', dQ, dZ) = Id.run (algorithm_7_7_2 pure (List.finRange n) A B)` satisfies `A' = Qᵀ A Z`, `B' = Qᵀ B Z` with
