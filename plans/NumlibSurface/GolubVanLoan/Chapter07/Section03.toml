[[node]]
id = "equation_7_3_26"
kind = "theorem"
desc = '''(7.3.26), corrected: `V₀ - X W₀ = G (Zᴴ Q₀)` is nonsingular and
`‖(V₀ - X W₀)⁻¹‖₂ ≤ ‖G⁻¹‖₂ ‖(Zᴴ Q₀)⁻¹‖₂ ≤ 1 / √(1 - d̃₀²)` with `d̃₀ = dist(D_r(Aᴴ), ran Q₀) < 1`
(`σ_min(Zᴴ Q₀)² = 1 - d̃₀²` by (7.3.19) for the pair `(D_r(Aᴴ), ran Q₀)`). The book's chain equates this
with `1 - d₀²` through the claim `ran(Q_β) = D_r(Aᴴ)ᗮ`, which is false unless `T₁₂ = 0` — the source of
the error in Theorem 7.3.1. ★★

Blocked: needs (7.3.19) of this section, itself blocked on the backbone node
`Matrix.gap_range_sq_add_sortedSingularValues_sq`.'''
deps = ["GolubVanLoan.Chapter07.equation_7_3_25", "GolubVanLoan.Chapter07.equation_7_3_19", "GolubVanLoan.Chapter07.equation_7_3_24"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.3.26)'
