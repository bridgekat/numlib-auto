[[node]]
id = "theorem_7_3_1"
kind = "theorem"
desc = '''Theorem 7.3.1, corrected (see the group desc): let the Schur decomposition be (7.3.7)–(7.3.8) with
`n ≥ 2`, `|λ_r| > |λ_{r+1}|`, `μ ≥ 0` with `(1 + μ)|λ_r| > ‖N‖_F`, `Q₀` with orthonormal columns,
`d_k = dist(D_r(A), ran Q_k)` for an orthogonal iteration `Q_k` (7.3.6), and
`d̃₀ = dist(D_r(Aᴴ), ran Q₀) < 1` (in place of the printed (7.3.9)). Then
`d_k ≤ (1+μ)^{n-2} (1 + ‖T₁₂‖_F / sep(T₁₁, T₂₂)) ((|λ_{r+1}| + ‖N‖_F/(1+μ)) / (|λ_r| - ‖N‖_F/(1+μ)))^k
· d₀ / √(1 - d̃₀²)`. `D_r(Aᴴ)` is the dominant invariant subspace of `Aᴴ`, which is the orthogonal
complement of the complementary invariant subspace of `A`. Backbone
`Matrix.gap_subspaceIterate_le_of_schur` with `orthogonalIteration_range` (full rank of `A^k Q₀` is a
consequence of `d̃₀ < 1`, as in the book's proof). ★★

Blocked: the backbone node `Matrix.gap_subspaceIterate_le_of_schur` is still open on main 55f7ad05
(the corrected statement waits on agent sv2), and so is this section's `orthogonalIteration_range`.'''
deps = ["Matrix.gap_subspaceIterate_le_of_schur", "GolubVanLoan.Chapter07.orthogonalIteration_range", "GolubVanLoan.Chapter07.dominantInvariantSubspace_unique", "GolubVanLoan.Chapter07.lemma_7_3_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.3.1'

[[node]]
id = "theorem_7_3_1_counterexample"
kind = "theorem"
desc = '''The printed Theorem 7.3.1 is false: for `A = !![2, 1; 0, 1]` (Schur form with `Q = 1`, `N = !![0, 1;
0, 0]`, `‖N‖_F = 1`), `r = 1`, `μ = 3` (so `(1+μ)|λ₁| = 8 > 1`) and `Q₀ = (1, -1)ᵀ/√2`: every orthogonal
iteration has `ran Q_k = ran Q₀` (`A Q₀ = Q₀`), so `d_k = 1/√2` for all `k`, while the printed right-hand
side `(1 + 1/1)(5/4 / 7/4)^k (1/√2)/√(1/2)` tends to `0` (`sep(2, 1) = 1`). The hypothesis that fails is
`d̃₀ < 1`: `ran Q₀ ⊥ D₁(Aᴴ) = span{(1, 1)}`, so `d̃₀ = 1`. ★

Blocked: not attempted in the s07 round (session budget went to the unblocked nodes); the
computation `ran Q_k = ran Q₀` is immediate (`A Q₀ = Q₀`), but the value `d_k = 1/√2` needs the gap
of two lines in `ℂ²` (same lemma as `powerMethod_dist`) and the limit of the printed bound. Estimate
~80 lines.'''
deps = ["GolubVanLoan.Chapter07.orthogonalIteration"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 7.3.1'

[[node]]
id = "equation_7_3_11"
kind = "theorem"
desc = '''(7.3.11) and the conclusion drawn from it (§7.3.3): if `|λ₁| > ⋯ > |λ_n|`, the Schur vectors are
`q_i`, and `dist(D_i(Aᴴ), span{q₁^(0), …, q_i^(0)}) < 1` for `i = 1:n`, then for an orthogonal iteration
with `r = n`, `dist(span{q₁^(k), …, q_i^(k)}, span{q₁, …, q_i}) → 0` for every `i`, and the matrices
`T_k = Q_kᴴ A Q_k` converge to upper triangular form (their strictly lower entries tend to `0`).
Theorem 7.3.1 (corrected) for each `r = i`, and the entries `(T_k)_{jl}`, `j > l`, bounded by the
gaps (`Krylov.norm_inner_le_of_gap`). ★★

Blocked: needs Theorem 7.3.1 (corrected) of this section, itself blocked on
`Matrix.gap_subspaceIterate_le_of_schur`.'''
deps = ["GolubVanLoan.Chapter07.theorem_7_3_1", "Krylov.norm_inner_le_of_gap"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.3.11)'

