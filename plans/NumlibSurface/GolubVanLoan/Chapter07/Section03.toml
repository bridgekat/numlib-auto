[[node]]
id = "equation_7_3_18"
kind = "theorem"
desc = '''(7.3.18): with `Q = [Q_α Q_β]` unitary (Schur vectors) and `Q_k` with orthonormal columns,
`dist(D_r(A), ran Q_k) = ‖Q_βᴴ Q_k‖₂` — the book's §2.5.3 characterization of the distance of two
equal-dimensional subspaces by orthonormal bases: chapter 2's `Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul`
(their Theorem 2.5.1, `Numlib/Analysis/InnerProductSpace/Projection/Gap`) with `W₁ = Q_α`,
`Z₁ = Q_k`, and the roles exchanged by `Submodule.gap_comm`. ★

Blocked: the backbone node `Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul` (chapter 2's Theorem
2.5.1) is still open on main 55f7ad05. A short instance once it lands.'''
deps = ["Submodule.gap", "Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.3.18)'

[[node]]
id = "equation_7_3_19"
kind = "theorem"
desc = '''(7.3.19): in the same setting, `1 = d_k² + σ_min(V_k)²` with `V_k = Q_αᴴ Q_k` — from the thin CS
decomposition (Theorem 2.5.2) of the unitary `[V_k; W_k]`-columns: `V_kᴴ V_k + W_kᴴ W_k = I` and
`σ_min(V_k)² = 1 - ‖W_k‖₂²`. Backbone `Matrix.gap_range_sq_add_sortedSingularValues_sq`
(`Numlib/Analysis/Matrix/SingularValues`): `gap² + (W₁ᴴ * Z₁).sortedSingularValues (card k - 1) ^ 2 = 1`;
the surface's `σ_min(V_k)` is `V_k.sortedSingularValues (k - 1)` (square `k × k`), or, if the surface keeps
the column-indexed `⨅ i, V_k.singularValues i`, rewrite by
`Matrix.sortedSingularValues_eq_iInf_singularValues`. ★

Blocked: the backbone node `Matrix.gap_range_sq_add_sortedSingularValues_sq` is still open on main
55f7ad05, and so is (7.3.18).'''
deps = ["GolubVanLoan.Chapter07.equation_7_3_18", "Matrix.gap_range_sq_add_sortedSingularValues_sq", "Matrix.sortedSingularValues_eq_iInf_singularValues"]
source = 'Golub–Van Loan, Matrix Computations, Equation (7.3.19)'

