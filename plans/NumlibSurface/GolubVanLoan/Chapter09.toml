desc = '''
Golub–Van Loan, Chapter 9: functions of matrices (§9.1 eigenvalue methods, §9.2 approximation
methods, §9.3 the matrix exponential, §9.4 the sign, square root and logarithm, polar
decomposition). Backbone: the algebra-level primary functional calculus `pfc` in the new directory
`Numlib/Analysis/Normed/Algebra/PrimaryFunctionalCalculus/{Basic,Analytic,Cauchy}` (`pfc`, `pfc_*`,
`spectrum_pfc`, `hasSum_pfc`, `pfc_comp`, `hasDerivAt_pfc_smul`, `pfc_eq_circleIntegral`,
`norm_pfc_sub_sum_le`); the matrix-specific directory `Numlib/Analysis/Matrix/Function/` (its group file
carries the design; `Function/Analytic` and `Function/Cauchy` no longer exist, and `Matrix.pfc_map_conj`
is in `Function/Basic`); Hermite interpolation in `Numlib/RingTheory/Polynomial/HermiteInterpolation`
(`Hermite.jetPoly` … `Hermite.interpolateJet_congr`) and `Numlib/Analysis/Calculus/HermiteInterpolation`
(`Hermite.taylorJet`, `Hermite.divDiff`, `Hermite.norm_divDiff_le`); the exponential's Fréchet derivative,
equality criterion and resolvent bound in `Numlib/Analysis/Normed/Algebra/Exponential`; staged appends to
`Numlib/Approximation/{NewtonForm,CompositeQuadrature}`, `Numlib/Analysis/Matrix/OperatorNorm` and
`Numlib/Analysis/Normed/Algebra/SpectralRadius`.

**Conventions of the chapter's surface files.**
* `f(A)` is the backbone's primary functional calculus `pfc f A` for `A : Matrix (Fin n) (Fin n) ℂ`
  and `f : ℂ → ℂ`. The book *defines* `f(A)` through the Jordan form ((9.1.1)–(9.1.4)); here that is
  a theorem (`equation_9_1_3`), whose right side is thereby independent of the chosen Jordan
  decomposition. "`f(A)` is defined" / "all the required derivative evaluations exist" is a
  hypothesis only where a proof uses it (`ContDiffAt`/`AnalyticAt` at the eigenvalues); `pfc` is total.
* The book's `e^A` is Mathlib's `NormedSpace.exp A` (which needs no norm on matrices), equal to
  `pfc Complex.exp A` (`pfc_exp_eq_normedSpace_exp`). §9.3 is stated for real `A : Matrix (Fin n)
  (Fin n) ℝ` where the book is real, and for complex `A` where it uses the Schur form. The named
  functions of §9.4 are `Matrix.matrixSign`, `Matrix.principalSqrt`, `Matrix.principalLog`.
* Indices are `0`-based: the book's `t_ij`, `1 ≤ i, j ≤ n`, is `T i j` with `i j : Fin n`; the
  superdiagonal loops of Algorithm 9.1.1 run `p = 1, …, n-1`, `i = 0, …, n-1-p`, `j = i + p`.
  Upper triangular is `T.BlockTriangular id` (Mathlib's `Matrix.IsUpperTriangular`). Strictly
  increasing sequences `S_ij` are finsets of interior indices (`Matrix.path`, `Matrix.pathProd`).
* Norms: `‖·‖₂` is Mathlib's scoped `Matrix.Norms.L2Operator` (the form in which
  `Numlib/Analysis/Matrix/OperatorNorm` states its facts), `‖·‖_F` the scoped
  `Matrix.Norms.Frobenius`, `‖·‖_∞` the scoped `Matrix.Norms.Operator`; `κ₂(X) = ‖X‖₂ ‖X⁻¹‖₂`.
  Integrals of matrix-valued functions use whichever of these instances is open.
* Algorithms follow the numbered conventions 1–14 of `NumlibSurface/GolubVanLoan` (every `+ − × / √`
  result rounded; negation, `|·|`, `sign`, copies, comparisons and the exponent extraction `⌊log₂ ν⌋` of
  Algorithm 9.3.1 exact): `algorithm_9_M_K` is a monadic program with a rounding
  hook, `algorithm_9_M_K_spec` its exact-arithmetic specification at `Id`. Algorithm 9.1.1
  (Schur–Parlett) is complex and scalar-field-generic (`{K} [Field K]`); Algorithms 9.2.1, 9.2.2,
  9.3.1 are real and compute every matrix product by chapter 1's `algorithm_1_1_5` (`C ← C + A B`,
  with `C = 0` or `C = b_k I`) and Algorithm 9.3.1's solve `D F = N` by chapter 3's Gaussian
  elimination with partial pivoting (`algorithm_3_4_1`, then `algorithm_3_1_1`/`algorithm_3_1_2`
  column by column). The book analyses no algorithm of this chapter's rounding errors rigorously, so
  there are no `SetM` theorems.

**What is formalized.** Every Theorem, Lemma and Corollary (9.1.1–9.1.4, 9.2.1–9.2.3, 9.4.1); every
Algorithm (9.1.1, 9.2.1, 9.2.2, 9.3.1) with its spec; every numbered display that asserts a
proposition ((9.1.3), (9.1.4), (9.1.6)–(9.1.8), (9.1.11), (9.1.12), (9.2.1), (9.2.2), (9.2.5),
(9.2.7), (9.2.8), (9.3.1), (9.3.2), (9.3.4)–(9.3.6), (9.4.2)–(9.4.5), (9.4.8)–(9.4.10), (9.4.12)); the
prose definitions (`condRel`, `IsPrincipalSqrt`, the spectral abscissa (9.3.3), `ν(A, t)`); and the
precise unnumbered claims the text derives or quotes (the Taylor series of `exp`, `log`, `sin`,
`cos`; the double-angle formulas; the Moler–Van Loan bound; the ODE characterization and
perturbation bounds of `e^{At}`; the Newton, Denman–Beavers and polar iterations' properties; the
principal logarithm's uniqueness; the Maclaurin, Gregory and inverse-scaling log formulas; the
(3,3) Padé approximant of `log`; Li–Sun). Book errors are corrected in the statements and listed
in `notes/gvl/ch09/report.md` (**Doubts**): (9.1.8) with `X`, `X⁻¹` swapped; the sign of the
`log(I - A)` series; the missing `A⁴` in (9.2.7); the scaling exponent of Algorithm 9.3.1.
Errata added by the review round (`notes/gvl/review/`): §9.3.2's "equality holding for all
nonnegative `t` if and only if the matrix `A` is normal" (line 28017) is false in the "only if"
direction — `A = [1] ⊕ [[0,1],[0,0]]` is not normal and has `ν(A, t) = t‖A‖₂` for all `t ≥ 0`
(`expCondNumber_eq_iff_counterexample`; only the normal ⇒ equality direction is a node,
`expCondNumber_eq_of_isStarNormal`); (9.2.4) applies the real mean-value form of Taylor's remainder
(`f_ij^{(q+1)}(ε_ij)`) to complex-valued entries, where no such `ε_ij` need exist (the rigorous form
is an integral or norm bound, `norm_pfc_sub_sum_le`); Theorem 9.2.2's `δ_r` needs `Ω` bounded (the
node assumes `Ω` compact).

**Not formalized, by class.**
* Operation counts (`2n³/3` flops, `O(2ⁿ)`, "`s + r - 1` matrix multiplications", "at most
  `2⌊log₂ s⌋`", "`2(q + j + 1/3)n³`", "five instead of seven"), storage remarks, and the choice of
  `s = ⌊√q⌋` as minimizing work.
* Numerical examples: §9.1.3 (the `1 ± 10⁻⁵` matrix, `u ≈ 10⁻⁷`), the `3 × 3` example after Theorem
  9.2.2, the `[-49 24; -64 31]` example of §9.2.3, the `q = 9` Paterson–Stockmeyer instance, Figure
  9.3.1 and `α_{.01}(A)/.01 ≈ 216`, the four square roots of `[4 10; 0 9]`, the `3 × 3` illustration
  of Theorem 9.1.4.
* Heuristic claims with no rigorous reading in the book: forward stability of block Schur–Parlett
  "`‖F̂ - f(A)‖/‖f(A)‖ ≈ u cond_rel(f, A)`" (§9.1.6); "a matrix `E` for which … `≈ ν(A,t) ‖E‖/‖A‖`"
  (§9.3.2); the rounding-error estimate `γ = u‖G²‖‖G⁴‖⋯` and "numerical experiments suggest"
  (§9.3.4); the numerical-quality comparisons of §9.1.3 and §9.2.3 ("likely to introduce errors of
  order `u κ₂(X)`", "rounding errors larger than the norm of the solution"); the ranking of methods
  in the Notes.
* Algorithmic outlines without a number and without a precise claim: block Schur–Parlett's
  clustering step (§9.1.5, only its equations (9.1.12) and `F_ii = f(T_ii)` are nodes), the sin/cos
  scaling loop of §9.2.3 (its exact-arithmetic content is the double-angle formulas), QR with column
  pivoting on `(I + sign A)/2` (§9.4.1; the range statement is a node), the scaled Newton iteration
  (9.4.6) and its `μ_k` choices, the inverse-scaling-and-squaring `while` loop (its identity is a
  node), the Newton–Schulz approximation `S⁻¹ ≈ S(2I - S²)` (only the identity (9.4.5) is a node).
* The general closed contour of (9.2.8): stated for circles (Mathlib integrates over circles only).
* Problems (none is cited by a proof in the main text; P9.4.1 is cited for motivation only), the
  Notes and References.

**Correspondence (book → backbone).** (9.1.3) `Matrix.pfc_conj_jordanForm`; (9.1.6)
`Matrix.pfc_jordanBlock`; Thm 9.1.2 `hasSum_pfc`; (9.1.7) `commute_pfc`; (9.1.8) `Matrix.pfc_conj`;
Thm 9.1.4 `Matrix.pfc_apply_eq_sum_divDiff`; (9.1.11) `Matrix.pfc_apply_eq_parlett`; (9.1.12)
`Matrix.BlockTriangular.pfc_sylvester`; Thm 9.2.1 `Matrix.l2_opNorm_pfc_sub_le_of_conj_jordanForm`;
Thm 9.2.2 `Matrix.frobenius_norm_pfc_sub_le` (`Ω` compact); (9.2.1) `Hermite.norm_divDiff_le`; Thm 9.2.3
`norm_pfc_sub_sum_le` (through `taylor_integral_remainder`); (9.2.7) `Matrix.norm_integral_pfc_smul_sub_simpsonSum_le`; (9.2.8)
`pfc_eq_circleIntegral`; (9.3.1) `Pade.exp_eq_expApprox_add`; Moler–Van Loan
`Pade.exists_exp_add_eq_expApprox_pow`; (9.3.2) `Matrix.l2_opNorm_exp_smul_le_of_schur`; (9.3.4)
`Matrix.l2_opNorm_exp_smul_of_isStarNormal`; §9.3.2 `ν(A, t)` `NormedSpace.expCondNumber` (defined through
`NormedSpace.expFrechet`), the normal case `Matrix.expCondNumber_eq_of_isStarNormal`; (9.3.6)
`norm_resolvent_le_of_norm_exp_smul_le` (in `Analysis/Normed/Algebra/Exponential`); §9.4.1
`Matrix.tendsto_newtonSignIterate`; §9.4.2 `Matrix.existsUnique_sq_eq_of_re_pos`,
`Matrix.matrixSign_fromBlocks_zero_one`; Thm 9.4.1 `Matrix.exists_isPolarDecomposition`; §9.4.4
`Matrix.existsUnique_real_exp_eq`.

**Closes.** No existing open node or `notes/frontier.md` item names matrix functions; the chapter
also closes the TODO "relation with `NormedSpace.exp`: `exp (log x) = x`" of Mathlib's
`Mathlib/Analysis/Normed/Algebra/Logarithm` (`NormedSpace.exp_log_of_norm_sub_one_lt`, upstreamable).

**Order of attack.**
1. New Hermite modules: `Numlib/RingTheory/Polynomial/HermiteInterpolation` (jet interpolation on
   multisets, ~200) and `Numlib/Analysis/Calculus/HermiteInterpolation` (`taylorJet`, `divDiff`, ~150, plus
   `Hermite.norm_divDiff_le` ~400, which can wait for step 5); staged appends `SpectralRadius`
   (`spectralAbscissa`, ~60), `OperatorNorm` (`l2_opNorm_blockDiagonal'`, ~80), `CompositeQuadrature`
   (vector Simpson, ~120), `NewtonForm` (bridge, ~80).
2. `Analysis/Normed/Algebra/PrimaryFunctionalCalculus/Basic` (~550) — unblocks everything; then
   `PrimaryFunctionalCalculus/Analytic` (~900, including Theorem 9.2.3; `pfc_comp` is the one ★★★), the
   matrix-only `Function/Basic` (~250) and `Function/CFC` (~250).
3. `Function/Triangular` (~900) and `PrimaryFunctionalCalculus/Cauchy` (~350), independent of each other.
4. `Analysis/Normed/Algebra/Logarithm` (~250, independent of `pfc`) and
   `Analysis/Normed/Algebra/Exponential` (~450: Fréchet derivative, the equality criterion, the resolvent
   bound moved in from `Function/Exp`), then `Function/Pade` (~900).
5. `Function/Approximation` (~600), `Function/Exp` (~550), `Function/Sign` (~700), `Function/Sqrt`
   (~600), the rest of `Function/Log` (~550), `LinearAlgebra/Matrix/Polar` (~200) with `Function/Polar` (~950, of which Li–Sun ~600).
6. Surface: Section01 (~500), Section02 (~500), Section03 (~600), Section04 (~700).
Total backbone ≈ 8 800 lines, surface ≈ 2 300.
'''
