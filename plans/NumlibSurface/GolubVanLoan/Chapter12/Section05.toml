[[node]]
id = "equation_12_5_24"
kind = "theorem"
desc = '''(12.5.24) and the sentences around it: for a symmetric `𝒞 ∈ ℝ^{N×N×N}` (§12.5.7's definition, `Tensor.IsSymm`) all modal unfoldings are equal,
`φ_𝒞(x) = ∑_i 𝒞(i) x(i₁)x(i₂)x(i₃)/‖x‖³ = xᵀ 𝒞_(1)(x ⊗ x)/‖x‖³`, and at unit `x`, `∇φ_𝒞(x) = 0` iff `𝒞_(1)(x ⊗ x) = φ_𝒞(x) x` (the book's gradient omits the
factor `3`, harmless at zero) — the book's tensor eigenvalue. `Tensor.IsSymm.modeUnfold_eq`, `Tensor.hasFDerivAt_symmetricRayleigh_eq_zero_iff`,
flattened. ★'''
