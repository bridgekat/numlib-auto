[[node]]
id = "equation_12_5_29"
kind = "theorem"
desc = '''(12.5.29), the TT-SVD (Oseledets–Tyrtyshnikov): every `𝒜 : RTensor n` has a tensor-train representation `𝒜(i) = ∑_k 𝒢₁(i₁, k₁) ⋯ 𝒢_d(k_{d−1}, i_d)` whose
ranks are `r_k = rank(M_k)`, the ranks of the matrices of the procedure, which equal the ranks of the sequential unfoldings `𝒜_{[1:k]×[k+1:d]}`;
the procedure's successive SVDs produce it. `Tensor.exists_tensorTrain` with `equation_12_5_25`. (The full-rank example `r = (n, n², n², n)`
for `d = 5` is a count, not a node.) ★

Blocked: `Tensor.exists_tensorTrain` (tens1 ★★★) is not on main. (agent s12)'''
deps = ["Tensor.exists_tensorTrain", "GolubVanLoan.Chapter12.equation_12_5_25", "GolubVanLoan.Chapter12.equation_12_5_28"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.5.29)'
