[[node]]
id = "equation_12_2_5"
kind = "theorem"
desc = '''(12.2.5) as a characterization: "`j₂ < i₁` or `i₂ < j₁` ⇒ `rank A(i₁:i₂, j₁:j₂) ≤ 1`" iff `A.IsQuasiseparable`; and every
semiseparable matrix is quasiseparable (the sentence after (12.2.5)). `Matrix.isSemiseparable_iff_forall_rank_toBlock_Icc_le`
(its quasiseparable twin), `Matrix.IsSemiseparable.isQuasiseparable`. ★'''
deps = ["Matrix.isSemiseparable_iff_forall_rank_toBlock_Icc_le", "Matrix.IsSemiseparable.isQuasiseparable"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.5)'

[[node]]
id = "equation_12_2_6"
kind = "theorem"
desc = '''(12.2.6): the generator representation `tril(u vᵀ, −1) + diag(d) + triu(p qᵀ, 1)` (`Matrix.strictLower (vecMulVec u v) + diagonal d +
