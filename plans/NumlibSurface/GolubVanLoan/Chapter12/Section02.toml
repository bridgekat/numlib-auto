`Matrix.quasiseparableOf` (at `t = r = 1`), `Matrix.isQuasiseparable_quasiseparableOf`,
`Matrix.isSemiseparable_quasiseparableOf`. ★'''
deps = ["Matrix.quasiseparableOf", "Matrix.isQuasiseparable_quasiseparableOf", "Matrix.isSemiseparable_quasiseparableOf"]
