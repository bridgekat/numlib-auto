[[node]]
id = "triangular_semiseparable_rep"
kind = "theorem"
desc = '''§12.2.4: a lower triangular semiseparable `L` is `𝐒(u, v, t, u .* v, 0, 0, 0) = tril(u vᵀ) .* B(t)⁻ᵀ`, an upper triangular
semiseparable `U` is `𝐒(0, 0, 0, p .* q, p, q, r) = triu(p qᵀ) .* B(r)⁻¹`, for suitable vectors.
`Matrix.exists_lower_semiseparable_rep`. ★'''
deps = ["Matrix.exists_lower_semiseparable_rep"]
