kind = "theorem"
desc = '''§12.2.5: if the semiseparable `A` has an LU factorization then `U` is semiseparable, and so is `L` when the strict leading
principal submatrices of `A` are nonsingular (the factorization is then unique). The book's unqualified claim for `L` is
false for singular `A` (chapter 12 report). `Matrix.IsLU.isSemiseparable_upper`. ★'''
deps = ["Matrix.IsLU.isSemiseparable_upper"]
source = 'Golub–Van Loan, Matrix Computations, §12.2.5'

[[node]]
id = "algorithm_12_2_1"
kind = "definition"
desc = '''Algorithm 12.2.1, per D4: `algorithm_12_2_1 {M} [Monad M] (rnd : ℝ → M ℝ) (u p : Fin n → ℝ) (t r : ℕ → ℝ) : M ((Fin n → ℝ) ×
(ℕ → ℝ))`, returning `(p̃, τ)`: `for k = n−1 : −1 : 1`, `τ_k = t_k u_{k+1} / u_k` (two roundings), `p̃_{k+1} = p_{k+1} − p_k τ_k r_k`
(three roundings, left to right), then `p̃₁ = p₁`; a `List.foldlM` over `(List.finRange (n-1)).reverse` with state
`(p̃, τ)`. (`v`, `q` are inputs of the specification only.) ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 12.2.1'

[[node]]
id = "algorithm_12_2_1_spec"
kind = "theorem"
desc = '''Correctness of Algorithm 12.2.1: for `u v p q : Fin n → ℝ`, `t r : ℕ → ℝ` with `u .* v = p .* q` and `u_k ≠ 0` for `k < n` (the
divisions, `k = 1 : n − 1` in the book's indexing; its "has an LU factorization" does not ensure them), `Id.run (algorithm_12_2_1 pure u p t r) = (p̃, τ)` and
`Matrix.IsLU (𝐒(u, v, t, u .* v, p, q, r)) (B(τ)⁻ᵀ) (triu(p̃ qᵀ) .* B(r)⁻¹)`; also the closed forms `τ = (u(2:n) .* t) ./ u(1:n−1)`,
`p̃ = [p₁; p(2:n) − p(1:n−1) .* τ .* r]` after the algorithm (the loop's updates do not interfere). The text's "`M = B(τ)`"
should read `M = B(τ)ᵀ`; the spec uses the factors as the algorithm's header states them. `Matrix.isLU_quasiseparableOf`
after evaluating the fold (`List.foldlM_pure`-style, as the prototype's `dot_id`). ★★ (~60 lines)'''
deps = ["GolubVanLoan.Chapter12.algorithm_12_2_1", "Matrix.isLU_quasiseparableOf"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 12.2.1'

[[node]]
id = "equation_12_2_11"
kind = "theorem"
desc = '''(12.2.11), the Givens-vector representation: a lower triangular semiseparable `A_L` whose first column is reduced to `v₁ e₁`
by rotations `G₁ ⋯ G_{n−1}` with pairs `(c_k, s_k)` equals `B(s)⁻ᵀ .* tril(c vᵀ)` for weights `v`, `c = [c₁, …, c_{n−1}, 1]` — under the
hypothesis `(A_L)_{n1} ≠ 0`, which the book's "it is not hard to show" needs (with a zero first column the form forces `A_L`
diagonal). `Matrix.exists_givensVector_rep`. ★'''
deps = ["Matrix.exists_givensVector_rep"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.11)'

[[node]]
id = "equation_12_2_14"
kind = "theorem"
desc = '''(12.2.14) and the sentences after it: with `Qᵀ = G₁ ⋯ G_{n−1}` from the Givens-vector representation of `tril(A)`, `Qᵀ tril(A) =
triu((𝒟_n c) vᵀ) .* B(s)⁻¹`, `Qᵀ` is upper Hessenberg, `Qᵀ triu(A, 1)` is upper triangular, so `Qᵀ A = R` is a QR factorization
(P12.2.9). `Matrix.transpose_givensChain_mul_strictLower_add_diagPart`. ★'''
deps = ["Matrix.transpose_givensChain_mul_strictLower_add_diagPart"]
