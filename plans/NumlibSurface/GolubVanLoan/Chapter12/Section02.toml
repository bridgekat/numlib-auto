namespace = "GolubVanLoan.Chapter12"
desc = '''
§12.2, Structured-rank problems: semiseparable and quasiseparable matrices (12.2.1)–(12.2.8), the inverse facts
of §12.2.3, triangular semiseparable matrices and the `O(n)` product (12.2.9), the LU Algorithm 12.2.1, the
Givens-vector representation (12.2.11) and the QR Algorithm 12.2.2 with (12.2.14), (12.2.16), the banded
inverses of §12.2.8, and the orthogonal Hessenberg eigenproblem (12.2.18)–(12.2.19) with the Ammar–Gragg–Reichel
facts. Backbone: `Numlib/LinearAlgebra/Matrix/Semiseparable` and the nullity theorem staged for `Rank`.
(12.2.2), (12.2.10), (12.2.12), (12.2.13), (12.2.15), (12.2.17) define objects or write algorithm steps and have
no node of their own; `B(r) = Matrix.unitBidiagonal n r`, `𝐒(u, v, t, d, p, q, r) = Matrix.quasiseparableOf u v t d p
q r`, `Qᵀ = G₁ ⋯ G_{n−1} = Matrix.givensChain`. The book lists the arguments of `𝐒` in two orders (`𝐒(u, v, t, …)` in
(12.2.8), `𝐒(u, t, v, …)` in Algorithm 12.2.1); the surface follows (12.2.8).
'''

[[node]]
id = "equation_12_2_1"
kind = "theorem"
desc = '''(12.2.1) as a characterization: `A : Matrix (Fin n) (Fin n) ℝ` satisfies "`j₂ ≤ i₁` or `i₂ ≤ j₁` ⇒ `rank A(i₁:i₂, j₁:j₂) ≤ 1`"
iff `A.IsSemiseparable` (the backbone's maximal-block definition). `Matrix.isSemiseparable_iff_forall_rank_toBlock_Icc_le`. ★'''
deps = ["Matrix.isSemiseparable_iff_forall_rank_toBlock_Icc_le"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.1)'

[[node]]
id = "equation_12_2_3"
kind = "theorem"
desc = '''(12.2.3) and the sentence before it: `B(r)⁻¹` has entries `r_i ⋯ r_{j−1}` on and above the diagonal (`1` on it), zero below,
and every submatrix of its upper triangular part has rank `≤ 1` (so `B(r)⁻¹` is semiseparable; P12.2.1).
`Matrix.inv_unitBidiagonal`, `Matrix.isSemiseparable_inv_unitBidiagonal`. ★'''
deps = ["Matrix.inv_unitBidiagonal", "Matrix.isSemiseparable_inv_unitBidiagonal"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.3)'

[[node]]
id = "unitBidiagonal_introduces_zeros"
kind = "theorem"
desc = '''§12.2.1: if `x ∈ ℝⁿ` has `x_1, …, x_{n−1} ≠ 0` and `r = x(2:n) ./ x(1:n−1)`, then `B(r)ᵀ x = x₁ e₁`.
`Matrix.unitBidiagonal_transpose_mulVec_eq_single`. ★'''
deps = ["Matrix.unitBidiagonal_transpose_mulVec_eq_single"]
source = 'Golub–Van Loan, Matrix Computations, §12.2.1'

[[node]]
id = "equation_12_2_4"
kind = "theorem"
desc = '''(12.2.4): for `α β γ δ : Fin (n−1) → ℝ`, `M = M₁ ⋯ M_{n−1}` with `M_k = diag(I_{k−1}, [α_k β_k; γ_k δ_k], I_{n−k−1})` has the displayed
entries (`γ_j` on the subdiagonal, `δ_{i−1} β_i ⋯ β_{j−1} α_j` on and above the diagonal with the conventions at the first
row and last column, zero below the subdiagonal), and its off-diagonal blocks not meeting the diagonal have rank `≤ 1`
(it is quasiseparable). `Matrix.givensChain_apply`. ★'''
deps = ["Matrix.givensChain_apply"]
