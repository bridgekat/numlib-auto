desc = '''(12.2.9) and the displays after it: `(triu(p qᵀ) .* B(r)⁻¹) x = p .* (B(r)⁻¹ (q .* x))`, and for `p`, `q` with nonzero entries
the system `(triu(p qᵀ) .* B(r)⁻¹) x = y` is solved by `x = (B(r)(y ./ p)) ./ q`. `Matrix.vecMulVec_hadamard_inv_unitBidiagonal`. ★'''
deps = ["Matrix.vecMulVec_hadamard_inv_unitBidiagonal"]
