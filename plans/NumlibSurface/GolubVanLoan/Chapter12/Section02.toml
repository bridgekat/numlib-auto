[[node]]
id = "equation_12_2_8"
kind = "theorem"
desc = '''(12.2.8): `A` is quasiseparable iff `A = 𝐒(u, v, t, d, p, q, r)` for some `u, v, d, p, q ∈ ℝⁿ`, `t, r ∈ ℝ^{n−1}` (the "It can be
