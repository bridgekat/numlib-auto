[[node]]
id = "equation_12_2_18"
kind = "theorem"
desc = '''(12.2.18): an orthogonal upper Hessenberg `H` with positive subdiagonal, `det H = 1` and `n = 2m` even (the cases the text
deflates away) is `G₁ ⋯ G_{n−1} G_n` with the reflections `G_k = G(φ_k)`, `0 < φ_k < π`, and `G_n = diag(1, …, 1, −1)`; the
preceding claims (`G_{n−1} ⋯ G₁ H = diag(1, …, 1, −c_n)`, `c_n = ±1`) are its proof. The book assumes a nonzero subdiagonal;
positivity is reached by a diagonal `±1` similarity. `Matrix.exists_orthogonalHessenberg_eq_prod_planeReflector`. ★'''
deps = ["Matrix.exists_orthogonalHessenberg_eq_prod_planeReflector"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.18)'

[[node]]
id = "equation_12_2_19"
kind = "theorem"
desc = '''(12.2.19): the eigenvalues of such `H` (`n = 2m`, `det H = 1`) are `cos θ_k ± i sin θ_k`, `k = 1 : m` — `m` conjugate pairs on the unit
circle (charpoly form over `ℂ`). The surface keeps the book's hypotheses (orthogonal upper Hessenberg, `det H = 1`) and supplies
`H ∈ Matrix.specialOrthogonalGroup (Fin (2 * m)) ℝ` from the orthogonality and the determinant; the backbone
`Matrix.exists_charpoly_eq_prod_of_mem_specialOrthogonalGroup` (`RealSchur`) needs no Hessenberg structure, which plays no role in
the claim. ★'''
deps = ["Matrix.exists_charpoly_eq_prod_of_mem_specialOrthogonalGroup"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.2.19)'

