desc = '''(12.2.7): the Hadamard product of two quasiseparable matrices is quasiseparable (P12.2.8).
`Matrix.IsQuasiseparable.hadamard`. ★'''
deps = ["Matrix.IsQuasiseparable.hadamard"]
