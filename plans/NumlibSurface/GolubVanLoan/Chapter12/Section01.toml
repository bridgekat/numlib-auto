source = 'Golub–Van Loan, Matrix Computations, Equation (12.1.11)'

[[node]]
id = "cauchyLike_of_diagonalizable"
kind = "theorem"
desc = '''§12.1.8: if `F A − A G = R Sᵀ`, `X_F⁻¹ F X_F = Ω`, `X_G⁻¹ G X_G = Λ` (diagonal, real), then `Ã = X_F⁻¹ A X_G` satisfies `Ω Ã − Ã Λ =
R̃ S̃ᵀ` with `R̃ = X_F⁻¹ R`, `S̃ = X_Gᵀ S` (the book's first display writes `X_G⁻¹ G X_F` for `X_G⁻¹ G X_G`); and Steps 1–4 are
correct: if `P Ã = L U` (Algorithm 12.1.2) and `Ã x̃ = X_F⁻¹ b` then `x = X_G x̃` solves `A x = b`. `Matrix.sylvesterMap_conj`. ★'''
deps = ["Matrix.sylvesterMap_conj"]
source = 'Golub–Van Loan, Matrix Computations, §12.1.8'

[[node]]
id = "equation_12_1_12"
kind = "theorem"
desc = '''(12.1.12): with the DST-I matrix `𝒮_n`, `[𝒮_n]_kj = √(2/(n+1)) sin(kjπ/(n+1))` (orthogonal and symmetric),
`𝒮_nᵀ Y₀₀ 𝒮_n = 2 diag(cos(π/(n+1)), …, cos(nπ/(n+1)))`. `Y₀₀ = Matrix.cornerTridiagonal n 0 0 =
symmTridiagonalToeplitz n 1 0`, whose eigenvectors are `Matrix.sineVec` with eigenvalues `2 cos((k+1)π/(n+1))`
(`Matrix.symmTridiagonalToeplitz_mulVec_sineVec` (via the earlier chapter's restatement `GolubVanLoan.Chapter04.dd_eigen`)), orthonormal after scaling (`Matrix.orthonormal_sineVec`); the
columns of `𝒮_n` are the scaled `sineVec`s: `𝒮_n = √(2/(n+1)) • Matrix.dst1 n` (the backbone DST-I matrix, formerly
`sinMatrix`, which is chapter 1's `S_n`; `Matrix.dst1_apply_eq_sineVec`, and orthogonality from `Matrix.dst1_mul_self`). ★★ (~50 lines)'''
deps = ["Matrix.cornerTridiagonal", "GolubVanLoan.Chapter04.dd_eigen", "Matrix.sineOrthonormalBasis", "Matrix.dst1", "Matrix.dst1_apply_eq_sineVec", "Matrix.dst1_mul_self"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.1.12)'

[[node]]
id = "equation_12_1_13"
kind = "theorem"
desc = '''(12.1.13): with the DCT-II matrix `𝒞_n`, `[𝒞_n]_kj = √(2/n) cos((2k−1)(j−1)π/(2n)) q_j` (`q₁ = 1/√2`, `q_j = 1` otherwise;
orthogonal), `𝒞_nᵀ Y₁₁ 𝒞_n = 2 diag(1, cos(π/n), …, cos((n−1)π/n))`. The columns of `𝒞_n` are the normalized
`Matrix.cosineIIVec n k` (`Matrix.dotProduct_cosineIIVec` gives the normalization `√(2/n) q`), eigenvectors of
`Y₁₁ = cornerTridiagonal n 1 1` for `2 cos(kπ/n)` (`Matrix.cornerTridiagonal_one_one_mulVec_cosineIIVec`). (P12.1.5.)
The backbone names the matrix: `𝒞_n` is `(Matrix.dct2 n)ᵀ` with the column normalization `√(2/n) q_j`, and `Matrix.dct2`'s
node carries `dct2 n * (dct2 n)ᵀ` diagonal and the diagonalization of `cornerTridiagonal n 1 1` (typed over `ℝ`), so the
surface states `𝒞_n` through `Matrix.dct2` rather than rebuilding it from `cosineIIVec`. ★ (~30 lines)'''
deps = ["Matrix.dct2", "Matrix.cornerTridiagonal_one_one_mulVec_cosineIIVec", "Matrix.dotProduct_cosineIIVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.1.13)'
