namespace = "GolubVanLoan.Chapter12"
desc = '''
§12.3, Kronecker product computations: the properties of §12.3.1 ((12.3.1)–(12.3.4) and the unnumbered list), the
Tracy–Singh (12.3.5)–(12.3.8), Hadamard and Khatri–Rao products, vec and reshape (12.3.9)–(12.3.11), vec and perfect
shuffles (12.3.12), the Kronecker product SVD and nearest Kronecker products (12.3.14)–(12.3.19), Theorem 12.3.1,
Lemmas 12.3.2–12.3.3 with (12.3.20)–(12.3.21), and the reshaping identity of §12.3.10. Backbone:
`Numlib/LinearAlgebra/Matrix/KroneckerApprox` and the Kronecker material staged for chapter 1's `…/Matrix/Kronecker`;
the four basic identities of §12.3.1 (transpose, inverse, product, associativity) are chapter 1's (1.3.1)–(1.3.4) and are
not restated. (12.3.13), (12.3.16), (12.3.17) are notation/partitions (the SVD (12.3.17) is Theorem 12.3.1's hypothesis).
'''

[[node]]
id = "equation_12_3_1"
kind = "theorem"
desc = '''(12.3.1): `𝒫_{m₁,m₂} (B ⊗ C) 𝒫_{n₁,n₂}ᵀ = C ⊗ B` for `B ∈ ℝ^{m₁×n₁}`, `C ∈ ℝ^{m₂×n₂}` — chapter 1's (1.3.5), restated.
`GolubVanLoan.Chapter01.equation_1_3_5`. ★'''
deps = ["GolubVanLoan.Chapter01.equation_1_3_5"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.3.1)'

[[node]]
id = "equation_12_3_2"
kind = "theorem"
desc = '''(12.3.2): for permutations `p` of `1:m` and `q` of `1:n`, `I_m(p, :) ⊗ I_n(q, :) = I_{mn}(w, :)` with `w = (1_m ⊗ q) + n · (p − 1_m) ⊗
1_n`; in particular the Kronecker product of permutation matrices is a permutation matrix. Typed:
`Matrix.permMatrix_kronecker_permMatrix`; the book's `w` is `finProdFinEquiv ∘ Prod.map p q ∘ finProdFinEquiv.symm` read 1-based
(chapter 1's `Matrix.kroneckerFin`). ★★ (~40 lines, the flattening)'''
deps = ["Matrix.permMatrix_kronecker_permMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.3.2)'

[[node]]
