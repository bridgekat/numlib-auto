kind = "theorem"
desc = '''§12.3.1: (orthogonal) ⊗ (orthogonal) = (orthogonal) (Mathlib `Matrix.kronecker_mem_unitary` over `ℝ`), (stochastic) ⊗
(stochastic) = (stochastic) (`Matrix.kronecker_mem_rowStochastic`), (sym. pos. def.) ⊗ (sym. pos. def.) = (sym. pos. def.)
