[[node]]
id = "equation_12_3_19"
kind = "theorem"
desc = '''(12.3.19): for `r̃ ≤ r`, `A_{r̃} = ∑_{k=1}^{r̃} σ_k U_k ⊗ V_k` is the closest matrix to `A` in the Frobenius norm among sums of `r̃` Kronecker
products. `Matrix.isLeast_frobenius_norm_sub_sum_kronecker` (and `Matrix.kroneckerRank_le_iff` for "sum of `r̃` Kronecker
products"). ★

Blocked: needs chapter 2's Eckart–Young–Mirsky `Matrix.isLeast_frobenius_norm_sub_of_rank_le` (agent sv2/ls1, not on main at 55f7ad05) and tens1's follow-up `Matrix.isLeast_frobenius_norm_sub_sum_kronecker`; neither resolves on this branch. Once they land the node is a restatement through `rearrangement`, `equation_12_3_14` and `Matrix.kroneckerRank_le_iff` (~30 lines). (agent s12)'''
deps = ["GolubVanLoan.Chapter12.theorem_12_3_1", "Matrix.isLeast_frobenius_norm_sub_sum_kronecker", "Matrix.kroneckerRank_le_iff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.3.19)'

