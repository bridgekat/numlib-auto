[[node]]
id = "equation_12_3_15"
kind = "theorem"
desc = '''(12.3.15) and the sentence after it: if `Uᵀ 𝓡(A) V = Σ` is an SVD (chapter 2's Theorem 2.4.1 form), then `vec(B_opt) = √σ₁ U(:,1)`,
`vec(C_opt) = √σ₁ V(:,1)` minimize `φ`, and so do `α B_opt`, `C_opt/α` for `α ≠ 0`. `Matrix.isLeast_frobenius_norm_sub_sum_kronecker`
at `r̃ = 1` with `Matrix.kroneckerRank_le_iff`. ★

Blocked: needs chapter 2's Eckart–Young–Mirsky `Matrix.isLeast_frobenius_norm_sub_of_rank_le` (agent sv2/ls1, not on main at 55f7ad05) and tens1's follow-up `Matrix.isLeast_frobenius_norm_sub_sum_kronecker`; neither resolves on this branch. Once they land the node is a restatement through `rearrangement`, `equation_12_3_14` and `Matrix.kroneckerRank_le_iff` (~30 lines). (agent s12)'''
deps = ["GolubVanLoan.Chapter12.equation_12_3_14", "Matrix.isLeast_frobenius_norm_sub_sum_kronecker", "Matrix.kroneckerRank_le_iff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.3.15)'

