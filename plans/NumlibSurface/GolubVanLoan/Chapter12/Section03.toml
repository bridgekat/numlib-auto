[[node]]
id = "kronecker_factorizations"
kind = "theorem"
desc = '''§12.3.1: the Cholesky factor of `B ⊗ C` is the Kronecker product of the Cholesky factors; `P_B B = L_B U_B`, `P_C C = L_C U_C ⇒
(P_B ⊗ P_C)(B ⊗ C) = (L_B ⊗ L_C)(U_B ⊗ U_C)` (an LU factorization); `B = Q_B R_B`, `C = Q_C R_C ⇒ B ⊗ C = (Q_B ⊗ Q_C)(R_B ⊗ R_C)` (a QR
factorization for square factors); and with thin pivoted QRs `B P_B = Q_B R_B`, `C P_C = Q_C R_C`, `(B ⊗ C)(P_B ⊗ P_C) = (Q_B ⊗ Q_C)(R_B
⊗ R_C)` is a thin QR factorization. In the book's layout (chapter 1's `Matrix.kroneckerFin`):
`Matrix.IsUpperTriangular.kroneckerFin` (with `IsLU.kroneckerFin`, `IsCholesky.kroneckerFin`), Mathlib
`Matrix.mul_kronecker_mul`, `Matrix.kronecker_mem_unitary`. The remark that rectangular `R` factors need row permutations
to be triangular is prose. ★★ (~50 lines)'''
deps = ["Matrix.IsUpperTriangular.kroneckerFin"]
source = 'Golub–Van Loan, Matrix Computations, §12.3.1'

[[node]]
id = "equation_12_3_3"
kind = "theorem"
desc = '''(12.3.3): `Q_Bᴴ B Q_B = T_B`, `Q_Cᴴ C Q_C = T_C ⇒ (Q_B ⊗ Q_C)ᴴ (B ⊗ C) (Q_B ⊗ Q_C) = T_B ⊗ T_C`, and `T_B ⊗ T_C` is upper triangular
when `T_B`, `T_C` are (Schur decompositions, over `ℂ`); hence `λ(B ⊗ C) = {β_i γ_j}` (the display before (12.3.3)). Mathlib
`Matrix.mul_kronecker_mul`, `Matrix.conjTranspose_kronecker`; `Matrix.IsUpperTriangular.kroneckerFin`,
`Matrix.charpoly_kronecker`. ★'''
deps = ["Matrix.IsUpperTriangular.kroneckerFin", "Matrix.charpoly_kronecker"]
source = 'Golub–Van Loan, Matrix Computations, Equation (12.3.3)'

[[node]]
id = "equation_12_3_4"
kind = "theorem"
desc = '''(12.3.4): `U_Bᴴ B V_B = Σ_B`, `U_Cᴴ C V_C = Σ_C ⇒ (U_B ⊗ U_C)ᴴ (B ⊗ C)(V_B ⊗ V_C) = Σ_B ⊗ Σ_C`; hence `σ(B ⊗ C) = {β_i γ_j}` (as a
