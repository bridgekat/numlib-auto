[[node]]
id = "kronecker_invariants"
kind = "theorem"
desc = '''§12.3.1, after (12.3.4): `B y = β y`, `C z = γ z ⇒ (B ⊗ C)(y ⊗ z) = βγ (y ⊗ z)`; `rank(B ⊗ C) = rank B · rank C`; `det(B ⊗ C) =
