[[node]]
id = "lemma_12_3_3"
kind = "theorem"
desc = '''Lemma 12.3.3: for `M ∈ ℝ^{n×n}`, `S = (M − Mᵀ)/2`, and orthonormal `u, v` with `S[u | v] = [u | v][0 μ; −μ 0]`, `μ = ρ(S)`: `Z_opt = μ(u vᵀ − v
uᵀ)` minimizes `‖M − Z‖_F` over skew-symmetric `Z` of rank `≤ 2` (P12.3.12). The constraint is `rank Z ≤ 2`, not `= 2`:
`Z_opt` is a difference of two rank-one matrices, of rank exactly `2` when `μ ≠ 0` and equal to `0` when `S = 0` (then `μ = 0`
and the book's formula gives `Z_opt = 0`, which is indeed the minimizer, `M` being symmetric). `ρ(S) =
‖S‖₂` for the normal matrix `S` (the surface helper `spectralRadius_skew_eq_l2_opNorm`, through `Matrix.complexify` and the
singular values of a normal matrix); then `Matrix.isMinOn_frobenius_norm_sub_skew_rank_le_two`. ★★ (~40 lines, the `ρ = ‖·‖₂`
helper)

Blocked: the backbone `Matrix.isMinOn_frobenius_norm_sub_skew_rank_le_two` (tens1's ★★★ Lemma 12.3.3) is not on main; the surface further needs `ρ(S) = ‖S‖₂` for skew `S` (~40 lines through `Matrix.complexify`). (agent s12)'''
deps = ["Matrix.isMinOn_frobenius_norm_sub_skew_rank_le_two"]
source = 'Golub–Van Loan, Matrix Computations, Lemma 12.3.3'

