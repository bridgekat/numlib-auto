[[node]]
id = "golub_rankOne_modification"
kind = "theorem"
desc = '''§10.1.4, Golub (1974): with `A Q_k = Q_k T_k + r_k e_kᵀ` (10.1.4), `τ ∈ {±1}`, `w = a q_k + b r_k` and
`E = τ w wᵀ` (`1 ≤ k ≤ grade`): `(A + E) Q_k = Q_k (T_k + τ a² e_k e_kᵀ) + (1 + τ a b) r_k e_kᵀ`. Proof:
`wᵀ Q_k = a q_kᵀ Q_k + b r_kᵀ Q_k = a e_kᵀ` (orthonormal columns, `Q_kᵀ r_k = 0`), so
`E Q_k = τ a w e_kᵀ = τ a² Q_k e_k e_kᵀ + τ a b r_k e_kᵀ`. Hence if `1 + τ a b = 0`, every eigenvalue
of `T̃_k = T_k + τ a² e_k e_kᵀ` is an eigenvalue of `A + E`. Matrix algebra from `equation_10_1_4` and
`equation_10_1_6`. ★'''
deps = ["equation_10_1_4", "equation_10_1_6"]
source = 'Golub–Van Loan, Matrix Computations, §10.1.4, rank-one modification'

[[node]]
id = "golub_rankOne_bracket"
kind = "theorem"
desc = '''§10.1.4 ("Using Theorem 8.1.8, it can be shown …"): with `1 + τ a b = 0` and `k ≤ grade` (so `T̃_k` is unreduced
and its eigenvalues are distinct), for `i = 2 : k` the interval `[λ_i(T̃_k), λ_{i−1}(T̃_k)]` contains an
eigenvalue of `A`. The eigenvalues of `T̃_k` are `k` distinct eigenvalues of `A + E = A + τ w wᵀ`
(`golub_rankOne_modification`); between two eigenvalues of `A + τ w wᵀ` lies an eigenvalue of `A` by the
rank-one interlacing of Theorem 8.1.8 (applied to `A = (A + E) − τ w wᵀ` with `c = w/‖w‖`). Also the
determinant formula `det(T̃_k − λI) = (α_k + τ a² − λ) p_{k−1}(λ) − β_{k−1}² p_{k−2}(λ)` (Laplace expansion
along the last row, as in the Sturm module). ★★'''
deps = ["golub_rankOne_modification", "GolubVanLoan.Chapter08.theorem_8_1_8"]
source = 'Golub–Van Loan, Matrix Computations, §10.1.4, rank-one modification'

[[node]]
id = "theorem_10_1_2"
kind = "theorem"
desc = '''Theorem 10.1.2 (Kaniel–Paige): symmetric `A` with (10.1.9), `k ≥ 1` steps before breakdown
(`Module.finrank (𝒦(A, q₁, k)) = k`), `θ_1 = λ_1(T_k)` (`Lanczos.ritzValues _ q k 0`), `cos φ_1 = |q₁ᵀ z_1|`
(`(ℝ ∙ q₁).angle z_1`), `ρ_1 = (λ_1 − λ_2)/(λ_2 − λ_n)` (10.1.10), `c_{k−1} = Polynomial.Chebyshev.T ℝ (k − 1)`:
`λ_1 ≥ θ_1 ≥ λ_1 − (λ_1 − λ_n) (tan φ_1 / c_{k−1}(1 + 2ρ_1))²`, under `q₁ᵀ z_1 ≠ 0` only (the book's
implicit condition: `tan φ_1` is finite). **No gap hypothesis**: when `λ_2 = λ_n` (so `ρ_1 = x/0 = 0` in
Lean) or `λ_2 = λ_1` (`ρ_1 = 0`), `c_{k−1}(1) = 1` and the claim is the `k`-free bound
`θ_1 ≥ q₁ᵀ A q₁ ≥ λ_1 cos²φ_1 + λ_n sin²φ_1 = λ_1 − (λ_1 − λ_n) sin²φ_1 ≥ λ_1 − (λ_1 − λ_n) tan²φ_1`
(Ritz values dominate the Rayleigh quotient of `q₁ ∈ 𝒦`, `Lanczos.ritzValues_eq_eigenvalues_compression`
and Courant–Fischer); otherwise `λ_n < λ_2 < λ_1` and the backbone `Lanczos.kaniel_paige_saad` applies at
the first index (empty deflation product). The case split is the only addition to the QSS proof. Also
`Lanczos.ritzValues_eq_eigenvalues_compression`, `Submodule.cosAngle_span_singleton`. The same proof as the
QSS surface's `property_5_12`, which cannot be imported. ★★'''
deps = ["Lanczos.kaniel_paige_saad", "Lanczos.ritzValues_eq_eigenvalues_compression", "Submodule.cosAngle_span_singleton"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 10.1.2'

[[node]]
id = "corollary_10_1_3"
kind = "theorem"
desc = '''Corollary 10.1.3: `λ_n ≤ θ_k ≤ λ_n + (λ_1 − λ_n) (tan φ_n / c_{k−1}(1 + 2ρ_n))²` with
`ρ_n = (λ_{n−1} − λ_n)/(λ_1 − λ_{n−1})`, `cos φ_n = |q₁ᵀ z_n|` (the book omits the absolute value). Theorem 10.1.2
for `−A`: `Krylov.subspace_neg`, `LinearMap.IsSymmetric.eigenvalues_neg`,
`LinearMap.IsSymmetric.exists_smul_eigenvectorBasis_neg` (the QSS `property_5_12_min` route). ★★'''
deps = ["theorem_10_1_2", "Krylov.subspace_neg", "LinearMap.IsSymmetric.eigenvalues_neg", "LinearMap.IsSymmetric.exists_smul_eigenvectorBasis_neg"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 10.1.3'

[[node]]
id = "theorem_10_1_4"
kind = "theorem"
desc = '''Theorem 10.1.4 (Kaniel–Paige–Saad): for `1 ≤ i ≤ k`, `θ_i = λ_i(T_k)`,
`λ_i ≥ θ_i ≥ λ_i − (λ_1 − λ_n) (κ_i tan φ_i / c_{k−i}(1 + 2ρ_i))²` with `ρ_i = (λ_i − λ_{i+1})/(λ_{i+1} − λ_n)`,
`κ_i = ∏_{j<i} (θ_j − λ_n)/(θ_j − λ_i)`, `cos φ_i = |q₁ᵀ z_i|`; hypotheses: `i < n`, `λ_n < λ_{i+1} < λ_i`,
`θ_j > λ_i` for `j < i` (so `κ_i` is defined), `q₁ᵀ z_i ≠ 0`. Backbone `Lanczos.kaniel_paige_saad` (whose
`κ_i` is built from the Ritz values exactly as here) with `Lanczos.ritzValues_eq_eigenvalues_compression`.
The book's proof is a reference (Saad, NMLE p. 201); the backbone proof is Saad's. ★★'''
deps = ["Lanczos.kaniel_paige_saad", "Lanczos.ritzValues_eq_eigenvalues_compression", "theorem_10_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 10.1.4'

[[node]]
id = "equation_10_1_11"
kind = "theorem"
desc = '''(10.1.11): if `λ_1 ≥ ⋯ ≥ λ_n ≥ 0`, `λ_1 > 0`, `q₁ᵀ z_1 ≠ 0`, `v = A^{k−1} q₁` and `γ_1 = vᵀAv/vᵀv`, then
`λ_1 ≥ γ_1 ≥ λ_1 − (λ_1 − λ_n) tan²φ_1 (λ_2/λ_1)^{2(k−1)}`. "Set p(x) = x^{k−1} in the proof of Theorem 10.1.2":
`γ_1 = r(P_S z_1)` for `S = span {v}` (Rayleigh quotients are scale invariant), so
`LinearMap.IsSymmetric.abs_sub_rayleighQuotient_starProjection_le` bounds `λ_1 − γ_1` by `(λ_1 − λ_n) tan²θ(z_1, S)`,
and `Submodule.tanAngle_span_singleton` computes `tan θ(z_1, span {A^{k−1} q₁}) ≤ tan φ_1 (λ_2/λ_1)^{k−1}` from
the eigen-expansion `A^{k−1} q₁ = ∑ d_i λ_i^{k−1} z_i` and `|λ_i| ≤ λ_2` for `i ≥ 2` (this is where
`λ_n ≥ 0` is used). Surface proof, ★★ (~100 lines). The comparison with Figure 10.1.1 is not a node. '''
deps = ["LinearMap.IsSymmetric.abs_sub_rayleighQuotient_starProjection_le", "Submodule.tanAngle_span_singleton", "Polynomial.aeval_apply_of_apply_eq_smul"]
