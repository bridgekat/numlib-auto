namespace = "GolubVanLoan.Chapter10"
desc = '''
§10.1, the symmetric Lanczos process: the gradient of the Rayleigh quotient (10.1.1), Algorithm 10.1.1
and Theorem 10.1.1 with (10.1.4) and (10.1.6), Ritz approximations (10.1.7)–(10.1.8) with the residual
bound and Golub's rank-one modification, the Kaniel–Paige–Saad bounds Theorem 10.1.2, Corollary 10.1.3,
Theorem 10.1.4, and the power-method comparison (10.1.11). Backbone: `Numlib/Krylov/{Arnoldi, Lanczos,
Decomposition}`, `Numlib/Eigen/{RayleighRitz, KrylovEigen, Perturbation}`; conventions in the chapter
group. The monotonicity `M_1 ≤ M_2 ≤ ⋯` of §10.1.1 is `LinearMap.IsSymmetric.eigenvalues_compression_mono`
and is cited in the module doc, not a node; (10.1.5) only displays the tridiagonal `T_k` (notation, the
backbone's `Lanczos.tridiag`), not a node; Figure 10.1.1 is numerical.
'''

[[node]]
id = "equation_10_1_1"
kind = "theorem"
desc = '''(10.1.1): for symmetric `A` and `x ≠ 0` in `EuclideanSpace ℝ (Fin n)`, the Rayleigh quotient
`r(x) = xᵀAx/xᵀx` (`(toEuclideanCLM A).rayleighQuotient`) has gradient `(2/‖x‖²)(A x − r(x) x)`; and hence
(the display after (10.1.3)) `∇r(x) ∈ span {x, A x}`. Staged backbone
`ContinuousLinearMap.hasGradientAt_rayleighQuotient`. ★'''
deps = ["ContinuousLinearMap.hasGradientAt_rayleighQuotient"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.1.1)'

[[node]]
id = "algorithm_10_1_1"
kind = "definition"
desc = '''Algorithm 10.1.1 (Lanczos tridiagonalization) as a D4 program, `noncomputable def algorithm_10_1_1
{M : Type → Type} [Monad M] (rnd : ℝ → M ℝ) {n : ℕ} (A : Matrix (Fin n) (Fin n) ℝ) (q₁ : Fin n → ℝ)
(fuel : ℕ) : M (LanczosState n)` (`fuel` last, convention 3), where the state structure (a helper of the
module) carries the step count `k`, the Lanczos vectors `q : ℕ → Fin n → ℝ`, `alpha beta : ℕ → ℝ`, the
residual `r` and the previous vector. **Indices are 0-based: `q j` is the book's `q_{j+1}`** (and
`alpha j`, `beta j` are the book's `α_{j+1}`, `β_{j+1}`); the book's `q_0 = 0` is not stored, the previous
vector starts at `0` (prototype `notes/gvl/ch10/proto/Shapes.lean`, `LanczosState`). Start: `k = 0`,
`r = q₁`, the first normalization by `‖q₁‖ = 1` (the book's `β_0 = 1`); each of `fuel` passes is a
no-op once `k > 0` and the last computed `β` is `0` (a comparison on the computed value), and otherwise
does, in the book's order, the normalization `q k = r / β` (one `rnd` per entry), `k = k+1`,
`α_k = q_kᵀ(A q_k)` (`A q_k` row by row and the dot product with `FloatingPoint.dotAccum`, i.e. chapter 1's
Algorithms 1.1.3 and 1.1.1),
`r_k = (A − α_k I) q_k − β_{k−1} q_{k−1}` (entrywise, rounding each product and difference),
`β_k = ‖r_k‖₂` (`√` of `FloatingPoint.dotAccum` on `r_k, r_k`, then one `rnd`). The shape (with local
stand-ins for `dotAccum`) is `notes/gvl/ch10/proto/Shapes.lean` and elaborates. ★★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.1.1'

[[node]]
id = "algorithm_10_1_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 10.1.1: for symmetric `A` and `‖q₁‖₂ = 1`, with
`s = Id.run (algorithm_10_1_1 pure A q₁ fuel)`, `T = toEuclideanLin A`, `q = WithLp.toLp 2 q₁`:
`s.k = min fuel (Krylov.grade T q)` and for `j < s.k`, `s.q j = (Arnoldi.vec T q j).ofLp`,
`s.alpha j = Lanczos.alpha T q j`, `s.beta j = Lanczos.beta T q j` (so the positive choice `β_k = ‖r_k‖`
of the book is the backbone's). Induction on the passes with the invariant "`s` is the backbone state at
step `s.k`": `Lanczos.w_succ_eq` is the residual update, `Arnoldi.vec_succ_eq` the normalization,
`Lanczos.beta_eq_zero_iff` the exit test (`β_j = 0 ↔ grade ≤ j + 1`); `FloatingPoint.dotAccum_id_finRange` and
`List.foldl_update_self` collapse the `Id` runs of the dot and matrix–vector loops. Statement shape in
`notes/gvl/ch10/proto/Shapes.lean`. ★★ (~200 lines)'''
deps = ["algorithm_10_1_1", "Lanczos.w_succ_eq", "Arnoldi.vec_succ_eq", "Lanczos.beta_eq_zero_iff", "Lanczos.alpha", "Lanczos.beta", "FloatingPoint.dotAccum_id_finRange", "List.foldl_update_self"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.1.1'

[[node]]
id = "theorem_10_1_1"
kind = "theorem"
desc = '''Theorem 10.1.1: Algorithm 10.1.1 runs until `k = m = rank K(A, q₁, n)` — with enough fuel
(`n ≤ fuel`), `s.k = (Matrix.krylovMatrix A q₁ n).rank` — and for `1 ≤ k ≤ m`: `A Q_k = Q_k T_k + r_k e_kᵀ`
(10.1.4), `Q_kᵀ Q_k = I_k`, and the columns of `Q_k` span `𝒦(A, q₁, k)`, where `Q_k = [q_1 | ⋯ | q_k]` is
formed from `s.q` and equals `Arnoldi.basisMatrix A q k`, and `T_k` from `s.alpha`, `s.beta` equals
`Lanczos.tridiag T q k`. From `algorithm_10_1_1_spec`, `Krylov.grade_eq_rank_krylovMatrix` (`grade ≤ n`
by `Krylov.grade_le_finrank`), `Lanczos.mul_basisMatrix`, `Arnoldi.conjTranspose_basisMatrix_mul_self`,
`Arnoldi.range_basisMatrix`. The book's induction (orthogonality from the three-term recurrence) is the
backbone's Gram–Schmidt definition read backwards. ★★'''
deps = ["algorithm_10_1_1_spec", "Krylov.grade_eq_rank_krylovMatrix", "Lanczos.mul_basisMatrix", "Arnoldi.conjTranspose_basisMatrix_mul_self", "Arnoldi.range_basisMatrix", "equation_10_1_4"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 10.1.1'

[[node]]
id = "equation_10_1_4"
kind = "theorem"
desc = '''(10.1.4): for symmetric `A`, `A Q_k = Q_k T_k + r_k e_kᵀ` with `Q_k = Arnoldi.basisMatrix A q k`,
`T_k = Lanczos.tridiag (toEuclideanLin A) q k`, `r_k = (Arnoldi.w _ q (k − 1)).ofLp`, `e_k = Krylov.lastVec 1 k`,
`1 ≤ k` (at every step; the orthonormality needs `k ≤ grade`, the relation does not). Backbone
`Lanczos.mul_basisMatrix` at `k − 1 + 1`. ★'''
deps = ["Lanczos.mul_basisMatrix", "Krylov.lastVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.1.4)'

[[node]]
id = "equation_10_1_6"
kind = "theorem"
desc = '''(10.1.6) and its consequences in the proof of Theorem 10.1.1: for `1 ≤ k ≤ grade`,
`Q_kᵀ A Q_k = T_k + Q_kᵀ r_k e_kᵀ`, `Q_kᵀ A Q_k = T_k` and `Q_kᵀ r_k = 0` (so `T_{ij} = q_iᵀ A q_j`).
Backbone `Arnoldi.conjTranspose_basisMatrix_mul_mul_basisMatrix`, `Arnoldi.conjTranspose_basisMatrix_mulVec_w`,
