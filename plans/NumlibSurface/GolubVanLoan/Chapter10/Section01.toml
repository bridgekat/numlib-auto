source = 'Golub–Van Loan, Matrix Computations, Equation (10.1.6)'

[[node]]
id = "isRitzPair_lanczos"
kind = "theorem"
desc = '''§10.1.4, the claim after (10.1.7): if `S_kᵀ T_k S_k = Θ_k = diag(θ_1, …, θ_k)` (a Schur decomposition,
Mathlib's `eigenvectorUnitary`/`eigenvalues` of the symmetric `T_k`) and `Y_k = Q_k S_k`, then for every
`i`, `(θ_i, y_i)` is a Ritz pair of `A` with respect to `𝒦(A, q₁, k)`: `Krylov.IsRitzPair`
(`y_i ∈ 𝒦`, `y_i ≠ 0`, `A y_i − θ_i y_i ⟂ 𝒦`). `k ≤ grade`. Backbone `Arnoldi.isRitzPair_of_mulVec_eq_smul`
with `Lanczos.hessenbergSq_eq_map_tridiag`. ★'''
deps = ["Arnoldi.isRitzPair_of_mulVec_eq_smul", "Krylov.IsRitzPair", "Lanczos.hessenbergSq_eq_map_tridiag"]
source = 'Golub–Van Loan, Matrix Computations, §10.1.4, Ritz pairs'

[[node]]
id = "equation_10_1_8"
