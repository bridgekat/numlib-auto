[[node]]
id = "davidson"
kind = "definition"
desc = '''(10.6.16), Davidson's method as a D4 program with fuel and `tol`: `x_1 = e₁`, `λ_1 = x_1ᵀ A x_1`, `r_1 = A x_1 − λ_1 x_1`,
`V_1 = [e₁]`; while `‖r_k‖ > tol`: solve `(M − λ_k I) δv_k = −r_k` (`M` the diagonal of `A`), `s_{k+1} = (I − V_k V_kᵀ) δv_k`,
`v_{k+1} = s_{k+1}/‖s_{k+1}‖₂`, `V_{k+1} = [V_k | v_{k+1}]`, compute a Ritz pair `(θ_{k+1}, t_{k+1})` of `V_{k+1}ᵀ A V_{k+1}`
("a suitably chosen" one: a caller-supplied selector from the eigenpairs of the small symmetric matrix, e.g. the
largest), `λ_{k+1} = θ_{k+1}`, `x_{k+1} = V_{k+1} t_{k+1}`, `r_{k+1} = A x_{k+1} − λ_{k+1} x_{k+1}`. The orthogonalization is
modified Gram–Schmidt (the book's remark), i.e. `InnerProductSpace.modifiedGramSchmidtSweep` in exact arithmetic. ★★

Blocked (effort): a D4 program with a growing basis `V_k` (a family of columns), a modified Gram–Schmidt expansion and a caller-supplied Ritz-pair selector; not attempted in this round. Estimate ~150 lines with its spec.'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (10.6.16)'

[[node]]
id = "equation_10_6_16"
kind = "theorem"
desc = '''Exact semantics of (10.6.16) (the claims of §10.6.3): as long as no `s_{k+1}` vanishes, `V_k` has orthonormal columns,
`(λ_k, x_k)` is a Ritz pair of symmetric `A` on `ran V_k` (`Krylov.IsRitzPair`), and hence `V_kᵀ r_k = 0`. The
Ritz values are nondecreasing in `k` when the largest is selected (`LinearMap.IsSymmetric.eigenvalues_compression_mono`,
the Davidson monotonicity; not claimed by the book, stated because it is free). ★★

Blocked: needs `davidson`. The Ritz-pair claim is `Krylov.isRitzPair_iff_hasEigenvector` on `ran V_k` once the program exists (~150 lines).'''
deps = ["davidson", "Krylov.IsRitzPair", "Krylov.isRitzPair_iff_hasEigenvector", "InnerProductSpace.modifiedGramSchmidtSweep_eq_sub_sum", "LinearMap.IsSymmetric.eigenvalues_compression_mono"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.6.16)'

