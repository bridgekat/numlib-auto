[[node]]
id = "householderLanczos"
kind = "definition"
desc = '''(10.3.4), Lanczos with complete reorthogonalization by Householder matrices, as a D4 program over
`k = 1 : n − 1` (no early exit: "it makes no difference if β_k = 0"), returning the vectors `q_1, …, q_n`,
the `α`, `β` and the **reflector data it applied** (`List ((Fin n → ℝ) × ℝ)`, convention 13). `H_0` with
`H_0 q₁ = ±‖q₁‖ e₁` is chapter 5's `houseOn rnd (List.finRange n) q₁` (`GolubVanLoan.Chapter05.houseOn`);
then `α_k = q_kᵀ A q_k`, `r_k = (A − α_k I) q_k − β_{k−1} q_{k−1}`, `w = (H_{k−1} ⋯ H_0) r_k` (the stored
reflectors applied in turn, chapter 5's `householderApplyLeft` on a one-column matrix), `H_k` by
`houseOn rnd T_k w` with `T_k` the index list `[k, …, n−1]` (0-based; `H_k` zeroes `w(k+2 : n)`, so
`H_k w = [w_1, …, w_k, β_k, 0, …, 0]ᵀ`), `q_{k+1} = H_0 ⋯ H_k e_{k+1}` (the reflectors applied in reverse
order to `e_{k+1}`). Each `(v, β)` is kept with the `β` that `house` returned; no reflector is rebuilt as
`2/(vᵀv)` from its vector (surface review Major 2: when `house` returns `β = 0` the rebuilt reflector
would be `I − 2e₁e₁ᵀ`, not the identity it applied). ★★

Blocked: calls chapter 5's `GolubVanLoan.Chapter05.houseOn` and `householderApplyLeft` (convention 13), whose surface module is not on main (2026-09-26).'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.4)'

[[node]]
id = "equation_10_3_4"
kind = "theorem"
desc = '''Exact semantics of (10.3.4), "the same specification as its canonical form": for symmetric `A`,
`‖q₁‖ = 1`, the computed `q_1, …, q_n` are orthonormal; for `j < grade (toEuclideanLin A) q₁` each `q_{j+1}` is
`± Arnoldi.vec _ q₁ j` (Householder sign convention) and the computed `α_j`, `|β_j|` are `Lanczos.alpha`,
`Lanczos.beta`. The `H_j` are read from the returned data, `H_0 ⋯ H_k =
GolubVanLoan.Chapter05.householderProduct (data.take (k+1))`, with the returned `β`s. Proof: `H_0 ⋯ H_k` is orthogonal with first `k + 1` columns spanning the flag of
`r_0, …, r_k`, which is the Krylov flag while `β ≠ 0`; orthonormality of the columns of an orthogonal matrix
and `InnerProductSpace.exists_norm_eq_one_smul_gramSchmidtNormed` (flag uniqueness up to unimodular, here
real, scalars). Past the grade the vectors continue an orthonormal basis (the book's "may safely run until
k = n − 1"). ★★★ (~350 lines)

Blocked: needs `householderLanczos` (chapter 5's Householder programs, not on main). Estimate ~350 lines once they land (plan desc route).'''
deps = ["householderLanczos", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "InnerProductSpace.exists_norm_eq_one_smul_gramSchmidtNormed", "Arnoldi.vec", "Lanczos.alpha", "Lanczos.beta"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.4)'

