namespace = "GolubVanLoan.Chapter10"
desc = '''
§10.3, practical Lanczos procedures: the two-vector implementation (10.3.1), complete reorthogonalization
with Householder matrices (10.3.4), the "good Ritz pair" of selective reorthogonalization and the
Kahan–Parlett Lemma 10.3.1, block Lanczos (10.3.8)–(10.3.9) and Underwood's Theorem 10.3.2. The
floating-point content of §10.3.2 and §10.3.4 — (10.3.2)–(10.3.3), (10.3.5)–(10.3.6) and the `≈`
estimates between them — is quoted from Paige without derivation and is not formalized (chapter group,
**Not formalized**); the application of Theorem 8.1.16 at the end of §10.3.2 is invalid as printed
(`T̂_k` is not `Q̂_kᵀ A Q̂_k`) and is recorded in the report's Doubts. The ghost-eigenvalue discussion
(§10.3.5) and the restarted block Lanczos of §10.3.7 are prose. Backbone: `Numlib/Krylov/{Lanczos, Block,
Decomposition}`, `Numlib/LinearAlgebra/Matrix/QR` (`Matrix.householder`), staged appends to
`Krylov/Block`, `Eigen/KrylovEigen`, `Analysis/Matrix/SpectralNorm`.
'''

[[node]]
id = "twoVectorLanczos"
kind = "definition"
desc = '''(10.3.1), Lanczos with two `n`-vectors `w, v` as a D4 program (fuel-bounded `while β_k ≠ 0`): `w = q₁`,
`v = A w`, `α₁ = wᵀv`, `v = v − α₁ w`, `β₁ = ‖v‖₂`, `k = 1`; each pass swaps in place
(`t = w_i, w_i = v_i/β_k, v_i = −β_k t` for `i = 1:n`, one `rnd` per product/quotient), `v = v + A w`
(chapter 1's Algorithm 1.1.3 with `y = v`), `k = k+1`, `α_k = wᵀv`, `v = v − α_k w`, `β_k = ‖v‖₂`. The state
records `k, w, v` and the families `alpha, beta : ℕ → ℝ`. `noncomputable def`, see the chapter conventions. ★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.1)'

[[node]]
id = "equation_10_3_1"
kind = "theorem"
desc = '''Exact semantics of (10.3.1): for symmetric `A` and `‖q₁‖ = 1`, the run computes the same `α_j`, `β_j` as
Algorithm 10.1.1 (`Lanczos.alpha`, `Lanczos.beta`, `j < k`, `k = min (fuel + 1) grade`), and at the end of the
loop body `w = q_k` and `v = r_k = A q_k − α_k q_k − β_{k−1} q_{k−1}` (the book's claim after the display).
The identity `α_k = q_kᵀ(A q_k − β_{k−1} q_{k−1})` used by the program is `q_kᵀ q_{k−1} = 0`. Invariant
induction against `algorithm_10_1_1_spec`'s backbone state (`Lanczos.w_succ_eq`). ★★'''
deps = ["twoVectorLanczos", "algorithm_10_1_1_spec", "Lanczos.w_succ_eq", "Arnoldi.inner_vec_eq_zero"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.1)'

[[node]]
id = "householderLanczos"
kind = "definition"
desc = '''(10.3.4), Lanczos with complete reorthogonalization by Householder matrices, as a D4 program over
`k = 1 : n − 1` (no early exit: "it makes no difference if β_k = 0"), returning the vectors `q_1, …, q_n`,
the `α`, `β` and the **reflector data it applied** (`List ((Fin n → ℝ) × ℝ)`, convention 13). `H_0` with
`H_0 q₁ = ±‖q₁‖ e₁` is chapter 5's `houseOn rnd (List.finRange n) q₁` (`GolubVanLoan.Chapter05.houseOn`);
then `α_k = q_kᵀ A q_k`, `r_k = (A − α_k I) q_k − β_{k−1} q_{k−1}`, `w = (H_{k−1} ⋯ H_0) r_k` (the stored
reflectors applied in turn, chapter 5's `householderApplyLeft` on a one-column matrix), `H_k` by
`houseOn rnd T_k w` with `T_k` the index list `[k, …, n−1]` (0-based; `H_k` zeroes `w(k+2 : n)`, so
`H_k w = [w_1, …, w_k, β_k, 0, …, 0]ᵀ`), `q_{k+1} = H_0 ⋯ H_k e_{k+1}` (the reflectors applied in reverse
order to `e_{k+1}`). Each `(v, β)` is kept with the `β` that `house` returned; no reflector is rebuilt as
`2/(vᵀv)` from its vector (surface review Major 2: when `house` returns `β = 0` the rebuilt reflector
would be `I − 2e₁e₁ᵀ`, not the identity it applied). ★★'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.householderApplyLeft"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.4)'

[[node]]
id = "equation_10_3_4"
kind = "theorem"
desc = '''Exact semantics of (10.3.4), "the same specification as its canonical form": for symmetric `A`,
`‖q₁‖ = 1`, the computed `q_1, …, q_n` are orthonormal; for `j < grade (toEuclideanLin A) q₁` each `q_{j+1}` is
`± Arnoldi.vec _ q₁ j` (Householder sign convention) and the computed `α_j`, `|β_j|` are `Lanczos.alpha`,
`Lanczos.beta`. The `H_j` are read from the returned data, `H_0 ⋯ H_k =
GolubVanLoan.Chapter05.householderProduct (data.take (k+1))`, with the returned `β`s. Proof: `H_0 ⋯ H_k` is orthogonal with first `k + 1` columns spanning the flag of
`r_0, …, r_k`, which is the Krylov flag while `β ≠ 0`; orthonormality of the columns of an orthogonal matrix
and `InnerProductSpace.exists_norm_eq_one_smul_gramSchmidtNormed` (flag uniqueness up to unimodular, here
real, scalars). Past the grade the vectors continue an orthonormal basis (the book's "may safely run until
k = n − 1"). ★★★ (~350 lines)'''
deps = ["householderLanczos", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderApplyLeft_spec", "InnerProductSpace.exists_norm_eq_one_smul_gramSchmidtNormed", "Arnoldi.vec", "Lanczos.alpha", "Lanczos.beta"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.4)'

[[node]]
id = "IsGoodRitzPair"
kind = "definition"
desc = '''§10.3.4 (Parlett–Scott): a computed Ritz pair `(θ̂, ŷ)` is *good* if `‖A ŷ − θ̂ ŷ‖₂ ≤ √u ‖A‖₂`, `u` the unit roundoff
of a `FloatingPoint.RoundingModel` (`fp.u`). A definition only; the book states no theorem about it. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §10.3.4, Definition'

[[node]]
id = "lemma_10_3_1"
kind = "theorem"
desc = '''Lemma 10.3.1 (Kahan–Parlett): for `S : Matrix (Fin n) (Fin k) ℝ`, `d : Fin n → ℝ`, `S₊ = [S | d]`
(`Matrix.of` with `Fin.lastCases`), if `‖I_k − SᵀS‖₂ ≤ μ` and `|1 − dᵀd| ≤ δ` then
`‖I_{k+1} − S₊ᵀS₊‖₂ ≤ μ₊ = (μ + δ + √((μ − δ)² + 4 ‖Sᵀd‖₂²))/2`. `I − S₊ᵀS₊` is the Hermitian block matrix
`[I − SᵀS, −Sᵀd; −dᵀS, 1 − dᵀd]` (reindexed from `Fin k ⊕ Fin 1`, `finSumFinEquiv`); staged backbone
`Matrix.l2_opNorm_fromBlocks_le_of_isHermitian`. ★'''
deps = ["Matrix.l2_opNorm_fromBlocks_le_of_isHermitian"]
source = 'Golub–Van Loan, Matrix Computations, Lemma 10.3.1'

[[node]]
id = "blockLanczos"
kind = "definition"
desc = '''(10.3.8), block Lanczos as a D4 program: `X₁ ∈ ℝ^{n×p}` with orthonormal columns, `M₁ = X₁ᵀ A X₁`; for
`k = 1 : r − 1`: `R_k = A X_k − X_k M_k − X_{k−1} B_{k−1}ᵀ` (`X_0 B_0ᵀ = 0`), `X_{k+1} B_k = R_k` a QR factorization
(chapter 5's Householder QR, Algorithm 5.2.1, whose reflector data carry the `β`s `house` returned;
`X_{k+1}` is the first `p` columns of chapter 5's `backwardAccumulation` of that data — never (5.1.5)'s
recomputed `β = 2/(vᵀv)`, convention 13), `M_{k+1} = X_{k+1}ᵀ A X_{k+1}`. State: the blocks
`X : ℕ → Matrix (Fin n) (Fin p) ℝ`, `M B : ℕ → Matrix (Fin p) (Fin p) ℝ`. ★★'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_2_1", "GolubVanLoan.Chapter05.backwardAccumulation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.8)'

[[node]]
id = "equation_10_3_8"
kind = "theorem"
desc = '''Exact semantics of (10.3.8): for symmetric `A`, as long as no `R_k` (`k < s`) is rank deficient, the
columns of `[X_1 | ⋯ | X_s]` are orthonormal, span `Krylov.blockSubspace (toEuclideanLin A) (cols X₁) s`,
and form an `IsBlockArnoldiBasis` (so they agree with `BlockArnoldi.vec` up to unimodular scalars,
`IsBlockArnoldiBasis.exists_norm_eq_one_smul_vec`); each `B_k` is upper triangular, `M_k = X_kᵀ A X_k`, and
the coefficient matrix is the block tridiagonal `T̄_s` of (10.3.7), Hermitian with bandwidth `p`
(staged `BlockArnoldi.coeff_eq_zero_of_isSymmetric`). The book's "argument similar to Theorem 10.1.1". ★★★
(~300 lines)'''
deps = ["blockLanczos", "GolubVanLoan.Chapter05.algorithm_5_2_1_spec", "GolubVanLoan.Chapter05.backwardAccumulation_spec", "IsBlockArnoldiBasis", "IsBlockArnoldiBasis.exists_norm_eq_one_smul_vec", "IsBlockArnoldiBasis.span_eq_blockSubspace", "BlockArnoldi.coeff_eq_zero_of_isSymmetric", "Krylov.BandRelation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.8)'

[[node]]
id = "equation_10_3_9"
kind = "theorem"
desc = '''(10.3.9): at the beginning of the `k`-th pass, `A [X_1 | ⋯ | X_k] = [X_1 | ⋯ | X_k] T̄_k + R_k [0 | ⋯ | 0 | I_p]`,
`T̄_k` the block tridiagonal matrix of the `M_i`, `B_i`. The band relation `Krylov.BandRelation.apply_sum`
read in matrix form, from `equation_10_3_8`. ★'''
deps = ["equation_10_3_8", "Krylov.BandRelation.apply_sum"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.3.9)'

[[node]]
id = "theorem_10_3_2"
kind = "theorem"
desc = '''Theorem 10.3.2 (Underwood): `A` symmetric with `Zᵀ A Z = diag(λ_1 ≥ ⋯ ≥ λ_n)`, `μ_1 ≥ ⋯ ≥ μ_p` the `p` largest
eigenvalues of `T̄_k` after `k` steps of (10.3.8) (before breakdown), `Z₁ = [z_1 … z_p]`,
`0 < cos φ_p = σ_p(Z₁ᵀ X₁)` (`Matrix.singularValues`, smallest): for `i = 1 : p`,
`λ_i ≥ μ_i ≥ λ_i − (λ_1 − λ_n) (tan φ_p / c_{k−1}(1 + 2ρ_i))²`, `ρ_i = (λ_i − λ_{p+1})/(λ_{p+1} − λ_n)`, with no
gap hypothesis, as in the book: the backbone `BlockLanczos.kaniel_paige_saad` takes none (in the degenerate
cases `ρ_i = 0` in Lean and its proof uses the `k = 1` competitor; unlike the proved single-vector
`Lanczos.kaniel_paige_saad`, which `theorem_10_1_2` wraps with a case split). The book writes `tan(θ_p)` for `tan(φ_p)` (Doubts). Staged backbone
`BlockLanczos.kaniel_paige_saad` with `equation_10_3_8` (the eigenvalues of `T̄_k` are those of the
compression to the block Krylov subspace). ★★'''
deps = ["BlockLanczos.kaniel_paige_saad", "equation_10_3_8", "Matrix.singularValues"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 10.3.2'
