(`V_{k+1} B̄_k` split into its first `k` columns and the last). ★'''
deps = ["GolubKahan.conjTranspose_mul_leftMatrix", "algorithm_10_4_1_spec", "Krylov.lastVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.10)'

