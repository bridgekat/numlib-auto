namespace = "GolubVanLoan.Chapter10"
desc = '''
§10.4, large sparse SVD frameworks: the upper bidiagonal form (10.4.1) and its column equations
(10.4.2)–(10.4.7), Algorithm 10.4.1 (Golub–Kahan) with (10.4.8)–(10.4.12), Ritz approximations
(10.4.13)–(10.4.15), the tridiagonal–bidiagonal connection (10.4.16)–(10.4.17), the lower form (10.4.18)
and Algorithm 10.4.2 (Paige–Saunders) with (10.4.19), and the deterministic identities of the CUR sketch
(10.4.20)–(10.4.24). `A : Matrix (Fin m) (Fin n) ℝ`, vectors of `EuclideanSpace ℝ (Fin n)` and
`EuclideanSpace ℝ (Fin m)`; the backbone is `Numlib/Krylov/Bidiagonalization` (namespace `GolubKahan`, one
process for both forms: Paige–Saunders is Golub–Kahan of `Aᵀ`), instantiated with
`toEuclideanLin A`, `toEuclideanLin Aᵀ` and `hadj` from `Matrix.toEuclideanLin_conjTranspose_inner_left`.
The randomized sampling of §10.4.5 and its probabilistic bound are not formalized (chapter group); the
4 × 3 permutation example of §10.4.3 is an illustration.
'''

[[node]]
id = "equation_10_4_1"
kind = "theorem"
desc = '''(10.4.1): for `A ∈ ℝ^{m×n}`, `m ≥ n`, there are orthogonal `U`, `V` (`Matrix.orthogonalGroup`) with `Uᵀ A V = B`
upper bidiagonal (`Matrix.IsUpperBidiagonal` of the leading `n × n` block, zero below); and `A`, `B` have the same
singular values (`Matrix.singularValues` is invariant under orthogonal equivalence). Backbone
`Matrix.exists_orthogonal_mul_mul_orthogonal_isUpperBidiagonal` (QSS (5.57); over `ℝ` its unitary groups are the
orthogonal groups); chapter 5's Algorithm 5.4.2 is the algorithm. ★'''
deps = ["Matrix.IsUpperBidiagonal", "Matrix.singularValues", "Matrix.exists_orthogonal_mul_mul_orthogonal_isUpperBidiagonal"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.1)'

[[node]]
id = "equation_10_4_2"
kind = "theorem"
desc = '''(10.4.2): if `A V = U B` with `B` as in (10.4.1) (entries `α_k`, `β_k`), then `A v_k = α_k u_k + β_{k−1} u_{k−1}` for
`k = 1 : n` (`β_0 u_0 = 0`): column `k` of `A V = U B`. ★'''
deps = ["equation_10_4_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.2)'

[[node]]
id = "equation_10_4_3"
kind = "theorem"
desc = '''(10.4.3): with `Aᵀ U = V Bᵀ` (from (10.4.1), `U`, `V` orthogonal), `Aᵀ u_k = α_k v_k + β_k v_{k+1}` for `k = 1 : n`
(`β_n v_{n+1} = 0`). Column `k` of `Aᵀ U = V Bᵀ`. ★'''
deps = ["equation_10_4_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.3)'

[[node]]
id = "equation_10_4_6"
kind = "theorem"
desc = '''(10.4.6): in the setting of (10.4.2), `A V(:, 1:k) = U(:, 1:k) B(1:k, 1:k)` for every `k ≤ n` (the book prints
`A U(:, 1:k) = V(:, 1:k) B(1:k, 1:k)`, which does not typecheck; and it attributes the identity to `β_k = 0`,
which only (10.4.7) needs — Doubts). ★'''
deps = ["equation_10_4_2"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.6)'

[[node]]
id = "equation_10_4_7"
kind = "theorem"
desc = '''(10.4.7): if `β_k = 0`, `Aᵀ V(:, 1:k)`… read correctly, `Aᵀ U(:, 1:k) = V(:, 1:k) B(1:k, 1:k)ᵀ` (the book's
`Aᵀ V(:, 1:k) = U(:, 1:k) …` swaps `U` and `V`); and then `Aᵀ A V(:, 1:k) = V(:, 1:k) B(1:k,1:k)ᵀ B(1:k,1:k)`. From
(10.4.3) at `j ≤ k` with `β_k = 0`, and `equation_10_4_6`. ★'''
deps = ["equation_10_4_3", "equation_10_4_6"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.7)'

[[node]]
id = "singularValues_bidiag_subset"
kind = "theorem"
desc = '''§10.4.1, after (10.4.7): if `β_k = 0` then `σ(B(1:k, 1:k)) ⊆ σ(A)`: every singular value of `B(1:k,1:k)` is a singular
value of `A`. `ran V(:, 1:k)` is `AᵀA`-invariant with `AᵀA` acting as `B_kᵀB_k` in the orthonormal basis, so the
eigenvalues of `B_kᵀB_k` are eigenvalues of `AᵀA` (restriction to an invariant subspace), and singular values
are square roots of those (`Matrix.sq_singularValues` for both). ★★'''
deps = ["equation_10_4_7", "Matrix.singularValues", "Matrix.sq_singularValues"]
source = 'Golub–Van Loan, Matrix Computations, §10.4.1, singular values of B(1:k,1:k)'

[[node]]
id = "algorithm_10_4_1"
kind = "definition"
desc = '''Algorithm 10.4.1 (Golub–Kahan bidiagonalization) as a D4 program with fuel: `k = 0, p_0 = v_c, β_0 = 1, u_0 = 0`; while
`β_k ≠ 0`: `v_{k+1} = p_k/β_k`, `k = k+1`, `r_k = A v_k − β_{k−1} u_{k−1}`, `α_k = ‖r_k‖₂`, `u_k = r_k/α_k`,
`p_k = Aᵀ u_k − α_k v_k`, `β_k = ‖p_k‖₂` (chapter 1's programs for `A v`, `Aᵀ u`, the dot products). State:
`k`, `u v : ℕ → Fin _ → ℝ`, `alpha beta : ℕ → ℝ`, `p`. `noncomputable def`. ★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.4.1'

[[node]]
id = "algorithm_10_4_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 10.4.1: for `A` of full column rank and `‖v_c‖ = 1`, with `g = grade (AᵀA) v_c`
(`GolubKahan` on `toEuclideanLin A`, `toEuclideanLin Aᵀ`): the run stops after `min fuel g` passes, and for `j`
below that, `v_{j+1} = GolubKahan.rightVec … j`, `u_{j+1} = GolubKahan.leftVec … j`, `α_{j+1} = GolubKahan.alpha … j > 0`,
`β_{j+1} = GolubKahan.beta … j`. Full column rank makes `AᵀA` invertible, so no `α` vanishes before the last `β`
(`GolubKahan.grade_comp_adjoint`). Invariant induction with `GolubKahan.apply_rightVec`,
`GolubKahan.adjoint_apply_leftVec`, `GolubKahan.alpha_nonneg` (the algorithm's norms are the backbone's
coefficients). ★★ (~200 lines)'''
deps = ["algorithm_10_4_1", "GolubKahan.apply_rightVec", "GolubKahan.adjoint_apply_leftVec", "GolubKahan.alpha_nonneg", "GolubKahan.grade_comp_adjoint"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.4.1'

[[node]]
id = "equation_10_4_9"
kind = "theorem"
desc = '''(10.4.9): after the `k`-th pass (with `α_k > 0`), `A V_k = U_k B_k`, `B_k` of (10.4.8) = `GolubKahan.bidiag … k`.
Backbone `GolubKahan.mul_rightMatrix` through `algorithm_10_4_1_spec`. ★'''
deps = ["GolubKahan.mul_rightMatrix", "GolubKahan.bidiag", "algorithm_10_4_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.9)'

[[node]]
