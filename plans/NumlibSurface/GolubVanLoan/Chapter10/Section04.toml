[[node]]
id = "bidiag_transpose_mul_bidiag"
kind = "theorem"
desc = '''§10.4.1, "the symmetric Lanczos convergence theory … can be applied": `B_kᵀ B_k = T_k(AᵀA, v_c)`, the Lanczos
tridiagonal matrix of `AᵀA` from `v_c`, so the squared singular values of `B_k` are the Ritz values of `AᵀA` on
`𝒦(AᵀA, v_c, k)` and Theorems 10.1.2–10.1.4 bound them. Backbone `GolubKahan.bidiag_conjTranspose_mul_bidiag`
with `Lanczos.ritzValues_eq_eigenvalues_compression`. ★'''
deps = ["GolubKahan.bidiag_conjTranspose_mul_bidiag", "Lanczos.ritzValues_eq_eigenvalues_compression", "theorem_10_1_4"]
source = 'Golub–Van Loan, Matrix Computations, §10.4.1, the Lanczos connection'

[[node]]
id = "equation_10_4_14"
kind = "theorem"
desc = '''(10.4.14): with the SVD `F_kᵀ B_k G_k = Γ = diag(γ_1, …, γ_k)` (10.4.13) (chapter 2's SVD in the book's form, or
`Matrix.exists_svd`), `Y_k = V_k G_k`, `Z_k = U_k F_k`: `A Y_k = Z_k Γ`, i.e. `A y_i = γ_i z_i`. From
`equation_10_4_9`. ★'''
deps = ["equation_10_4_9", "Matrix.exists_svd"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.14)'

[[node]]
