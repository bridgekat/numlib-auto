desc = '''(10.4.20): with the SVD `A = Z̃ Σ̃ Ỹᵀ` and `k < rank A`, `Ã_k = Z̃₁ Σ̃₁ Ỹ₁ᵀ = Z̃₁ Z̃₁ᵀ A` (from `Z̃₁ᵀ A = Σ̃₁ Ỹ₁ᵀ`), and `Ã_k`
