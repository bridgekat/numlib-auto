desc = '''(10.4.15): `Aᵀ Z_k = Y_k Γ + p_k e_kᵀ F_k`, i.e. `Aᵀ z_i = γ_i y_i + [F_k]_{ki} p_k`. From `equation_10_4_10`. ★'''
deps = ["equation_10_4_10", "equation_10_4_14"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.15)'

[[node]]
id = "isRitzPair_gram"
