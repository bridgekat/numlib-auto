desc = '''§10.4.2, after (10.4.15): `AᵀA y_i = γ_i² y_i + γ_i [F_k]_{ki} p_k` (the book prints `γ_i² z_i + [F_k]_{ki} p_k`), and
`(γ_i², y_i)` is a Ritz pair of `AᵀA` with respect to `ran(V_k)` (the book writes `{γ_i, y_i}`): `Krylov.IsRitzPair`,
the residual being a multiple of `p_k ⟂ ran V_k`. Doubts records both corrections. ★'''
deps = ["equation_10_4_14", "equation_10_4_15", "Krylov.IsRitzPair"]
source = 'Golub–Van Loan, Matrix Computations, §10.4.2, Ritz pairs of AᵀA'

[[node]]
id = "lanczos_jordanWielandt"
kind = "theorem"
desc = '''§10.4.3 with (10.4.16)–(10.4.17): Algorithm 10.1.1 applied to `C = [0 A; Aᵀ 0]` (`Matrix.fromBlocks 0 A Aᵀ 0`
reindexed to `Fin (m + n)`) from `q₁ = [0; v_c]` produces, after `2k` steps (before breakdown), a `T_{2k}` with zero
diagonal and subdiagonal `(α_1, β_1, α_2, β_2, …, β_{k−1}, α_k)`. Backbone `GolubKahan.lanczos_jordanWielandt`,
which concerns the Hermitian dilation `LinearMap.hermitianDilation A Astar` on `WithLp 2 (E × F)` (domain
factor first, `(x, y) ↦ (Astar y, A x)`) started at `(v, 0)`, with `Arnoldi.vec (2j) = (rightVec j, 0)` and
`Arnoldi.vec (2j+1) = (0, leftVec j)`. The book's `C` on `F × E` from `[0; v_c]` is the same operator with the
two factors exchanged, so the transport isometry `WithLp 2 (E × F) ≃ₗᵢ EuclideanSpace ℝ (Fin m ⊕ Fin n)` must
swap the factors (`WithLp.prodComm`-type isometry composed with the two coordinate isometries); then
`Arnoldi.vec_conj_linearIsometryEquiv` carries the Lanczos vectors across and the tridiagonal conclusion
is unchanged. (Alternatively restate with `Matrix.hermitianDilation A = fromBlocks 0 Aᵀ A 0` on
`Fin n ⊕ Fin m`, which needs no swap, and start from `[v_c; 0]`.) ★★'''
deps = ["GolubKahan.lanczos_jordanWielandt", "LinearMap.hermitianDilation", "Arnoldi.vec_conj_linearIsometryEquiv", "algorithm_10_1_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, §10.4.3, the tridiagonal–bidiagonal connection'

[[node]]
id = "equation_10_4_18"
kind = "theorem"
desc = '''(10.4.18): for `A ∈ ℝ^{m×n}` with `m > n` there are orthogonal `U`, `V` with `Uᵀ A V = B` lower bidiagonal with
`n + 1` nonzero rows (`α_1, …, α_n` on the diagonal, `β_2, …, β_{n+1}` below): `B.IsLowerBidiagonalRect` for the
whole `m × n` `B` (the rectangular `Matrix.IsLowerBidiagonalRect`: entries only at `(i, i)` and `(i+1, i)`, so
rows `≥ n + 1` vanish automatically). The transpose of the bidiagonalization of the wide `Aᵀ`: backbone
`Matrix.exists_unitary_mul_mul_unitary_apply_eq_zero` holds for every shape (entries only at `(i, i)` and
`(i, i+1)`), and for `Aᵀ` its transpose has entries only at `(i, i)` and `(i+1, i)`. ★'''
deps = ["Matrix.IsLowerBidiagonalRect", "Matrix.exists_unitary_mul_mul_unitary_apply_eq_zero"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.4.18)'

[[node]]
id = "algorithm_10_4_2"
kind = "definition"
desc = '''Algorithm 10.4.2 (Paige–Saunders bidiagonalization) as a D4 program with fuel: `k = 1, p_0 = u_c, β_1 = 1, v_0 = 0`;
while `β_k > 0`: `u_k = p_{k−1}/β_k`, `r_k = Aᵀ u_k − β_k v_{k−1}`, `α_k = ‖r_k‖₂`, `v_k = r_k/α_k`,
`p_k = A v_k − α_k u_k`, `β_{k+1} = ‖p_k‖₂`, `k = k+1`. `u_c ∈ ℝ^m` (the book writes `ℝ^n`, Doubts). ★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.4.2'

[[node]]
id = "algorithm_10_4_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 10.4.2: it is Algorithm 10.4.1 for `Aᵀ` started from `u_c` — the Golub–Kahan
process of the pair `(toEuclideanLin Aᵀ, toEuclideanLin A)`: `u_j = GolubKahan.rightVec Aᵀ A u_c (j−1)`,
`v_j = GolubKahan.leftVec Aᵀ A u_c (j−1)`, `α_j = GolubKahan.alpha … (j−1)`, `β_{j+1} = GolubKahan.beta … (j−1)`
for `j` up to the stopping index, which is `min fuel (grade (A Aᵀ) u_c)` when `α` does not vanish first. The
book's hypothesis "`A(1:n, 1:n)` nonsingular" is not what the algorithm needs (Doubts); the spec assumes
full column rank of `A` (so `α_j > 0` as long as `β_j > 0`). Same invariant induction as
`algorithm_10_4_1_spec`. ★★'''
deps = ["algorithm_10_4_2", "algorithm_10_4_1_spec", "GolubKahan.apply_rightVec", "GolubKahan.adjoint_apply_leftVec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.4.2'

