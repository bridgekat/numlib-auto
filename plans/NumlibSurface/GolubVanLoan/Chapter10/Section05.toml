kind = "definition"
desc = '''(10.5.11), the unsymmetric Lanczos tridiagonalization with the canonical scaling `β_k = ‖r_k‖₂`, as a D4 program with fuel:
`q₁, q̃₁` given (unit, `q̃₁ᵀ q₁ ≠ 0`), `k = 0, q_0 = 0, r_0 = q₁, q̃_0 = 0, r̃_0 = q̃₁` (the book's `s_0`); while
