[[node]]
id = "implicitRestart_isArnoldiDecomposition"
kind = "theorem"
desc = '''§10.5.3, the implicit restart: `V` has lower bandwidth `p`, so `V(m, 1 : m−p−1) = 0`, and with `j = m − p ≥ 1`,
`A Q₊(:, 1:j) = Q₊(:, 1:j) H₊(1:j, 1:j) + r₊ e_jᵀ` is a `j`-step Arnoldi decomposition (`IsArnoldiDecomposition`), where
`r₊ = h⁺_{j+1,j} Q₊(:, j+1) + v_{mj} r_c`. The book writes the residual as `v_{mj} r_c` and in the loop "Replace r_c
with v_{mj} r_c", dropping the Hessenberg term `h⁺_{j+1,j} q⁺_{j+1}` (Doubts; Sorensen 1992 has it). Backbone
`Matrix.IsShiftedQrChain.hasLowerBandwidth_prod`, `Matrix.IsArnoldiDecomposition.implicitRestart`, restated with
`m + 1` / `j + 1` columns: the book's `m`, `j` are the backbone's `m + 1`, `j + 1` (`j = m − p` in both), the
book's 1-based `Q₊(:, 1:j)` is `W.submatrix id (Fin.castLE _)` on `Fin (j + 1)`, and `v_{mj}` is `V_{<p} m j`
(0-based). ★'''
deps = ["equation_10_5_9", "Matrix.IsShiftedQrChain.hasLowerBandwidth_prod", "Matrix.IsArnoldiDecomposition.implicitRestart", "isArnoldiDecomposition_iff"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.3, the truncated Arnoldi decomposition'

