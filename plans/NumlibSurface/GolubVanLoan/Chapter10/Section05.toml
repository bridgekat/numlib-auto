[[node]]
id = "krylovSchur_isArnoldiDecomposition"
kind = "theorem"
desc = '''§10.5.4 (Krylov–Schur): from `A Q_m = Q_m H_m + r_m e_mᵀ` and an orthogonal `U` with `Uᵀ H_m U = [T₁₁ T₁₂; 0 T₂₂]`, `T₁₁ ∈ ℝ^{j×j}`
