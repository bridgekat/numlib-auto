[[node]]
id = "shiftedQrSteps"
kind = "definition"
desc = '''(10.5.4), `p` steps of the shifted QR iteration on an upper Hessenberg `H_c ∈ ℝ^{m×m}` with shifts `μ_1, …, μ_p`, as a
D4 program: `H^{(0)} = H_c`; for `i = 1 : p` (the book prints `i = 0 : p`), form `H^{(i−1)} − μ_i I`, factor it
`V_i R_i` by Givens rotations (chapter 5's Algorithm 5.2.5, which returns the rotation pairs of its
Algorithm 5.1.3 calls; `V_i = G_1 ⋯ G_{m−1}` formed from them with chapter 5's rotation matrix
`GolubVanLoan.Chapter05.givensRotation`), `H^{(i)} = R_i V_i + μ_i I`; accumulate `V = V_1 ⋯ V_p`.
Returns `H₊ = H^{(p)}`, the `V_i`, `R_i` and `V`. ★★

Blocked: calls chapter 5's Algorithm 5.2.5 (Givens QR of a Hessenberg matrix) and `givensRotation`, whose surface module is not on main (2026-09-26). The statements about shifted QR chains (`theorem_10_5_1`, `equation_10_5_6`, `filter_firstColumn`, `equation_10_5_9`, `restart_firstColumn_eq`, `implicitRestart_isArnoldiDecomposition`) are proved for every chain with the properties the program's run has.'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.algorithm_5_2_5", "GolubVanLoan.Chapter05.givensRotation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.4)'

[[node]]
id = "equation_10_5_4"
kind = "theorem"
desc = '''Exact semantics of (10.5.4): the run's `H^{(i)}`, `V_i`, `R_i` form a `Matrix.IsShiftedQrChain` with every `V_i` orthogonal and
upper Hessenberg and every `R_i` upper triangular (so every `H^{(i)}` is upper Hessenberg, the book's "recall from
§7.4.2"). From chapter 5's `algorithm_5_2_5_spec` (Hessenberg QR by Givens rotations, `Q` upper Hessenberg, no
nonsingularity hypothesis — the backbone's `Matrix.hessenbergGivensQR_spec` up to signs) and
`Matrix.IsShiftedQrChain.isUpperHessenberg`. ★★

Blocked: needs `shiftedQrSteps` (chapter 5's Givens QR, not on main).'''
deps = ["shiftedQrSteps", "Matrix.IsShiftedQrChain", "Matrix.IsShiftedQrChain.isUpperHessenberg", "Matrix.exists_isShiftedQrChain", "GolubVanLoan.Chapter05.algorithm_5_2_5_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.4)'

