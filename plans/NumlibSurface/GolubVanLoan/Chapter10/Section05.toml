desc = '''(10.5.13): `Aᵀ [q̃_1 | ⋯ | q̃_k] = [q̃_1 | ⋯ | q̃_k] T_kᵀ + r̃_k e_kᵀ`. ★'''
deps = ["equation_10_5_11"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.13)'

[[node]]
id = "unsymmetricLanczos_invariant"
kind = "theorem"
desc = '''§10.5.5, after (10.5.13): if `r_k = 0` then `span {q_1, …, q_k}` is `A`-invariant; if `r̃_k = 0` then `span {q̃_1, …, q̃_k}` is
`Aᵀ`-invariant. From (10.5.12)–(10.5.13) directly (or backbone
`BiLanczos.subspace_succ_mem_invtSubmodule_of_vhat_eq_zero` and its dual). ★'''
deps = ["equation_10_5_12", "equation_10_5_13", "BiLanczos.subspace_succ_mem_invtSubmodule_of_vhat_eq_zero"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.5, termination'

[[node]]
id = "IsSeriousBreakdown"
kind = "definition"
desc = '''§10.5.5: the process has a *serious breakdown* at step `k` if `r_k ≠ 0`, `r̃_k ≠ 0` and `r̃_kᵀ r_k = 0` (stated on the
exact run of (10.5.11)). Bridge (in the same node's docstring or a one-line lemma): it is the negation, at that
step, of the backbone's `BiLanczos.NoSeriousBreakdown` condition for the rescaled process. ★'''
deps = ["unsymmetricLanczos", "BiLanczos.NoSeriousBreakdown"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.5, Definition'

[[node]]
id = "equation_10_5_16"
kind = "theorem"
desc = '''(10.5.15)–(10.5.16), the block step of (10.5.14): with `R_k = A Q_k − Q_k M_k − Q_{k−1} C_{k−1}ᵀ`,
`S_k = Aᵀ Q̃_k − Q̃_k M_kᵀ − Q̃_{k−1} B_{k−1}ᵀ`, if `S_kᵀ R_k` is nonsingular and `B_k, C_k ∈ ℝ^{p×p}` satisfy
`C_kᵀ B_k = S_kᵀ R_k` (so both are nonsingular), then `Q_{k+1} = R_k B_k⁻¹` and `Q̃_{k+1} = S_k C_k⁻¹` satisfy
`Q̃_{k+1}ᵀ Q_{k+1} = I_p`. `C_k⁻ᵀ (S_kᵀ R_k) B_k⁻¹ = I`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.16)'
