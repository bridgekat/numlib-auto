[[node]]
id = "explicitlyRestartedArnoldi"
kind = "definition"
desc = '''(10.5.10), explicitly restarted Arnoldi as a D4 program: `cycles` repetitions of — `m` steps of Algorithm 10.5.1 from `q₁`
(giving `Q_c`, `H_c`), filter values `μ_1, …, μ_p := shifts H_c` for a caller-supplied function
`shifts : Matrix (Fin m) (Fin m) ℝ → Fin p → ℝ` (the book leaves the choice to heuristics), `p` steps of
(10.5.4) on `H_c`, `q₁ := (Q_c V)(:, 1)`. ★

Blocked: needs `shiftedQrSteps` (chapter 5's Givens QR, not on main).'''
deps = ["algorithm_10_5_1", "shiftedQrSteps"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.10)'

[[node]]
id = "equation_10_5_10"
kind = "theorem"
desc = '''Exact semantics of (10.5.10): after each cycle the new starting vector is a unit vector, a nonzero multiple of
`p_ℓ(A) q₁^{(ℓ)}` whenever `R_{ℓ}(1,1) ≠ 0`, with `p_ℓ` the cycle's filter polynomial; hence after `L` cycles
`q₁^{(L)} ∈ span {p_{L−1}(A) ⋯ p_0(A) q₁}`. From `algorithm_10_5_1_spec`, `equation_10_5_4`,
`restart_firstColumn_eq`, before breakdown (`m ≤ grade` in every cycle). ★★

Blocked: needs `explicitlyRestartedArnoldi`.'''
deps = ["explicitlyRestartedArnoldi", "algorithm_10_5_1_spec", "equation_10_5_4", "restart_firstColumn_eq"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.10)'

