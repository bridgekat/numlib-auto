namespace = "GolubVanLoan.Chapter10"
desc = '''
§10.5, Krylov methods for unsymmetric problems: Algorithm 10.5.1 (Arnoldi with the modified Gram–Schmidt
inner loop), (10.5.1)–(10.5.2) and the definition of a `k`-step Arnoldi decomposition, the Ritz pair and its
backward error, restarting (10.5.3) and implicit restarting (10.5.4)–(10.5.10) with Theorem 10.5.1, the
Krylov–Schur restart, the unsymmetric Lanczos process (10.5.11)–(10.5.13) with its breakdowns, and the
block biorthogonality step (10.5.14)–(10.5.16). Backbone: `Numlib/Krylov/{Arnoldi, Decomposition, BiLanczos}`,
`Numlib/LinearAlgebra/Matrix/KrylovDecomposition` (the matrix predicates `Matrix.IsKrylovDecomposition`,
`Matrix.IsArnoldiDecomposition` and the implicit Q engine `Matrix.IsArnoldiDecomposition.implicitQ`),
`Numlib/Eigen/{RayleighRitz, ImplicitRestart}`, `Numlib/Analysis/InnerProductSpace/GramSchmidt`. The
filter-polynomial eigen-expansion of §10.5.2, the exact-shift heuristic, the look-ahead idea of §10.5.6
and the remark that no unsymmetric Kaniel–Paige–Saad theory exists are prose. Real matrices throughout,
as in the book; the backbone statements are over `RCLike`.
'''

[[node]]
id = "algorithm_10_5_1"
kind = "definition"
desc = '''Algorithm 10.5.1 (Arnoldi process) as a D4 program with fuel: `k = 0, r_0 = q₁, h_{10} = 1`; while `h_{k+1,k} ≠ 0`:
`q_{k+1} = r_k/h_{k+1,k}`, `k = k+1`, `r_k = A q_k`, then for `i = 1 : k` (a `List.foldlM` over `List.finRange k`)
`h_{ik} = q_iᵀ r_k`, `r_k = r_k − h_{ik} q_i` (modified Gram–Schmidt: each `h_{ik}` is taken against the
*current* `r_k`), and `h_{k+1,k} = ‖r_k‖₂`; `t = k`. State: `k`, `q : ℕ → Fin n → ℝ`, `h : ℕ → ℕ → ℝ`, `r`.
`noncomputable def`. ★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.5.1'

[[node]]
id = "algorithm_10_5_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 10.5.1: for `‖q₁‖ = 1` the run stops after `t = min fuel (grade (toEuclideanLin A) q₁)`
passes and for `j < t`: `q_{j+1} = Arnoldi.vec _ q₁ j`, `h_{i+1,j+1} = Arnoldi.coeff _ q₁ i j` (`i ≤ j + 1`). The
inner loop is `InnerProductSpace.modifiedGramSchmidtSweep`, equal to the classical sum against the orthonormal
`q_i` (`InnerProductSpace.modifiedGramSchmidtSweep_eq_sub_sum`, which also shows `h_{ik} = q_iᵀ A q_k`), then
`Arnoldi.w`, `Arnoldi.coeff_succ_self` and `Arnoldi.vec_succ_eq`; the exit test is
`Arnoldi.coeff_succ_self_eq_zero_iff`. The same identification as the Saad surface's `arnoldiMGS_eq_arnoldiCGS`,
through the backbone (no surface import). "P10.5.1" (orthonormality) is the backbone's `Arnoldi.orthonormal`. ★★
(~200 lines)'''
deps = ["algorithm_10_5_1", "InnerProductSpace.modifiedGramSchmidtSweep_eq_sub_sum", "Arnoldi.w", "Arnoldi.coeff_succ_self", "Arnoldi.vec_succ_eq", "Arnoldi.coeff_succ_self_eq_zero_iff", "Arnoldi.coeff"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 10.5.1'

[[node]]
id = "equation_10_5_1"
kind = "theorem"
desc = '''(10.5.1): `span {q_1, …, q_k} = span {q_1, A q_1, …, A^{k−1} q_1}` for the Arnoldi vectors. Backbone `Arnoldi.span_vec`
(with `Matrix.range_krylovMatrix` for the right side as a span of the powers). ★'''
deps = ["Arnoldi.span_vec", "Matrix.range_krylovMatrix", "algorithm_10_5_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.1)'

[[node]]
id = "equation_10_5_2"
kind = "theorem"
desc = '''(10.5.2): after `k` steps, `A Q_k = Q_k H_k + r_k e_kᵀ`, `Q_k = Arnoldi.basisMatrix A q₁ k`,
`H_k = Arnoldi.hessenbergSq _ q₁ k` (upper Hessenberg), `r_k = (Arnoldi.w _ q₁ (k−1)).ofLp`. Backbone `Arnoldi.mul_basisMatrix`. ★'''
deps = ["Arnoldi.mul_basisMatrix", "Krylov.lastVec", "algorithm_10_5_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.2)'

[[node]]
id = "IsArnoldiDecomposition"
kind = "definition"
desc = '''§10.5.1, the definition after (10.5.2): `A Q_k = Q_k H_k + r_k e_kᵀ` is a `k`-step Arnoldi decomposition if
`Q_k ∈ ℝ^{n×k}` has orthonormal columns (`Q_kᵀ Q_k = I`), `H_k ∈ ℝ^{k×k}` is upper Hessenberg and `Q_kᵀ r_k = 0` —
the four conditions written out for real matrices, with the book's `k` columns: `Q : Matrix (Fin n) (Fin k) ℝ`,
`H : Matrix (Fin k) (Fin k) ℝ`, `e_kᵀ = Krylov.lastVec 1 k` (meaningful for `k ≥ 1`, the book's case). ★'''
deps = ["Matrix.IsUpperHessenberg", "Krylov.lastVec"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.1, Definition'

[[node]]
id = "isArnoldiDecomposition_iff"
kind = "theorem"
desc = '''The surface definition is the backbone one. The backbone `Matrix.IsArnoldiDecomposition` counts `k + 1` columns
(`Q : Matrix n (Fin (k + 1)) 𝕜`, last unit vector `Pi.single (Fin.last k) 1`; the review's `k = 0` typing fix), so the
book's `k`-step decomposition is the backbone one at `k − 1`: for `Q : Matrix (Fin n) (Fin (k + 1)) ℝ`,
`IsArnoldiDecomposition A Q H r ↔ Matrix.IsArnoldiDecomposition A Q H r` (`conjTranspose = transpose` over `ℝ`, and
`Krylov.lastVec 1 (k + 1) = Pi.single (Fin.last k) 1` by `Krylov.lastVec_succ`). Algorithm 10.5.1's output after
`k + 1` steps is one below the grade (`Arnoldi.isArnoldiDecomposition`, residual `(Arnoldi.w _ q₁ k).ofLp`). ★'''
deps = ["IsArnoldiDecomposition", "Matrix.IsArnoldiDecomposition", "Krylov.lastVec_succ", "Arnoldi.isArnoldiDecomposition", "algorithm_10_5_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.1, Definition'

[[node]]
id = "arnoldi_ritzPair_backwardError"
kind = "theorem"
desc = '''§10.5.1, after the definition: if `H_k y = λ y` with `‖y‖₂ = 1` and `x = Q_k y`, then `(A − λI) x = (e_kᵀ y) r_k`, `(λ, x)` is a
Ritz pair for `A` with respect to `𝒦(A, q₁, k)` (`Krylov.IsRitzPair`), and `(A + E) x = λ x` for `E = −v xᵀ`,
`v = (e_kᵀ y) r_k`, with `‖E‖₂ = |y_k| ‖r_k‖₂` (rank-one norm `‖v xᵀ‖₂ = ‖v‖ ‖x‖`, `‖x‖ = 1`). Real eigenpairs of `H_k`
(the book's statement is real). Backbone `Arnoldi.isRitzPair_of_mulVec_eq_smul`, `Arnoldi.apply_sub_smul_sum_eq`,
`Arnoldi.norm_ritz_residual_eq`; the rank-one 2-norm via `Matrix.l2_opNorm` of `vecMulVec` (Mathlib, or a two-line
Cauchy–Schwarz). ★★'''
deps = ["equation_10_5_2", "Arnoldi.isRitzPair_of_mulVec_eq_smul", "Arnoldi.apply_sub_smul_sum_eq", "Arnoldi.norm_ritz_residual_eq", "Krylov.IsRitzPair"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.1, Ritz pairs and backward error'

[[node]]
id = "shiftedQrSteps"
kind = "definition"
desc = '''(10.5.4), `p` steps of the shifted QR iteration on an upper Hessenberg `H_c ∈ ℝ^{m×m}` with shifts `μ_1, …, μ_p`, as a
D4 program: `H^{(0)} = H_c`; for `i = 1 : p` (the book prints `i = 0 : p`), form `H^{(i−1)} − μ_i I`, factor it
`V_i R_i` by Givens rotations (chapter 5's Algorithm 5.2.5, which returns the rotation pairs of its
Algorithm 5.1.3 calls; `V_i = G_1 ⋯ G_{m−1}` formed from them with chapter 5's rotation matrix
`GolubVanLoan.Chapter05.givensRotation`), `H^{(i)} = R_i V_i + μ_i I`; accumulate `V = V_1 ⋯ V_p`.
Returns `H₊ = H^{(p)}`, the `V_i`, `R_i` and `V`. ★★'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.algorithm_5_2_5", "GolubVanLoan.Chapter05.givensRotation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.4)'

