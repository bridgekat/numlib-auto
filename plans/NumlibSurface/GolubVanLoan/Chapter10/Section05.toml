[[node]]
id = "implicitlyRestartedArnoldi"
kind = "definition"
desc = '''§10.5.3, the modified framework (the second displayed loop, unnumbered): `m` Arnoldi steps from `q₁`, then `cycles` repetitions
of — choose `μ_1, …, μ_p` (caller-supplied `shifts`), (10.5.4) on `H_c`, replace `Q_c` by `(Q_c V)(:, 1:j)`, `H_c` by
`H₊(1:j, 1:j)`, `r_c` by the residual of `implicitRestart_isArnoldiDecomposition` (the corrected one), then Arnoldi
steps `j+1, …, m` continuing from that decomposition (Algorithm 10.5.1's loop body started from a state). A D4
program; `noncomputable def`. ★★

Blocked: needs `shiftedQrSteps` (chapter 5's Givens QR, not on main).'''
deps = ["algorithm_10_5_1", "shiftedQrSteps"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.3, implicitly restarted Arnoldi'

[[node]]
id = "implicitlyRestartedArnoldi_spec"
kind = "theorem"
desc = '''Exact semantics: after every cycle the state is an `m`-step Arnoldi decomposition of `A` (while no breakdown occurs) whose first
column is the unit vector in the direction of `p_ℓ(A)` applied to the previous first column — i.e. the same
subspaces as explicit restarting (10.5.10) with the same shifts, obtained without restarting from step 1.
`implicitRestart_isArnoldiDecomposition`, `restart_firstColumn_eq`, the uniqueness
`Matrix.IsArnoldiDecomposition.eq_basisMatrix` (the continued steps are the Arnoldi process of `q₊`, by
`Matrix.IsArnoldiDecomposition.range_eq_subspace` when `H₊(1:j,1:j)` is unreduced), and `algorithm_10_5_1_spec`.
Index translation as in `implicitRestart_isArnoldiDecomposition` (the backbone's decompositions have `k + 1`
columns). The uniqueness is now a corollary of the implicit Q engine `Matrix.IsArnoldiDecomposition.implicitQ`
(`Numlib/LinearAlgebra/Matrix/KrylovDecomposition`), so the surface proof is bookkeeping of the loop. ★★
(~200 lines)

Blocked: needs `implicitlyRestartedArnoldi`; the mathematical content (truncation, first column, Arnoldi uniqueness) is proved in `implicitRestart_isArnoldiDecomposition`, `restart_firstColumn_eq` and the backbone `Matrix.IsArnoldiDecomposition.eq_basisMatrix`. Estimate ~200 lines of loop bookkeeping.'''
deps = ["implicitlyRestartedArnoldi", "implicitRestart_isArnoldiDecomposition", "restart_firstColumn_eq", "Matrix.IsArnoldiDecomposition.eq_basisMatrix", "Matrix.IsArnoldiDecomposition.range_eq_subspace", "algorithm_10_5_1_spec", "equation_10_5_10"]
source = 'Golub–Van Loan, Matrix Computations, §10.5.3, implicitly restarted Arnoldi'

