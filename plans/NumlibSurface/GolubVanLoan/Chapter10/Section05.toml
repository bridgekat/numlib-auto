[[node]]
id = "equation_10_5_11"
kind = "theorem"
desc = '''Exact semantics of (10.5.11), against the backbone's two-sided Lanczos (whose normalization is Saad's
`δ_{j+1} = |⟪ŵ, v̂⟫|^{1/2}`): as long as the loop runs (no breakdown, `k` passes), the computed families are
biorthonormal (`Q̃_kᵀ Q_k = I_k`), `span {q_1..q_j} = 𝒦(A, q₁, j)`, `span {q̃_1..q̃_j} = 𝒦(Aᵀ, q̃₁, j)`, and
`Q̃_kᵀ A Q_k = T_k` (tridiagonal with `α`, `β` below, `γ` above). Proof: each `q_j` is a nonzero multiple `c_j` of
`BiLanczos.vec A Aᵀ q₁ (q̃₁/(q̃₁ᵀq₁)) (j−1)` and each `q̃_j` the multiple `1/c̄_j` of `BiLanczos.dualVec` (induction on
the recurrences, the scalars being fixed by the two normalizations), then `BiLanczos.inner_dualVec_vec`,
`BiLanczos.span_vec`, `BiLanczos.span_dualVec`, `BiLanczos.inner_dualVec_apply_vec`. ★★★ (~300 lines)

Blocked (effort): the program `unsymmetricLanczos`, its recurrences (10.5.12)–(10.5.13) and the invariant-subspace claim are proved (`equation_10_5_12`, `equation_10_5_13`, `unsymmetricLanczos_invariant`). What remains is the identification of the computed families with the backbone `BiLanczos.vec`/`dualVec` up to the scalars fixed by the two normalizations (the backbone uses Saad's `δ_{j+1} = |⟪ŵ, v̂⟫|^{1/2}`), then biorthonormality and the Krylov spans from `BiLanczos.inner_dualVec_vec`, `BiLanczos.span_vec`, `BiLanczos.span_dualVec`. Estimate ~300 lines.'''
deps = ["unsymmetricLanczos", "BiLanczos.vec", "BiLanczos.dualVec", "BiLanczos.inner_dualVec_vec", "BiLanczos.span_vec", "BiLanczos.span_dualVec", "BiLanczos.inner_dualVec_apply_vec", "BiLanczos.NoBreakdown"]
source = 'Golub–Van Loan, Matrix Computations, Equation (10.5.11)'

