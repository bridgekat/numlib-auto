deps = ["equation_6_2_10", "Matrix.isUnit_augmentedLSE"]
source = 'Golub–Van Loan, Matrix Computations, §6.2.4'

[[node]]
id = "equation_6_2_11"
kind = "theorem"
desc = '''(6.2.11): with the GSVD, the LSE problem becomes `min_{D_B y = d̃} ‖D_A y − b̃‖₂`, `y = X⁻¹x`.
`Matrix.isLSQISolution_iff_of_isGSVD` at `α = 0` with `Matrix.isLSQISolution_zero_iff`. ★'''
deps = ["theorem_6_1_1", "Matrix.isLSQISolution_iff_of_isGSVD", "Matrix.isLSQISolution_zero_iff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.2.11)'

[[node]]
id = "equation_6_2_12"
kind = "theorem"
desc = '''(6.2.12), in Theorem 6.1.1's block order: if `null(A) ∩ null(B) = {0}` and `rank(B) = m₂`, the
LSE solution is `x = ∑_{i < n₁−m₂} b̃_i x_i + ∑_{n₁−m₂ ≤ i < n₁} (d̃_{i−(n₁−m₂)}/β_i) x_i`. The book's
`∑_{i ≤ m₂} (d̃_i/β_i) x_i + ∑_{i > m₂} (b̃_i/α_i) x_i` is the third edition's order (report,
Doubts). `Matrix.isLSESolution_sum_of_isGSVD`. ★'''
deps = ["equation_6_2_11", "Matrix.isLSESolution_sum_of_isGSVD"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.2.12)'

[[node]]
id = "equation_6_2_13"
kind = "theorem"
desc = '''(6.2.13): `‖[A; √λ B] x − [b; √λ d]‖₂² = ‖Ax − b‖₂² + λ‖Bx − d‖₂²`, and for `λ > 0` with
`null(A) ∩ null(B) = {0}` its minimizer is the solution `x(λ)` of
`(AᵀA + λBᵀB)x = Aᵀb + λBᵀd`, `Matrix.penaltyLSE A B b d λ`. `Matrix.norm_fromRows_sub_sq`,
`Matrix.isLeastSquaresSolution_fromRows_iff`, `Matrix.posDef_gram_add_smul_gram_iff`. ★'''
deps = ["Matrix.norm_fromRows_sub_sq", "Matrix.isLeastSquaresSolution_fromRows_iff", "Matrix.posDef_gram_add_smul_gram_iff", "Matrix.penaltyLSE"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.2.13)'

[[node]]
id = "equation_6_2_14"
kind = "theorem"
desc = '''(6.2.14), corrected: with the GSVD and `x` the LSE solution,
`x(λ) − x = ∑_{mixed i} (α_i (β_i b̃_i − α_i d̃_{i'}) / (β_i (α_i² + λβ_i²))) x_i` (`i' = i − (n₁ − m₂)`).
The book prints `λ²` for `λ`, `u_iᵀb`, `v_iᵀd` for `b̃_i`, `d̃_i`, and the range `i = 1 : p`; its
preceding formula for `x(λ)` is correct up to the block order (report, Doubts).
`Matrix.penaltyLSE_sub_eq_sum_of_isGSVD`. ★'''
deps = ["equation_6_2_13", "equation_6_2_12", "Matrix.penaltyLSE_sub_eq_sum_of_isGSVD"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.2.14)'

[[node]]
