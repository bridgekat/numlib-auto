desc = '''§6.5.4: "The theorem provides the key step in an induction proof that the factorization (6.5.12)
exists": if `A = GGᵀ` and `A − zzᵀ` are positive definite, there are hyperbolic rotations
`H₁, …, H_n` (planes `(k, n+1)`) with `H = H₁ ⋯ H_n` `S`-orthogonal and `Hᵀ[Gᵀ; zᵀ] = [R; 0]`,
`R` upper triangular. `Matrix.exists_choleskyDowndate`. ★'''
deps = ["theorem_6_5_1", "equation_6_5_12", "Matrix.exists_choleskyDowndate"]
source = 'Golub–Van Loan, Matrix Computations, §6.5.4'

[[node]]
id = "choleskyDowndate"
kind = "definition"
desc = '''§6.5.4, Cholesky downdating with hyperbolic rotations, D4 form: `choleskyDowndate (rnd : ℝ → M ℝ)
(G : Matrix (Fin n) (Fin n) ℝ) (z : Fin n → ℝ) : M (Matrix (Fin n) (Fin n) ℝ)`: `M := [Gᵀ; zᵀ]`; for
`k = 0, …, n − 1`: `τ ← rnd (M n k / M k k)`, `c ← rnd (1 / (← rnd (√(← rnd (1 − (← rnd (τ * τ)))))))`,
`s ← rnd (c * τ)` ((6.5.13), `√` exact then rounded), apply `[c −s; −s c]` to rows `k` and `n` of `M`
(each entry through `rnd`); return `(M(0:n, :))ᵀ`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §6.5.4'

[[node]]
id = "choleskyDowndate_spec"
kind = "theorem"
desc = '''§6.5.4: if `A = GGᵀ` (`Matrix.IsCholesky A Gᵀ`) and `A − zzᵀ` is positive definite, the output
`G̃` of `choleskyDowndate pure G z` is the Cholesky factor of `A − zzᵀ`:
`Matrix.IsCholesky (A − vecMulVec z z) G̃ᵀ` (the hyperbolic `c > 0` keeps the diagonal positive, so no
sign normalization is needed). Induction on `k` with `theorem_6_5_1`, `Matrix.fromRows_rotate_step`,
`equation_6_5_12`. ★★'''
deps = ["choleskyDowndate", "theorem_6_5_1", "equation_6_5_15", "Matrix.fromRows_rotate_step", "equation_6_5_12", "choleskyDowndate_exists"]
source = 'Golub–Van Loan, Matrix Computations, §6.5.4'

[[node]]
id = "equation_6_5_16"
kind = "theorem"
desc = '''(6.5.16), its exact content: if `UᵀAΠ = [R; 0]` (QR with column pivoting, `U` orthogonal,
`Π` a permutation, `m ≥ n`) and `V₁ᵀRᵀ = Lᵀ` (a QR factorization of `Rᵀ`, `V₁` orthogonal, `Lᵀ` upper
triangular), then with `V = ΠV₁`, `UᵀAV = [L; 0]`, `L` lower triangular, `UᵀU = I`, `VᵀV = I`. The
rank-revealing property ("`‖L₂₁‖₂` and `‖L₂₂‖₂` are small compared to `σ_min(L₁₁)`") is a heuristic
reading of pivoted QR and is not formalized. Pivoted QR and QR are chapter 5's restatements
(`Chapter05.equation_5_4_6`, `Chapter05.theorem_5_2_1`; README layering). ★'''
deps = ["GolubVanLoan.Chapter05.equation_5_4_6", "GolubVanLoan.Chapter05.theorem_5_2_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.5.16)'

