for `i = k, …, n − 1` (0-based, `i + 1 < m`): `(c, s) ← givens (H i i) (H (i+1) i)`, rotate rows `i, i+1`
of `H`, columns `i, i+1` of `Q`. Returns `(Q₁, R₁)`. ★'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, §6.5.2'

