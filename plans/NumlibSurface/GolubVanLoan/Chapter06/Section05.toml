namespace = "GolubVanLoan.Chapter06"
desc = '''
§6.5, Updating Matrix Factorizations: the QR factorization after a rank-one change (6.5.1)–(6.5.3),
after deleting or appending a column (6.5.4) and after appending or deleting a row; Cholesky
updating (6.5.5)–(6.5.7) and downdating with hyperbolic rotations (6.5.8)–(6.5.15), Theorem 6.5.1;
the exact content of the rank-revealing ULV decomposition (6.5.16). Backbone: `Numlib/Direct/Updating`,
the hyperbolic rotations of `LinearAlgebra/Matrix/PlaneRotation`, `Matrix.IsQR`, `Matrix.IsCholesky`.

The section has no numbered algorithm; its procedures, described in prose, are formalized as
definitions named by content (`qrUpdateRankOne`, `qrDeleteColumn`, `qrInsertColumn`,
`qrInsertRow`, `qrDeleteFirstRow`, `choleskyUpdate`, `choleskyDowndate`) in the D4 convention — every
flop through `rnd`, the rotations computed by chapter 5's `algorithm_5_1_3` (`givens`) — each with a
`_spec` theorem against the backbone. Rotations are applied by chapter 5's shared helpers
(convention 13): "rotate rows `i, k` of `R`" is `Chapter05.givensApplyLeft rnd i k c s cols R`
(`R([i k], cols) = G(i,k,θ)ᵀ R([i k], cols)`), "rotate columns `i, k` of `Q`" is
`Chapter05.givensApplyRight rnd i k c s rows Q`, "rotate entries `i, k` of `w`" is `givensApplyLeft`
on the one-column matrix; their exact semantics is multiplication by
`Chapter05.givensRotation i k c s = Matrix.planeRotation i k c (−s)` or its transpose
(`givensApplyLeft_spec`, `givensApplyRight_spec`). The hyperbolic rotations of the downdate are not
Givens rotations and are written out.

Not formalized: the ULV updating procedure of §6.5.5 beyond (6.5.16) (condition estimation,
"small" entries, "`≈ σ_min`"), the numerical caveats on hyperbolic rotations, and the flop counts
(`26n²`, `O(n²)`, `O(mn)`). (6.5.4), (6.5.5), (6.5.8), (6.5.9) only name the data.
'''

[[node]]
id = "equation_6_5_1"
kind = "theorem"
desc = '''(6.5.1): if `A = QR` then `Ã = A + uvᵀ = Q(R + wvᵀ)` with `w = Qᵀu` (`Q` orthogonal). The QR
factorization is chapter 5's (Theorem 5.2.1, `Chapter05.theorem_5_2_1`; README layering). ★'''
deps = ["GolubVanLoan.Chapter05.theorem_5_2_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.5.1)'

[[node]]
id = "equation_6_5_2"
kind = "theorem"
desc = '''(6.5.2): if `J_{n−1}, …, J₁` are rotations in the planes `(k, k+1)` with
`J₁ᵀ ⋯ J_{n−1}ᵀ w = ±‖w‖₂ e₁`, then `H = J₁ᵀ ⋯ J_{n−1}ᵀ R` is upper Hessenberg (for `R` upper
triangular, whatever the rotations). `Matrix.prod_planeEmbed_mul_apply_eq_zero`. ★'''
deps = ["Matrix.prod_planeEmbed_mul_apply_eq_zero", "Matrix.planeRotation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.5.2)'

[[node]]
id = "equation_6_5_3"
kind = "theorem"
desc = '''(6.5.3): `(J₁ᵀ ⋯ J_{n−1}ᵀ)(R + wvᵀ) = H ± ‖w‖₂ e₁vᵀ = H₁` is upper Hessenberg: the rank-one
term touches row `1` only. From `equation_6_5_2`. ★'''
deps = ["equation_6_5_2"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.5.3)'

[[node]]
id = "qrUpdateRankOne"
kind = "definition"
desc = '''§6.5.1, the rank-one QR update, D4 form: `qrUpdateRankOne (rnd : ℝ → M ℝ)
(Q R : Matrix (Fin n) (Fin n) ℝ) (u v : Fin n → ℝ) : M (Matrix (Fin n) (Fin n) ℝ × Matrix (Fin n) (Fin n) ℝ)`:
`w ← Chapter01.algorithm_1_1_3 rnd Qᵀ u 0`; for `k = n−2, …, 0`: `(c, s) ← Chapter05.algorithm_5_1_3 rnd
(w k) (w (k+1))`, rotate entries `k, k+1` of `w` and rows `k, k+1` of `R`, columns `k, k+1` of `Q`; then
`R(0, :) ← R(0, :) + w₀ vᵀ` (through `rnd`); for `k = 0, …, n−2`: `(c, s) ← givens (R k k) (R (k+1) k)`,
rotate rows `k, k+1` of `R` and columns of `Q`. Returns `(Q₁, R₁)`, `Q₁ = QJ_{n−1}⋯J₁G₁⋯G_{n−1}`. ★'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_3", "GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, §6.5.1'

[[node]]
id = "qrUpdateRankOne_spec"
kind = "theorem"
desc = '''The rank-one update is correct in exact arithmetic: if `Matrix.IsQR A Q R` (`A` square) then
`Matrix.IsQR (A + vecMulVec u v) Q₁ R₁` for `(Q₁, R₁) = Id.run (qrUpdateRankOne pure Q R u v)`.
Invariants: `Q R = A + uvᵀ` after the first rank-one step is kept by every rotation;
`Matrix.prod_planeEmbed_mul_apply_eq_zero` (Hessenberg after the first sweep, `equation_6_5_3`),
`Matrix.upperTrapezoidal_of_adjacentRotations` with `Chapter05.algorithm_5_1_3_spec` for the zeroing
hypothesis. ★★'''
deps = ["qrUpdateRankOne", "equation_6_5_1", "equation_6_5_3", "Matrix.upperTrapezoidal_of_adjacentRotations", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec", "GolubVanLoan.Chapter01.algorithm_1_1_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, §6.5.1'

[[node]]
id = "qrDeleteColumn"
kind = "definition"
desc = '''§6.5.2, deleting column `k`, D4 form: `qrDeleteColumn (rnd : ℝ → M ℝ) (Q : Matrix (Fin m) (Fin m) ℝ)
