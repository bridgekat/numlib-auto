`Matrix.upperTrapezoidal_of_adjacentRotations` (with `a = k`), `Chapter05.algorithm_5_1_3_spec`. ★★'''
deps = ["qrDeleteColumn", "Matrix.IsQR.conjTranspose_mul_deleteColumn", "Matrix.upperTrapezoidal_of_adjacentRotations", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec"]
