deps = ["equation_6_1_12", "Matrix.antitoneOn_norm_tikhonov_mulVec"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.4'

[[node]]
id = "ridgeDeleted"
kind = "definition"
desc = '''§6.1.4, (6.1.15): `x_k(λ)`, the solution of `min ‖D_k(Ax − b)‖₂² + λ‖x‖₂²` with
`D_k = I − e_k e_kᵀ` (the `k`-th equation deleted): `ridgeDeleted A b λ k =
(D_k * A).tikhonov λ *ᵥ (D_k *ᵥ b)`, `D_k = diagonal (Function.update 1 k 0)`. ★'''
deps = ["Matrix.tikhonov"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.4, Definition'

[[node]]
id = "equation_6_1_16"
kind = "theorem"
desc = '''(6.1.16): for `λ > 0`, `x_k(λ) = x(λ) + ((a_kᵀx(λ) − b_k)/(1 − z_kᵀa_k)) z_k` with
`z_k = (AᵀA + λI)⁻¹a_k`, and the denominator is positive. `Matrix.tikhonov_deleteRow_eq`,
`Matrix.one_sub_dotProduct_inv_gram_pos`. (The book's companion identity
`‖Ax_k − b‖² = ‖D_k(Ax_k − b)‖² + (a_kᵀx_k − b_k)²` is a coordinate split and is not a node.) ★'''
deps = ["ridgeDeleted", "Matrix.tikhonov_deleteRow_eq", "Matrix.one_sub_dotProduct_inv_gram_pos"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.16)'

[[node]]
id = "equation_6_1_17"
kind = "theorem"
desc = '''(6.1.17): `b_k − a_kᵀx_k(λ) = e_kᵀ(I − A(AᵀA + λI)⁻¹Aᵀ)b / e_kᵀ(I − A(AᵀA + λI)⁻¹Aᵀ)e_k`.
`Matrix.tikhonov_deleteRow_residual_eq`. ★'''
deps = ["equation_6_1_16", "Matrix.tikhonov_deleteRow_residual_eq"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.17)'

[[node]]
id = "crossValidationError"
kind = "definition"
desc = '''§6.1.4, the cross-validation weighted square error:
`crossValidationError w A b λ = (1/m) ∑_k w k * (A k ⬝ᵥ ridgeDeleted A b λ k − b k) ^ 2` for weights
`w : Fin m → ℝ` (nonnegative in the book). ★'''
deps = ["ridgeDeleted"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.4, Definition'

[[node]]
id = "equation_6_1_18"
kind = "theorem"
desc = '''(6.1.18): with `r = (I − A(AᵀA + λI)⁻¹Aᵀ) b` (the ridge residual) and `∂r_k/∂b_k = (I − H)_kk`,
`crossValidationError w A b λ = (1/m) ∑_k w_k (r_k / (∂r_k/∂b_k))²`. From `equation_6_1_17`; the
partial derivative is the diagonal entry because `r` is linear in `b` (stated as the entry, with
the derivative form `HasDerivAt (fun t => ((1 − H) *ᵥ Function.update b k t) k) ((1 − H) k k) (b k)`
as a one-line remark). ★'''
deps = ["crossValidationError", "equation_6_1_17"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.18)'

[[node]]
id = "equation_6_1_19"
kind = "theorem"
desc = '''(6.1.19): with an SVD `A = UΣVᵀ` of rank `r` and `b̃ = Uᵀb`,
`C(λ) = (1/m) ∑_k w_k [(b_k − ∑_{j ≤ r} u_kj b̃_j σ_j²/(σ_j² + λ)) / (1 − ∑_{j ≤ r} u_kj² σ_j²/(σ_j² + λ))]²`.
From `equation_6_1_18` and `A(AᵀA + λI)⁻¹Aᵀ = U diag(σ_j²/(σ_j² + λ)) Uᵀ`
(`Matrix.tikhonov_mulVec_eq_sum_of_isSVD`). The book prints `b̃_k` in the numerator; the correct
entry is `b_k` (as `λ → ∞` the numerator must tend to `b_k`): report, Doubts. ★★'''
deps = ["equation_6_1_18", "Matrix.tikhonov_mulVec_eq_sum_of_isSVD", "Matrix.IsSVD"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.19)'

