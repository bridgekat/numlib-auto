namespace = "GolubVanLoan.Chapter06"
desc = '''
§6.1, Weighting and Regularization: row weighting and its normal equations (6.1.1)–(6.1.5), the
generalized least-squares problem and Paige's method (6.1.6)–(6.1.10), column weighting (§6.1.3),
ridge regression and cross-validation (6.1.11)–(6.1.19), Tikhonov regularization (6.1.20)–(6.1.21),
and the generalized singular value decomposition (Theorem 6.1.1, (6.1.22)–(6.1.26)).
Backbone: `Numlib/LinearAlgebra/Matrix/LeastSquares/{Weighted,Regularized}`,
`Numlib/LinearAlgebra/Matrix/GSVD`, and `Matrix.tikhonov` of `SVD`. No numbered algorithm.
Not nodes: (6.1.6) (a statistical model), (6.1.13) (recalls the SVD), (6.1.15) (defines `x_k(λ)`,
the definition `ridgeDeleted`), (6.1.24)–(6.1.25) (proof steps of Theorem 6.1.1), van der Sluis's
"approximately minimized", Paige's stability claim and the minimization of `C(λ)` (quoted).
'''

[[node]]
id = "IsWeightedLeastSquaresSolution"
kind = "definition"
desc = '''§6.1.1, the weighted least-squares problem (6.1.1): for `d : Fin m → ℝ` (the book's
`D = diag(d₁, …, d_m)`, nonsingular), `A : Matrix (Fin m) (Fin n) ℝ`, `b : EuclideanSpace ℝ (Fin m)`,
`IsWeightedLeastSquaresSolution d A b x := Matrix.IsLeastSquaresSolution (diagonal d * A)
(toEuclideanLin (diagonal d) b) x` — "`x_D` … minimizes `‖Ãx − b̃‖₂` where `Ã = DA`, `b̃ = Db`". ★'''
deps = ["Matrix.IsLeastSquaresSolution"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.1, Definition'

[[node]]
id = "equation_6_1_1"
kind = "theorem"
desc = '''(6.1.1): `‖D(Ax − b)‖₂² = ∑ᵢ dᵢ² (aᵢᵀx − bᵢ)²`, so `x` minimizes the weighted sum iff
`IsWeightedLeastSquaresSolution d A b x`. `EuclideanSpace.norm_sq_eq`, `diagonal_mulVec`. ★'''
deps = ["IsWeightedLeastSquaresSolution"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.1)'

[[node]]
id = "equation_6_1_2"
kind = "theorem"
desc = '''(6.1.2): for `A` of full column rank and `d` nowhere zero, `AᵀD²A` is positive definite and
`IsWeightedLeastSquaresSolution d A b x ↔ (Aᵀ * D² * A) *ᵥ x = Aᵀ * D² *ᵥ b`, whose solution is
`Matrix.weightedLeastSquaresOp (D²) A *ᵥ b`. `Matrix.isLeastSquaresSolution_iff_normalEquations` for `(DA, Db)`,
`Matrix.posDef_conjTranspose_mul_self_of_linearIndependent`, `Matrix.isLeastSquaresSolution_weightedLeastSquaresOp`. ★'''
deps = ["IsWeightedLeastSquaresSolution", "Matrix.isLeastSquaresSolution_iff_normalEquations", "Matrix.posDef_conjTranspose_mul_self_of_linearIndependent", "Matrix.isLeastSquaresSolution_weightedLeastSquaresOp"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.2)'

[[node]]
id = "equation_6_1_3"
kind = "theorem"
desc = '''(6.1.3): `x_D − x_LS = (AᵀD²A)⁻¹ Aᵀ (D² − I)(b − A x_LS)` for `A` of full column rank,
`x_D` the weighted and `x_LS` the ordinary solution. `Matrix.weightedLeastSquaresOp_mulVec_sub_pinv_mulVec` with
`W = D²`. ★'''
deps = ["equation_6_1_2", "Matrix.weightedLeastSquaresOp_mulVec_sub_pinv_mulVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.3)'

[[node]]
id = "equation_6_1_4"
kind = "theorem"
desc = '''(6.1.4): with `D(δ) = diag(d₁, …, d_k √(1+δ), …, d_m)`, `δ > −1`, and
`r_k(δ) = e_kᵀ(b − A x(δ))`, `d r_k/dδ = −d_k² (a_kᵀ (Aᵀ D(δ)² A)⁻¹ a_k) r_k(δ)` (for `A` of full
column rank, `d` nowhere zero). `Matrix.hasDerivAt_weightedResidual` at the weight
`d_k²(1 + δ)` composed with `HasDerivAt` of `δ ↦ d_k² (1 + δ)` (derivative `d_k²`). ★'''
deps = ["Matrix.hasDerivAt_weightedResidual", "Matrix.weightedResidual"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.4)'

[[node]]
id = "abs_weightedResidual_antitoneOn"
kind = "theorem"
desc = '''§6.1.1, "`|r_k(δ)|` is a monotone decreasing function of `δ`": `AntitoneOn (fun δ => |r_k(δ)|)
(Set.Ioi (−1))`. `Matrix.antitoneOn_abs_weightedResidual` composed with the increasing map
`δ ↦ d_k²(1 + δ)`. The book's derivation claims `d/dδ [r_k(δ)²] < 0`, which fails when `a_k = 0` or
`r_k(δ) = 0` (then `r_k ≡ 0`); the non-strict form is the theorem (report, Doubts). ★'''
deps = ["equation_6_1_4", "Matrix.antitoneOn_abs_weightedResidual"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.1'

[[node]]
id = "equation_6_1_5"
kind = "theorem"
desc = '''(6.1.5): if `[D⁻² A; Aᵀ 0][r; x] = [b; 0]` then `x` minimizes (6.1.1), i.e.
`IsWeightedLeastSquaresSolution d A b x`. `Matrix.isLeastSquaresSolution_of_augmented` with
`M = D`. ★'''
deps = ["IsWeightedLeastSquaresSolution", "Matrix.isLeastSquaresSolution_of_augmented"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.5)'

[[node]]
id = "equation_6_1_8"
kind = "theorem"
desc = '''(6.1.7)–(6.1.8): for `B : Matrix (Fin m) (Fin m) ℝ` nonsingular (`W = BBᵀ`), `x` solves
`min ‖B⁻¹(Ax − b)‖₂` (6.1.7) iff `(x, B⁻¹(b − Ax))` solves the generalized problem
`min_{b = Ax + Bv} vᵀv` (6.1.8): `Matrix.isGeneralizedLeastSquaresSolution_iff`. ★'''
deps = ["Matrix.IsGeneralizedLeastSquaresSolution", "Matrix.isGeneralizedLeastSquaresSolution_iff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.8)'

[[node]]
id = "equation_6_1_9"
kind = "theorem"
desc = '''(6.1.9)–(6.1.10), Paige's method: with `QᵀA = [R₁; 0]`, `(Q₂ᵀB) Z = [0 S]` (`S` upper
triangular), `Su = Q₂ᵀb`, `v = Z₂u` and `R₁x = Q₁ᵀb − Q₁ᵀBZ₂u`, the pair `(x, v)` solves (6.1.8),
for `A` of full column rank and `B` nonsingular. `Matrix.isGeneralizedLeastSquaresSolution_of_paige`. ★'''
deps = ["Matrix.isGeneralizedLeastSquaresSolution_of_paige", "equation_6_1_8"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.9)'

[[node]]
id = "equation_6_1_10"
kind = "theorem"
desc = '''(6.1.10), the simplification: for `v = Z₂u` (so `Z₁ᵀv = 0`, `Z₂ᵀv = u`),
`Q₁ᵀb − (Q₁ᵀBZ₁Z₁ᵀ + Q₁ᵀBZ₂Z₂ᵀ) v = Q₁ᵀb − Q₁ᵀBZ₂u`, the block rows of `ZᵀZ = I`. ★'''
deps = ["equation_6_1_9"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.10)'

[[node]]
id = "isLeastSquaresSolution_columnWeighting"
kind = "theorem"
desc = '''§6.1.3: for `G` nonsingular, if `y_LS` minimizes `‖(AG⁻¹)y − b‖₂` then `x_G = G⁻¹ y_LS` minimizes
`‖Ax − b‖₂`. `Matrix.isLeastSquaresSolution_mul_inv_iff`. ★'''
deps = ["Matrix.isLeastSquaresSolution_mul_inv_iff"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.3'

[[node]]
id = "norm_columnWeighting_le"
kind = "theorem"
desc = '''§6.1.3: if `y_LS` is the minimum 2-norm solution of `min ‖(AG⁻¹)y − b‖₂`, then within the set
of minimizers of `‖Ax − b‖₂`, `x_G = G⁻¹y_LS` has the smallest `G`-norm `‖z‖_G = ‖Gz‖₂`.
`Matrix.IsMinNormLeastSquaresSolution.norm_le_of_mul_inv`. (The book says "if `rank(A) < n`"; the
statement holds for every rank.) ★'''
deps = ["isLeastSquaresSolution_columnWeighting", "Matrix.IsMinNormLeastSquaresSolution.norm_le_of_mul_inv"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.3'

[[node]]
id = "equation_6_1_11"
kind = "theorem"
desc = '''(6.1.11): `‖[A; √λ I] x − [b; 0]‖₂² = ‖Ax − b‖₂² + λ‖x‖₂²` for `λ ≥ 0`, so the ridge problem is
the least-squares problem of the stacked matrix. `Matrix.norm_fromRows_sub_sq`,
`Matrix.isLeastSquaresSolution_fromRows_iff` with `B = 1`, `d = 0`. ★'''
deps = ["Matrix.norm_fromRows_sub_sq", "Matrix.isLeastSquaresSolution_fromRows_iff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.11)'

[[node]]
id = "equation_6_1_12"
kind = "theorem"
desc = '''(6.1.12): for `λ > 0`, `x` minimizes (6.1.11) iff `(AᵀA + λI)x = Aᵀb`, iff
`x = A.tikhonov λ *ᵥ b` — the ridge solution `x(λ)` is the backbone's Tikhonov regularization.
`Matrix.tikhonov_mulVec_eq_iff_isMinOn` (and the untracked `Matrix.tikhonov_unique`). ★'''
deps = ["equation_6_1_11", "Matrix.tikhonov", "Matrix.tikhonov_mulVec_eq_iff_isMinOn"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.12)'

[[node]]
id = "equation_6_1_14"
kind = "theorem"
desc = '''(6.1.14): if `A = UΣVᵀ` is an SVD (`Matrix.IsSVD A U σ V`) of rank `r`, then
`x(λ) = ∑_{i ≤ r} (σᵢ uᵢᵀb/(σᵢ² + λ)) vᵢ` for `λ > 0`. `Matrix.tikhonov_mulVec_eq_sum_of_isSVD`
(its sum over `i < min m n` drops the zero singular values). ★'''
deps = ["equation_6_1_12", "Matrix.tikhonov_mulVec_eq_sum_of_isSVD"]
source = 'Golub–Van Loan, Matrix Computations, Equation (6.1.14)'

[[node]]
id = "tendsto_ridge_leastSquares"
