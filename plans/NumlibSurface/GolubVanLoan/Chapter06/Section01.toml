[[node]]
id = "theorem_6_1_1"
kind = "theorem"
desc = '''Theorem 6.1.1 (Generalized Singular Value Decomposition), with (6.1.22)–(6.1.23): for
`A : Matrix (Fin m₁) (Fin n₁) ℝ`, `B : Matrix (Fin m₂) (Fin n₁) ℝ`, `m₁ ≥ n₁`,
`r = rank [A; B]`, `p = max(r − m₂, 0)`, there are orthogonal `U₁`, `U₂` and invertible `X` with
`U₁ᵀAX = D_A`, `U₂ᵀBX = D_B`: `∃ U₁ U₂ X α β, Matrix.IsGSVD A B U₁ U₂ X α β`
(`unitaryGroup = orthogonalGroup` over `ℝ`). The blocks of (6.1.22): `D_A = rectDiagonal α` with
`α = (1, …, 1 [p], α_{p+1}, …, α_r, 0, …)`; of (6.1.23): `D_B = shiftedRectDiagonal p β`, `β_{p+1}, …,
β_r` in rows `1 … r − p`. The unprinted clause `α_i² + β_i² = 1` is `theorem_6_1_1_b`. The printed row labels of `D_B`
(`p, r − p, m₂ − r`) are a conversion error for `r − p, m₂ − r + p` (report, Doubts); the proof cites
"(6.1.21) and (6.1.22)" for "(6.1.22) and (6.1.23)". `Matrix.exists_isGSVD`. ★'''
deps = ["Matrix.IsGSVD", "Matrix.exists_isGSVD"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 6.1.1'

[[node]]
id = "theorem_6_1_1_b"
kind = "theorem"
desc = '''The clause Theorem 6.1.1 leaves implicit: the decomposition can be chosen with
`α_i² + β_i² = 1` for `i = p+1 … r` (the cosine–sine pairs of the proof's CS decomposition of the
orthonormal basis of `ran [A; B]`; true, not printed — a separate clause so that `theorem_6_1_1`
states exactly what the book prints). `Matrix.exists_isGSVD` (whose construction gives the pairs). ★'''
deps = ["theorem_6_1_1", "Matrix.IsGSVD", "Matrix.exists_isGSVD"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 6.1.1'

[[node]]
id = "gsvd_one"
