[[node]]
id = "gsvd_generalizedEigen"
kind = "theorem"
desc = '''§6.1.6, "The GSVD is related to the generalized eigenvalue problem `AᵀAx = μ²BᵀBx`": for each
column `x_i` of `X`, `β_i² AᵀA x_i = α_i² BᵀB x_i`, so `x_i` is a generalized eigenvector with
`μ_i = α_i/β_i` when `β_i ≠ 0`. `Matrix.IsGSVD.gram_mulVec_col`. ★'''
deps = ["theorem_6_1_1", "Matrix.IsGSVD.gram_mulVec_col"]
source = 'Golub–Van Loan, Matrix Computations, §6.1.6'

