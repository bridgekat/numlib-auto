`Matrix.l2_opNorm_eq_spectralRadius_of_isStarNormal`, `spectralRadius_pow`). The consequence the book
draws for rounding errors is heuristic and not formalized. ★'''
deps = ["Pade.expApprox", "Matrix.l2_opNorm_eq_spectralRadius_of_isStarNormal", "spectralRadius_pow", "Matrix.IsStarNormal.exists_aeval_eq_conjTranspose"]
