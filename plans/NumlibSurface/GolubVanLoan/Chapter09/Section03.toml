[[node]]
id = "equation_9_3_6"
kind = "theorem"
desc = '''(9.3.6): for `ε > 0`, `sup_{t > 0} ‖e^{At}‖₂ ≥ α_ε(A)/ε`, for `A : Matrix (Fin n) (Fin n) ℂ`
(`n ≥ 1`; a real `A` through its complexification), with chapter 7's ε-pseudospectrum
`Chapter07.pseudospectrum ε A` (the backbone `ContinuousLinearMap.closedPseudospectrum`), whose
resolvent form `z ∈ Λ_ε(A) ↔ z ∈ λ(A) ∨ ‖(zI - A)⁻¹‖₂ ≥ 1/ε` is `Chapter07.equation_7_9_6`, and
chapter 7's pseudospectral abscissa `α_ε(A) = Chapter07.pseudospectralAbscissa ε A` ((7.9.8), which
the book cites as "(7.8.8)"; backbone `Matrix.pseudospectralAbscissa`). Stated without `sup` junk:
if `‖e^{At}‖₂ ≤ M` for all `t > 0` then `Chapter07.pseudospectralAbscissa ε A ≤ ε M`. The maximum is
attained (`Matrix.exists_eq_pseudospectralAbscissa_radius`) at some `z ∈ Λ_ε`; if `Re z > 0`, then
`z ∉ λ(A)` and `1/ε ≤ ‖(z - A)⁻¹‖₂ ≤ M / Re z` (`equation_7_9_6`,
`norm_resolvent_le_of_norm_exp_smul_le`); if `Re z ≤ 0` the claim is trivial since `M ≥ 1`
(`t → 0⁺`). ★'''
deps = ["norm_resolvent_le_of_norm_exp_smul_le", "GolubVanLoan.Chapter07.pseudospectrum", "GolubVanLoan.Chapter07.equation_7_9_6", "GolubVanLoan.Chapter07.pseudospectralAbscissa", "Matrix.exists_eq_pseudospectralAbscissa_radius"]
source = 'Golub–Van Loan, Matrix Computations, Equation (9.3.6)'

[[node]]
id = "normal_squaring"
kind = "theorem"
desc = '''§9.3.4: if `A` is normal then so is `G = R_qq(A/2^j)` (a rational function of `A`), and `‖G^m‖₂ =
