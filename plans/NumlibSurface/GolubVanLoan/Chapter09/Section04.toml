[[node]]
id = "theorem_9_4_1"
kind = "theorem"
desc = '''Theorem 9.4.1 (polar decomposition): for `A : Matrix (Fin m) (Fin n) ℝ` with `m ≥ n` there are `U :
Matrix (Fin m) (Fin n) ℝ` with orthonormal columns (`Uᵀ U = 1`) and a symmetric positive
semidefinite `P : Matrix (Fin n) (Fin n) ℝ` with `A = U P`, i.e. `∃ U P, Matrix.IsPolarDecomposition A U P`
(fields `Uᴴ U = 1`, `P.PosSemidef`, `A = U P`; `ᴴ = ᵀ` at `ℝ`). `Matrix.exists_isPolarDecomposition` at
`𝕜 = ℝ` (any `Fintype`s with `card n ≤ card m`; the book's SVD proof). ★

Blocked: the backbone polar decomposition (`Matrix.exists_isPolarDecomposition`, `Numlib/LinearAlgebra/Matrix/Polar` and
`Numlib/Analysis/Matrix/Function/Polar`) is being done by agent dec1 in parallel and is not on this
branch's base (not on main at the time of writing). Once it lands: a direct instance at `𝕜 = ℝ`, ~10 lines.'''
deps = ["Matrix.exists_isPolarDecomposition", "Matrix.IsPolarDecomposition"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 9.4.1'

[[node]]
id = "polar_factors"
kind = "theorem"
desc = '''§9.4.3: in Theorem 9.4.1, `P = (AᵀA)^{1/2}` (the positive semidefinite square root, `CFC.sqrt`
under `open scoped MatrixOrder`), and if `rank(A) = n` then `U = A (AᵀA)^{-1/2}`, for every `U P` with
`Matrix.IsPolarDecomposition A U P`. `Matrix.IsPolarDecomposition.eq_cfcSqrt` (and, for the second clause,
its further declaration). ★

Blocked: the backbone polar decomposition (`Matrix.IsPolarDecomposition.eq_cfcSqrt`, `Numlib/LinearAlgebra/Matrix/Polar` and
`Numlib/Analysis/Matrix/Function/Polar`) is being done by agent dec1 in parallel and is not on this
branch's base (not on main at the time of writing). Once it lands: a direct instance, ~20 lines.'''
deps = ["Matrix.IsPolarDecomposition.eq_cfcSqrt", "theorem_9_4_1"]
source = 'Golub–Van Loan, Matrix Computations, §9.4.3'

[[node]]
id = "equation_9_4_12"
kind = "theorem"
desc = '''(9.4.11)–(9.4.12): for nonsingular `A : Matrix (Fin n) (Fin n) ℝ` with polar decomposition `A = U P`,
Newton's iteration `X₀ = A`, `X_{k+1} = (X_k + X_k⁻ᵀ)/2` (`Matrix.newtonPolarIterate`; the body of
(9.4.11) is lost in the source and reconstructed from (9.4.12)) is well defined, `X_k = U P_k` with
`P₀ = P`, `P_{k+1} = (P_k + P_k⁻¹)/2` positive definite. "Polar decomposition `A = U P`" is the hypothesis
`Matrix.IsPolarDecomposition A U P`. `Matrix.newtonPolarIterate_eq`. ★

Blocked: the backbone polar decomposition (`Matrix.newtonPolarIterate_eq`, `Numlib/LinearAlgebra/Matrix/Polar` and
`Numlib/Analysis/Matrix/Function/Polar`) is being done by agent dec1 in parallel and is not on this
branch's base (not on main at the time of writing). Once it lands: a direct instance, ~10 lines.'''
deps = ["Matrix.newtonPolarIterate_eq", "theorem_9_4_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (9.4.12)'

[[node]]
id = "newtonPolar_tendsto"
kind = "theorem"
desc = '''§9.4.3: `‖X_k - U‖₂ = ‖P_k - I‖₂` and `X_k → U` quadratically (the `P_k` are the Newton sign
iterates of `P`, and `sign(P) = I`), under `Matrix.IsPolarDecomposition A U P`. `Matrix.tendsto_newtonPolarIterate`. ★

Blocked: the backbone polar decomposition (`Matrix.tendsto_newtonPolarIterate`, `Numlib/LinearAlgebra/Matrix/Polar` and
`Numlib/Analysis/Matrix/Function/Polar`) is being done by agent dec1 in parallel and is not on this
branch's base (not on main at the time of writing). Once it lands: a direct instance, ~10 lines.'''
deps = ["Matrix.tendsto_newtonPolarIterate", "equation_9_4_12"]
source = 'Golub–Van Loan, Matrix Computations, §9.4.3'

[[node]]
id = "sign_block_polar"
kind = "theorem"
desc = '''§9.4.3: for nonsingular `A : Matrix (Fin n) (Fin n) ℝ` with SVD `A = U_A Σ_A V_Aᵀ`, `Q = (1/√2)
[U_A 0; 0 V_A] [I I; I -I]` is orthogonal, `Qᵀ [0 A; Aᵀ 0] Q = [Σ_A 0; 0 -Σ_A]`, and `sign([0 A; Aᵀ
0]) = [0 U; Uᵀ 0]` with `U = U_A V_Aᵀ` the orthogonal polar factor ("nonsingular" is missing in the
book and needed: a zero singular value is a zero eigenvalue). Through `Matrix.map Complex.ofReal`,
`Matrix.matrixSign_hermitianDilation`: `matrixSign (hermitianDilation Aᴴ) = hermitianDilation Uᴴ` for
nonsingular `A` with `IsPolarDecomposition A U P`. The surface keeps its `fromBlocks 0 A Aᵀ 0` statement
and rewrites (`hermitianDilation Aᴴ = fromBlocks 0 A Aᴴ 0` by unfolding); `U` is a polar factor by
`Matrix.IsSVD.isPolarDecomposition` (`U = U_A V_Aᵀ`). ★

Blocked: the backbone polar decomposition (`Matrix.matrixSign_hermitianDilation`, `Matrix.IsSVD.isPolarDecomposition`, `Numlib/LinearAlgebra/Matrix/Polar` and
`Numlib/Analysis/Matrix/Function/Polar`) is being done by agent dec1 in parallel and is not on this
branch's base (not on main at the time of writing). Once it lands: the `fromBlocks` restatement through `Matrix.map Complex.ofReal`, ~40 lines.'''
deps = ["Matrix.matrixSign_hermitianDilation", "Matrix.hermitianDilation", "Matrix.IsSVD.isPolarDecomposition", "theorem_9_4_1"]
source = 'Golub–Van Loan, Matrix Computations, §9.4.3, display'

