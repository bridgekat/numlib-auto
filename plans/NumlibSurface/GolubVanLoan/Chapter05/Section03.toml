[[node]]
id = "algorithm_5_3_2"
kind = "definition"
desc = '''Algorithm 5.3.2 (Householder LS solution), as printed: `A' ← (algorithm_5_2_1 rnd h A).1`
(the array only — the printed algorithm does not use the `β`s); for `j = 1:n`,
`v = storedHouseholderVec A' j` (`[1; A'(j+1:m, j)]`), `β = 2/vᵀv` (a rounded dot product over
`rows j` and a division — the book's recomputation), `b(j:m) ← b(j:m) - β(vᵀ b(j:m)) v` on the index
list `rows j` (rounded, in the printed association `β(vᵀb)` then times `v`, which is not
`householderApplyLeft`'s `(βv)(vᵀb)`, so it is written out);
then `x ← GolubVanLoan.Chapter03.algorithm_3_1_2 rnd (upperPart A')₁₁ b(1:n)`. ★★

Blocked: the back substitution `GolubVanLoan.Chapter03.algorithm_3_1_2` (agent s03) is not on this branch (s05, base 55f7ad05). The program is `algorithm_5_2_1`, `factoredQTransposeMul` and Algorithm 3.1.2 (~15 lines once it lands).'''
deps = ["algorithm_5_2_1", "storedHouseholderVec", "upperPart", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.3.2'

[[node]]
id = "algorithm_5_3_2_spec"
kind = "theorem"
desc = '''For full-column-rank `A` **and no degenerate Householder step** (`∀ j, (Id.run (algorithm_5_2_1
pure h A)).2 j ≠ 0`): `IsLeastSquaresSolution A b (toLp 2 (Id.run (algorithm_5_3_2 pure h A b)))`.
The recomputed reflectors are then the actual ones (`equation_5_1_4_beta`), the `b`-loop computes
`Qᵀb` (`equation_5_1_4` with `p = 1`), and `equation_5_3_5` with the back substitution's spec.
Without the hypothesis the statement is false (`algorithm_5_3_2_counterexample`). ★★

Blocked: waits for `algorithm_5_3_2` and `GolubVanLoan.Chapter03.algorithm_3_1_2_spec` (s03), not on this branch (s05, base 55f7ad05); then `algorithm_5_2_1_spec`, `equation_5_1_4_beta` and `equation_5_3_5` (~50 lines).'''
deps = ["algorithm_5_3_2", "algorithm_5_2_1_spec", "equation_5_1_4_beta", "equation_5_1_4", "equation_5_3_5", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.3.2'

[[node]]
id = "algorithm_5_3_2_counterexample"
kind = "theorem"
desc = '''Algorithm 5.3.2 as printed is wrong when `house` returns `β = 0`: for `A = 1 : Matrix (Fin 2) (Fin 2) ℝ`
and `b = ![1, 0]`, every Householder step meets `σ = 0, x₁ = 1 ≥ 0`, so Algorithm 5.2.1 leaves `A`
unchanged with `β = 0`, while the printed `β = 2/vᵀv = 2` flips `b` to `![-1, 0]`, and the output is
`![-1, 0]`, not the least-squares (here exact) solution `![1, 0]`. A `decide`/`norm_num`
computation at `Id`. Recorded for `notes/book-errata.md`. ★

Blocked: waits for `algorithm_5_3_2` (blocked on s03's Algorithm 3.1.2) (s05, base 55f7ad05).'''
deps = ["algorithm_5_3_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.3.2'

[[node]]
id = "equation_5_3_6"
kind = "theorem"
desc = '''(5.3.6)–(5.3.8), rigorous: under the hypotheses of `algorithm_5_3_2_spec`'s nondegeneracy for
the *computed* run (every computed `β̂_j ≠ 0`) and `K u` small, every run `x̂` of
`algorithm_5_3_2 fp.round h A b` solves exactly a nearby problem: `∃ δA δb, IsLeastSquaresSolution
(A + δA) (b + δb) x̂ ∧ ‖δA‖_F ≤ c_A ‖A‖_F ∧ ‖δb‖₂ ≤ c_b ‖b‖₂` with explicit
`c_A, c_b = O(n γ_{K'})` from the columnwise QR backward error (`algorithm_5_2_1_rounding`, the same
reflectors applied to `b`: columnwise Lemma 19.3 on `[A | b]`) and the back substitution's
`(R̂ + ΔR) x̂ = ĉ`, `|ΔR| ≤ γ_n |R̂|` (chapter 3's bridge `algorithm_3_1_2_rounds` to `FloatingPoint.RoundsBackSubstDot`
and its backward error `FloatingPoint.exists_roundsBackSubstDot_eq`), `δA := Q[ΔR; 0] + E`. Relation to the printed
`(6m - 3n + 41) n u + O(u²)` (Lawson–Hanson): same shape, first-order constants replaced by `γ`s
(Higham Theorem 20.3). ★★★ (~250 lines)

Blocked: waits for `algorithm_5_3_2`, its spec and `GolubVanLoan.Chapter03.algorithm_3_1_2_rounds` (s03), not on this branch (s05, base 55f7ad05). The Householder half is `algorithm_5_2_1_rounding` (proved).'''
deps = [
  "algorithm_5_3_2",
  "algorithm_5_3_2_spec",
  "algorithm_5_2_1_rounding",
  "FloatingPoint.exists_eq_prodRev_mul_add",
  "GolubVanLoan.Chapter03.algorithm_3_1_2_rounds",
  "FloatingPoint.exists_roundsBackSubstDot_eq",  # staged by ch03
]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.6)'

