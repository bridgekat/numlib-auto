`σ_n(A)` replaced by `σ'` and no `O(ε²)` term. From `Matrix.norm_leastSquares_sub_le` divided by
`‖x_LS‖` and (5.3.16). ★★

Blocked: sv2's `Matrix.norm_leastSquares_sub_le` and `kappa2` are not on this branch (s05, base 55f7ad05). A restatement once they land (~20 lines).'''
