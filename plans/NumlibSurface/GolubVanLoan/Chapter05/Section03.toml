kind = "definition"
desc = '''§5.3.9: the skew-symmetric `v^c = !![0, -v 2, v 1; v 2, 0, -v 0; -v 1, v 0, 0]` of
`v : Fin 3 → ℝ`, with `p ⨯₃ q = p^c q = -q^c p = -(q ⨯₃ p)` (`crossMatrix_mulVec`, second declaration;
Mathlib `crossProduct`, notation `⨯₃`, `cross_anticomm`). Checked: Mathlib has no matrix form of the
cross product (`crossProduct`, `cross_apply` only). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §5.3.9, Definition'

[[node]]
id = "equation_5_3_21"
kind = "theorem"
desc = '''(5.3.21): `p × q ∈ span{p, q}⊥`, i.e. `p ⬝ᵥ (p ⨯₃ q) = 0 ∧ q ⬝ᵥ (p ⨯₃ q) = 0` — Mathlib
`dot_self_cross`, `dot_cross_self`. ★'''
deps = ["crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.21)'

[[node]]
id = "equation_5_3_22"
kind = "theorem"
desc = '''(5.3.22): `(p × q) × r = (p^c q)^c r = (q pᵀ - p qᵀ) r = (pᵀr) q - (qᵀr) p` — Mathlib
`cross_cross_eq_smul_sub_smul'`-type lemma with `crossMatrix_mulVec` and `vecMulVec`. ★'''
deps = ["crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.22)'

[[node]]
id = "equation_5_3_23"
kind = "theorem"
desc = '''(5.3.23): `(p × q)ᵀ(r × s) = det([p q]ᵀ[r s])` (the Binet–Cauchy/Lagrange identity) —
Mathlib `cross_dot_cross` and `Matrix.det_fin_two`. ★'''
deps = ["crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.23)'

[[node]]
id = "equation_5_3_24"
kind = "theorem"
desc = '''(5.3.24): `p^c p^c = p pᵀ - ‖p‖₂² I₃` (`ext i j; fin_cases i <;> fin_cases j; simp; ring`). ★'''
deps = ["crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.24)'

[[node]]
id = "equation_5_3_25"
kind = "theorem"
desc = '''(5.3.25): `‖p^c q‖₂² = ‖p‖₂² ‖q‖₂² (1 - (pᵀq/(‖p‖₂‖q‖₂))²)` for `p, q ≠ 0` (Lagrange's identity,
`equation_5_3_23` with `r = p, s = q`). ★'''
deps = ["equation_5_3_23"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.25)'

[[node]]
id = "equation_5_3_26"
kind = "theorem"
desc = '''(5.3.26), point–line: for `p₁ ≠ p₂`, `v = p₂ - p₁`, `L = {p₁ + τ v}`, the point
`z = y + (1/vᵀv) v^c v^c (y - p₁)` lies on `L` and minimizes `‖z - y‖₂` over `L` (by (5.3.24),
`z = p₁ + (vᵀ(y - p₁)/vᵀv) v`, the orthogonal projection). `IsMinOn` on the line, or
`EuclideanGeometry.orthogonalProjection` on `AffineSubspace.mk' p₁ (span {v})`. ★'''
deps = ["equation_5_3_24", "crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.26)'

[[node]]
id = "equation_5_3_27"
kind = "theorem"
desc = '''(5.3.27)–(5.3.28), line–line: for lines `L₁ ∋ p₁, p₂` and `L₂ ∋ q₁, q₂`, `v = p₂ - p₁`,
`w = q₂ - q₁`, `r = v^c w` **assumed nonzero** (non-parallel lines; the book omits it, and for
`r = 0` the formula divides by zero), `z₁ = p₁ + (1/rᵀr) v wᵀ r^c (q₁ - p₁)` and
`z₂ = q₁ + (1/rᵀr) w vᵀ r^c (q₁ - p₁)` lie on `L₁`, `L₂` and minimize `‖z₁ - z₂‖₂` (the normal
equations of the 3 × 2 least-squares problem in `τ`, P5.3.14; the scalars are triple products,
`triple_product_permutation`). `equation_5_3_28` is the `z₂` clause as its own declaration. ★★'''
deps = ["equation_5_3_22", "equation_5_3_23", "crossMatrix", "isLeastSquaresSolution_iff_normalEquations"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.27)'

[[node]]
id = "equation_5_3_28"
kind = "theorem"
desc = '''(5.3.28): the `z₂` half of `equation_5_3_27` (same hypotheses, `r ≠ 0`). ★'''
deps = ["equation_5_3_27"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.28)'

[[node]]
id = "equation_5_3_29"
kind = "theorem"
desc = '''(5.3.29), point–plane: for `p₁, p₂, p₃` **not collinear** (the book says "distinct", which is
not enough: collinear points give `v = 0`), `v = (p₂ - p₁)^c (p₃ - p₁)`, the point
`z = p₁ - (1/vᵀv) v^c v^c (y - p₁)` lies on the plane `{x : xᵀv = p₁ᵀv}` and minimizes `‖z - y‖₂`
over it (by (5.3.24), `z = y - (vᵀ(y - p₁)/vᵀv) v`). ★'''
deps = ["equation_5_3_24", "equation_5_3_21", "crossMatrix"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.29)'
