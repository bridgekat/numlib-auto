[[node]]
id = "lsIterativeImprovement"
kind = "definition"
desc = '''§5.3.8, the iterative improvement of the augmented system (displayed, unnumbered):
`r⁽⁰⁾ = 0, x⁽⁰⁾ = 0`; for `k` (fuel parameter): `[f; g] = [b; 0] - [I A; Aᵀ 0][r; x]` (in the book
"in higher precision": a second rounding hook `rndHi`), solve `[I A; Aᵀ 0][p; z] = [f; g]` by the
QR route of `augmentedSolve_qr` (with the working hook), update `[r; x] += [p; z]`. Spec
(`lsIterativeImprovement_spec`, same node): in exact arithmetic every iterate after the first is the
exact solution `(r_LS, x_LS)`. Björck's digit-gain claim is not formalized (heuristic). ★★

Blocked: the QR route of `augmentedSolve_qr` (proved) needs the triangular solves `GolubVanLoan.Chapter03.algorithm_3_1_1`/`algorithm_3_1_2` (agent s03, not on this branch (s05, base 55f7ad05); added to this node's `deps`). With them: a fuel-indexed fold of residual, solve and update steps, and the exact spec from `augmentedSolve_qr` and `equation_5_3_20` (~80 lines).'''
deps = ["augmentedSolve_qr", "equation_5_3_20", "GolubVanLoan.Chapter03.algorithm_3_1_1", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, §5.3.8'

