kind = "theorem"
desc = '''Theorem 5.3.1, (5.3.11), rigorous: with the hypotheses of the book (`rank A = n`,
`‖δA‖₂ < σ_n(A)`, `b, r_LS, x_LS ≠ 0`, `ε = max(‖δA‖₂/‖A‖₂, ‖δb‖₂/‖b‖₂)`) and
