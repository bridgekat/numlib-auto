[[node]]
id = "equation_5_3_4"
kind = "theorem"
desc = '''(5.3.4), rigorous in the form the book derives it: if the computed `x̂_LS` satisfies
`(AᵀA + E) x̂ = Aᵀb` with `‖E‖₂ ≤ η ‖AᵀA‖₂` ("from what we know about the roundoff properties of the
Cholesky factorization", §4.2.6, with `η = c u`) and `η κ₂(A)² < 1`, then
`‖x̂ - x_LS‖₂ / ‖x_LS‖₂ ≤ η κ₂(A)² / (1 - η κ₂(A)²)`, since `κ₂(AᵀA) = κ₂(A)²`. Backbone
`Matrix.norm_normalEquations_sub_le`, `Matrix.pinvCondNumberLp_two_conjTranspose_mul_self`. The book's "≈" is
the first-order reading. ★

Blocked: sv2's `Matrix.norm_normalEquations_sub_le`, `Matrix.pinvCondNumberLp_two_conjTranspose_mul_self` and `kappa2` are not on this branch (s05, base 55f7ad05). ~20 lines once they land.'''
deps = ["Matrix.norm_normalEquations_sub_le", "Matrix.pinvCondNumberLp_two_conjTranspose_mul_self", "kappa2"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.3.4)'

