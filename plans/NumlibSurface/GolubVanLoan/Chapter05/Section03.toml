namespace = "GolubVanLoan.Chapter05"
desc = '''
§5.3, the full-rank least-squares problem: the normal equations and the gradient (§5.3.1), the
SVD expansion (5.3.2)–(5.3.3), the method of normal equations (Algorithm 5.3.1) and its accuracy
(5.3.4), the QR solution (§5.3.3, Algorithm 5.3.2) and its backward stability (5.3.6)–(5.3.8), MGS on
the augmented matrix (§5.3.5), the perturbation theory (5.3.9)–(5.3.16) with Theorem 5.3.1, the
augmented system and iterative improvement (§5.3.8, (5.3.20)), and the cross-product nearness
problems of §5.3.9 ((5.3.21)–(5.3.29)).

Vectors in the least-squares statements are `EuclideanSpace ℝ (Fin m)` (the backbone's
`Matrix.IsLeastSquaresSolution`, `toEuclideanLin`); algorithms work on `Fin m → ℝ` and their specs
convert with `WithLp.toLp 2`. Matrix 2-norms under `open scoped Matrix.Norms.L2Operator` in their
own sections (the scoped-instance lesson of `notes/lessons.md`). `σ_n(A)` is
`⨅ i, A.singularValues i`, `κ₂` is `kappa2` (§5.2).

**Rigour.** Theorem 5.3.1 is planned in the exact form of `Numlib/Conditioning/LeastSquares`
(`σ_n(A) - ‖δA‖₂` in place of `σ_n(A)`, no `O(ε²)`), and the book's first-order form as a
corollary. (5.3.18)–(5.3.19) are heuristic readings (`≈`) with no rigorous content beyond (5.3.11)
and are not formalized; the numerical examples of §5.3.1 and §5.3.2 (`fl(AᵀA)` singular) are not
nodes; nor is Björck's "`k(t - q)` correct digits" (§5.3.8); Lawson–Hanson's printed first-order
constants in (5.3.7)–(5.3.8) are replaced by explicit `γ` expressions (`equation_5_3_6`–`equation_5_3_8`).

Book slips carried (report, Doubts): (5.3.3)'s upper summation limit is printed `2` (read `m`);
(5.3.26)–(5.3.29) need non-parallel lines (`r ≠ 0`) and non-collinear points (`v ≠ 0`); the proof
of Theorem 5.3.1 cites "Theorem 2.5.2" for the full rank of `A + tE` — it is Corollary 2.4.4; and
Algorithm 5.3.2 as printed fails when Algorithm 5.2.1's `house` returned `β = 0`
(`algorithm_5_3_2_counterexample`). Algorithm 5.3.2 rebuilds its reflectors as `β = 2/vᵀv` because the
book prints it so; it is the one program of the section that does (convention 13's exception for
the book's own recomputing displays), and its spec carries the nondegeneracy hypothesis.

Also not formalized: (5.3.17), the first-order expansion `‖r̂ − r‖/‖r‖ = ε‖ṙ(0)‖/‖r‖ + O(ε²)` inside
the proof of Theorem 5.3.1 (an intermediate `O(ε²)` step; its rigorous content is `theorem_5_3_1_b`).
'''

[[node]]
id = "isLeastSquaresSolution_iff_normalEquations"
kind = "theorem"
desc = '''§5.3.1: `x` minimizes `‖Ax - b‖₂` iff `Aᵀ(Ax - b) = 0` (the normal equations
`AᵀA x = Aᵀb`); if `x` and `x + αz` are both minimizers then `Az = 0`; for full column rank the
minimizer `x_LS` is unique and `AᵀA` is positive definite. Three clauses, backbone
`Matrix.isLeastSquaresSolution_iff_normalEquations`,
`Matrix.IsLeastSquaresSolution.toEuclideanLin_sub_eq_zero`, `Matrix.existsUnique_isLeastSquaresSolution`,
`Matrix.posDef_conjTranspose_mul_self_of_linearIndependent`. ★'''
deps = ["Matrix.isLeastSquaresSolution_iff_normalEquations", "Matrix.IsLeastSquaresSolution.toEuclideanLin_sub_eq_zero", "Matrix.existsUnique_isLeastSquaresSolution", "Matrix.posDef_conjTranspose_mul_self_of_linearIndependent"]
source = 'Golub–Van Loan, Matrix Computations, §5.3.1'

[[node]]
id = "gradient_leastSquaresObjective"
kind = "theorem"
desc = '''§5.3.1: `φ(x) = ½‖Ax - b‖₂²` has `∇φ(x) = Aᵀ(Ax - b)`, so "solving the normal equations is
tantamount to solving the gradient equation". Backbone `Matrix.hasGradientAt_leastSquaresObjective`. ★'''
