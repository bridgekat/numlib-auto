[[node]]
id = "algorithm_5_2_5_spec"
kind = "theorem"
desc = '''For upper Hessenberg `A` (`Matrix.IsUpperHessenberg`): with `(R, cs) := Id.run (algorithm_5_2_5 pure A)`
and `Q = ∏_j givensRotation j (j+1) (cs j).1 (cs j).2`: `Matrix.IsQR A Q R`, and `Q` is upper Hessenberg.
The backbone's `Matrix.hessenbergGivensQR_spec` proves the same shape for `givensPair`-rotations;
here the rotations differ by signs (Algorithm 5.1.3 does not fix the sign of `r`), so the invariant
is re-run (or transported: each `G_j` is `± diag` times the backbone's). ★★'''
deps = ["algorithm_5_2_5", "algorithm_5_1_3_spec", "givensApplyLeft_spec", "givensRotation", "Matrix.hessenbergGivensQR_spec", "Matrix.IsUpperHessenberg"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.2.5'

[[node]]
id = "algorithm_5_2_5_rounding"
kind = "theorem"
desc = '''The backward error of the computed Hessenberg QR, rigorous: every run `(R̂', ĉs)` gives
`Q * R̂' = A + E` with `Q` the product of the exact rotations of the computed pairs and
`‖E‖_F ≤ ((1 + √2 γ₁₅)^{n-1} - 1) ‖A‖_F` (the `n - 1` rotations; `upperPart` junk as in
`algorithm_5_2_4_rounding`). The piece of the QR iteration's analysis that
`notes/frontier.md`'s Givens item waits for (chapters 7–8 consume it for the Francis step). ★★'''
deps = ["algorithm_5_2_5", "algorithm_5_2_5_spec", "algorithm_5_1_3_rounding", "givensApplyLeft_rounding", "FloatingPoint.exists_eq_prodRev_mul_add"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.2.5'

[[node]]
id = "classicalGramSchmidt"
kind = "definition"
desc = '''§5.2.7, classical Gram–Schmidt (displayed, unnumbered): `R(1,1) = ‖A(:,1)‖₂`,
`Q(:,1) = A(:,1)/R(1,1)`; for `k = 2:n`: `R(1:k-1, k) = Q(:, 1:k-1)ᵀ A(:, k)` (dot products),
`z = A(:, k) - Q(:, 1:k-1) R(1:k-1, k)` (a gaxpy), `R(k,k) = ‖z‖₂`, `Q(:, k) = z/R(k,k)`. The `k = 1`
step is the `k`-loop's body with an empty `1:k-1` range, so the program is one fold over
`Fin n`. ★'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1"]
source = 'Golub–Van Loan, Matrix Computations, §5.2.7'

[[node]]
id = "classicalGramSchmidt_spec"
kind = "theorem"
desc = '''For full-column-rank `A`: with `(Q, R) := Id.run (classicalGramSchmidt pure A)`,
`Matrix.IsThinQR A Q R ∧ ∀ j, 0 < R j j`, and the columns of `Q` are
`InnerProductSpace.gramSchmidtNormed ℝ` of the columns of `A` (Mathlib's `gramSchmidt` *is* CGS:
`gramSchmidt_def`, `gramSchmidtNormed`). Also (5.2.3)'s `q_k = (a_k - Σ_{i<k} r_ik q_i)/r_kk`,
`r_ik = q_iᵀ a_k`. ★★'''
deps = ["classicalGramSchmidt", "Matrix.IsThinQR", "Matrix.exists_qr"]
source = 'Golub–Van Loan, Matrix Computations, §5.2.7'

[[node]]
id = "mgs_remainder_eq"
kind = "theorem"
desc = '''§5.2.8, the derivation of MGS: with `A = Q₁R₁` (thin, columns `q_i`, rows `r_iᵀ` of `R₁`),
`A - ∑_{i<k} q_i r_iᵀ = ∑_{i≥k} q_i r_iᵀ`, whose columns `< k` vanish (`[0 | A^{(k)}]`), and for
`A^{(k)} = [z | B]`: `r_kk = ‖z‖₂`, `q_k = z/r_kk`, `[r_{k,k+1} ⋯ r_{kn}] = q_kᵀ B`. ★'''
deps = ["Matrix.IsThinQR"]
source = 'Golub–Van Loan, Matrix Computations, §5.2.8'

[[node]]
id = "algorithm_5_2_6"
kind = "definition"
desc = '''Algorithm 5.2.6 (modified Gram–Schmidt): state `(A, Q, R)`; for `k : Fin n`:
`R(k,k) ← rnd √(dot of A(:,k) with itself)`, `Q(:,k) ← rnd (A(:,k)/R(k,k))`; for `j > k`:
`R(k,j) ← dot (Q(:,k), A(:,j))`, `A(:,j) ← rnd (A(:,j) - rnd (Q(:,k) R(k,j)))`. Returns `(Q, R)`.
Prototype `notes/gvl/ch05/proto/Chapter05.lean` (elaborates; the plan calls chapter 1's dot
product for the inner products). ★'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.2.6'

[[node]]
id = "algorithm_5_2_6_spec"
kind = "theorem"
desc = '''For `rank A = n`: `Matrix.IsThinQR A Q R ∧ ∀ j, 0 < R j j` for
`(Q, R) := Id.run (algorithm_5_2_6 pure A)` (statement elaborated in the prototype). Invariant:
after step `k`, column `j > k` of the working array is `(I - Σ_{i≤k} q_i q_iᵀ) a_j`
(`Matrix.prod_one_sub_vecMulVec_of_orthonormal`), which is nonzero by independence. ★★'''
deps = ["algorithm_5_2_6", "mgs_remainder_eq", "Matrix.prod_one_sub_vecMulVec_of_orthonormal", "Matrix.IsThinQR"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.2.6'

[[node]]
id = "algorithm_5_2_6_eq_classicalGramSchmidt"
kind = "theorem"
desc = '''In exact arithmetic MGS and CGS compute the same `Q₁` and `R₁` ("a rearrangement of the
calculation"): for full-column-rank `A`, `Id.run (algorithm_5_2_6 pure A) = Id.run (classicalGramSchmidt pure A)`
— by `Matrix.IsThinQR.unique` from the two specs. ★'''
deps = ["algorithm_5_2_6_spec", "classicalGramSchmidt_spec", "Matrix.IsThinQR.unique"]
source = 'Golub–Van Loan, Matrix Computations, §5.2.8'

[[node]]
id = "complexHouseholderQR"
kind = "theorem"
desc = '''§5.2.10: for `A : Matrix (Fin m) (Fin n) ℂ` there are unitary `Q = Q₁ ⋯ Q_n` (complex Householder
matrices, each making `Q_j A` upper triangular through its first `j` columns) and upper triangular
`R` with `A = Q R`: `∃ Q R, Matrix.IsQR A Q R` over `ℂ`. Backbone `Matrix.exists_isQR` (over `RCLike`),
through `exists_unitary_mul_upperTriangular`, whose construction is exactly the loop of §5.2.10. ★'''
deps = ["Matrix.exists_isQR", "complexHouseholder"]
source = 'Golub–Van Loan, Matrix Computations, §5.2.10'
