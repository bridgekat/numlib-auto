[[node]]
id = "rotationCode"
kind = "definition"
desc = '''(5.1.9), Stewart's encoding of `Z = [c s; -s c]`: `rotationCode c s : ℝ := if c = 0 then 1
else if |s| < |c| then SignType.sign c * s / 2 else 2 * SignType.sign s / c` (an exact function; the
book stores it in the `(i, k)` entry). Named by content (the display defines notation). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.9)'

[[node]]
id = "rotationDecode"
kind = "definition"
desc = '''(5.1.10), the reconstruction: `rotationDecode ρ : ℝ × ℝ := if ρ = 1 then (0, 1) else if |ρ| < 1
then (√(1 - (2ρ)²), 2ρ) else (2/ρ, √(1 - (2/ρ)²))`. Named by content. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.10)'

[[node]]
id = "rotationDecode_rotationCode"
kind = "theorem"
desc = '''§5.1.11 "it is possible to reconstruct `Z` (or `-Z`)": for `c² + s² = 1`,
`rotationDecode (rotationCode c s) = (c, s) ∨ rotationDecode (rotationCode c s) = (-c, -s)`.
Cases: `c = 0` gives `ρ = 1` and `s = ±1`; `|s| < |c|` gives `|ρ| = |s|/2 < 1/2` and
`(|c|, sign(c) s) = sign(c)(c, s)`; otherwise `|c| ≤ 1/√2`, `|ρ| = 2/|c| ≥ 2√2 > 1`, and
`(sign(s) c, |s|) = sign(s)(c, s)`; the branches of the decoder are thereby disjoint. ★'''
deps = ["rotationCode", "rotationDecode"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.10)'

[[node]]
id = "orthogonalToWorkingPrecision"
kind = "definition"
desc = '''§5.1.12: `Q̂ : Matrix (Fin m) (Fin m) ℝ` is orthogonal to working precision `ε` if
`∃ Q ∈ orthogonalGroup (Fin m) ℝ, ‖Q̂ - Q‖₂ ≤ ε` (the book's `‖Q̂ - Q‖ = O(u)` with the `O(u)` made
an explicit parameter). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §5.1.12, Definition'

[[node]]
id = "orthogonalToWorkingPrecision_transpose_mul_self"
kind = "theorem"
desc = '''§5.1.12 "A corollary of this is that `‖Q̂ᵀQ̂ - I_m‖ = O(u)`": `orthogonalToWorkingPrecision ε Q̂ →
‖Q̂ᵀ * Q̂ - 1‖₂ ≤ 2 ε + ε ^ 2`. Backbone `FloatingPoint.l2_opNorm_transpose_mul_self_sub_one_le`. ★'''
deps = ["orthogonalToWorkingPrecision", "FloatingPoint.l2_opNorm_transpose_mul_self_sub_one_le"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.12'

[[node]]
id = "givensRotation_orthogonalToWorkingPrecision"
kind = "theorem"
desc = '''§5.1.12 "The matrices defined by the floating point output of house and givens are
orthogonal to working precision", the Givens half: for a run `(ĉ, ŝ)` of `algorithm_5_1_3 fp.round a b`,
`orthogonalToWorkingPrecision γ₁₃ (givensRotation i k ĉ ŝ)` (`FloatingPoint.l2_opNorm_planeRotation_sub_le`);
the house half is `householderMatrix_computed_sub_le` (`8 γ_K`). ★'''
deps = ["orthogonalToWorkingPrecision", "algorithm_5_1_3_rounding", "givensRotation", "FloatingPoint.l2_opNorm_planeRotation_sub_le", "householderMatrix_computed_sub_le"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.12'

[[node]]
id = "equation_5_1_11"
kind = "theorem"
desc = '''(5.1.11), rigorous. Let `A₀ = A ∈ ℝ^{m×n}` and `A_k` a sequence in which each `A_k` is a run of
one of the four computed updates (`householderApplyLeft/Right`, `givensApplyLeft/Right`) applied
to `A_{k-1}` with computed data that are `IsRelPert` of exact orthogonal `Q_k` (left) or `Z_k`
(right) — the transformations determined by the *computed* data, which is the only reading under
which the claim holds (report, Doubts: the book's "the orthogonal matrices that would be produced
in the absence of roundoff" cannot be meant literally). If each step satisfies
`‖A_k - Q_k A_{k-1} Z_k‖_F ≤ ε ‖A_{k-1}‖_F` (`Z_k = 1` or `Q_k = 1`; the four `…_rounding` nodes give
`ε`), then `B = A_p = (Q_p ⋯ Q_1)(A + E)(Z_1 ⋯ Z_p)` with `‖E‖_F ≤ ((1 + ε)^p - 1) ‖A‖_F ≤ γ_p(ε) ‖A‖_F`
and so `‖E‖₂ ≤ √(min m n) γ_p(ε) ‖A‖₂` — the book's `c u ‖A‖₂`, `c` depending "mildly" on
`m, n, p`. Backbone `FloatingPoint.exists_eq_prodRev_mul_add_mul_prodFwd_rect`,
`FloatingPoint.one_add_pow_sub_one_le_gamma`. ★★'''
deps = ["householderApplyLeft_rounding", "householderApplyRight_rounding", "givensApplyLeft_rounding", "givensApplyRight_rounding", "FloatingPoint.exists_eq_prodRev_mul_add_mul_prodFwd_rect", "FloatingPoint.one_add_pow_sub_one_le_gamma"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.11)'

[[node]]
id = "complexHouseholder"
kind = "theorem"
desc = '''§5.1.13, the complex Householder transformation: for `0 ≠ x ∈ ℂ^m` with `x₁ = r e^{iθ}` and
`v = x ± e^{iθ} ‖x‖₂ e₁`, `P = I - (2 / vᴴv) v vᴴ` is unitary and `P x = ∓ e^{iθ} ‖x‖₂ e₁`
(`e^{iθ}` is `Matrix.phase x₁`, `1` at `x₁ = 0`). Backbone `Matrix.reflector_mulVec_eq_of_sq` over
`ℂ` with `α = ± phase x₁ ‖x‖`, `Matrix.reflector_mem_unitaryGroup`. ★'''
deps = ["Matrix.reflector_mulVec_eq_of_sq", "Matrix.reflector_mem_unitaryGroup", "Matrix.phase"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.13'

[[node]]
id = "complexGivens_mem_unitaryGroup"
kind = "theorem"
desc = '''§5.1.13: `Q = [cos θ, sin θ e^{iφ}; -sin θ e^{-iφ}, cos θ]` is unitary for real `θ, φ`
(as `!![c, s; -star s, c] ∈ unitaryGroup (Fin 2) ℂ` for real `c`, `c² + |s|² = 1`), and so is its
embedding `Matrix.planeEmbed i k` in `ℂ^{m×m}` (`planeEmbed_mem_unitaryGroup_iff`). ★'''
deps = ["Matrix.planeEmbed", "Matrix.planeEmbed_mem_unitaryGroup_iff"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.13'

[[node]]
id = "equation_5_1_12"
kind = "theorem"
desc = '''(5.1.12): for `u, v ∈ ℂ`, with `(c_α, s_α)`, `(c_β, s_β)`, `(c_θ, s_θ)` the outputs of
`algorithm_5_1_3` (exact) on `(u₁, u₂)`, `(v₁, v₂)`, `(r_u, r_v)`,
`e^{iφ} = (c_α c_β + s_α s_β) + i (c_α s_β - c_β s_α)`, `c = c_θ`, `s = s_θ e^{iφ}`:
`[c s; -s̄ c]ᴴ [u; v] = [r; 0]`, i.e. `conj s * u + c * v = 0`. The book's verification:
`u = r_u e^{-iα}`, `v = r_v e^{-iβ}` (from `algorithm_5_1_3_spec`), so
`s̄ u + c v = e^{-iβ}(s_θ r_u + c_θ r_v) = 0`. ★★'''
deps = ["algorithm_5_1_3_spec", "complexGivens_mem_unitaryGroup"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.12)'
