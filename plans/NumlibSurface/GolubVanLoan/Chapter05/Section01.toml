namespace = "GolubVanLoan.Chapter05"
desc = '''
§5.1, Householder and Givens transformations: the reflector `P = I - β v vᵀ` and its defining
property (5.1.2); `house` (Algorithm 5.1.1) and the premultiplication/postmultiplication updates
of §5.1.4; the factored form (5.1.3)–(5.1.5) and the WY representation (Lemma 5.1.1,
Algorithm 5.1.2); Givens rotations (5.1.7)–(5.1.8), `givens` (Algorithm 5.1.3) and the row/column
updates of §5.1.9; Stewart's one-number encoding (5.1.9)–(5.1.10); the rounding claims of
§5.1.5, §5.1.10, §5.1.12 and (5.1.11) in their rigorous relational form; the complex reflector and
rotation of §5.1.13.

**The shared helper family** (conventions 10, 13, 14 of `NumlibSurface/GolubVanLoan`; every later
chapter calls these and defines no variant): `houseOn` (Algorithm 5.1.1 on the entries listed by
an index list; `algorithm_5_1_1` is its instance at the full list), `householderApplyLeft` /
`householderApplyRight` (§5.1.4, in place on the full matrix over row and column index lists),
`givensRotation` (the matrix `G(i, k, θ)`), `givensApplyLeft` / `givensApplyRight` (§5.1.9, rows
`i, k` over a column list / columns `i, k` over a row list), and for reflector data of type
`List ((Fin m → ℝ) × ℝ)` (pairs `(v, β)` in order of application, `v` full length, zero off its
active rows, with the `β` that `house` returned) `householderProduct`, `forwardAccumulation`,
`backwardAccumulation`. A submatrix `A(j:m, k:n)` is never copied into a `Fin (m - j)`-typed
array: the helpers take the full matrix and the index lists `rows`, `cols`. Each symmetric pair is
two nodes with two specs. Each helper's exact spec is read off its bridge at the exact model where
a bridge exists (convention 11).

Conventions (see `Chapter05.toml`): vectors `Fin m → ℝ`, 0-based (`x 0` is the book's `x(1)`, `e₁`
is `Pi.single 0 1`); `P = 1 - β • vecMulVec v v`; the book's `G(i, k, θ)` is
`givensRotation i k c s := Matrix.planeRotation i k c (-s)` (the backbone's plane rotation is in the
Jacobi sign convention). Algorithms follow the numbered conventions of `NumlibSurface/GolubVanLoan`;
the shapes of `algorithm_5_1_1` and `algorithm_5_1_3` and of the backbone relations they bridge to
are settled in `notes/gvl/ch05/proto/Chapter05.lean` (there with `x : Fin (k+1) → ℝ`; `houseOn` is
the same program over an index list).

**Errata carried by the formalization** (report, Doubts): Algorithm 5.1.1's `σ = 0 & x(1) < 0`
branch sets `β = 2` (the book prints `β = -2`, which makes `P` non-orthogonal); the retrieval
`β_j = 2/(1 + ‖A(j+1:m, j)‖²)` of (5.1.4)/(5.1.5) is wrong when `house` returned `β = 0`, so the
factored-form displays are specified against the recomputed `β` (`recomputedBeta`) and the link to
Algorithm 5.2.1's actual `β` is a separate node (`equation_5_1_4_beta`); everywhere else reflector
data carry the returned `β` and are never rebuilt as `2/(vᵀv)` (convention 13).

Not formalized here: the 2-by-2 preview's geometry (§5.1.1, prose), flop counts, the level-2/3
discussion of §5.1.7, P5.1.x.
'''

[[node]]
id = "householderMatrix"
kind = "definition"
desc = '''§5.1.2, (5.1.1): for `v : Fin m → ℝ`, `householderMatrix v = 1 - (2 / (v ⬝ᵥ v)) • vecMulVec v v`,
the Householder reflection with Householder vector `v` (reflection in `span{v}⊥` for `v ≠ 0`).
Equal to the backbone's `Matrix.reflector v` (`rfl` over `ℝ` up to `star_trivial`). ★'''
deps = ["Matrix.reflector", "Matrix.reflector_eq_householder"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.2, Definition'

[[node]]
id = "householderMatrix_isSymm"
kind = "theorem"
desc = '''§5.1.2 "Householder matrices are symmetric and orthogonal": `(householderMatrix v)ᵀ =
householderMatrix v` and `householderMatrix v ∈ orthogonalGroup (Fin m) ℝ` (two declarations;
`reflector_mem_unitaryGroup` over `ℝ`). ★'''
deps = ["householderMatrix", "Matrix.reflector_mem_unitaryGroup"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.2'

[[node]]
id = "equation_5_1_2"
kind = "theorem"
desc = '''(5.1.2): for `x : Fin (k+1) → ℝ` nonzero and `α = ‖x‖₂` or `α = -‖x‖₂` with
`v = x + α • e₁ ≠ 0`: `householderMatrix v *ᵥ x = -α • e₁` ("`v = x ± ‖x‖₂ e₁ ⇒ P x = ∓‖x‖₂ e₁`").
`Matrix.reflector_mulVec_eq_of_sq` at `𝕜 = ℝ`. The derivation above it (`v ∈ span{x, e₁}`,
`vᵀx = xᵀx + αx₁`, `vᵀv = xᵀx + 2αx₁ + α²`) is the backbone proof. ★'''
deps = ["householderMatrix", "Matrix.reflector_mulVec_eq_of_sq"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.2)'

[[node]]
id = "parlett_formula"
kind = "theorem"
desc = '''§5.1.3, Parlett's formula: if `x₁ + ‖x‖₂ ≠ 0` then
`x₁ - ‖x‖₂ = -(x₂² + ⋯ + x_m²) / (x₁ + ‖x‖₂)` (0-based: `x 0 - ‖x‖ = -(∑ i, x i.succ ^ 2) / (x 0 + ‖x‖)`),
the cancellation-free form of `v₁ = x₁ - ‖x‖₂` when `x₁ > 0`. `‖x‖² = x₁² + Σ x_{i+1}²`,
`EuclideanSpace.norm_sq_eq`, `Fin.sum_univ_succ`, `field_simp`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §5.1.3'

[[node]]
id = "houseOn"
kind = "definition"
desc = '''Algorithm 5.1.1 (`house`, printed "hose") on the entries of `x` listed by an index list —
convention 10's form of the book's `house(A(j:m, j))`:
`noncomputable def houseOn {M : Type → Type} [Monad M] (rnd : ℝ → M ℝ) {m : ℕ} (o : List (Fin m))
(x : Fin m → ℝ) : M ((Fin m → ℝ) × ℝ)`. With `p := o.head` (the book's `x(1)`; for `o = []` it
returns `(0, 0)`) and `t := o.tail`: `σ ← FloatingPoint.dotAccum rnd t x x 0` (Algorithm 1.1.1 over
the tail); `v :=` `1` at `p`, `x i` for `i ∈ t`, `0` off `o`; if `σ = 0 ∧ 0 ≤ x p` return `(v, 0)`;
if `σ = 0 ∧ x p < 0` return `(v, 2)` (**erratum: printed `-2`**); else
`μ ← rnd √(← rnd (← rnd (x p * x p) + σ))`, `v₀ ← if x p ≤ 0 then rnd (x p - μ) else
rnd (-σ / (← rnd (x p + μ)))` (negation exact, convention 1), `q ← rnd (v₀ * v₀)` (the square
computed once), `β ← rnd ((← rnd (2 * q)) / (← rnd (σ + q)))`, and `v i ← rnd (x i / v₀)` for
`i ∈ t` (the `t`-loop by `Function.update`). Comparisons act on computed values (convention 1). ★★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.1'

[[node]]
id = "houseOn_rounds"
kind = "theorem"
desc = '''The bridge (convention 12): for `fp.IsIdempotent`, `o.Nodup` and `o ≠ []`, every run
`(v̂, β̂) ∈ (houseOn fp.round o x).run` has `v̂ i = 0` for `i ∉ o` and its restriction to
`{i // i ∈ o}` satisfies `FloatingPoint.RoundsHouseholderVectorParlett fp (fun i => x i) ⟨o.head, _⟩
(fun i => v̂ i) β̂`. Unfold with `SetM.mem_run_bind`; the tail sum is a `RoundsDot` over `o.tail` by
`FloatingPoint.roundsDot_of_mem_run_dotAccum` (any duplicate-free order covering the indices;
`fp.IsIdempotent` for the `0 + p` start, convention 6) transported to `{j : {i // i ∈ o} // j ≠ head}`
by `FloatingPoint.roundsDot_comp_equiv_iff`; the `t`-loop by `SetM.mem_run_foldlM_update_of_nodup`
(each step writes `v i` from the frozen `v₀`). ★★'''
deps = ["houseOn", "SetM.mem_run_bind", "SetM.mem_run_foldlM_update_of_nodup", "FloatingPoint.roundsDot_of_mem_run_dotAccum", "FloatingPoint.roundsDot_comp_equiv_iff", "FloatingPoint.RoundsHouseholderVectorParlett", "FloatingPoint.RoundingModel.IsIdempotent"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.1'

[[node]]
id = "houseOn_spec"
kind = "theorem"
desc = '''Exact semantics of `houseOn` (read off the bridge, convention 11): for `o.Nodup`, `o ≠ []`,
`p = o.head` and `(v, β) := Id.run (houseOn pure o x)`: `v p = 1`, `v i = 0` for `i ∉ o`,
`(1 - β • vecMulVec v v) ∈ orthogonalGroup`, `(1 - β • vecMulVec v v) *ᵥ x = y` with `y p = ‖x|_o‖₂`,
`y i = 0` for `i ∈ o.tail` and `y i = x i` for `i ∉ o` (the reflector acts on the coordinates of `o`
only), and `β = 0 ∨ β * (v ⬝ᵥ v) = 2` (so `1 - β vvᵀ` is `1` or `householderMatrix v`). Proof:
`houseOn_rounds` at `RoundingModel.exact` (`round_exact`, `isIdempotent_exact`), then
`FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert` at `u = 0`, where every
`IsRelPert 0 K` is an equality, so the exact data of `IsReflectorPert` are the computed ones; the
`β` dichotomy and the support from the relation's three branches. The underlying identities
(Parlett's formula, `equation_5_1_2` with `α = -‖x‖`) are proved once in the backbone lemma. ★★'''
deps = ["houseOn_rounds", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.isIdempotent_exact", "FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert", "equation_5_1_2", "parlett_formula"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.1'

[[node]]
id = "houseOn_rounding"
kind = "theorem"
desc = '''§5.1.5, first claim, rigorous ("house produces a Householder vector `v̂` very close to the
exact `v`"), for a list: with `n = o.length`, `K = 18 n + 31`, `K u < 1`, `fp.IsIdempotent`,
`o.Nodup`, `o ≠ []`: every run `(v̂, β̂)` of `houseOn fp.round o x` has
`FloatingPoint.IsReflectorPert fp.u K (x|_o) ⟨o.head, _⟩ ‖x|_o‖₂ (v̂|_o) β̂` (on the subtype
`{i // i ∈ o}`) — exact reflector data `(v, β)` sending `x|_o` to `‖x|_o‖₂ e_head` with
`IsRelPert u K β β̂`, `IsRelPert u K (v i) (v̂ i)`, `|β| (vᵀv) ≤ 2` — and `v̂` vanishes off `o`.
`houseOn_rounds` and `FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert`. The book's
`O(u)` is `γ_K` (Wilkinson's constant is smaller; this one is the relational calculus's). This is
the form chapters 7 and 8 feed to `FloatingPoint.RoundsHessenbergStepPert` /
`RoundsTridiagonalizeStepPert`. ★'''
deps = ["houseOn_rounds", "FloatingPoint.RoundsHouseholderVectorParlett.isReflectorPert", "FloatingPoint.IsReflectorPert"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.5'

[[node]]
id = "algorithm_5_1_1"
kind = "definition"
desc = '''Algorithm 5.1.1 (`house`): `noncomputable def algorithm_5_1_1 (rnd : ℝ → M ℝ) {k : ℕ}
(x : Fin (k+1) → ℝ) : M ((Fin (k+1) → ℝ) × ℝ) := houseOn rnd (List.finRange (k+1)) x` — the helper
at the full list (convention 10; the equation is `rfl`), so the pivot is `x 0` and the tail sum is
Algorithm 1.1.1 on `x ∘ Fin.succ` in order. ★'''
deps = ["houseOn"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.1'

[[node]]
id = "algorithm_5_1_1_spec"
kind = "theorem"
desc = '''Exact semantics of `house`: with `(v, β) := Id.run (algorithm_5_1_1 pure x)`,
`v 0 = 1`, `(1 - β • vecMulVec v v) ∈ orthogonalGroup`, `(1 - β • vecMulVec v v) *ᵥ x = ‖x‖₂ • e₁`,
and `β = 0 ∨ β * (v ⬝ᵥ v) = 2` (so `1 - β vvᵀ` is `1` or `householderMatrix v`). `houseOn_spec` at
`o = List.finRange (k+1)` (`List.nodup_finRange`). The cases of the book: `σ = 0` (`x = x₁ e₁`;
`β = 0` for `x₁ ≥ 0`, `P = I - 2e₁e₁ᵀ` for `x₁ < 0`); otherwise `v = (x - ‖x‖ e₁)/(x₁ - ‖x‖)`
(`parlett_formula` for `x₁ > 0`). Statement elaborated in the prototype. ★'''
deps = ["algorithm_5_1_1", "houseOn_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.1'

[[node]]
id = "algorithm_5_1_1_rounding"
kind = "theorem"
desc = '''§5.1.5, first claim, for the book's `house` on a whole vector: with `K = 18(k+1) + 31`,
`K u < 1` and `fp.IsIdempotent`, every run `(v̂, β̂) ∈ (algorithm_5_1_1 fp.round x).run` satisfies
`FloatingPoint.IsReflectorPert fp.u K x 0 ‖x‖₂ v̂ β̂`: the exact `(v, β)` of
`algorithm_5_1_1_spec` satisfy `IsRelPert u K β β̂` and `IsRelPert u K (v i) (v̂ i)` for all `i`.
`houseOn_rounding` at the full list (the subtype `{i // i ∈ List.finRange (k+1)}` is `Fin (k+1)`,
`Equiv.subtypeUnivEquiv`). ★'''
deps = ["algorithm_5_1_1", "houseOn_rounding", "algorithm_5_1_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.5'

[[node]]
id = "householderApplyLeft"
kind = "definition"
desc = '''§5.1.4, premultiplication `PA = A - (βv)(vᵀA)` as the book prescribes it ("a matrix-vector
product and a rank-1 update"), in place on a block given by index lists (convention 10):
`householderApplyLeft (rnd : ℝ → M ℝ) {m n : ℕ} (v : Fin m → ℝ) (β : ℝ) (rows : List (Fin m))
(cols : List (Fin n)) (A : Matrix (Fin m) (Fin n) ℝ) : M (Matrix (Fin m) (Fin n) ℝ)`, the book's
`A(rows, cols) = (I - β v vᵀ) A(rows, cols)`: `w i ← rnd (β * v i)` once for `i ∈ rows`; for each
`q ∈ cols`: `s ← FloatingPoint.dotAccum rnd rows v (A.col q) 0` (Algorithm 1.1.1 over `rows`), then
`A i q ← rnd (A i q - (← rnd (w i * s)))` for `i ∈ rows`; entries outside `rows × cols` untouched.
Used by Algorithms 5.2.1, 5.2.2, 5.4.1, 5.4.2, (5.1.4), (5.1.5), and chapters 6–8, 10. ★'''
deps = ["FloatingPoint.dotAccum", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.4'

[[node]]
id = "householderApplyLeft_rounds"
kind = "theorem"
desc = '''The bridge: for `rows.Nodup`, `cols.Nodup`, `fp.IsIdempotent`, every run
`B ∈ (householderApplyLeft fp.round v β rows cols A).run` equals `A` outside `rows × cols`, and for
every `q ∈ cols` the restriction of `B.col q` to `{i // i ∈ rows}` is a
`FloatingPoint.RoundsHouseholderApplyScaled fp β (v|_rows) (A.col q|_rows)`. The column loop by
`SetM.mem_run_foldlM_update_of_nodup`-type reasoning on columns (each column read and written once),
the inner product by `FloatingPoint.roundsDot_of_mem_run_dotAccum` (convention 6). ★★'''
deps = ["householderApplyLeft", "FloatingPoint.RoundsHouseholderApplyScaled", "FloatingPoint.roundsDot_of_mem_run_dotAccum", "SetM.mem_run_foldlM_update_of_nodup", "SetM.mem_run_bind"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.4'

[[node]]
id = "householderApplyLeft_spec"
kind = "theorem"
desc = '''Exact semantics (read off the bridge at the exact model, convention 11): for duplicate-free
`rows`, `cols` and `v` vanishing off `rows`, `Id.run (householderApplyLeft pure v β rows cols A)`
equals `(1 - β • vecMulVec v v) * A` in the columns of `cols` and `A` elsewhere; for `cols` all
columns it is `(1 - β • vecMulVec v v) * A`. `householderApplyLeft_rounds` at `RoundingModel.exact`
with `RoundsHouseholderApplyScaled` at `u = 0` (every rounding an equality; the rank-one identity
`FloatingPoint.one_sub_smul_vecMulVec_mulVec_apply`), and the reflector acting as the identity off
`rows`. ★'''
deps = ["householderApplyLeft_rounds", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.isIdempotent_exact"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.4'

[[node]]
id = "householderApplyLeft_rounding"
kind = "theorem"
desc = '''§5.1.5, second claim, rigorous: `fl(P̂ A) = P (A + E)`. If `(v̂, β̂)` are `IsRelPert u K` of an
exact `(v, β)` with `|β| (vᵀv) ≤ 2` (e.g. the data of `houseOn_rounding`), `v`, `v̂` vanish off
`rows`, and `fp.IsIdempotent`, then every run `B ∈ (householderApplyLeft fp.round v̂ β̂ rows cols A).run`
satisfies, with `P = 1 - β • vecMulVec v v` (orthogonal, the identity off `rows`) and `E := Pᵀ B' - A`
on the block (`B'` = `B` on `rows × cols`), columnwise `‖E.col q‖₂ ≤ 3 γ_{3K+|rows|+3} ‖A.col q‖₂`
for `q ∈ cols` and `‖E‖_F ≤ 3 γ_{3K+|rows|+3} ‖A(rows, cols)‖_F`. The book's `‖E‖₂ = O(u ‖A‖₂)`
follows with a `√p` factor. `householderApplyLeft_rounds` and
`FloatingPoint.frobenius_norm_sub_le_of_forall_roundsHouseholderApplyScaled_col`. ★★'''
deps = ["householderApplyLeft_rounds", "householderApplyLeft_spec", "FloatingPoint.frobenius_norm_sub_le_of_forall_roundsHouseholderApplyScaled_col"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.5'

[[node]]
id = "householderApplyRight"
kind = "definition"
desc = '''§5.1.4, postmultiplication `AP = A - (Av)(βv)ᵀ`, in place on a block:
`householderApplyRight (rnd : ℝ → M ℝ) {m n : ℕ} (v : Fin n → ℝ) (β : ℝ) (rows : List (Fin m))
(cols : List (Fin n)) (A : Matrix (Fin m) (Fin n) ℝ) : M (Matrix (Fin m) (Fin n) ℝ)`, the book's
