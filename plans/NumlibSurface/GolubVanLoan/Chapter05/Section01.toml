[[node]]
id = "storedHouseholderVec"
kind = "definition"
desc = '''The Householder vector `v^{(j)}` read from a factored-form array ((5.1.3), §5.1.6):
for `A : Matrix (Fin m) (Fin n) ℝ` and `j : Fin n`, `storedHouseholderVec A j i = if i < j then 0
else if i = j then 1 else A i j` (indices compared as naturals): zeros above `j`, `1` at `j`, the
essential part `A(j+1:m, j)` below. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.3)'

[[node]]
id = "storedReflectors"
kind = "definition"
desc = '''The reflector data held by a factored-form array ((5.1.3), §5.1.6: "the Householder vectors
and the corresponding `β_j`"): for `A : Matrix (Fin m) (Fin n) ℝ` and `β : Fin n → ℝ`,
`storedReflectors A β : List ((Fin m → ℝ) × ℝ) := List.ofFn fun j => (storedHouseholderVec A j, β j)`
— the vectors read from the array, the `β` the program **returned** (convention 13). ★'''
deps = ["storedHouseholderVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.3)'

[[node]]
id = "factoredQ"
kind = "definition"
desc = '''(5.1.3), the factored form: `factoredQ β A := householderProduct (storedReflectors A β)
= Q₁ ⋯ Q_n` with `Q_j = 1 - β j • vecMulVec (storedHouseholderVec A j) (storedHouseholderVec A j)`.
(Named by content, source kept: the display defines notation, `NumlibSurface/GolubVanLoan` naming
rule.) ★'''
deps = ["storedReflectors", "householderProduct"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.3)'

[[node]]
id = "recomputedBeta"
kind = "definition"
desc = '''The `β` that (5.1.4), (5.1.5) and Algorithm 5.3.2 recompute from a stored vector:
`recomputedBeta A j := 2 / (storedHouseholderVec A j ⬝ᵥ storedHouseholderVec A j)` (the book's
`2/(1 + ‖A(j+1:m, j)‖²)`). It is the returned `β j` exactly when that is nonzero
(`equation_5_1_4_beta`); the book's displays are specified against it, every other consumer uses
the returned `β` (convention 13). ★'''
deps = ["storedHouseholderVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.4)'

[[node]]
id = "factoredQTransposeMul"
kind = "definition"
desc = '''(5.1.4) as a program (the display is a loop; named by content per the naming rule, its
correctness theorem is `equation_5_1_4`): overwriting `C` with `Qᵀ C` from the factored form:
for `j = 1:n`, `v = storedHouseholderVec A j` (`[1; A(j+1:m, j)]` on rows `j:m`),
`β_j ← rnd (2 / (← rnd (1 + (← dotAccum rnd (rows j).tail v v 0))))` (the book's recomputation: a
rounded dot product, `1 +`, a division), then
`C ← householderApplyLeft rnd v β_j (rows j) (List.finRange p) C` with
`rows j = (List.finRange m).filter (j ≤ ·)` (convention 10).
`noncomputable def factoredQTransposeMul (rnd) (A : Matrix (Fin m) (Fin n) ℝ)
(C : Matrix (Fin m) (Fin p) ℝ) : M (Matrix (Fin m) (Fin p) ℝ)`, `n ≤ m`. ★'''
deps = ["householderApplyLeft", "storedHouseholderVec", "FloatingPoint.dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.4)'

[[node]]
id = "equation_5_1_4"
kind = "theorem"
desc = '''(5.1.4) computes `Qᵀ C`: `Id.run (factoredQTransposeMul pure A C) = (factoredQ (recomputedBeta A) A)ᵀ * C`
— unconditionally, for the reflectors with the *recomputed* `β`. Induction over `j` with
`householderApplyLeft_spec`; the reflector `Q_j` acts on rows `≥ j` only. ★★'''
deps = ["factoredQTransposeMul", "factoredQ", "recomputedBeta", "householderApplyLeft_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.4)'

[[node]]
id = "factoredQFirstColumns"
kind = "definition"
desc = '''(5.1.5) as a program (named by content; its correctness theorem is `equation_5_1_5`),
backward accumulation of `Q(:, 1:k)`: `Q = I_m(:, 1:k)`; for `j = n:-1:1`,
`v = storedHouseholderVec A j`, `β_j` recomputed as in `factoredQTransposeMul`,
`Q ← householderApplyLeft rnd v β_j (rows j) (cols j) Q` with `cols j` the columns `j:k` (the book's
economy: the columns `< j` of the partial product are still those of the identity there). The loop
runs over `(List.finRange n).reverse`. ★'''
deps = ["householderApplyLeft", "storedHouseholderVec", "FloatingPoint.dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.5)'

[[node]]
id = "equation_5_1_5"
kind = "theorem"
desc = '''(5.1.5) computes the first `k` columns of `Q`:
`Id.run (factoredQFirstColumns pure A k) = (factoredQ (recomputedBeta A) A).submatrix id (Fin.castLE hk)`.
The restriction to columns `j:k` is justified by the invariant that after processing `j`, the
partial product `Q_j ⋯ Q_n` agrees with the identity on rows/columns `< j`. ★★'''
deps = ["factoredQFirstColumns", "factoredQ", "recomputedBeta", "householderApplyLeft_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.5)'

[[node]]
id = "forwardAccumulation"
kind = "definition"
desc = '''§5.1.6, forward accumulation `Q = I; for j = 1:r, Q = Q Q_j` over reflector data
`data : List ((Fin m → ℝ) × ℝ)` (convention 13): `data.foldlM (fun Q (v, β) =>
householderApplyRight rnd v β (List.finRange m) (List.finRange m) Q) 1`. ★'''
deps = ["householderApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.6'

[[node]]
id = "backwardAccumulation"
kind = "definition"
desc = '''§5.1.6, backward accumulation `Q = I; for j = r:-1:1, Q = Q_j Q` (the one the book
recommends, exploiting the zeros of the early `Q_j`): `data.reverse.foldlM (fun Q (v, β) =>
householderApplyLeft rnd v β (List.finRange m) (List.finRange m) Q) 1`. The symmetric twin of
`forwardAccumulation` (convention 14). ★'''
deps = ["householderApplyLeft"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.6'

[[node]]
id = "forwardAccumulation_spec"
kind = "theorem"
desc = '''`Id.run (forwardAccumulation pure data) = householderProduct data` (induction on the list with
`householderApplyRight_spec`, `List.prod_append`). ★'''
deps = ["forwardAccumulation", "householderProduct", "householderApplyRight_spec"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.6'

[[node]]
id = "backwardAccumulation_spec"
kind = "theorem"
desc = '''`Id.run (backwardAccumulation pure data) = householderProduct data` (induction on the reversed
list with `householderApplyLeft_spec`; associativity). ★'''
deps = ["backwardAccumulation", "householderProduct", "householderApplyLeft_spec"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.6'

[[node]]
id = "equation_5_1_6"
kind = "theorem"
desc = '''(5.1.6): a product `Q = Q₁ ⋯ Q_r` of `m × m` Householder matrices is a rank-`r` modification
of the identity, `∃ W Y : Matrix (Fin m) (Fin r) ℝ, Q = 1 - W * Yᵀ`. Backbone `Matrix.isWY_prod`. ★'''
deps = ["Matrix.isWY_prod"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.6)'

[[node]]
id = "lemma_5_1_1"
kind = "theorem"
desc = '''Lemma 5.1.1: if `Q = I - W Yᵀ` (orthogonal, `W, Y ∈ ℝ^{m×j}`), `P = I - β v vᵀ` and `z = β Q v`,
then `Q P = I - W₊ Y₊ᵀ` with `W₊ = [W | z]`, `Y₊ = [Y | v]` (columns appended with `Fin.snoc`).
Backbone `Matrix.IsWY.mul_one_sub_smul_vecMulVec` at `ℝ` (orthogonality not needed). ★'''
deps = ["Matrix.IsWY.mul_one_sub_smul_vecMulVec"]
source = 'Golub–Van Loan, Matrix Computations, Lemma 5.1.1'

[[node]]
id = "algorithm_5_1_2"
kind = "definition"
desc = '''Algorithm 5.1.2 (WY from factored form), on reflector data `data : List ((Fin m → ℝ) × ℝ)` of
length `r` (convention 13): `Y = v^{(1)}; W = β₁ v^{(1)}`; for `j = 2:r`,
`z = β_j (I_m - W Yᵀ) v^{(j)}` (computed as `v - W (Yᵀ v)`: a gaxpy with rounded dot products, then
the scaling), `W = [W | z]`, `Y = [Y | v^{(j)}]`. The growing widths are handled by keeping `W`, `Y`
as `Matrix (Fin m) (Fin r) ℝ` with the not-yet-filled columns zero (the column `j` is written at
step `j`), which leaves `W Yᵀ` unchanged. ★★'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.2'

[[node]]
id = "algorithm_5_1_2_spec"
kind = "theorem"
desc = '''With `(W, Y) := Id.run (algorithm_5_1_2 pure data)`: `householderProduct data = 1 - W * Yᵀ` and
the columns of `Y` are the vectors of `data`; if they have the shape (5.1.3), `Y` is unit lower
trapezoidal ("`Y` is merely the matrix of Householder vectors and is therefore unit lower
triangular"). Backbone `Matrix.isWY_prod`, `Matrix.isWY_prod_unitLowerTrapezoidal` (the program's
`W` is the backbone's `wyW`). ★★'''
deps = ["algorithm_5_1_2", "householderProduct", "Matrix.isWY_prod", "Matrix.isWY_prod_unitLowerTrapezoidal"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.2'

[[node]]
id = "blockReflector_mem_orthogonalGroup"
kind = "theorem"
desc = '''§5.1.7 "True block reflectors have the form `Q = I - 2VVᵀ` where `VᵀV = I_r`": such a `Q` is
orthogonal. Backbone `Matrix.one_sub_two_mul_conjTranspose_mem_unitaryGroup`. ★'''
deps = ["Matrix.one_sub_two_mul_conjTranspose_mem_unitaryGroup"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.7'

[[node]]
id = "givensRotation"
kind = "definition"
desc = '''(5.1.7), the Givens rotation matrix `G(i, k, θ)` (`c` at `(i,i)` and `(k,k)`, `s` at `(i,k)`, `-s`
at `(k,i)`): `givensRotation (i k : Fin m) (c s : ℝ) := Matrix.planeRotation i k c (-s)` (the
backbone's rotation has rows `(c, -s)`, `(s, c)`). Named `givensRotation` because the book's
`givens` is Algorithm 5.1.3, which computes `(c, s)`. ★'''
deps = ["Matrix.planeRotation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.7)'

[[node]]
id = "givensRotation_mem_orthogonalGroup"
kind = "theorem"
desc = '''§5.1.8 "Givens rotations are clearly orthogonal" (`c² + s² = 1`, `i ≠ k`), and the action of
`G(i, k, θ)ᵀ`: `y_i = c x_i - s x_k`, `y_k = s x_i + c x_k`, `y_j = x_j` otherwise (second
declaration `givensRotation_transpose_mulVec_apply`). `Matrix.planeRotation_mem_orthogonalGroup`,
`Matrix.transpose_planeRotation_mulVec_apply`. ★'''
deps = ["givensRotation", "Matrix.planeRotation_mem_orthogonalGroup", "Matrix.transpose_planeRotation_mulVec_apply"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.8'

[[node]]
id = "equation_5_1_8"
kind = "theorem"
desc = '''(5.1.8): with `c = x_i/√(x_i² + x_k²)`, `s = -x_k/√(x_i² + x_k²)` (`(x_i, x_k) ≠ 0`),
`y = G(i, k, θ)ᵀ x` has `y_k = 0` (and `y_i = √(x_i² + x_k²)`). The backbone's
`transpose_planeRotation_givensPair_mulVec` after `givensRotation i k c s = planeRotation i k c (-s)`
and `(c, -s) = givensPair x_i x_k`. ★'''
deps = ["givensRotation", "Matrix.givensPair", "Matrix.transpose_planeRotation_givensPair_mulVec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.1.8)'

[[node]]
id = "algorithm_5_1_3"
kind = "definition"
desc = '''Algorithm 5.1.3 (`givens`): `if b = 0 then (1, 0) else if |b| > |a| then τ ← rnd (-a/b);
s ← rnd (1 / (← rnd √(← rnd (1 + (← rnd (τ * τ)))))); c ← rnd (s * τ) else` the same with
`τ ← rnd (-b/a)` and the roles of `c`, `s` exchanged. Prototype
`notes/gvl/ch05/proto/Chapter05.lean` (elaborates as `noncomputable def`). ★'''
deps = ["FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.3'

[[node]]
id = "algorithm_5_1_3_rounds"
kind = "theorem"
desc = '''The bridge: every run `(ĉ, ŝ) ∈ (algorithm_5_1_3 fp.round a b).run` satisfies
`FloatingPoint.RoundsGivensPair fp a b ĉ ŝ` (prototype-checked statement; `SetM.mem_run_bind`
through the three branches — the comparisons `b = 0`, `|b| > |a|` are exact, convention 1). ★'''
deps = ["algorithm_5_1_3", "FloatingPoint.RoundsGivensPair", "SetM.mem_run_bind"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.3'

[[node]]
id = "algorithm_5_1_3_spec"
kind = "theorem"
desc = '''With `(c, s) := Id.run (algorithm_5_1_3 pure a b)`: `c ^ 2 + s ^ 2 = 1` and
`[c s; -s c]ᵀ [a; b] = [r; 0]`, i.e. `s * a + c * b = 0`, with `r = c a - s b` and `|r| = √(a² + b²)`
(the sign of `r` is not controlled — P5.1.11). Read off the bridge (convention 11):
`algorithm_5_1_3_rounds` at `RoundingModel.exact`, then `FloatingPoint.RoundsGivensPair.exists_isRelPert`
at `u = 0` (its exact pair equals the computed one when `b ≠ 0`; `b = 0` gives `(1, 0)` directly);
`r² = (c² + s²)(a² + b²) - (s a + c b)²`. ★'''
deps = ["algorithm_5_1_3_rounds", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundsGivensPair.exists_isRelPert"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.1.3'

[[node]]
id = "algorithm_5_1_3_rounding"
kind = "theorem"
desc = '''§5.1.10, "the computed `ĉ`, `ŝ` satisfy `ĉ = c(1 + ε_c)`, `ŝ = s(1 + ε_s)`, `ε = O(u)`",
rigorous: for `13 u < 1`, every run `(ĉ, ŝ) ∈ (algorithm_5_1_3 fp.round a b).run` has exact `c, s`
with `c² + s² = 1`, `s a + c b = 0`, `IsRelPert u 13 c ĉ`, `IsRelPert u 13 s ŝ`; when `b ≠ 0` these
are the exact-arithmetic output (`algorithm_5_1_3_spec`). `algorithm_5_1_3_rounds` and
`FloatingPoint.RoundsGivensPair.exists_isRelPert`. ★'''
deps = ["algorithm_5_1_3_rounds", "algorithm_5_1_3_spec", "FloatingPoint.RoundsGivensPair.exists_isRelPert"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.10'

[[node]]
id = "givensApplyLeft"
kind = "definition"
desc = '''§5.1.9, the row update `A([i, k], cols) = G(i, k, θ)ᵀ A([i, k], cols)` in place on the full
matrix (conventions 10, 13): `givensApplyLeft (rnd : ℝ → M ℝ) {m n : ℕ} (i k : Fin m) (c s : ℝ)
(cols : List (Fin n)) (A : Matrix (Fin m) (Fin n) ℝ) : M (Matrix (Fin m) (Fin n) ℝ)`: for `j ∈ cols`,
`τ₁ = A i j`, `τ₂ = A k j`, `A i j ← rnd (rnd (c τ₁) - rnd (s τ₂))`,
`A k j ← rnd (rnd (s τ₁) + rnd (c τ₂))`. Used by Algorithms 5.2.4, 5.2.5, §5.4.5, §6.5 and chapters
7, 8, 10, 11. ★'''
deps = ["givensRotation", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.9'

[[node]]
id = "givensApplyRight"
kind = "definition"
desc = '''§5.1.9, the column update `A(rows, [i, k]) = A(rows, [i, k]) G(i, k, θ)`:
`givensApplyRight (rnd : ℝ → M ℝ) {m n : ℕ} (i k : Fin n) (c s : ℝ) (rows : List (Fin m))
(A : Matrix (Fin m) (Fin n) ℝ)`: for `r ∈ rows`, `τ₁ = A r i`, `τ₂ = A r k`,
`A r i ← rnd (rnd (c τ₁) - rnd (s τ₂))`, `A r k ← rnd (rnd (s τ₁) + rnd (c τ₂))`. The symmetric
twin of `givensApplyLeft` (convention 14). ★'''
deps = ["givensRotation", "FloatingPoint.RoundingModel.round"]
source = 'Golub–Van Loan, Matrix Computations, §5.1.9'

[[node]]
id = "givensApplyLeft_spec"
