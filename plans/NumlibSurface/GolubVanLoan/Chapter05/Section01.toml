desc = '''For `i ≠ k` and `cols.Nodup`: `Id.run (givensApplyLeft pure i k c s cols A)` equals
`(givensRotation i k c s)ᵀ * A` in the columns of `cols` and `A` elsewhere; for `cols` all columns it
is `(givensRotation i k c s)ᵀ * A`. Read off the bridge (convention 11): `givensApplyLeft_rounds` at
`RoundingModel.exact`, where `RoundsGivensApply` is the exact two-entry update, then
`Matrix.transpose_planeRotation_mul_apply`. ★'''
deps = ["givensApplyLeft_rounds", "FloatingPoint.RoundingModel.round_exact", "Matrix.transpose_planeRotation_mul_apply"]
