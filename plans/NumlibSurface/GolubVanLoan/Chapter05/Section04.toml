[[node]]
id = "sigma_succ_le_of_colPivot"
kind = "theorem"
desc = '''§5.4.3, the termination criterion: if `R̂^{(k)} = [R̂₁₁ R̂₁₂; 0 R̂₂₂]` is the exact R-factor of
`A + E_k` (`Q R̂^{(k)} = (A + E_k) Π` with `Q` orthogonal), `‖E_k‖₂ ≤ ε₂ ‖A‖₂` and
`‖R̂₂₂‖₂ ≤ ε₁ ‖A‖₂`, then `σ_{k+1}(A) ≤ (ε₁ + ε₂) ‖A‖₂`: `σ_{k+1}(A + E_k) = σ_{k+1}(R̂^{(k)}) ≤ ‖R̂₂₂‖₂`
(`Matrix.sortedSingularValues_le_l2_opNorm_trailing`; the book cites Corollary 2.4.4) and
`σ_{k+1}(A) ≤ σ_{k+1}(A + E_k) + ‖E_k‖₂` (Weyl, chapter 8's `LinearMap.abs_singularValues_sub_le`). ★★

Blocked (c05, main fca5b833): `Matrix.sortedSingularValues_le_l2_opNorm_trailing` is on main, but
`GolubVanLoan.Chapter02.corollary_2_4_4` (the chapter restatement the surface must use, being proved
by agent c0209) is not. ~20 lines once it lands.'''
deps = [
  "Matrix.sortedSingularValues_le_l2_opNorm_trailing",
  "GolubVanLoan.Chapter02.corollary_2_4_4",
  "LinearMap.abs_singularValues_sub_le",  # ch08 (Numlib/Analysis/InnerProductSpace/SingularValues)
]
source = 'Golub–Van Loan, Matrix Computations, §5.4.3'

