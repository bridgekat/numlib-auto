[[node]]
id = "algorithm_5_4_2"
kind = "definition"
desc = '''Algorithm 5.4.2 (Householder bidiagonalization; the second call printed "ho se"), `m ≥ n`:
for `j = 1:n`: `(u, β_j) ← houseOn rnd (rows j) (A.col j)`, `A ← householderApplyLeft rnd u β_j
(rows j) (cols j) A`, store `u(2:)` in `A(j+1:m, j)`; if `j ≤ n - 2`: `(w, γ_j) ← houseOn rnd
(cols (j+1)) (A j)` (the row `A(j, j+1:n)` as the function `A j` on the column list — no transpose
copy, convention 10), `A ← householderApplyRight rnd w γ_j (rows j) (cols (j+1)) A`, store `w(2:)ᵀ` in
`A(j, j+2:n)` (copies). Returns the array and both `β` vectors (the returned `β`, convention 13). ★★'''
deps = ["houseOn", "householderApplyLeft", "householderApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 5.4.2'

