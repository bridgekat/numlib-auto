[[node]]
id = "equation_5_4_6"
kind = "theorem"
desc = '''(5.4.6): every `A ∈ ℝ^{m×n}` has `Qᵀ A Π = [R₁₁ R₁₂; 0 0]` with `r = rank A`, `Q` orthogonal,
`R₁₁` upper triangular and nonsingular (`r × r`), `Π` a permutation; and then
`ran(A) = span{q₁, …, q_r}`. Backbone `Matrix.exists_isPivotedQR_rank` at `𝕜 = ℝ`, which concludes
`∃ σ Q R, Matrix.IsPivotedQR.IsRankRevealing A Q R σ A.rank` (the bundle's fields `apply_eq_zero` — rows
`≥ r` vanish — and `isUnit_block` — `R₁₁` invertible — are the book's block form), and
`Matrix.IsPivotedQR.IsRankRevealing.range_eq_span`, which takes the bundle. ★

Blocked: dec2's `Matrix.exists_isPivotedQR_rank`, `Matrix.IsPivotedQR.IsRankRevealing` and `Matrix.IsPivotedQR.IsRankRevealing.range_eq_span` are not on this branch (s05, base 55f7ad05). ~20 lines once they land.'''
deps = ["Matrix.exists_isPivotedQR_rank", "Matrix.IsPivotedQR.IsRankRevealing", "Matrix.IsPivotedQR.IsRankRevealing.range_eq_span"]
source = 'Golub–Van Loan, Matrix Computations, Equation (5.4.6)'

[[node]]
id = "norm_sq_tail_eq"
kind = "theorem"
desc = '''§5.4.2: for `Q ∈ ℝ^{s×s}` orthogonal, `Qᵀ z = [α; w] ⇒ ‖w‖₂² = ‖z‖₂² - α²`, whence the column
norm update `‖z_j^{(k)}‖² = ‖z_j^{(k-1)}‖² - r_kj²`. Backbone
`Matrix.norm_sq_tail_eq_of_mem_unitaryGroup`. ★

Blocked: dec2's `Matrix.norm_sq_tail_eq_of_mem_unitaryGroup` is not on this branch (s05, base 55f7ad05). A restatement once it lands.'''
deps = ["Matrix.norm_sq_tail_eq_of_mem_unitaryGroup"]
source = 'Golub–Van Loan, Matrix Computations, §5.4.2'

