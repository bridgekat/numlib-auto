[[node]]
id = "triangular_mul_two_backward_run"
kind = "theorem"
desc = '''§2.7.9, the book's "it can be shown that `fl(AB)` = …": every run of
`Chapter01.algorithm_1_2_1` at `n = 2`, `C = 0`, on upper triangular `A`, `B`, under
`fp.IsIdempotent`, is `Ĉ = [a₁₁ b₁₁ (1 + ε₁), (a₁₁ b₁₂ (1 + ε₂) + a₁₂ b₂₂ (1 + ε₃))(1 + ε₄); 0,
a₂₂ b₂₂ (1 + ε₅)]` for some `|εᵢ| ≤ u` (the entries are `FloatingPoint.dotAccum` runs over the
abbreviated index ranges: two products for `(1,2)`, one each for `(1,1)` and `(2,2)`); with
`triangular_mul_two_backward` it gives the backward error statement for the runs. Split off from
`triangular_mul_two_backward` (now the algebraic part, proved) by surf2.

Blocked: chapter 1's `GolubVanLoan.Chapter01.algorithm_1_2_1` is not on this branch (surf2, base
1914bd7e; agent surf1 writes chapter 1 in parallel). ~40 lines once it lands (`SetM` run lemmas
and `Rounds.exists_delta` per entry).'''
deps = ["triangular_mul_two_backward", "GolubVanLoan.Chapter01.algorithm_1_2_1", "FloatingPoint.RoundingModel.IsIdempotent"]
