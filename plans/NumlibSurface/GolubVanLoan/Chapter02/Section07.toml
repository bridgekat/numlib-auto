[[node]]
id = "equation_2_7_12"
kind = "theorem"
desc = '''(2.7.12), rigorous form: for every run `s` of Algorithm 1.1.1 with `fp.IsIdempotent` and `n u < 1`,
`|s - xᵀ y| ≤ γ_n |x|ᵀ |y|` (without `IsIdempotent`: `γ_{n+1}`, `FloatingPoint.abs_sub_le_of_mem_run_dotAccum`),
`γ_n = FloatingPoint.gamma u n = n u / (1 - n u) = n u + O(u²)`; the printed `n u |x|ᵀ|y| + O(u²)` has no
content beyond this. Backbone `FloatingPoint.abs_sub_le_of_roundsDot` after `FloatingPoint.roundsDot_of_mem_run_dotAccum`. (2.7.13)–(2.7.14) ("`φ(n)` a modest
function", "`c` of order unity") are styles of writing the same bound and have no node. ★

Blocked: chapter 1's programs and bridges (`GolubVanLoan.Chapter01.algorithm_1_1_1_rounds`) are not on this branch (surf2, base 1914bd7e) (agent surf1 writes chapter 1 in parallel). Once they land the statement is a direct instance of the cited backbone lemmas (`FloatingPoint.abs_sub_le_of_roundsDot`, `FloatingPoint.abs_sub_le_of_mem_run_dotAccum`, ~10 lines).'''
deps = ["FloatingPoint.abs_sub_le_of_roundsDot", "GolubVanLoan.Chapter01.algorithm_1_1_1_rounds", "FloatingPoint.abs_sub_le_of_mem_run_dotAccum", "FloatingPoint.gamma"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.12)'

