[[node]]
id = "equation_2_7_19"
kind = "theorem"
desc = '''(2.7.19), rigorous form: for `A : Matrix (Fin m) (Fin r) ℝ`, `B : Matrix (Fin r) (Fin n) ℝ`, `r u < 1`,
every run `Ĉ` of the dot-product matrix multiplication `Chapter01.algorithm_1_1_6 fp.round A B 0` (started
at `C = 0`) satisfies `|Ĉ - A B| ≤ γ_r |A| |B|` entrywise (`(Ĉ - A * B).abs ≤ₑ gamma u r • (A.abs * B.abs)`; the
book's `n u |A||B| + O(u²)`, `n` the inner dimension), under `fp.IsIdempotent`: each entry is `fl(0 + s)`
with `s` a run of Algorithm 1.1.1, so the run is a `RoundsMul` (chapter 1's
`GolubVanLoan.Chapter01.algorithm_1_1_6_rounds`), and backbone
`FloatingPoint.abs_sub_entrywiseLE_of_roundsMul`. ★

Blocked: chapter 1's programs and bridges (`GolubVanLoan.Chapter01.algorithm_1_1_6_rounds`) are not on this branch (surf2, base 1914bd7e) (agent surf1 writes chapter 1 in parallel). Once they land the statement is a direct instance of the cited backbone lemmas (`FloatingPoint.abs_sub_entrywiseLE_of_roundsMul`, ~10 lines).'''
deps = ["FloatingPoint.abs_sub_entrywiseLE_of_roundsMul", "GolubVanLoan.Chapter01.algorithm_1_1_6_rounds", "equation_2_7_12"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.19)'

[[node]]
id = "equation_2_7_19_saxpy"
kind = "theorem"
desc = '''(2.7.19) for the gaxpy/saxpy-based product ("the same result applies if a gaxpy … procedure is used"):
with `fp.IsIdempotent` and `r u < 1`, every run of `Chapter01.algorithm_1_1_7 fp.round A B 0` satisfies the
same bound `|Ĉ - A B| ≤ γ_r |A||B|`. Every loop order accumulates each `c_ij` over `k = 1, …, r` in
increasing order, one rounded product and one rounded addition per step, so each entry is a run of
`FloatingPoint.dotAccum` from `0` (chapter 1's `algorithm_1_1_7_mem_run`), a `RoundsDot` under
`fp.IsIdempotent`: the run is a `RoundsMul` (`GolubVanLoan.Chapter01.algorithm_1_1_7_rounds`), then
`FloatingPoint.abs_sub_entrywiseLE_of_roundsMul`. ★

Blocked: chapter 1's programs and bridges (`GolubVanLoan.Chapter01.algorithm_1_1_7_rounds`) are not on this branch (surf2, base 1914bd7e) (agent surf1 writes chapter 1 in parallel). Once they land the statement is a direct instance of the cited backbone lemmas (~10 lines).'''
deps = ["equation_2_7_19", "GolubVanLoan.Chapter01.algorithm_1_1_7_rounds", "FloatingPoint.abs_sub_entrywiseLE_of_roundsMul"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.19)'

