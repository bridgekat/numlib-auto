namespace = "GolubVanLoan.Chapter02"
desc = '''
§2.7, Finite Precision Matrix Computations: the 3-digit calculator and the IEEE double format as
instances of `FloatingPoint.System` (§2.7.1–2.7.2, (2.7.2)–(2.7.3)), the model (2.7.4)–(2.7.6),
non-associativity (Maxim 1), storage (2.7.7), the dot product analysis (2.7.9)–(2.7.12) with Lemma
2.7.1, the basic operations (2.7.15)–(2.7.20), the 2-by-2 backward error example (§2.7.9), the
nonnegative-product remark (§2.7.10), and the ideal equation solver (2.7.21)–(2.7.22).

Conventions. `fp : FloatingPoint.RoundingModel ℝ` is the book's arithmetic, `u = fp.u`; `fl(x op y)`
is any `z` with `fp.Rounds (x op y) z`. Algorithm results are *runs*: `∀ s ∈ (alg fp.round …).run`
with chapter 1's algorithms (`GolubVanLoan.Chapter01.algorithm_1_1_1` etc., D4 of the brief) and chapter
1's program semantics `Numlib/FloatingPoint/Program` (`FloatingPoint.RoundingModel.round`,
`SetM.mem_run_bind`, `SetM.mem_run_foldlM_update_of_nodup`, `SetM.mem_run_foldlM_of_pi`; Algorithm 1.1.1 is `FloatingPoint.dotAccum rnd
(List.finRange n) x y 0` by `rfl`). The display (2.7.8) *is* Algorithm 1.1.1 and has no node of its own.
The book's analysis starts the accumulation from `s₁ = x₁ y₁ (1 + δ₁)`, i.e. it treats `fl(0 + p) = p`
as exact, while the program rounds `0 + p₁` too. Chapter 1 decided (Program's module description):
the run statements below carry the hypothesis `fp.IsIdempotent` (rounding fixes its own outputs; true of
every `FloatingPoint.System`), under which a run is a `FloatingPoint.RoundsDot`
(`FloatingPoint.roundsDot_of_mem_run_dotAccum`) and the book's constants hold; without it the
unconditional `FloatingPoint.abs_sub_le_of_mem_run_dotAccum` pays `γ_{n+1}`, which the descriptions
mention where relevant. First-order bounds `… + O(u²)` are stated in the rigorous `γ_n` form of
`FloatingPoint.gamma`, or with the `u²` term explicit where the book's derivation gives it.
'''

[[node]]
id = "calculator3"
kind = "definition"
desc = '''§2.7.1: the toy calculator `± d₀.d₁d₂ × 10^e`, `1 ≤ d₀ ≤ 9`, `-9 ≤ e ≤ 9`, is `FloatingPoint.System` with
`β = 10`, `t = 3`, `L = -8`, `U = 10` (the backbone's mantissa convention `0.d₀d₁d₂ × 10^{e+1}` shifts
the exponent range by one): `⟨10, 3, -8, 10, by norm_num, by norm_num, by norm_num⟩` (prototype
`notes/gvl/ch02/proto/Shapes.lean` elaborates it). ★'''
deps = ["FloatingPoint.System"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.1, Definition'

[[node]]
id = "calculator3_card"
kind = "theorem"
desc = '''§2.7.1: the calculator has `2 × 9 × 10 × 10 × 19 + 1 = 34201` floating point numbers:
`((calculator3.finset ℚ).card : ℤ) = 34201` — `rw [FloatingPoint.System.card_finset]; norm_num
[calculator3]` (checked in the prototype). ★'''
deps = ["calculator3", "FloatingPoint.System.card_finset"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.1'

[[node]]
id = "calculator3_range"
kind = "theorem"
desc = '''§2.7.1: `N_min = 1.00 × 10⁻⁹` and `N_max = 9.99 × 10⁹`, i.e. `calculator3.xmin ℝ = 10 ^ (-9 : ℤ)` and
`calculator3.xmax ℝ = 999 / 100 * 10 ^ 9`, and between `1.00 × 10^e` and `1.00 × 10^{e+1}` (`-9 ≤ e ≤ 9`) the
numbers are exactly `m × 10^{e-2}`, `100 ≤ m ≤ 999` (spacing `10^{e-2}`) — `FloatingPoint.System.xmin`,
`FloatingPoint.System.xmax` unfolded, `FloatingPoint.System.numbers_inter_Ico`. ★'''
deps = ["calculator3", "FloatingPoint.System.xmin", "FloatingPoint.System.xmax", "FloatingPoint.System.numbers_inter_Ico"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.1'

[[node]]
id = "equation_2_7_2"
kind = "theorem"
desc = '''(2.7.2): the normalized IEEE doubles are the values `± (1.b₁…b₅₂)₂ × 2^{E - 1023}` with `1 ≤ E ≤ 2046`:
`{x | ∃ (σ : ℤˣ) (b : Fin 52 → Bool) (E : ℕ), 1 ≤ E ∧ E ≤ 2046 ∧ x = σ * (1 + ∑ i, (b i).toNat * 2 ^
(-(i + 1 : ℤ))) * 2 ^ ((E : ℤ) - 1023)} = FloatingPoint.System.numbers ieeeDouble ℝ \ {0}` (the backbone's
`𝔽(2, 53, -1021, 1024)`: mantissa `m = 2^52 + ∑ b_i 2^{51-i}`, exponent `e = E - 1022`). Binary digit
bookkeeping (Mathlib `Nat.ofDigits`/`Finset.sum` over `Fin 52`). ★★ (~60 lines)'''
deps = ["FloatingPoint.System.ieeeDouble", "FloatingPoint.System.numbers"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.2)'

[[node]]
id = "equation_2_7_3"
kind = "theorem"
desc = '''(2.7.3): the zero and subnormal doubles are `± (0.b₁…b₅₂)₂ × 2^{-1022}`: that set equals
`FloatingPoint.System.denormalized ieeeDouble ℝ ∪ {0}` (the backbone's `± m 2^{L-t} = ± m 2^{-1074}`,
`1 ≤ m < 2^52`), and it is uniformly spaced between `-N_min` and `N_min`. ★★'''
deps = ["FloatingPoint.System.ieeeDouble", "FloatingPoint.System.denormalized", "equation_2_7_2"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.3)'

[[node]]
id = "ieeeDouble_constants"
kind = "theorem"
desc = '''§2.7.2: for the double format the machine epsilon (gap between `1` and the next double) is `2^{-52}`,
`N_min = 2^{-1022}` and `N_max = (2 - 2^{-52}) 2^{1023}` — backbone
`FloatingPoint.System.ieeeDouble_machineEps`, `…_xmin`, `…_xmax`, and `FloatingPoint.System.isLeast_machineEps`
for "gap between 1 and the next". ★'''
deps = ["FloatingPoint.System.ieeeDouble_machineEps", "FloatingPoint.System.ieeeDouble_xmin", "FloatingPoint.System.ieeeDouble_xmax", "FloatingPoint.System.isLeast_machineEps"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.2'

[[node]]
id = "ieeeDouble_round_nearest"
kind = "theorem"
desc = '''§2.7.2: round-to-nearest in the normalized range has relative error at most `2^{-53}`: if `N_min ≤ |x| ≤
N_max` and `y` is a double nearest to `x`, then `|y - x| / |x| ≤ 2^{-53}`. The book's round-half-to-even
(the `lsb` rule) is one choice of nearest `y`, so it is covered without modelling bits. Backbone
`FloatingPoint.System.abs_sub_le_of_forall_abs_sub_le` and `FloatingPoint.System.ieeeDouble_unitRoundoff`. ★'''
deps = ["FloatingPoint.System.abs_sub_le_of_forall_abs_sub_le", "FloatingPoint.System.ieeeDouble_unitRoundoff", "ieeeDouble_constants"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.2'

[[node]]
id = "equation_2_7_4"
kind = "theorem"
desc = '''(2.7.4): `fl(x) = x (1 + δ)`, `|δ| ≤ u` — for the relational model `FloatingPoint.RoundingModel.Rounds.exists_delta`,
and concretely for a system's rounding `FloatingPoint.System.exists_round_eq_mul_one_add`. ★'''
deps = ["FloatingPoint.RoundingModel.Rounds.exists_delta"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.4)'

[[node]]
id = "equation_2_7_5"
kind = "theorem"
desc = '''(2.7.5): `u = ½ × (gap between 1 and the next larger floating point number)`: for a system with `t ≥ 2`,
`L ≤ 1 ≤ U`, `s.unitRoundoff K = s.machineEps K / 2` and `IsLeast {δ | 0 < δ ∧ 1 + δ ∈ s.numbers K}
(s.machineEps K)` — backbone `FloatingPoint.System.unitRoundoff_eq_machineEps_div_two`,
`FloatingPoint.System.isLeast_machineEps`; "about `10⁻⁷` (single), `10⁻¹⁶` (double)" is
`ieeeSingle_unitRoundoff = 2⁻²⁴`, `ieeeDouble_unitRoundoff = 2⁻⁵³`. ★'''
deps = ["FloatingPoint.System.unitRoundoff_eq_machineEps_div_two", "FloatingPoint.System.isLeast_machineEps", "FloatingPoint.System.ieeeDouble_unitRoundoff"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.5)'

[[node]]
id = "equation_2_7_6"
kind = "theorem"
desc = '''(2.7.6), the fundamental axiom: for floating point `x`, `y` and `op ∈ {+, -, ×, /}`, `fl(x op y) = (x op y)(1
+ δ)`, `|δ| ≤ u`, and the relative-error form for `x op y ≠ 0` — backbone
`FloatingPoint.System.exists_op_eq_mul_one_add` (a system), `FloatingPoint.RoundingModel.Rounds.exists_delta`
