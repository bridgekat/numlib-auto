kind = "theorem"
desc = '''§2.7.10: for entrywise nonnegative `A`, `B` (`A.EntrywiseNonneg`, `B.EntrywiseNonneg`), every run `Ĉ`
of (2.7.19) has small componentwise relative error, `|Ĉ - C| ≤ γ_r |C|` with `C = A B` (`|A||B| = AB`).
The book's contrast with Strassen's method is not formalized (chapter group, Not formalized). ★'''
deps = ["equation_2_7_19", "Matrix.abs"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.10'

[[node]]
id = "equation_2_7_21"
kind = "theorem"
desc = '''(2.7.21): if `fl(A) = A + E` and `fl(b) = b + e` are entrywise roundings (`fp.Rounds (A i j) (Â i j)`,
`fp.Rounds (b i) (b̂ i)`), then `‖E‖_∞ ≤ u ‖A‖_∞` and `‖e‖_∞ ≤ u ‖b‖_∞`. From (2.7.7) entrywise and
`Matrix.linfty_opNorm_le_mul_of_abs_entrywiseLE`, `Matrix.norm_le_norm_of_abs_le` (vectors). ★'''
deps = ["equation_2_7_7", "Matrix.linfty_opNorm_le_mul_of_abs_entrywiseLE", "Matrix.norm_le_norm_of_abs_le"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.21)'

[[node]]
id = "equation_2_7_22"
kind = "theorem"
desc = '''(2.7.22): the ideal solver. `A` nonsingular, `A x = b`, `b ≠ 0`, `(A + E) x̂ = b + e` with (2.7.21)'s bounds
and `u κ_∞(A) ≤ 1/2` ⇒ `‖x - x̂‖_∞ / ‖x‖_∞ ≤ 4 u κ_∞(A)`. Theorem 2.6.2 at `ε = u`, `r = u κ_∞ ≤ 1/2`:
`2u / (1 - r) · κ ≤ 4 u κ`. "Best possible" is prose. ★'''
deps = ["theorem_2_6_2", "equation_2_7_21"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.22)'
