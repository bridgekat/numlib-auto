deps = ["FloatingPoint.System.exists_op_eq_mul_one_add", "FloatingPoint.RoundingModel.Rounds.exists_delta"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.6)'

[[node]]
id = "calculator3_add_not_assoc"
kind = "theorem"
desc = '''§2.7.4, Maxim 1: floating point addition is not associative. In `calculator3` with `x = 1.24`, `y = -1.23`,
`z = 1.00 × 10⁻³`: `fl(fl(x + y) + z) = 1.10 × 10⁻²` but `fl(x + fl(y + z)) = 1.00 × 10⁻²`
(`FloatingPoint.System.add` over `ℚ`; `rw [FloatingPoint.System.round_eq_of_le_of_lt (e := …)]; norm_num`,
the recipe of `notes/lessons.md` "the floating-point number system"). ★'''
deps = ["calculator3", "FloatingPoint.System.round_eq_of_le_of_lt"]
source = 'Golub–Van Loan, Matrix Computations, §2.7.4'

[[node]]
