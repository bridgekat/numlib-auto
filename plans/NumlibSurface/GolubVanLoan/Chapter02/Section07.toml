[[node]]
id = "equation_2_7_9"
kind = "theorem"
desc = '''(2.7.9): every run `s ∈ (Chapter01.algorithm_1_1_1 fp.round x y).run` of the dot product (2.7.8) has
partial sums `s_p` with `s_1 = x₁ y₁ (1 + δ₁)` and `s_p = (s_{p-1} + x_p y_p (1 + δ_p))(1 + ε_p)`, `|δ_p|,
|ε_p| ≤ u`, `s = s_n`, assuming `fp.IsIdempotent` (which makes the first addition `0 + p₁` exact).
Chapter 1's `FloatingPoint.mem_run_dotAccum_iff` (a run is a list of rounded products and a `RoundsSumFrom`
from `0`), then `FloatingPoint.RoundingModel.Rounds.exists_delta` at each step. ★★

Blocked: chapter 1's programs and bridges (`GolubVanLoan.Chapter01.algorithm_1_1_1`, `…_eq_dotAccum`) are not on this branch (surf2, base 1914bd7e) (agent surf1 writes chapter 1 in parallel). Once they land the statement is a direct instance of the cited backbone lemmas through `FloatingPoint.mem_run_dotAccum_iff` and `Rounds.exists_delta` (~40 lines, an induction over the partial sums).'''
deps = ["GolubVanLoan.Chapter01.algorithm_1_1_1", "GolubVanLoan.Chapter01.algorithm_1_1_1_eq_dotAccum", "FloatingPoint.mem_run_dotAccum_iff", "FloatingPoint.RoundingModel.IsIdempotent", "FloatingPoint.RoundingModel.Rounds.exists_delta"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.9)'

[[node]]
id = "equation_2_7_10"
kind = "theorem"
desc = '''(2.7.10): every run `s` of Algorithm 1.1.1 satisfies `s = ∑ k, x k * y k * (1 + γ_k)` with `1 + γ_k =
(1 + δ_k) ∏_{j ≥ k} (1 + ε_j)` (`ε₁ = 0`), hence `|s - xᵀ y| ≤ ∑ k, |x k * y k| * |γ_k|` and `|γ_k| ≤ (1 + u)^n
- 1` (the book's `γ_k` is not `FloatingPoint.gamma`). Backbone
`FloatingPoint.exists_eq_sum_mul_one_add_of_roundsDot` through chapter 1's bridge
`GolubVanLoan.Chapter01.algorithm_1_1_1_rounds` (hypothesis `fp.IsIdempotent`). ★★

Blocked: chapter 1's programs and bridges (`GolubVanLoan.Chapter01.algorithm_1_1_1_rounds`) are not on this branch (surf2, base 1914bd7e) (agent surf1 writes chapter 1 in parallel). Once they land the statement is a direct instance of the cited backbone lemmas (`FloatingPoint.exists_eq_sum_mul_one_add_of_roundsDot`, ~15 lines).'''
deps = ["equation_2_7_9", "FloatingPoint.exists_eq_sum_mul_one_add_of_roundsDot", "GolubVanLoan.Chapter01.algorithm_1_1_1_rounds"]
source = 'Golub–Van Loan, Matrix Computations, Equation (2.7.10)'

