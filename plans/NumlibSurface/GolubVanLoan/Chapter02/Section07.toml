desc = '''(2.7.9): every run `s ∈ (Chapter01.algorithm_1_1_1 fp.round x y).run` of the dot product (2.7.8) has
partial sums `s_p` with `s_1 = x₁ y₁ (1 + δ₁)` and `s_p = (s_{p-1} + x_p y_p (1 + δ_p))(1 + ε_p)`, `|δ_p|,
