desc = '''
Golub–Van Loan, *Matrix Computations* (4th ed.), Chapter 11, *Large Sparse Linear System Problems*:
§11.1 direct methods (storage, ordering, fill), §11.2 the classical iterations, §11.3 conjugate
gradients, §11.4 other Krylov methods, §11.5 preconditioning, §11.6 multigrid. Namespace
`GolubVanLoan.Chapter11`, one module per section. Planned 2026-09-24 by agent `ch11`
(`notes/gvl/ch11/report.md`, inventory `notes/gvl/ch11/inventory.md`, prototype
`notes/gvl/ch11/proto/Shapes.lean`).

## Conventions (all sections)

* Real matrices `Matrix (Fin n) (Fin n) ℝ` and vectors `Fin n → ℝ`, 0-based: the book's `x_i`, `a_ij`
  (`i, j = 1:n`) are `x (i−1)`, `A (i−1) (j−1)`; iterate superscripts/subscripts `x⁽ᵏ⁾`, `x_k` keep their
  `k ≥ 0`. Krylov statements are about `T := Matrix.toEuclideanLin A` on `EuclideanSpace ℝ (Fin n)`,
  vectors transported by `WithLp.toLp 2`.
* The book's `L_A, D_A, U_A` are `strictLower A`, `diagPart A`, `strictUpper A` (Saad's `E = −L_A`,
  `F = −U_A`, used by the book itself in §11.5.3); splittings are `Stationary.Splitting`, the spectral
  radius `ρ(G)` of a real matrix is `Matrix.complexSpectralRadius G` (complexification; `ℝ≥0∞`).
* Lanczos and CG indices: the book's `q_j, α_j, β_j` (`j ≥ 1`) are the backbone's `Arnoldi.vec T r₀ (j−1)`,
  `Lanczos.alpha T r₀ (j−1)`, `Lanczos.beta T r₀ (j−1)`; the book's Hestenes–Stiefel `p_k, μ_k` (`k ≥ 1`)
  are `(CG.iterate (k−1)).p`, `CG.alpha` at `k − 1`. `κ₂(A)` is `NormedRing.condNumber A` under
  `Matrix.Norms.L2Operator`; `φ(x) = ½xᵀAx − xᵀb` is `energyFunctional`, `‖v‖_A` is `energyNorm`.
* Cholesky: the book's lower `G` with `A = GGᵀ` is `Hᵀ` for the backbone's `Matrix.IsCholesky A H`
  (`H` upper, `Hᴴ H = A`).

## Algorithms (decision D4)

Every numbered algorithm — Algorithms 11.3.1, 11.3.2, 11.3.3, 11.4.2, 11.5.1, 11.5.2 — and every
algorithm written out as a numbered display or figure with a claim attached ((11.1.1), (11.1.2),
(11.1.8), (11.1.9), (11.2.2), (11.2.3), the SOR/SSOR sweeps, (11.3.14), (11.3.26), (11.5.5), Figures
11.3.1 and 11.4.1, `incChol`, the Lin–Moré factorization, the Chebyshev semi-iteration, the two-grid
cycle (11.6.16)) is a monadic program over a rounding hook `rnd : ℝ → M ℝ` in the book's operation
order, built from ch01's Algorithms 1.1.1–1.1.3; `while` loops take `fuel : ℕ` as the last explicit
argument (a tolerance precedes it) and a `done` flag; solves with a preconditioner or a small matrix
are routine arguments (exact semantics: the inverse). The numbered conventions 1–14 of
`NumlibSurface/GolubVanLoan` govern (in particular convention 1: the arithmetic of a stopping test,
`δ = tol·‖b‖₂`, `‖r‖₂`, is rounded, the comparison is exact). Programs written out as numbered
displays are **content-named** (the `GolubVanLoan` naming rule), their exact-spec theorems keeping the
display number: (11.1.1) `sparseGaxpy`, (11.1.2) `sparseOuterProductUpdate`, (11.1.8)
`choleskyWithPivoting`, (11.1.9) `rowGivensQR`, (11.2.2) `jacobiSweep`, (11.2.3) `gaussSeidelSweep`,
(11.2.16) `adiStep`, (11.2.20) `sorSweep`, (11.3.14) `preliminaryCG`, (11.3.26) `practicalCG`, (11.5.5)
`concusGolubOLearyPCG`, (11.6.16) `twoGridCycle`; and the definitional displays are content-named too:
(11.2.10) `poissonMatrix`, (11.2.11) `modelT`, (11.2.14) `modelEEigenvalues`, (11.2.28)
`semiIterativeCombination`, (11.6.3) `modelA`, (11.6.5) `modelAEigenvalues`, (11.6.6) `modelQ`, (11.6.7)
`modelS`, (11.6.8) `modelC`, (11.6.14) `restrictionMatrix`/`prolongationMatrix`, (11.6.15) `modelB`,
(11.6.18) `twoGridErrorOperator`.
Specs are exact-arithmetic identifications with the backbone recurrences (`CG.iterate`,
`Krylov.PCG.iterate`, `Krylov.CGNR.iterate`, `BCG.iterate`, the sweeps of `Numlib/Stationary/Sweep`, the
Arnoldi/Givens layer of `Numlib/Krylov/Hessenberg`). The book analyses no rounding error in this
chapter (§11.3.8 says only that orthogonality is lost), so no `SetM` theorem is planned except the
rounding-independent `linMoreIC_nnz_le`. There is no Algorithm 11.4.1 in the source.

