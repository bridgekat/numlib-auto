## Not formalized (by class, with the reason)

* Operation counts, flop and memory estimates, and complexity claims (§11.1.2 "`2·nnz(A)` flops",
  §11.1.7 "`O(n^{3/2})` work, `O(n log n)` fill", the per-iteration costs of §11.3–11.5, the `O(n)`
  V-cycle) — decision of the round.
* Numerical examples and illustrations: the 9×9 matrix (11.1.5) and its profiles, the Davis e-tree
  example, the `n = 7` matrices (11.6.13) and the mangled `n = 7` block display of §11.6.3; Problems;
  Notes and References.
* Heuristics without a precise statement: the Sparse Cholesky/QR/LU "challenges", choosing `P` to
  minimize `nnz(G)`, Markowitz pivoting and the threshold `τ`, row orderings for sparse QR, the
  "starting node with far-away neighbours" advice, the elimination tree (defined in prose, no theorem),
  "the more dominant the diagonal the faster" (refuted by the book's own P11.2.3), the
  when-to-use-what discussion of §11.4, Criteria 1–2 and the cost inequality of §11.5.1, the
  Toeplitz/circulant preconditioners of §11.5.4 (T. Chan's and Strang's choices are definitions with
  no claim), drop-tolerance incomplete Cholesky and `ILU(ℓ)`, the effectiveness of the HSS saddle-point
  preconditioner, §11.6.5.
* "Assuming no numerical cancellation" statements: the nonzero direction of Facts 1–2 (§11.1.6) and
  the literal structural-symmetry claim of §11.1.9 — no exact reading without a genericity framework;
  the exact halves (vanishing off the fill; symbolic symmetry) are nodes, and the literal §11.1.9
  claim has a counterexample node.
* Claims quoted, not proved, in the text: Björck's accuracy of the seminormal equations with one
  refinement step, the convergence rate of multigrid being independent of `n`, "CGS typically
  outperforms BiCG", superiority of reverse Cuthill–McKee.
* The PDE (11.6.1), the Poisson problem on an L-shaped domain of §11.5.11 and all "discretizes"
  claims (Saad-round rule, `notes/backbone.md` §12.5); the V-cycle `mgV` and full multigrid (no
  property stated).
* Storage *as such* (the compressed-column format has no theory; its two algorithms (11.1.1)–(11.1.2)
  are nodes by the storage-format-algorithm rule).

