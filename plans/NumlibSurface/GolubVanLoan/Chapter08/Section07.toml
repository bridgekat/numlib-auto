namespace = "GolubVanLoan.Chapter08"
desc = '''
§8.7, generalized eigenvalue problems with symmetry: the symmetric-definite problem (8.7.1)
(congruence invariance, Theorem 8.7.1, Corollary 8.7.2, the Crawford number (8.7.4) and Theorem
8.7.3), its Cholesky–QR solution (Algorithm 8.7.1), the generalized Rayleigh quotient and
orthogonal iterations ((8.7.5)–(8.7.8)), the generalized singular value problem (8.7.2)
(Theorem 8.7.4, Algorithm 8.7.2, the subspace identity after it), the Kogbetliantz 2 × 2 facts
(§8.7.7), and the structured quadratic eigenvalue problem ((8.7.12)–(8.7.18)).

Backbone: `Numlib/Eigen/Pencil` (`Matrix.pencilSpectrum`, `Matrix.HasPencilEigenvector`, the
simultaneous diagonalization) and the new `Numlib/Eigen/SymmetricPencil` (Theorem 8.7.1, sorted
pencil eigenvalues, Crawford number, the corrected Theorem 8.7.3, (8.7.6)–(8.7.7)). The GSVD is
chapter 6's (Theorem 6.1.1, `GolubVanLoan.Chapter06.theorem_6_1_1`, backbone
`Numlib/LinearAlgebra/Matrix/GSVD`), the thin CS decomposition chapter 2's
(`Numlib/LinearAlgebra/Matrix/CSDecomposition`, Theorem 2.5.2).

Algorithms 8.7.1 and 8.7.2 consist of calls to decompositions computed elsewhere (Cholesky, "the
symmetric QR algorithm", a QR factorization, "the CS decomposition", a triangular solve). Per the
`GolubVanLoan` group's convention 5, the steps of earlier chapters call their programs (Cholesky
`Chapter04.algorithm_4_2_1`, the substitutions `Chapter03.algorithm_3_1_1`/`3_1_2`, the thin QR by
modified Gram–Schmidt `Chapter05.algorithm_5_2_6`), and the two steps with no exact program — the
symmetric Schur decomposition (Algorithm 8.3.3 is an iteration that deflates) and the CS
decomposition (no algorithm in the book) — are monadic function parameters (`schur : Matrix → M
(Matrix × (Fin n → ℝ))`, `cs`) whose specifications the spec theorem assumes at `Id`; the shape is
the prototype's `algorithm_8_7_1` (`notes/gvl/ch08/proto/Jacobi.lean`, elaborates). The floating-point
semantics of such a program is then whatever the subroutines' runs are, and no rounding theorem is
planned for them (the book's `‖E_i‖₂ ≈ u‖A‖₂‖B⁻¹‖₂` is a quoted heuristic; the backbone's
two-sided triangular-solve bound `FloatingPoint.frobenius_norm_sub_le_of_roundsTwoSidedSolve`
covers step 2 rigorously should a consumer want it).

Readings and errata. (1) Theorem 8.7.3 as printed is false: `n = 1`, `A = 0`, `B = 1`,
`E_A = √3/4`, `E_B = -1/4` give `ε = 1/2 < c(A, B) = 1`, `λ = 0`, `μ = 1/√3`, and
`|arctan λ - arctan μ| = π/6 > arctan(1/2)`; the correct bound (Stewart's chordal-metric form) is
`sin |arctan λ_i - arctan μ_i| ≤ ε / c`. Its conclusion that the perturbed pencil is
symmetric-definite (`B + E_B` positive definite) is also false in general (`A = 1`, `B = δ` small,
`E_B = -2δ`); the corrected node assumes it. (8.7.4) omits the square root that makes `ε / c`
homogeneous. (2) Algorithm 8.7.1 cites "Algorithm 4.2.2" for the Cholesky factorization; §4.2's
Cholesky algorithm is 4.2.1 (4.2.2 is the `L D Lᵀ` outer product). (3) Algorithm 8.7.2 assumes
`null(A) ∩ null(B) = ∅` for `= {0}` and gives `D_B ∈ ℝ^{m₁×n}` for `ℝ^{m₂×n}`. (4) §8.7.7 writes
`U₁ᵀ F = (U₂ᵀ G) Σ`; from `U₁ᵀ (F G⁻¹) U₂ = Σ` one gets `U₁ᵀ F = Σ (U₂ᵀ G)` (rows scaled, which is
what "the rows of `U₁ᵀF` are parallel to the rows of `U₂ᵀG`" says). (5) §8.7.9: "the eigenvalues
[of the gyroscopic problem] are all purely imaginary" needs `K` positive semidefinite (the book
assumes only `K = Kᵀ`; `M = 1`, `C = 0`, `K = -1` gives `λ = ±1`); planned with the hypothesis and a
counterexample node.
'''

[[node]]
id = "pencil_congruence"
kind = "theorem"
desc = '''§8.7.1: `A - λ B` is singular iff `Xᵀ A X - λ Xᵀ B X` is singular, for nonsingular `X`;
hence `λ(A, B) = λ(Xᵀ A X, Xᵀ B X)` (`λ(A, B) = Matrix.pencilSpectrum A B`, the book's
`{λ | det(A - λB) = 0}`; eigenvector: `A x = λ B x`, `x ≠ 0`, `Matrix.HasPencilEigenvector`).
`Matrix.pencilSpectrum_mul_mul_of_isUnit` with `U = Xᵀ`, `Z = X`. ★'''
deps = ["Matrix.pencilSpectrum", "Matrix.HasPencilEigenvector", "Matrix.pencilSpectrum_mul_mul_of_isUnit"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.1'

[[node]]
id = "theorem_8_7_1"
kind = "theorem"
desc = '''Theorem 8.7.1 with (8.7.3): for symmetric `A`, `B` and `C(μ) = μ A + (1 - μ) B`, if some
`μ ∈ [0, 1]` has `C(μ)` positive semidefinite and `null(C(μ)) = null(A) ∩ null(B)`, then there is
a nonsingular `X` with `Xᵀ A X` and `Xᵀ B X` both diagonal.
`Matrix.exists_isUnit_conj_diagonal_of_posSemidef_combination` at `ℝ` (the book's proof). ★'''
deps = ["Matrix.exists_isUnit_conj_diagonal_of_posSemidef_combination"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.7.1'

[[node]]
id = "corollary_8_7_2"
kind = "theorem"
desc = '''Corollary 8.7.2: if `A - λ B` is symmetric-definite (`A` symmetric, `B` positive definite)
there is a nonsingular `X = [x₁ | ⋯ | x_n]` with `Xᵀ A X = diagonal a`, `Xᵀ B X = diagonal b`, and
`A x_i = λ_i B x_i` with `λ_i = a_i / b_i`. `Matrix.exists_simultaneous_diagonalization` (which gives
`b = 1`) or `theorem_8_7_1` at `μ = 0`, then `Matrix.hasPencilEigenvector_col_of_conj_eq_diagonal`
(`b_i = x_iᵀ B x_i > 0`). ★'''
deps = ["theorem_8_7_1", "Matrix.exists_simultaneous_diagonalization", "Matrix.hasPencilEigenvector_col_of_conj_eq_diagonal"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 8.7.2'

[[node]]
id = "crawfordNumber"
kind = "definition"
desc = '''(8.7.4), the Crawford number: `crawfordNumber A B := Matrix.crawfordNumber A B` at `ℝ`,
`min_{‖x‖₂ = 1} √((xᵀAx)² + (xᵀBx)²)` — with the square root the book's display omits (the squared
quantity is `crawfordNumber A B ^ 2`; the section description explains why the unsquared one is the
one Theorem 8.7.3 needs). ★'''
deps = ["Matrix.crawfordNumber"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.7.4)'

[[node]]
id = "theorem_8_7_3"
kind = "theorem"
desc = '''Theorem 8.7.3, corrected (the printed form is false, `theorem_8_7_3_counterexample`): for a
symmetric-definite `A - λ B` with eigenvalues `λ_1 ≥ ⋯ ≥ λ_n` (`Matrix.pencilEigenvalues`,
reindexed to `Fin n`), symmetric `E_A`, `E_B` with `ε² = ‖E_A‖₂² + ‖E_B‖₂² < c(A, B)²` and
`B + E_B` positive definite, the eigenvalues `μ_1 ≥ ⋯ ≥ μ_n` of `(A + E_A) - λ (B + E_B)` satisfy
`Real.sin |arctan λ_i - arctan μ_i| ≤ ε / c(A, B)` for `i = 1:n`.
`Matrix.sin_abs_arctan_pencilEigenvalues_sub_le` at `ℝ`. ★'''
deps = ["crawfordNumber", "Matrix.pencilEigenvalues", "Matrix.sin_abs_arctan_pencilEigenvalues_sub_le"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.7.3'

[[node]]
id = "theorem_8_7_3_counterexample"
kind = "theorem"
desc = '''Theorem 8.7.3 is false as printed: for `n = 1`, `A = 0`, `B = 1`, `E_A = √3/4`,
`E_B = -1/4`, the hypotheses hold (`ε = 1/2`, `c(A, B) = 1` with or without the square root, so
`ε² < c` and `ε < c`) and `λ₁ = 0`, `μ₁ = (√3/4)/(3/4) = 1/√3`, but
`|arctan 0 - arctan (1/√3)| = π/6 > arctan (1/2)` (`Real.arctan_inv_sqrt_three`-type value
`π/6 ≈ 0.5236`, `arctan (1/2) < 0.4637 + 10⁻⁴`, e.g. from `Real.arctan_lt` bounds or
`arctan x < x`: `arctan (1/2) < 1/2 < π/6`). Stated as the negation of the printed claim for this
instance. ★'''
deps = ["crawfordNumber"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.7.3'

[[node]]
id = "algorithm_8_7_1"
kind = "definition"
desc = '''Algorithm 8.7.1 (Cholesky + symmetric QR for `A x = λ B x`), per D4 (convention 5 of the
`GolubVanLoan` group: steps of earlier chapters call their programs, the rest are parameters):
`algorithm_8_7_1 rnd schur A B : M (Matrix × (Fin n → ℝ))` — `G ← Chapter04.algorithm_4_2_1 rnd B`
(the lower triangle of the result; the book cites "Algorithm 4.2.2", a misprint for 4.2.1);
`C ← G⁻¹ A G⁻ᵀ` as two column-by-column forward substitutions (`Chapter03.algorithm_3_1_1`, the
second on the transpose of the first result; symmetric `A` makes the transpose harmless);
`(Q, a) ← schur C`; `X ← G⁻ᵀ Q` column by column by back substitution (`Chapter03.algorithm_3_1_2`
on `Gᵀ`); return `(X, a)`. `schur` stays a monadic parameter: the book's "symmetric QR algorithm"
is this chapter's Algorithm 8.3.3, an iteration with fuel and tolerance whose exact output is
diagonal only up to its deflation perturbation, so it cannot meet the exact-diagonalization
specification the spec assumes. Shape: the prototype's `algorithm_8_7_1`
(`notes/gvl/ch08/proto/Jacobi.lean`), with `chol` and `trsm` replaced by the calls. ★'''
deps = ["GolubVanLoan.Chapter04.algorithm_4_2_1", "GolubVanLoan.Chapter03.algorithm_3_1_1", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.1'

[[node]]
id = "algorithm_8_7_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.7.1: if `schur C` returns an orthogonal `Q` and `a` with
`Qᵀ C Q = diagonal a` for symmetric `C`, then for symmetric `A` and positive-definite `B` the
output `(X, a)` of `Id.run (algorithm_8_7_1 pure schur A B)` has `Xᵀ A X = diagonal a`,
`Xᵀ B X = 1`. The Cholesky step is `Chapter04.algorithm_4_2_1_spec` (`G = Matrix.cholesky B`, lower
triangular with positive diagonal, `B = G Gᵀ`), the solves `Chapter03.algorithm_3_1_1_spec` /
`algorithm_3_1_2_spec` column by column (`G⁻¹ Y`, `G⁻ᵀ Q`). ★'''
deps = ["algorithm_8_7_1", "Matrix.IsCholesky", "GolubVanLoan.Chapter04.algorithm_4_2_1_spec", "GolubVanLoan.Chapter03.algorithm_3_1_1_spec", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.1'

[[node]]
id = "pencil_eq_cholesky_spectrum"
kind = "theorem"
desc = '''§8.7.2, after Algorithm 8.7.1: for `B = G Gᵀ` (`G` nonsingular),
`λ(A, B) = λ(A, G Gᵀ) = λ(G⁻¹ A G⁻ᵀ, I) = λ(C) = {a₁, …, a_n}`: `Matrix.pencilSpectrum A B =
spectrum ℝ (G⁻¹ * A * G⁻¹ᵀ)` and, with `algorithm_8_7_1_spec`, `= Set.range a`.
`pencil_congruence` with `X = G⁻ᵀ` and `Matrix.pencilSpectrum_one`. ★'''
deps = ["pencil_congruence", "algorithm_8_7_1_spec", "Matrix.pencilSpectrum"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.2'

