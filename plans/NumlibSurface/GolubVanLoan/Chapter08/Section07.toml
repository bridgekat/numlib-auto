[[node]]
id = "algorithm_8_7_2"
kind = "definition"
desc = '''Algorithm 8.7.2 (GSVD, tall full-rank version), per D4 (convention 5 of the `GolubVanLoan`
group): `algorithm_8_7_2 rnd cs A B : M (Matrix × Matrix × Matrix × (ℕ → ℝ) × (ℕ → ℝ))` —
`(Q, R) ← Chapter05.algorithm_5_2_6 rnd (fromRows A B)` (modified Gram–Schmidt, the thin QR of the
stacked `(m₁ + m₂) × n` matrix, `Q = [Q₁; Q₂]`); `(U₁, U₂, V, α, β) ← cs Q₁ Q₂` (the thin CS
decomposition `U₁ᵀ Q₁ V = diag α`, `U₂ᵀ Q₂ V = diag β`); `X ← R⁻¹ V` column by column by back
substitution (`Chapter03.algorithm_3_1_2`); return `(U₁, U₂, X, α, β)`. `cs` stays a monadic
parameter: the book gives no algorithm for the CS decomposition. ★

Blocked: calls chapter 5's `algorithm_5_2_6` and chapter 3's `algorithm_3_1_2` (agents s05, s03, running).'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_2_6", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.2'

[[node]]
id = "algorithm_8_7_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.7.2: the QR step is a thin QR factorization with positive (so
nonzero) diagonal for the full-column-rank stacked input (`Chapter05.algorithm_5_2_6_spec`), and the
back substitution solves `R X = V` (`Chapter03.algorithm_3_1_2_spec`); if `cs` returns
a thin CS decomposition of a matrix with orthonormal columns (chapter 2's Theorem 2.5.2,
`GolubVanLoan.Chapter02.theorem_2_5_2`, backbone `Numlib/LinearAlgebra/Matrix/CSDecomposition`), and
then for `A`, `B` (`m₁, m₂ ≥ n`) with `null(A) ∩ null(B) = {0}` (so
`[A; B]` has full column rank; the book writes `= ∅`), the output satisfies `U₁ᵀ A X = D_A`,
`U₂ᵀ B X = D_B`, `U₁`, `U₂` orthogonal, `X` nonsingular — a GSVD as in Theorem 8.7.4: `A X = Q₁ R X
= Q₁ V`, `U₁ᵀ Q₁ V = D_A`. ★★

Blocked: on `algorithm_8_7_2`, chapter 2's `theorem_2_5_2` (open on main, CSDecomposition agent dec1) and the chapter 3/5 `_spec`s.'''
deps = ["algorithm_8_7_2", "theorem_8_7_4", "GolubVanLoan.Chapter02.theorem_2_5_2", "GolubVanLoan.Chapter05.algorithm_5_2_6_spec", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.2'

