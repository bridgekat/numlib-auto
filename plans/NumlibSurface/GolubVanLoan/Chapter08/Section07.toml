[[node]]
id = "theorem_8_7_4"
kind = "theorem"
desc = '''Theorem 8.7.4 (GSVD, tall version): for `A : Matrix (Fin m₁) (Fin n) ℝ`,
`B : Matrix (Fin m₂) (Fin n) ℝ` with `m₁ ≥ n`, `m₂ ≥ n`, there are orthogonal `U₁`, `U₂` and
nonsingular `X` with `U₁ᵀ A X = rectDiagonal α` and `U₂ᵀ B X = rectDiagonal β`
(`α, β : ℕ → ℝ`, the book's `diag(α₁, …, α_n)`, `diag(β₁, …, β_n)`). Chapter 6's Theorem 6.1.1
(`GolubVanLoan.Chapter06.theorem_6_1_1`, `Matrix.IsGSVD A B U₁ U₂ X α β` with
`D_A = rectDiagonal α`, `D_B = shiftedRectDiagonal p β`) where `r = rank [A; B] ≤ n ≤ m₂` makes
`p = max(r - m₂, 0) = 0`, so that `D_B = rectDiagonal β` by
`Matrix.shiftedRectDiagonal_zero`. ★★'''
deps = ["GolubVanLoan.Chapter06.theorem_6_1_1", "Matrix.rectDiagonal", "Matrix.shiftedRectDiagonal"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.7.4'

[[node]]
id = "gsvd_columns_and_pencil"
kind = "theorem"
desc = '''§8.7.4, after Theorem 8.7.4 (definitions of the generalized singular values
`σ(A, B) = {α_k/β_k}` and of the right, left-`A` and left-`B` generalized singular vectors): from
`U₁ᵀ A X = D_A`, `U₂ᵀ B X = D_B`: `A X(:,k) = α_k U₁(:,k)`, `B X(:,k) = β_k U₂(:,k)`;
`Xᵀ (AᵀA - λ BᵀB) X = diag(α_k² - λ β_k²)`, so every `X(:,k)` with `β_k ≠ 0` is a generalized
eigenvector of `AᵀA - λ BᵀB` for `λ = (α_k / β_k)²`, and when all `β_k ≠ 0` the pencil's
eigenvalues are exactly the squares of the generalized singular values (`pencil_congruence`); and for
`B = I` an SVD `U₁ᵀ A V = D_A` is a GSVD with `X = U₂ = V`, `D_B = I`. The stationary-value
characterization of `σ(A, B)` (Chu–Funderlic–Golub) is quoted and not a node. ★'''
deps = ["theorem_8_7_4", "pencil_congruence"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.4'

[[node]]
id = "algorithm_8_7_2"
kind = "definition"
desc = '''Algorithm 8.7.2 (GSVD, tall full-rank version), per D4 (convention 5 of the `GolubVanLoan`
group): `algorithm_8_7_2 rnd cs A B : M (Matrix × Matrix × Matrix × (ℕ → ℝ) × (ℕ → ℝ))` —
`(Q, R) ← Chapter05.algorithm_5_2_6 rnd (fromRows A B)` (modified Gram–Schmidt, the thin QR of the
stacked `(m₁ + m₂) × n` matrix, `Q = [Q₁; Q₂]`); `(U₁, U₂, V, α, β) ← cs Q₁ Q₂` (the thin CS
decomposition `U₁ᵀ Q₁ V = diag α`, `U₂ᵀ Q₂ V = diag β`); `X ← R⁻¹ V` column by column by back
substitution (`Chapter03.algorithm_3_1_2`); return `(U₁, U₂, X, α, β)`. `cs` stays a monadic
parameter: the book gives no algorithm for the CS decomposition. ★'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_2_6", "GolubVanLoan.Chapter03.algorithm_3_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.2'

[[node]]
id = "algorithm_8_7_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.7.2: the QR step is a thin QR factorization with positive (so
nonzero) diagonal for the full-column-rank stacked input (`Chapter05.algorithm_5_2_6_spec`), and the
back substitution solves `R X = V` (`Chapter03.algorithm_3_1_2_spec`); if `cs` returns
a thin CS decomposition of a matrix with orthonormal columns (chapter 2's Theorem 2.5.2,
`GolubVanLoan.Chapter02.theorem_2_5_2`, backbone `Numlib/LinearAlgebra/Matrix/CSDecomposition`), and
then for `A`, `B` (`m₁, m₂ ≥ n`) with `null(A) ∩ null(B) = {0}` (so
`[A; B]` has full column rank; the book writes `= ∅`), the output satisfies `U₁ᵀ A X = D_A`,
`U₂ᵀ B X = D_B`, `U₁`, `U₂` orthogonal, `X` nonsingular — a GSVD as in Theorem 8.7.4: `A X = Q₁ R X
= Q₁ V`, `U₁ᵀ Q₁ V = D_A`. ★★'''
deps = ["algorithm_8_7_2", "theorem_8_7_4", "GolubVanLoan.Chapter02.theorem_2_5_2", "GolubVanLoan.Chapter05.algorithm_5_2_6_spec", "GolubVanLoan.Chapter03.algorithm_3_1_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.7.2'

[[node]]
id = "gsvd_subspace_via_rq"
kind = "theorem"
desc = '''§8.7.5, after Algorithm 8.7.2: if `X = R⁻¹ V` and `T Zᵀ = Vᵀ R` with `Z` orthogonal and `T`
upper triangular nonsingular, then `Z T⁻¹ = R⁻¹ V = X`, and for every `k`,
`span{x₁, …, x_k} = span{z₁, …, z_k}` (`X(:,1:k) = Z(:,1:k) T⁻¹(1:k,1:k)`, `T⁻¹` upper triangular —
`Matrix.IsUpperTriangular.inv`-type). Computing `Z`, `T` is P5.2.2's RQ factorization (not a node).
★'''
deps = ["algorithm_8_7_2_spec"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.5'

[[node]]
id = "kogbetliantz_twoByTwo"
kind = "theorem"
desc = '''§8.7.7: for `F G : Matrix (Fin 2) (Fin 2) ℝ`, `G` nonsingular, and an SVD
`U₁ᵀ (F G⁻¹) U₂ = Σ = diag(σ₁, σ₂)`: the generalized singular values of `(F, G)` are `σ₁, σ₂`
(the `α_i/β_i` of any GSVD of `(F, G)` — with `X = G⁻¹ U₂ D` suitably scaled); `U₁ᵀ F = Σ (U₂ᵀ G)`
(the book prints `(U₂ᵀ G) Σ`; rows of `U₁ᵀF` are multiples of the rows of `U₂ᵀG`); and if `Z` is
orthogonal with `U₂ᵀ G Z` upper triangular then `U₁ᵀ F Z = Σ (U₂ᵀ G Z)` is upper triangular.
`F = U₁ Σ U₂ᵀ G`. ★★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §8.7.7'

[[node]]
id = "equation_8_7_13"
kind = "theorem"
desc = '''(8.7.12)–(8.7.14), the quadratic eigenvalue problem: for `M C K : Matrix (Fin n) (Fin n) ℂ`
(real in the book, read over `ℂ` since `λ` and `x` are complex), `(λ² M + λ C + K) x = 0` implies
`(xᴴMx) λ² + (xᴴCx) λ + (xᴴKx) = 0` ((8.7.13)); hence, when `xᴴMx ≠ 0`,
`λ = (-(xᴴCx) ± √((xᴴCx)² - 4 (xᴴMx)(xᴴKx))) / (2 xᴴMx)` for one of the two complex square roots
((8.7.14), stated as `(2 m λ + c)² = c² - 4 m k`). Left multiplication by `xᴴ`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (8.7.13)'

[[node]]
id = "equation_8_7_15"
kind = "theorem"
desc = '''(8.7.15)–(8.7.16), linearizations: for nonsingular `N`, `(λ, x)` solves (8.7.12) with
`x ≠ 0` iff `(λ, (x, u))` with `u = λ x` solves
`[0 N; K C] [x; u] = λ [N 0; 0 -M] [x; u]` ((8.7.15)), iff it solves
`[-K 0; 0 N] [x; u] = λ [C M; N 0] [x; u]` ((8.7.16)); and every eigenvector `(x, u)` of either
linearization has `u = λ x` (from the `N` row) and `x ≠ 0`. `Matrix.fromBlocks_mulVec`. ★'''
deps = ["equation_8_7_13"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.7.15)'

[[node]]
id = "qep_re_nonpos"
kind = "theorem"
desc = '''§8.7.9: if `M`, `C` are real symmetric positive definite and `K` real symmetric positive
semidefinite, every eigenvalue `λ ∈ ℂ` of (8.7.12) has `re λ ≤ 0`. From (8.7.13) with
`m = xᴴMx > 0`, `c = xᴴCx > 0`, `k = xᴴKx ≥ 0` real: the roots of `m λ² + c λ + k` have
nonpositive real part (real roots `≤ 0` when `c² ≥ 4mk`, real part `-c/(2m) < 0` otherwise). ★★'''
deps = ["equation_8_7_13"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.9'

[[node]]
id = "gyroscopic_eigenvalues_imaginary"
kind = "theorem"
desc = '''§8.7.9, the gyroscopic QEP, corrected: if `M` is symmetric positive definite, `C` skew
(`Cᵀ = -C`) and `K` symmetric **positive semidefinite** (the hypothesis the book omits), every
eigenvalue has `re λ = 0`. `xᴴCx` is purely imaginary, `xᴴMx > 0`, `xᴴKx ≥ 0`, so by (8.7.14) the
discriminant `(xᴴCx)² - 4 m k ≤ 0` is real nonpositive and both roots are imaginary. Also the
structured linearization `[0 -K; M 0] [u; x] = λ [M C; 0 M] [u; x]` (with `u = λ x`) is equivalent
to (8.7.12) (as `equation_8_7_15`). ★★'''
deps = ["equation_8_7_13"]
source = 'Golub–Van Loan, Matrix Computations, §8.7.9'

[[node]]
id = "gyroscopic_counterexample"
kind = "theorem"
desc = '''The book's gyroscopic claim without `K ⪰ 0` is false: `n = 1`, `M = 1`, `C = 0` (skew),
`K = -1` (symmetric) give `λ² - 1 = 0`, `λ = ±1`, not purely imaginary. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §8.7.9'

[[node]]
id = "palindromic_reciprocal"
kind = "theorem"
desc = '''§8.7.9, the palindromic QEP `Q(λ) = λ² M + λ C + Mᵀ` with `Cᵀ = C`: for `λ ≠ 0`, `Q(λ)` is
singular iff `Q(1/λ)` is (`Q(1/λ) = λ⁻² Q(λ)ᵀ`, `det_transpose`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §8.7.9'

[[node]]
id = "equation_8_7_18"
kind = "theorem"
desc = '''(8.7.17) ⇒ (8.7.18) (P8.7.10): if `[Mᵀ Mᵀ; C - M Mᵀ] [y; z] = λ [-M Mᵀ - C; -M -M] [y; z]`
then `(λ² M + λ C + Mᵀ)(y + z) = 0`. Add and combine the two block rows (a linear-algebra identity;
`linear_combination` on the block equations after `Matrix.fromBlocks_mulVec`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (8.7.18)'
