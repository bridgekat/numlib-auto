namespace = "GolubVanLoan.Chapter08"
desc = '''
§8.1, properties and decompositions of symmetric matrices: the symmetric Schur decomposition, the
min–max characterization, eigenvalue perturbation (Gershgorin, Wielandt–Hoffman, Weyl,
interlacing, rank-one updates), invariant subspaces and their perturbation, approximate invariant
subspaces and Ritz pairs, and Sylvester's law of inertia.

The chapter's notation `λ_k(A)` (the `k`-th largest eigenvalue) is `symmEigenvalue hA`, a
reindexing of Mathlib's sorted `Matrix.IsHermitian.eigenvalues₀` to `Fin n`; the book's `λ_k` is
`symmEigenvalue hA ⟨k - 1, _⟩`. Nearly every statement delegates to `Numlib/Eigen/MinMax`
(Courant–Fischer, Weyl, Cauchy interlacing — already there — and the appended Wielandt–Hoffman,
two-sided Weyl and low-rank interlacing), `Numlib/Eigen/Perturbation` (the block residual bound
behind Theorem 8.1.13), `Numlib/Eigen/RayleighRitz` (Theorem 8.1.14), `Numlib/LinearAlgebra/Matrix/SVD`
((8.1.3), (8.1.7)), and the new `Numlib/Eigen/Inertia` (Theorem 8.1.17). Theorems 8.1.10–8.1.12
restate chapter 7's invariant-subspace perturbation theorem (Theorem 7.2.4) in the symmetric case,
where `T₁₂ = 0` and the Sylvester separation equals the eigenvalue gap (8.1.2) (P8.1.9).

Readings. Theorem 8.1.13 is proved with constant `1` in place of `√2` (the printed statement does
not pair the `μ_k` injectively with the `λ_k(S)`, so the residual argument suffices); the √2 form
is then immediate. In the proof of Theorem 8.1.16 the book's "`1 − σ_r² = τ`" is not true in
general (`τ = max_i |1 − σ_i²|`), but (8.1.7)'s conclusion `‖Q − X₁‖₂ ≤ τ` is, since
`|1 − σ| ≤ |1 − σ²|` for `σ ≥ 0`. P8.1.5 (the derivative proof of Wielandt–Hoffman) is not used.
'''

[[node]]
id = "symmEigenvalue"
kind = "definition"
desc = '''The book's `λ_k(A)` (§8.1.1: "the `k`th largest eigenvalue", `λ_n(A) ≤ ⋯ ≤ λ_1(A)`): for
`A : Matrix (Fin n) (Fin n) ℝ` with `hA : A.IsSymm`,
`symmEigenvalue hA (k : Fin n) : ℝ := (hA_herm).eigenvalues₀ (Fin.cast (Fintype.card_fin n).symm k)`
where `hA_herm : A.IsHermitian` is the real bridge (`Matrix.IsHermitian` over `ℝ` is `Aᵀ = A`,
`conjTranspose_eq_transpose_of_trivial`). API in the same node: `antitone_symmEigenvalue`
(`eigenvalues₀_antitone`), `symmEigenvalue_mem_spectrum`, and the multiset of values is the root
multiset of `A.charpoly` (`Matrix.IsHermitian.roots_charpoly_eq_eigenvalues₀`). The same
reindexing as `Sturm.eigenvalues` (`Numlib/Eigen/Sturm`). 0-based: the book's `λ_k` is
`symmEigenvalue hA ⟨k - 1, _⟩`. ★'''
deps = ["Sturm.eigenvalues"]
source = 'Golub–Van Loan, Matrix Computations, §8.1.1, Definition'

[[node]]
id = "rayleighQuotient"
kind = "definition"
desc = '''The Rayleigh quotient `r(x) = xᵀAx / xᵀx` of §8.1.1 and §8.2.3 (8.2.6):
`rayleighQuotient A x := (x ⬝ᵥ A *ᵥ x) / (x ⬝ᵥ x)` for `A : Matrix (Fin n) (Fin n) ℝ`,
`x : Fin n → ℝ`. Bridge `rayleighQuotient_eq`: it is
`(Matrix.toEuclideanLin A).rayleighQuotient (WithLp.toLp 2 x)` of Mathlib (`LinearMap.rayleighQuotient`,
real `re ⟪T x, x⟫ / ‖x‖²`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §8.1.1, Definition'

[[node]]
id = "theorem_8_1_1"
kind = "theorem"
desc = '''Theorem 8.1.1 (symmetric Schur decomposition): for symmetric `A : Matrix (Fin n) (Fin n) ℝ`
there is `Q ∈ Matrix.orthogonalGroup (Fin n) ℝ` with `Qᵀ * A * Q = diagonal (symmEigenvalue hA)`
(the diagonal sorted decreasingly, `Λ = diag(λ_1, …, λ_n)`), and for every `k`,
`A *ᵥ Q.col k = symmEigenvalue hA k • Q.col k`. From the sorted backbone decomposition at
`𝕜 = ℝ` (`unitaryGroup (Fin n) ℝ = orthogonalGroup`, `star = transpose`). The book's induction
proof (Householder deflation) is not followed. ★'''
deps = ["symmEigenvalue", "Matrix.IsHermitian.exists_unitary_conj_eq_diagonal_eigenvalues₀"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.1'

[[node]]
id = "l2_opNorm_eq_max_abs_symmEigenvalue"
kind = "theorem"
desc = '''§8.1.1, after Theorem 8.1.1: for symmetric `A` with `n > 0`, the singular values of `A` are
the `|λ_k(A)|` (as multisets: there is `e : Fin n ≃ Fin n` with `Matrix.singularValues A (e k) = |λ_k|`,
from `Matrix.IsHermitian.exists_equiv_singularValues_eq_abs_eigenvalues`), and
`lpOpNorm 2 A = max |λ_1(A)| |λ_n(A)|`. The norm identity is `Matrix.IsHermitian.l2_opNorm_eq`
with `M = max(|λ_1|, |λ_n|)`: every `|λ_k|` is at most it by monotonicity, and it is attained. ★'''
deps = ["symmEigenvalue", "Matrix.IsHermitian.l2_opNorm_eq", "Matrix.IsHermitian.exists_equiv_singularValues_eq_abs_eigenvalues", "Matrix.lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, §8.1.1'

[[node]]
id = "theorem_8_1_2"
kind = "theorem"
desc = '''Theorem 8.1.2 (Courant–Fischer): for symmetric `A` and `k : Fin n`,
`IsGreatest {c | ∃ S : Submodule ℝ (Fin n → ℝ), Module.finrank ℝ S = k + 1 ∧
  IsLeast (rayleighQuotient A '' {y | y ∈ S ∧ y ≠ 0}) c} (symmEigenvalue hA k)` —
`λ_k(A) = max_{dim S = k} min_{0 ≠ y ∈ S} yᵀAy/yᵀy` (book's 1-based `k`). From
`LinearMap.IsSymmetric.isGreatest_eigenvalues` for `toEuclideanLin A` (whose sorted eigenvalues are
`eigenvalues₀` by definition), transporting subspaces along `WithLp.linearEquiv 2 ℝ (Fin n → ℝ)`
and `rayleighQuotient_eq`; the inner min is attained on a nonzero finite-dimensional `S` (the
Rayleigh quotient is continuous on the unit sphere of `S`). The `min_{dim S = n-k+1} max` twin is
recorded in the same node as `theorem_8_1_2_minmax` (`LinearMap.IsSymmetric.isLeast_eigenvalues`).
★★ (bridging, ~60 lines)'''
deps = ["symmEigenvalue", "rayleighQuotient", "LinearMap.IsSymmetric.isGreatest_eigenvalues", "LinearMap.IsSymmetric.isLeast_eigenvalues"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.2'

[[node]]
id = "symmEigenvalue_pos_of_posDef"
kind = "theorem"
desc = '''§8.1.1, last sentence: if `A` is symmetric positive definite (`A.PosDef`), then
`0 < λ_n(A)`, hence every `λ_k(A) > 0`. Mathlib `Matrix.PosDef.eigenvalues_pos` through the
reindexing. ★'''
deps = ["symmEigenvalue"]
source = 'Golub–Van Loan, Matrix Computations, §8.1.1'

[[node]]
id = "theorem_8_1_3"
kind = "theorem"
desc = '''Theorem 8.1.3 (Gershgorin, symmetric form): for symmetric `A`, orthogonal `Q`, and
`Qᵀ A Q = diagonal d + F` with `F i i = 0`, every eigenvalue of `A` lies in
`⋃ i, Set.Icc (d i - r i) (d i + r i)` with `r i = ∑ j, |F i j|`: `spectrum ℝ A ⊆ ⋃ i, Icc …`.
Delegates to chapter 7's restatement of Theorem 7.2.1 (`GolubVanLoan.Chapter07.theorem_7_2_1`, README
layering: not the backbone it rests on) applied to `A.complexify` with `X = Q.complexify`
(`X⁻¹ = Qᵀ`, so `X⁻¹ A X = diagonal d + F` over `ℂ`): a real eigenvalue of `A` is a complex eigenvalue
of `A.complexify` (`Matrix.complexify`, `spectrum.algebraMap_mem_iff`-type transfer), and a complex
closed ball centred at a real `d i` meets `ℝ` in `Icc (d i - r i) (d i + r i)`. The book's proof
through Lemma 2.3.3 is not needed. ★★'''
deps = ["GolubVanLoan.Chapter07.theorem_7_2_1"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.3'

[[node]]
id = "theorem_8_1_4"
kind = "theorem"
desc = '''Theorem 8.1.4 (Wielandt–Hoffman): for symmetric `A` and `E` (so `A + E` symmetric),
`∑ k, (λ_k(A + E) - λ_k(A)) ^ 2 ≤ ‖E‖_F ^ 2` (Frobenius norm, scoped `Matrix.Norms.Frobenius`).
`Matrix.IsHermitian.hoffman_wielandt` at `𝕜 = ℝ` with `A + E` and `A`, reindexed. The book gives no
proof (Wilkinson AEP, Stewart–Sun, Lax). ★'''
deps = ["symmEigenvalue", "Matrix.IsHermitian.hoffman_wielandt"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.4'

[[node]]
id = "theorem_8_1_5"
kind = "theorem"
desc = '''Theorem 8.1.5: for symmetric `A`, `E` (`n > 0`) and every `k`,
`λ_k(A) + λ_n(E) ≤ λ_k(A + E) ≤ λ_k(A) + λ_1(E)`, i.e. with `symmEigenvalue hE ⟨n - 1, _⟩` and
`symmEigenvalue hE ⟨0, _⟩`. `LinearMap.IsSymmetric.eigenvalues_add_mem_Icc` for the Euclidean
operators. ★'''
deps = ["symmEigenvalue", "LinearMap.IsSymmetric.eigenvalues_add_mem_Icc"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.5'

[[node]]
id = "corollary_8_1_6"
kind = "theorem"
desc = '''Corollary 8.1.6 (Weyl): for symmetric `A`, `E` and every `k`,
`|λ_k(A + E) - λ_k(A)| ≤ lpOpNorm 2 E`. `LinearMap.IsSymmetric.abs_eigenvalues_sub_le_opNorm` for
`toEuclideanCLM`, with `‖toEuclideanCLM E‖ = lpOpNorm 2 E` (the `ℓ²` operator norm; `lpOpNorm_two`
