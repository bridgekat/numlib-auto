kind = "theorem"
desc = '''Theorem 8.1.15: for symmetric `A`, `Q₁` with `Q₁ᵀ Q₁ = 1`, an orthogonal `Z` with
`Zᵀ (Q₁ᵀ A Q₁) Z = diagonal θ` and `y_k = (Q₁ * Z).col k`: for every `k`,
`‖A y_k - θ_k y_k‖₂ = ‖(1 - Q₁ Q₁ᵀ) A Q₁ Z e_k‖₂ ≤ lpOpNorm 2 ((1 - Q₁ * Q₁ᵀ) * A * Q₁)`.
