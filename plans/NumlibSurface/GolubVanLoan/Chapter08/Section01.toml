deps = ["symmEigenvalue", "LinearMap.IsSymmetric.abs_eigenvalues_sub_le_opNorm", "Matrix.lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 8.1.6'

[[node]]
id = "theorem_8_1_7"
kind = "theorem"
desc = '''Theorem 8.1.7 (interlacing): for symmetric `A : Matrix (Fin n) (Fin n) ℝ` and `r + 1 ≤ n`,
with `A_r = A.submatrix (Fin.castLE _) (Fin.castLE _)` (the book's `A(1:r, 1:r)`), for every
`k : Fin r`: `λ_{k+1}(A_{r+1}) ≤ λ_k(A_r) ≤ λ_k(A_{r+1})` (0-based; the book's chain
`λ_{r+1}(A_{r+1}) ≤ λ_r(A_r) ≤ λ_r(A_{r+1}) ≤ ⋯ ≤ λ_1(A_r) ≤ λ_1(A_{r+1})`).
`Matrix.IsHermitian.eigenvalues₀_submatrix_interlace` with `f = Fin.castLE` (card difference `1`),
reindexed. ★'''
deps = ["symmEigenvalue", "Matrix.IsHermitian.eigenvalues₀_submatrix_interlace"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.7'

[[node]]
id = "theorem_8_1_8"
kind = "theorem"
desc = '''Theorem 8.1.8, interlacing part: for symmetric `A`, `c` with `c ⬝ᵥ c = 1`, `τ : ℝ` and
`B = A + τ • vecMulVec c c`: if `τ ≥ 0` then `λ_i(B) ∈ [λ_i(A), λ_{i-1}(A)]` for `i = 2:n`
(0-based: `symmEigenvalue hA i ≤ symmEigenvalue hB i ≤ symmEigenvalue hA (i - 1)` for `1 ≤ i`), and
if `τ ≤ 0` then `λ_i(B) ∈ [λ_{i+1}(A), λ_i(A)]` for `i = 1:n-1`. Lower bounds from
`LinearMap.IsSymmetric.eigenvalues_le_of_re_inner_le` (`τ ccᵀ ⪰ 0`), upper from
`eigenvalues_le_of_isPositive_sub_of_finrank_range_le` with `r = 1` (`rank (ccᵀ) ≤ 1`); `τ ≤ 0` by
exchanging `A` and `B`. ★'''
deps = ["symmEigenvalue", "LinearMap.IsSymmetric.eigenvalues_le_of_isPositive_sub_of_finrank_range_le", "LinearMap.IsSymmetric.eigenvalues_le_of_re_inner_le"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.8'

[[node]]
id = "theorem_8_1_8_b"
kind = "theorem"
desc = '''Theorem 8.1.8, last clause: in either case there are `m : Fin n → ℝ`, `m i ≥ 0`,
`∑ i, m i = 1`, with `λ_i(B) = λ_i(A) + m i * τ` for all `i`. For `τ ≠ 0` take
`m i = (λ_i(B) - λ_i(A)) / τ`, nonnegative by `theorem_8_1_8`, summing to
`(tr B - tr A)/τ = tr(ccᵀ) = cᵀc = 1` (P8.1.8, `Matrix.IsHermitian.trace_eq_sum_eigenvalues₀`); for
`τ = 0` any probability vector (`n > 0`; for `n = 0` the sum condition fails — the book tacitly has
`n ≥ 1`, which the node assumes). ★★'''
deps = ["theorem_8_1_8", "Matrix.IsHermitian.trace_eq_sum_eigenvalues₀"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.8'

[[node]]
id = "theorem_8_1_9"
kind = "theorem"
desc = '''Theorem 8.1.9 with (8.1.1): for symmetric `A : Matrix (Fin n) (Fin n) ℝ`, `r + s = n` and
`Q = Matrix.fromCols Q₁ Q₂ : Matrix (Fin n) (Fin r ⊕ Fin s) ℝ` with `Qᵀ Q = 1`, `Q Qᵀ = 1`, if
`ran(Q₁)` is invariant (`∀ x ∈ LinearMap.range (toLin' Q₁), A *ᵥ x ∈ LinearMap.range (toLin' Q₁)`)
then `Qᵀ * A * Q = fromBlocks D₁ 0 0 D₂` with `D₁ = Q₁ᵀ A Q₁`, `D₂ = Q₂ᵀ A Q₂` ((8.1.1)), and
`spectrum ℝ A = spectrum ℝ D₁ ∪ spectrum ℝ D₂` (with multiplicity: `A.charpoly = D₁.charpoly *
D₂.charpoly`). Delegates to the backbone `Matrix.IsHermitian.conjTranspose_mul_mul_fromCols_eq_fromBlocks`
(`Numlib/LinearAlgebra/Matrix/Schur`; over `RCLike`, general index types: the block-diagonal form under `Qᴴ Q = 1`,
the charpoly factorization under `Q Qᴴ = 1`) at `𝕜 = ℝ` (`ᴴ = ᵀ`, `IsSymm` as `IsHermitian`); the invariance
hypothesis is turned into `A * Q₁ = Q₁ * M` by choosing `M` column by column (the range of `toLin' Q₁` is
spanned by its columns; `M = Q₁ᵀ A Q₁` works since `Q₁ᵀ Q₁ = 1`). The book's proof (`Q₂ᵀ A Q₁ = Q₂ᵀ Q₁ M = 0`,
the `(1,2)` block by symmetry) is the backbone's. ★'''
deps = ["Matrix.IsHermitian.conjTranspose_mul_mul_fromCols_eq_fromBlocks"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.9'

[[node]]
id = "sepSymm"
kind = "definition"
desc = '''The separation (8.1.2) of the spectra of two symmetric matrices:
`sepSymm B C := sInf {d | ∃ l ∈ spectrum ℝ B, ∃ m ∈ spectrum ℝ C, d = |l - m|}` for
`B : Matrix (Fin p) (Fin p) ℝ`, `C : Matrix (Fin q) (Fin q) ℝ` — a minimum of a finite nonempty set
when `p, q > 0` (`sInf ∅ = 0` otherwise, never used). It equals chapter 7's Sylvester separation
`Matrix.sep` for symmetric matrices (`sepSymm_eq_sep`, P8.1.9). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (8.1.2)'

[[node]]
id = "sepSymm_eq_sep"
kind = "theorem"
desc = '''[The book's P8.1.9], the helper Theorem 8.1.10 needs: for symmetric `B`, `C` (`p, q > 0`),
`Matrix.sep B C = sepSymm B C`, i.e. `min_{X ≠ 0} ‖B X - X C‖_F / ‖X‖_F = min |λ - μ|` over
`λ ∈ λ(B)`, `μ ∈ λ(C)`. Delegates to the backbone `Matrix.IsHermitian.sep_eq_iInf_abs_eigenvalues_sub`
(`Numlib/LinearAlgebra/Matrix/Sylvester`) at `𝕜 = ℝ`, with the `sInf` over the finite spectra rewritten as
the `⨅` over the eigenvalue indices (`Matrix.IsHermitian.spectrum_real_eq_range_eigenvalues`). ★'''
deps = ["sepSymm", "Matrix.sep", "Matrix.IsHermitian.sep_eq_iInf_abs_eigenvalues_sub"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.1.2)'

[[node]]
id = "theorem_8_1_10"
kind = "theorem"
desc = '''Theorem 8.1.10: for symmetric `A`, `E`, `Q = fromCols Q₁ Q₂` orthogonal with `ran Q₁`
`A`-invariant, `Qᵀ A Q = fromBlocks D₁ 0 0 D₂`, `Qᵀ E Q = fromBlocks E₁₁ E₂₁ᵀ E₂₁ E₂₂`,
`sepSymm D₁ D₂ > 0` and `‖E‖_F ≤ sepSymm D₁ D₂ / 5`, there is `P : Matrix (Fin s) (Fin r) ℝ` with
`‖P‖_F ≤ (4 / sepSymm D₁ D₂) * ‖E₂₁‖_F` such that the columns of
`Q̂₁ = (Q₁ + Q₂ * P) * (CFC.sqrt (1 + Pᵀ * P))⁻¹` are orthonormal and span an `(A + E)`-invariant
subspace. The symmetric case of chapter 7's Theorem 7.2.4 (Stewart 1973, Thm 4.11), through its
backbone form `Matrix.exists_invariant_graph_of_sep` at `𝕜 = ℝ` (the surface restatement of
Theorem 7.2.4 is over `ℂ` and would give a complex `P`): in the coordinates of `Q`, `T₁₂ = 0`
reduces its hypothesis `‖E‖_F (1 + 5‖T₁₂‖_F / sep) ≤ sep/5` to the book's, `sep = sepSymm` by
`sepSymm_eq_sep`, the invariant subspace is `ran (fromRows 1 P)`, and pulling back by `Q` and
orthonormalizing its basis `[I; P]` by `(I + PᵀP)^{-1/2}` gives `Q̂₁`. ★★ (~100 lines)'''
