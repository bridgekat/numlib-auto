[[node]]
id = "equation_8_1_7"
kind = "theorem"
desc = '''(8.1.7): if `lpOpNorm 2 (X₁ᵀ * X₁ - 1) = τ < 1` there is `Q` with `Qᵀ Q = 1` and
`lpOpNorm 2 (Q - X₁) ≤ τ` (the book's `Q = U Vᵀ` from the thin SVD of `X₁`).
`Matrix.exists_orthonormal_cols_norm_sub_le` at `𝕜 = ℝ`; the book's intermediate claim
`1 − σ_r² = τ` is not needed and not true in general (see the section description). The book's `Q = U Vᵀ` is the
polar factor of `X₁` (`Matrix.IsPolarDecomposition`, `Numlib/LinearAlgebra/Matrix/Polar`, where the backbone node now
lives, for any `Fintype`s); its second declaration `IsPolarDecomposition.l2_opNorm_sub_le` states the bound for a given
polar factor. ★

Blocked: `Matrix.exists_orthonormal_cols_norm_sub_le` (`Numlib/LinearAlgebra/Matrix/Polar`, agent dec1, running) is open; a delegation after.'''
deps = ["Matrix.exists_orthonormal_cols_norm_sub_le"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.1.7)'

[[node]]
id = "theorem_8_1_16"
kind = "theorem"
desc = '''Theorem 8.1.16: for symmetric `A`, `X₁ : Matrix (Fin n) (Fin r) ℝ`, `S = X₁ᵀ A X₁`,
`F₁ = A X₁ - X₁ S`, and `lpOpNorm 2 (X₁ᵀ X₁ - 1) = τ < 1` ((8.1.4)), there is `μ : Fin r → ℝ` with
`μ k ∈ spectrum ℝ A` and `|μ k - λ_k(S)| ≤ √2 * (lpOpNorm 2 F₁ + τ * (2 + τ) * lpOpNorm 2 A)`.
Proof as in the book: `Q` from (8.1.7), (8.1.5) with (8.1.6) gives
`‖A Q - Q S‖₂ ≤ ‖F₁‖₂ + τ (2 + τ) ‖A‖₂`, then Theorem 8.1.13 with this `Q` and the symmetric `S`. ★

Blocked: needs `theorem_8_1_13` and `equation_8_1_7` (both blocked above); with them ~30 lines on top of the proved (8.1.5)–(8.1.6).'''
deps = ["theorem_8_1_13", "equation_8_1_5", "equation_8_1_6", "equation_8_1_7", "symmEigenvalue"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.16'

