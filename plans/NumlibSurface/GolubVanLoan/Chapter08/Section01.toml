[[node]]
id = "theorem_8_1_12"
kind = "theorem"
desc = '''Theorem 8.1.12 (eigenvector perturbation): for symmetric `A`, `E`, orthogonal
`Q = fromCols (replicateCol q₁) Q₂` with `A q₁ = λ q₁`, `Qᵀ A Q = fromBlocks !![λ] 0 0 D₂`,
