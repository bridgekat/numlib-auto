id = "theorem_8_1_17"
kind = "theorem"
desc = '''Theorem 8.1.17 (Sylvester law of inertia): for symmetric `A` and nonsingular `X`
(`IsUnit X.det`), `A` and `Xᵀ A X` have the same inertia: `inertia hXAX = inertia hA`
(`hXAX : (Xᵀ * A * X).IsSymm`). `Matrix.IsHermitian.inertia_conj` at `𝕜 = ℝ`. The book's
min–max proof (comparing `λ_r(XᵀAX)` with `λ_r(A) σ_n(X)²`) is the same idea in quantitative form;
the backbone proves the counts by maximal positive subspaces. ★'''
