[[node]]
id = "equation_8_1_5"
kind = "theorem"
desc = '''(8.1.5): for `A` symmetric, `X₁ : Matrix (Fin n) (Fin r) ℝ`, `S = X₁ᵀ A X₁`,
`F₁ = A X₁ - X₁ S`, and any `Q` with orthonormal columns, `E₁ = A Q - Q S` satisfies
`lpOpNorm 2 E₁ ≤ lpOpNorm 2 F₁ + lpOpNorm 2 (Q - X₁) * lpOpNorm 2 A * (1 + lpOpNorm 2 X₁ ^ 2)`.
`E₁ - F₁ = A (Q - X₁) - (Q - X₁) S` and `‖S‖₂ ≤ ‖X₁‖₂² ‖A‖₂` (submultiplicativity, `‖X₁ᵀ‖₂ = ‖X₁‖₂`).
★'''
deps = ["Matrix.lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.1.5)'

