[[node]]
id = "theorem_8_1_13"
kind = "theorem"
desc = '''Theorem 8.1.13, in the **paired** form the book's proof gives (eigen review item 6; Parlett's use of
Kahan's theorem needs it): for symmetric `A : Matrix (Fin n) (Fin n) ℝ`, symmetric
`S : Matrix (Fin r) (Fin r) ℝ` and `Q₁ : Matrix (Fin n) (Fin r) ℝ` with `Q₁ᵀ Q₁ = 1`,
`E₁ = A Q₁ - Q₁ S`, there is an injection `σ : Fin r ↪ Fin n` with
`|λ_{σ k}(A) - λ_k(S)| ≤ √2 * lpOpNorm 2 E₁` for all `k` (`symmEigenvalue`; the book's
"there exist `μ₁, …, μ_r ∈ λ(A)`", read with distinct indices as its proof produces them). Proof as in
the book: complete `Q₁` to an orthogonal `Q = [Q₁ Q₂]`; `Qᵀ A Q = B + E` with
`B = diag(S, Q₂ᵀ A Q₂)` and `E = [Q₁ᵀE₁, E₁ᵀQ₂; Q₂ᵀE₁, 0]`, `‖E‖₂ ≤ √2 ‖E₁‖₂` (the block of a
symmetric matrix with orthonormal `Q`); Weyl (`corollary_8_1_6`) pairs the sorted eigenvalues of
`A` with those of `B`, and the eigenvalues of `S` are among those of `B` at distinct sorted positions
(`σ`). That proof is the backbone's: the surface delegates to
`Matrix.IsHermitian.exists_embedding_abs_sub_le_of_mul_sub_mul` (`Numlib/Eigen/Perturbation`; over `RCLike`,
`∃ σ : Fin (card r) ↪o Fin (card n), |λ_{σ k}(A) − λ_k(S)| ≤ √2 ε` with `eigenvalues₀` sorted decreasingly) at
`𝕜 = ℝ`, `ε = lpOpNorm 2 E₁`, reading `symmEigenvalue` as `eigenvalues₀` (the book's `μ_k := λ_{σ k}(A)`; the order
embedding is in particular the injection). Kahan's constant `1` for the paired form is later (★★★). ★'''
