[[node]]
id = "corollary_8_1_11"
kind = "theorem"
desc = '''Corollary 8.1.11: under the hypotheses of Theorem 8.1.10, with its `Q̂₁`,
`GolubVanLoan.Chapter02.subspaceDist (range Q₁) (range Q̂₁) ≤ (4 / sepSymm D₁ D₂) * ‖E₂₁‖_F`
(chapter 2's `dist`, `= Submodule.gap` of the column spaces in `EuclideanSpace ℝ (Fin n)`). Proof as
in the book: `dist = ‖Q₂ᵀ Q̂₁‖₂` (chapter 2's Theorem 2.5.1, both matrices completed to orthogonal
ones), `Q₂ᵀ Q̂₁ = P (I + PᵀP)^{-1/2}`, and (8.1.3). (Chapter 7's `Matrix.gap_range_fromRows_le`
with `Submodule.gap_map_linearIsometryEquiv` is an equivalent route.) ★★

Blocked: needs chapter 2's `GolubVanLoan.Chapter02.theorem_2_5_1` (open on main, agent c0209); (8.1.3) is now proved (`equation_8_1_3`). ~60 lines after (c08, 2026-09-26).'''
deps = ["theorem_8_1_10", "equation_8_1_3", "GolubVanLoan.Chapter02.subspaceDist", "GolubVanLoan.Chapter02.theorem_2_5_1"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 8.1.11'

[[node]]
id = "theorem_8_1_12"
kind = "theorem"
desc = '''Theorem 8.1.12 (eigenvector perturbation): for symmetric `A`, `E`, orthogonal
`Q = fromCols (replicateCol q₁) Q₂` with `A q₁ = λ q₁`, `Qᵀ A Q = fromBlocks !![λ] 0 0 D₂`,
`Qᵀ E Q = fromBlocks !![ε] eᵀ e E₂₂`, `d = min_{μ ∈ λ(D₂)} |λ - μ| > 0` and `‖E‖_F ≤ d/5`: there
is `p : Fin (n-1) → ℝ` with `‖p‖₂ ≤ (4/d) ‖e‖₂` such that `q̂₁ = (q₁ + Q₂ p) / √(1 + pᵀp)` is a unit
eigenvector of `A + E`, and `dist(span{q₁}, span{q̂₁}) = √(1 - (q₁ᵀ q̂₁)²) ≤ (4/d) ‖e‖₂`
(`dist = GolubVanLoan.Chapter02.subspaceDist`). The case `r = 1` of `theorem_8_1_10` and
`corollary_8_1_11` (`d = sepSymm !![λ] D₂`, a `1 × 1` invariant block is an eigenvector); the identity
`gap(span u, span v) = √(1 - (uᵀv)²)` for unit vectors is `Submodule.sinAngle` of a line
(`Numlib/Analysis/InnerProductSpace/Projection/Angle`). ★★

Blocked: the case `r = 1` of `theorem_8_1_10` and `corollary_8_1_11` (the latter waits for chapter 2's `theorem_2_5_1`, agent c0209) (c08, 2026-09-26).'''
deps = ["theorem_8_1_10", "corollary_8_1_11", "Submodule.sinAngle", "GolubVanLoan.Chapter02.subspaceDist"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.12'

[[node]]
id = "theorem_8_1_13"
kind = "theorem"
desc = '''Theorem 8.1.13, in the **paired** form the book's proof gives (eigen review item 6; Parlett's use of
Kahan's theorem needs it): for symmetric `A : Matrix (Fin n) (Fin n) ℝ`, symmetric
`S : Matrix (Fin r) (Fin r) ℝ` and `Q₁ : Matrix (Fin n) (Fin r) ℝ` with `Q₁ᵀ Q₁ = 1`,
`E₁ = A Q₁ - Q₁ S`, there is an injection `σ : Fin r ↪ Fin n` with
`|λ_{σ k}(A) - λ_k(S)| ≤ √2 * lpOpNorm 2 E₁` for all `k` (`symmEigenvalue`; the book's
"there exist `μ₁, …, μ_r ∈ λ(A)`", read with distinct indices as its proof produces them). Proof as in
the book: complete `Q₁` to an orthogonal `Q = [Q₁ Q₂]`; `Qᵀ A Q = B + E` with
`B = diag(S, Q₂ᵀ A Q₂)` and `E = [Q₁ᵀE₁, E₁ᵀQ₂; Q₂ᵀE₁, 0]`, `‖E‖₂ ≤ √2 ‖E₁‖₂` (the block of a
symmetric matrix with orthonormal `Q`); Weyl (`corollary_8_1_6`) pairs the sorted eigenvalues of
`A` with those of `B`, and the eigenvalues of `S` are among those of `B` at distinct sorted positions
(`σ`). That proof is the backbone's: the surface delegates to
`Matrix.IsHermitian.exists_embedding_abs_sub_le_of_mul_sub_mul` (`Numlib/Eigen/Perturbation`; over `RCLike`,
`∃ σ : Fin (card r) ↪o Fin (card n), |λ_{σ k}(A) − λ_k(S)| ≤ √2 ε` with `eigenvalues₀` sorted decreasingly) at
`𝕜 = ℝ`, `ε = lpOpNorm 2 E₁`, reading `symmEigenvalue` as `eigenvalues₀` (the book's `μ_k := λ_{σ k}(A)`; the order
embedding is in particular the injection). Kahan's constant `1` for the paired form is later (★★★). ★

Blocked: the backbone `Matrix.IsHermitian.exists_embedding_abs_sub_le_of_mul_sub_mul` is still open on main (agent bb1); a ~10-line delegation after (c08, 2026-09-26).'''
deps = ["symmEigenvalue", "Matrix.IsHermitian.exists_embedding_abs_sub_le_of_mul_sub_mul", "Matrix.lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.1.13'

