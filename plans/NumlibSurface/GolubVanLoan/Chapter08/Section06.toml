desc = '''(8.6.4): `Ã = [0 Aᵀ; A 0]` and `Ã + Ẽ = [0 (A+E)ᵀ; A+E 0]` with `Ẽ = [0 Eᵀ; E 0]`, i.e.
`Matrix.hermitianDilation (A + E) = hermitianDilation A + hermitianDilation E`, and
`‖hermitianDilation E‖_F² = 2 ‖E‖_F²`, `lpOpNorm 2 (hermitianDilation E) = lpOpNorm 2 E`. ★

Blocked: `Matrix.hermitianDilation` (agent sv2, running) is open.'''
deps = ["Matrix.hermitianDilation"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.6.4)'

