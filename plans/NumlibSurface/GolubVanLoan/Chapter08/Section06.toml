[[node]]
id = "algorithm_8_6_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.6.2: for `A : Matrix (Fin m) (Fin n) ℝ`, `m ≥ n`, `ε ≥ 0`,
any `fuel`, `(D, U, V) := Id.run (algorithm_8_6_2 pure ε A fuel)`: `U`, `V` orthogonal,
`Uᵀ A V = D + E` with `D` upper bidiagonal (`m × n`, zero below row `n`) and `E` supported on the
deflated superdiagonal positions with `|e_{i,i+1}| ≤ ε (|b_ii| + |b_{i+1,i+1}|)` at deflation time,
whence `‖E‖_F ≤ c ε ‖A‖_F / (1 - c ε)` (`c = 2√(n-1)`, as in `algorithm_8_3_3_spec`); and if the
loop stopped on its test, `D` is diagonal — the book's `Uᵀ A V = D + E`, `‖E‖₂ ≈ u ‖A‖₂` in exact
arithmetic with the deflation tolerance. Uses chapter 5's `algorithm_5_4_2_spec`,
`algorithm_8_6_1_spec`, `bidiagonal_decouple`. Convergence is not claimed. ★★★ (~350 lines)

Blocked: on `algorithm_8_6_1_spec` (open); the program `algorithm_8_6_2` with its deflation, window search and zero-diagonal chase is proved (c08, 2026-09-26). ~350 lines.'''
deps = ["algorithm_8_6_2", "algorithm_8_6_1_spec", "bidiagonal_decouple", "GolubVanLoan.Chapter05.algorithm_5_4_2_spec", "GolubVanLoan.Chapter05.forwardAccumulation_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.6.2'

