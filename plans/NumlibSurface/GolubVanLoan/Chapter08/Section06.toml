kind = "theorem"
desc = '''Theorem 8.6.4 (Wielandt–Hoffman for singular values): for `A E : Matrix (Fin m) (Fin n) ℝ`,
`m ≥ n`, `∑ k : Fin n, (σ_k(A + E) - σ_k(A))² ≤ ‖E‖_F²`. `Matrix.sum_sq_sortedSingularValues_sub_le` at
`ℝ` (its proof is the book's: Theorem 8.1.4 for the matrices (8.6.4)). ★

Blocked: `Matrix.sum_sq_sortedSingularValues_sub_le` (agent sv2, running) is open; a delegation after.'''
