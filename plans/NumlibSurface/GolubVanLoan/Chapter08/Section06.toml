namespace = "GolubVanLoan.Chapter08"
desc = '''
§8.6, computing the SVD: the connections (8.6.1)–(8.6.3) with the symmetric eigenproblems of `AᵀA`,
`AAᵀ` and the Jordan–Wielandt matrix, the perturbation theory of singular values (Theorem 8.6.1,
Corollaries 8.6.2–8.6.3, Theorem 8.6.4) and of singular subspace pairs (Theorem 8.6.5), the
Golub–Kahan SVD step (Algorithm 8.6.1) and the SVD algorithm (Algorithm 8.6.2), and the Jacobi SVD
procedures (§8.6.4).

`σ_k(A)` for `A : Matrix (Fin m) (Fin n) ℝ` is `A.sortedSingularValues (k - 1)` (the backbone `abbrev` for
`(Matrix.toEuclideanLin A).singularValues (k - 1)`, Mathlib's sorted `LinearMap.singularValues`, 0-based, the values
`Matrix.exists_svd` puts on the diagonal); chapters 2 and 6 use the same reading and introduce no synonym. The
Jordan–Wielandt matrix `[0 Aᵀ; A 0]` is `Matrix.hermitianDilation A` (`Numlib/Analysis/Matrix/SingularValues`, the
matrix of the operator `LinearMap.hermitianDilation` of `Numlib/Analysis/InnerProductSpace/SingularValues`),
indexed by `Fin n ⊕ Fin m`; `Matrix.hermitianDilation` and `Matrix.IsHermitian.eigenvalues₀_hermitianDilation`
keep their ids and statements. Theorems 8.6.4–8.6.5 are in `Numlib/Analysis/Matrix/SingularValues`. Bidiagonal matrices are `Matrix.IsUpperBidiagonal`.

The algorithms follow the numbered conventions of `NumlibSurface/GolubVanLoan`. Algorithm 8.6.2 calls
chapter 5's Householder bidiagonalization (`GolubVanLoan.Chapter05.algorithm_5_4_2`, whose returned
reflector data carry the `β` `house` computed, convention 13) and Algorithm 8.6.1, which calls
chapter 5's `givens` (`GolubVanLoan.Chapter05.algorithm_5_1_3`) and applies the rotations with
chapter 5's `givensApplyLeft`/`givensApplyRight`; Algorithm 8.6.1 runs on a **window** of consecutive
indices of the full bidiagonal matrix (the unreduced block `B₂₂` of Algorithm 8.6.2, convention 10). The spec of Algorithm 8.6.1 is the book's claim that it
is Algorithm 8.3.2 applied implicitly to `BᵀB`, proved through the implicit Q theorem.

Readings. Algorithm 8.6.1 says "`B ∈ ℝ^{m×n}`" for what is square `n × n`. Theorem 8.6.5 swaps
`P` and `Q`: the dimensions require `P ∈ ℝ^{(n-r)×r}` with `ran(V₁ + V₂ P)` and
`Q ∈ ℝ^{(m-r)×r}` with `ran(U₁ + U₂ Q)`; the node states it that way. **Theorem 8.6.5 is false as
printed for `m > n`** (surface review Major 1; book lines 25739–25770): its gap `δ` is a minimum over
`σ(A₁₁)` and `σ(A₂₂)` only, but for `m > n` the block `A₂₂ ∈ ℝ^{(m-r)×(n-r)}` has `m - n` further zero
singular values that the perturbation can couple to. `theorem_8_6_5` adds Wedin/Stewart's condition
`δ ≤ σ_min(A₁₁)` when `m > n` (for `m = n` it is the printed statement), and
`theorem_8_6_5_counterexample` records the failure. The "Steps 1–3" route
through `AᵀA` and QR with column pivoting is a sketch the book immediately discards (not a node),
and Figure 8.6.1 is an operation count (not formalized).
'''

[[node]]
id = "equation_8_6_1"
kind = "theorem"
desc = '''(8.6.1)–(8.6.2): if `Uᵀ A V = rectDiagonal σ` is an SVD of `A : Matrix (Fin m) (Fin n) ℝ`,
`m ≥ n`, then `Vᵀ (AᵀA) V = diagonal (σ_i²)` (`n × n`) and
`Uᵀ (A Aᵀ) U = diagonal (σ₁², …, σ_n², 0, …, 0)` (`m × m`). `Matrix.rectDiagonal_mul_rectDiagonal`,
`Matrix.conjTranspose_rectDiagonal_mul_self`. ★'''
deps = ["Matrix.rectDiagonal", "Matrix.exists_svd"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.6.1)'

[[node]]
id = "equation_8_6_3"
kind = "theorem"
desc = '''(8.6.3): with an SVD `Uᵀ A V = diag(σ)`, `m ≥ n`, `U = [U₁ U₂]` (`n`, `m - n` columns), the
matrix `Q = (1/√2) [V V 0; U₁ -U₁ √2 U₂]` (block rows `n`, `m`; block columns `n`, `n`, `m - n`) is
orthogonal and `Qᵀ [0 Aᵀ; A 0] Q = diag(σ₁, …, σ_n, -σ₁, …, -σ_n, 0, …, 0)`; hence the eigenvalues of
the Jordan–Wielandt matrix are `±σ_i` and `m - n` zeros
(`Matrix.IsHermitian.eigenvalues₀_hermitianDilation`). Block computation with `Matrix.fromBlocks`
and `Matrix.fromCols` over the reindexing `Fin n ⊕ Fin n ⊕ Fin (m - n) ≃ Fin n ⊕ Fin m`. ★★'''
deps = ["Matrix.hermitianDilation", "Matrix.IsHermitian.eigenvalues₀_hermitianDilation", "equation_8_6_1"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.6.3)'

[[node]]
id = "theorem_8_6_1"
kind = "theorem"
desc = '''Theorem 8.6.1: for `A : Matrix (Fin m) (Fin n) ℝ` and `k < min m n` (book `k = 1:min{m,n}`,
0-based here), `σ_k(A) = min_{dim S = n-k} max_{x ∈ S, y ∈ ℝ^m} yᵀAx/(‖x‖₂‖y‖₂)`
(`LinearMap.isLeast_singularValues_bilinear`, the book's `n - k + 1` in 1-based counting) and
`σ_k(A) = max_{dim S = k+1} min_{x ∈ S} ‖Ax‖₂/‖x‖₂` (`LinearMap.isGreatest_singularValues`), both in
the `IsLeast`/`IsGreatest` form over subspaces `S` of `ℝⁿ` (`Fin n → ℝ`, transported to
`EuclideanSpace`). The book proves the right form from Theorem 8.1.2 for `AᵀA` and refers to
Xiang (2006) for the left. ★★ (bridging)'''
deps = ["LinearMap.isGreatest_singularValues", "LinearMap.isLeast_singularValues_bilinear", "theorem_8_1_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.6.1'

