[[node]]
id = "theorem_8_6_5"
kind = "theorem"
desc = '''Theorem 8.6.5, corrected for `m > n` (with `P`, `Q` in the roles the dimensions require; see the section
description): for `A, E : Matrix (Fin m) (Fin n) ℝ`, `m ≥ n`, orthogonal `V = [V₁ V₂]`,
`U = [U₁ U₂]` with `ran V₁`, `ran U₁` a singular subspace pair for `A`, `Uᵀ A V = fromBlocks A₁₁ 0 0 A₂₂`,
`Uᵀ E V = fromBlocks E₁₁ E₁₂ E₂₁ E₂₂`, `δ = min_{σ ∈ σ(A₁₁), γ ∈ σ(A₂₂)} |σ - γ| > 0`, **and, if `m > n`,
`δ ≤ σ_min(A₁₁)`** (Wedin/Stewart's gap: the `m - n` extra zero singular values of the tall `A₂₂` count;
for `m = n` the hypothesis is absent, as printed), and `‖E‖_F ≤ δ/5`: there are `P`, `Q` with
`‖[Q; P]‖_F ≤ 4 ‖E‖_F / δ` such that
`IsSingularSubspacePair (A + E) (ran (V₁ + V₂ P)) (ran (U₁ + U₂ Q))`.
`Matrix.exists_singularSubspacePair_perturbation` (the backbone node keeps its id and gains the same gap
hypothesis for `m > n` — Fix-B, surface review Major 1). Its separation hypotheses are stated with 0-based sorted
singular values, `∀ i < r, ∀ j < n - r, δ ≤ |A₁₁.sortedSingularValues i - A₂₂.sortedSingularValues j|` and
Wedin's `n < m → ∀ i < r, δ ≤ A₁₁.sortedSingularValues i`; the surface's `δ` (a minimum over the two spectra) and
`σ_min(A₁₁) = A₁₁.sortedSingularValues (r - 1)` supply both (for `m = n` the second is vacuous). The backbone
node is open with a `Blocked:` paragraph
(Stewart 1973, Thm 6.4; the Riccati lemma of chapter 7's Theorem 7.2.4). The book refers to Stewart for
the proof. ★ (given the backbone)'''
deps = ["IsSingularSubspacePair", "Matrix.exists_singularSubspacePair_perturbation"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.6.5'

