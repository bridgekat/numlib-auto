[[node]]
id = "IsSingularSubspacePair"
kind = "definition"
desc = '''§8.6.2: `k`-dimensional subspaces `S ≤ ℝⁿ`, `T ≤ ℝᵐ` form a singular subspace pair for `A`
if `x ∈ S → A x ∈ T` and `y ∈ T → Aᵀ y ∈ S`: `IsSingularSubspacePair A S T := finrank S = finrank T
∧ S.map (toEuclideanLin A) ≤ T ∧ T.map (toEuclideanLin Aᵀ) ≤ S`. ★'''
deps = []
