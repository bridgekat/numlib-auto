[[node]]
id = "theorem_8_6_5"
kind = "theorem"
desc = '''Theorem 8.6.5, corrected for `m > n` (with `P`, `Q` in the roles the dimensions require; see the section
description): for `A, E : Matrix (Fin m) (Fin n) ℝ`, `m ≥ n`, orthogonal `V = [V₁ V₂]`,
`U = [U₁ U₂]` with `ran V₁`, `ran U₁` a singular subspace pair for `A`, `Uᵀ A V = fromBlocks A₁₁ 0 0 A₂₂`,
`Uᵀ E V = fromBlocks E₁₁ E₁₂ E₂₁ E₂₂`, `δ = min_{σ ∈ σ(A₁₁), γ ∈ σ(A₂₂)} |σ - γ| > 0`, **and, if `m > n`,
`δ ≤ σ_min(A₁₁)`** (Wedin/Stewart's gap: the `m - n` extra zero singular values of the tall `A₂₂` count;
for `m = n` the hypothesis is absent, as printed), and `‖E‖_F ≤ δ/5`: there are `P`, `Q` with
`‖[Q; P]‖_F ≤ 4 ‖E‖_F / δ` such that
`IsSingularSubspacePair (A + E) (ran (V₁ + V₂ P)) (ran (U₁ + U₂ Q))`.
`Matrix.exists_singularSubspacePair_perturbation` (the backbone node keeps its id and gains the same gap
hypothesis for `m > n` — Fix-B, surface review Major 1). Its separation hypotheses are stated with 0-based sorted
singular values, `∀ i < r, ∀ j < n - r, δ ≤ |A₁₁.sortedSingularValues i - A₂₂.sortedSingularValues j|` and
Wedin's `n < m → ∀ i < r, δ ≤ A₁₁.sortedSingularValues i`; the surface's `δ` (a minimum over the two spectra) and
`σ_min(A₁₁) = A₁₁.sortedSingularValues (r - 1)` supply both (for `m = n` the second is vacuous). The backbone
node is open with a `Blocked:` paragraph
(Stewart 1973, Thm 6.4; the Riccati lemma of chapter 7's Theorem 7.2.4). The book refers to Stewart for
the proof. ★ (given the backbone)'''
deps = ["IsSingularSubspacePair", "Matrix.exists_singularSubspacePair_perturbation"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.6.5'

[[node]]
id = "theorem_8_6_5_counterexample"
kind = "theorem"
desc = '''Theorem 8.6.5 as printed is false for `m > n` (surface review Major 1): `m = 3`, `n = 2`, `r = 1`,
`A = !![0, 0; 0, 1; 0, 0]`, `U = 1`, `V = 1` (`A₁₁ = [0]`, `A₂₂ = !![1; 0]` with `σ(A₂₂) = {1}`, so the
printed `δ = 1`), `E = ε • vecMulVec e₃ e₁` (`E 2 0 = ε`, else `0`) with `0 < ε ≤ 1/5` (so
`‖E‖_F = ε ≤ δ/5`). Every one-dimensional singular subspace pair `(S, T)` of `A + E =
!![0, 0; 0, 1; ε, 0]` is `(span e₁, span e₃)` or `(span e₂, span e₂)`, and neither has the form
`(ran (V₁ + V₂ P), ran (U₁ + U₂ Q)) = (span (e₁ + P e₂), span (e₁ + Q₁ e₂ + Q₂ e₃))`: the first pair
would need `span (e₁ + Q₁ e₂ + Q₂ e₃) = span e₃`, the second `span (e₁ + P e₂) = span e₂`, both impossible
because the `e₁`-coefficient is `1`. The corrected hypothesis fails here: `σ_min(A₁₁) = 0 < δ`.
Stated as the negation of the printed conclusion for this instance. The singular subspace pairs of
`A + E` are found from `(A + E)ᵀ(A + E) = diag(ε², 1)` (distinct eigenvalues for `ε < 1`, so the
invariant lines are the coordinate axes). ★★'''
deps = ["IsSingularSubspacePair"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.6.5'

[[node]]
id = "gram_bidiagonal"
kind = "theorem"
desc = '''§8.6.3: for upper bidiagonal `B` with diagonal `d` and superdiagonal `f`, `T = BᵀB` is
symmetric tridiagonal with `t_ii = d_i² + f_{i-1}²` (`f₀ = 0`) and `t_{i,i+1} = d_i f_i`; in
particular the trailing block `T(n-1:n, n-1:n) = [d_{n-1}² + f_{n-2}², d_{n-1} f_{n-1}; d_{n-1} f_{n-1},
d_n² + f_{n-1}²]` (the book prints `d_m f_m` with `m = n - 1`), and `T` is unreduced iff every
`d_i f_i ≠ 0` (`i < n`). Also: if `Uᵀ A V = [B; 0]` is a bidiagonalization then `Vᵀ(AᵀA)V = BᵀB`
is a tridiagonal decomposition of `AᵀA` (the section's opening remark). ★'''
deps = ["Matrix.IsUpperBidiagonal", "IsUnreducedTridiagonal"]
source = 'Golub–Van Loan, Matrix Computations, §8.6.3'

[[node]]
id = "bidiagonal_decouple"
kind = "theorem"
desc = '''§8.6.3, the decoupling rules: for upper bidiagonal `B` (`n × n`): (i) if `f_k = 0` then
`B = fromBlocks B₁ 0 0 B₂` (reindexed) and its singular values are those of `B₁` and `B₂` together;
(ii) if `d_k = 0` for some `k < n`, the row rotations in planes `(k, k+1), …, (k, n)` (each by
`Matrix.givensPair` of the current `(k, j)` entry and `(j, j)` entry) zero row `k` and keep `B`
upper bidiagonal; (iii) if `d_n = 0`, the column rotations in planes `(n-1, n), …, (1, n)` zero the
last column. So the SVD problem decouples whenever `f₁ ⋯ f_{n-1} = 0` or `d₁ ⋯ d_n = 0`. (ii) by
induction on the chase (the bulge moves one column right per rotation, as in the book's `n = 6`,
`k = 3` display). ★★ (~120 lines)'''
deps = ["Matrix.IsUpperBidiagonal", "Matrix.givensPair", "Matrix.transpose_planeRotation_givensPair_mulVec"]
source = 'Golub–Van Loan, Matrix Computations, §8.6.3'

[[node]]
id = "algorithm_8_6_1"
kind = "definition"
desc = '''Algorithm 8.6.1 (Golub–Kahan SVD step), per the conventions, on a window `w = [w₀, …, w_{N-1}]` of
consecutive indices (the book's step is the whole square `B : Matrix (Fin n) (Fin n) ℝ`, `w = List.finRange n`;
the book's "`m × n`" is a slip): `algorithm_8_6_1 rnd w (B U V : Matrix …) : M (Matrix × Matrix × Matrix)`
returning `(Ūᵀ B V̄, U Ū, V V̄)` (`Ū`, `V̄` the identity off `w`; the accumulations the book counts are
needed by Algorithm 8.6.2). `μ ←` the Wilkinson-type eigenvalue of the trailing `2 × 2` of `T = BᵀB`
closer to `t_NN` (computed from `d_{N-1}, d_N, f_{N-2}, f_{N-1}` by the formula of Algorithm 8.3.2, every
`+ − × / √` rounded, `sgn` exact); `y ← fl(t₁₁ - μ)`, `z ← t₁₂` (`t₁₁ = fl(d₁²)`, `t₁₂ = fl(d₁ f₁)`); for
`k = 1:N-1`: `(c, s) ← givens(y, z)` (the column form `[y z] [c s; -s c] = [* 0]` is the same condition
`s y + c z = 0` as chapter 5's `algorithm_5_1_3_spec`), `B ← B G(w_{k-1}, w_k, θ)`
(`GolubVanLoan.Chapter05.givensApplyRight`, rows `w`), `V ← V G` (`givensApplyRight`, all rows),
`y ← b_kk`, `z ← b_{k+1,k}`, `(c, s) ← givens(y, z)`, `B ← G(w_{k-1}, w_k, θ)ᵀ B` (`givensApplyLeft`,
columns `w`), `U ← U G` (`givensApplyRight`, all rows), and if `k < N - 1`: `y ← b_{k,k+1}`,
`z ← b_{k,k+2}` (copies). ★★'''
deps = ["GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "wilkinsonShift"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.6.1'

[[node]]
id = "algorithm_8_6_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.6.1: for upper bidiagonal `B` with no zero diagonal or
superdiagonal entry (`n ≥ 2`), `(B̄, U', V') := Id.run (algorithm_8_6_1 pure (List.finRange n) B U V)`: there are
orthogonal `Ū`, `V̄` (products of `n - 1` rotations each) with `B̄ = Ūᵀ B V̄` upper bidiagonal,
`U' = U Ū`, `V' = V V̄`, `V̄ e₁ = G₁ e₁` parallel to `(BᵀB - μ I) e₁`; and `B̄ᵀ B̄ = V̄ᵀ (BᵀB) V̄` is,
up to a diagonal `±1` similarity, the result of Algorithm 8.3.2 on `T = BᵀB` (whose shift is `μ`):
`V̄ = Z D` for the `Z` of `algorithm_8_3_2_spec` — the book's "`V̄` is essentially the orthogonal
matrix that would be obtained by applying Algorithm 8.3.2 to `T = BᵀB`". Proof: bulge-chasing
invariant (one bulge, alternating below the diagonal and right of the superdiagonal); `BᵀB`
unreduced by `gram_bidiagonal`; the implicit Q theorem (`theorem_8_3_2`) against `algorithm_8_3_2_spec`; `givensApplyLeft_spec`,
`givensApplyRight_spec` for each rotation. Window form (what Algorithm 8.6.2 uses): the same for a
bidiagonal block decoupled from the rest, `Ū`, `V̄` the identity off the window. ★★★ (~400 lines)'''
deps = ["algorithm_8_6_1", "gram_bidiagonal", "theorem_8_3_2", "algorithm_8_3_2_spec", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.6.1'

[[node]]
id = "algorithm_8_6_2"
kind = "definition"
desc = '''Algorithm 8.6.2 (the SVD algorithm), per the conventions with `fuel` last: `algorithm_8_6_2 rnd ε A fuel :
M (Matrix × Matrix × Matrix)` returning `(D, U, V)` for `A : Matrix (Fin m) (Fin n) ℝ`, `m ≥ n`.
Bidiagonalize by chapter 5's `algorithm_5_4_2` (its output is the array `A'` holding the bidiagonal
`B` on its diagonal and superdiagonal and the essential parts of the left and right Householder vectors
below the diagonal and right of the superdiagonal, and the two returned `β` vectors), then form `U`
and `V` by chapter 5's `forwardAccumulation` (§5.1.6) of the reflector data of `algorithm_5_4_2_spec`
(the stored vectors paired with the **returned** `β`s by `GolubVanLoan.Chapter05.storedReflectors`,
convention 13; never rebuilt as `β = 2/(vᵀv)`); then at most
`fuel` times: set `b_{i,i+1} = 0` if `|b_{i,i+1}| ≤ fl(ε · fl(|b_ii| + |b_{i+1,i+1}|))` (right side
rounded, `|·|` and the comparison exact — convention 1); find the largest `q` and smallest `p` with
`B₃₃` diagonal and `B₂₂` with nonzero superdiagonal (exact index computation); stop if `q = n`; if some
diagonal entry of `B₂₂` is zero (an exact test), zero the superdiagonal entry in the same row by the
rotations of `bidiagonal_decouple` (ii)/(iii) (`givensApplyLeft`/`givensApplyRight`); else apply
`algorithm_8_6_1` to the window `w = [p, …, n-q-1]` with the accumulators `U`, `V` (no extraction; the
effect is `B = diag(I_p, Ū, I_{q+m-n})ᵀ B diag(I_p, V̄, I_q)`). ★★'''
deps = ["algorithm_8_6_1", "bidiagonal_decouple", "GolubVanLoan.Chapter05.algorithm_5_4_2", "GolubVanLoan.Chapter05.forwardAccumulation", "GolubVanLoan.Chapter05.storedReflectors", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.6.2'

[[node]]
id = "algorithm_8_6_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.6.2: for `A : Matrix (Fin m) (Fin n) ℝ`, `m ≥ n`, `ε ≥ 0`,
any `fuel`, `(D, U, V) := Id.run (algorithm_8_6_2 pure ε A fuel)`: `U`, `V` orthogonal,
`Uᵀ A V = D + E` with `D` upper bidiagonal (`m × n`, zero below row `n`) and `E` supported on the
deflated superdiagonal positions with `|e_{i,i+1}| ≤ ε (|b_ii| + |b_{i+1,i+1}|)` at deflation time,
whence `‖E‖_F ≤ c ε ‖A‖_F / (1 - c ε)` (`c = 2√(n-1)`, as in `algorithm_8_3_3_spec`); and if the
loop stopped on its test, `D` is diagonal — the book's `Uᵀ A V = D + E`, `‖E‖₂ ≈ u ‖A‖₂` in exact
arithmetic with the deflation tolerance. Uses chapter 5's `algorithm_5_4_2_spec`,
`algorithm_8_6_1_spec`, `bidiagonal_decouple`. Convergence is not claimed. ★★★ (~350 lines)'''
deps = ["algorithm_8_6_2", "algorithm_8_6_1_spec", "bidiagonal_decouple", "GolubVanLoan.Chapter05.algorithm_5_4_2_spec", "GolubVanLoan.Chapter05.forwardAccumulation_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.6.2'

[[node]]
id = "jacobiSVD_twoByTwo"
kind = "theorem"
desc = '''§8.6.4, the two-sided Jacobi SVD subproblem (P8.6.5): for any real `2 × 2`
`M = !![a_pp, a_pq; a_qp, a_qq]` there are `(c₁, s₁)`, `(c₂, s₂)` with `c_i² + s_i² = 1` and
`!![c₁, s₁; -s₁, c₁]ᵀ * M * !![c₂, s₂; -s₂, c₂] = diagonal ![d_p, d_q]`. Construction: a rotation
making `M` symmetric (P8.6.5(a)), then `algorithm_8_5_1_spec` on the symmetric result. And the
two-sided update of an `n × n` `A` in the plane `(p, q)` zeroes `a_pq`, `a_qp` with
`off(B)² = off(A)² - a_pq² - a_qp²` (P8.6.5(c)). ★★'''
deps = ["algorithm_8_5_1_spec", "GolubVanLoan.Chapter05.givensRotation", "off"]
source = 'Golub–Van Loan, Matrix Computations, §8.6.4'

[[node]]
id = "oneSidedJacobi_orthogonal"
kind = "theorem"
desc = '''§8.6.4, one-sided Jacobi: for `A : Matrix (Fin m) (Fin n) ℝ`, `p ≠ q` and a rotation
`J = J(p,q,θ)`, columns `p` and `q` of `A J` are orthogonal iff `(Jᵀ (AᵀA) J)_{pq} = 0`; the rotation
of Algorithm 8.5.1 applied to `AᵀA` achieves it. And if `A V` has orthogonal columns for an
orthogonal `V`, then `A V = U Σ` with `Σ = diag(‖(AV).col j‖)` and `U` with orthonormal nonzero
columns (the "column scaling" that finishes the SVD). ★'''
deps = ["algorithm_8_5_1_spec", "GolubVanLoan.Chapter05.givensRotation"]
source = 'Golub–Van Loan, Matrix Computations, §8.6.4'
