deps = ["LinearMap.abs_singularValues_sub_le", "Matrix.l2_opNorm_eq_iSup_singularValues", "Matrix.lpOpNorm"]
source = 'Golub–Van Loan, Matrix Computations, Corollary 8.6.2'

[[node]]
id = "equation_8_6_4"
