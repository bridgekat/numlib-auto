[[node]]
id = "orthogonalIteration_qr_step"
kind = "theorem"
desc = '''§8.2.5, the QR iteration from orthogonal iteration: for an orthogonal iteration with square
orthogonal `Q_k` and `T_k = Q_kᵀ A Q_k`, `T_{k-1} = (Q_{k-1}ᵀ Q_k) R_k` and
`T_k = R_k (Q_{k-1}ᵀ Q_k)` — `T_k` is obtained from `T_{k-1}` by one step of (8.2.1) with the QR
factorization `U_k = Q_{k-1}ᵀ Q_k`, `R_k`. The instance `𝕜 = ℝ` of chapter 7's
`GolubVanLoan.Chapter07.orthogonalIteration_qr_step` (§7.3.3), whose `Matrix.IsShiftedQrStep 0` is the
step of (8.2.1) (`equation_8_2_2`); a delegation, no second proof. ★

Blocked: an instance of chapter 7's `GolubVanLoan.Chapter07.orthogonalIteration_qr_step` (agent s07, running).'''
deps = ["GolubVanLoan.Chapter07.orthogonalIteration_qr_step", "equation_8_2_2"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.5'
