[[node]]
id = "theorem_8_2_1"
kind = "theorem"
desc = '''Theorem 8.2.1, (8.2.4): for symmetric `A`, orthogonal `Q` with `Qᵀ A Q = diagonal lam`,
`|lam 0| > |lam 1| ≥ ⋯ ≥ |lam (n-1)|` (the book's `|λ₁| > |λ₂| ≥ ⋯`; only `|lam i| ≤ |lam 1| < |lam 0|`
for `i ≥ 1` is used), a unit `q₀` with `cos θ₀ = |q₁ᵀ q₀| ≠ 0` (`q₁ = Q.col 0`), and
`q^{(k)} = (GolubVanLoan.Chapter07.powerMethod A q₀ k).1` (chapter 7's (7.3.3) at `𝕜 = ℝ`, `q₀ : EuclideanSpace ℝ (Fin n)`): for all `k`, `sin θ_k ≤ tan θ₀ * |lam 1 / lam 0| ^ k`, where
`cos θ_k = |q₁ᵀ q^{(k)}|`, `sin θ_k = √(1 - cos² θ_k)`, `tan θ₀ = sin θ₀ / cos θ₀`.
`Krylov.sinAngle_powerIterate_le_of_eigenbasis` with the orthonormal eigenbasis `Q.col`,
`i₀ = 0`, `ρ = |lam 1|`; `sinAngle` of the line `span{q₁}` at a unit vector is `√(1 - (q₁ᵀq)²)`.
★★ (bridging)

Blocked: the iterate is chapter 7's `GolubVanLoan.Chapter07.powerMethod` (README layering), not on main yet (agent s07, running); then a ~40-line bridge to `Krylov.sinAngle_powerIterate_le_of_eigenbasis`.'''
deps = ["GolubVanLoan.Chapter07.powerMethod", "Krylov.sinAngle_powerIterate_le_of_eigenbasis"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.2.1'

[[node]]
id = "theorem_8_2_1_b"
kind = "theorem"
desc = '''Theorem 8.2.1, (8.2.5): under the hypotheses of `theorem_8_2_1`, for all `k`,
`|λ^{(k)} - lam 0| ≤ (⨆ i ∈ {i | i ≠ 0}, |lam 0 - lam i|) * tan θ₀ ^ 2 * |lam 1 / lam 0| ^ (2k)`
(the book's `max_{2≤i≤n} |λ₁ - λ_i|`; stated with `Finset.sup'` over `univ.erase 0`, `n ≥ 2`).
`Krylov.abs_sub_rayleigh_powerIterate_le_of_eigenbasis` with `δ = max_{i≠0} |lam 0 - lam i|`
(`tan² θ₀ = (1 - c²)/c²`). ★★ (bridging)

Blocked: as `theorem_8_2_1` (chapter 7's `powerMethod`, agent s07).'''
deps = ["GolubVanLoan.Chapter07.powerMethod", "theorem_8_2_1", "Krylov.abs_sub_rayleigh_powerIterate_le_of_eigenbasis"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.2.1'

