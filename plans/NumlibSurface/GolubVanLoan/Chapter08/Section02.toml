namespace = "GolubVanLoan.Chapter08"
desc = '''
§8.2, power iterations for a symmetric matrix: the QR iteration (8.2.1) as an orthogonal similarity
(8.2.2), the power method (8.2.3) and Theorem 8.2.1, inverse iteration, Rayleigh quotient
iteration (8.2.6) with the two-by-two cubic recurrence (8.2.7), orthogonal iteration (8.2.8) and
Theorem 8.2.2, and the connection back to the QR iteration (§8.2.5).

The section has no numbered algorithms: the iterations are displays. The power method (8.2.3) and
orthogonal iteration (8.2.8) are **chapter 7's** (7.3.3) and (7.3.6) at `𝕜 = ℝ`:
`GolubVanLoan.Chapter07.powerMethod` and `GolubVanLoan.Chapter07.IsOrthogonalIteration` (a sequence of
the backbone's `Matrix.IsOrthogonalIterationStep`), stated over `[RCLike 𝕜]` there so that this
chapter restates nothing (surface review Medium 3; README layering). The power method is the backbone's
`Krylov.powerIterate` (`Numlib/Eigen/PowerMethod`: `‖A^k q₀‖⁻¹ A^k q₀`, satisfying (8.2.3)'s
normalize-at-each-step recurrence exactly, `Krylov.powerIterate_succ`); inverse iteration is
`Krylov.inverseIterate`; RQI is `Krylov.rayleighQuotientIterate`; orthogonal iteration is
`Krylov.orthogonalIterate` (Gram–Schmidt of `A^k Q₀`) and, as a subspace sequence,
`Krylov.subspaceIterate`. The book's QR factorizations in (8.2.1) and (8.2.8) are "a" QR
factorization at each step; the surface statements quantify over any sequence of factorizations
satisfying the recurrence, which is what the book's arguments use, and bridge to the backbone's
canonical `Matrix.qrQ`/`Matrix.qrR` where a convergence theorem is borrowed.

The dist of Theorem 8.2.2 is chapter 2's `GolubVanLoan.Chapter02.subspaceDist`, which is the
backbone's `Submodule.gap` (`‖P₁ - P₂‖₂`) of the column spaces.

Readings and errata (see the chapter report): in the proof of Theorem 8.2.1 the first displayed
sum `1 - ∑ a₁²λ₁^{2k} / (a_i²λ_i^{2k})` is garbled (the intended quotient is inverted), and the last
line uses `|λ₁ - λ_n|` where the statement has `max_{2≤i≤n} |λ₁ - λ_i|` — the statement's constant
is the one that follows from the argument and the one planned; in the proof of Theorem 8.2.2,
`V_k = Q_αᵀ Q₀` should read `Q_αᵀ Q_k` (same for `W_k`), and the penultimate bound
`d₀ · 1/(1 − d₀²)` should be `d₀ · 1/√(1 − d₀²)` (`‖V₀⁻¹‖₂ = 1/σ_min(V₀)`), as the statement
(8.2.12) has it. In (8.2.7) the signs are lost (the book writes `|c_k|³`, `|s_k|³` for quantities
whose signs alternate) and the hypothesis `c_k s_k ≠ 0` (the shift is not an eigenvalue) is
missing; the node carries both.
'''

[[node]]
id = "equation_8_2_2"
kind = "theorem"
desc = '''(8.2.1)–(8.2.2): for symmetric `A`, orthogonal `U₀`, and any sequences `U : ℕ → Matrix`,
`R : ℕ → Matrix` with `U k` orthogonal, `T 0 = U₀ᵀ A U₀`, `T k = U (k+1) * R (k+1)` and
`T (k+1) = R (k+1) * U (k+1)` (a QR step, `R (k+1)` upper triangular — not needed for this
identity), `T k = (U₀ U₁ ⋯ U_k)ᵀ A (U₀ U₁ ⋯ U_k)` (with `List.prod` of the prefix), and each
`T k` is symmetric and orthogonally similar to `A`. Induction: `T_k = U_kᵀ T_{k-1} U_k`. The
backbone's canonical iteration is `Matrix.qrIterate` with `Matrix.qrIterate_eq_conj_qrAccum`. ★'''
deps = ["Matrix.qrIterate"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.2.2)'

[[node]]
id = "theorem_8_2_1"
kind = "theorem"
desc = '''Theorem 8.2.1, (8.2.4): for symmetric `A`, orthogonal `Q` with `Qᵀ A Q = diagonal lam`,
`|lam 0| > |lam 1| ≥ ⋯ ≥ |lam (n-1)|` (the book's `|λ₁| > |λ₂| ≥ ⋯`; only `|lam i| ≤ |lam 1| < |lam 0|`
for `i ≥ 1` is used), a unit `q₀` with `cos θ₀ = |q₁ᵀ q₀| ≠ 0` (`q₁ = Q.col 0`), and
`q^{(k)} = (GolubVanLoan.Chapter07.powerMethod A q₀ k).1` (chapter 7's (7.3.3) at `𝕜 = ℝ`, `q₀ : EuclideanSpace ℝ (Fin n)`): for all `k`, `sin θ_k ≤ tan θ₀ * |lam 1 / lam 0| ^ k`, where
`cos θ_k = |q₁ᵀ q^{(k)}|`, `sin θ_k = √(1 - cos² θ_k)`, `tan θ₀ = sin θ₀ / cos θ₀`.
`Krylov.sinAngle_powerIterate_le_of_eigenbasis` with the orthonormal eigenbasis `Q.col`,
`i₀ = 0`, `ρ = |lam 1|`; `sinAngle` of the line `span{q₁}` at a unit vector is `√(1 - (q₁ᵀq)²)`.
★★ (bridging)'''
deps = ["GolubVanLoan.Chapter07.powerMethod", "Krylov.sinAngle_powerIterate_le_of_eigenbasis"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.2.1'

[[node]]
id = "theorem_8_2_1_b"
kind = "theorem"
desc = '''Theorem 8.2.1, (8.2.5): under the hypotheses of `theorem_8_2_1`, for all `k`,
`|λ^{(k)} - lam 0| ≤ (⨆ i ∈ {i | i ≠ 0}, |lam 0 - lam i|) * tan θ₀ ^ 2 * |lam 1 / lam 0| ^ (2k)`
(the book's `max_{2≤i≤n} |λ₁ - λ_i|`; stated with `Finset.sup'` over `univ.erase 0`, `n ≥ 2`).
`Krylov.abs_sub_rayleigh_powerIterate_le_of_eigenbasis` with `δ = max_{i≠0} |lam 0 - lam i|`
(`tan² θ₀ = (1 - c²)/c²`). ★★ (bridging)'''
deps = ["GolubVanLoan.Chapter07.powerMethod", "theorem_8_2_1", "Krylov.abs_sub_rayleigh_powerIterate_le_of_eigenbasis"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.2.1'

[[node]]
id = "powerMethod_residual_bound"
kind = "theorem"
desc = '''§8.2.1, after Theorem 8.2.1 (computable error bound): for symmetric `A` and any unit `q`
with `‖A q - (qᵀ A q) q‖₂ = δ`, there is `λ ∈ spectrum ℝ A` with `|qᵀ A q - λ| ≤ √2 δ`. The
case `r = 1` of Theorem 8.1.13 (`Q₁ = q`, `S = qᵀAq`), through its unpaired corollary
`theorem_8_1_13_weak`; applied to `q = q^{(k)}`, `λ^{(k)}`. ★'''
deps = ["theorem_8_1_13_weak"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.1'

[[node]]
id = "inverseIteration_expansion"
kind = "theorem"
desc = '''§8.2.2, the expansion behind inverse iteration: for symmetric `A`, an orthonormal eigenbasis
`q_i` (`A q_i = λ_i q_i`), `x = ∑ a_i q_i` and `λ ∉ spectrum ℝ A`,
`(A - λ I)⁻¹ x = ∑ i, (a_i / (λ_i - λ)) • q_i`. Inverse iteration itself is the power method
applied to `(A - λ I)⁻¹` (`Krylov.inverseIterate`, with `Krylov.inverseIterate_eq_powerIterate`),
whose convergence theorem is `Krylov.tendsto_smul_inverseIterate`. ★'''
deps = ["Krylov.inverseIterate"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.2'

[[node]]
id = "rayleighQuotient_isMinOn"
kind = "theorem"
desc = '''§8.2.3: for any `A : Matrix (Fin n) (Fin n) ℝ` and `x ≠ 0`, the Rayleigh quotient
`r(x) = xᵀAx / xᵀx` minimizes `λ ↦ ‖(A - λ I) x‖₂` over `ℝ`:
`IsMinOn (fun λ => ‖(A - λ • 1) *ᵥ x‖) univ (rayleighQuotient A x)` (norm in `EuclideanSpace`).
`‖A x - λ x‖² = ‖A x‖² - 2 λ xᵀAx + λ² xᵀx`, a quadratic in `λ` with leading coefficient
`xᵀx > 0`. (The book says "a simple differentiation"; see also Theorem 8.1.14 with `r = 1`.) ★'''
deps = ["rayleighQuotient"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.3'

[[node]]
id = "rayleighQuotientIteration"
kind = "definition"
desc = '''Rayleigh quotient iteration (8.2.6): for symmetric `A` and `x₀ ≠ 0`,
`μ_k = r(x_k)`, `z_{k+1} = (A - μ_k I)⁻¹ x_k`, `x_{k+1} = z_{k+1} / ‖z_{k+1}‖₂`; defined with
`Matrix.inv` (total: a singular shift gives the Lean junk value `0`, the theorems carry the
hypothesis). Bridge `rayleighQuotientIteration_eq`: for a unit `x₀` it is
`Krylov.rayleighQuotientIterate (toEuclideanLin A) x₀` (`Krylov.rqiStep`: inverse iteration with
the Rayleigh shift, normalized). ★'''
deps = ["rayleighQuotient", "Krylov.rayleighQuotientIterate", "Krylov.rqiStep"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.2.6)'

[[node]]
id = "equation_8_2_7"
kind = "theorem"
desc = '''(8.2.7), RQI on `A = diag(λ₁, λ₂)` with `λ₁ > λ₂`: if `x_k = (c_k, s_k)` with
`c_k² + s_k² = 1` and `c_k s_k ≠ 0` (hypothesis the book omits: otherwise `μ_k` is an eigenvalue and
`A - μ_k I` is singular), then `μ_k = λ₁ c_k² + λ₂ s_k²`,
`z_{k+1} = (1/(λ₁ - λ₂)) (c_k / s_k², -s_k / c_k²)`, and
`x_{k+1} = (c_k³, -s_k³) / √(c_k⁶ + s_k⁶)`; in particular `|c_{k+1}| = |c_k|³ / √(c_k⁶ + s_k⁶)` and
`|s_{k+1}| = |s_k|³ / √(c_k⁶ + s_k⁶)` (the book prints these with the absolute values only, losing the
sign `-` of the second component). Direct computation with `!![λ₁, 0; 0, λ₂]` (`Matrix.inv_diagonal`),
`field_simp`, and `√(c²/s⁴ + s²/c⁴) = √(c⁶ + s⁶)/(c² s²)`. P8.2.2. ★★'''
deps = ["rayleighQuotientIteration"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.2.7)'

[[node]]
id = "equation_8_2_7_cubic"
kind = "theorem"
desc = '''§8.2.3, after (8.2.7): cubic convergence for `n = 2` — with the notation of `equation_8_2_7`
and `c₀ s₀ ≠ 0`, `|c₀| ≠ |s₀|`, the ratios satisfy `|s_k / c_k| = |s₀ / c₀| ^ (3 ^ k)` for all `k`
(so `x_k → span{e₁}` if `|c₀| > |s₀|` and `→ span{e₂}` if `|c₀| < |s₀|`, cubically; each `c_k s_k ≠ 0`
persists). Induction on `equation_8_2_7`: `|s_{k+1}/c_{k+1}| = |s_k/c_k|³`. The case `|c₀| = |s₀|`
the book excludes is a fixed point of the ratio (no convergence). ★'''
deps = ["equation_8_2_7"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.3'

[[node]]
id = "equation_8_2_13"
kind = "theorem"
desc = '''(8.2.13)–(8.2.14): with the Schur decomposition (8.2.9)–(8.2.10) `Q = fromCols Q_α Q_β`,
`Qᵀ A Q = fromBlocks D₁ 0 0 D₂`, and `V_k = Q_αᵀ Q_k`, `W_k = Q_βᵀ Q_k` (the book prints `Q₀` in
both definitions; `Q_k` is meant), an orthogonal iteration
(`GolubVanLoan.Chapter07.IsOrthogonalIteration A Q` at `ℝ`) with triangular factors `R_k` of its steps
(`A Q_{k-1} = Q_k R_k`, chosen from `Matrix.IsOrthogonalIterationStep`) satisfies
`D₁^k V₀ = V_k (R_k ⋯ R₁)` and `D₂^k W₀ = W_k (R_k ⋯ R₁)`. Multiply `A^k Q₀ = Q_k (R_k ⋯ R_1)` (`GolubVanLoan.Chapter07.orthogonalIteration_range`) by
`Q_αᵀ`, `Q_βᵀ`, using `Q_αᵀ A = D₁ Q_αᵀ`. ★'''
deps = ["GolubVanLoan.Chapter07.orthogonalIteration", "GolubVanLoan.Chapter07.orthogonalIteration_range", "Matrix.IsOrthogonalIterationStep"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.2.13)'

[[node]]
id = "theorem_8_2_2"
kind = "theorem"
desc = '''Theorem 8.2.2: let `A` be symmetric with Schur decomposition (8.2.9)–(8.2.10)
(`Q = fromCols Q_α Q_β` orthogonal, `Qᵀ A Q = diagonal lam` with `|lam 0| ≥ ⋯ ≥ |lam (n-1)|`,
`n ≥ 2`, `r` columns in `Q_α`), `|lam (r-1)| > |lam r|` ((8.2.9) and the book's `|λ_r| > |λ_{r+1}|`),
`D_r(A) = range Q_α`, and `GolubVanLoan.Chapter07.IsOrthogonalIteration A Q'` (chapter 7's (7.3.6) at `ℝ`) with
`d_k = GolubVanLoan.Chapter02.subspaceDist D_r(A) (range (Q' k))` (`= Submodule.gap`).
If `d₀ < 1` ((8.2.11)) then for all `k`,
`d_k ≤ |lam r / lam (r-1)| ^ k * (d₀ / √(1 - d₀ ^ 2))` ((8.2.12)).
`LinearMap.IsSymmetric.gap_subspaceIterate_le` (now in `Numlib/Eigen/InvariantSubspace`, a ★★ backbone node through
`Submodule.gap_graph`) with `J = {i | i < r}`, `ρ = |lam (r-1)|`,
`r' = |lam r|`, after `GolubVanLoan.Chapter07.orthogonalIteration_range` (`A^k Q'₀` has full column rank: `A` is invertible
on `D_r(A)` and `d₀ < 1` makes `P_{D_r}` injective on `range Q'₀`; the book's argument through
(8.2.13) and `σ_min(V₀)² = 1 - d₀²`, which is chapter 2's thin CS decomposition, is replaced by the
backbone's graph argument). ★★ (bridging, ~80 lines)'''
deps = ["GolubVanLoan.Chapter07.orthogonalIteration", "GolubVanLoan.Chapter07.orthogonalIteration_range", "equation_8_2_13", "LinearMap.IsSymmetric.gap_subspaceIterate_le", "GolubVanLoan.Chapter02.subspaceDist"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.2.2'

[[node]]
id = "orthogonalIteration_gap_le_of_forall"
kind = "theorem"
desc = '''§8.2.5, (8.2.15): for symmetric `A` with `|lam 0| > |lam 1| > ⋯ > |lam (n-1)|` and an
orthogonal iteration with square `Q'₀` (`r = n`), if
`dist(D_i(A), span{q^{(0)}_1, …, q^{(0)}_i}) < 1` for `i = 1:n-1` then for each such `i`
`dist(span{q^{(k)}_1,…,q^{(k)}_i}, span{q_1,…,q_i}) ≤ C_i |lam i / lam (i-1)|^k` with the explicit
`C_i = d₀^{(i)}/√(1 - (d₀^{(i)})²)` — the book's `O(|λ_{i+1}/λ_i|^k)`. `theorem_8_2_2` applied to
the leading `i` columns, which form an orthogonal iteration of their own (upper triangularity of
`R_k`). ★'''
deps = ["theorem_8_2_2"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.5'

[[node]]
id = "qrIterate_tendsto_diagonal"
kind = "theorem"
desc = '''§8.2.5: "the matrices `T_k = Q_kᵀ A Q_k` converge to diagonal form". For symmetric
`A : Matrix (Fin n) (Fin n) ℝ` with eigenvalues of distinct moduli `|λ_1| > ⋯ > |λ_n| > 0` and
the general-position hypothesis (every leading principal minor of `Qᵀ` nonzero, `Q` an eigenvector
matrix — equivalent to (8.2.15) for `Q₀ = I`), the QR iterates `Matrix.qrIterate A k` converge
to `diagonal lam`: off-diagonal entries `→ 0`, diagonal entries `→ lam i` in order.
`Matrix.tendsto_qrIterate` (triangular limit) with `Matrix.isHermitian_qrIterate` (symmetric
iterates, so the strictly upper part tends to `0` as well); the equivalence of the hypotheses is
`Matrix.forall_isLowerSet_disjoint_iff_isUnit_leadingPrincipal`. ★★'''
deps = ["Matrix.tendsto_qrIterate", "Matrix.isHermitian_qrIterate", "Matrix.forall_isLowerSet_disjoint_iff_isUnit_leadingPrincipal", "Matrix.qrIterate"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.5'

[[node]]
id = "orthogonalIteration_qr_step"
kind = "theorem"
desc = '''§8.2.5, the QR iteration from orthogonal iteration: for an orthogonal iteration with square
orthogonal `Q_k` and `T_k = Q_kᵀ A Q_k`, `T_{k-1} = (Q_{k-1}ᵀ Q_k) R_k` and
`T_k = R_k (Q_{k-1}ᵀ Q_k)` — `T_k` is obtained from `T_{k-1}` by one step of (8.2.1) with the QR
factorization `U_k = Q_{k-1}ᵀ Q_k`, `R_k`. The instance `𝕜 = ℝ` of chapter 7's
`GolubVanLoan.Chapter07.orthogonalIteration_qr_step` (§7.3.3), whose `Matrix.IsShiftedQrStep 0` is the
step of (8.2.1) (`equation_8_2_2`); a delegation, no second proof. ★'''
deps = ["GolubVanLoan.Chapter07.orthogonalIteration_qr_step", "equation_8_2_2"]
source = 'Golub–Van Loan, Matrix Computations, §8.2.5'
