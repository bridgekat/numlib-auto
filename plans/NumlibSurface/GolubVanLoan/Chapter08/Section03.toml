[[node]]
id = "tridiagonal_spectrum_split"
kind = "theorem"
desc = '''§8.3.1, after Algorithm 8.3.1: if `T` is tridiagonal and `t_{k+1,k} = 0` (and, `T`
symmetric, `t_{k,k+1} = 0`), then `T` is block diagonal and
`λ(T) = λ(T(1:k,1:k)) ∪ λ(T(k+1:n,k+1:n))`, with multiplicity:
`T.charpoly = (T.submatrix (Fin.castLE _) (Fin.castLE _)).charpoly * (T.submatrix (Fin.natAdd k) (Fin.natAdd k)).charpoly`
(`n = k + l` reindexing through `finSumFinEquiv`, `Matrix.charpoly_fromBlocks_zero₁₂`). ★'''
deps = ["Matrix.IsTridiagonal"]
