[[node]]
id = "ritzAcceleration_residual"
kind = "theorem"
desc = '''§8.3.7: for a Ritz-accelerated iteration, `‖A Q_k - Q_k D_k‖_F = ‖A Q̃_k - Q̃_k S_k‖_F`, which is
`min_S ‖A Q̃_k - Q̃_k S‖_F` (Theorem 8.1.14) — the columns of `Q_k` are the best basis for the
residual. Right multiplication by the orthogonal `U_k` preserves the Frobenius norm. The book's
rate `|θ_i^{(k)} - λ_i(A)| = O(|λ_{r+1}/λ_i|^k)` is quoted from Stewart (1969) without proof and is
not a node. ★'''
deps = ["ritzAcceleration", "theorem_8_1_14"]
source = 'Golub–Van Loan, Matrix Computations, §8.3.7'
