[[node]]
id = "theorem_8_3_1"
kind = "theorem"
desc = '''Theorem 8.3.1: if `Qᵀ A Q = T` is a tridiagonal decomposition of symmetric `A` (`Q`
orthogonal, `T` tridiagonal) and `K = Matrix.krylovMatrix A (Q.col 0) n` (columns `A^j q₁`,
`j = 0, …, n-1`; chapter 7's Krylov matrix `K(A, v, k)` of §7.4, `GolubVanLoan.Chapter07.krylovMatrix`, with
`Matrix.conjTranspose_mul_krylovMatrix` for `Qᵀ K = K(QᵀAQ, e₁, n)`), then `R = Qᵀ K` is upper
triangular with `r₁₁ = 1` and `r_ii = t₂₁ t₃₂ ⋯ t_{i,i-1}`; if `R` is nonsingular `T` is unreduced;
if `R` is singular and `k` is the least index with `r_kk = 0`, then `k ≥ 2` and `k` is the least
index with `t_{k,k-1} = 0`. Proof as in the book: `Qᵀ K = [e₁ | T e₁ | ⋯ | T^{n-1} e₁]`, and
`T^j e₁` is supported on `{0, …, j}` with `j`-th entry `∏_{i<j} t_{i+1,i}` (induction, tridiagonal).
Chapter 7's Theorem 7.4.3 is the unreduced-iff-nonsingular half for Hessenberg matrices.
★★ (~100 lines)'''
deps = ["IsUnreducedTridiagonal", "GolubVanLoan.Chapter07.krylovMatrix", "Matrix.conjTranspose_mul_krylovMatrix", "GolubVanLoan.Chapter07.theorem_7_4_3"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.3.1'

[[node]]
id = "theorem_8_3_2"
kind = "theorem"
desc = '''Theorem 8.3.2 (implicit Q theorem, tridiagonal form): for symmetric `A`, orthogonal `Q`,
`V` with `Qᵀ A Q = T`, `Vᵀ A V = S` both tridiagonal, `k` the least positive integer with
`t_{k+1,k} = 0` (`k = n` if `T` is unreduced), and `Q.col 0 = V.col 0`: `V.col i = ± Q.col i` and
`|t_{i,i-1}| = |s_{i,i-1}|` for `i = 2:k`, and if `k < n` then `s_{k+1,k} = 0`. Chapter 7's
Theorem 7.4.2 (implicit Q, Hessenberg form: its restatement `GolubVanLoan.Chapter07.theorem_7_4_2`,
not the backbone it delegates to — README layering) applied to the tridiagonal (hence upper Hessenberg, `Matrix.IsTridiagonal.isUpperHessenberg`)
`T`, `S`. The book's proof via Theorem 8.3.1 and the uniqueness of the thin QR factorization is
equivalent. ★'''
deps = ["IsUnreducedTridiagonal", "GolubVanLoan.Chapter07.theorem_7_4_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.3.2'

[[node]]
id = "qr_tridiagonal_preservation"
kind = "theorem"
desc = '''§8.3.3, preservation of form: if `T` is symmetric tridiagonal and `T = Q R` is a QR
factorization (`Q` orthogonal, `R` upper triangular) then — provided `T` is nonsingular, or `Q` is
the Givens QR `Matrix.hessenbergGivensQR` — `Q` has lower bandwidth `1`
(`Matrix.HasLowerBandwidth Q 1`), `R` has upper bandwidth `2` (`Matrix.HasUpperBandwidth R 2`), and
`T₊ = R Q = Qᵀ T Q` is symmetric tridiagonal. The nonsingular case: `Q = T R⁻¹` is Hessenberg
(`Matrix.IsUpperHessenberg.mul_isUpperTriangular`), `R = Qᵀ T` has upper bandwidth 2 (product of
bandwidths, `Matrix.HasUpperBandwidth.mul`), `RQ` is Hessenberg and symmetric hence tridiagonal
(`Matrix.IsUpperHessenberg.isTridiagonal_of_isSymm`). The Givens case from
`Matrix.hessenbergGivensQR_spec`. For singular `T` and an arbitrary QR the claim is false
(`T = 0`). ★★'''
deps = ["Matrix.HasLowerBandwidth", "Matrix.HasUpperBandwidth", "Matrix.hessenbergGivensQR", "Matrix.hessenbergGivensQR_spec", "Matrix.IsTridiagonal"]
source = 'Golub–Van Loan, Matrix Computations, §8.3.3'

[[node]]
id = "shifted_qr_tridiagonal"
kind = "theorem"
desc = '''§8.3.3, shifts: for symmetric tridiagonal `T`, `s : ℝ` and a QR factorization
`T - s I = Q R` (with `T - s I` nonsingular or `Q` the Givens QR),
`T₊ = R Q + s I = Qᵀ T Q` is symmetric tridiagonal. `qr_tridiagonal_preservation` for `T - s I`,
and `R Q + s I = Qᵀ (T - s I) Q + s I = Qᵀ T Q` (`Matrix.shiftedQrStep_eq_conj` for the canonical
factorization). ★'''
deps = ["qr_tridiagonal_preservation", "Matrix.shiftedQrStep_eq_conj"]
source = 'Golub–Van Loan, Matrix Computations, §8.3.3'

[[node]]
id = "perfect_shift"
kind = "theorem"
desc = '''§8.3.3, perfect shifts: if `T` is symmetric tridiagonal and unreduced, then for every `s`
the first `n - 1` columns of `T - s I` are linearly independent; if moreover `s ∈ spectrum ℝ T` and
`Q R = T - s I` is any QR factorization, then `r_nn = 0` and the last column of `T₊ = R Q + s I` is
`s e_n`. Independence is chapter 7's `Matrix.IsUnreducedUpperHessenberg.linearIndependent_init_cols`
(with `IsUnreducedUpperHessenberg.sub_smul_one`). Then `R(1:n-1,1:n-1)` is nonsingular (`Q`
orthogonal), `det (T - s I) = 0` forces `r_nn = 0`, the last row of `R` vanishes, so the last row of
`R Q` does, and `T₊` is symmetric. ★★'''
deps = ["IsUnreducedTridiagonal", "Matrix.IsUnreducedUpperHessenberg.linearIndependent_init_cols", "Matrix.IsUnreducedUpperHessenberg.sub_smul_one"]
source = 'Golub–Van Loan, Matrix Computations, §8.3.3'

[[node]]
id = "wilkinsonShift"
kind = "definition"
desc = '''The Wilkinson shift (8.3.3) of a matrix `T : Matrix (Fin (N + 2)) (Fin (N + 2)) ℝ` with
`a_n = T (last) (last)`, `a_{n-1}`, `b_{n-1} = T (last) (last - 1)`:
`wilkinsonShift T := a_n + d - sgn d * √(d² + b_{n-1}²)` with `d = (a_{n-1} - a_n)/2` and
`sgn d = if 0 ≤ d then 1 else -1` (the book's `sign`, with `sign(0) = 1`: see the section
description). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (8.3.3)'

[[node]]
id = "equation_8_3_3"
kind = "theorem"
desc = '''(8.3.3): `wilkinsonShift T` is the eigenvalue of the trailing `2 × 2` block
`!![a_{n-1}, b_{n-1}; b_{n-1}, a_n]` closer to `a_n` (a root of `(λ - a_{n-1})(λ - a_n) - b² = 0`,
and `|μ - a_n| ≤ |μ' - a_n|` for the other root `μ'`), and it equals Algorithm 8.3.2's form
`a_n - b² / (d + sgn d * √(d² + b²))` (rationalize; the denominator vanishes only when `d = b = 0`,
where both read `a_n`). ★★'''
deps = ["wilkinsonShift"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.3.3)'

