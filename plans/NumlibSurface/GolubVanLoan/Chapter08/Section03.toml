[[node]]
id = "algorithm_8_3_1"
kind = "definition"
desc = '''Algorithm 8.3.1 (Householder tridiagonalization), per the conventions: `noncomputable def
algorithm_8_3_1 {M} [Monad M] (rnd : ℝ → M ℝ) {n : ℕ} (A : Matrix (Fin n) (Fin n) ℝ) :
M (Matrix (Fin n) (Fin n) ℝ × List ((Fin n → ℝ) × ℝ))`, the second component the reflector data
`(v_k, β_k)` as `house` returned them (the book's "factored form", needed by Algorithm 8.3.3 to form
`Q`; convention 13). For `k = 0, …, n-3` (book `k = 1:n-2`), with `T_k = [k+1, …, n-1]` the tail index
list (convention 10): `(v, β) ← GolubVanLoan.Chapter05.houseOn rnd T_k (A.col k)` (`v` zero off `T_k`,
`1` at `k+1`, `P x = ‖x‖₂ e_{k+1}`); for `i ∈ T_k`: `p_i ← rnd (β * s_i)` with
`s_i ← Algorithm 1.1.1 over T_k` of `A(i, ·)` and `v` (a dot product from `0`: `FloatingPoint.dotAccum rnd T_k _ _ 0`, Algorithm 1.1.1 over the list);
`s ← Algorithm 1.1.1 over
T_k` of `p` and `v`; `h ← rnd (rnd (β * s) / 2)`; `w_i ← rnd (p_i - rnd (h * v_i))`;
`ν ← rnd (√ (Algorithm 1.1.1 over T_k of A(·, k) with itself))` — **the fresh norm**, and
`A(k+1, k) = A(k, k+1) ← ν` (a copy); then for `i, j ∈ T_k` with `i ≥ j` (the lower triangle only, as
the book says): `A i j ← rnd (rnd (A i j - rnd (v_i * w_j)) - rnd (w_i * v_j))`, and `A j i ← A i j`
(a copy); append `(v, β)`. The program is `noncomputable`. ★★ (writing it)'''
deps = ["GolubVanLoan.Chapter05.houseOn", "GolubVanLoan.Chapter05.algorithm_5_1_1", "GolubVanLoan.Chapter01.algorithm_1_1_1", "FloatingPoint.dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.1'

[[node]]
id = "algorithm_8_3_1_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.3.1: for symmetric `A` and `(A', data) := Id.run
(algorithm_8_3_1 pure A)`, with `Q = GolubVanLoan.Chapter05.householderProduct data`
(`= P_0 ⋯ P_{n-3}`, `P_k = 1 - β_k v_k v_kᵀ` from the **returned** `β_k`, acting on coordinates `≥ k+1`):
`Q` is orthogonal with `Q e₁ = e₁`, `T := Qᵀ A Q` is symmetric tridiagonal, and `A'` agrees with `T` on
the band (`∀ i j, (i : ℕ) ≤ j + 1 → (j : ℕ) ≤ i + 1 → A' i j = T i j`; the entries outside the band are
the untouched `A_k(k+2:n, k)`). Loop invariant after step `k`: the current matrix equals
`(P_0⋯P_k)ᵀ A (P_0⋯P_k)` on rows/columns `≥ k+1` and on the band of the first `k + 1` columns, is
symmetric (lower triangle computed and mirrored), and is tridiagonal through column `k` (the book's
`A_{k-1}` display). Uses chapter 5's `houseOn_spec` (`P x = ‖x‖₂ e₁`, which is what makes the fresh
norm the exact subdiagonal entry), `householder_conj_eq_sub_rankTwo`, chapter 1's
`algorithm_1_1_1_spec`. Convention 11: the bare statement `band A' = Qᵀ A Q` for some orthogonal `Q`
is `algorithm_8_3_1_rounding` at `FloatingPoint.RoundingModel.exact` (`E = 0`); the identification
`Q = householderProduct data` with `Q e₁ = e₁` needs the invariant. ★★★ (~300 lines)'''
deps = ["algorithm_8_3_1", "householder_conj_eq_sub_rankTwo", "equation_8_3_1", "GolubVanLoan.Chapter05.houseOn_spec", "GolubVanLoan.Chapter05.householderProduct", "GolubVanLoan.Chapter01.algorithm_1_1_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.1'

[[node]]
id = "algorithm_8_3_1_rounds"
kind = "theorem"
desc = '''The bridge of Algorithm 8.3.1 (convention 12): for `fp : FloatingPoint.RoundingModel ℝ` with
`fp.IsIdempotent` (the dot products `p̂`, `ŝ` and the norm all start from `0`, and `RoundsDot` starts
from the unrounded first term — convention 6; algo review H1(c)) and `((18 n + 31 : ℕ) : ℝ) * fp.u < 1`,
for symmetric `A`, every run `(A', data) ∈ (algorithm_8_3_1 fp.round A).run` has a sequence `Â` with
`Â (n - 2)` the band of `A'` (entries outside the band `0`) and
`FloatingPoint.RoundsTridiagonalizePert fp (18 n + 31) A Â` — `Â k` is the run's array after `k` steps
with the entries outside the band of the reduced columns set to `0` (never read again). Per step, on
the subtype `T_k`: `GolubVanLoan.Chapter05.houseOn_rounds` gives `RoundsHouseholderVectorParlett` for
