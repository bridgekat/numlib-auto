kind = "theorem"
desc = '''§8.3.1, the symmetric update: for symmetric `B`, `P̃ = I - β v vᵀ` (any `β`, in particular
`β = 2 / vᵀv`), `p = β B v` and `w = p - (β pᵀv / 2) v`, `P̃ B P̃ = B - v wᵀ - w vᵀ`.
`Matrix.conj_one_sub_smul_vecMulVec_eq_sub` at `ℝ` (stated over a `StarRing` with `Bᴴ = B`, `star β = β`; at `ℝ` the
`star`s vanish by `star_trivial`, and `β = 0` is allowed). ★'''
deps = ["Matrix.conj_one_sub_smul_vecMulVec_eq_sub"]
