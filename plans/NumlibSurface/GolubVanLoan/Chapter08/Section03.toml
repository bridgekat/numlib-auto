[[node]]
id = "algorithm_8_3_2"
kind = "definition"
desc = '''Algorithm 8.3.2 (implicit symmetric QR step with Wilkinson shift), per the conventions, on a window
`w = [w₀, …, w_{N-1}]` of consecutive indices (the book's step is `w = List.finRange n`; Algorithm 8.3.3
runs it on its unreduced block): `algorithm_8_3_2 rnd (w : List (Fin n)) (T Q : Matrix (Fin n) (Fin n) ℝ) :
M (Matrix × Matrix)` returning `(Zᵀ T Z, Q Z)` (`Z` the identity off `w`; the book's optional
accumulation `Q ← Q G₁ ⋯ G_{N-1}`, needed by Algorithm 8.3.3). With `t` the entries of `T` on `w`:
`d ← fl(fl(t_{N-1,N-1} - t_NN) / 2)`; `μ ← fl(t_NN - fl(fl(t²_{N,N-1}) / fl(d + sgn(d) · fl(√(fl(fl(d²) +
fl(t²_{N,N-1})))))))` (every `+ − × / √` rounded; `sgn(d) · (·)` a copy or negation on the computed `d`,
exact — convention 1); `x ← fl(t₁₁ - μ)`, `z ← t₂₁`; for `k = 1:N-1`: `(c, s) ← givens(x, z)` (chapter 5's
`algorithm_5_1_3`); `T ← G_kᵀ T G_k` with `G_k = GolubVanLoan.Chapter05.givensRotation w_{k-1} w_k c s`
(`givensApplyLeft rnd w_{k-1} w_k c s w T` then `givensApplyRight rnd w_{k-1} w_k c s w T`, rows then
columns over the window); `Q ← Q G_k` (`givensApplyRight`, all rows); if `k < N-1`: `x ← t_{k+1,k}`,
`z ← t_{k+2,k}` (copies). For `N ≤ 1` it returns `(T, Q)`. ★★

Blocked: calls chapter 5's shared helpers `GolubVanLoan.Chapter05.givensRotation`/`givensApplyLeft`/`givensApplyRight` (+ `_spec`), which are not on main yet (chapter 5 surface, agent s05, running) and chapter 5's `algorithm_5_1_3`.'''
deps = ["wilkinsonShift", "GolubVanLoan.Chapter05.algorithm_5_1_3", "GolubVanLoan.Chapter05.givensApplyLeft", "GolubVanLoan.Chapter05.givensApplyRight", "GolubVanLoan.Chapter05.givensRotation"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.2'

[[node]]
id = "algorithm_8_3_2_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.3.2: for an unreduced symmetric tridiagonal `T` (`n ≥ 2`),
any `Q`, and `(T', Q') := Id.run (algorithm_8_3_2 pure (List.finRange n) T Q)`, with `μ = wilkinsonShift T`: there is
`Z` orthogonal (a product of `n - 1` rotations `GolubVanLoan.Chapter05.givensRotation k (k+1) c_k s_k`) with `T' = Zᵀ T Z`,
`Q' = Q Z`, `T'` symmetric tridiagonal, `Z e₁ = G₁ e₁` parallel to `(T - μ I) e₁` (the book's
`Z e₁ = U e₁`), and `Zᵀ (T - μ I)` upper triangular (the book's claim). Consequently, when
`T - μ I` is nonsingular, `T' = D (Matrix.shiftedQrStep μ T) D` for a diagonal `D` with entries
`±1` — the implicit step equals the explicit one up to signs. Proof: loop invariant — after step
`k` the current matrix is tridiagonal except for one bulge at `(k+2, k)` (`bulgeChase_step`), `x, z`
are its `(k+1,k)`, `(k+2,k)` entries; at the end `T'` is tridiagonal; the first rotation's first
column is `(t₁₁ - μ, t₂₁)/r`. Upper triangularity of `Zᵀ(T - μ I)` and the sign relation from the
implicit Q theorem (`theorem_8_3_2`) against the QR factorization of `T - μ I`, whose `QᵀTQ` is
unreduced in its first `n - 1` subdiagonal entries (`T` unreduced; the last may vanish, and then
`v_n = ± q_n` by orthogonality). Window form (what Algorithm 8.3.3 uses): for a window on which `T`
is an unreduced symmetric tridiagonal block decoupled from the rest, the same for that block, `Z` the
identity off the window. Uses chapter 5's `algorithm_5_1_3_spec`, `givensApplyLeft_spec`,
`givensApplyRight_spec`. ★★★ (~400 lines)

Blocked: on `algorithm_8_3_2` and `theorem_8_3_2` (both blocked).'''
deps = ["algorithm_8_3_2", "bulgeChase_step", "theorem_8_3_2", "equation_8_3_3", "IsUnreducedTridiagonal", "Matrix.shiftedQrStep", "GolubVanLoan.Chapter05.algorithm_5_1_3_spec", "GolubVanLoan.Chapter05.givensApplyLeft_spec", "GolubVanLoan.Chapter05.givensApplyRight_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.2'

[[node]]
id = "algorithm_8_3_3"
kind = "definition"
desc = '''Algorithm 8.3.3 (symmetric QR algorithm), per the conventions with `fuel` last:
`algorithm_8_3_3 rnd (tol : ℝ) (A : Matrix (Fin n) (Fin n) ℝ) (fuel : ℕ) : M (Matrix × Matrix)`
returning `(D, Q)`. `(A', data) ← algorithm_8_3_1 rnd A`; `D ←` the band of `A'` (the out-of-band
entries set to `0`); `Q ← GolubVanLoan.Chapter05.forwardAccumulation rnd data` (§5.1.6's forward
accumulation of the **returned** reflector data, never rebuilt). Then at most `fuel` times: for
`i = 1:n-1`, set `d_{i+1,i} = d_{i,i+1} = 0` if `|d_{i+1,i}| ≤ fl(tol · fl(|d_ii| + |d_{i+1,i+1}|))`
(the right side rounded, `|·|` and the comparison exact — convention 1); find the largest `q` and
smallest `p` with `D₃₃` (last `q`) diagonal and `D₂₂` unreduced (pure index computation, exact); if
`q = n` stop; else apply `algorithm_8_3_2` to the window `w = [p, …, n-q-1]` of `D` with the
accumulator `Q` (its columns `w`). ★★

Blocked: calls `algorithm_8_3_1`, `algorithm_8_3_2` and chapter 5's `forwardAccumulation` (agent s05).'''
deps = ["algorithm_8_3_1", "algorithm_8_3_2", "GolubVanLoan.Chapter05.forwardAccumulation"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.3'

[[node]]
id = "algorithm_8_3_3_spec"
kind = "theorem"
desc = '''Exact semantics of Algorithm 8.3.3 (an "approximate symmetric Schur decomposition"): for
symmetric `A`, `0 ≤ tol`, any `fuel`, `(D, Q) := Id.run (algorithm_8_3_3 pure tol A fuel)`: `Q` is
orthogonal, `D` is symmetric tridiagonal, and `Qᵀ A Q = D + E` with `E` symmetric tridiagonal with
zero diagonal, nonzero only at deflated positions, and
`‖E‖_F ≤ c tol ‖A‖_F / (1 - c tol)` for `c = 2 √(2 (n - 1))` whenever `c tol < 1` (each deflated
entry is `≤ tol (|d_ii| + |d_{i+1,i+1}|) ≤ 2 tol ‖T_j‖_F` for the iterate `T_j = Q_jᵀ A Q_j - E_j`
at that time, and `‖E_j‖_F ≤ ‖E‖_F`); if the loop stopped before the fuel ran out (`q = n`), `D` is
diagonal. Invariants from `algorithm_8_3_1_spec` with `GolubVanLoan.Chapter05.forwardAccumulation_spec`
(`Q₀ = householderProduct data`) and the window form of `algorithm_8_3_2_spec` on the unreduced block
(`Z` the identity off the window, i.e. `diag(I_p, Z, I_q)`), and the deflation bookkeeping. Convergence (that
some finite fuel suffices) is Wilkinson's theorem and is not claimed. ★★★ (~350 lines)

Blocked: on `algorithm_8_3_3` (blocked).'''
deps = ["algorithm_8_3_3", "algorithm_8_3_1_spec", "GolubVanLoan.Chapter05.forwardAccumulation_spec", "algorithm_8_3_2_spec", "tridiagonal_spectrum_split"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 8.3.3'

