namespace = "GolubVanLoan.Chapter08"
desc = '''
§8.3, the symmetric QR algorithm: Householder tridiagonalization (Algorithm 8.3.1) with its
rounding-error bound, the Krylov-matrix and implicit-Q theorems for the tridiagonal decomposition
(Theorems 8.3.1–8.3.2), the four facts of §8.3.3, the explicit shifted iteration (8.3.2) with the
Wilkinson shift (8.3.3), the implicit (bulge-chasing) step (Algorithm 8.3.2), the symmetric QR
algorithm (Algorithm 8.3.3), the Rayleigh-quotient connection (§8.3.6) and orthogonal iteration
with Ritz acceleration ((8.3.6), §8.3.7).

Algorithms: the numbered conventions of `NumlibSurface/GolubVanLoan` (monadic programs with a rounding
hook `rnd : ℝ → M ℝ`, every `+ − × / √` result rounded — including the right side of a deflation
test — and negation, `|·|`, `sign`, copies and comparisons exact; `noncomputable`; loops `List.foldlM`
over `List.finRange` or index lists; `while` loops over `List.range fuel` with a `done` flag, `fuel`
the last argument), shaped as in the prototype `notes/gvl/ch08/proto/Jacobi.lean`. Every update calls
chapter 5's shared helpers on index lists (convention 13): `house` is
`GolubVanLoan.Chapter05.houseOn rnd o x` on the tail index list (`P x = ‖x‖₂ e_{pivot}`, `v = 1` at the
pivot, `v` zero off `o`), `givens` is `GolubVanLoan.Chapter05.algorithm_5_1_3`
(`[c s; -s c]ᵀ [a; b] = [r; 0]`), a rotation `G(i, k, θ)` of the book is
`GolubVanLoan.Chapter05.givensRotation i k c s` (`= Matrix.planeRotation i k c (-s)`), applied by
`givensApplyLeft`/`givensApplyRight`; Householder data are `List ((Fin n → ℝ) × ℝ)` with the returned
`β`. Tridiagonal matrices are stored as full `Matrix (Fin n) (Fin n) ℝ` (the book's remark that a
practical code stores two vectors is a storage scheme, not formalized); the unreduced block `D₂₂` of
Algorithm 8.3.3 is a **window** `w` of consecutive indices of the full matrix on which Algorithm 8.3.2
runs (convention 10), not an extracted `Matrix.submatrix` copy.

Specifications (D5): `Matrix.IsTridiagonal`, orthogonal similarity, `Matrix.shiftedQrStep` (the
backbone's explicit shifted QR step, `Numlib/Eigen/QRAlgorithm`) and chapter 7's implicit Q
theorem (`GolubVanLoan.Chapter07.theorem_7_4_2`; backbone `Matrix.implicitQ_of_apply_eq_zero_real`
in `Numlib/LinearAlgebra/Matrix/KrylovDecomposition`, whose Hessenberg form specializes
to tridiagonal matrices). "Unreduced" is `IsUnreducedTridiagonal` below, chapter 7's
`Matrix.IsUnreducedUpperHessenberg` plus `IsTridiagonal`.

Readings. Algorithm 8.3.1 "overwrites `A` with `T`" only in the band: the entries
`A(k+2:n, k)` and `A(k, k+2:n)` are never touched (they would hold the Householder vectors in
practice), so the spec speaks of the band of the output. The book says the trailing update need only
compute one triangle ("only the upper triangular portion … needs to be computed", by symmetry): the
program computes `i ≥ j` and mirrors, so every run is symmetric (algo review H1(b)). The subdiagonal
entry `A(k+1, k) = ‖A(k+1:n, k)‖₂` is the freshly computed norm (Algorithm 1.1.1 on the tail with
itself, then one rounded square root), not the `μ` inside `house`, which `house` does not return. The Wilkinson shift (8.3.3) needs
`sign(0) = 1` (with `sign(0) = 0` and `d = 0` the formula returns `a_n`, not an eigenvalue of the
trailing block); both (8.3.3) and Algorithm 8.3.2's formula are planned with that convention. The
"preservation of form" fact of §8.3.3 holds for every QR factorization only when `T` is
nonsingular (for singular `T` the orthogonal factor is not unique: `T = 0 = Q · 0`), and for the
Givens QR (`Matrix.hessenbergGivensQR`) always; the node states both.
'''

[[node]]
id = "equation_8_3_1"
kind = "theorem"
desc = '''(8.3.1), the tridiagonal decomposition: for symmetric `A : Matrix (Fin n) (Fin n) ℝ` there
is `Q ∈ orthogonalGroup` with `Qᵀ A Q` symmetric tridiagonal, and `Q` may be taken with first
column `e₁` (`Q *ᵥ Pi.single 0 1 = Pi.single 0 1`). `Matrix.hessenbergQ` /
`Matrix.hessenbergReduce` with `Matrix.isTridiagonal_hessenbergReduce_of_isHermitian`,
`Matrix.hessenbergQ_mem_orthogonalGroup`; the first-column property because each Householder
reflector of the reduction acts on coordinates `≥ 1`. ★'''
deps = ["Matrix.hessenbergQ", "Matrix.hessenbergReduce", "Matrix.isTridiagonal_hessenbergReduce_of_isHermitian", "Matrix.hessenbergQ_mem_orthogonalGroup"]
source = 'Golub–Van Loan, Matrix Computations, Equation (8.3.1)'

[[node]]
