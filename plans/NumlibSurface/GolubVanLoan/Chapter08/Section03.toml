[[node]]
id = "theorem_8_3_1"
kind = "theorem"
desc = '''Theorem 8.3.1: if `Qᵀ A Q = T` is a tridiagonal decomposition of symmetric `A` (`Q`
orthogonal, `T` tridiagonal) and `K = Matrix.krylovMatrix A (Q.col 0) n` (columns `A^j q₁`,
`j = 0, …, n-1`; chapter 7's Krylov matrix `K(A, v, k)` of §7.4, `GolubVanLoan.Chapter07.krylovMatrix`, with
`Matrix.conjTranspose_mul_krylovMatrix` for `Qᵀ K = K(QᵀAQ, e₁, n)`), then `R = Qᵀ K` is upper
triangular with `r₁₁ = 1` and `r_ii = t₂₁ t₃₂ ⋯ t_{i,i-1}`; if `R` is nonsingular `T` is unreduced;
if `R` is singular and `k` is the least index with `r_kk = 0`, then `k ≥ 2` and `k` is the least
index with `t_{k,k-1} = 0`. Proof as in the book: `Qᵀ K = [e₁ | T e₁ | ⋯ | T^{n-1} e₁]`, and
`T^j e₁` is supported on `{0, …, j}` with `j`-th entry `∏_{i<j} t_{i+1,i}` (induction, tridiagonal).
Chapter 7's Theorem 7.4.3 is the unreduced-iff-nonsingular half for Hessenberg matrices.
★★ (~100 lines)

Blocked: uses chapter 7's `GolubVanLoan.Chapter07.krylovMatrix`/`theorem_7_4_3` (agent s07, running); ~100 lines after.'''
deps = ["IsUnreducedTridiagonal", "GolubVanLoan.Chapter07.krylovMatrix", "Matrix.conjTranspose_mul_krylovMatrix", "GolubVanLoan.Chapter07.theorem_7_4_3"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.3.1'

[[node]]
id = "theorem_8_3_2"
kind = "theorem"
desc = '''Theorem 8.3.2 (implicit Q theorem, tridiagonal form): for symmetric `A`, orthogonal `Q`,
`V` with `Qᵀ A Q = T`, `Vᵀ A V = S` both tridiagonal, `k` the least positive integer with
`t_{k+1,k} = 0` (`k = n` if `T` is unreduced), and `Q.col 0 = V.col 0`: `V.col i = ± Q.col i` and
`|t_{i,i-1}| = |s_{i,i-1}|` for `i = 2:k`, and if `k < n` then `s_{k+1,k} = 0`. Chapter 7's
Theorem 7.4.2 (implicit Q, Hessenberg form: its restatement `GolubVanLoan.Chapter07.theorem_7_4_2`,
not the backbone it delegates to — README layering) applied to the tridiagonal (hence upper Hessenberg, `Matrix.IsTridiagonal.isUpperHessenberg`)
`T`, `S`. The book's proof via Theorem 8.3.1 and the uniqueness of the thin QR factorization is
equivalent. ★

Blocked: an instance of chapter 7's `GolubVanLoan.Chapter07.theorem_7_4_2` (agent s07, running).'''
deps = ["IsUnreducedTridiagonal", "GolubVanLoan.Chapter07.theorem_7_4_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 8.3.2'

