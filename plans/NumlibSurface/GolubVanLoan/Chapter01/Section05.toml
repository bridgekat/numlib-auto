namespace = "GolubVanLoan.Chapter01"
desc = '''
§1.5, vectorization and locality: no nodes, by the scope rule of the planning brief (rule 5). The
section is a qualitative performance model — pipelined vector processing and the cycle counts
`N_arith`, `N_data` of the strip-mined loop (1.5.1), load/store counts of the gaxpy versus the outer
product (§1.5.2), stride (§1.5.3), and cache blocking (§1.5.4) with the capacity constraint (1.5.5) and
the Lagrange-multiplier heuristic `q_opt = p_opt = r_opt ≈ √(n²/3M)` (1.5.6). None of these is a
mathematical proposition about the computed quantities: the counts are statements about a machine
model the book itself calls "qualitative … not necessarily good predictors of performance", and
(1.5.6) is an `≈` without a rigorous reading (it rounds a continuous optimum and ignores
non-divisibility, as the text says). The blocked update (1.5.4) computes `C + A B` by Theorem 1.3.1;
it is an unnumbered code fragment, not an Algorithm.

The module `NumlibSurface/GolubVanLoan/Chapter01/Section05.lean` should still exist with a module
doc whose `## Not formalized here` section records the above, as for every finished section.
'''
