nested `foldlM` over `finRange m`, `finRange n`, `finRange r` of `do let p ← rnd (A i k * B k j); let c
← rnd (C i j + p); pure (Matrix.updateRow C i (Function.update (C i) j c))` (elaborates in the
prototype). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.5'

[[node]]
id = "algorithm_1_1_5_spec"
