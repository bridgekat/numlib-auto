deps = ["algorithm_1_1_5", "algorithm_1_1_5_mem_run", "FloatingPoint.mem_run_dotAccum_exact_iff", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.exact"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.5'

[[node]]
id = "algorithm_1_1_5_mem_run"
kind = "theorem"
desc = '''The run set of the `ijk` product, entry by entry an accumulation onto `C i j`: `Ĉ ∈ (algorithm_1_1_5
fp.round A B C).run ↔ ∀ i j, Ĉ i j ∈ (FloatingPoint.dotAccum fp.round (List.finRange r) (A i) (fun k
=> B k j) (C i j)).run` (statement elaborates in the prototype). The `i` loop writes row `i` only and
