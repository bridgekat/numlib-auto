namespace = "GolubVanLoan.Chapter01"
desc = '''
§1.1, basic algorithms and notation: the dot product, saxpy, the two gaxpys and the four
formulations of `C = C + A B` (Algorithms 1.1.1–1.1.8), each a D4 program with its exact
specification and — because §2.7 analyses them — its bridge to the backbone's relational
rounding predicates (`FloatingPoint.dotAccum`, `RoundsDot`, `RoundsMul`), and the outer-product
expansion (1.1.4).

Every algorithm here is `{M : Type → Type} [Monad M] (rnd : ℝ → M ℝ)` followed by the book's data
in BLAS order (`a x y` for the saxpy, `A x y` for the gaxpys, `A B C` for the products); the
monad is `M` because `m` is the book's row count. The state is overwritten as the book overwrites
it: vectors by `Function.update`, matrices by `Matrix.updateRow C i (Function.update (C i) j c)`
(prototype `notes/gvl/ch01/proto/Program.lean`). The colon-notation algorithms call the scalar
ones: Algorithm 1.1.6's `A(i,:)·B(:,j)` is `algorithm_1_1_1`, Algorithm 1.1.7's
`C(:,j) = C(:,j) + A(:,k) B(k,j)` is `algorithm_1_1_2`. Specifications are Mathlib's: `x ⬝ᵥ y`,
`y + a • x`, `y + A *ᵥ x`, `C + A * B`.

The run characterizations (`…_mem_run`, an `↔`) and the bridges to backbone relations (`…_rounds`:
`RoundsDot`, `RoundsMul`) are what chapter 2's §2.7 bounds are proved from (convention 12 of
`NumlibSurface/GolubVanLoan`); the exact specs (`…_spec`) are their instances at the exact model
(convention 11: `FloatingPoint.RoundingModel.round_exact`, `FloatingPoint.mem_run_dotAccum_exact_iff`).
The entry-by-entry equality of the rounding structure of the row- and column-oriented variants
(`algorithm_1_1_4_mem_run`, `algorithm_1_1_7_mem_run`, `algorithm_1_1_8_mem_run`) is the rigorous
content of "the same result applies if a gaxpy or outer product based procedure is used"
((2.7.19)). A loop that writes one entry per step (the saxpy; the `i` loop of the row gaxpy; the
`i`, `j` loops of the `ijk` product) is `SetM.mem_run_foldlM_update_of_nodup`; a loop whose every
step acts on every entry independently (the `j` loop of the column gaxpy, the `k` loops of the
saxpy and outer-product forms) is `SetM.mem_run_foldlM_of_pi`; an accumulation in place into one
entry is `SetM.mem_run_foldlM_update_self_iff`.

Not nodes: the notation of §1.1.1–1.1.4 and §1.1.7–1.1.8 ((1.1.1)–(1.1.3) are partition notation),
the unnumbered `jki`/`kij` loops (Algorithms 1.1.7/1.1.8 are their colon forms), Table 1.1.1,
§1.1.15–1.1.17 (flops, big-Oh, BLAS levels, Table 1.1.2), §1.1.19's complex notation (Mathlib `ᴴ`).
'''

[[node]]
id = "algorithm_1_1_1"
kind = "definition"
desc = '''Algorithm 1.1.1 (dot product), D4: `algorithm_1_1_1 {M : Type → Type} [Monad M] (rnd : ℝ → M ℝ) {n : ℕ}
(x y : Fin n → ℝ) : M ℝ := (List.finRange n).foldlM (fun c k => do rnd (c + (← rnd (x k * y k))))
0` — `c = 0; for k = 1:n, c = c + x(k) y(k)`, product and sum each rounded. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.1'

[[node]]
id = "algorithm_1_1_1_eq_dotAccum"
kind = "theorem"
desc = '''`algorithm_1_1_1 rnd x y = FloatingPoint.dotAccum rnd (List.finRange n) x y 0`, `rfl`: the book's loop
is the backbone accumulation, which is how chapters 2–3 reach `RoundsDot`. ★'''
deps = ["algorithm_1_1_1", "FloatingPoint.dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.1'

[[node]]
id = "algorithm_1_1_1_spec"
kind = "theorem"
desc = '''Algorithm 1.1.1 computes `c = xᵀ y`: `Id.run (algorithm_1_1_1 pure x y) = x ⬝ᵥ y`, read off the
exact model (convention 11): `algorithm_1_1_1_eq_dotAccum`, `FloatingPoint.RoundingModel.round_exact`
(the exact run is the singleton run set at `RoundingModel.exact`),
`FloatingPoint.mem_run_dotAccum_exact_iff`, `Fin.sum_univ_def`, `zero_add`. ★'''
deps = ["algorithm_1_1_1_eq_dotAccum", "FloatingPoint.mem_run_dotAccum_exact_iff", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.exact"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.1'

[[node]]
id = "algorithm_1_1_1_rounds"
kind = "theorem"
desc = '''Every run of Algorithm 1.1.1 is a recursive inner product in the relational model when rounding fixes
its outputs: `fp.IsIdempotent → ∀ s ∈ (algorithm_1_1_1 fp.round x y).run, FloatingPoint.RoundsDot fp
x y s` (the first addition `0 + fl(x₁y₁)` is exact — the book's (2.7.9) `s₁ = x₁y₁(1 + δ₁)`).
Without the hypothesis, `FloatingPoint.abs_sub_le_of_mem_run_dotAccum` bounds a run by `γ_{n+1}
|x|ᵀ|y|`. `FloatingPoint.roundsDot_of_mem_run_dotAccum` with the order `List.finRange n`
(`List.nodup_finRange`, `List.mem_finRange`). ★'''
deps = ["algorithm_1_1_1_eq_dotAccum", "FloatingPoint.roundsDot_of_mem_run_dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.1'

[[node]]
id = "algorithm_1_1_1_run_nonempty"
kind = "theorem"
desc = '''Nonemptiness (review `notes/gvl/review/algo.md` M8): for a total model the run set of Algorithm 1.1.1
is nonempty, `fp.IsTotal → (algorithm_1_1_1 fp.round x y).run.Nonempty`, so the "for every run"
statements about it are not vacuous. `algorithm_1_1_1_eq_dotAccum`, `FloatingPoint.dotAccum_run_nonempty`. ★'''
deps = ["algorithm_1_1_1_eq_dotAccum", "FloatingPoint.dotAccum_run_nonempty", "FloatingPoint.RoundingModel.IsTotal"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.1'

[[node]]
id = "algorithm_1_1_2"
kind = "definition"
desc = '''Algorithm 1.1.2 (saxpy), D4: `algorithm_1_1_2 rnd (a : ℝ) (x y : Fin n → ℝ) : M (Fin n → ℝ) :=
(List.finRange n).foldlM (fun y i => do let p ← rnd (a * x i); let s ← rnd (y i + p); pure
(Function.update y i s)) y` — `y(i) = y(i) + a x(i)`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.2'

[[node]]
id = "algorithm_1_1_2_spec"
kind = "theorem"
desc = '''`Id.run (algorithm_1_1_2 pure a x y) = y + a • x`, read off `algorithm_1_1_2_mem_run` at the exact
model (convention 11; `FloatingPoint.RoundingModel.round_exact`: each `Rounds` is an equality). ★'''
deps = ["algorithm_1_1_2", "algorithm_1_1_2_mem_run", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.exact"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.2'

[[node]]
id = "algorithm_1_1_2_mem_run"
kind = "theorem"
desc = '''The run set of the saxpy, entrywise: `ŷ ∈ (algorithm_1_1_2 fp.round a x y).run ↔ ∀ i, ∃ p,
fp.Rounds (a * x i) p ∧ fp.Rounds (y i + p) (ŷ i)` (the relation of chapter 2's (2.7.17)). Each
step writes one entry from its current value: `SetM.mem_run_foldlM_update_of_nodup` over
`List.finRange n` (`List.nodup_finRange`; the step reads nothing else), `SetM.mem_run_bind`,
`FloatingPoint.RoundingModel.mem_run_round`. ★'''
deps = ["algorithm_1_1_2", "SetM.mem_run_foldlM_update_of_nodup", "SetM.mem_run_bind", "FloatingPoint.RoundingModel.mem_run_round"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.2'

[[node]]
id = "algorithm_1_1_3"
kind = "definition"
desc = '''Algorithm 1.1.3 (row-oriented gaxpy), D4: `algorithm_1_1_3 rnd (A : Matrix (Fin m) (Fin n) ℝ) (x : Fin n
→ ℝ) (y : Fin m → ℝ) : M (Fin m → ℝ)`, outer `foldlM` over `List.finRange m` (`i`), inner over
`List.finRange n` (`j`) of `do let p ← rnd (A i j * x j); let s ← rnd (y i + p); pure (Function.update
y i s)`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.3'

[[node]]
id = "algorithm_1_1_3_spec"
kind = "theorem"
desc = '''`Id.run (algorithm_1_1_3 pure A x y) = y + A *ᵥ x`, read off `algorithm_1_1_3_mem_run` at the exact
model with `FloatingPoint.mem_run_dotAccum_exact_iff` (convention 11). ★'''
deps = ["algorithm_1_1_3", "algorithm_1_1_3_mem_run", "FloatingPoint.mem_run_dotAccum_exact_iff", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.exact"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.3'

[[node]]
id = "algorithm_1_1_3_mem_run"
kind = "theorem"
desc = '''The run set of the row gaxpy, entry by entry an accumulation onto `y i`: `ŷ ∈ (algorithm_1_1_3
fp.round A x y).run ↔ ∀ i, ŷ i ∈ (FloatingPoint.dotAccum fp.round (List.finRange n) (A i) x (y
i)).run`. The `i` loop writes entry `i` only (`SetM.mem_run_foldlM_update_of_nodup`, the step being
the whole `j` loop on entry `i`), the `j` loop accumulates in place into entry `i`
(`SetM.mem_run_foldlM_update_self_iff`). ★★'''
deps = ["algorithm_1_1_3", "FloatingPoint.dotAccum", "SetM.mem_run_foldlM_update_of_nodup", "SetM.mem_run_foldlM_update_self_iff"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.3'

[[node]]
id = "algorithm_1_1_4"
kind = "definition"
desc = '''Algorithm 1.1.4 (column-oriented gaxpy), D4: the loops of Algorithm 1.1.3 interchanged — outer over
`j`, inner over `i` — with the same body `y(i) = y(i) + A(i,j) x(j)`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.4'

[[node]]
id = "algorithm_1_1_4_spec"
kind = "theorem"
desc = '''`Id.run (algorithm_1_1_4 pure A x y) = y + A *ᵥ x` (the same specification as Algorithm 1.1.3), read
off `algorithm_1_1_4_mem_run` at the exact model with `FloatingPoint.mem_run_dotAccum_exact_iff`
(convention 11). ★'''
deps = ["algorithm_1_1_4", "algorithm_1_1_4_mem_run", "FloatingPoint.mem_run_dotAccum_exact_iff", "FloatingPoint.RoundingModel.round_exact", "FloatingPoint.RoundingModel.exact"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.4'

[[node]]
id = "algorithm_1_1_4_mem_run"
kind = "theorem"
desc = '''The column gaxpy rounds exactly as the row gaxpy does: `ŷ ∈ (algorithm_1_1_4 fp.round A x y).run ↔ ∀
i, ŷ i ∈ (FloatingPoint.dotAccum fp.round (List.finRange n) (A i) x (y i)).run` — the right side of
`algorithm_1_1_3_mem_run`. Loop interchange in the relational model: the inner `i` loop writes one
entry per step, so its run set is a product over `i` (`SetM.mem_run_foldlM_update_of_nodup`); the
outer `j` loop therefore acts on every entry independently, and `SetM.mem_run_foldlM_of_pi` makes
it, entry by entry, the `j` accumulation. ★★'''
deps = ["algorithm_1_1_4", "FloatingPoint.dotAccum", "SetM.mem_run_foldlM_update_of_nodup", "SetM.mem_run_foldlM_of_pi"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 1.1.4'

[[node]]
id = "algorithm_1_1_5"
