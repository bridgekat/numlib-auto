[[node]]
id = "algorithm_3_4_1"
kind = "definition"
desc = '''Algorithm 3.4.1 (outer product LU with partial pivoting), D4, as in
`notes/gvl/ch03/proto/Shapes.lean`: state `(A, piv)`; for `k : Fin n`, `μ` = the first index
`≥ k` maximizing `|A(μ,k)|` (exact comparisons), `piv(k) = μ`, `A(k,:) ↔ A(μ,:)`
(`A.submatrix (Equiv.swap k μ) id`), and `if A k k ≠ 0` the two updates of Algorithm 3.2.1. The
book loops `k = 1:n-1`; the last step `k = n - 1` is a trivial swap and empty updates. ★'''
