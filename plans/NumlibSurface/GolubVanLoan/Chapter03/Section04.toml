[[node]]
id = "equation_3_4_10"
kind = "theorem"
desc = '''(3.4.10), Wilkinson's bound for complete pivoting in exact arithmetic, **index corrected**:
the entries of `A^{(k)} = M_k Π_k ⋯ M_1 Π_1 A Γ_1 ⋯ Γ_k` (after `k` steps) satisfy
`|a_ij^{(k)}| ≤ (k+1)^{1/2} (2 · 3^{1/2} ⋯ (k+1)^{1/k})^{1/2} max |a_ij|`
(`Matrix.wilkinsonGrowthBound (k + 1) * supAbs A`), for `i, j ≥ k` — and, as a second clause, for
**all** `i, j`: an entry outside the trailing block was frozen at an earlier stage `k' < k`, where
the bound `wilkinsonGrowthBound (k' + 1)` holds and `wilkinsonGrowthBound` is monotone (both of its
factors increase with `k`; a one-line helper). The book prints the bound with
`k` in place of `k + 1`, which is false for `k = 1` (`!![1, 1; 1, -1]` produces `-2 > 1 = f(1)`);
with the `(3.2.3)` indexing (`A^{(k)}` after `k - 1` steps) the printed form is right. The ch03
append `Matrix.abs_gemFullPivotStage_le_wilkinson`. ★'''
deps = ["Matrix.abs_gemFullPivotStage_le_wilkinson", "Matrix.wilkinsonGrowthBound", "algorithm_3_4_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.4.10)'

[[node]]
id = "completePivoting_rank"
kind = "theorem"
desc = '''§3.4.6, rank revelation: if `rank A = r < n`, then at the beginning of step `r + 1` of
complete pivoting `A(r+1:n, r+1:n) = 0`, the first `r` pivots are nonzero, and the remaining steps
are trivial (`Π_k = Γ_k = M_k = I` for `k > r`); the ch03 append
`Matrix.gemFullPivotStage_trailing_eq_zero_of_rank`. ★'''
deps = ["Matrix.gemFullPivotStage_trailing_eq_zero_of_rank", "algorithm_3_4_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.6'

[[node]]
id = "completePivoting_rank_factorization"
kind = "theorem"
desc = '''§3.4.6: consequently `P A Qᵀ = [L₁₁ 0; L₂₁ I_{n-r}] [U₁₁ U₁₂; 0 0]` with `L₁₁`, `U₁₁` of
order `r` and `U₁₁` nonsingular (`Matrix.fromBlocks` over `Fin r ⊕ Fin (n - r)` after
`finSumFinEquiv`): the factors of `algorithm_3_4_3_spec` have `u_ij = 0` for `i ≥ r` and
`l_ij = [i = j]` for `j ≥ r`. ★★ (~60 lines)'''
deps = ["completePivoting_rank", "algorithm_3_4_3_spec"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.6'

[[node]]
id = "rookPivotSearch"
kind = "definition"
desc = '''§3.4.7, the rook scan (an unnumbered code fragment, planned because the book states its
termination): from `(μ, λ) = (k, k)`, `τ = |a_μλ|`, `s = 0`, while
`τ < ‖A(k:n, λ)‖_∞ ∨ τ < ‖A(μ, k:n)‖_∞`: for even `s` move `μ` to the (first) row maximizing
`|a_μλ|` in column `λ`, for odd `s` move `λ` in row `μ`; `s = s + 1`. Written with a fuel argument
(`fuel := (n - k)² + 1` suffices); comparisons exact, no rounding. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.4.7'

[[node]]
id = "rookPivotSearch_spec"
kind = "theorem"
desc = '''§3.4.7, "the value of `τ` is monotone increasing and that ensures termination": each pass
of the loop strictly increases `τ = |a_μλ|` or exits, so with fuel `(n - k)² + 1` (the number of
entries of the trailing block) the loop exits, and on exit `(μ, λ)` is a rook pivot — `|a_μλ|` is
maximal in its column and its row of `A(k:n, k:n)`; hence `rookPivotSearch` is a strategy
satisfying `Matrix.IsRookPivot`. The book's "`O((n-k)²)` in theory" is this bound; "`O(1)` in
practice" is not formalized. ★★ (~80 lines)'''
deps = ["rookPivotSearch", "Matrix.IsRookPivot"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.7'

[[node]]
id = "rookPivoting_isLU"
kind = "theorem"
desc = '''§3.4.7, rook pivoting "computes the factorization `P A Q = L U`": Gaussian elimination with
the rook strategy `rookPivotSearch` (i.e. `Matrix.gemFullPivotStage A rookPivotSearch n`) gives
`P A Q = L U` with `|l_ij| ≤ 1` and `|u_ij| ≤ |u_ii|` (the latter is P3.4.2's question, answered
yes); the append `Matrix.gemFullPivotStage_permMatrix_mul_mul_permMatrix_isLU`. The claim that
rook pivoting "induces the same level of reliability as complete pivoting" is not formalized. ★'''
deps = ["rookPivotSearch_spec", "Matrix.gemFullPivotStage_permMatrix_mul_mul_permMatrix_isLU", "Matrix.gemFullPivotStage"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.7'

[[node]]
id = "equation_3_4_11"
kind = "theorem"
desc = '''(3.4.11): for `A : Matrix (Fin m) (Fin n) ℝ` with `m ≤ n` and `rank A = m` there are
permutations `P` of `Fin m`, `Q` of `Fin n`, a unit lower triangular `L : Matrix (Fin m) (Fin m) ℝ`
and `U = [U₁ | U₂]` with `U₁` nonsingular upper triangular such that `P A Qᵀ = L [U₁ | U₂]`
(`Matrix.fromCols` after `finSumFinEquiv`). Proof at the specification level (the book's "with
either complete or rook pivoting" is P3.4.5's algorithm, not formalized): `rank A = m` gives `m`
independent columns (`Matrix.exists_linearIndependent_col`); `Q` moves them first, so `A Qᵀ = [B | C]`
with `B` nonsingular; `Matrix.exists_permMatrix_mul_isLU` on `B` gives `P B = L U₁`; `U₂ = L⁻¹ P C`.
★★ (~100 lines)'''
deps = ["Matrix.exists_linearIndependent_col", "Matrix.exists_permMatrix_mul_isLU", "Matrix.isUnit_iff_forall_diag_ne_zero_of_isUpperTriangular"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.4.11)'

[[node]]
id = "underdetermined_solve"
kind = "theorem"
desc = '''§3.4.8, Steps 1–3: with (3.4.11), `A x = b ↔ L (U₁ z₁ + U₂ z₂) = P b` for `Q x = [z₁; z₂]`,
and for every `z₂` the vector `x = Qᵀ [U₁⁻¹ (y - U₂ z₂); z₂]` with `L y = P b` solves `A x = b`
("setting `z₂ = 0` is a natural choice"). ★'''
deps = ["equation_3_4_11"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.8'

