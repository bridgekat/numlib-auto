`packedU F = (gemPivotStage A partialPivotRow n).1` and `packedL F = gemLower (P A)`. An `Id`-level
simulation by induction over the steps (the program's pivot search is `Matrix.partialPivotRow`:
both return the first maximizing row, `Matrix.partialPivotRow_le`; the swapped rows carry their
stored multipliers, which is `gemStage_permMatrix_mul_eq_submatrix_gemPivotStage`'s bookkeeping; a
zero pivot skips the update exactly as `elimStep` with zero multipliers changes nothing). ★★★
(~250 lines)'''
