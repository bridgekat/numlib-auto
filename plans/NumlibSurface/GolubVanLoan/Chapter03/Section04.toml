[[node]]
id = "equation_3_4_4"
kind = "theorem"
desc = '''(3.4.4): `M̃_{n-1} ⋯ M̃_1 P A = U`, so that `L = (M̃_{n-1} ⋯ M̃_1)⁻¹` has columns the
permuted multipliers — the book's answer to "where is `L`?". Algebra from (3.4.2) and (3.4.5)
(insert `Π_i Π_i = I`); equivalently `Matrix.gemStage_permMatrix_mul_eq_submatrix_gemPivotStage`
(the stages on `P A` are the pivoted stages with rows permuted by the later interchanges). ★★
(~50 lines)

Blocked: effort (agent s03). `equation_3_4_5` is proved; route: conjugate each `M_k` by the later interchanges (`permMatrix_mul_gaussTransformation_mul_transpose`) and identify it with the Gauss transformation of stage `k` of elimination without pivoting on `PA`, by algebra from `equation_3_4_2` (insert `Π_i Π_i = I`), or directly `Matrix.gemStage_permMatrix_mul_eq_submatrix_gemPivotStage`.'''
deps = ["equation_3_4_2", "equation_3_4_5", "Matrix.gemStage_permMatrix_mul_eq_submatrix_gemPivotStage"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.4.4)'

