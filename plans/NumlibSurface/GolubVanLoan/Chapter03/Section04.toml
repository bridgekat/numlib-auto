[[node]]
id = "algorithm_3_4_2_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 3.4.2: its `Id` output is the same `(P, L, U)` as Algorithm
3.4.1's (both are the backbone's partial-pivoting recurrence; simulation as in
`algorithm_3_4_1_eq_gemPivotStage`), hence `P A = L U` with `|l_ij| ≤ 1`. ★★★ (~200 lines)

Blocked: effort (agent s03). Route: the column invariant `GaxpyInv` of Algorithm 3.2.2 for `A` with its rows permuted by the recorded interchanges, invariant under the row swap of the step (it permutes rows at or after `j` only, as `pivStageInv_submatrix` for Algorithm 3.4.1), with dominated multipliers; the exact model handles the zero pivot as for Algorithm 3.4.1. The spec proved would be the book's `PA = LU`, `|ℓ_ij| ≤ 1` for the program's own `P` (the plan's 'same output as Algorithm 3.4.1' is a simulation).'''
deps = ["algorithm_3_4_2", "algorithm_3_4_1_eq_gemPivotStage", "equation_3_4_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.4.2'

