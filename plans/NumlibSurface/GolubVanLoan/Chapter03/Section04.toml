[[node]]
id = "algorithm_3_4_1_eq_gemPivotStage"
kind = "theorem"
desc = '''The exact run of Algorithm 3.4.1 is the backbone's partial-pivoting recurrence: with
`(F, piv) = Id.run (algorithm_3_4_1 pure A)`, `pivPerm piv = (gemPivotStage A partialPivotRow n).2`,
`packedU F = (gemPivotStage A partialPivotRow n).1` and `packedL F = gemLower (P A)`. An `Id`-level
simulation by induction over the steps (the program's pivot search is `Matrix.partialPivotRow`:
both return the first maximizing row, `Matrix.partialPivotRow_le`; the swapped rows carry their
stored multipliers, which is `gemStage_permMatrix_mul_eq_submatrix_gemPivotStage`'s bookkeeping; a
zero pivot skips the update exactly as `elimStep` with zero multipliers changes nothing). ★★★
(~250 lines)

Blocked: not needed by the chapter (agent s03): `algorithm_3_4_1_spec` is read off the invariant of the bridge at the exact model, where a zero pivot of partial pivoting comes with a zero column. The simulation against `Matrix.gemPivotStage` (the program's search is `Matrix.partialPivotRow`, so the interchanges agree; the packed multipliers move with their rows) was not attempted (~250 lines).'''
deps = ["algorithm_3_4_1", "pivPerm", "packedL", "packedU", "Matrix.gemPivotStage", "Matrix.partialPivotRow_le", "Matrix.le_partialPivotRow", "Matrix.gemStage_permMatrix_mul_eq_submatrix_gemPivotStage", "Matrix.gemLower"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.4.1'

