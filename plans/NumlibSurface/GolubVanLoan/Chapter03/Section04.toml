`algorithm_3_4_1_rounds`. ★★★ (~250 lines)

Blocked: effort (agent s03): the same invariant as `algorithm_3_4_2_spec` in a general model, with the returned-pivot hypothesis excluding a skipped division (~250 lines for both).'''
