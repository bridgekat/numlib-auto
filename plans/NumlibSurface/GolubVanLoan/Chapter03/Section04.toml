[[node]]
id = "equation_3_4_3"
kind = "theorem"
desc = '''(3.4.3): partial pivoting computes `P A = L U` with `P = Π_{n-1} ⋯ Π_1`, `L` unit lower
triangular with `|l_ij| ≤ 1`, `U` upper triangular — for every `A`:
`Matrix.IsLU (σ.permMatrix ℝ * A) (Matrix.gemLower (σ.permMatrix ℝ * A)) (partialPivotStage A n)` with
`σ = (gemPivotStage A partialPivotRow n).2`, and `|gemLower (σ.permMatrix ℝ * A) i j| ≤ 1`.
`Matrix.gemPivotStage_partialPivotRow_permMatrix_mul_isLU` (append),
`Matrix.gemPivotStage_partialPivotRow_norm_gemLower_le_one`. ★'''
