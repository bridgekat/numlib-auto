[[node]]
id = "equation_3_4_2"
kind = "theorem"
desc = '''(3.4.2): `M_{n-1} Π_{n-1} ⋯ M_1 Π_1 A = U` is upper triangular, for every `A`
(no hypothesis: a zero pivot comes with a zero column, and then `M_k = I`):
`(partialPivotStage A n).IsUpperTriangular`, with each step
`partialPivotStage A (k+1) = gaussTransformation τ k * (interchange k (piv k) * partialPivotStage A k)`
(`Matrix.gemPivotStage_succ_fst_eq_gaussTransform_mul`, `gaussTransformation_gaussVector_eq_gaussTransform`).
Triangularity from the append `Matrix.gemPivotStage_partialPivotRow_permMatrix_mul_isLU`. ★'''
