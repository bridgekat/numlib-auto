[[node]]
id = "equation_3_4_10_frozen"
kind = "theorem"
desc = '''(3.4.10), the second clause split off `equation_3_4_10` (agent s03): the bound
`|a_ij^{(k)}| ≤ wilkinsonGrowthBound (k + 1) * supAbs A` for **all** `i, j`, not only the trailing
block — an entry outside it is either an eliminated entry (zero) or in a row frozen at an earlier
step `k' < k` (up to the later column interchanges), where the bound `wilkinsonGrowthBound (k' + 1)`
holds, and `Matrix.wilkinsonGrowthBound_mono`. ★★

Blocked: effort (agent s03). An entry outside the trailing block of `A^{(k)}` is either below the diagonal in a column before `k` (zero: eliminated, or a zero pivot column under complete pivoting) or in a row `i < k`, frozen since step `i + 1` up to the later column interchanges, hence an entry of the trailing block of `A^{(i)}`; bound `wilkinsonGrowthBound (i + 1) ≤ wilkinsonGrowthBound (k + 1)` (`Matrix.wilkinsonGrowthBound_mono`), with `Matrix.gemFullPivotStage_colPerm_inv_mul_apply` for the interchanges; ~80 lines.'''
deps = ["equation_3_4_10", "Matrix.wilkinsonGrowthBound"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.4.10)'

[[node]]
id = "growthExample_noInterchange"
kind = "theorem"
desc = '''§3.4.5, split off `growthExample_isLU` (agent s03): "there is no swapping of rows during
Gaussian elimination with partial pivoting" on `growthExample n` —
`(Matrix.gemPivotStage (growthExample n) Matrix.partialPivotRow n).2 = 1` — and the growth factor
of the backbone is `2^{n-1}`, `Matrix.growthFactor (growthExample n) = 2 ^ (n - 1)` (for `n ≥ 1`).
Induction on the stages: stage `k` has last column `2^{min(i,k)}`, and column `k` has entries
`1, -1, …, -1` on and below the diagonal. ★★ (~130 lines)

Blocked: effort (agent s03). Route: the stage `k` of partial pivoting on `growthExample n` is, by induction, `1` on the diagonal, `-1` below it in the columns `k..n-2`, `0` below it in the earlier columns and `2^{min(i,k)}` in the last column; the first maximizing row of column `k` is `k`, so every interchange is trivial and the stages are those of `growthExample_isLU`'s factors; the growth factor is then `2^{n-1}` (upper bound `Matrix.growthFactor_le_two_pow_of_partialPivotRow`, attained at `u_nn`); ~130 lines.'''
deps = ["growthExample", "growthExample_isLU", "Matrix.gemPivotStage", "Matrix.partialPivotRow", "Matrix.growthFactor"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.5'
