namespace = "GolubVanLoan.Chapter03"
desc = '''
§3.4, pivoting: interchange permutations and the `piv` encoding (§3.4.1), partial pivoting
((3.4.1)–(3.4.5), Algorithms 3.4.1–3.4.2), its error analysis and the growth factor
((3.4.6)–(3.4.9), the `2^{n-1}` example), complete pivoting (Algorithm 3.4.3, Wilkinson's
(3.4.10), rank revelation), rook pivoting (§3.4.7), underdetermined systems ((3.4.11)) and the
"LU mentality" algorithms (3.4.12)–(3.4.13) (`solveMultipleRHS`, `solvePowerSystem`).

Backbone: `Matrix.gemPivotStage`, `Matrix.partialPivotRow`, `Matrix.gemFullPivotStage`,
`Matrix.IsCompletePivot`, `Matrix.growthFactor`, `Matrix.supAbs`, `Matrix.wilkinsonGrowthBound`
(`Numlib/LinearAlgebra/Matrix/LU/Pivoting`), with ch03's appends there (partial pivoting without a
nonzero-pivot hypothesis, `IsRookPivot`, the algorithmic `P A Q = L U`, rank revelation, the
stage-wise Wilkinson bound). A row permutation `σ` acts as `A.submatrix σ id =
σ.permMatrix ℝ * A`; the book's `P = Π_{n-1} ⋯ Π_1` is `(pivPerm piv).permMatrix ℝ`.

**D4 conventions specific to this section** (on top of the numbered conventions of
`NumlibSurface/GolubVanLoan`). Pivot searches compare the *exact* absolute values of the computed
entries (convention 1: `|·|` and comparisons are exact, no `rnd`); the search returns the first maximizing index, so that it agrees with
`Matrix.partialPivotRow`. The book's `if A(k,k) ≠ 0` guard is kept in the programs. The exact
specifications of the pivoting algorithms go by an `Id`-level simulation of the backbone stage
recurrences (`algorithm_3_4_1_eq_gemPivotStage`), not through the exact rounding model: a skipped
update (zero pivot) is not a `RoundsLU` step. The rounding bridges assume the divisor pivots
nonzero, so the guard is always taken. In the relational model the computed multipliers of
partial pivoting are bounded by `1 + u`, not `1` (the model does not know that rounding is monotone
and fixes `± 1`); every normwise consequence carries the factor `1 + u`.
'''

[[node]]
id = "interchange"
kind = "definition"
desc = '''§3.4.1, the interchange permutation `Π` swapping `k` and `l`: `interchange k l =
(Equiv.swap k l).permMatrix ℝ` on `Fin n`; `interchange k l * A` swaps rows `k, l` of `A`,
`A * interchange k l` swaps columns (`PEquiv.toMatrix_toPEquiv_mul`), and `interchange k l` is
symmetric and an involution. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.4.1, Definition'

[[node]]
id = "pivPerm"
kind = "definition"
desc = '''§3.4.1, the permutation encoded by `piv`: for `piv : Fin m → Fin n` (`m ≤ n` steps,
`k ↦ piv k`) the row permutation `σ = swap 0 (piv 0) * ⋯ * swap (m-1) (piv (m-1))` (a
`List.foldl` over `List.finRange m`), so that `σ.permMatrix ℝ = Π_m ⋯ Π_1`; the same accumulation
as `Matrix.gemPivotStage`'s second component. ★'''
deps = ["interchange", "Matrix.gemPivotStage"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.1, Definition'

[[node]]
id = "applyPiv"
kind = "definition"
desc = '''§3.4.1, the loops "`for k = 1:m, x(k) ↔ x(piv(k))`" and "`for k = m:-1:1`": `applyPiv piv x`
and `applyPivRev piv x`, folds of `x ∘ Equiv.swap k (piv k)` (no arithmetic, a pure function). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.4.1'

[[node]]
id = "applyPiv_eq"
kind = "theorem"
desc = '''§3.4.1: the forward loop overwrites `x` with `P x`, and since every `Π_k` is symmetric the
reverse loop overwrites `x` with `Pᵀ x = Π₁ ⋯ Π_m x`: `applyPiv piv x = (pivPerm piv).permMatrix ℝ *ᵥ x`,
`applyPivRev piv x = ((pivPerm piv).permMatrix ℝ)ᵀ *ᵥ x`. Induction over the list;
`Matrix.permMatrix_mul`-type lemmas. ★★ (~40 lines)'''
deps = ["applyPiv", "pivPerm"]
source = 'Golub–Van Loan, Matrix Computations, §3.4.1'

