namespace = "GolubVanLoan.Chapter03"
desc = '''
§3.3, roundoff error in Gaussian elimination: Theorem 3.3.1 (the computed factors) and Theorem
3.3.2 (factor, then the two triangular solves), both about runs of the D4 programs of §3.1–3.2 in
the relational model. The book's first-order bounds (`2(n-1)u(|A| + |L̂||Û|) + O(u²)`,
`n u(2|A| + 4|L̂||Û|) + O(u²)`) are stated in their rigorous `γ` forms ([higham2002accuracy]
Theorems 9.3–9.4), which are sharper to first order (`γ_n ≈ n u ≤ 2(n-1)u` for `n ≥ 2`, and no
`|A|` term) and imply the printed forms. The proof-internal displays (3.3.3)–(3.3.13) are not
nodes: the backbone proves Theorem 9.3 entrywise from Lemma 8.4 instead of the book's induction on
`n`. The book's hypothesis "`A` is an `n`-by-`n` matrix of floating point numbers" has no
counterpart in the relational model (inputs are arbitrary reals) and is dropped; P3.3.1's `3` in
place of `2` is thereby moot.
'''

[[node]]
id = "theorem_3_3_1"
kind = "theorem"
desc = '''Theorem 3.3.1, rigorous form: for `fp : FloatingPoint.RoundingModel ℝ` with `u < 1`,
`n u < 1`, and every `F ∈ (algorithm_3_2_1 fp.round A).run` whose pivots `F j j`, `j + 1 < n`,
are nonzero ("no zero pivots are encountered"), `L̂ Û = A + H` with
`|H| ≤ γ_n |L̂| |Û|` entrywise (`L̂ = packedL F`, `Û = packedU F`). From `algorithm_3_2_1_rounds`
and `FloatingPoint.exists_roundsLU_mul_eq_add` (which asks only the divisor pivots to be nonzero).
The book's (3.3.2),
`|H| ≤ 2(n-1)u(|A| + |L̂||Û|) + O(u²)`, is implied to first order; for `n = 1` the rigorous bound
`γ₁|a|` is slightly weaker than the book's `0` (the model rounds nothing there, but the backbone
lemma charges `γ_n` uniformly — harmless). ★'''
deps = ["algorithm_3_2_1_rounds", "FloatingPoint.exists_roundsLU_mul_eq_add", "packedL", "packedU", "FloatingPoint.gamma"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 3.3.1'

[[node]]
id = "theorem_3_3_1_gaxpy"
kind = "theorem"
desc = '''§3.3.1, "the error bounds that we derive also apply to the gaxpy formulation (Algorithm
3.2.2)": Theorem 3.3.1 for the runs of `algorithm_3_2_2`; `algorithm_3_2_2_rounds` and
`FloatingPoint.exists_roundsLU_mul_eq_add`. ★'''
deps = ["algorithm_3_2_2_rounds", "FloatingPoint.exists_roundsLU_mul_eq_add", "theorem_3_3_1"]
source = 'Golub–Van Loan, Matrix Computations, §3.3.1'

[[node]]
id = "theorem_3_3_2"
kind = "theorem"
desc = '''Theorem 3.3.2, rigorous form: for `u < 1`, `3 n u < 1`, every `F ∈ (algorithm_3_2_1 fp.round A).run`
with all pivots `F j j` nonzero, every `ŷ ∈ (algorithm_3_1_1 fp.round (packedL F) b).run` and every
`x̂ ∈ (algorithm_3_1_2 fp.round (packedU F) ŷ).run` satisfy `(A + E) x̂ = b` with
`|E| ≤ γ_{3n} |L̂| |Û|` entrywise. From the three bridges and
`FloatingPoint.exists_roundsLU_solveDot_eq`. The book's (3.3.14),
`|E| ≤ n u (2|A| + 4|L̂||Û|) + O(u²)`, is implied to first order (`γ_{3n} = 3 n u + O(u²)` and no
`|A|` term). ★'''
deps = ["algorithm_3_2_1_rounds", "algorithm_3_1_1_rounds", "algorithm_3_1_2_rounds", "FloatingPoint.exists_roundsLU_solveDot_eq", "packedL", "packedU"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 3.3.2'

[[node]]
id = "theorem_3_3_2_column"
kind = "theorem"
desc = '''Theorem 3.3.2 with the column-oriented solves (the book's "the methods of §3.1" covers both):
the same conclusion for `ŷ` from `algorithm_3_1_3` and `x̂` from `algorithm_3_1_4`;
`FloatingPoint.exists_roundsLU_solve_eq` ([higham2002accuracy] Theorem 9.4 as the backbone has
it), with the divisor pivots nonzero. ★'''
deps = ["algorithm_3_2_1_rounds", "algorithm_3_1_3_rounds", "algorithm_3_1_4_rounds", "FloatingPoint.exists_roundsLU_solve_eq", "theorem_3_3_2"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 3.3.2'
