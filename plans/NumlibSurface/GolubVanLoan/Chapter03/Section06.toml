namespace = "GolubVanLoan.Chapter03"
desc = '''
§3.6, parallel LU. By the scope rules only the precise mathematics of §3.6.1 is formalized: the
tall pivoted factorization of a block column (3.6.2), the partial factorization (3.6.5) and the
assembled pivoted block LU factorization that the recursion produces. The algorithm itself is
"left as an exercise" in the book (P3.6.1; no numbered algorithm), so there is no D4 program. Not
formalized: the block-cyclic distribution and processor-grid material of §3.6.2, the pseudo-code
(3.6.6), Figures 3.6.1–3.6.5, the communication remarks, and tournament pivoting (§3.6.3), which
states a procedure and heuristics ("even better pivot row candidates") but no proposition.
The partitions (3.6.1), (3.6.3) and the multiple right-hand-side solve (3.6.4) are notation and an
algorithm step. Blocks are `r × r` with `n = N r`; a block row/column split is `Fin (r + s)` read as
`Fin r ⊕ Fin s` through `finSumFinEquiv`.
'''

[[node]]
id = "equation_3_6_2"
kind = "theorem"
desc = '''(3.6.2): for a tall block column `W : Matrix (Fin (r + s)) (Fin r) ℝ` there are a permutation
`P₁` and `L = [L₁₁; L₂₁]` unit lower trapezoidal with `|l_ij| ≤ 1`, `U₁₁` upper triangular `r × r`,
with `P₁ W = L U₁₁` ("an obvious rectangular matrix version of Algorithm 3.4.1"); the ch03 append
`Matrix.exists_permMatrix_mul_isRectLU`. ★'''
deps = ["Matrix.exists_permMatrix_mul_isRectLU", "Matrix.IsRectLU"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.6.2)'

[[node]]
id = "equation_3_6_5"
kind = "theorem"
desc = '''(3.6.3)–(3.6.5), the partial factorization after Parts A–C: with `P₁ A = [Ã₁₁ Ã₁₂; Ã₂₁ Ã₂₂]`
(blocks `r` and `s`), `P₁ [Ã₁₁; Ã₂₁] = [L₁₁; L₂₁] U₁₁` from (3.6.2), `L₁₁ U₁₂ = Ã₁₂` ((3.6.4)) and
`A^{new} = Ã₂₂ - L₂₁ U₁₂`: `P₁ A = [L₁₁ 0; L₂₁ I] [I 0; 0 A^{new}] [U₁₁ U₁₂; 0 I]` — the
Schur-complement identity `equation_3_2_9` applied to `P₁ A`, with no nonsingularity needed beyond
solvability of (3.6.4) (`L₁₁` is unit lower triangular, hence invertible). ★★ (~40 lines)'''
deps = ["equation_3_2_9", "equation_3_6_2"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.6.5)'

[[node]]
id = "blockLUPivoting"
kind = "theorem"
desc = '''§3.6.1, the assembled pivoted block LU factorization: if moreover `P^{new} A^{new} = L^{new} U^{new}`
and `P^{new} L₂₁ = L̃₂₁`, then `P A = [L₁₁ 0; L̃₂₁ L^{new}] [U₁₁ U₁₂; 0 U^{new}]` with
`P = [I 0; 0 P^{new}] P₁` (`Matrix.fromBlocks` of the permutation matrices,
`Equiv.Perm.sumCongr`); by induction on the number of block columns every square `A` (`n = N r`)
has a pivoted factorization `P A = L U` built this way with `|l_ij| ≤ 1`. ★★ (~80 lines)'''
deps = ["equation_3_6_5", "blockLU_of_schur", "Matrix.IsLU"]
source = 'Golub–Van Loan, Matrix Computations, §3.6.1'
