deps = ["algorithm_3_2_2", "FloatingPoint.RoundsLU", "FloatingPoint.RoundingModel.round", "SetM.mem_run_bind", "SetM.mem_run_foldlM_update_of_nodup", "FloatingPoint.roundsSumFrom_append_singleton"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.2'

