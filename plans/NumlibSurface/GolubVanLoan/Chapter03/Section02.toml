[[node]]
id = "algorithm_3_2_1"
kind = "definition"
desc = '''Algorithm 3.2.1 (outer product LU), D4, exactly as in `notes/gvl/ch03/proto/Shapes.lean`:
`(List.finRange n).foldlM` over `k`, with `ρ = (List.finRange n).filter (k < ·)`: first
`A(ρ,k) = A(ρ,k)/A(k,k)` (one rounded division per entry), then `A(ρ,ρ) = A(ρ,ρ) - A(ρ,k) A(k,ρ)`
row by row (`i ∈ ρ`, then `j ∈ ρ`: `rnd (A i j - rnd (A i k * A k j))`) — the `kij` display of
§3.2.9, which is the same set of roundings in another order. Returns the packed matrix. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.1'

[[node]]
id = "algorithm_3_2_1_rounds"
kind = "theorem"
desc = '''**The bridge of Algorithm 3.2.1**: every `F ∈ (algorithm_3_2_1 fp.round A).run` satisfies
`FloatingPoint.RoundsLU fp A (packedL F) (packedU F)`, with no hypothesis (zero pivots give junk
divisions that `RoundsLU` also allows). Invariant after the steps `k' < k`: rows and columns
`< k` are finished (`û_ij` for `i ≤ j`, `i < k`: running difference of `a_ij` over `r < i`;
`l̂_ij` for `j < i`, `j < k`: running difference over `r < j`, then the rounded division), and the
trailing block `i, j ≥ k` holds the running difference of `a_ij` over `r < k` in increasing `r`.
Step: `roundsSumFrom_append_singleton`. The column division and the trailing update write one
entry per step, reading only the frozen pivot row and column: `SetM.mem_run_foldlM_update_of_nodup`
over `ρ` (the division), then over the rows `i ∈ ρ` and within a row over `j ∈ ρ` (the update, reading
`A i k`, `A k j` outside the written row). ★★★ (~250 lines)'''
deps = ["algorithm_3_2_1", "packedL", "packedU", "FloatingPoint.RoundsLU", "FloatingPoint.RoundingModel.round", "SetM.mem_run_bind", "SetM.mem_run_foldlM_update_of_nodup", "FloatingPoint.roundsSumFrom_append_singleton"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.1'

[[node]]
id = "algorithm_3_2_1_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 3.2.1: with `F = Id.run (algorithm_3_2_1 pure A)`,
`packedL F = Matrix.luLower A` and `packedU F = Matrix.luUpper A` for every `A`; hence, when
`A(1:k,1:k)` is nonsingular for `k = 1:n-1`, `Matrix.IsLU A (packedL F) (packedU F)`. Route: the
pure collapse (one `simp only`, checked in `proto/Shapes.lean`), `algorithm_3_2_1_rounds` at
`RoundingModel.exact`, `FloatingPoint.roundsLU_exact_iff`, `Matrix.isLU_luLower_luUpper`. ★'''
deps = ["algorithm_3_2_1_rounds", "FloatingPoint.roundsLU_exact_iff", "Matrix.isLU_luLower_luUpper", "Matrix.luLower", "Matrix.luUpper"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.1'

[[node]]
id = "algorithm_3_2_2"
kind = "definition"
desc = '''Algorithm 3.2.2 (gaxpy LU), D4, with separate arrays `L` (initially `1`) and `U` (initially
`0`) as the book writes it. For each column `j`: `ã = A(:,j)`; "solve `L(1:j-1,1:j-1) z = ã(1:j-1)`"
by the column saxpy loops of Algorithm 3.1.3 **without the division by the unit diagonal** (§3.1.7:
unit triangular systems "pose no difficulty"; a rounded division by `1` would add a rounding the
relational model cannot know to be exact and break the match with `RoundsLU`); `U(1:j-1,j) = z`;
`v(j:n) = ã(j:n) - L(j:n,1:j-1) z` as a gaxpy, i.e. running subtractions of `rnd (L i r * z r)`
in increasing `r`; `U(j,j) = v(j)`; `L(j+1:n,j) = v(j+1:n)/v(j)` rounded. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.2'

[[node]]
id = "algorithm_3_2_2_rounds"
kind = "theorem"
desc = '''The bridge of Algorithm 3.2.2: every run `(L̂, Û)` satisfies `FloatingPoint.RoundsLU fp A L̂ Û`
(each `û_ij`, `i < j`, is the running difference of `a_ij` over `r < i` produced by the unit
