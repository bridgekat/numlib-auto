namespace = "GolubVanLoan.Chapter03"
desc = '''
§3.2, the LU factorization: Gauss transformations and their rounding (§3.2.1–3.2.3), Gaussian
elimination as `A = L U` ((3.2.3)–(3.2.7), Theorem 3.2.1), the outer-product and gaxpy
algorithms 3.2.1–3.2.2 with their rounding bridges into `FloatingPoint.RoundsLU`, the rectangular
factorization (§3.2.10, (3.2.8)), the Schur complement (3.2.9) and the block algorithms
3.2.3–3.2.4.

Backbone: `Matrix.IsLU`, `leadingPrincipalSubmatrix`, `strictLeadingPrincipalSubmatrix`
(`Numlib/LinearAlgebra/Matrix/LU`), `elimStep`/`gaussTransform`/`gemStage`/`gemLower`/`luLower`/
`luUpper` (`…/LU/Elimination`), the new `Matrix.IsRectLU` (ch03 append to `LU`), and
`FloatingPoint.RoundsLU` (`Numlib/FloatingPoint/LU`), whose running-difference entries are exactly
what Algorithms 3.2.1 and 3.2.2 compute (the subtraction order is quantified away). Indices are
0-based: the book's step `k = 1:n-1` is `k : Fin n` with the empty last step included, its
`A^{(k)}` (after `k - 1` steps in (3.2.3)) is `Matrix.gemStage A (k - 1)`, and "`A(1:k,1:k)`
nonsingular for `k = 1:n-1`" is `∀ k, IsUnit (A.strictLeadingPrincipalSubmatrix k)`.

The packed output convention of Algorithms 3.2.1, 3.4.x ("`A(i,i:n)` is overwritten by
`U(i,i:n)`, `A(i+1:n,i)` by `L(i+1:n,i)`") is `packedL F = 1 + F.strictLower`,
`packedU F = F - F.strictLower` (`Matrix.strictLower` of `Numlib/LinearAlgebra/Matrix/Hessenberg`).
Programs overwrite one entry by `A.updateRow i (Function.update (A i) j a)`; prototype
`notes/gvl/ch03/proto/Shapes.lean` elaborates Algorithms 3.2.1, 3.4.1 and 3.5.1 in this form and
checks the one-line pure collapse (for 3.4.1 through its `if`, with an `ite_pure`-type lemma).
'''

[[node]]
id = "equation_3_2_1"
kind = "theorem"
desc = '''(3.2.1): if `A = L * U`, `L *ᵥ y = b` and `U *ᵥ x = y`, then `A *ᵥ x = b`
(`Matrix.mulVec_mulVec`). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, Equation (3.2.1)'

[[node]]
id = "gaussVector"
kind = "definition"
desc = '''§3.2.1, the Gauss vector of `v` at `k`: `gaussVector v k i = if k < i then v i / v k else 0`
(`τ_i = v_i / v_k` for `i > k`, zero in the first `k + 1` places, 0-based). ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.2.1, Definition'

[[node]]
id = "gaussTransformation"
kind = "definition"
desc = '''§3.2.1 and (3.2.2), the matrix `M_k = I_n - τ e_kᵀ`:
`gaussTransformation τ k = 1 - Matrix.vecMulVec τ (Pi.single k 1)` for any `τ : Fin n → ℝ`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.2.1, Definition'

[[node]]
id = "IsGaussTransformation"
kind = "definition"
desc = '''§3.2.1: "a matrix of the form `M_k = I_n - τ e_kᵀ` is a Gauss transformation if the first
`k` components of `τ` are zero": `IsGaussTransformation M k ↔ ∃ τ, (∀ i, i ≤ k → τ i = 0) ∧
M = gaussTransformation τ k` (0-based, so `τ_k = 0` too); the entries `τ(k+1:n)` are the
*multipliers*, `τ` the *Gauss vector*. ★'''
deps = ["gaussTransformation"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.1, Definition'

[[node]]
id = "gaussTransformation_gaussVector_mulVec"
kind = "theorem"
desc = '''§3.2.1, the display after (3.2.2): if `v k ≠ 0` then
`gaussTransformation (gaussVector v k) k *ᵥ v = fun i => if i ≤ k then v i else 0`. ★'''
deps = ["gaussTransformation", "gaussVector"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.1'

[[node]]
id = "isUnitLowerTriangular_gaussTransformation"
kind = "theorem"
desc = '''§3.2.1, "such a matrix is unit lower triangular": `IsGaussTransformation M k →
M.IsUnitLowerTriangular` (`Matrix.IsUnitLowerTriangular` of `Hessenberg`). ★'''
deps = ["IsGaussTransformation", "Matrix.IsUnitLowerTriangular"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.1'

[[node]]
id = "gaussTransformation_mul"
kind = "theorem"
desc = '''§3.2.2, the outer-product update: `gaussTransformation τ k * C = C - Matrix.vecMulVec τ (C k)`
for `C : Matrix (Fin n) (Fin r) ℝ` (the book's `C - τ C(k,:)`); when `τ i = 0` for `i ≤ k`, only
the rows below `k` change. ★'''
deps = ["gaussTransformation"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.2'

[[node]]
id = "gaussTransformation_inv"
kind = "theorem"
desc = '''§3.2.5, "if `M_k = I_n - τ e_kᵀ` then its inverse is `I_n + τ e_kᵀ`": when `τ k = 0`,
`gaussTransformation τ k * gaussTransformation (-τ) k = 1` (both orders), since
`(τ e_kᵀ)² = τ (e_kᵀ τ) e_kᵀ = 0`; hence `(gaussTransformation τ k)⁻¹ = gaussTransformation (-τ) k`.
★'''
deps = ["gaussTransformation"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.5'

[[node]]
id = "gaussTransformation_gaussVector_eq_gaussTransform"
kind = "theorem"
desc = '''The book's `M_k` built from the `k`-th column of `M` is the backbone's Gaussian transformation:
`gaussTransformation (gaussVector (fun i => M i k) k) k = Matrix.gaussTransform M k`
(`Matrix.elimMultipliers_apply`), so that `M_k M = Matrix.elimStep M k`
(`Matrix.gaussTransform_mul`). The bridge through which (3.2.3)–(3.2.7) are the backbone's
statements. ★'''
deps = ["gaussTransformation", "gaussVector", "Matrix.gaussTransform", "Matrix.gaussTransform_mul"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.1'

[[node]]
id = "gaussUpdate"
kind = "definition"
desc = '''§3.2.2–3.2.3, applying a computed Gauss transformation, D4: from the pivot column `v`
(`v k ≠ 0` not checked) compute `τ̂_i ← rnd (v i / v k)` for `i > k`, then for `i > k` the rows
`C(i,:) = C(i,:) - τ̂_i C(k,:)` entrywise, `rnd (C i j - rnd (τ̂ i * C k j))` ("the update can be
computed row by row"); returns `(τ̂, Ĉ)`. ★'''
deps = []
source = 'Golub–Van Loan, Matrix Computations, §3.2.2'

[[node]]
id = "gaussVector_rounding"
kind = "theorem"
desc = '''§3.2.3, "`τ̂ = τ + e`, `|e| ≤ u |τ|`": every run of `gaussUpdate fp.round v k C` returns
`τ̂` with `|τ̂ i - gaussVector v k i| ≤ fp.u * |gaussVector v k i|` — one rounded division,
`FloatingPoint.RoundingModel.abs_sub_le`; exact, no `O(u²)`. ★'''
deps = ["gaussUpdate", "gaussVector", "FloatingPoint.RoundingModel.round", "SetM.mem_run_bind"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.3'

[[node]]
id = "gaussUpdate_rounding"
kind = "theorem"
desc = '''§3.2.3, rounding of a Gauss transform update, rigorous: with `τ = gaussVector v k`,
`v k ≠ 0`, every run of `gaussUpdate fp.round v k C` returns `Ĉ = gaussTransformation τ k * C + E`
with `|E i j| ≤ u |C i j| + γ₃ |τ i| |C k j|` (`u < 1`, `3u < 1`), and `E i j = 0` for `i ≤ k`.
Entry `(i, j)`: `ĉ = (c - τ (1+δ₀) c_k (1+δ₁))(1+δ₂)`, so `E = δ₂ c - τ c_k ((1+δ₀)(1+δ₁)(1+δ₂) - 1)`,
bounded by `FloatingPoint.abs_prod_one_add_sub_one_le_gamma` with three factors; each `(1+δ)` from
chapter 2's restatement (2.7.4) of the model, `GolubVanLoan.Chapter02.equation_2_7_4`. The book's
`|E| ≤ 3u(|C| + |τ||C(k,:)|) + O(u²)` follows (`u ≤ 3u`, `γ₃ = 3u + O(u²)`). A direct scalar proof;
no backbone predicate (no second consumer). ★★ (~60 lines)'''
deps = ["gaussUpdate", "gaussTransformation_mul", "FloatingPoint.abs_prod_one_add_sub_one_le_gamma", "GolubVanLoan.Chapter02.equation_2_7_4", "SetM.mem_run_bind"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.3'

