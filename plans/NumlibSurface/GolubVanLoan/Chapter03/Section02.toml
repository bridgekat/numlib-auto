[[node]]
id = "tallOuterProductLU"
kind = "definition"
desc = '''(3.2.8), the outer product LU of a tall `A : Matrix (Fin n) (Fin r) ℝ` (`r ≤ n`), D4 (a
content-named program; its exact specification is `equation_3_2_8`): for
`k : Fin r`, `A(ρ,k) = A(ρ,k)/A(k,k)` with `ρ = k+1:n`, and if `k + 1 < r`,
`A(ρ,μ) = A(ρ,μ) - A(ρ,k) A(k,μ)` with `μ = k+1:r`, entrywise rounded as in Algorithm 3.2.1
(`ρ`, `μ` index lists, convention 10). The factors are read off by the rectangular analogues of
`packedL`/`packedU` (untracked helpers: `L` is `n × r` unit lower trapezoidal, `U` the upper
`r × r` part). ★'''
