[[node]]
id = "equation_3_2_8"
kind = "theorem"
desc = '''(3.2.8) computes a rectangular LU factorization: if `A(1:k,1:k)` is nonsingular for `k = 1:r`,
the unpacked `Id` output of `tallOuterProductLU` is a rectangular LU factorization,
`Matrix.IsRectLU A L U`. Proof: embed `A` as the first `r` columns of the square `[A | [0; I]]` (the
bordering of `Matrix.exists_isRectLU_of_forall_isUnit`) and compare with `algorithm_3_2_1_spec`: the
first `r` steps of Algorithm 3.2.1 on the bordered matrix perform the operations of (3.2.8) on its
first `r` columns (a simulation lemma at `Id`). ★★★ (~150 lines)'''
deps = ["tallOuterProductLU", "algorithm_3_2_1_spec", "Matrix.exists_isRectLU_of_forall_isUnit", "Matrix.IsRectLU"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.2.8)'

[[node]]
id = "equation_3_2_9"
kind = "theorem"
desc = '''(3.2.9), the Schur complement: for `A = [A₁₁ A₁₂; A₂₁ A₂₂]` (`Matrix.fromBlocks` over
`Fin r ⊕ Fin (n-r)`), a factorization `[A₁₁; A₂₁] = [L₁₁; L₂₁] U₁₁` with `L₁₁` unit lower and
`U₁₁` nonsingular upper triangular, and `L₁₁ U₁₂ = A₁₂`: then
`A = [L₁₁ 0; L₂₁ I] [I 0; 0 Ã] [U₁₁ U₁₂; 0 I]` with `Ã = A₂₂ - L₂₁ U₁₂ = A₂₂ - A₂₁ A₁₁⁻¹ A₁₂`.
Block multiplication `Matrix.fromBlocks_multiply`; the second form of `Ã` because
`A₁₁ = L₁₁ U₁₁` is invertible and `L₂₁ U₁₂ = A₂₁ U₁₁⁻¹ L₁₁⁻¹ A₁₂`. Mathlib
`Matrix.fromBlocks_eq_of_invertible₁₁` is the same identity with `A₁₁` unfactored. ★★
(~50 lines)'''
deps = ["Matrix.isBlockLU_fromBlocks_schurComplement"]
source = 'Golub–Van Loan, Matrix Computations, Equation (3.2.9)'

[[node]]
id = "blockLU_of_schur"
kind = "theorem"
desc = '''§3.2.11, after (3.2.9): if moreover `Ã = L₂₂ U₂₂` is an LU factorization, then
`A = [L₁₁ 0; L₂₁ L₂₂] [U₁₁ U₁₂; 0 U₂₂]` is the LU factorization of `A`
(`Matrix.IsLU` after reindexing by `finSumFinEquiv`); the step of Algorithm 3.2.3's recursion.
`Matrix.isBlockLU_fromBlocks_schurComplement`, `Matrix.isBlockLU_fromBlocks`. ★★ (~40 lines)'''
deps = ["equation_3_2_9", "Matrix.isBlockLU_fromBlocks_schurComplement", "Matrix.isBlockLU_fromBlocks", "Matrix.IsLU"]
source = 'Golub–Van Loan, Matrix Computations, §3.2.11'

[[node]]
id = "algorithm_3_2_3"
kind = "definition"
desc = '''Algorithm 3.2.3 (recursive block LU), D4: `algorithm_3_2_3 rnd (r : ℕ) (hr : 0 < r) :
{n : ℕ} → Matrix (Fin n) (Fin n) ℝ → M (Matrix (Fin n) (Fin n) ℝ × Matrix (Fin n) (Fin n) ℝ)` by
well-founded recursion on `n`: if `n ≤ r`, Algorithm 3.2.1 (unpacked); else (3.2.8) (`tallOuterProductLU`) on
`A(:,1:r)`, "solve `L₁₁ U₁₂ = A(1:r,r+1:n)`" by Algorithm 3.1.3 column by column, `Ã = A₂₂ - L₂₁ U₁₂`
entrywise (`rnd (a_ij - s)` with `s ← FloatingPoint.dotAccum rnd (List.finRange r) (L₂₁ i)
(U₁₂ᵀ j) 0`, the dot-product form of the book's level-3 product, whose rounding the book does not
analyse), the recursive call on `Ã : Matrix (Fin (n-r)) …`, and
the block assembly through `Fin.castAdd`/`Fin.natAdd` and `Fin.cast (Nat.add_sub_cancel' _)`.
The dependent-type bookkeeping of the split `Fin n ≃ Fin r ⊕ Fin (n-r)` is the risk; prototype it
before writing the spec. ★★'''
deps = ["algorithm_3_2_1", "tallOuterProductLU", "algorithm_3_1_3", "FloatingPoint.dotAccum"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.3'

[[node]]
id = "algorithm_3_2_3_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 3.2.3: if `A(1:k,1:k)` is nonsingular for `k = 1:n-1` (the
book's precondition "A has an LU factorization" is weaker and does not prevent a zero pivot, e.g.
`!![0, 1; 0, 1]`, on which the algorithm divides `0/0`; see the ch03 report's Doubts), the `Id`
output `(L, U)` satisfies `Matrix.IsLU A L U`. Strong induction on `n`: `equation_3_2_8` for
the block column, `algorithm_3_1_3_spec` for `U₁₂`, `blockLU_of_schur` for the assembly, and the
strict leading principal submatrices of `Ã` nonsingular (they are Schur complements of leading
blocks of `A`: `Matrix.det_fromBlocks₁₁`). ★★★ (~250 lines)'''
deps = ["algorithm_3_2_3", "equation_3_2_8", "algorithm_3_1_3_spec", "blockLU_of_schur", "algorithm_3_2_1_spec"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.3'

[[node]]
id = "algorithm_3_2_4"
kind = "definition"
desc = '''Algorithm 3.2.4 (nonrecursive block LU), D4, for `n = N r` ("for clarity" in the book):
`A : Matrix (Fin (N * r)) (Fin (N * r)) ℝ` read in `r × r` blocks through
`finProdFinEquiv : Fin N × Fin r ≃ Fin (N * r)` (lexicographic, block index major). For `k : Fin N`:
rectangular Gaussian elimination (3.2.8), `tallOuterProductLU`, on the block column `A(k:N, k)`; the multiple right-hand
side solve `L_kk [U_{k,k+1} | … | U_kN] = [A_{k,k+1} | … | A_kN]` by Algorithm 3.1.3 per column;
the level-3 updates `A_ij = A_ij - L_ik U_kj` for `i, j > k`, entrywise as in Algorithm 3.2.3.
Returns the packed matrix. ★★'''
deps = ["tallOuterProductLU", "algorithm_3_1_3", "algorithm_3_2_3"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.4'

[[node]]
id = "algorithm_3_2_4_spec"
kind = "theorem"
desc = '''Exact correctness of Algorithm 3.2.4: under the leading-minor hypothesis,
`Matrix.IsLU A (packedL F) (packedU F)` for its `Id` output `F`. Invariant over `k`: the block
rows and columns `< k` hold the finished factors and the trailing block the Schur complement of
the leading `k r × k r` block (`equation_3_2_9`, `blockLU_of_schur`); equivalently, the output is
`(luLower A, luUpper A)` by uniqueness (`theorem_3_2_1_unique`). ★★★ (~250 lines)'''
deps = ["algorithm_3_2_4", "equation_3_2_8", "algorithm_3_1_3_spec", "equation_3_2_9", "blockLU_of_schur", "theorem_3_2_1_unique"]
source = 'Golub–Van Loan, Matrix Computations, Algorithm 3.2.4'
