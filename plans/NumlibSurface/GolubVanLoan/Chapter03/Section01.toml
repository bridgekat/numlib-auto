`U.IsUpperTriangular → U⁻¹.IsUpperTriangular` and the lower counterpart, on
`Matrix (Fin n) (Fin n) ℝ` (Mathlib's junk inverse makes it unconditional);
`Matrix.IsUpperTriangular.inv`, `Matrix.IsLowerTriangular.inv`. ★'''
deps = ["Matrix.IsUpperTriangular.inv", "Matrix.IsLowerTriangular.inv"]
source = 'Golub–Van Loan, Matrix Computations, §3.1.7'

