[[node]]
id = "inner_residual_eq_zero_iff_forall_quadratic_add_smul_le"
kind = "theorem"
desc = '''Optimality along a direction is orthogonality of the residual (Quarteroni–Sacco–Saleri,
Definition 4.4 and the two displays after it). For `A : E →ₗ[𝕜] E` symmetric with
`0 < re ⟪A p, p⟫` (so any symmetric coercive `A` and `p ≠ 0`), `b x : E` and
`φ y = ½ re ⟪A y, y⟫ - re ⟪b, y⟫`:
`(∀ t : ℝ, φ x ≤ φ (x + t • p)) ↔ re ⟪b - A x, p⟫ = 0`.
The difference `φ (x + t p) - φ x = -t re ⟪r, p⟫ + ½ t² re ⟪A p, p⟫` is a quadratic in `t` with
positive leading coefficient, nonnegative for all `t` iff its linear coefficient vanishes. Over `ℂ`
the book's real parameter `λ` leaves `im ⟪r, p⟫` unconstrained; quantify over `t : 𝕜` to get
`⟪b - A x, p⟫ = 0`, and state both. ★'''
deps = ["IsGalerkin.quadratic_le"]

[[node]]
id = "isGalerkin_iff_forall_quadratic_le"
kind = "theorem"
desc = '''The quadratic-form characterization of Galerkin iterates, the converse of `IsGalerkin.quadratic_le`
([fong2012cg] (2.1); Quarteroni–Sacco–Saleri Definition 4.4 "optimal with respect to `V`"): for
symmetric coercive `A`, finite-dimensional `K`, and `x ∈ x₀ + K`,
`IsGalerkin A b x₀ K x ↔ ∀ y ∈ x₀ + K, φ x ≤ φ y` with `φ y = ½ re ⟪A y, y⟫ - re ⟪b, y⟫`;
equivalently (Quarteroni–Sacco–Saleri's phrasing) `x` is optimal with respect to every direction
`p ∈ K`. `←` from `inner_residual_eq_zero_iff_forall_quadratic_add_smul_le` at each `p ∈ K`; `→`
is `IsGalerkin.quadratic_le`. Also `IsGalerkin.iff_energyNorm_min` is the same statement through
`½ ‖y - x*‖_A² = φ y - φ x*` (Quarteroni–Sacco–Saleri (4.35)). ★'''
deps = ["IsGalerkin", "IsGalerkin.quadratic_le", "IsGalerkin.iff_energyNorm_min", "inner_residual_eq_zero_iff_forall_quadratic_add_smul_le"]
