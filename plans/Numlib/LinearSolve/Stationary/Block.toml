[[node]]
id = "blockJacobiSplitting_step_eq_additiveStep"
kind = "theorem"
desc = '''Saad's remark in §5.4: one block Jacobi step is the additive projection step with
`K i = L i = span {e_j | π j = i}` and all weights `1`, so (4.17) is (5.7) with `W = V = V_i`.

Not attempted; the block splittings it needs are now proved, so what is left is the bridge, and
the bridge is the whole cost. The mathematics is settled and short: the `i`-th Petrov–Galerkin
correction is the vector `w i` supported on block `i` whose block-`i` coordinates are those of
`(blockDiagPart π A)⁻¹ (b - A x)`, because for `π j = i` the entry `(A (w i)) j` equals
`(blockDiagPart π A * w i) j` — the columns outside block `i` are zero — so the residual of
`x + w i` vanishes on block `i`, which is orthogonality to `K i`; uniqueness in
`Projection.existsUnique_isPetrovGalerkin_of_finrank_eq` then identifies it with `pairStep`, and
`∑ i, w i` is `(blockDiagPart π A)⁻¹ (b - A x)`, the block Jacobi step.

What has to be built first, none of which exists: the coordinate subspace
`K i = span {EuclideanSpace.single j 1 | π j = i}` of `EuclideanSpace 𝕜 n` with its membership
criterion `v ∈ K i ↔ ∀ j, π j ≠ i → v j = 0` and the dual criterion
`v ∈ (K i)ᗮ ↔ ∀ j, π j = i → v j = 0`; the `FiniteDimensional` instances; and
`Matrix.IsNondegeneratePair (toEuclideanLin A) (K i) (K i)` from `IsUnit (blockDiagPart π A)`,
which needs invertibility of the block to be transported to the compression of `toEuclideanLin A`
to `K i`. That is a `Numlib/LinearSolve/Projection/Coordinate.lean` worth of API, and it would
serve `blockGaussSeidelSplitting_step_eq_multiplicativeStep` too.'''
deps = ["blockJacobiSplitting", "Projection.additiveStep", "Stationary.Splitting.eq_iterationOperator_mul_add_iff"]
source = "Saad, Iterative Methods for Sparse Linear Systems, Section 5.4, remark on (4.17)"

[[node]]
id = "blockGaussSeidelSplitting_step_eq_multiplicativeStep"
kind = "theorem"
desc = '''One block Gauss–Seidel sweep is the multiplicative projection sweep over the blocks in
increasing label order (Saad §5.4, Algorithm 5.6).

Not attempted, for the reason recorded on `blockJacobiSplitting_step_eq_additiveStep`: it needs
the same coordinate-subspace API, and in addition an induction over the sweep list showing that
after the blocks with labels `< i` have been updated the residual on block `i` is the one the
Gauss–Seidel formula uses. The list has to enumerate `Finset.univ.image π` in increasing order,
which asks for `[Fintype ι]` here although the splittings themselves do not need it.'''
deps = ["blockGaussSeidelSplitting", "Projection.multiplicativeStep"]
source = "Saad, Iterative Methods for Sparse Linear Systems, Section 5.4, Algorithm 5.6"
