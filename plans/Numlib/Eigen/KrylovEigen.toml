[[node]]
id = "Arnoldi.norm_starProjection_comp_orthogonal_eq_coeff"
kind = "theorem"
desc = '''Saad-eig Prop 6.6 in basis-free form: for `K = 𝒦_m(A, b)` with `m ≤ grade`,
`‖(1 - P_K) A P_K‖ = h_{m+1,m} = Arnoldi.coeff A b m (m - 1)`, because `(1 - P_K) A v_j = 0` for
`j < m - 1` and `(1 - P_K) A v_{m-1} = h_{m,m-1} v_m`; for symmetric `A` also `‖P_K A (1 - P_K)‖ = β_m`,
which is the `γ` of the Ritz bounds of `Numlib/Eigen/RayleighRitz` on a Krylov subspace.'''
deps = ["Arnoldi.coeff", "Arnoldi.apply_vec", "Arnoldi.vec_mem_orthogonal", "Arnoldi.starProjection_apply_vec", "Krylov.norm_starProjection_apply_le_opNorm"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Proposition 6.6 and Section 6.6.3"

[[node]]
id = "Lanczos.sin_angle_ritzVector_le"
kind = "theorem"
desc = '''The Ritz-vector bound of the Lanczos process (Saad-eig §6.6.3): Thm 4.6 on `K = 𝒦_m(A, v)` with
`γ = β_m`, so `sin θ(u_i, ũ_i) ≤ √(1 + β_m²/δ_i²) sin θ(u_i, 𝒦_m)`, and `sin θ(u_i, 𝒦_m)` bounded
by `Lanczos.tan_angle_le`; `LinearMap.IsSymmetric.sin_angle_ritzVector_le` with
`Arnoldi.norm_starProjection_comp_orthogonal_eq_coeff`.'''
deps = ["LinearMap.IsSymmetric.sin_angle_ritzVector_le", "Arnoldi.norm_starProjection_comp_orthogonal_eq_coeff", "Lanczos.tan_angle_le"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Section 6.6.3"

[[node]]
id = "Arnoldi.norm_sub_starProjection_le_iInf"
kind = "theorem"
desc = '''Saad-eig Lemma 6.2, the non-Hermitian angle bound: for diagonalizable `A` with `v₁ = ∑ α_k u_k`
in a unit eigenbasis and `α_i ≠ 0`, `‖(1 - P_m) u_i‖ ≤ ξ_i ε_i^{(m)}` where
`ξ_i = ∑_{k ≠ i} |α_k|/|α_i|` and `ε_i^{(m)} = min {max_{λ ∈ σ(A) \ {λ_i}} |p(λ)| : deg p ≤ m - 1, p(λ_i) = 1}`;
the non-symmetric twin of `Lanczos.tan_angle_eq_iInf`, with the triangle inequality in place of
Pythagoras.'''
deps = ["Lanczos.tan_angle_eq_iInf", "Krylov.subspace", "Krylov.mem_subspace_iff_exists_aeval"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Lemma 6.2"

[[node]]
id = "Arnoldi.norm_sub_starProjection_le_of_mem_closedBall"
kind = "theorem"
desc = '''Saad-eig Prop 6.10 and Thm 6.8: if all eigenvalues but `λ₁` lie in the disc `C(c, ρ)` then
`ε_1^{(m)} ≤ (ρ/|λ₁ - c|)^{m-1}` (the polynomial `((z - c)/(λ₁ - c))^{m-1}`, optimal by
Zarantonello); if they lie in the ellipse `E(c, d, a)` then
`ε_1^{(m)} ≤ C_{m-1}(a/d)/|C_{m-1}((λ₁ - c)/d)|` by the ellipse maximum of
`Numlib/RingTheory/Polynomial/ChebyshevEllipse`. Phase 3 with that module.'''
deps = ["Arnoldi.norm_sub_starProjection_le_iInf", "Polynomial.zarantonello", "Polynomial.Chebyshev.sSup_norm_eval_shiftedComplex_ellipse"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Proposition 6.10 and Theorem 6.8"
