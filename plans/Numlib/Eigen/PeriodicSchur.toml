[[node]]
id = "Matrix.blockCyclic"
kind = "definition"
desc = '''The block-cyclic matrix of a family ([golub2013matrix] §7.8.2):
`blockCyclic A : Matrix (Fin (p+1) × Fin n) (Fin (p+1) × Fin n) R` with block `(i+1, i)` equal to
`A i` for `i < p`, block `(0, p)` equal to `A p`, and zero blocks elsewhere (the book's
`[0 0 A₃; A₁ 0 0; 0 A₂ 0]`). ★'''
deps = []

