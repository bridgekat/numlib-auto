desc = '''
The product eigenvalue problem ([golub2013matrix] §7.8.2): condensed and Schur forms of a product
`A_{p-1} ⋯ A₁ A₀` computed through the factors, and the block-cyclic matrix that turns it into a
structured single-matrix problem.

For a family `A : Fin (p+1) → Matrix (Fin n) (Fin n) ℝ` (the book: `p + 1 = 3`, `A = A₃ A₂ A₁`), a
*periodic* decomposition is a family of orthogonal `U : Fin (p+1) → Matrix …` with
`U (i+1)ᵀ * A i * U i` upper triangular for `i < p` and `U 0ᵀ * A p * U p` upper Hessenberg
((7.8.5), "Hessenberg–triangular–triangular") or upper quasi-triangular ((7.8.6), the periodic real
Schur form). Then `U 0ᵀ (A p ⋯ A 0) U 0` is the product of the transformed factors, Hessenberg
(resp. quasi-triangular) times upper triangular ones (`Matrix.IsQuasiUpperTriangular.mul_isUpperTriangular`,
`Matrix.IsUpperHessenberg.mul_isUpperTriangular`).

Existence, in two steps (the argument of `Numlib/LinearAlgebra/Matrix/GeneralizedSchur`, which is
the case `p + 1 = 2` of (7.8.6) with one factor inverted):

* **nonsingular factors** — take `U 0` from the real Schur form (resp. a Hessenberg reduction) of the
  product, then QR-factor successively: `A 0 U 0 = U 1 T₀`, `A 1 U 1 = U 2 T₁`, …; the last factor is
  forced, `U 0ᵀ A p U p = (U 0ᵀ Π U 0)(T_{p-1} ⋯ T₀)⁻¹`, quasi-triangular (resp. Hessenberg) times upper
  triangular;
* **general factors** — perturb `A i + ε_k I` to nonsingular for `i < p`
  (`Matrix.exists_forall_isUnit_det_add_smul_one`), extract a convergent subsequence of the
  orthogonal families (`Matrix.isCompact_orthogonalGroup`, a finite product of compact sets) and of
  the finitely many block patterns (pigeonhole, as in `Matrix.exists_generalizedRealSchur`); vanishing
  entries are closed conditions.

The block-cyclic matrix `blockCyclic A` (`A p` in the top-right block, `A i` on the block
subdiagonal) is conjugated by `blockDiagonal U` into the block-cyclic matrix of the transformed
factors, and after the perfect shuffle of [golub2013matrix] §1.2.11 (chapter 1's
`Numlib/LinearAlgebra/Matrix/Kronecker`: the index map `Matrix.finPerfectShuffle`, the matrix
`Matrix.perfectShuffle`) it is upper Hessenberg: the transformed factors being triangular except one Hessenberg
factor, a nonzero entry `(i, j)` of block `(b, b')` lands at `(r(i, b), r(j, b'))` with
`r(i, b) ≤ r(j, b') + 1`.

**The complex periodic Schur form** (`Matrix.exists_unitary_periodicSchur`: over `ℂ`, *all* transformed
factors upper triangular, Bojanczyk–Golub–Van Dooren 1992) is the natural backbone statement (eigen
review, Low); the real forms (7.8.5)–(7.8.6) with their one Hessenberg / quasi-triangular factor are
what real arithmetic can reach, and the book's. Its singular case needs no pattern pigeonhole:
triangularity is a closed condition on every factor.

The book states the convergence of a product QR iteration ((7.8.7)) without content; nothing is
planned for it. Mathlib: nothing (grep `periodic` in `LinearAlgebra/Matrix`: none). About 700 lines.
'''

