deps = ["Matrix.blockCyclic"]

[[node]]
id = "Matrix.isUpperHessenberg_reindex_blockCyclic"
kind = "theorem"
desc = '''[golub2013matrix] §7.8.2 ("a highly structured upper Hessenberg matrix"): if `A i` is upper
triangular for `i < p` and `A p` is upper Hessenberg, then `blockCyclic A`, reindexed by
`finProdFinEquiv.trans (Matrix.finPerfectShuffle (p+1) n) : Fin (p+1) × Fin n ≃ Fin (n * (p+1))`,
`(b, i) ↦ (p+1) i + b` (the book's `𝒫_{34}` for `p + 1 = 3`, `n = 4`), is upper Hessenberg. Entry bookkeeping: block `(b+1, b)` entry `(i, j)` with `i ≤ j` lands at
row `(p+1) i + b + 1`, column `(p+1) j + b`; block `(0, p)` entry with `i ≤ j + 1` at row `(p+1) i`,
column `(p+1) j + p`. The matrix form `𝒫 H̃ 𝒫ᵀ` is the same through `Matrix.perfectShuffle`
(a permutation matrix of `finPerfectShuffle`). ★★'''
deps = ["Matrix.blockCyclic", "Matrix.IsUpperHessenberg", "Matrix.finPerfectShuffle", "Matrix.perfectShuffle"]

[[node]]
id = "Matrix.exists_unitary_periodicSchur"
kind = "theorem"
desc = '''The complex periodic Schur decomposition (Bojanczyk, Golub and Van Dooren 1992; the complex
analogue of [golub2013matrix] (7.8.6)): for any family `A : Fin (p+1) → Matrix (Fin n) (Fin n) 𝕜` over an
algebraically closed `RCLike 𝕜` (i.e. `ℂ`) there are `U : Fin (p+1) → Matrix (Fin n) (Fin n) 𝕜` with `U i
∈ unitaryGroup` and `star (U (i + 1)) * A i * U i` upper triangular for **every** `i : Fin (p+1)` (indices
mod `p + 1`); then `star (U 0) * (A p ⋯ A 0) * U 0` is upper triangular with the eigenvalues of the
product on its diagonal, the products of the factors' diagonals. Proof: nonsingular `A i` (`i < p`):
`U 0` from the Schur form of the product (`Matrix.exists_unitary_conj_upperTriangular`), then QR-factor
successively (`Matrix.exists_unitary_mul_isUpperTriangular`); the last factor is `(Schur form of the
product) (T_{p-1} ⋯ T₀)⁻¹`, triangular. General factors: perturb `A i + ε_k I`
(`Matrix.exists_forall_isUnit_det_add_smul_one`), extract a convergent subsequence of the unitary
families (`Matrix.isCompact_unitaryGroup`, a finite product of compact sets);
triangularity of each factor is closed. ★★ (~200 lines)'''
deps = ["Matrix.exists_unitary_conj_upperTriangular", "Matrix.exists_unitary_mul_isUpperTriangular", "Matrix.exists_forall_isUnit_det_add_smul_one", "Matrix.isCompact_unitaryGroup"]
