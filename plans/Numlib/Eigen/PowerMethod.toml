# Planned additions (GVL round): the module doc of `Numlib.Eigen.PowerMethod` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch07) add to "Rayleigh quotients, the diagonalizable rate": the rate of the Rayleigh quotient and
# of the eigendirection for a *nonsymmetric* operator with an eigenbasis (Golub–Van Loan (7.3.5) and
# the display before it), `O((ρ/|λ₁|)^k)` — for a symmetric operator the rate is squared
# (`LinearMap.IsSymmetric.abs_sub_rayleigh_powerIterate_le`).
# (ch08) in "Rayleigh quotients, the diagonalizable rate, and changes of coordinates", add the two
# eigenbasis-form bounds of [golub2013matrix] Theorem 8.2.1 — the angle bound
# `Krylov.sinAngle_powerIterate_le_of_eigenbasis` ((8.2.4): `sin θ_k ≤ tan θ_0 (ρ/|λ|)^k`) and the
# Rayleigh-quotient bound `Krylov.abs_sub_rayleigh_powerIterate_le_of_eigenbasis` ((8.2.5), with the
# book's `max_{i ≠ i₀} |λ_{i₀} - λ_i|` in place of the spread `b - a` of
# `LinearMap.IsSymmetric.abs_sub_rayleigh_powerIterate_le`, which becomes its corollary) — both for
# an arbitrary orthonormal eigenbasis, so that the surface's given Schur decomposition applies
# without matching it to `eigenvectorBasis`. (The explicit-constant rate for symmetric operators,
# `LinearMap.IsSymmetric.gap_subspaceIterate_le` ((8.2.12)), staged here by ch08, moved at the GVL
# review to `Numlib/Eigen/InvariantSubspace`, beside the graph transport it shares with Theorem 7.3.1;
# mention it in "subspace iteration" as a pointer.)
