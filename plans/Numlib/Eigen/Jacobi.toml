[[node]]
id = "tendsto_classicalJacobiIterate"
kind = "theorem"
desc = '''Kress Thm 7.14, the half that is still open: the classical Jacobi iterates converge to a
*diagonal matrix* whose diagonal entries are the eigenvalues of `A` as a multiset. The
off-diagonal mass tends to `0` (`tendsto_offDiagNormSq_classicalJacobiIterate`) and every iterate
carries the characteristic polynomial of `A` (`charpoly_classicalJacobiIterate`), so what is
missing is the passage from those two to convergence of the diagonal itself: the diagonal entries
of a symmetric matrix with off-diagonal mass `ε` are within `√ε` of the eigenvalues (Gershgorin,
`Matrix.spectrum_subset_iUnion_closedBall`), and a compactness argument is needed to pin down the
ordering, since the diagonal converges only up to a permutation.'''
deps = ["tendsto_offDiagNormSq_classicalJacobiIterate", "charpoly_classicalJacobiIterate",
  "spectrum_subset_iUnion_closedBall"]
source = "Kress, Numerical Analysis, Theorem 7.14"
