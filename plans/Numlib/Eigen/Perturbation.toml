[[node]]
id = "Matrix.card_spectrum_of_disjoint_gershgorin"
kind = "theorem"
desc = '''
Gershgorin disc counting (Saad-eig Thm 3.12): if the union `S` of `m` of the discs is disjoint
from the other discs, `S` contains exactly `m` eigenvalues with multiplicity.

Still open, and of the five open backbone nodes this is the one whose obstruction has survived every
check. The statement was re-read in the book text (Thm 3.12 of
`books/numerical-methods-for-large-eigenvalue-problems-saad.txt`) and is as quoted; his proof is the
homotopy `A(t) = D + tH` together with "by a continuity argument, as `t` increases to 1, the branches
of eigenvalues will stay in their respective discs". That continuity of the branches is the whole of
what is missing.

**What the pinned Mathlib does and does not have, re-grepped.** `Rouche` does not occur; no residue
theorem occurs (`Mathlib/Analysis/Calculus/LogDeriv` mentions a logarithmic residue at a simple zero
and nothing more); there is no continuity statement about `Polynomial.roots` anywhere under
`Mathlib/Analysis` or `Mathlib/Topology`. The Cauchy integral formula *is* Banach-valued
(`Mathlib/Analysis/Complex/CauchyIntegral.lean` carries `{E} [NormedAddCommGroup E] [NormedSpace ℂ E]`
throughout) and the resolvent is already differentiable off the spectrum
(`spectrum.hasDerivAt_resolvent_const_left`), so an earlier note claiming otherwise was wrong; but
the Cauchy formula wants the integrand differentiable *inside* the contour, and the resolvent has
poles there, so the Riesz projector `P = (2πi)⁻¹ ∮ (z - A)⁻¹ dz` cannot be shown idempotent by it.

**A third route, elementary and not attempted, which needs no complex analysis at all.** All the
homotopy needs is that the number of roots of a monic polynomial in a compact set `S` is locally
constant when the roots stay in `S ∪ S'` with `S, S'` disjoint compact. Split `p = q r` with `q`
monic carrying the roots in `S`; multiplication of monic polynomials, read in coefficients, is a
polynomial map `𝕜^k × 𝕜^{n-k} → 𝕜^n` whose derivative at `(q, r)` is `(q̇, ṙ) ↦ q̇ r + q ṙ`,
surjective exactly because `gcd (q, r) = 1`, so the inverse function theorem gives a *continuous
factorization* of every nearby monic polynomial. That the factors keep their roots where they were
is then the one-sided estimate `min_i |β - α_i|^n ≤ |p (β)| = |p (β) - p̃ (β)|`, which is three
lines. This replaces Rouché by `HasStrictFDerivAt.localInverse` plus Bézout, both of which Mathlib
has; the cost is the coefficient-level calculus of the multiplication map. Whether that is cheaper
than proving Rouché outright is a judgement, not a measurement.
'''
deps = ["Matrix.spectrum_subset_iUnion_closedBall"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Theorem 3.12"

[[node]]
id = "Module.End.hasDerivAt_eigenvalue_perturbation"
kind = "theorem"
desc = '''
The *existence* of a differentiable branch of eigenvalues of `A + t E` through a simple eigenvalue
`l` of `A`. The derivative formula itself is done:
`Module.End.deriv_eigenvalue_perturbation` computes `l'(0) = <w, E u>/<w, u>` for any branch that is
differentiable at `0`, and `Module.End.norm_deriv_eigenvalue_perturbation_le` bounds it by
`||E|| * eigenvalueCondNumber`, which is Saad-eig 3.2.1 in full apart from the branch.

**Mathlib still has no differentiability of a determinant in its entries** — re-grepped: no
`contDiff_det`, no `HasFDerivAt … det`, nothing. So any route through `f (t, μ) = det (A + t E - μ)`
has to build that first, and then still has to extract `μ (t)` from `HasStrictFDerivAt.implicitFunction`,
which parametrizes the solution set by `ker f'` rather than by `t`.

**A route that needs neither the determinant nor an implicit/inverse function theorem, not
attempted.** It is Saad's own derivation made into a contraction. Let `P` be the spectral projector
of the simple eigenvalue `l`, `P z = φ (z) • u`, and `S = S(l) (1 - P)` the reduced resolvent of
`Numlib/Eigen/ReducedResolvent`, which satisfies `S (A - l) y = y` on `ker P`. Looking for
`u (t) = u + y (t)` with `P y = 0`, the eigenvalue equation splits under `P` and `1 - P` into

  `μ = l + t φ (E (u + y))`,        `y = t · S [φ (E (u + y)) • y - (1 - P) (E (u + y))]`.

The second is `y = t G (t, y)` with `G` bounded and Lipschitz in `y` near `(0, 0)`, so Banach's
fixed point theorem gives a unique small `y (t)` for small `t`; and then `y (t) → 0` forces
`y (t)/t → G (0, 0)`, which *is* `HasDerivAt y (G (0,0)) 0` because `y 0 = 0`. No linearization
theorem is invoked: the differentiability falls out of the fixed-point equation itself. `μ` is then
differentiable by composition, and `Module.End.deriv_eigenvalue_perturbation` names `μ' (0)`.

Note that the existing `Module.End.deriv_eigenvalue_perturbation` takes its eigen-relation for *all*
`t`; a branch built this way exists only near `0`, so this node should be stated with
`∀ᶠ t in 𝓝 0` and the derivative formula reproved in that form (its proof is local anyway).

Nothing above was attempted in Lean, and the claim that the contraction closes is a derivation on
paper, not a measurement.
'''
deps = ["Module.End.eigenvalueCondNumber", "Module.End.deriv_eigenvalue_perturbation"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Section 3.2.1"

