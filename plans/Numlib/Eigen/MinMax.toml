# `RayleighRitz`, placed here); and Ky Fan's principle `sum_re_inner_le_sum_eigenvalues`, proved from
# Cauchy interlacing for the compression to the span of the family, is the one source of the
# trace-maximization results (Hoffman–Wielandt here; its SVD form and von Neumann's trace inequality in
# `Analysis/Matrix/SingularValues` are corollaries).
