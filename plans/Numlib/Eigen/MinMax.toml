# (ch08) add to "Main results": the sorted spectral decomposition
# `Matrix.IsHermitian.exists_unitary_conj_eq_diagonal_eigenvalues₀` (the symmetric Schur
# decomposition with the eigenvalues in decreasing order, [golub2013matrix] Theorem 8.1.1); the
# two-sided Weyl bounds `LinearMap.IsSymmetric.eigenvalues_add_mem_Icc` ([golub2013matrix] Theorem
# 8.1.5); the low-rank interlacing
# `LinearMap.IsSymmetric.eigenvalues_le_of_isPositive_sub_of_finrank_range_le` (a positive
# perturbation of rank `≤ r` moves every eigenvalue up by at most `r` places, [golub2013matrix]
