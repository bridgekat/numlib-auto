# `Matrix.IsHermitian.hoffman_wielandt` ([golub2013matrix] Theorem 8.1.4), the Frobenius-norm companion
# of Weyl's inequality, proved by Abel summation from Ky Fan's maximum principle (Golub–Van Loan review,
# eigen item 4).
# (ch12) Add to the main results: the stationary points of the Rayleigh quotient of a symmetric
# operator are exactly its eigenvectors
# (`LinearMap.IsSymmetric.hasFDerivAt_rayleighQuotient_eq_zero_iff`, [golub2013matrix] (12.5.23));
# Mathlib has only the extremal case (`IsSelfAdjoint.hasEigenvector_of_isLocalExtrOn`).
