# Planned additions (GVL round): the module doc of `Numlib.Eigen.QRAlgorithm` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch07) add a section "QR steps for arbitrary factorizations, and the Francis step". The canonical
# `Matrix.qrQ`/`qrR` steps above fix one QR factorization; the textbook algorithms (Golub–Van Loan
# §7.3–7.5; chapter 8's symmetric QR) compute *some* QR factorization, by Givens rotations or
# Householder reflectors with their own sign conventions. `Matrix.IsShiftedQrStep μ H H'` says that
# `H'` is one QR step with shift `μ` for some factorization; the canonical step is one, every such
# step is a unitary similarity, Hessenberg form survives a nonsingular step, the exact shift
# deflates (Golub–Van Loan Theorem 7.5.1), and chains of steps multiply out to the shifted
# polynomial (their (7.5.7), P7.5.5). `Matrix.IsFrancisStep s t H H'` is the specification of the
# implicit double-shift (Francis) step, "H' = Zᵀ H Z Hessenberg with Zᵀ (H² - s H + t I) upper
# triangular", identified with the explicit `doubleShiftQrStep` up to a ±1 diagonal similarity
# through the implicit Q theorem (`Numlib/LinearAlgebra/Matrix/UnreducedHessenberg`, which this
# module then imports). The module doc's remark "the real-arithmetic Francis implementation is not
# defined" becomes: its specification is `IsFrancisStep`; the implementation is Golub–Van Loan
# Algorithm 7.5.1 in the surface.
# (consolidation) Add to the same section: chains of steps with explicit factors,
# `Matrix.IsShiftedQrChain H V R μ p` ([golub2013matrix] (10.5.4)), the hypothesis of the product
# identity `Matrix.prod_mul_prod_reverse_eq_prod_sub_smul_one`, with its similarity, Hessenberg, band
# and first-column lemmas and the existence of Givens chains for arbitrary shifts (planned by ch10 for
# `Eigen/ImplicitRestart`, moved here beside `IsShiftedQrStep`).
# (GVL review) Add to "orthogonal iteration": `Matrix.IsOrthogonalIterationStep A Q Q'` (one step for
# *some* thin QR factorization, `∃ R, IsThinQR (A * Q) Q' R`), with existence for every orthonormal
# block, the range identity `ran Q_k = A^k ran Q₀` under full rank, and the identification of a square
# step with an unshifted `IsShiftedQrStep` — the one vocabulary both Golub–Van Loan chapters 7 and 8
# restate. The implicit Q theorem this module uses now lives in
# `Numlib/LinearAlgebra/Matrix/KrylovDecomposition`.
