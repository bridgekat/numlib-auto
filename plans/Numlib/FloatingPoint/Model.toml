# Planned additions (GVL round): the module doc of `Numlib.FloatingPoint.Model` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch01) add to the module description: "Two properties a concrete model may have are named here for
# the program semantics of `Numlib/FloatingPoint/Program`: the exact model `RoundingModel.exact K`
# (`u = 0`, `Rounds x y ↔ y = x`), and `RoundingModel.IsIdempotent` (rounding fixes its own
# outputs), which is what makes the first addition `0 + fl(x₁y₁)` of a textbook inner-product loop
# exact and so gives the book's `γ_n` rather than `γ_{n+1}`."
# (Fix-A, GVL review) and `RoundingModel.IsTotal` (every value has a rounding), the hypothesis under
# which a program's run set is nonempty, so that "for every run" theorems are not vacuous.
# (ch02) Add the sharp product bound `|∏ (1 + δ_i) - 1| ≤ (1 + u)^n - 1` and Wilkinson's `1.01 n u`
# constant ([golub2013matrix] Lemma 2.7.1; [higham2002accuracy] Lemma 3.1's classical form): `γ_n`
# alone does not give `1.01 n u` at `n u = 0.01`, since `γ_n = n u / 0.99 > 1.01 n u`.
