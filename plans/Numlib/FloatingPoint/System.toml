[[node]]  # staged by ch01
id = "System.roundingModel_isIdempotent"
kind = "theorem"
desc = '''`(s.roundingModel K).IsIdempotent`: `roundingModel_rounds_iff` and `System.round_round` (proved in
`notes/gvl/ch01/proto/Program.lean`). ★'''
deps = ["FloatingPoint.System.roundingModel", "FloatingPoint.System.round_round", "FloatingPoint.RoundingModel.IsIdempotent"]

[[node]]  # staged by ch01
id = "System.chop_chop"
kind = "theorem"
desc = '''Chopping is idempotent: `s.chop (s.chop x) = s.chop x` for every `x`. The chopped mantissa is an
integer in `[β^{t−1}, β^t)` (or `x = 0`), so a second chop truncates an integer and changes nothing;
chopping never carries into the next binade, so this is simpler than `System.round_round`, on which
it should be modelled (`round_eq_self_of_abs_eq`). ★★'''
deps = ["FloatingPoint.System.chop"]

[[node]]  # staged by ch01
id = "System.choppingModel_isIdempotent"
kind = "theorem"
desc = '''`(s.choppingModel K).IsIdempotent`, from `System.chop_chop`. ★'''
deps = ["FloatingPoint.System.choppingModel", "FloatingPoint.System.chop_chop", "FloatingPoint.RoundingModel.IsIdempotent"]

[[node]]  # staged by ch02
id = "System.abs_sub_le_of_forall_abs_sub_le"
kind = "theorem"
desc = '''**A nearest floating-point number has relative error at most `u`** ([golub2013matrix] §2.7.2 and
P2.7.2): for `[FloorRing K]`, `xmin ≤ |x| ≤ xmax`, `y ∈ s.numbers K` and `∀ z ∈ s.numbers K, |y - x| ≤
|z - x|`, we get `|y - x| ≤ s.unitRoundoff K * |x|`. Compare with `z = s.round x`, which is in `𝔽`
(`System.round_mem_numbers`) and within `u |x|` (`System.abs_round_sub_le`). ★'''
deps = ["FloatingPoint.System.round_mem_numbers", "FloatingPoint.System.abs_round_sub_le"]

[[node]]  # staged by ch02; restated by Fix-A (GVL review, algo M8)
id = "System.nearestModel"
kind = "definition"
desc = '''The round-to-nearest rounding relation of a system, tie rule unspecified: `u = unitRoundoff`,
`Rounds x y := (x = 0 ∧ y = 0) ∨ (xmin ≤ |x| ∧ |x| ≤ xmax ∧ y ∈ s.numbers K ∧ ∀ z ∈ s.numbers K,
|y - x| ≤ |z - x|)`, with `abs_sub_le` from `abs_sub_le_of_forall_abs_sub_le` (the zero branch is
`|0 - 0| ≤ u · 0`). **Zero rounds to zero**: without the first disjunct an exact zero intermediate
(`0 · x`, `x - x`, the start `c = 0` of an accumulation fed back through `fl(0 + p)`) would have no
rounding, the run set of every program computing one would be empty, and every "for every run"
theorem about such a program vacuous (review `notes/gvl/review/algo.md` M8). Partial otherwise
(values with `0 < |x| < xmin`, gradual underflow, and `|x| > xmax`, overflow, have no rounding) and
not functional (ties); IEEE round-half-to-even and the total `System.roundingModel` (whose `Rounds`
implies this one in range and at `0`) are instances. ★'''
deps = ["FloatingPoint.System.abs_sub_le_of_forall_abs_sub_le", "FloatingPoint.RoundingModel"]

[[node]]  # Fix-A (GVL review, algo M8)
id = "System.nearestModel_isIdempotent"
kind = "theorem"
desc = '''`(s.nearestModel K).IsIdempotent`: if `Rounds x y` and `Rounds y z` then `z = y`. For `x = 0`,
`y = 0` and the zero branch gives `z = 0`. In range, `y ∈ 𝔽` and `y ≠ 0` with `xmin ≤ |y| ≤ xmax`
(`xmin, xmax ∈ 𝔽` are candidates, so `|y - x| ≤ |x| - xmin` and `≤ xmax - |x|`), hence `Rounds y z`
is the in-range branch and `|z - y| ≤ |y - y| = 0`. ★★'''
deps = ["FloatingPoint.System.nearestModel", "FloatingPoint.RoundingModel.IsIdempotent"]

