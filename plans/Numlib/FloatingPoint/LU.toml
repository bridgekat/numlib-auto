namespace = "FloatingPoint"
desc = '''
The backward error of Gaussian elimination, Cholesky and the Thomas algorithm in the relational
rounding model (Quarteroni–Sacco–Saleri §3.3.2, §3.4.2, §3.7.1, §3.10; Higham §9.3, §10.1.1, §9.6).

The factorization is described in its Doolittle form: `RoundsLU m A L̂ Û` says that `L̂` is unit
lower triangular, `Û` upper triangular, and each entry is an admissible rounding of the recurrence
(3.43) — `Û i j = fl(A i j - fl(∑_{r<i} L̂ i r Û r j))` for `i ≤ j`, `L̂ i j = fl(fl(A i j - fl(∑_{r<j}
L̂ i r Û r j)) / Û j j)` for `j < i` — with the inner products in any order. Every loop order of
GE performs exactly these operations on exactly these numbers (Higham §9.3: "the analysis applies
to all the variants"), so one relation covers Programs 4–6. Cholesky (`RoundsCholesky`) and the
Thomas recurrence (`RoundsThomas`) are the same shape with a square root, respectively with the
three-term recurrence (3.53).

Results, entrywise (`Matrix.abs`, `≤ₑ`), over an ordered field:

* Higham Theorem 9.3 = QSS (3.40): `L̂ Û = A + ΔA`, `|ΔA| ≤ γ_n |L̂| |Û|`, from the scalar Lemma 8.4
  (`FloatingPoint/Substitution.exists_rounds_sub_dot_div_eq`) entry by entry;
* Higham Theorem 9.4: factor then two substitutions, `(A + ΔA) x̂ = b`, `|ΔA| ≤ γ_{3n} |L̂| |Û|`
  (the rigorous form of QSS (3.64), whose `n u (3|A| + 5|L̂||Û|) + O(u²)` is the first-order form of
  Golub–Van Loan);
* the normwise bound with the growth factor, Higham Theorem 9.5 = QSS (3.67), stated
  *conditionally* on `|L̂| ≤ 1` and `|Û| ≤ ρ max |A|` — the "illicit manoeuvre" Higham confesses
  to is exactly that these hold for the exact factors and not for the computed ones, so the honest
  theorem takes them as hypotheses;
* QSS (3.41): `|ΔA| ≤ n u / (1 - 2 n u) |A|` when `L̂`, `Û` are entrywise nonnegative;
* Higham Theorem 10.3: Cholesky, `R̂ᵀ R̂ = A + ΔA`, `|ΔA| ≤ γ_{n+1} |R̂ᵀ| |R̂|` (QSS quotes
  Wilkinson's normwise `8 n (n+1) u ‖A‖₂`, which is not reproduced);
* Higham (9.22) and Theorem 9.14 for the Thomas algorithm: `|ΔA| ≤ (4u + 3u² + u³) |L̂| |Û|`, and
  `|ΔA| ≤ (4u + 3u² + u³)/(1 - u) |A|` when the computed pivots are positive, which holds for
  symmetric positive definite and for M-matrices once `u` is small (QSS §3.7.1).

The exact-arithmetic objects are `LinearAlgebra/Matrix/LU`, `LU/Elimination`, `LU/Pivoting`,
`Cholesky`; the model is `FloatingPoint/Model`; the triangular solves are
`FloatingPoint/Substitution`. Prototype: `notes/qss/ch03/proto/ProtoFloatingPoint.lean`.
'''

[[node]]
id = "RoundsLU"
kind = "definition"
desc = '''Structure `RoundsLU (m : RoundingModel K) (A L U : Matrix n n K) : Prop` with fields
`lower_apply_eq_zero : ∀ i j, i < j → L i j = 0`, `lower_diag : ∀ i, L i i = 1`, `upper_apply_eq_zero
: ∀ i j, j < i → U i j = 0`, `upper : ∀ i j, i ≤ j → ∃ s, RoundsDot m (fun r : {r // r < i} => L i r)
(fun r => U r j) s ∧ m.Rounds (A i j - s) (U i j)`, `lower : ∀ i j, j < i → ∃ s t, RoundsDot m (fun
r : {r // r < j} => L i r) (fun r => U r j) s ∧ m.Rounds (A i j - s) t ∧ m.Rounds (t / U j j) (L i
j)`. (`kind` is `definition` for the tracker.) ★'''
deps = ["FloatingPoint.RoundsDot"]

[[node]]
id = "exists_roundsLU_mul_eq_add"
kind = "theorem"
desc = '''Higham Theorem 9.3 = QSS (3.40): `m.u < 1`, `card n * u < 1`, `RoundsLU m A L U` (with `U j j ≠ 0`
where a division occurs) give `∃ ΔA, ΔA.abs ≤ₑ gamma m.u (card n) • (L.abs * U.abs) ∧ L * U = A +
ΔA`. Entry `(i, j)`: the `U`-branch is `abs_sub_le_of_roundsDot` plus one rounding, the `L`-branch
is `exists_rounds_sub_dot_div_eq`; in both `A i j - (L U) i j` is bounded by `γ_k ∑_{r ≤ min i j}
|L i r| |U r j|` with `k ≤ card n`. ★★★ (the bookkeeping is the same as in
`abs_sub_le_of_roundsDot`, done twice; the difficulty is only in the size of the statement).'''
deps = ["FloatingPoint.RoundsLU", "FloatingPoint.abs_sub_le_of_roundsDot", "FloatingPoint.exists_rounds_sub_dot_div_eq", "FloatingPoint.gamma_mono"]

[[node]]
id = "exists_roundsLU_solve_eq"
kind = "theorem"
desc = '''Higham Theorem 9.4: `RoundsLU m A L U`, `RoundsForwardSubst m L b ŷ`, `RoundsBackSubst m U ŷ x̂`, `3
card n * u < 1` give `∃ ΔA, ΔA.abs ≤ₑ gamma m.u (3 * card n) • (L.abs * U.abs) ∧ (A + ΔA) *ᵥ x̂ = b`.
`b = (L + ΔL)(U + ΔU) x̂` and `|ΔA| ≤ |ΔA₁| + |ΔL||U| + |L||ΔU| + |ΔL||ΔU| ≤ (3γ_n + γ_n²) |L||U| ≤
γ_{3n} |L||U|` by `gamma_add_gamma_add_mul_le`. ★★'''
deps = ["FloatingPoint.exists_roundsLU_mul_eq_add", "FloatingPoint.exists_roundsForwardSubst_eq", "FloatingPoint.exists_roundsBackSubst_eq", "FloatingPoint.gamma_add_gamma_add_mul_le"]

[[node]]
id = "abs_le_of_roundsLU_of_entrywiseNonneg"
kind = "theorem"
desc = '''QSS (3.41): if moreover `L.EntrywiseNonneg` and `U.EntrywiseNonneg` and `2 card n * u < 1`, then
`ΔA.abs ≤ₑ (n u / (1 - 2 n u)) • A.abs`: `|L||U| = |L U| = |A + ΔA| ≤ |A| + γ_n |L||U|`, solve. ★'''
deps = ["FloatingPoint.exists_roundsLU_mul_eq_add", "Matrix.EntrywiseNonneg"]

[[node]]
id = "linfty_opNorm_le_of_roundsLU_solve"
kind = "theorem"
desc = '''Higham Theorem 9.5 = QSS (3.67) (Wilkinson), conditional form over `ℝ`: under the hypotheses of
`exists_roundsLU_solve_eq` and `∀ i j, |L i j| ≤ 1`, `∀ i j, |U i j| ≤ ρ * ⨆ i j, |A i j|`, the `ΔA`
there satisfies `‖ΔA‖ ≤ (card n)^2 * gamma m.u (3 * card n) * ρ * ‖A‖` in the scoped
`Matrix.Norms.Operator` (`‖·‖_∞`) norm. Row sums: `(|L||U|)_i ≤ n · n ρ max|A| ≤ n² ρ ‖A‖_∞`. With
`ρ = growthFactor` of `LinearAlgebra/Matrix/LU/Pivoting` this is the book's `8 u n³ ρ_n ‖A‖_∞ + O(u²)`
(`n² γ_{3n} = 3 n³ u + O(u²)`; the book's constant `8` comes from its (3.65) route). ★★'''
deps = ["FloatingPoint.exists_roundsLU_solve_eq", "Matrix.growthFactor"]

[[node]]
id = "RoundsCholesky"
kind = "definition"
desc = '''`RoundsCholesky m A R : Prop` for `R` upper triangular over an ordered field: `R j j` is an admissible
rounding of `√(fl(A j j - fl(∑_{k<j} R k j²)))` — the square root modelled as one more rounding of
the exact root, `m.Rounds (Real.sqrt t) (R j j)`, so over `ℝ` — and `R i j`, `i < j`, of `fl(fl(A i j
- fl(∑_{k<i} R k i R k j)) / R i i)`: QSS (3.45) in `Rᵀ`'s indexing, Higham Algorithm 10.2. ★'''
deps = ["FloatingPoint.RoundsDot"]

[[node]]
id = "exists_roundsCholesky_eq_add"
kind = "theorem"
desc = '''Higham Theorem 10.3: `RoundsCholesky m A R`, `(card n + 1) u < 1` give `∃ ΔA, ΔA.abs ≤ₑ gamma m.u
(card n + 1) • (Rᵀ.abs * R.abs) ∧ Rᵀ * R = A + ΔA`. Same proof as `exists_roundsLU_mul_eq_add` with
the square root costing one extra rounding on the diagonal (`γ_{n+1}`). QSS quotes instead
Wilkinson's normwise `‖ΔA‖₂ ≤ 8 n (n+1) u ‖A‖₂` under `2 n (n+1) u ≤ 1 - (n+1) u`, which is not
reproduced (different constants; Higham's is the modern statement). ★★★'''
deps = ["FloatingPoint.RoundsCholesky", "FloatingPoint.exists_rounds_sub_dot_div_eq"]

[[node]]
id = "RoundsThomas"
kind = "definition"
desc = '''`RoundsThomas m a b c α̂ β̂ : Prop` on `Fin N`: `α̂ 0 = a 0`, `β̂ (i+1)` an admissible rounding of `b
(i+1) / α̂ i`, and `α̂ (i+1)` of `a (i+1) - fl(β̂ (i+1) * c i)` — the recurrence (3.53) with its two
roundings per step (product, then subtraction; the division is a third). ★'''
deps = []

[[node]]
id = "exists_roundsThomas_mul_eq_add"
kind = "theorem"
desc = '''Higham (9.22) = QSS §3.7.1: with `L̂`, `Û` the bidiagonal factors built from `β̂`, `α̂` and `c` as in
`Matrix.isLU_tridiagonal_thomas`, `L̂ Û = A + ΔA` with `ΔA.abs ≤ₑ (4u + 3u² + u³) • (L̂.abs * Û.abs)`;
the perturbation is confined to the diagonal and the subdiagonal (`ΔA i j = 0` for `i ≤ j`… precisely
for `j ≠ i, i - 1`). Three roundings per entry: `β̂_i α̂_{i-1} = b_i (1 + δ₁)⁻¹`, `α̂_i + β̂_i c_{i-1}(1 +
δ₂)(1 + δ₃) = a_i`… expand. ★★'''
deps = ["FloatingPoint.RoundsThomas", "Matrix.isLU_tridiagonal_thomas"]

[[node]]
id = "exists_roundsThomas_mul_eq_add_of_diag_pos"
kind = "theorem"
desc = '''Higham Theorem 9.14 = QSS §3.7.1's second display: if in addition the computed pivots are positive,
`∀ i, 0 < α̂ i`, and `L̂`, `Û` have the sign pattern making `|L̂| |Û| = |L̂ Û|` (the book's SPD or
M-matrix cases: `a_i > 0`, `b_i c_{i-1} > 0` in the SPD case, `b, c ≤ 0` in the M-matrix case), then
`ΔA.abs ≤ₑ ((4u + 3u² + u³) / (1 - u)) • A.abs`. Higham's "if `u` is sufficiently small" is
replaced by the hypothesis `0 < α̂ i` it is used for; the derivation is (3.41)'s with the constant
`h(u) = 4u + 3u² + u³`: `|L̂||Û| = |A + ΔA| ≤ |A| + h(u) |L̂||Û|`, so `|L̂||Û| ≤ |A| / (1 - h(u))` and
Higham's `1 - u` denominator after simplification (check the arithmetic: he states `h(u)/(1-u)`,
which is weaker than `h(u)/(1 - h(u))` only for `u` small — state the sharper `h(u)/(1 - h(u))` and
derive his). ★★'''
deps = ["FloatingPoint.exists_roundsThomas_mul_eq_add"]
