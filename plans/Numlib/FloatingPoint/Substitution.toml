# Planned additions (GVL round): the module doc of `Numlib.FloatingPoint.Substitution` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch03) add a bullet for the dot-product (row-oriented) evaluation order. The module has the
# running-difference (column/saxpy) order `RoundsForwardSubst`; the new
# `FloatingPoint.RoundsForwardSubstDot` is the inner-product order of [golub2013matrix] Algorithms
# 3.1.1–3.1.2 (the dot product `c = 0; c = fl(c + fl(l_ij x_j))` as written in Algorithm 1.1.1, then
# one rounded subtraction from `b_i` and one rounded division, the first row divided only), for
# which the bound is still `γ_n` (the extra roundings land on the diagonal with order 2 ≤ n, or on
# terms with order `i ≤ n`). Also: the exact-model characterizations `roundsForwardSubst_exact_iff`
# etc., through which a D4 algorithm's exact specification is read off its rounding bridge. The
# sentence of the module doc saying `Numlib/FloatingPoint/LU` "uses that order for the Doolittle
# recurrence" is stale: `RoundsLU` uses running differences.
