# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch05) add to the module doc a paragraph "The [golub2013matrix] variants": the Householder vector
# of Golub–Van Loan Algorithm 5.1.1 (Parlett's formula for `v₁` when `x₁ > 0`, the normalization `v₁
# = 1`, and `P x = +‖x‖ e₁`) is a different computation from Higham's (19.1) and gets its own
# relation `RoundsHouseholderVectorParlett` with its Lemma 19.1 analogue; the book's application
# order `A - (β v)(vᵀ A)` associates the product differently from `RoundsHouseholderApply` and gets
# `RoundsHouseholderApplyScaled` with the same Lemma 19.2 constant (both proved from one shared
# lemma); and the two-sided accumulation of Lemma 19.3 is stated for rectangular `A_k : Matrix ι κ
# ℝ` (`exists_eq_prodRev_mul_add_mul_prodFwd_rect`), which is what the book's (5.1.11) needs (`A ∈
# ℝ^{m×n}`).
# (ch08, restated by Fix-A after the GVL review, algo H1/M4) add a paragraph "Householder reductions
# with any reflector-vector relation": the reflector data of a step enter only through
# `IsReflectorPert` (computed `(v̂, β̂)` are order-`K` relative perturbations of exact reflector data
# that map the column to `c e_i`), which Higham's `RoundsHouseholderVector` (`isReflectorPert`) and
# [golub2013matrix] Algorithm 5.1.1's `RoundsHouseholderVectorParlett` (`isReflectorPert`) both
# provide; the Hessenberg step in the book's association (`RoundsHessenbergStepPert`,
# [golub2013matrix] Algorithm 7.4.2) and the symmetric tridiagonalization step
# (`RoundsTridiagonalizeStepPert`, [golub2013matrix] Algorithm 8.3.1: the trailing block by the
# symmetric rank-two update `RoundsSymmRankTwoUpdate`, lower triangle computed and mirrored, the
# subdiagonal the freshly computed `fl(√fl(xᵀx))`) are stated over it, each with its Frobenius step
# bound, and both reductions follow from the one accumulation lemma
# `exists_eq_transpose_mul_add_mul_of_forall_step` (Lemma 19.3, two-sided, per-step reflector
# chosen). The existing Higham-convention `RoundsHessenbergStep` is the unscaled-association twin of
