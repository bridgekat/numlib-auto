[[node]]  # staged by ch05
id = "exists_eq_prodRev_mul_add_mul_prodFwd_rect"
kind = "theorem"
desc = '''[higham2002accuracy] Lemma 19.3 in the two-sided Frobenius form for rectangular matrices:
for `L : ℕ → Matrix ι ι ℝ`, `R : ℕ → Matrix κ κ ℝ` orthogonal and `A : ℕ → Matrix ι κ ℝ` with
`‖A (k+1) - L k * A k * R k‖_F ≤ ε ‖A k‖_F` for `k < r`, there is `E` with
`A r = prodRev L r * (A 0 + E) * prodFwd R r` and `‖E‖_F ≤ ((1 + ε) ^ r - 1) ‖A 0‖_F`. The proof
of `exists_eq_prodRev_mul_add_mul_prodFwd` (square, `ι = κ`) with the rectangular unitary
invariance `Matrix.frobenius_norm_unitary_mul_mul_unitary`; [golub2013matrix] (5.1.11) is its
instance. `prodRev`/`prodFwd` need their index type generalized only in the sense that `R`'s
product is over `κ`. Refactor proposal (report): make the square theorem the `κ = ι` instance.
★ (~60 lines)'''
deps = ["FloatingPoint.prodRev", "FloatingPoint.prodFwd", "FloatingPoint.prodRev_mem_orthogonalGroup", "FloatingPoint.prodFwd_mem_orthogonalGroup", "FloatingPoint.exists_eq_prodRev_mul_add_mul_prodFwd", "Matrix.frobenius_norm_unitary_mul_mul_unitary"]

[[node]]  # staged by ch05
id = "l2_opNorm_reflector_sub_le"
kind = "theorem"
desc = '''The computed reflector is close to the exact one ([golub2013matrix] §5.1.5 "‖P̂ - P‖₂ =
O(u)", §5.1.12 "orthogonal to working precision"): if `v ≠ 0` and `∀ j, IsRelPert u K (v j) (v̂ j)`
with `γ_K ≤ 1/2`, then `‖Matrix.reflector v̂ - Matrix.reflector v‖₂ ≤ 8 γ_K`. With
`w = v/‖v‖`, `ŵ = v̂/‖v̂‖`: `‖v̂ - v‖ ≤ γ_K ‖v‖` gives `‖ŵ - w‖ ≤ 2 γ_K`, then
`‖ŵŵᵀ - wwᵀ‖ ≤ 2 ‖ŵ - w‖`, and `reflector v = 1 - 2 w wᵀ` (`Matrix.reflector_eq_householder`). ★★'''
deps = ["Matrix.reflector", "Matrix.reflector_eq_householder", "FloatingPoint.IsRelPert"]

[[node]]  # staged by ch08
id = "RoundsSymmRankTwoUpdate"
kind = "definition"
desc = '''The relational model of one symmetric rank-two Householder update ([golub2013matrix]
§8.3.1 and Algorithm 8.3.1): for `m : RoundingModel ℝ`, reflector data `β, v : ι → ℝ`, a symmetric
`B : Matrix ι ι ℝ` and a candidate result `B' : Matrix ι ι ℝ`,
`RoundsSymmRankTwoUpdate m β v B B'` says there are `p̂, ŵ : ι → ℝ` and scalars `ŝ, t̂` with
`p̂ i` the rounding of `β · (B i ⬝ᵥ v)` (the inner product as `RoundsDot`, then one multiplication),
`ŝ` the rounding of `p̂ ⬝ᵥ v` (`RoundsDot`), `t̂ = fl(fl(β ŝ) / 2)`, `ŵ i = fl(p̂ i - fl(t̂ v i))`,
and `B' i j = fl(fl(B i j - fl(v i ŵ j)) - fl(ŵ i v j))` for `i ≥ j` with `B' j i = B' i j` (only
the lower triangle is computed, as the book says). ★'''
deps = ["FloatingPoint.RoundingModel"]

[[node]]  # staged by ch08
id = "frobenius_norm_sub_le_of_roundsSymmRankTwoUpdate"
kind = "theorem"
desc = '''Backward error of the symmetric rank-two update: if `(β̂, v̂)` are relative perturbations of
order `k` of exact reflector data `(β, v)` with `|β| ‖v‖₂² ≤ 2` (the `IsRelPert` clauses of
`IsReflectorPert`) and `RoundsSymmRankTwoUpdate m β̂ v̂ B B'` for a symmetric `B : Matrix ι ι ℝ`,
then `B' = P B P + F` with `P = I - β v vᵀ`, `F` symmetric and `‖F‖_F ≤ c γ_{k + 2n + c'} ‖B‖_F` for
small absolute constants `c, c'` fixed by the formalizer (Higham-style: `p = βBv` has a columnwise
`γ_n` error, `w` and the two outer products `γ_3` each). `F` is symmetric because only the lower
triangle is computed and mirrored. Proof: the exact identity `P B P = B - v wᵀ - w vᵀ`
(`Matrix.conj_one_sub_smul_vecMulVec_eq_sub`, stated over a `StarRing` with `Bᴴ = B`, `star β = β`; at `ℝ`
`star` is trivial (`star_trivial`, `Matrix.conjTranspose_eq_transpose_of_trivial`), and `β = 0` is allowed, so no
normalization hypothesis is needed), bound `‖ŵ - w‖₂ ≤ γ ‖B‖_F ‖v‖₂`-type with `RoundsDot`
bounds, and collect. ★★★ (~250 lines)'''
deps = ["FloatingPoint.RoundsSymmRankTwoUpdate", "FloatingPoint.IsRelPert", "FloatingPoint.abs_sub_le_of_roundsDot", "Matrix.conj_one_sub_smul_vecMulVec_eq_sub"]

[[node]]  # Fix-A (GVL review, algo M4): the shared accumulation lemma
id = "exists_eq_transpose_mul_add_mul_of_forall_step"
kind = "theorem"
desc = '''**Two-sided accumulation with the reflector of each step chosen** ([higham2002accuracy]
Lemma 19.3, two-sided, §19.10): for `A : ℕ → Matrix ι ι ℝ`, `0 ≤ ε` and `r`, if every step has an
exact symmetric orthogonal transformation within `ε` —
`∀ k < r, ∃ P ∈ Matrix.orthogonalGroup ι ℝ, Pᵀ = P ∧ ‖A (k+1) - P * A k * P‖ ≤ ε * ‖A k‖` — then
`∃ Q ∈ Matrix.orthogonalGroup ι ℝ, ∃ E, A r = Qᵀ * (A 0 + E) * Q ∧ ‖E‖ ≤ ((1 + ε) ^ r - 1) * ‖A 0‖`
(Frobenius norms). `choose` the `P k` (junk `1` for `k ≥ r`) and apply
`exists_eq_transpose_mul_add_mul_prodFwd`; `Q = prodFwd P r` (`prodFwd_mem_orthogonalGroup`). The
one lemma both reductions below — and any Householder reduction whose step bound is proved
separately — end with. Proved in `notes/gvl/fixA/proto/StepPert.lean` (12 lines). ★'''
