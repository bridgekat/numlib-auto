[[node]]  # staged by ch05
id = "IsRelPert.add_of_nonneg"
kind = "theorem"
desc = '''The sum of two nonnegative quantities perturbed to the same relative order is perturbed to
that order: `0 ≤ x₁ → 0 ≤ x₂ → IsRelPert u k x₁ y₁ → IsRelPert u k x₂ y₂ →
IsRelPert u k (x₁ + x₂) (y₁ + y₂)` (the perturbation of the sum is the convex combination
`(x₁ θ₁ + x₂ θ₂)/(x₁ + x₂)`; the case `x₁ + x₂ = 0` forces both to be `0`). The step that the
`1 + τ²` of Algorithm 5.1.3, the `a² + b²` of (5.1.8) and the `x₁² + σ` of Algorithm 5.1.1 need;
[higham2002accuracy] uses it silently. A scalar lemma of the calculus of
`Numlib/FloatingPoint/Model`; placed in `Householder`'s scalar section beside the other extensions
(`IsRelPert.mul_one_add`, `.div_one_add`, `.rounds`, `.sqrt`) until that calculus is consolidated
(report: refactor proposal); `Givens` imports it from there. ★'''
deps = ["FloatingPoint.IsRelPert", "FloatingPoint.gamma"]

[[node]]  # Fix-A (GVL review, algo H1/M4)
id = "IsReflectorPert"
kind = "definition"
desc = '''**Computed reflector data, whatever the formula that produced them.** For `x : ι → ℝ`, a pivot
`i : ι` and a target `c : ℝ`: `IsReflectorPert u K x i c v̂ β̂ :=
∃ (v : ι → ℝ) (β : ℝ), (1 - β • vecMulVec v v) ∈ Matrix.orthogonalGroup ι ℝ ∧
(1 - β • vecMulVec v v) *ᵥ x = c • Pi.single i 1 ∧ |β| * (v ⬝ᵥ v) ≤ 2 ∧
IsRelPert u K β β̂ ∧ ∀ j, IsRelPert u K (v j) (v̂ j)` — the computed `(v̂, β̂)` are order-`K`
relative perturbations of exact reflector data sending `x` to `c e_i` (so `|c| = ‖x‖₂`). This is
the only thing a Householder *reduction* needs from the formula that computed the vector, so the
reductions below are stated over it and hold for every vector formula: Higham's (19.1)
(`RoundsHouseholderVector.isReflectorPert`, `c = -sign(x_i)‖x‖`) and [golub2013matrix] Algorithm
5.1.1 with Parlett's formula (`RoundsHouseholderVectorParlett.isReflectorPert`, `c = ‖x‖`). This
is the "parametrize the reflector-vector relation, taking its `IsRelPert` conclusion as
hypothesis" of review `notes/gvl/review/algo.md` H1. ★'''
deps = ["FloatingPoint.IsRelPert"]

[[node]]  # Fix-A (GVL review, algo H1/M4)
id = "RoundsHouseholderVector.isReflectorPert"
kind = "theorem"
desc = '''Higham's computed Householder vector is reflector data in the sense of `IsReflectorPert`: with
`K = 4 · card ι + 8`, `K u < 1` and `RoundsHouseholderVector m x i v̂ β̂`,
`IsReflectorPert m.u K x i (-(phase (x i)) * ‖toLp 2 x‖) v̂ β̂` (exact data
`v = householderAxis x i`, `β = 2 / (vᵀv)`). From `RoundsHouseholderVector.isRelPert`,
`householder_householderVec_eq` and the reflection property of `Matrix.householder`, as in
`exists_isRelPert_hessenbergReflector`. ★'''
deps = ["FloatingPoint.IsReflectorPert", "FloatingPoint.RoundsHouseholderVector.isRelPert", "FloatingPoint.householder_householderVec_eq", "FloatingPoint.exists_isRelPert_hessenbergReflector"]

[[node]]  # staged by ch05
id = "RoundsHouseholderVectorParlett"
kind = "definition"
desc = '''The computed Householder vector of [golub2013matrix] Algorithm 5.1.1 (`house`), as a
relation on `x : ι → ℝ`, a pivot `i : ι`, and the computed `(v̂, β̂)`, with `σ` the tail inner
product over `{j // j ≠ i}`:
`∃ σ̂, RoundsDot m (fun j : {j // j ≠ i} => x j) (fun j => x j) σ̂ ∧ v̂ i = 1 ∧ (
   (σ̂ = 0 ∧ 0 ≤ x i ∧ β̂ = 0 ∧ ∀ j ≠ i, v̂ j = x j) ∨
   (σ̂ = 0 ∧ x i < 0 ∧ β̂ = 2 ∧ ∀ j ≠ i, v̂ j = x j) ∨
   (σ̂ ≠ 0 ∧ ∃ p t μ v₁ q w d, m.Rounds (x i * x i) p ∧ m.Rounds (p + σ̂) t ∧ m.Rounds (√t) μ ∧
      (x i ≤ 0 ∧ m.Rounds (x i - μ) v₁ ∨ 0 < x i ∧ ∃ e, m.Rounds (x i + μ) e ∧ m.Rounds (-σ̂ / e) v₁) ∧
      m.Rounds (v₁ * v₁) q ∧ m.Rounds (2 * q) w ∧ m.Rounds (σ̂ + q) d ∧ m.Rounds (w / d) β̂ ∧
      ∀ j ≠ i, m.Rounds (x j / v₁) (v̂ j)))`.
The second branch is the book's `σ = 0 & x(1) < 0` case **with `β = 2`**: the printed `β = -2`
makes `P = I + 2 e₁e₁ᵀ`, not orthogonal (report, Doubts). The surface program is
`GolubVanLoan.Chapter05.algorithm_5_1_1` (prototype `notes/gvl/ch05/proto/Chapter05.lean`); in a
run, `σ̂ = 0` iff the exact tail is zero, since every rounded square of a nonzero number and every
rounded sum of positive numbers is positive when `u < 1`. ★'''
deps = ["FloatingPoint.RoundsDot", "FloatingPoint.RoundingModel"]

[[node]]  # staged by ch05; renamed from `RoundsHouseholderVectorParlett.exists_isRelPert` by Fix-A
id = "RoundsHouseholderVectorParlett.isReflectorPert"
kind = "theorem"
desc = '''**The analogue of [higham2002accuracy] Lemma 19.1 for [golub2013matrix] Algorithm 5.1.1.**
With `n = Fintype.card ι`, `K := 18 n + 31` and `K u < 1`: if
`RoundsHouseholderVectorParlett m x i v̂ β̂` then `v̂ i = 1` and
`IsReflectorPert m.u K x i ‖toLp 2 x‖ v̂ β̂` — the exact `(v, β)` of the definition are the exact
output of the same branch, with `v i = 1`, `P x = +‖x‖₂ e_i` (the book's sign), `|β| (vᵀv) ≤ 2`.
Orders (with `k = n - 1` terms in `σ̂`, which is `IsRelPert k σ σ̂` by `abs_sub_le_of_roundsDot` on
nonnegative terms and `isRelPert_of_abs_sub_le`): `μ̂` `k + 2`; `v̂₁` `k + 3` (`x₁ ≤ 0`: a same-sign
sum) or `3k + 7` (`x₁ > 0`, Parlett's quotient); `v̂₁²` `6k + 15`; `β̂` `18k + 49`;
`v̂_j = fl(x_j / v̂₁)` `6k + 15`; all `≤ 18n + 31`. The exact identities (Parlett's
`x₁ - ‖x‖ = -σ/(x₁ + ‖x‖)`, `β (vᵀv) = 2`, the reflection) are those of the surface spec
`GolubVanLoan.Chapter05.houseOn_spec`, proved here once on `ι`. The constants are the relational
calculus's, not Wilkinson's; the formalizer may tighten them. ★★★ (~250 lines, mirroring
`RoundsHouseholderVector.isRelPert`)'''
deps = ["FloatingPoint.RoundsHouseholderVectorParlett", "FloatingPoint.IsReflectorPert", "FloatingPoint.abs_sub_le_of_roundsDot", "FloatingPoint.isRelPert_of_abs_sub_le", "FloatingPoint.IsRelPert.add_of_nonneg", "FloatingPoint.IsRelPert.rounds", "FloatingPoint.IsRelPert.sqrt", "FloatingPoint.IsRelPert.div", "FloatingPoint.IsRelPert.mul", "Matrix.reflector_mulVec_eq_of_sq"]

[[node]]  # staged by ch05
id = "RoundsHouseholderApplyScaled"
kind = "definition"
desc = '''The update `y = b - (β v)(vᵀ b)` in [golub2013matrix]'s association (§5.1.4:
`PA = A - (βv)(vᵀA)`, the scaled vector `βv` formed once): `∃ (s : ℝ) (w : ι → ℝ),
RoundsDot m v b s ∧ (∀ i, m.Rounds (β * v i) (w i)) ∧ ∀ i, ∃ t, m.Rounds (w i * s) t ∧
m.Rounds (b i - t) (y i)`. Compare `RoundsHouseholderApply` (`y = b - v (β (vᵀ b))`,
[quarteroni2000numerical] (5.49)–(5.50)). Row application `A - (A v)(βv)ᵀ` is the same relation on
each row `b = A r`. ★'''
deps = ["FloatingPoint.RoundsDot", "FloatingPoint.RoundingModel"]

[[node]]  # staged by ch05
id = "norm_sub_le_of_roundsHouseholderApplyScaled"
kind = "theorem"
desc = '''**[higham2002accuracy] Lemma 19.2 for the scaled association**, with the constant of
`norm_sub_le_of_roundsHouseholderApply`: if `((3k + n + 3 : ℕ) : ℝ) * m.u < 1`,
`IsRelPert m.u k β β̂`, `∀ i, IsRelPert m.u k (v i) (v̂ i)`, `|β| * (v ⬝ᵥ v) ≤ 2` and
`RoundsHouseholderApplyScaled m β̂ v̂ b y`, then
`‖toLp 2 (y - (1 - β • vecMulVec v v) *ᵥ b)‖ ≤ 3 γ_{3k+n+3} ‖toLp 2 b‖`. The two associations give
the same entrywise form `w_i s = β v_i (vᵀb)(1 + θ)` with `|θ| ≤ γ` of the same order; factor the
existing proof through a shared lemma about that form (the formalizer's choice of name) rather
than copying it. ★★ (~80 lines with the refactor)'''
deps = ["FloatingPoint.RoundsHouseholderApplyScaled", "FloatingPoint.norm_sub_le_of_roundsHouseholderApply"]

