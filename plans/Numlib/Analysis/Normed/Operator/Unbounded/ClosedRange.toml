desc = '''
Banach's closed range theorem and the surjectivity criteria by a priori estimates, for a densely
defined closed operator `A : D(A) ⊆ E → F` between Banach spaces over `RCLike 𝕜` and for its
adjoint `A* : D(A*) ⊆ F* → E*` (natural home: `Mathlib.Analysis.Normed.Operator.Unbounded.ClosedRange`).
Source: [brezis2011functional], §2.7 (Theorems 2.19–2.21, Remarks 18 and 20), and Atkinson–Han,
*Theoretical Numerical Analysis*, Theorem 8.2.7, which is Theorem 2.19 verbatim.

Mathlib has nothing here (re-verified 2026-09-17: `closed range theorem`, `closedRange`,
`a priori estimate` — zero relevant occurrences; the bounded injective case
`ContinuousLinearMap.isClosed_range_iff_antilipschitz_of_injective` is the whole of it). The
project had marked "the Banach closed range theorem (unbounded Banach adjoints)" out of scope in
`notes/backbone.md` §1.7; this module retires that entry.

**Route.** The book proves Theorem 2.19 by transporting Theorem 2.16 (the four equivalent
characterizations of "`G + L` closed" through annihilators, chapter 1's `Annihilator` module) to
`X = E × F` with `G = G(A)`, `L = E × {0}`, and derives Theorems 2.20–2.21 from 2.19. That
transport needs `(E × F)* ≅ E* × F*` carried through annihilators, closures and sums, and is
avoided here: every implication is proved directly, and the two hard ones are

* Theorem 2.20 (b) ⇒ (a), "`‖v‖ ≤ C ‖A* v‖` on `D(A*)` implies `R(A) = F`", in two steps: a
  separation argument shows `closure (A(B_{D(A)})) ⊇ B_F(0, 1/C)` (if `y₀` with `‖y₀‖ < 1/C` were
  outside the closed absolutely convex set `closure (A(B))`, the modulus form of the geometric
  Hahn–Banach theorem, `AbsConvex.exists_norm_apply_le_one_of_isClosed_of_notMem` of
  `Numlib/Analysis/Normed/Module/DualSeparable`, would give `v ∈ F*` with `|v (A u)| ≤ ‖u‖` on
  `D(A)` and `1 < |v y₀|`; then `v ∈ D(A*)`, `‖A* v‖ ≤ 1`, `‖v‖ ≤ C`, and
  `|v y₀| ≤ ‖v‖ ‖y₀‖ < 1` — a contradiction), and the second
  step of the open mapping theorem for the *closed* operator `A`
  (`LinearPMap.IsClosed.ball_subset_image_of_ball_subset_closure_image` of `Basic`) turns the
  closure inclusion into `A(B) ⊇ B_F(0, 1/2C)`; this is Rudin's *Functional Analysis* 4.13–4.15
  transposed to closed operators, and it is exactly the book's argument for Theorem 2.16 (b) ⇒ (a)
  with `T` replaced by `A`;
* Theorem 2.19 (ii) ⇒ (i), "`R(A*)` closed implies `R(A)` closed": let `Z := closure R(A)` and
  `A₁ : D(A) ⊆ E → Z` be `A` with its codomain restricted (`LinearPMap.codRestrict`); `A₁` is
  closed, densely defined, with dense range, so `A₁*` is injective (Corollary 2.18 (ii)); every
  `ζ ∈ D(A₁*)` extends by Hahn–Banach (`exists_extension_norm_eq`) to a `v ∈ D(A*)` with
  `A* v = A₁* ζ`, and every `v ∈ D(A*)` restricts, so `R(A₁*) = R(A*)` is closed; the closed range
  criterion of `Basic` applied to the closed injective operator `A₁*` (Proposition 2.17) yields
  `‖ζ‖ ≤ C ‖A₁* ζ‖`, and Theorem 2.20 (b) ⇒ (a) for `A₁` gives `R(A) = R(A₁) = Z`.

Everything else is short: 2.19 (i) ⇒ (iv) is the closed range criterion of `Basic`
(`dist (u, N(A)) ≤ C ‖A u‖`) followed by a Hahn–Banach extension of the functional
`A u ↦ f u` from `R(A)`; 2.19 (i) ⇒ (iii) is Corollary 2.18 (iv); (iii) ⇒ (i) and (iv) ⇒ (ii)
are the closedness of (pre)annihilators; 2.20 (a) ⇒ (b) is the uniform boundedness principle
(Corollary 2.5) on the family `{v ∈ D(A*) | ‖A* v‖ ≤ 1}`; 2.20 (b) ⇔ (c) is the closed range
criterion for `A*`; 2.21 follows from 2.19 and Corollary 2.18. Remark 20 (the finite-dimensional
equivalences) closes the unbounded part, and the module ends with the specializations to a
bounded `T` and `strongDualMap` that chapters 3 and 6 consume (`R(T)` closed ⇒ `R(T) = N(T*)^⊥`,
the Fredholm alternative's shape).

Every theorem carries `[CompleteSpace E] [CompleteSpace F]`, `hA : A.IsClosed` and
`hd : Dense (A.domain : Set E)`; the names put the direction in the suffix
(`…_of_isClosed_range`, `…_of_range_eq_top`) and the `iff`/`TFAE` forms are separate nodes.
'''

[[node]]
id = "LinearPMap.ball_subset_closure_image_of_norm_le_norm_strongDualAdjoint"
kind = "theorem"
desc = '''The separation step of [brezis2011functional] Theorem 2.20 (b) ⇒ (a) (the book proves it
inside Theorem 2.16 (b) ⇒ (a), (24) ⇒ (25), lines 1673–1687): for `RCLike 𝕜`, normed spaces
`E F`, `A : E →ₗ.[𝕜] F` with `hd : Dense (A.domain : Set E)`, `0 < C` and
`∀ v : A.strongDualAdjoint.domain, ‖(v : StrongDual 𝕜 F)‖ ≤ C * ‖A.strongDualAdjoint v‖`,
one has `Metric.ball (0 : F) (1 / C) ⊆ closure ((fun u : A.domain => A u) '' {u | ‖(u : E)‖ < 1})`.

Proof: the set `K := closure (A '' B)` is closed and absolutely convex (`AbsConvex.closure`;
the image of the balanced convex unit ball under a linear map is balanced and convex). If
`y₀ ∉ K` with `‖y₀‖ < 1/C`, `AbsConvex.exists_norm_apply_le_one_of_isClosed_of_notMem`
(`Numlib/Analysis/Normed/Module/DualSeparable.lean`, the modulus form of
`RCLike.geometric_hahn_banach_closed_point`) gives `v : StrongDual 𝕜 F` with `‖v y‖ ≤ 1` on `K`
and `1 < ‖v y₀‖`; hence `‖v (A u)‖ ≤ ‖u‖` on `D(A)` by homogeneity, so `v ∈ D(A*)`
(`mem_strongDualAdjoint_domain_iff`) and `‖A* v‖ ≤ 1` (`opNorm_le_bound` with
`strongDualAdjoint_apply` on the dense `D(A)`); then `‖v‖ ≤ C ‖A* v‖ ≤ C` and
`1 < ‖v y₀‖ ≤ ‖v‖ ‖y₀‖ < C · (1/C) = 1`, a contradiction. Neither completeness nor closedness
of `A` enters this step. ★★, about 70 lines; the `opNorm` bound over a dense subspace is the
one place that takes care (the `RCLike` rotation is inside the separation lemma).'''
deps = ["LinearPMap.mem_strongDualAdjoint_domain_iff", "LinearPMap.strongDualAdjoint_apply", "AbsConvex.exists_norm_apply_le_one_of_isClosed_of_notMem"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 2.20"

