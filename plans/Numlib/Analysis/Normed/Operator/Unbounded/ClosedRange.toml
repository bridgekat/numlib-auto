[[node]]
id = "LinearPMap.IsClosed.range_strongDualAdjoint_eq_annihilator_ker_of_isClosed_range"
kind = "theorem"
desc = '''[brezis2011functional] Theorem 2.19 (i) ⇒ (iv), `R(A)` closed ⇒ `R(A*) = N(A)^⊥`: for Banach
spaces, `A` closed, `hd : Dense (A.domain : Set E)` and `IsClosed (LinearMap.range A.toFun : Set F)`,
`LinearMap.range A.strongDualAdjoint.toFun = Submodule.strongDualAnnihilator A.ker`.

Proof: `⊆` is `closure_range_strongDualAdjoint_le_annihilator_ker`. For `⊇` let `f ∈ N(A)^⊥`.
By the closed range criterion (`LinearPMap.IsClosed.isClosed_range_iff_exists_infDist_ker_le`,
`Basic`) there is `C` with `infDist u (ker A) ≤ C ‖A u‖` on `D(A)`. Define `φ` on the closed
subspace `R(A)` by `φ (A u) := f u`: well defined since `f` vanishes on `N(A)`, and bounded since
`|f u| = |f (u − z)| ≤ ‖f‖ ‖u − z‖` for every `z ∈ N(A)`, so `|φ (A u)| ≤ ‖f‖ infDist u (ker A) ≤ C ‖f‖ ‖A u‖`
(build `φ` as `LinearMap.mkContinuousOfExistsBound` on the quotient-free description: choose
preimages with `Classical.choose`, or use `LinearMap.range` together with `LinearMap.ker_le`... the
cleanest is `(LinearMap.range A.toFun).liftQ`-style well-definedness through `A.toFun` and
`f.comp A.domain.subtypeL` vanishing on `ker A.toFun`). Extend `φ` to `v : StrongDual 𝕜 F` by
`exists_extension_norm_eq`; then `v (A u) = f u` for all `u ∈ D(A)`, so `v ∈ D(A*)` and
`A* v = f` (`mem_strongDualAdjoint_domain_of_exists`, `strongDualAdjoint_apply_eq`). ★★, about
120 lines. This is the book's (a) ⇒ (d) of Theorem 2.16 specialized, with Theorem 2.10's bounded
decomposition replaced by the distance estimate.'''
deps = ["LinearPMap.closure_range_strongDualAdjoint_le_annihilator_ker", "LinearPMap.IsClosed.isClosed_range_iff_exists_infDist_ker_le", "LinearPMap.strongDualAdjoint_apply_eq", "LinearPMap.mem_strongDualAdjoint_domain_of_exists", "Submodule.strongDualAnnihilator"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 2.19"

[[node]]
id = "LinearPMap.IsClosed.isClosed_range_of_isClosed_range_strongDualAdjoint"
kind = "theorem"
desc = '''[brezis2011functional] Theorem 2.19 (ii) ⇒ (i), `R(A*)` closed ⇒ `R(A)` closed — the
substance of the closed range theorem: for Banach spaces, `A` closed, `hd : Dense (A.domain : Set E)`
and `IsClosed (LinearMap.range A.strongDualAdjoint.toFun : Set (StrongDual 𝕜 E))`,
`IsClosed (LinearMap.range A.toFun : Set F)`.

Proof (see the group `desc`): let `Z := (LinearMap.range A.toFun).topologicalClosure`, a Banach
space, and `A₁ := A.codRestrict Z (fun u => subset_closure ⟨u, rfl⟩) : E →ₗ.[𝕜] Z`
(`LinearPMap.codRestrict`). (1) `A₁` is closed: its graph is the preimage of `A.graph` under the
closed embedding `E × Z → E × F`. (2) `R(A₁)` is dense in `Z`, so `A₁*` is injective by
`ker_strongDualAdjoint_eq_annihilator_range` (a functional on `Z` vanishing on a dense subspace
is `0`). (3) `R(A₁*) = R(A*)` as submodules of `E*`: for `ζ ∈ D(A₁*)`, `exists_extension_norm_eq`
extends `ζ` to `v ∈ F*` with `v (A u) = ζ (A₁ u)`, so `v ∈ D(A*)` and `A* v = A₁* ζ`; conversely
`v ∈ D(A*)` restricts to `ζ := v.comp Z.subtypeL ∈ D(A₁*)` with `A₁* ζ = A* v`
(`mem_strongDualAdjoint_domain_of_exists`, `strongDualAdjoint_apply_eq` twice). (4) `A₁*` is
closed (`strongDualAdjoint_isClosed`), injective, with closed range, so
`LinearPMap.IsClosed.isClosed_range_iff_exists_infDist_ker_le` (`Basic`) gives
`‖ζ‖ ≤ C ‖A₁* ζ‖` on `D(A₁*)`. (5) `range_eq_top_of_norm_le_norm_strongDualAdjoint` for `A₁`
gives `R(A₁) = Z`, i.e. `R(A) = Z` is closed. ★★★, about 200 lines: steps (1) and (3) are
bookkeeping between `F` and the subtype `Z`, and the whole module's difficulty is concentrated
here and in the separation lemma.'''
deps = ["LinearPMap.ker_strongDualAdjoint_eq_annihilator_range", "LinearPMap.strongDualAdjoint_isClosed", "LinearPMap.strongDualAdjoint_apply_eq", "LinearPMap.mem_strongDualAdjoint_domain_of_exists", "LinearPMap.IsClosed.isClosed_range_iff_exists_infDist_ker_le", "LinearPMap.IsClosed.range_eq_top_of_norm_le_norm_strongDualAdjoint"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 2.19"

