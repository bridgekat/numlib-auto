id = "LinearPMap.IsClosed.exists_norm_le_norm_strongDualAdjoint_of_range_eq_top"
kind = "theorem"
desc = '''[brezis2011functional] Theorem 2.20 (a) ⇒ (b): for Banach spaces `E F`, `A` closed (closedness is
not used, but kept for uniformity), `hd : Dense (A.domain : Set E)` and
`LinearMap.range A.toFun = ⊤`, there is `C : ℝ` with
`∀ v : A.strongDualAdjoint.domain, ‖(v : StrongDual 𝕜 F)‖ ≤ C * ‖A.strongDualAdjoint v‖`.
Proof (lines 1897–1902): the family `B* := {v ∈ D(A*) | ‖A* v‖ ≤ 1} ⊆ F*` is pointwise bounded on
`F` — for `f₀ = A u₀`, `|v f₀| = |(A* v) u₀| ≤ ‖u₀‖` — hence bounded in norm by Corollary 2.5
(`StrongDual.isBounded_of_forall_eval_isBounded`, `Numlib/Analysis/Normed/Operator/BanachSteinhaus`;
this is where completeness of `F` enters), say by `C`; homogeneity (`v / ‖A* v‖ ∈ B*` when
`A* v ≠ 0`, and `A* v = 0` forces `v = 0` by the same bound applied to `t • v` for all `t`) gives
`‖v‖ ≤ C ‖A* v‖`. ★, about 50 lines.'''
deps = ["LinearPMap.strongDualAdjoint_apply", "StrongDual.isBounded_of_forall_eval_isBounded"]
