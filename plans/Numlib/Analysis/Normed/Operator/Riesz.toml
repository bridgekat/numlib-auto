[[node]]
id = "IsCompactOperator.injective_of_surjective_smul_one_sub"
kind = "theorem"
desc = '''**Surjectivity of `μ • 1 - K` forces injectivity** for a compact `K : X →L[𝕜] X` on a normed
space over a `NontriviallyNormedField 𝕜` and `μ ≠ 0`: if
`Function.Surjective (μ • (1 : X →L[𝕜] X) - K)` then `Function.Injective (μ • (1 : X →L[𝕜] X) - K)`.
This is the converse half of the Fredholm alternative [brezis2011functional] Theorem 6.6 (c),
`R(I - T) = E ⇒ N(I - T) = {0}` (lines 6041–6043), which the book proves through the adjoint and
Corollary 2.18; here it comes from the Riesz index without any adjoint, so it needs no
completeness and no `RCLike`.

Proof (★, ~30 lines): `IsCompactOperator.exists_riesz_index` gives `ν` with
`∀ j ≥ ν, range (A ^ j) = range (A ^ ν)` and `IsCompl (ker (A ^ ν)) (range (A ^ ν))` for
`A = μ • 1 - K`. `A` surjective makes every `A ^ n` surjective (`Function.Surjective.iterate`,
with `ContinuousLinearMap.pow_succ_apply`), so `range (A ^ ν) = ⊤`, and a submodule complementary
to `⊤` is `⊥` (`IsCompl.eq_bot_of_top`… or `Disjoint.eq_bot_of_self_le_top`); hence
`ker (A ^ ν) = ⊥`, and `ker A ≤ ker (A ^ ν)` when `1 ≤ ν` (`ContinuousLinearMap.ker_pow_mono`),
while `ν = 0` gives `ker (A ^ 0) = ker 1 = ⊥` and the stabilization clause at `j = 1`, in
either case `ker A = ⊥`, i.e. `LinearMap.ker_eq_bot`.'''
deps = ["IsCompactOperator.exists_riesz_index"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 6.6"

[[node]]
id = "IsCompactOperator.injective_iff_surjective_smul_one_sub"
kind = "theorem"
desc = '''**The Fredholm alternative as an equivalence**: for a compact `K : X →L[𝕜] X` on a Banach
space over a complete `NontriviallyNormedField 𝕜` and `μ ≠ 0`,
`Function.Injective (μ • (1 : X →L[𝕜] X) - K) ↔ Function.Surjective (μ • (1 : X →L[𝕜] X) - K)`.
[brezis2011functional] Theorem 6.6 (c) at `μ = 1`, `N(I - T) = {0} ⟺ R(I - T) = E`.

Proof (★, ~15 lines): `→` is Mathlib's Fredholm alternative
`IsCompactOperator.hasEigenvalue_or_mem_resolventSet` (injectivity says `μ` is not an
eigenvalue, so `μ • 1 - K` is a unit, hence bijective by `ContinuousLinearMap.isUnit_iff_bijective`;
`IsCompactOperator.isUnit_smul_one_sub_of_isCompactOperator_pow` at `m = 1` packages this);
`←` is `IsCompactOperator.injective_of_surjective_smul_one_sub`.'''
deps = ["IsCompactOperator.injective_of_surjective_smul_one_sub", "IsCompactOperator.isUnit_smul_one_sub_of_isCompactOperator_pow"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 6.6"
