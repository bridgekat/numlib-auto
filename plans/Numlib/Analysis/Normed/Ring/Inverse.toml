[[node]]  # staged by ch02
id = "NormedRing.isUnit_add_of_norm_inverse_mul_lt_one"
kind = "theorem"
desc = '''In a complete normed ring, if `a` is a unit and `‖Ring.inverse a * t‖ < 1` then `a + t` is a
unit: `a + t = a (1 + a⁻¹ t)` and `1 + a⁻¹ t` is a unit (Mathlib `Units.oneSub` /
`NormedRing.inverse_one_sub`). The hypothesis is weaker than `‖a⁻¹‖ ‖t‖ < 1`
(`Units.isUnit_add_of_norm_lt`). ★'''
deps = ["NormedRing.norm_inverse_one_sub_le"]

[[node]]  # staged by ch02
id = "NormedRing.norm_inverse_add_sub_le_of_norm_inverse_mul_lt_one"
kind = "theorem"
desc = '''**Perturbation of the inverse** ([golub2013matrix] Theorem 2.3.4): in a complete normed ring
with `‖1‖ = 1` (`NormOneClass`), for a unit `a` and `r = ‖Ring.inverse a * t‖ < 1`,
`‖Ring.inverse (a + t) - Ring.inverse a‖ ≤ r * ‖Ring.inverse a‖ / (1 - r)`, and hence the book's form
`≤ ‖t‖ * ‖Ring.inverse a‖ ^ 2 / (1 - r)` (`r ≤ ‖a⁻¹‖ ‖t‖`; same node, the book's form as the second clause).
Proof: `(a + t)⁻¹ = (1 + a⁻¹ t)⁻¹ a⁻¹` with `‖(1 + a⁻¹ t)⁻¹‖ ≤ 1 / (1 - r)` (`NormedRing.norm_inverse_one_sub_le`),
and `(a + t)⁻¹ - a⁻¹ = -(1 + a⁻¹ t)⁻¹ (a⁻¹ t) a⁻¹`, whose norm is at most `r ‖a⁻¹‖ / (1 - r)` directly — the proof
yields the sharper bound, so it is the statement. This corrects the book's proof, which sets `F = -E A⁻¹`
and claims `‖F‖ = r` for `r = ‖A⁻¹ E‖`; the factorization must be `A + E = A (I + A⁻¹ E)`. Sharper than
`Units.norm_inverse_add_sub_le` (`r ≤ ‖a⁻¹‖ ‖t‖`). ★'''
deps = ["NormedRing.isUnit_add_of_norm_inverse_mul_lt_one", "NormedRing.norm_inverse_one_sub_le", "Units.norm_inverse_add_sub_le"]
