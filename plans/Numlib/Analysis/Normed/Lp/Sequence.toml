[[node]]
id = "separableSpace"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 11.16, `ℓ^p`**: for a countable index type `α`, a
separable normed space `E` (the book's `𝕜 = ℝ`; `RCLike 𝕜` is separable once
`Mathlib.Analysis.Normed.Module.Dual` is imported, see `notes/lessons.md`), `1 ≤ p`, `p ≠ ∞`:
`TopologicalSpace.SeparableSpace (lp (fun _ : α ↦ E) p)` (a theorem, because of `p ≠ ∞`; the
instance form for a fixed `p` is `Fact`-free only at `p = 2`, `lp.instInnerProductSpace` +
`HilbertBasis`). The finitely supported sequences are dense — `lp.hasSum_single hp f` says every
`f` is the limit of its finite partial sums of `lp.single p i (f i)` — and they are the span of
the countable set `⋃ i, range (lp.single p i)`, separable by `TopologicalSpace.IsSeparable.span`
(`Mathlib/Topology/Algebra/Module/Basic.lean`) with `IsSeparable.of_separableSpace` on each
`E`-image; `TopologicalSpace.IsSeparable.closure`/`Dense.separableSpace` finish. The book's
countable set `D` of rational finitely supported sequences is what `IsSeparable.span` produces. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.16"

