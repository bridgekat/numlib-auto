[[node]]
id = "convergent.instSeparableSpace"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 11.16, `c`**: for a separable `E`,
`instance : TopologicalSpace.SeparableSpace (lp.convergent 𝕜 E)`. `c = c₀ ⊔ (constant sequences)`
— every `x ∈ c` is `(x − lim x • e) + lim x • e` with `x − lim x • e ∈ c₀` (`convergent.limCLM`)
and `e` the constant sequence `1` — so `c` is the span of a separable set (`c₀` and
`{(a, a, …) | a ∈ E}`, the image of `E` under the isometric constant map), and
`TopologicalSpace.IsSeparable.span` applies again. The book's "`D + λ(1, 1, 1, …)`". ★'''
deps = ["convergent", "convergent.limCLM", "zeroAtInfty.instSeparableSpace", "zeroAtInfty_le_convergent"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.16"

[[node]]
id = "not_separableSpace_top"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 11.17**: `¬ TopologicalSpace.SeparableSpace (lp (fun _ : ℕ ↦ 𝕜) ∞)`
(for a nontrivial normed field `𝕜`; over `RCLike` in the surface). Not the book's diagonal
argument but an equivalent one that Mathlib supports directly: the indicator sequences
`1_A : ℓ^∞`, `A : Set ℕ`, are pairwise at distance `1`, so the open balls of radius `1/2` around
them are pairwise disjoint and nonempty; in a separable space such a family is countable
(`Pairwise.countable_of_isOpen_disjoint`, `Mathlib/Topology/Bases.lean`), but `Set ℕ` is
uncountable (`Function.cantor_injective` against a hypothetical `Set ℕ ↪ ℕ`, or
`Cardinal.mk_set_nat : #(Set ℕ) = 𝔠` with `Cardinal.aleph0_lt_mk_iff`); the map `A ↦ 1_A` is
injective. About 60 lines. ★'''
