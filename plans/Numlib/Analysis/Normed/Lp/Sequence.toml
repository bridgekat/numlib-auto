[[node]]
id = "zeroAtInfty.not_isReflexive"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 11.21, `c₀`**: `¬ NormedSpace.IsReflexive 𝕜 (lp.zeroAtInfty 𝕜 𝕜)`
over `RCLike 𝕜`. The book's argument made explicit: let `e := zeroAtInfty.dualEquiv 𝕜`
(`ℓ¹ ≅ (c₀)*`) and `Σ : StrongDual 𝕜 (ℓ¹)` the summation functional `u ↦ ∑' k, u k`
(`lp.tsumCLM`, or `toDual 𝕜 ℕ 1 ∞ 1` at the constant sequence `1`). Then
`Φ := Σ ∘ e.symm` is in `(c₀)**`; if `Φ = J x` for some `x ∈ c₀`, testing on `e (single k 1)`
gives `x k = 1` for every `k` (`toDual_apply`, `lp.single_apply`), contradicting
`x k → 0`. About 80 lines. ★★'''
