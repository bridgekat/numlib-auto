`finrank M = finrank M*` (`NormedSpace.finrank_strongDual`, after
`finiteDimensional_iff_coFG_strongDualAnnihilator` settles finiteness) and
`finrank M* = finrank (E* ⧸ M^⊥)` (`LinearEquiv.finrank_eq` along `quotAnnihilatorLIEStrongDual`). ★'''
deps = ["quotAnnihilatorLIEStrongDual", "finiteDimensional_iff_coFG_strongDualAnnihilator", "NormedSpace.finrank_strongDual"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 11.13"

