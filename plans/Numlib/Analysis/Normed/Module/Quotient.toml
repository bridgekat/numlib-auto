[[node]]
id = "finrank_strongDualCoannihilator_le_finrank_quotient"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 11.14, third clause**: "`dim N^⊥ ≤ codim N`" — for a
subspace `N` of `StrongDual 𝕜 E` of finite codimension (`[N.CoFG]`), `N.strongDualCoannihilator` is
finite-dimensional and `Module.finrank 𝕜 N.strongDualCoannihilator ≤ Module.finrank 𝕜 (StrongDual 𝕜 E ⧸ N)`.
(The book adds that the inequality can be strict when `E` is not reflexive, with
`N = ker ξ` for `ξ ∈ E** ∖ J(E)`; that example is not a node.) Proof (book): with
`M := N.strongDualCoannihilator`, `N ≤ N^⊥⊥ = M^⊥` gives `codim M^⊥ ≤ codim N` (a quotient of a
finite-dimensional quotient: `Submodule.CoFG.of_le`, `Submodule.finrank_quotient_le`-type
monotonicity through `Submodule.quotientQuotientEquivQuotient`), and
