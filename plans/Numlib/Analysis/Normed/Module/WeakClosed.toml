[[node]]
id = "exists_ne_zero_forall_apply_eq_zero_of_not_finiteDimensional"
kind = "theorem"
desc = '''In an infinite-dimensional space finitely many functionals have a common nonzero zero:
for `(h : ¬ FiniteDimensional 𝕜 E) (f : Fin k → StrongDual 𝕜 E)` (or `(s : Finset (StrongDual 𝕜 E))`),
`∃ y : E, y ≠ 0 ∧ ∀ i, f i y = 0`. The bracketed argument of [brezis2011functional] §3.2, Example 1
(line 2296): if `⋂ ker (f i) = ⊥` then `x ↦ (f i x)ᵢ : E →ₗ[𝕜] (Fin k → 𝕜)` is injective, so
`Module.Finite.of_injective` makes `E` finite-dimensional. Purely algebraic, stated for
`E →ₗ[𝕜] 𝕜` if that is more convenient. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.2, Example 1"

[[node]]
id = "closure_image_toWeakSpace_sphere"
kind = "theorem"
desc = '''**The weak closure of the unit sphere of an infinite-dimensional normed space is the closed
unit ball** ([brezis2011functional] §3.2, Example 1, display (1)): for `(h : ¬ FiniteDimensional 𝕜 E)`,
`closure (toWeakSpace 𝕜 E '' Metric.sphere (0 : E) 1) = toWeakSpace 𝕜 E '' Metric.closedBall 0 1`.
In particular the sphere is not weakly closed.

Proof, following lines 2286–2312. `⊆`: the ball is weakly closed (`isClosed_image_toWeakSpace_closedBall`)
and contains the sphere, so `closure_minimal`. `⊇`: let `‖x₀‖ ≤ 1`; if `‖x₀‖ = 1` it is in the
sphere; otherwise show every weak neighbourhood of `x₀` meets the sphere. By
`LinearMap.hasBasis_weakBilin` (Mathlib, `Analysis/LocallyConvex/WeakDual.lean`) applied through
`nhds_translation`/`IsTopologicalAddGroup`, a basic neighbourhood is
`{x | ∀ f ∈ s, ‖f (x - x₀)‖ < ε}` for a finite `s ⊆ StrongDual 𝕜 E` and `ε > 0`. Take
`y₀ ≠ 0` with `f y₀ = 0` for all `f ∈ s` (`exists_ne_zero_forall_apply_eq_zero_of_not_finiteDimensional`);
`g t = ‖x₀ + t • y₀‖` is continuous on `[0, ∞)` with `g 0 < 1` and `g t → ∞`
(`‖x₀ + t • y₀‖ ≥ t ‖y₀‖ - ‖x₀‖`), so the intermediate value theorem
(`intermediate_value_Icc` on `Set.Icc 0 T` for `T` large) gives `t₀` with `‖x₀ + t₀ • y₀‖ = 1`; and
`x₀ + t₀ • y₀` lies in the basic neighbourhood since `f (t₀ • y₀) = 0`. Use
`mem_closure_iff_nhds_basis` with the translated basis. ★★ (about 120 lines; the neighbourhood-basis
bookkeeping is the cost).'''
deps = ["isClosed_image_toWeakSpace_closedBall", "exists_ne_zero_forall_apply_eq_zero_of_not_finiteDimensional"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.2, Example 1"

[[node]]
id = "not_isOpen_image_toWeakSpace_ball"
kind = "theorem"
desc = '''**The open unit ball of an infinite-dimensional normed space is not weakly open**
([brezis2011functional] §3.2, Example 2): for `(h : ¬ FiniteDimensional 𝕜 E)`,
`¬ IsOpen (toWeakSpace 𝕜 E '' Metric.ball (0 : E) 1)`. If it were, its complement
`{‖x‖ ≥ 1}` would be weakly closed, hence so would be `sphere 0 1 = closedBall 0 1 ∩ {‖x‖ ≥ 1}`
(`isClosed_image_toWeakSpace_closedBall`, `IsClosed.inter`, images commute with intersections for
the injective `toWeakSpace`), contradicting `closure_image_toWeakSpace_sphere` — the closure of the
sphere would be the sphere, not the ball, and the ball contains `0`. ★'''
deps = ["closure_image_toWeakSpace_sphere", "isClosed_image_toWeakSpace_closedBall"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.2, Example 2"

[[node]]
id = "Submodule.strongDualAnnihilator_strongDualCoannihilator_eq_closure_toWeakDual"
kind = "theorem"
desc = '''**The weak-* bipolar theorem for subspaces**: for `N : Submodule 𝕜 (StrongDual 𝕜 E)`,
`(N^⊥)^⊥` is the weak-* closure of `N`,
`StrongDual.toWeakDual '' (N.strongDualCoannihilator.strongDualAnnihilator : Set (StrongDual 𝕜 E)) = closure (StrongDual.toWeakDual '' (N : Set (StrongDual 𝕜 E)))`
in `WeakDual 𝕜 E`. This is [brezis2011functional] Problem 9 B1 and the last sentence of chapter 1,
Remark 6; the annihilators are chapter 1's `Submodule.strongDualAnnihilator` (`M^⊥ ⊆ E⋆`) and
`Submodule.strongDualCoannihilator` (`N^⊥ ⊆ E`), and chapter 1's `Submodule.strongDualAnnihilator_strongDualCoannihilator`
is the reflexive case, where weak-* and norm closures of a convex set agree.

Proof: `⊇`: `(N^⊥)^⊥` contains `N` and is weak-* closed — the intersection over `x ∈ N^⊥` of the
kernels of the weak-* continuous evaluations `f ↦ f x` (`WeakDual.eval_continuous`). `⊆`: let
`f₀ ∈ (N^⊥)^⊥` with `f₀ ∉ K := closure (toWeakDual '' N)`; `K` is a closed subspace of the locally
convex `WeakDual 𝕜 E` (`Submodule.topologicalClosure` of the image), so
`RCLike.geometric_hahn_banach_closed_point` separates: `re (Φ g) < α < re (Φ f₀)` for `g ∈ K`; since
`K` is a subspace, `Φ = 0` on `K` (a linear functional bounded above on a subspace vanishes there)
and `Φ f₀ ≠ 0`. By `LinearMap.dualEmbedding_surjective (topDualPairing 𝕜 E)` (the weak
representation theorem: every weak-* continuous functional on `E⋆` is evaluation at a point),
`Φ g = g x₀` for some `x₀ : E`; then `x₀ ∈ N^⊥` and `f₀ x₀ ≠ 0`, contradicting `f₀ ∈ (N^⊥)^⊥`.
This is the argument of Brezis' Proposition 3.14 (Mathlib's `dualEmbedding_surjective`) plus
separation — and it is packaged, for a closed subspace `K` of `WeakDual 𝕜 E`, as
`Submodule.exists_weakDual_eval_eq_zero_of_notMem` below (first planned by chapter 2 in
`Operator/Unbounded/Adjoint`, moved here at review), which reduces this node to twenty lines.
★ once that lemma exists (★★ standalone).'''
