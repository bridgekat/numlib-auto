[[node]]
id = "WeakDual.geometric_hahn_banach_closed_point"
kind = "theorem"
desc = '''**Separation in the weak-∗ topology by a point of `E`** — the weak-∗ Hahn–Banach theorem of
[brezis2011functional] Problem 9 (question A3) in the form every weak-∗ argument of the book uses:
for `RCLike 𝕜`, a normed space `E`, `s : Set (WeakDual 𝕜 E)` with `hs₁ : Convex ℝ s`,
`hs₂ : IsClosed s` and `f ∉ s`, there are `x : E` and `u : ℝ` with
`(∀ g ∈ s, re (g x) < u) ∧ u < re (f x)` — Mathlib's `RCLike.geometric_hahn_banach_closed_point`
with the separating functional *an evaluation at a point of `E`*.

Proof: `WeakDual 𝕜 E` is a locally convex space over `ℝ` (`WeakBilin.locallyConvexSpace`, the
`ℝ`-module structure `WeakDual.instModule'`), so `RCLike.geometric_hahn_banach_closed_point`
(`Mathlib/Analysis/LocallyConvex/Separation.lean`) gives `φ : StrongDual 𝕜 (WeakDual 𝕜 E)` and
`u` with `re (φ g) < u` on `s` and `u < re (φ f)`; by the weak representation theorem
`LinearMap.dualEmbedding_surjective` (`Mathlib/Analysis/LocallyConvex/WeakDual.lean`, for the
pairing `(topDualPairing 𝕜 E).flip`, whose `WeakBilin` is `WeakDual 𝕜 E`) `φ = WeakBilin.eval _ x`
for some `x : E`, i.e. `φ g = g x`. ★★, about 50 lines; the instance path for
`LocallyConvexSpace ℝ (WeakDual 𝕜 E)` is the one place to watch (`WeakDual` is `WeakBilin` by
`rfl`, but instances may need `inferInstanceAs`). Consumers: the subspace form below (chapter 2's
Remarks 15 and 17, the weak-∗ bipolar theorem), Goldstine's lemma (`NormedSpace.goldstine` in
`Reflexive/Kakutani.lean`, applied in `WeakDual 𝕜 (StrongDual 𝕜 E)` to the closed convex set
`closure (J(B_E))`), and the converse of Theorem 3.29. Placed in this module (not in
`Operator/Unbounded/Adjoint`, where chapter 2 first planned it) so that no weak-topology module
imports the operator theory.'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Problem 9"

[[node]]
id = "Submodule.exists_weakDual_eval_eq_zero_of_notMem"
kind = "theorem"
desc = '''Separation from a weak-∗ closed *subspace* by a point of `E`, the form
[brezis2011functional] Remarks 2.15 and 2.17 (chapter 2, `Operator/Unbounded/Adjoint`) and the
weak-∗ bipolar theorem above need: for `RCLike 𝕜`, a normed space `E`,
`K : Submodule 𝕜 (WeakDual 𝕜 E)` with `IsClosed (K : Set (WeakDual 𝕜 E))` and `f ∉ K`, there is
`x : E` with `(∀ g ∈ K, g x = 0) ∧ f x ≠ 0`. From `WeakDual.geometric_hahn_banach_closed_point`
(`K` is convex): the evaluation `g ↦ g x` is a linear functional bounded above on the subspace
`K`, hence zero on it (scale by `t → ∞` and by a unimodular constant), and `re (f x) > u ≥ re (0 x) = 0`
gives `f x ≠ 0`. ★, about 20 lines.'''
deps = ["WeakDual.geometric_hahn_banach_closed_point"]
