[[node]]
id = "tendsto_toWeakSpace_iff_of_finiteDimensional"
kind = "theorem"
desc = '''The "in particular" of [brezis2011functional] Proposition 3.6: in a finite-dimensional
normed space a sequence (a net) converges weakly iff it converges in norm. For
`[FiniteDimensional 𝕜 E]`, `{l : Filter ι} {x : ι → E} {u : E}`:
`Tendsto (fun i => toWeakSpace 𝕜 E (x i)) l (𝓝 (toWeakSpace 𝕜 E u)) ↔ Tendsto x l (𝓝 u)`.
`←` is continuity of `toWeakSpaceCLM`, `→` is `WeakSpace.continuous_toWeakSpace_symm_of_finiteDimensional`
composed (`Continuous.tendsto` + `Tendsto.comp`). ★'''
deps = ["WeakSpace.continuous_toWeakSpace_symm_of_finiteDimensional"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 3.6"

[[node]]
id = "WeakDual.continuous_toStrongDual_of_finiteDimensional"
kind = "theorem"
desc = '''On the dual of a finite-dimensional normed space the weak-* topology is the norm topology
([brezis2011functional] chapter 3, Remark 10, first half; the TODO of Mathlib's
`Analysis/Normed/Module/WeakDual.lean`): for `[FiniteDimensional 𝕜 E]`,
`Continuous (WeakDual.toStrongDual : WeakDual 𝕜 E → StrongDual 𝕜 E)`.

Proof (settled by `notes/brezis/ch03/proto/Shapes.lean` (b')): `StrongDual 𝕜 E` is
finite-dimensional (`ContinuousLinearMap.finiteDimensional`, found by instance search), hence so
is the synonym after `have : FiniteDimensional 𝕜 (WeakDual 𝕜 E) := ‹FiniteDimensional 𝕜 (StrongDual 𝕜 E)›`;
`WeakDual 𝕜 E` is a Hausdorff (`WeakDual.instT2Space`) topological vector space, so
`LinearMap.continuous_of_finiteDimensional (WeakDual.toStrongDual (𝕜 := 𝕜) (E := E)).toLinearMap`.
Since weak-* ≤ weak ≤ norm always (`NormedSpace.Dual.dual_norm_topology_le_weak_dual_topology`,
`WeakDual.continuous_weakSpace_toWeakDual`), the three topologies of Remark 10 coincide. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 3, Remark 10"

