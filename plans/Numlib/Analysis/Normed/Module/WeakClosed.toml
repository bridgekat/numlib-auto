desc = '''
Closed sets, semicontinuous functions and linear maps for the weak topology of a normed space
(natural home: `Mathlib.Analysis.LocallyConvex.WeakSpace` and `Mathlib.Analysis.Normed.Module.WeakDual`).

The weak topology `σ(E, E⋆)` is Mathlib's `WeakSpace 𝕜 E`, the weak-* topology `σ(E⋆, E)` is
`WeakDual 𝕜 E`, and a set of `E` "closed in the weak topology" is written as Mathlib's
`Analysis/LocallyConvex/WeakSpace.lean` writes it, `IsClosed (toWeakSpace 𝕜 E '' s)` — never by
abusing the definitional equality `WeakSpace 𝕜 E = E`. Everything is over `RCLike 𝕜`; wherever
real convexity enters, the hypotheses `[NormedSpace ℝ E] [IsScalarTower ℝ 𝕜 E]` are carried as in
Mathlib's `Convex.toWeakSpace_closure` (they are found automatically when `𝕜 = ℝ`).

What Mathlib already has, and what this module adds on top of it:

* `Convex.toWeakSpace_closure` is Mazur's theorem in closure form; the module states it as the
  `iff` a convex set is weakly closed iff it is norm closed (`Convex.isClosed_image_toWeakSpace_iff`,
  [brezis2011functional] Theorem 3.7), and its two corollaries: a function with closed convex
  sublevel sets is weakly lower semicontinuous (Corollary 3.9, `LowerSemicontinuous.comp_toWeakSpace_symm_of_convex_le`),
  in particular the norm is (Remark 6). The sequential Mazur lemma (Corollary 3.8, convex
  combinations of a weakly convergent sequence converge in norm) already exists over `ℝ` as
  `exists_seq_convexCombination_tendsto` in `Numlib/Variational/WeakMinimization.lean` and is
  deliberately not duplicated here.
* `WeakSpace.map` says a bounded linear map is weak–weak continuous; the module proves the
  converse through the closed graph theorem (`LinearMap.continuous_of_isClosed_graph`), in the
  stronger form that strong–weak continuity already forces strong–strong continuity (Remark 7),
  and packages the equivalence (Theorem 3.10).
* In finite dimension the weak topology is the norm topology (Proposition 3.6) and, on the dual,
  strong = weak = weak-* (Remark 10): both are `LinearMap.continuous_of_finiteDimensional` applied
  to the identity of the type synonym, which is a Hausdorff topological vector space. Mathlib's
  `Analysis/Normed/Module/WeakDual.lean` lists the weak-* statement as a TODO. The shape was
  settled by `notes/brezis/ch03/proto/Shapes.lean` (b), (b'): one needs
  `have : FiniteDimensional 𝕜 (WeakSpace 𝕜 E) := ‹FiniteDimensional 𝕜 E›`, since `WeakSpace` is a
  `def` and instance search does not see through it.
* In infinite dimension the weak topology is strictly coarser: the weak closure of the unit
  sphere is the closed unit ball (Example 1 of §3.2) and the open unit ball is not weakly open
  (Example 2). Metrizability of the weak topologies is a separate module,
  `Numlib/Analysis/Normed/Module/WeakStarMetrizable`.
* On the dual, the weak-* closed subspaces are the annihilators: `(N^⊥)^⊥` is the weak-* closure
  of `N ⊆ E⋆` (Problem 9 B1, the last sentence of Remark 6 of chapter 1), over the annihilators
  `Submodule.strongDualAnnihilator` / `Submodule.strongDualCoannihilator` of chapter 1's
  `Numlib/Analysis/Normed/Module/Annihilator.lean`, whose plan delegates this statement here. It
  is the weak-* bipolar theorem for subspaces, and the same separation-plus-representation
  argument proves Goldstine's lemma in `Reflexive/Kakutani.lean`.

* The weak-∗ separation theorem `WeakDual.geometric_hahn_banach_closed_point` — a point outside
  a closed convex subset of `WeakDual 𝕜 E` is separated from it by an *evaluation at a point of
  `E`* (Mathlib's `RCLike.geometric_hahn_banach_closed_point` in the locally convex `WeakDual`,
  followed by the weak representation theorem `LinearMap.dualEmbedding_surjective`) — with its
  subspace form `Submodule.exists_weakDual_eval_eq_zero_of_notMem`. It is the one lemma behind
  the weak-∗ bipolar theorem here, chapter 2's Remarks 15 and 17 (`Operator/Unbounded/Adjoint`
  imports this module for it) and Goldstine's lemma (`Reflexive/Kakutani`).

Imports: Mathlib and `Numlib/Analysis/Normed/Module/Annihilator` (for the bipolar node only);
nothing from `Operator/`.

Grep record (2026-09-17, Mathlib v4.35.0-rc2): `WeakSpace` occurs in Mathlib only in
`Topology/Algebra/Module/Spaces/WeakDual.lean`, `Analysis/LocallyConvex/WeakSpace.lean` and
`Analysis/Normed/Module/DoubleDual.lean`; `Mazur` only in `MazurUlam`; LeanSearch for "finite
dimensional weak topology equals norm topology" and "unit sphere weak closure equals closed unit
ball" returns nothing relevant.

Serves [brezis2011functional] §3.2–§3.3 (`NumlibSurface/Brezis/Chapter03/Section02`, `Section03`).
'''

[[node]]
id = "WeakSpace.isClosed_of_isClosed"
kind = "theorem"
desc = '''A set of `E` that is closed in the weak topology is closed: for `s : Set E`,
`IsClosed (toWeakSpace 𝕜 E '' s) → IsClosed s`. Same variables as Mathlib's
`WeakSpace.isOpen_of_isOpen` (a topological module over a topological semiring), of which this
is the closed-set companion: the image is the preimage under the continuous `toWeakSpaceCLM 𝕜 E`
because `toWeakSpace` is a bijection (`Set.image_eq_preimage_of_inverse`). Remark 2 of
[brezis2011functional] chapter 3. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 3, Remark 2"

[[node]]
id = "Convex.isClosed_image_toWeakSpace_iff"
kind = "theorem"
desc = '''**Mazur's theorem**, [brezis2011functional] Theorem 3.7: a convex subset of a normed space is
weakly closed iff it is closed. For `[RCLike 𝕜] [NormedAddCommGroup E] [NormedSpace 𝕜 E]
[NormedSpace ℝ E] [IsScalarTower ℝ 𝕜 E]` and `s : Set E` with `hs : Convex ℝ s`:
`IsClosed (toWeakSpace 𝕜 E '' s) ↔ IsClosed s`.

Proof: `←` is `Convex.toWeakSpace_closure` (Mathlib, `Analysis/LocallyConvex/WeakSpace.lean`),
which says `toWeakSpace 𝕜 E '' closure s = closure (toWeakSpace 𝕜 E '' s)`, together with
`isClosed_iff_closure_eq`; `→` is `WeakSpace.isClosed_of_isClosed`. The book's proof (line 2327,
separation of a point from `C` by `geometric_hahn_banach_closed_point`) is the one inside
`Convex.toWeakSpace_closure` and need not be repeated. A formalizer may state it in the locally
convex generality of that lemma instead; the normed statement is what the consumers need. ★'''
deps = ["WeakSpace.isClosed_of_isClosed"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 3.7"

[[node]]
id = "isClosed_image_toWeakSpace_closedBall"
kind = "theorem"
desc = '''The closed ball `closedBall x r` of a normed space is weakly closed:
`IsClosed (toWeakSpace 𝕜 E '' Metric.closedBall x r)`. The case of `Convex.isClosed_image_toWeakSpace_iff`
for `convex_closedBall` and `Metric.isClosed_closedBall`; it is what Example 1 of §3.2 and
Kakutani's theorem (`Numlib/Analysis/Normed/Module/Reflexive/Kakutani`) use. The book proves it
directly as the intersection over `‖f‖ ≤ 1` of the weakly closed sets `{x | ‖f x‖ ≤ 1}`
(line 2312), which is an alternative proof without the scalar-tower hypotheses. ★'''
deps = ["Convex.isClosed_image_toWeakSpace_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §3.2, Example 1"

[[node]]
id = "LowerSemicontinuous.comp_toWeakSpace_symm_of_convex_le"
kind = "theorem"
desc = '''[brezis2011functional] Corollary 3.9 in its general form: a lower semicontinuous function
whose sublevel sets are convex is lower semicontinuous for the weak topology. For `β` a
`LinearOrder` (the surface uses `EReal`, matching the book's `φ : E → (−∞, +∞]`), `f : E → β`,
`hf : LowerSemicontinuous f` and `hconv : ∀ b, Convex ℝ {x | f x ≤ b}`:
`LowerSemicontinuous (f ∘ (toWeakSpace 𝕜 E).symm)`, i.e. `f` read on `WeakSpace 𝕜 E`.

Proof: `lowerSemicontinuous_iff_isClosed_preimage` (Mathlib) reduces both sides to closedness of
the sublevel sets `f ⁻¹' Set.Iic b`; each is convex and norm closed, hence weakly closed by
`Convex.isClosed_image_toWeakSpace_iff`, and `(f ∘ (toWeakSpace 𝕜 E).symm) ⁻¹' Iic b = toWeakSpace 𝕜 E '' (f ⁻¹' Iic b)`.
The convexity hypothesis is exactly what Brezis' proof (line 2340) uses, so convex functions are
not singled out in the statement: the surface instantiates it with `ConvexAnalysis.ConvexFn.convex_le`
for `E → EReal` and `ConvexOn.convex_le` for real-valued functions. ★'''
deps = ["Convex.isClosed_image_toWeakSpace_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 3.9"

[[node]]
id = "ConvexOn.lowerSemicontinuous_comp_toWeakSpace_symm"
kind = "theorem"
desc = '''Corollary 3.9 for a real-valued convex function on the whole space: `f : E → ℝ`,
`hf : ConvexOn ℝ Set.univ f`, `hlsc : LowerSemicontinuous f` give
`LowerSemicontinuous (f ∘ (toWeakSpace 𝕜 E).symm)`. Immediate from
`LowerSemicontinuous.comp_toWeakSpace_symm_of_convex_le` and `ConvexOn.convex_le`. The form the
direct method of `Numlib/Variational/WeakMinimization.lean` (`ConvexOn.weakSeqLowerSemicontinuousOn`)
states sequentially. ★'''
deps = ["LowerSemicontinuous.comp_toWeakSpace_symm_of_convex_le"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 3.9"

[[node]]
id = "lowerSemicontinuous_norm_comp_toWeakSpace_symm"
kind = "theorem"
desc = '''**The norm is weakly lower semicontinuous**, [brezis2011functional] chapter 3, Remark 6:
`LowerSemicontinuous (fun x : WeakSpace 𝕜 E => ‖(toWeakSpace 𝕜 E).symm x‖)`. The norm is convex
(`convexOn_norm`) and continuous, so this is `ConvexOn.lowerSemicontinuous_comp_toWeakSpace_symm`.
It is the topological form of `norm_le_liminf_norm_of_weak_tendsto`
(`Numlib/Analysis/Normed/Module/WeakDual.lean`), which the surface recovers from it through
`LowerSemicontinuous.le_liminf`-type lemmas or keeps as is. ★'''
deps = ["ConvexOn.lowerSemicontinuous_comp_toWeakSpace_symm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 3, Remark 6"

[[node]]
id = "LinearMap.continuous_of_continuous_toWeakSpace_comp"
kind = "theorem"
desc = '''A linear map between Banach spaces that is continuous from the norm topology of `E` to
the weak topology of `F` is continuous ([brezis2011functional] chapter 3, Remark 7). For
`[CompleteSpace E] [CompleteSpace F]`, `T : E →ₗ[𝕜] F` and
`hT : Continuous (fun x => toWeakSpace 𝕜 F (T x))`: `Continuous T`.

Proof: the graph `T.graph` is closed in `E × F`. Indeed it is the preimage of the diagonal of
`WeakSpace 𝕜 F × WeakSpace 𝕜 F` — closed because `WeakSpace 𝕜 F` is `T2Space` (instance in
`Analysis/LocallyConvex/WeakSpace.lean`, via `SeparatingDual`) — under the continuous map
`(x, y) ↦ (toWeakSpace 𝕜 F (T x), toWeakSpace 𝕜 F y)`, whose second component is continuous by
`toWeakSpaceCLM`. Then `LinearMap.continuous_of_isClosed_graph` (Mathlib's closed graph theorem,
`Analysis/Normed/Operator/Banach.lean`). This is Brezis' argument at line 2358 without the detour
through `σ(E × F, (E × F)⋆)`. Completeness of both spaces is genuinely used. ★★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 3, Remark 7"

[[node]]
id = "LinearMap.continuous_of_continuous_weakSpace_map"
kind = "theorem"
desc = '''The converse half of [brezis2011functional] Theorem 3.10: a linear map between Banach
spaces that is continuous from `WeakSpace 𝕜 E` to `WeakSpace 𝕜 F` is continuous for the norms.
For `[CompleteSpace E] [CompleteSpace F]`, `T : E →ₗ[𝕜] F` and
`hT : Continuous (fun x : WeakSpace 𝕜 E => toWeakSpace 𝕜 F (T ((toWeakSpace 𝕜 E).symm x)))`:
`Continuous T`. Compose `hT` with the continuous `toWeakSpaceCLM 𝕜 E` and apply
`LinearMap.continuous_of_continuous_toWeakSpace_comp`. ★'''
deps = ["LinearMap.continuous_of_continuous_toWeakSpace_comp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 3.10"

[[node]]
id = "LinearMap.continuous_iff_continuous_weakSpace"
kind = "theorem"
desc = '''[brezis2011functional] Theorem 3.10 as an equivalence: for Banach spaces `E`, `F` and
`T : E →ₗ[𝕜] F`, `Continuous T ↔ Continuous (fun x : WeakSpace 𝕜 E => toWeakSpace 𝕜 F (T ((toWeakSpace 𝕜 E).symm x)))`.
`→` is Mathlib's `WeakSpace.map` applied to `T.mkContinuous`/`⟨T, h⟩` (the weak–weak continuity of a
bounded map, which needs no completeness); `←` is `LinearMap.continuous_of_continuous_weakSpace_map`.
Also record the three-way equivalence of Remark 7 (strong–strong, weak–weak, strong–weak) as the
docstring, since the middle statement is `LinearMap.continuous_of_continuous_toWeakSpace_comp`. ★'''
deps = ["LinearMap.continuous_of_continuous_weakSpace_map", "LinearMap.continuous_of_continuous_toWeakSpace_comp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 3.10"

[[node]]
id = "WeakSpace.continuous_toWeakSpace_symm_of_finiteDimensional"
kind = "theorem"
desc = '''In a finite-dimensional normed space the weak topology is the norm topology
([brezis2011functional] Proposition 3.6): for `[FiniteDimensional 𝕜 E]`,
`Continuous (toWeakSpace 𝕜 E).symm`, so that together with the always-continuous `toWeakSpaceCLM`
the identity is a homeomorphism.

Proof (settled by `notes/brezis/ch03/proto/Shapes.lean` (b), four lines): `WeakSpace 𝕜 E` is a
Hausdorff topological vector space (`T2Space` instance of `Analysis/LocallyConvex/WeakSpace.lean`,
`WeakSpace.instIsTopologicalAddGroup`, `WeakSpace.instContinuousSMul`), finite-dimensional after
`have : FiniteDimensional 𝕜 (WeakSpace 𝕜 E) := ‹FiniteDimensional 𝕜 E›`, so every linear map out
of it is continuous: `LinearMap.continuous_of_finiteDimensional ((toWeakSpace 𝕜 E).symm : WeakSpace 𝕜 E →ₗ[𝕜] E)`.
Brezis' proof (line 2270) is the coordinate-functional estimate `‖x - x₀‖ ≤ ∑ |⟨fᵢ, x - x₀⟩|`,
which is what Mathlib's lemma encapsulates. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 3.6"

[[node]]
id = "toWeakSpaceContinuousLinearEquiv"
