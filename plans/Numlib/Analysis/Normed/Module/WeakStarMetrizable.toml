[[node]]
id = "not_firstCountableTopology_weakDual"
kind = "theorem"
desc = '''In the dual of an infinite-dimensional Banach space the weak-* topology is not first
countable ([brezis2011functional] chapter 3, Remark 20 and Exercise 3.8, question 4). For
`[CompleteSpace E] (h : ¬ FiniteDimensional 𝕜 E)`: `¬ FirstCountableTopology (WeakDual 𝕜 E)`.
Same proof as `not_firstCountableTopology_weakSpace` with the roles exchanged: a countable basis
at `0` gives a sequence `x : ℕ → E` such that every `f : StrongDual 𝕜 E` — indeed every weak-*
continuous functional on `E⋆`, which by `LinearMap.dualEmbedding_surjective` is evaluation at a
point of `E` — is continuous for `⨅ n, induced (fun f => f (x n)) _`, so that
`E = ⋃ₙ span 𝕜 (x '' Iic n)` (`LinearMap.mem_span_iff_continuous` applied to the evaluations, which
are injective in `x` by `SeparatingDual`); Baire in the complete `E`
(`FiniteDimensional.of_iUnion_eq_univ`) finishes. Completeness of `E` is used here and not in the
weak case. ★★ (about 120 lines).'''
deps = ["FiniteDimensional.of_iUnion_eq_univ"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Exercise 3.8"

[[node]]
id = "not_metrizableSpace_weakDual"
kind = "theorem"
desc = '''[brezis2011functional] chapter 3, Remark 20: for a Banach space,
`¬ FiniteDimensional 𝕜 E → ¬ TopologicalSpace.MetrizableSpace (WeakDual 𝕜 E)`. From
`not_firstCountableTopology_weakDual` as `not_metrizableSpace_weakSpace` is from its
