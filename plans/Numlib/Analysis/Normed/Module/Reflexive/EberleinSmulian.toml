kind = "theorem"
desc = '''[brezis2011functional] Theorem 3.19 in the sequence form of Theorem 3.18's converse,
matching `NormedSpace.exists_subseq_forall_dual_tendsto`: if
`h : ∀ (v : ℕ → E) (C : ℝ), (∀ n, ‖v n‖ ≤ C) → ∃ (u : E) (φ : ℕ → ℕ), StrictMono φ ∧ ∀ ℓ : StrongDual 𝕜 E, Tendsto (fun k => ℓ (v (φ k))) atTop (𝓝 (ℓ u))`
then `NormedSpace.IsReflexive 𝕜 E`. From `NormedSpace.isReflexive_of_isSeqCompact_image_toWeakSpace_closedBall`
through `tendsto_toWeakSpace_iff` and `norm_le_liminf_norm_of_weak_tendsto` (the limit of a
sequence of the ball stays in the ball, which `IsSeqCompact` requires). This is the statement of
`AtkinsonHan.Chapter02.theorem_2_7_5_mpr` (whose `[CompleteSpace]` is harmless), and it makes
`WeaklySeqCompactSpace V → NormedSpace.IsReflexive ℝ V` provable in
`Numlib/Variational/WeakMinimization.lean` (a follow-up owed there, not planned here). ★'''
deps = ["NormedSpace.isReflexive_of_isSeqCompact_image_toWeakSpace_closedBall", "tendsto_toWeakSpace_iff", "norm_le_liminf_norm_of_weak_tendsto"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 3.19"

