[[node]]
id = "NormedSpace.isReflexive_of_isSeqCompact_image_toWeakSpace_closedBall"
kind = "theorem"
desc = '''**Eberlein–Šmulian for reflexivity**, [brezis2011functional] Theorem 3.19: a normed space
whose closed unit ball is weakly sequentially compact is reflexive. For
`(h : IsSeqCompact (toWeakSpace 𝕜 E '' Metric.closedBall (0 : E) 1))`: `NormedSpace.IsReflexive 𝕜 E`.
The book assumes `E` Banach; a space satisfying the hypothesis is reflexive, hence complete, so
the assumption is not needed.

Proof: the unit ball is weakly closed (`isClosed_image_toWeakSpace_closedBall`), so
`NormedSpace.isCompact_closure_image_toWeakSpace_of_isSeqCompact` makes it weakly compact, and
Kakutani's converse `NormedSpace.isReflexive_of_isCompact_image_toWeakSpace_closedBall`
(`Reflexive/Kakutani.lean`) concludes. Equivalently (the solution's D1 read with Goldstine): the
weak-* closure of `J(B_E)` is the bidual ball, part C puts it inside `J(B_E)`, so `J` is onto. ★'''
deps = ["NormedSpace.isCompact_closure_image_toWeakSpace_of_isSeqCompact", "isClosed_image_toWeakSpace_closedBall", "NormedSpace.isReflexive_of_isCompact_image_toWeakSpace_closedBall", "NormedSpace.IsReflexive"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 3.19"

[[node]]
