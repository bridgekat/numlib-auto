[[node]]
id = "spectralRadius_pow"
kind = "theorem"
desc = '''In a complex unital Banach algebra, `spectralRadius ℂ (a ^ n) = spectralRadius ℂ a ^ n` for every `n` (Mathlib has `spectralRadius_pow_le`, the `≤`, and the spectral mapping theorem `spectrum.map_pow_of_nonempty` with `spectrum.nonempty`): the image of `σ(a)` under `z ↦ zⁿ` is `σ(aⁿ)`, and `‖·‖₊` composed with a power has supremum the power of the supremum (`ENNReal` monotonicity of `· ^ n`). Quarteroni–Sacco–Saleri §1.7, `ρ(Aᵏ) = ρ(A)ᵏ`, and Exercise 8's `λ(P(A)) = P(λ(A))`, whose general form `spectrum.map_polynomial_aeval_of_nonempty` is already Mathlib. ★'''
deps = []

[[node]]
id = "hasSum_pow_inverse_one_sub_of_spectralRadius_lt_one"
kind = "theorem"
desc = '''In a complex unital Banach algebra, `spectralRadius ℂ a < 1 → HasSum (fun k => a ^ k) (Ring.inverse (1 - a))`: the Neumann series (1.25) of Quarteroni–Sacco–Saleri Theorem 1.5 with only the spectral-radius hypothesis (Mathlib's `NormedRing.tsum_geometric_of_norm_lt_one` / `mul_neg_geom_series` need `‖a‖ < 1`). The module already has `summable_pow_iff_spectralRadius_lt_one` and `isUnit_one_sub_of_spectralRadius_lt_one`; identify the sum from `(1 - a) * ∑_{k<K} aᵏ = 1 - a^K → 1` (`mul_neg_geom_sum`, `tendsto_pow_of_spectralRadius_lt_one`) and continuity of multiplication. ★'''
deps = ["summable_pow_iff_spectralRadius_lt_one", "isUnit_one_sub_of_spectralRadius_lt_one", "tendsto_pow_of_spectralRadius_lt_one"]

[[node]]
id = "AlgebraNorm.norm_inverse_one_sub_le_of_lt_one"
kind = "theorem"
desc = '''For an algebra norm `N` on a finite-dimensional complex algebra `B` with `N 1 = 1` and `N a < 1`: `1 - a` is a unit and `N (Ring.inverse (1 - a)) ≤ 1 / (1 - N a)` — the upper bound of Quarteroni–Sacco–Saleri (1.26) for an arbitrary submultiplicative unital norm, not only the ambient one (which is `norm_inverse_one_sub_le` of `Numlib/Analysis/Normed/Ring/Inverse`). Invertibility: `tendsto_pow_of_algebraNorm_lt_one` gives `aᵏ → 0`, so `ρ(a) < 1` and `isUnit_one_sub_of_spectralRadius_lt_one`; the bound: from `(1 - a)⁻¹ = 1 + a (1 - a)⁻¹`, `N((1-a)⁻¹) ≤ 1 + N a · N((1-a)⁻¹)`, rearranged. Over a finite-dimensional real algebra (a real matrix algebra) the same holds via the complexification argument already used in `Matrix.tendsto_pow_of_algebraNorm_lt_one`; state both, or state it once for `RCLike`. ★'''
deps = ["tendsto_pow_of_algebraNorm_lt_one", "isUnit_one_sub_of_spectralRadius_lt_one"]

[[node]]
id = "AlgebraNorm.one_div_one_add_le_norm_inverse_one_sub"
kind = "theorem"
desc = '''Under the same hypotheses, the lower bound of (1.26): `1 / (1 + N a) ≤ N (Ring.inverse (1 - a))`, from `1 = N 1 ≤ N (1 - a) · N ((1 - a)⁻¹) ≤ (1 + N a) · N ((1 - a)⁻¹)`. Requires `N 1 = 1` (the book: "`‖·‖` an induced norm", Theorem 1.3 (2)); without it only `N 1 ≤ N (1 - a) N((1-a)⁻¹)` holds. ★'''
deps = ["AlgebraNorm.norm_inverse_one_sub_le_of_lt_one"]
