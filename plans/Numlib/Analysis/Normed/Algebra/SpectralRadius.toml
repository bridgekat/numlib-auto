[[node]]  # staged by ch09
id = "spectralAbscissa"
kind = "definition"
desc = '''The spectral abscissa of an element of a complex algebra, `spectralAbscissa a : ℝ := sSup
((fun z : ℂ => z.re) '' spectrum ℂ a)` (junk `sSup ∅ = 0` for an empty spectrum; in a nontrivial
complex Banach algebra, and for matrices of positive size, the spectrum is nonempty and compact, so
the supremum is attained). [golub2013matrix] (9.3.3), `α(A) = max {Re λ : λ ∈ λ(A)}`; the name
parallels Mathlib's `spectralRadius`. Searched: `abscissa` occurs in Mathlib only for L-series and
in Numlib only for the Laplace transform. Prototype: `notes/gvl/ch09/proto/Exp.lean`. ★'''
deps = []

[[node]]  # staged by ch09
id = "re_le_spectralAbscissa"
kind = "theorem"
desc = '''`λ ∈ spectrum ℂ a → λ.re ≤ spectralAbscissa a` when the spectrum is bounded
(`spectrum.isBounded` in a complex Banach algebra; `Set.Finite` for an algebraic element), and
`exists_mem_spectrum_re_eq_spectralAbscissa`: for a nonempty compact (e.g. finite) spectrum some
eigenvalue attains it (`IsCompact.exists_isMaxOn` / `Set.Finite.exists_maximal_wrt`). Also
`spectralAbscissa_le_spectralRadius`-type bound `spectralAbscissa a ≤ ‖a‖` (`spectrum.norm_le_norm_of_mem`). ★'''
deps = ["spectralAbscissa"]
