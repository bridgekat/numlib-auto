desc = '''
The logarithm of a Banach algebra: Mathlib's `NormedSpace.log x = ∑ (-1)^{k+1}/k (x - 1)^k`
(`Mathlib/Analysis/Normed/Algebra/Logarithm`) is the inverse of `NormedSpace.exp` near `1` —
`exp (log x) = x` for `‖x - 1‖ < 1` in a complete normed algebra over `ℝ` or `ℂ`, the relation Mathlib
lists as a TODO — with the bound `‖log x‖ ≤ -log(1 - ‖x - 1‖)`.

Consumers: the matrix logarithm of `Numlib/Analysis/Matrix/Function/Log` and the Moler–Van Loan
backward-error theorem of `Numlib/Analysis/Matrix/Function/Pade` ([golub2013matrix] §9.3.1, §9.4.4).
Planned by Golub–Van Loan chapter 9 inside `Function/Log` and placed here at the consolidation (the
ch09 report's refactor proposal R2): the facts are about any Banach algebra, not about matrices.
Upstreaming candidate (natural home: the Mathlib file above). Order: `exp_log_of_norm_sub_one_lt`
(★★★, ~250), `norm_log_le` (★★, ~60).
'''

[[node]]
id = "NormedSpace.exp_log_of_norm_sub_one_lt"
kind = "theorem"
desc = '''`exp (log x) = x` in a complete normed algebra `𝔸` over `𝕂 = ℝ` or `ℂ` (`[RCLike 𝕂]`) whenever
`‖x - 1‖ < 1`, with `log = NormedSpace.log`. Route (no power-series composition): for `h = x - 1`
and `t ∈ [0, 1]` put `L(t) = log (1 + t h)`; the series converges absolutely for `t‖h‖ < 1` and
`L'(t) = h (1 + t h)⁻¹` (termwise differentiation: `∑ (-1)^{k+1} t^{k-1} h^k = h ∑ (-t h)^{k-1}`,
`NormedRing.inverse_one_sub`/`tsum_geometric`); all of `L(t)`, `L'(t)`, `h` commute, so
`φ(t) = exp (-L(t)) (1 + t h)` has `φ' = 0` (`hasDerivAt_exp` in the closed commutative subalgebra
generated by `h`, `Algebra.elementalAlgebra`/`NormedAlgebra` on `Subalgebra.topologicalClosure`, where
`NormedSpace.exp` has the commutative derivative formula `hasFDerivAt_exp`-type lemmas), `φ(0) = 1`.
★★★ (~250 lines)'''
deps = []

[[node]]
id = "NormedSpace.norm_log_le"
kind = "theorem"
desc = '''`‖log x‖ ≤ -Real.log (1 - ‖x - 1‖)` for `‖x - 1‖ < 1` in a normed algebra with `‖1‖ = 1`
(termwise: `∑ ‖x - 1‖^k / k = -log(1 - ‖x - 1‖)`, `Real.hasSum_pow_div_log_of_abs_lt_one`), and
`Commute y x → Commute y (log x)` (Mathlib `Commute.log`). [golub2013matrix] P9.2.2 is the special
case `‖log (I + A)‖₂ ≤ ‖A‖₂/(1 - ‖A‖₂)` (weaker, since `-log(1 - u) ≤ u/(1 - u)`). ★★'''
deps = []
