desc = '''
The analytic theory of the primary functional calculus `pfc`: power series ([golub2013matrix]
Theorem 9.1.2 and Lemma 9.1.1), agreement with Mathlib's `NormedSpace.exp` and `NormedSpace.log`,
the composition rule for analytic functions, the derivative of `t ↦ pfc f (t • a)`, and the Taylor
truncation bound ([golub2013matrix] Theorem 9.2.3, without the book's factor `n`). Everything is
proved from the spectral decomposition `pfc_eq_sum_spectralIdempotent` of
`PrimaryFunctionalCalculus/Basic`: a statement about `pfc f a` becomes finitely many statements about
the scalar jets `f⁽ʲ⁾(λ)/j!`, `j < m_λ`. No norm on `A` is needed for the series statements (`HasSum`
in any Hausdorff topological algebra with continuous operations, e.g. the Pi topology of
`Matrix n n ℂ`); the analytic input is Mathlib's power-series calculus (`HasFPowerSeriesOnBall`,
`hasSum_iteratedFDeriv`, `AnalyticAt.analyticOrderAt` API). Realness of `pfc f` on real matrices is
the matrix lemma `Matrix.pfc_map_conj` of `Numlib/Analysis/Matrix/Function/Basic`.
'''

[[node]]
id = "hasSum_pfc"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 9.1.2, general form: let `f` have the power series `p` on the ball
`Metric.eball z₀ r` (`HasFPowerSeriesOnBall f p z₀ r`, `𝕜 = ℂ` or any `RCLike`), let `a` be integral with
split `minpoly` and every eigenvalue in that ball; then `HasSum (fun k => p.coeff k • (a -
algebraMap 𝕜 A z₀) ^ k) (pfc f a)` in any `[TopologicalSpace A] [IsTopologicalRing A]
[ContinuousSMul 𝕜 A] [T2Space A]`; the partial-sum form `tendsto_sum_pfc` (prototype statement in
`notes/gvl/ch09/proto/Function.lean`) follows by `HasSum.tendsto_sum_nat`. Proof: by the binomial
theorem for the commuting pair `(λ - z₀)`, `N_λ = a - λ` and nilpotency,
`(a - z₀)^k E_λ = ∑_{j<m_λ} C(k,j) (λ - z₀)^{k-j} N_λ^j E_λ`, so the series is the finite
combination `∑_λ ∑_{j<m_λ} (∑_k p.coeff k C(k,j)(λ - z₀)^{k-j}) N_λ^j E_λ`, and each scalar series
sums to `f⁽ʲ⁾(λ)/j!` (derivatives of a power series inside its ball:
`HasFPowerSeriesOnBall.hasSum_iteratedFDeriv`, `Mathlib/Analysis/Calculus/FDeriv/Analytic`, read for
`iteratedDeriv`); conclude with `pfc_eq_sum_spectralIdempotent`. Lemma 9.1.1 is the case of a
Jordan block. ★★ (~250 lines)'''
deps = ["pfc_eq_sum_spectralIdempotent", "spectralIdempotent_mul_spectralIdempotent"]

[[node]]
id = "pfc_exp_eq_normedSpace_exp"
kind = "theorem"
desc = '''Agreement with Mathlib's exponential: `pfc Complex.exp a = NormedSpace.exp a` for integral
`a` (split automatically) in a Hausdorff topological `ℂ`-algebra with continuous operations; in
particular `Matrix.pfc_exp : pfc Complex.exp A = NormedSpace.exp A` for `A : Matrix n n ℂ` with its
Pi topology, no norm needed (prototype statement in `notes/gvl/ch09/proto/Function.lean`). Proof:
`hasSum_pfc` at `z₀ = 0`, `r = ⊤` with `Complex.exp`'s series (`NormedSpace.exp_eq_tsum`,
`Complex.exp_eq_exp_ℂ`, `NormedSpace.expSeries`), and `HasSum.tsum_eq`. Also the real form: for
`A : Matrix n n ℝ`, `(NormedSpace.exp A).map Complex.ofReal = pfc Complex.exp (A.map Complex.ofReal)`
(`NormedSpace.map_exp` for the continuous ring hom `Complex.ofRealHom`). ★'''
deps = ["hasSum_pfc"]

