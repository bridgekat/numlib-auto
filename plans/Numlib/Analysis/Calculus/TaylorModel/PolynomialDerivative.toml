namespace = "TaylorModel"

desc = '''
Actual all-order derivatives of finite Taylor polynomials under finite C^p regularity, and their sharp Holder/Lipschitz remainder bounds. The derivative identity is derived from finite Schwarz symmetry and the genuine multilinear diagonal derivative sum. Repeated fixed curry isometries preserve differences of tensor derivatives, with no completeness or extra derivative assumption; applying the vector-valued value remainder to D^j f gives the sharp bound for each 0<=j<=p, including the endpoint j=p.
'''

