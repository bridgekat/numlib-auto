desc = '''
Vector-valued remainder bounds for maps `c : E → F` (Cartis–Gould–Toint apply "Corollary A.8.4 to
`c`" for the constraint and inner functions of Chapters 7 and 14). The core
`MultivariateTaylor/Remainder` is already `F`-valued:
- (A.19) is `norm_sub_taylorPolynomial_le_of_lipschitz`;
- (A.20) is `norm_iteratedFDeriv_sub_taylorPolynomial_le_of_lipschitz`.
Both use `taylorPolynomial c p x = (ftaylorSeries ℝ c x).taylorSum p`, and `taylorSum` is defined
for `FormalMultilinearSeries ℝ E F`. So this module only adds the conversion of componentwise
constants (book c.D1pL: each `c_i` has its own `L_{c,j}`) into a constant for
`c : E → EuclideanSpace ℝ (Fin m)`, which is where the book's `√m` comes from.
'''

[[node]]
id = "ContinuousMultilinearMap.norm_le_sqrt_card_mul_of_euclidean"
kind = "theorem"
desc = '''
For `A : ContinuousMultilinearMap ℝ (fun _ : Fin k => E) (EuclideanSpace ℝ (Fin m))` and `B ≥ 0`
with `‖(EuclideanSpace.proj i).compContinuousMultilinearMap A‖ ≤ B` for all `i`:
`‖A‖ ≤ Real.sqrt m * B` (indeed `‖A‖ ≤ sqrt (∑ i, ‖A_i‖²)`). Corollary (part of node): if each
component `c_i` of `c : E → EuclideanSpace ℝ (Fin m)` satisfies `IteratedFDerivLipschitzOn c_i j L C`
then `IteratedFDerivLipschitzOn c j (Real.sqrt m * L) C`, and likewise for derivative bounds — the
book's `√m L_{c,j}` (14.1.3), (B.14.3).
'''
source = "Cartis–Gould–Toint, (14.1.3), (B.14.3)"
