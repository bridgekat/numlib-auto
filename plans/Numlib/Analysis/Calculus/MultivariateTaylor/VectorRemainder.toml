desc = '''
Taylor remainder bounds for vector-valued maps `c : E → F` (Cartis–Gould–Toint use them for the
constraint/inner functions of Chapters 7 and 14: "Corollary A.8.4 applied to `c`"). The core
`MultivariateTaylor/Remainder` is stated for real-valued `f`; the vector versions follow by duality
(`‖v‖ = sup_{‖ℓ‖ ≤ 1} ℓ v`, `exists_dual_vector`, and `ℓ ∘ c` has the same Lipschitz constant for
its derivatives because `iteratedFDeriv ℝ j (ℓ ∘ c) = ℓ.compContinuousMultilinearMap (iteratedFDeriv
ℝ j c)`), so no second remainder proof is needed. Also the conversion of componentwise constants
(book c.D1pL: each `c_i` has `L_{c,j}`) into a constant for `c : E → EuclideanSpace ℝ (Fin m)`,
which produces the book's `√m`.

Requires the core `FormalMultilinearSeries.taylorSum` / `IteratedFDerivHolderOn` to be generalized to
an `F`-valued codomain (see `Optimization/Composite/TaylorModel`).
'''

[[node]]
id = "norm_sub_taylorSum_le_of_lipschitz_vec"
kind = "theorem"
desc = '''
(A.19) for `c : E → F`: if `c` is `C^p` on an open `D ⊇ C`, `C` convex,
`IteratedFDerivLipschitzOn c p L C`, and `x, x + s ∈ C`, then
`‖c (x + s) - (ftaylorSeries ℝ c x).taylorSum p s‖ ≤ L / (p + 1)! * ‖s‖ ^ (p + 1)`.
'''
deps = ["abs_sub_taylorPolynomial_le_of_lipschitz"]
source = "Cartis–Gould–Toint, Corollary A.8.4 (A.19), vector-valued use in (B.14.3)"

[[node]]
id = "norm_iteratedFDeriv_sub_taylorSum_le_of_lipschitz_vec"
kind = "theorem"
desc = '''
(A.20) for `c : E → F`: under the hypotheses above, for `1 ≤ j ≤ p` (and also `j = 0`, which is
the previous node), `‖iteratedFDeriv ℝ j c (x + s) - iteratedFDeriv ℝ j
((ftaylorSeries ℝ c x).taylorSum p) s‖ ≤ L / (p - j + 1)! * ‖s‖ ^ (p - j + 1)`.
'''
deps = ["norm_iteratedFDeriv_sub_taylorPolynomial_le_of_lipschitz", "norm_sub_taylorSum_le_of_lipschitz_vec"]
source = "Cartis–Gould–Toint, Corollary A.8.4 (A.20), vector-valued use in (B.14.4)"

[[node]]
id = "ContinuousMultilinearMap.norm_le_sqrt_card_mul_of_euclidean"
kind = "theorem"
desc = '''
For `A : ContinuousMultilinearMap ℝ (fun _ : Fin k => E) (EuclideanSpace ℝ (Fin m))` and `B ≥ 0`
with `‖(EuclideanSpace.proj i).compContinuousMultilinearMap A‖ ≤ B` for all `i`:
`‖A‖ ≤ Real.sqrt m * B` (indeed `‖A‖ ≤ sqrt (∑ i, ‖A_i‖²)`). Corollary (part of node): if each
component `c_i` of `c : E → EuclideanSpace ℝ (Fin m)` satisfies `IteratedFDerivLipschitzOn c_i j L C`
then `IteratedFDerivLipschitzOn c j (Real.sqrt m * L) C`, and likewise for derivative bounds — the
book's `√m L_{c,j}` (14.1.3), (B.14.3).
'''
source = "Cartis–Gould–Toint, (14.1.3), (B.14.3)"
