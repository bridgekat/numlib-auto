are `A^i u`). Consumers compose the lift with a bounded operator out of `A.PowDomain j`
(chapter 10: `D(A^ℓ) → H^{2ℓ}(Ω)`), `ContinuousLinearMap.contDiff.comp_contDiffOn`. Shape in
