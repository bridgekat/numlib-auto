desc = '''The componentwise reading, for a closed `A` (`hA : A.IsClosed`):
`A.ContDiffOnPowDomain n j u s ↔ ∃ w : Fin (j + 1) → ℝ → H, (∀ t ∈ s, w 0 t = u t) ∧
(∀ i, ContDiffOn ℝ n (w i) s) ∧ ∀ t ∈ s, ∀ i : Fin j, ∃ h : w i.castSucc t ∈ A.domain, A ⟨w i.castSucc t, h⟩ = w i.succ t`
("`t ↦ A^i u(t)` is `C^n` on `s` for every `i ≤ j`"). `→`: `w i = applyL A j i ∘ v`
(`ContinuousLinearMap.contDiff.comp_contDiffOn`). `←`: put `v t := ⟨toLp 2 (fun i => w i t), _⟩`
for `t ∈ s` (and `0` off `s`; `ContDiffOn` only sees `s`); `(↑) ∘ v = toLp ∘ (fun t i => w i t)`
is `C^n` on `s` by `contDiffOn_piLp` and `PiLp.contDiff_toLp`; to conclude that `v` itself is
`C^n` into the subtype — Mathlib has no `ContDiffOn.codRestrict` — write
`v = P ∘ ((↑) ∘ v)` with `P` the orthogonal projection onto the closed submodule `A.powGraph j`
(`Submodule.starProjection`/`orthogonalProjection`, available because
`hA.completeSpace_powDomain j` gives `HasOrthogonalProjection`), a bounded linear map with
`P ∘ (↑) = id`. Also the trivial cases `contDiffOnPowDomain_zero_iff : A.ContDiffOnPowDomain n 0 u s ↔ ContDiffOn ℝ n u s`
(`PowDomain.zeroEquiv`), `ContDiffOnPowDomain.mono` (in `s`), `.of_le` (in `n`), and
