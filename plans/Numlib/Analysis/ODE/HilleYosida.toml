[[node]]
id = "IsMaximalMonotone.tendstoUniformlyOn_expYosida_semigroup"
kind = "theorem"
desc = '''Uniform convergence on bounded intervals, for every datum: for `hA`, `w : H` and `0 ≤ T`,
`TendstoUniformlyOn (fun (c : ℝ) t => A.expYosida c t w) (fun t => A.semigroup t w) (𝓝[>] 0) (Icc 0 T)`.
For `w ∈ D(A)` from (13') (`2 √(cT) ‖A w‖ → 0`); for general `w` pick `w₁ ∈ D(A)` with
`‖w − w₁‖ < ε` and use `‖u_c(t) w − S(t) w‖ ≤ 2 ‖w − w₁‖ + ‖u_c(t) w₁ − S(t) w₁‖`
