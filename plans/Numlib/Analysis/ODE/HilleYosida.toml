namespace = "LinearPMap"
desc = '''
The Hille–Yosida theorem on a real Hilbert space: the evolution problem `u' + A u = 0` on
`[0, ∞)`, `u(0) = u₀`, for a maximal monotone `A`, its contraction semigroup `S_A(t)`, the
regularity `u ∈ C^{k−j}([0, ∞); D(A^j))`, and the self-adjoint case in which every `u₀ ∈ H`
gives a solution smooth for `t > 0` ([brezis2011functional] §7.2–§7.4: Theorems 7.4, 7.5, 7.7,
Lemmas 7.1, 7.2, Remarks 4, 5, 6). Builds on `Numlib/Analysis/InnerProductSpace/MaximalMonotone`
(`IsMaximalMonotone`, `resolvent`, `yosida`, `PowDomain`, `powPart`).

**Scalars: `ℝ`.** Time derivatives of `u : ℝ → H` need `NormedSpace ℝ H`; over `RCLike 𝕜`
Mathlib's own inner-product calculus (`HasDerivWithinAt.inner`, `isBoundedBilinearMap_inner`)
carries the extra hypotheses `[NormedSpace ℝ H] [IsScalarTower ℝ 𝕜 H]`, and `HasDerivWithinAt.norm_sq`
— the energy identity `d/dt ‖u‖² = 2 ⟪u', u⟫` used in every step — is stated over a *real* inner
product space only. Each of the graph spaces `D(A^k)` would then need those instances too. The
book and both consumers (chapter 10's heat and wave equations) are real, and nothing in
chapter 11 restates this material over `ℂ`; so this module takes `H` real and `A : H →ₗ.[ℝ] H`.
The proofs are `re`-generic; a complex version is a restatement with the two extra instance
arguments, not a new proof.

**The solution concept.** `LinearPMap.IsSolutionOn A u₀ s u` says `u 0 = u₀`, `u t ∈ D(A)` for
`t ∈ s`, and `HasDerivWithinAt u (−A (u t)) s t` for `t ∈ s`. It is the pattern of
`ODE.IsSolutionOn` (`Numlib/Analysis/ODE/Cauchy`) with the field replaced by the partial map
`A` (a total field cannot express `u t ∈ D(A)`), and with the sign convention `u' + A u = 0` of
monotone-operator theory. The set `s` is `Ici 0` for Theorems 7.4–7.5 and `Ioi 0` for Theorem
7.7. The book's classes are read as: `u ∈ C¹([0, ∞); H)` is `ContDiffOn ℝ 1 u (Ici 0)`
(`contDiffOn_one_iff_derivWithin`, `uniqueDiffOn_Ici`); `u ∈ C^n(s; D(A^j))` is
`LinearPMap.ContDiffOnPowDomain A n j u s`: `u` lifts on `s` to a `ContDiffOn ℝ n` map into the
Hilbert space `A.PowDomain j`; `contDiffOnPowDomain_iff` reads it componentwise ("`t ↦ A^i u(t)`
is `C^n` for every `i ≤ j`"), which is the form chapter 10 will unpack. For a solution,
`C([0,∞); D(A))` is implied by `C¹([0,∞); H)` — the book's own remark "from (6) we deduce that
`u ∈ C([0,+∞); D(A))`" — and both are recorded.

**The proof route, and how it differs from the book's six steps.** The approximate problem
`u_λ' + A_λ u_λ = 0` has the closed-form solution `u_λ(t) = exp(−t A_λ) u₀` with Mathlib's
`NormedSpace.exp` on `H →L[ℝ] H` (`hasDerivAt_exp_smul_const'`, `Commute.exp_right`), so
Theorem 7.3 is *not* used inside Theorem 7.4 (it is a node of its own in `ODE/Cauchy`). Two
consequences shorten the book's argument:

1. `u_λ'(t) = −exp(−t A_λ) A_λ u₀`, so the derivatives converge as soon as `u_λ(t) w → S(t) w`
   for every `w ∈ H` (with `w = A u₀`) and `A_λ u₀ → A u₀`. The book's Step 4 (a second Cauchy
   estimate under `u₀ ∈ D(A²)`), Step 6 (density of `D(A²)`, Lemma 7.2) and its silent use of
   `A_λ u₀ → A u₀` in Step 4 all disappear; existence is proved for every `u₀ ∈ D(A)` at once,
   which is Remark 4 (a). Lemma 7.2 remains as `IsMaximalMonotone.dense_range_castL`.
2. The limit `S_A(t) u₀ = lim_{λ→0⁺} exp(−t A_λ) u₀` exists for **every** `u₀ ∈ H` (Remark 4 (b),
   footnote 4), so the contraction semigroup `LinearPMap.semigroup A t : H →L[ℝ] H` of Remark 5
   is *defined first* (junk-valued total definition, as `resolvent`), Theorem 7.4's solution is
   `t ↦ A.semigroup t u₀`, and the semigroup law, `‖S(t)‖ ≤ 1` and strong continuity are nodes.
   Theorem 7.7's Step 2 then needs no `D(A²)` either: for `u₀ ∈ H` and `t > 0`,
   `S(t) u₀ = S(t − δ) (S(δ) u₀)` with `S(δ) u₀ ∈ D(A)`.

The steps that survive, each a node with its estimate: Step 1 (uniqueness and the contraction
`‖u(t) − v(t)‖ ≤ ‖u₀ − v₀‖`, `IsMonotone.norm_sub_le_of_isSolutionOn`); Step 2 / Lemma 7.1
(`t ↦ ‖exp(−tB) w‖` antitone for a bounded monotone `B`, `antitoneOn_norm_exp_neg_smul_apply`);
Step 3 (the Cauchy estimate `‖u_λ(t) − u_μ(t)‖² ≤ ‖w₀ − w₁‖² + 4(λ+μ) t M²`,
`norm_expYosida_sub_expYosida_le`, and the limit `tendsto_expYosida_semigroup`); Step 4 in its
collapsed form (`tendstoUniformlyOn_deriv_expYosida`); Step 5 (the uniform-limit lemma
`hasDerivWithinAt_Icc_of_tendstoUniformlyOn` and the closed-graph identification
`hasDerivWithinAt_semigroup_apply`). Theorem 7.7's estimate `‖u'(t)‖ ≤ ‖u₀‖/t` comes from the
book's (33) read as a Lyapunov function: `Φ(t) = ½‖u‖² + t ⟪Bu, u⟫ + t² ‖Bu‖²` is nonincreasing
along `u = exp(−tB) w` for bounded self-adjoint monotone `B` (`Φ' = t² d/dt ‖Bu‖² ≤ 0`) — no
integration by parts is needed (`norm_exp_neg_smul_apply_le_div`).

**Universe polymorphism matters.** Theorems 7.5 and 7.7 apply Theorem 7.4 and Theorem 7.7 to
`A.powPart j` on the Hilbert space `A.PowDomain j` (complete by `IsClosed.completeSpace_powDomain`),
so every node about `semigroup` must be stated for an arbitrary real Hilbert space, never for
a fixed one; the induction over `j` changes the space.

**Order of attack:** `IsSolutionOn` and Step 1 → the `exp(−tB)` lemmas → `expYosida` and
Steps 2–3 → `semigroup` and its spec → Step 5 and Theorem 7.4 → Remark 5 → `ContDiffOnPowDomain`
and `contDiffOnPowDomain_iff` → `applyL_semigroup_powPart` and the ladder → Theorem 7.5 → the
self-adjoint section → Theorem 7.7. Estimated 1500–1900 lines.
'''

[[node]]
id = "IsSolutionOn"
kind = "definition"
desc = '''`structure A.IsSolutionOn (u₀ : H) (s : Set ℝ) (u : ℝ → H) : Prop` for `A : H →ₗ.[ℝ] H`:
`apply_zero : u 0 = u₀`, `mem_domain : ∀ t ∈ s, u t ∈ A.domain`, and
`hasDerivWithinAt : ∀ t (ht : t ∈ s), HasDerivWithinAt u (−A ⟨u t, mem_domain t ht⟩) s t` —
`u` solves `du/dt + A u = 0` on `s` with `u(0) = u₀` ([brezis2011functional] (6) of §7.2 with
`s = Ici 0`, and (26) of §7.4 with `s = Ioi 0`). The `C¹` requirement is a separate conjunct
`ContDiffOn ℝ 1 u s` in the theorems. Shape settled in
`notes/brezis/ch07/proto/MaximalMonotone.lean`. ★'''
deps = []
source = "[brezis2011functional] §7.2, problem (6)"

[[node]]
id = "IsSolutionOn.continuousOn"
kind = "theorem"
desc = '''A solution is continuous on `s` (`HasDerivWithinAt.continuousOn`). ★'''
deps = ["IsSolutionOn"]
source = "[brezis2011functional] §7.2, problem (6)"

[[node]]
id = "IsSolutionOn.mono"
kind = "theorem"
desc = '''`A.IsSolutionOn u₀ s u → t ⊆ s → A.IsSolutionOn u₀ t u` (`HasDerivWithinAt.mono`). ★'''
deps = ["IsSolutionOn"]
source = "[brezis2011functional] §7.2, problem (6)"

[[node]]
id = "IsSolutionOn.comp_add"
kind = "theorem"
desc = '''Time shift: if `A.IsSolutionOn u₀ (Ici 0) u` and `0 ≤ a` then
`A.IsSolutionOn (u a) (Ici 0) (fun t => u (t + a))`. From `HasDerivWithinAt.comp` with the
affine map `t ↦ t + a` (`HasDerivWithinAt.comp_add_const` or `hasDerivWithinAt_id.add_const`),
noting `(· + a) '' Ici 0 ⊆ Ici 0`. Used for the semigroup law and for Theorem 7.7's
regularity away from `t = 0`. ★'''
deps = ["IsSolutionOn"]
source = "[brezis2011functional] Chapter 7, Remark 5"

[[node]]
id = "isSolutionOn_smul_id_vadd_iff"
kind = "theorem"
desc = '''Remark 6 ([brezis2011functional] Chapter 7, Remark 6): for `c : ℝ`, `u` solves
`u' + A u + c u = 0` iff `v(t) = e^{ct} u(t)` solves `v' + A v = 0`:
`((c • LinearMap.id) +ᵥ A).IsSolutionOn u₀ s u ↔ A.IsSolutionOn u₀ s (fun t => Real.exp (c * t) • u t)`.
Both domains are `A.domain` (`vadd_domain`); the derivative of the product is
`HasDerivWithinAt.smul` with `Real.hasDerivAt_exp`. ★'''
deps = ["IsSolutionOn"]
source = "[brezis2011functional] Chapter 7, Remark 6"

[[node]]
id = "IsMonotone.norm_sub_le_of_isSolutionOn"
kind = "theorem"
desc = '''Step 1 of the proof of Theorem 7.4, in its quantitative form: for a monotone `A`
(`hA : A.IsMonotone`) and two solutions `A.IsSolutionOn u₀ (Ici 0) u`, `A.IsSolutionOn v₀ (Ici 0) v`,
the function `t ↦ ‖u t − v t‖` is antitone on `Ici 0`; hence `‖u t − v t‖ ≤ ‖u₀ − v₀‖` for
`t ≥ 0`. Proof ([brezis2011functional] lines 6968–6987 and footnote 3): `φ(t) = ‖u t − v t‖²`
has `HasDerivWithinAt φ (2 ⟪(u − v)' , u − v⟫) (Ici 0) t` (`HasDerivWithinAt.norm_sq` over the
real inner product space `H`), and `(u − v)' = −A (u − v)`, so the derivative is
`−2 ⟪A (u−v), u−v⟫ ≤ 0`; `antitoneOn_of_hasDerivWithinAt_nonpos` on the convex set `Ici 0`
(interior `Ioi 0`; continuity from `IsSolutionOn.continuousOn`). The same argument with
`D = Ici 0` and derivatives only on the interior `Ioi 0` gives the variant for solutions on
`Ioi 0` that are continuous on `Ici 0`, used by Theorem 7.7 — state both, or state the
`Ioi 0` version and derive the other. ★'''
deps = ["IsSolutionOn.continuousOn", "IsMonotone"]
source = "[brezis2011functional] Theorem 7.4, proof, Step 1"

[[node]]
id = "IsMonotone.eqOn_of_isSolutionOn"
kind = "theorem"
desc = '''Uniqueness in Theorem 7.4: for a monotone `A`, two solutions of `A.IsSolutionOn u₀ (Ici 0)`
with the same datum agree on `Ici 0` (`EqOn u v (Ici 0)`); `norm_sub_le_of_isSolutionOn` with
`u₀ = v₀`. Monotonicity alone suffices — maximality is only needed for existence. ★'''
deps = ["IsMonotone.norm_sub_le_of_isSolutionOn"]
source = "[brezis2011functional] Theorem 7.4, proof, Step 1"

[[node]]
id = "IsMonotone.eqOn_of_isSolutionOn_Ioi"
kind = "theorem"
desc = '''Uniqueness in Theorem 7.7 ([brezis2011functional] proof of Theorem 7.7, "Uniqueness"):
for a monotone `A`, if `A.IsSolutionOn u₀ (Ioi 0) u`, `A.IsSolutionOn u₀ (Ioi 0) v`,
`ContinuousOn u (Ici 0)` and `ContinuousOn v (Ici 0)`, then `EqOn u v (Ici 0)`: `φ = ‖u − v‖²`
is continuous on `Ici 0`, nonincreasing there because its derivative on the interior `Ioi 0`
is `≤ 0` (`antitoneOn_of_hasDerivWithinAt_nonpos` asks for derivatives on `interior D` only),
and `φ 0 = 0`. ★'''
deps = ["IsSolutionOn", "IsMonotone"]
source = "[brezis2011functional] Theorem 7.7, proof, Uniqueness"

[[node]]
id = "_root_.hasDerivAt_exp_neg_smul_apply"
kind = "theorem"
desc = '''For `B : H →L[ℝ] H` and `w : H`, `HasDerivAt (fun t : ℝ => NormedSpace.exp ((−t) • B) w)
(−(B (NormedSpace.exp ((−t) • B) w))) t`, together with the commuted form
`exp_neg_smul_apply_comm : B (exp ((−t) • B) w) = exp ((−t) • B) (B w)` (`Commute.exp_right`
of `(Commute.refl B).neg_left.smul_left`). From `hasDerivAt_exp_smul_const'` with `x = −B` and
`ContinuousLinearMap.apply` (evaluation at `w` is a bounded linear map, so
`HasDerivAt.clm_apply`/`HasDerivAt.comp`). Also `exp_neg_smul_zero_apply : exp ((−0) • B) w = w`
(`NormedSpace.exp_zero`) and `contDiff_exp_neg_smul_apply : ContDiff ℝ n (fun t => exp ((−t) • B) w)`
for every `n` (induction with `contDiff_succ_iff_deriv`, or analyticity of `exp`). ★'''
deps = []
source = "[brezis2011functional] Theorem 7.4, proof, Step 2"

[[node]]
id = "_root_.antitoneOn_norm_exp_neg_smul_apply"
kind = "theorem"
desc = '''Lemma 7.1 ([brezis2011functional] Lemma 7.1) for a bounded monotone operator: if
`B : H →L[ℝ] H` satisfies `∀ v, 0 ≤ ⟪B v, v⟫`, then for every `w`, `t ↦ ‖exp ((−t) • B) w‖` is
antitone on `Ici 0`, and consequently `norm_exp_neg_smul_apply_le : ‖exp ((−t) • B) w‖ ≤ ‖w‖`
for `0 ≤ t` and `norm_exp_neg_smul_le_one : ‖exp ((−t) • B)‖ ≤ 1`. Proof: `d/dt ½‖u‖² =
⟪u', u⟫ = −⟪B u, u⟫ ≤ 0` (`HasDerivAt.norm_sq`, `antitoneOn_of_hasDerivWithinAt_nonpos`). The
book's second clause, that `‖w'(t)‖` is nonincreasing too, is this lemma applied to
`w' = exp(−tB)(−B w)` (`exp_neg_smul_apply_comm`), and likewise at every order. The book states
the lemma for any `C¹` solution `w` of `w' + A_λ w = 0`; every such `w` is `exp(−tA_λ) w(0)` by
uniqueness (Gronwall, or `IsMonotone.eqOn_of_isSolutionOn` for the total operator
`A_λ.toLinearMap.toPMap ⊤`), which is how the surface node `lemma_7_1` reads it back. ★'''
deps = ["hasDerivAt_exp_neg_smul_apply"]
source = "[brezis2011functional] Lemma 7.1"

[[node]]
id = "expYosida"
kind = "definition"
desc = '''`A.expYosida c t : H →L[ℝ] H := NormedSpace.exp ((−t) • A.yosida c)`, so that
`u_λ(t) = A.expYosida λ t u₀` is the solution of the approximate problem (7),
`u_λ' + A_λ u_λ = 0`, `u_λ(0) = u₀` ([brezis2011functional] §7.2, (7)). Lemmas
`hasDerivAt_expYosida_apply : HasDerivAt (fun t => A.expYosida c t w) (−(A.yosida c (A.expYosida c t w))) t`,
`expYosida_zero`, `yosida_expYosida_comm` (instances of the `exp_neg_smul` lemmas). ★'''
deps = ["hasDerivAt_exp_neg_smul_apply"]
source = "[brezis2011functional] §7.2, problem (7)"

[[node]]
id = "IsMaximalMonotone.norm_expYosida_apply_le"
kind = "theorem"
desc = '''Estimate (8) of Step 2: for `hA : A.IsMaximalMonotone`, `0 < c`, `0 ≤ t`,
`‖A.expYosida c t w‖ ≤ ‖w‖`, and `t ↦ ‖A.expYosida c t w‖` antitone on `Ici 0`. Lemma 7.1
(`antitoneOn_norm_exp_neg_smul_apply`) with `B = A.yosida c`, monotone by Proposition 7.2 (e)
(`re_inner_yosida_nonneg`, `re` being the identity over `ℝ`). ★'''
deps = ["antitoneOn_norm_exp_neg_smul_apply", "expYosida", "IsMaximalMonotone.re_inner_yosida_nonneg"]
source = "[brezis2011functional] Theorem 7.4, proof, Step 2, (8)"

[[node]]
id = "IsMaximalMonotone.norm_yosida_expYosida_apply_le"
kind = "theorem"
desc = '''Estimate (9) of Step 2: for `hA`, `0 < c`, `0 ≤ t` and `w : H`,
`‖A.yosida c (A.expYosida c t w)‖ ≤ ‖A.yosida c w‖` (so `‖u_λ'(t)‖ = ‖A_λ u_λ(t)‖ ≤ ‖A_λ u₀‖`),
and for `u₀ : A.domain`, `‖A.yosida c (A.expYosida c t u₀)‖ ≤ ‖A u₀‖` by Proposition 7.2 (b).
From `yosida_expYosida_comm` and `norm_expYosida_apply_le` applied to `A_c w`. ★'''
deps = ["IsMaximalMonotone.norm_expYosida_apply_le", "IsMaximalMonotone.norm_yosida_apply_le_norm_apply"]
source = "[brezis2011functional] Theorem 7.4, proof, Step 2, (9)"

[[node]]
id = "IsMaximalMonotone.norm_expYosida_sub_expYosida_le"
kind = "theorem"
desc = '''Step 3's Cauchy estimate, (13) of [brezis2011functional] (lines 7030–7060), for two data
so that it also serves the derivatives: for `hA`, `0 < c`, `0 < d`, `0 ≤ t`, `w₀ w₁ : H` and
`M` with `‖A.yosida c w₀‖ ≤ M` and `‖A.yosida d w₁‖ ≤ M`,
`‖A.expYosida c t w₀ − A.expYosida d t w₁‖ ^ 2 ≤ ‖w₀ − w₁‖ ^ 2 + 4 * (c + d) * t * M ^ 2`.
Proof: `φ = ‖u_c − u_d‖²` has derivative `−2 ⟪A_c u_c − A_d u_d, u_c − u_d⟫`
(`HasDerivAt.norm_sq`, `hasDerivAt_expYosida_apply`), which by (12)
(`re_inner_yosida_sub_yosida_ge`) is `≤ −2 ⟪A_c u_c − A_d u_d, c A_c u_c − d A_d u_d⟫ ≤
2 (‖A_c u_c‖ + ‖A_d u_d‖)(c ‖A_c u_c‖ + d ‖A_d u_d‖) ≤ 4 (c + d) M²` by (9); then
`Convex.image_sub_le_mul_sub_of_deriv_le` (or `image_le_of_deriv_right_le_deriv_boundary`) on
`Icc 0 t` gives `φ t ≤ φ 0 + 4(c+d)M² t`. With `w₀ = w₁ = u₀ ∈ D(A)` and `M = ‖A u₀‖` this is
the book's `|u_λ(t) − u_μ(t)| ≤ 2 √((λ+μ) t) |A u₀|`. ★★'''
deps = ["expYosida", "IsMaximalMonotone.re_inner_yosida_sub_yosida_ge", "IsMaximalMonotone.norm_yosida_expYosida_apply_le"]
source = "[brezis2011functional] Theorem 7.4, proof, Step 3, (13)"

[[node]]
id = "semigroup"
kind = "definition"
desc = '''`A.semigroup t : H →L[ℝ] H`, the contraction semigroup `S_A(t)` of Remark 5, defined as in
footnote 4 of [brezis2011functional] §7.2 (Remark 4 (b)): the limit `lim_{λ→0⁺} exp(−t A_λ) u₀`.
Total in `(A, t)` by the junk-value pattern of `resolvent`: by classical choice, a bounded
`S` with `∀ u₀, Tendsto (fun c : ℝ => A.expYosida c t u₀) (𝓝[>] 0) (𝓝 (S u₀))` if one exists
(unique, limits being unique), else `0`. The definition takes no `CompleteSpace H` hypothesis
(only the lemmas do), so that `(A.powPart j).semigroup` on `A.PowDomain j` is well-formed before
completeness is supplied by `haveI`. Its properties are stated under `hA : A.IsMaximalMonotone`
and `0 ≤ t`. ★'''
deps = ["expYosida"]
source = "[brezis2011functional] Chapter 7, Remark 4 (b), Remark 5"

[[node]]
id = "IsMaximalMonotone.tendsto_expYosida_semigroup"
kind = "theorem"
desc = '''The specification of `semigroup` (Remark 4 (b)): for `hA`, `0 ≤ t` and **every** `u₀ : H`,
`Tendsto (fun c : ℝ => A.expYosida c t u₀) (𝓝[>] 0) (𝓝 (A.semigroup t u₀))`. Proof: (i) for
`u₀ ∈ D(A)` the family is Cauchy along `𝓝[>] 0` by `norm_expYosida_sub_expYosida_le` with
`M = ‖A u₀‖` (`4 (c + d) t ‖A u₀‖² → 0`), so it converges in the complete `H`
(`cauchy_map_iff'`-style: exhibit, for each `ε`, a `δ` with `dist (u_c t) (u_d t) < ε` for
`c, d ∈ Ioo 0 δ`; then `CompleteSpace.complete`/`Cauchy.tendsto_lim`); (ii) for general `u₀`,
approximate by `v₀ ∈ D(A)` (`dense_domain`) using `‖u_c(t) u₀ − u_c(t) v₀‖ ≤ ‖u₀ − v₀‖`
(`norm_expYosida_apply_le`), which makes the family Cauchy again; (iii) the pointwise limit
`u₀ ↦ lim` is linear (limits of linear maps) and bounded by `1`, so it is a `ContinuousLinearMap`
(`LinearMap.mkContinuous`), which witnesses the `∃` in the definition. ★★'''
deps = ["semigroup", "IsMaximalMonotone.norm_expYosida_sub_expYosida_le", "IsMaximalMonotone.norm_expYosida_apply_le", "IsMaximalMonotone.dense_domain"]
source = "[brezis2011functional] Chapter 7, Remark 4 (b)"

[[node]]
id = "IsMaximalMonotone.norm_expYosida_sub_semigroup_le"
kind = "theorem"
desc = '''(13') of Step 3: for `hA`, `0 < c`, `0 ≤ t` and `u₀ : A.domain`,
`‖A.expYosida c t u₀ − A.semigroup t u₀‖ ≤ 2 * Real.sqrt (c * t) * ‖A u₀‖`. Let `d → 0⁺` in
`norm_expYosida_sub_expYosida_le` (`le_of_tendsto`, `tendsto_expYosida_semigroup`). ★'''
