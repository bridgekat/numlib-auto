source = "[brezis2011functional] Theorem 7.4, proof, Step 5"

[[node]]
id = "IsMaximalMonotone.hasDerivWithinAt_semigroup_apply"
kind = "theorem"
desc = '''Step 5 — the heart of Theorem 7.4 ([brezis2011functional] lines 7093–7121, for every
