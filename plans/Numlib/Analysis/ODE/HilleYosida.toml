with `F c = u_c(·) u₀`, `F' c t = −exp(−tA_c) A_c u₀`, `g = −S(·)(A u₀)`
(`hasDerivAt_expYosida_apply`, `tendstoUniformlyOn_deriv_expYosida`,
`tendstoUniformlyOn_expYosida_semigroup`), then `HasDerivWithinAt.mono_of_mem_nhdsWithin`
(`Icc 0 T ∈ 𝓝[Ici 0] t`). (i)–(ii) by the closed graph (`IsMaximalMonotone.isClosed`,
