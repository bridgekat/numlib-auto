(i) `semigroup_apply_mem_domain : A.semigroup t u₀ ∈ A.domain`,
(ii) `semigroup_apply_apply : A ⟨A.semigroup t u₀, _⟩ = A.semigroup t (A u₀)` (`S(t)` commutes
with `A` on `D(A)`), and
(iii) `HasDerivWithinAt (fun t => A.semigroup t u₀) (−(A.semigroup t (A u₀))) (Ici 0) t`.
