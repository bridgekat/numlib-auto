`∀ᶠ i in l, ContinuousOn (F' i) (Icc a b)`, `TendstoUniformlyOn F' g l (Icc a b)`, and
`∀ t ∈ Icc a b, Tendsto (fun i => F i t) l (𝓝 (f t))`, then
`∀ t ∈ Icc a b, HasDerivWithinAt f (g t) (Icc a b) t`. Proof by the fundamental theorem of
calculus, not by difference quotients: `F i t = F i a + ∫_a^t F' i`
(`intervalIntegral.integral_eq_sub_of_hasDerivAt_of_le` in its `HasDerivWithinAt` form), the
integrals converge by `intervalIntegral.norm_integral_le_of_norm_le_const` under uniform
convergence, `g` is continuous on `Icc a b` (`TendstoUniformlyOn.continuousOn`), so
`f t = f a + ∫_a^t g` and `intervalIntegral.integral_hasDerivWithinAt_right` (with
`ContinuousOn.stronglyMeasurableAtFilter`/`ContinuousWithinAt`) differentiates it. Natural home
`Mathlib.Analysis.Calculus.UniformLimitsDeriv`; upstreaming candidate. ★★'''
