# Planned additions (GVL round): the module doc of `Numlib.Analysis.Fourier.DFT` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch01) add "The entries of the transform matrix `F_n = (dft n)ᴴ` in real form, `cos(2πkj/n) − i
# sin(2πkj/n)` ([golub2013matrix] (1.4.5)), and its two index symmetries — the reflection `j ↦ n −
# j` conjugates, the half shift `j ↦ j + n/2` multiplies by `(−1)^k` — are what the block structure
# of `F_{2m}` ([golub2013matrix] Theorem 1.4.1) and the DST/DCT identities of
# `Numlib/Analysis/Fourier/SineCosineTransform` are proved from."
# (review) The diagonalization of circulants by `F_n = (dft n)ᴴ` ([golub2013matrix] Theorem 4.8.2) is in the
# sibling `Numlib/Analysis/Fourier/Circulant`, not in `LinearAlgebra/Matrix/Toeplitz` (whose layer must not
# import this module, which imports `Numlib/Approximation/TrapezoidExactness`).
