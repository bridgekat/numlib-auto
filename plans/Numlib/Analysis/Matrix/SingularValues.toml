[[node]]
id = "norm_trace_mul_le_sum_sortedSingularValues_mul"
kind = "theorem"
desc = '''**Von Neumann's trace inequality** (von Neumann 1937; review L1): for `A : Matrix m n 𝕜`,
`B : Matrix n m 𝕜`, `‖trace (A * B)‖ ≤ ∑ i ∈ Finset.range (min (card m) (card n)),
A.sortedSingularValues i * B.sortedSingularValues i`. Proof: from an SVD `B = U Σ Vᴴ`,
`trace (A B) = ∑_i σ_i(B) ⟪v_i, A u_i⟫`-type expansion; Abel summation with the decreasing weights
`σ_i(B)` reduces the claim to the partial sums `∑_{i<k} ‖⟪v_i, A u_i⟫‖ ≤ ∑_{i<k} σ_i(A)`, which is
Ky Fan's principle for the Hermitian dilation: with phases `ω_i` making `ω_i ⟪v_i, A u_i⟫ ≥ 0`, the
vectors `x_i = (u_i, ω_i v_i)/√2` are orthonormal in `𝕜ⁿ × 𝕜ᵐ`, `re ⟪hermitianDilation A x_i, x_i⟫ =
‖⟪v_i, A u_i⟫‖`, and `LinearMap.IsSymmetric.sum_re_inner_le_sum_eigenvalues` bounds the sum by the top
`k` eigenvalues of the dilation, `σ_0(A), …, σ_{k-1}(A)` (`IsHermitian.eigenvalues₀_hermitianDilation`).
The one-sided Procrustes bound `Matrix.re_trace_mul_le_sum_singularValues` is the case of a unitary
factor (all `σ_i = 1`). ★★ (~120 lines)'''
