[[node]]
id = "Matrix.frobenius_norm_polar_sub_le"
kind = "theorem"
desc = '''The Li–Sun perturbation bound for the orthogonal polar factor ([golub2013matrix] §9.4.3, quoted
from W. Li and W. Sun, SIAM J. Matrix Anal. Appl. 25 (2003), no proof in the book): for nonsingular
real `A, Ã : Matrix (Fin n) (Fin n) ℝ` (`n ≥ 2`) with `IsPolarDecomposition A U P` and
`IsPolarDecomposition Ã Ũ P̃`, `‖U - Ũ‖_F ≤ 4 ‖A - Ã‖_F / (σ_{n-2}(A) + σ_{n-1}(A) + σ_{n-2}(Ã) + σ_{n-1}(Ã))`
with `σ_k = sortedSingularValues k` (0-based: the book's `σ_{n-1} + σ_n`, the two smallest). Route
(Li–Sun §2): with `W = Uᵀ Ũ` orthogonal, `Uᵀ(A - Ã)` relates `P - W P̃`; the skew part of `W` is
controlled through a Sylvester-type equation `S P̃ + P S = …` whose solution operator has norm
`≤ 1/(σ_i + σ̃_j)` on the relevant components, and the real case uses that a real orthogonal
matrix's skew part pairs eigenvalues, giving the sum of the two smallest. ★★★ (~600 lines, the proof
is not in the book)

Blocked (dec1, bb2): the book quotes the bound without proof. The complex bound is proved
separately (agent bb2): `Matrix.IsPolarDecomposition.frobenius_norm_sub_le` (Loewner lower bounds
`σ ≤ P`, `σ̃ ≤ P̃`) and `Matrix.IsPolarDecomposition.frobenius_norm_sub_le_div_iInf_singularValues`
(`‖U − Ũ‖_F ≤ 2 ‖A − Ã‖_F / (σ_min(A) + σ_min(Ã))`), through the Sylvester bound
`Matrix.frobenius_norm_le_of_mul_add_mul_eq`. The real refinement (constant 4 over the sum of the
two smallest singular values of each) needs Li–Sun's pairing argument for the skew part of the real
orthogonal `W = Uᵀ Ũ` (its eigenvalues come in conjugate pairs, so the Sylvester operator can be
bounded on `2 × 2` blocks), not in the references; not attempted (~600 lines).'''
deps = ["Matrix.IsPolarDecomposition", "Matrix.IsPolarDecomposition.eq_cfcSqrt", "Matrix.sortedSingularValues"]

