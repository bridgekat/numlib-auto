[[node]]
id = "Matrix.matrixSign_hermitianDilation"
kind = "theorem"
desc = '''The sign of the Jordan–Wielandt matrix ([golub2013matrix] §9.4.3): for nonsingular
`A : Matrix n n ℂ` with `IsPolarDecomposition A U P`,
`matrixSign (hermitianDilation Aᴴ) = hermitianDilation Uᴴ`, i.e. the sign of `[0 A; Aᴴ 0]` is
`[0 U; Uᴴ 0]` (`Matrix.hermitianDilation Aᴴ = fromBlocks 0 A Aᴴ 0`, the book's block order; the book
omits "nonsingular", needed so that no eigenvalue `±σᵢ` is `0`). Proof: from an SVD `A = W Σ Vᴴ`
(`Matrix.exists_isSVD`; `U = W Vᴴ` by `Matrix.IsPolarDecomposition.unique` and
`Matrix.IsSVD.isPolarDecomposition`), the unitary `Q = (1/√2) fromBlocks W 0 0 V * fromBlocks 1 1 1 (-1)`
satisfies `Qᴴ (hermitianDilation Aᴴ) Q = fromBlocks Σ 0 0 (-Σ)`; `Matrix.matrixSign_conj_fromBlocks`
with `X = Q`, `Q⁻¹ = Qᴴ`, then the block product. Renamed from
`Matrix.matrixSign_fromBlocks_zero_conjTranspose` and restated through the dilation (review H1).
★★ (~150 lines)

Blocked (dec1): needs `Matrix.hermitianDilation` of `Numlib/Analysis/Matrix/SingularValues`, proved by
agent sv2 on branch `agent/sv2` (not yet on main when dec1 finished). Everything else is on main
(`Matrix.matrixSign_conj_fromBlocks`, `Matrix.IsSVD.isPolarDecomposition_of_square`,
`Matrix.IsPolarDecomposition.unique`). Estimate unchanged (~150 lines).'''
deps = ["Matrix.hermitianDilation", "Matrix.matrixSign_conj_fromBlocks", "Matrix.IsPolarDecomposition", "Matrix.IsSVD.isPolarDecomposition", "Matrix.IsPolarDecomposition.eq_cfcSqrt", "Matrix.exists_isSVD"]

[[node]]
id = "Matrix.frobenius_norm_polar_sub_le"
kind = "theorem"
desc = '''The Li–Sun perturbation bound for the orthogonal polar factor ([golub2013matrix] §9.4.3, quoted
from W. Li and W. Sun, SIAM J. Matrix Anal. Appl. 25 (2003), no proof in the book): for nonsingular
real `A, Ã : Matrix (Fin n) (Fin n) ℝ` (`n ≥ 2`) with `IsPolarDecomposition A U P` and
`IsPolarDecomposition Ã Ũ P̃`, `‖U - Ũ‖_F ≤ 4 ‖A - Ã‖_F / (σ_{n-2}(A) + σ_{n-1}(A) + σ_{n-2}(Ã) + σ_{n-1}(Ã))`
with `σ_k = sortedSingularValues k` (0-based: the book's `σ_{n-1} + σ_n`, the two smallest). Route
(Li–Sun §2): with `W = Uᵀ Ũ` orthogonal, `Uᵀ(A - Ã)` relates `P - W P̃`; the skew part of `W` is
controlled through a Sylvester-type equation `S P̃ + P S = …` whose solution operator has norm
`≤ 1/(σ_i + σ̃_j)` on the relevant components, and the real case uses that a real orthogonal
matrix's skew part pairs eigenvalues, giving the sum of the two smallest. ★★★ (~600 lines, the proof
is not in the book)

Blocked (dec1, not attempted beyond analysis): the book quotes the bound without proof. The general
(complex) bound `‖U − Ũ‖_F ≤ 2‖A − Ã‖_F / (σ_n + σ̃_n)` has a short proof — with `W = Uᴴ Ũ`,
`X = I − W` solves the Sylvester equation `P X + X P̃ = Uᴴ Δ − Δᴴ Ũ` (`Δ = A − Ã`), whose solution
operator has norm `≤ 1/(σ_n + σ̃_n)` in eigenbases of `P`, `P̃` (~100 lines) — but the real refinement
with the two smallest singular values needs Li–Sun's pairing argument for the skew part of a real
orthogonal `W`, which is research-level material (~600 lines). A good first step would be the complex
bound as a separate node.'''
deps = ["Matrix.IsPolarDecomposition", "Matrix.IsPolarDecomposition.eq_cfcSqrt", "Matrix.sortedSingularValues"]

