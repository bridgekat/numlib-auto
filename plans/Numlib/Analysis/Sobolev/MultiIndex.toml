# ---- Appended by the Brezis chapter-9a plan (2026-09-17). Nothing above this line was edited.

[[node]]
id = "SobolevEuclidean"
kind = "definition"
desc = '''The book's `W^{k,p}(Ω)` on an open `Ω ⊆ ℝ^N`, as an `abbrev`:
`SobolevEuclidean (N k : ℕ) (p : ℝ≥0∞) (Ω : Opens (EuclideanSpace ℝ (Fin N))) :=
SobolevMultiIndex ℝ (EuclideanSpace.basisFun (Fin N) ℝ).toBasis k p Ω volume` — the multi-index
formulation over the standard basis and Lebesgue measure, whose norm is
`(∑_{|α| ≤ k} ‖∂^α u‖_p^p)^{1/p}` (`SobolevMultiIndex.norm_eq_sum`) and which at `p = 2` is a
Hilbert space with the inner product `∑_{|α|≤k} ∫ ∂^α u ∂^α v` (`SobolevMultiIndex.inner_eq`).
This is the type every Brezis chapter-9 statement is written over ([brezis2011functional] §9.1,
Definition, and the paragraph "The spaces `W^{m,p}(Ω)`"); the new modules
`Numlib/Analysis/Sobolev/{Cutoff,…,Compactness}` state their typed results on it. Being an
`abbrev`, every `SobolevMultiIndex` lemma applies to it unchanged. The whole space is
`Ω = ⊤`, and `volume.restrict (⊤ : Opens _)` is `volume` (`MeasureTheory.Measure.restrict_coe_top`
in `Density.lean`). ★'''
deps = ["SobolevMultiIndex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.1, Definition"

[[node]]
id = "SobolevEuclideanZero"
kind = "definition"
desc = '''The book's `W_0^{k,p}(Ω)` on `Ω ⊆ ℝ^N`, as an `abbrev`:
`SobolevEuclideanZero N k p Ω := SobolevMultiIndexZero ℝ (EuclideanSpace.basisFun (Fin N) ℝ).toBasis k p Ω volume`,
the closure of the test functions in `SobolevEuclidean N k p Ω` ([brezis2011functional] §9.4,
Definition, and Remark 22 for `m ≥ 2`). The book closes `C_c^1(Ω)` (resp. `C_c^m(Ω)`) rather
than `C_c^∞(Ω)`; the two closures agree by `SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact`
(Lemma 9.5, `Numlib/Analysis/Sobolev/Cutoff.lean`), which places every compactly supported
`W^{k,p}` function — a `C_c^m` function in particular — in this closure. ★'''
deps = ["SobolevMultiIndexZero", "SobolevEuclidean"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.4, Definition"

[[node]]
id = "HasWeakIteratedLineDerivOn.comp_perm"
kind = "theorem"
desc = '''A weak derivative along a tuple of directions is a weak derivative along every permutation
of the tuple: for `σ : Equiv.Perm (Fin n)`, `HasWeakIteratedLineDerivOn y f w Ω μ →
HasWeakIteratedLineDerivOn (y ∘ σ) f w Ω μ`. Proof: the defining identity tests
`iteratedFDeriv ℝ n φ x (y ∘ σ)` against `f`, and for the smooth test function `φ` this equals
`iteratedFDeriv ℝ n φ x y` by `ContDiff.iteratedFDeriv_congr_perm`
(`Numlib/Analysis/Calculus/IteratedFDeriv.lean`), already the tool of
`MemSobolevMultiIndex.memSobolev`. Needed by `memSobolevMultiIndex_succ_iff`, where
`∂_i ∂^β` must be read as `∂^{β + e_i}` although `multiIndexTuple` lists the directions in
increasing index order. ★, ~40 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "multiIndexDirections_multiIndexCount_perm"]

[[node]]
id = "memSobolevMultiIndex_succ_iff"
kind = "theorem"
desc = '''The inductive definition of `W^{m,p}(Ω)` agrees with the multi-index one
([brezis2011functional] §9.1, "The spaces `W^{m,p}(Ω)`", the two displayed definitions): for
`1 ≤ p`, `MemSobolevMultiIndex b f (m + 1) p Ω μ ↔ MemSobolevMultiIndex b f m p Ω μ ∧ ∀ i,
∃ g, HasWeakIteratedLineDerivOn ![b i] f g Ω μ ∧ MemSobolevMultiIndex b g m p Ω μ` — `f` and all
its first weak partial derivatives lie in `W^{m,p}`. Both directions are
`HasWeakIteratedLineDerivOn.cons` / `.of_cons` (`WeakDeriv.lean`) plus
`HasWeakIteratedLineDerivOn.comp_perm` to move the direction `b i` to the front of the sorted
tuple `multiIndexTuple b α`, and the uniqueness `HasWeakIteratedLineDerivOn.ae_eq` to identify the
weak derivatives produced along the two routes. ★★, ~150 lines.'''
deps = ["MemSobolevMultiIndex", "HasWeakIteratedLineDerivOn.cons", "HasWeakIteratedLineDerivOn.of_cons", "HasWeakIteratedLineDerivOn.comp_perm", "HasWeakIteratedLineDerivOn.ae_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.1, the spaces W^{m,p}"

[[node]]
id = "SobolevMultiIndex.instIsReflexive"
kind = "theorem"
desc = '''**`W^{k,p}(Ω)` is reflexive for `1 < p < ∞`** ([brezis2011functional] Proposition 9.1,
and Proposition 8.1 for the proof): the ambient `SobolevMultiIndexTuple` is a finite `PiLp p`
product of the spaces `L^p(Ω)`, reflexive by chapter 4's `MeasureTheory.Lp.instIsReflexive`
(Theorem 4.10) and `NormedSpace.instIsReflexivePiLp`, and `SobolevMultiIndex` is a closed subspace of it
(`SobolevMultiIndex.isClosed`), so `NormedSpace.isReflexive_of_isClosed` applies. Stated as an
instance under `[Fact (1 < p)] [Fact (p ≠ ∞)]` (or the `Fact (1 ≤ p)` the group already carries
plus explicit hypotheses — choose what instance search accepts). At `p = 2` the instance
`NormedSpace.instIsReflexiveOfInnerProductSpace` already applies. ★★, ~60 lines.'''
deps = ["SobolevMultiIndex.isClosed", "NormedSpace.isReflexive_of_isClosed", "NormedSpace.instIsReflexivePiLp", "MeasureTheory.Lp.instIsReflexive"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.1"

[[node]]
id = "SobolevMultiIndex.instSecondCountableTopology"
kind = "theorem"
desc = '''**`W^{k,p}(Ω)` is separable for `1 ≤ p < ∞`** ([brezis2011functional] Proposition 9.1):
`L^p(Ω)` is second countable by Mathlib's `MeasureTheory.Lp.SecondCountableTopology`
(`Mathlib/MeasureTheory/Measure/SeparableMeasure.lean`; needs `[IsSeparable (μ.restrict Ω)]`,
automatic for a countably generated σ-algebra and an s-finite measure, and a separable `F`), a
finite `PiLp p` product of second countable spaces is second countable, and a subtype of a second
countable space is second countable. Instance under `[Fact (1 ≤ p)] [Fact (p ≠ ∞)]` and
`[SecondCountableTopology F]`, `[IsSeparable μ]`. ★, ~40 lines of instance plumbing.'''
deps = ["SobolevMultiIndex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.1"

