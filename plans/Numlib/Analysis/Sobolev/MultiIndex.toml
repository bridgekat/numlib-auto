# ---- Appended by the spine review (2026-09-17): the definitions that chapters 9a, 9b and 10 each
# planned under their own names (`Elliptic.single`, `Elliptic.derivL`, `SobolevEuclideanZero.fnL`,
# `SobolevEuclidean.gradNorm`/`gradInner`, `toLpₗ_self`), consolidated here in the lowest module.

[[node]]
id = "MultiIndexLE.single"
kind = "definition"
desc = '''`MultiIndexLE.single (i : ι) : MultiIndexLE ι 1`, the multi-index `e_i = Pi.single i 1` of
order one, naming the partial derivative `∂_i` (`weakDeriv u (MultiIndexLE.single i)` is the book's
`∂u/∂x_i`). With `single_injective`, `coe_single : (single i : ι → ℕ) = Pi.single i 1`, and the
enumeration `multiIndexLE_one_eq : (Finset.univ : Finset (MultiIndexLE ι 1)) = {0} ∪ image single univ`
(for `Fintype ι`), which is what turns a sum over the multi-indices of order at most one into
`u v + ∑ᵢ ∂ᵢu ∂ᵢv` (`Elliptic.laplaceForm_eq_innerSL`). Formerly planned as `Elliptic.single` in
`PDE/Elliptic/Dirichlet.toml` and as `MultiIndexLE.single` in chapter 10's draft; one definition, here.
★'''
deps = ["MultiIndexLE"]

[[node]]
id = "SobolevMultiIndex.weakDerivL"
kind = "definition"
desc = '''`SobolevMultiIndex.weakDerivL (α : MultiIndexLE ι k) : SobolevMultiIndex F b k p Ω μ →L[ℝ] Lp F p (μ.restrict Ω)`,
the `α`-th weak derivative `u ↦ ∂^α u` as a continuous linear map of norm at most one: the
coordinate projection `PiLp.proj p _ α` of the ambient `ℓ^p` product composed with the inclusion
of the submodule (`(SobolevMultiIndex F b k p Ω μ).subtypeL`). Companion lemmas
`weakDerivL_apply : weakDerivL α u = weakDeriv u α` (`rfl`) and
`norm_weakDerivL_apply_le : ‖weakDeriv u α‖ ≤ ‖u‖` (from the `ℓ^p` product norm,
`PiLp.norm_apply_le`). `SobolevMultiIndex.fnL := weakDerivL 0` is the function itself as a map into
`L^p(Ω)` (`fnL_apply : ⇑(fnL u) = fn u`), injective by `SobolevMultiIndex.ext_of_fn_ae_eq`
(`fnL_injective`); it is the `q = p` case of `Cutoff.lean`'s `SobolevMultiIndex.toLpₗ` (which
takes the membership in `L^q` as a hypothesis) and the map `Numlib/Analysis/Normed/Operator/Embedding`'s
`IsContinuousEmbedding`/`IsCompactEmbedding` are stated along. The one-dimensional twin is
`SobolevInterval.derivL` / `SobolevIntervalLp.derivL`. Formerly `Elliptic.derivL Ω k p α`
(chapter 9b, prototyped in `notes/brezis/ch09b/proto/EllipticForm.lean`, whose shape this keeps)
and `SobolevEuclideanZero.fnL`'s underlying map (chapter 10); every chapter-9b/10 use is
`weakDerivL` on the abbrev `SobolevEuclidean`. ★'''
deps = ["SobolevMultiIndex", "SobolevMultiIndex.weakDeriv", "SobolevMultiIndex.ext_of_fn_ae_eq"]

[[node]]
id = "SobolevMultiIndexZero.fnL"
kind = "definition"
desc = '''`SobolevMultiIndexZero.fnL : SobolevMultiIndexZero F b k p Ω μ →L[ℝ] Lp F p (μ.restrict Ω)`,
the embedding `W_0^{k,p}(Ω) ↪ L^p(Ω)`: `(SobolevMultiIndex.fnL).comp (SobolevMultiIndexZero F b k p Ω μ).subtypeL`
(shape checked in `notes/brezis/ch10/proto/heat.lean` as `fnL₀`, there on `SobolevEuclideanZero N 1 2 Ω`).
`fnL_apply : ⇑(fnL v) = fn v`, `norm_fnL_le : ‖fnL v‖ ≤ ‖v‖`, `fnL_injective`. An `L^p` function
"lies in `W_0^{k,p}(Ω)`" when it is in `range fnL`, and the lift is unique — this is how every
boundary condition `u = 0` on `Γ` of chapter 10 (`Numlib/Analysis/PDE/DirichletLaplacian`,
`Heat`, `Wave`) is read, and how `Zero.lean`'s Gelfand triple `H_0^1 ⊂ L^2 ⊂ H^{-1}` starts.
Formerly `SobolevEuclideanZero.fnL` (chapter 10). ★'''
deps = ["SobolevMultiIndexZero", "SobolevMultiIndex.weakDerivL"]

[[node]]
id = "SobolevMultiIndex.gradNorm"
kind = "definition"
desc = '''The gradient norm `‖∇u‖_{L^p(Ω)}` on `W^{1,p}(Ω)`, in the book's `ℓ^p` reading, for a basis
`b : Basis ι ℝ E` with `Fintype ι`:
`SobolevMultiIndex.gradNorm (u : SobolevMultiIndex F b 1 p Ω μ) : ℝ := (∑ i, ‖weakDeriv u (MultiIndexLE.single i)‖ ^ p.toReal) ^ (1 / p.toReal)`
(`⨆ i, ‖weakDeriv u (single i)‖` at `p = ∞`), a seminorm on the type with
`gradNorm_le_norm : gradNorm u ≤ ‖u‖` (the type's norm is the same sum with the `α = 0` term
added, `SobolevMultiIndex.norm_eq_sum` and `multiIndexLE_one_eq`) and
`norm_eq_gradNorm : ‖u‖ = (‖fn u‖_p ^ p + gradNorm u ^ p) ^ (1/p)` (an equality; `max` at
`p = ∞`). At `p = 2`, `gradNorm u ^ 2 = ∑ i, ‖∂ᵢu‖²`, which is `Elliptic.dirichletForm Ω u u`
(`Numlib/Analysis/PDE/Elliptic/Dirichlet`, `dirichletForm_self_eq_gradNorm_sq`); the bilinear
form `∑ i, ∫ ∂ᵢu ∂ᵢv` of [brezis2011functional] Corollary 9.19's last sentence is that
`SesqForm` and gets no separate function here (chapter 9a's `SobolevEuclidean.gradInner` and
chapter 10's `SobolevMultiIndex.gradInner` are retired in its favour). A
`NormedAddCommGroup`/`InnerProductSpace` instance on a type synonym is *not* introduced; the
coercivity of the Dirichlet form on `W_0^{1,p}` is `SobolevEuclideanZero.norm_le_gradNorm`
(`Poincare.lean`). Formerly `SobolevEuclidean.gradNorm` in `Poincare.toml`; moved here because
`Friedrichs`, `Embedding`, `Zero` and the elliptic layer all use it and none should import
`Poincare` for a definition. ★, ~100 lines with the lemmas.'''
deps = ["SobolevMultiIndex", "MultiIndexLE.single", "SobolevMultiIndex.norm_eq_sum", "SobolevMultiIndex.norm_eq_ciSup", "SobolevMultiIndex.inner_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.19"
