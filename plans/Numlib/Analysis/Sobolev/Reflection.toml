[[node]]
id = "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_upperHalfSpace"
kind = "theorem"
desc = '''**Corollary 9.8 on the half space**: for `1 ≤ p < ∞`, every `u : SobolevEuclidean (d+1) 1 p (upperHalfSpace_opens d)`
is the limit in `W^{1,p}(ℝ^N_+)` of restrictions of `C_c^∞(ℝ^N)` functions —
`SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_hasSobolevExtensionOn`
(`Cutoff.lean`) applied to the reflection extension `IsSobolevExtensionDomain.upperHalfSpace`.
This is the density that Lemma 9.6 of the regularity theory (`PDE/Elliptic/Regularity`,
`eLpNorm_diffQuot_le_of_tangential`) uses to pass from `C_c^1(ℝ^N)` to `H^1(ℝ^N_+)` with the
constant `1`; stated here so that the half-space case of Theorem 9.25 needs neither Theorem 9.7
nor the general Corollary 9.8. ★, ~20 lines.'''
