desc = '''
Extension by reflection: Brezis, *Functional Analysis, Sobolev Spaces and Partial Differential
Equations*, Lemma 9.2 — the even reflection `u^⋆` of `u ∈ W^{1,p}(Q_+)` across `x_N = 0` lies in
`W^{1,p}(Q)` with `‖u^⋆‖ ≤ 2 ‖u‖`, its tangential derivatives are the even reflections of those
of `u` and its normal derivative is the odd reflection — and with it the extension operator for
the half space, the case "`Ω = ℝ^N_+`" of Theorem 9.7. Also here: Lemma 9.9 of the Comments
(the trace inequality on the half space for `C_c^1` functions), which is the same
integrate-in-`x_N` computation and the first move towards a trace operator. Imports
`Cutoff.lean` and `Chart.lean`.

Generality. The book proves the lemma on `Q_+`, remarks that "the conclusion remains valid if
`Q_+` is replaced by `ℝ^N_+` (the proof is unchanged)", and in Remark 9 reflects a square across
each of its sides. All of these are one statement: `E` a finite-dimensional real inner product
space, `v` a unit vector, `σ = Submodule.reflection (ℝ ∙ v)ᗮ` the reflection across the
hyperplane `v^⊥` (Mathlib, `Mathlib/Analysis/InnerProductSpace/Projection/Reflection.lean`, with
`reflection_orthogonalComplement_singleton_eq_neg` and `LinearIsometryEquiv.measurePreserving`),
`V` an open set with `σ '' V = V`, and `V_+ = V ∩ {0 < ⟪x, v⟫}`. The proof in the book uses no
coordinates but `x_N = ⟪x, v⟫`, and `η_k(⟪x, v⟫) ψ` is a test function on `V_+` for every test
function `ψ` on `V`. The tensor form `HasWeakFDerivOn` is used so that the tangential and normal
cases are one formula, `(w ∘ σ) ∘ σ` — the chain rule for the linear isometry `σ` — on the
reflected half, which the book writes as `(∂_i u)^⋆` for `i < N` and `(∂_N u)^□`.

Consumers: `Extension.lean` (the `Q_+ → Q` step with `v = e_N`, and the half-space case),
Remark 9 (the square). About 1100 lines.
'''

[[node]]
id = "evenReflection"
kind = "definition"
desc = '''`evenReflection v u : E → F`, the extension by even reflection across the hyperplane
`v^⊥`: `evenReflection v u x = u x` if `0 ≤ ⟪x, v⟫` and `u (σ x)` otherwise, where
`σ = Submodule.reflection (ℝ ∙ v)ᗮ`. This is `u^⋆` of [brezis2011functional] §9.2, Lemma 9.2
(with `v = e_N`); the value on the hyperplane itself is irrelevant (a null set). Companion
`oddReflection v w x = w x` if `0 ≤ ⟪x, v⟫` and `−w (σ x)` otherwise, the book's `f^□`; and
`reflectFDeriv v w x = w x` if `0 ≤ ⟪x, v⟫` and `(w (σ x)).comp σ` otherwise, the tensor
gradient of `u^⋆`, which evaluates to `evenReflection v (w · y)` for `y ⊥ v` and to
`oddReflection v (w · v)` along `v`. With the elementary facts: `σ` is an involutive linear
isometry, measure preserving, mapping `{0 < ⟪·, v⟫}` onto `{⟪·, v⟫ < 0}`
(`Submodule.reflection_apply`, `reflection_orthogonalComplement_singleton_eq_neg`), and
`eLpNorm (evenReflection v u) p (μ.restrict V) ^ p = 2 * eLpNorm u p (μ.restrict V_+) ^ p` when
`σ '' V = V` and the hyperplane is null (`measure_preimage_of_isometry`). ★, ~120 lines for the
three definitions and their norm identities.'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.2"

[[node]]
id = "HasWeakFDerivOn.evenReflection"
kind = "theorem"
desc = '''**Lemma 9.2 (extension by reflection), the identity**: let `‖v‖ = 1`, `V` open with
`σ '' V = V`, `V_+ := V ∩ {x | 0 < ⟪x, v⟫}` (an `Opens`). If `HasWeakFDerivOn u w V_+ μ` with
`u, w ∈ L^p(V_+)`, `1 ≤ p ≤ ∞`, then `HasWeakFDerivOn (evenReflection v u) (reflectFDeriv v w) V μ`.
Proof, the book's ([brezis2011functional] §9.2, proof of Lemma 9.2, lines 10241–10330 of the
source): fix `η ∈ C^∞(ℝ)` with `η = 0` on `(−∞, 1/2]`, `η = 1` on `[1, ∞)`, and `η_k(t) = η(k t)`.
For a test function `φ` on `V` and a direction `y`, split `∫_V u^⋆ ∂_y φ = ∫_{V_+} u ∂_y ψ` with
`ψ = φ + φ ∘ σ` when `y ⊥ v` (case (7)) and `= ∫_{V_+} u ∂_v χ` with `χ = φ − φ ∘ σ` when `y = v`
(case (8)); general `y` is the sum of its two components, weak differentiation being linear in
the direction. `η_k(⟪·, v⟫) ψ` is a test function on `V_+`, so the defining identity holds for
it; `∂_y (η_k ψ) = η_k ∂_y ψ` for `y ⊥ v` and dominated convergence gives (11); for `y = v`,
`∂_v (η_k χ) = η_k ∂_v χ + k η'(k ⟪x,v⟫) χ`, and the extra term tends to `0` because
`χ = 0` on the hyperplane gives `|χ(x)| ≤ M |⟪x, v⟫|` (mean value theorem on the smooth `χ`),
so `|∫ u k η'(k⟪x,v⟫) χ| ≤ M C ∫_{0 < ⟪x,v⟫ < 1/k} |u| → 0` (`u ∈ L^1_loc`, the strips shrink to a
null set: `tendsto_measure_iInter` or dominated convergence). Finally `∫_{V_+} (∂_y u) ψ` and
`∫_{V_+} (∂_v u) χ` fold back to integrals over `V` of `reflectFDeriv v w` against `φ` by the
measure-preserving `σ`. ★★★, 450–550 lines.'''
deps = ["evenReflection", "HasWeakFDerivOn", "HasWeakFDerivOn.integral_smul_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.2"

[[node]]
id = "MemSobolev.evenReflection"
kind = "theorem"
desc = '''**Lemma 9.2, membership and norms**: under the hypotheses of `HasWeakFDerivOn.evenReflection`,
`MemSobolev (evenReflection v u) 1 p V μ`, with `eLpNorm (evenReflection v u) p (μ.restrict V) ≤ 2 * eLpNorm u p (μ.restrict V_+)`
(in fact `= 2^{1/p} ·`) and `eLpNorm (reflectFDeriv v w) p (μ.restrict V) ≤ 2 * eLpNorm w p (μ.restrict V_+)`
(`σ` an isometry, so `‖(w (σ x)).comp σ‖ = ‖w (σ x)‖`), hence
`sobolevNorm (evenReflection v u) 1 p V μ ≤ 2 * sobolevNorm u 1 p V_+ μ`: the book's
`‖u^⋆‖_{L^p(Q)} ≤ 2 ‖u‖_{L^p(Q_+)}`, `‖u^⋆‖_{W^{1,p}(Q)} ≤ 2 ‖u‖_{W^{1,p}(Q_+)}`. ★★, ~120 lines.'''
deps = ["HasWeakFDerivOn.evenReflection", "MemSobolev", "evenReflection"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.2"

[[node]]
id = "SobolevEuclidean.evenReflectionL"
kind = "definition"
desc = '''Lemma 9.2 as a bounded linear map on the typed spaces, for `E = EuclideanSpace ℝ (Fin N)`,
`‖v‖ = 1`, `V : Opens E` with `σ '' V = V`, `1 ≤ p`:
`SobolevEuclidean.evenReflectionL v hV : SobolevEuclidean N 1 p V_+ →L[ℝ] SobolevEuclidean N 1 p V`,
with `evenReflectionL_fn : fn (evenReflectionL v hV u) =ᵐ[volume.restrict V] evenReflection v (fn u)`,
`evenReflectionL_fn_ae_eq_on : fn (evenReflectionL v hV u) =ᵐ[volume.restrict V_+] fn u`,
`eLpNorm (fn (evenReflectionL v hV u)) p (volume.restrict V) ≤ 2 * eLpNorm (fn u) p (volume.restrict V_+)`
and `‖evenReflectionL v hV u‖ ≤ 2 * ‖u‖` (the exact factor is `2^{1/p}`; each multi-index
component's `p`-th power doubles). Built from `MemSobolev.evenReflection` through
`memSobolev_iff_memSobolevMultiIndex`, `MemSobolevMultiIndex.exists_sobolevMultiIndex`; linear a.e.,
hence linear by `SobolevMultiIndex.ext_of_fn_ae_eq`. Instances: `V = unitChartCube d` with
`v = e_N` (`reflectLast_image_unitChartCube : σ '' Q = Q`, `unitChartCubePos = Q ∩ {0 < x_N}`)
— the step `v_i ↦ v_i^⋆` of the proof of Theorem 9.7 — and `V = ⊤` below. ★★, ~150 lines.'''
deps = ["MemSobolev.evenReflection", "SobolevEuclidean", "memSobolev_iff_memSobolevMultiIndex", "MemSobolevMultiIndex.exists_sobolevMultiIndex", "SobolevMultiIndex.ext_of_fn_ae_eq", "unitChartCubePos"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.2"

[[node]]
id = "SobolevEuclidean.exists_extensionL_upperHalfSpace"
kind = "theorem"
desc = '''**Theorem 9.7 for the half space** ([brezis2011functional] §9.2, "This establishes Theorem
9.7 for `Ω = ℝ^N_+`"): for `1 ≤ p ≤ ∞` there is `P : SobolevEuclidean (d+1) 1 p (upperHalfSpace d) →L[ℝ] SobolevEuclidean (d+1) 1 p ⊤`
with `fn (P u) =ᵐ[volume.restrict (upperHalfSpace d)] fn u`,
`eLpNorm (fn (P u)) p volume ≤ 2 * eLpNorm (fn u) p (volume.restrict (upperHalfSpace d))` and
`‖P u‖ ≤ 2 * ‖u‖` — namely `SobolevEuclidean.evenReflectionL e_N` with `V = ⊤`. Same
existential shape as `SobolevEuclidean.exists_extensionL` (`Extension.lean`), so that the two
cases of Theorem 9.7 are consumed uniformly; bundled as the predicate instance
`IsSobolevExtensionDomain.upperHalfSpace` below. ★, ~30 lines.'''
deps = ["SobolevEuclidean.evenReflectionL", "EuclideanSpace.upperHalfSpace"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.7 (the case Ω = ℝ^N_+)"

