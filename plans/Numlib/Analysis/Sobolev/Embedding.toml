desc = '''
The Sobolev inequalities on the whole space: Brezis, *Functional Analysis, Sobolev Spaces and
Partial Differential Equations*, §9.3.A — Theorem 9.9 (Sobolev–Gagliardo–Nirenberg,
`1 ≤ p < N`), Corollary 9.10, Corollary 9.11 (`p = N`), Theorem 9.12 (Morrey, `p > N`) with
Remarks 11–12, Corollary 9.13 (`W^{m,p}(ℝ^N)`), Remark 13 (`W^{N,1} ⊆ L^∞`) and Lemma 9.4.
Imports `Friedrichs.lean`, `Cutoff.lean`, Mathlib's `Analysis/FunctionalSpaces/SobolevInequality.lean`
and chapter 4's `Numlib/MeasureTheory/Function/LpInterpolation.lean` (the `L^p` interpolation
inequality `MeasureTheory.eLpNorm_le_eLpNorm_rpow_mul_eLpNorm_rpow`, Remark 2 of chapter 4, which
Corollary 9.10, Corollary 9.11 and Rellich–Kondrachov use).
The domain case (Corollaries 9.14–9.15, Remarks 15–16) is `EmbeddingDomain.lean`.

What Mathlib has. `MeasureTheory.eLpNorm_le_eLpNorm_fderiv_of_eq` is Theorem 9.9 for compactly
supported `C^1` functions, with the constant `SNormLESNormFDerivOfEqConst`; the whole of the
book's proof of Theorem 9.9 up to "To complete the proof let `u ∈ W^{1,p}(ℝ^N)`" is there, in a
different arrangement (the grid-lines induction), and `lintegral_prod_lintegral_pow_le` is
Lemma 9.4 in the special case the proof needs — the `f_i` being the grid-line integrals of one
function. The general Lemma 9.4, with independent `f_i ∈ L^{N−1}(ℝ^{N−1})`, is not in Mathlib
and is planned as a stand-alone node with no consumer. Mathlib has *nothing* for `p ≥ N`:
Corollary 9.11 and Morrey's theorem are new, and Rademacher's theorem
(`Mathlib/Analysis/Calculus/Rademacher.lean`) mentions Morrey only as the author of its proof
strategy.

Design. Each inequality is stated first at the predicate level, for `HasWeakFDerivOn f w ⊤ μ`
on a finite-dimensional real normed `E` with Haar measure `μ` (the setting of Mathlib's GNS),
by density (`MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm`) and Fatou
(`MeasureTheory.Lp.eLpNorm_le_of_ae_tendsto`, with the a.e.-convergent subsequence of
`TendstoInMeasure.exists_seq_tendsto_ae`); then on the typed `SobolevEuclidean N 1 p ⊤` as an
`IsContinuousEmbedding (toLpₗ h)` (`Cutoff.lean`), the vocabulary Atkinson–Han's Definition
7.3.6 uses. Constants are Mathlib's where Mathlib supplies the inequality and explicit where the
proof is new; footnote 9's `C(p, N) = (N − 1)p/(N − p)` would require re-proving Mathlib's GNS and
is not carried (it is a footnote, not the theorem's statement — decision D10 does not apply).

Morrey's theorem is the expensive item: the cube-average argument of the book, then the
uniform-Cauchy passage from `C_c^1` to `W^{1,p}`, which produces the continuous representative
of Remark 11 and the decay of Remark 12 at once. Corollary 9.13's `C^k` clause rests on Remark
2's converse (`Friedrichs.lean`): a function whose weak gradient has a continuous representative
has a `C^1` representative. About 3200 lines, of which Morrey ~800 and Corollaries 9.11 and 9.13
~500 each.
'''

[[node]]
id = "MeasureTheory.lintegral_prod_comp_succAbove_le"
kind = "theorem"
desc = '''**Lemma 9.4 (Gagliardo's lemma), general form**: for `N ≥ 2` and measurable
`f : Fin N → ((Fin (N−1) → ℝ) → ℝ≥0∞)` — written with `n + 2 = N`, `f i : (Fin (n+1) → ℝ) → ℝ≥0∞` —
`∫⁻ x, ∏ i, f i (x ∘ i.succAbove) ≤ ∏ i, (∫⁻ y, f i y ^ (N − 1)) ^ (1 / (N − 1))`
(`x ∘ Fin.succAbove i` is the book's `x̃_i`, `x` with the `i`-th coordinate omitted): the
product of `N` functions each independent of one coordinate is in `L^1(ℝ^N)` with
`‖f‖_1 ≤ ∏ ‖f_i‖_{L^{N−1}(ℝ^{N−1})}`. Mathlib's `MeasureTheory.lintegral_prod_lintegral_pow_le`
(`SobolevInequality.lean`) is the special case `f i (x̃_i) = (∫⁻ t, F (update x i t))^{1/(N−1)}`
for a single `F`, which is all Theorem 9.9 needs; the general statement follows the book's
induction on `N` ([brezis2011functional] §9.3, proof of Lemma 9.4): fix `x_{N+1}`, Hölder with
exponents `N` and `N' = N/(N−1)` against `f_{N+1}`, the induction hypothesis on the `|f_i|^{N'}`,
then integrate in `x_{N+1}` using that `x_{N+1} ↦ ‖f_i(·, x_{N+1})‖_{L^N}` is in `L^N(ℝ)` and the
generalized Hölder inequality for `N` factors (`ENNReal.lintegral_prod_norm_pow_le`). The
`Fin.succAbove`/`Fin.insertNth` bookkeeping of the induction is the cost. ★★★, ~350 lines; no
consumer, low priority — a faithful node for the book's Lemma 9.4 only.'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.4"

[[node]]
id = "HasWeakFDerivOn.eLpNorm_le_eLpNorm_weakFDeriv_of_eq"
kind = "theorem"
desc = '''**Theorem 9.9 (Sobolev–Gagliardo–Nirenberg) on `W^{1,p}(ℝ^N)`**: `E` finite-dimensional
real normed with `finrank ℝ E = N`, `μ` an additive Haar measure, `p p' : ℝ≥0` with `1 ≤ p < N`
and `1/p' = 1/p − 1/N`; if `HasWeakFDerivOn f w ⊤ μ` with `MemLp f p μ` and `MemLp w p μ`, then
`MemLp f p' μ` and `eLpNorm f p' μ ≤ SNormLESNormFDerivOfEqConst ℝ μ p * eLpNorm w p μ` —
the book's `‖u‖_{p*} ≤ C ‖∇u‖_p` with Mathlib's constant. (Mathlib's `eLpNorm_le_eLpNorm_fderiv_of_le`
is the same inequality for compactly supported `C^1` functions with `q ≤ p*` and a bounded
support, i.e. a Poincaré-type bound; it is what `Poincare.lean` notes as the alternative route to
Corollary 9.19 for `p < N`.) Proof
([brezis2011functional] §9.3, end of the proof of Theorem 9.9): take `u_n ∈ C_c^∞(ℝ^N)` with
`u_n → f`, `∇u_n → w` in `L^p` (`MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm` at
order `1`, the `sobolevNorm` there dominating both), apply Mathlib's
`MeasureTheory.eLpNorm_le_eLpNorm_fderiv_of_eq` to each `u_n`, extract an a.e. convergent
subsequence (`tendstoInMeasure_of_tendsto_eLpNorm`, `TendstoInMeasure.exists_seq_tendsto_ae`),
and conclude by Fatou in the form `MeasureTheory.Lp.eLpNorm_le_of_ae_tendsto` with the bound
`C (‖w‖_p + δ)` valid eventually, for every `δ > 0`. ★★, ~200 lines. Footnote 10's alternative
(`u_n` Cauchy in `L^{p*}`) is not needed.'''
deps = ["HasWeakFDerivOn", "MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm", "MemSobolev"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.9"

