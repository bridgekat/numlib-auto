[[node]]
id = "abs_sub_le_mul_rpow_eLpNorm_fderiv_of_contDiff"
kind = "theorem"
desc = '''**Morrey's estimate for a `C^1` compactly supported function** (the analytic core of
Theorem 9.12): for `N < p < ∞` (or `p = ∞`), `u : EuclideanSpace ℝ (Fin N) → ℝ` of class `C^1`
with compact support, and all `x y`,
`|u x − u y| ≤ C(p, N) * ‖x − y‖ ^ (1 − N/p) * (eLpNorm (fderiv ℝ u) p volume).toReal`, with
`C(p, N) = 2 · 2^{1−N/p} / (1 − N/p)`, and `|u x| ≤ C'(p, N) * (‖u‖_{W^{1,p}})`. Proof
([brezis2011functional] §9.3, proof of Theorem 9.12, lines 10561–10628 of the source): on a
cube `Q` of side `r` with sides parallel to the axes, for `x ∈ Q` and the mean `ū`,
`|ū − u(x)| ≤ r^{1−N/p}/(1−N/p) ‖∇u‖_{L^p(Q)}` — from `u(x) − u(x₀) = ∫_0^1 ∇u(x₀ + t(x − x₀))·(x − x₀) dt`,
integrated over `Q`, the substitution `y = x₀ + t(x − x₀)` (`MeasureTheory.Measure.addHaar_smul`
/ `integral_comp_smul` with the Jacobian `t^{−N}`), Hölder on the dilated cube `t Q ⊆ Q`
(`|tQ| = t^N |Q|`) and `∫_0^1 t^{N/p' − N} dt = 1/(1 − N/p)`; two points `x, y` lie in a cube of
side `2‖x − y‖` (centred at their midpoint), whence (25); and (24) from a unit cube containing `x`
with `|ū| ≤ ‖u‖_{L^p(Q)}`. Cubes are `{z | ∀ i, |z i − c i| < r/2}`, product sets under
`EuclideanSpace.volume_preserving_measurableEquiv`. ★★★, ~400 lines.'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.12, proof"

[[node]]
id = "HasWeakFDerivOn.exists_continuous_holderWith_ae_eq"
kind = "theorem"
desc = '''**Theorem 9.12 (Morrey) with Remarks 11 and 12**: for `N < p ≤ ∞`, `HasWeakFDerivOn f w ⊤ volume`
on `EuclideanSpace ℝ (Fin N)` with `MemLp f p`, `MemLp w p`, there is `ũ : E → ℝ` with
`Continuous ũ`, `f =ᵐ[volume] ũ` (Remark 11: the continuous representative),
`HolderWith (C(p,N) * ‖w‖_p) (1 − N/p) ũ` (the inequality (25),
`|u(x) − u(y)| ≤ C |x − y|^α ‖∇u‖_p`, for the representative and hence for a.e. `x, y`),
`‖ũ x‖ ≤ C'(p,N) * (‖f‖_p + ‖w‖_p)` for all `x` (the inequality (24), `W^{1,p} ⊂ L^∞` with
continuous injection), and, for `p < ∞`, `Tendsto ũ (cocompact E) (𝓝 0)` (Remark 12). Proof:
the `C_c^1` approximants `u_n` of Theorem 9.2 (whole space) satisfy (24) for their differences,
so they are uniformly Cauchy; their uniform limit `ũ` is continuous, satisfies (25) and (24) in
the limit, equals `f` a.e. (both are the `L^p` limit of `u_n`), and is the uniform limit of
compactly supported functions, hence tends to `0` at infinity. This is the book's "standard
density argument" made explicit. ★★★, ~400 lines on top of the `C^1` estimate. The typed
version `SobolevEuclidean.toContinuousMapL : SobolevEuclidean N 1 p ⊤ →L[ℝ] (E →ᵇ ℝ)` with
`‖toContinuousMapL u‖ ≤ C' ‖u‖` and `coe_toContinuousMapL_ae_eq` (★★, ~150 lines) is the form
Corollary 9.14's `C(Ω̄)` clause and Theorem 9.16's Arzelà–Ascoli case consume (the pattern is
`SobolevInterval.toContinuousMap` of `Interval.lean`).'''
