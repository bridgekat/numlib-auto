[[node]]
id = "SobolevEuclidean.isContinuousEmbedding_toLp_of_eq_finrank"
kind = "theorem"
desc = '''**Corollary 9.11 (the limiting case `p = N`)**: for `N ≥ 2` and every `q ∈ [N, ∞)`, every
`u : SobolevEuclidean N 1 N ⊤` has `MemLp (fn u) q volume` with
`eLpNorm (fn u) q volume ≤ C(q, N) * ‖u‖`, and `IsContinuousEmbedding (toLpₗ …)`:
"`W^{1,N}(ℝ^N) ⊂ L^q(ℝ^N)` for all `q ∈ [N, +∞)`" ([brezis2011functional] Corollary 9.11), the
constant blowing up as `q → ∞` (footnote 11). Proof, the book's, for `u ∈ C_c^1(ℝ^N)` first:
Mathlib's `p = 1` inequality `MeasureTheory.eLpNorm_le_eLpNorm_fderiv_one`
(`‖v‖_{N/(N−1)} ≤ C ‖∇v‖_1`) applied to `v = |u|^{m−1} u`, which is `C^1` with
`∇v = m |u|^{m−1} ∇u` for real `m ≥ 1` (calculus of `t ↦ |t|^{m−1} t`;
`Numlib/Analysis/InnerProductSpace/NormPow.lean` has the derivative of `‖x‖^s`), then Hölder
`‖ |u|^{m−1} ∇u ‖_1 ≤ ‖u‖_{(m−1)N'}^{m−1} ‖∇u‖_N` gives (20)
`‖u‖_{mN/(N−1)}^m ≤ C m ‖u‖_{(m−1)N/(N−1)}^{m−1} ‖∇u‖_N`, Young's inequality turns it into (21)
`‖u‖_{mN/(N−1)} ≤ C (‖u‖_{(m−1)N/(N−1)} + ‖∇u‖_N)`, and the induction `m = N, N+1, …` together
with the interpolation inequality between consecutive exponents covers every `q ≥ N`; finally
density (Theorem 9.2, whole space) and Fatou as in Theorem 9.9. ★★★, ~500 lines. Not
derivable from `eLpNorm_le_eLpNorm_fderiv_of_le`, which requires `p < N` strictly.'''
