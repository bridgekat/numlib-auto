[[node]]
id = "SobolevEuclidean.memLp_fn_of_order"
kind = "theorem"
desc = '''**Corollary 9.13, the `L^q` clauses**: for `m ≥ 1`, `1 ≤ p < ∞` and
`u : SobolevEuclidean N m p ⊤`: if `1/p − m/N > 0` then `MemLp (fn u) q volume` for
`1/q = 1/p − m/N` with `‖fn u‖_q ≤ C ‖u‖`; if `1/p − m/N = 0` then for every `q ∈ [p, ∞)`;
if `1/p − m/N < 0` then `MemLp (fn u) ∞ volume` (`W^{m,p} ⊂ L^∞`); all with continuous
injections (`IsContinuousEmbedding (toLpₗ …)`). Proof: "repeated applications of Theorem 9.9,
Corollary 9.11 and Theorem 9.12" — induction on `m` using `memSobolevMultiIndex_succ_iff`
(`u ∈ W^{m+1,p}` iff `u, ∂_i u ∈ W^{m,p}`): `u ∈ W^{m,p}` gives `u, ∂_i u ∈ W^{m−1,p}`, hence in
`L^{q_1}` with `1/q_1 = 1/p − (m−1)/N` by induction, hence `u ∈ W^{1,q_1}(ℝ^N)`, and Theorem 9.9
/ Corollary 9.11 / Theorem 9.12 finish according to the sign of `1/q_1 − 1/N`. The bookkeeping
of exponents in `ℝ≥0∞` and of the derivative components across orders is the cost. ★★★, ~400
lines for the three clauses.'''
