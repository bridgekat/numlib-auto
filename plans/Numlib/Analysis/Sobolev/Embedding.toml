[[node]]
id = "MemSobolevMultiIndexLoc.exists_contDiffOn"
kind = "theorem"
desc = '''A function in `H^m_loc(Ω)` for every `m` has a `C^∞` representative on `Ω`:
`(∀ m, MemSobolevMultiIndexLoc b u m 2 Ω volume) → ∃ ũ, ContDiffOn ℝ ⊤ ũ Ω ∧ u =ᵐ[volume.restrict Ω] ũ`;
and the finite-order form `MemSobolevMultiIndexLoc.exists_contDiffOn_of_lt`: for `m - N/2 > k`,
`u ∈ H^m_loc(Ω)` has a `C^k` representative on `Ω`. Proof: on a ball `B` with `closure B ⊆ Ω`,
`θ u ∈ H^m(ℝ^N)` for a cut-off `θ = 1` on `B` (`MemSobolevMultiIndexLoc.smul_testFunction`, `Cutoff.lean`), and
`H^m(ℝ^N) ⊆ C^k` for `m - N/2 > k` by Corollary 9.13 of chapter 9a (`Embedding`); the local
representatives agree on overlaps because two continuous functions equal almost everywhere on an
open set are equal there, so they glue to one function, and `ContDiffOn` is local. This is the
