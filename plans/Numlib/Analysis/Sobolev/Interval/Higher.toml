[[node]]
id = "SobolevIntervalLp.eLpNorm_deriv_le_mul_add"
kind = "theorem"
desc = '''**The interpolation inequality of the `W^{m,p}` paragraph** (the book cites Adams and, for
`|I| < ∞`, Exercise 8.6): for `(hI : OrdConnected)`, `1 ≤ p ≤ ∞`, `1 ≤ j < m`, every `ε > 0`, there
is `C = C(ε, m, p, |I|)` with `‖deriv u ⟨j, _⟩‖ ≤ ε * ‖deriv u ⟨m, _⟩‖ + C * ‖deriv u 0‖` for all
`u : SobolevIntervalLp m p I`. Direct route (no compactness): first `j = 1`, `m = 2`, on a
subinterval `J ⊆ I` of length `ℓ`: by the mean value theorem there is `ξ ∈ J` with
`|ũ'(ξ)| ≤ (2/ℓ) ‖ũ‖_{L^∞(J)}`, and `|ũ'(x)| ≤ |ũ'(ξ)| + ∫_J |u''|` for `x ∈ J`, so
`‖u'‖_{L^∞(J)} ≤ (2/ℓ) ‖ũ‖_{L^∞(J)} + ℓ^{1/p'} ‖u''‖_{L^p(J)}`; with `‖ũ‖_{L^∞(J)} ≤ ℓ^{-1/p} ‖u‖_{L^p(J)} + ℓ^{1/p'} ‖u'‖_{L^p(J)}`
(Theorem 8.8 (5) on `J`) this gives, after integrating the `p`-th power over `J` and absorbing
the `‖u'‖_{L^p(J)}` term for `ℓ` small, `‖u'‖_{L^p(J)}^p ≤ C ℓ^{p} ‖u''‖_{L^p(J)}^p + C ℓ^{-p} ‖u‖_{L^p(J)}^p`;
cover `I` by disjoint subintervals of length `ℓ` (one shorter piece, or the whole of `I` if
`|I| ≤ ℓ`, where the one-interval estimate suffices) and sum; choose `ℓ` from `ε`. General `j, m`
by induction (`D^j u ∈ W^{m−j,p}`), the book's "for every `j`". Corollary `norm_equiv_top`: the
norm `‖u‖_p + ‖D^m u‖_p` is equivalent to the `W^{m,p}` norm (`‖u‖ ≤ C (‖deriv u 0‖ + ‖deriv u (Fin.last m)‖)`).
★★★ (~500 lines, the bookkeeping of the covering is the bulk; the case `|I| < ∞`, `p > 1` alone
would follow from the compact embedding by Ehrling's lemma, the book's Exercise 8.6 route, once
chapter 6 has Exercise 6.12)

Blocked: not attempted in wave 2 for budget reasons (★★★, the covering bookkeeping). Available
now for the direct route: the window estimate with an `L^q` function part
(`SobolevIntervalLp.enorm_rep_le_of_Icc_subset'`), `SobolevIntervalLp.shift`, `derivOne`, and the
restriction `SobolevIntervalLp.restrict` of `Interval/Zero` to a subinterval.'''
deps = ["SobolevIntervalLp.deriv", "SobolevIntervalLp.rep", "SobolevIntervalLp.abs_rep_le_of_bounded"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}"

