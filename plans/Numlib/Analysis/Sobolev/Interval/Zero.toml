[[node]]
id = "mem_sobolevIntervalLpZero_higher_iff"
kind = "theorem"
desc = '''**Remark 18**: for `(hI : OrdConnected)`, `1 ≤ p < ∞`, `u : SobolevIntervalLp m p I`,
`u ∈ SobolevIntervalLpZero m p I ↔ ∀ j : Fin m, ∀ x ∈ frontier (I : Set ℝ), rep (of (deriv u j.castSucc)) x = 0`
— `u = Du = ⋯ = D^{m−1}u = 0` on `∂I`, each `D^j u` (`j < m`) read as an element of `W^{1,p}(I)`
through its representative. `→` as in Theorem 8.12 (evaluation of each `D^j u` is continuous on
`W^{m,p}`). `←`, bounded `I` first: `D^m u` has vanishing moments `∫_I D^m u · x^j = 0` for
`j < m` (integrate by parts `j` times using the boundary conditions, `integral_deriv_mul_add_mul_deriv`
iterated); approximate `D^m u` in `L^p` by a test function `ψ`, correct it to `ψ − ∑_{i<m} c_i ψ_i`
with `m` fixed test functions `ψ_i` whose moment matrix `(∫ ψ_i x^j)_{i,j}` is invertible (exists:
polynomials of degree `< m` are linearly independent on `I`, so the moment map from the test
functions onto `ℝ^m` is surjective — pick preimages of a basis), so that all `m` moments vanish;
its `m`-fold primitive from `a` is then a test function (each primitive of a zero-moment test
function is again compactly supported: `TestFunction.primitiveIic` iterated, the moments dropping
by one each time), and it approximates `u` in `W^{m,p}` by Poincaré applied `m` times. Unbounded
`I`: the cut-off `ζ_n u` reduces to the bounded case as in Theorem 8.12 (the cut-off preserves the
vanishing of the `D^j u` at finite endpoints — Leibniz). The book's route (Exercise 8.9, via
Hardy-type inequalities `u/x^m ∈ L^p`) is not followed. The distinction
`W_0^{2,p} ≠ W^{2,p} ∩ W_0^{1,p}` is the surface's `remark_8_18_ne`. ★★★ (~400 lines)

Blocked: not attempted in wave 2 for budget reasons (★★★). The forward direction is cheap with
`SobolevIntervalLp.derivOneCLM` composed with `SobolevIntervalLp.evalCLM'` (evaluation of `D^j u`
is continuous on `W^{m,p}`) and `TestFunction.toSobolevIntervalLp`-style uniqueness of the weak
derivatives; the converse needs the moment-corrected approximation described above. Now
available: `SobolevIntervalLp.eLpNorm_integral_le` (Poincaré, elementary form, in
`Interval/Higher`), `SobolevIntervalLp.shift`, `SobolevIntervalLp.cutoff` with
`tendsto_cutoff_smul`, and `SobolevIntervalLpZero.mem_of_rep_eq_zero_off_Ioo` (the restriction
argument) for the unbounded case.'''
deps = ["SobolevIntervalLpZero", "mem_sobolevIntervalLpZero_iff", "TestFunction.primitiveIic", "SobolevIntervalLpZero.eLpNorm_le_mul_eLpNorm_deriv", "SobolevIntervalLp.integral_deriv_mul_add_mul_deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 18"

