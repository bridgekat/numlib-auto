[[node]]
id = "SobolevIntervalLp.integral_abs_sub_average_le"
kind = "theorem"
desc = '''**Problem 47 C.1–C.2**: for `u : SobolevIntervalLp 1 1 (Opens.Ioo 0 1)`,
`∫ x in Ioo 0 1, |rep u x - ū| ≤ 2 * ∫ t in Ioo 0 1, |deriv u 1 t| * (t * (1 - t))` (C.1) and
hence `≤ (1/2) * ‖deriv u 1‖` (C.2, since `2 t (1 − t) ≤ 1/2`): `∫∫ |ũ(x) − ũ(y)| dx dy ≤ ∫∫ ∫_{[y,x]} |u'|`
and Fubini (`MeasureTheory.integral_integral_swap`) gives the weight `2 t (1 − t)` (the measure of
`{(x, y) : t ∈ [y, x] or [x, y]}`). Stated on `(0, 1)`; on `(a, b)` the weight is
`2 (t − a)(b − t)/(b − a)` and the constant `(b − a)/2`. ★★ (~150 lines)

Blocked: not attempted in wave 2 (the Fubini computation of the weight is the whole content; A.1
and A.4 are proved for every `p` in `SobolevIntervalLp.abs_rep_sub_average_le` and
`SobolevIntervalLpZero.abs_rep_le_half_eLpNorm_deriv`, and `SobolevIntervalLp.integrableOn_rep_Ioo`
gives the integrability of `ũ` on `(a, b)`). In `ℝ≥0∞`: `‖ũ x − ū‖ₑ ≤ ∫⁻ y, ‖ũ x − ũ y‖ₑ ≤
∫⁻ y, ∫⁻ t in Ι y x, ‖u' t‖ₑ` and `lintegral_lintegral_swap` twice.'''
deps = ["SobolevIntervalLp.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Problem 47"

