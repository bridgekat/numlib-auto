[[node]]
id = "mem_sobolevIntervalLpZero_iff_indicator_mem"
kind = "theorem"
desc = '''**Remark 16 (i)**: for `(hI : OrdConnected)`, `1 ≤ p < ∞` and `u : SobolevIntervalLp 1 p I`,
`u ∈ SobolevIntervalLpZero 1 p I ↔ MemSobolevIntervalLp ((I : Set ℝ).indicator (fn u)) 1 p ⊤` — the
zero extension `ū` lies in `W^{1,p}(ℝ)`. `→`: the zero extension of a test function on `I` is a
test function on `ℝ`, zero extension is an isometry `L^p(I) → L^p(ℝ)`, and the weak derivative is
closed under `L^p` limits (`hasWeakDerivOn_of_tendsto_eLpNorm` on `⊤`), so `ū ∈ W^{1,p}(ℝ)` with
`(ū)' = \overline{u'}` (`indicator_deriv`). `←`: `ū ∈ W^{1,p}(ℝ)` has a continuous representative
which vanishes a.e. off `I`, hence on the frontier of `I` (a boundary point is a limit of points
outside `I`), so `rep u = 0` on `frontier I` and Theorem 8.12 applies. ★★ (~200 lines)'''
deps = ["mem_sobolevIntervalLpZero_iff", "hasWeakDerivOn_of_tendsto_eLpNorm", "SobolevIntervalLp.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 16"

[[node]]
id = "mem_sobolevIntervalLpZero_higher_iff"
kind = "theorem"
desc = '''**Remark 18**: for `(hI : OrdConnected)`, `1 ≤ p < ∞`, `u : SobolevIntervalLp m p I`,
`u ∈ SobolevIntervalLpZero m p I ↔ ∀ j : Fin m, ∀ x ∈ frontier (I : Set ℝ), rep (of (deriv u j.castSucc)) x = 0`
— `u = Du = ⋯ = D^{m−1}u = 0` on `∂I`, each `D^j u` (`j < m`) read as an element of `W^{1,p}(I)`
through its representative. `→` as in Theorem 8.12 (evaluation of each `D^j u` is continuous on
`W^{m,p}`). `←`, bounded `I` first: `D^m u` has vanishing moments `∫_I D^m u · x^j = 0` for
`j < m` (integrate by parts `j` times using the boundary conditions, `integral_deriv_mul_add_mul_deriv`
iterated); approximate `D^m u` in `L^p` by a test function `ψ`, correct it to `ψ − ∑_{i<m} c_i ψ_i`
with `m` fixed test functions `ψ_i` whose moment matrix `(∫ ψ_i x^j)_{i,j}` is invertible (exists:
polynomials of degree `< m` are linearly independent on `I`, so the moment map from the test
functions onto `ℝ^m` is surjective — pick preimages of a basis), so that all `m` moments vanish;
its `m`-fold primitive from `a` is then a test function (each primitive of a zero-moment test
function is again compactly supported: `TestFunction.primitiveIic` iterated, the moments dropping
by one each time), and it approximates `u` in `W^{m,p}` by Poincaré applied `m` times. Unbounded
`I`: the cut-off `ζ_n u` reduces to the bounded case as in Theorem 8.12 (the cut-off preserves the
vanishing of the `D^j u` at finite endpoints — Leibniz). The book's route (Exercise 8.9, via
Hardy-type inequalities `u/x^m ∈ L^p`) is not followed. The distinction
`W_0^{2,p} ≠ W^{2,p} ∩ W_0^{1,p}` is the surface's `remark_8_18_ne`. ★★★ (~400 lines)'''
deps = ["SobolevIntervalLpZero", "mem_sobolevIntervalLpZero_iff", "TestFunction.primitiveIic", "SobolevIntervalLpZero.eLpNorm_le_mul_eLpNorm_deriv", "SobolevIntervalLp.integral_deriv_mul_add_mul_deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 18"

[[node]]
id = "SobolevIntervalLp.abs_rep_sub_average_le"
kind = "theorem"
desc = '''**Poincaré–Wirtinger, Problem 47 A.1 (Comments on Chapter 8, 1(i))**: for `a < b`,
`u : SobolevIntervalLp 1 1 (Opens.Ioo a b)` and `ū := ⨍ x in Ioo a b, fn u x` (the mean,
`MeasureTheory.average`), `∀ x ∈ Icc a b, |rep u x - ū| ≤ ‖deriv u 1‖` — `‖u − ū‖_∞ ≤ ‖u'‖_1`;
hence `eLpNorm (fn u - fun _ ↦ ū) ⊤ (volume.restrict (Ioo a b)) ≤ ‖deriv u 1‖ₑ`. Proof:
`ũ(x) − ū = ⨍ (ũ(x) − ũ(y)) dy` and `|ũ(x) − ũ(y)| = |∫_y^x u'| ≤ ‖u'‖_1` (`rep_sub_rep`), no
intermediate value theorem needed (the book's hint `ū = ũ(x₀)` is the alternative). For general
`p` via `W^{1,p}(a, b) ⊆ W^{1,1}(a, b)` (`inclusion` between exponents on a finite measure,
`MemLp.mono_exponent`) and Hölder: `‖u − ū‖_∞ ≤ (b − a)^{1/p'} ‖u'‖_p`. ★'''
deps = ["SobolevIntervalLp.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Problem 47"

[[node]]
id = "SobolevIntervalLpZero.abs_rep_le_half_eLpNorm_deriv"
kind = "theorem"
desc = '''**Problem 47 A.4**: for `a < b` and `u ∈ SobolevIntervalLpZero 1 1 (Opens.Ioo a b)`,
`∀ x ∈ Icc a b, |rep u x| ≤ (1/2) * ‖deriv u 1‖` — `‖u‖_∞ ≤ ½ ‖u'‖_1` on `W_0^{1,1}(I)`:
`|ũ(x)| ≤ ∫_a^x |u'|` and `|ũ(x)| ≤ ∫_x^b |u'|` (`rep_frontier_eq_zero` at both ends), and the
smaller of the two is at most half their sum. Also the general-`p` form on `W_0^{1,p}(a, b)`:
`|ũ(x)| ≤ ½ (b − a)^{1/p'} ‖u'‖_p`. ★'''
deps = ["SobolevIntervalLpZero.rep_frontier_eq_zero", "SobolevIntervalLp.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Problem 47"

