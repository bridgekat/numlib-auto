[[node]]
id = "SobolevIntervalLpZero.mem_of_hasCompactSupport"
kind = "theorem"
desc = '''**Remark 14 (ii)**: if `u : SobolevIntervalLp 1 p I`, `1 ≤ p < ∞`, and `rep u` has compact
support inside `I` (`tsupport (rep u) ⊆ I`, or `HasCompactSupport (rep u)` with support in `I`),
then `u ∈ SobolevIntervalLpZero 1 p I`: `rep u` vanishes at the frontier of `I` (a point of the
frontier is not in the compact `tsupport ⊆ I`), Theorem 8.12; or, independently of Theorem 8.12,
chapter 9a's Lemma 9.5 `SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact` (`Cutoff.toml`,
any `Ω ⊆ ℝ^N`, by mollification) at `E = ℝ`. Remark 14 (i), "`C_c^∞(I)` is dense in
`W_0^{1,p}(I)`", is the definition of `SobolevIntervalLpZero` here (`SobolevMultiIndexZero` is
the closure of the image of `𝓓(I, ℝ)`) and gets no backbone node. ★'''
deps = ["mem_sobolevIntervalLpZero_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 14"

[[node]]
id = "SobolevIntervalLp.exists_not_mem_closure_testFunctions"
kind = "theorem"
