desc = '''
The dual space `W^{-1,p'}(I)` of `W_0^{1,p}(I)`, [brezis2011functional] §8.3, "The dual space of
`W_0^{1,p}(I)`": the notation, the inclusions `H_0^1 ⊆ L² ⊆ H^{-1}` (continuous, with dense ranges)
and their `W_0^{1,p} ⊆ L² ⊆ W^{-1,p'}` versions, the representation of Proposition 8.14 and of
Remark 21 (`⟨F, u⟩ = ∫ f₀ u + ∫ f₁ u'` with `f₀, f₁ ∈ L^{p'}`), and Remark 19.

### Design

* `SobolevIntervalLpDual p I := StrongDual ℝ (SobolevIntervalLpZero 1 p I)`, an `abbrev`
  (`H^{-1}(I)` at `p = 2`). The norm identity of Proposition 8.14 is stated in the norm dual to
  the norm the type carries: `W_0^{1,p}` sits isometrically in `PiLp p (Fin 2 → L^p(I))`, so the
  dual norm of a pair `(f₀, f₁)` is the `ℓ^{p'}` norm `(‖f₀‖_{p'}^{p'} + ‖f₁‖_{p'}^{p'})^{1/p'}`
  (`max` at `p = 1`), which is the norm of `PiLp p' (Fin 2 → L^{p'}(I))`; the book's
  `max(‖f₀‖, ‖f₁‖)` is the dual of its sum norm. The representation clause is norm-free.
* The representation needs two outside ingredients: the Riesz representation `(L^p(I))^* ≅ L^{p'}(I)`
  for `1 ≤ p < ∞` (chapter 4's `MeasureTheory.Lp.exists_forall_eq_integral`), and Mathlib's Hahn–Banach
  `exists_extension_norm_eq`. The primary statement is Remark 21's (a functional on all of
  `W^{1,p}(I)`), Proposition 8.14 being its corollary by extension from the closed subspace.
* The reflexivity instances of `W^{1,p}(I)` and `W_0^{1,p}(I)` for `1 < p < ∞` (Proposition 8.1
  and §8.3's paragraph) are here rather than in `Interval/Basic`/`Interval/Zero`, because they rest
  on chapter 4's `MeasureTheory.Lp.instIsReflexive` and chapter 9a's `SobolevMultiIndex.instIsReflexive`
  and would otherwise hold those foundation modules back.
* "`L² ⊆ H^{-1}` is dense" is the injectivity of `H_0^1 → L²` read through reflexivity
  (`Submodule.exists_dual_eq_zero_of_notMem` separates a point from a closed subspace of the dual,
  and a functional on `H^{-1} = (H_0^1)^*` is an element of `H_0^1` because `H_0^1` is reflexive);
  for `1 < p < ∞` the same argument with the reflexivity of `W_0^{1,p}(I)`
  (`SobolevMultiIndexZero.instIsReflexive` of `MultiIndex.toml`, read on `E = ℝ`; chapter 8 has no
  interval-specific reflexivity node).
'''

