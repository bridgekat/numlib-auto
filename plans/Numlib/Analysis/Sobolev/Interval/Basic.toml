of Theorem 8.2 and needs none of the mollification machinery) and is not derived from it.
Specializes to `HasWeakDerivOn.exists_ae_eq_integral`
(bounded, `IntegrableOn w (Ioo a b)`, base point `a`); once proved, re-prove that one from this
(shift the base point). ★'''
