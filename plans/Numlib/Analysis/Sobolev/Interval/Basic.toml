desc = '''
The weak derivative on an open subset of `ℝ` and the Sobolev space `W^{m,p}(I)` for an arbitrary
open `I ⊆ ℝ` and every `p ∈ [1, ∞]`, with the one-dimensional facts that hold on any open
interval: du Bois-Reymond's lemma, the primitive of a locally integrable function as a weak
antiderivative, and the absolutely continuous representative. This is the general layer under
`Numlib/Analysis/Sobolev/Interval.lean`, which keeps the bounded `p = 2` theory `H^m(a, b)` under
its existing names; it follows [brezis2011functional] §8.2 (the definition of `W^{1,p}(I)`,
Remarks 2, 4, 5, 6, 7, Lemmas 8.1 and 8.2, Theorem 8.2, Propositions 8.1 and 8.4, and the
`W^{m,p}` paragraph) for `I` "an open interval, possibly unbounded".

### Design (brief D7)

* `SobolevIntervalLp (m : ℕ) (p : ℝ≥0∞) (I : Opens ℝ) : Type :=
  SobolevMultiIndex ℝ (Module.Basis.singleton Unit ℝ) m p I volume`, an `abbrev`. It is a
  Banach space for every `p` with `[Fact (1 ≤ p)]` (instances of `MultiIndex.lean`; `Fact (1 ≤ ⊤)`
  is Mathlib's `fact_one_le_top_ennreal`), and a Hilbert space at `p = 2`. Its norm is the `ℓ^p`
  sum `(∑_{j ≤ m} ‖u^{(j)}‖_p^p)^{1/p}` (`max_j ‖u^{(j)}‖_∞` at `p = ∞`), which is the book's
  "equivalent norm"; the book's primary norm `‖u‖_p + ‖u'‖_p` is a surface definition with the
  comparison `norm_le_sum_norm_deriv`/`sum_norm_deriv_le_mul_norm` below. At `p = 1` the two agree.
* `SobolevInterval m a b` of `Interval.lean` becomes `abbrev SobolevInterval m a b :=
  SobolevIntervalLp m 2 (Opens.Ioo a b)`; this is what it unfolds to today
  (`notes/brezis/ch08/proto/Basic.lean` checks the `rfl`), so no consumer of
  `Numlib/Variational/*` or of the QSS/AH surfaces changes. `MemSobolevInterval f m a b` likewise
  becomes the abbrev of `MemSobolevIntervalLp f m 2 (Opens.Ioo a b)`.
* The hypothesis "`I` is an interval" is `(hI : (I : Set ℝ).OrdConnected)`, written explicitly on
  every theorem that needs it (du Bois-Reymond, the representative, everything downstream);
  `Set.ordConnected_Ioo` and `Set.ordConnected_univ` discharge it for `Opens.Ioo a b` and `⊤`.
  `I = ℝ` is `(⊤ : Opens ℝ)`; `volume.restrict (⊤ : Set ℝ) = volume` is
  `MeasureTheory.Measure.restrict_coe_top` of `Density.lean`.
* **Refactor item (D7), to be done in the same task that writes this module.** `HasWeakDerivOn`
  and `HasWeakIteratedDerivOn` are generalized *in place*: they take `(I : Opens ℝ)` instead of
  `(a b : ℝ)` and mean `HasWeakIteratedLineDerivOn (fun _ ↦ 1) f w I volume`. Their declarations,
  and the general lemmas about them that `Interval.lean` currently holds, move down into this
  module; the following nodes of `Numlib/Analysis/Sobolev/Interval.toml` are *relocated* here
  (their `[[node]]` blocks move to this file when the declarations move — an orchestrator step,
  since this plan does not edit `Interval.toml`): `TopologicalSpace.Opens.Ioo`,
  `TopologicalSpace.Opens.coe_Ioo`, `HasWeakIteratedDerivOn`, `HasWeakDerivOn`,
  `hasWeakIteratedDerivOn_one`, `hasWeakIteratedDerivOn_iff`, `hasWeakDerivOn_iff`,
  `HasWeakIteratedDerivOn.integral_iteratedDeriv_mul`, `HasWeakDerivOn.integral_deriv_mul`,
  `TestFunction.iteratedDerivApply_coe`, `TestFunction.derivApply_coe`,
  `HasWeakDerivOn.hasWeakIteratedDerivOn_succ`, `HasWeakDerivOn.hasWeakIteratedDerivOn_of_succ`,
  `HasWeakIteratedDerivOn.hasWeakDerivOn_of_succ`,
  `hasWeakIteratedLineDerivOn_iff_hasWeakIteratedDerivOn`, `multiIndexTuple_singleton`,
  `hasWeakIteratedDerivOn_of_contDiffOn`, `hasWeakDerivOn_of_contDiffOn`,
  `eq_add_integral_deriv_of_piecewise` (the `p`-free piecewise-primitive identity that
  `memSobolevIntervalLp_of_piecewise` below consumes; `MeasureTheory.Lp.coeFn_sum` stays in
  `Interval.lean`, nothing here needs it). Every statement in `Interval.lean` mentioning
  `HasWeakDerivOn f w a b` is rewritten as `HasWeakDerivOn f w (Opens.Ioo a b)`; the proofs are
  unchanged because the abbrev unfolds to the same term. The six uses outside `Interval.lean` and
  their migration: `Numlib/Variational/EllipticInterval.lean` lines 729 (`deriv_ae_eq_of_fn_ae_eq`),
  740 (`hasWeakDerivOn_mulL_deriv`), 855, 857, 859 (`exists_sobolevInterval_two`) and
  `Numlib/Variational/FiniteElementInterval.lean` line 628 (`hasWeakDerivOn_hatFun`): in each,
  `HasWeakDerivOn f w a b ↦ HasWeakDerivOn f w (Opens.Ioo a b)` and
  `HasWeakIteratedDerivOn j f w a b ↦ HasWeakIteratedDerivOn j f w (Opens.Ioo a b)`; nothing else
  changes (the proofs go through `Iff.rfl`, checked in the prototype).
* The `p = 2`, bounded API of `Interval.lean` keeps its names and its meaning. Every general
  definition or theorem below that specializes one of them says so ("specializes to X at
  `p = 2`, `I = Opens.Ioo a b`; once proved, re-prove X from this"). For the *definitions*
  (`fn`, `derivIndex`, `derivIndexEquiv`, `deriv`, `mk`, `derivₗ`, `derivCLM`, `inclusionₗ`,
  `inclusionCLM`, `derivL`, `seminorm`) the general one has literally the body of the existing one
  with `2` and `Opens.Ioo a b` abstracted (the prototype checks
  `SobolevInterval.deriv u j = SobolevIntervalLp.deriv u j` by `rfl`), so the existing one becomes
  either an `abbrev` of the general one or keeps its body and gets a `rfl` bridge lemma —
  whichever leaves the consumers' `simp`/`rw` calls compiling; the formalizer decides.
* Base point of the representative. On an unbounded `I` the antiderivative `∫_{-∞}^x u'` need
  not converge, so the canonical representative is built from an interior base point:
  `SobolevIntervalLp.basePoint I : ℝ` is some point of `I` (`Classical.choice` on
  `(I : Set ℝ).Nonempty`, `0` if empty), and `rep u x := repConst u + ∫ t in basePoint I..x, u' t`
  with `repConst u` the constant making it agree with `u` a.e. (the mean of
  `u − ∫_{y₀}^· u'` over `I ∩ Ioo (y₀ − 1) (y₀ + 1)`, or `∫ ψ₀ (u − ∫_{y₀}^· u')` for a fixed test
  function of integral one). The function `rep u` does not depend on the choice (it is *the*
  continuous representative on `closure I`, `rep_eq_of_continuousOn`), and only the API is fixed
  here: `continuousOn_rep` on `closure I`, `fn_ae_eq_rep`, `rep_sub_rep` between any two points of
  `closure I`, linearity. On `Opens.Ioo a b` it agrees with `SobolevInterval.rep` on `Icc a b`
  (by uniqueness, not by `rfl`).
* Separability and reflexivity (Proposition 8.1) are the general `SobolevMultiIndex.instSecondCountableTopology`
  and `SobolevMultiIndex.instIsReflexive` of `MultiIndex.toml` (chapter 9a) read on `E = ℝ`; no
  interval-specific node. If instance search on the abbrev is too slow (the prototype
  `notes/brezis/ch08/proto/Basic.lean` needed `synthInstance.maxHeartbeats 200000` for the general
  instance), the formalizer registers a Lean-side shortcut `instance` for `SobolevIntervalLp m p I`
  in this module — an implementation detail without a plan node, as the review round decided.
'''

[[node]]
id = "TopologicalSpace.Opens.eq_intervals_of_ordConnected"
kind = "theorem"
desc = '''An open `OrdConnected` subset of `ℝ` is an open interval: for `I : Opens ℝ` with
`(hI : (I : Set ℝ).OrdConnected)`, `(I : Set ℝ) = ∅ ∨ (I : Set ℝ) = univ ∨ (∃ a, (I : Set ℝ) = Ioi a) ∨ (∃ b, (I : Set ℝ) = Iio b) ∨ ∃ a b, a < b ∧ (I : Set ℝ) = Ioo a b`.
Mathlib: `Set.isPreconnected_iff_ordConnected` and `IsPreconnected.mem_intervals` list the ten
interval shapes of a preconnected set; openness rules out `Icc`, `Ico`, `Ioc`, `Ici`, `Iic`
(a nonempty open set does not contain its finite endpoints). Also the companion `frontier_eq`: the
frontier of `Ioo a b` is `{a, b}`, of `Ioi a` is `{a}`, of `Iio b` is `{b}`, of `univ` is `∅`
(`frontier_Ioo`, `frontier_Ioi`, `frontier_Iio`, `frontier_univ`), which is what "`u = 0` on `∂I`"
unfolds to. The case split every unbounded-interval argument of the chapter starts with (the
extension operator, Theorem 8.12). ★'''
deps = ["HasWeakDerivOn"]

[[node]]
id = "SobolevIntervalLp"
kind = "definition"
desc = '''`abbrev SobolevIntervalLp (m : ℕ) (p : ℝ≥0∞) (I : Opens ℝ) : Type :=
SobolevMultiIndex ℝ (Module.Basis.singleton Unit ℝ) m p I volume` — the Sobolev space `W^{m,p}(I)`
of [brezis2011functional] §8.2 (`m = 1`) and the `W^{m,p}` paragraph, on an arbitrary open
`I ⊆ ℝ` and `1 ≤ p ≤ ∞`, with the derivatives `u, u', …, u^{(m)}` as its `L^p(I)` components.
Being an abbrev it inherits `NormedAddCommGroup`, `NormedSpace ℝ` (under `[Fact (1 ≤ p)]`),
`CompleteSpace` and, at `p = 2`, `InnerProductSpace ℝ` from `MultiIndex.lean`. Specializes to
`SobolevInterval m a b` at `p = 2`, `I = Opens.Ioo a b`, which becomes an abbrev of this
(definitionally equal today; `notes/brezis/ch08/proto/Basic.lean`). ★'''
deps = ["SobolevMultiIndex", "HasWeakIteratedDerivOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Definition"

[[node]]
id = "MemSobolevIntervalLp"
kind = "definition"
desc = '''`MemSobolevIntervalLp (f : ℝ → ℝ) (m : ℕ) (p : ℝ≥0∞) (I : Opens ℝ) : Prop :=
MemSobolevMultiIndex (Module.Basis.singleton Unit ℝ) f m p I volume`: `f ∈ L^p(I)` and its weak
derivatives of orders `1, …, m` on `I` exist and lie in `L^p(I)`. `MemSobolevInterval f m a b`
becomes its abbrev at `p = 2`, `I = Opens.Ioo a b`. ★'''
deps = ["MemSobolevMultiIndex", "SobolevIntervalLp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Definition"

[[node]]
id = "memSobolevIntervalLp_iff"
kind = "theorem"
desc = '''`MemSobolevIntervalLp f m p I ↔ MemLp f p (volume.restrict I) ∧ ∀ j ≤ m, ∃ w, HasWeakIteratedDerivOn j f w I ∧ MemLp w p (volume.restrict I)`.
The proof of `memSobolevInterval_iff` verbatim (`multiIndexTuple_singleton`,
`hasWeakIteratedLineDerivOn_iff_hasWeakIteratedDerivOn`). Specializes to `memSobolevInterval_iff`;
once proved, re-prove that one from this. ★'''
deps = ["MemSobolevIntervalLp", "hasWeakIteratedLineDerivOn_iff_hasWeakIteratedDerivOn", "multiIndexTuple_singleton"]

[[node]]
id = "memSobolevIntervalLp_zero_iff"
kind = "theorem"
desc = '''`MemSobolevIntervalLp f 0 p I ↔ MemLp f p (volume.restrict I)`: `W^{0,p}(I) = L^p(I)`.
Specializes to `memSobolevInterval_zero_iff`. ★'''
deps = ["memSobolevIntervalLp_iff"]

[[node]]
id = "memSobolevIntervalLp_succ_iff"
kind = "theorem"
desc = '''The book's inductive definition of `W^{m,p}`: `MemSobolevIntervalLp f (m + 1) p I ↔
MemLp f p (volume.restrict I) ∧ ∃ w, HasWeakDerivOn f w I ∧ MemSobolevIntervalLp w m p I`, i.e.
`W^{m+1,p}(I) = {u ∈ L^p : u' ∈ W^{m,p}(I)}`; with `memSobolevIntervalLp_iff` this is the book's
"easily shown" equivalence of the inductive definition with the `m` integration-by-parts
identities. The proof of `memSobolevInterval_succ_iff` verbatim. Specializes to it. ★'''
deps = ["memSobolevIntervalLp_iff", "HasWeakDerivOn.hasWeakIteratedDerivOn_succ", "HasWeakDerivOn.hasWeakIteratedDerivOn_of_succ"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}, Definition"

[[node]]
id = "memSobolevIntervalLp_one_iff"
kind = "theorem"
desc = '''`MemSobolevIntervalLp f 1 p I ↔ MemLp f p (volume.restrict I) ∧ ∃ w, HasWeakDerivOn f w I ∧ MemLp w p (volume.restrict I)`
— [brezis2011functional] §8.2, the definition of `W^{1,p}(I)` read with `𝓓(I, ℝ)` as the test
class (`hasWeakDerivOn_iff` unfolds the integration by parts formula). Specializes to
`memSobolevInterval_one_iff`. ★'''
deps = ["memSobolevIntervalLp_succ_iff", "memSobolevIntervalLp_zero_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Definition"

[[node]]
id = "MemSobolevIntervalLp.congr_ae"
kind = "theorem"
desc = '''Membership only sees the function up to a null set of `I` (Remark 5's first sentence):
`MemSobolevIntervalLp f m p I → f =ᵐ[volume.restrict I] g → MemSobolevIntervalLp g m p I`. This is
`MemSobolevMultiIndex.congr_ae`. ★'''
deps = ["MemSobolevIntervalLp", "MemSobolevMultiIndex.congr_ae"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 5"

