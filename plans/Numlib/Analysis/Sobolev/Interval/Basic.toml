[[node]]
id = "memSobolevIntervalLp_top_iff_lipschitz"
kind = "theorem"
desc = '''**Proposition 8.4**: for `(hI : (I : Set ℝ).OrdConnected)` and `u ∈ L^∞(I)`,
`MemSobolevIntervalLp u 1 ⊤ I ↔ ∃ C, ∀ᵐ x ∂(volume.restrict I), ∀ᵐ y ∂(volume.restrict I), |u x - u y| ≤ C * |x - y|`,
and `→` holds with `C = ‖u'‖_∞`. `→`: `|rep u x − rep u y| = |∫_y^x u'| ≤ ‖u'‖_∞ |x − y|` from
`rep_sub_rep`. `←`: the book goes through Proposition 8.3 (the Riesz representation of `(L¹)^*`,
chapter 4); the one-dimensional route needs nothing of the sort: the a.e. Lipschitz bound gives a
Lipschitz representative `g` on `I` (define `g` on a full-measure set and extend by density and
uniform continuity — or take the pointwise `liminf`-type representative; ★★, the one delicate
step), `g` is absolutely continuous on compacts (`LipschitzOnWith.absolutelyContinuousOnInterval`),
differentiable a.e. with `|g'| ≤ C` (`.ae_differentiableAt`, the Lipschitz bound on difference
quotients), and `g x = g y₀ + ∫_{y₀}^x g'` (`.integral_deriv_eq_sub`), so Lemma 8.2 gives
`HasWeakDerivOn g (deriv g) I` with `deriv g ∈ L^∞`. Corollary `LipschitzOnWith.memSobolevIntervalLp_top`:
a function Lipschitz on `I` and in `L^∞(I)` is in `W^{1,∞}(I)`. ★★'''
deps = ["memSobolevIntervalLp_one_iff", "SobolevIntervalLp.rep", "MeasureTheory.LocallyIntegrableOn.hasWeakDerivOn_integral"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.4"
