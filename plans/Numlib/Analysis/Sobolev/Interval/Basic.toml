[[node]]
id = "MeasureTheory.LocallyIntegrableOn.hasWeakDerivOn_integral"
kind = "theorem"
desc = '''**Lemma 8.2 (the primitive of a locally integrable function is weakly differentiable)**: for
`(hI : (I : Set ℝ).OrdConnected)`, `hw : LocallyIntegrableOn w I`, `y₀ ∈ I` and `c : ℝ`,
`HasWeakDerivOn (fun x ↦ c + ∫ t in y₀..x, w t) w I`. Also `continuousOn_integral`: the primitive
is continuous on `I` (`v ∈ C(I)` in the book), `absolutelyContinuousOnInterval_integral`: it is
absolutely continuous on every `[x, y] ⊆ I` (`IntervalIntegrable.absolutelyContinuousOnInterval_intervalIntegral`),
and `ae_deriv_integral_eq`: its classical derivative is `w` a.e. on `I`
(`IntervalIntegrable.ae_hasDerivAt_integral`). The proof of `hasWeakDerivOn_integral` verbatim:
integrate by parts against a test function on the compact subinterval carrying its support
(`AbsolutelyContinuousOnInterval.integral_mul_deriv_eq_deriv_mul`) — the book's Fubini argument is
not needed. Specializes to `hasWeakDerivOn_integral`, `absolutelyContinuousOnInterval_integral`,
`ae_deriv_integral_eq` (bounded, `IntegrableOn w (Ioo a b)`, base point `a`); once proved, re-prove
those from these (their base point is the endpoint `a`, reachable because `w` is integrable up to
it). ★★'''
deps = ["HasWeakDerivOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 8.2"

