one. The proof of `ae_eq_const_of_hasWeakDerivOn_zero` verbatim with `TestFunction.primitiveIic`
in place of `primitive` and `IsOpen.ae_eq_zero_of_integral_contDiff_smul_eq_zero` on `I`.
Specializes to `ae_eq_const_of_hasWeakDerivOn_zero` (bounded); once proved, re-prove that one
from this. The empty `I` is fine (any `c`). ★★'''
