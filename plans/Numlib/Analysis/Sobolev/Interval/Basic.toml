[[node]]
id = "TestFunction.primitiveIic"
kind = "definition"
desc = '''**The antiderivative of a test function with zero mean is a test function, on any open
interval**: for `I : Opens ℝ` with `(hI : (I : Set ℝ).OrdConnected)`, `ψ : 𝓓(I, ℝ)` and
`hψ : ∫ x, ψ x = 0`, `primitiveIic hI ψ hψ : 𝓓(I, ℝ)` is `x ↦ ∫ t in Iic x, ψ t`: smooth with
derivative `ψ` (`primitiveIic_coe`, `deriv_primitiveIic`), vanishing left of `tsupport ψ` and, by
`hψ`, right of it, so its support is inside the convex hull of `tsupport ψ`, a compact subset of
`I` because `I` is an interval (this is where `OrdConnected` enters: on a disconnected open set the
primitive is not compactly supported). Specializes to `TestFunction.primitive hab ψ hψ`, which is
`x ↦ ∫ t in a..x, ψ t`, the same function since `ψ = 0` left of `a` — a propositional, not
definitional, equality; `TestFunction.primitive` keeps its body. ★★'''
deps = ["HasWeakDerivOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 8.1, proof"

[[node]]
id = "HasWeakDerivOn.exists_ae_eq_const"
