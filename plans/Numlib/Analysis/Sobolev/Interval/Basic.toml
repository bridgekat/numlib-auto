[[node]]
id = "SobolevIntervalLp.exists_continuousOn_closure_ae_eq"
kind = "theorem"
desc = '''**Theorem 8.2 (the continuous representative)**: for `[Fact (1 ≤ p)]`,
`(hI : (I : Set ℝ).OrdConnected)` and `u : SobolevIntervalLp 1 p I`,
`∃ g : ℝ → ℝ, ContinuousOn g (closure (I : Set ℝ)) ∧ fn u =ᵐ[volume.restrict I] g ∧
∀ x ∈ closure I, ∀ y ∈ closure I, g y - g x = ∫ t in x..y, deriv u 1 t`. From
`HasWeakDerivOn.exists_ae_eq_integral_of_mem`; continuity up to a *finite* endpoint uses that
`u' ∈ L^p(I)` is integrable on every bounded piece of `I` (`MemLp.integrableOn` on a set of finite
measure — `L^p ⊆ L^1` there; at `p = ∞`, bounded times finite measure), so the primitive extends
continuously to the endpoint (`intervalIntegral.continuousOn_integral_of_integrableOn_Ioo`-type).
This is the `∃` form; the canonical linear choice is `SobolevIntervalLp.rep`. Specializes to
`HasWeakDerivOn.exists_continuousOn_ae_eq`. ★★'''
deps = ["HasWeakDerivOn.exists_ae_eq_integral_of_mem", "SobolevIntervalLp.deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.2"

[[node]]
id = "SobolevIntervalLp.rep"
kind = "definition"
desc = '''**The canonical continuous representative** of `u ∈ W^{1,p}(I)`, as a function on `ℝ`:
`rep u x := repConst u + ∫ t in basePoint I..x, deriv u 1 t`, where `basePoint I : ℝ` is a chosen
point of `I` (`Classical`, `0` if `I` is empty) and `repConst u : ℝ` is the constant that makes
`rep u` agree with `fn u` a.e. on `I`, chosen *linearly* in `u` (the average of
`fn u − ∫_{y₀}^· u'` over `I ∩ Ioo (y₀ - 1) (y₀ + 1)`, or `∫ ψ₀ (fn u − ∫_{y₀}^· u')` for a fixed
test function of integral one; the group `desc` discusses the choice). API, all under
`[Fact (1 ≤ p)] (hI : (I : Set ℝ).OrdConnected)`: `rep_apply`, `continuousOn_rep :
ContinuousOn (rep u) (closure I)`, `absolutelyContinuousOnInterval_rep` on every `[x, y] ⊆ closure I`,
`hasWeakDerivOn_rep : HasWeakDerivOn (rep u) (deriv u 1) I`, `ae_deriv_rep_eq` (classical
derivative `= u'` a.e. on `I`), `rep_sub_rep : x, y ∈ closure I → rep u y - rep u x = ∫ t in x..y, deriv u 1 t`
(the FTC in `W^{1,p}`, the identity of Theorem 8.2), `fn_ae_eq_rep`, `rep_add`, `rep_smul`,
`rep_finset_sum` (`EqOn` on `closure I`), `rep_eq_of_continuousOn` (Remark 5: any function
continuous on `closure I` agreeing a.e. with `u` on `I` *is* `rep u` on `closure I` — the
representative is unique). Specializes to `SobolevInterval.rep`, `repConst`, `rep_apply`,
`continuousOn_rep`, `absolutelyContinuousOnInterval_rep`, `hasWeakDerivOn_rep`, `ae_deriv_rep_eq`,
`rep_sub_rep`, `fn_ae_eq_rep`, `rep_eq_of_continuousOn`, `rep_add`, `rep_smul`, `rep_finset_sum`
at `p = 2`, `I = Opens.Ioo a b` — there `EqOn (SobolevInterval.rep u) (SobolevIntervalLp.rep u) (Icc a b)`
by `rep_eq_of_continuousOn` (the bodies differ in the base point and the constant), and the
`SobolevInterval` API can be re-derived through that `EqOn`. ★★'''
deps = ["SobolevIntervalLp.exists_continuousOn_closure_ae_eq", "HasWeakDerivOn.exists_ae_eq_integral_of_mem", "MeasureTheory.LocallyIntegrableOn.hasWeakDerivOn_integral"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.2 and Remark 5"

[[node]]
id = "SobolevIntervalLp.eLpNorm_translate_sub_le"
kind = "theorem"
desc = '''**Proposition 8.5, (i)⇒(ii), all `1 ≤ p ≤ ∞`**: for `u : SobolevIntervalLp 1 p ⊤` (the whole
line) and `h : ℝ`, `eLpNorm (fun x ↦ rep u (x + h) - rep u x) p volume ≤ ENNReal.ofReal |h| * eLpNorm (deriv u 1) p volume`
(`‖τ_h u − u‖_p ≤ |h| ‖u'‖_p`). Proof: `rep u (x + h) − rep u x = ∫_x^{x+h} u' = h ∫_0^1 u'(x + s h) ds`
(`rep_sub_rep` and `intervalIntegral.integral_comp_mul_add`-type substitution), so pointwise
`|…|^p ≤ |h|^p ∫_0^1 |u'(x + sh)|^p ds` by Hölder/Jensen on `[0, 1]`
(`ENNReal.rpow_lintegral_mul_le` of `Convolution/Lp.lean` with weight `1`, or
`MeasureTheory.integral_rpow_le`-type convexity), then Tonelli (`MeasureTheory.lintegral_lintegral_swap`)
and translation invariance (`MeasureTheory.lintegral_add_right_eq_self`) give the bound with
`|h|^p ‖u'‖_p^p`; `p = ∞` is the Lipschitz bound of Proposition 8.4. Alternatively, Minkowski's
integral inequality `ENNReal.lintegral_rpow_lintegral_le`. This clause alone is what Theorem 8.8
(7) consumes, at `p = 1`; the converse (ii)⇒(i) is in `Interval/DifferenceQuotient`. Chapter 9a's
`HasWeakFDerivOn.eLpNorm_sub_translate_le` (`Friedrichs.toml`, Proposition 9.3 (i)⇒(iii)) is the
`ℝ^N` statement, proved by density; at `E = ℝ`, `Ω = ⊤` it gives this node too, and whichever
lands first the other should be derived from it (not a listed dependency, for the same reason).
★★ (~200 lines)'''
deps = ["SobolevIntervalLp.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.5"

[[node]]
id = "SobolevIntervalLp.contDiffOn_rep_of_continuousOn_deriv"
kind = "theorem"
desc = '''**Remark 6**: if `u ∈ W^{1,p}(I)` and `u'` has a representative `g` continuous on `closure I`
(`deriv u 1 =ᵐ[volume.restrict I] g`, `ContinuousOn g (closure I)`), then `rep u` is `C¹` on
`closure I`: `ContDiffOn ℝ 1 (rep u) (closure I)` with derivative `g` there (`HasDerivWithinAt`
