[[node]]
id = "SobolevIntervalLp.exists_contDiff_ae_eq"
kind = "theorem"
desc = '''**The `C^k` representative of an element of `W^{k+1,p}(I)`**: `∃ f, ContDiff ℝ k f ∧
(∀ j : Fin (k + 1), deriv u j.castSucc =ᵐ[volume.restrict I] iteratedDeriv j f) ∧ ∀ s ∈ closure I,
∀ t ∈ closure I, iteratedDeriv k f t - iteratedDeriv k f s = ∫ r in s..t, deriv u (Fin.last (k+1)) r`.
Induction on `k` integrating the representative of `u' ∈ W^{k,p}`, as `SobolevInterval.exists_contDiff_ae_eq`
(which this specializes to at `p = 2`; once proved, re-prove that one from this). ★★'''
deps = ["SobolevIntervalLp.rep", "SobolevIntervalLp.deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, The Sobolev spaces W^{m,p}"

[[node]]
id = "memSobolevIntervalLp_one_one_iff_absolutelyContinuousOnInterval"
kind = "theorem"
desc = '''**Remark 8, the absolutely continuous half**: for a bounded interval `I = Opens.Ioo a b`,
`a < b`, `MemSobolevIntervalLp u 1 1 (Opens.Ioo a b) ↔ ∃ g, AbsolutelyContinuousOnInterval g a b ∧ u =ᵐ[volume.restrict (Ioo a b)] g`
— "the functions of `W^{1,1}(I)` are the absolutely continuous functions". `→`: the
representative is AC (`absolutelyContinuousOnInterval_rep`). `←`: an AC `g` is differentiable
a.e. with integrable derivative and `g x = g a + ∫_a^x g'`
(`AbsolutelyContinuousOnInterval.ae_differentiableAt`, `.intervalIntegrable_deriv`,
`.integral_deriv_eq_sub`, Mathlib), so Lemma 8.2 gives the weak derivative `deriv g ∈ L¹`. The
bounded-variation clauses (a)–(c) of Remark 8 are not planned. ★★'''
deps = ["memSobolevIntervalLp_one_iff", "SobolevIntervalLp.rep", "MeasureTheory.LocallyIntegrableOn.hasWeakDerivOn_integral"]
