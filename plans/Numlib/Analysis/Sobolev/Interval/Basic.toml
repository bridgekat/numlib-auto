source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Examples"

[[node]]
id = "memSobolevIntervalLp_abs"
kind = "theorem"
desc = '''**§8.2 Example (i)**: `x ↦ |x|` lies in `W^{1,p}(Opens.Ioo (-1) 1)` for every `1 ≤ p ≤ ∞` with
weak derivative `SignType.sign`-valued `g x = if 0 < x then 1 else -1` (`Real.sign`, or the
`Ioo 0 1`/`Ioo (-1) 0` indicator difference), `HasWeakDerivOn (fun x ↦ |x|) g (Opens.Ioo (-1) 1)`.
Instance of `memSobolevIntervalLp_of_piecewise_contDiffOn` with the partition `-1 < 0 < 1`
(`hasDerivAt_abs_pos`/`hasDerivAt_abs_neg`, `Mathlib/Analysis/Calculus/Deriv/Abs.lean`; `deriv |·|`
equals the sign off `0`). ★'''
deps = ["memSobolevIntervalLp_of_piecewise_contDiffOn"]
