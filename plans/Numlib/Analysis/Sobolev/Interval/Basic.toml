of `p` and `I` already; move them here). ★'''
deps = ["SobolevIntervalLp"]

[[node]]
id = "SobolevIntervalLp.deriv"
kind = "definition"
desc = '''`deriv (u : SobolevIntervalLp m p I) (j : Fin (m + 1)) : Lp ℝ p (volume.restrict (I : Set ℝ)) :=
SobolevMultiIndex.weakDeriv u (derivIndex m j)`, the `j`-th weak derivative `u^{(j)}` as an
`L^p(I)` element, `j = 0` being the function. The prototype checks
`SobolevInterval.deriv u j = SobolevIntervalLp.deriv u j` by `rfl`. With it the whole
`SobolevInterval.deriv` API generalizes verbatim: `deriv_zero` (`⇑(deriv u 0) = fn u`), `deriv_add`,
`deriv_smul`, `deriv_sub`, `deriv_zero_elem`, `ext` (an element is determined by its derivatives),
`hasWeakIteratedDerivOn_deriv` (`HasWeakIteratedDerivOn j (fn u) (deriv u j) I`),
`hasWeakDerivOn_deriv_succ` (the chain `u^{(j+1)} = (u^{(j)})'`), `hasWeakDerivOn_fn`,
`memSobolevIntervalLp_fn`, `locallyIntegrableOn_deriv`, `mk` (an element from `L^p` functions
forming a derivative chain), `deriv_mk`, `fn_mk`, `derivL j : SobolevIntervalLp m p I →L[ℝ] Lp ℝ p _`
of norm `≤ 1`, `derivₗ`/`derivCLM : SobolevIntervalLp (m+1) p I →L[ℝ] SobolevIntervalLp m p I`
(weak differentiation, norm `≤ 1`), `inclusionₗ`/`inclusionCLM` (forgetting the top derivative,
norm `≤ 1`), `seminorm m p I` (`‖u^{(m)}‖_p` as a `Seminorm`). Each specializes to the
`SobolevInterval.*` node of the same name at `p = 2`, `I = Opens.Ioo a b`; they are planned as
this one node with the list, and the formalizer tracks them individually if it wants to. ★'''
deps = ["SobolevIntervalLp", "SobolevIntervalLp.derivIndex", "SobolevMultiIndex.weakDeriv", "hasWeakIteratedLineDerivOn_iff_hasWeakIteratedDerivOn"]

[[node]]
id = "SobolevIntervalLp.norm_eq_sum"
kind = "theorem"
desc = '''The norm of `W^{m,p}(I)` for `p ≠ ∞`: `‖u‖ = (∑ j : Fin (m + 1), ‖deriv u j‖ ^ p.toReal) ^ (1 / p.toReal)`,
the book's "equivalent norm `(‖u‖_p^p + ‖u'‖_p^p)^{1/p}`" at `m = 1`; and `norm_eq_ciSup` at
`p = ∞`: `‖u‖ = ⨆ j, ‖deriv u j‖`. Reindexing of `SobolevMultiIndex.norm_eq_sum`/`norm_eq_ciSup`
along `derivIndexEquiv`. Specializes to `SobolevInterval.norm_sq_eq` at `p = 2`. ★'''
deps = ["SobolevIntervalLp.deriv", "SobolevMultiIndex.norm_eq_sum", "SobolevMultiIndex.norm_eq_ciSup"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Notation"

[[node]]
id = "SobolevIntervalLp.norm_deriv_le"
kind = "theorem"
desc = '''`‖deriv u j‖ ≤ ‖u‖` for every `j`, and the two-sided comparison with the book's norm
`∑_j ‖u^{(j)}‖_p`: `norm_le_sum_norm_deriv : ‖u‖ ≤ ∑ j, ‖deriv u j‖` (the `ℓ^p` norm is at most
the `ℓ^1` norm) and `sum_norm_deriv_le_mul_norm : ∑ j, ‖deriv u j‖ ≤ (m + 1) * ‖u‖`. This is what
makes the book's `‖u‖_{W^{m,p}} = ∑_{α ≤ m} ‖D^α u‖_p` equivalent to the norm of the type, for
every `1 ≤ p ≤ ∞`. Specializes to `SobolevInterval.norm_deriv_le`, `norm_le_add_norm_deriv`. ★'''
deps = ["SobolevIntervalLp.norm_eq_sum"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Notation"

[[node]]
id = "SobolevIntervalLp.inner_eq"
kind = "theorem"
desc = '''At `p = 2`: `⟪u, v⟫_ℝ = ∑ j : Fin (m + 1), ⟪deriv u j, deriv v j⟫_ℝ`, the inner product
`(u, v)_{H^m} = ∑_{α ≤ m} (D^α u, D^α v)_{L²}` of the book; and `inner_eq_integral` at `m = 1`:
`⟪u, v⟫ = ∫ x in I, (fn u x * fn v x + deriv u 1 x * deriv v 1 x)`. From
`SobolevMultiIndex.inner_eq`. Specializes to `SobolevInterval.inner_eq`,
`inner_eq_intervalIntegral`. ★'''
deps = ["SobolevIntervalLp.deriv", "SobolevMultiIndex.inner_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Notation"

[[node]]
id = "hasWeakDerivOn_of_tendsto_eLpNorm"
kind = "theorem"
desc = '''**Remark 4, first clause (closedness of the weak derivative under `L^p` limits)**: if
`HasWeakDerivOn (u n) (w n) I` for all `n`, `u n → u` and `w n → w` in `L^p(I)` (as
`Tendsto (fun n ↦ eLpNorm (u n - u) p (volume.restrict I)) atTop (𝓝 0)`, same for `w`), with
`MemLp u p (volume.restrict I)` and `MemLp w p (volume.restrict I)`, `1 ≤ p ≤ ∞`, then
`HasWeakDerivOn u w I`. Proof: pair each side of `∫ u_n φ' = −∫ w_n φ` against the fixed test
function with Hölder (`MeasureTheory.tendsto_integral_mul_of_tendsto_eLpNorm` of
`Numlib/Analysis/Convolution/Lp`, proved), which covers `p = ∞` too, and pass to the limit. (The
`L¹` form `hasWeakIteratedFDerivOn_of_tendsto_eLpNorm_one` of `Density.lean` would also do for
`p < ∞` after `L^p → L^1` on the support of `φ`, but is not used, so that this foundation module
does not import `Density`/`Mollification`.) Companion `SobolevIntervalLp.tendsto_of_tendsto_deriv`: if moreover
`u n, u ∈ W^{1,p}` then `u n → u` in `W^{1,p}(I)` (the norm is the `ℓ^p` sum). Chapter 9a plans
the general-`E` statement `hasWeakIteratedFDerivOn_of_tendsto_eLpNorm` (`Density.toml`); this is
its `E = ℝ` reading through `hasWeakIteratedLineDerivOn_iff_hasWeakIteratedDerivOn`, and should
be derived from it once that lands (not a listed dependency, so that this foundation module does
not wait on chapter 9a). ★'''
deps = ["HasWeakDerivOn", "MeasureTheory.tendsto_integral_mul_of_tendsto_eLpNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 4"

[[node]]
id = "memSobolevIntervalLp_of_contDiffOn"
kind = "theorem"
desc = '''**Remark 2**: if `ContDiffOn ℝ 1 u I`, `MemLp u p (volume.restrict I)` and
`MemLp (deriv u) p (volume.restrict I)`, then `MemSobolevIntervalLp u 1 p I` and
`HasWeakDerivOn u (deriv u) I` (the weak derivative is the classical one, "so that notation is
consistent"). From `hasWeakDerivOn_of_contDiffOn` (relocated here, generalized to `I`; itself
`ContDiffOn.hasWeakIteratedFDerivOn`). Corollary `memSobolevIntervalLp_of_contDiffOn_Icc`: for
`I = Opens.Ioo a b` bounded and `ContDiffOn ℝ 1 u (Icc a b)`, `u ∈ W^{1,p}(a, b)` for every
`1 ≤ p ≤ ∞` (`C¹(Ī) ⊆ W^{1,p}(I)`) — a continuous function on `Icc a b` is in every `L^p`
(`ContinuousOn.memLp_top_restrict_Ioo`-style, then `MemLp.mono_exponent` on the finite measure);
`ContDiffMapIcc.toSobolevInterval` is the `p = 2` bundled form. ★'''
deps = ["MemSobolevIntervalLp", "hasWeakDerivOn_of_contDiffOn", "memSobolevIntervalLp_one_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 2"

[[node]]
