[[node]]
id = "not_memSobolevIntervalLp_sign"
kind = "theorem"
desc = '''**§8.2 Example (ii)**: the function `g` of Example (i) (`1` on `(0, 1)`, `-1` on `(-1, 0)`) does
not belong to `W^{1,p}(Opens.Ioo (-1) 1)` for any `1 ≤ p ≤ ∞`. If it did, it would agree a.e. with
a function continuous on `[-1, 1]` (`SobolevIntervalLp.exists_continuousOn_closure_ae_eq`), which is
impossible: a continuous `h` with `h = 1` a.e. on `(0, 1)` and `h = -1` a.e. on `(-1, 0)` has
`h 0 = 1` and `h 0 = -1` (`eqOn_Icc_of_ae_eq`-type argument, `Interval.lean` has the tool). ★★'''
deps = ["memSobolevIntervalLp_abs", "SobolevIntervalLp.exists_continuousOn_closure_ae_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.2, Examples (ii)"

[[node]]
id = "TopologicalSpace.Opens.exists_testFunction_integral_eq_one"
