desc = '''
The characterizations of `W^{1,p}(I)` by duality and by difference quotients, for `1 < p ≤ ∞`:
[brezis2011functional] Proposition 8.3 (`u ∈ W^{1,p}` iff `|∫ u φ'| ≤ C ‖φ‖_{p'}` on the test
functions), Proposition 8.5 (on `ℝ`, `u ∈ W^{1,p}` iff `‖τ_h u − u‖_p ≤ C |h|`), the second clause
of Remark 4 and Exercise 8.2 part 1 (a bounded sequence in `W^{1,p}`, `1 < p ≤ ∞`, has a
subsequence converging in `L^∞` on bounded pieces, with the limit in `W^{1,p}`), Remark 16 (ii),
and Theorem 8.8 (7) (`W^{1,1}(I) ↪ L^q(I)` compact on a bounded `I`), which consumes chapter 4's
Kolmogorov–Riesz theorem and is placed here rather than in `Interval/Embedding` so that the
embedding module does not wait on chapter 4.

These are the statements of the chapter that genuinely need the duality of `L^p`, which is
chapter 4's: the Riesz representation `(L^{p'}(I))^* = L^p(I)` for `1 < p ≤ ∞` (Theorems 4.11 and
4.14 of the book, the latter for `p = ∞` on the σ-finite `volume.restrict I`) and the
reflexivity of `L^p` for `1 < p < ∞`: chapter 4's `MeasureTheory.Lp.exists_forall_eq_integral`,
`Lp.dualEquiv` and `Lp.instIsReflexive` (`plans/Numlib/MeasureTheory/Function/LpSpace/Duality.toml`),
and, for Theorem 8.8 (7), `Lp.isCompact_closure_image_restrictCLM_of_uniform_translate`
(`KolmogorovRiesz.toml`); the module is the last of the `Interval/*` children in the order of
attack because of them. Its nodes also have general-`E` counterparts in chapter 9a's
`Friedrichs.toml` (Proposition 9.3), of which they are the `E = ℝ` instances.
Nothing else in the chapter depends on this module: Proposition 8.4 is proved by the absolutely
continuous calculus in `Interval/Basic`, and the easy direction (i)⇒(ii) of Proposition 8.5, the
only clause Theorem 8.8 (7) uses, is in `Interval/Basic` (`SobolevIntervalLp.eLpNorm_translate_sub_le`)
because it needs only the representative.
'''

