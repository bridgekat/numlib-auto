[[node]]
id = "SobolevIntervalLp.isCompactOperator_toLp_one"
kind = "theorem"
desc = '''**Theorem 8.8 (7)**: for `a < b` and `1 ≤ q < ∞`, `IsCompactOperator (toLp_of_bounded : SobolevIntervalLp 1 1 (Opens.Ioo a b) →L[ℝ] Lp ℝ q (volume.restrict (Ioo a b)))`.
The book's proof: `F = P(unit ball)` is bounded in `W^{1,1}(ℝ)` (`extensionCLM`), hence in
`L^1 ∩ L^∞(ℝ)` and in `L^q(ℝ)`; `‖τ_h f − f‖_1 ≤ |h| ‖f'‖_1 ≤ C |h|` (Proposition 8.5 (i)⇒(ii)
at `p = 1`, `SobolevIntervalLp.eLpNorm_translate_sub_le`) and `‖τ_h f − f‖_q^q ≤ (2 ‖f‖_∞)^{q−1} ‖τ_h f − f‖_1`,
so translation is uniformly continuous on `F` in `L^q`; Kolmogorov–M. Riesz–Fréchet (chapter 4,
`MeasureTheory.Lp.isCompact_closure_image_restrictCLM_of_uniform_translate`, stated for a
finite-dimensional real normed `G` with a Haar measure — `G = ℝ`, `μ = volume` here, so no
`EuclideanSpace` transfer: bounded `F ⊆ L^q(ℝ)` plus uniformly continuous translation ⇒ the
restrictions `Lp.restrictCLM … (Ioo a b) '' F` relatively compact in `L^q(a, b)`) gives the
relative compactness of `F|_{(a,b)}`; the image of the unit ball of `W^{1,1}(a, b)` under the
inclusion is `restrictCLM '' F` up to the identification `Pu|_I = u`. A self-contained one-dimensional fallback if the chapter-4 shape proves
awkward: mollify, `‖ρ_ε ⋆ f − f‖_q ≤ sup_{|h| ≤ ε} ‖τ_h f − f‖_q` (`eLpNorm_convolution_sub_rpow_le`
in `Convolution/Lp.lean`), the mollified family is equicontinuous and bounded in `C[a, b]` for
fixed `ε` (Arzelà–Ascoli), and a total-boundedness argument — the standard proof of
Kolmogorov–Riesz itself, ~400 lines. ★★★ (300–500 lines)'''
deps = ["SobolevIntervalLp.toLp", "SobolevIntervalLp.extensionCLM", "SobolevIntervalLp.eLpNorm_translate_sub_le", "SobolevIntervalLp.abs_rep_pow_le", "MeasureTheory.Lp.isCompact_closure_image_restrictCLM_of_uniform_translate"] # cross-ref chapter 4: Kolmogorov–Riesz, `plans/Numlib/MeasureTheory/Function/LpSpace/KolmogorovRiesz.toml`, stated for any finite-dimensional `G`, so `G = ℝ` needs no transfer
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.8"
