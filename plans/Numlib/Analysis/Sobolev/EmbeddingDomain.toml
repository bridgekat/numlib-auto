desc = '''
The Sobolev embeddings on an open set of class `C^1` with bounded boundary (or the half space),
through the extension operator: Brezis, *Functional Analysis, Sobolev Spaces and Partial
Differential Equations*, §9.3.B — Corollary 9.14 (the three cases `p < N`, `p = N`, `p > N`, the
Hölder estimate and `W^{1,p}(Ω) ⊂ C(Ω̄)`), Corollary 9.15 (`W^{m,p}(Ω)`, by iterating 9.14 —
footnote 17: no higher-order extension operator is needed), Remark 15 (the equivalent norm
`‖∇u‖_p + ‖u‖_q`) and Remark 16 (`(log 1/|x|)^α ∈ W^{1,N}` is unbounded). Imports `Embedding.lean`, `Zero.lean` and
`RemovableSingularity.lean` — **not** `Extension.lean`: the hypothesis of every node is the
abstract predicate `IsSobolevExtensionDomain p Ω` / `HasSobolevExtensionOn S` of `Cutoff.lean`
("a bounded extension operator `S → W^{1,p}(ℝ^N)` exists"), of which Theorem 9.7
(`IsSobolevExtensionDomain.of_isContDiffChartDomain`, `Extension.lean`), the half space
(`IsSobolevExtensionDomain.upperHalfSpace`, `Reflection.lean`) and the extension by zero on
`W_0^{1,p}(Ω)` of an arbitrary open set (`SobolevEuclideanZero.hasSobolevExtensionOn`,
`Zero.lean`, Remark 20) are the instances. Placed beside `Embedding.lean` rather than inside it so
that the whole-space theory carries no domain hypothesis at all.

Every statement is "obtain `P` from the predicate, apply the whole-space theorem to `P u`,
restrict": for `u ∈ S`, `fn (P u) =ᵐ[Ω] fn u`, so `MemLp (fn u) q (volume.restrict Ω)` with
`‖fn u‖_{L^q(Ω)} ≤ ‖fn (P u)‖_{L^q(ℝ^N)} ≤ C ‖P u‖ ≤ C ‖P‖ ‖u‖`. The book's standing assumption
for §9.3.B, "`Ω` of class `C^1` with `Γ` bounded, or `Ω = ℝ^N_+`", is the two instances; the
surface states the corollaries under it and Atkinson–Han's `IsContDiffDomain 1 Ω` reaches them
through the bridge; a Lipschitz instance, if Stein's extension is ever formalized, would reach
them with no restatement. This is Atkinson–Han's Theorem 7.3.7 under `C^1`
(`AtkinsonHan.Chapter07.theorem_7_3_7` restated with `IsContDiffDomain 1 Ω`, all three clauses at
`k = 1`, and at every `k` through Corollary 9.15 — the Hölder exponent clause (c) in the book's
`C^{k−[d/p]−1,β}` reading). About 1600 lines.
'''

