[[node]]
id = "isContDiffChartDomain_ball"
kind = "theorem"
desc = '''An open ball of `EuclideanSpace ℝ (Fin (d + 1))`, `d ≥ 1`, is a domain of class `C^∞`
(hence `C^1`) with bounded boundary: `IsContDiffChartDomain ⊤ (Metric.ball c r)` for `r > 0`, via
`IsContDiffDomain.isContDiffChartDomain` and the graph description — near a boundary point,
after a rotation taking the point to the south pole, the sphere is the graph of
`x' ↦ c_N − √(r² − ‖x' − c'‖²)`, smooth for `‖x' − c'‖ < r`, extended smoothly beyond. Needed so
that the interior regularity of chapter 9b (Remark 25 iterated with Corollary 9.15 on balls)
has a `C^1` domain to stand on; also the standard example of a `C^1` domain for the surface.
★★, ~150 lines (the global smooth extension of the graph function past the equator is the
fiddly part: use a bump to interpolate to a constant).'''
deps = ["IsContDiffDomain.isContDiffChartDomain", "IsContDiffChartDomain", "IsContDiffDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.2, Definition (example)"

