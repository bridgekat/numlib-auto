[[node]]
id = "SobolevEuclideanZero.isContinuousEmbedding_toLp"
kind = "theorem"
desc = '''**Remark 20, the embedding clauses on `W_0^{1,p}(Ω)` for an arbitrary open `Ω`**: the three
cases of Corollary 9.14 on the subspace `SobolevEuclideanZero N 1 p Ω` with no regularity of `Ω` —
`W_0^{1,p}(Ω) ↪ L^q(Ω)` for `q ∈ [p, p*]` if `p < N` (`SobolevEuclideanZero.isContinuousEmbedding_toLp_of_lt`),
for `q ∈ [p, ∞)` if `p = N` (`…_of_eq`), and into `L^∞(Ω)` with a representative continuous on
`closure Ω` and the Hölder estimate if `p > N` (`SobolevEuclideanZero.exists_continuousOn_closure_holderWith_ae_eq`)
— each the corresponding `HasSobolevExtensionOn`-node above instantiated with
`SobolevEuclideanZero.hasSobolevExtensionOn` (`Zero.lean`, the extension by zero). "It follows,
in particular, that the conclusion of Corollary 9.14 is true for `W_0^{1,p}(Ω)` with an arbitrary
open set `Ω`" ([brezis2011functional] Remark 20). ★, ~60 lines for the three; the Sobolev
inequality `‖u‖_{p*} ≤ C(p,N) ‖∇u‖_p` of the same remark is `SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_eq`
(`Zero.lean`), and its compactness clause `SobolevEuclideanZero.isCompactEmbedding_toLp`
(`Compactness.lean`).

Blocked: `Numlib/Analysis/Sobolev/Zero.lean` (`SobolevEuclideanZero.hasSobolevExtensionOn`, agent sob9) was not in the tree when this module was written (sob8, 2026-09-18). Once it is, the three cases are `HasSobolevExtensionOn.isContinuousEmbedding_toLpOn_of_le_of_le`, `_of_eq_finrank` and `_top_of_lt` / `exists_forall_continuous_holderWith_ae_eq` applied to `S = SobolevEuclideanZero N 1 p Ω` (~20 lines). Still absent (sob11, 2026-09-19).'''
deps = ["SobolevEuclideanZero.hasSobolevExtensionOn", "SobolevEuclidean.isContinuousEmbedding_toLp_of_hasSobolevExtension_of_lt", "SobolevEuclidean.isContinuousEmbedding_toLp_of_hasSobolevExtension_of_eq", "SobolevEuclidean.exists_continuousOn_closure_holderWith_ae_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 20"

