kind = "theorem"
desc = '''**Remark 15 (an equivalent norm)**: for `Ω` bounded with `IsSobolevExtensionDomain N p Ω`, `1 ≤ p`,
and `q` with `1 ≤ q ≤ p*` if `p < N`, `1 ≤ q < ∞` if `p = N`, `1 ≤ q ≤ ∞` if `p > N`, the
quantity `SobolevMultiIndex.gradNorm u + (eLpNorm (fn u) q (volume.restrict Ω)).toReal` is a norm on
`SobolevEuclidean N 1 p Ω` equivalent to `‖u‖`: `‖u‖ ≤ C (gradNorm u + ‖fn u‖_q)` and
`gradNorm u + ‖fn u‖_q ≤ C' ‖u‖`. The second is Corollary 9.14 plus `gradNorm_le_norm`. The
first: for `q ≥ p`, `‖fn u‖_p ≤ |Ω|^{1/p − 1/q} ‖fn u‖_q` (`eLpNorm_le_eLpNorm_mul_rpow_measure_univ`);
for `q < p`, interpolate `‖fn u‖_p ≤ ‖fn u‖_q^θ ‖fn u‖_{r}^{1−θ}` with `r` the exponent of
Corollary 9.14 (`r = p*`, or any `r > p` for `p = N`, or `∞`), bound `‖fn u‖_r ≤ C ‖u‖ ≤ C (‖fn u‖_p + gradNorm u)`
and absorb `‖fn u‖_p` by Young's inequality with a small parameter (an Ehrling-type step).
[brezis2011functional] Chapter 9, Remark 15. ★★, ~250 lines.'''
