[[node]]
id = "memSobolevMultiIndex_logRpow"
kind = "theorem"
desc = '''**Remark 16 (the limiting case `p = N`)**: on `Ω = ball 0 (1/2) ⊆ ℝ^N`, `N ≥ 2`, and
`0 < α < 1 − 1/N`, the function `u x = (log (1/‖x‖))^α` (set `0` at `x = 0`) lies in
`W^{1,N}(Ω)` — `MemSobolevMultiIndex b u 1 N Ω volume` — and is not essentially bounded:
`eLpNorm u ∞ (volume.restrict Ω) = ∞`. Proof: `u` is `C^1` on `Ω ∖ {0}` with
`∇u = −α (log 1/‖x‖)^{α−1} x/‖x‖²`, so `|∇u|^N = α^N (log 1/‖x‖)^{N(α−1)} ‖x‖^{−N}`, integrable near
`0` exactly when `N(1 − α) > 1` (polar coordinates: `∫_0^{1/2} (log 1/r)^{−β} dr/r < ∞` iff `β > 1`),
and `u ∈ L^N` since the log grows slower than any power; the classical derivative is the weak
one on all of `Ω` by the removable-singularity lemma
`hasWeakIteratedLineDerivOn_of_hasFDerivAt_compl_singleton` (`RemovableSingularity.lean`, the
smallness `∫_{B(0,δ)} |u| = o(δ)` from `tendsto_inv_mul_setIntegral_norm_ball_zero` with any
`s > 1 − N`, a logarithm being milder than any power). The pattern is Atkinson–Han's Example
7.2.6 (`hasWeakIteratedLineDerivOn_logLogNorm`, proved, 578 lines for the whole example).
Trudinger's inequality, the remark's second half, is not planned. ★★★, ~400 lines; low
priority (no consumer).

Blocked: not attempted (sob8, 2026-09-18; sob11, 2026-09-19): low priority, no consumer. The ingredients are in place — the removable-singularity lemma `hasWeakIteratedLineDerivOn_of_hasFDerivAt_compl_singleton` with the smallness criterion `tendsto_inv_mul_setIntegral_norm_ball_zero` (`RemovableSingularity.lean`), `integrableOn_norm_rpow_ball_zero`, and Mathlib's radial formula `MeasureTheory.integral_fun_norm_addHaar` for the polar-coordinate integrals; the cost is the radial integrability `∫_0^{1/2} (log 1/r)^{−β} dr/r < ∞` for `β > 1` (substitute `t = log 1/r`) and the `C¹` calculus of `x ↦ (log 1/‖x‖)^α` off the origin, ~400 lines as estimated.'''
deps = ["hasWeakIteratedLineDerivOn_of_hasFDerivAt_compl_singleton", "tendsto_inv_mul_setIntegral_norm_ball_zero", "MemSobolevMultiIndex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 16"

