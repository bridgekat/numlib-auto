desc = '''
The Rellich–Kondrachov theorem: Brezis, *Functional Analysis, Sobolev Spaces and Partial
Differential Equations*, Theorem 9.16 — for a bounded open `Ω` of class `C^1`, the injections
`W^{1,p}(Ω) ⊂ L^q(Ω)` for `q ∈ [1, p*)` (`p < N`), for `q ∈ [p, ∞)` (`p = N`) and
`W^{1,p}(Ω) ⊂ C(Ω̄)` (`p > N`) are compact; in particular `W^{1,p}(Ω) ⊂ L^p(Ω)` is compact for
every `p`. With the `W_0^{1,p}(Ω)` version for an arbitrary bounded open set (Remark 20) and the
higher-order corollary `W^{k,p}(Ω) ↪↪ W^{k−1,p}(Ω)` (Atkinson–Han's Theorem 7.3.9). Imports
`EmbeddingDomain.lean`, `Zero.lean`, `Extension.lean` (for the `C^1` instance of the extension
predicate only), chapter 4's `Numlib/MeasureTheory/Function/LpSpace/KolmogorovRiesz.lean`
and `Numlib/Topology/ContinuousMap/ArzelaAscoli.lean`. Compact embeddings are
`IsCompactEmbedding` of `Numlib/Analysis/Normed/Operator/Embedding.lean`, the vocabulary
Atkinson–Han's Definition 7.3.6 uses, along the inclusions `SobolevMultiIndex.toLpₗ` /
`SobolevEuclidean.toContinuousMapL`.

The proof is factored through an abstract lemma: any subspace `S` of `W^{1,p}(Ω)`, `Ω` of finite
measure, that carries a bounded extension operator into `W^{1,p}(ℝ^N)` (`HasSobolevExtensionOn S`,
`Cutoff.lean`) embeds compactly into `L^q(Ω)` for `q < p*`. The book's argument is
exactly that: the image `ℱ = P(ℋ)` of the unit ball is bounded in `W^{1,p}(ℝ^N)`, hence in
`L^q(ℝ^N)` (Corollary 9.10) and uniformly continuous under translation in `L^p`
(Proposition 9.3, `‖τ_h f − f‖_p ≤ |h| ‖∇f‖_p`), hence in `L^q` by interpolation; the
Kolmogorov–M. Riesz–Fréchet theorem (chapter 4,
`MeasureTheory.Lp.isCompact_closure_image_restrictCLM_of_uniform_translate`) makes the
restrictions to `Ω` relatively compact in `L^q(Ω)`, and `ℋ = ℱ|_Ω`. The two instances are
`S = ⊤` with Theorem 9.7's `P` (Theorem 9.16) and `S = W_0^{1,p}(Ω)` with the extension by zero
(Remark 20, the version chapter 9b's Theorem 9.31 needs). The case `p = N` reduces to `p < N`,
and the case `p > N` is Arzelà–Ascoli on the compact `closure Ω`
(`ContinuousMap.isCompact_closure_of_forall_norm_le`) applied to the uniformly Hölder image of
the unit ball. About 1400 lines.
'''

[[node]]
id = "SobolevEuclidean.isCompactEmbedding_toLp_of_hasSobolevExtensionOn"
kind = "theorem"
desc = '''**The abstract Rellich–Kondrachov lemma**: for `S : Submodule ℝ (SobolevEuclidean N 1 p Ω)`
with `HasSobolevExtensionOn S` (a bounded `P : S →L W^{1,p}(ℝ^N)` with `P u = u` on `Ω`),
`volume Ω ≠ ∞`, `1 ≤ p < N` and `1 ≤ q < p*`, the inclusion `S → L^q(Ω)`
(`SobolevMultiIndex.toLpₗ` restricted to `S`, membership from Corollary 9.14 through `P`) is a
compact embedding: `IsCompactEmbedding`. Proof ([brezis2011functional] Theorem 9.16, the case
`p < N`, lines 10736–10770 of the source): by `isCompactEmbedding_of_isCompact_closure_image_closedBall`
it suffices that the image of the unit ball of `S` has compact closure in `L^q(Ω)`; the family
`ℱ := P '' closedBall 0 1 ⊆ W^{1,p}(ℝ^N)` is bounded, so its `L^q(ℝ^N)` classes (`q ≥ p`
without loss of generality — for `q < p` use `L^p ⊆ L^q` on the finite-measure `Ω`,
`eLpNorm_le_eLpNorm_mul_rpow_measure_univ`) form a bounded set (Corollary 9.10) satisfying the
uniform translation condition: `‖τ_h f − f‖_p ≤ |h| ‖∇f‖_p ≤ |h| C`
(`SobolevEuclidean.eLpNorm_fn_sub_translate_le`, `Friedrichs.lean`) and
`‖τ_h f − f‖_q ≤ ‖τ_h f − f‖_p^θ (2 ‖f‖_{p*})^{1−θ} ≤ C |h|^θ` with `1/q = θ/p + (1−θ)/p*`,
`θ ∈ (0, 1]` (`MeasureTheory.eLpNorm_le_eLpNorm_rpow_mul_eLpNorm_rpow`); Kolmogorov–Riesz–Fréchet
(`MeasureTheory.Lp.isCompact_closure_image_restrictCLM_of_uniform_translate`, with
`Lp.restrictCLM` to `Ω`) gives the compact closure of the restrictions, which are the classes of
the `u ∈ closedBall 0 1` themselves since `P u = u` on `Ω`. ★★★, ~400 lines.'''
deps = ["IsSobolevExtensionDomain", "SobolevEuclidean.isContinuousEmbedding_toLp_of_le_of_le", "SobolevEuclidean.eLpNorm_fn_sub_translate_le", "MeasureTheory.eLpNorm_le_eLpNorm_rpow_mul_eLpNorm_rpow", "MeasureTheory.Lp.isCompact_closure_image_restrictCLM_of_uniform_translate", "MeasureTheory.Lp.restrictCLM", "isCompactEmbedding_of_isCompact_closure_image_closedBall", "SobolevMultiIndex.toLpₗ"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.16, proof"

