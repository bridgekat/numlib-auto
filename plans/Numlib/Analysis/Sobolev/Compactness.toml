[[node]]
id = "SobolevEuclideanZero.isCompactEmbedding_toLp"
kind = "theorem"
desc = '''**Remark 20, the compactness clause**: for an arbitrary *bounded* open `Ω` (no regularity)
and `1 ≤ p ≤ ∞`, `W_0^{1,p}(Ω) ↪↪ L^q(Ω)` for the same `q` as in Theorem 9.16, and in particular
`W_0^{1,p}(Ω) ↪↪ L^p(Ω)`: `IsCompactEmbedding` of the inclusion `SobolevEuclideanZero N 1 p Ω → Lp ℝ p (volume.restrict Ω)`.
"Similarly, the conclusion of Theorem 9.16 is true for `W_0^{1,p}(Ω)` with an arbitrary bounded
open set `Ω`" — the abstract lemma with `S = W_0^{1,p}(Ω)` and the extension by zero
(`SobolevEuclideanZero.hasSobolevExtensionOn`, `Zero.lean`), and the same three cases. ★★, ~150
lines. This is what chapter 9b's Theorem 9.31 (the Dirichlet eigenfunctions of `−Δ` on a
bounded open `Ω`, no regularity) consumes, through `H_0^1(Ω) ↪↪ L^2(Ω)`, and what
`AtkinsonHan.Chapter08.Section08` and the obstacle problems of Atkinson–Han chapter 11 would
consume for coercivity-by-compactness arguments.

Blocked: `Numlib/Analysis/Sobolev/Zero.lean` (`SobolevEuclideanZero.hasSobolevExtensionOn`, `extendZeroL`, agent sob9) was not in the tree when this module was written (sob8, 2026-09-18). Once it is: the case `p < N` is `SobolevEuclidean.isCompactEmbedding_toLp_of_hasSobolevExtensionOn` with `S = SobolevEuclideanZero N 1 p Ω` (the abstract lemma is stated on a subspace for this purpose), the case `p > N` is `HasSobolevExtensionOn.isCompactEmbedding_toContinuousMapOnL`; the case `p = N` needs the exponent-lowering map on `W_0` (`SobolevMultiIndex.toLowerExponentL` should map `W_0^{1,p}` into `W_0^{1,r}`, to be checked), ~80 lines.'''
deps = ["SobolevEuclidean.isCompactEmbedding_toLp_of_hasSobolevExtensionOn", "SobolevEuclideanZero.hasSobolevExtensionOn", "SobolevEuclideanZero.extendZeroL", "IsCompactEmbedding.comp_isContinuousEmbedding"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 20"

[[node]]
id = "SobolevEuclidean.isCompactEmbedding_toLower_of_lt"
kind = "theorem"
desc = '''**`W^{k,p}(Ω) ↪↪ W^{k−1,p}(Ω)`** for `Ω` bounded of class `C^1`, `k ≥ 1`, `1 ≤ p ≤ ∞`
(Atkinson–Han, *Theoretical Numerical Analysis*, Theorem 7.3.9, under `C^1` in place of
Lipschitz; not in Brezis, whose Theorem 9.16 is `k = 1`): the inclusion
`SobolevEuclidean N k p Ω →ₗ[ℝ] SobolevEuclidean N (k−1) p Ω` (forget the top-order components;
`SobolevMultiIndex.toLowerL`, ★ ~60 lines, `MemSobolev.mono_order` typed) is a compact
embedding. Proof: a bounded sequence `u_n` in `W^{k,p}` has every `∂^α u_n`, `|α| ≤ k−1`, bounded
in `W^{1,p}(Ω)` (`memSobolevMultiIndex_succ_iff`), so by `SobolevEuclidean.isCompactEmbedding_toLp_self`
and a diagonal extraction over the finitely many `α` there is a subsequence along which every
`∂^α u_n`, `|α| ≤ k−1`, converges in `L^p(Ω)`; the limits are the weak derivatives of the limit
of `u_n` by the closedness of the weak derivative under `L^p` limits
(`hasWeakIteratedFDerivOn_of_tendsto_eLpNorm`, `Density.toml`), so the subsequence converges in
`W^{k−1,p}(Ω)`. ★★★, ~300 lines.

Blocked: not attempted (sob8, 2026-09-18) for lack of time; `SobolevEuclidean.isCompactEmbedding_fnL` is the `k = 1` input and the route is as in the desc (~300 lines).'''
deps = ["SobolevEuclidean.isCompactEmbedding_toLp_self", "memSobolevMultiIndex_succ_iff", "hasWeakIteratedFDerivOn_of_tendsto_eLpNorm", "MemSobolev.mono_order", "IsCompactEmbedding"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 7.3.9 (Brezis, Theorem 9.16 iterated)"

