[[node]]
id = "SobolevEuclideanZero.mem_of_continuousOn_closure_of_eqOn_frontier"
kind = "theorem"
desc = '''**Theorem 9.17, (i) ⇒ (ii)**, any open `Ω`, `1 ≤ p < ∞`: if `u : SobolevEuclidean N 1 p Ω`
has a representative `ũ` continuous on `closure Ω` (`fn u =ᵐ[volume.restrict Ω] ũ`,
`ContinuousOn ũ (closure Ω)`) with `ũ = 0` on `frontier Ω`, then `u ∈ SobolevEuclideanZero N 1 p Ω`.
Proof ([brezis2011functional] Theorem 9.17, (i) ⇒ (ii), lines 10806–10820 of the source, with
one change): fix `G ∈ C^1(ℝ)` with `|G t| ≤ |t|`, `G t = 0` for `|t| ≤ 1`, `G t = t` for
`|t| ≥ 2`, `|G'| ≤ M` (built from a smooth step, `Real.smoothTransition`); `u_n := G(n ũ)/n` lies in
`W^{1,p}(Ω)` by Proposition 9.5 (`MemSobolevMultiIndex.contDiff_comp`) with gradient
`G'(nũ) ∇u`, and, when `ũ` has bounded support, `supp u_n ⊆ {x ∈ Ω : |ũ x| ≥ 1/n}`, whose
closure in `ℝ^N` is a compact subset of `Ω` (it is closed and bounded in `closure Ω` and misses
`frontier Ω`, where `ũ = 0`), so `u_n ∈ W_0^{1,p}(Ω)` by Lemma 9.5. Then — instead of
"`u_n → u` in `W^{1,p}` by dominated convergence", which needs `∇u = 0` a.e. on `{u = 0}`
(Comment 4) — show `(u_n)` is Cauchy in `W^{1,p}(Ω)`: `u_n − u_m → 0` in `L^p` and
`∇u_n − ∇u_m = (G'(nũ) − G'(mũ)) ∇u` vanishes on `{ũ = 0}` and tends to `0` pointwise on
`{ũ ≠ 0}` (both factors equal `1` once `n, m ≥ 2/|ũ|`), dominated by `2M |∇u| ∈ L^p`; its limit
in the complete `W^{1,p}(Ω)` is `u` (it is `u` in `L^p`, `|G(nt)/n − t| ≤ 2/n · 1_{|t| ≤ 2/n}`… or
simply `|G(nt)/n| ≤ |t|` and pointwise convergence), and `W_0^{1,p}` is closed. For unbounded
support, `ζ_n u` first (`SobolevMultiIndex.tendsto_cutoff_smul`; `ζ_n ũ` is still continuous on
`closure Ω` and zero on `Γ`). ★★, ~250 lines. Remark 19: this direction needs no smoothness of
`Ω`.'''
deps = ["SobolevEuclideanZero", "MemSobolevMultiIndex.contDiff_comp", "SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact", "SobolevMultiIndexZero.isClosed", "SobolevMultiIndex.instCompleteSpace", "SobolevMultiIndex.tendsto_cutoff_smul"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.17 (i) ⇒ (ii)"

[[node]]
id = "SobolevEuclideanZero.eqOn_unitChartCubeZero_of_continuousOn_closure"
kind = "theorem"
desc = '''**Theorem 9.17, (ii) ⇒ (i), the `Q_+` computation**: if `u ∈ SobolevEuclideanZero (d+1) 1 p Q_+`,
`1 ≤ p < ∞`, has a representative `ũ` continuous on `closure Q_+`, then `ũ = 0` on `Q_0`. Proof
([brezis2011functional] Theorem 9.17, (ii) ⇒ (i), lines 10826–10856 of the source): for test
functions `u_n → u` in `W^{1,p}(Q_+)`, `|u_n(x', x_N)| ≤ ∫_0^{x_N} |∂_N u_n(x', t)| dt`
(fundamental theorem of calculus from the flat boundary, where `u_n = 0`), so for `0 < ε < 1`,
`ε⁻¹ ∫_{|x'| < 1} ∫_0^ε |u_n| ≤ ∫_{|x'| < 1} ∫_0^ε |∂_N u_n|` (Fubini
`EuclideanSpace.measurePreserving_lastInit`); both sides are continuous in the `W^{1,p}(Q_+)`
norm (the slab `{|x'| < 1, 0 < x_N < ε}` has finite measure, so `L^p ⊆ L^1` there), giving the
same inequality for `u`, `∂_N u`; as `ε → 0`, the left side tends to `∫_{|x'| < 1} |ũ(x', 0)| dx'`
(uniform continuity of `ũ` on the compact `{‖x'‖ ≤ 1 − δ, 0 ≤ x_N ≤ 1/2}`, or dominated
convergence of the averages `ε⁻¹ ∫_0^ε ũ(x', t) dt → ũ(x', 0)`) and the right side to `0`
(`∂_N u ∈ L^1(Q_+)`, `tendsto_measure_iInter`/dominated convergence on shrinking slabs). Hence
`ũ(x', 0) = 0` for a.e. `|x'| < 1`, and by continuity for all. ★★★, ~400 lines.'''
