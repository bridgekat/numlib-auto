desc = '''**The positive part preserves `W^{1,p}_0(Ω)`**, `1 ≤ p < ∞`: for `u ∈ SobolevEuclideanZero N 1 p Ω`
the element of `W^{1,p}(Ω)` carrying `(fn u)⁺ = max (fn u) 0` (which exists by
