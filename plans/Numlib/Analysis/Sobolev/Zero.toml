[[node]]
id = "SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_eq"
kind = "theorem"
desc = '''**Remark 20, the Sobolev inequality on `W_0^{1,p}(Ω)` for an arbitrary open `Ω`**: for
`1 ≤ p < N`, `1/p* = 1/p − 1/N`, and `u ∈ SobolevEuclideanZero N 1 p Ω`,
`MemLp (fn u) p* (volume.restrict Ω)` and
`eLpNorm (fn u) p* (volume.restrict Ω) ≤ C(p, N) * SobolevEuclidean.gradNorm u` — "it can also be
deduced from Theorem 9.9 that … `‖u‖_{L^{p*}(Ω)} ≤ C(p,N) ‖∇u‖_{L^p(Ω)}` for all
`u ∈ W_0^{1,p}(Ω)`" ([brezis2011functional] Remark 20). Theorem 9.9 (`SobolevEuclidean.isContinuousEmbedding_toLp_of_eq`)
applied to `extendZeroL u`, whose gradient norm equals `gradNorm u`. The three cases of
Corollary 9.14 on `W_0^{1,p}(Ω)` with no regularity of `Ω` are
`SobolevEuclideanZero.isContinuousEmbedding_toLp` (`EmbeddingDomain.lean`, through
`SobolevEuclideanZero.hasSobolevExtensionOn`). ★★, ~100 lines. Together with Poincaré this closes
the `W_0^{1,p}`-side of `notes/frontier.md` blocker 1 for every `Ω`.'''
deps = ["SobolevEuclideanZero.extendZeroL", "SobolevEuclidean.isContinuousEmbedding_toLp_of_eq", "SobolevMultiIndex.gradNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 20"

[[node]]
id = "SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_measure_ne_top"
kind = "theorem"
desc = '''**Remark 21, first clause (Poincaré for `Ω` of finite measure)**: for `1 ≤ p < ∞`,
`volume Ω ≠ ∞` and `u ∈ SobolevEuclideanZero N 1 p Ω`,
`eLpNorm (fn u) p (volume.restrict Ω) ≤ C(Ω, p, N) * SobolevEuclidean.gradNorm u`. For `p < N`:
`‖u‖_p ≤ |Ω|^{1/p − 1/p*} ‖u‖_{p*} ≤ C |Ω|^{1/N} ‖∇u‖_p` by
`eLpNorm_le_eLpNorm_mul_rpow_measure_univ` and `SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_eq`;
for `p ≥ N` choose `q < N` with `q* > p` (possible since `q* → ∞` as `q → N`), note
`W_0^{1,p}(Ω) ⊆ W_0^{1,q}(Ω)` on the finite-measure `Ω` (`MemSobolev.mono_exponent`, and test
functions are dense in both), and interpolate `‖u‖_p ≤ |Ω|^{1/p − 1/q*} ‖u‖_{q*} ≤ C ‖∇u‖_q ≤ C |Ω|^{1/q − 1/p} ‖∇u‖_p`.
[brezis2011functional] Chapter 9, Remark 21 ("Poincaré's inequality remains true if `Ω` has
finite measure"); the bounded-projection clause is `Poincare.lean`. ★★, ~150 lines. For `N = 1`
the case `p < N` is empty and the argument needs the bounded-projection form instead (a subset of
`ℝ` of finite measure need not have a bounded projection — the statement then follows from
Remark 21's own bounded-projection clause only for bounded sets; for `N = 1` and unbounded `Ω`
of finite measure the inequality is *false*, `Ω = ⋃ (n, n + 2^{−n})` with the constant
functions on each interval — so state the node for `N ≥ 2`, and record the `N = 1` restriction
in the surface).'''
deps = ["SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_eq", "MemSobolev.mono_exponent", "SobolevMultiIndex.gradNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 21"

