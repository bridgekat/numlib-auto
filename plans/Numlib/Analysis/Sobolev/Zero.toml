[[node]]
id = "SobolevEuclideanZero.gelfandTriple"
kind = "theorem"
desc = '''**The inclusions `H_0^1(Ω) ⊂ L^2(Ω) ⊂ H^{−1}(Ω)`** ([brezis2011functional] §9.4, "The Dual
Space of `W_0^{1,p}(Ω)`", Notation): the inclusion `ι : SobolevEuclideanZero N 1 2 Ω →L[ℝ] Lp ℝ 2 (volume.restrict Ω)`
(`toLpₗ_self` restricted) is injective with dense range, and the map
`j : Lp ℝ 2 (volume.restrict Ω) →L[ℝ] StrongDual ℝ (SobolevEuclideanZero N 1 2 Ω)`,
`j f = (v ↦ ∫_Ω f v)`, is injective, bounded and has dense range — "these injections are
continuous and dense". Density of `H_0^1` in `L^2`: the test functions are dense in `L^2(Ω)`
(`MeasureTheory.Lp.dense_contDiff_tsupport_subset`); injectivity of `j`: `∫ f v = 0` for all
test functions `v` forces `f = 0` (`ae_eq_zero_of_integral_contDiff_smul_eq_zero`); density of
`j(L^2)` in `H^{−1}`: a functional on `H^{−1}` vanishing on `j(L^2)` is, `H_0^1` being reflexive
(a Hilbert space), evaluation at some `v ∈ H_0^1` with `∫ f v = 0` for all `f`, so `v = 0`
(`NormedSpace.IsReflexive` and `doubleDualIsometryEquiv`, plus the Hahn–Banach separation of a
point from a closed subspace `Submodule.exists_dual_eq_zero_of_notMem` of
`Numlib/Analysis/Normed/Module/DualSeparable.lean`). Also the general-`p` chain
`W_0^{1,p}(Ω) ⊂ L^2(Ω) ⊂ W^{−1,p'}(Ω)` for bounded `Ω` and `2N/(N+2) ≤ p < ∞` (unbounded:
`≤ 2`): the first inclusion is Remark 20's Sobolev inequality (`p* ≥ 2` exactly when
`p ≥ 2N/(N+2)`) with Hölder on the bounded `Ω`, the second its transpose, density by
reflexivity of `W_0^{1,p}` for `p > 1` (`SobolevMultiIndexZero.instIsReflexive`) — a second node
`SobolevEuclideanZero.gelfandTriple_of_le`, ★★, ~150 lines. ★★, ~200 lines for `p = 2`.'''
deps = ["SobolevEuclideanZero", "SobolevMultiIndex.toLpₗ", "MeasureTheory.Lp.dense_contDiff_tsupport_subset", "NormedSpace.doubleDualIsometryEquiv", "Submodule.exists_dual_eq_zero_of_notMem", "SobolevEuclideanZero.eLpNorm_fn_le_gradNorm_of_eq", "SobolevMultiIndexZero.instIsReflexive"]
