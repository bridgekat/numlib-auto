[[node]]
id = "SobolevEuclideanZero.eqOn_unitChartCubeZero_of_continuousOn_closure"
kind = "theorem"
desc = '''**Theorem 9.17, (ii) ⇒ (i), the `Q_+` computation**: if `u ∈ SobolevEuclideanZero (d+1) 1 p Q_+`,
`1 ≤ p < ∞`, has a representative `ũ` continuous on `closure Q_+`, then `ũ = 0` on `Q_0`. Proof
([brezis2011functional] Theorem 9.17, (ii) ⇒ (i), lines 10826–10856 of the source): for test
functions `u_n → u` in `W^{1,p}(Q_+)`, `|u_n(x', x_N)| ≤ ∫_0^{x_N} |∂_N u_n(x', t)| dt`
(fundamental theorem of calculus from the flat boundary, where `u_n = 0`), so for `0 < ε < 1`,
`ε⁻¹ ∫_{|x'| < 1} ∫_0^ε |u_n| ≤ ∫_{|x'| < 1} ∫_0^ε |∂_N u_n|` (Fubini
`EuclideanSpace.measurePreserving_lastInit`); both sides are continuous in the `W^{1,p}(Q_+)`
norm (the slab `{|x'| < 1, 0 < x_N < ε}` has finite measure, so `L^p ⊆ L^1` there), giving the
same inequality for `u`, `∂_N u`; as `ε → 0`, the left side tends to `∫_{|x'| < 1} |ũ(x', 0)| dx'`
(uniform continuity of `ũ` on the compact `{‖x'‖ ≤ 1 − δ, 0 ≤ x_N ≤ 1/2}`, or dominated
convergence of the averages `ε⁻¹ ∫_0^ε ũ(x', t) dt → ũ(x', 0)`) and the right side to `0`
(`∂_N u ∈ L^1(Q_+)`, `tendsto_measure_iInter`/dominated convergence on shrinking slabs). Hence
`ũ(x', 0) = 0` for a.e. `|x'| < 1`, and by continuity for all. ★★★, ~400 lines.

Blocked: not attempted for lack of time (sob9, 2026-09-19); the route in the desc stands, ~400 lines. The consumer of Theorem 9.17 on this branch (§9.5 Example 1, Step A, `Elliptic.isGalerkinSolution_laplace_of_classical`) needs only the direction (i) ⇒ (ii), which is proved (`SobolevEuclideanZero.mem_of_continuousOn_closure_of_eqOn_frontier`).'''
deps = ["SobolevEuclideanZero", "unitChartCubePos", "unitChartCubeZero", "EuclideanSpace.measurePreserving_lastInit", "SobolevMultiIndex.mem_testFunctions"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.17 (ii) ⇒ (i)"

[[node]]
id = "SobolevEuclideanZero.eqOn_frontier_of_continuousOn_closure"
kind = "theorem"
desc = '''**Theorem 9.17, (ii) ⇒ (i)** for a `C^1` chart domain, `1 ≤ p < ∞`: if
`IsContDiffChartDomain 1 Ω`, `u ∈ SobolevEuclideanZero N 1 p Ω` and `ũ` is a representative
continuous on `closure Ω`, then `ũ = 0` on `frontier Ω`. Proof ("Using local charts this is
reduced to" the `Q_+` computation): for `x₀ ∈ frontier Ω` with chart `c`, and `θ` smooth with
compact support in `c.U` and `θ = 1` near `x₀`, `θ u ∈ W_0^{1,p}(Ω)` restricts to
`W_0^{1,p}(c.U ∩ Ω)` (`SobolevEuclideanZero.mem_of_mem_restrict` (b) and the restriction of a
`W_0` function supported in `U` — the test functions `θ φ_n` have support in `U ∩ Ω`), transfers
along `c.toFun` to `W_0^{1,p}(Q_+)` ((c)), with the representative `(θ ũ) ∘ c.toFun` continuous
on `closure Q_+` (`c.continuousOn` on `closure Q`, `c.toFun '' closure Q_+ ⊆ closure (U ∩ Ω)`);
the `Q_+` computation gives `(θ ũ)(c.toFun y) = 0` for `y ∈ Q_0`, and `x₀ = c.toFun y₀` for some
`y₀ ∈ Q_0` by `c.image_zero`, so `ũ x₀ = 0`. ★★, ~250 lines. Together with the previous nodes
this is Theorem 9.17 in full; chapter 9b's Step A (classical ⇒ weak solutions of the Dirichlet
problem) is the consumer.

Blocked: depends on `SobolevEuclideanZero.eqOn_unitChartCubeZero_of_continuousOn_closure` and `SobolevEuclideanZero.mem_of_mem_restrict`, both left open (sob9, 2026-09-19); ~250 lines on top of them.'''
