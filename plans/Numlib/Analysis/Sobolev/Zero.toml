desc = '''
The space `W_0^{1,p}(Ω)`: Brezis, *Functional Analysis, Sobolev Spaces and Partial Differential
Equations*, §9.4 — Theorem 9.17 (for `u ∈ W^{1,p}(Ω) ∩ C(Ω̄)`, `u = 0` on `Γ` iff
`u ∈ W_0^{1,p}(Ω)`), Proposition 9.18 (the three characterizations, with the extension by zero),
Remarks 17, 18, 20, 21 (first clause), 22, the dual space `W^{−1,p'}(Ω)` with the inclusions
`H_0^1 ⊂ L^2 ⊂ H^{−1}`, and Proposition 9.20 (its representation). Imports `Calculus.lean`,
`Chart.lean` (which holds the chart-restricted Jacobian bounds `ContDiffChart.isDiffeoOnWithBoundedJacobian_pos`),
`Embedding.lean`, `Poincare.lean` and `Friedrichs.lean`; **not** `Extension.lean` nor
`EmbeddingDomain.lean` — the chart transfers of Theorem 9.17 and Proposition 9.18 use Proposition
9.6 and Lemma 9.5 directly, and Remark 20's extension by zero is an instance of the abstract
predicate `HasSobolevExtensionOn` of `Cutoff.lean`, whose consequences (`EmbeddingDomain.lean`,
`Compactness.lean`) are read on `W_0^{1,p}` there. Poincaré's inequality (Corollary 9.19) is
`Poincare.lean`, kept below the extension theorem; the compactness clause of Remark 20 is
`Compactness.lean`.

Design points.

* The extension by zero `extendZeroL : W_0^{1,p}(Ω) →L W^{1,p}(ℝ^N)` (Proposition 9.18,
  (i) ⇒ (iii)) is proved for every `1 ≤ p < ∞` and every open `Ω` without the Riesz
  representation the book's route (i) ⇒ (ii) ⇒ (iii) needs: the zero extensions of the
  approximating test functions form a Cauchy sequence in `W^{1,p}(ℝ^N)`, and the weak derivative
  is closed under `L^p` limits. It is the `HasSobolevExtensionOn` of `W_0^{1,p}(Ω)` on an arbitrary
  open set (Remark 20), which gives the Sobolev inequality `‖u‖_{p*} ≤ C(p,N) ‖∇u‖_p` on
  `W_0^{1,p}(Ω)` with no regularity of `Ω`, and Rellich–Kondrachov on `W_0^{1,p}` of a bounded `Ω`
  (`Compactness.lean`) — chapter 9b's Theorem 9.31 rests on the latter.
* Theorem 9.17 (i) ⇒ (ii) is proved without Comment 4's level-set lemma (`∇u = 0` a.e. on
  `{u = 0}`), which the book's "easy to verify (using dominated convergence)" silently uses: the
  truncations `u_n = G(nu)/n` are shown to be *Cauchy* in `W^{1,p}` (on `{u ≠ 0}` their gradients
  stabilize, on `{u = 0}` they all vanish), so their limit is `u` by completeness and by the
  `L^p` limit, and each `u_n ∈ W_0^{1,p}` by Lemma 9.5 because `supp u_n ⊆ {|u| ≥ 1/n}` is
  compact in `Ω` when `u ∈ C(Ω̄)` vanishes on `Γ` and has bounded support.
* The two chart-reduced statements — (ii) ⇒ (i) of Theorem 9.17 and (iii) ⇒ (i) of Proposition
  9.18 — are each split into the `Q_+` computation (the book's displayed argument) and the
  transfer, and the transfer needs: a `W_0` function on `U ∩ Ω` extends by zero to a `W_0`
  function on `Ω`; a `C^1` diffeomorphism with bounded Jacobians maps `W_0^{1,p}` into `W_0^{1,p}`
  (test functions go to `C_c^1` functions, which are in `W_0` by Lemma 9.5, and `compDiffeoL` is
  continuous); and a product with a smooth compactly supported cut-off preserves `W_0`.

About 2600 lines.
'''

[[node]]
id = "SobolevMultiIndexZero.indicator_memSobolevMultiIndex"
kind = "theorem"
desc = '''**Proposition 9.18, (i) ⇒ (iii), predicate form**, for every open `Ω : Opens E`, every basis
`b`, an additive Haar measure `μ` and `1 ≤ p < ∞`: if `u ∈ SobolevMultiIndexZero ℝ b 1 p Ω μ`, then
`MemSobolevMultiIndex b (Ω.indicator (fn u)) 1 p ⊤ μ`, and the weak derivative of the zero
extension along `b i` is `Ω.indicator (weakDeriv u (Pi.single i 1))` — "`ū ∈ W^{1,p}(ℝ^N)`, and
in this case `∂ū/∂x_i = \overline{∂u/∂x_i}`". Proof (not the book's, which goes through (ii)
and the Riesz representation and needs `p > 1`): for test functions `φ_n → u` in
`W^{1,p}(Ω)` (`SobolevMultiIndex.mem_testFunctions`, the closure), the zero extensions
`φ̄_n ∈ C_c^∞(ℝ^N)` have `∂_i φ̄_n = \overline{∂_i φ_n}` and converge in `L^p(ℝ^N)`, as do their
derivatives, to `ū` and `\overline{∂_i u}`; the weak derivative is closed under `L^p` limits
(`hasWeakIteratedFDerivOn_of_tendsto_eLpNorm`, `Density.toml`). The name is the one
`plans/Numlib/Analysis/PDE/Elliptic/MaximumPrinciple.toml` (chapter 9b) already cites. ★★,
~120 lines; `SobolevEuclideanZero.extendZeroL` bundles it.'''
deps = ["SobolevMultiIndexZero", "SobolevMultiIndex.mem_testFunctions", "hasWeakIteratedFDerivOn_of_tendsto_eLpNorm", "MemSobolevMultiIndex", "TestFunction.memSobolev"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.18 (i) ⇒ (iii)"

[[node]]
id = "SobolevEuclideanZero.extendZeroL"
kind = "definition"
desc = '''**Proposition 9.18, (i) ⇒ (iii): the extension by zero**, for every open `Ω` and
`1 ≤ p < ∞`: `SobolevEuclideanZero.extendZeroL : SobolevEuclideanZero N 1 p Ω →L[ℝ] SobolevEuclidean N 1 p ⊤`,
with `extendZeroL_fn : fn (extendZeroL u) =ᵐ[volume] (Ω : Set _).indicator (fn u)`
(`ū ∈ W^{1,p}(ℝ^N)`), `extendZeroL_weakDeriv : weakDeriv (extendZeroL u) α =ᵐ[volume] Ω.indicator (weakDeriv u α)`
("in this case `∂ū/∂x_i = \overline{∂u/∂x_i}`"), `extendZeroL_fn_ae_eq_on : fn (extendZeroL u) =ᵐ[volume.restrict Ω] fn u`
and `‖extendZeroL u‖ = ‖u‖` (an isometry: the `p`-th powers of the components are integrals
over `Ω` on both sides). Proof, not the book's: for a test function `φ ∈ 𝓓(Ω)`, the zero
extension `φ̄ ∈ C_c^∞(ℝ^N)` has `∇φ̄ = \overline{∇φ}` and the same norms; for `u ∈ W_0^{1,p}(Ω)`
and test functions `φ_n → u` in `W^{1,p}(Ω)`, the `φ̄_n` are Cauchy in `W^{1,p}(ℝ^N)`
(`SobolevMultiIndex.instCompleteSpace`), converge to some `v`, and `fn v = ū`,
`weakDeriv v = \overline{∂u}` a.e. by `hasWeakIteratedFDerivOn_of_tendsto_eLpNorm` (Remark 4 (i))
— or simply because `v`'s components are the `L^p(ℝ^N)` limits of `φ̄_n`'s, which are the zero
extensions of the `L^p(Ω)` limits. Linear by construction (`SobolevMultiIndex.ext_of_fn_ae_eq`).
[brezis2011functional] Proposition 9.18 (i) ⇒ (iii), and Remark 20 ("one can use the canonical
extension by 0 outside `Ω`, which is valid for arbitrary domains"). ★★, ~200 lines.'''
deps = ["SobolevEuclideanZero", "SobolevEuclidean", "SobolevMultiIndexZero.indicator_memSobolevMultiIndex", "SobolevMultiIndex.instCompleteSpace", "MemSobolevMultiIndex.exists_sobolevMultiIndex", "SobolevMultiIndex.ext_of_fn_ae_eq", "SobolevMultiIndex.mem_testFunctions"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.18 (i) ⇒ (iii) and Remark 20"

