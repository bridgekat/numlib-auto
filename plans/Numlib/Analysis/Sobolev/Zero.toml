[[node]]
id = "SobolevEuclideanZero.eq_top_of_compl_singleton"
kind = "theorem"
desc = '''**Remark 17, the punctured space**: for `N ≥ 2` and `1 ≤ p ≤ N`,
`SobolevEuclideanZero N 1 p Ω = ⊤` for `Ω = {0}ᶜ` — in the book, `H_0^1(ℝ^N ∖ {0}) = H^1(ℝ^N ∖ {0})`
("if `ℝ^N ∖ Ω` is sufficiently thin and `p < N`… one can show"). Route (capacity of a point):
first for bounded `u`, `(1 − η_n) u → u` in `W^{1,p}` with cut-offs `η_n` vanishing near `0`;
for `p < N`, `η_n(x) = η(n x)` with `‖∇η_n‖_p^p = n^{p−N} ‖∇η‖_p^p → 0`; for `p = N` (the
book's `H^1` in `N = 2`) the logarithmic cut-off `η_n(x) = log(n² ‖x‖)/log n` on `1/n² < ‖x‖ < 1/n`,
with `‖∇η_n‖_N^N → 0`; then `(1 − η_n) u` has support off `0`, hence is in `W_0^{1,p}(Ω)`
after the whole-space density is localized (Lemma 9.5 and cut-offs), and bounded functions are
dense in `W^{1,p}` (truncation, Proposition 9.5). ★★★, ~400 lines; low priority, no consumer —
also the counterexample of Remark 19 (the converse of Theorem 9.17 (i) ⇒ (ii) fails without
smoothness: a `u ∈ H^1(ℝ^N ∖ {0}) ∩ C(Ω̄)` not vanishing at `0` is in `H_0^1`).

Blocked: not attempted (sob9, 2026-09-19; low priority per the desc, no consumer); the route in the desc stands, ~400 lines.'''
