`min u v` for `u, v ∈ W_0^{1,p}`, from `max u v = u + (v - u)⁺`), this is what makes the obstacle
set `K = {v ∈ H_0^1(Ω) : v ≥ ψ a.e.}` a nonempty closed convex set when `ψ ∈ H^1(Ω)` with
`ψ⁺ ∈ H_0^1(Ω)` (Atkinson–Han's `Chapter11.example_11_1_1`, `example_11_2_3`, `example_11_3_10`,
and Kinderlehrer–Stampacchia's obstacle problem). Proof: approximate `u` by test functions
`u_n → u` in `W^{1,p}`; `G_ε(u_n)` (with `G_ε` as in `MemSobolevMultiIndex.posPart`) is `C^1`
with compact support in `Ω`, hence in `W_0^{1,p}` by Lemma 9.5 (`Cutoff`), and
`G_ε(u_n) → G_ε(u)` in `W^{1,p}` — this is `SobolevMultiIndexZero.contDiff_comp_mem` below,
