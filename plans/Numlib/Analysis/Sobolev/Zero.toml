[[node]]
id = "SobolevEuclideanZero.exists_dual_repr"
kind = "theorem"
desc = '''**Proposition 9.20 (the dual `W^{−1,p'}(Ω)`)**: for `1 ≤ p < ∞`, `p'` the conjugate exponent,
and `F : StrongDual ℝ (SobolevEuclideanZero N 1 p Ω)`, there are `f : MultiIndexLE (Fin N) 1 → Lp ℝ p' (volume.restrict Ω)`
— i.e. `f_0, f_1, …, f_N ∈ L^{p'}(Ω)` — with `F v = ∑ α, ∫ x in Ω, f α x * weakDeriv v α x`
for all `v` (the book's `⟨F, v⟩ = ∫ f_0 v + ∑ ∫ f_i ∂_i v`) and `∀ α, ‖f α‖ ≤ ‖F‖`. Proof
([brezis2011functional] Proposition 9.20, "Adapt the proof of Proposition 8.14"):
`W_0^{1,p}(Ω)` is a subspace of the `PiLp p` product of `N + 1` copies of `L^p(Ω)` (literally,
as a `Submodule` of `SobolevMultiIndexTuple`), so `F` extends by Hahn–Banach
(`exists_extension_norm_eq`) to `Φ` on the product with `‖Φ‖ = ‖F‖`; restricted along the
coordinate injections `Φ_α := Φ ∘ PiLp.single α` each `Φ_α` is a functional on `L^p(Ω)` of norm
`≤ ‖F‖`, represented by `f α ∈ L^{p'}(Ω)` through chapter 4's Riesz representation theorem
(`1 < p < ∞`: Theorem 4.11; `p = 1`: Theorem 4.14 on the σ-finite `volume.restrict Ω`); and
`Φ v = ∑ Φ_α (v α)`. The book's norm identity `‖F‖ = max_α ‖f_α‖_{p'}` refers to its own norm
`∑ ‖h_α‖_p` on the product; for the type's `ℓ^p`-sum norm the exact statement is
`‖F‖ = (∑ ‖f_α‖_{p'}^{p'})^{1/p'}` (the dual of `PiLp p` is `PiLp p'` isometrically), of which the
node states the one-sided bound; recorded as a doubt in the chapter description. ★★★, ~350
lines. Remark 19 of chapter 8 (non-uniqueness of the `f_α`) is a remark, not a node.'''
deps = ["SobolevEuclideanZero", "SobolevMultiIndex.weakDeriv", "MeasureTheory.Lp.exists_forall_eq_integral"]  # cross-ref: chapter 4, `LpSpace/Duality.toml` (Theorems 4.11, 4.14)
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.20"

