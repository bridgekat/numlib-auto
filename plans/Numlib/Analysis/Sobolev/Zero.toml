[[node]]
id = "SobolevMultiIndexZero.contDiff_comp_mem"
kind = "theorem"
desc = '''The chain rule preserves `W^{1,p}_0(Ω)`, `1 ≤ p < ∞`: for `G ∈ C¹(ℝ)` with `G 0 = 0` and
`|G'| ≤ M`, and `u ∈ SobolevEuclideanZero N 1 p Ω`, the element of `W^{1,p}(Ω)` carrying
`G ∘ fn u` (which exists by Proposition 9.5, chapter 9a) lies in `SobolevEuclideanZero N 1 p Ω`.
This is the content of footnotes 35, 37 and 38 of [brezis2011functional] §9.7 ("if `u ∈ H^1_0(Ω)`
the assumption `u ∈ C(Ω̄)` can be removed"). Proof: take test functions `u_n → u` in `W^{1,p}`;
`G ∘ u_n` is `C¹` with compact support in `Ω`, hence in `W^{1,p}_0` by Lemma 9.5 (chapter 9a's
`Cutoff`); `G ∘ u_n → G ∘ u` in `L^p` by `|G(a) - G(b)| ≤ M |a - b|`; and
`∇(G ∘ u_n) = G'(u_n) ∇u_n → G'(u) ∇u` in `L^p` along a subsequence — split
`G'(u_n)(∇u_n - ∇u) + (G'(u_n) - G'(u)) ∇u`, the first term by the bound `M`, the second by
dominated convergence along an a.e.-convergent subsequence
(`MeasureTheory.TendstoInMeasure.exists_seq_tendsto_ae`), exactly as in the proof of
`HasWeakIteratedLineDerivOn.contDiff_comp`; the closed subspace `W^{1,p}_0` contains the limit.
★★ (~200 lines).'''
