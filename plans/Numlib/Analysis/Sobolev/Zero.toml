[[node]]
id = "SobolevEuclidean.mem_zero_of_indicator_memSobolev_unitChartCubePos"
kind = "theorem"
desc = '''**Proposition 9.18, (iii) ⇒ (i), the `Q_+` computation**: let `u ∈ L^p(Q_+)`, `1 ≤ p < ∞`,
be such that its extension by zero to `Q` lies in `W^{1,p}(Q)`; then `α u ∈ W_0^{1,p}(Q_+)` for
every smooth `α` with compact support in `Q`. Proof ([brezis2011functional] §9.4, proof of
Proposition 9.18, "(iii) ⇒ (i)", lines 10868–10906 of the source): `α ū` extended by zero
outside `Q` is in `W^{1,p}(ℝ^N)` (`MemSobolevMultiIndex.indicator_mul`, `Cutoff.lean`); take
one-sided mollifiers `ρ_n(x) = n^N ρ(n x)` with `ρ ≥ 0`, `∫ρ = 1`, `supp ρ ⊆ {1/2 < x_N < 1}`;
then `ρ_n ⋆ (α ū) → α ū` in `W^{1,p}(ℝ^N)` — in `L^p` by
`MeasureTheory.tendsto_eLpNorm_convolution_sub_of_tendsto_support` (`Friedrichs.lean`) and for the
gradient by Lemma 9.1 `HasWeakIteratedLineDerivOn.convolution_of_integrable` plus the same
convergence — while `supp (ρ_n ⋆ α ū) ⊆ supp ρ_n + supp (α ū) ⊆ Q_+` for `n` large
(`support_convolution_subset`; the support of `α ū` lies in `closure Q_+ ∩ supp α`, and adding a
vector with `x_N ∈ (1/(2n), 1/n)` pushes it into `{x_N > 0}` and, for `n` large, keeps it in
`Q`); so `ρ_n ⋆ (α ū)` are smooth compactly supported in `Q_+` — test functions on `Q_+` — and
`α u` is their `W^{1,p}(Q_+)` limit, hence in the closure `SobolevMultiIndexZero`. ★★★, ~350
lines.'''
deps = ["SobolevEuclideanZero", "unitChartCubePos", "MemSobolevMultiIndex.indicator_mul", "MeasureTheory.tendsto_eLpNorm_convolution_sub_of_tendsto_support", "HasWeakIteratedLineDerivOn.convolution_of_integrable", "MemSobolev.convolution_of_integrable", "IsSobolevCutoff.of_hasCompactSupport"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.18 (iii) ⇒ (i)"

[[node]]
id = "SobolevEuclideanZero.mem_of_mem_restrict"
kind = "theorem"
desc = '''Three transfer lemmas for `W_0^{1,p}`, `1 ≤ p < ∞`, needed by the chart reductions of
Theorem 9.17 and Proposition 9.18: (a) `mem_of_mem_restrict`: if `Ω' ≤ Ω` and `u ∈ W^{1,p}(Ω)`
restricts to an element of `W_0^{1,p}(Ω')` and vanishes a.e. on `Ω ∖ Ω'`, then
`u ∈ W_0^{1,p}(Ω)` (a test function on `Ω'` extended by zero is a test function on `Ω`, and the
inclusion `W^{1,p}(Ω')`-of-functions-vanishing-outside → `W^{1,p}(Ω)` is isometric); (b)
`smul_contDiff_mem`: for `α` smooth with compact support in `ℝ^N`, `u ∈ W_0^{1,p}(Ω) → αu ∈ W_0^{1,p}(Ω)`
(`α φ_n` are test functions on `Ω` converging to `α u`, by `HasWeakIteratedLineDerivOn.mul_contDiff`
and the Leibniz bound); (c) `compDiffeoL_mem`: for `IsDiffeoOnWithBoundedJacobian H Hinv Ω' Ω M`,
`u ∈ W_0^{1,p}(Ω) → compDiffeoL h u ∈ W_0^{1,p}(Ω')` (`φ_n ∘ H` is `C^1` with compact support in
`Ω'`, hence in `W_0^{1,p}(Ω')` by Lemma 9.5 `SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact`,
and `compDiffeoL` is continuous). ★★, ~250 lines for the three.'''
deps = ["SobolevEuclideanZero", "SobolevMultiIndex.restrictL", "SobolevEuclidean.compDiffeoL", "SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact", "SobolevMultiIndexZero.isClosed"]
