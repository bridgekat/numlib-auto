`isContinuousEmbedding_toLpₗ (hC : ∀ u, ‖toLpₗ h u‖ ≤ C * ‖u‖) : IsContinuousEmbedding (toLpₗ h)`.
Every "`W^{1,p}(Ω) ⊂ L^q(Ω)` with continuous injection" of [brezis2011functional] §9.3
(Theorem 9.9, Corollaries 9.10, 9.11, 9.13, 9.14) is `IsContinuousEmbedding (toLpₗ h)` for the
relevant `h`, and every compact injection of Theorem 9.16 is `IsCompactEmbedding (toLpₗ h)`,
in the vocabulary of `Numlib/Analysis/Normed/Operator/Embedding.lean`. For `q = p` the
membership is `SobolevMultiIndex.memLp`, the map is the underlying linear map of
`SobolevMultiIndex.fnL` (`MultiIndex.lean`; `toLpₗ_self : toLpₗ (fun u ↦ memLp u) = (fnL : _ →ₗ[ℝ] _)`)
