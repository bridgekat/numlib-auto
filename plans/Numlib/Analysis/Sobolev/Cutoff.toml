[[node]]
id = "HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one"
kind = "theorem"
desc = '''**Remark 1: `C_c^1` test functions**. If `HasWeakIteratedLineDerivOn ![y] f w Ω μ` and
`φ : E → ℝ` is `C^1` with compact support and `tsupport φ ⊆ Ω`, then
`∫ x in Ω, fderiv ℝ φ x y • f x ∂μ = −∫ x in Ω, φ x • w x ∂μ`. Proof: mollify `φ` —
`φ_ε := (bump ε).normed μ ⋆ φ` is a smooth test function on `Ω` for `ε` small
(`support_convolution_subset`), `φ_ε → φ` and `∂_y φ_ε = bump ⋆ ∂_y φ → ∂_y φ` uniformly
(`ContDiffBump.convolution_tendsto_right` on the continuous compactly supported `φ`, `∂_y φ`;
`HasCompactSupport.hasFDerivAt_convolution_left` for the derivative), all supported in one
compact `K ⊆ Ω` on which `f`, `w` are integrable; pass to the limit in the defining identity by
dominated convergence. [brezis2011functional] §9.1, Remark 1 ("to show this, use a sequence of
mollifiers"); with it, every `C_c^1(Ω)` test function of the book's proofs (Lemma 9.2, Proposition
9.6, Proposition 9.18) is available. ★★, ~150 lines.

Blocked: not attempted (sob6, 2026-09-18). Proposition 9.6 (`HasWeakFDerivOn.comp_diffeoOn`, `Calculus.lean`) was proved without it: its test function `ψ ∘ H⁻¹` is only `C^1`, but the identity is checked on a relatively compact open subset by the local `L^1` approximation of `Mollification.lean`, where the approximants are smooth and the classical chain rule applies, so nothing in `Calculus` consumes this node any more. The route in the desc (mollify `φ`, dominated convergence) stands, ~150 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "ContDiffBump.tendsto_eLpNorm_convolution_sub"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 1"

