deps = ["SobolevMultiIndex", "SobolevMultiIndex.ext_of_fn_ae_eq", "SobolevMultiIndex.memLp", "SobolevMultiIndex.weakDerivL", "IsContinuousEmbedding"]

[[node]]
id = "MemSobolev.tendsto_sobolevNorm_cutoff_mul_sub"
kind = "theorem"
desc = '''**The cut-off sequence approximates in `W^{1,p}(Ω)`**, any open `Ω`, `1 ≤ p < ∞`: for
`ζ : E → ℝ` smooth with `0 ≤ ζ ≤ 1`, `ζ = 1` on `closedBall 0 1` and `tsupport ζ ⊆ closedBall 0 2`
(such a `ζ` exists: `exists_contDiff_eqOn_one_closedBall_one` in `Density.lean`), put
`ζ_n x = ζ (n⁻¹ • x)`. Then for `MemSobolev f 1 p Ω μ`: `MemSobolev (ζ_n * f) 1 p Ω μ` with weak
gradient `ζ_n ∇f + f ∇ζ_n` (`HasWeakIteratedLineDerivOn.mul_contDiff`), and
`Tendsto (fun n ↦ sobolevNorm (ζ_n * f − f) 1 p Ω μ) atTop (𝓝 0)`. Proof: `(ζ_n − 1) f` and
`(ζ_n − 1) ∇f` are bounded by the `L^p` mass outside `ball 0 n`
(`MeasureTheory.MemLp.tendsto_eLpNorm_indicator_compl_ball`), and `‖∇ζ_n‖_∞ ≤ ‖∇ζ‖_∞ / n`
(`iteratedFDeriv_comp_const_smul`). This is footnote 5 of [brezis2011functional] §9.1 and the
sequence `ζ_n u` used in Corollary 9.8, Theorem 9.17 and Proposition 9.18. ★★, ~150 lines.'''
deps = ["MemSobolev", "MeasureTheory.MemLp.tendsto_eLpNorm_indicator_compl_ball", "exists_contDiff_eqOn_one_closedBall_one"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.1, footnote 5 (the cut-off sequence)"

[[node]]
id = "SobolevMultiIndex.tendsto_cutoff_smul"
kind = "theorem"
desc = '''Typed form of the cut-off approximation: for `u : SobolevMultiIndex ℝ b 1 p Ω μ`,
`1 ≤ p < ∞`, and `ζ` as in `MemSobolev.tendsto_sobolevNorm_cutoff_mul_sub`, there is a sequence
`v : ℕ → SobolevMultiIndex ℝ b 1 p Ω μ` with `fn (v n) =ᵐ[μ.restrict Ω] ζ_n * fn u`,
`∀ n, ∀ᵐ x ∂μ.restrict Ω, ‖x‖ > 2 n → fn (v n) x = 0` (bounded support), and
`Tendsto v atTop (𝓝 u)`. The multi-index norm at order `1` is controlled by the tensor
`sobolevNorm` at order `1` and conversely (each `∂_i` is the tensor evaluated at `b i`), which is
the only conversion. ★, ~80 lines.'''
deps = ["MemSobolev.tendsto_sobolevNorm_cutoff_mul_sub", "SobolevMultiIndex", "memSobolev_iff_memSobolevMultiIndex", "MemSobolevMultiIndex.exists_sobolevMultiIndex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.1, footnote 5 (the cut-off sequence)"

[[node]]
id = "SobolevMultiIndex.mem_zero_of_ae_eq_zero_compl_isCompact"
kind = "theorem"
desc = '''**Lemma 9.5, at every order**: if `u : SobolevMultiIndex F b k p Ω μ`, `1 ≤ p < ∞`, vanishes
a.e. outside a compact `K ⊆ Ω` (`∀ᵐ x ∂μ.restrict Ω, x ∉ K → fn u x = 0`), then
`u ∈ SobolevMultiIndexZero F b k p Ω μ`. Proof ([brezis2011functional] §9.4, Lemma 9.5, with the
local approximation in place of Theorem 9.2): choose an open `V` with `K ⊆ V`, `closure V` compact
in `Ω` (`IsCompact.exists_pos_forall_closedBall_subset`) and a smooth `α` equal to `1` on `K` with
`tsupport α ⊆ V` (`IsCompact.exists_contDiff_eqOn_one`); `MemSobolev.exists_seq_contDiff_tendsto_eLpNorm`
gives smooth `g i` with `∂^m g i → ∂^m u` in `L^p(V)` for all `m ≤ k`; then `α g i` are test
functions on `Ω` and `α g i − u = α (g i − u)` on `Ω` (since `α u = u`), whose derivatives are
bounded in `L^p(Ω) = L^p(V)` by the Leibniz estimate `eLpNorm_iteratedFDeriv_smul_sub_le` — the
`a − b` there being `g i − G` for smooth `G`; compare instead against `u` through the triangle
inequality with a second smooth approximant, as `Density.lean` does. Conversion between the
tensor derivatives of the estimate and the multi-index components of the type by
`MemSobolev.memSobolevMultiIndex`. The book states `k = 1`; the general order costs nothing
extra and is what Remark 22 (`W_0^{m,p}` as the closure of `C_c^m`) needs. ★★, ~200 lines.'''
deps = ["SobolevMultiIndexZero", "MemSobolev.exists_seq_contDiff_tendsto_eLpNorm", "IsCompact.exists_contDiff_eqOn_one", "IsCompact.exists_pos_forall_closedBall_subset", "eLpNorm_iteratedFDeriv_smul_sub_le", "MemSobolev.memSobolevMultiIndex", "MemSobolevMultiIndex.memSobolev", "TestFunction.exists_mem_sobolevMultiIndex_testFunctions"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.5"

[[node]]
id = "MemSobolevMultiIndexLoc"
kind = "definition"
desc = '''`MemSobolevMultiIndexLoc (b : Basis ι ℝ E) (f : E → F) (k : ℕ) (p : ℝ≥0∞) (Ω : Opens E) (μ : Measure E) : Prop`,
the local Sobolev space `W^{k,p}_loc(Ω)`: `MemSobolevMultiIndex b f k p ω μ` for every open `ω`
with `closure ω` compact and contained in `Ω` (`ω ⋐ Ω`). This is the reading "`u` is in `H^{m+2}(ω)`
for every `ω ⊂⊂ Ω`" of [brezis2011functional] Remark 25 and of the proof of Theorem 9.31; the
book's other reading, `θ u ∈ H^{m+2}(Ω)` for every `θ ∈ C_c^∞(Ω)`, is
`MemSobolevMultiIndexLoc.smul_testFunction`. Companion lemmas: `MemSobolevMultiIndex.memSobolevMultiIndexLoc`
(global implies local, by `HasWeakIteratedLineDerivOn.mono`), `MemSobolevMultiIndexLoc.mono_order`,
`MemSobolevMultiIndexLoc.mono_set`, `memSobolevMultiIndexLoc_iff_forall_ball` (it suffices to test
closed balls inside `Ω`), and `MemSobolevMultiIndexLoc.locallyMemLpOn` (each weak derivative is in
`L^p_loc(Ω)`, `MeasureTheory.LocallyMemLpOn`) with its converse
`memSobolevMultiIndexLoc_of_locallyMemLpOn`. Formerly planned in `PDE/Elliptic/Regularity.toml`
(chapter 9b), which flagged it for relocation here. ★ (~120 lines).'''
deps = ["MemSobolevMultiIndex", "MeasureTheory.LocallyMemLpOn"]

[[node]]
id = "MemSobolevMultiIndexLoc.smul_testFunction"
kind = "theorem"
desc = '''The cut-off of a locally Sobolev function is globally Sobolev, at every order: for
`u ∈ W^{k,p}_loc(Ω)` and `θ ∈ 𝓓(Ω, ℝ)`, the function `θ u` extended by zero outside `Ω` lies in
`W^{k,p}(ℝ^N)` (`MemSobolevMultiIndex b (indicator Ω (θ • u)) k p ⊤ μ`), and a fortiori
`θ u ∈ W^{k,p}(Ω)`. This is the θ-reading of `H^{m+2}_loc(Ω)` in [brezis2011functional] Remark 25,
and it is what `PDE/Elliptic/Spectral` uses to see `e_n ∈ C^∞(Ω)` from `e_n ∈ H^m_loc(Ω)` for all
`m` through the whole-space embeddings.

Proof: by induction on the length of the tuple of directions, with the first-order product
rule against a smooth factor (`HasWeakIteratedLineDerivOn.mul_contDiff` of
`Numlib/Analysis/Sobolev/WeakDeriv`) and `HasWeakIteratedLineDerivOn.cons`: the class of
functions having weak derivatives along all tuples of length `≤ k` in `L^p_loc(Ω)` is closed
under multiplication by a smooth function, because `∂_y (θ v) = θ ∂_y v + (∂_y θ) v` and both
terms are again of that class one order down. The zero extension across `∂Ω` is Remark 4 (ii)
(`MemSobolevMultiIndex.indicator_mul` above), applied to each of the finitely many products. No
explicit Leibniz formula of order `k` is written down — the lesson of
`Numlib/Analysis/Sobolev/Density` — only the existence and local integrability of the
derivatives. ★★ (~180 lines).'''
deps = ["MemSobolevMultiIndexLoc", "HasWeakIteratedLineDerivOn.cons", "MemSobolevMultiIndex.indicator_mul"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 25"

[[node]]
id = "MemSobolevMultiIndex.indicator_smul_of_tsupport_subset"
kind = "theorem"
desc = '''Zero extension across the edge of a chart, at order two: for opens `U` and `Ω`,
`α : E → ℝ` smooth with `tsupport α ⊆ U`, and `v ∈ H²(Ω ⊓ U)`, the function `α v` extended by
zero to `Ω` lies in `H²(Ω)` (`MemSobolevMultiIndex b (indicator (Ω ⊓ U) (α • v)) 2 2 Ω volume`),
with `‖α v‖_{H²(Ω)} ≤ C_α ‖v‖_{H²(Ω ⊓ U)}`; likewise at order one and, by the same induction, at
every order. Proof: for `φ ∈ 𝓓(Ω)`, `α φ` is a test function on `Ω ⊓ U`
(`tsupport (α φ) ⊆ tsupport α ∩ tsupport φ`, compact and inside `U ∩ Ω`), so
`∫_Ω ext(α v) ∂_y φ = ∫_{Ω ⊓ U} v ∂_y (α φ) - ∫_{Ω ⊓ U} v (∂_y α) φ`, and the weak-derivative
identity on `Ω ⊓ U` moves the derivative onto `v`; iterate with `cons`. Remark 4 (ii)
(`MemSobolevMultiIndex.indicator_mul`) is the case `Ω = ℝ^N`, `U` the book's `Ω`, at order one;
this generalization is what "and thus, in fact, to `H²(Ω)`" ([brezis2011functional] p. 11445, the
assembly of Theorem 9.25) needs. Formerly planned in `PDE/Elliptic/Regularity.toml`. ★★ (~150
lines).'''
deps = ["MemSobolevMultiIndex", "HasWeakIteratedLineDerivOn.cons", "MemSobolevMultiIndex.indicator_mul"]

[[node]]
id = "IsSobolevExtensionDomain"
kind = "definition"
desc = '''Two predicates, the abstract hypothesis under which the embeddings on a domain
(`EmbeddingDomain.lean`, Corollaries 9.14–9.15) and Rellich–Kondrachov (`Compactness.lean`,
Theorem 9.16) are stated once and for all.
`HasSobolevExtensionOn (S : Submodule ℝ (SobolevEuclidean N 1 p Ω)) : Prop` says there is a
bounded linear `P : S →L[ℝ] SobolevEuclidean N 1 p ⊤` with `fn (P u) =ᵐ[volume.restrict Ω] fn u`
for all `u ∈ S` (the `L^p` bound of Theorem 9.7 is not part of the predicate; the corollaries only
need the `W^{1,p}` bound). `IsSobolevExtensionDomain N p Ω : Prop := HasSobolevExtensionOn (⊤ : Submodule ℝ (SobolevEuclidean N 1 p Ω))`
— "`Ω` is a `W^{1,p}`-extension domain", the standard name of the literature (Jones; Hajłasz,
Koskela, Tuominen) for the book's standing hypothesis of §9.3.B. Instances, each in the module
that proves it: `IsSobolevExtensionDomain.upperHalfSpace` (`Reflection.lean`, Lemma 9.2 with
`V = ⊤`), `IsSobolevExtensionDomain.of_isContDiffChartDomain` for `C^1` chart domains with bounded
boundary (`Extension.lean`, Theorem 9.7) and `.of_isContDiffDomain` for Atkinson–Han's graph
domains through the bridge, and `SobolevEuclideanZero.hasSobolevExtensionOn` on the subspace
`S = W_0^{1,p}(Ω)` of every open `Ω` by extension by zero (`Zero.lean`, Remark 20) — which is
why the relative predicate is the primary one. A Lipschitz domain would enter the whole
downstream theory (Corollaries 9.14–9.15, Theorem 9.16, and the Atkinson–Han nodes restated
on them) through one more instance, `IsSobolevExtensionDomain.of_isLipschitzDomain`, once
Stein's extension is available (`notes/fem-roadmap.md` Decision B); nothing downstream would be
restated. Placed here, below `Extension.lean`, so that `Zero.lean` and `EmbeddingDomain.lean` do
not import the extension theorem. Formerly `HasSobolevExtension` in `EmbeddingDomain.toml`. ★'''
deps = ["SobolevEuclidean"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.3.B, the standing hypothesis"

[[node]]
id = "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_hasSobolevExtensionOn"
kind = "theorem"
desc = '''**Density of `C_c^∞(ℝ^N)|_Ω` from an extension operator** (the abstract form of Corollary
9.8): for `HasSobolevExtensionOn S` and `1 ≤ p < ∞`, every `u ∈ S` is the limit in
`SobolevEuclidean N 1 p Ω` of restrictions of `C_c^∞(ℝ^N)` functions: there is
`v : ℕ → EuclideanSpace ℝ (Fin N) → ℝ` with `ContDiff ℝ ∞ (v n)`, `HasCompactSupport (v n)`, and
`Tendsto (fun n ↦ ‖(v n).restrict − u‖) atTop (𝓝 0)`, the restriction of `v n` being its class in
`SobolevEuclidean N 1 p Ω` (a `C_c^∞(ℝ^N)` function lies in `W^{1,p}(Ω)` by
`ContDiffOn.hasWeakIteratedFDerivOn` and `MemSobolevMultiIndex.exists_sobolevMultiIndex`).
Proof: `P u ∈ W^{1,p}(ℝ^N)` is approximated by `ζ_n (ρ_n ⋆ P u)` in `W^{1,p}(ℝ^N)`
(`MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm`, `Density.lean`, proved), and
restriction to `Ω` is `1`-Lipschitz (`SobolevMultiIndex.restrictL`). Also the `Dense` form.
Instances: the half space (`Reflection.lean`, what Lemma 9.6 of the regularity theory uses),
`C^1` chart domains with bounded boundary (`Extension.lean`, [brezis2011functional] Corollary
9.8, first paragraph). ★★, ~150 lines.'''
deps = ["IsSobolevExtensionDomain", "MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm", "SobolevMultiIndex.restrictL", "ContDiffOn.hasWeakIteratedFDerivOn", "MemSobolevMultiIndex.exists_sobolevMultiIndex"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.8"
