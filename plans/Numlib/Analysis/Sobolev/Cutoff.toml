[[node]]
id = "MemSobolevMultiIndexLoc.smul_testFunction"
kind = "theorem"
desc = '''The cut-off of a locally Sobolev function is globally Sobolev, at every order: for
`u ∈ W^{k,p}_loc(Ω)` and `θ ∈ 𝓓(Ω, ℝ)`, the function `θ u` extended by zero outside `Ω` lies in
`W^{k,p}(ℝ^N)` (`MemSobolevMultiIndex b (indicator Ω (θ • u)) k p ⊤ μ`), and a fortiori
`θ u ∈ W^{k,p}(Ω)`. This is the θ-reading of `H^{m+2}_loc(Ω)` in [brezis2011functional] Remark 25,
and it is what `PDE/Elliptic/Spectral` uses to see `e_n ∈ C^∞(Ω)` from `e_n ∈ H^m_loc(Ω)` for all
`m` through the whole-space embeddings.

Proof: by induction on the length of the tuple of directions, with the first-order product
rule against a smooth factor (`HasWeakIteratedLineDerivOn.mul_contDiff` of
`Numlib/Analysis/Sobolev/WeakDeriv`) and `HasWeakIteratedLineDerivOn.cons`: the class of
functions having weak derivatives along all tuples of length `≤ k` in `L^p_loc(Ω)` is closed
under multiplication by a smooth function, because `∂_y (θ v) = θ ∂_y v + (∂_y θ) v` and both
terms are again of that class one order down. The zero extension across `∂Ω` is Remark 4 (ii)
(`MemSobolevMultiIndex.indicator_mul` above), applied to each of the finitely many products. No
explicit Leibniz formula of order `k` is written down — the lesson of
`Numlib/Analysis/Sobolev/Density` — only the existence and local integrability of the
derivatives. ★★ (~180 lines).

Blocked: not attempted for lack of time (sob3, 2026-09-18); the definition and its basic lemmas are in place, the induction on the tuple of directions is as in the desc.'''
deps = ["MemSobolevMultiIndexLoc", "HasWeakIteratedLineDerivOn.cons", "MemSobolevMultiIndex.indicator_mul"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 25"

[[node]]
id = "MemSobolevMultiIndex.indicator_smul_of_tsupport_subset"
kind = "theorem"
desc = '''Zero extension across the edge of a chart, at order two: for opens `U` and `Ω`,
`α : E → ℝ` smooth with `tsupport α ⊆ U`, and `v ∈ H²(Ω ⊓ U)`, the function `α v` extended by
zero to `Ω` lies in `H²(Ω)` (`MemSobolevMultiIndex b (indicator (Ω ⊓ U) (α • v)) 2 2 Ω volume`),
with `‖α v‖_{H²(Ω)} ≤ C_α ‖v‖_{H²(Ω ⊓ U)}`; likewise at order one and, by the same induction, at
every order. Proof: for `φ ∈ 𝓓(Ω)`, `α φ` is a test function on `Ω ⊓ U`
(`tsupport (α φ) ⊆ tsupport α ∩ tsupport φ`, compact and inside `U ∩ Ω`), so
`∫_Ω ext(α v) ∂_y φ = ∫_{Ω ⊓ U} v ∂_y (α φ) - ∫_{Ω ⊓ U} v (∂_y α) φ`, and the weak-derivative
identity on `Ω ⊓ U` moves the derivative onto `v`; iterate with `cons`. Remark 4 (ii)
(`MemSobolevMultiIndex.indicator_mul`) is the case `Ω = ℝ^N`, `U` the book's `Ω`, at order one;
this generalization is what "and thus, in fact, to `H²(Ω)`" ([brezis2011functional] p. 11445, the
assembly of Theorem 9.25) needs. Formerly planned in `PDE/Elliptic/Regularity.toml`. ★★ (~150
lines).

Blocked: not attempted for lack of time (sob3, 2026-09-18); `HasWeakIteratedLineDerivOn.indicator_mul` (the order-one case with `Ω = ⊤`) is proved and the same proof with `Ω ⊓ U` in place of `Ω` and `Ω` in place of `⊤` gives the order-one clause.'''
deps = ["MemSobolevMultiIndex", "HasWeakIteratedLineDerivOn.cons", "MemSobolevMultiIndex.indicator_mul"]

