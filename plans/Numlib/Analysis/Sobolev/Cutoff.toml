desc = '''
Cut-off functions and extension by zero for `W^{1,p}(Ω)` on an arbitrary open set — the
elementary tools that Brezis, *Functional Analysis, Sobolev Spaces and Partial Differential
Equations*, chapter 9, uses in every proof of §9.2–§9.4: Remark 4 (ii) (the zero extension of
`αu` for a cut-off `α`), the cut-off sequence `ζ_n(x) = ζ(x/n)` of footnote 5 with `ζ_n u → u`,
Lemma 9.5 (a `W^{k,p}` function with compact support in `Ω` lies in `W_0^{k,p}(Ω)`), and the
locality of the weak derivative. Imports `Numlib/Analysis/Sobolev/MultiIndex.lean` and
`…/Density.lean`; it is the root of the chapter-9 stack (`Friedrichs`, `Calculus`, `Reflection`,
`Poincare`, `Extension`, `Embedding`, `EmbeddingDomain`, `Zero`, `Compactness` all sit above it) and
the first module to attack.

Design. Predicate-level statements are over a finite-dimensional real normed `E` with an additive
Haar measure `μ`, in the `HasWeakIteratedLineDerivOn ![y] f w Ω μ` (single direction) or
`HasWeakFDerivOn f w Ω μ` (tensor) reading, exactly as `Mollification.lean` and `Density.lean` do;
typed statements are on `SobolevMultiIndex F b k p Ω μ` and its abbreviation
`SobolevEuclidean N k p Ω` (appended to `MultiIndex.toml`). A cut-off is bundled as the predicate
`IsSobolevCutoff Ω α` — smooth, bounded with bounded gradient, and `tsupport α` disjoint from
`frontier Ω` — which is the second, weaker form of Remark 4 (ii) ("`α ∈ C^1(ℝ^N) ∩ L^∞` with
`∇α ∈ L^∞` and `supp α ⊂ ℝ^N ∖ ∂Ω`") and covers the first (`α ∈ C_c^1(Ω)`) through
`IsSobolevCutoff.of_hasCompactSupport`; it is the hypothesis the extension theorem's `θ_0`
satisfies. Smoothness `C^∞` is asked instead of the book's `C^1` because the test functions are
`C_c^∞` and `α φ` must again be a test function; the `C^1` form follows from Remark 1
(`HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one` in `Friedrichs.lean`) and is not
needed anywhere, since Lemma 9.3 produces smooth partitions of unity.

The typed operators of this module (`SobolevMultiIndex.restrictL`, `extendZeroMulL`,
`toLpₗ`) are the linear-algebraic glue of the later modules: every operator of chapter 9 —
the extension operator `P`, the embeddings `W^{1,p} ↪ L^q` — is assembled from them, and the
pattern "define on functions, prove the membership and the bound at the predicate level, bundle
by `MemSobolevMultiIndex.exists_sobolevMultiIndex` and `SobolevMultiIndex.ext_of_fn_ae_eq`" is
fixed here once.

Three more things live here because they are used both below and above the extension theorem
and must not force an import of `Extension.lean`: the local Sobolev space `MemSobolevMultiIndexLoc`
(`W^{k,p}_loc(Ω)`) with the cut-off lemma that puts `θ u` in `W^{k,p}(ℝ^N)` for `θ ∈ 𝓓(Ω)` (the
θ-reading of `H^m_loc` of Remark 25, consumed by `PDE/Elliptic/Regularity` and `Spectral`); the
abstract predicate `IsSobolevExtensionDomain p Ω` / `HasSobolevExtensionOn S` ("a bounded linear
extension operator `W^{1,p}(Ω) → W^{1,p}(ℝ^N)` exists on `S`"), whose instances are the half
space (`Reflection.lean`), `C^1` chart domains with bounded boundary (`Extension.lean`, Theorem
9.7) and `W_0^{1,p}(Ω)` on any open set (`Zero.lean`, extension by zero), and on which
`EmbeddingDomain.lean` and `Compactness.lean` state Corollaries 9.14–9.15 and Theorem 9.16 once;
and the density of `C_c^∞(ℝ^N)|_Ω` in `S` that any such operator gives (the abstract form of
Corollary 9.8).

Order of attack within the module: locality → `IsSobolevCutoff` and the zero extension → the
typed operators → the cut-off sequence → Lemma 9.5 → the local space and the extension
predicate. About 1300 lines.
'''

[[node]]
id = "HasWeakIteratedLineDerivOn.of_forall_isCompact_closure_subset"
kind = "theorem"
desc = '''**Locality of the weak derivative**: if `f` and `w` are locally integrable on `Ω` and
`HasWeakIteratedLineDerivOn y f w Ω' μ` holds for every open `Ω'` with `closure Ω'` compact and
contained in `Ω`, then `HasWeakIteratedLineDerivOn y f w Ω μ`. A test function on `Ω` has compact
support, so `IsCompact.exists_pos_forall_closedBall_subset` (`Mollification.lean`) provides such
an `Ω'` containing it, and the defining identity on `Ω'` is the identity on `Ω`. This is the
step "fix an open set `Ω'` with `supp φ ⊂ Ω' ⊂⊂ Ω`" by which Brezis handles `p = ∞` in
Propositions 9.5 and 9.6 ([brezis2011functional] §9.1, end of the proof of Proposition 9.5),
reducing a `W^{1,∞}` statement to `W^{1,q}` on relatively compact subsets, where
`MemSobolev.mono_exponent` applies. ★, ~50 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "IsCompact.exists_pos_forall_closedBall_subset"]

[[node]]
id = "IsSobolevCutoff"
kind = "definition"
desc = '''`IsSobolevCutoff Ω α`, for an open `Ω : Opens E` and `α : E → ℝ`: `α` is `C^∞`, bounded
with bounded derivative (`∃ M, ∀ x, |α x| ≤ M ∧ ‖fderiv ℝ α x‖ ≤ M`), and `tsupport α` is
disjoint from `frontier Ω`. This is the hypothesis of the second sentence of
[brezis2011functional] Chapter 9, Remark 4 (ii) — "`α ∈ C^1(ℝ^N) ∩ L^∞(ℝ^N)` with
`∇α ∈ L^∞` and `supp α ⊂ ℝ^N ∖ ∂Ω`" — with `C^∞` in place of `C^1` (see the group description).
It is exactly what the function `θ_0` of the partition of unity satisfies in the proof of
Theorem 9.7. A structure or a conjunction; the fields are `contDiff`, `exists_bound`,
`disjoint_frontier`. ★'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "IsSobolevCutoff.of_hasCompactSupport"
kind = "theorem"
desc = '''A smooth function with compact support inside `Ω` (`HasCompactSupport α`,
`tsupport α ⊆ Ω`) is a Sobolev cut-off for `Ω`: a smooth compactly supported function and its
derivative are bounded, and a compact subset of the open `Ω` misses `frontier Ω`. This is the
first form of [brezis2011functional] Chapter 9, Remark 4 (ii) (`α ∈ C_c^1(Ω)`), and the form used
for the `θ_i`, `i ≥ 1`, in the proof of Theorem 9.7. ★'''
deps = ["IsSobolevCutoff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "IsSobolevCutoff.exists_testFunction_mul_eqOn"
kind = "theorem"
desc = '''For a cut-off `α` of `Ω` and a test function `φ : 𝓓(⊤, ℝ)` on the whole space, there is
a test function `ψ : 𝓓(Ω, ℝ)` on `Ω` with `ψ = α * φ` on `Ω`. Proof: `K := tsupport (α * φ) ∩
closure Ω` is compact and disjoint from `frontier Ω`, hence a compact subset of `Ω`; take a smooth
`χ` equal to `1` on `K` with `tsupport χ ⊆ Ω` (`IsCompact.exists_contDiff_eqOn_one`,
`Mollification.lean`) and `ψ := χ * α * φ`. On `Ω`, either `χ = 1` or the point is outside
`tsupport (α φ)` where both sides vanish. This is the one technical point of the zero-extension
argument of [brezis2011functional] Chapter 9, Remark 4 (ii), when `α` is merely supported off
`∂Ω`; when `tsupport α ⊆ Ω` one can take `ψ = α φ` directly. ★★, ~80 lines.'''
deps = ["IsSobolevCutoff", "IsCompact.exists_contDiff_eqOn_one"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "HasWeakIteratedLineDerivOn.indicator_mul"
kind = "theorem"
desc = '''**Extension by zero of `αu`** ([brezis2011functional] Chapter 9, Remark 4 (ii), both
forms): if `HasWeakIteratedLineDerivOn ![y] u w Ω μ`, `u` and `w` are integrable on `Ω`
(or merely `LocallyIntegrableOn` with `α` compactly supported), and `IsSobolevCutoff Ω α`, then
`HasWeakIteratedLineDerivOn ![y] (Ω.indicator (α * u)) (Ω.indicator (α * w + (fun x ↦ fderiv ℝ α x y) * u)) ⊤ μ`
on the whole space. Proof as in the book: for `φ` a test function on `ℝ^N`,
`∫ \overline{αu} ∂_y φ = ∫_Ω u ∂_y(αφ) − ∫_Ω u (∂_y α) φ`, and `αφ` is (on `Ω`) the test function
`ψ` of `IsSobolevCutoff.exists_testFunction_mul_eqOn`, so the defining identity of `w` applies.
Footnote 3 ("in general `ū ∉ W^{1,p}(ℝ^N)`") is why the cut-off is needed. ★★, ~120 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "IsSobolevCutoff", "IsSobolevCutoff.exists_testFunction_mul_eqOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "MemSobolevMultiIndex.indicator_mul"
kind = "theorem"
desc = '''Membership form of Remark 4 (ii): for `MemSobolevMultiIndex b u 1 p Ω μ`, `1 ≤ p ≤ ∞`, and
`IsSobolevCutoff Ω α` with bound `M`, `MemSobolevMultiIndex b (Ω.indicator (α * u)) 1 p ⊤ μ`, and
the `L^p` estimates `eLpNorm (Ω.indicator (α * u)) p μ ≤ ofReal M * eLpNorm u p (μ.restrict Ω)`
and `eLpNorm (∂_i \overline{αu}) p μ ≤ ofReal M * (eLpNorm (∂_i u) p (μ.restrict Ω) + eLpNorm u p (μ.restrict Ω))`
for every basis direction. From `HasWeakIteratedLineDerivOn.indicator_mul` applied to each
`multiIndexTuple b (Pi.single i 1)` (a tuple of length one) and `MemLp` of indicators and
bounded multiples. This is the estimate `‖ū_0‖_{W^{1,p}(ℝ^N)} ≤ C ‖u‖_{W^{1,p}(Ω)}` of
[brezis2011functional] §9.2, proof of Theorem 9.7, step (a). ★★, ~120 lines.'''
deps = ["HasWeakIteratedLineDerivOn.indicator_mul", "MemSobolevMultiIndex", "IsSobolevCutoff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "SobolevMultiIndex.restrictL"
kind = "definition"
desc = '''Restriction to an open subset as a bounded linear map:
`SobolevMultiIndex.restrictL (h : Ω' ≤ Ω) : SobolevMultiIndex F b k p Ω μ →L[ℝ] SobolevMultiIndex F b k p Ω' μ`,
with `fn (restrictL h u) =ᵐ[μ.restrict Ω'] fn u`, `weakDeriv (restrictL h u) α =ᵐ[μ.restrict Ω'] weakDeriv u α`
and `‖restrictL h u‖ ≤ ‖u‖`. Built from `MemSobolevMultiIndex.congr_ae`/`.mono_set`
(`MemSobolev.mono_set` transported) and `MemSobolevMultiIndex.exists_sobolevMultiIndex`; linear
by `SobolevMultiIndex.ext_of_fn_ae_eq`. Every "consider the restriction of `u` to `U_i ∩ Ω`"
of [brezis2011functional] §9.2 is this map; for `1 ≤ p`. ★, ~80 lines together with its three
lemmas `restrictL_fn`, `restrictL_weakDeriv`, `norm_restrictL_le`.'''
deps = ["SobolevMultiIndex", "MemSobolev.mono_set", "MemSobolevMultiIndex.exists_sobolevMultiIndex", "SobolevMultiIndex.ext_of_fn_ae_eq", "memSobolev_iff_memSobolevMultiIndex"]

[[node]]
id = "SobolevMultiIndex.extendZeroMulL"
kind = "definition"
desc = '''The bounded linear map `u ↦ \overline{αu}` of Remark 4 (ii) on the typed spaces:
`SobolevMultiIndex.extendZeroMulL (hα : IsSobolevCutoff Ω α) : SobolevMultiIndex ℝ b 1 p Ω μ →L[ℝ] SobolevMultiIndex ℝ b 1 p ⊤ μ`,
for `1 ≤ p`, with `extendZeroMulL_fn : fn (extendZeroMulL hα u) =ᵐ[μ] Ω.indicator (α * fn u)`,
`extendZeroMulL_fn_ae_eq_on : fn (extendZeroMulL hα u) =ᵐ[μ.restrict Ω] α * fn u`, the `L^p`
bound `eLpNorm (fn (extendZeroMulL hα u)) p μ ≤ ofReal M * eLpNorm (fn u) p (μ.restrict Ω)` and
`‖extendZeroMulL hα u‖ ≤ C(M, N, p) * ‖u‖`. Values by `MemSobolevMultiIndex.indicator_mul` and
`exists_sobolevMultiIndex`; linearity because the construction is linear a.e. and
`ext_of_fn_ae_eq`; continuity by `LinearMap.mkContinuous`. Steps (a) and (b)-end of the proof of
[brezis2011functional] Theorem 9.7 are this operator (with `θ_0`, respectively `θ_i` on `U_i`).
★★, ~150 lines.'''
deps = ["MemSobolevMultiIndex.indicator_mul", "MemSobolevMultiIndex.exists_sobolevMultiIndex", "SobolevMultiIndex.ext_of_fn_ae_eq", "IsSobolevCutoff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (ii)"

[[node]]
id = "SobolevMultiIndex.toLpₗ"
kind = "definition"
desc = '''The inclusion of `W^{k,p}(Ω)` into `L^q(Ω)` as a linear map, given the membership:
`SobolevMultiIndex.toLpₗ (h : ∀ u : SobolevMultiIndex F b k p Ω μ, MemLp (fn u) q (μ.restrict Ω)) : SobolevMultiIndex F b k p Ω μ →ₗ[ℝ] Lp F q (μ.restrict Ω)`,
`u ↦ (h u).toLp (fn u)`, with `toLpₗ_coeFn : toLpₗ h u =ᵐ[μ.restrict Ω] fn u`, injective
