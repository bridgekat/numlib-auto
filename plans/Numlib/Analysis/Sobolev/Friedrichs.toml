kind = "theorem"
desc = '''**Proposition 9.3, (ii) ⇒ (i)**, `1 < p ≤ ∞`: if `u ∈ L^p(Ω)` and there is `C` with
`|∫ x in Ω, fderiv ℝ φ x y • u x ∂μ| ≤ C * ‖y‖ * (eLpNorm φ p' (μ.restrict Ω)).toReal` for all
test functions `φ` and directions `y`, then `∃ w, HasWeakFDerivOn u w Ω μ ∧ MemLp w p (μ.restrict Ω)`
(and `eLpNorm w p ≤ C` up to the factor between the operator norm and the coordinate bounds —
state `∃ w` with `MemSobolev u 1 p Ω μ` as the main conclusion). Proof
([brezis2011functional] Proposition 9.3, "Proceed as in the proof of Proposition 8.3"): for each
basis direction `e_i`, the functional `φ ↦ ∫ u ∂_i φ` on the test functions — dense in
`L^{p'}(Ω)` since `p' < ∞`, `MeasureTheory.Lp.dense_contDiff_tsupport_subset`
(`Numlib/Analysis/Normed/Lp/SmoothApprox.lean`) — is bounded, extends to
`StrongDual ℝ (Lp ℝ p' (μ.restrict Ω))` (`ContinuousLinearMap.extend` / `DenseInducing.extend`),
and is represented by `g_i ∈ L^p(Ω)` through chapter 4's Riesz representation theorem
`MeasureTheory.Lp.exists_forall_eq_integral` (`plans/Numlib/MeasureTheory/Function/LpSpace/Duality.toml`;
Theorems 4.11 for `1 < p' < ∞` and 4.14 for `p' = 1`, i.e. `p = ∞`, on the σ-finite
`μ.restrict Ω`); then
`∫ u ∂_i φ = ∫ g_i φ`, so `−g_i` is the weak derivative along `e_i`, and the tensor `w` is
assembled from the `g_i` by `MemSobolevMultiIndex.memSobolev`. ★★, ~200 lines.'''
