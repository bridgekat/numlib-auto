[[node]]
id = "HasWeakFDerivOn.eLpNorm_sub_translate_le"
kind = "theorem"
desc = '''**Proposition 9.3, (i) ⇒ (iii)**, `1 ≤ p < ∞`, the translation estimate: for
`HasWeakFDerivOn u w Ω μ` with `u, w ∈ L^p(Ω)`, an open `ω ⊆ Ω` and a vector `h` such that the
segments `x + t h`, `t ∈ [0, 1]`, stay in `Ω` for `x ∈ ω`
(`∀ x ∈ ω, ∀ t ∈ Icc (0 : ℝ) 1, x + t • h ∈ Ω` — the book's `|h| < dist(ω, ∂Ω)`),
`eLpNorm (fun x ↦ u (x + h) − u x) p (μ.restrict ω) ≤ ‖h‖ₑ * eLpNorm w p (μ.restrict Ω)`.
Proof ([brezis2011functional] Proposition 9.3, proof of (i) ⇒ (iii), lines 10008–10030 of the
source): for `u ∈ C_c^∞(ℝ^N)`, `u(x + h) − u(x) = ∫_0^1 ∇u(x + t h) · h dt`
(`intervalIntegral.integral_eq_sub_of_hasDerivAt` along `t ↦ u (x + t • h)`), then Jensen
`|·|^p ≤ |h|^p ∫_0^1 |∇u(x + th)|^p dt` (`ENNReal.rpow_lintegral_mul_le` or Hölder on `[0,1]`),
Fubini in `(x, t)` and translation invariance of `μ` to get
`‖τ_h u − u‖_{L^p(ω)}^p ≤ |h|^p ∫_0^1 ∫_{ω + t h} |∇u|^p ≤ |h|^p ‖∇u‖_{L^p(Ω)}^p`; then pass to
`u ∈ W^{1,p}(Ω)` by the **proved local approximation** `MemSobolev.exists_seq_contDiff_tendsto_eLpNorm`
(`Density.lean`): state the theorem first for `ω` with `closure ω` compact in `Ω` and
`ω' := closure ω + [0,1] h` (compact, inside `Ω` by the segment hypothesis), take an open `V ⊇ ω'`
with compact closure in `Ω`, and smooth `g_i → u`, `∇g_i → w` in `L^p(V)` — the smooth estimate
on `ω` only sees `V` — and pass to the limit; a general open `ω` follows by monotone convergence
over an exhaustion. This is cheaper than the book's route through Theorem 9.2
(`MemSobolev.exists_seq_contDiff_hasCompactSupport_tendsto`, one sequence for all `ω`), which is
not needed because the estimate is tested on one relatively compact set at a time; the node
therefore does not wait for that ★★★ theorem. ★★★, 300–400 lines. Corollaries:
`MemSobolev.eLpNorm_sub_translate_le` on the whole space, `Ω = ⊤`, every `h`:
`‖τ_h u − u‖_{L^p(ℝ^N)} ≤ |h| ‖∇u‖_{L^p(ℝ^N)}` (★), and its typed form
`SobolevEuclidean.eLpNorm_fn_sub_translate_le` (★) — the modulus that `Compactness.lean` feeds
to Kolmogorov–Riesz–Fréchet.'''
deps = ["HasWeakFDerivOn", "MemSobolev.exists_seq_contDiff_tendsto_eLpNorm", "ENNReal.rpow_lintegral_mul_le", "MeasureTheory.measurePreserving_sub_left_of_isAddRightInvariant"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.3 (i) ⇒ (iii)"

