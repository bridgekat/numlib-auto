[[node]]
id = "MeasureTheory.tendsto_eLpNorm_convolution_sub_of_tendsto_support"
kind = "theorem"
desc = '''**Approximate identities converge in `L^p`**: if `ρ n : E → ℝ` are nonnegative, integrable,
of integral `1`, with `support (ρ n) ⊆ closedBall 0 (r n)` and `r n → 0`, and `f ∈ L^p(μ)`,
`1 ≤ p < ∞`, then `eLpNorm (ρ n ⋆[lsmul ℝ ℝ, μ] f − f) p μ → 0`. From
`MeasureTheory.eLpNorm_convolution_sub_rpow_le` (`Numlib/Analysis/Convolution/Lp.lean`, the
weighted Minkowski bound for any probability density) and the continuity of translation
`MeasureTheory.MemLp.tendsto_eLpNorm_sub_translate`: the bound is the `ρ n`-average of
`‖f(· − t) − f‖_p^p` over `‖t‖ ≤ r n`, which is at most the supremum of that quantity over the
ball, and that tends to `0`. `ContDiffBump.tendsto_eLpNorm_convolution_sub` is the special case of
normalized bumps; the general form is what the *one-sided* mollifiers `ρ_n(x) = n^N ρ(nx)`,
`supp ρ ⊆ {1/2 < x_N < 1}`, of [brezis2011functional] §9.4, proof of Proposition 9.18 (iii) ⇒ (i),
need. ★, ~80 lines.'''
deps = ["MeasureTheory.eLpNorm_convolution_sub_rpow_le", "MeasureTheory.MemLp.tendsto_eLpNorm_sub_translate"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §9.4, proof of Proposition 9.18"

[[node]]
id = "MemSobolev.exists_seq_contDiff_hasCompactSupport_tendsto"
kind = "theorem"
desc = '''**Theorem 9.2 (Friedrichs)**, the local clause with one sequence for all `ω`: for
`MemSobolev f 1 p Ω μ` with `1 ≤ p < ∞` and weak gradient `w` (tensor form), there is
`u : ℕ → E → ℝ` with `∀ n, ContDiff ℝ ∞ (u n)`, `∀ n, HasCompactSupport (u n)`,
`Tendsto (fun n ↦ eLpNorm (u n − f) p (μ.restrict Ω)) atTop (𝓝 0)`, and for every open `ω`
with `IsCompact (closure ω)` and `closure ω ⊆ Ω`,
`Tendsto (fun n ↦ eLpNorm (fderiv ℝ (u n) − w) p (μ.restrict ω)) atTop (𝓝 0)`. Proof
([brezis2011functional] §9.1, proof of Theorem 9.2): `v_n := ρ_n ⋆ ū` with `ū = Ω.indicator f`
and `w̄ = Ω.indicator w` both in `L^p(ℝ^N)`, `ρ_n` normalized bumps of radius `ε_n → 0`
(`exists_seq_contDiffBump_tendsto_rOut_zero`, `Density.lean`); `v_n` is smooth
(`MeasureTheory.LocallyIntegrable.contDiff_convolution_normed`), `v_n → ū` in `L^p(ℝ^N)`
(`ContDiffBump.tendsto_eLpNorm_convolution_sub`), and at every `x` with `closedBall x ε_n ⊆ Ω`
— all of `ω` once `ε_n` is below the distance from `closure ω` to `Ωᶜ`,
`IsCompact.exists_pos_forall_closedBall_subset` — `fderiv (v_n) x = (ρ_n ⋆ w̄) x` by
`HasWeakIteratedFDerivOn.iteratedFDeriv_convolution` (the weak derivative of `ū` on `Ω` is `w̄`,
by `congr_ae`), so `‖∇v_n − w̄‖_{L^p(ω)} ≤ ‖ρ_n ⋆ w̄ − w̄‖_{L^p(ℝ^N)} → 0` — this replaces the
book's detour through `α` and Remark 4 (ii), which the commutation lemma makes unnecessary. Then
`u_n := ζ_n v_n` (footnote 5 cut-offs): `u_n → ū` in `L^p(ℝ^N)` and `∇u_n = ζ_n ∇v_n + v_n ∇ζ_n`
with `‖∇ζ_n‖_∞ = O(1/n)`, exactly as in `exists_seq_contDiff_hasCompactSupport_tendsto_sobolevNorm_sub`.
The two limits are along the same index, so a diagonal choice `ε_n ≤ 1/n` suffices. ★★★,
300–400 lines. A subsequence converging a.e. on `Ω` is then available from
`tendstoInMeasure_of_tendsto_eLpNorm` and `TendstoInMeasure.exists_seq_tendsto_ae`, as the book
uses in Propositions 9.4 and 9.5.'''
deps = ["MemSobolev", "HasWeakIteratedFDerivOn.iteratedFDeriv_convolution", "ContDiffBump.tendsto_eLpNorm_convolution_sub", "MeasureTheory.LocallyIntegrable.contDiff_convolution_normed", "exists_seq_contDiffBump_tendsto_rOut_zero", "IsCompact.exists_pos_forall_closedBall_subset", "MemSobolev.tendsto_sobolevNorm_cutoff_mul_sub", "HasWeakIteratedFDerivOn.congr_ae"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.2"

