desc = '''
Approximation of `W^{1,p}(Ω)` functions by smooth ones on an arbitrary open set, and what follows
from it: Brezis, *Functional Analysis, Sobolev Spaces and Partial Differential Equations*,
§9.1 — Theorem 9.2 (Friedrichs), Lemma 9.1, Proposition 9.3 (the three characterizations of
`W^{1,p}`, `1 < p ≤ ∞`), Remarks 1, 2, 4 (i) and 7. Imports `Cutoff.lean` and
`Numlib/Analysis/Convolution/Lp.lean`.

What `Density.lean` already gives, and what is new. The whole-space clause of Theorem 9.2 is
`MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm` at order `1`, and the local
approximation on one relatively compact open `ω ⊂⊂ Ω` is `MemSobolev.exists_seq_contDiff_tendsto_eLpNorm`;
both are *proved*. What Theorem 9.2 adds is a **single** sequence `u_n ∈ C_c^∞(ℝ^N)` that works
for every `ω ⊂⊂ Ω` at once — `u_n → u` in `L^p(Ω)` and `∇u_n → ∇u` in `L^p(ω)` for all `ω` —
and that is what Propositions 9.3–9.6 and Lemma 9.5 consume. The book's construction,
`u_n = ζ_n (ρ_n ⋆ ū)` with `ū` the extension of `u` by zero, is followed literally: the
commutation `∂(ρ_n ⋆ ū) = ρ_n ⋆ ∂u` at the points whose `ε_n`-ball lies in `Ω` is
`HasWeakIteratedFDerivOn.iteratedFDeriv_convolution` (`Mollification.lean`), the `L^p` convergence
of mollification is `ContDiffBump.tendsto_eLpNorm_convolution_sub`, and the truncation step is
`MemSobolev.tendsto_sobolevNorm_cutoff_mul_sub` (`Cutoff.lean`) in the spirit of
`exists_seq_contDiff_hasCompactSupport_tendsto_sobolevNorm_sub`. A second version records that the
construction preserves an `L^∞` bound, `‖u_n‖_∞ ≤ ‖u‖_∞`, which the book reads off the proof for
Proposition 9.4.

Proposition 9.3 is split into its four implications, each with the weakest hypothesis under
which the book's argument works: (i)⇒(ii) and (i)⇒(iii) for all `1 ≤ p ≤ ∞`, (iii)⇒(ii) for all
`p`, and (ii)⇒(i) for `1 < p ≤ ∞` only, since it is the Riesz representation of the dual of
`L^{p'}(Ω)` — a chapter-4 node — and fails at `p = 1` (Remark 6). The translation estimate
(i)⇒(iii) on the whole space, `‖τ_h u − u‖_p ≤ |h| ‖∇u‖_p`, is the modulus of continuity that
Rellich–Kondrachov (`Compactness.lean`) feeds to the Kolmogorov–Riesz–Fréchet theorem.

Remark 1 (test functions may be taken `C_c^1`) is here because it is proved by mollifying the
test function and because Proposition 9.6 (`Calculus.lean`) needs it: `ψ ∘ H⁻¹` is only `C^1`.
Remark 7's Lipschitz representative for `W^{1,∞}` on a convex set, and "`∇u = 0` a.e. ⇒
locally constant", are the first-order form of the "vanishing derivative ⇒ polynomial" fact
that Atkinson–Han's Theorem 7.3.12 was noted to need. About 2300 lines.
'''

[[node]]
id = "HasWeakIteratedLineDerivOn.integral_smul_eq_of_contDiff_one"
kind = "theorem"
desc = '''**Remark 1: `C_c^1` test functions**. If `HasWeakIteratedLineDerivOn ![y] f w Ω μ` and
`φ : E → ℝ` is `C^1` with compact support and `tsupport φ ⊆ Ω`, then
`∫ x in Ω, fderiv ℝ φ x y • f x ∂μ = −∫ x in Ω, φ x • w x ∂μ`. Proof: mollify `φ` —
`φ_ε := (bump ε).normed μ ⋆ φ` is a smooth test function on `Ω` for `ε` small
(`support_convolution_subset`), `φ_ε → φ` and `∂_y φ_ε = bump ⋆ ∂_y φ → ∂_y φ` uniformly
(`ContDiffBump.convolution_tendsto_right` on the continuous compactly supported `φ`, `∂_y φ`;
`HasCompactSupport.hasFDerivAt_convolution_left` for the derivative), all supported in one
compact `K ⊆ Ω` on which `f`, `w` are integrable; pass to the limit in the defining identity by
dominated convergence. [brezis2011functional] §9.1, Remark 1 ("to show this, use a sequence of
mollifiers"); with it, every `C_c^1(Ω)` test function of the book's proofs (Lemma 9.2, Proposition
9.6, Proposition 9.18) is available. ★★, ~150 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "ContDiffBump.tendsto_eLpNorm_convolution_sub"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 1"

[[node]]
id = "HasWeakIteratedLineDerivOn.convolution_of_integrable"
kind = "theorem"
desc = '''**Lemma 9.1**: for `ρ ∈ L^1(μ)` and `HasWeakIteratedLineDerivOn ![y] v w ⊤ μ` with
`v, w ∈ L^p(μ)`, `1 ≤ p ≤ ∞`, one has
`HasWeakIteratedLineDerivOn ![y] (ρ ⋆[lsmul ℝ ℝ, μ] v) (ρ ⋆[lsmul ℝ ℝ, μ] w) ⊤ μ`. Unlike
`Mollification.lean`, `ρ` is not a bump, so `ρ ⋆ v` need not be smooth and the identity is proved
by Fubini: `∫ (ρ ⋆ v) ∂_y φ = ∫ ρ(t) (∫ v(x − t) ∂_y φ(x) dx) dt = −∫ ρ(t) (∫ w(x − t) φ(x) dx) dt
= −∫ (ρ ⋆ w) φ`, the inner identity being the weak derivative of the translate `v(· − t)` (a
translate of a weak derivative is a weak derivative of the translate — `iteratedFDeriv_comp_add_left`
on the test function, a small lemma `HasWeakIteratedLineDerivOn.comp_sub_const` to state
first), and the integrability for Fubini from Young's inequality
`MeasureTheory.eLpNorm_convolution_le` and Hölder. [brezis2011functional] Lemma 9.1 ("Adapt the
proof of Lemma 8.4"); the one-dimensional Lemma 8.4 of chapter 8 is the case `E = ℝ`. Companion:
the membership form is the next node. ★★, ~200 lines.'''
deps = ["HasWeakIteratedLineDerivOn", "MeasureTheory.eLpNorm_convolution_le"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Lemma 9.1"

