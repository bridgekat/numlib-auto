(`MeasureTheory.eLpNorm_le_eLpNorm_mul_eLpNorm_of_nnnorm` or `MemLp.integrable_smul_of_conjExponent`)
bounds it, `|w x y| ≤ ‖w x‖ ‖y‖`. [brezis2011functional] Proposition 9.3 ("(i) ⇒ (ii). Obvious",
and "we can take `C = ‖∇u‖_{L^p(Ω)}`"). Valid at `p = 1` too (Remark 6). ★, ~40 lines.'''
