[[node]]
id = "HasWeakFDerivOn.abs_integral_smul_fderiv_le"
kind = "theorem"
desc = '''**Proposition 9.3, (i) ⇒ (ii)**, with the book's constant: for `HasWeakFDerivOn u w Ω μ`,
`MemLp w p (μ.restrict Ω)`, `1 ≤ p ≤ ∞`, `p'` the conjugate exponent, every test function
`φ : 𝓓(Ω, ℝ)` and direction `y`: `‖∫ x in Ω, fderiv ℝ φ x y • u x ∂μ‖ₑ ≤ ‖y‖ₑ * eLpNorm w p (μ.restrict Ω) * eLpNorm φ p' (μ.restrict Ω)`.
