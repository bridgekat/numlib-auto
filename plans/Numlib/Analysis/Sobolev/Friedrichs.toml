desc = '''**Proposition 9.3, (iii) ⇒ (ii)**, any `1 ≤ p ≤ ∞`: if `u ∈ L^p(Ω)` and there is `C` with
`eLpNorm (fun x ↦ u (x + h) − u x) p (μ.restrict ω) ≤ ofReal C * ‖h‖ₑ` for every open `ω` with
compact closure in `Ω` and every `h` shorter than the distance from `closure ω` to `Ωᶜ`, then
`|∫ x in Ω, fderiv ℝ φ x y • u x ∂μ| ≤ C * ‖y‖ * ‖φ‖_{p'}` for every test function `φ` and
direction `y`. Proof ([brezis2011functional] Proposition 9.3, (iii) ⇒ (ii)): with `ω ⊇ supp φ`,
`∫ (τ_h u − u) φ = ∫ u (φ(· − h) − φ)` (translation invariance), so
`|∫ u (φ(y − t e) − φ(y))/t dy| ≤ C ‖e‖ ‖φ‖_{p'}` by Hölder against the hypothesis; as `t → 0`
the difference quotients of the smooth compactly supported `φ` converge uniformly to `−∂_e φ`
with supports in one compact, and `u` is integrable there, so dominated convergence gives the
claim. ★★, ~200 lines.'''
deps = ["HasWeakFDerivOn", "MeasureTheory.measurePreserving_sub_left_of_isAddRightInvariant"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.3 (iii) ⇒ (ii)"

[[node]]
id = "MemSobolev.of_tendsto_eLpNorm_of_eLpNorm_le"
kind = "theorem"
desc = '''**Remark 4 (i), second sentence**: for `1 < p ≤ ∞`, if `MemSobolev (u n) 1 p Ω μ`,
`u n → u` in `L^p(Ω)` and the weak gradients satisfy `eLpNorm (w n) p (μ.restrict Ω) ≤ M` for all
`n`, then `MemSobolev u 1 p Ω μ`. The bound (ii) of Proposition 9.3 passes to the limit:
`|∫ u ∂_y φ| = lim |∫ u_n ∂_y φ| = lim |∫ φ w_n y| ≤ M ‖y‖ ‖φ‖_{p'}`, and (ii) ⇒ (i) applies.
[brezis2011functional] Chapter 9, Remark 4 (i) ("When `1 < p ≤ ∞` it suffices to know … that
`(∇u_n)` is bounded … (why?)"). The first sentence of the remark, convergence of the gradients,
is `hasWeakIteratedFDerivOn_of_tendsto_eLpNorm` (`Density.toml`). ★, ~80 lines.'''
deps = ["HasWeakFDerivOn.of_forall_abs_integral_smul_fderiv_le", "HasWeakFDerivOn.abs_integral_smul_fderiv_le", "MemSobolev"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 4 (i)"

[[node]]
id = "HasWeakFDerivOn.exists_contDiffOn_ae_eq_of_continuousOn"
kind = "theorem"
desc = '''**Remark 2, converse**: if `HasWeakFDerivOn u w Ω μ` and `w` is continuous on `Ω`
(`ContinuousOn w Ω`), then there is `ũ : E → ℝ` with `ContDiffOn ℝ 1 ũ Ω`, `u =ᵐ[μ.restrict Ω] ũ`
and `∀ x ∈ Ω, fderiv ℝ ũ x = w x`. Proof: on a ball `B ⊆ Ω` (with `closedBall ⊆ Ω`), the
mollifications `u_ε = ρ_ε ⋆ u` are smooth with `∇u_ε = ρ_ε ⋆ w → w` *uniformly* on `B`
(`HasWeakIteratedFDerivOn.iteratedFDeriv_convolution` and uniform continuity of `w` on a compact
neighbourhood), and `u_ε → u` in `L^1(B)`; the mean value inequality makes `u_ε − u_ε(x_0)`
uniformly Cauchy on `B` hmm — rather: `u_ε(x) − u_ε(x') = ∫_0^1 ∇u_ε(x' + t(x − x'))·(x − x') dt`
converges uniformly, so `u_ε` minus its mean over `B` converges uniformly on `B` to a `C^1`
function with derivative `w` (`hasFDerivAt_of_tendstoUniformlyOn`,
`Mathlib/Analysis/Calculus/UniformLimitsDeriv.lean`), which agrees a.e. with `u` because both are
`L^1(B)`-limits of `u_ε` up to constants and the constants converge; glue the local
representatives (they agree a.e. on overlaps, hence everywhere by continuity) into one `ũ` on
`Ω`. [brezis2011functional] Chapter 9, Remark 2 ("Conversely, one can show that …"). ★★,
~250 lines. This is also the tool that makes the `C^k` representative of Corollary 9.13
(`Embedding.lean`) possible, so it is not optional.'''
deps = ["HasWeakFDerivOn", "HasWeakIteratedFDerivOn.iteratedFDeriv_convolution", "MemSobolev.exists_seq_contDiff_tendsto_eLpNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 2"

[[node]]
id = "HasWeakFDerivOn.exists_lipschitzOnWith_ae_eq_of_convex"
kind = "theorem"
desc = '''**Remark 7, convex case**: if `HasWeakFDerivOn u w Ω μ`, `Convex ℝ (Ω : Set E)`, and
`∀ᵐ x ∂μ.restrict Ω, ‖w x‖ ≤ M`, then there is `ũ` with `u =ᵐ[μ.restrict Ω] ũ` and
`LipschitzOnWith (Real.toNNReal M) ũ Ω`. Proof: for a convex open `ω ⊂⊂ Ω` at distance `> ε`
from `Ωᶜ`, the mollification `u_ε` is smooth on a neighbourhood of `ω` with
`‖∇u_ε‖ ≤ ‖ρ_ε ⋆ w‖ ≤ M` there, hence `M`-Lipschitz on the convex `ω` (mean value theorem,
`Convex.lipschitzOnWith_of_nnnorm_fderiv_le`); a subsequence converges a.e. to `u`, so
`|u(x) − u(y)| ≤ M |x − y|` for a.e. `x, y ∈ ω`, and an a.e.-Lipschitz function on a convex open set
has a Lipschitz representative (extend from a full-measure dense set by
`LipschitzOnWith.extend_real` / uniform continuity, `DenseInducing.extend`); the erosions
`Ω_ε` of a convex set are convex and exhaust `Ω`, and the representatives agree on overlaps.
[brezis2011functional] Chapter 9, Remark 7 ("in particular, if `Ω` is convex then
`dist_Ω(x, y) = |x − y|`"); the general geodesic-distance statement is not planned (Mathlib has no
intrinsic path metric). ★★, ~250 lines.'''
deps = ["HasWeakFDerivOn", "HasWeakIteratedFDerivOn.iteratedFDeriv_convolution", "MemSobolev.exists_seq_contDiff_tendsto_eLpNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 7"

[[node]]
id = "HasWeakFDerivOn.exists_continuousOn_ae_eq_of_ae_norm_le"
kind = "theorem"
desc = '''**Remark 7, first sentence, any open `Ω`**: a function of `W^{1,∞}(Ω)` has a continuous
representative on `Ω`: if `HasWeakFDerivOn u w Ω μ` and `∀ᵐ x ∂μ.restrict Ω, ‖w x‖ ≤ M`, then
`∃ ũ, ContinuousOn ũ Ω ∧ u =ᵐ[μ.restrict Ω] ũ`, and `ũ` is locally `M`-Lipschitz (on every ball
contained in `Ω`). Apply `HasWeakFDerivOn.exists_lipschitzOnWith_ae_eq_of_convex` on each ball
`B ⊆ Ω` (`HasWeakFDerivOn.mono`) and glue: two continuous functions agreeing a.e. on an open set
agree on it. ★★, ~120 lines.'''
deps = ["HasWeakFDerivOn.exists_lipschitzOnWith_ae_eq_of_convex", "HasWeakIteratedFDerivOn.mono"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 7"

[[node]]
id = "HasWeakFDerivOn.ae_eq_const_of_isPreconnected"
kind = "theorem"
desc = '''**Remark 7, last sentence**: if `HasWeakFDerivOn u w Ω μ` with `w =ᵐ[μ.restrict Ω] 0` and
`Ω` is connected (`IsPreconnected (Ω : Set E)`), then `u` is a.e. constant on `Ω`:
`∃ c, u =ᵐ[μ.restrict Ω] fun _ ↦ c`. By `HasWeakFDerivOn.exists_lipschitzOnWith_ae_eq_of_convex`
with `M = 0` on every ball, `u` agrees a.e. with a locally constant continuous function on `Ω`,
which is constant on the connected `Ω` (`IsPreconnected.constant` /
`IsLocallyConstant.apply_eq_of_isPreconnected`). For a general `Ω`, the statement on each
connected component follows by restriction (`HasWeakIteratedFDerivOn.mono` to a component, which
is open). [brezis2011functional] Chapter 9, Remark 7 ("if `∇u = 0` a.e. on `Ω`, then `u` is
constant on each connected component"). This is the `k = 1` case of "`|v|_{k,p,Ω} = 0` on a
connected open set forces a polynomial of degree `< k`", the second ingredient Atkinson–Han's
`theorem_7_3_12` lists. ★★, ~150 lines.'''
deps = ["HasWeakFDerivOn.exists_lipschitzOnWith_ae_eq_of_convex", "HasWeakIteratedFDerivOn.mono"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 7"
