`EmbeddingDomain.lean` and `Compactness.lean` is stated on the predicate and reached through
these two instances. ★, ~20 lines.'''
deps = ["SobolevEuclidean.exists_extensionL", "IsSobolevExtensionDomain", "IsContDiffDomain.isContDiffChartDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 9.7"

[[node]]
id = "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_isBounded_frontier"
kind = "theorem"
desc = '''**Corollary 9.8 (density), bounded boundary**: for `IsContDiffChartDomain 1 Ω`,
`Bornology.IsBounded (frontier Ω)` and `1 ≤ p < ∞`, every `u : SobolevEuclidean N 1 p Ω` is the
limit of restrictions of `C_c^∞(ℝ^N)` functions: there is `v : ℕ → EuclideanSpace ℝ (Fin N) → ℝ`
with `ContDiff ℝ ∞ (v n)`, `HasCompactSupport (v n)`, and `Tendsto (fun n ↦ ‖(v n).restrict − u‖) atTop (𝓝 0)`,
the restriction of `v n` being its class in `SobolevEuclidean N 1 p Ω`
(`TestFunction`-like membership: a `C_c^∞(ℝ^N)` function lies in `W^{1,p}(Ω)` by
`ContDiffOn.hasWeakIteratedFDerivOn` and `MemSobolevMultiIndex.exists_sobolevMultiIndex`). Proof:
the abstract density `SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_hasSobolevExtensionOn`
(`Cutoff.lean`: `P u ∈ W^{1,p}(ℝ^N)` is approximated by `ζ_n (ρ_n ⋆ P u)` and restriction to `Ω`
is `1`-Lipschitz) applied to the instance `IsSobolevExtensionDomain.of_isContDiffChartDomain`
(Theorem 9.7). [brezis2011functional] Corollary 9.8, first paragraph of the proof. Equivalently:
the subspace of restrictions of `C_c^∞(ℝ^N)` functions is dense in `SobolevEuclidean N 1 p Ω`
(`Dense` form, `…_dense`). This is Atkinson–Han's Theorem 7.3.2 at `k = 1` under `C^1` in place
of Lipschitz: `AtkinsonHan.Chapter07.theorem_7_3_2` restated with `IsContDiffDomain 1 Ω` (and
`IsContDiffDomain.isContDiffChartDomain`) becomes provable at `k = 1`; its higher `k` needs the
`C^m` extension of Comment 2, not planned. ★, ~20 lines.'''
deps = ["IsSobolevExtensionDomain.of_isContDiffChartDomain", "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_hasSobolevExtensionOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.8"

[[node]]
id = "SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto"
kind = "theorem"
desc = '''**Corollary 9.8 (density), general `C^1` domain**: the conclusion of
`SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_of_isBounded_frontier` without the
boundedness of `frontier Ω`. Proof ([brezis2011functional] Corollary 9.8, second paragraph):
given `ε`, `‖ζ_R u − u‖ < ε` for `R` large (`SobolevMultiIndex.tendsto_cutoff_smul`); `ζ_R u`
vanishes off `ball 0 (2R)`, so `SobolevEuclidean.exists_extensionL_of_atlas` with the compact
`K = frontier Ω ∩ closedBall 0 (3R)`, a finite atlas covering it
(`IsContDiffChartDomain.exists_finite_atlas_of_isCompact`) and the cut-off `χ = ζ_{3R/2}` (equal
to `1` on `ball 0 (2R)`, so `ζ_R u = χ ζ_R u` and `tsupport χ ∩ frontier Ω ⊆ K`) extends `ζ_R u`
to `v ∈ W^{1,p}(ℝ^N)`, and `w ∈ C_c^∞(ℝ^N)` with `‖w − v‖ < ε` restricts to within `2ε` of `u`.
★★★, ~250 lines. Consumed by Corollary 9.14's continuity clause on unbounded domains only through
Theorem 9.7 itself; kept because the book states it and it is Atkinson–Han 7.3.2's shape for
unbounded `C^1` domains.'''
deps = ["SobolevEuclidean.exists_extensionL_of_atlas", "SobolevMultiIndex.tendsto_cutoff_smul", "IsContDiffChartDomain.exists_finite_atlas", "MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Corollary 9.8"

[[node]]
id = "SobolevEuclidean.exists_extensionL_unitSquare"
kind = "theorem"
desc = '''**Remark 9 (the square by four reflections)**: for `Ω = (0,1) × (0,1) ⊆ ℝ^2`
(`{x | 0 < x 0 ∧ x 0 < 1 ∧ 0 < x 1 ∧ x 1 < 1}` as an `Opens (EuclideanSpace ℝ (Fin 2))`) and
`1 ≤ p ≤ ∞`, there are `P` and `C` as in `SobolevEuclidean.exists_extensionL` although `Ω` is
not of class `C^1`. Proof ([brezis2011functional] §9.2, Remark 9, Figure 6): reflect across
`x_2 = 0` (Lemma 9.2 with `v = e_2`, `V = (0,1) × (−1,1)`), then across `x_2 = 1` after
translating (the translation `x ↦ x − e_2` acts on `W^{1,p}` by
`HasWeakIteratedFDerivOn.comp_affineEquiv`), then across `x_1 = 0` and `x_1 = 1` with `v = e_1`,
reaching `ũ ∈ W^{1,p}((−1,3)^2)`; multiply by `ψ ∈ C_c^∞((−1,3)^2)` with `ψ = 1` on `Ω` and
extend by zero (`extendZeroMulL`). All linear, all bounded. ★★, ~250 lines; low priority — no
consumer, the general reflection lemma of `Reflection.lean` makes it cheap and the remark
explicitly displays it. Not extended to general rectangles or boxes, though the same proof
would.'''
deps = ["SobolevEuclidean.evenReflectionL", "HasWeakIteratedFDerivOn.comp_affineEquiv", "SobolevMultiIndex.extendZeroMulL", "SobolevEuclidean"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Remark 9"
