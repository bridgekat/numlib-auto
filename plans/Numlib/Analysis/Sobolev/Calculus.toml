the `L^p` bound `eLpNorm (fn (compDiffeoL h u)) p (volume.restrict Ω') ≤ C * eLpNorm (fn u) p (volume.restrict Ω)`
and `‖compDiffeoL h u‖ ≤ C' * ‖u‖`, constants depending on `M`, `N`, `p` only. Built from
