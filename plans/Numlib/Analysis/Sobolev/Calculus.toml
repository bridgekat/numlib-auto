[[node]]
id = "HasWeakIteratedFDerivOn.comp_affineEquiv"
kind = "theorem"
desc = '''**The affine change of variables at every order**: for an affine equivalence
`F : E ≃ᵃ[ℝ] E` with linear part `T`, `HasWeakIteratedFDerivOn n v w Ω μ` implies
`HasWeakIteratedFDerivOn n (v ∘ F) (fun x ↦ (w (F x)).compContinuousLinearMap fun _ ↦ T) (Ω.comap F) μ`
(the preimage `F ⁻¹' Ω` as an `Opens`), for an additive Haar measure `μ`. Proof: the test
function `φ ∘ F⁻¹` is a test function on `Ω`, `iteratedFDeriv ℝ n (φ ∘ F) x z = iteratedFDeriv ℝ n φ (F x) (T ∘ z)`
by `ContinuousLinearMap.iteratedFDeriv_comp_right` and `iteratedFDeriv_comp_add_left` (the pair
`Mollification.lean` already uses), and the substitution `x ↦ F x` in the integral is
`MeasureTheory.Measure.map_linearMap_addHaar_eq_smul_addHaar` / `integral_map`, whose constant
`|det T|⁻¹` cancels between the two sides. This is piece (2), "the missing backbone lemma", of
the route recorded on `AtkinsonHan.Chapter10.theorem_10_3_4` (`plans/NumlibSurface/AtkinsonHan/Chapter10/Section03.toml`),
the affine and higher-order sibling of Proposition 9.6; `MemSobolev.comp_affineEquiv` and the
seminorm bound with the explicit constant are that node's pieces (3)–(4) and stay there. ★★,
~200 lines.'''
deps = ["HasWeakIteratedFDerivOn", "TestFunction.compConstSub"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 9.6 (affine case, all orders); Atkinson–Han, Theoretical Numerical Analysis, Theorem 10.3.4"

[[node]]
id = "MemSobolevMultiIndex.posPart"
kind = "theorem"
desc = '''**The positive part of a `W^{1,p}` function**: for `u ∈ W^{1,p}(Ω)`, `1 ≤ p ≤ ∞`, the function
`u⁺ = max u 0` lies in `W^{1,p}(Ω)`, with `∂_i u⁺ = {u > 0}.indicator (∂_i u)` a.e.; likewise
`u⁻ = max (-u) 0` and `|u| = u⁺ + u⁻` with `∂_i |u| = sign(u) ∂_i u`. This is the Lipschitz case
of Proposition 9.5 that the book does not state (Gilbarg–Trudinger, *Elliptic Partial Differential
Equations of Second Order*, Lemma 7.6, and Kinderlehrer–Stampacchia Theorem A.1); it is what makes
the obstacle set `{v ∈ H_0^1(Ω) : v ≥ ψ}` nonempty (`ψ⁺ ∈ H^1`) in Atkinson–Han's chapter-11
examples. Proof: apply `MemSobolevMultiIndex.contDiff_comp` to `G_ε s = √(s² + ε²) - ε` for
`s > 0`, `0` otherwise (`C^1`, `G_ε 0 = 0`, `|G_ε'| ≤ 1`), so
`∫ G_ε(u) ∂_i φ = -∫ (u/√(u²+ε²)) {u > 0}.indicator (∂_i u) φ`; let `ε → 0` by dominated
convergence on both sides (`G_ε(u) → u⁺` pointwise with `|G_ε(u)| ≤ |u|`, the integrand on the
right tends to `{u > 0}.indicator (∂_i u) φ` and is bounded by `|∂_i u φ|`). A by-product is
`∇u = 0` a.e. on `{u = 0}` (Comment 4 of [brezis2011functional] chapter 9), from
`u = u⁺ - u⁻` and the two indicator identities. ★★★ (~300 lines; the `p = ∞` case by locality
as in `contDiff_comp`).'''
deps = ["MemSobolevMultiIndex.contDiff_comp", "HasWeakIteratedLineDerivOn.contDiff_comp", "MemSobolevMultiIndex"]
source = "Gilbarg and Trudinger, Elliptic Partial Differential Equations of Second Order, Lemma 7.6; Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 9, Comment 4"
