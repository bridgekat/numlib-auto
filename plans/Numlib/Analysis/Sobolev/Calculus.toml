`MemSobolevMultiIndex.exists_sobolevMultiIndex`, linearity by `SobolevMultiIndex.ext_of_fn_ae_eq`.
These are the "transfer" and "retransfer" maps `v_i = u ∘ H_i`, `w_i = v_i^⋆ ∘ H_i⁻¹` of the
proof of [brezis2011functional] Theorem 9.7, step (b). ★★, ~200 lines.'''
