desc = '''
An elementary lower bound for `-b + √(b² + a c)` (Cartis–Gould–Toint Lemma B.3.1, from
Royer–Wright), used to turn the quadratic inequality on a step length into an explicit lower
bound (Lemma 3.4.3 of the book).
'''

[[node]]
id = "neg_add_sqrt_sq_add_mul_ge"
kind = "theorem"
desc = '''
For `a > 0`, `b > 0`, `c ≥ 0`: `(-b + √(b^2 + a)) * min 1 c ≤ -b + √(b^2 + a * c)`.
Moreover `-b + √(b² + a) = a / (b + √(b² + a))` (rationalization), used to rewrite the bound as
`a min(1,c) / (b + √(b² + a))`.
'''
source = "Cartis–Gould–Toint, Lemma B.3.1"
