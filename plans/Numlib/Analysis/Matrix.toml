desc = 'Matrices as operators on Euclidean space, their operator and spectral norms, their singular-value inequalities (`SingularValues`: the matrix corollaries of the operator theory in `Analysis/InnerProductSpace/SingularValues` — Weyl, Mirsky, Eckart–Young, column deletion, the subspace distance, the pseudoinverse norms), and functions of matrices (`Function/`: the primary functional calculus, its agreement with `NormedSpace.exp` and the continuous functional calculus, and the exponential, sign, square root, logarithm and polar iterations of [golub2013matrix] Chapter 9).'
