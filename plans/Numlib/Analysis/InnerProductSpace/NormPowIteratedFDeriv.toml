desc = '''
Derivatives of all orders of `x ↦ ‖x‖ ^ λ` on a real inner product space `E`, everywhere including
the origin, with sharp **operator-norm** bounds. These are the regularization terms
`σ/(p+1)! ‖s‖^{p+1}` (and `‖s‖^{p+β}`) of adaptive-regularization models
(Cartis–Gould–Toint Lemma B.4.1, used in Chapters 4–6, 12–14). This is the single home of this
material: it consolidates the former plans `NormPowIteratedDeriv` (plan-ch12, plan-ch05) and
`NormPowSucc` (plan-ch13), and Chapter 6's `abs_iteratedFDeriv_three_norm_pow_le`. Orders 1 and 2
(real exponent, explicit formulas) are in `NormPowHessian`; smoothness off `0`, homogeneity and the
radial and perpendicular values are in `NormPow` (proved).

Notation: `π_j(λ) := ∏ i ∈ range j, (λ - i)`. For `λ = p + β` and `j ≤ p` this is the book's
`(p+β)!/(p-j+β)!` (`holderFactorial p β / holderFactorial (p-j) β`). For `λ = r : ℕ` and
`j ≤ r` it is `r!/(r-j)!` (`Nat.descFactorial`).

**Key idea: an averaging identity, so Banach's theorem is not needed.** On a finite-dimensional
`E`, rotation invariance of Lebesgue measure on `ball 0 1` gives
`‖y‖^λ = κ⁻¹ ∫_{ball 0 1} |⟪y, ω⟫|^λ dω`. Differentiating under the integral `j ≤ λ` times gives
`D^j(‖·‖^λ)(x)[v₁,…,v_j] = π_j(λ) κ⁻¹ ∫ |⟪x,ω⟫|^{λ-j} sgn(⟪x,ω⟫)^j ∏ ⟪v_i,ω⟫ dω`.
The generalized Hölder inequality, with exponents `λ/(λ-j), λ, …, λ`, then bounds this by
`π_j(λ) ‖x‖^{λ-j} ∏ ‖v_i‖`. That is the **operator-norm** bound (B.4.1) for every real `λ ≥ j`,
and it is sharp at `v_i = x`. This replaces two earlier routes: the "radial maximum" claim of the
book's proof, which is unjustified because of mixed signs in (B.4.9), and the planned
Gegenbauer coefficient inequality, whose proof was unknown. It also makes Banach's theorem on
symmetric multilinear forms (operator norm = diagonal sup) unnecessary for this book, so that
module is dropped. The identity was checked numerically against exact derivatives
(e.g. `λ = 5, j = 4`; `λ = 4.3, j = 4`; `λ = r = 3, 5`).

Mathlib ingredients:
- `LinearIsometryEquiv.measurePreserving` (rotation invariance)
- `hasFDerivAt_integral_of_dominated_loc_of_lip` (differentiation under the integral; at step
  `k → k+1` the integrand `|u|^{λ-k} sgn(u)^k` is locally Lipschitz because `λ - k ≥ 1`)
- `ENNReal.lintegral_mul_prod_norm_pow_le` (generalized Hölder)

A general `E` reduces to the finite-dimensional span of `x` and the arguments `v_i`.

**Source error (Lemma B.4.1 (B.4.3)).** `‖∇^{p+1}(‖s‖^{p+β})‖ = β (p+β)! ‖s‖^{β-1}` is false for
every `β ∈ (0,1)`: the right side is only the radial value. Counterexample: `p = 1`, `β = 1/2`,
`s = e₁ ∈ ℝ²`, where `D²(‖·‖^{3/2})(e₁)[e₂,e₂] = 3/2 > 3/4`. Here `j = p + 1 > λ`, outside the
range of the Hölder argument. For `β = 1`, the only case the book uses (Chapters 4, 12, 14), it
holds: `‖∇^{p+1}‖s‖^{p+1}‖ = (p+1)!` for `s ≠ 0`, the case `j = λ`.

Planned consumers:
- the regularized-model lemmas of `Optimization/ModelBased` (`regularizedModel`, (4.1.30),
  Lemma 12.2.7, (13.1.48)–(13.1.50), (6.2.23))
- `Optimization/Composite/RegularizedModel`
- surface Lemma B.4.1, Lemma 4.1.3, Lemma 12.2.7 and Example 12.1.3
'''

[[node]]
id = "exists_integral_abs_inner_rpow_eq"
kind = "theorem"
desc = '''
Averaging identity. Let `E` be a finite-dimensional, nontrivial real inner product space with its
volume, and let `0 ≤ λ`. Then there is `κ > 0` such that for all `y : E`:
`∫ ω in ball (0 : E) 1, |⟪y, ω⟫| ^ λ = κ * ‖y‖ ^ λ`.
`κ` is the integral for any unit vector `e`.
Proof: for `y ≠ 0`, pick a linear isometry equivalence mapping `y/‖y‖` to `e` (e.g. a reflection,
Mathlib `reflection`). Then use `LinearIsometryEquiv.measurePreserving` (the ball is invariant)
and homogeneity.
Positivity: the integrand is positive off the hyperplane `⟪e,·⟫ = 0`, a null set, and the ball has
positive measure.
'''
source = "Cartis–Gould–Toint, Lemma B.4.1 (proof device replacing (B.4.4)–(B.4.10))"

[[node]]
id = "iteratedFDeriv_normRpow_eq_integral"
kind = "theorem"
desc = '''
Integral formula for the derivatives.

Setting: `E` finite-dimensional and nontrivial; `κ > 0` as in `exists_integral_abs_inner_rpow_eq`
for the exponent `λ`; `j : ℕ` with `(j : ℝ) ≤ λ`; `x : E` with `x ≠ 0 ∨ (j : ℝ) < λ`;
`v : Fin j → E`.

Claim: `iteratedFDeriv ℝ j (fun y => ‖y‖ ^ λ) x v = (∏ i ∈ range j, (λ - i)) / κ *
∫ ω in ball 0 1, |⟪x, ω⟫| ^ (λ - j) * SignType.sign ⟪x, ω⟫ ^ j * ∏ i, ⟪v i, ω⟫`.
The statement elaborates: `drafts/cgt/cons-b/NormPow.lean`.

Proof: induction on `j`, applying `hasFDerivAt_integral_of_dominated_loc_of_lip` to
`y ↦ |⟪y,ω⟫|^{λ-k} sgn(⟪y,ω⟫)^k` for `k < j`. For each such `k`:
- `λ - k ≥ 1`, so the integrand is Lipschitz near `x` with a bounded constant;
- for every `ω` off the null hyperplane `⟪x,ω⟫ = 0`, the derivative at `x` is
  `(λ-k) |⟪x,ω⟫|^{λ-k-1} sgn^{k+1} ⟪·,ω⟫`.

For `x = 0` and `j < λ` both sides vanish when `j ≥ 1`.
Corollaries (part of node):
- the same formula on a neighbourhood gives continuity of each derivative;
- the identity `iteratedFDeriv ℝ j f x = A` as a multilinear map (`ext`).
'''
deps = ["exists_integral_abs_inner_rpow_eq", "contDiffOn_normRpow"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (proof device)"

[[node]]
id = "iteratedFDeriv_normRpow_apply_self"
kind = "theorem"
desc = '''
Radial values (B.4.2), for any real `λ` and any `j`. For `x ≠ 0`:
`iteratedFDeriv ℝ j (fun y : E => ‖y‖ ^ λ) x (fun _ => x) = (∏ i ∈ range j, (λ - i)) * ‖x‖ ^ λ`.
Proof: `iteratedFDeriv_normRpow_apply_unit` and multilinearity (`[x]^j = ‖x‖^j [x̂]^j`).
For `λ = p + β`, the product is:
- `holderFactorial p β / holderFactorial (p - j) β` when `j ≤ p`;
- `β * holderFactorial p β` when `j = p + 1`.
'''
deps = ["iteratedFDeriv_normRpow_apply_unit", "holderFactorial"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (B.4.2)"

[[node]]
id = "norm_iteratedFDeriv_normRpow_le"
kind = "theorem"
desc = '''
Sharp operator-norm bound (B.4.1) on any real inner product space `E`. For `j : ℕ` with
`(j : ℝ) ≤ λ` and `x ≠ 0 ∨ (j : ℝ) < λ`:
`‖iteratedFDeriv ℝ j (fun y : E => ‖y‖ ^ λ) x‖ ≤ (∏ i ∈ range j, (λ - i)) * ‖x‖ ^ (λ - j)`.
Diagonal form (part of node): `|D^j(‖·‖^λ)(x)[v]^j| ≤ π_j(λ) ‖x‖^{λ-j} ‖v‖^j`.

Proof, finite-dimensional `E`:
1. `iteratedFDeriv_normRpow_eq_integral`.
2. The generalized Hölder inequality, with exponents `λ/(λ-j)` for `|⟪x,ω⟫|^{λ-j}` and `λ` for
   each `|⟪v_i,ω⟫|` (reciprocals sum to `1`). If `j = λ` the first factor is `1`.
3. `exists_integral_abs_inner_rpow_eq` for each factor, which gives
   `κ ‖x‖^{λ-j} ∏ ‖v_i‖`.

General `E`: restrict to the finite-dimensional subspace `K = span {x, v_1, …, v_j}`. The
iterated derivative of `‖·‖^λ ∘ K.subtypeL` at `x` is the restriction, which is enough for the
evaluation at `v`. Use `ContinuousLinearMap.iteratedFDeriv_comp_right`, with smoothness near `x`
from `contDiffOn_normRpow` when `x ≠ 0`, and from `contDiff_normRpow_of_lt` otherwise.
'''
deps = ["iteratedFDeriv_normRpow_eq_integral", "exists_integral_abs_inner_rpow_eq", "contDiffOn_normRpow"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (B.4.1)"

[[node]]
id = "norm_iteratedFDeriv_normRpow"
kind = "theorem"
desc = '''
Operator norm, equality form of (B.4.1). For nontrivial `E`, `x ≠ 0` and `j : ℕ` with
`(j : ℝ) ≤ λ`: `‖iteratedFDeriv ℝ j (fun y : E => ‖y‖ ^ λ) x‖ = (∏ i ∈ range j, (λ - i)) * ‖x‖ ^ (λ - j)`.
- Upper bound: `norm_iteratedFDeriv_normRpow_le`.
- Lower bound: evaluate at `v_i = x/‖x‖` (`iteratedFDeriv_normRpow_apply_self`); the product is
  `≥ 0` for `j ≤ λ`.

For `λ = j = p + 1` this is the book's (B.4.3) with `β = 1`: `‖∇^{p+1}(‖s‖^{p+1})‖ = (p+1)!`
for `s ≠ 0`.
'''
deps = ["norm_iteratedFDeriv_normRpow_le", "iteratedFDeriv_normRpow_apply_self"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (B.4.1), (B.4.3) with β = 1"

[[node]]
id = "contDiff_normRpow_of_lt"
kind = "theorem"
desc = '''
Global smoothness: for `j : ℕ` with `(j : ℝ) < λ`, `ContDiff ℝ j (fun y : E => ‖y‖ ^ λ)`, and
`iteratedFDeriv ℝ i (fun y => ‖y‖ ^ λ) 0 = 0` for `1 ≤ i ≤ j`. If `λ = 2 m` with `m : ℕ`, the
function is a polynomial (`ContDiff ℝ ⊤`).

Proof: off `0` use `contDiffOn_normRpow`. At `0`, the bound `‖D^i(‖·‖^λ)(y)‖ ≤ π_i(λ) ‖y‖^{λ-i}`
(`norm_iteratedFDeriv_normRpow_le`, or `exists_norm_iteratedFDeriv_normRpow_le` in finite
dimension) shows each derivative of order `i ≤ j` extends continuously by `0`, with derivative
`0`, by induction on `i` using `λ - i > 0`. This makes the regularized model `C^p` everywhere
(`λ = p + 1 > p`).
'''
deps = ["contDiffOn_normRpow", "exists_norm_iteratedFDeriv_normRpow_le", "fderiv_norm_rpow_apply"]
source = "Cartis–Gould–Toint, (4.1.2) (the model is p times differentiable)"

[[node]]
id = "not_norm_iteratedFDeriv_normRpow_eq_radial"
kind = "theorem"
desc = '''
Counterexample to (B.4.3) for fractional `β`. Take `E = EuclideanSpace ℝ (Fin 2)`, `λ = 3/2`
(`p = 1`, `β = 1/2`), `x = e₀`. Then `iteratedFDeriv ℝ 2 (fun y => ‖y‖ ^ (3/2 : ℝ)) x ![e₁, e₁] = 3/2`,
by `iteratedFDeriv_normRpow_apply_perp` and `iteratedDeriv_one_add_sq_rpow_two_mul` with
`j = 1`. So `‖D²(‖·‖^{3/2})(e₀)‖ ≥ 3/2 > 3/4 = β (p + β)! ‖x‖^{β - 1}`.

More generally, for every `p : ℕ` and `β ∈ (0,1)` the radial value
`β (p+β)! ‖x‖^{β-1}` is strictly smaller than the norm. That general claim is not planned; this
node is the `p = 1` instance.
'''
deps = ["iteratedFDeriv_normRpow_apply_perp", "iteratedDeriv_one_add_sq_rpow_two_mul"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (B.4.3) (false for β < 1)"

[[node]]
id = "convexOn_iteratedFDeriv_normRpow"
kind = "theorem"
desc = '''
Convexity claims of Lemma B.4.1. Let `x ≠ 0`, `j : ℕ`, `(j : ℝ) ≤ λ + 1`.

(a) On the orthogonal complement `(ℝ ∙ x)ᗮ`, `d ↦ iteratedFDeriv ℝ j (‖·‖^λ) x (fun _ => d)`
equals `‖x‖^{λ-j} h^{(j)}(0) ‖d‖^j` with `h τ = (1 + τ²)^{λ/2}`
(`iteratedFDeriv_normRpow_apply_perp` and homogeneity).
- For odd `j` it is `0`, since `h` is even.
- For even `j` it is `∏_{i<j/2} (2i+1)(λ-2i) ‖x‖^{λ-j} ‖d‖^j`
  (`iteratedDeriv_one_add_sq_rpow_two_mul`), with a nonnegative coefficient because
  `λ - 2i ≥ 0` for `2i ≤ j - 2`.

Hence it is `ConvexOn ℝ (ℝ ∙ x)ᗮ`.

(b) For even `j`, `t ↦ iteratedFDeriv ℝ j (‖·‖^λ) x (fun _ => t • x) = t^j ∏_{i<j}(λ - i) ‖x‖^λ`
is convex on `ℝ`, since the product is `≥ 0` for `j ≤ λ + 1`.

The book states (b) "for any multiple of `s` whenever `j` is even" without the range of `j`. For
`j > λ + 1` the coefficient can be negative.
'''
deps = ["iteratedFDeriv_normRpow_apply_perp", "iteratedDeriv_one_add_sq_rpow_two_mul", "iteratedFDeriv_normRpow_apply_self"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (convexity statements)"

[[node]]
id = "contDiff_norm_pow"
kind = "theorem"
desc = '''
Natural exponents (Lean `‖s‖ ^ r` with `r : ℕ`, i.e. `Monoid.npow`, which is how all regularized
models are written).
- For `r : ℕ` with `1 ≤ r`: `ContDiff ℝ (r - 1) (fun s : E => ‖s‖ ^ r)`.
- `ContDiff ℝ ⊤` when `r` is even, since `‖s‖^r = ⟪s,s⟫^{r/2}`.
- `ContDiffAt ℝ ⊤` at every `s ≠ 0`.

In particular `‖·‖^{p+1}` is `C^p` (the `r = p + 1` case), so `regularizedModel D p σ` is
`ContDiff ℝ p`.
Proof: `Real.rpow_natCast` (`funext`) reduces to `contDiff_normRpow_of_lt` (`r - 1 < r`) and
`contDiffOn_normRpow`.
'''
deps = ["contDiff_normRpow_of_lt", "contDiffOn_normRpow"]
source = "Cartis–Gould–Toint, Lemma 12.2.7 (the model is p times continuously differentiable), Lemma B.4.1"

[[node]]
id = "iteratedFDeriv_norm_pow_apply_self"
kind = "theorem"
desc = '''
(B.4.2) for natural exponents. For `r ℓ : ℕ`, `ℓ ≤ r`, `s : E` with `s ≠ 0 ∨ ℓ < r`:
`iteratedFDeriv ℝ ℓ (fun s => ‖s‖ ^ r) s (fun _ => s) = r ! / (r - ℓ) ! * ‖s‖ ^ r`.
At `s = 0` with `0 < ℓ < r` both sides vanish.
Proof: `iteratedFDeriv_normRpow_apply_self` with `Real.rpow_natCast`, and
`∏_{i<ℓ} (r - i) = r.descFactorial ℓ`.
'''
deps = ["iteratedFDeriv_normRpow_apply_self", "contDiff_norm_pow"]
source = "Cartis–Gould–Toint, (B.4.2)"

