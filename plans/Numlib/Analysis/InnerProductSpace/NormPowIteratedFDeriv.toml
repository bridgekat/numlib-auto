[[node]]
id = "iteratedFDerivLipschitzOn_norm_pow"
kind = "theorem"
desc = '''
For `r : ℕ` with `1 ≤ r`:
`IteratedFDerivLipschitzOn (fun s : E => ‖s‖ ^ r) (r - 1) (r ! : ℝ) Set.univ`.
So the `p`-th derivative of `‖·‖^{p+1}` is `(p+1)!`-Lipschitz, which is the content of (B.4.3)
with `β = 1` as used in Lemma 12.2.7, (13.1.45) and Chapter 14.

Proof (no smoothness at `0` needed), first for finite-dimensional `E`:
- the integral formula at order `r - 1` (exponent `λ = r`, valid at every point since
  `r - 1 < r`) has integrand `|⟪x,ω⟫| sgn(⟪x,ω⟫)^{r-1} ∏ ⟪v_i,ω⟫`;
- `u ↦ |u| sgn(u)^{r-1}` is `1`-Lipschitz, so the difference at `x, y` is at most
  `r!/κ ∫ |⟪x-y,ω⟫| ∏|⟪v_i,ω⟫|`;
- generalized Hölder with exponents all equal to `r` gives `≤ r! ‖x-y‖ ∏‖v_i‖`.

General `E` follows by restriction to finite-dimensional subspaces, as in
`norm_iteratedFDeriv_normRpow_le`. Alternatively, Theorem A.8.5
(`iteratedFDerivLipschitzOn_of_norm_le`) on segments avoiding `0` with
`norm_iteratedFDeriv_norm_pow_le` at `ℓ = r`, plus continuity.

Generalization (not planned, no consumer): `D^p(‖·‖^{p+β})` is `β`-Hölder with constant
`2^{1-β} π_p(p+β)`, by the same argument.
'''
deps = ["iteratedFDeriv_normRpow_eq_integral", "exists_integral_abs_inner_rpow_eq", "norm_iteratedFDeriv_norm_pow_le", "iteratedFDerivLipschitzOn_of_norm_le", "IteratedFDerivLipschitzOn"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (B.4.3) with β = 1; proof of Lemma 12.2.7"

