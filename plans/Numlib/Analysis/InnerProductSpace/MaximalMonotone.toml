[[node]]
id = "IsMaximalMonotone.re_inner_yosida_sub_yosida_ge"
kind = "theorem"
desc = '''The algebraic inequality (12) of Step 3 of the proof of Theorem 7.4
([brezis2011functional] lines 7037–7049), stated for arbitrary vectors: for `hA`, `0 < c`,
`0 < d` and `x y : H`,
`re ⟪A.yosida c x − A.yosida d y, c • A.yosida c x − d • A.yosida d y⟫ ≤
  re ⟪A.yosida c x − A.yosida d y, x − y⟫`.
Proof: write `x − y = (x − J_c x) + (J_c x − J_d y) + (J_d y − y) = c A_c x − d A_d y +
