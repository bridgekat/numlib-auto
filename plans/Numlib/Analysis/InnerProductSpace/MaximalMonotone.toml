`exists_add_apply_eq : ∀ f : H, ∃ u : A.domain, (u : H) + A u = f` (the book's `R(I + A) = H`,
[brezis2011functional] §7.1, Definition). Shape settled in
`notes/brezis/ch07/proto/MaximalMonotone.lean`. ★'''
deps = ["IsMonotone"]
