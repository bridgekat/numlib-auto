id = "IsMonotone"
kind = "definition"
desc = '''`A.IsMonotone` for `A : H →ₗ.[𝕜] H`: `∀ v : A.domain, 0 ≤ re ⟪A v, (v : H)⟫`
([brezis2011functional] §7.1, Definition; "accretive" in other authors' words). Over `𝕜 = ℝ`
the `re` is the identity. ★'''
deps = []
source = "[brezis2011functional] §7.1, Definition"

