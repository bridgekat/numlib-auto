[[node]]
id = "IsMaximalMonotone.range_id_vadd_eq_top"
kind = "theorem"
desc = '''The book's spelling of the second field: for `hA : A.IsMaximalMonotone`,
`LinearMap.range ((LinearMap.id : H →ₗ[𝕜] H) +ᵥ A).toFun = ⊤`, where `LinearMap.id +ᵥ A` is
Mathlib's `I + A` on `A.domain` (`LinearPMap.instVAdd`, `vadd_apply`). Proved in the prototype
in four lines; also state the converse `of_range_id_vadd_eq_top`. ★'''
deps = ["IsMaximalMonotone"]
source = "[brezis2011functional] §7.1, Definition"

[[node]]
id = "IsMonotone.norm_le_norm_add_smul"
kind = "theorem"
desc = '''For a monotone `A`, `0 ≤ c` and `u : A.domain`, `‖(u : H)‖ ≤ ‖(u : H) + (c : 𝕜) • A u‖`.
The one estimate behind Proposition 7.1: `‖u‖² ≤ ‖u‖² + c re ⟪A u, u⟫ = re ⟪u + c A u, u⟫ ≤
‖u + c A u‖ ‖u‖` ([brezis2011functional] proof of Proposition 7.1 (b), `|u| ≤ |f|`). ★'''
deps = ["IsMonotone"]
source = "[brezis2011functional] Proposition 7.1"

[[node]]
id = "IsMonotone.injective_add_smul"
kind = "theorem"
desc = '''For a monotone `A` and `0 ≤ c`, `u ↦ (u : H) + (c : 𝕜) • A u` is injective on
`A.domain` (the uniqueness clause of Proposition 7.1 (b), (c)): apply
`norm_le_norm_add_smul` to `u - v`. ★'''
deps = ["IsMonotone.norm_le_norm_add_smul"]
source = "[brezis2011functional] Proposition 7.1"

[[node]]
id = "IsMaximalMonotone.dense_domain"
kind = "theorem"
desc = '''Proposition 7.1 (a): `Dense (A.domain : Set H)`. Via `Submodule.dense_iff_orthogonal`-type
reasoning or directly `Dense` from "`⟪f, v⟫ = 0` on `D(A)` implies `f = 0`": solve
`v₀ + A v₀ = f`, then `0 = re ⟪f, v₀⟫ = ‖v₀‖² + re ⟪A v₀, v₀⟫ ≥ ‖v₀‖²`, so `v₀ = 0` and `f = 0`
([brezis2011functional] proof of Proposition 7.1 (a)). Use
`Submodule.orthogonal_eq_bot_iff` / `Submodule.topologicalClosure_eq_top_iff` to turn the
orthogonality statement into density. ★'''
deps = ["IsMaximalMonotone", "IsMonotone.norm_le_norm_add_smul"]
source = "[brezis2011functional] Proposition 7.1 (a)"

[[node]]
id = "IsMaximalMonotone.exists_add_smul_eq"
kind = "theorem"
desc = '''Proposition 7.1 (c), the surjectivity clause: for `hA : A.IsMaximalMonotone` and every
`0 < c`, `∀ f : H, ∃ u : A.domain, (u : H) + (c : 𝕜) • A u = f`. Proof ([brezis2011functional]
proof of Proposition 7.1 (c), lines 6811–6832): the auxiliary statement "if `I + c₀ A` is onto
for some `c₀ > 0` then `I + c A` is onto for every `c > c₀ / 2`" — writing `u + c A u = f` as
`u = J_{c₀} ((c₀/c) f + (1 − c₀/c) u)`, the right-hand side is a contraction of `H` with constant
`|1 − c₀/c| < 1` because `‖J_{c₀}‖ ≤ 1` (`norm_le_norm_add_smul` gives the bound for the
inverse of `I + c₀ A`, which exists on all of `H` by hypothesis and `injective_add_smul`);
Mathlib's `ContractingWith.fixedPoint` (Theorem 5.7) gives the fixed point. Then induction on
`n` from `c₀ = 1`: `I + cA` is onto for every `c > 2⁻ⁿ`. The formalizer should state the
auxiliary step as its own lemma (`exists_add_smul_eq_of_exists_add_smul_eq`, taking the
surjectivity at `c₀` as a hypothesis) so that the contraction argument is written once. ★★'''
deps = ["IsMaximalMonotone", "IsMonotone.norm_le_norm_add_smul", "IsMonotone.injective_add_smul"]
source = "[brezis2011functional] Proposition 7.1 (c)"

[[node]]
id = "resolvent"
kind = "definition"
desc = '''`A.resolvent c : H →L[𝕜] H` for `c : ℝ`, the resolvent `J_c = (I + cA)⁻¹`
([brezis2011functional] §7.1, Definition after Remark 1), total in `(A, c)`: by classical
choice, some bounded `J` with `∀ f, ∃ hf : J f ∈ A.domain, J f + (c : 𝕜) • A ⟨J f, hf⟩ = f`
if one exists, else `0` (Mathlib's junk-value pattern for `LinearPMap.adjoint`). Such a `J` is
unique when `I + cA` is injective, which every lemma below assumes through `IsMaximalMonotone`
and `0 < c`. Prototype: `notes/brezis/ch07/proto/MaximalMonotone.lean`. ★'''
deps = []
source = "[brezis2011functional] §7.1, Definition of the resolvent"

[[node]]
id = "IsMaximalMonotone.resolvent_apply_mem_domain"
kind = "theorem"
desc = '''For `hA : A.IsMaximalMonotone` and `0 < c`, `A.resolvent c f ∈ A.domain` for every
`f`. Together with `resolvent_add_smul_apply` this is the specification of `resolvent`; both
follow from `exists_add_smul_eq` (which produces the required `J` as a linear map by
`injective_add_smul` and makes it continuous by `LinearMap.mkContinuous` with the bound
`norm_le_norm_add_smul`), so that the `if` in the definition takes its first branch. ★'''
deps = ["resolvent", "IsMaximalMonotone.exists_add_smul_eq", "IsMonotone.injective_add_smul", "IsMonotone.norm_le_norm_add_smul"]
source = "[brezis2011functional] §7.1, Definition of the resolvent"

[[node]]
id = "IsMaximalMonotone.resolvent_add_smul_apply"
kind = "theorem"
desc = '''For `hA : A.IsMaximalMonotone` and `0 < c`:
`A.resolvent c f + (c : 𝕜) • A ⟨A.resolvent c f, hA.resolvent_apply_mem_domain hc f⟩ = f`. ★'''
deps = ["IsMaximalMonotone.resolvent_apply_mem_domain"]
source = "[brezis2011functional] §7.1, Definition of the resolvent"

[[node]]
id = "IsMaximalMonotone.resolvent_eq_iff"
kind = "theorem"
desc = '''Uniqueness: for `hA`, `0 < c`, `u : A.domain` and `f : H`,
`A.resolvent c f = u ↔ (u : H) + (c : 𝕜) • A u = f`; and the corollary
`resolvent_apply_add_smul : A.resolvent c ((u : H) + (c : 𝕜) • A u) = u`, i.e. `J_c (I + cA) = I`
on `D(A)`. From `injective_add_smul`. ★'''
deps = ["IsMaximalMonotone.resolvent_add_smul_apply", "IsMonotone.injective_add_smul"]
source = "[brezis2011functional] Proposition 7.1 (c)"

[[node]]
id = "IsMaximalMonotone.norm_resolvent_le_one"
kind = "theorem"
desc = '''Proposition 7.1 (c), the bound: for `hA` and `0 < c`, `‖A.resolvent c‖ ≤ 1`, with the
pointwise form `norm_resolvent_apply_le : ‖A.resolvent c f‖ ≤ ‖f‖`. From `norm_le_norm_add_smul`
applied to `J_c f`, then `ContinuousLinearMap.opNorm_le_bound`. ★'''
deps = ["IsMaximalMonotone.resolvent_add_smul_apply", "IsMonotone.norm_le_norm_add_smul"]
source = "[brezis2011functional] Proposition 7.1 (c)"

[[node]]
id = "IsMaximalMonotone.isClosed"
kind = "theorem"
desc = '''Proposition 7.1 (b): a maximal monotone operator is closed, `A.IsClosed` (Mathlib's
closed graph). Proof ([brezis2011functional] lines 6805–6810): if `u_n ∈ D(A)`, `u_n → u`,
`A u_n → f`, then `u_n = J_1 (u_n + A u_n) → J_1 (u + f)`, so `u = J_1 (u + f) ∈ D(A)` and
`u + A u = u + f`. Work with the graph directly: `IsClosed` of the graph via
`isSeqClosed_iff_isClosed` (as `AtkinsonHan.Chapter08.isClosed_iff_seq` does in the surface;
that lemma is a surface node, so reprove the two-line reduction here or use
`IsClosed.mem_of_tendsto` on the closed set `{p | p.1 = J_1 (p.1 + p.2)}`, which is the
preimage of the diagonal under a continuous map — no sequences at all). ★★'''
deps = ["IsMaximalMonotone.resolvent_eq_iff", "IsMaximalMonotone.resolvent_apply_mem_domain"]
source = "[brezis2011functional] Proposition 7.1 (b)"

[[node]]
id = "IsMaximalMonotone.smul"
kind = "theorem"
desc = '''Remark 1 ([brezis2011functional] Chapter 7, Remark 1): if `A` is maximal monotone and
`0 < c` then `((c : 𝕜) • A).IsMaximalMonotone`. Monotonicity is `re ⟪c A v, v⟫ = c re ⟪A v, v⟫`;
`R(I + cA) = H` is `exists_add_smul_eq`. (The remark's second sentence, that `A + B` need not
be maximal monotone, is a counterexample and is not a node.) ★'''
deps = ["IsMaximalMonotone", "IsMaximalMonotone.exists_add_smul_eq"]
source = "[brezis2011functional] Chapter 7, Remark 1"

[[node]]
id = "yosida"
kind = "definition"
desc = '''`A.yosida c : H →L[𝕜] H := ((c⁻¹ : ℝ) : 𝕜) • (ContinuousLinearMap.id 𝕜 H - A.resolvent c)`,
the Yosida approximation `A_c = c⁻¹ (I − J_c)` ([brezis2011functional] §7.1, Definition after
Remark 1). Total in `(A, c)` like `resolvent`. ★'''
deps = ["resolvent"]
source = "[brezis2011functional] §7.1, Definition of the Yosida approximation"

[[node]]
id = "IsMaximalMonotone.yosida_apply_eq_apply_resolvent"
kind = "theorem"
desc = '''Proposition 7.2 (a₁): for `hA`, `0 < c` and every `v : H`,
`A.yosida c v = A ⟨A.resolvent c v, hA.resolvent_apply_mem_domain hc v⟩`. Rearrangement of
`resolvent_add_smul_apply`: `v = J_c v + c A (J_c v)`. ★'''
deps = ["yosida", "IsMaximalMonotone.resolvent_add_smul_apply"]
source = "[brezis2011functional] Proposition 7.2 (a₁)"

[[node]]
id = "IsMaximalMonotone.resolvent_apply_comm"
kind = "theorem"
desc = '''`J_c` commutes with `A` on `D(A)`: for `hA`, `0 < c` and `u : A.domain`,
`A.resolvent c (A u) = A ⟨A.resolvent c u, _⟩`. Proof: both sides are the unique solution `w` of
`w + c A w = A u` (`resolvent_eq_iff`): for the right-hand side, apply `A` to
`J_c u + c A (J_c u) = u`, i.e. `A(J_c u) + c A(A (J_c u)) = A u` — which needs `A (J_c u) ∈ D(A)`;
that is where the book's (a₂) argument `A_c v + c A (A_c v) = A v` comes from
([brezis2011functional] proof of Proposition 7.2 (a₂)). Derive it as: `A_c u = c⁻¹(u − J_c u)`
is in `D(A)` because both `u` and `J_c u` are, and `A (A_c u) = c⁻¹ (A u − A J_c u)`. ★'''
deps = ["IsMaximalMonotone.resolvent_eq_iff", "IsMaximalMonotone.yosida_apply_eq_apply_resolvent"]
source = "[brezis2011functional] Proposition 7.2 (a₂)"

