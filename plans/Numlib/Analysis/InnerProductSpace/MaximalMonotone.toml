namespace = "LinearPMap"
desc = '''
Maximal monotone operators on a Hilbert space: the resolvent, the Yosida approximation, the
domains `D(A^k)` as Hilbert spaces, and the self-adjointness of symmetric maximal monotone
operators ([brezis2011functional] §7.1, §7.3, §7.4). Upstreaming candidate; natural home
`Mathlib.Analysis.InnerProductSpace.LinearPMap`, which this module extends and imports.

**Setting.** `H` is a Hilbert space over `RCLike 𝕜` and `A : H →ₗ.[𝕜] H` is Mathlib's partially
defined linear map (D2 of the planning brief). Nothing here differentiates in time, so the whole
module is over `RCLike 𝕜` with `re ⟪A v, v⟫` at no cost: the proofs of Propositions 7.1, 7.2 and
7.6 are verbatim with `re`, Mathlib's `LinearPMap.adjoint` / `IsSelfAdjoint` are over `RCLike`,
and the skew-adjoint case (`re ⟪A v, v⟫ = 0`, Schrödinger) is covered for free. The evolution
equation itself (`Numlib/Analysis/ODE/HilleYosida`) is over `ℝ`, for the reason given there.

**Vocabulary fixed here** (chapter 10 of the Brezis surface consumes it):

* `LinearPMap.IsMonotone A` — `0 ≤ re ⟪A v, v⟫` for all `v : A.domain`.
* `LinearPMap.IsMaximalMonotone A` — a `structure`: `isMonotone` and `exists_add_apply_eq :
  ∀ f, ∃ u : A.domain, (u : H) + A u = f` (the book's `R(I + A) = H`). `I + λA` as a `LinearPMap`
  is `LinearMap.id +ᵥ ((λ : 𝕜) • A)` (Mathlib's `LinearPMap.instVAdd`, `instSMul`); its domain
  is `A.domain` by `rfl`, and `IsMaximalMonotone.range_id_vadd_eq_top` records the book's
  spelling `LinearMap.range (LinearMap.id +ᵥ A).toFun = ⊤`. Prototype:
  `notes/brezis/ch07/proto/MaximalMonotone.lean` (elaborates at v4.35.0-rc2).
* `LinearPMap.resolvent A λ : H →L[𝕜] H` — `J_λ = (I + λA)⁻¹`, a *total* function of `(A, λ)`
  by the junk-value pattern of Mathlib's `LinearPMap.adjoint`: the bounded `J` with
  `J f ∈ D(A)` and `J f + λ A (J f) = f` for all `f` when one exists (it is then unique), `0`
  otherwise. Its properties are stated under `hA : A.IsMaximalMonotone` and `0 < λ`. Taking the
  proofs as arguments (`resolvent hA hλ`) was rejected: the Yosida machinery quantifies over
  `λ → 0⁺` and `μ` simultaneously, and proof arguments in the term make every `Tendsto` statement
  unreadable.
* `LinearPMap.yosida A λ : H →L[𝕜] H` — `A_λ = λ⁻¹ (I − J_λ)`.
* `LinearPMap.powGraph A k : Submodule 𝕜 (PiLp 2 (fun _ : Fin (k+1) => H))` and the abbrev
  `LinearPMap.PowDomain A k := ↥(A.powGraph k)` — the book's `D(A^k)` **as a Hilbert space with
  exactly the book's norm** `(∑_{j ≤ k} ‖A^j u‖²)^{1/2}` (§7.3): the tuples
  `(u, A u, …, A^k u)`, cut out of the `ℓ²`-product by "consecutive entries are related by `A`".
  This is the jet-tuple construction of `Numlib/Analysis/Calculus/ContDiffMapIcc` (see
  `notes/lessons.md` §"`PiLp 1` of a tuple is how to build a `Cᵏ` space"): the
  `NormedAddCommGroup` / `InnerProductSpace 𝕜` instances come from `PiLp.innerProductSpace` and
  `Submodule.innerProductSpace` with no `ofCore`, completeness is *closedness* of the submodule
  (`isClosed_powGraph` for a closed `A`) plus `IsClosed.completeSpace_coe`, and `A^j` on `D(A^k)`
  is the projection `PowDomain.applyL A k j`, a contraction. `A.PowDomain 1` is `D(A)` with the
  Hilbert graph norm of the book's footnote 2, and `A.PowDomain 0 ≃ₗᵢ H`. No `A ^ k : H →ₗ.[𝕜] H`
  is defined: Mathlib's `LinearPMap.comp g f H` demands `f x ∈ g.domain` for every `x`, so the
  general composition (and a `Monoid` instance) would have to be built first, and nothing in
  chapters 7 or 10 needs the operator `A^k` itself, only its domain with the book's norm. The
  surface defines the book's recursive set `D(A^k)` and identifies it with `range (applyL A k 0)`.
* `LinearPMap.powPart A k : A.PowDomain k →ₗ.[𝕜] A.PowDomain k` — the part of `A` in `D(A^k)`,
  the operator `A₁ : D(A²) ⊂ D(A) → D(A)` (proof of Theorem 7.5) and `Ã : D(A^k) ⊂ D(A^{k-1}) →
  D(A^{k-1})` (proof of Theorem 7.7) of the book, in one definition. `IsMaximalMonotone.powPart`
  and `IsFormalAdjoint.powPart` are what make Theorems 7.5 and 7.7 inductions over one theorem.
* Symmetric is Mathlib's `A.IsFormalAdjoint A`; self-adjoint is Mathlib's `IsSelfAdjoint A`
  (`A† = A`, `LinearPMap.instStar`, which needs `CompleteSpace H`).

**Not here.** The Banach-space adjoint of chapter 2 (`LinearPMap.strongDualAdjoint`, owner ch2)
is not used: the Hilbert material of chapter 7 is stated with Mathlib's `LinearPMap.adjoint`.
The semigroup `S_A(t)` and everything involving a time derivative are in `Numlib/Analysis/ODE/HilleYosida`.

**Order of attack** inside the module: `IsMonotone` estimates → `IsMaximalMonotone.exists_add_smul_eq`
(the contraction-mapping induction of Proposition 7.1 (c)) → `resolvent` and its API →
`isClosed`, `dense_domain` → `yosida` and Proposition 7.2 → `powGraph`/`PowDomain`/`powPart` →
`dense_range_castL` (Lemma 7.2) → the self-adjoint section (Proposition 7.6) → last, and
optional, the Remark 8 section. Estimated 900–1100 lines in total.
'''

