[[node]]
id = "IsMaximalMonotone.tendsto_resolvent_apply"
kind = "theorem"
desc = '''Proposition 7.2 (c): for `hA` and every `v : H`,
`Tendsto (fun c : ℝ => A.resolvent c v) (𝓝[>] 0) (𝓝 v)`. Proof ([brezis2011functional] lines
6879–6892): on `D(A)` by `norm_sub_resolvent_apply_le`; for general `v`, given `ε` pick
