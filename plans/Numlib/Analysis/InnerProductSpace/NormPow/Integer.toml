namespace = "NormPower"
desc = '''
Exact integer norm-power bounds. The arbitrary even-power case is implemented in
Even.lean. Unrestricted integer bounds require the remaining odd-power case;
no fractional-exponent assertion is made. In particular this does not restore
the false full fractional statement of source LemmaB.4.3.
'''

[[node]]
id = "norm_iteratedFDeriv_norm_pow_integer_le"
kind = "theorem"
desc = '''
For every natural m,j with j<=m and every nonzero x in a real inner product
space, the actual operator norm of D^j (norm^m)(x) is at most
m.descFactorial j * norm(x)^(m-j), equivalently m!/(m-j)! times that power.
Derive the actual derivatives, rather than assume any sharp derivative formula
or operator-norm/diagonal-norm identity. The even-m branch is already supplied
by Even.lean; the general odd-m branch remains required.
'''
deps = ["norm_iteratedFDeriv_norm_pow_of_even"]

[[node]]
id = "norm_iteratedFDeriv_norm_pow_integer_le_of_lt"
kind = "theorem"
desc = '''
For j<m the same actual operator-norm derivative bound holds at all x, including
zero. Derive finite smoothness and the zero derivative there from the actual
norm-power function; do not posit a derivative extension.
'''
deps = ["norm_iteratedFDeriv_norm_pow_integer_le", "iteratedFDeriv_normRpow_zero_of_lt"]

[[node]]
id = "norm_sub_iteratedFDeriv_norm_pow_integer_le"
kind = "theorem"
desc = '''
For every natural p and all x,y in a real inner product space, the actual pth
Fréchet derivative of norm^(p+1) satisfies norm(Dp(x)-Dp(y)) <= (p+1)!*norm(x-y).
The even-power branch p+1 even is implemented in Even.lean. Prove the remaining
odd-power branch, with actual global finite smoothness and origin-crossing
control. Keep the exact factorial coefficient, not an existential larger one.
'''
deps = ["norm_iteratedFDeriv_norm_pow_integer_le", "norm_sub_iteratedFDeriv_norm_pow_of_even"]
