desc = '''
Higher derivatives of the regularization term `N_r(s) = ‖s‖ ^ r` (`r : ℕ`, `r ≥ 1`, natural
power) on a real inner product space, at all orders `ℓ ≤ r`: smoothness, the radial identity
(B.4.2) and the sharp *diagonal* bound `|D^ℓ N_r(s)[d]^ℓ| ≤ r!/(r-ℓ)! ‖s‖^{r-ℓ} ‖d‖^ℓ`
(Cartis–Gould–Toint Lemma B.4.1 with integer exponent `p + β = r`, `β = 1`), plus the
operator-norm version needed only for the literal statement of Lemma 12.2.7.

Existing API reused (Numlib `Analysis/InnerProductSpace/NormPow`, real exponents `‖·‖ ^ λ`):
`contDiffOn_normRpow` (smooth off `0`), homogeneity `iteratedFDeriv_normRpow_smul`, the radial
derivative `iteratedFDeriv_normRpow_apply_unit` (`= λ(λ-1)⋯(λ-k+1) ‖x‖^{λ-k}`) and
`iteratedFDeriv_apply_const_eq_iteratedDeriv` (diagonal values are derivatives of the restriction
to a line). Second-order facts: `NormPowHessian` (core plan).

Design: everything downstream (Chapter 12 Lemmas 12.2.8, 12.2.9, 12.2.11, Example 12.1.3,
Theorem 12.2.17) uses only diagonal values `D^ℓ N_r(s)[d]^ℓ`, which are derivatives of the
one-variable function `t ↦ ‖s + t d‖^r`; so the hard symmetric-tensor norm identity (Banach's
theorem: for symmetric multilinear forms on a real inner product space the operator norm equals
the diagonal sup) is isolated in a single node `norm_iteratedFDeriv_norm_pow_le`, needed only
for Lemma 12.2.7 as printed.

Coordination: the Chapter 4 planner owns Lemma B.4.1 (all real `β ∈ (0,1]`, where the printed
statement is reported false for fractional `β`). The integer case planned here should be merged
with (or derived from) that node by the consolidation reviewer. (Planned by plan-ch12.)
'''

[[node]]
id = "contDiff_norm_pow"
kind = "theorem"
desc = '''
For `r : ℕ` with `1 ≤ r`: `ContDiff ℝ (r - 1) (fun s : E => ‖s‖ ^ r)` (natural power), and
`ContDiff ℝ ⊤` when `r` is even (`‖s‖^r = (⟪s,s⟫)^{r/2}` is a polynomial). In particular the
regularized model `regularizedModel D p σ` is `ContDiff ℝ p` (take `r = p + 1`).
Proof: induction on `r` using `fderiv (‖·‖^r) s = r ‖s‖^{r-2} ⟪s, ·⟫` (`fderiv_norm_rpow_apply`)
and `s ↦ ‖s‖^{r-2} s` being `C^{r-2}`; or off `0` from `contDiffOn_normRpow` and at `0` by the
vanishing of all derivatives of order `< r` with the bound below.
'''
deps = ["contDiffOn_normRpow", "fderiv_norm_rpow_apply"]
source = "Cartis–Gould–Toint, Lemma 12.2.7 (the model is p times continuously differentiable)"

[[node]]
id = "iteratedFDeriv_norm_pow_apply_self"
kind = "theorem"
desc = '''
(B.4.2) for integer exponents. For `r : ℕ`, `ℓ ≤ r`, `s : E` (and `ℓ < r` or `s ≠ 0`):
`iteratedFDeriv ℝ ℓ (fun s => ‖s‖ ^ r) s (fun _ => s) = r! / (r - ℓ)! * ‖s‖ ^ r`.
More generally along the ray, for `t > -1`:
`iteratedFDeriv ℝ ℓ (‖·‖^r) s (fun _ => t • s)`-type identities follow from
`iteratedFDeriv_normRpow_apply_unit` and homogeneity. At `s = 0`, `ℓ < r` both sides vanish.
'''
deps = ["iteratedFDeriv_normRpow_apply_unit", "iteratedFDeriv_normRpow_smul", "contDiff_norm_pow"]
source = "Cartis–Gould–Toint, (B.4.2)"

[[node]]
id = "abs_iteratedFDeriv_norm_pow_apply_le"
kind = "theorem"
desc = '''
Sharp diagonal bound (Lemma B.4.1 (B.4.1) for `β = 1` in the diagonal-norm form (B.4.4)). For
`r : ℕ`, `1 ≤ r`, `ℓ ≤ r`, `s d : E` (with `s ≠ 0` when `ℓ = r`):
`|iteratedFDeriv ℝ ℓ (fun s => ‖s‖ ^ r) s (fun _ => d)| ≤ r! / (r - ℓ)! * ‖s‖ ^ (r - ℓ) * ‖d‖ ^ ℓ`,
with equality for `d = s` (by `iteratedFDeriv_norm_pow_apply_self`).
Reduction: the left side is the `ℓ`-th derivative at `0` of `g(t) = ‖s + t d‖^r =
‖d‖^r ((t - t₀)² + w²)^{r/2}` (decompose `s = -t₀ d + w`, `w ⟂ d`), so it suffices that
`h(τ) = (τ² + w²)^{r/2}` satisfies `|h^{(ℓ)}(τ)| ≤ r!/(r-ℓ)! (τ² + w²)^{(r-ℓ)/2}`. For `r` even this
is a binomial expansion with nonnegative coefficients; for `r` odd it needs the argument of the
book's proof of Lemma B.4.1 (induction on the tensor representation `‖s‖^{r-2i} s^{⊗(2i-ℓ)} ⊗ I^{⊗(ℓ-i)}`
with nonnegative weights). Risk: the naive complex-Leibniz bound overestimates (e.g. `r = ℓ = 3`
gives `7.5` instead of `6`); follow Lemma B.4.1. Alternative if this proves costly: any bound
`C(r, ℓ) ‖s‖^{r-ℓ} ‖d‖^ℓ` suffices for all Chapter 12 results up to the values of the constants.
'''
deps = ["iteratedFDeriv_norm_pow_apply_self", "iteratedFDeriv_apply_const_eq_iteratedDeriv", "contDiff_norm_pow"]
source = "Cartis–Gould–Toint, Lemma B.4.1 (β = 1), (B.4.1), (B.4.4)"

[[node]]
id = "abs_norm_pow_sub_taylorPolynomial_le"
kind = "theorem"
desc = '''
Taylor remainder of `N_r = ‖·‖^r` at order `r - 1` (the "`∇^{p} ‖s‖^{p+1}` is Lipschitz with constant
`(p+1)!`" fact of Lemma 12.2.7, in the only form used downstream): for `r : ℕ`, `1 ≤ r`, all `s d`,
`|‖s + d‖ ^ r - taylorPolynomial (fun s => ‖s‖ ^ r) (r - 1) s d| ≤ ‖d‖ ^ r`.
Proof: one-dimensional (restriction `t ↦ ‖s + t d‖^r`, which is `C^{r-1}` with `(r-1)`-st derivative
Lipschitz with constant `r! ‖d‖^r` by the diagonal bound at order `r` off the line's zero), then the
curve Lipschitz-remainder bound (`norm_sub_taylorSum_le_of_holder`, `β = 1`) gives
`r! ‖d‖^r / r!`.
'''
deps = ["abs_iteratedFDeriv_norm_pow_apply_le", "norm_sub_taylorSum_le_of_holder", "taylorPolynomial"]
source = "Cartis–Gould–Toint, proof of Lemma 12.2.7, (B.4.3)"

[[node]]
id = "norm_iteratedFDeriv_norm_pow_le"
kind = "theorem"
desc = '''
Operator-norm version (Mathlib norm on `E [×ℓ]→L[ℝ] ℝ`). For `r : ℕ`, `1 ≤ r`, `ℓ ≤ r`
(`s ≠ 0` if `ℓ = r`): `‖iteratedFDeriv ℝ ℓ (fun s => ‖s‖ ^ r) s‖ ≤ r! / (r - ℓ)! * ‖s‖ ^ (r - ℓ)`;
consequently `iteratedFDeriv ℝ (r - 1) (‖·‖^r)` is `r!`-Lipschitz (Theorem A.8.5 off the origin plus
