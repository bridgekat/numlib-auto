(`ContinuousMultilinearMap.norm_eq_sup_diagonal_of_symm`: for a symmetric continuous multilinear
form `A` on a real inner product space, `‖A‖ = sup_{‖v‖ ≤ 1} |A (fun _ => v)|`), which is not in
Mathlib and is a substantial theorem (polarization does not give constant 1). HIGH RISK; only
`lemma_12_2_7` (as printed) depends on this node.
'''
