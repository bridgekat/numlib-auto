source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 9"

[[node]]
id = "IsClassicalSolution.iteratedLaplacian_eq_zero_frontier"
kind = "theorem"
desc = '''**Remark 10, necessity of the compatibility conditions**: if `u : ℝ^N × ℝ → ℝ` is `C^∞` up
to the boundary (`ContDiffOnClosure ⊤ u (Ω ×ˢ Ioi 0)`, extensions continuous on
`closure Ω ×ˢ Ici 0`), satisfies `∂ₜₜu = Δ_x u` on `Ω × (0,∞)` and vanishes on `frontier Ω × (0,∞)`,
then the continuous extensions of `Δ^j (u(·,0))` and of `Δ^j (∂ₜu(·,0))` vanish on `frontier Ω`
for every `j`. As `Heat.IsClassicalSolution.iteratedLaplacian_eq_zero_frontier`: by induction
`∂ₜ^{2j} u = Δ^j u` and `∂ₜ^{2j+1} u = Δ^j ∂ₜ u` on `Ω × (0,∞)`, all `t`-derivatives vanish on
`Γ × (0,∞)`, and continuity to `t = 0` gives the conditions. ★★★ (shares the iterated
commutation with the heat version; factor it as a lemma there).'''
deps = ["ContDiffOnClosure", "Heat.IsClassicalSolution.iteratedLaplacian_eq_zero_frontier"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 10"
