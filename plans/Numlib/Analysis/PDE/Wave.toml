namespace = "Wave"
desc = '''
The wave equation `∂ₜₜu - Δu = 0` on `Ω × (0,∞)`, `u = 0` on `∂Ω × (0,∞)`, `u(·,0) = u₀`,
`∂ₜu(·,0) = v₀`, as [brezis2011functional] §10.3 solves it: the first-order system
`U' + A U = 0` for `U = (u, ∂ₜu)` in the phase space `H = H¹₀(Ω) × L²(Ω)` with the inner product
`⟪(u₁,v₁),(u₂,v₂)⟫ = ∫ ∇u₁·∇u₂ + ∫ u₁u₂ + ∫ v₁v₂` (the book's (34)) and
`A (u, v) = (-v, -Δu)` with `D(A) = D(-Δ) × H¹₀(Ω)`, where `-Δ` is the Dirichlet Laplacian of
`Numlib/Analysis/PDE/DirichletLaplacian` — so `D(A) = (H² ∩ H¹₀) × H¹₀` on a `C²` domain with
bounded boundary and the weak domain in general. `A + I` is maximal monotone (not `A` itself for
this inner product, and `A` is not symmetric), so Theorem 7.4 (Hille–Yosida,
`LinearPMap.IsMaximalMonotone.exists_isSolutionOn`) together with the shift of chapter 7's
Remark 6 (`LinearPMap.isSolutionOn_smul_id_vadd_iff`: `V = e^{-t} U` solves `V' + (A + I) V = 0`)
gives Theorem 10.7, and Theorem 7.5 with the description of `D(A^k)` gives Theorem 10.8.
Everything except the `H^{k+1} × H^k` reading of `D(A^k)` and the space-time smoothness holds on
an arbitrary open set, for the same reason as in `Numlib/Analysis/PDE/Heat`.
`Ω : Opens (EuclideanSpace ℝ (Fin N))`.

Types. The phase space is Mathlib's `WithLp 2 (H¹₀(Ω) × L²(Ω))` (`WithLp.instProdInnerProductSpace`),
complete since both factors are; `H¹₀(Ω) = SobolevEuclideanZero N 1 2 Ω` with its `H¹` inner
product, which is (34) by `Elliptic.laplaceForm_eq_innerSL`. The operator is a `LinearPMap` on it
whose domain asks the first component to lie in `D(-Δ)` after the embedding
`SobolevMultiIndexZero.fnL` and the second to be in the range of that embedding (checked in
`notes/brezis/ch10/proto/wave.lean`). A solution is a curve `u : ℝ → L²(Ω)` — the book's `u`, not
`U` — in the class (31): `C²([0,∞); L²)`, `C¹([0,∞); H¹₀)` through the embedding
(`Bochner.ContDiffOnThrough`), `u(t) ∈ D(-Δ)` with `-Δu` continuous, `u'' = Δu`, `u 0 = u₀`,
`u' 0 = v₀`; the translation between `U` and `u` is the bulk of `existsUnique_isSolution`.

Remark 7 needs the *other* inner product on `H¹₀(Ω)`, `∫ ∇u₁·∇u₂` alone, which is an inner product
equivalent to the `H¹` one exactly when Poincaré's inequality holds (bounded `Ω`, Corollary 9.19,
`SobolevEuclideanZero.norm_le_gradNorm`); for it `⟪AU,U⟫ = 0`, `A` and `-A` are maximal monotone
and `A* = -A`. That is a second phase-space type, `dirichletPhaseSpace`, with the same operator;
it is planned last, the two-sided solvability and `‖U(t)‖ = ‖U₀‖` for all `t ∈ ℝ` being obtainable
without it by time reversal (`t ↦ -t`, `v₀ ↦ -v₀`). Remark 8 (d'Alembert's formula on `Ω = ℝ`)
is the one place where a concrete solution is exhibited, and its cost is that translation
`t ↦ u₀(· + t)` is a `C^k` curve in `L²(ℝ)` iff `u₀ ∈ H^k(ℝ)`; Remark 9 (the Fourier method) is
as for the heat equation; Remark 10's necessity is Remark 4's argument.
'''

[[node]]
id = "phaseSpace"
kind = "definition"
desc = '''`Wave.phaseSpace (Ω) := WithLp 2 (SobolevEuclideanZero N 1 2 Ω × Lp ℝ 2 (volume.restrict Ω))`,
the book's `H = H¹₀(Ω) × L²(Ω)` with the inner product (34); an `abbrev`, so Mathlib's
`InnerProductSpace ℝ (WithLp 2 (E × F))` applies. `instCompleteSpace` from
`SobolevMultiIndexZero.instCompleteSpace` and `Lp`'s completeness. `inner_def`: (34) via
`Elliptic.laplaceForm_eq_innerSL`. Shape checked in `notes/brezis/ch10/proto/wave.lean`. ★'''
deps = ["SobolevEuclideanZero", "SobolevMultiIndexZero.instCompleteSpace", "Elliptic.laplaceForm_eq_innerSL"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, (34)"

[[node]]
id = "operator"
kind = "definition"
desc = '''**The wave operator** `Wave.operator (Ω) : phaseSpace Ω →ₗ.[ℝ] phaseSpace Ω`, `A (u, v) = (-v, -Δu)`,
with domain `{(u, v) : fnL u ∈ D(dirichletLaplacian Ω) ∧ v ∈ range (SobolevMultiIndexZero.fnL : SobolevEuclideanZero N 1 2 Ω →L[ℝ] L²(Ω))}`
and value `(-ṽ, dirichletLaplacian Ω (fnL u))`, `ṽ` the (unique) `H¹₀`-preimage of `v`. The
book's (35) with `D(A) = (H² ∩ H¹₀) × H¹₀` read on the weak domain
(`dirichletLaplacianDomain_eq_of_isContDiffChartDomain` identifies them on a regular domain).
`mem_operator_domain_iff`, `operator_apply_fst`, `operator_apply_snd`. ★'''
deps = ["phaseSpace", "dirichletLaplacian", "SobolevMultiIndexZero.fnL"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, (35)"

[[node]]
id = "operator_add_id_inner_self_nonneg"
kind = "theorem"
desc = '''**(i) `A + I` is monotone**: `0 ≤ ⟪A U, U⟫ + ‖U‖²` for `U = (u, v) ∈ D(A)`, i.e.
`LinearPMap.IsMonotone (LinearMap.id +ᵥ operator Ω)`. The book's computation, lines 12622–12628,
with `⟪-Δu, v⟫ = ∫ ∇u·∇ṽ` (`dirichletLaplacian_inner_eq_dirichletForm`, `ṽ ∈ H¹₀` as test element)
cancelling the `-∫ ∇ṽ·∇u` of `⟪-ṽ, u⟫_{H¹}`:
`⟪AU,U⟫ + ‖U‖² = -∫ u v + ∫ u² + ∫ v² + ∫ |∇u|² ≥ 0` (`‖u‖² + ‖v‖² - ⟪u,v⟫ ≥ ½(‖u‖² + ‖v‖²)`). ★★'''
deps = ["operator", "dirichletLaplacian_inner_eq_dirichletForm", "Elliptic.laplaceForm_eq_innerSL", "LinearPMap.IsMonotone"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, proof of Theorem 10.7 (i)"

[[node]]
id = "operator_add_id_isMaximalMonotone"
kind = "theorem"
desc = '''**(ii) `R(A + 2I) = H`, hence `A + I` is maximal monotone**:
`LinearPMap.IsMaximalMonotone (LinearMap.id +ᵥ operator Ω)` (its `exists_add_apply_eq` field is
`∀ F, ∃ U : D(A), U + (A U + U) = F`, the book's `A + 2I` onto). The book's (36)–(37), lines
12630–12648: given `(f, g)`, solve `-Δu + 4u = 2f + g` in `D(-Δ)`
(`dirichletLaplacian_exists_smul_add_apply_eq` at `λ = 4`, on any open set; the book cites
Theorem 9.25 because its domain is `H² ∩ H¹₀`), then `v := 2u - f ∈ H¹₀` since
`u ∈ D(-Δ) ⊆ H¹₀`. With `operator_add_id_inner_self_nonneg`. ★★'''
deps = ["operator", "dirichletLaplacian_exists_smul_add_apply_eq", "operator_add_id_inner_self_nonneg", "LinearPMap.IsMaximalMonotone"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, proof of Theorem 10.7 (ii)"

[[node]]
id = "IsSolution"
kind = "definition"
desc = '''`Wave.IsSolution (Ω) (u₀ : H¹₀(Ω)) (v₀ : L²(Ω)) (u : ℝ → L²(Ω)) : Prop`, the problem
(27)–(30) in the class (31) of Theorem 10.7, with `D(-Δ)` for `H² ∩ H¹₀`: fields
`contDiffOn : ContDiffOn ℝ 2 u (Ici 0)` (`u ∈ C²([0,∞); L²)`),
`contDiffOnThrough : Bochner.ContDiffOnThrough (SobolevMultiIndexZero.fnL : SobolevEuclideanZero N 1 2 Ω →L[ℝ] L²(Ω)) 1 u (Ici 0)`
(`u ∈ C¹([0,∞); H¹₀)`), `contDiffOnPowDomain : (dirichletLaplacian Ω).ContDiffOnPowDomain 0 1 u (Ici 0)`
(`u ∈ C([0,∞); D(-Δ))`, the book's `H² ∩ H¹₀` with `dirichletLaplacianDomain_eq_of_isContDiffChartDomain`),
`eqn : ∀ t ≥ 0, iteratedDerivWithin 2 u (Ici 0) t = -(dirichletLaplacian Ω ⟨u t, _⟩)` ((27):
`∂ₜₜu = Δu` in `L²`), `apply_zero : u 0 = fnL u₀`, `derivWithin_zero : derivWithin u (Ici 0) 0 = v₀`
((29), (30)); (28) is `u(t) ∈ D(-Δ) ⊆ H¹₀`. Shape checked in `notes/brezis/ch10/proto/wave.lean`. ★'''
deps = ["dirichletLaplacian", "Bochner.ContDiffOnThrough", "SobolevMultiIndexZero.fnL", "LinearPMap.ContDiffOnPowDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, (27)–(31)"

[[node]]
id = "existsUnique_isSolution"
kind = "theorem"
desc = '''**Theorem 10.7, existence and uniqueness**, on any open `Ω`: for `u₀ ∈ H¹₀(Ω)` with
`fnL u₀ ∈ D(-Δ)` (the book's `u₀ ∈ H² ∩ H¹₀`) and `v₀ ∈ range (fnL Ω)` (`v₀ ∈ H¹₀`),
`∃! u, IsSolution Ω u₀ v₀ u` (uniqueness on `Ici 0`). Proof, lines 12650–12660:
`U₀ = (u₀, ṽ₀) ∈ D(A)`; `A + I` is maximal monotone (`operator_add_id_isMaximalMonotone`), so
Theorem 7.4 (`LinearPMap.IsMaximalMonotone.exists_isSolutionOn`) gives `V` with
`(LinearMap.id +ᵥ A).IsSolutionOn U₀ (Ici 0) V`, `C¹`, and `U := e^t V` solves `A.IsSolutionOn U₀ (Ici 0) U`
(`LinearPMap.isSolutionOn_smul_id_vadd_iff` at `c = 1`) with `U ∈ C¹([0,∞); H) ∩ C([0,∞); D(A))`
(39). Translation to `u := fnL ∘ U.1`: the first component of `U' + AU = 0` is `U.1' = U.2` in
`H¹₀`, so `u ∈ C¹([0,∞); H¹₀)` with `u' = fnL ∘ U.2` (`Bochner.ContDiffOnThrough.derivWithin_eq`),
and the second is `U.2' = Δ U.1` in `L²`, so `u ∈ C²([0,∞); L²)` with `u'' = -(-Δ)(u)`;
`U ∈ C([0,∞); D(A))` gives `u(t) ∈ D(-Δ)` continuously. Conversely a solution `u` yields
`U := (ũ, u')` with `ũ` the `H¹₀` lift, in the class (39), so uniqueness
(`LinearPMap.IsMonotone.eqOn_of_isSolutionOn` for `A + I`, after the shift) transfers. ★★★,
~500 lines of translation.'''
deps = ["IsSolution", "operator", "operator_add_id_isMaximalMonotone", "Bochner.ContDiffOnThrough.derivWithin_eq", "SobolevMultiIndexZero.fnL", "LinearPMap.IsMaximalMonotone.exists_isSolutionOn", "LinearPMap.isSolutionOn_smul_id_vadd_iff", "LinearPMap.IsMonotone.eqOn_of_isSolutionOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.7 (existence and uniqueness)"

[[node]]
id = "solution"
kind = "definition"
desc = '''`Wave.solution (Ω) (u₀ : H¹₀(Ω)) (v₀ : L²(Ω)) : ℝ → L²(Ω)`, the first component of
