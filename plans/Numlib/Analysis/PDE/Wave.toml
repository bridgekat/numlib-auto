`SobolevMultiIndex.fnL w = SobolevMultiIndexZero.fnL u`, `SobolevMultiIndex.fnL z = v`, and
`‖w‖_{H^{k+1}} + ‖z‖_{H^k} ≤ C ∑_{j ≤ k} ‖A^j (u,v)‖ ≤ C' ‖x‖`. The book's line 12738 ("in
particular"), from `mem_operator_powGraph_iff` and `dirichletLaplacian_mem_powDomain_iff` (with
