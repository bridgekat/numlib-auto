[[node]]
id = "existsUnique_isSolution_backward"
kind = "theorem"
desc = '''**Remark 7, the two-sided solution, without the Dirichlet inner product**: the wave
equation is solvable backward in time — for the data of `existsUnique_isSolution` there is a
unique `u : ℝ → L²(Ω)` which is a solution on `Ici 0` and whose reflection `t ↦ u (-t)` is a
solution with data `(u₀, -v₀)` on `Ici 0`, i.e. `u ∈ C²(ℝ; L²) ∩ C¹(ℝ; H¹₀)` with `u'' = Δu` on
all of `ℝ`. The map `t ↦ -t` preserves (27) (second order in time) and (28), and swaps the sign
of (30). With `IsSolution.energy` on both halves: `‖u'(t)‖² + ∫|∇u(t)|² = ‖v₀‖² + ∫|∇u₀|²` for every
`t ∈ ℝ` (`IsSolution.energy_two_sided`) — the book's "`|U(t)|_H = |U₀|_H ∀ t ∈ ℝ`" in the energy
norm. ★★'''
deps = ["existsUnique_isSolution", "IsSolution.energy"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 7 (the group of isometries)"

[[node]]
id = "dirichletPhaseSpace"
