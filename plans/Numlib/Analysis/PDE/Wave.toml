deps = ["existsUnique_isSolution", "LinearPMap.semigroup"]

[[node]]
id = "IsSolution.energy"
kind = "theorem"
desc = '''**(32), conservation of energy**: for every `t ≥ 0`,
`‖derivWithin u (Ici 0) t‖² + ⟪-Δ (u t), u t⟫ = ‖v₀‖² + ⟪-Δ (fnL u₀), fnL u₀⟫`, i.e. with
`dirichletLaplacian_inner_self_eq_dirichletForm`, `‖∂ₜu(t)‖² + ∫|∇u(t)|² = ‖v₀‖² + ∫|∇u₀|²`
(`IsSolution.energy_dirichletForm`, in terms of the `H¹₀` lift `ũ`). The book's proof, lines
12662–12670: `E(t) = ‖u'‖² + dirichletForm Ω ũ ũ` is `C¹` on `[0,∞)` with
`E' = 2⟪u', u''⟫ + 2 dirichletForm Ω ũ ũ' = 2⟪u', Δu⟫ + 2⟪-Δu, u'⟫ = 0`, using `ũ' = lift of u'`
(`Bochner.ContDiffOnThrough.derivWithin_eq`) and `⟪-Δu, w⟫ = ∫ ∇u·∇w` for `w = u'(t) ∈ H¹₀`.
Remark 6 is this statement. ★★'''
deps = ["IsSolution", "dirichletLaplacian_inner_eq_dirichletForm", "Bochner.ContDiffOnThrough.derivWithin_eq", "Elliptic.dirichletForm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.7 (32) and Remark 6"

[[node]]
id = "mem_operator_powGraph_iff"
kind = "theorem"
desc = '''`D(A^k)` on any open set, in terms of the Dirichlet Laplacian: with `A² (u, v) = (Δu, Δv)`
(`operator_apply_operator`), `(u, v) ∈ D(A^k)` (i.e. `∃ x : (operator Ω).PowDomain k, applyL _ k 0 x = (u,v)`,
`LinearPMap.powGraph`) iff `fnL u ∈ D((-Δ)^{⌈k/2⌉})` with `(-Δ)^j (fnL u) ∈ range fnL` for
`j ≤ ⌊k/2⌋`, and `v ∈ D((-Δ)^{⌊k/2⌋})` with `(-Δ)^j v ∈ range fnL` for `j ≤ ⌈k/2⌉ - 1` (the
`D((-Δ)^m)` memberships through `(dirichletLaplacian Ω).PowDomain m`). Induction on `k` from
`mem_operator_domain_iff`, `A(u,v) = (-v, -Δu)`. This is the book's display at line 12736 before
the Sobolev spaces are read in: the conditions "`Δ^j u = 0` on `Γ`" are the `range fnL`
memberships. ★★'''
deps = ["operator", "LinearPMap.powGraph", "LinearPMap.PowDomain", "LinearPMap.PowDomain.applyL"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, proof of Theorem 10.8, `D(A^k)`"

[[node]]
