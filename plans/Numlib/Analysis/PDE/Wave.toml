source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 8, (40)"

[[node]]
id = "isSolution_dAlembert"
kind = "theorem"
desc = '''For `Ω = ℝ` (`N = 1`, `Ω = ⊤`), `u₀ ∈ H²(ℝ)` and `v₀ ∈ H¹(ℝ)` (`= H¹₀(ℝ)`: the whole-space
density of `C_c^∞` in `H^k(ℝ^N)`, `MemSobolev.exists_seq_hasCompactSupport_tendsto_sobolevNorm`,
gives `SobolevEuclideanZero N 1 2 ⊤ = ⊤`), the curve `t ↦ [dAlembert u₀ v₀ t]` in `L²(ℝ)` is
`IsSolution` with data `(u₀, v₀)`, so by uniqueness the solution of Theorem 10.7 is d'Alembert's
formula (`IsSolution.eq_dAlembert`). Proof: translation `τ_t f = f(· + t)` is a `C^k` curve in
`L²(ℝ)` for `f ∈ H^k(ℝ)` with `d/dt τ_t f = τ_t f'` (difference quotients converge in `L²` for
`f ∈ H¹`: the estimate `‖τ_h f - f‖_{L²} ≤ |h| ‖f'‖_{L²}` of Proposition 9.3, chapter 9a's
`HasWeakFDerivOn.eLpNorm_sub_translate_le_top` in `Friedrichs.lean`, and the density of smooth
functions), and `x ↦ ∫_{x-t}^{x+t} v₀` is `v₀(x+t) - v₀(x-t)`-differentiable in `t` with
`v₀ ∈ H¹`; the computation `∂ₜₜ = ∂ₓₓ` termwise, weak derivatives read through the `H²` element.
★★★, ~400 lines, most of it the translation calculus in `L²`.'''
