[[node]]
id = "mem_operator_powGraph_iff"
kind = "theorem"
desc = '''`D(A^k)` on any open set, in terms of the Dirichlet Laplacian: with `A² (u, v) = (Δu, Δv)`
(`operator_apply_operator`), `(u, v) ∈ D(A^k)` (i.e. `∃ x : (operator Ω).PowDomain k, applyL _ k 0 x = (u,v)`,
`LinearPMap.powGraph`) iff `fnL u ∈ D((-Δ)^{⌈k/2⌉})` with `(-Δ)^j (fnL u) ∈ range fnL` for
`j ≤ ⌊k/2⌋`, and `v ∈ D((-Δ)^{⌊k/2⌋})` with `(-Δ)^j v ∈ range fnL` for `j ≤ ⌈k/2⌉ - 1` (the
`D((-Δ)^m)` memberships through `(dirichletLaplacian Ω).PowDomain m`). Induction on `k` from
`mem_operator_domain_iff`, `A(u,v) = (-v, -Δu)`. This is the book's display at line 12736 before
the Sobolev spaces are read in: the conditions "`Δ^j u = 0` on `Γ`" are the `range fnL`
memberships. ★★ Not attempted by pde5 (time): expect the `PowDomain` contexts of `operator Ω` to
need the heartbeat discipline of `Numlib/Analysis/PDE/Heat` (one projection per lemma, no `rw`).'''
deps = ["operator", "LinearPMap.powGraph", "LinearPMap.PowDomain", "LinearPMap.PowDomain.applyL"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, proof of Theorem 10.8, `D(A^k)`"

[[node]]
id = "operator.powDomainToSobolevL"
kind = "definition"
desc = '''**`D(A^k) ⊆ H^{k+1}(Ω) × H^k(Ω)` with continuous injection**, on a `C^{k+1}` domain with
bounded boundary: `Wave.operator.powDomainToSobolevL (hΩ) (k) : (operator Ω).PowDomain k →L[ℝ]
SobolevEuclidean N (k+1) 2 Ω × SobolevEuclidean N k 2 Ω`, `x ↦ (w, z)` with
`SobolevMultiIndex.fnL w = SobolevMultiIndexZero.fnL u`, `SobolevMultiIndex.fnL z = v`, and
`‖w‖_{H^{k+1}} + ‖z‖_{H^k} ≤ C ∑_{j ≤ k} ‖A^j (u,v)‖ ≤ C' ‖x‖`. The book's line 12738 ("in
particular"), from `mem_operator_powGraph_iff` and `dirichletLaplacian_mem_powDomain_iff` (with
the odd-order clause of Theorem 9.25, `Elliptic.regularity_dirichlet_higher`: `u ∈ H¹₀`,
`u - Δu ∈ H^{m}` ⇒ `u ∈ H^{m+2}`, at `m = k - 1`). ★★★ bookkeeping on top of Theorem 9.25. Not
attempted by pde5.'''
deps = ["mem_operator_powGraph_iff", "dirichletLaplacian_mem_powDomain_iff", "dirichletLaplacian.powDomainToSobolevL", "Elliptic.regularity_dirichlet_higher", "IsContDiffChartDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.3, proof of Theorem 10.8"

[[node]]
id = "IsSolution.contDiffOnThrough_of_powDomain"
kind = "theorem"
desc = '''**Theorem 10.8, Bochner form**: if `U₀ = (u₀, ṽ₀) ∈ D(A^k)` then
`(operator Ω).ContDiffOnPowDomain (k - j) j U (Ici 0)` for `j ≤ k` (Theorem 7.5,
`LinearPMap.IsMaximalMonotone.contDiffOnPowDomain_semigroup` for `A + I`; the shift `e^t` preserves
the classes) and hence, on a `C^k` domain with bounded boundary,
`Bochner.ContDiffOnThrough (SobolevMultiIndex.fnL : SobolevEuclidean N (j+1) 2 Ω →L[ℝ] L²(Ω)) (k - j) u (Ici 0)` for `j ≤ k` —
`u ∈ C^{k-j}([0,∞); H^{j+1}(Ω))`, lines 12740–12750, via `operator.powDomainToSobolevL`. ★★
Not attempted by pde5. Note for the prover: Theorem 7.5 is stated for the semigroup of `A + I`,
whose graph `D((A+I)^k)` (`LinearPMap.powGraph`) differs from `D(A^k)` as a subspace of
`PiLp 2 (Fin (k+1) → H)` (the coordinates are `(A+I)^i x` instead of `A^i x`); the transport
between the two `PowDomain` types (a linear isomorphism with a triangular matrix of binomial
coefficients) is the missing generic lemma, and belongs in `Numlib/Analysis/ODE/HilleYosida`.'''
deps = ["IsSolution", "existsUnique_isSolution", "operator.powDomainToSobolevL", "LinearPMap.IsMaximalMonotone.contDiffOnPowDomain_semigroup", "Bochner.ContDiffOnThrough.comp"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.8"

[[node]]
id = "IsSolution.contDiffOnClosure_spaceTime"
kind = "theorem"
desc = '''**Theorem 10.8**: on a `C^∞` domain with bounded boundary, if `(u₀, ṽ₀) ∈ D(A^k)` for every
`k` (the book's `u₀, v₀ ∈ H^k(Ω)` for all `k` with the compatibility conditions `Δ^j u₀ = Δ^j v₀ = 0`
on `Γ`, read through `mem_operator_powGraph_iff` and `dirichletLaplacian_mem_powDomain_iff`),
then `u ∈ C^∞(Ω̄ × [0,∞))`: `∃ U, (∀ t ≥ 0, U(·,t) =ᵐ u t) ∧ ContDiffOnClosure ℝ ∞ U (Ω ×ˢ Ioi 0)`
with the derivatives extending continuously to `closure Ω ×ˢ Ici 0` (`∞ : ℕ∞`, not `⊤`; the
space–time bridge's `Ici 0` form, `Bochner.contDiffOnClosure_spaceTime_of_forall_contDiffOnThrough_Ici`,
with the hypotheses `IsSobolevExtensionDomainAll N Ω`, `UniqueDiffOn ℝ (Ici 0)` and
`∀ m : ℕ, ContDiffOnThrough (fnL … m 2 Ω volume) ∞ u (Ici 0)`, the latter from
`contDiffOnThrough_of_powDomain` for all `k` with `ContDiffOnThrough.sobolev_of_le`). ★★★ through
the bridge. Blocked: waits on `IsSolution.contDiffOnThrough_of_powDomain` and on pde4's
`Bochner.contDiffOnClosure_spaceTime_of_forall_contDiffOnThrough_Ici` (`Numlib/Analysis/PDE/Bochner/SpaceTime`,
merged to main after this worktree was cut).'''
deps = ["IsSolution.contDiffOnThrough_of_powDomain", "Bochner.contDiffOnClosure_spaceTime_of_forall_contDiffOnThrough", "IsContDiffChartDomain", "IsSobolevExtensionDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.8"

