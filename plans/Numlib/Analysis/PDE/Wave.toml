[[node]]
id = "dAlembert"
kind = "definition"
desc = '''**Remark 8, d'Alembert's formula**: for `u₀ v₀ : ℝ → ℝ`,
`Wave.dAlembert u₀ v₀ (t : ℝ) : ℝ → ℝ := fun x ↦ ½ (u₀ (x + t) + u₀ (x - t)) + ½ ∫ s in (x - t)..(x + t), v₀ s`,
the book's (40), as a function of `t` with values in functions of `x` (and, for `u₀ ∈ L²`,
`v₀ ∈ L²` with `H¹`/`H²` regularity, in `L²(ℝ)`). `dAlembert_apply`; for `v₀ = 0` it is (41). ★'''
