`SobolevEuclideanZero.norm_le_gradNorm` at `p = 2`: `‖u‖²_{H¹} ≤ (1 + 4R²) dirichletForm Ω u u`),
`WithEnergy` the energy space of `Numlib/Analysis/InnerProductSpace/Energy` (inner product
`a(u, v)`, `WithEnergy.inner_def`; the norms are equivalent, `WithEnergy.continuous_equiv`) and
`WithLp 2 (_ × _)` Mathlib's `ℓ²` product of inner product spaces (`WithLp.instProdInnerProductSpace`).
