source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 8"

[[node]]
id = "dAlembert_contDiffOn_off_characteristics"
kind = "theorem"
desc = '''**Remark 8, propagation of singularities**: if `u₀` is `C^∞` on `ℝ ∖ {x₀}` and `v₀ = 0`,
then `(x,t) ↦ dAlembert u₀ 0 t x` is `C^∞` on `ℝ × ℝ` off the two characteristics
`{x + t = x₀} ∪ {x - t = x₀}`: `ContDiffOn ℝ ⊤ (fun p ↦ dAlembert u₀ 0 p.2 p.1) {p | p.1 + p.2 ≠ x₀ ∧ p.1 - p.2 ≠ x₀}`,
by the chain rule (`ContDiffOn.comp` with the affine maps `p ↦ p.1 ± p.2`). The general-`v₀`
version with `v₀ ∈ C^∞(ℝ ∖ {x₀})` is the same plus the integral term. ★★'''
deps = ["dAlembert"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 8 (characteristics)"

[[node]]
id = "IsSolution.inner_eigenfunction"
kind = "theorem"
desc = '''**Remark 9, the coefficients**: for bounded nonempty `Ω` and the Dirichlet eigenbasis `e`,
`lam` of `Elliptic.dirichletEigenbasis`, `a n t := ⟪u t, e n⟫` satisfies
`a n t = ⟪fnL u₀, e n⟫ * cos (√(lam n) * t) + ⟪v₀, e n⟫ / √(lam n) * sin (√(lam n) * t)` for
`t ≥ 0`: `a n` is `C²` with `a'' = ⟪u'', e_n⟫ = ⟪Δu, e_n⟫ = -lam_n a` (symmetry of `-Δ`,
`e n ∈ D(-Δ)`), `a(0)`, `a'(0)` given, and the harmonic oscillator has that unique solution
(the energy `a'² + lam a²` of the difference is constant and zero at `0`).
`hasSum_eigenfunction`: `HasSum (fun n ↦ a n t • e n) (u t)`, the series at line 12725. ★★'''
