namespace = "Elliptic"
desc = '''
The weak maximum principle for second-order elliptic equations by Stampacchia's truncation
method: [brezis2011functional] §9.7 — Theorem 9.27 (the Dirichlet problem for `-Δu + u = f` on an
arbitrary open set, in both cases `|Ω| < ∞` and `|Ω| = ∞`), Corollary 9.28, Remark 27 (the
classical-solution proof, valid for general operators), Proposition 9.29 (general elliptic
operators with `a₀ ≥ 0`), Proposition 9.30 (the Neumann problem).

## The shape of the statements

A weak solution is an element `u` of `H^1(Ω) = SobolevEuclidean N 1 2 Ω` and "`u ∈ C(Ω̄)`" is a
function `ũ : ℝ^N → ℝ`, continuous on `closure Ω`, with `SobolevMultiIndex.fn u =ᵐ[Ω] ũ`; the
boundary values are the values of `ũ` on `frontier Ω`. The book's `sup_Γ u` and `sup_Ω f` are
not formed: a bound `K : ℝ` with `∀ x ∈ frontier Ω, ũ x ≤ K` and `f ≤ K` a.e. on `Ω` is the
hypothesis and `ũ x ≤ K` for every `x ∈ Ω` the conclusion (the book's `K < ∞`, "otherwise there
is nothing to prove"); lower bounds are the same statement for `-u`, and the `iInf`/`iSup` forms
of Corollary 9.28 and Proposition 9.29 (80)–(81) are corollaries. The almost-everywhere bound
`ũ ≤ K` a.e. on `Ω` is upgraded to every point of `Ω` by continuity, `Ω` being open.

## The engine

Every proof in the section is the same three steps, and `le_of_forall_truncation_mem` states
them once: (1) a truncation `G ∈ C¹(ℝ)` with `|G'| ≤ M`, `G` strictly increasing on `(0, ∞)`,
`G = 0` on `(-∞, 0]` (`exists_truncation`, e.g. `G(s) = s - 1 + e^{-s}` for `s ≥ 0`);
(2) `v = G(u - K') ∈ H^1(Ω)` by the chain rule, Proposition 9.5 (chapter 9a's
`MemSobolevMultiIndex.contDiff_comp`), and `v` is an admissible test function — in `H^1_0(Ω)`
for the Dirichlet problem (continuous, zero on `Γ`: Theorem 9.17 (i) ⇒ (ii), any `Ω`), in
`H^1(Ω)` for the Neumann problem; (3) the equation tested with `v` gives
`∫ |∇u|² G'(u - K') + ∫ (u - K') G(u - K') ≤ ∫ (f - K') G(u - K') ≤ 0`, whose integrands are
nonnegative, so `(u - K') G(u - K') = 0` a.e., so `u ≤ K'` a.e. The case `|Ω| = ∞` needs
`K' > K ≥ 0` to make `G(u - K') ∈ L¹(Ω)` (footnote 36 and the estimate
`K' ∫_{[u ≥ K']} |u| ≤ ∫ u²`), which is why the engine takes every `K' > K` and concludes
`u ≤ K`.

Proposition 9.29 replaces `∫ |∇u|²` by `∫ ∑ a_ij ∂ᵢu ∂ⱼu G'(u) ≥ α ∫ |∇u|² G'(u)` and, since the
form has no `∫ uv` term, must conclude from `∫ |∇u|² G'(u) = 0` by the auxiliary
`H(t) = ∫₀ᵗ √G'(s) ds`: `H(u) ∈ H^1_0(Ω)` with `∇H(u) = 0`, hence `H(u) = 0` (footnote 39,
`SobolevMultiIndexZero.eq_zero_of_gradient_eq_zero`: the zero extension of a `W^{1,p}_0` function
with vanishing gradient is a constant `L^p` function on `ℝ^N`, hence zero), hence `u ≤ 0`. The book
proves Proposition 9.29 for `a_i = 0` only, citing Gilbarg–Trudinger, Theorem 8.1, for the drift
term; both are planned, the general case with that route.

The book's hypothesis `u ∈ C(Ω̄)` is used only to place `G(u - K')` in `H^1_0(Ω)` through Theorem
9.17; footnotes 35, 37 and 38 say it can be dropped for `u ∈ H^1_0(Ω)`, and
`SobolevMultiIndexZero.contDiff_comp_mem` of `Numlib/Analysis/Sobolev/Zero` (the chain rule
preserves `W^{1,p}_0`) supplies exactly that, so the `H^1_0` variants are stated beside the continuous ones. They are what Remark 23's
uniqueness and Chapter 10's heat-equation maximum principle consume.
'''

[[node]]
id = "exists_truncation"
kind = "theorem"
desc = '''There is a `G : ℝ → ℝ` with `ContDiff ℝ 1 G`, `|deriv G s| ≤ 1` for all `s`,
`StrictMonoOn G (Set.Ioi 0)`, `G s = 0` for `s ≤ 0`, and `0 ≤ G`: the truncation function of the
proof of [brezis2011functional] Theorem 9.27 (p. 11553), with `M = 1`. Take
`G s = s - 1 + exp (-s)` for `s ≥ 0` and `0` for `s ≤ 0`: `G' s = 1 - exp (-s)` on `s > 0`,
continuous at `0` with value `0`, so `G ∈ C¹` (`ContDiff` by gluing along `0` with matching
values and derivatives, `contDiff_of_…` piecewise), `0 ≤ G' < 1`, and `G' > 0` on `(0, ∞)`.
Companion: `truncation_mul_nonneg` (`0 ≤ t * G t`, with equality iff `t ≤ 0`), and
`exists_truncation_sqrt_deriv`, the function `H t = ∫₀ᵗ √(G' s) ds` of the proof of Proposition
9.29: `C¹` with `|H'| ≤ 1`, `H 0 = 0`, `H t > 0` for `t > 0`, `H t = 0` for `t ≤ 0`
(`intervalIntegral.integral_hasDerivAt_right` with the continuous integrand `√G'`). ★ (~100 lines).'''
deps = []

[[node]]
id = "_root_.SobolevMultiIndexZero.eq_zero_of_gradient_eq_zero"
kind = "theorem"
desc = '''**Footnote 39 of [brezis2011functional] §9.7**: for `1 ≤ p < ∞` and any open `Ω ⊆ ℝ^N`, a
function `f ∈ W^{1,p}_0(Ω)` whose weak gradient vanishes almost everywhere on `Ω` is zero:
`u ∈ SobolevEuclideanZero N 1 p Ω → (∀ i, weakDeriv u (MultiIndexLE.single i) = 0) → u = 0`. Proof: the zero
extension `f̄` of `f` lies in `W^{1,p}(ℝ^N)` with `∇f̄ = ext(∇f) = 0` (Proposition 9.18 (i) ⇒ (iii),
which holds for every open `Ω`, chapter 9a's `Zero`), so `f̄` is almost everywhere constant on
the connected `ℝ^N` (Remark 7, chapter 9a's `Friedrichs`), and a constant in `L^p(ℝ^N)` with
`p < ∞` is `0` (`MeasureTheory.memLp_const_iff` on an infinite measure). ★★ (~100 lines).'''
