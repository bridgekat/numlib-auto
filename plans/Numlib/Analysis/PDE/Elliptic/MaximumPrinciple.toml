[[node]]
id = "le_of_forall_truncation_mem"
kind = "theorem"
desc = '''**The truncation engine of [brezis2011functional] §9.7.** Let `Ω ⊆ ℝ^N` be open,
`V ≤ SobolevEuclidean N 1 2 Ω` a subspace, `u ∈ H^1(Ω)`, `f ∈ L²(Ω)` with
`laplaceForm Ω u φ = ⟪f, fn φ⟫` for all `φ ∈ V`, `K : ℝ` with `f ≤ K` a.e. on `Ω`, and suppose
that for every `K' > K` and every truncation `G` of `exists_truncation` the element of `H^1(Ω)`
carrying `G (fn u - K')` lies in `V`. Then `fn u ≤ K` a.e. on `Ω`.

Proof (p. 11560–11590, both cases at once): fix `K' > K`. Test with `v = G(u - K') ∈ V`:
`∫ |∇u|² G'(u - K') + ∫ u G(u - K') = ∫ f G(u - K')`, the gradient of `v` being `G'(u - K') ∇u`
(Proposition 9.5). The first term is `≥ 0`. `G(u - K') ∈ L¹(Ω)`: it is `≤ M |u - K'| ≤ M(|u| + K')`
on the set `[u ≥ K']`, and `0` elsewhere; when `|Ω| < ∞` this is integrable outright, and when
`|Ω| = ∞` the case `K < 0` is impossible (`f ≤ K < 0` a.e. and `f ∈ L²` force `|Ω| < ∞`), so
`K' > 0` and `K' ∫_{[u ≥ K']} |u| ≤ ∫ u² < ∞` (footnote 36 and (72)). Subtracting
`K' ∫ G(u - K')` from both sides, `∫ (u - K') G(u - K') ≤ ∫ (f - K') G(u - K') ≤ 0`; the left
integrand is `≥ 0` (`truncation_mul_nonneg`), so it vanishes a.e., so `u ≤ K'` a.e.; `K' → K`.
★★★ (~300 lines: the integrability bookkeeping of the infinite-measure case is the bulk).'''
deps = [
  "exists_truncation", "laplaceForm", "SobolevEuclidean",
  "MemSobolevMultiIndex.contDiff_comp",  # ch9a, Calculus.toml: Proposition 9.5
]

[[node]]
id = "le_of_le_frontier"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.27 (maximum principle for the Dirichlet problem), upper
bound.** Let `Ω ⊆ ℝ^N` be open, `f ∈ L²(Ω)`, `u ∈ H^1(Ω)` with
`laplaceForm Ω u φ = ⟪f, fn φ⟫` for all `φ ∈ H^1_0(Ω)`, and `ũ` continuous on `closure Ω` with
`fn u =ᵐ[Ω] ũ`. If `ũ x ≤ K` for all `x ∈ frontier Ω` and `f ≤ K` a.e. on `Ω`, then `ũ x ≤ K` for
all `x ∈ Ω`. Together with `ge_of_ge_frontier` (apply it to `-u`, `-f`, `-K`) this is (70):
`min {inf_Γ u, inf_Ω f} ≤ u ≤ max {sup_Γ u, sup_Ω f}` on `Ω`, for both `|Ω| < ∞` and `|Ω| = ∞`.

Proof: `le_of_forall_truncation_mem` with `V = H^1_0(Ω)`; the admissibility of
`v = G(ũ - K')`: it is continuous on `closure Ω`, vanishes on `frontier Ω` (`ũ ≤ K < K'` there and
`G = 0` on `(-∞, 0]`), and its class is in `H^1(Ω)` by Proposition 9.5 — in the case `|Ω| < ∞`
applied to `t ↦ G(t - K') - G(-K')`, the constant `G(-K')` being in `L²` of a finite measure;
in the case `|Ω| = ∞`, `K' > 0` and `G(-K') = 0` — so it is in `H^1_0(Ω)` by Theorem 9.17
(i) ⇒ (ii), which needs no regularity of `Ω` (Remark 19). The a.e. bound becomes a pointwise one
on the open `Ω` by continuity. ★★★ (~250 lines beyond the engine). The book says "proceed as in
the proof of Theorem 8.18"; the one-dimensional maximum principle is its Theorem 8.19.'''
deps = [
  "le_of_forall_truncation_mem", "SobolevEuclideanZero",
  "SobolevEuclideanZero.mem_of_continuousOn_closure_of_eqOn_frontier",  # ch9a, Zero.toml: Theorem 9.17 (i) ⇒ (ii), any open Ω
]

