[[node]]
id = "le_of_classical"
kind = "theorem"
desc = '''**[brezis2011functional] Chapter 9, Remark 27: the maximum principle for classical
solutions of a general elliptic equation, by the second-derivative test.** Let `Ω` be bounded,
`ũ` continuous on `closure Ω` and `C²` on `Ω`, and suppose
`-∑_{ij} ∂_j (a_ij ∂_i ũ) + ∑_i a_i ∂_i ũ + ũ = f` on `Ω` with `a_ij ∈ C¹(Ω)` symmetric and
elliptic (`α |ξ|² ≤ ∑ a_ij(x) ξ_i ξ_j`) and `a_i` continuous. If `ũ ≤ K` on `frontier Ω` and
`f ≤ K` on `Ω`, then `ũ ≤ K` on `Ω`; the Laplacian is the case `a_ij = δ_ij`, `a_i = 0`, which
is the "other proof" of Theorem 9.27 for classical solutions.

Proof (p. 11605): `ũ` attains its maximum on the compact `closure Ω` at some `x₀`
(`IsCompact.exists_isMaxOn`). If `x₀ ∈ frontier Ω`, done. If `x₀ ∈ Ω`, then `∇ũ(x₀) = 0`
(`IsLocalMax.fderiv_eq_zero`) and the Hessian `D²ũ(x₀)` is negative semidefinite — Mathlib has
no second-order necessary condition; `IsLocalMax.iteratedFDeriv_two_nonpos`, planned here as a
companion node, restricts to the line `t ↦ ũ(x₀ + t ξ)` and derives `g''(0) ≤ 0` from
`isLocalMin_of_deriv_deriv_pos` by contradiction (a strict local minimum of `g` at a local
maximum forces `g` locally constant there, so `g''(0) = 0`). Then
`∑ a_ij(x₀) ∂_i∂_j ũ(x₀) = tr (A(x₀) D²ũ(x₀)) ≤ 0` because the trace of the product of a positive
semidefinite and a negative semidefinite symmetric matrix is `≤ 0` (`tr(A H) = tr(√A H √A)`, with
Mathlib's `Matrix.PosSemidef.sqrt`, or the book's diagonalization of `a_ij(x₀)` by an orthogonal
change of coordinates and the one-dimensional test along each eigen-direction), and the
first-order terms vanish at `x₀`, so `ũ(x₀) = f(x₀) + ∑ a_ij ∂_i∂_j ũ(x₀) + ∑ (∂_j a_ij) ∂_i ũ(x₀) ≤ f(x₀) ≤ K`.
★★ (~250 lines including the Hessian lemma). The remark's last sentence — that the conclusion
holds for *weak* solutions of (77) — is Gilbarg–Trudinger's theorem and is
`nonneg_of_nonneg_frontier_general`'s territory; not part of this node.'''
deps = []

[[node]]
id = "nonneg_of_nonneg_frontier_general_zero_drift"
kind = "theorem"
desc = '''**[brezis2011functional] Proposition 9.29, (79), in the case `a_i = 0` the book proves.**
Let `Ω ⊆ ℝ^N` be open, `A` with `IsUniformlyElliptic Ω A α`, `a₀ ∈ L^∞(Ω)` with `a₀ ≥ 0` a.e.,
`f ∈ L²(Ω)`, `u ∈ H^1(Ω)` with `generalForm Ω A 0 a₀ u φ = ⟪f, fn φ⟫` for all `φ ∈ H^1_0(Ω)`, and
`ũ` continuous on `closure Ω` with `fn u =ᵐ ũ`. If `ũ ≥ 0` on `frontier Ω` and `f ≥ 0` a.e. then
`ũ ≥ 0` on `Ω`. Also stated for `u ∈ H^1_0(Ω)` without `ũ`
(`nonneg_of_mem_zero_general_zero_drift`, via `SobolevMultiIndexZero.contDiff_comp_mem`), which
is the drift-free instance of Remark 23's second clause: with `f = 0` it gives `u ≥ 0` and
`u ≤ 0`, so the homogeneous kernel of `generalForm Ω A 0 a₀` on `H^1_0` is trivial and
`existsUnique_of_ker_eq_bot` applies.

Proof (p. 11636–11650), for the equivalent (79'): test with `φ = G(u) ∈ H^1_0(Ω)` (`G` from
`exists_truncation`; `G(u)` is continuous, vanishes on `Γ` where `u ≤ 0`, and is in `H^1` by
Proposition 9.5, hence in `H^1_0` by Theorem 9.17): `∫ ∑ a_ij ∂_i u ∂_j u G'(u) + ∫ a₀ u G(u) = ∫ f G(u) ≤ 0`;
the second term is `≥ 0` (`a₀ ≥ 0`, `u G(u) ≥ 0`), so by ellipticity
`α ∫ |∇u|² G'(u) ≤ 0`. With `H t = ∫₀ᵗ √G'` (`exists_truncation_sqrt_deriv`), `H(u) ∈ H^1_0(Ω)`
(same argument) and `|∇ H(u)|² = |∇u|² G'(u) = 0` a.e., so `∇ H(u) = 0` and
`SobolevMultiIndexZero.eq_zero_of_gradient_eq_zero` gives `H(u) = 0` a.e.; `H > 0` on `(0, ∞)`
forces `u ≤ 0` a.e., hence on `Ω` by continuity. ★★★ (~400 lines).'''
