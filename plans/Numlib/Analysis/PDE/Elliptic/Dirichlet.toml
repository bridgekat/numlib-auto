[[node]]
id = "finiteDimensional_ker_general"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.23, first half.** Let `Ω` be bounded, `A`, `a₁`, `a₀`
be `L^∞(Ω)` coefficients with `IsUniformlyElliptic Ω A α`, and `a = generalForm Ω A a₁ a₀`. The
space of weak solutions of the homogeneous problem (40),
`ker a := {u ∈ H^1_0(Ω) | ∀ v ∈ H^1_0(Ω), a u v = 0}` (a `Submodule ℝ (SobolevEuclidean N 1 2 Ω)`,
`homogeneousKernel Ω a`), is finite-dimensional.

Proof (p. 11265): fix `λ` from `generalForm_garding` so that `a_λ = a + λ ⟨·,·⟩_{L²}` is coercive
on `H^1_0`, and let `T = solutionOperator Ω a_λ _`, compact by `solutionOperator_isCompactOperator`.
`u` solves (40) with datum `f` iff `u = T (f + λ u)` as functions; with `f = 0`, `u ∈ ker a` iff
the function `w = fn u` satisfies `w = λ T w`, so `fn` maps `ker a` injectively
(`SobolevMultiIndex.ext_of_fn_ae_eq`) onto `ker (1 - λ T) ⊆ L²(Ω)`, which is finite-dimensional by
`IsCompactOperator.finiteDimensional_ker_pow` (at the power `1`, with `μ = 1` and `K = λ T`).
★★★ (~250 lines: the equivalence "(40) ⇔ `u = T(f + λu)`", which is `solutionOperator_spec` plus
the algebra of forms, is the bulk).'''
deps = ["generalForm_garding", "solutionOperator", "solutionOperator_isCompactOperator", "IsCompactOperator.finiteDimensional_ker_pow", "SobolevMultiIndex.ext_of_fn_ae_eq"]

[[node]]
id = "exists_orthogonality_iff_exists_solution"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.23, second half (the Fredholm alternative for (40)).**
Under the hypotheses of `finiteDimensional_ker_general` there is a subspace `F ⊆ L²(Ω)` with
`finrank ℝ F = finrank ℝ (homogeneousKernel Ω a)` such that, for every `f ∈ L²(Ω)`,
`(∃ u, IsGalerkinSolution a (load Ω f) (SobolevEuclideanZero N 1 2 Ω) u) ↔ ∀ v ∈ F, ⟪f, v⟫ = 0`.

Proof (p. 11265–11275): with `T` and `λ` as in `finiteDimensional_ker_general`, (40) has a
solution iff `v - λ T v = f` has a solution `v ∈ L²(Ω)` (then `u = T v`; conversely
`v = f + λ u`), i.e. iff `f ∈ range (1 - λ T)`. On the Hilbert space `L²(Ω)` the solvability
criterion `IsCompactOperator.range_smul_sub_eq_orthogonal_ker_adjoint` (with `μ = 1`, `K = λ T`)
gives `range (1 - λT) = (ker (1 - λ T†))ᗮ`, so `F := ker (1 - λ T†)` works, and
`IsCompactOperator.finrank_ker_eq_finrank_ker_adjoint` gives `finrank F = finrank (ker (1 - λT))`,
which is the dimension of `homogeneousKernel Ω a` by the injection of the first half. The book
routes through its Theorem 6.6 (the Banach-space Fredholm alternative); the Hilbert-space form
of `Numlib/Analysis/Normed/Operator/{Compact,Riesz}` is what is available and is sufficient. ★★★
(~250 lines beyond the first half).'''
deps = ["finiteDimensional_ker_general", "IsCompactOperator.range_smul_sub_eq_orthogonal_ker_adjoint", "IsCompactOperator.finrank_ker_eq_finrank_ker_adjoint", "load"]

[[node]]
id = "existsUnique_of_ker_eq_bot"
kind = "theorem"
desc = '''**[brezis2011functional] Chapter 9, Remark 23, first clause**: under the hypotheses of
Theorem 9.23, if the homogeneous problem (40) has only the zero solution
(`homogeneousKernel Ω a = ⊥`), then for every `f ∈ L²(Ω)` there is exactly one weak solution of
