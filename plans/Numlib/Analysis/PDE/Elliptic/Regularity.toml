[[node]]
id = "regularity_dirichlet_higher"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, the `H^{m+2}` clause.** For `Ω` of class `C^{m+2}`
(`IsContDiffChartDomain (m + 2) Ω`) with bounded boundary there is `C` such that, under the
hypotheses of `regularity_dirichlet`, `f ∈ H^m(Ω)` implies `u ∈ H^{m+2}(Ω)` with
`‖u‖_{H^{m+2}} ≤ C ‖f‖_{H^m}`. Proof (p. 11374, "the implication `f ∈ H^m ⇒ u ∈ H^{m+2}` is done
by induction on `m` as in cases A and B"): the interior piece is `regularity_top_higher`; on the
cylinder the induction of `regularity_upperHalfSpace_higher` is repeated for the
variable-coefficient form, which needs (i) Lemma 9.7 for the general form on `Q₊` — the
tangential derivative `∂_j w ∈ H^1_0(Q₊)` solves the equation with datum
`∂_j g̃ - ∑ ∂_ℓ((∂_j a_{kℓ}) ∂_k w)` (a `C^m` coefficient hypothesis, which is where the class
`C^{m+2}` of the chart enters through Lemma 9.8) — and (ii) the normal derivatives from the
equation divided by `a_{NN}`. ★★★ (~500 lines beyond `regularity_dirichlet`). Lower priority than
the `m = 0` clause: no consumer in this corpus needs `m ≥ 1` on a domain except the `C²` and
`C^∞` clauses below and Remark 29.

Blocked: depends on `regularity_upperHalfSpace_higher` (open) and on a higher-order version of
the chart transfer: `transfer_chart` only records the equation, `chartCoeff` is `C¹` for a `C²`
chart (`contDiffOn_chartCoeff`), and `memSobolevMultiIndex_two_comp_chart` returns `H²` only; the
higher clause needs the coefficients `C^{m+1}` (a `C^{m+2}` chart) and the retransfer at order
`m + 2` (`HasWeakIteratedLineDerivOn.mul` iterated). The `H²` skeleton
(`memSobolevMultiIndex_two_boundary_piece`, `memSobolevMultiIndex_two_interior_piece`,
`regularity_dirichlet_mem`) is the template. Estimate ★★★ (~500 lines beyond the half space).'''
deps = ["regularity_dirichlet", "regularity_top_higher", "regularity_upperHalfSpace_higher", "transfer_chart"]

[[node]]
id = "regularity_dirichlet_contDiffOn"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, the `C²(Ω̄)` clause**: for `Ω` of class `C^{m+2}`
with bounded boundary, `f ∈ H^m(Ω)` and `m > N/2`, the weak solution `u` agrees almost
everywhere with a function `ũ` with `ContDiffOn ℝ 2 ũ (closure Ω)` (the book's `C²(Ω̄)`: the
derivatives up to order `2` extend continuously to `Ω̄`). From `regularity_dirichlet_higher` and
Corollary 9.15 of chapter 9a, `W^{m+2,2}(Ω) ⊆ C^k(Ω̄)` for `k = ⌊m + 2 - N/2⌋ ≥ 2` when
`m > N/2` (with the footnote-16 caveat for integer `m - N/2` handled by the `p = N` case of the
embedding chain). ★★ (~100 lines). Consumes chapter 9a's embedding on a domain.

Blocked: depends on `regularity_dirichlet_higher` (open) and on
`SobolevEuclidean.exists_contDiffOn_closure_ae_eq_of_order` (sob11), absent from this worktree.'''
deps = [
  "regularity_dirichlet_higher",
  "SobolevEuclidean.exists_contDiffOn_closure_ae_eq_of_order",  # ch9a, EmbeddingDomain.toml: Corollary 9.15, the C^k(Ω̄) clause
]

[[node]]
id = "regularity_dirichlet_smooth"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, the `C^∞(Ω̄)` clause**: for `Ω` of class `C^∞`
(`IsContDiffChartDomain ⊤ Ω`) with bounded boundary and `f` agreeing almost everywhere with a
function in `C^∞(Ω̄)` all of whose derivatives are bounded on `Ω` (on a bounded `Ω`, any function
`ContDiffOn ℝ ⊤ f (closure Ω)`), the weak solution `u` agrees almost everywhere with a function
`ContDiffOn ℝ ⊤ ũ (closure Ω)`. Proof: such an `f` is in `H^m(Ω)` for every `m` (a bounded
`C^m(Ω̄)` function on a set of finite measure is in `W^{m,2}`; for unbounded `Ω` with bounded
`Γ` the hypothesis `f ∈ H^m(Ω)` for all `m` is taken instead), so `u ∈ H^{m+2}(Ω)` for every `m`
by `regularity_dirichlet_higher`, hence `u ∈ C^k(Ω̄)` for every `k` by the argument of
`regularity_dirichlet_contDiffOn`, and the representatives glue as in
`MemSobolevMultiIndexLoc.exists_contDiffOn`. ★★ (~120 lines).

Blocked: depends on `regularity_dirichlet_higher` and `regularity_dirichlet_contDiffOn`, both
open.'''
deps = ["regularity_dirichlet_higher", "regularity_dirichlet_contDiffOn"]

[[node]]
id = "regularity_neumann"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). **[brezis2011functional] Theorem 9.26 (regularity for the Neumann problem)**: the
conclusions of Theorem 9.25 for `u ∈ H^1(Ω)` with `laplaceForm Ω u φ = ⟪f, fn φ⟫` for all
`φ ∈ H^1(Ω)`; stated for the `H²` clause with `‖u‖_{H²} ≤ C ‖f‖₂`, and for the `H^{m+2}` clause
as `regularity_neumann_higher`. The book proves nothing ("entirely analogous"), and the route is:
case A is `regularity_top` unchanged; case B goes through with `φ = D_{-h}(D_h u) ∈ H^1(ℝ^N_+)`
(no boundary condition is needed for a tangential translate to be admissible, so Lemma 9.7's
delicate point disappears); in case C₂ the localized `v = θ_i u` satisfies the equation against
the test space `V_i = {φ ∈ H^1(Ω ⊓ U_i) : φ = 0 near ∂U_i ∩ Ω̄}`, which transfers under the chart
to the space `V` of functions of `H^1(Q₊)` vanishing near the lateral and top boundary of `Q₊`, a
closed subspace containing `𝓓(Q₊)` and invariant under small tangential translations of functions
supported in `{|x'| < 1 - δ, x_N < 1 - δ}`; `tangential_estimate_cylinder` applies with this `V`,
(67) follows as before, and (68) uses the equation tested against `ψ / a_{NN}` for `ψ ∈ 𝓓(Q₊)`,
which is in `V`. What is *not* recovered is the boundary condition `∂u/∂n = 0`, which has no
meaning without a trace. ★★★ (~600 lines given the Dirichlet case, most of it the two variants of
`transfer_chart` and of the assembly with the new test space). Not needed by any consumer in this
round; planned so that the estimate's parametrization by `V` is fixed now.'''
deps = ["regularity_top", "regularity_upperHalfSpace", "gradNorm_diffQuotL_le_of_invariant", "transfer_chart", "regularity_dirichlet"]

[[node]]
id = "regularity_dirichlet_general"
kind = "theorem"
desc = '''Deferred (2026-09-17 policy: the book states this without proof, and no planned node needs it — formalize last, if at all). **[brezis2011functional] Chapter 9, Remark 24: regularity for a general second-order
elliptic operator.** For `Ω` of class `C²` with bounded boundary, coefficients `a_ij` in
`C¹(Ω̄)` (with bounded derivatives if `Ω` is unbounded, footnote 26) satisfying the ellipticity
condition, `a_i ∈ C(Ω̄)`, `a₀ ∈ L^∞(Ω)`, `f ∈ L²(Ω)` and `u ∈ H^1_0(Ω)` with
`generalForm Ω A a₁ a₀ u φ = ⟪f, fn φ⟫` for all `φ ∈ H^1_0(Ω)`: `u ∈ H²(Ω)`; and for `m ≥ 1`,
`a_ij ∈ C^{m+1}(Ω̄)`, `a_i ∈ C^m(Ω̄)`, `Ω` of class `C^{m+2}`, `f ∈ H^m(Ω)`: `u ∈ H^{m+2}(Ω)`.
The book gives no proof; the route is the one already taken for the Laplacian, since case C₂ is
*already* the variable-coefficient estimate: move the lower-order terms `∑ a_i ∂_i u + a₀ u` to
the right-hand side (they are in `L²`), so that only the principal part `∑ a_ij ∂_i ∂_j` remains;
case A and C₁ become `tangential_estimate_cylinder`'s argument with translations in all
directions on `ℝ^N` (the product formula for `D_h(a_ij ∂_i u)` is the only change from
`regularity_top`); case C₂ is `transfer_chart_general` (footnote 28) followed by
`regularity_unitChartCubePos` unchanged. ★★★ (~600 lines beyond Theorem 9.25). Lowest priority
of this file: no consumer, and the book itself does not prove it.'''
deps = ["regularity_dirichlet", "transfer_chart", "memSobolevMultiIndex_two_of_tangential_of_compact", "generalForm"]
