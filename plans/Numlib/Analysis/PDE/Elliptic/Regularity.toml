namespace = "Elliptic"
desc = '''
Regularity of weak solutions of the Dirichlet problem: [brezis2011functional] §9.6, Theorem 9.25
(and Theorem 9.26, Remark 24, Remark 25), by L. Nirenberg's method of translations (difference
quotients). The statement to be reached: for `Ω ⊆ ℝ^N` of class `C²` with bounded boundary (or
the half space), `f ∈ L²(Ω)` and `u ∈ H^1_0(Ω)` with `∫ ∇u·∇φ + ∫ uφ = ∫ fφ` for all
`φ ∈ H^1_0(Ω)`, one has `u ∈ H²(Ω)` with `‖u‖_{H²} ≤ C ‖f‖_{L²}`; for `Ω` of class `C^{m+2}` and
`f ∈ H^m(Ω)`, `u ∈ H^{m+2}(Ω)` with `‖u‖_{H^{m+2}} ≤ C ‖f‖_{H^m}`; hence `u ∈ C²(Ω̄)` when
`m > N/2`, and `u ∈ C^∞(Ω̄)` when `Ω` and `f` are `C^∞`.

## The four cases, and what is stated for each

The book proves the theorem in four cases and the plan gives each its own node, in the order a
formalizer should take them:

* **A, `Ω = ℝ^N`** (`regularity_top`): for `u ∈ H^1(ℝ^N)`, `g ∈ L²(ℝ^N)` and
  `∫ ∇u·∇φ = ∫ gφ` for all `φ ∈ H^1(ℝ^N)`, `u ∈ H²(ℝ^N)` and `‖∂_j∂_k u‖₂ ≤ ‖g‖₂`. Stated for the
  Dirichlet form alone; the book's form `-Δu + u = f` is the case `g = f - u`. The tool is the
  difference quotient `D_h u = (τ_h u - u)/|h|`, its adjointness `∫ (D_h u) v = ∫ u (D_{-h} v)`,
  and Proposition 9.3 in both directions (chapter 9a).
* **C₁, interior** (`regularity_interior`, `regularity_interior_higher`): this is Remark 25 —
  on an *arbitrary* open `Ω`, `u ∈ H^1_loc(Ω)`, `f ∈ H^m_loc(Ω)` and `∫ ∇u·∇φ = ∫ fφ` for all
  `φ ∈ C_c^∞(Ω)` give `u ∈ H^{m+2}_loc(Ω)`. It is planned *before* the boundary cases and
  independently of them, because Theorem 9.31 (`Elliptic/Spectral`) and the heat equation of
  Chapter 10 need only it. The local Sobolev space is chapter 9a's `MemSobolevMultiIndexLoc`
  (`Numlib/Analysis/Sobolev/Cutoff`), "in `W^{k,p}(ω)` for every `ω ⋐ Ω`"; the book's
  `θ u ∈ H^{m+2}(Ω)` for every `θ ∈ C_c^∞(Ω)` is the equivalent
  `MemSobolevMultiIndexLoc.smul_testFunction` there, and the `C^∞` representative of a function in
  every `H^m_loc` is `MemSobolevMultiIndexLoc.exists_contDiffOn` (`Sobolev/Embedding`). No Leibniz
  rule of order `m` is needed:
  the induction on `m` differentiates the *equation* (`∂_j u` solves it with datum `∂_j f`) and
  the multi-index bookkeeping is `HasWeakIteratedLineDerivOn.cons` and the permutation symmetry
  `HasWeakIteratedLineDerivOn.comp_perm`.
* **B, the half space** (`regularity_upperHalfSpace`, Lemmas 9.6 and 9.7, higher order): the
  translations are tangential, `H^1_0(ℝ^N_+)` is invariant under them, the estimate
  `‖D_h u‖_{H^1} ≤ ‖g‖₂` gives all second derivatives but `∂_N∂_N u`, which the equation
  supplies; the higher-order induction needs the tangential derivative of `u` to stay in
  `H^1_0`, which is Lemma 9.7 and costs a weak-compactness argument.
* **C₂, near the boundary** (Lemma 9.8, `tangential_estimate_cylinder`,
  `regularity_unitChartCubePos`, `regularity_dirichlet`): a `C²` chart `H : Q → U` transfers
  `θᵢ u` to `w ∈ H^1_0(Q₊)`, which solves a *variable-coefficient* elliptic equation with
  `C¹(Q̄₊)` coefficients (Lemma 9.8, Mathlib's change of variables
  `MeasureTheory.integral_image_eq_integral_abs_det_fderiv_smul` and chapter 9a's Proposition 9.6);
  the tangential estimate is case B again with the coefficients carried along ((63)–(69)); `w`
  is transferred back and the pieces are summed over the partition of unity of Lemma 9.3
  (chapter 9a's `Chart`).

The estimate of case C₂ is stated for a general elliptic form with `C¹` coefficients and for a
*test space* `V` with `𝓓(Q₊) ⊆ V ⊆ H^1(Q₊)` invariant under small tangential translations, and
the Dirichlet theorem takes `V = H^1_0(Q₊)`. That is what makes Theorem 9.26 (Neumann: `V` the
functions of `H^1(Q₊)` vanishing near the lateral and top boundary) and Remark 24 (general
operator) the same estimates with different inputs; both are planned with that route and marked
as the long tail.

## Hypotheses on the domain

"Of class `C^m`" is chapter 9a's `IsContDiffChartDomain m Ω` (planning brief D9; the surface's
§9.6 definition). The theorem is stated for `Bornology.IsBounded (frontier Ω)`, as the book does,
and the half space separately; the unbounded-`Ω` case needs only the second form of Remark 4 (ii)
for the interior piece `θ₀ u` (a `C¹ ∩ L^∞` cut-off with bounded gradient supported off `Γ`), which
chapter 9a's `Cutoff` supplies. `Ω = ℝ^N_+`, `Q` and `Q₊` are chapter 9a's `EuclideanSpace.upperHalfSpace`, `unitChartCube`
and `unitChartCubePos` (`Chart.toml`) on `EuclideanSpace ℝ (Fin (d + 1))`, the coordinates of
`Numlib/Analysis/Sobolev/Domain`.

## Constants

Case A gives explicit constants (`‖∂_j∂_k u‖₂ ≤ ‖g‖₂`, `‖u‖_{H²} ≤ √(1 + N(N+1)/2) ‖g‖₂` for the
multi-index norm together with `‖u‖_{H¹} ≤ ‖g‖₂`); case B gives `‖∂_N∂_N u‖₂ ≤ N ‖g‖₂`; the
chart cases give a constant depending on `Ω` only through the charts and the partition of unity,
and the theorems state `∃ C, ∀ f u, …` with `C` quantified before `f`, which is what "depending
only on `Ω`" means.
'''

[[node]]
id = "diffQuot"
kind = "definition"
desc = '''`diffQuot (h : E) (u : E → F) : E → F`, the difference quotient
`D_h u x = ‖h‖⁻¹ • (u (x + h) - u x)` of [brezis2011functional] §9.6, case A. Companion lemmas
for `E = EuclideanSpace ℝ (Fin N)` and Lebesgue measure: `diffQuot_memLp` (`u ∈ L^p ⇒ D_h u ∈ L^p`,
with `‖D_h u‖_p ≤ 2 ‖h‖⁻¹ ‖u‖_p`, from the translation invariance
`MeasureTheory.Lp.compMeasurePreserving (· + h) (measurePreserving_add_right volume h)`),
`integral_diffQuot_mul` (adjointness, `∫ (D_h u) v = ∫ u (D_{-h} v)` for `u, v ∈ L²`, the change of
variables `x ↦ x - h`), and `diffQuot_hasWeakIteratedLineDerivOn` (`D_h` commutes with the weak
derivative along any tuple: `∂^y (D_h u) = D_h (∂^y u)` on `ℝ^N`, because `φ ↦ φ(· - h)` maps
test functions to test functions). On an open `Ω` with `Ω + t h = Ω` for all `t` (the half space
and a tangential `h`) the same three lemmas hold for `volume.restrict Ω`
(`diffQuot_memLp_restrict_of_add_eq`, …), which is what case B uses. ★★ (~200 lines for the
family).'''
deps = []

[[node]]
id = "diffQuotH1"
kind = "definition"
desc = '''`diffQuotH1 (h : EuclideanSpace ℝ (Fin N)) : SobolevEuclidean N 1 2 ⊤ →L[ℝ] SobolevEuclidean N 1 2 ⊤`,
the difference quotient as a bounded operator on `H^1(ℝ^N)`: the family of `D_h (∂^α u)` for
`|α| ≤ 1`, which is in `H^1` by `diffQuot_hasWeakIteratedLineDerivOn`. With `fn_diffQuotH1`
(`fn (D_h u) = D_h (fn u)` a.e.) and `weakDeriv_diffQuotH1` (`∂ᵢ (D_h u) = D_h (∂ᵢ u)`). The
proof of case A tests the equation with `φ = D_{-h} (D_h u)`, so `D_h u` must be an element of
the space `H^1(ℝ^N)`, not merely a function. ★ (~80 lines).'''
deps = ["diffQuot", "SobolevEuclidean"]

[[node]]
id = "regularity_top"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, case A (`Ω = ℝ^N`), `H²` regularity.** Let
`u ∈ H^1(ℝ^N) = SobolevEuclidean N 1 2 ⊤`, `g ∈ L²(ℝ^N)`, and `dirichletForm ⊤ u φ = ⟪g, fn φ⟫`
for every `φ ∈ H^1(ℝ^N)`. Then `MemSobolevMultiIndex b (fn u) 2 2 ⊤ volume` — `u ∈ H²(ℝ^N)` —
and, for the element `U ∈ SobolevEuclidean N 2 2 ⊤` it determines, `‖∂_j∂_k U‖₂ ≤ ‖g‖₂` for all
`j, k`, hence `‖U‖_{H²}² ≤ ‖u‖_{H¹}² + (N(N+1)/2) ‖g‖₂²`. The book's equation `-Δu + u = f`
is the case `g = f - u`, with `‖u‖_{H¹} ≤ ‖f‖₂`, which gives its `‖u‖_{H²} ≤ C ‖f‖₂`.

Proof (p. 11256–11290, followed line by line): test with `φ = D_{-h}(D_h u)` (`diffQuotH1`);
`∫ |∇ D_h u|² = ∫ g D_{-h}(D_h u)` by `weakDeriv_diffQuotH1` and the adjointness
`integral_diffQuot_mul`; `‖D_{-h}(D_h u)‖₂ ≤ ‖∇ D_h u‖₂` is Proposition 9.3 (i) ⇒ (iii) on `ℝ^N`
(chapter 9a); so `‖∇ D_h u‖₂ ≤ ‖g‖₂`, i.e. `‖D_h (∂_j u)‖₂ ≤ ‖g‖₂` for all `h ≠ 0`; and
Proposition 9.3 (iii) ⇒ (i) at `p = 2` (chapter 9a) applied to `∂_j u ∈ L²(ℝ^N)` gives
`∂_j u ∈ H^1(ℝ^N)` with `‖∂_k ∂_j u‖₂ ≤ ‖g‖₂`. The multi-index bookkeeping — `∂^α u` for
`|α| = 2` is `∂_k (∂_j u)` for the two entries of `α` — is `HasWeakIteratedLineDerivOn.cons`
with `multiIndexTuple` of an order-two multi-index, packaged as chapter 9a's `memSobolevMultiIndex_succ_iff` (`u ∈ W^{m+1,p} ↔ u ∈ W^{m,p} ∧ ∀ i, ∂ᵢu ∈ W^{m,p}`). ★★★ (~350 lines).'''
deps = [
  "diffQuotH1", "dirichletForm",
  "HasWeakFDerivOn.eLpNorm_sub_translate_le",  # ch9a, Friedrichs.toml: Proposition 9.3 (i) ⇒ (iii)
  "abs_integral_smul_fderiv_le_of_eLpNorm_sub_translate_le",  # ch9a, Friedrichs.toml: Proposition 9.3 (iii) ⇒ (ii)
  "HasWeakFDerivOn.of_forall_abs_integral_smul_fderiv_le",  # ch9a, Friedrichs.toml: Proposition 9.3 (ii) ⇒ (i)
  "HasWeakIteratedLineDerivOn.cons", "memSobolevMultiIndex_succ_iff",
  "MemSobolevMultiIndex.exists_sobolevMultiIndex",
]

[[node]]
id = "regularity_top_higher"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, case A, higher order.** Under the hypotheses of
`regularity_top`, if moreover `g ∈ H^m(ℝ^N)` then `u ∈ H^{m+2}(ℝ^N)`, with
`‖u‖_{H^{m+2}} ≤ C_{N,m} (‖u‖_{H¹} + ‖g‖_{H^m})`.

Proof (p. 11292–11308): by induction on `m`. For `m + 1`: each `∂_j u ∈ H^1(ℝ^N)` (by the
previous step) satisfies `∫ ∇(∂_j u)·∇φ = ∫ (∂_j g) φ` for all `φ ∈ H^1(ℝ^N)` — for
`φ ∈ C_c^∞(ℝ^N)` this is the equation tested with `∂_j φ`, moving one derivative across
(`HasWeakIteratedLineDerivOn.cons`/`of_cons` and the permutation symmetry
`HasWeakIteratedLineDerivOn.comp_perm` for `∂_i ∂_j φ = ∂_j ∂_i φ`), and it extends to `H^1(ℝ^N)` by
the density of `C_c^∞(ℝ^N)` in `H^1(ℝ^N)`, which is Remark 17 / Theorem 9.2 of chapter 9a in the
form `SobolevMultiIndexZero … ⊤ = ⊤`. The inductive hypothesis applied to `∂_j u` and `∂_j g`
gives `∂_j u ∈ H^{m+2}`, hence `u ∈ H^{m+3}` (`cons` once more). ★★ (~200 lines).'''
deps = [
  "regularity_top", "HasWeakIteratedLineDerivOn.cons", "HasWeakIteratedLineDerivOn.of_cons",
  "HasWeakIteratedLineDerivOn.comp_perm",
  "SobolevEuclideanZero.eq_top",  # ch9a, Zero.toml: Remark 17, W_0^{1,p}(ℝ^N) = W^{1,p}(ℝ^N)
]

[[node]]
id = "regularity_interior"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, case C₁ = Remark 25 at `m = 0`: interior `H²`
regularity on an arbitrary open set.** Let `Ω ⊆ ℝ^N` be open, `u ∈ H^1_loc(Ω)`
(`MemSobolevMultiIndexLoc b u 1 2 Ω volume`), `f ∈ L²_loc(Ω)` (`LocallyMemLpOn f 2 Ω`), and
`∫_Ω ∑ᵢ ∂ᵢu ∂ᵢφ = ∫_Ω f φ` for every `φ ∈ 𝓓(Ω, ℝ)`. Then `u ∈ H²_loc(Ω)`; and for every
`ω ⋐ Ω` there is `C` (depending on `ω`, `Ω`) with `‖u‖_{H²(ω)} ≤ C (‖u‖_{H¹(ω')} + ‖f‖_{L²(ω')})`
for some `ω ⋐ ω' ⋐ Ω`.

Proof (p. 11374–11384): given `ω ⋐ Ω`, take `θ ∈ 𝓓(Ω)` equal to `1` on a neighbourhood of
`closure ω` (`IsCompact.exists_contDiff_eqOn_one`); `θu` extended by zero is in `H^1(ℝ^N)`
(Remark 4 (ii), chapter 9a's `Cutoff`); for `φ ∈ 𝓓(ℝ^N)` the equation tested with `θφ ∈ 𝓓(Ω)`
and the product rule `HasWeakIteratedLineDerivOn.mul_contDiff` give
`∫ ∇(θu)·∇φ = ∫ g φ` with `g = θ f - 2 ∇θ·∇u - (Δθ) u`, which is in `L²(ℝ^N)` (a compactly
supported combination of `L²_loc` functions); the identity extends to `φ ∈ H^1(ℝ^N)` by density
(`SobolevMultiIndexZero.eq_top`, chapter 9a); `regularity_top` gives `θu ∈ H²(ℝ^N)`, and
`θu = u` on `ω` gives `u ∈ H²(ω)` (`HasWeakIteratedLineDerivOn.mono` and `congr_ae`). ★★★
(~300 lines; the computation of `g` and its membership are the bulk).'''
deps = [
