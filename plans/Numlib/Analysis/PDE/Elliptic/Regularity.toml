[[node]]
id = "regularity_upperHalfSpace_higher"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, case B, higher order**: under the hypotheses of
`regularity_upperHalfSpace`, if `g ∈ H^m(ℝ^N_+)` then `u ∈ H^{m+2}(ℝ^N_+)` with
`‖u‖_{H^{m+2}} ≤ C_{N,m} (‖u‖_{H¹} + ‖g‖_{H^m})`. Proof (p. 11371): induction on `m`; for `m + 1`
apply the inductive hypothesis to the tangential derivatives `∂_j u ∈ H^1_0(Ω)` (Lemma 9.7,
`tangentialDeriv_mem_zero_of_isGalerkinSolution`) with data `∂_j g ∈ H^m(Ω)`, which gives every
`∂^α u` with `α_N ≤ 1`… more precisely every derivative of order `m + 3` containing a tangential
factor; the remaining one, `∂_N^{m+3} u`, is read off the equation
`∂_N∂_N u = -∑_{i<N} ∂_i∂_i u - g ∈ H^{m+1}(Ω)` (the weak identity of `regularity_upperHalfSpace`
lifted to `H^{m+1}` by the inductive hypothesis). ★★ (~250 lines).

Blocked: not attempted (effort spent on the `H²` clause and its constant). The pieces are in
place: Lemma 9.7 is `tangentialDeriv_mem_zero_of_sobolev_two` (membership of `∂_j u` in
`H^1_0`, without equation (58)), the `H²` case is `exists_sobolevEuclidean_two_of_tangential`
(variable coefficients, any tangentially invariant `Ω`), and the normal second derivative from
the equation is `exists_hasWeakIteratedLineDerivOn_last_of_forall`. Missing: (58) for the
derivative `∂_j u` (test the equation with `∂_j φ` and move the derivative, as in
`forall_testFunction_deriv` of case A), an order-lowering map `H^{m+1} → H^m` on
`SobolevMultiIndex` (only the predicate-level `memSobolevMultiIndex_succ_iff` exists), and the
induction assembling `∂^α u` for `α_N ≤ m + 2` from the tangential derivatives and the rest from
the equation. Estimate ★★★ (~350 lines).'''
deps = ["regularity_upperHalfSpace", "tangentialDeriv_mem_zero_of_isGalerkinSolution", "HasWeakIteratedLineDerivOn.cons"]

