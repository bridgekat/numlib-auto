[[node]]
id = "tangential_estimate_cylinder"
kind = "theorem"
desc = '''**The tangential difference-quotient estimate on `Q₊` for a variable-coefficient elliptic
form**, [brezis2011functional] (63)–(66). Let `a_{kℓ}` be `C¹` on `Q̄₊` with
`IsUniformlyElliptic Q₊ a α`, let `V` be a closed subspace of `H^1(Q₊)` with `𝓓(Q₊) ⊆ V` such that
`D_h ψ ∈ V` for every `ψ ∈ V` supported in `{|x'| < 1 - δ, 0 ≤ x_N < 1 - δ}` and every tangential
`h` with `|h| < δ` (`V = H^1_0(Q₊)` qualifies, by `translate_mem_sobolevZero_of_tangential`
localized), and let `w ∈ V` with support in that set satisfy `generalForm Q₊ a 0 0 w ψ = ⟪g̃, fn ψ⟫`
for all `ψ ∈ V`. Then for tangential `h` with `|h| < δ`,
`‖∇ D_h w‖_{L²(Q₊)} ≤ C (‖w‖_{H¹(Q₊)} + ‖g̃‖₂)` with `C` depending only on `α`, `N` and the
`C¹` norms of the `a_{kℓ}`.

Proof (p. 11448–11470): test with `ψ = D_{-h}(D_h w) ∈ V`; the left side is
`∑ ∫ D_h(a_{kℓ} ∂_k w) ∂_ℓ(D_h w)` (adjointness), and the product formula
`D_h(a_{kℓ} ∂_k w)(y) = a_{kℓ}(y + h) ∂_k D_h w(y) + (D_h a_{kℓ})(y) ∂_k w(y)` splits it into
`≥ α ‖∇ D_h w‖² - C ‖w‖_{H¹} ‖∇ D_h w‖` (ellipticity at the translated point, and
`|D_h a_{kℓ}| ≤ ‖∇ a_{kℓ}‖_∞` by the mean value theorem — `abs_sub_le_mul_of_abs_deriv_le`
along the segment); the right side is `≤ ‖g̃‖₂ ‖∇ D_h w‖₂` by Lemma 9.6 on `Q₊` (whose proof is
the same as on the half space for functions supported away from the lateral boundary, or
follows from the half-space lemma applied to the zero extension); divide by `‖∇ D_h w‖`. ★★★
(~450 lines). The test space `V` is a parameter so that Theorem 9.26 and Remark 24 reuse the
estimate.'''
deps = ["generalForm", "IsUniformlyElliptic", "diffQuot", "eLpNorm_diffQuot_le_of_tangential", "translate_mem_sobolevZero_of_tangential", "abs_sub_le_mul_of_abs_deriv_le"]

