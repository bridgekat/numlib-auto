[[node]]
id = "translate_mem_sobolevZero_of_tangential"
kind = "theorem"
desc = '''`H^1_0(ℝ^N_+)` is invariant under tangential translations, [brezis2011functional] (54): for
`h` with `h (Fin.last d) = 0` and `u ∈ SobolevEuclideanZero (d+1) 1 2 (EuclideanSpace.upperHalfSpace d)`, the
translate `τ_h u = u(· + h)` is again in `H^1_0(ℝ^N_+)`; more generally for any open `Ω` with
`Ω + h = Ω`. Proof: `τ_h` maps `𝓓(Ω)` to `𝓓(Ω)` (the support moves by `-h`, which stays in `Ω`),
it is an isometry of `H^1(Ω)` (translation invariance of Lebesgue measure and
`diffQuot_hasWeakIteratedLineDerivOn`-style commutation with the weak derivative), and an
isometry that preserves a set preserves its closure. Consequently `D_h u ∈ H^1_0(Ω)` for such
`h`, which is what lets case B test the equation with `D_{-h}(D_h u)`. ★★ (~120 lines).'''
deps = ["SobolevEuclideanZero", "diffQuot", "SobolevMultiIndex.testFunctions"]

[[node]]
id = "eLpNorm_diffQuot_le_of_tangential"
kind = "theorem"
desc = '''**[brezis2011functional] Lemma 9.6**: for `v ∈ H^1(ℝ^N_+)` and `h ≠ 0` parallel to the
boundary (`h (Fin.last d) = 0`), `‖D_h v‖_{L²(ℝ^N_+)} ≤ ‖∇v‖_{L²(ℝ^N_+)}`, i.e.
`eLpNorm (diffQuot h (fn v)) 2 (volume.restrict Ω) ≤ (∑ᵢ ‖∂ᵢv‖₂²)^{1/2}`.

Proof (p. 11320): for `v` the restriction of a `C¹_c(ℝ^N)` function the computation of the proof
of Proposition 9.3 applies verbatim, because `Ω + t h = Ω` for all `t ∈ [0, 1]` keeps the segment
`x + [0,1] h` inside `Ω` (`|τ_h v(x) - v(x)|² ≤ |h|² ∫₀¹ |∇v(x + th)|² dt`, then Fubini and the
translation invariance of `volume.restrict Ω`); a general `v ∈ H^1(ℝ^N_+)` is a limit in `H^1(Ω)`
of such restrictions by the density of `C_c^∞(ℝ^N)|_Ω` in `W^{1,p}(ℝ^N_+)` — chapter 9a's
`SobolevEuclidean.exists_seq_contDiff_hasCompactSupport_tendsto_upperHalfSpace` (`Reflection.lean`:
the reflection extension of Lemma 9.2 followed by the whole-space density of `Density.lean`; it
does **not** need the extension theorem 9.7 or Corollary 9.8 on a general `C¹` domain, so this
module's half-space case is independent of `Extension.lean`), and both sides are continuous in
`v`. ★★ (~150 lines). The constant is `1` exactly as in the book: the density transfers the
`C_c^1` computation verbatim, while estimating through the reflected function directly would
only give `√2`.'''
