[[node]]
id = "transfer_chart"
kind = "theorem"
desc = '''**[brezis2011functional] Lemma 9.8: a `C²` chart turns the Dirichlet form into a
variable-coefficient elliptic form.** Let `H : Q → U` be a chart of class `C²` up to the boundary
with inverse `J`, `H(Q₊) = U ∩ Ω` (chapter 9a's `IsContDiffChartDomain 2` data), let
`v ∈ H^1_0(Ω ⊓ U)` satisfy `dirichletForm (Ω ⊓ U) v φ = ⟪g, fn φ⟫` for all `φ ∈ H^1_0(Ω ⊓ U)`, and
set `w = v ∘ H` on `Q₊`. Then `w ∈ H^1_0(Q₊)` and
`∑_{k,ℓ} ∫_{Q₊} a_{kℓ} ∂_k w ∂_ℓ ψ = ∫_{Q₊} g̃ ψ` for all `ψ ∈ H^1_0(Q₊)`, where
`a_{kℓ} = (∑_j ∂_j J_k ∂_j J_ℓ) ∘ H · |det Jac H|` is `C¹` on `Q̄₊` and satisfies
`IsUniformlyElliptic Q₊ a α` for some `α > 0`, and `g̃ = (g ∘ H) |det Jac H| ∈ L²(Q₊)`; that is,
`generalForm Q₊ a 0 0 w ψ = ⟪g̃, fn ψ⟫`.

Proof (p. 11419–11437): `w ∈ H^1(Q₊)` with `∂_j (v ∘ H) = ∑_k (∂_k w ∘ J) ∂_j J_k` — read the
other way, `∂_j v = ∑_k (∂_k w ∘ J)(∂_j J_k)` — is Proposition 9.6 of chapter 9a (change of
variables under a `C¹` diffeomorphism with bounded Jacobians); `w ∈ H^1_0(Q₊)` because a test
function `ψ ∈ 𝓓(Q₊)` pulls back to `ψ ∘ J`, a `C²` function with compact support in `Ω ⊓ U`, which
is in `H^1_0(Ω ⊓ U)` by Lemma 9.5 (chapter 9a's `Cutoff`), and `ψ ↦ ψ ∘ J` is bounded on `H^1`, so
it preserves closures; the integrals transform by Mathlib's
`MeasureTheory.integral_image_eq_integral_abs_det_fderiv_smul` on the measurable set `Q₊` with
the injective `C¹` map `H`; ellipticity is
`∑_{kℓ} a_{kℓ} ξ_k ξ_ℓ = |det Jac H| ∑_j (∑_k ∂_j J_k ξ_k)² = |det Jac H| ‖(Jac J)ᵀ ξ‖²`, bounded
below by `α ‖ξ‖²` because `Jac J` and `det Jac H` are continuous and nonsingular on the compact
`Q̄₊` (`|det Jac H| ≥ c > 0`, `‖(Jac J)ᵀ ξ‖ ≥ ‖ξ‖ / ‖Jac H‖`). The continuity of `a_{kℓ}` up to the
boundary uses `H ∈ C²(Q̄)`, i.e. `ContDiffOn ℝ 2 H (closure Q)`. ★★★ (~450 lines). Footnote 28's
generalization — the ellipticity condition is preserved under change of variables for any
elliptic form — is the same computation with `a_{kℓ}` replaced by `∑_{ij} (a_{ij} ∘ H) ∂_i J_k ∂_j J_ℓ |det Jac H|`
and is stated as `transfer_chart_general` beside it, for Remark 24.'''
deps = [
  "dirichletForm", "generalForm", "IsUniformlyElliptic", "SobolevEuclideanZero",
  "HasWeakFDerivOn.comp_diffeoOn", "SobolevEuclidean.compDiffeoL", "IsDiffeoOnWithBoundedJacobian",  # ch9a, Calculus.toml: Proposition 9.6
