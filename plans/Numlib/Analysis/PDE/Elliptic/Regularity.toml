[[node]]
id = "regularity_upperHalfSpace"
kind = "theorem"
desc = '''**[brezis2011functional] Theorem 9.25, case B (`Ω = ℝ^N_+`), `H²` regularity.** Let
`Ω = EuclideanSpace.upperHalfSpace d`, `u ∈ H^1_0(Ω)`, `g ∈ L²(Ω)`, and `dirichletForm Ω u φ = ⟪g, fn φ⟫` for every
`φ ∈ H^1_0(Ω)`. Then `u ∈ H²(Ω)` (`MemSobolevMultiIndex b (fn u) 2 2 Ω volume`) with
`‖∂_j∂_k u‖₂ ≤ ‖g‖₂` for `(j, k) ≠ (N, N)` and `‖∂_N∂_N u‖₂ ≤ N ‖g‖₂`, hence
`‖u‖_{H²} ≤ C_N (‖u‖_{H¹} + ‖g‖₂)`.

Proof (p. 11313–11352): for tangential `h`, `φ = D_{-h}(D_h u) ∈ H^1_0(Ω)`
(`translate_mem_sobolevZero_of_tangential`) tests the equation; with Lemma 9.6
(`eLpNorm_diffQuot_le_of_tangential`) this gives `‖∇ D_h u‖₂ ≤ ‖g‖₂` (55). For `φ ∈ 𝓓(Ω)`,
`1 ≤ j ≤ N`, `1 ≤ k ≤ N - 1` and `h = |h| e_k`, `∫ D_h(∂_j u) φ = -∫ u D_{-h}(∂_j φ)` (adjointness
and the weak-derivative identity), so `|∫ u D_{-h}(∂_j φ)| ≤ ‖g‖₂ ‖φ‖₂`; letting `h → 0`
(`D_{-h}(∂_j φ) → -∂_k ∂_j φ` uniformly with supports in a fixed compact, dominated convergence)
gives `|∫ u ∂_k ∂_j φ| ≤ ‖g‖₂ ‖φ‖₂` (56). For `(N, N)`, the equation tested with `φ` itself,
after moving each `∂_i` onto `φ`, reads `∫ u ∂_N∂_N φ = -∑_{i<N} ∫ u ∂_i∂_i φ - ∫ g φ` — the
book's (57) with `f - u` replaced by `g` — hence `|∫ u ∂_N ∂_N φ| ≤ N ‖g‖₂ ‖φ‖₂`. The bounds `|∫ u ∂_j∂_k φ| ≤ C ‖φ‖₂`
for all `j, k` say that `∂_j u` satisfies Proposition 9.3 (ii) at `p = 2`, so `∂_j u ∈ H^1(Ω)`
by (ii) ⇒ (i) of chapter 9a ("as in the proof of Proposition 8.3"), and `u ∈ H²(Ω)` by `cons`.
★★★ (~450 lines).'''
