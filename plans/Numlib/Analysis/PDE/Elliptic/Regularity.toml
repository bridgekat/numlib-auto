[[node]]
id = "tangentialDeriv_mem_zero_of_isGalerkinSolution"
kind = "theorem"
desc = '''**[brezis2011functional] Lemma 9.7**: on `Ω = ℝ^N_+`, if `u ∈ H²(Ω) ∩ H^1_0(Ω)` satisfies
`dirichletForm Ω u φ = ⟪g, fn φ⟫` for all `φ ∈ H^1_0(Ω)` and `1 ≤ j ≤ N - 1`, then the tangential
derivative `∂_j u` lies in `H^1_0(Ω)` and satisfies `dirichletForm Ω (∂_j u) φ = ⟪∂_j g, fn φ⟫`
for all `φ ∈ H^1_0(Ω)` whenever `g ∈ H^1(Ω)` (equation (58)).

Proof (p. 11356–11370): (58) for `φ ∈ 𝓓(Ω)` is the equation tested with `∂_j φ` and moved across
