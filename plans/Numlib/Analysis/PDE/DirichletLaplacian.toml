desc = '''
The Dirichlet Laplacian `A = -Δ` as an unbounded operator on `L²(Ω)`: [brezis2011functional],
proof of Theorem 10.1 (`D(A) = H²(Ω) ∩ H¹₀(Ω)`, `Au = -Δu`), the operator on which both the heat
equation (`Numlib/Analysis/PDE/Heat`) and the wave equation (`Numlib/Analysis/PDE/Wave`) rest —
which is why it has a module of its own beside them rather than living in `Heat` (the planning
brief placed it there; `Wave` importing `Heat` would be the alternative). It imports
`Numlib/Analysis/PDE/Elliptic/Dirichlet` for its vocabulary and
`Numlib/Analysis/InnerProductSpace/MaximalMonotone` for the chapter-7 predicates.

Setting, taken from the chapter-9b plan: `Ω : Opens (EuclideanSpace ℝ (Fin N))`, `L²(Ω) =
Lp ℝ 2 (volume.restrict Ω)`, `H¹(Ω) = SobolevEuclidean N 1 2 Ω`, `H¹₀(Ω) = SobolevEuclideanZero N 1 2 Ω`
(a closed submodule of `H¹(Ω)`, a Hilbert space), the weak derivatives as the continuous linear
maps `SobolevMultiIndex.weakDerivL α : H^k(Ω) →L[ℝ] L²(Ω)` of `Numlib/Analysis/Sobolev/MultiIndex`
— `weakDerivL 0 = SobolevMultiIndex.fnL` is the function itself — the embedding
`SobolevMultiIndexZero.fnL : H¹₀(Ω) →L[ℝ] L²(Ω)` from the same module (an `L²` function "lies in
`H¹₀`" when it is in its range, and that is how every boundary condition `u = 0` on `Γ` of
chapter 10 is read), and the Dirichlet form `Elliptic.dirichletForm Ω : SesqForm ℝ (H¹(Ω))`,
`a₀(u, v) = ∫ ∇u·∇v`, with `laplaceForm_eq_innerSL : ∫ ∇u·∇v + ∫ uv = ⟪u, v⟫_{H¹}`.

Design. The operator is Mathlib's `LinearPMap`, `L²(Ω) →ₗ.[ℝ] L²(Ω)`. Its domain is **not**
`H² ∩ H¹₀` by definition but the weak one,

  `D(A) = {u ∈ H¹₀(Ω) : Δu ∈ L²(Ω)} = {u ∈ H¹₀(Ω) : ∃ g ∈ L²(Ω), ∫ ∇u·∇φ = ∫ g φ ∀ φ ∈ H¹₀(Ω)}`,

with `Au = g`. Three reasons. (1) Everything the book proves about `A` in the proof of Theorem
10.1 — monotone, symmetric, `R(I + A) = L²` — holds for this domain on an **arbitrary** open set:
maximality is the Riesz representation on `H¹₀(Ω)` (given `f ∈ L²`, `φ ↦ ∫ f φ` is represented
by some `u ∈ H¹₀`, `⟪u, φ⟫_{H¹} = ∫ f φ`, so `g := f - u` is the weak `-Δu`), i.e. chapter 9b's
Theorem 9.21 read on the operator, and no regularity theory enters, so the Hille–Yosida theory of
chapter 7 applies at once (the operator is the Friedrichs extension of `-Δ` on `C_c^∞(Ω)`; the
book notes at line 12153 that its `C^∞` assumption "may be considerably weakened if we are
interested only in weak solutions"). (2) Theorem 9.25 (`Elliptic.regularity_dirichlet`) enters
exactly once, as the identification `D(A) = H² ∩ H¹₀` with the graph-norm estimate
`‖u‖_{H²} ≤ C (‖u‖ + ‖Au‖)` on a `C²` domain with bounded boundary
(`dirichletLaplacianDomain_eq_of_isContDiffChartDomain`), and iterated as the book's (7),
`D(A^ℓ) = {u ∈ H^{2ℓ} : u = Δu = ⋯ = Δ^{ℓ-1}u = 0 on Γ}` on a `C^{2ℓ}` domain
(`dirichletLaplacian_mem_powDomain_iff`), where "`= 0` on `Γ`" is read as membership of `H¹₀`.
Everything downstream that needs `H^{2ℓ}`-regularity of a solution depends on that ★★★ theorem
and nothing else does. (3) `H² ∩ H¹₀ ⊆ D(A)` holds on any `Ω`
(`mem_dirichletLaplacianDomain_of_sobolev_two`), so uniqueness statements in the book's class
follow from uniqueness in `D(A)`.

`D(A^ℓ)` is chapter 7's Hilbert space `A.PowDomain ℓ` (the tuples `(u, Au, …, A^ℓ u)` in an `ℓ²`
product, with `PowDomain.applyL A ℓ j` the component `A^j u`); "`u ∈ D(A^ℓ)`" is
`∃ x : A.PowDomain ℓ, applyL A ℓ 0 x = u`, and the continuous injection `D(A^ℓ) ↪ H^{2ℓ}(Ω)` of
line 12200 is the bounded linear map `dirichletLaplacian.powDomainToSobolevL` built from the
estimate — the map the chapter-7 plan says its `ContDiffOnPowDomain` lifts are meant to be composed
with.

Also here: the same operator considered in the Hilbert space `H¹₀(Ω)` (the book's `A₁` in the
proof of Theorem 10.2 (a), `D(A₁) = {u ∈ D(A) : Au ∈ H¹₀}`), maximal monotone and symmetric there
by the same three computations; it is what gives `u ∈ C([0,∞); H¹₀)` for `u₀ ∈ H¹₀`. The book's
`A₂` on `H² ∩ H¹₀` (Theorem 10.2 (b)) is not needed: the clause it delivers is Theorem 7.4's
`u ∈ C([0,∞); D(A))` for `u₀ ∈ D(A)`.

Prototype (statements only, in the general-basis form later replaced by chapter 9b's
`SobolevEuclidean`): `notes/brezis/ch10/proto/heat.lean`.
'''

