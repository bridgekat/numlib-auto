[[node]]
id = "Bochner.ContDiffOnThrough.of_contDiffOnPowDomain"
kind = "theorem"
desc = '''A chapter-7 lift is a Bochner lift: for a closed `A : H →ₗ.[ℝ] H` with the graph spaces
`D(A^j)` (`LinearPMap.PowDomain`), a bounded `J : A.PowDomain j →L[ℝ] W`, and
`A.ContDiffOnPowDomain n j u s` (`u ∈ C^n(s; D(A^j))`, `Numlib/Analysis/ODE/HilleYosida`),
`Bochner.ContDiffOnThrough (J' ) n (J ∘ lift) s`-type: precisely, if `u : ℝ → H` has a `C^n` lift
`v : ℝ → A.PowDomain j` with `applyL A j 0 (v t) = u t` on `s`, then for any bounded
`J : A.PowDomain j →L[ℝ] V` and `K : V →L[ℝ] H` with `K ∘ J = applyL A j 0`,
`Bochner.ContDiffOnThrough K n u s` with lift `J ∘ v` (`ContinuousLinearMap.contDiff.comp_contDiffOn`).
Used with `J = dirichletLaplacian.powDomainToSobolevL`, `K = SobolevMultiIndex.fnL` and
`fnL_powDomainToSobolevL` to turn `Heat.IsSolution.contDiffOnPowDomain` into
`Heat.IsSolution.contDiffOnThrough_sobolev`. Lives here, the first module that imports both
chapter 7's graph spaces and the Bochner vocabulary, so that `Bochner` itself imports neither. ★'''
deps = ["Bochner.ContDiffOnThrough", "Bochner.ContDiffOnThrough.comp", "LinearPMap.ContDiffOnPowDomain", "dirichletLaplacian.powDomainToSobolevL"]

[[node]]
id = "dirichletLaplacianH10"
kind = "definition"
desc = '''**The Dirichlet Laplacian in `H¹₀(Ω)`**, the book's `A₁` (proof of Theorem 10.2 (a)):
`dirichletLaplacianH10 (Ω) : H¹₀(Ω) →ₗ.[ℝ] H¹₀(Ω)` on the Hilbert space
`SobolevEuclideanZero N 1 2 Ω` with its `H¹` inner product (`∫ ∇u·∇v + ∫ uv`, the book's
