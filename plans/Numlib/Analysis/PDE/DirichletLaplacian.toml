[[node]]
id = "mem_dirichletLaplacianDomain_of_sobolev_two"
kind = "theorem"
desc = '''**`H²(Ω) ∩ H¹₀(Ω) ⊆ D(A)` on any open set, with `A u = -∑ᵢ ∂ᵢᵢ u`**: if `w : SobolevEuclidean N 2 2 Ω`
and `v ∈ SobolevEuclideanZero N 1 2 Ω` have the same function `f` (`fnL w = fnL v`),
then `f ∈ dirichletLaplacianDomain Ω` and `A f = -∑ i, weakDerivL (2 • MultiIndexLE.single i) w`
(`dirichletLaplacian_apply_of_sobolev_two`; `MultiIndexLE.single i` is `e_i`, `2 • single i` the
multi-index `2 e_i` of `∂ᵢᵢ`). Proof: for a test function `φ`, `∫ ∂ᵢf ∂ᵢφ = -∫ ∂ᵢᵢf φ` is the
weak-derivative identity of the `H²` element (`SobolevMultiIndex.hasWeakIteratedLineDerivOn` at
`2 e_i` tested against `∂ᵢφ`, the first-order derivatives of `w` and `v` agreeing a.e. by the
uniqueness of weak derivatives); sum over `i` (`Elliptic.dirichletForm_apply`) and extend from
the test functions to `H¹₀` by `SobolevEuclideanZero.ext_on_testFunctions`. This is the inclusion
that makes the book's uniqueness class (`C((0,∞); H² ∩ H¹₀)`) a subclass of the weak one. ★★'''
deps = ["dirichletLaplacian", "SobolevMultiIndex.hasWeakIteratedLineDerivOn", "SobolevEuclideanZero.ext_on_testFunctions", "MultiIndexLE.single", "SobolevMultiIndex.weakDerivL"]

