[[node]]
id = "dirichletLaplacian_mem_powDomain_iff"
kind = "theorem"
desc = '''**The identification (7)**: on a `C^{2ℓ}` domain with bounded boundary
(`IsContDiffChartDomain (2ℓ) Ω`, `Bornology.IsBounded (frontier Ω)`), for `ℓ ≥ 1`,
`(∃ x : (dirichletLaplacian Ω).PowDomain ℓ, applyL _ ℓ 0 x = f) ↔ ∃ w : SobolevEuclidean N (2ℓ) 2 Ω, fnL w = f ∧ ∀ j < ℓ, (Δ^j f read from w) ∈ range (SobolevMultiIndexZero.fnL)`,
the book's `D(A^ℓ) = {u ∈ H^{2ℓ}(Ω) : u = Δu = ⋯ = Δ^{ℓ-1}u = 0 on Γ}` with "`= 0` on `Γ`" read
as membership of `H¹₀(Ω)` (the trace-free reading of Theorem 9.17; the two agree for continuous
functions). Here `Δ^j f` is `(-1)^j applyL _ ℓ j x`, equivalently the sum of the weak derivatives
`weakDerivL α w` over the multi-indices `α` of `Δ^j`. With it the continuous injection
`dirichletLaplacian_norm_sobolev_le_sum : ‖w‖_{H^{2ℓ}} ≤ C ∑_{j ≤ ℓ} ‖applyL _ ℓ j x‖ ≤ C' ‖x‖`
(line 12200, "`D(A^ℓ) ⊂ H^{2ℓ}(Ω)` with continuous injection"; `‖x‖` is the `PowDomain` norm
`(∑_j ‖A^j f‖²)^{1/2}`).

Proof by induction on `ℓ` with the higher-order clause of Theorem 9.25
(`Elliptic.regularity_dirichlet_higher`: `Ω` of class `C^{m+2}`, `f ∈ H^m` ⇒ `u ∈ H^{m+2}`,
`‖u‖_{H^{m+2}} ≤ C ‖f‖_{H^m}`): `f ∈ D(A^{ℓ+1})` iff `f ∈ D(A)` and `A f ∈ D(A^ℓ)`
(`LinearPMap.powGraph`'s chain condition); by induction `A f ∈ H^{2ℓ}` with the boundary
conditions, so `f ∈ H¹₀` solves `u - Δu = f + Af ∈ H^{2ℓ}` and Theorem 9.25 gives `f ∈ H^{2ℓ+2}`
with the estimate; conversely an `H^{2ℓ+2}` function with `Δ^j f ∈ H¹₀`, `j ≤ ℓ`, has
`Af = -Δf ∈ H^{2ℓ}` satisfying the conditions of order `ℓ`, so it is in `D(A^ℓ)` by induction and
`f ∈ D(A^{ℓ+1})`. ★★★, ~300 lines of Sobolev bookkeeping on top of Theorem 9.25.'''
deps = ["dirichletLaplacianDomain_eq_of_isContDiffChartDomain", "mem_dirichletLaplacianDomain_of_sobolev_two", "Elliptic.regularity_dirichlet_higher", "LinearPMap.PowDomain", "LinearPMap.PowDomain.applyL", "LinearPMap.powGraph", "IsContDiffChartDomain"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.1, equation (7)"

