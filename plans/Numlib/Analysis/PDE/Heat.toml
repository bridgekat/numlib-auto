[[node]]
id = "IsSolution.contDiffOn_top"
kind = "theorem"
desc = '''`ContDiffOn ℝ ⊤ u (Ioi 0)` with `iteratedDeriv j u t = (-1)^j • applyL A ℓ j x` for the
`D(A^ℓ)`-lift `x` of `u t` (`j ≤ ℓ`): `u^{(j)} = (-A)^j u`, since `u' = -A u` and each `u^{(j)}`
is again a solution on `(ε,∞)` (`IsSolutionOn.comp_add`-style translation). From
`contDiffOnPowDomain` and `contDiffOnPowDomain_iff` by `contDiffOn_succ_iff_deriv_of_isOpen`.
Consequence `IsSolution.exists_powDomain : ∀ t > 0, ∀ ℓ, ∃ x : A.PowDomain ℓ, applyL A ℓ 0 x = u t`
— `u(t) ∈ D(A^ℓ)` (chapter 7's `exists_powDomain_semigroup_apply_of_isFormalAdjoint`), the
