[[node]]
id = "existsUnique_isSolution_backward"
kind = "theorem"
desc = '''**Remark 1, the well-posed half**: for `T > 0` and `u_T ∈ L²(Ω)`, the problem
`-∂ₜu - Δu = 0` on `Ω × (0,T)`, `u = 0` on `Γ × (0,T)`, `u(T) = u_T` ((9'), (10), (11)) has exactly
one solution in the class `C([0,T]; L²) ∩ C¹([0,T); L²)` with `u t ∈ D(A)` for `t < T`: it is
`t ↦ solution Ω u_T (T - t)`. Change of variables `t ↦ T - t` in `IsSolution` (state the backward
class inline or as `IsBackwardSolution`). The non-existence claim of Remark 1 for the backward
heat problem (9)–(11) is not a theorem in the book (no counterexample is given) and is not
planned; its necessary condition (12) is `IsSolution.exists_powDomain` (in `contDiffOn_top`)
applied at `t = T`, i.e. `u_T ∈ D(A^ℓ)` for every `ℓ`. ★'''
deps = ["isSolution_solution", "solution", "IsSolution.contDiffOn_top"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 1"

[[node]]
id = "IsSolution.inner_eigenfunction"
kind = "theorem"
desc = '''**Remark 3, the coefficients**: for bounded nonempty `Ω`, with the Dirichlet eigenbasis
`e : HilbertBasis ℕ ℝ (L²(Ω))`, `lam`, `v n ∈ H¹₀` of chapter 9b's Theorem 9.31
(`Elliptic.dirichletEigenbasis`: `fn (v n) = e n`,
`dirichletForm Ω (v n) φ = lam n * ⟪e n, fn φ⟫` for all `φ ∈ H¹₀`, so `e n ∈ D(A)` with
`A (e n) = lam n • e n` — `dirichletLaplacian_apply_eigenfunction`, immediate from the domain's
definition), the coefficient `a n t := ⟪u t, e n⟫` satisfies `a n t = exp (-lam n * t) * ⟪u₀, e n⟫`
for `t ≥ 0`. Proof: `a n` is `C¹` on `(0,∞)` with `a' = ⟪u', e_n⟫ = -⟪A u, e_n⟫ = -⟪u, A e_n⟫ = -lam_n a`
(`dirichletLaplacian_isFormalAdjoint`), continuous at `0`; the scalar ODE has the exponential as
its only solution (differentiate `t ↦ exp (lam t) a t`). ★★'''
deps = ["IsSolution", "dirichletLaplacian_isFormalAdjoint", "dirichletLaplacian", "Elliptic.dirichletEigenbasis"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 3, (13)"

[[node]]
id = "IsSolution.hasSum_eigenfunction"
kind = "theorem"
desc = '''**Remark 3, the series (14)**: for bounded nonempty `Ω` and `t ≥ 0`,
`HasSum (fun n ↦ (exp (-lam n * t) * ⟪u₀, e n⟫) • e n) (u t)` in `L²(Ω)` — the solution is
`u(x,t) = ∑ aₙ(0) e^{-λₙ t} eₙ(x)`. Immediate from `inner_eigenfunction` and the expansion of
`u t` in the Hilbert basis (`HilbertBasis.hasSum_repr`). The convergence and regularity questions
the book refers to Weinberger for are thereby settled by uniqueness, not by summing the series.
`QuarteroniSaccoSaleri.Chapter13.equation_13_5` (the sine series on `(0,1)`) is the `N = 1`,
finite-datum case with the explicit basis `√2 sin(nπx)`. ★★'''
deps = ["IsSolution.inner_eigenfunction", "Elliptic.dirichletEigenbasis"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 10, Remark 3, (14)"
