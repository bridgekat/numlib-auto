`ℓ`). ★★'''
deps = ["IsSolution.contDiffOnPowDomain", "LinearPMap.contDiffOnPowDomain_iff", "LinearPMap.PowDomain.applyL", "LinearPMap.exists_powDomain_semigroup_apply_of_isFormalAdjoint"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.1, lines 12200–12210, and Remark 1"

[[node]]
id = "IsSolution.norm_iteratedDeriv_le"
kind = "theorem"
desc = '''**Parabolic smoothing of every order**: `‖iteratedDeriv k u t‖ ≤ (k / t) ^ k * ‖u₀‖` for
`t > 0`, `k ≥ 1`. Not in the book; it is `IsSolution.norm_deriv_le` iterated along the
subdivision `0 < t/k < 2t/k < ⋯ < t` with the semigroup law (`LinearPMap.IsMaximalMonotone.semigroup_add`):
`A^{j+1} S(t) u₀ = A S(t/k) (A^j S(jt/k) u₀)`, and `‖A S(τ) w‖ ≤ ‖w‖/τ`. Consumer: the
`‖u_t(t)‖ ≤ C‖u₀‖/t` and, with `dirichletLaplacian_norm_sobolev_le_sum`,
`‖u(t)‖_{H^{r+1}} ≤ C ‖u₀‖ / t^{(r+1)/2}` ingredients (iii) of
`QuarteroniSaccoSaleri.Chapter13.thetaMethod_convergence` (`notes/frontier.md` blocker 9). ★★'''
deps = ["IsSolution.norm_deriv_le", "IsSolution.contDiffOn_top", "LinearPMap.IsMaximalMonotone.semigroup_add"]

[[node]]
id = "IsSolution.energy"
kind = "theorem"
desc = '''**The energy identity (6)**, in the operator form valid for every self-adjoint maximal
monotone `A`: for `T > 0`, the function `g t := ⟪A (u t), u t⟫` (`= ∫ |∇u(t)|²` by
`dirichletLaplacian_inner_self_eq_dirichletForm`) is integrable on `(0, T]` and
`½ ‖u T‖² + ∫ t in (0:ℝ)..T, g t = ½ ‖u₀‖²`. The book's proof, lines 12217–12230: `φ(t) = ½‖u(t)‖²`
is `C¹` on `(0,∞)` with `φ' = ⟪u, u'⟫ = -⟪A u, u⟫` (`HasDerivAt.norm_sq`), so
`φ(T) - φ(ε) = -∫_ε^T g` for `0 < ε < T` (`intervalIntegral.integral_eq_sub_of_hasDerivAt`, `g`
continuous on `(0,∞)` by `continuousOn_apply`); `g ≥ 0` and `∫_ε^T g ≤ φ(ε) ≤ ½‖u₀‖²` give
integrability on `(0,T]` by monotone convergence (`MeasureTheory.lintegral_iSup` on the
indicators of `Ioc ε T`), and `φ(ε) → φ(0)` by `continuousOn` at `0`. The book's form (6) is the
surface node `theorem_10_1_energy`. Belongs, in its abstract form, beside Theorem 7.7 in chapter
7's module; recorded here because chapter 10 is its only consumer. ★★'''
deps = ["IsSolution", "IsSolution.continuousOn_apply", "dirichletLaplacian_inner_self_nonneg", "dirichletLaplacian_inner_eq_dirichletForm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.1 (6)"

[[node]]
id = "IsSolution.integral_inner_apply_le"
kind = "theorem"
desc = '''`t ↦ ⟪A (u t), u t⟫` is integrable on `Ioi 0` and `∫ t in Ioi 0, ⟪A (u t), u t⟫ ≤ ½ ‖u₀‖²`:
the identity of `IsSolution.energy` for every `T`, `‖u T‖² ≥ 0`, and monotone convergence in
`T`. This is the book's "`u ∈ L²(0,∞; H¹₀(Ω))`" in the form its proof establishes (the gradient
part, `∫₀^∞ ‖∇u‖² ≤ ½‖u₀‖²`). ★'''
deps = ["IsSolution.energy"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.1, `u ∈ L²(0,∞; H¹₀(Ω))`"

