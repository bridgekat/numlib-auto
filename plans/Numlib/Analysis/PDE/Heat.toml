[[node]]
id = "IsSolution.energy_domain"
kind = "theorem"
desc = '''**Theorem 10.2 (b), the identity** (lines 12305–12312, unnumbered): for `u₀ ∈ D(A)` and
`T > 0`, `t ↦ ⟪A (A (u t)), A (u t)⟫` (`= ‖∇Δu(t)‖²`, as `A u(t) ∈ D(A) ⊆ H¹₀` for `t > 0`) is
integrable on `(0,T]` and `½ ‖A (u T)‖² + ∫₀ᵀ ⟪A(A u), A u⟫ = ½ ‖A u₀‖²`. Proof: `φ(t) = ½‖Au(t)‖²
= ½‖u'(t)‖²`, `φ' = ⟪u', u''⟫ = -⟪u', A u'⟫` (`u'' = -A u'` from `contDiffOn_top`), integrate on
`[ε,T]`, and `φ(ε) → ½‖Au₀‖²` by `contDiffOn_Ici_of_mem_domain`. Consequence
`∫₀^∞ ‖∇(Δu)(t)‖² dt ≤ ½ ‖Δu₀‖²`, the book's `∂ₜu ∈ L²(0,∞; H¹₀(Ω))` in its gradient form (as
`∂ₜu = Δu`). ★★'''
deps = ["IsSolution.contDiffOn_Ici_of_mem_domain", "IsSolution.contDiffOn_top", "dirichletLaplacian_isFormalAdjoint", "dirichletLaplacian_inner_eq_dirichletForm"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.2 (b)"

