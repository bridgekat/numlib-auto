desc = '''`u ∈ L²(0,∞; H¹₀(Ω))` for **bounded** `Ω`: `Bochner.MemLpThrough (SobolevMultiIndexZero.fnL : SobolevEuclideanZero N 1 2 Ω →L[ℝ] L²(Ω)) 2 u (Ioi 0)`.
