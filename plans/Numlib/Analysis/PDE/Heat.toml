namespace = "Heat"
desc = '''
The heat equation `∂ₜu - Δu = 0` on `Ω × (0,∞)`, `u = 0` on `∂Ω × (0,∞)`, `u(·,0) = u₀`, in the
form of [brezis2011functional] chapter 10: a curve `u : ℝ → L²(Ω)` with `u' + A u = 0`, `A` the
Dirichlet Laplacian of `Numlib/Analysis/PDE/DirichletLaplacian`, to which the Hille–Yosida theory
of chapter 7 (`Numlib/Analysis/InnerProductSpace/MaximalMonotone`, `Numlib/Analysis/ODE/HilleYosida`)
applies because `A` is self-adjoint and maximal monotone. This module carries §10.1 — existence,
uniqueness, the smoothing estimates, the regularity classes, the energy identities (Theorems 10.1
and 10.2, Remarks 1, 3) — and is the parent of `Heat/MaximumPrinciple` (§10.2, Theorems 10.3–10.5,
Stampacchia's truncation in time) and `Heat/Classical` (§10.2, Theorem 10.6, the classical maximum
principle, and Remark 4). `Ω : Opens (EuclideanSpace ℝ (Fin N))`, `L²(Ω) = Lp ℝ 2 (volume.restrict Ω)`.

The solution notion is the Bochner one the book fixes at line 12150 ("when we write `u(t)` we
mean the function `x ↦ u(x,t)`, an element of `H`"): `Heat.IsSolution Ω u₀ u` is chapter 7's
`LinearPMap.IsSolutionOn (dirichletLaplacian Ω) u₀ (Ioi 0) u` (`u 0 = u₀`, `u t ∈ D(A)` and
`u' = -A u` for `t > 0`) together with `ContinuousOn u (Ici 0)` and `ContDiffOn ℝ 1 u (Ioi 0)`,
the class `C([0,∞); H) ∩ C¹((0,∞); H) ∩ C((0,∞); D(A))` of Theorem 7.7 (the last clause is
automatic from the equation) for the operator `A`. The solution is the semigroup,
`Heat.solution Ω u₀ = fun t ↦ (dirichletLaplacian Ω).semigroup t u₀` (`LinearPMap.semigroup`), so
that its linearity in `u₀` and the contraction `‖u(t)‖ ≤ ‖u₀‖` are chapter 7's. The boundary
condition sits in `D(A) ⊆ H¹₀(Ω)`, as the book says ("it is important to note that the boundary
condition (2) has been incorporated in the definition of the domain of `A`").

What holds on an arbitrary open set, and what needs the domain to be regular. With the weak domain
`D(A) = {u ∈ H¹₀ : Δu ∈ L²}`, existence and uniqueness (`existsUnique_isSolution`), the estimates
`‖u(t)‖ ≤ ‖u₀‖` and `‖u'(t)‖ ≤ ‖u₀‖/t`, the smoothing `u ∈ C^∞((0,∞); L²)` with `u(t) ∈ D(A^ℓ)`
and the parabolic bound `‖u^{(k)}(t)‖ ≤ (k/t)^k ‖u₀‖`, the energy identity (6)
`½‖u(T)‖² + ∫₀ᵀ ∫|∇u|² = ½‖u₀‖²`, Theorem 10.2 (a)'s `u ∈ C([0,∞); H¹₀)` with (11), and (b)'s
`u ∈ C([0,∞); D(A))` with its identity all hold for every open `Ω` — they are Theorems 7.4, 7.5,
7.7 plus the identity `⟪Au, u⟫ = ∫|∇u|²`. The regular-domain hypothesis of the book
(`IsContDiffChartDomain n Ω`, `Bornology.IsBounded (frontier Ω)`) enters only through the
identification of `D(A^ℓ)` with `H^{2ℓ}` (`dirichletLaplacian_mem_powDomain_iff`, Theorem 9.25)
to yield the clauses `u ∈ C^k((0,∞); H^{2ℓ}(Ω))` and, with the Sobolev embedding of Corollary 9.15
and the space-time bridge of `Numlib/Analysis/PDE/Bochner`, the book's `u ∈ C^∞(Ω̄ × [ε,∞))`.
Those are separate nodes so that the rest is not held up by the ★★★ regularity theorem.

Two clauses of the book are stated in weaker form, deliberately. `u ∈ L²(0,∞; H¹₀(Ω))` in
Theorem 10.1 and `u ∈ L²(0,∞; H²)`, `L²(0,∞; H³)` in Theorem 10.2 are false on unbounded domains
as written (on `Ω = ℝ` with a Gaussian datum, `‖u(t)‖²_{L²} ~ (1+2t)^{-1/2}` is not integrable in
`t`); what the book's proofs show, and what is stated here, is `∫₀^∞ ‖∇u(t)‖² dt ≤ ½‖u₀‖²`,
`∫₀^∞ ‖u'(t)‖² dt ≤ ½‖∇u₀‖²`, `∫₀^∞ ‖∇Δu(t)‖² dt ≤ ½‖Δu₀‖²`; the Bochner memberships follow for
bounded `Ω` by Poincaré (Corollary 9.19, `SobolevEuclideanZero.norm_le_gradNorm`) and are stated
under `Bornology.IsBounded (Ω : Set _)`. Corollary 10.4 (ii)'s `‖u‖_{L^∞(Q)}` is stated as
`∀ t, ‖u t‖_∞ ≤ ‖u₀‖_∞` (see `Numlib/Analysis/PDE/Bochner`).

Prototype of the statements (with a general basis, since replaced by chapter 9b's
`SobolevEuclidean`): `notes/brezis/ch10/proto/heat.lean`.
'''

[[node]]
id = "IsSolution"
kind = "definition"
desc = '''`Heat.IsSolution (Ω) (u₀ : L²(Ω)) (u : ℝ → L²(Ω)) : Prop`, a structure with fields
`toIsSolutionOn : (dirichletLaplacian Ω).IsSolutionOn u₀ (Ioi 0) u` (chapter 7's solution
concept: `u 0 = u₀`, `u t ∈ D(A)` and `HasDerivWithinAt u (-A (u t)) (Ioi 0) t` — i.e.
`HasDerivAt` — for `t > 0`), `continuousOn : ContinuousOn u (Ici 0)` and
`contDiffOn : ContDiffOn ℝ 1 u (Ioi 0)`. The problem (1), (2), (3) of §10.1 in the class (4) of
Theorem 10.1 with `D(A)` in place of `H² ∩ H¹₀`: (1) is the derivative clause (`∂ₜu = Δu` in
`L²(Ω)`), (2) is `u t ∈ D(A) ⊆ H¹₀`, (3) is `u 0 = u₀`, and `u ∈ C([0,∞); L²) ∩ C¹((0,∞); L²)`
are the two extra fields; `u ∈ C((0,∞); D(A))` follows (`IsSolution.continuousOn_apply`, since
`A (u t) = -u'(t)`). Shape checked in `notes/brezis/ch10/proto/heat.lean`. ★'''
deps = ["dirichletLaplacian", "LinearPMap.IsSolutionOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §10.1, (1)–(4)"

[[node]]
id = "IsSolution.continuousOn_apply"
kind = "theorem"
desc = '''`u ∈ C((0,∞); D(A))`: `t ↦ A (u t)` is continuous on `Ioi 0`, being `-deriv u` there
(`ContDiffOn ℝ 1` on an open set gives a continuous derivative). Also
`IsSolution.contDiffOnPowDomain_one : (dirichletLaplacian Ω).ContDiffOnPowDomain 0 1 u (Ioi 0)`,
the chapter-7 spelling. ★'''
deps = ["IsSolution", "LinearPMap.ContDiffOnPowDomain"]

[[node]]
id = "IsSolution.unique"
kind = "theorem"
desc = '''Two solutions with the same datum agree on `Ici 0`: `IsSolution Ω u₀ u → IsSolution Ω u₀ v →
EqOn u v (Ici 0)`. Chapter 7's `LinearPMap.IsMonotone.eqOn_of_isSolutionOn_Ioi` (Theorem 7.7's
uniqueness: `‖u - v‖²` nonincreasing on `(0,∞)` by monotonicity, continuous on `[0,∞)`, zero at
`0`) for the monotone `dirichletLaplacian Ω`. ★'''
deps = ["IsSolution", "dirichletLaplacian_inner_self_nonneg", "LinearPMap.IsMonotone.eqOn_of_isSolutionOn_Ioi"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.1 (uniqueness)"

[[node]]
id = "solution"
kind = "definition"
desc = '''`Heat.solution (Ω) (u₀ : L²(Ω)) : ℝ → L²(Ω) := fun t ↦ (dirichletLaplacian Ω).semigroup t u₀`,
the contraction semigroup of chapter 7 (Remark 5) applied to the datum. `solution_add`,
`solution_smul` (each `semigroup t` is a `ContinuousLinearMap`), `norm_solution_le : ‖solution Ω u₀ t‖ ≤ ‖u₀‖`
for `t ≥ 0` (`LinearPMap.IsMaximalMonotone.norm_semigroup_le_one`) — the contraction property
that Corollary 10.5 uses on differences of solutions. ★'''
deps = ["dirichletLaplacian_isMaximalMonotone", "LinearPMap.semigroup", "LinearPMap.IsMaximalMonotone.norm_semigroup_le_one"]

[[node]]
id = "isSolution_solution"
kind = "theorem"
desc = '''**Existence** for every `u₀ ∈ L²(Ω)` on every open `Ω`: `IsSolution Ω u₀ (solution Ω u₀)`.
Theorem 7.7 for the self-adjoint maximal monotone `dirichletLaplacian Ω`
(`LinearPMap.isSolutionOn_semigroup_Ioi`, whose conclusions are exactly the three fields, or the
packaged `LinearPMap.exists_isSolutionOn_Ioi_of_isSelfAdjoint`). With `IsSolution.unique`:
`IsSolution.eqOn_solution : IsSolution Ω u₀ u → EqOn u (solution Ω u₀) (Ici 0)` and
`existsUnique_isSolution` (uniqueness on `Ici 0`; `IsSolution` does not constrain negative times) —
Theorem 10.1's existence-and-uniqueness clause on an arbitrary open set. ★'''
