[[node]]
id = "IsSolution.contDiffOnClosure_spaceTime_Ici"
kind = "theorem"
desc = '''**Theorem 10.2 (c)**: on a `C^∞` domain with bounded boundary, if `u₀ ∈ D(A^k)` for every
`k` (the book's `u₀ ∈ H^k(Ω)` for all `k` with the compatibility conditions (8)
`Δ^j u₀ = 0` on `Γ`, by `dirichletLaplacian_mem_powDomain_iff` / `IsDirichletLaplacianChain`;
hypothesis shape `∀ k, ∃ x : (dirichletLaplacian Ω).PowDomain k, applyL _ k 0 x = u₀`), then
`u ∈ C^∞(Ω̄ × [0,∞))`: there is `U : ℝ^N × ℝ → ℝ` with `(fun x ↦ U (x, t)) =ᵐ[volume.restrict Ω] u t`
for every `t ≥ 0` and `ContDiffOnClosure ℝ ∞ U (Ω ×ˢ Ioi 0)` — the derivatives of every order
extend continuously to `closure Ω ×ˢ Ici 0` (restated 2026-09-20 per pde4's bridge). Proof:
`contDiffOnThrough_sobolev_Ici_of_powDomain` at `k := ℓ + n`, `ℓ` gives
`u ∈ C^n([0,∞); H^{2ℓ}(Ω))` for all `n, ℓ`, whence `C^∞([0,∞); H^{2ℓ})` (one lift for all `n`:
the lifts agree on `Ici 0` by `SobolevMultiIndex.fnL_injective`), then every `m` by pde4's
`Bochner.ContDiffOnThrough.sobolev_of_le`, and the `Ici` bridge
`Bochner.contDiffOnClosure_spaceTime_of_forall_contDiffOnThrough_Ici` (`UniqueDiffOn ℝ (Ici 0)`,
`IsSobolevExtensionDomainAll N Ω`). ★★ on top of the bridge (~60 lines).

Blocked: the bridge (agent pde4, `Bochner/SpaceTime`) is absent from this worktree; the
Bochner clauses at every finite order are proved (`contDiffOnThrough_sobolev_Ici_of_powDomain`).'''
deps = ["IsSolution.contDiffOnPowDomain_Ici_of_powDomain", "IsSolution.contDiffOnThrough_sobolev_Ici_of_powDomain", "Bochner.contDiffOnClosure_spaceTime_of_forall_contDiffOnThrough"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 10.2 (c)"

