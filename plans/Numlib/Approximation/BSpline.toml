[[node]]
id = "sum_smul_bspline_insertKnot"
kind = "theorem"
desc = '''**Knot insertion preserves the spline** (Remark 8.4): for nondecreasing `x`,
`∑ i, insertKnotCoeff x k j x̃ c i * bspline (insertKnot x j x̃) k i t = ∑ i, c i * bspline x k i t`
(sums over the appropriate ranges). Proof: the one-knot insertion formula for a single B-spline,
`B_{i,k}(x) = ω_i B̃_{i,k} + (1 - ω_{i+1}) B̃_{i+1,k}` (Boehm 1980; de Boor, chapter X, (10)),
proved by induction on `k` from the Cox–de Boor recursion; then regroup the sum. ★★★

Blocked: not attempted in this pass. The definitions `insertKnot`, `insertKnotWeight`,
`insertKnotCoeff` and `monotone_insertKnot` are in place; the proof is Boehm's single-knot
insertion formula `B_{i,k} = ω_i B̃_{i,k} + (1 - ω_{i+1}) B̃_{i+1,k}` by induction on `k` from
`bspline_succ`, with a case split on the position of `i` relative to `j` and coincident knots
handled by the `0/0 = 0` convention of `weight`, followed by a regrouping of the sum. ★★★.'''
deps = ["BSpline.insertKnot", "BSpline.bspline"]
source = "Quarteroni–Sacco–Saleri, Numerical Mathematics, Remark 8.4; Boehm 1980"

