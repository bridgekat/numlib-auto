[[node]]
id = "exists_gauss"
kind = "theorem"
desc = '''Gauss quadrature (Kress Thm 9.6–9.7-style): for a positive measure `μ` on `[a, b]` with finite
moments and `n ≥ 1`, the orthogonal polynomial `p_n` of degree `n` has `n` simple real roots in
`(a, b)`, and the interpolatory rule at these roots has positive weights and degree of exactness
`2n - 1`; conversely no `n`-point rule is exact to degree `2n`. Division with remainder by `p_n`
and orthogonality, as in `Lanczos.gauss_quadrature`.

The orthogonal polynomial itself has no source yet: `Numlib/Approximation/OrthogonalPolynomial`
is unwritten, so this node should either wait for it or take the orthogonal polynomial as a
hypothesis — "if `q` has degree `n` and is `μ`-orthogonal to every polynomial of lower degree,
then …" — which is what the proof actually uses. The one part that is not bookkeeping is that such
a `q` has `n` distinct roots inside `(a, b)`: the product of the linear factors at the sign changes
would otherwise pair with `q` to a nonzero integral of a one-signed function against a polynomial
of degree `< n`.'''
deps = ["IsInterpolatory", "Polynomial.christoffel_darboux"]
source = "Kress, Numerical Analysis, Section 9.3"

[[node]]
id = "error_eq_integral_peanoKernel"
kind = "theorem"
desc = '''Peano's kernel theorem (Kress Thm 9.2-style): for a rule exact on polynomials of degree `≤ m` and
`f ∈ C^{m+1}[a, b]`, `∫ f - functional w x f = ∫ K(t) f^{(m+1)}(t) dt` with the Peano kernel
`K(t) = (1/m!) E_x((· - t)₊^m)`, the error functional applied to the truncated power; and the
corollary `|E f| ≤ ‖K‖₁ ‖f^{(m+1)}‖_∞`.

Unlike the rest of this module the statement is not about an arbitrary target functional: the
interchange `E(s ↦ ∫ g(s, t) dt) = ∫ E(g(·, t)) dt` needs `L` to be the integral itself, so the
node should be stated for `L f = ∫ x in a..b, f x`. Two ingredients are missing from Mathlib: the
Taylor expansion with *integral* remainder on an interval (`Mathlib.Analysis.Calculus.Taylor` has
only the Lagrange and Cauchy forms), and the Fubini step that moves the error functional inside
that remainder.'''
deps = ["functional", "IsInterpolatory"]
source = "Kress, Numerical Analysis, Section 9.2"
