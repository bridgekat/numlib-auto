[[node]]
id = "error_eq_integral_peanoKernel"
kind = "theorem"
desc = '''Peano's kernel theorem (Kress Thm 9.2-style): for a rule exact on polynomials of degree at most `m`
and `f` of class `C^{m+1}[a, b]`, the error `E f = int f - functional w x f` is
`int K(t) f^{(m+1)}(t) dt` with the Peano kernel `K(t) = (1/m!) E_x((. - t)_+^m)`, the error
functional applied to the truncated power; and the corollary `|E f| <= norm K_1 * norm f^{(m+1)}_inf`.

Unlike the rest of this module the statement is not about an arbitrary target functional: the
interchange `E(s -> int g(s, t) dt) = int E(g(., t)) dt` needs `L` to be the integral itself, so the
node should be stated for `L f = int x in a..b, f x`.

The obstruction is still the one recorded when this node was written, and it was checked again
against the current Mathlib: `Mathlib/Analysis/Calculus/Taylor.lean` has `taylor_mean_remainder`,
`taylor_mean_remainder_lagrange`, `taylor_mean_remainder_cauchy` and
`exists_taylor_mean_remainder_bound`, all mean-value forms, and **no integral remainder**. So the
node has three parts, none of them short:

1. `f x = sum_{k <= m} f^(k)(a) (x-a)^k / k! + (1/m!) int_a^x (x-t)^m f^(m+1)(t) dt`, by induction
   on `m` from the fundamental theorem of calculus with
   `intervalIntegral.integral_mul_deriv_eq_deriv_mul` at each step;
2. the extension of the inner integral to `[a, b]` by the truncated power, which is where the
   kernel's `(. - t)_+^m` comes from and where the integrand stops being smooth in `x`;
3. the Fubini step `MeasureTheory.integral_integral_swap` on the continuous integrand
   `(x, t) -> (x-t)_+^m f^(m+1)(t)` over the rectangle, the sum half of `E` being finite and hence
   free.

Part 1 is general enough to be its own node in an analysis module rather than in this one.'''
deps = ["functional", "IsInterpolatory"]
source = "Kress, Numerical Analysis, Section 9.2"
