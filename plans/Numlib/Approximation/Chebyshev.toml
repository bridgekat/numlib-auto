[[node]]
id = "isBestApprox_trig_iff_equioscillates"
kind = "theorem"
desc = '''The equioscillation *characterization* for `2 pi`-periodic continuous functions and trigonometric
polynomials of degree at most `n`, with `2 n + 2` alternation points on a period: the Haar theorem
on the circle.

**Not what Atkinson-Han's Theorem 3.3.20 asks for.** That theorem is existence and uniqueness only,
and it is proved: `existsUnique_isBestApprox_trigPolyLE` of this module. This node is the further
characterization, which the book states for polynomials (Thm 3.3.19) but not for trigonometric
polynomials.

**Half of it is now proved.** `EquioscillatesCircle` is the alternation notion on the circle, and
`isBestApprox_of_equioscillatesCircle` is the sufficiency direction, from the de la Vallee-Poussin
bound `le_infDist_of_alternates_trig`: `2 n + 2` alternation points give `2 n + 1` sign changes,
one more than the `2 n` zeros a nonzero member of `trigPolyLE T n` can have
(`haarCondition_trigPolyLE`).

What is left is the necessity direction, the *cyclic* exchange argument. The plan for it: cut the
circle at a point where `|g| < ||g||` -- one exists unless `g = 0`, since a continuous `g` with
`|g| = ||g||` everywhere is constant and a constant error is improvable. Decompose the extreme set
into maximal blocks of constant sign; going around the circle the number of sign changes is even,
say `2 r`, and it is at most the longest alternation `m`. If `m <= 2 n + 1` then `2 r <= 2 n`, so
the improving element can be taken to be `x |-> prod_{j < 2 r} sin (pi (x - y_j) / T)` with `y_j`
separating consecutive blocks. Two ingredients are missing for that: (a) an even product of such
sines is in `trigPolyLE T r` -- by induction, `sin u sin v = (cos (u - v) - cos (u + v))/2` turns
two factors into a constant and one of frequency 1, so it also needs
`trigPolyLE T a * trigPolyLE T b <= trigPolyLE T (a + b)`, which this file does not have; and (b)
the block bookkeeping, which in the linear case (`exists_improving_of_not_equioscillates`) is about
400 lines and has to be redone cyclically.'''
deps = ["isBestApprox_of_equioscillatesCircle", "HaarCondition", "haarCondition_trigPolyLE"]
source = "Atkinson-Han, Theoretical Numerical Analysis, Theorem 3.3.20"

