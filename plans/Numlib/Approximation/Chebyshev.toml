desc = '''
Best uniform approximation by polynomials: the Chebyshev equioscillation theorem (Atkinson–Han,
*Theoretical Numerical Analysis*, Thm 3.3.19, and its trigonometric twin Thm 3.3.20; Kress,
*Numerical Analysis*, §8.2), with the de la Vallée-Poussin lower bound and the uniqueness of the
best approximation from a Haar subspace. Phase 3; not in Mathlib.

Stated on `C(Set.Icc a b, ℝ)` for the subspace `polyLE a b n` of polynomial functions of degree
`≤ n`: `p` is a best approximation of `f` (`IsBestApprox` of `Numlib/Approximation/BestApprox`) iff
the error `f - p` attains `± ‖f - p‖` with alternating signs at `n + 2` increasing points. The
sufficiency is the de la Vallée-Poussin argument (an alternant of length `n + 2` for any `q`
bounds `ρ_n(f)` from below by the least alternant value); the necessity is the classical
exchange argument, which is the only part with real work. Uniqueness follows from
equioscillation. The Haar condition is what the exchange argument uses about polynomials and is
stated separately so that the trigonometric case is the same theorem.
'''

[[node]]
id = "HaarCondition"
kind = "definition"
desc = '''A finite-dimensional subspace `V` of `C(X, ℝ)` satisfies the Haar condition when no nonzero
element has `finrank V` zeros in `X`; `polyLE a b n` satisfies it with `finrank = n + 1`
(`haarCondition_polyLE`), and so do the trigonometric polynomials of degree `≤ n` on the circle.'''
source = "Atkinson–Han, Theoretical Numerical Analysis, Section 3.3.4; Kress, Numerical Analysis, Section 8.2"

[[node]]
id = "Equioscillates"
kind = "definition"
desc = '''`Equioscillates g m`: there are `m` increasing points `x₀ < ⋯ < x_{m-1}` in `X` with
`g x_i = σ (-1)^i ‖g‖` for a fixed sign `σ`, the alternation condition of Atkinson–Han Thm 3.3.19.'''
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.3.19"

[[node]]
id = "le_infDist_of_alternates"
kind = "theorem"
desc = '''De la Vallée-Poussin: if `f - q` alternates in sign at `n + 2` increasing points with values of
modulus at least `ε`, then `ε ≤ Metric.infDist f (polyLE a b n)`; from the Haar condition, since a
polynomial of degree `≤ n` cannot alternate `n + 1` times.'''
deps = ["HaarCondition"]
source = "Kress, Numerical Analysis, Section 8.2 (de la Vallée-Poussin)"

[[node]]
id = "isBestApprox_iff_equioscillates"
kind = "theorem"
desc = '''Chebyshev's equioscillation theorem (Atkinson–Han Thm 3.3.19): for `f : C(Icc a b, ℝ)` and
`p ∈ polyLE a b n`, `IsBestApprox (polyLE a b n) f p ↔ Equioscillates (f - p) (n + 2)`; more
generally for any Haar subspace of dimension `n + 1` on a compact interval. The `←` direction is
`le_infDist_of_alternates`; `→` is the exchange argument.'''
deps = ["Equioscillates", "HaarCondition", "le_infDist_of_alternates", "IsBestApprox", "IsBestApprox.norm_sub_eq_infDist"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.3.19"

[[node]]
id = "IsBestApprox.unique_of_haarCondition"
kind = "theorem"
desc = '''Uniqueness of the best uniform approximation from a Haar subspace (the uniqueness clause of
Atkinson–Han Thm 3.3.19 and of Kress's version): two best approximations agree, because their
midpoint is one too and equioscillates, which forces both to agree at `n + 2` points.'''
deps = ["isBestApprox_iff_equioscillates", "IsBestApprox", "convex_setOf_isBestApprox"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.3.19"

[[node]]
id = "isBestApprox_trig_iff_equioscillates"
kind = "theorem"
desc = '''Atkinson–Han Thm 3.3.20: the same characterization for `2π`-periodic continuous functions and
trigonometric polynomials of degree `≤ n`, with `2n + 2` alternation points on a period; the Haar
theorem on the circle.'''
deps = ["isBestApprox_iff_equioscillates", "HaarCondition"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.3.20"
