[[node]]
id = "isBestApprox_trig_iff_equioscillates"
kind = "theorem"
desc = '''The equioscillation *characterization* for `2 pi`-periodic continuous functions and trigonometric
polynomials of degree at most `n`, with `2 n + 2` alternation points on a period: the Haar theorem
on the circle.

**Not what Atkinson–Han's Theorem 3.3.20 asks for.** That theorem is existence and uniqueness only,
and it is proved: `existsUnique_isBestApprox_trigPolyLE` of this module, from
`haarCondition_trigPolyLE` and the finite dimension of the subspace. This node is the further
characterization, which the book states for polynomials (Thm 3.3.19) but not for trigonometric
polynomials.

Everything but the exchange argument is here: `trigPolyLE T n` with `finrank_trigPolyLE` and
`mem_trigPolyLE_iff`, the Haar condition `haarCondition_trigPolyLE`, and the interpolation and
uniqueness machinery, which is now stated for an arbitrary compact space and so applies on a circle
unchanged. What is left is (a) an `Equioscillates` for a circle — this module's is stated for a
subset of the line, because it speaks of increasing points — and (b) the exchange argument in the
cyclic case, where there is no leftmost extreme point, so the block decomposition has to be cut at
an arbitrary point of the extreme set and the parity of the number of blocks matters.'''
deps = ["isBestApprox_iff_equioscillates", "HaarCondition", "haarCondition_trigPolyLE"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.3.20"

