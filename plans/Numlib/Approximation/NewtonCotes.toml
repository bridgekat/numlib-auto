[[node]]
id = "exists_sub_closedNewtonCotes_eq_of_odd"
kind = "theorem"
desc = '''**Theorem 9.2, closed rules, odd `n`** ([quarteroni2000numerical] (9.20)): for odd `n`,
`a < b` and `f ∈ C^{n+1}` on an open `U ⊇ Icc a b`,
`∃ η ∈ Ioo a b, ∫_a^b f - closedNewtonCotes n f a b
  = newtonCotesK n / (n + 1)! * ((b - a)/n)^(n + 2) * iteratedDeriv (n + 1) f η`.
Route as for even `n`: Peano's theorem at order `n` (exactness to degree `n`,
`integral_eq_closedNewtonCotes_of_degree_le`), the sign of the kernel by the bump argument of
`peanoKernel_closedNewtonCotes_nonpos_of_even` (whose divided-difference core
`sub_closedNewtonCotes_nonpos_of_even` needs `W ≥ 0`, which for odd `n` is
`∫_0^x π_{n+1} ≤ 0` on `[0, n]` — the analysis behind `newtonCotesK_neg`), the kernel integral at
`x^{n+1}/(n+1)!` (`∫_a^b ω_{n+1} = h^{n+2} K_n`, no integration by parts needed), and
`exists_mem_Ioo_integral_mul_eq_mul_integral_of_nonpos`. Not attempted this round. ★★★

Blocked: the sign ingredients are now proved (`newtonCotesK_neg`, and
`integral_intNodal_nonpos_of_odd` is the `W ≤ 0` the route asks for), but the route above is
wrong at one step: the *divided-difference core* does not give the hypothesis the bump argument
needs. For odd `n` the primitive `W(x) = ∫_a^x ω` does not vanish at `b` (`W(b) = h^{n+2} K_n < 0`),
so the integration by parts must use `V = W - W(b) ≥ 0` (nonnegative because
`W(x) + W(n - x) = K_n` and `W ≤ 0`), which yields `E(f) = -φ(a) V(a) - ∫ φ' V ≤ 0` only when
*both* `f^{(n+1)} ≥ 0` and `f^{(n+2)} ≥ 0`, i.e. when `φ ≥ 0` and `φ' ≥ 0`. A bump `ψ` with
`g^{(n+1)} = ψ` has `g^{(n+2)} = ψ'` of both signs, so the contradiction argument of
`peanoKernel_closedNewtonCotes_nonpos_of_even` does not run; test functions with `g^{(n+2)} ≥ 0`
only give `∫_s^b K ≤ 0` for every `s`, which does not imply `K ≤ 0`. What is missing is a direct
proof that the order-`n` Peano kernel of the odd closed rule has constant sign (Steffensen's
theorem); the derivative identity `K_m' = -K_{m-1}` between the Peano kernels of one rule at
consecutive orders is the usual starting point. Estimated 300–500 lines with that idea in hand.'''
deps = ["newtonCotesK_neg", "integral_eq_closedNewtonCotes_of_degree_le", "Quadrature.error_eq_integral_peanoKernel", "exists_mem_Ioo_integral_mul_eq_mul_integral_of_nonpos"]

[[node]]
id = "exists_sub_openNewtonCotes_eq_of_even"
kind = "theorem"
desc = '''**Theorem 9.2, open rules, even `n`** ([quarteroni2000numerical] (9.19)): for even `n`,
`a < b`, `h = (b - a)/(n + 2)` and `f ∈ C^{n+2}` on an open `U ⊇ Icc a b`,
`∃ ξ ∈ Ioo a b, ∫_a^b f - openNewtonCotes n f a b
  = openNewtonCotesM n / (n + 2)! * h^(n + 3) * iteratedDeriv (n + 2) f ξ`;
for `n = 0` this is the midpoint formula `exists_sub_midpoint_eq` with `ξ` in the open
interval. Same route as the closed case with `openNewtonCotesM_pos` and the open nodes
`a + (i + 1) h`; the Peano kernel is nonnegative. Not attempted this round. ★★★

Blocked: `openNewtonCotesM_pos` and the kernel-sign ingredient
(`integral_intNodal_neg_one_mul_nonneg`, which gives `W̃ ≤ 0` on `[-1, n+1]` and `W̃(-1) = W̃(n+1)
= 0`, exactly what the divided-difference core needs) are now proved, so the route is open; what
remains is the ~450-line port of the closed even-`n` machinery to the open nodes
`a + (i+1) h`: the extra exactness at degree `n + 1` for even `n` (the open analogue of
`integral_eq_closedNewtonCotes_of_even`, from `openNewtonCotesWeight_symm`), the core
`sub_openNewtonCotes_nonneg_of_even`, the bump argument for the kernel sign, and the kernel
integral `∫_a^b K_{n+1} = M̃_n/(n+2)! h^{n+3}`. Not attempted for lack of time.'''
deps = ["openNewtonCotesM_pos", "integral_eq_openNewtonCotes_of_degree_le", "openNewtonCotesWeight_symm", "Quadrature.error_eq_integral_peanoKernel", "exists_mem_Ioo_integral_mul_eq_mul_integral"]

[[node]]
id = "exists_sub_openNewtonCotes_eq_of_odd"
kind = "theorem"
desc = '''**Theorem 9.2, open rules, odd `n`** ([quarteroni2000numerical] (9.20)): for odd `n`,
`a < b`, `h = (b - a)/(n + 2)` and `f ∈ C^{n+1}` on an open `U ⊇ Icc a b`,
`∃ η ∈ Ioo a b, ∫_a^b f - openNewtonCotes n f a b
  = openNewtonCotesK n / (n + 1)! * h^(n + 2) * iteratedDeriv (n + 1) f η`.
Same route with `openNewtonCotesK_pos`. Not attempted this round. ★★★

Blocked: `openNewtonCotesK_pos` is proved and `integral_intNodal_neg_one_mul_nonneg` gives the
sign of `W̃` for odd `n` as well, but this node inherits the obstruction of
`exists_sub_closedNewtonCotes_eq_of_odd`: for odd `n` the primitive does not vanish at both ends
(`W̃(n+1) = K̃_n > 0`), so the bump argument for the order-`n` Peano kernel does not run. See the
note there.'''
deps = ["openNewtonCotesK_pos", "integral_eq_openNewtonCotes_of_degree_le", "Quadrature.error_eq_integral_peanoKernel", "exists_mem_Ioo_integral_mul_eq_mul_integral"]

