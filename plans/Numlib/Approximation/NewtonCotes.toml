[[node]]
id = "hermiteBasisL"
kind = "definition"
desc = '''The Hermite cardinal polynomials of (9.28) at distinct nodes `x : Fin (n + 1) → ℝ`:
`hermiteBasisL x k = (1 - (ω''(x_k)/ω'(x_k)) (X - C (x_k))) * (l_k)^2` and
`hermiteBasisM x k = (X - C (x_k)) * (l_k)^2`, with `l_k = Lagrange.basis Finset.univ x k` and
`ω = ∏ (X - C (x_i))`. Two definitions. ★'''
deps = []

[[node]]
id = "hermiteBasisL_eval_node"
kind = "theorem"
desc = '''The duality relations: `(hermiteBasisL x k).eval (x j) = if j = k then 1 else 0`,
`(derivative (hermiteBasisL x k)).eval (x j) = 0`, `(hermiteBasisM x k).eval (x j) = 0`,
`(derivative (hermiteBasisM x k)).eval (x j) = if j = k then 1 else 0`, for injective `x`.
The `ω''/ω'` factor is chosen exactly to kill `(l_k²)'(x_k) = 2 l_k'(x_k)`, and
`l_k'(x_k) = ω''(x_k)/(2 ω'(x_k))`. Four clauses. ★★'''
deps = ["Quadrature.hermiteBasisL"]

[[node]]
id = "hermiteQuadrature"
kind = "definition"
desc = '''The Hermite quadrature rule (9.29): for nodes `x`, `hermiteQuadrature x a b f f' :=
∑ k, (∫ t in a..b, (hermiteBasisL x k).eval t) * f (x k) + ∑ k, (∫ t in a..b, (hermiteBasisM x k).eval t) * f' (x k)`.
★'''
deps = ["Quadrature.hermiteBasisL"]

[[node]]
id = "integral_eq_hermiteQuadrature_of_degree_le"
kind = "theorem"
desc = '''**Hermite quadrature has degree of exactness `2n + 1`**: for injective `x : Fin (n + 1) → ℝ`
and `p : ℝ[X]` with `p.degree ≤ 2n + 1`,
`∫_a^b p = hermiteQuadrature x a b (fun t => p.eval t) (fun t => (derivative p).eval t)`. By
`Hermite.isUnisolvent`/`Hermite.eq_interpolate` and the duality relations,
`p = ∑ p(x_k) L_k + ∑ p'(x_k) M_k` (both sides agree with multiplicity two at every node and have
degree `≤ 2n + 1`); integrate. ★★'''
