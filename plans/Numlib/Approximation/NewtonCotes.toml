[[node]]
id = "newtonCotesK_neg"
kind = "theorem"
desc = '''`newtonCotesK n < 0` for odd `n`: the companion of `newtonCotesM_neg` for the closed rules
with odd `n` ([quarteroni2000numerical] Theorem 9.2, (9.20), stated by the book without proof).
Route: for odd `n = 2m + 1` the nodal polynomial is even about the midpoint, so
`K_n = 2 ∫_0^{n/2} π_{n+1}`; the unit-panel integrals alternate in sign starting negative
(`intNodal_eval_mul_neg_one_pow_pos` with `n - k` odd for `k = 0`) with decreasing modulus up to
the midpoint (`abs_intNodal_eval_add_one_lt`), and the last half-panel `[m, m + 1/2]` is
dominated by the panel `[m - 1, m]`. Not attempted this round; the even-`n` engine
(`integral_intNodal_natCast_pos`, `integral_intNodal_double_panel_pos`) is the model. ★★★'''
deps = ["newtonCotesK", "intNodal_eval_mul_neg_one_pow_pos", "abs_intNodal_eval_add_one_lt"]

[[node]]
id = "openNewtonCotesM_pos"
kind = "theorem"
desc = '''`openNewtonCotesM n > 0` for even `n`: the companion of `newtonCotesM_neg` for the open
rules ([quarteroni2000numerical] Theorem 9.2, (9.19), stated by the book without proof). Route:
with `W̃(x) = ∫_{-1}^x π_{n+1}`, `W̃(n + 1) = 0` by antisymmetry and `W̃ < 0` on `(-1, n + 1)` —
the panel `(-1, 0)` carries the sign `(-1)^{n+1} = -1` and the subsequent panel integrals
alternate with decreasing modulus up to the midpoint (`abs_intNodal_eval_add_one_lt` holds for
`t > -1`); then `M̃_n = -∫_{-1}^{n+1} W̃ > 0` by parts. Not attempted this round. ★★★'''
deps = ["openNewtonCotesM", "intNodal_eval_mul_neg_one_pow_pos", "abs_intNodal_eval_add_one_lt"]

[[node]]
id = "openNewtonCotesK_pos"
kind = "theorem"
desc = '''`openNewtonCotesK n > 0` for odd `n`: the companion of `newtonCotesM_neg` for the open
rules with odd `n` ([quarteroni2000numerical] Theorem 9.2, (9.20)). The same alternating-panel
analysis on `[-1, n + 1]` as `openNewtonCotesM_pos`, with the outer panels positive. Not
attempted this round. ★★★'''
deps = ["openNewtonCotesK", "intNodal_eval_mul_neg_one_pow_pos", "abs_intNodal_eval_add_one_lt"]

