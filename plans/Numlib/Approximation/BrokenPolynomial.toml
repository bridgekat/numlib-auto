namespace = "BrokenPolynomial"
desc = '''
Broken (discontinuous) piecewise polynomial spaces on a partition `α = x₀ < x₁ < ⋯ < x_n = β`: an
element is a polynomial of degree at most `r` on each panel `[x_i, x_{i+1}]`, with no continuity
across nodes. Represented as `{p : Fin n → ℝ[X] // ∀ i, (p i).natDegree ≤ r}`, a finite-dimensional
real vector space of dimension `n (r + 1)`, with the `L²(α, β)` inner product `∑_i ∫_{x_i}^{x_{i+1}}
p_i q_i`. Because each piece is a polynomial, the one-sided traces `v⁺(x_i) = p_i(x_i)`, `v⁻(x_i) =
p_{i-1}(x_i)` and the jumps `[v]_i = v⁺(x_i) - v⁻(x_i)` are evaluations, and the integration by
parts `∫_{x_i}^{x_{i+1}} a v v' = ½[a v²] - ½ ∫ a' v²` on a panel is Mathlib's
`intervalIntegral.integral_mul_deriv_eq_deriv_mul`. The **continuous** piecewise polynomials `X_h^r`
are the subspace of zero interior jumps, so the finite element spaces of Quarteroni–Sacco–Saleri
§12.4.5 and §13.10 (`X_h^r`, `X_h^{r,0}`, `Y_h^r`) are all subspaces of one object.

This is the trial-space layer for the discontinuous Galerkin form of
`Numlib/Variational/Evolution`, and the natural home of the piecewise **inverse inequality** `‖v'‖²
≤ 12 h_min⁻² ‖v‖²` for continuous piecewise linear functions, which is the `λ_max ≤ c h⁻²` behind
the parabolic CFL condition `Δt ≤ C h²` of the θ-method with `θ < ½`.

`Numlib/Approximation/PiecewiseLinearL2` builds the `r = 1` spaces as *classes in `L²`*, where
traces do not exist; the two should be related by an isometric embedding `BrokenPolynomial x 1 →ₗᵢ
L²(α, β)` onto `discPiecewiseLinearLp` (a node here), not merged.
'''

[[node]]
id = "_root_.BrokenPolynomial"
kind = "definition"
desc = '''`BrokenPolynomial (x : Fin (n + 1) → ℝ) (r : ℕ) := {p : Fin n → Polynomial ℝ // ∀ i, (p i).natDegree
≤ r}` as a `Submodule ℝ (Fin n → Polynomial ℝ)` (`Polynomial.degreeLT`-based), with the inner
product `⟪p, q⟫ = ∑ i, ∫ s in x i..x (i+1), (p i).eval s * (q i).eval s` (an `InnerProductSpace ℝ`
instance, definite because a polynomial vanishing a.e. on a nondegenerate interval is zero —
requires `StrictMono x`); `finrank = n * (r + 1)`. ★★'''
deps = []

[[node]]
id = "traceRight"
kind = "definition"
desc = '''`traceRight (v : BrokenPolynomial x r) (i : Fin n) : ℝ := (v.1 i).eval (x i.castSucc)` (`v⁺(x_i)`),
`traceLeft v (i : Fin (n+1)) : ℝ := (v.1 (i - 1)).eval (x i)` for `i ≥ 1` and `0` for `i = 0` (`v⁻(x_i)`,
with the inflow convention `v⁻(x₀) = 0`), `jump v i := traceRight v i - traceLeft v i.castSucc`;
all linear in `v` (`traceRightₗ`, `jumpₗ`). ★'''
deps = ["BrokenPolynomial"]

[[node]]
id = "continuous"
kind = "definition"
desc = '''`continuous x r : Submodule ℝ (BrokenPolynomial x r) := {v | ∀ i : Fin n, 0 < (i : ℕ) → jump v i =
0}`, the continuous piecewise polynomials `X_h^r`; `continuous_eval_eq`: for `v` in it the function
`s ↦ (v.1 i).eval s` on panel `i` glues to a continuous function on `[α, β]` (`toContinuousMap`).
`X_h^{r,0}` and `V_h^{in}` are the further subspaces with `traceRight v 0 = 0` and/or `traceLeft v n =
0`. ★'''
deps = ["BrokenPolynomial.traceRight"]

[[node]]
id = "integral_mul_deriv_mul_eq"
kind = "theorem"
desc = '''Panel integration by parts: for `a : ℝ → ℝ` continuously differentiable on `[x i, x (i+1)]` and
a polynomial `p`, `∫ s in x i..x (i+1), a s * p.eval s * p.derivative.eval s = (a (x (i+1)) * p.eval (x
(i+1)) ^ 2 - a (x i) * p.eval (x i) ^ 2) / 2 - (1/2) * ∫ s in x i..x (i+1), deriv a s * p.eval s ^ 2`.
`intervalIntegral.integral_mul_deriv_eq_deriv_mul` with `u = a p`, `v = p`… (write `a p p' = ½ a
(p²)'`). ★'''
deps = ["BrokenPolynomial"]

[[node]]
id = "sum_integral_mul_deriv_mul_eq"
kind = "theorem"
desc = '''Summed over the panels, in trace/jump form: for `v : BrokenPolynomial x r` and `a` as above,
`∑ i, ∫ s in x i..x (i+1), a s * (v.1 i).eval s * (v.1 i).derivative.eval s = a (x n) * traceLeft v n ^ 2
/ 2 - ∑ i : Fin n, a (x i) * (traceRight v i ^ 2 - traceLeft v i.castSucc ^ 2) / 2 - (1/2) * ∑ i, ∫ s in
x i..x (i+1), deriv a s * (v.1 i).eval s ^ 2` (reindexing the right endpoints). The identity the DG
energy estimate rests on. ★★'''
deps = ["BrokenPolynomial.integral_mul_deriv_mul_eq", "BrokenPolynomial.traceRight"]

[[node]]
id = "inverseInequality_continuous_linear"
kind = "theorem"
desc = '''The inverse inequality for continuous piecewise linear functions: for `v ∈ continuous x 1`
and `h_min = min_i (x (i+1) - x i) > 0`, `∑ i, ∫ s in x i..x (i+1), (v.1 i).derivative.eval s ^ 2 ≤ 12 /
h_min ^ 2 * ∑ i, ∫ s in x i..x (i+1), (v.1 i).eval s ^ 2`. On one panel of length `h` with endpoint
values `p, q`: `∫ v'² = (q - p)²/h` and `∫ v² = h (p² + p q + q²)/3 ≥ h (p² + q²)/6`, and `(q - p)² ≤ 2
(p² + q²)`. This is the `λ_max ≤ 12 ν h⁻²` of the `P₁` stiffness/mass pencil for any mesh (the
uniform case is explicit in `Matrix.symmTridiagonalToeplitz`). ★★'''
deps = ["BrokenPolynomial.continuous"]

[[node]]
id = "toLpₗᵢ"
kind = "definition"
desc = '''The isometric embedding `toLpₗᵢ : BrokenPolynomial x r →ₗᵢ[ℝ] Lp ℝ 2 (volume.restrict (Icc α β))`
(the function equal to `(v.1 i).eval` on the panel `[x i, x (i+1))`), with `range toLpₗᵢ` (for `r =
1`) equal to `IntegralOperator.discPiecewiseLinearLp α β … x` of `Numlib/Approximation/PiecewiseLinearL2`
(`range_toLpₗᵢ_one`). Records that the two constructions agree; nothing downstream needs it yet.
★★'''
deps = ["BrokenPolynomial"]

[[node]]
id = "traceLeft"
kind = "definition"
desc = '''`traceLeft (v : BrokenPolynomial x r) (i : Fin (n + 1)) : ℝ`, the left trace `v⁻(x_i) = p_{i-1}(x_i)`
for `1 ≤ i ≤ n` and `0` for `i = 0` (inflow convention). Linear in `v`. ★'''
deps = ["BrokenPolynomial"]

[[node]]
id = "jump"
kind = "definition"
desc = '''`jump (v : BrokenPolynomial x r) (i : Fin n) : ℝ := traceRight v i - traceLeft v i.castSucc`, the
jump `[v]_i = v⁺(x_i) - v⁻(x_i)` at the node `x_i` (with `[v]_0 = v⁺(x_0)`). Linear in `v`. ★'''
deps = ["BrokenPolynomial.traceRight", "BrokenPolynomial.traceLeft"]
