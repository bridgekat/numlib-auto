[[node]]
id = "jackson_trig"
kind = "theorem"
desc = '''Jackson's theorem (Atkinson–Han Thm 3.7.1): for `g ∈ C_p^{k,α}(2π)`, `k ≥ 0`, `0 < α ≤ 1`, with
Hölder constant `M_k` of `g^{(k)}`, the best uniform trigonometric approximation of degree `n ≥ 1`
satisfies `ρ_n(g) ≤ (1 + π²/2)^{k+1} M_k / n^{k+α}`; by the Jackson kernel and induction on `k`.

Not attempted. It is the largest single item of the module and it is independent of the Fourier
projection: the only thing it shares with the rest is the subspace `trigPolyLE (2 π) n` that it
measures the distance to, which now exists. The proof convolves with the normalized Jackson kernel
`(sin (n θ / 2) / sin (θ / 2))⁴` and estimates moduli of continuity; none of the projection theory
proved here is used by it.'''
deps = ["trigPolyLE"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.7.1"

[[node]]
id = "jackson_poly"
kind = "theorem"
desc = '''Atkinson–Han Thm 3.7.2: for `f ∈ C^{k,α}[-1, 1]`, the best uniform polynomial approximation of
degree `n` satisfies `ρ_n(f) ≤ d_k M_k / n^{k+α}` with `d_k = (1 + π²/2)^{k+1} ...` as in the book,
through `g(θ) = f(cos θ)` and `jackson_trig` ((3.7.1)–(3.7.2)). Not attempted, because
`jackson_trig` is not.'''
deps = ["jackson_trig"]
source = "Atkinson–Han, Theoretical Numerical Analysis, Theorem 3.7.2"
