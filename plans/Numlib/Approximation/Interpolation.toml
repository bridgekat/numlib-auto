[[node]]
id = "Lagrange.norm_interpolateCLM_chebyshev_le"
kind = "theorem"
desc = '''**The Lebesgue constant of the Chebyshev nodes grows logarithmically** (Rivlin, *An
Introduction to the Approximation of Functions*, Theorem 1.2; Quarteroni–Sacco–Saleri (10.25)):
for the `n + 1` nodes `x_j = cos ((2j+1)π/(2(n+1)))` in `X = Icc (-1) 1`,
`‖Lagrange.interpolateCLM x‖ ≤ (2/π) * Real.log (n + 1) + 1`. By `Lagrange.norm_interpolateCLM` the
norm is `max_t ∑_j |ℓ_j(t)|`; with `t = cos θ` and `ℓ_j(t) = T_{n+1}(t)/((t - x_j) T_{n+1}'(x_j))`
the Lebesgue function is `(1/(n+1)) ∑_j |cos((n+1)θ) sin θ_j / (cos θ - cos θ_j)|`, and Rivlin's
estimate bounds it through `∑_j |sin θ_j/(cos θ - cos θ_j)|` by a comparison with the harmonic sum.
A cruder bound `≤ 1 + (2/π) log (n+1) + c` with an explicit `c` is acceptable for every consumer
(the book uses only the logarithmic growth). Compare `norm_trigInterpCLM_le` of
`Numlib/Approximation/TrigonometricInterpolation`, the same estimate for equispaced trigonometric
interpolation, whose proof route (Lebesgue function of translates of the Dirichlet kernel) is the
model. ★★★

Blocked: not attempted in two passes. The reduction to a supremum is free
(`Lagrange.norm_interpolateCLM` gives `max_t ∑_j |ℓ_j(t)|`), but everything after it is Rivlin's
estimate of that supremum, which has no shortcut: substituting `t = cos θ`, `x_j = cos θ_j` with
`θ_j = (2j+1)π/(2(n+1))` and `cos θ - cos θ_j = -2 sin((θ+θ_j)/2) sin((θ-θ_j)/2)` turns the
Lebesgue function into `(|cos((n+1)θ)|/(n+1)) ∑_j sin θ_j / |2 sin((θ+θ_j)/2) sin((θ-θ_j)/2)|`,
and the logarithm comes out of comparing that sum with a harmonic sum through
`∫ dφ / sin φ = log tan (φ/2)`. `norm_trigInterpCLM_le` of
`Numlib/Approximation/TrigonometricInterpolation` is the same estimate for the Dirichlet kernel
and runs to several hundred lines; the Chebyshev case is a separate development of the same size,
with the two terms nearest the evaluation point again needing their own treatment. Estimated
500-800 lines; extracting a shared "a sum of reciprocal sines is at most a logarithm" lemma from
`norm_trigInterpCLM_le` would be the right first step.'''
deps = ["Lagrange.norm_interpolateCLM", "Lagrange.interpolateCLM"]

