[[node]]
id = "trigInterpCLM"
kind = "definition"
desc = '''Trigonometric interpolation at the `2 n + 1` equispaced nodes of a period, as a projection of
`C_p(2 pi)` onto the trigonometric polynomials of degree at most `n` (Atkinson-Han (3.7.19)), with
Rivlin's bound `norm (trigInterpCLM n) <= 1 + (2/pi) log n` (Atkinson-Han (3.7.20)) as
`norm_trigInterpCLM_le`.

No longer blocked on the subspace: `trigPolyLE` of `Numlib/Analysis/Fourier/TrigonometricBasis` is
it, `finrank_trigPolyLE` gives its dimension `2 n + 1`, and the Haar property it needs for
unisolvence at `2 n + 1` distinct nodes is `card_le_two_mul_of_forall_trigFun_eq_zero` of
`Numlib/Approximation/Chebyshev`; with `Approximation.haarCondition_iff_isUnisolvent` the operator
is then built exactly as `Lagrange.interpolateCLM` is. The norm bound is the separate half, and it
still needs the Dirichlet kernel of `Numlib/Analysis/Fourier/Dirichlet` on `AddCircle (2 pi)`
together with the comparison of `sum |sin| / k` with the integral of `dt/t`; the Lebesgue constant
of the Fourier projection in `Numlib/Approximation/Trigonometric` is the model for it.'''
deps = ["Lagrange.norm_interpolateCLM"]
source = "Atkinson–Han, Theoretical Numerical Analysis, (3.7.19)–(3.7.20)"
