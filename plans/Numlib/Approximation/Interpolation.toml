[[node]]
id = "norm_trigInterpCLM_le"
kind = "theorem"
desc = '''Rivlin's bound `norm (trigInterpCLM (2 pi) n) <= 1 + (2/pi) log n` (Atkinson-Han (3.7.20)) on the
operator norm of trigonometric interpolation at the equispaced nodes.

The operator itself is `trigInterpCLM`, built from unisolvence, and the norm is the separate half:
it needs the Dirichlet-kernel form of the interpolation projection on `AddCircle (2 pi)` from
`Numlib/Analysis/Fourier/Dirichlet`, together with the comparison of `sum |sin| / k` with the
integral of `dt/t`. The Lebesgue constant of the Fourier projection in
`Numlib/Approximation/Trigonometric` is the model for it.'''
deps = ["trigInterpCLM", "Lagrange.norm_interpolateCLM"]
source = "Atkinson–Han, Theoretical Numerical Analysis, (3.7.20)"

