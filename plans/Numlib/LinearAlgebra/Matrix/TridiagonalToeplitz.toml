# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.TridiagonalToeplitz` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch04) add a paragraph — "For an arbitrary angle `θ` the sine and cosine vectors
# `Matrix.sinAngleVec n θ = (sin((k+1)θ))_k` and `Matrix.cosAngleVec n θ = (cos(kθ))_k` are
# eigenvectors of `tridiag(a, b, a)` up to residuals in the first and last rows
# (`symmTridiagonalToeplitz_mulVec_sinAngleVec`, `…_cosAngleVec`; [golub2013matrix] Lemma 4.8.3);
# `sineVec n k` is `sinAngleVec n θ_k`, the case in which the residual vanishes. The Neumann and
# periodic variants are here as well (next paragraph)."
# (review) add a paragraph "The second-difference matrices": `𝒯^{(DD)}_n` is
# `symmTridiagonalToeplitz n (-1) 2`; its three low-rank adjustments of [golub2013matrix] (4.8.8)–(4.8.10),
# `Matrix.secondDifferenceDN n` (`− e_n e_{n−1}ᵀ`), `Matrix.secondDifferenceNN n` (also `− e_1 e_2ᵀ`) and
# `Matrix.secondDifferencePeriodic n` (`− e_1 e_nᵀ − e_n e_1ᵀ`), with their residual identities on
# `sinAngleVec`/`cosAngleVec`; the eigenvector matrices (DST-II, DCT-I, DFT) are in `Numlib/Analysis/Fourier`
# (`SineCosineTransform`, `Circulant`), and the solver framework in `Numlib/Direct/FastPoisson`. They are *not*
# the corner-modified `Y_{γ,δ}` below: `𝒯^{(DN)}`, `𝒯^{(NN)}` are unsymmetric and no diagonal scaling maps
# one family to the other; the only shared member is `2 • 1 − Y₀₀ = 𝒯^{(DD)}`
# (`two_smul_one_sub_cornerTridiagonal_zero_zero`), and `2 • 1 − Y₁₁` is the *symmetric* Neumann matrix
# (diagonal `(1, 2, …, 2, 1)`) that the DCT-II diagonalizes.
# (consolidation) add: the corner-modified tridiagonal `cornerTridiagonal n γ δ` (`Y_{γ,δ}` of
# [golub2013matrix] (12.1.7)) and the DCT-II vectors `cosineIIVec n k = (cos((2j+1)kπ/(2n)))_j`,
# eigenvectors of `Y₁₁` with eigenvalues `2 cos(kπ/n)` and mutually orthogonal — the cosine twins of
# `sineVec` (planned by ch12 for `Displacement`, placed here beside `sineVec`). `cornerTridiagonal` is real
# (its only consumers are the real DCT-II and the real Sylvester injectivity of `Displacement`).
