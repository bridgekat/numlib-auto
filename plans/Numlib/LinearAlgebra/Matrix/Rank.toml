[[node]]  # staged by ch12
id = "rank_le_iff_exists_mul"
kind = "theorem"
desc = '''The rank factorization: for `A : Matrix m n K` over a field, `A.rank ≤ r ↔ ∃ (B : Matrix m (Fin r) K) (C :
Matrix (Fin r) n K), A = B * C`. `←`: Mathlib `Matrix.rank_mul_le_right` and `rank_le_width`. `→`: choose a
basis of the column space (`Module.finrank_le_iff_exists_linearMap`-type, or `Matrix.exists_linearIndependent_col`
of this module), pad with zero columns to `r`, and take coordinates. ★★ (~50 lines)'''
deps = ["Matrix.exists_linearIndependent_col"]

[[node]]  # staged by ch12
id = "rank_le_iff_exists_mul_transpose"
kind = "theorem"
desc = '''The generator form used by displacement structure ([golub2013matrix] (12.1.3)): `A.rank ≤ r ↔ ∃ R : Matrix
m (Fin r) K, ∃ S : Matrix n (Fin r) K, A = R * Sᵀ`. From `rank_le_iff_exists_mul` with `S = Cᵀ`. ★'''
deps = ["Matrix.rank_le_iff_exists_mul"]

[[node]]  # staged by ch12
id = "rank_le_card_add_card_of_forall_ne_zero"
kind = "theorem"
desc = '''A matrix supported on `s` rows and `t` columns: if `∀ i j, A i j ≠ 0 → i ∈ s ∨ j ∈ t` (`s : Finset m`, `t :
Finset n`) then `A.rank ≤ s.card + t.card`. Split `A` into the rows in `s` and the rest (supported on the
columns `t`); `rank_add_le`, Mathlib `Matrix.rank_le_card_of_support_subset` and its transpose. Every
displacement-rank bound of [golub2013matrix] (12.1.8)–(12.1.11) is an instance. ★★ (~40 lines)'''
deps = ["Matrix.rank_add_le"]

[[node]]  # staged by ch12
id = "finrank_ker_toBlock_inv"
kind = "theorem"
desc = '''The nullity theorem, kernel form: for `A : Matrix n n K` invertible and predicates `p q` on `n`, the
kernels of `(A⁻¹.toBlock p q).mulVecLin` and of `(A.toBlock (fun i => ¬q i) (fun j => ¬p j)).mulVecLin` are
linearly equivalent, hence have the same `finrank`. The map `x ↦ (A⁻¹ x̄)|_{¬p}` (`x̄` the extension of `x` by
zero off `q`) with inverse `y ↦ (A ȳ)|_q`: `A⁻¹[p, q] x = 0` says `A⁻¹ x̄` vanishes on `p`, i.e. is `ȳ` for `y` on
`¬p`, and `A ȳ = x̄` vanishes on `¬q`. Fiedler–Markham (1986); cited by [golub2013matrix] §12.2 through
Vandebril–Van Barel–Mastronardi. The blocks are rectangular (`{j // q j}` columns, `{i // p i}` rows), so
the rank–nullity step later uses Mathlib's `LinearMap.finrank_range_add_finrank_ker` directly, not the
square-only `Matrix.rank_add_finrank_ker_mulVecLin`. ★★ (~80 lines)'''
deps = []

[[node]]  # staged by ch12
id = "rank_toBlock_inv_add_card"
kind = "theorem"
desc = '''The nullity theorem, rank form: `(A⁻¹.toBlock p q).rank + Fintype.card n = (A.toBlock (fun i => ¬q i)
(fun j => ¬p j)).rank + Fintype.card {i // p i} + Fintype.card {j // q j}` for invertible `A` (the domain of
the first block has dimension `|q|`, of the second `|¬p| = n − |p|`; rank–nullity for the rectangular blocks is
Mathlib's `LinearMap.finrank_range_add_finrank_ker` with `Module.finrank_pi` — the square-only
`Matrix.rank_add_finrank_ker_mulVecLin` does not apply). The engine of both `Matrix.rank_inv_toBlocks₂₁`/`₁₂`
(the block form of [golub2013matrix] §4.3.8) and the structured-rank results of [golub2013matrix] §12.2. ★'''
deps = ["Matrix.finrank_ker_toBlock_inv"]
