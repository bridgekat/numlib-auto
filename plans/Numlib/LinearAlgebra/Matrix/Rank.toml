[[node]]  # staged by ch04
id = "rank_inv_toBlocks₂₁"
kind = "theorem"
desc = '''The nullity theorem for the off-diagonal block ([golub2013matrix] §4.3.8, "It can actually be shown that
`rank(A₂₁) = rank(X₂₁)`", Strang–Nguyen 2004): for a nonsingular `A : Matrix (m ⊕ n) (m ⊕ n) K`
over a field, `(A⁻¹).toBlocks₂₁.rank = A.toBlocks₂₁.rank`. A one-line corollary of the general nullity
theorem `Matrix.rank_toBlock_inv_add_card` at `p = Sum.isRight`, `q = Sum.isLeft` (so `¬q` selects the
`inr` rows and `¬p` the `inl` columns: the block `A[¬q, ¬p]` is `A₂₁`), the cardinalities `|p| + |q| =
|n| + |m| = |m ⊕ n|` cancelling; the `toBlock` of a `Sum` predicate is reindexed to `toBlocks₂₁` by Mathlib's
`Matrix.rank_submatrix` with `Equiv.sumCompl`-type equivalences `{i // i.isRight} ≃ n`. No invertibility of
the diagonal blocks and no limit argument (the book's proof assumes `A₁₁`, `A₂₂` nonsingular and appeals to
P4.3.11). ★ (~25 lines, most of it the reindexing)'''
deps = ["Matrix.rank_toBlock_inv_add_card"]

[[node]]  # staged by ch04
id = "rank_inv_toBlocks₁₂"
kind = "theorem"
desc = '''The nullity theorem for the other off-diagonal block: `(A⁻¹).toBlocks₁₂.rank = A.toBlocks₁₂.rank` for
nonsingular `A : Matrix (m ⊕ n) (m ⊕ n) K`. Same one-liner as `Matrix.rank_inv_toBlocks₂₁`, from
`Matrix.rank_toBlock_inv_add_card` at `p = Sum.isLeft`, `q = Sum.isRight` (no transpose needed). ★'''
deps = ["Matrix.rank_toBlock_inv_add_card"]

