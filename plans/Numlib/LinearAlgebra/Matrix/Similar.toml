[[node]]
id = "IsUnitarilySimilar"
kind = "definition"
desc = '''`Matrix.IsUnitarilySimilar (A B : Matrix n n 𝕜) : Prop := ∃ U ∈ unitaryGroup n 𝕜, B = star U * A * U` (`RCLike 𝕜`), with `IsUnitarilySimilar.isSimilar` (`U⁻¹ = star U` for a unitary, `Matrix.inv_eq_left_inv`). Quarteroni–Sacco–Saleri Definition 1.14, second sentence; the Schur, spectral and normal theorems of the backbone produce this relation. ★'''
deps = ["Matrix.IsSimilar"]

