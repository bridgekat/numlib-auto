[[node]]
id = "isSimilar_diagonal_iff_forall_finrank_eigenspace_eq_rootMultiplicity"
kind = "theorem"
desc = '''Over an algebraically closed field: `(∃ d, IsSimilar A (diagonal d)) ↔ ∀ μ, finrank K (Module.End.eigenspace (toLin' A) μ) = A.charpoly.rootMultiplicity μ` — a matrix is diagonalizable iff it is nondefective, Quarteroni–Sacco–Saleri §1.8 after Property 1.6. Proof: `∑_μ geometric ≤ ∑_μ algebraic = n` (`finrank_eigenspace_le_rootMultiplicity_charpoly` of the Jordan EXT, `Polynomial.sum_rootMultiplicity_eq_natDegree` for a split polynomial), with equality of the sums iff `⨆ eigenspace = ⊤` (the eigenspaces are independent, `Module.End.eigenspaces_iSupIndep`) iff termwise equality. ★★'''
deps = ["Matrix.isSimilar_diagonal_iff_iSup_eigenspace_eq_top", "Matrix.finrank_eigenspace_le_rootMultiplicity_charpoly"]
