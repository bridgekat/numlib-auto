[[node]]
id = "growthFactor_le_of_hasBandwidth"
kind = "theorem"
desc = '''QSS §3.10 (1), Higham Theorem 9.11 (Bohte): for `A` with upper and lower bandwidth `p`, GEPP has
`growthFactor ≤ 2^{2p-1} - (p-1) 2^{p-2}`. Not formalized: the book states it without proof, and
Bohte's argument tracks the propagation of the band under row interchanges (each swap widens the
upper band by up to `p`) with a combinatorial count that has no counterpart in the library; the
tridiagonal case `p = 1` is `growthFactor_le_two_of_isTridiagonal`. ★★★'''
deps = ["Matrix.growthFactor", "Matrix.gemPivotStage", "Matrix.HasLowerBandwidth", "Matrix.HasUpperBandwidth"]

[[node]]
id = "growthFactor_le_of_completePivoting"
kind = "theorem"
desc = '''QSS §3.10, complete pivoting: `growthFactor ≤ √N (2 · 3^{1/2} ⋯ N^{1/(N-1)})^{1/2}` (Wilkinson 1961).
Not formalized: the book states it without proof; the proof is Hadamard's determinant inequality
applied to the leading blocks of the pivoted stages together with the pivot-dominance clause of
`exists_permMatrix_mul_mul_permMatrix_isLU`. Hadamard's inequality is not in Mathlib (grepped
`Hadamard` under `Mathlib/LinearAlgebra/Matrix`: only `HadamardMatrix`, a different object). ★★★'''
deps = ["Matrix.growthFactor", "Matrix.exists_permMatrix_mul_mul_permMatrix_isLU"]

