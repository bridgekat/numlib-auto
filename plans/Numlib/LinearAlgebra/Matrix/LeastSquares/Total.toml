namespace = "Matrix"
desc = '''
Total least squares ([golub2013matrix] §6.3, after Golub–Van Loan 1980): perturb both the data
matrix and the right-hand sides, `min ‖D [E | R] T‖_F` subject to `range (B + R) ⊆ range (A + E)`,
with diagonal row weights `D` and column weights `T`. The generic existence and uniqueness
theorem through the SVD of `C = D [A | B] T` ([golub2013matrix] Theorem 6.3.1), the norm of the
solution, the single right-hand-side case with repeated smallest singular values (the
Householder device of Algorithm 6.3.1, and nonexistence when the last components vanish), and
the orthogonal-regression reading (6.3.6).

## Design

* **Predicates.** `Matrix.IsTLSPerturbation d t A B E R` (feasible, and no feasible pair has a
  smaller weighted Frobenius norm) and `Matrix.IsTLSSolution d t A B X` (`∃ E R` a TLS
  perturbation with `(A + E) X = B + R`), for `A : Matrix m n 𝕜`, `B : Matrix m k 𝕜`, real weights
  `d : m → ℝ`, `t : n ⊕ k → ℝ`, all nonzero; `[E | R]` is `Matrix.fromCols E R` on the column
  index `n ⊕ k`; the Frobenius norm is the scoped `Matrix.Norms.Frobenius` one. (6.3.2) is
  `d = 1`, `t = 1`, `k = Unit`.
* **The SVD enters through `Matrix.IsSVD`** of `C` reindexed to `Fin (n + k)` columns
  (`finSumFinEquiv`), and the partition `V = [V₁₁ V₁₂; V₂₁ V₂₂]` is `Matrix.toBlocks₁₁` … of the
  reindexed `V`.
* **Lower bounds without chapter 2 or 8 where possible.** The single right-hand side needs only
  `σ_min(C) ‖w‖ ≤ ‖C w‖` (a rank-`n` perturbation of an `(n+1)`-column matrix has a unit null
  vector `w`, and `‖ΔC‖_F ≥ ‖ΔC w‖ = ‖C w‖`). The multiple right-hand side of Theorem 6.3.1 needs
  the Frobenius Eckart–Young–Mirsky bound `∑_{i ≥ n} σ_i(C)² ≤ ‖C − Ĉ‖_F²` for `rank Ĉ ≤ n`
  (`Matrix.sum_sq_sortedSingularValues_le_frobenius_norm_sub_sq_of_rank_le`, a corollary of Mirsky's
  inequality) and its equality case (`Matrix.eq_svdTruncation_of_frobenius_norm_sub_sq_le`), and the
  column interlacing `σ_n(C₁) ≤ σ_n(C)` (`Matrix.sortedSingularValues_fromCols_left_le`); all three are
  in `Numlib/Analysis/Matrix/SingularValues`, which this module imports, as is the size of the
  solution `‖V₁₂ V₂₂⁻¹‖₂` (`Matrix.l2_opNorm_mul_inv_sq_eq`, the tan form of the stacked-isometry
  identity, moved there at the Golub–Van Loan review, H4). The least-stretch characterization of
  `σ_min` is chapter 7's `Matrix.iInf_singularValues_eq_iInf_norm` (SVD append). The book cites
  Corollary 2.4.5 for `σ_n(C) ≥ σ_n(C₁)`, which does not give it (recorded in Doubts).

## Order of attack

Predicates (★) → the single right-hand side (★★, self-contained) → (6.3.6) and the distance
lemma (★★) → `V₂₂` invertible (★★) → Theorem 6.3.1 (★★, ~150 lines once the Mirsky bound and its
equality case, ★★★ in `Numlib/Analysis/Matrix/SingularValues`, exist).
'''

[[node]]
id = "IsTLSPerturbation"
kind = "definition"
desc = '''**A total-least-squares perturbation** ([golub2013matrix] (6.3.2)–(6.3.3)): for
`A : Matrix m n 𝕜`, `B : Matrix m k 𝕜`, weights `d : m → ℝ`, `t : n ⊕ k → ℝ` and a pair
`E : Matrix m n 𝕜`, `R : Matrix m k 𝕜`: `LinearMap.range (B + R).mulVecLin ≤
LinearMap.range (A + E).mulVecLin` and every `(E', R')` with the same property has
`‖diagonal d * fromCols E R * diagonal t‖ ≤ ‖diagonal d * fromCols E' R' * diagonal t‖`
(Frobenius norms). ★'''
deps = []

[[node]]
id = "IsTLSSolution"
kind = "definition"
desc = '''**A total-least-squares solution** ([golub2013matrix] (6.3.3), "any `X` … that satisfies
`(A + E₀) X = B + R₀` is said to be a TLS solution"): `∃ E R, IsTLSPerturbation d t A B E R ∧
(A + E) * X = B + R`, `X : Matrix n k 𝕜`. ★'''
deps = ["IsTLSPerturbation"]

[[node]]
id = "isUnit_lowerRightBlock_of_lt"
kind = "theorem"
desc = '''**The generic condition makes `V₂₂` invertible** ([golub2013matrix] Theorem 6.3.1, first part
of the proof, lines 17168–17180): let `C = fromCols C₁ C₂` (`C₁ : Matrix (Fin m) (Fin n) 𝕜`,
`C₂ : Matrix (Fin m) (Fin k) 𝕜`), `IsSVD C U σ V` after reindexing the columns to `Fin (n + k)`,
and `V₂₂` the lower-right `k × k` block of `V`. If `σ_n(C₁) > σ_{n+1}(C)` (0-based:
`C₁.sortedSingularValues (n − 1) > σ n`), then `IsUnit V₂₂`. Proof: if `V₂₂ x = 0`,
`‖x‖ = 1`, then `‖V₁₂ x‖ = 1` (`V₁₂ᴴV₁₂ + V₂₂ᴴV₂₂ = 1`) and
`σ_{n+1} ≥ ‖U₂ Σ₂ x‖ = ‖C₁ V₁₂ x‖ ≥ σ_n(C₁)` (chapter 7's `Matrix.iInf_singularValues_eq_iInf_norm`, the least stretch). ★★'''
deps = ["Matrix.IsSVD", "Matrix.iInf_singularValues_eq_iInf_norm"]

[[node]]
id = "existsUnique_isTLSPerturbation"
kind = "theorem"
desc = '''**Theorem 6.3.1, the perturbation** ([golub2013matrix] Theorem 6.3.1, (6.3.4)): with
`m ≥ n + k`, nonzero weights, `C = diagonal d * fromCols A B * diagonal t`, an SVD
`IsSVD C U σ V` (columns reindexed to `Fin (n + k)`) and `σ_n(C₁) > σ_{n+1}(C)`, the pair
`[E₀ | R₀] := diagonal d⁻¹ * (−U₂ Σ₂ [V₁₂ᴴ | V₂₂ᴴ]) * diagonal t⁻¹` is the unique TLS
perturbation: `∃! ER, IsTLSPerturbation d t A B ER.1 ER.2`, attained there, with
`‖D [E₀ | R₀] T‖_F² = ∑_{i = n}^{n+k−1} σ_i²` (0-based).

Proof ([golub2013matrix] lines 17182–17200): feasibility of `(E, R)` means `range (B + R) ⊆
range (A + E)`, i.e. some `X` with `{C + D[E|R]T} T⁻¹ [X; −I_k] = 0` (6.3.5), so
`rank (C + ΔC) ≤ n`; the Frobenius Eckart–Young–Mirsky bound
(`Matrix.sum_sq_sortedSingularValues_le_frobenius_norm_sub_sq_of_rank_le`) gives
`‖ΔC‖_F² ≥ ∑_{i ≥ n} σ_i²`; `ΔC₀ = −U₂Σ₂[V₁₂ᴴ | V₂₂ᴴ]` attains it and is feasible because
`V₂₂` is invertible (`isUnit_lowerRightBlock_of_lt`). Uniqueness is the equality case of
Mirsky's bound when `σ_n(C) > σ_{n+1}(C)`, which follows from `σ_n(C) ≥ σ_n(C₁) > σ_{n+1}(C)`
(`Matrix.sortedSingularValues_fromCols_left_le`): an optimal `C + ΔC` is the truncated SVD
(`Matrix.eq_svdTruncation_of_frobenius_norm_sub_sq_le`).
★★ given those two (~150 lines of block bookkeeping).'''
deps = [
  "IsTLSPerturbation",
  "isUnit_lowerRightBlock_of_lt",
  "Matrix.sum_sq_sortedSingularValues_le_frobenius_norm_sub_sq_of_rank_le",
  "Matrix.eq_svdTruncation_of_frobenius_norm_sub_sq_le",
  "Matrix.sortedSingularValues_fromCols_left_le",
  "Matrix.IsSVD",
]

[[node]]
id = "isTLSSolution_iff_eq"
kind = "theorem"
desc = '''**Theorem 6.3.1, the solution** ([golub2013matrix] Theorem 6.3.1, `X_TLS`): under the hypotheses
of `existsUnique_isTLSPerturbation`, with `T₁ = diagonal (t ∘ Sum.inl)`, `T₂ = diagonal (t ∘ Sum.inr)`,
`IsTLSSolution d t A B X ↔ X = −T₁ * V₁₂ * V₂₂⁻¹ * T₂⁻¹`. Proof (lines 17200–17212): the null space
of `C + ΔC₀ = U₁ Σ₁ [V₁₁ᴴ | V₂₁ᴴ]` is the range of `[V₁₂; V₂₂]`, so `T⁻¹[X; −I] = [V₁₂; V₂₂] S`
and `S = −V₂₂⁻¹ T₂⁻¹`; uniqueness of the perturbation leaves no other `(E, R)`. ★★'''
deps = ["existsUnique_isTLSPerturbation", "isUnit_lowerRightBlock_of_lt", "IsTLSSolution"]

[[node]]
id = "isTLSSolution_of_mem_smallest"
kind = "theorem"
desc = '''**The single right-hand side with repeated smallest singular values** ([golub2013matrix]
§6.3.2): `k = 1` (`B = b`), `C = D [A | b] T` with `m > n`, `σ_min = σ_n(C)` its smallest singular
value (0-based index `n`), `w` a unit vector with `C *ᵥ w` of norm `σ_min` — equivalently `w` in the
span of the right singular vectors of `σ_min`, e.g. the book's last column `[z; α]` of
`V(:, n+1−p : n+1) Q̃` — and `w_last = α ≠ 0`. Then `x = −T₁ z / (t_{n+1} α)` is a TLS solution with
`D [E₀ | r₀] T = −C w wᴴ`. Proof: feasibility is `(C − C w wᴴ) w = 0`; optimality: any feasible
`ΔC` makes `C + ΔC` rank-deficient with a unit null vector `w'`, and
`‖ΔC‖_F ≥ ‖ΔC w'‖ = ‖C w'‖ ≥ σ_min = ‖C w wᴴ‖_F`. The lower bound `‖C w'‖ ≥ σ_min` and its attainment are chapter 7's
`Matrix.iInf_singularValues_eq_iInf_norm`, `Matrix.exists_norm_eq_iInf_singularValues`. ★★ (~150 lines).'''
deps = ["IsTLSSolution", "Matrix.IsSVD", "Matrix.iInf_singularValues_eq_iInf_norm", "Matrix.exists_norm_eq_iInf_singularValues"]

[[node]]
id = "not_isTLSSolution_of_forall_last_eq_zero"
kind = "theorem"
desc = '''**The nongeneric case: no TLS solution** ([golub2013matrix] §6.3.2, "If `α = 0`, then the TLS
problem has no solution"): with `k = 1` and notation as in `isTLSSolution_of_mem_smallest`, if every
unit `w` with `‖C w‖ = σ_min` has `w_last = 0`, then `¬ ∃ x, IsTLSSolution d t A b x`. Proof: a TLS
perturbation `ΔC` has `‖ΔC‖_F = σ_min` (the upper bound is the infimum over `w` with `w_last ≠ 0`,
approached but — by hypothesis — not attained; the lower bound is as above), and its feasible null
vector `w' = T⁻¹[x; −1]/‖·‖` has `w'_last ≠ 0`; equality in `‖ΔC‖_F ≥ ‖ΔC w'‖ = ‖C w'‖ ≥ σ_min`
forces `‖C w'‖ = σ_min`, contradicting the hypothesis. The first step (the value of the infimum)
uses density of `{w : w_last ≠ 0}` in the unit sphere. ★★ (~150 lines).'''
deps = ["isTLSSolution_of_mem_smallest", "IsTLSSolution"]

[[node]]
id = "tlsObjective"
kind = "definition"
desc = '''**The orthogonal-regression objective** ([golub2013matrix] (6.3.6)): for real `A : Matrix m n ℝ`,
`b`, weights `d : m → ℝ`, `t : Fin (n + 1) → ℝ`, `tlsObjective d t A b x =
∑ i, d i ^ 2 * (A i ⬝ᵥ x − b i) ^ 2 / (∑ j : Fin n, x j ^ 2 / t j ^ 2 + 1 / t (Fin.last n) ^ 2)`. ★'''
deps = []

[[node]]
id = "isMinOn_tlsObjective"
kind = "theorem"
desc = '''**The TLS solution minimizes `ψ`** ([golub2013matrix] (6.3.6), "It can be shown that the TLS
solution `x_TLS` minimizes `ψ(x)`", P6.3.5): with `k = 1` and `σ_n(C₁) > σ_{n+1}(C)`, the unique
TLS solution `x` of `isTLSSolution_iff_eq` minimizes `tlsObjective d t A b` over `ℝⁿ`. Proof: with
`w = T⁻¹[x; −1]`, `ψ(x) = ‖C w‖² / ‖w‖²` is a Rayleigh quotient of `CᴴC`, bounded below by
`σ_{n+1}(C)²` and attained at `w ∝ v_{n+1}`, which is `T⁻¹[x_TLS; −1]` up to scale
(`isTLSSolution_iff_eq` with `k = 1`: `x_TLS = −T₁ v₁₂/(t_{n+1} v₂₂)`). ★★'''
deps = ["tlsObjective", "isTLSSolution_iff_eq", "LinearMap.IsSymmetric.isLeast_eigenvalues"]

[[node]]
id = "iInf_sq_norm_diagonal_mulVec_sub_hyperplane"
kind = "theorem"
desc = '''**The weighted distance to a hyperplane** ([golub2013matrix] §6.3.3, "`δ_i` is the square of
the distance from `[a_i; b_i]` to the nearest point in `P_x` … measured by `‖z‖ = ‖Tz‖₂`"): for
`t : ι → ℝ` nonzero, `ν ≠ 0` and `q : ι → ℝ` (real, `Fintype ι`),
`⨅ w ∈ {w | ν ⬝ᵥ w = 0}, ‖diagonal t *ᵥ (q − w)‖² = (ν ⬝ᵥ q)² / ∑ j, (ν j / t j)²`,
attained. With `ν = [x; −1]`, `q = [a_i; b_i]` this is `δ_i = |a_iᵀx − b_i|²/(xᵀT₁⁻²x + t_{n+1}⁻²)`.
Change variables `u = T w`: the distance from `T q` to the hyperplane `{u : (T⁻¹ν) ⬝ᵥ u = 0}` in the
Euclidean norm, `|⟪T⁻¹ν, Tq⟫|/‖T⁻¹ν‖` (Mathlib's orthogonal projection onto a hyperplane /
`Submodule.starProjection` of `(span {T⁻¹ν})ᗮ`). ★★'''
deps = []
