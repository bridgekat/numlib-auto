# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.Hessenberg` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch01) in "Bandwidths and the named shapes", add: "`Matrix.HasLowerBandwidthRect` and
# `Matrix.HasUpperBandwidthRect` are the same conditions for a rectangular `Matrix (Fin m) (Fin n)
# R`, where the index difference is taken in `ℕ` — [golub2013matrix] §1.2.1 defines bandwidth for `m
# × n` matrices (Table 1.2.1), and the bidiagonal and banded shapes of the SVD and band-LU chapters
# are rectangular; on a square `Fin n` they agree with the order-theoretic predicates
# (`hasLowerBandwidthRect_iff`)."
# (review) add to "Bandwidths and the named shapes": "`Matrix.isUpperHessenbergRect_iff_hasLowerBandwidthRect_one`:
# the rectangular Hessenberg shape is lower bandwidth `1` in the rectangular vocabulary (the bidiagonal
# rectangular shapes `IsUpperBidiagonalRect`/`IsLowerBidiagonalRect` are in `Bidiagonal`, with the same
# characterizations)."
# (ch03) add `Matrix.IsUnitUpperTriangular`, the dual of `Matrix.IsUnitLowerTriangular` (symmetry;
# [golub2013matrix] §3.1.7 lists the unit upper facts beside the unit lower ones, and the `U L`
# factorization of its P3.2.5 and the unit upper factors of later chapters use it).
