# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.QR` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch05) add to "Main definitions" `Matrix.reflector v`, the Householder reflector `1 - (2 / vᴴv) v
# vᴴ` of an unnormalized axis (the form of [golub2013matrix] (5.1.1), [quarteroni2000numerical]
# (5.38) and [higham2002accuracy] (19.1)), with `Matrix.householder` its unit-axis form; and
# `Matrix.IsThinQR`, the thin factorization `A = Q R`, `Qᴴ Q = 1`, `R` upper triangular, which
# `Matrix.exists_qr` and `Matrix.qr_unique` already speak about without a name. Add to "Main
# results" the Gram–Schmidt projector identity behind modified Gram–Schmidt
# (`Matrix.prod_one_sub_vecMulVec_of_orthonormal`) and the Cholesky reading of the thin factor
# (`Matrix.IsThinQR.isCholesky`, [golub2013matrix] Theorem 5.2.3).
# (ch05, GVL review M5, refactors R4/R16) add to "Main definitions" `Matrix.IsPivotedQR` (QR with
# column pivoting, `IsQR` of `A Π`) beside `Matrix.IsQR` and `Matrix.IsThinQR`, and to "Main results"
# the column-prefix spans of a full QR factorization ([golub2013matrix] (5.2.1),
# `Matrix.IsQR.span_col_prefix_eq`) and the thin factors of a full one (`Matrix.IsQR.isThinQR`).
# (ch08) add to the Householder paragraph: the symmetric two-sided application of a reflector in the
# `(β, v)` form is a rank-two update, `Matrix.conj_one_sub_smul_vecMulVec_eq_sub` ([golub2013matrix]
# §8.3.1), the identity the tridiagonalization and its rounding analysis use.
# (Golub–Van Loan review M7) Say once, in the Householder paragraph, how the three spellings of a
# reflector relate: `Matrix.householder u` (unit axis), `Matrix.reflector v` (any axis,
# `β = 2 / vᴴv`, the identity at `v = 0`) and the `(β, v)` form `1 - β • vecMulVec v (star v)` that
# programs produce (Algorithms 5.1.1, 7.4.2, 8.3.1 return `β`, possibly `0`). Every identity about
# products or conjugations of reflectors (`conj_one_sub_smul_vecMulVec_eq_sub`, the WY lemmas of
# `Numlib/LinearAlgebra/Matrix/WY`) is stated in the `(β, v)` form over a `StarRing`, and
# `reflector v` is its instance at `β = 2 / (star v ⬝ᵥ v)` by `rfl`; no statement rebuilds `β` from `v`.
