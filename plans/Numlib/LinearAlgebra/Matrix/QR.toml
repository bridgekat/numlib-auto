namespace = "Matrix"
desc = '''
Householder reflectors and the QR factorization of a matrix with linearly independent columns, an
upstreaming candidate (natural home: `Mathlib.LinearAlgebra.Matrix.QR`; Mathlib has
`InnerProductSpace.gramSchmidt` and `Matrix.LDL` but no QR and no reflectors).

Serves Saad, *Iterative Methods for Sparse Linear Systems*, §1.7 - Algorithms 1.1 and 1.2
(classical and modified Gram-Schmidt), (1.19) `X = Q R`, the reflector (1.20) and its defining
conditions (1.21)-(1.26), the triangularization (1.27)-(1.28) and Algorithm 1.3 - and Kress,
*Numerical Analysis*, §5, which is the second consumer.

Two routes to the same factorization are wanted, because the book gives both and because the
uniqueness statement is what identifies them:

* Gram-Schmidt. `Q` is `InnerProductSpace.gramSchmidtNormed` of the columns and `R i j` is
  `⟪Q i, X j⟫`; existence is then Mathlib's orthonormality and span lemmas, and the triangularity
  of `R` is `gramSchmidtNormed` being orthogonal to the later columns.
* Householder. `Matrix.householder w = 1 - 2 • vecMulVec w (star w)` for a unit `w`; each
  reflector is unitary and involutive, and the reflector of (1.22) maps a vector to a multiple of
  `e₀`. `Matrix.exists_unitary_mul_upperTriangular` is then an induction over the columns.

Uniqueness with a positive diagonal is the bridge: `Matrix.qr_unique` says that if
`X = Q₁ R₁ = Q₂ R₂` with orthonormal columns and upper triangular `R_i` of positive diagonal then
`Q₁ = Q₂` and `R₁ = R₂`, which is how the two routes and the surface's modified Gram-Schmidt are
identified without repeating either construction.

What this module must not do: no numerical stability, no operation counts, no pivoting - those are
the floating-point layer. It should also not duplicate the `EuclideanSpace`-level Householder
reflectors that the Saad surface defines for Algorithm 6.3
(`NumlibSurface/SaadSparse/Chapter06/Section03`); `plans/proposals/saadlow.md` asks for an
identification lemma there instead.
'''

[[node]]
id = "householder"
kind = "definition"
desc = '''`Matrix.householder (w : n → 𝕜) : Matrix n n 𝕜 := 1 - (2 : 𝕜) • vecMulVec w (star w)`, Saad
(1.20)/(1.23), the reflection in the hyperplane orthogonal to a unit vector `w`; the identity when
`w = 0`. With `householder_isHermitian`, `householder_mul_self` (involutive when `‖w‖ = 1`) and
`householder_mem_unitaryGroup`.'''
source = "Saad, Iterative Methods for Sparse Linear Systems, (1.20) and (1.23)"

[[node]]
id = "householder_mulVec_eq_smul_single"
kind = "theorem"
desc = '''Saad (1.21)-(1.22): for `x ≠ 0` and an index `i`, the unit vector
`w = (x + sign(x i) ‖x‖ • e_i) / ‖x + sign(x i) ‖x‖ • e_i‖` satisfies
`householder w *ᵥ x = (- sign(x i) * ‖x‖) • e_i`, so one reflector annihilates every entry of `x`
but the `i`-th. The sign choice is the book's and is what keeps the denominator away from zero.'''
deps = ["householder"]
source = "Saad, Iterative Methods for Sparse Linear Systems, (1.21)-(1.22) and (1.24)-(1.26)"

[[node]]
id = "exists_unitary_mul_upperTriangular"
kind = "theorem"
desc = '''Saad (1.27)-(1.28) and Algorithm 1.3: for `X : Matrix (Fin n) (Fin m) 𝕜` there is
`P ∈ Matrix.unitaryGroup (Fin n) 𝕜`, a product of at most `m` Householder reflectors, with
`P * X` upper triangular (zero below the diagonal in the rectangular sense). Induction on the
columns, each step `householder_mulVec_eq_smul_single` applied to the tail of the current
column.'''
deps = ["householder_mulVec_eq_smul_single"]
source = "Saad, Iterative Methods for Sparse Linear Systems, (1.27)-(1.28)"

[[node]]
id = "exists_qr"
kind = "theorem"
desc = '''Saad (1.19): a matrix `X : Matrix (Fin n) (Fin m) 𝕜` whose columns are linearly independent
factors as `X = Q * R` with `Qᴴ * Q = 1` and `R` upper triangular with positive real diagonal.
Constructed from `InnerProductSpace.gramSchmidtNormed` of the columns, with `R i j = ⟪Q i, X j⟫`;
Saad's Algorithm 1.1 is this construction and Algorithm 1.2 (modified Gram-Schmidt) computes the
same `Q` and `R` in exact arithmetic. The converse, that a factorization forces the columns to be
independent, is `linearIndependent_of_qr`.'''
deps = ["exists_unitary_mul_upperTriangular"]
source = "Saad, Iterative Methods for Sparse Linear Systems, (1.19)"

[[node]]
id = "qr_unique"
kind = "theorem"
desc = '''Uniqueness of the QR factorization with a positive diagonal: if `X = Q₁ * R₁ = Q₂ * R₂` with
`Qᵢᴴ * Qᵢ = 1`, `Rᵢ` upper triangular and `0 < (Rᵢ).diag j` for every `j`, then `Q₁ = Q₂` and
`R₁ = R₂`. This is the flag-uniqueness argument of
`Numlib/Analysis/InnerProductSpace/GramSchmidt` at matrix level, and it is what identifies the
Householder factorization of `exists_unitary_mul_upperTriangular` with the Gram-Schmidt one of
`exists_qr`.'''
deps = ["exists_qr"]
