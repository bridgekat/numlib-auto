id = "IsQR.isThinQR"
kind = "theorem"
desc = '''The reduced factors of a full QR factorization form a thin one: for `N ≤ M`,
`IsQR A Q R → IsThinQR A (firstColumns Q h) (firstRows R h)` (`IsQR.reduced` repackaged). ★'''
deps = ["Matrix.IsQR.reduced", "Matrix.IsThinQR"]

[[node]]  # staged by ch05
id = "IsQR.span_col_prefix_eq"
kind = "theorem"
desc = '''[golub2013matrix] (5.2.1): if `IsQR A Q R` and the columns of `A : Matrix (Fin M) (Fin N) 𝕜`
are linearly independent, then for every `k ≤ N`
`span 𝕜 {Aᵀ j | (j : ℕ) < k} = span 𝕜 {Qᵀ i | (i : ℕ) < k}` (column sets as `Set (Fin M → 𝕜)`) and
`R ⟨k, _⟩ ⟨k, _⟩ ≠ 0` for `k < N`. Proof: `a_k = Σ_{i ≤ k} r_ik q_i` ((5.2.3)) gives `⊆`; the
dimension count (`linearIndependent` of the prefix, `finrank_span_eq_card`) gives equality and
forces `r_kk ≠ 0`. `IsQR.span_firstColumns_eq` is the case `k = N`. ★★'''
deps = ["Matrix.IsQR", "Matrix.IsQR.span_firstColumns_eq", "Matrix.IsQR.firstRows_diag_ne_zero_of_linearIndependent"]

[[node]]  # staged by ch05 in RankRevealing; moved beside IsQR (Golub–Van Loan review M5)
id = "IsPivotedQR"
kind = "definition"
desc = '''QR factorization with column pivoting: for `A : Matrix (Fin M) (Fin N) 𝕜`, `σ : Equiv.Perm (Fin N)`,
`structure IsPivotedQR A Q R σ : Prop := isQR : IsQR (A.submatrix id σ) Q R` (column `k` of `A Π`
is column `σ k` of `A`; [golub2013matrix] `A Π = Q R`, `A Π = [a_{c₁} | ⋯ | a_{cₙ}]`). A structure
rather than an abbreviation so that the rank-revealing lemmas can be dot-notation on it; its
rank-revealing refinement `IsPivotedQR.IsRankRevealing` is in `RankRevealing`. Beside `IsQR` and
`IsThinQR` (moved with `IsQR` from `LeastSquares` by the refactor tasks R4/R16). ★'''
deps = ["Matrix.IsQR"]
