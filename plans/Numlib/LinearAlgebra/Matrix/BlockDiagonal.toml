# Matrix (Σ c, p c) (Σ b, n b) R`, the `(a, b)` block of `A * B` is `∑ c, A_{ac} B_{cb}`
# (`Matrix.mul_submatrix_sigmaMk_eq_sum`, [golub2013matrix] Theorem 1.3.1); Mathlib has the `2 × 2`
# case `fromBlocks_multiply` and the uniform-block case `Matrix.compRingEquiv` only."
