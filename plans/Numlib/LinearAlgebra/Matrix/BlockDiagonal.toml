[[node]]  # staged by ch01
id = "mul_submatrix_sigmaMk_eq_sum"
kind = "theorem"
desc = '''Block multiplication with blocks of arbitrary sizes: for `[Fintype ι] [∀ c, Fintype (p c)]`,
`A : Matrix (Σ a, m a) (Σ c : ι, p c) R`, `B : Matrix (Σ c : ι, p c) (Σ b, n b) R` over a
`NonUnitalNonAssocSemiring`, `(A * B).submatrix (Sigma.mk a) (Sigma.mk b) = ∑ c, A.submatrix
(Sigma.mk a) (Sigma.mk c) * B.submatrix (Sigma.mk c) (Sigma.mk b)` ([golub2013matrix] Theorem 1.3.1,
"a tedious exercise in subscripting"). `ext i j; simp [mul_apply, Fintype.sum_sigma,
Matrix.sum_apply]`. Searched Mathlib: `Matrix.blockDiagonal'_mul` (diagonal only),
`fromBlocks_multiply` (`2 × 2`), `Matrix.comp`/`compRingEquiv` (uniform square blocks) — no general
statement. ★'''
deps = []
