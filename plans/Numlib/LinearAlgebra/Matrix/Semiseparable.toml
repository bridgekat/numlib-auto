kind = "definition"
desc = '''The `2 × 2` reflection `R(φ) = !![−cos φ, sin φ; sin φ, cos φ]` of [golub2013matrix] §12.2.10, embedded
as `G_k = planeEmbed k (k+1) (planeReflector φ_k)`; `planeReflector_mul_self : R φ * R φ = 1`, symmetric,
`det = −1`. ★'''
deps = ["Matrix.planeEmbed"]

[[node]]
id = "exists_orthogonalHessenberg_eq_prod_planeReflector"
kind = "theorem"
desc = '''[golub2013matrix] (12.2.18): an orthogonal upper Hessenberg `H : Matrix (Fin n) (Fin n) ℝ` with
positive subdiagonal and `det H = 1`, `n` even, is `G₀ ⋯ G_{n−2} · diagonal (1, …, 1, −1)` for some `φ :
Fin (n − 1) → ℝ` with `0 < φ k < π` (reflectors `planeReflector`). Givens QR by reflections (the book's
`G_{n−1} ⋯ G₁ H = diag(1, …, 1, −c_n)`): an orthogonal upper triangular matrix is diagonal with entries
`±1`, the determinant count fixes the last sign, and the positive subdiagonal fixes `sin φ_k > 0`. The
book assumes only a nonzero subdiagonal ("without loss of generality"); positivity is what makes `φ_k ∈
(0, π)` and is reached by a diagonal `±1` similarity. ★★★ (~150 lines)'''
deps = ["Matrix.planeReflector", "Matrix.IsUpperHessenberg", "Matrix.givensChain"]

