deps = ["Matrix.givensChain_apply", "Matrix.exists_orthogonalHessenberg_eq_prod_planeReflector", "Matrix.IsSemiseparable.transpose"]

[[node]]
id = "isSimilar_prod_planeReflector_oddEven"
kind = "theorem"
desc = '''Fact 1 of [golub2013matrix] §12.2.10 (Ammar–Gragg–Reichel): `G₀ G₁ ⋯ G_{n−1}` (with `G_{n−1} =
diagonal(1, …, 1, −1)`) is similar to `H_o H_e`, `H_o = G₀ G₂ ⋯`, `H_e = G₁ G₃ ⋯` (`Matrix.IsSimilar` of
`Numlib/LinearAlgebra/Matrix/Similar`). The factors `G_k`, `G_l` commute for `|k − l| ≥ 2`; any two
orderings of the product of the generators of a path are conjugate (cyclic shift `X Y ∼ Y X` plus
commutations; the Coxeter-element argument, induction on `n`). ★★★ (~120 lines)'''
deps = ["Matrix.planeReflector", "Matrix.IsSimilar"]

[[node]]
id = "eigenvalues_oddEven_half_sum"
kind = "theorem"
desc = '''Fact 2 of [golub2013matrix] §12.2.10: `C = (H_o + H_e)/2` and `S = (H_o − H_e)/2` are symmetric
tridiagonal, and with `θ` from `Matrix.exists_charpoly_eq_prod_of_mem_specialOrthogonalGroup` (`RealSchur`; `H ∈
specialOrthogonalGroup`) the eigenvalues of `C` are `± cos(θ_k/2)`
and those of `S` are `± sin(θ_k/2)` (charpoly form, as in (12.2.19)). Symmetric tridiagonal: block
structure of `H_o`, `H_e` (`planeReflector` symmetric). Spectrum: `H_o`, `H_e` are symmetric involutions,
so `C² = (2 + H̃ + H̃ᵀ)/4` and `S² = (2 − H̃ − H̃ᵀ)/4` with `H̃ = H_o H_e` similar to `H` (Fact 1), giving `cos²(θ/2)`
and `sin²(θ/2)`; `C S = −S C` (from `H_o² = H_e² = 1`) exchanges the `±` eigenspaces of `C`. The book gives no
proof (P12.2.13 asks to check `n = 8`). ★★★ (~150 lines)'''
deps = ["Matrix.isSimilar_prod_planeReflector_oddEven", "Matrix.exists_charpoly_eq_prod_of_mem_specialOrthogonalGroup", "Matrix.IsTridiagonal"]
