[[node]]  # staged by ch07
id = "Matrix.IsQuasiUpperTriangular"
kind = "definition"
desc = '''Upper quasi-triangular ([golub2013matrix] §7.4.1, Definition): for `T : Matrix n n R` with
`[LinearOrder n]`, `∃ p : n → ℕ, Monotone p ∧ (∀ k, #{i | p i = k} ≤ 2) ∧ T.BlockTriangular p` —
exactly the shape of `Matrix.exists_orthogonal_conj_quasiUpperTriangular`, which becomes
`∃ Q ∈ orthogonalGroup, (Qᵀ * A * Q).IsQuasiUpperTriangular`. The shape elaborates
(`notes/gvl/ch07/proto/Shapes.lean`). ★'''
deps = []

[[node]]  # staged by ch07
id = "Matrix.isQuasiUpperTriangular_iff_fin"
kind = "theorem"
desc = '''On `Fin N`: `T.IsQuasiUpperTriangular ↔ T.IsUpperHessenberg ∧ ∀ i : ℕ, (hi : i + 2 < N) →
T ⟨i+1, _⟩ ⟨i, _⟩ = 0 ∨ T ⟨i+2, _⟩ ⟨i+1, _⟩ = 0` — Hessenberg with no two consecutive nonzero
subdiagonal entries. `→`: an entry below the first subdiagonal crosses a block boundary, and two
consecutive subdiagonal nonzeros would put three indices in one fibre. `←`: build `p` by counting
the zero subdiagonal entries before `i` (`p i = #{j < i | T (j+1) j = 0}` shifted so that a nonzero
`T (i+1) i` keeps `i`, `i+1` together). ★★'''
deps = ["Matrix.IsQuasiUpperTriangular"]

[[node]]  # staged by ch07
id = "Matrix.IsUpperTriangular.isQuasiUpperTriangular"
kind = "theorem"
desc = '''An upper triangular matrix is upper quasi-triangular (`p` the order embedding into `ℕ`,
`Fin` or via `Finset.card (Iio i)`; fibres are singletons). ★'''
deps = ["Matrix.IsQuasiUpperTriangular"]

[[node]]  # staged by ch07
id = "Matrix.IsQuasiUpperTriangular.isUpperHessenberg"
kind = "theorem"
desc = '''Upper quasi-triangular implies upper Hessenberg (`Matrix.IsUpperHessenberg`): if some `k`
lies strictly between `j` and `i` then `p j < p i`, since the fibre of `p` containing `j` and `i`
would contain three indices. ★'''
deps = ["Matrix.IsQuasiUpperTriangular"]

[[node]]  # staged by ch07
id = "Matrix.IsQuasiUpperTriangular.mul_isUpperTriangular"
kind = "theorem"
desc = '''Products with triangular factors keep the shape, with the same block index `p`: if
`T.BlockTriangular p` with `p` monotone and `R` is upper triangular then `T * R` and `R * T` are
`BlockTriangular p` (for `p j < p i`, a nonzero term `T i k R k j` needs `p i ≤ p k` and `k ≤ j`, so
`p k ≤ p j`); hence `IsQuasiUpperTriangular` is closed under multiplication by upper triangular
matrices on either side. Used for the generalized real Schur form of a nonsingular pencil and the
periodic Schur form. ★'''
deps = ["Matrix.IsQuasiUpperTriangular"]

[[node]]  # staged by ch07
id = "Matrix.exists_orthogonal_conj_isQuasiUpperTriangular"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 7.4.1 in the named form: for `A : Matrix (Fin N) (Fin N) ℝ` there is
`Q ∈ orthogonalGroup (Fin N) ℝ` with `(Qᵀ * A * Q).IsQuasiUpperTriangular` (the shape only; the
refinement that no `2 × 2` diagonal block has a real eigenvalue stays with the block index in
`Matrix.exists_orthogonal_conj_quasiUpperTriangular_of_irreducible_blocks`). ★'''
deps = ["Matrix.IsQuasiUpperTriangular", "Matrix.exists_orthogonal_conj_quasiUpperTriangular_of_irreducible_blocks"]

[[node]]
id = "Matrix.exists_charpoly_eq_prod_of_mem_specialOrthogonalGroup"
kind = "theorem"
desc = '''The spectrum of a special orthogonal matrix of even size ([golub2013matrix] (12.2.19), which states it for an
orthogonal upper Hessenberg `H`; the Hessenberg structure plays no role): for `H ∈ Matrix.specialOrthogonalGroup
(Fin (2 * m)) ℝ` (Mathlib; orthogonal with `det H = 1`), `∃ θ : Fin m → ℝ, (H.map (algebraMap ℝ ℂ)).charpoly = ∏ k,
(X − C (exp (θ k * I))) * (X − C (exp (−θ k * I)))` — its eigenvalues are `m` conjugate pairs on the unit circle,
the real eigenvalues `±1` included in pairs. Route: by `Matrix.exists_orthogonal_conj_quasiUpperTriangular` the
matrix is orthogonally similar to a quasi-upper-triangular `T`, which is orthogonal, hence normal, hence block
diagonal (a normal block upper triangular matrix has zero off-diagonal blocks, Frobenius-norm count); each `2 × 2`
block is a rotation by some `θ` (`e^{±iθ}`), each `1 × 1` block is `±1`, and `det H = 1` makes the number of
`−1` blocks even, so the `±1` blocks pair up as `θ = 0`, `θ = π`. (Alternatively: roots of modulus one,
conjugation pairing of the real charpoly, and the parity count on `−1` and `1`.) Replaces the Hessenberg-only
`Matrix.charpoly_orthogonalHessenberg_eq_prod` of `Semiseparable` (review of the Golub–Van Loan round). ★★★ (~180
lines)'''
deps = ["Matrix.exists_orthogonal_conj_quasiUpperTriangular"]
