[[node]]
id = "exists_kroneckerSVD"
kind = "theorem"
desc = '''**The Kronecker product SVD** ([golub2013matrix] Theorem 12.3.1), existence form for `A : Matrix (Fin
m₁ × Fin m₂) (Fin n₁ × Fin n₂) 𝕜`: with `r = (kroneckerRearrange A).rank` there are `U : Fin r → Matrix (Fin
m₁) (Fin n₁) 𝕜`, `V : Fin r → Matrix (Fin m₂) (Fin n₂) 𝕜`, Frobenius-orthonormal families (`Orthonormal`
of their `vec`s in `EuclideanSpace`), and `σ k = sortedSingularValues (kroneckerRearrange A) k > 0` with
`A = ∑ k, (σ k : 𝕜) • (U k ⊗ₖ V k)`. The singular system of `𝓡(A)` (`Matrix.exists_singularSystem`, sorted
by `exists_equiv_singularValues_eq_sortedSingularValues`, chapter 2) pulled back by `eq_sum_kronecker_iff`. ★★ (~60
lines, the reindexing between the column-indexed and the sorted singular values)

Blocked: needs `Matrix.sortedSingularValues` and
`Matrix.exists_equiv_singularValues_eq_sortedSingularValues` (ls1, `SVD`, not on this branch's
base); the pull-back `eq_sum_kronecker_iff` and `Matrix.exists_singularSystem` are available.'''
deps = ["Matrix.eq_sum_kronecker_iff", "Matrix.exists_singularSystem", "Matrix.sortedSingularValues", "exists_equiv_singularValues_eq_sortedSingularValues"]

