[[node]]
id = "kroneckerRank_le_iff"
kind = "theorem"
desc = '''`kroneckerRank A ≤ r ↔ ∃ (B : Fin r → Matrix m₁ n₁ K) (C : Fin r → Matrix m₂ n₂ K), A = ∑ k, B k ⊗ₖ C k`:
the rank factorization `Matrix.rank_le_iff_exists_mul` of `𝓡(A)` (a product of `n × r` and `r × m`
matrices is a sum of `r` `vecMulVec`s, `Matrix.mul_eq_sum_vecMulVec`-type) and `eq_sum_kronecker_iff`. ★

Blocked: needs the rank factorization `Matrix.rank_le_iff_exists_mul` (cond1, `Rank`, not on this
branch's base); with it, `eq_sum_kronecker_iff` (proved) gives the statement in ~15 lines.'''
deps = ["Matrix.kroneckerRank", "Matrix.rank_le_iff_exists_mul", "Matrix.eq_sum_kronecker_iff"]

[[node]]
id = "isLeast_frobenius_norm_sub_sum_kronecker"
kind = "theorem"
desc = '''**The nearest sum of `r̃` Kronecker products** ([golub2013matrix] (12.3.14)–(12.3.15) for `r̃ = 1`, the
NKP problem, and (12.3.19)): `IsLeast ((fun X => ‖A − X‖) '' {X | kroneckerRank X ≤ r̃}) √(∑ i ∈ Finset.Ico r̃
(min (n₁ m₁) (n₂ m₂)), sortedSingularValues (kroneckerRearrange A) i ^ 2)` (Frobenius, `𝕜`), attained at the
truncated Kronecker SVD `∑_{k < r̃} σ_k U_k ⊗ V_k` (for `r̃ = 1`: `vec B_opt = √σ₀ u₀`, `vec C_opt = √σ₀
v₀`, and `α B_opt`, `C_opt / α` equally optimal). Chapter 2's Eckart–Young–Mirsky
`Matrix.isLeast_frobenius_norm_sub_of_rank_le` for `𝓡(A)`, transported by the isometry
`frobenius_norm_kroneckerRearrange` and `kroneckerRank_le_iff`. ★★ (~60 lines)

Blocked: needs Eckart–Young–Mirsky `Matrix.isLeast_frobenius_norm_sub_of_rank_le` (ls1) and
`kroneckerRank_le_iff` (blocked on cond1's rank factorization); the isometry
`frobenius_norm_kroneckerRearrange` is proved.'''
deps = ["Matrix.isLeast_frobenius_norm_sub_of_rank_le", "Matrix.frobenius_norm_kroneckerRearrange", "Matrix.kroneckerRank_le_iff", "Matrix.exists_kroneckerSVD", "Matrix.svdTruncation"]

