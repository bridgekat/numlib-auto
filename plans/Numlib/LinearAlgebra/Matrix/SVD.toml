[[node]]
id = "exists_discrepancy_tikhonov"
kind = "theorem"
desc = '''Kress Thm 5.10, the discrepancy principle for Tikhonov regularization: for `y ∈ range A` and
`‖yδ - y‖ ≤ δ < ‖yδ‖`, there is a unique `α(δ) > 0` with `‖A (tikhonov A (α δ) yδ) - yδ‖ = δ`, and
`tikhonov A (α δ) yδ → A† y` as `δ → 0`; with Thm 5.6, the same principle for the spectral cut-off
`∑_{j<p} μ_j⁻¹ ⟪yδ, v_j⟫ u_j` (`exists_discrepancy_cutoff`).

Not attempted. The Tikhonov machinery this file has is enough for the *algebra*, but the
discrepancy equation is an analytic statement about the residual as a function of α: one needs the
expansion of `A (tikhonov A α) y` in the **left** singular vectors, which this file does not build
(only `rightSingularBasis` is a definition; the left vectors appear existentially in
`exists_singularSystem`), and from it the continuity and strict monotonicity of
`α ↦ ‖A (tikhonov A α yδ) - yδ‖`, its limit `dist(yδ, range A)` at `0` and `‖yδ‖` at `∞`, an
intermediate value argument, and then a separate compactness argument for the `δ → 0` convergence.
A first step would be a `Matrix.leftSingularVector` definition beside `rightSingularBasis`.'''
deps = ["tikhonov", "pinv"]
source = "Kress, Numerical Analysis, Theorems 5.6 and 5.10"
