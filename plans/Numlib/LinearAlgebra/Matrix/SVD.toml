# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.SVD` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch02) Add a paragraph "Sorted and column-indexed singular values, orthonormal completion, thin SVD,
# truncation": `Matrix.sortedSingularValues A i` (an `abbrev` for Mathlib's sorted
# `(toEuclideanLin A).singularValues i`) and its bridge to the column-indexed `Matrix.singularValues`
# (`exists_equiv_singularValues_eq_sortedSingularValues`), `σ₀ = ‖A‖₂`, `σ_k = 0 ↔ rank ≤ k`, the
# orthonormal completion of a matrix with orthonormal columns ([golub2013matrix] Theorem 2.1.1), the thin
# SVD and the rank-`k` truncation `Matrix.svdTruncation` ([golub2013matrix] §2.4). The Eckart–Young
# theorems themselves (both halves, both norms) are corollaries of Weyl's and Mirsky's inequalities and
# live in `Numlib/Analysis/Matrix/SingularValues` (Golub–Van Loan review, H3–H4).
# (ch05) Add "The pseudoinverse as a projector": `A A⁺` and `A⁺ A` are the orthogonal projections onto
# `ran A` and `ran Aᴴ` (`mul_pinv_eq_starProjection`). The pseudoinverse norms of [golub2013matrix]
# (5.3.9) and the rectangular condition number `Matrix.pinvCondNumberLp` use `Numlib/Analysis/Matrix/OperatorNorm`,
# which imports this module, so they are planned in `Numlib/Analysis/Matrix/SingularValues`; the
# minimal-Frobenius property (5.5.3) and the orthonormal-column projector `V Vᴴ` are in
# `LeastSquares`, the SVD expansion of the minimal residual in `LeastSquares/Regularized` (all three
# use modules that import this one).
# (ch06) add to "Main definitions": "`Matrix.IsSVD A U σ V`: a factorization `Uᴴ A V = rectDiagonal
# σ` with unitary factors and `σ` antitone and nonnegative — the specification of a computed SVD;
# `Matrix.shiftedRectDiagonal k σ`: `σ j` at `(j − k, j)`, the sine block of a CS decomposition with
# fewer rows than columns and the `D_B` of the GSVD." The operator SVD
# (`LinearMap.exists_orthonormal_singularVectors`) and the invariance of `LinearMap.singularValues`
# under isometries and adjoints, staged here by ch06, moved to `Numlib/Analysis/InnerProductSpace/SingularValues`
# (review H3); the refactor task "singular-value operator lemmas out of `SVD`" (consolidation R14, done)
# moved this module's coordinate-free lemmas (`LinearMap.IsSymmetric.eigenvalues_eq_of_antitone`,
# `LinearMap.inner_apply_eigenvectorBasis_adjoint_comp_self`,
# `LinearMap.norm_apply_eigenvectorBasis_adjoint_comp_self`,
# `LinearMap.singularValues_of_finrank_codomain_le`) there, and this module imports it.
# (ch08) (8.1.3) (`l2_opNorm_mul_inv_sqrt_one_add_gram_le`) moved to `Numlib/Analysis/Matrix/SingularValues`
# (it uses `OperatorNorm`) and the nearest orthonormal block (8.1.7) to `Numlib/LinearAlgebra/Matrix/Polar`
# (it is the polar factor, review H4).
# (ch12) Add to "Main results": the variational characterization of singular values
# `Matrix.abs_critical_bilinearRayleigh_mem_singularValues` ([golub2013matrix] (12.5.22)). (Ky
# Fan's SVD maximum principle, staged here by ch12, and the singular-value inequalities staged by ch06
# and ch07 are in `Numlib/Analysis/Matrix/SingularValues`.)
# (consolidation, review M2) State the two readings once in the module doc: the sorted reading is
# spelled `A.sortedSingularValues i` in statements and names (`sortedSingularValues_…`) whenever an
# index matters (`σ_k`, interlacing, Eckart–Young); the column-indexed `Matrix.singularValues` is
# used, and each such node says so, for `σ_min = ⨅ i` / `σ_max = ⨆ i` (the least and greatest stretch,
# for every shape) and for order-free statements about the family. Renaming the column-indexed one
# (e.g. `Matrix.colSingularValues`) is a recorded refactor task.
