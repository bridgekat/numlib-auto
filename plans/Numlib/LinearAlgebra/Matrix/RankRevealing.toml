[[node]]
id = "norm_residual_subset_sub_le"
kind = "theorem"
desc = '''**[golub2013matrix] Theorem 5.5.3.** In the setting of `Matrix.IsSVD.sortedSingularValues_le_mul_submatrix`
(`IsSVD A U σ V`, column permutation `π`, `B₁` the first `r̃` columns of `A Π`, `Ṽ₁₁` invertible),
with `U₁` the first `r̃` columns of `U`, `r_{x_r̃} = (I - U₁U₁ᴴ) b` and `r_y = b - B₁ B₁⁺ b`:
`‖r_{x_r̃} - r_y‖₂ ≤ (σ_{r̃}(A) / σ_{r̃-1}(A)) ‖Ṽ₁₁⁻¹‖₂ ‖b‖₂` (0-based sorted singular values; the book's
`σ_{r̃+1}/σ_{r̃}`). Proof: both are `(I - P) b` for the orthogonal projections onto `ran U₁` and
`ran B₁`, so the difference is at most `‖U₁U₁ᴴ - Q₁Q₁ᴴ‖₂ ‖b‖ = ‖U₂ᴴ Q₁‖₂ ‖b‖`
(`Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul`, Theorem 2.5.1; the book cites "Theorem 2.6.1"), and
`‖U₂ᴴ Q₁‖ ≤ ‖U₂ᴴ B₁‖ ‖(B₁ᴴB₁)^{-1/2}‖ ≤ σ_{r̃}(A) / σ_{r̃-1}(B₁)` with the lower bound of Theorem 5.5.2.
(The book's hypothesis "leading `r`-by-`r`" means `r̃`.) ★★★ (~120 lines)

Blocked: needs `Matrix.IsSVD.sortedSingularValues_le_mul_submatrix` and `Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul` of `Numlib/Analysis/Matrix/SingularValues` (agent sv2, in progress in parallel; that module does not exist at the base commit of this round, so it cannot be imported here). Once it lands the proof is as sketched above (~150 lines).'''
deps = [
  "Matrix.IsSVD.sortedSingularValues_le_mul_submatrix",
  "Matrix.mul_pinv_eq_starProjection",
  "Matrix.gap_range_eq_l2_opNorm_conjTranspose_mul",
]
