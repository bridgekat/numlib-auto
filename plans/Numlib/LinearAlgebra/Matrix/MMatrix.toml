[[node]]  # staged by ch11
id = "Matrix.IsMMatrix.posDef_of_isSymm"
kind = "theorem"
desc = '''
A symmetric M-matrix is positive definite: `A.IsMMatrix → A.IsSymm → A.PosDef`. Proof: by
`Matrix.isMMatrix_iff_exists_pos_mulVec_pos` pick `w > 0` with `A w > 0`; `W = diagonal w`; then
`W A W` is symmetric with nonpositive off-diagonal entries and positive row sums `w_i (A w)_i`, so
strictly diagonally dominant with positive diagonal, hence positive definite
(`Matrix.IsStrictDiagDominant.posDef`); and `A = W⁻¹ (W A W) W⁻¹` is congruent to it. The converse
of `Matrix.IsMMatrix.of_posDef_of_offDiag_nonpos` on symmetric matrices. ★★ (~40 lines)
'''
deps = ["Matrix.IsMMatrix", "Matrix.isMMatrix_iff_exists_pos_mulVec_pos", "Matrix.IsStrictDiagDominant.posDef"]

[[node]]  # staged by ch11
id = "Matrix.isStieltjes_iff_isMMatrix_isSymm"
kind = "theorem"
desc = '''
`A.IsStieltjes ↔ A.IsMMatrix ∧ A.IsSymm`. `Matrix.IsStieltjes.isMMatrix` and
`Matrix.IsMMatrix.posDef_of_isSymm`. ★
'''
deps = ["Matrix.IsStieltjes.isMMatrix", "Matrix.IsMMatrix.posDef_of_isSymm"]

[[node]]  # staged by ch11
id = "Matrix.IsStieltjes.of_entrywiseLE"
kind = "theorem"
desc = '''
If `A` is Stieltjes, `B` is symmetric with nonpositive off-diagonal entries and `A ≤ B` entrywise
(`Matrix.EntrywiseLE A B`), then `B` is Stieltjes. `Matrix.IsMMatrix.of_entrywiseLE` and
`Matrix.IsMMatrix.posDef_of_isSymm`. In particular zeroing any symmetric set of off-diagonal entries
of a Stieltjes matrix leaves a Stieltjes matrix (the dropping step of incomplete Cholesky). ★
'''
deps = ["Matrix.IsStieltjes", "Matrix.IsMMatrix.of_entrywiseLE", "Matrix.IsMMatrix.posDef_of_isSymm",
  "Matrix.EntrywiseLE"]

[[node]]  # staged by ch11
id = "Matrix.IsStieltjes.submatrix"
kind = "theorem"
desc = '''
Principal submatrices of a Stieltjes matrix are Stieltjes: for an injective `e : m → n`,
`(A.submatrix e e).IsStieltjes`. `Matrix.PosDef.submatrix` (Mathlib) and the entrywise sign. ★
'''
deps = ["Matrix.IsStieltjes"]

