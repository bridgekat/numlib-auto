# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.HermitianPart` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch04) add — "A real matrix is *positive definite* in the unsymmetric sense of Golub–Van Loan §4.2
# (`xᵀ A x > 0` for `x ≠ 0`) exactly when its Hermitian part is positive definite
# (`Matrix.posDef_hermitianPart_iff_forall_dotProduct_mulVec_pos`); congruence commutes with taking
# the Hermitian part (`Matrix.hermitianPart_conjTranspose_mul_mul`), and `‖T‖₂ ≤ ‖A‖₂`."
