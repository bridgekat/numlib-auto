[[node]]  # staged by ch04
id = "PosSemidef.schurComplementSingle"
kind = "theorem"
desc = '''One step of the outer-product `L D Lᴴ` on a positive semidefinite matrix ([golub2013matrix] (4.2.16)): if `A` is
positive semidefinite and `A p p ≠ 0`, then `schurComplementSingle A p` is positive semidefinite and
its diagonal is dominated by that of `A`: `re ((schurComplementSingle A p) i i) ≤ re (A i i)` (the
book's `Ã = B − v vᵀ/α` with `v vᵀ/α` positive semidefinite). The semidefinite analogue of
`Matrix.PosDef.schurComplement` (Mathlib's `Matrix.PosSemidef.fromBlocks₁₁`). With `A p p = 0`,
(4.2.15) makes the step trivial. ★★'''
deps = ["Matrix.schurComplementSingle", "Matrix.PosSemidef.apply_eq_zero_of_diag_eq_zero"]

[[node]]  # staged by ch04
id = "PosSemidef.exists_perm_ldl_rank"
kind = "theorem"
desc = '''[golub2013matrix] (4.2.17), the rank-revealing pivoted factorization: a positive semidefinite
`A : Matrix (Fin n) (Fin n) 𝕜` of rank `r` has a permutation `σ`, a unit lower triangular `L` and a
diagonal `D` with `A.submatrix σ σ = L * D * Lᴴ`, `D i i > 0` for `i < r` (real positive),
`D i i = 0` for `i ≥ r`, and the pivots nonincreasing (`i ≤ j → re (D j j) ≤ re (D i i)`) —
equivalently `A.submatrix σ σ = ∑_{j < r} d_j ℓ_j ℓ_jᴴ` with `ℓ_j` the columns of `L`, and the
first `r` columns carry the factorization (`[L₁₁; L₂₁] D_r [L₁₁; L₂₁]ᴴ`). Proof: strong induction on
`n` with the maximal-diagonal pivot, `Matrix.PosSemidef.schurComplementSingle`, and (4.2.15) once
the maximal diagonal is `0` (then the remaining block vanishes); the count of positive pivots is
the rank because `A.submatrix σ σ` is congruent to `D` (`Matrix.rank_mul_eq_right_of_isUnit`-type
lemmas, `Matrix.rank_diagonal`). ★★★ (~250 lines)'''
deps = ["Matrix.PosSemidef.schurComplementSingle", "Matrix.PosSemidef.apply_eq_zero_of_diag_eq_zero", "Matrix.IsUnitLowerTriangular"]

[[node]]  # staged by ch04
id = "cholesky_hasLowerBandwidth"
kind = "theorem"
desc = '''[golub2013matrix] §4.3.5, "if `A = G Gᵀ` is the Cholesky factorization of `A`, then `G` has the same lower
bandwidth as `A`": for positive definite `A` with `A.HasLowerBandwidth p`, `(cholesky A).HasLowerBandwidth
p`. `cholesky A = Hᴴ` and `IsCholesky.isLU` gives `A = (Hᴴ D⁻¹)(D H)`; the lower factor has lower
bandwidth `p` by `Matrix.IsLU.hasLowerBandwidth` (leading submatrices of a positive definite
matrix are nonsingular, `Matrix.PosDef.isUnit_strictLeadingPrincipalSubmatrix`), and right
multiplication by a diagonal keeps it. ★'''
deps = ["Matrix.cholesky", "Matrix.IsCholesky.isLU", "Matrix.IsLU.hasLowerBandwidth", "Matrix.PosDef.isUnit_strictLeadingPrincipalSubmatrix", "Matrix.isCholesky_cholesky"]

