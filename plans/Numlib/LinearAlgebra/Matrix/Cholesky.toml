[[node]]  # staged by ch04
id = "existsUnique_isLDM_conjTranspose_of_isHermitian"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 4.1.3 at its stated generality: a Hermitian `A : Matrix n n 𝕜` (`[RCLike 𝕜]`,
`[Fintype n] [LinearOrder n]`) whose *strict* leading principal submatrices are nonsingular
(`∀ k, IsUnit (A.strictLeadingPrincipalSubmatrix k)`) has exactly one `L D Lᴴ` factorization:
`∃! LD : Matrix n n 𝕜 × Matrix n n 𝕜, IsLDM A LD.1 LD.2 LD.1ᴴᵀ` (the last pivot may vanish when `A`
is singular). The existing `Matrix.existsUnique_isLDM` asks for *all* leading submatrices,
including `A` itself. Proof: `Matrix.existsUnique_isLU_iff` gives the unique `A = L U`; the pivots
`u_kk`, `k` not maximal, are nonzero (`Matrix.IsLU.diag_upper_ne_zero_of_lt`), so
`D := diag U` and `M := (D⁻¹ U)ᵀ` on the rows with `u_kk ≠ 0` (the last row of `U` is `u_nn e_n`)
give `IsLDM A L D M`; the conjugate transpose is a second LU factorization of `A = Aᴴ`, so
`M = Lᴴᵀ` by uniqueness, as in `Matrix.IsLDM.eq_of_isHermitian`. Uniqueness: `(L, D Lᴴ)` is an LU
factorization. ★★ (~80 lines)'''
deps = ["Matrix.existsUnique_isLU_iff", "Matrix.IsLU.diag_upper_ne_zero_of_lt", "Matrix.IsLDM.eq_of_isHermitian", "Matrix.IsLDM"]

[[node]]  # staged by ch04
id = "exists_isLU_of_posDef_hermitianPart"
kind = "theorem"
desc = '''[golub2013matrix] Corollary 4.2.4: if the Hermitian part of `A : Matrix n n 𝕜` is positive definite
(`(Matrix.hermitianPart A).PosDef`, the book's "`A` positive definite" for unsymmetric `A`), then
`A` has an LU factorization and the pivots have positive real part: `∃ L U, IsLU A L U ∧ ∀ i,
0 < RCLike.re (U i i)` (over `ℝ`: `0 < U i i`). The leading principal submatrices have positive
definite Hermitian parts (`Matrix.hermitianPart_conjTranspose_mul_mul` with the coordinate
embedding), hence are nonsingular (`Matrix.isUnit_of_posDef_add_transpose`, its `RCLike` form);
`Matrix.exists_isLU_of_forall_isUnit_strictLeadingPrincipalSubmatrix`. For the pivots, the book's
`B = L⁻¹ A L⁻ᴴ = U L⁻ᴴ` has positive definite Hermitian part and diagonal `u_ii` (`L⁻ᴴ` unit upper
triangular). ★★'''
deps = ["Matrix.hermitianPart_conjTranspose_mul_mul", "Matrix.exists_isLU_of_forall_isUnit_strictLeadingPrincipalSubmatrix", "Matrix.isUnit_of_posDef_add_transpose", "Matrix.hermitianPart"]

[[node]]  # staged by ch04
id = "posDef_hermitianPart_schurComplementSingle"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 4.2.5: if `(hermitianPart A).PosDef` and `p` is the first index, then the Schur
complement of one elimination step, `schurComplementSingle A p` (the book's `B₁ + C₁` of (4.2.1)),
has positive definite Hermitian part. More precisely (the book's (4.2.2)–(4.2.3)): writing
`A = [α, vᵀ − wᵀ; v + w, B + C]` with `B` Hermitian and `C` skew, `hermitianPart (schurComplementSingle A
p) = B − (v vᴴ − w wᴴ)/α` and its skew part is `C − (w vᴴ − v wᴴ)/α`; the Hermitian part dominates the
Schur complement of the Hermitian part, `B − v vᴴ/α` (positive definite by
`Matrix.PosDef.schurComplement`), by the positive semidefinite `w wᴴ/α`. State over `RCLike` with
`α = A p p` (real part positive). ★★ (~80 lines)'''
deps = ["Matrix.schurComplementSingle", "Matrix.PosDef.schurComplement", "Matrix.hermitianPart"]

[[node]]  # staged by ch04
id = "IsLU.frobenius_norm_abs_mul_abs_le"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 4.2.6 (Golub–Van Loan 1979): for real `A : Matrix (Fin n) (Fin n) ℝ` with
`T := hermitianPart A` positive definite and `S := A − T`, if `IsLU A L U` then
`‖|L| * |U|‖_F ≤ n * (‖T‖₂ + ‖S * T⁻¹ * S‖₂)` (Frobenius norm of the entrywise absolute values;
`Matrix.Norms.Frobenius`, `Matrix.Norms.L2Operator`). The book gives no proof ("See Golub and Van
Loan (1979)"). Route to reconstruct: the outer-product form `|L||U| = ∑_k |ℓ_k| |u_kᵀ|`
bounds the Frobenius norm by `∑_k ‖ℓ_k‖₂ ‖u_k‖₂` (`n` terms); at step `k` the book's Theorem 4.2.5
gives `ℓ_k = (v + w)/α`, `u_k = (α, v − w)`, and the claim to prove is
`‖v + w‖ ‖(α, v − w)‖/α ≤ ‖T_k‖₂ + ‖S_k T_k⁻¹ S_k‖₂ ≤ ‖T‖₂ + ‖S T⁻¹ S‖₂` along the Schur complements
(`T_k` the Hermitian part of the `k`-th Schur complement dominates the Schur complement of `T`,
`posDef_hermitianPart_schurComplementSingle`; the identity `A T⁻¹ Aᵀ = T + S T⁻¹ Sᵀ` is a useful
handle). Estimate ★★★ (~400 lines); if the per-step inequality fails, record the counterexample
and mark the node `wrong` with the bound that was proved.'''
deps = ["Matrix.posDef_hermitianPart_schurComplementSingle", "Matrix.IsLU"]

