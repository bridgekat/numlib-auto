[[node]]  # staged by ch04
id = "cholesky_finSumFin"
kind = "theorem"
desc = '''[golub2013matrix] (4.2.18), the block form of the Cholesky factor (the specification of the block
algorithms 4.2.3–4.2.4): for positive definite `A : Matrix (Fin (r + s)) (Fin (r + s)) 𝕜`, with
`A' := A.submatrix finSumFinEquiv finSumFinEquiv = fromBlocks A₁₁ A₁₂ A₂₁ A₂₂`,
`(cholesky A).submatrix finSumFinEquiv finSumFinEquiv = fromBlocks (cholesky A₁₁) 0 G₂₁ (cholesky
(A₂₂ − A₂₁ A₁₁⁻¹ A₁₂))` with `G₂₁ = A₂₁ (cholesky A₁₁)⁻ᴴ` (the book's `G₂₁ G₁₁ᵀ = A₂₁`), the
Schur complement being `Matrix.schurComplement A'` (positive definite, `Matrix.PosDef.schurComplement`).
By uniqueness (`Matrix.cholesky_eq_of_isCholesky`): the right side is lower triangular with
positive diagonal under the order embedding `finSumFinEquiv` (`Fin.castAdd` below `Fin.natAdd`) and
its product with its conjugate transpose is `A'` by `Matrix.fromBlocks_multiply`. ★★ (~100 lines)'''
deps = ["Matrix.cholesky_eq_of_isCholesky", "Matrix.PosDef.schurComplement", "Matrix.schurComplement", "Matrix.isCholesky_cholesky"]
