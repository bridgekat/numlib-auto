[[node]]
id = "IsLU.frobenius_norm_abs_mul_abs_le"
kind = "theorem"
desc = '''[golub2013matrix] Theorem 4.2.6 (Golub–Van Loan 1979): for real `A : Matrix (Fin n) (Fin n) ℝ` with
`T := hermitianPart A` positive definite and `S := A − T`, if `IsLU A L U` then
`‖|L| * |U|‖_F ≤ n * (‖T‖₂ + ‖S * T⁻¹ * S‖₂)` (Frobenius norm of the entrywise absolute values;
`Matrix.Norms.Frobenius`, `Matrix.Norms.L2Operator`). The book gives no proof ("See Golub and Van
Loan (1979)"). Route to reconstruct: the outer-product form `|L||U| = ∑_k |ℓ_k| |u_kᵀ|`
bounds the Frobenius norm by `∑_k ‖ℓ_k‖₂ ‖u_k‖₂` (`n` terms); at step `k` the book's Theorem 4.2.5
gives `ℓ_k = (v + w)/α`, `u_k = (α, v − w)`, and the claim to prove is
`‖v + w‖ ‖(α, v − w)‖/α ≤ ‖T_k‖₂ + ‖S_k T_k⁻¹ S_k‖₂ ≤ ‖T‖₂ + ‖S T⁻¹ S‖₂` along the Schur complements
(`T_k` the Hermitian part of the `k`-th Schur complement dominates the Schur complement of `T`,
`posDef_hermitianPart_schurComplementSingle`; the identity `A T⁻¹ Aᵀ = T + S T⁻¹ Sᵀ` is a useful
handle). Estimate ★★★ (~400 lines); if the per-step inequality fails, record the counterexample
and mark the node `wrong` with the bound that was proved.

Blocked (agent fac1, GVL wave 2): not attempted in Lean beyond analysis; the per-step inequality is
where the route above breaks. What does work: at the first step, with `ℓ = A e₁/α`, `u = Aᵀ e₁`,
`‖A e₁‖ ‖Aᵀ e₁‖ ≤ (‖A e₁‖² + ‖Aᵀ e₁‖²)/2 = ‖T e₁‖² + ‖S e₁‖²` (the cross terms cancel because
`Sᵀ = -S`), and `‖T e₁‖² ≤ ‖T‖ α`, `‖S e₁‖² ≤ ‖S T⁻¹ Sᵀ‖ α`, so `‖ℓ‖ ‖u‖ ≤ ‖T‖ + ‖S T⁻¹ S‖`.
The recursion is the gap: the Hermitian part of the Schur complement is `B − (v vᵀ − w wᵀ)/α`,
which can have larger norm than `T` (`T = I₂`, `S = [0 -w; w 0]` gives `T₁ = 1 + w²`), so
`‖T_k‖ ≤ ‖T‖` fails and the monotonicity of the sum `‖T_k‖ + ‖S_k T_k⁻¹ S_k‖` was not settled.
The property that *is* inherited is
`P(c) : ∀ x, ‖A x‖² ≤ c xᵀ A x ∧ ‖Aᵀ x‖² ≤ c xᵀ A x` (extend `z` by the pivot row, resp. column,
as in `Matrix.exists_star_dotProduct_schurComplementSingle_mulVec` and its transpose), and `A`
satisfies it with `c = (√‖T‖ + √‖S T⁻¹ S‖)² ≤ 2 (‖T‖ + ‖S T⁻¹ S‖)`, which would give the bound with
`2 n` in place of `n`
(~250 lines on top of the Schur-recursion form of the LU factors). The sharp constant needs the
original paper (Golub–Van Loan, "Unsymmetric positive definite linear systems", 1979), which is not
among the references. Estimate: ★★★, 1–2 days for `2 n`; unknown for `n`.'''
deps = ["Matrix.posDef_hermitianPart_schurComplementSingle", "Matrix.IsLU"]

