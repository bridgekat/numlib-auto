[[node]]
id = "posDef_complexify_iff"
kind = "theorem"
desc = '''`(complexify A).PosDef ↔ A.PosDef` for a real matrix. This is the private
`posDef_complexify_iff` of `Numlib/Stationary/SPD.lean` (line 389), to be made public here
where every consumer can reach it: the complex quadratic form of a real symmetric matrix at
`x + i y` is the sum of the real forms at `x` and `y`. ★'''
deps = ["Matrix.complexify", "Matrix.isHermitian_complexify_iff"]

[[node]]
id = "IsTridiagonal.complexify"
kind = "theorem"
desc = '''`A.IsTridiagonal → (complexify A).IsTridiagonal`, for `Matrix.IsTridiagonal` of
`Numlib/LinearAlgebra/Matrix/Hessenberg`; entrywise, since complexification preserves zeros. Needed to
read the Gauss–Seidel/Jacobi relation `ρ(B_GS) = ρ(B_J)²` for a real tridiagonal matrix off
`Matrix.IsTridiagonal.isConsistentlyOrdered`, which is stated over `ℂ`. ★'''
deps = ["Matrix.complexify", "Matrix.IsTridiagonal"]

[[node]]
id = "spectrum_complexify_affine"
kind = "theorem"
desc = '''Spectral mapping for affine images of a real matrix: for `c d : ℝ` with `d ≠ 0`,
`spectrum ℂ (complexify (c • 1 + d • X)) = (fun μ : ℂ => c + d * μ) '' spectrum ℂ (complexify X)`.
Private today as `mem_spectrum_complexify_affine_iff` in `Numlib/Stationary/SPD.lean`
(line 308); it is what every relaxation argument uses — JOR `(1 - ω) 1 + ω B_J`, Richardson
`1 - α M` — and belongs here. From Mathlib's `spectrum.add_mem_iff`/`spectrum.smul_eq_smul` or
directly from `mem_spectrum_complexify_iff`. ★'''
deps = ["Matrix.complexify", "Matrix.mem_spectrum_complexify_iff"]

[[node]]
id = "complexSpectralRadius_affine_le"
kind = "theorem"
desc = '''The relaxation estimate behind Quarteroni–Sacco–Saleri Theorem 4.6: for `0 < ω ≤ 1`,
`complexSpectralRadius ((1 - ω) • 1 + ω • X) ≤ ENNReal.ofReal (1 - ω) + ω * complexSpectralRadius X`
(with `ENNReal` scalar multiplication read through `ofReal`). Each eigenvalue `(1 - ω) + ω μ` of the
relaxed matrix has modulus `≤ (1 - ω) + ω |μ|` by the triangle inequality, so the supremum obeys the
same bound; `spectrum_complexify_affine` supplies the eigenvalues. Consequently
`complexSpectralRadius X < 1 → complexSpectralRadius ((1 - ω) • 1 + ω • X) < 1`. ★'''
deps = ["Matrix.complexSpectralRadius", "Matrix.spectrum_complexify_affine"]

[[node]]
id = "tendsto_averageConvergenceRate"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri (4.5) for a real matrix, in the `ℓ²` operator norm
(`open scoped Matrix.Norms.L2Operator`): if `complexSpectralRadius G ≠ 0` then
`-(1 / m : ℝ) * Real.log ‖G ^ m‖ → -Real.log (complexSpectralRadius G).toReal`. It is
`tendsto_pow_rpow_complexSpectralRadius` composed with `Real.log`, as `Stationary.tendsto_averageConvergenceRate`
does it at the operator level; the same statement holds in the maximum-row-sum norm through
`tendsto_pow_rpow_linfty_opNorm`. ★'''
deps = ["Matrix.tendsto_pow_rpow_complexSpectralRadius", "Matrix.complexSpectralRadius"]
