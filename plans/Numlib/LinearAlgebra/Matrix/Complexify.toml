[[node]]
id = "star_mem_spectrum_complexify_iff"
kind = "theorem"
desc = '''For `A : Matrix n n ℝ` and `μ : ℂ`, `star μ ∈ spectrum ℂ (complexify A) ↔ μ ∈ spectrum ℂ (complexify A)`: the complex eigenvalues of a real matrix come in conjugate pairs (Quarteroni–Sacco–Saleri §1.7, "since `p_A` has real coefficients"). Proof: `charpoly_complexify` says the characteristic polynomial is the image of a real polynomial, whose roots are closed under conjugation (`Polynomial.aeval_conj`/`Complex.conj_eval`-style: `(p.map ofRealHom).eval (conj z) = conj ((p.map ofRealHom).eval z)`), and `mem_spectrum_iff_isRoot_charpoly`. Also the multiplicities agree (`rootMultiplicity` of `μ` and `conj μ` coincide), which chapter 5's real Schur form wants. ★'''
deps = ["Matrix.charpoly_complexify"]

[[node]]
id = "complexSpectralRadius_pow"
kind = "theorem"
desc = '''`(A ^ k).complexSpectralRadius = A.complexSpectralRadius ^ k` for every `k` (the module has only `≤`, `complexSpectralRadius_pow_le`): Quarteroni–Sacco–Saleri §1.7, `ρ(Aᵏ) = ρ(A)ᵏ`, and Exercise 8. From the complex Banach-algebra statement `spectralRadius_pow` of the `Numlib/Analysis/Normed/Algebra/SpectralRadius` EXT through `complexify_pow`. ★'''
deps = ["Matrix.complexify_pow", "Matrix.complexSpectralRadius", "spectralRadius_pow"]

[[node]]
id = "hasSum_pow_inv_one_sub_of_complexSpectralRadius_lt_one"
kind = "theorem"
desc = '''For `A : Matrix n n ℝ` with `A.complexSpectralRadius < 1`: `HasSum (fun k => A ^ k) (1 - A)⁻¹`, and conversely `Summable (fun k => A ^ k) → A.complexSpectralRadius < 1` (`summable_pow_iff_complexSpectralRadius_lt_one`): the real form of Quarteroni–Sacco–Saleri Theorem 1.5, (1.24)–(1.25). Forward: `isUnit_one_sub_of_complexSpectralRadius_lt_one` gives the unit; the partial sums satisfy `(∑_{k<K} Aᵏ) = (1 - A^K) (1 - A)⁻¹` (`Matrix.geom_sum_eq_sub_pow_mul` of `Numlib/LinearAlgebra/Matrix/MMatrix`, which should move here or to a shared spot since it uses nothing about M-matrices) and `A^K → 0` by `tendsto_pow_iff_complexSpectralRadius_lt_one`. Converse: a summable sequence tends to zero, so `A^k → 0`. The complex-algebra version is `hasSum_pow_inverse_one_sub_of_spectralRadius_lt_one` in the `SpectralRadius` EXT; this one is its real transcript, kept because `complexify` does not commute with `Matrix.inv` for free (it does: `complexify` is a ring hom, `map_inv`-style lemma `complexify_inv` is a one-liner worth stating). ★'''
deps = ["Matrix.isUnit_one_sub_of_complexSpectralRadius_lt_one", "Matrix.tendsto_pow_iff_complexSpectralRadius_lt_one", "Matrix.geom_sum_eq_sub_pow_mul"]

