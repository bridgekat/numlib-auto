[[node]]
id = "exchange_mul_symmToeplitz"
kind = "theorem"
desc = '''`exchange n * symmToeplitz n r = symmToeplitz n r * exchange n` (a symmetric persymmetric matrix commutes
with `ℰ`), and for a nonsingular one `(symmToeplitz n r)⁻¹ * exchange n = exchange n *
(symmToeplitz n r)⁻¹` — the step "`T_k⁻¹ ℰ_k = ℰ_k T_k⁻¹`" of [golub2013matrix] §4.7.3. ★

Blocked: needs `Matrix.exchange` (Permutation, agent kron1, open). The reversal form is proved: `Matrix.symmToeplitz_submatrix_rev` (`T.submatrix rev rev = T`); the commutation is it read through `exchange_mul_apply`/`mul_exchange_apply`, and the inverse form follows from `IsPersymmetric.inv` (proved) with `symmToeplitz_isSymm`; ~20 lines.'''
deps = ["symmToeplitz", "IsPersymmetric.inv", "exchange_mul_exchange"]

[[node]]
id = "leadingPrincipal_symmToeplitz"

[[node]]
id = "symmToeplitz_succ_eq_fromBlocks"
kind = "theorem"
desc = '''The bordering of [golub2013matrix] §4.7.3: `T_{k+1} = [T_k, ℰ_k r; rᵀ ℰ_k, r₀]` with `r = (r₁, …, r_k)`,
stated as `symmToeplitz (k + 1) ρ = (fromBlocks (symmToeplitz k ρ) (replicateCol (Fin 1) (exchange k
*ᵥ fun i => ρ (i + 1))) (replicateRow (Fin 1) (fun i => ρ (i + 1)) ᵥ* exchange k)) (fun _ _ => ρ 0))
.submatrix e e` with `e := finSumFinEquiv.symm : Fin (k + 1) ≃ Fin k ⊕ Fin 1` (Mathlib's
`Matrix.replicateCol`/`replicateRow`; the formalizer may choose the column/row constructor that
makes `Matrix.fromBlocks_multiply` most convenient, keeping this name). Entrywise: the last column
is `ρ_{k - i} = (ℰ r)_i`. ★

Blocked: the statement uses `exchange k *ᵥ` (Permutation, agent kron1, open). Entrywise once it exists: the last column of `T_{k+1}` is `ρ (k - i) = (exchange k *ᵥ fun i => ρ (i + 1)) i` (`exchange_mulVec_apply`, `Fin.val_rev`); ~30 lines.'''
deps = ["symmToeplitz", "exchange_mulVec_apply"]

[[node]]
id = "circulant_eq_sum_downshift_pow"
kind = "theorem"
desc = '''[golub2013matrix] (4.8.3): `circulant z = ∑ k : Fin n, z k • downshift n ^ (k : ℕ)` over a semiring,
`n ≠ 0`. From `downshift_pow_card` and `Matrix.circulant_add`/`circulant_smul` with
`z = ∑ k, z k • Pi.single k 1`. ★

Blocked: needs `Matrix.downshift` and `downshift_pow_card` (Permutation, agent kron1, open). Route once they exist: `downshift n ^ k = circulant (Pi.single k 1)`, so the sum is `circulant (∑ k, z k • Pi.single k 1) = circulant z` by `Matrix.circulant_add`/`circulant_smul`-type linearity (Mathlib has `circulant_add`, `circulant_smul`? else entrywise with `Finset.sum_ite_eq`); ~20 lines.'''
deps = ["downshift_pow_card"]

