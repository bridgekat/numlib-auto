# Planned additions (GVL round): the module doc of `Numlib.LinearAlgebra.Matrix.Toeplitz` is the group description.
# Still open, blocked on `Numlib/LinearAlgebra/Matrix/Permutation` (agent kron1, written in parallel): the
# exchange-matrix forms of persymmetry (`isPersymmetric_iff_exchange_mul_mul_exchange`,
# `IsPersymmetric.isSymm_exchange_mul`), `exchange_mul_symmToeplitz`, the bordering
# `symmToeplitz_succ_eq_fromBlocks`, `exchange_mul_isHankel`, and the downshift expansion
# `circulant_eq_sum_downshift_pow`. When they are written, add `import Numlib.LinearAlgebra.Matrix.Permutation`
# to the module and extend its doc with "the exchange matrix `ℰ_n` and the downshift `𝒟_n` are
# `Matrix.exchange`, `Matrix.downshift` of `Permutation`; `ℰ A ℰ = Aᵀ` is `isPersymmetric_iff_submatrix_rev`
# read through `exchange_mul_apply`/`mul_exchange_apply`".
namespace = "Matrix"

[[node]]
id = "IsPersymmetric"

[[node]]
id = "isPersymmetric_iff_exchange_mul_mul_exchange"
kind = "theorem"
desc = '''`A.IsPersymmetric ↔ exchange n * A * exchange n = Aᵀ` over a semiring — the book's definition
`ℰ_n B ℰ_n = Bᵀ`. From `exchange_mul_apply`, `mul_exchange_apply`, `Fin.rev_rev`. ★

Blocked: `Matrix.exchange` and its API (`exchange_mulVec_apply`, `exchange_mul_apply`, `mul_exchange_apply`, `exchange_mul_exchange`) are in `Numlib/LinearAlgebra/Matrix/Permutation`, open and written in parallel by agent kron1 (not importable from this branch). Once it exists: `exchange n * A * exchange n` has entries `A (rev i) (rev j)` (`exchange_mul_apply`, `mul_exchange_apply`), so this is `isPersymmetric_iff_submatrix_rev` (proved) up to `ext`; ~10 lines.'''
deps = ["IsPersymmetric", "exchange_mulVec_apply", "exchange_mul_exchange"]

[[node]]
id = "IsPersymmetric.isSymm_exchange_mul"
kind = "theorem"
desc = '''A persymmetric `A` has `exchange n * A` symmetric ("`ℰ_n B` is symmetric", [golub2013matrix] §4.7.1);
conversely `(exchange n * A).IsSymm → A.IsPersymmetric` (`isPersymmetric_iff_isSymm_exchange_mul`). ★

Blocked: needs `Matrix.exchange` (Permutation, agent kron1, open). Route once it exists: `(exchange n * A) i j = A (rev i) j` and persymmetry `A (rev j) (rev i) = A i j` with `Fin.rev_rev`; ~10 lines.'''
deps = ["isPersymmetric_iff_exchange_mul_mul_exchange"]

