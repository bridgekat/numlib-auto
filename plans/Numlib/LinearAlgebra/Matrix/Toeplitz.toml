`A : Matrix (Fin m) (Fin n) K`. Split off the `hankel` node (whose desc named it its first lemma) at the
formalization of the Golub–Van Loan round: the reversal form `IsHankel.isToeplitz_submatrix_rev` is proved, and
`exchange m * A = A.submatrix Fin.rev id` (`exchange_mul_apply`) makes this a corollary. ★

Blocked: `Matrix.exchange` is in `Numlib/LinearAlgebra/Matrix/Permutation`, open and written in parallel by agent
kron1 (not importable from this branch); ~5 lines once it exists.'''
