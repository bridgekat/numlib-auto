[[node]]
id = "exists_ttCore_of_rank"
kind = "theorem"
desc = '''One step of the construction ([golub2013matrix] (12.5.26)–(12.5.28), P12.5.11): a matrix `C : Matrix (Fin p ×
Fin m) N R` (rows: the previous rank index and the next mode) of rank `s` factors as `C = G' * C'` with `G' :
Matrix (Fin p × Fin m) (Fin s) R`, `C' : Matrix (Fin s) N R` (the book takes `G' = U₃`, `C' = Σ₃ V₃ᵀ` from the
SVD; any rank factorization works, `Matrix.rank_le_iff_exists_mul`), and then `C (k, i) c = ∑ k', G (i) k
k' * C' k' c` with `G i := of fun k k' => G' (k, i) k'` — the core. ★

Blocked: needs the rank factorization `Matrix.rank_le_iff_exists_mul` (agent cond1, `Rank`, not on
this branch's base); with it the core is a reindexing, ~20 lines.'''
deps = ["Matrix.rank_le_iff_exists_mul"]

[[node]]
id = "exists_tensorTrain"
kind = "theorem"
desc = '''**Every tensor is a tensor train** with the TT-ranks of its sequential unfoldings ([golub2013matrix] (12.5.29),
Oseledets–Tyrtyshnikov): for `A : Tensor (fun k : Fin d => Fin (n k)) R` there are `r : ℕ → ℕ` with `r 0 = 1`,
`r d = 1`, `r k = (A.unfold (fun i : Fin d => (i : ℕ) < k)).rank` for `0 < k < d`, and cores `G` with `A =
tensorTrain d h0 hd G`. Induction on `k` (the book's loop): after `k` steps `A_{[0,k)×[k,d)} = P_k * M_k` with
`P_k` the flattened `ttPartial` (full column rank `r k`) and `M_k` of rank `r k`; reshape `M_k` to rows `(r k,
n k)` — its rank is `r (k+1)` because `P_k` has full column rank — and apply `exists_ttCore_of_rank`. ★★★
(~200 lines, most of it the reshaping of `M_k` between the index types)

Blocked: not attempted for effort (★★★). `exists_ttCore_of_rank` (proved) is the step; what
remains is the induction over `k` with the reshaping of `M_k` between `∀ i : {i // i < k}, …`
unfolding index types and `Fin (r k) × Fin (n k)` rows, plus the rank equalities (full column rank
of the flattened `ttPartial`), estimated ~200 lines.'''
deps = ["Tensor.tensorTrain", "Tensor.exists_ttCore_of_rank", "Tensor.unfold"]
