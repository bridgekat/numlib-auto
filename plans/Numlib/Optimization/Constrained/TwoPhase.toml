namespace = "Optimization"
desc = '''
Two-phase "target-following" methods for `min f(x)` s.t. `x ∈ X`, `c(x) = 0` (Cartis–Gould–Toint
§7.2 TPp-GC and §14.3.2 TPqp-GC). Setting: `E` real normed space, `F` real inner product space
(`EuclideanSpace ℝ (Fin m)` on the surface), `c : E → F`, `f : E → ℝ`, target `t : ℝ`.
The residual `r(x,t) = (c(x), f(x) - t) ∈ F × ℝ` is never formed as a Lean product (Mathlib's
product norm is the sup norm); instead its Euclidean norm and the merit `μ = ½‖r‖²` are defined
directly. Contents: the merit and residual, the exact relation between Taylor measures of `μ` and of
the Lagrangian `f - ⟪y, c⟫` at `y = -c(x)/(f(x) - t)` (the algebra of Lemmas 7.2.1 and 14.3.5), the
target-update bookkeeping (Lemmas 7.2.3, 7.2.4, B.7.1) and the per-block counting of inner
iterations (Lemmas 7.2.6, 14.3.8). Planned by the Chapter 14 planner; the Chapter 6–7 planner's
TPp-GC analysis should reuse the target-update and counting lemmas (Lemma B.7.1's content is
`sub_add_sqrt_ge`).
'''

[[node]]
id = "targetMerit"
kind = "def"
desc = '''
`targetMerit c f t x : ℝ := (‖c x‖ ^ 2 + (f x - t) ^ 2) / 2` (the book's `μ(x,t) = ½‖r(x,t)‖²`,
(14.3.30), (7.2.5); with `f = 0`, `t = 0` up to the constant it is `ν = ½‖c‖²`) and
`targetResidualNorm c f t x : ℝ := Real.sqrt (‖c x‖ ^ 2 + (f x - t) ^ 2)` (`‖r(x,t)‖`). API (part of
node): `targetMerit = targetResidualNorm ^ 2 / 2`; `‖c x‖ ≤ targetResidualNorm`,
`|f x - t| ≤ targetResidualNorm`; `C^p` when `f`, `c` are; first three derivatives (14.3.37)–(14.3.39):
`D μ[d] = ⟪c x, Dc[d]⟫ + (f x - t) Df[d]`, `D²μ[d,d] = ‖Dc[d]‖² + ⟪c x, D²c[d,d]⟫ + (Df[d])² +
(f x - t) D²f[d,d]`, `D³μ[d,d,d] = 3⟪D²c[d,d], Dc[d]⟫ + ⟪c x, D³c[d,d,d]⟫ + 3 D²f[d,d] Df[d] +
(f x - t) D³f[d,d,d]`.
'''
source = "Cartis–Gould–Toint, (14.3.30), (14.3.37)–(14.3.39)"

[[node]]
id = "taylorMeasure_lagrangian_one_eq"
kind = "theorem"
desc = '''
Let `f`, `c` be differentiable at `x`, `τ := f x - t > 0`, `y := -(τ⁻¹) • c x`, and
`ℓ z := f z - ⟪y, c z⟫`. Then `fderiv ℝ ℓ x = τ⁻¹ • fderiv ℝ (targetMerit c f t) x` (14.3.54), hence
for all `δ`, `S`: `taylorMeasure (ftaylorSeries ℝ ℓ x) 1 δ S = τ⁻¹ * taylorMeasure
(ftaylorSeries ℝ (targetMerit c f t) x) 1 δ S`, and `targetResidualNorm c f t x / τ =
Real.sqrt (1 + ‖y‖ ^ 2)` (the book's `‖(1, yᵀ)‖`); also `⟪y, c x⟫ = -‖c x‖² / τ ≤ 0`.
'''
deps = ["targetMerit", "taylorMeasure"]
source = "Cartis–Gould–Toint, (14.3.53)–(14.3.54), proof of Lemma 14.3.5 (j = 1)"

[[node]]
id = "taylorMeasure_lagrangian_two_le"
kind = "theorem"
desc = '''
Second order (corrected (14.3.43)–(14.3.44)). With the data of `taylorMeasure_lagrangian_one_eq`,
`f`, `c` `C^2` at `x`, `S ∋ 0`, `T := S ∩ {d | fderiv ℝ c x d = 0}`, `M := T ∩ {d | fderiv ℝ f x d = 0}`,
`δ ≥ 0`, and `G := sSup ((fun d => |fderiv ℝ f x d|) '' (closedBall 0 δ ∩ T))`:
`taylorMeasure (ftaylorSeries ℝ ℓ x) 2 δ T ≤ τ⁻¹ * (taylorMeasure (ftaylorSeries ℝ μ x) 2 δ S + G ^ 2 / 2)`
and `taylorMeasure (ftaylorSeries ℝ ℓ x) 2 δ M ≤ τ⁻¹ * taylorMeasure (ftaylorSeries ℝ μ x) 2 δ S`.
Proof: on `T`, `ΔT_{ℓ,2}(d) = τ⁻¹ (ΔT_{μ,2}(d) + ½ (Df[d])²)` ((14.3.55)). The book's (14.3.57)
claims `|Df[d]|/τ = |Dℓ[d]|` on `T`, but there `Dℓ[d] = Df[d]`; the term is `(Df[d])²/(2τ)`, which
is not bounded by `½ φ^δ_{ℓ,X,1} ‖Df‖ δ` (see the Section03 counterexample to (14.3.43)).
'''
deps = ["taylorMeasure_lagrangian_one_eq"]
source = "Cartis–Gould–Toint, (14.3.55)–(14.3.57), proof of Lemma 14.3.5 (j = 2)"

[[node]]
id = "taylorMeasure_lagrangian_three_le"
kind = "theorem"
desc = '''
Third order (corrected (14.3.46)–(14.3.47)). As above with `C^3` data and
`H := sSup ((fun d => |iteratedFDeriv ℝ 2 f x ![d, d]|) '' (closedBall 0 δ ∩ T))`:
`taylorMeasure (ftaylorSeries ℝ ℓ x) 3 δ T ≤ τ⁻¹ * (taylorMeasure (ftaylorSeries ℝ μ x) 3 δ S +
(G + H) * G / 2)` and `taylorMeasure (ftaylorSeries ℝ ℓ x) 3 δ M ≤ τ⁻¹ * taylorMeasure
(ftaylorSeries ℝ μ x) 3 δ S`. Proof: on `T`, `D³ℓ[d]³ = τ⁻¹ (D³μ[d]³ - 3 D²f[d]² Df[d])` (14.3.58).
'''
deps = ["taylorMeasure_lagrangian_two_le"]
source = "Cartis–Gould–Toint, (14.3.58)–(14.3.59), proof of Lemma 14.3.5 (j = 3)"

[[node]]
id = "sub_add_sqrt_ge"
kind = "theorem"
desc = '''
For `0 ≤ ω ≤ ε₀` and reals `a b` with `a ^ 2 + b ^ 2 ≤ ω ^ 2`:
`ε₀ - ω ≤ -a + Real.sqrt (ε₀ ^ 2 - b ^ 2)` (the minimum of `-a + √(ε₀² - b²)` over the disc of
radius `ω` is `ε₀ - ω`: Lemma B.7.1 as an inequality). Used for the target decrease (7.2.30).
'''
source = "Cartis–Gould–Toint, Lemma B.7.1 and (7.2.30)"

[[node]]
id = "IsTargetSequence"
kind = "def"
desc = '''
Outer bookkeeping of Phase 2 (Steps 0 and 2 of TPp-GC / TPqp-GC). For `c f`, `θ ∈ (0,1)`, `ε₀ > 0`,
outer iterates `x : ℕ → E`, targets `t : ℕ → ℝ` and a horizon `K` (outer iterations `k ∈ [1, K)`
completed without termination): `‖c (x 1)‖ ≤ θ ε₀`, `t 1 = f (x 1) - √(ε₀² - ‖c (x 1)‖²)`; for
`1 ≤ k < K`: (inner monotonicity) `targetResidualNorm c f (t k) (x (k+1)) ≤ targetResidualNorm c f
(t k) (x k)`; (a) if `targetResidualNorm c f (t k) (x (k+1)) < θ ε₀` then
`t (k+1) = f (x (k+1)) - √(ε₀² - ‖c (x (k+1))‖²)` (`k ∈ 𝒦_a`); (b) otherwise `f (x (k+1)) < t k`
and `t (k+1) = 2 f (x (k+1)) - t k` (`k ∈ 𝒦_b`; the case (c), `f ≥ t`, terminates, i.e. does not
occur before `K`).
'''
deps = ["targetMerit"]
source = "Cartis–Gould–Toint, Algorithm 7.2.1 Phase 2 and Algorithm 14.3.2 Phase 2, (14.3.36)"

[[node]]
id = "IsTargetSequence.props"
kind = "theorem"
desc = '''
Lemma 7.2.3 (valid verbatim for TPqp-GC, as the book notes before (14.3.36)). For an
`IsTargetSequence … x t K` and `1 ≤ k ≤ K`: `t` is strictly decreasing on `[1, K]`;
`0 ≤ f (x k) - t k` (7.2.26); `targetResidualNorm c f (t (k+1)) (x (k+1)) = ε₀` if `k ∈ 𝒦_a` (7.2.27);
`= targetResidualNorm c f (t k) (x (k+1)) ≤ ε₀` if `k ∈ 𝒦_b` (7.2.28); `‖c (x k)‖ ≤ ε₀` and
`f (x k) - t k ≤ ε₀` (7.2.29); `t k - t (k+1) ≥ (1 - θ) ε₀` for `k ∈ 𝒦_a` (7.2.30); and, if
`flow ≤ f ≤ fup` on `{z ∈ X | ‖c z‖ ≤ ε₀}` (f.B.Fb) with `ε₀ ≤ 1`, `t k ∈ [flow - 1, fup]` (7.2.31).
'''
deps = ["IsTargetSequence", "sub_add_sqrt_ge"]
source = "Cartis–Gould–Toint, Lemma 7.2.3 (used for Algorithm 14.3.2)"

[[node]]
id = "IsTargetSequence.card_Ka_le"
kind = "theorem"
desc = '''
Lemma 7.2.4: under f.B.Fb (as in `IsTargetSequence.props`), the number of `k ∈ [1, K)` with
`k ∈ 𝒦_a` is at most `(fup - flow + 1) / ((1 - θ) ε₀)`. (Theorem 14.3.9's `f_up - f_low - 1` is a
sign slip for this `+ 1`.)
'''
deps = ["IsTargetSequence.props"]
source = "Cartis–Gould–Toint, Lemma 7.2.4 (used in (14.3.69)–(14.3.70))"

[[node]]
id = "card_le_of_residual_block"
kind = "theorem"
desc = '''
Counting successful inner iterations in one block between consecutive `𝒦_a` indices (the
telescoping argument of Lemmas 7.2.6 / 14.3.8, corrected). Let `ρ : ℕ → ℝ` be antitone on
`[0, N]` with `θ ε₀ ≤ ρ i ≤ ε₀` there (`θ ∈ (0,1)`, `ε₀ > 0`), `T ⊆ range N`, `c > 0`,
`π : ℕ → ℝ` with `1 ≤ π l ≤ πmax` and `ε l > 0` for `l ∈ Icc 1 q`, and for every `i ∈ T`:
`θ * ρ i ≤ ρ (i+1)` and `ρ i ^ 2 / 2 - ρ (i+1) ^ 2 / 2 ≥ c * min_{l ∈ Icc 1 q} (ρ (i+1) * ε l) ^ π l`.
Then `|T| ≤ (1 - θ) / (c * θ ^ (2 * πmax - 1)) * max_{l ∈ Icc 1 q} ε₀ ^ (2 - π l) * ε l ^ (-π l)`.
Correction: the book's proof of Lemma 14.3.8 bounds `‖r(x_{j,s},t_j)‖^{π_l - 1}` from below by
`ε₀^{π_l-1}`, but (B.14.20) only gives `(θ ε₀)^{π_l-1}`; hence the constant
`κ^S_{INNER,2} = [κ^μ_decr]⁻¹ β^{-π_max} θ^{1-2π_max}` instead of `[κ^μ_decr]⁻¹ (βθ)^{-π_max}` (same
order in `ε`). (Here `c = κ^μ_decr β^{π_max}`.)
'''
source = "Cartis–Gould–Toint, proof of Lemma 14.3.8 (Appendix B) and Lemma 7.2.6"
