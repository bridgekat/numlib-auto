namespace = "LineSearch"
desc = '''
Inexact line searches (Quarteroni–Sacco–Saleri §7.2.3 and §7.2.6; Nocedal–Wright §3.1–3.2): the
Armijo sufficient-decrease condition (7.31), the strong (7.32) and weak (7.33) Wolfe curvature
conditions and the Goldstein conditions (7.34) as predicates on a step `α` along a direction `d`
at `x`; the existence of a whole interval of admissible steps when `f` is bounded below along the
ray (Property 7.5); and Zoutendijk's theorem, `∑ (∇f(x_k)ᵀ d_k / ‖d_k‖)² < ∞` for a descent sequence
with Armijo–Wolfe steps and a Lipschitz gradient, from which Property 7.7 (the trichotomy) and the
global convergence of gradient-related methods follow. Stated on a real normed space with
`f' : E → E →L[ℝ] ℝ` and `Descent.IsDescentSequence` from `Numlib/Optimization/Descent`; the
`ℓ²`-Lipschitz hypothesis of the book is the operator-norm Lipschitz condition on `f'`.
'''

[[node]]
id = "Armijo"
kind = "definition"
desc = '''`LineSearch.Armijo f f' σ x d α : Prop := f (x + α • d) ≤ f x + σ * α * f' x d`, the
sufficient-decrease condition (7.31) (equivalently `(f x - f (x + α d)) / α ≥ -σ f' x d` for
`α > 0`). ★'''
deps = []

[[node]]
id = "WolfeCurvature"
kind = "definition"
desc = '''`LineSearch.WolfeCurvature f' β x d α : Prop := β * f' x d ≤ f' (x + α • d) d`, the
curvature condition (7.33). ★'''
deps = []

[[node]]
id = "StrongWolfeCurvature"
kind = "definition"
desc = '''`LineSearch.StrongWolfeCurvature f' β x d α : Prop := |f' (x + α • d) d| ≤ β * |f' x d|`,
the strong curvature condition (7.32); it implies `WolfeCurvature` when `f' x d < 0`. ★'''
deps = []

[[node]]
id = "Goldstein"
kind = "definition"
desc = '''`LineSearch.Goldstein f f' σ x d α : Prop := f x + (1 - σ) * α * f' x d ≤ f (x + α • d) ∧
f (x + α • d) ≤ f x + σ * α * f' x d`, the Goldstein conditions (7.34) (for `f' x d < 0`, `α > 0`
this is `σ ≤ (f (x + α d) - f x) / (α f' x d) ≤ 1 - σ`). ★'''
deps = []

[[node]]
id = "eventually_armijo_of_isDescentDirection"
kind = "theorem"
desc = '''Backtracking terminates: if `HasFDerivAt f (f' x) x`, `Descent.IsDescentDirection f' x d`
and `σ < 1`, then `∀ᶠ α in 𝓝[>] 0, Armijo f f' σ x d α`. Proof: the derivative of
`t ↦ f (x + t d) - f x - σ t f' x d` at `0` is `(1 - σ) f' x d < 0`. Hence the Armijo rule
`α_k = β^{m_k} ᾱ` of §7.2.3 and Program 62 produce a finite `m_k`. ★'''
deps = ["LineSearch.Armijo"]

[[node]]
id = "exists_Icc_armijo_wolfe"
kind = "theorem"
desc = '''Property 7.5 (Nocedal–Wright Lemma 3.1): let `HasFDerivAt f (f' y) y` for all `y`, `f'`
continuous, `f` bounded below along the ray, `∀ t, M ≤ f (x + t • d)`,
`Descent.IsDescentDirection f' x d`, `0 < σ < β < 1`. Then
`∃ c C, 0 < c ∧ c < C ∧ ∀ α ∈ Icc c C, Armijo f f' σ x d α ∧ WolfeCurvature f' β x d α ∧
StrongWolfeCurvature f' β x d α`. Proof: `φ t = f (x + t d)` and `l t = f x + σ t f' x d`; since
`l → -∞` and `φ ≥ M`, `φ - l` has a first positive zero `α'` (intermediate value theorem), on
`(0, α']` Armijo holds; the mean value theorem gives `α'' ∈ (0, α')` with
`φ' α'' = σ f' x d`, which is `> β f' x d` and `|·| < β |f' x d|` because `σ < β`; continuity
of `φ'` then gives a closed interval around `α''` inside `(0, α')` on which all three hold. The
book's `σ ∈ (0, 1/2)` is not needed. ★★★'''
deps = ["LineSearch.Armijo", "LineSearch.WolfeCurvature", "LineSearch.StrongWolfeCurvature"]

[[node]]
id = "zoutendijk"
kind = "theorem"
desc = '''Zoutendijk's theorem (Nocedal–Wright Thm 3.2), the content of Property 7.7: let
`HasFDerivAt f (f' y) y` for all `y`, `‖f' y - f' z‖ ≤ L * ‖y - z‖` for all `y z`,
`Descent.IsDescentSequence f' x d α`, `∀ k, Armijo f f' σ (x k) (d k) (α k)`,
`∀ k, WolfeCurvature f' β (x k) (d k) (α k)`, `0 < σ`, `β < 1`, and `∀ k, M ≤ f (x k)`. Then
`Summable fun k => (f' (x k) (d k) / ‖d k‖) ^ 2`. Proof: the curvature condition and the Lipschitz
bound give `α k ≥ (β - 1) f' (x k) (d k) / (L ‖d k‖²)`, Armijo then gives
`f (x (k+1)) ≤ f (x k) - σ (1 - β) / L · (f' (x k) (d k))² / ‖d k‖²`, and the telescoping sum is
bounded by `f (x 0) - M`. ★★★'''
deps = ["LineSearch.Armijo", "LineSearch.WolfeCurvature"]

[[node]]
id = "tendsto_atBot_or_tendsto_zero"
kind = "theorem"
desc = '''Property 7.7 in the book's trichotomy: under the hypotheses of `zoutendijk` without the lower
bound `M`, either `Tendsto (fun k => f (x k)) atTop atBot` or
`Tendsto (fun k => f' (x k) (d k) / ‖d k‖) atTop (𝓝 0)`. Proof: `f (x k)` is decreasing (Armijo
with `f' (x k) (d k) < 0`), so it either tends to `-∞` or is bounded below, in which case
`zoutendijk` applies and the summands tend to `0`. The book's first alternative,
`∇f (x k) = 0` for some `k`, is the termination case excluded by `IsDescentSequence.descent`. ★★'''
deps = ["LineSearch.zoutendijk"]
