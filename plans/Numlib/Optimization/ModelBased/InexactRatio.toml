namespace = "Optimization"
desc = '''
Ratio tests with inexact predicted decreases and (possibly) inexact function values
(Cartis–Gould–Toint §13.1, §13.3: (13.1.16), (13.1.58), (13.3.10), (13.3.19)). The ratio is
`ρ = (a - b) / Δbar` where `Δbar > 0` is the inexact Taylor decrement `\overline{ΔT}_{f,j}(x,s)` and
`a, b` are the (exact in IDA, inexact in EDA) values at `x` and `x + s`. The lemmas are about real
numbers: the exact quantities `f x`, `f (x + s)` and the exact decrement `ΔT = D.taylorDecrement j s`
appear only in the hypotheses, so the same statements serve every algorithm of Chapter 13 (and
the core lemma `le_reductionRatio_of_abs_sub_le` is the special case `a = f x`, `b = f (x + s)`,
`Δbar = ΔT`). In IDA (`a = f x`, `b = f(x+s)`) the `ρ` of the book is
`reductionRatio f x s Δbar`.
'''

[[node]]
id = "abs_div_sub_one_le_of_inexact"
kind = "theorem"
desc = '''
Error decomposition of the inexact ratio. For reals `a b fx fxs ΔT Δbar` with `0 < Δbar`:
`|(a - b) / Δbar - 1| ≤ (|a - fx| + |fxs - (fx - ΔT)| + |ΔT - Δbar| + |b - fxs|) / Δbar`.
(Here `fx - ΔT = T_{f,j}(x,s)` when `ΔT` is the exact decrement and `fx = T_{f,j}(x,0)`; the
second term is then the Taylor remainder bounded by (A.19), the third by
`abs_taylorDecrement_sub_le_of_stepAccuracy`, the first and last by the value accuracies (13.3.1),
(13.3.2), and both vanish in the IDA framework.)
'''
source = "Cartis–Gould–Toint, proofs of Lemmas 13.1.3, 13.1.14, 13.3.1, 13.3.5"

[[node]]
id = "le_div_of_inexact_error_le"
kind = "theorem"
desc = '''
Very-successful criterion. Under the hypotheses of `abs_div_sub_one_le_of_inexact`, if
`|a - fx| + |fxs - (fx - ΔT)| + |ΔT - Δbar| + |b - fxs| ≤ (1 - η) * Δbar` then
`η ≤ (a - b) / Δbar`. Typical use (Lemma 13.3.1/13.3.5): value errors `≤ κs Δbar` each with
`κs ≤ (1 - η₂)/4` absorb half of the budget, the Taylor-remainder and derivative-error terms the
other half.
'''
deps = ["abs_div_sub_one_le_of_inexact"]
source = "Cartis–Gould–Toint, Lemmas 13.1.3, 13.1.14, 13.3.1, 13.3.5"

[[node]]
id = "sub_ge_of_inexact_ratio"
kind = "theorem"
desc = '''
True decrease on accepted steps with inexact values (Lemmas 13.3.2, 13.3.7). For reals with
`0 < Δbar`, `|a - fx| ≤ κs * Δbar`, `|b - fxs| ≤ κs * Δbar`, `η₁ ≤ (a - b) / Δbar` and
`κs ≤ η₁ / 4`: `fx - fxs ≥ η₁ / 2 * Δbar` (more precisely `≥ (η₁ - 2 κs) Δbar`).
'''
source = "Cartis–Gould–Toint, proofs of Lemmas 13.3.2, 13.3.7"
