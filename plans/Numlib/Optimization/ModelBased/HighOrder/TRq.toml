namespace = "Optimization"
desc = '''
The high-order trust-region method TRq (Cartis–Gould–Toint Algorithm 12.2.1) as a relational run
predicate, generic in
* the derivative data `D k : FormalMultilinearSeries ℝ E ℝ` used at iteration `k` (exact TRq:
  `D k = ftaylorSeries ℝ f (x k)`; Chapter 13 inexact variants: approximate jets), and
* the feasible displacement sets `S k : Set E` (unconstrained: `univ`; TRq-SC of §14.2 with a
  closed feasible set `X`: `S k = {d | x k + d ∈ X}`, which is the consolidated "runs take `X`"
  convention; `x 0 ∈ X` is then a hypothesis of the theorems),
so that Chapters 13–14 can reuse the run shape and the one-iteration lemmas below. Steps 3–4 are
the generic trust-region ones (`IsTRRun`, `ModelBased/TRRun`).

Run conventions (core `Complexity/Basic`): optimality radius `δ_k = min Δ_k ϑ` (a scalar, used for
all orders); Step-1 witnesses `d k j` (`IsApproxMeasureStep`, all `j ∈ [1:q]` — requiring them
beyond the first failing order is harmless: they exist and are unused); termination test
`MeasureTestPasses (fun j => (D k).taylorDecrement j) q ς ε (fun _ => δ_k) (d k)`; rules of Steps 2–4 imposed with `UntilHit`;
`j_k` the least failing order, `d_k = d k j_k`; ratio (12.2.4) with the decrement of order `j_k`;
radius update `TRUpdate` plus the cap `Δ_{k+1} ≤ Δ_max` (12.2.5). Successful iterations:
`η₁ ≤ ρ_k`; derivative evaluations once per successful iteration plus the initial one
(`derivEvalCount`), function evaluations once per iteration (`funEvalCount`).

One-iteration lemmas are stated with an abstract *model-fidelity* hypothesis
`|f(x_k + s_k) - (f(x_k) - ΔT_{j_k}(D k, s_k))| ≤ L/(j_k+1)! ‖s_k‖^{j_k+1}` (for exact data this
is (A.19), `abs_sub_taylorPolynomial_le_of_lipschitz`; inexact data add their error terms).
(Planned by plan-ch12.)
'''

[[node]]
id = "TRqParams"
kind = "def"
desc = '''
`structure TRqParams extends TRParams` (Algorithm 12.2.1, Step 0): the TR constants plus
`Δmax ς : ℝ` with `Δ₀ ≤ Δmax`, `0 < ς ≤ 1` (proof fields). The
threshold `ϑ ∈ [min_j ε_j, 1]` depends on the tolerances and is an argument of the run predicate.
'''
deps = ["TRParams"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1 (Step 0)"

[[node]]
id = "IsTRqRun"
kind = "def"
desc = '''
`structure IsTRqRun (f : E → ℝ) (D : ℕ → FormalMultilinearSeries ℝ E ℝ) (S : ℕ → Set E)
(P : TRqParams) (q : ℕ) (ε : ℕ → ℝ) (ϑ : ℝ) (x s : ℕ → E) (Δ : ℕ → ℝ) (jk : ℕ → ℕ)
(d : ℕ → ℕ → E) : Prop`. Writing `δ k := min (Δ k) ϑ`, `Δf k j := (D k).taylorDecrement j`,
`test k := MeasureTestPasses (Δf k) q P.ς ε (fun _ => δ k) (d k)`,
`pred k := Δf k (jk k) (s k)`, `ρ k := reductionRatio f (x k) (s k) (pred k)`, and the Step-1.2/2
condition `step k := jk k ∈ Icc 1 q ∧ P.ς * ε (jk k) * δ k ^ jk k / (jk k)! < Δf k (jk k) (d k (jk k))
∧ (∀ j ∈ Ico 1 (jk k), ¬ (P.ς ε_j δ_k^j/j! < Δf k j (d k j))) ∧ s k ∈ closedBall 0 (Δ k) ∩ S k ∧
Δf k (jk k) (d k (jk k)) ≤ pred k` ((12.2.3)), the fields are:
* `toIsTRRun : IsTRRun P.toTRParams test step ρ x s Δ` (Steps 2–4, (12.2.4)–(12.2.5));
* `witness : ∀ k, (∀ i < k, ¬ test i) → ∀ j ∈ Icc 1 q, IsApproxMeasureStep (Δf k j) (δ k) (S k)
  P.ς (d k j)` (Step 1.1, (12.2.1); also at the terminating iteration);
* `cap : UntilHit test fun k => Δ (k+1) ≤ P.Δmax` (12.2.5).
Exact TRq: `D k = ftaylorSeries ℝ f (x k)`, `S k = univ`; TRq-SC: `S k = {d | x k + d ∈ X}`.
'''
deps = ["TRqParams", "IsTRRun", "IsApproxMeasureStep", "MeasureTestPasses", "UntilHit", "reductionRatio", "FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1"

[[node]]
id = "exists_isTRqRun"
kind = "theorem"
desc = '''
Existence of TRq runs. `[FiniteDimensional ℝ E]`, `J : E → FormalMultilinearSeries ℝ E ℝ`,
`C' : E → Set E` with every `C' y` closed and containing `0`, any `f`, `P`, `q`, `ε`, `ϑ`, `x₀`:
there are `x s Δ jk d` with `x 0 = x₀` and `IsTRqRun f (fun k => J (x k)) (fun k => C' (x k)) P q ε
ϑ x s Δ jk d`. Construction (`exists_run_of_forall_exists_of_invariant`, invariant
`0 < Δ_k ≤ Δmax`): witnesses by `exists_isApproxMeasureStep`; if the test fails, `jk` = least failing
order, `s_k = d_k` (admissible since `δ_k ≤ Δ_k`, `pred_k > 0`); `Δ_{k+1} = Δ_k`, `γ₂Δ_k` or `γ₁Δ_k`
according to `ρ_k`.
'''
deps = ["IsTRqRun", "exists_isApproxMeasureStep", "exists_run_of_forall_exists", "exists_lt_of_not_measureTestPasses"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1 (well-posedness)"

[[node]]
id = "trqGap"
kind = "def"
desc = '''
The scaled approximate criticality gap (12.2.8): `trqGap (D : FormalMultilinearSeries ℝ E ℝ)
(j : ℕ) (δ : ℝ) (d : E) : ℝ := j! * D.taylorDecrement j d / δ ^ j` (the book's `φ̂_{f,k}` with
`j = j_k`, `δ = δ_k`, `d = d_k`).
'''
deps = ["FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, (12.2.8)"

[[node]]
id = "IsTRqRun.trqGap_ge"
kind = "theorem"
desc = '''
Lemma 12.2.1 (generic). For an `IsTRqRun` with `ϑ > 0`, `εmin > 0`, `∀ j ∈ Icc 1 q, εmin ≤ ε j`, and
`k` before termination (`∀ i ≤ k, ¬ test i`): `P.ς * εmin ≤ trqGap (D k) (jk k) (δ k) (d k (jk k))`
(12.2.9) and `trqGap … * δ_k ^ jk k / (jk k)! ≤ (D k).taylorDecrement (jk k) (s k)` (12.2.10);
hence also `ς εmin ≤ min_{i ≤ k} φ̂_i`.
'''
deps = ["IsTRqRun", "trqGap"]
source = "Cartis–Gould–Toint, Lemma 12.2.1"

[[node]]
id = "IsTRqRun.le_reductionRatio"
kind = "theorem"
desc = '''
Lemma 12.2.2 (generic). At an iteration `k` before termination of an `IsTRqRun`, assume model
fidelity `|f (x k + s k) - (f (x k) - pred k)| ≤ L / (jk k + 1)! * ‖s k‖ ^ (jk k + 1)` with `L > 0`,
and `Δ k ≤ min ϑ ((1 - η₂) * φ̂_k / L)` (12.2.11). Then `δ_k = Δ_k`, `η₂ ≤ ρ k` and `Δ k ≤ Δ (k+1)`.
Computation (12.2.12): `|ρ_k - 1| ≤ L ‖s_k‖^{j+1} / ((j+1) φ̂_k δ_k^j) ≤ L Δ_k / ((j+1) φ̂_k) ≤ 1 - η₂`.
'''
deps = ["IsTRqRun.trqGap_ge", "le_reductionRatio_of_abs_sub_le", "IsTRRun"]
source = "Cartis–Gould–Toint, Lemma 12.2.2"

[[node]]
id = "IsTRqRun.radius_ge"
kind = "theorem"
desc = '''
Lemma 12.2.3 (generic). Assume the model fidelity of `IsTRqRun.le_reductionRatio` with a constant
`L ≥ 1` at every iteration before termination, `0 < ϑ ≤ 1`, and let
`M := max_{i ∈ Icc 1 q} ‖D 0 i‖`, `δ₀ := min P.Δ₀ ϑ`,
`κΔ := P.γ₁ * (1 - P.η₂) / L * min ϑ (P.Δ₀ * δ₀ ^ q / (2 * q! * M))` ((12.2.14); "`2q!`" is
`2 · q!`). If the test fails at `0` then `M > 0`, `κΔ ∈ (0, 1)`, `κΔ φ̂_0 ≤ Δ₀`, and for every `k` before
termination `min (P.γ₁ * ϑ) (κΔ * min_{i ≤ k} φ̂_i) ≤ Δ k` (12.2.13); at the first termination index
`K ≥ 1` the same holds with the minimum over `i < K`. Proof: `le_delta_of_trUpdate` with the
antitone threshold `θ_k = min ϑ ((1 - η₂)/L · min_{i≤k} φ̂_i)` (Lemma 12.2.2 gives `Δ_k < θ_k ⇒
η₂ ≤ ρ_k`; packaged as `IsTRRun.delta_ge`), and `φ̂_0 ≤ 2 q! M / δ₀^q` from `abs_taylorDecrement_sub_le` (with `D' = 0`) and
`∑_{i ≤ j} δ₀^i/i! ≤ 2 δ₀` (A.34), `δ₀ ≤ 1`.
'''
deps = ["IsTRqRun.le_reductionRatio", "IsTRRun.delta_ge", "FormalMultilinearSeries.abs_taylorDecrement_sub_le", "sum_pow_div_factorial_le_two_mul_pow"]
source = "Cartis–Gould–Toint, Lemma 12.2.3"

[[node]]
id = "IsTRqRun.taylorDecrement_ge"
kind = "theorem"
desc = '''
Lemma 12.2.4 (generic). Under the hypotheses of `IsTRqRun.radius_ge` and `εmin ≤ ε j` for
`j ∈ Icc 1 q`, `0 < εmin ≤ ϑ ≤ 1`: for every `k` before termination,
`(P.ς * κΔ) ^ (q + 1) / q! * εmin ^ (q + 1) ≤ pred k` (12.2.18), and if `k` is successful
(`η₁ ≤ ρ k`) then `η₁ (ς κΔ)^{q+1}/q! εmin^{q+1} ≤ f (x k) - f (x (k+1))` (12.2.19). Also
(part of node, used for the iteration count): `P.ς * κΔ * εmin ≤ Δ k` for `k` up to and including
the first termination index (`Δ_min` in the proof of Theorem 12.2.5).
'''
deps = ["IsTRqRun.radius_ge", "IsTRqRun.trqGap_ge", "IsTRRun.sub_ge_of_succ"]
source = "Cartis–Gould–Toint, Lemma 12.2.4"
