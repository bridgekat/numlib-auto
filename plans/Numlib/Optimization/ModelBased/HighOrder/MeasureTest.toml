namespace = "Optimization"
desc = '''
Approximate evaluation of the high-order measure and the termination test built on it
(Cartis–Gould–Toint Section 12.1.6, Step 1 of TRq/ARqp, Steps 2.4.x of Algorithm 12.2.3,
Chapters 13–14 analogues).

An algorithm never computes `φ = taylorMeasure D j δ S` (a global optimization problem); it computes
a displacement `d ∈ B_δ ∩ S` with `ς φ ≤ ΔT_j(D, d)` for a fixed `ς ∈ (0,1]` ("approximate
optimality displacement", (12.1.32)) and compares `ΔT_j(D, d)` with `ς ε_j δ_j^j / j!`. Passing the
comparison for all `j ≤ q` certifies `IsEpsDeltaApprox D S q ε δ`; failing it at some `j` certifies
`φ > ε_j δ_j^j/j! · ς`, i.e. `ΔT_j(D, d) > ς ε_j δ_j^j/j!`, the "large decrement" used by the step
computations. Strict/nonstrict convention: the test *passes* when `ΔT_j(D, d) ≤ ς ε_j δ^j/j!` for all
`j` (TRq (12.2.2) goes on when `>`; for ARqp the printed Step 1 goes on when `≥`, which we
normalize to `>` — see the Chapter 12 surface notes). Radii are a vector `δ : ℕ → ℝ` (TRq uses a
constant vector). Prototype: `drafts/cgt/plan-ch12/Proto.lean`. (Planned by plan-ch12.)
'''

[[node]]
id = "IsApproxMeasureStep"
kind = "def"
desc = '''
`IsApproxMeasureStep (D : FormalMultilinearSeries ℝ E ℝ) (j : ℕ) (δ : ℝ) (S : Set E) (ς : ℝ)
(d : E) : Prop := d ∈ Metric.closedBall 0 δ ∩ S ∧ ς * taylorMeasure D j δ S ≤ D.taylorDecrement j d`
(the book's `d_{k,j}` in (12.2.1), (12.2.26), `d^m_{k,j}` in (12.2.29), `d_{μ,j}` in (12.2.35)).
Lemma (part of node): then `D.taylorDecrement j d ≤ taylorMeasure D j δ S` (if `0 ∈ S`, `δ ≥ 0`).
'''
deps = ["taylorMeasure", "taylorMeasure_nonneg"]
source = "Cartis–Gould–Toint, (12.1.32), (12.2.1)"

[[node]]
id = "exists_isApproxMeasureStep"
kind = "theorem"
desc = '''
Existence of approximate optimality displacements. `[FiniteDimensional ℝ E]`, `S` closed,
`0 ∈ S`, `0 ≤ δ`, `ς ≤ 1`: there is `d` with `IsApproxMeasureStep D j δ S ς d` (an exact maximizer,
`exists_taylorMeasure_eq`). Refinement (part of node, used by the sharpness examples): if `S` is
star-shaped about `0` (e.g. convex with `0 ∈ S`) and `0 ≤ ς ≤ 1`, there is such a `d` with
`D.taylorDecrement j d = ς * taylorMeasure D j δ S` exactly (intermediate value theorem on
`t ↦ ΔT_j(t d*)`, `t ∈ [0,1]`, `d*` a maximizer). Without finite dimension: existence holds for
`ς < 1` (approximate sup), or when `taylorMeasure D j δ S = 0` (take `d = 0`).
'''
deps = ["IsApproxMeasureStep", "exists_taylorMeasure_eq"]
source = "Cartis–Gould–Toint, Section 12.1.6 (approximate global minimization)"

[[node]]
id = "MeasureTestPasses"
kind = "def"
desc = '''
`MeasureTestPasses (D : FormalMultilinearSeries ℝ E ℝ) (q : ℕ) (ς : ℝ) (ε δ : ℕ → ℝ) (d : ℕ → E) :
Prop := ∀ j ∈ Finset.Icc 1 q, D.taylorDecrement j (d j) ≤ ς * ε j * δ j ^ j / j !`
(all orders pass the Step-1 comparison; the algorithm terminates).
'''
deps = ["FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1 Step 1, Algorithm 12.2.2 Step 1"

[[node]]
id = "isEpsDeltaApprox_of_measureTestPasses"
kind = "theorem"
desc = '''
Certification. If `0 < ς`, `∀ j ∈ Icc 1 q, IsApproxMeasureStep D j (δ j) S ς (d j)` and
`MeasureTestPasses D q ς ε δ d`, then `IsEpsDeltaApprox D S q ε δ` (divide `ς φ ≤ ΔT ≤ ς ε δ^j/j!`
by `ς`). Prototype statement elaborates.
'''
deps = ["IsApproxMeasureStep", "MeasureTestPasses", "IsEpsDeltaApprox"]
source = "Cartis–Gould–Toint, Section 12.1.6 (the two inequalities after (12.1.32))"

[[node]]
id = "exists_lt_taylorDecrement_of_not_measureTestPasses"
kind = "theorem"
desc = '''
If `¬ MeasureTestPasses D q ς ε δ d` there is `j ∈ Icc 1 q` with
`ς * ε j * δ j ^ j / j! < D.taylorDecrement j (d j)`; if moreover `d j ∈ closedBall 0 (δ j) ∩ S`
(`0 ∈ S`) then also `ς ε_j δ_j^j/j! < taylorMeasure D j (δ j) S`. Choosing the *least* such `j`
gives the book's `j_k` (TRq) and the order at which ARqp's Step 1 jumps to Step 2.
'''
deps = ["MeasureTestPasses", "IsApproxMeasureStep"]
source = "Cartis–Gould–Toint, Algorithm 12.2.1 Step 1.2, Lemma 12.2.11 (first line of the proof)"
