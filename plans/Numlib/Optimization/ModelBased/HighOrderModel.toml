namespace = "Optimization"
desc = '''
The regularized `p`-th order model `m(s) = regularizedModel D p σ s = D.taylorSum p s +
σ/(p+1)! ‖s‖^{p+1}` used by the high-order adaptive-regularization methods ARqp (Cartis–Gould–Toint
§12.2.2) and ARqpIDA/ARqpEDA (§13.1.4, §13.3.2), stated for **arbitrary data** `D` (exact jet
`ftaylorSeries ℝ f x` or an inexact jet) so that one set of lemmas serves Chapters 12 and 13.
The model's own optimality measure at a trial step `s` is
`taylorMeasure (ftaylorSeries ℝ (regularizedModel D p σ) s) j δ univ` (the book's `φ^δ_{m,j}(s)`),
its `j`-th Taylor decrement `(ftaylorSeries ℝ (regularizedModel D p σ) s).taylorDecrement j d`
(`ΔT_{m,j}(s,d)`).

Contents: derivative bounds and Lipschitz constant of the model (Lemma 12.2.7), model decrease from
a Taylor decrease (Lemmas 12.2.8, 13.1.10), existence of an admissible approximate model minimizer
with explicit optimality radii (Lemmas 12.2.9, 13.1.12; proved directly from a global minimizer of
the model, which avoids the limiting argument of Algorithm 12.2.3), the exact-versus-inexact model
measure perturbation ((13.1.48)–(13.1.50)), the "radius inequality" relating the optimality measure at
the new iterate to the step length (Lemmas 12.2.11, 13.1.16, with an explicit error budget so that
exact, IDA and EDA versions are instances), and the resulting step-length lower bound (Lemmas
12.2.12, 13.1.17).

Consolidation note (plan-ch13): Chapter 12 is planned concurrently; its Lemmas 12.2.7–12.2.12 should
be the exact-data specializations of these nodes (`Dbar = D = ftaylorSeries ℝ f x`, errors `0`). If
the Chapter 12 plan introduces parallel backbone nodes, keep these data/error-general ones.
'''

[[node]]
id = "norm_iteratedFDeriv_regularizedModel_le"
kind = "theorem"
desc = '''
(Lemma 12.2.7, data-general.) Let `E` be a real inner product space, `p ≥ 1`, `σ ≥ 0`,
`D : FormalMultilinearSeries ℝ E ℝ` with `‖D i‖ ≤ L` for `i ∈ Icc 2 p`. Then
(a) `ContDiff ℝ p (regularizedModel D p σ)`;
(b) `IteratedFDerivLipschitzOn (regularizedModel D p σ) p σ univ` (the `p`-th derivative of the
Taylor part is constant, that of `σ/(p+1)! ‖s‖^{p+1}` is `σ`-Lipschitz);
(c) for `‖s‖ ≤ 1` and `ℓ ∈ Icc 2 p`: `‖iteratedFDeriv ℝ ℓ (regularizedModel D p σ) s‖ ≤ 3 L + σ`
(book (12.2.38); from `FormalMultilinearSeries.norm_iteratedFDeriv_taylorSum_le`, the sum bound
(A.33) `∑_{i≥ℓ} t^{i-ℓ}/(i-ℓ)! ≤ e ≤ 3`, and `norm_iteratedFDeriv_norm_pow_succ_le`).
'''
deps = ["regularizedModel", "FormalMultilinearSeries.norm_iteratedFDeriv_taylorSum_le", "contDiff_norm_pow_succ", "norm_iteratedFDeriv_norm_pow_succ_le", "sum_pow_div_factorial_le_one_add_two_mul"]
source = "Cartis–Gould–Toint, Lemma 12.2.7"

[[node]]
id = "sub_regularizedModel_ge_of_taylorDecrement_ge"
kind = "theorem"
desc = '''
(Lemma 12.2.8, data-general.) Under the hypotheses of `norm_iteratedFDeriv_regularizedModel_le`,
let `m = regularizedModel D p σ`, `‖s‖ ≤ 1`, `α > 0`, `j ∈ Icc 1 p`,
`δ ∈ (0, min 1 (α / (4 (3 L + σ)))]`, `d ∈ closedBall 0 δ` with
`(ftaylorSeries ℝ m s).taylorDecrement j d ≥ α δ^j / j!`. Then `m s - m (s + d) ≥ α δ^j / j! / 2`.
Contrapositive corollary (part of node): if `s` is a global minimizer of `m` (`IsMinOn m univ s`) and
`‖s‖ ≤ 1`, then for every such `δ`, `taylorMeasure (ftaylorSeries ℝ m s) j δ univ ≤ α δ^j / j!`.
Proof: (A.19) for `m` with Lipschitz constant `σ` (part (b)), part (c) for the orders `j+1..p`,
and (A.33) `∑_{ℓ=j+1}^{p+1} δ^ℓ/ℓ! ≤ 2 δ^{j+1}/j!`.
'''
deps = ["norm_iteratedFDeriv_regularizedModel_le", "abs_sub_taylorPolynomial_le_of_lipschitz", "sum_pow_div_factorial_Icc_succ_le", "taylorMeasure_nonneg"]
source = "Cartis–Gould–Toint, Lemma 12.2.8"

[[node]]
id = "regularizedModel_decrease_ge_of_taylorDecrement_ge"
kind = "theorem"
desc = '''
(Lemma 13.1.10, data-general; the same estimate at the origin of the model, where the model's Taylor
data is `D` itself plus the regularization.) Let `p ≥ 1`, `j ∈ Icc 1 p`, `σ ≥ 0`, `‖D ℓ‖ ≤ L` for
`ℓ ∈ Icc (j + 1) p`, `α > 0`, `δ ∈ (0, min 1 (α / (4 max L σ))]`, `d ∈ closedBall 0 δ` with
`D.taylorDecrement j d ≥ α δ^j / j!`. Then
`regularizedModel D p σ 0 - regularizedModel D p σ d ≥ α δ^j / j! / 2`
(the book's `Δm̄_k(d) ≥ ½ α δ^j/j!`, (13.1.65)). Pure polynomial estimate with (A.33).
'''
deps = ["regularizedModel", "FormalMultilinearSeries.taylorDecrement", "sum_pow_div_factorial_Icc_succ_le"]
source = "Cartis–Gould–Toint, Lemma 13.1.10"

[[node]]
id = "taylorMeasure_eq_zero_of_isLocalMin"
kind = "theorem"
desc = '''
For `g : E → ℝ` with a local minimum at `s` (`IsLocalMin g s`), `δ ≥ 0`, and `j ∈ {1, 2}` with
`ContDiffAt ℝ j g s`: `taylorMeasure (ftaylorSeries ℝ g s) j δ univ = 0` (first order: `fderiv = 0`;
second order: additionally `iteratedFDeriv ℝ 2 g s (fun _ => d) ≥ 0`, so every decrement
`-(∇g[d] + ½∇²g[d,d]) ≤ 0`, attained at `d = 0`). This is the `j ≤ 2` part of Theorem 12.1.4
(stated here so that the step-existence lemma below does not depend on the Chapter 12 plan).
'''
deps = ["taylorMeasure", "taylorMeasure_nonneg", "IsLocalMin.iteratedFDeriv_two_nonneg"]
source = "Cartis–Gould–Toint, Theorem 12.1.4 (orders one and two)"

[[node]]
id = "exists_highOrderStep"
kind = "theorem"
desc = '''
(Existence of an admissible ARqp / ARqpIDA step: Lemmas 12.2.9 and 13.1.12, data-general.) Let `E`
be a finite-dimensional real inner product space, `1 ≤ q ≤ p`, `σ > 0`, `‖D i‖ ≤ L` for
`i ∈ Icc 2 p` (`L ≥ 0`), `θ ∈ (0,1)`, `ς ∈ (0,1]`, `ε : ℕ → ℝ` with `ε j ∈ (0,1]` for `j ∈ Icc 1 q`,
and `m = regularizedModel D p σ`. Then there are `s : E`, radii `δs : ℕ → ℝ` and displacements
`dm : ℕ → E` with: `IsMinOn m univ s` (so `m 0 - m s ≥ m 0 - m d` for every `d`, (13.1.55));
and either `1 ≤ ‖s‖`, or for all `ℓ ∈ Icc 1 q`: `δs ℓ ∈ (0,1]`, `dm ℓ ∈ closedBall 0 (δs ℓ)`,
`ς * taylorMeasure (ftaylorSeries ℝ m s) ℓ (δs ℓ) univ ≤ (ftaylorSeries ℝ m s).taylorDecrement ℓ (dm ℓ)
≤ ς * θ * ε ℓ * δs ℓ ^ ℓ / ℓ!` ((12.2.29)/(13.1.57)), with `δs ℓ = 1` for `ℓ ≤ min 2 q` ((13.1.69))
and `δs ℓ = min 1 (ς θ ε ℓ / (4 (3 L + σ))) ≥ min 1 (ς θ ε ℓ / (24 max L σ))` for `ℓ ∈ Icc 3 q`
((12.2.45), (13.1.70); the `min 1` is vacuous when `max L σ ≥ 1`, as in the book where `L ≥ 1`).
Proof: global minimizer (`exists_isMinOn_regularizedModel`); orders `≤ 2` by
`taylorMeasure_eq_zero_of_isLocalMin`; orders `≥ 3` by the corollary of
`sub_regularizedModel_ge_of_taylorDecrement_ge` with `α = ς θ ε ℓ`; `dm ℓ` a maximizer
(`exists_taylorMeasure_eq`).
'''
deps = ["exists_isMinOn_regularizedModel", "taylorMeasure_eq_zero_of_isLocalMin", "sub_regularizedModel_ge_of_taylorDecrement_ge", "exists_taylorMeasure_eq", "norm_iteratedFDeriv_regularizedModel_le"]
source = "Cartis–Gould–Toint, Lemmas 12.2.9, 13.1.12 (existence part)"

[[node]]
id = "taylorMeasure_regularizedModel_le_add"
kind = "theorem"
desc = '''
((13.1.48)–(13.1.50).) Let `E` be a real inner product space, `JetApprox D Dbar p err`, `σ ≥ 0`,
`s : E`, `δ ∈ [0,1]`, `j ∈ Icc 1 p`, `m = regularizedModel D p σ`, `mbar = regularizedModel Dbar p σ`.
Then `taylorMeasure (ftaylorSeries ℝ m s) j δ univ ≤ taylorMeasure (ftaylorSeries ℝ mbar s) j δ univ +
∑ ℓ ∈ Icc 1 j, δ^ℓ / ℓ! * ∑ i ∈ Icc ℓ p, err i * ‖s‖^(i - ℓ) / (i - ℓ)!` (and symmetrically).
Corollaries (part of node): (13.1.49) if `err i ≤ κ * κs * ‖s‖^(p - i + 1)` for `i ∈ Icc 1 p` the
excess is `≤ 3 κ κs ∑ ℓ ∈ Icc 1 j, δ^ℓ/ℓ! ‖s‖^(p - ℓ + 1)`; (13.1.50) if `‖s‖ ≤ 1` and `err i ≤ e` it
is `≤ 6 e`. Proof: `m - mbar = (D - Dbar).taylorSum p` (the regularization cancels; both are `C^p`),
so the order-`ℓ` Taylor data differ by `iteratedFDeriv ℝ ℓ ((D - Dbar).taylorSum p) s`, bounded by
`FormalMultilinearSeries.norm_iteratedFDeriv_taylorSum_le`; then `abs_taylorMeasure_sub_le`.
'''
deps = ["JetApprox", "FormalMultilinearSeries.norm_iteratedFDeriv_taylorSum_le", "abs_taylorMeasure_sub_le", "norm_iteratedFDeriv_regularizedModel_le", "sum_pow_div_factorial_le_two_mul_pow"]
source = "Cartis–Gould–Toint, (13.1.48), (13.1.49), (13.1.50)"

[[node]]
id = "radius_inequality_of_measure_gt"
kind = "theorem"
desc = '''
(Lemmas 12.2.11 and 13.1.16, with an explicit error budget.) Let `E` be a real inner product space,
`f : E → ℝ` with `ContDiff ℝ p f` and `IteratedFDerivLipschitzOn f p Lp univ`, `x s : E`,
`D = ftaylorSeries ℝ f x`, `JetApprox D Dbar p err` with `err i ≤ κ * κs * ‖s‖^(p - i + 1)` for
`i ∈ Icc 1 p` (`κ κs ≥ 0`), `0 ≤ σ ≤ σmax`, `j ∈ Icc 1 p`, `δ ∈ (0,1]`, `ε ≥ 0`, reals `a θ e₀`.
Suppose
(h₁) `a * ε * δ^j / j! - e₀ < taylorMeasure (ftaylorSeries ℝ f (x + s)) j δ univ` (the true measure
at the new iterate is not small), and
(h₂) `taylorMeasure (ftaylorSeries ℝ (regularizedModel Dbar p σ) s) j δ univ ≤ θ * ε * δ^j / j!`
(the step approximately minimizes the inexact model at order `j`, radius `δ`).
Then `(a - θ) * ε * δ^j / j! ≤ (Lp + σmax + 3 * κ * κs) * ∑ ℓ ∈ Icc 1 j, δ^ℓ / ℓ! * ‖s‖^(p - ℓ + 1)
+ e₀`.
Instances: exact ARqp (Lemma 12.2.11): `Dbar = D`, `κ = 0`, `a = 1`, `e₀ = 0` (non-approximate
optimality at `x + s`); ARqpIDA (Lemma 13.1.16): `κ = κ_{∇,max}`, `a = 1`, `e₀ = 0`; ARqpEDA
(corrected Lemma 13.1.16 for EDA, see Chapter 13 §3 plan): `κ = 1`, `a = ς/2`,
`e₀ = κs ∑ δ^ℓ/ℓ! ‖s‖^{p-ℓ+1}` (inexact Step-1 test at `x + s` with the inherited accuracies).
Proof: compare the Taylor data of `f` at `x + s` with that of `regularizedModel D p σ` at `s` order
by order: `‖∇^ℓ f(x+s) - ∇^ℓ_s T_{f,p}(x,s)‖ ≤ Lp ‖s‖^{p-ℓ+1}/(p-ℓ+1)!` ((A.20)) and
`σ/(p+1)! ‖∇^ℓ ‖s‖^{p+1}‖ ≤ σ ‖s‖^{p-ℓ+1}/(p-ℓ+1)!` ((B.4.1)); `abs_taylorMeasure_sub_le`; then
`taylorMeasure_regularizedModel_le_add` (13.1.49) and (h₂). (The book's (12.2.56) writes
`‖s_k‖^{p-j+1}` for `‖s_k‖^{p-ℓ+1}`; harmless typo.)
'''
deps = ["taylorMeasure_regularizedModel_le_add", "norm_iteratedFDeriv_sub_taylorPolynomial_le_of_lipschitz", "norm_iteratedFDeriv_norm_pow_succ_le", "abs_taylorMeasure_sub_le", "taylorPolynomial"]
source = "Cartis–Gould–Toint, Lemmas 12.2.11, 13.1.16"

[[node]]
id = "norm_step_ge_of_radius_inequality"
kind = "theorem"
desc = '''
(The real-variable core of Lemmas 12.2.12 and 13.1.17.) Let `1 ≤ j ≤ p`, `A > 0`, `C > 0`,
`δ ∈ (0,1]`, `t ∈ (0,1]` with `A * δ^j ≤ C * ∑ ℓ ∈ Icc 1 j, δ^ℓ / ℓ! * t^(p - ℓ + 1)`. Then
(i) if `t ≤ δ`: `A ≤ 2 * C * t^(p - j + 1)` (since `χ_j(u) = ∑_{ℓ≤j} u^ℓ/ℓ! ≤ 2u^j` for `u ≥ 1`,
(A.35)); (ii) if `δ < t`: `A * δ^(j-1) ≤ 2 * C * t^p` (since `χ_j(u) ≤ 2u` for `u ≤ 1`, (A.34)).
Consequence (part of node, used with `A = (a - θ) ε/j!`): if `δ = 1`, or `δ ≥ κ ε` with
`κ ∈ (0,1]`, `ε ∈ (0,1]`, then `t ≥ (A/(2C))^{1/(p-j+1)}` resp.
`t ≥ (A κ^{j-1} ε^{j-1}/(2C))^{1/p}`, using `1/(p-j+1) ≤ j/p` for `1 ≤ j ≤ p` (footnote 77) to
merge the two cases into the second bound when `A/(2C) ≤ 1`.
'''
deps = ["sum_pow_div_factorial_le_two_mul_pow"]
source = "Cartis–Gould–Toint, Lemmas 12.2.12, 13.1.17"
