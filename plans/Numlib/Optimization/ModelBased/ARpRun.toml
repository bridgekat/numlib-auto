namespace = "Optimization"
desc = '''
The adaptive-regularization method with `p`-th order Taylor models (Cartis–Gould–Toint Algorithm
4.1.1, ARp) as a *backbone* run predicate whose Step-1 termination test is a parameter. Rationale:
the book applies "ARp with a different Step 1" several times — ARpLE (Algorithm 5.1.1: ARp on
`Φ_ℓ = ‖r‖^ℓ/ℓ` with residual-scaled tests), the measure-dominated analysis of §5.3 (ARp run with no
test at all, `test = fun _ => False`) and Chapter 4 itself (the standard first- to third-order
tests). The rules of Steps 2–4 do not depend on the test, and neither do the one-iteration
consequences (Lemmas 4.1.1–4.1.4), so they are proved once here. The Chapter 4 surface
(`CartisGouldToint.Chapter04.algorithm_4_1_1`, planned concurrently by plan-ch04) should be an
instance (`test` = (4.1.5)–(4.1.9)); the consolidation step must dedupe the two plans (this module
was planned by plan-ch05 because no general ARp run exists in the core).

Conventions. `E` real inner product space (finite-dimensional where existence of model minimizers
is needed). `q ∈ {1, 2, 3}` is the criticality order sought (book: `ε₂ = ε₃ = ∞` ↔ `q = 1`,
`ε₂ < ∞ = ε₃` ↔ `q = 2`, both finite ↔ `q = 3`): the second-order step condition (4.1.12) is imposed
iff `2 ≤ q`, the third-order one (4.1.13) iff `3 ≤ q`. The model is
`m_k = regularizedModel (ftaylorSeries ℝ f (x k)) p (σ k)` (core `TaylorModel`), the ratio is
`reductionRatio f (x k) (s k) ((ftaylorSeries ℝ f (x k)).taylorDecrement p (s k))` (4.1.15), the
update is `ARUpdate` (4.1.16).

Source issue (affects Chapter 4 and ARpLE, reported): for `q = 3` an admissible step need not
exist. Counterexample: `n = 1`, `p = 3`, `f(x) = a x²/2 + b x³/6 + x⁴` with `0 < a ≤ ε₂`,
`|b| > ε₃`, `x₀ = 0`, `σ₀ ≥ b²/(3a)`: the test (4.1.5)–(4.1.9) fails at `x₀` (`M₀ = {±1}`,
`|∇³f(0)| = |b| > ε₃`) but `m₀(s) = s²(a/2 + b s/6 + σ₀ s²/24) ≥ 0 = m₀(0)`, so (4.1.10) has no
solution and no run exists. Hence existence is planned unconditionally only for `q ≤ 2`, and for
`q = 3` under the hypothesis that admissible steps exist whenever the test fails.
'''

[[node]]
id = "ARpConstants"
kind = "def"
desc = '''
Structure of ARp algorithm constants (Algorithm 4.1.1, Step 0): fields `σ₀ σmin η₁ η₂ γ₁ γ₂ γ₃ θ₁ θ₂ θ₃ : ℝ`
with `0 < σmin ≤ σ₀`, `θ₁ θ₂ θ₃ ∈ (0, 1]`, `0 < η₁ ≤ η₂ < 1`, `0 < γ₁ < 1 < γ₂ < γ₃`.
(The surface `CartisGouldToint.Chapter02.ARParams` plus `θ`'s; a coercion/constructor from it is
part of the node.)
'''
source = "Cartis–Gould–Toint, Algorithm 4.1.1 (Step 0)"

[[node]]
id = "smallCurvatureDirections"
kind = "def"
desc = '''
`smallCurvatureDirections (A : E [×2]→L[ℝ] ℝ) (c : ℝ) : Set E := {d | ‖d‖ = 1 ∧ |A ![d, d]| ≤ c}`.
Instances: `M_0 = smallCurvatureDirections (iteratedFDeriv ℝ 2 f x₀) ε₂` (Step 0 of Algorithm 4.1.1),
`M_{k+1} = smallCurvatureDirections (iteratedFDeriv ℝ 2 m_k (s k)) (θ₂ ‖s k‖^(p-1))` (4.1.14),
and the book's `𝒵_ε` ((4.1.4), (5.1.7)) with `A = ∇²f(x_ε)` (scaled by `‖r(x_ε)‖^{ℓ-1}` in §5.1).
'''
source = "Cartis–Gould–Toint, (4.1.14), (5.1.7)"

[[node]]
id = "IsARpStep"
kind = "def"
desc = '''
Step conditions of one ARp iteration (Step 2 of Algorithm 4.1.1). For `f : E → ℝ`, `p q : ℕ`,
`P : ARpConstants`, point `x`, weight `σ` and step `s`, with `m := regularizedModel
(ftaylorSeries ℝ f x) p σ`:
`IsARpStep f p P q x σ s :↔ m s < m 0` (4.1.10) `∧ ‖fderiv ℝ m s‖ ≤ θ₁ ‖s‖^p` (4.1.11)
`∧ (2 ≤ q → -θ₂ ‖s‖^(p-1) ≤ minCurvature (iteratedFDeriv ℝ 2 m s))` (4.1.12)
`∧ (3 ≤ q → ∀ d ∈ smallCurvatureDirections (iteratedFDeriv ℝ 2 m s) (θ₂ ‖s‖^(p-1)),
|iteratedFDeriv ℝ 3 m s ![d, d, d]| ≤ θ₃ ‖s‖^(p-2))` (4.1.13) (vacuous when the set is empty).
'''
deps = ["ARpConstants", "smallCurvatureDirections", "regularizedModel", "minCurvature"]
source = "Cartis–Gould–Toint, (4.1.10)–(4.1.14)"

[[node]]
id = "IsARpRun"
kind = "def"
desc = '''
ARp run with a generic termination test. For `f : E → ℝ`, `p q : ℕ`, `P : ARpConstants`,
`test : ℕ → Prop` (the Step-1 test at iteration `k`; it may refer to the run, e.g. through
`M_k`), and sequences `x s : ℕ → E`, `σ : ℕ → ℝ`:
`IsARpRun f p P q test x s σ :↔ σ 0 = P.σ₀ ∧ UntilHit test (fun k => IsARpStep f p P q (x k) (σ k)
(s k) ∧ x (k+1) = (if P.η₁ ≤ ρ k then x k + s k else x k) ∧ ARUpdate P.η₁ P.η₂ P.γ₁ P.γ₂ P.γ₃ P.σmin
(ρ k) (σ k) (σ (k+1)))`, where `ρ k = reductionRatio f (x k) (s k)
((ftaylorSeries ℝ f (x k)).taylorDecrement p (s k))` (4.1.15). Successful iterations:
`succ k :↔ P.η₁ ≤ ρ k`. Basic API (part of node): `σmin ≤ σ k` before termination
(`le_sigma_of_arUpdate`); on successful iterations before termination
`f (x k) - f (x (k+1)) ≥ η₁ (T_p(x_k,0) - T_p(x_k,s_k)) > 0` (`sub_le_of_le_reductionRatio`,
`taylorDecrement_ge_of_regularizedModel_lt`), on unsuccessful ones `x (k+1) = x k`; hence
`f ∘ x` is antitone up to termination.
'''
deps = ["IsARpStep", "UntilHit", "ARUpdate", "reductionRatio", "le_sigma_of_arUpdate", "sub_le_of_le_reductionRatio", "taylorDecrement_ge_of_regularizedModel_lt"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1, Algorithm 5.1.1"

[[node]]
id = "exists_isARpStep"
kind = "theorem"
desc = '''
`[FiniteDimensional ℝ E]`, `ContDiff ℝ p f`, `p ≥ 1`, `σ > 0`, `q ≤ 2` (and `p ≥ 2` if `q = 2`).
If `fderiv ℝ f x ≠ 0`, or `q = 2` and `minCurvature (iteratedFDeriv ℝ 2 f x) < 0`, then there is
`s` with `IsARpStep f p P q x σ s`: any global minimizer of the model
(`exists_isMinOn_regularizedModel`) works, since `0` is then not a second-order critical point of
`m` (`∇m(0) = ∇f(x)`, `∇²m(0) = ∇²f(x)` for `p ≥ 2`, the regularization term having vanishing
first and second derivatives at `0` when `p + 1 > 2`). For `q = 3` no such statement holds (see the
module counterexample).
'''
deps = ["IsARpStep", "exists_isMinOn_regularizedModel", "fderiv_regularizedModel"]
source = "Cartis–Gould–Toint, Section 4.1.1 (step computation)"

[[node]]
id = "exists_isARpRun"
kind = "theorem"
desc = '''
Existence of runs. Let `test : (ℕ → E) → (ℕ → E) → (ℕ → ℝ) → ℕ → Prop` be a termination test that
depends on the run only through its values at indices `≤ k` (and on `s, σ` at indices `< k`), and
suppose that whenever `test` fails at a reachable state, an admissible step exists
(`∃ s, IsARpStep f p P q (x k) (σ k) s`). Then for every `x₀` there is a run with `x 0 = x₀` and
`IsARpRun f p P q (test x s σ) x s σ`. Instances: `q ≤ 2` with `test` implying approximate
first-/second-order criticality whenever it holds false only at non-critical points (via
`exists_isARpStep`); `test = fun _ => False` needs `∇f(x_k) ≠ 0` along the run. Proof:
`exists_run_of_forall_exists` (history-dependent variant) with states `(x_k, σ_k)` and the update
choosing `σ_{k+1}` as the left end of the interval of `ARUpdate`.
'''
deps = ["IsARpRun", "exists_isARpStep", "exists_run_of_forall_exists"]
source = "Cartis–Gould–Toint, Algorithm 4.1.1 (well-posedness)"

[[node]]
id = "IsARpRun.sigma_le"
kind = "theorem"
desc = '''
Lemma 4.1.2 for any test. If `ContDiff ℝ p f` and `IteratedFDerivLipschitzOn f p L univ`
(`L ≥ 0`), then for every `k` up to the first termination index (`∀ j < k, ¬ test j`),
`σ k ≤ σmax := max P.σ₀ (P.γ₃ * L / (1 - P.η₂))` (4.1.19).
Proof: `abs_reductionRatio_sub_one_le_of_lipschitz` with `c = 1/(p+1)!` and
`sigma_le_max_of_arUpdate`.
'''
deps = ["IsARpRun", "abs_reductionRatio_sub_one_le_of_lipschitz", "sigma_le_max_of_arUpdate"]
source = "Cartis–Gould–Toint, Lemma 4.1.2, (5.1.60)"

[[node]]
id = "abs_iteratedFDeriv_apply_le_of_regularizedModel"
kind = "theorem"
desc = '''
One-iteration third-order bound (book (4.1.30)). `p ≥ j`, `j ∈ {2, 3}`, `f` `C^p` with
`IteratedFDerivLipschitzOn f p L univ`, `m = regularizedModel (ftaylorSeries ℝ f x) p σ`,
`0 ≤ σ ≤ σmax`, `‖d‖ = 1`: `|iteratedFDeriv ℝ j f (x + s) ![d,…,d]| ≤ (L + σmax) / (p - j + 1)! *
‖s‖ ^ (p - j + 1) + |iteratedFDeriv ℝ j m s ![d,…,d]|`. Uses (A.20)
(`norm_iteratedFDeriv_sub_taylorPolynomial_le_of_lipschitz`) and
`norm_iteratedFDeriv_norm_pow_le` (Lemma B.4.1 for the integer power `p + 1`, where it is true).
'''
deps = ["regularizedModel", "norm_iteratedFDeriv_sub_taylorPolynomial_le_of_lipschitz", "norm_iteratedFDeriv_norm_pow_le"]
source = "Cartis–Gould–Toint, (4.1.30)"

[[node]]
id = "IsARpRun.step_lower_bounds"
kind = "theorem"
desc = '''
Lemma 4.1.3 for any test, under `ContDiff ℝ p f`, `IteratedFDerivLipschitzOn f p L univ`, for a
successful iteration `k` before termination (so `x (k+1) = x k + s k`), with `σmax` of
`IsARpRun.sigma_le`:
(4.1.20) `‖s k‖^p ≥ p!/(L + σmax + θ₁ p!) * ‖fderiv ℝ f (x (k+1))‖`;
(4.1.21) if `2 ≤ q`: `‖s k‖^(p-1) ≥ (p-1)!/(L + σmax + θ₂ (p-1)!) * max 0
(-minCurvature (iteratedFDeriv ℝ 2 f (x (k+1))))`;
(4.1.22) if `3 ≤ q`: for every `d ∈ M_{k+1}` (`smallCurvatureDirections (∇²m_k(s_k)) (θ₂‖s_k‖^{p-1})`),
`‖s k‖^(p-2) ≥ (p-2)!/(L + σmax + θ₃ (p-2)!) * |iteratedFDeriv ℝ 3 f (x (k+1)) ![d,d,d]|`;
(4.1.23) if `2 ≤ q`: for every `d ∈ M_{k+1}`, `|iteratedFDeriv ℝ 2 f (x (k+1)) ![d,d]| ≤
‖s k‖^(p-1) / κs2` with `κs2 = (p-1)!/(L + σmax + θ₂ (p-1)!)`.
'''
deps = ["IsARpRun.sigma_le", "norm_fderiv_le_of_regularizedModel", "minCurvature_ge_of_regularizedModel", "abs_iteratedFDeriv_apply_le_of_regularizedModel"]
source = "Cartis–Gould–Toint, Lemma 4.1.3, (5.1.18)"

[[node]]
id = "IsARpRun.decrease_ge"
kind = "theorem"
desc = '''
Lemma 4.1.4 for any test (successful `k` before termination, same hypotheses):
(4.1.37) `f (x k) - f (x (k+1)) ≥ η₁ σmin/(p+1)! ‖s k‖^(p+1)`, and hence
(4.1.31) `≥ κ₁ ‖fderiv ℝ f (x (k+1))‖^((p+1)/p)`,
(4.1.33) (`2 ≤ q`) `≥ κ₂ (max 0 (-minCurvature (∇²f(x_{k+1}))))^((p+1)/(p-1))`,
(4.1.35) (`3 ≤ q`) `≥ κ₃ |∇³f(x_{k+1})[d]³|^((p+1)/(p-2))` for all `d ∈ M_{k+1}`,
with `κ_j = η₁ σmin/(p+1)! * ((p-j)!/(L + σmax + θ_j (p-j)!))^((p+1)/(p-j+1))` (j = 1, 2, 3, the
book's (4.1.32), (4.1.34), (4.1.36)); real exponents (`Real.rpow`).
'''
deps = ["IsARpRun.step_lower_bounds", "taylorDecrement_ge_of_regularizedModel_lt", "sub_le_of_le_reductionRatio"]
source = "Cartis–Gould–Toint, Lemma 4.1.4, (5.1.15)–(5.1.17)"

[[node]]
id = "IsARpRun.succ_count"
kind = "theorem"
desc = '''
Lemma 2.4.1 for ARp runs (any test): if `k` is before termination and `σ j ≤ σmax` for `j ≤ k+1`,
then `(k + 1 : ℝ) ≤ |successSet succ k| (1 + |log γ₁|/log γ₂) + log (σmax/σ₀)/log γ₂`.
Direct from `succ_le_of_arUpdate`.
'''
deps = ["IsARpRun", "succ_le_of_arUpdate"]
source = "Cartis–Gould–Toint, Lemma 2.4.1 (applied to ARp)"
