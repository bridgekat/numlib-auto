namespace = "Optimization"
desc = '''
Generic runs of adaptive-regularization methods with `p`-th order Taylor models (Cartis–Gould–Toint
Algorithms 2.4.1, 3.3.1, 4.1.1, 5.1.1, 6.2.1, 6.2.2, 6.3.1 and the inner loops of 7.2.1 — the
Steps 3–4 "acceptance + regularization update" of all of them are literally the same; only the
Step-1 termination test and the Step-2 conditions on the trial step differ).

**Interface (planned here because Chapters 6–7 need it four times; the Chapter 4 plan of ARp should
instantiate it rather than restate it — consolidation note).** A run is
`IsARRun f p σ₀ σmin η₁ η₂ γ₁ γ₂ γ₃ stepOK test x s σ`, where `stepOK : E → ℝ → E → Prop` is the
Step-2 admissibility of the trial step `s` at `(x, σ)` (closing over the method's tolerances) and
`test : E → Prop` is the Step-1 termination test at the current iterate. The model is
`regularizedModel (ftaylorSeries ℝ f x) p σ`, the ratio is `reductionRatio f x s
((ftaylorSeries ℝ f x).taylorDecrement p s)` (book: `ρ_k = (f(x_k) - f(x_k+s_k)) / (T_{f,p}(x_k,0)
- T_{f,p}(x_k,s_k))`), success is `η₁ ≤ ρ_k`, and the update is `ARUpdate`.

The three generic lemmas below replace, for every such method, the book's "Lemmas 4.1.1–4.1.2
continue to hold" and "the remainder of the proof is identical to that of Theorem 4.1.5": all they
need from `stepOK` is that the trial point is in a convex set `C` on which `f` has a Lipschitz
`p`-th derivative and that the model decreases (`m(s) < m(0)`). The complexity skeleton is stated
for an arbitrary nonincreasing *potential* `φ` (not only `f`): ARpLE(-CC) counts decreases of
`‖r(x_k)‖^{1/2^i}`, and Chapter 7 decreases of `‖r(x_k, t)‖`.

Evaluation counts follow `Complexity/Basic`: `funEvalCount k = k + 1`, `derivEvalCount succ k`.
'''

[[node]]
id = "IsARRun"
kind = "def"
desc = '''
`IsARRun (f : E → ℝ) (p : ℕ) (σ₀ σmin η₁ η₂ γ₁ γ₂ γ₃ : ℝ) (stepOK : E → ℝ → E → Prop)
(test : E → Prop) (x s : ℕ → E) (σ : ℕ → ℝ) : Prop :=
σ 0 = σ₀ ∧ UntilHit (fun k => test (x k)) (fun k => stepOK (x k) (σ k) (s k) ∧
x (k + 1) = (if η₁ ≤ ρ k then x k + s k else x k) ∧ ARUpdate η₁ η₂ γ₁ γ₂ γ₃ σmin (ρ k) (σ k)
(σ (k + 1)))` with `ρ k := reductionRatio f (x k) (s k) ((ftaylorSeries ℝ f (x k)).taylorDecrement
p (s k))`; `arSucc f p x s η₁ k : Prop := η₁ ≤ ρ k` (success predicate, part of node). Lemma:
`IsARRun.mono_step` (a stronger `stepOK` gives a run of the weaker method).
'''
deps = ["UntilHit", "ARUpdate", "reductionRatio", "regularizedModel", "FormalMultilinearSeries.taylorDecrement"]
source = "Cartis–Gould–Toint, Algorithms 2.4.1, 4.1.1, 6.2.1 (Steps 3–4)"

[[node]]
id = "IsARRun.sigma_le"
kind = "theorem"
desc = '''
Iterates stay feasible and the regularization stays bounded (Lemma 4.1.2 for every AR-type method,
(4.1.19)). Hypotheses: `C` convex, `D ⊇ C` open, `ContDiffOn ℝ p f D`, `IteratedFDerivHolderOn f p
L 1 C` (Lipschitz, `0 ≤ L`), `p ≥ 1`, constants as in (2.4.2) (`0 < σmin ≤ σ₀`, `0 < η₁ ≤ η₂ < 1`,
`0 < γ₁ < 1 < γ₂ ≤ γ₃`), `x 0 ∈ C`, and `stepOK x σ s → x ∈ C → x + s ∈ C ∧
regularizedModel (ftaylorSeries ℝ f x) p σ s < regularizedModel (ftaylorSeries ℝ f x) p σ 0`.
Conclusion: for every `k` with `∀ j < k, ¬ test (x j)` (i.e. up to and including the first
termination index): `x k ∈ C`, `σmin ≤ σ k`, and `σ k ≤ max σ₀ (γ₃ * L / (1 - η₂))`.
Proof: `taylorDecrement_ge_of_regularizedModel_lt`, `abs_reductionRatio_sub_one_le_of_lipschitz`
with `c = 1/(p+1)!` (so `σ ≥ L/(1-η₂) ⇒ η₂ ≤ ρ`), `sigma_le_max_of_arUpdate`,
`le_sigma_of_arUpdate`.
'''
deps = ["IsARRun", "taylorDecrement_ge_of_regularizedModel_lt", "abs_reductionRatio_sub_one_le_of_lipschitz", "sigma_le_max_of_arUpdate", "le_sigma_of_arUpdate", "IteratedFDerivHolderOn"]
source = "Cartis–Gould–Toint, Lemma 4.1.2, (4.1.19); Section 6.2.2 (\"Lemmas 4.1.1 and 4.1.2 continue to hold\")"

[[node]]
id = "IsARRun.sub_ge_of_succ"
kind = "theorem"
desc = '''
Decrease on successful iterations (Lemma 4.1.1 + ratio test, (4.1.37)): under the step hypothesis
of `IsARRun.sigma_le` (model decrease), for `k` before termination with `arSucc … k`:
`f (x k) - f (x (k+1)) ≥ η₁ * σ k / (p+1)! * ‖s k‖ ^ (p+1) > 0` (so `≥ η₁ σmin/(p+1)! ‖s_k‖^{p+1}`);
for unsuccessful `k`, `x (k+1) = x k`. Hence `k ↦ f (x k)` is antitone up to the first
termination index (part of node).
'''
deps = ["IsARRun", "taylorDecrement_ge_of_regularizedModel_lt", "sub_le_of_le_reductionRatio"]
source = "Cartis–Gould–Toint, Lemma 4.1.1, (4.1.37)"

[[node]]
id = "IsARRun.exists_isFirstHit_of_decrease"
kind = "theorem"
desc = '''
Complexity skeleton of AR-type methods (the common end of the proofs of Theorems 2.4.4, 3.3.5,
4.1.5, 5.1.7, 6.2.3, 6.2.5, 6.3.1). Let `IsARRun … x s σ` with valid constants, `σmax ≥ σ₀` with
`σ k ≤ σmax` for all `k` up to the first termination index, and a potential `φ : ℕ → ℝ` with:
`φ (k+1) ≤ φ k` and `φ (k+1) = φ k` if `k` is unsuccessful (for `k` before termination);
`φlow ≤ φ k` for all `k` up to termination; and `δ > 0` with `φ k - φ (k+1) ≥ δ` whenever `k` is
successful, `k` is before termination and `¬ test (x (k+1))` (the test fails at the new iterate).
Then there is `kε` with `IsFirstHit (fun k => test (x k)) kε`,
`(funEvalCount kε : ℝ) ≤ κA * (φ 0 - φlow) / δ + κC` and
`(derivEvalCount (arSucc …) kε : ℝ) ≤ (φ 0 - φlow) / δ + 2`, where
`κA = 1 + |log γ₁| / log γ₂` and `κC = (|log γ₁| + log (σmax / σ₀)) / log γ₂ + 2` (book (4.1.46)).
Proof: successes `j ≤ k - 2` before termination are "good", so `|S_{k-1}| ≤ (φ0 - φlow)/δ + 1`
(`card_mul_le_of_decrease`); Lemma 2.4.1 (`succ_le_of_arUpdate`) bounds `k`;
`exists_hit_le_of_counting` gives the hit. (With `φ = f`, `δ = κ min_j ε_j^{(p+1)/(p-j+1)}` this
is Theorem 4.1.5's / 6.2.3's arithmetic; the `+2` accounts for the initial evaluation and the last
successful iteration, whose new iterate passes the test.)
'''
deps = ["IsARRun", "succ_le_of_arUpdate", "card_mul_le_of_decrease", "exists_hit_le_of_counting", "IsFirstHit", "funEvalCount"]
source = "Cartis–Gould–Toint, proofs of Theorems 4.1.5, 6.2.3, 6.2.5, 6.3.1"
