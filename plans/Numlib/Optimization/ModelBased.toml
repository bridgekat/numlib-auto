desc = '''
Building blocks of model-based methods (trust-region and adaptive-regularization families of
Cartis–Gould–Toint Chapters 2–7 and 12–14), stated for sequences on a real normed / inner product
space and independent of the particular model:

* `RatioTest`: the achieved-versus-predicted reduction ratio `ρ_k`, acceptance of the trial point,
  the decrease it guarantees on successful iterations, and the generic "`|ρ_k - 1|` small ⇒ very
  successful" lemma.
* `RegularizationUpdate` / `TrustRegionUpdate`: the parameter update rules (2.4.4) / (2.3.7) as
  interval-valued (nondeterministic) predicates, with the generic consequences shared by all
  chapters: `σ_k ≥ σ_min`, `σ_k ≤ max(σ_0, γ₃ σ̄)` once large `σ` forces success, `Δ_k ≥
  min(Δ_0, γ₁ θ_k)` once small `Δ` forces success, and the counting lemmas of
  `Complexity/ParameterCount` specialized to these rules.
* `TaylorModel`: the regularized `p`-th order Taylor model `T_p(x,s) + σ/(p+1)! ‖s‖^{p+1}` and the
  three estimates on which AR1/AR2/ARp/ARqp analyses rest: Taylor decrease from model decrease
  (Lemmas 3.3.1, 4.1.1), ratio bound from Lipschitz continuity (Lemmas 2.4.2, 3.3.2, 4.1.2), and
  step-length lower bounds from approximate model stationarity (Lemmas 3.3.3, 3.3.8, 4.1.3).
* `QuadraticModel`: quadratic models `⟨g, s⟩ + ½ B[s,s]` with the Cauchy-point and eigenpoint
  decreases (Lemmas 2.3.2, 3.2.3) and the trust-region ratio bounds (Lemmas 2.3.3, 3.2.4).

* `ARRun` / `TRRun`: **the** generic run predicates `IsARRun` / `IsTRRun` (Steps 3–4 shared by all
  AR / TR methods, parametrized by the Step-1 test, the Step-2 step condition and the ratio
  sequence), the parameter structures `ARParams` / `TRParams`, `σ_max = arSigmaMax`, and the
  run-level lemmas (σ/Δ bounds, decrease on success, Lemmas 2.3.1/2.4.1, complexity skeleton,
  existence).
* `ARpRun` (ARp with a generic test; Ch 4, 5), `HighOrder/*` (Ch 12–14: TRq, ARqp, their
  complexity analyses on feasible sets under anchored smoothness, and the dynamic-accuracy methods),
  `HighOrderModel`, `HighOrderStep` (data-general high-order model lemmas), `PowRegularizedModel`
  (real-power regularization, ARp-H), `ConvexConstrained` (Ch 6), `InexactTaylor`, `InexactRatio`
  (Ch 13).

Algorithms themselves (TR1, AR1, TR2, AR2, TRε, iRN, ARp, TRq, …) are defined in the surface
(`NumlibSurface/CartisGouldToint`) as instances of `IsARRun` / `IsTRRun` or of the backbone
method predicates (`IsARpRun`, `IsTRqRun`, `IsARqpRun`); their analyses are short combinations of
the backbone lemmas. Design summary: `notes/cgt/core-design.md`, "Run and model interfaces
(consolidated)".
'''
