namespace = "Optimization"
desc = '''
Per-iteration arithmetic of the least-Euclidean-norm methods ARpLE (Cartis–Gould–Toint §5.1) and
ARpLE-CC (§6.3): a guaranteed decrease of `Φ_ℓ = ‖r‖^ℓ/ℓ` in terms of a (first-order) criticality
measure `ω` at the new iterate is converted into a decrease of the potential `‖r‖^{1/2^i}` that is
bounded below by an `ε`-dependent constant whenever the termination tests fail at the new iterate.
The argument is identical for the unconstrained measure `‖∇Φ_ℓ‖` (Lemma 5.1.4, Theorem 5.1.7) and
the constrained measure `ω_{Φ_ℓ,𝒞,1}` (display (6.3.3), Theorem 6.3.1), so it is stated for real
numbers only: `a = ‖r(x_j)‖`, `b = ‖r(x_{j+1})‖`, `R = ‖r(x_0)‖`, `ω` the measure at `x_{j+1}`.

Consolidation note: Lemma 5.1.3 (cascading differences) and the first-order parts of Lemma 5.1.4 /
Theorem 5.1.7 are in the Chapter 5 plan's scope; the two nodes below are their real-variable cores,
planned here so that Theorem 6.3.1 has a backbone to specialize. Merge with the Chapter 5 backbone
nodes if they state the same thing.
'''

[[node]]
id = "rpow_inv_two_pow_sub_ge_min"
kind = "theorem"
desc = '''
Decrease of the potential `‖r‖^{1/2^i}` on a successful iteration that does not terminate.
Let `p ≥ 1`, `ℓ ≥ 1`, `i` be naturals with `ι₁ := (2^i - 1)/2^i - (ℓ - 1)/p ≥ 0` (true under
(5.1.38) or (5.1.39), Lemma 5.1.6), `β ∈ (0,1)`, `κ₁ > 0`, `ε₀ > 0`, `ε₁ > 0`, and reals
`R ≥ a ≥ b > ε₀`, `ω > ε₁ * b ^ (ℓ - 1)` with `a ^ ℓ - b ^ ℓ ≥ ℓ * κ₁ * ω ^ ((p+1)/p : ℝ)`
(the decrease of Lemma 4.1.4 / 6.2.4 for `Φ_ℓ`, i.e. (5.1.15) / the display before (6.3.3)). Then
`a^(1/2^i) - b^(1/2^i) ≥ min κr0 κr1 * min (ε₀ ^ (1/2^i)) (ε₁ ^ ((p+1)/p)) / max 1 (R ^ ι₁)`
with `κr0 = 1 - β^(1/2^i)` (5.1.28) and `κr1 = κ₁ β^((ℓ-1)(p+1)/p) / 2^i` (5.1.21).
Proof: if `b > β a`, combine with `rpow_inv_two_pow_sub_ge` ((5.1.20) / (6.3.3)); otherwise
`a^{1/2^i} - b^{1/2^i} ≥ (1 - β^{1/2^i}) b^{1/2^i} > κr0 ε₀^{1/2^i}` ((5.1.27)).
'''
deps = ["rpow_inv_two_pow_sub_ge"]
source = "Cartis–Gould–Toint, Lemma 5.1.4, (6.3.3), proofs of Theorems 5.1.7 and 6.3.1"
