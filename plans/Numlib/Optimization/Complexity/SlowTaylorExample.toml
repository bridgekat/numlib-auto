namespace = "Optimization"
desc = '''
One-dimensional slow examples for adaptive regularization with `p`-th degree models that are slow
to reach `q`-th order criticality (`1 ≤ q ≤ p`): the construction of Cartis–Gould–Toint
Theorem 12.2.15 ((12.2.67)–(12.2.73)), which the book uses to prove Theorems 3.3.6, 3.3.10 and
4.1.6 (paragraph after Corollary 12.2.16). At each interpolation point only the `q`-th derivative is
nonzero, so the Taylor model is `f_k - (ε + ω_k) s^q / q!` and its regularized global minimizer
is explicit. The data are parametrized by a scale `c > 0` (the step satisfies
`s_k^{p-q+1} = c (ε + ω_k)`; `c = p!/((q-1)! σ)` for a constant regularization weight `σ`), so
that any fixed weight `σ₀` of the algorithm can be accommodated, with all constants depending only
on `p, q, c`.

Planned here (Chapter 4 planner) because Theorem 4.1.6 is its first user; the Chapter 12 plan
(Theorem 12.2.15, Corollary 12.2.16) should reuse this node rather than duplicate it. The
existing `exists_slowSecondOrder_interpolant` / `exists_slowNegCurvature_interpolant` of
`SlowExample` are different (Chapter 3's data (3.5.12), (3.2.24)); for `p = 2`, `q ∈ {1,2}` this
node gives alternative proofs of Theorems 3.3.6/3.3.10.

Source error noted: in (12.2.78) the book claims `|f^{(q)}_{k+1} - T^{(q)}_{f,p}(x_k, s_k)| = 0`;
in fact it equals `ω_k - ω_{k+1} = ε / k_ε ≤ ε ≤ s_k^{p-q+1}/c`, which still satisfies (A.32).
'''

[[node]]
id = "exists_slowTaylorOrder_interpolant"
kind = "theorem"
desc = '''
For `p ≥ 1`, `1 ≤ q ≤ p` and `c > 0` there are `L B > 0` (depending only on `p, q, c`) such that
for every `ε ∈ (0, 1]`, with `r = p - q + 1`, `k_ε = ⌈ε^{-(p+1)/r}⌉₊`,
`ω_k = ε (k_ε - k) / k_ε`, `s_k = (c (ε + ω_k))^{1/r}`, `x_0 = 0`, `x_{k+1} = x_k + s_k`, there is
`G : ℝ → ℝ` with `ContDiff ℝ p G`, `iteratedDeriv p G` `L`-Lipschitz on `ℝ`,
`|iteratedDeriv j G t| ≤ B` for all `t` and `j ≤ p`, and for every `k ≤ k_ε`:
`iteratedDeriv j G (x k) = 0` for `j ∈ [1, p]`, `j ≠ q`; `iteratedDeriv q G (x k) = -(ε + ω_k)`;
and for `k < k_ε`: `G (x (k+1)) = G (x k) - (ε + ω_k) * s_k ^ q / q!` (the Taylor value, so the
ratio of actual to predicted decrease is `1`). Proof: `Hermite.exists_contDiff_interpolating_jets_bounded`
with `F k 0 = f_0 - Σ_{i<k} (ε+ω_i) s_i^q / q!`, `f_0 = 1 + 2^{1+(p+1)/r} c^{q/r} / q!`, which exceeds the total
decrease `Σ_{i<k_ε} c^{q/r} (ε+ω_i)^{(p+1)/r}/q! ≤ (1 + ε^{-(p+1)/r}) c^{q/r} (2ε)^{(p+1)/r}/q!` (so
`F k 0 ∈ [1, f_0]`), and the consistency
bounds of (12.2.76)–(12.2.79) (with the correction of the module description), `κ` depending only on
`p, q, c`.
'''
deps = ["Hermite.exists_contDiff_interpolating_jets_bounded"]
source = "Cartis–Gould–Toint, proof of Theorem 12.2.15, paragraph after Corollary 12.2.16"
