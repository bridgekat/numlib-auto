namespace = "Optimization"
desc = '''
Powers of the Euclidean norm of a residual map, `Φ_ℓ(x) = ‖r(x)‖^ℓ / ℓ` for `r : E → F` (`E`, `F`
real inner product spaces; the book's `r : ℝⁿ → ℝᵐ`), Cartis–Gould–Toint §5.1 and §5.3.4:
smoothness (Lemma 5.1.1), the gradient formula `∇Φ_ℓ = ‖r‖^{ℓ-2} J^* r` ((5.1.63)), the lower bound
by the smallest singular value of the Jacobian ((5.1.64), (5.3.2)) and the resulting measure
domination of level `ℓ/(ℓ-1)` ((5.3.3)). Least-squares is `ℓ = 2`.

Also the elementary "cascading differences" inequality (Lemma 5.1.3) relating decreases of
`‖r‖^ℓ` and of `‖r‖^{1/2^i}` (stated for reals), and its consequence used by the complexity proofs
of ARpLE (Lemma 5.1.4, Theorem 5.1.7) and ARpLE-CC (display (6.3.3), Theorem 6.3.1): a decrease of
`Φ_ℓ` bounded below in terms of a first-order measure `ω` at the new iterate yields an
`ε`-dependent decrease of the potential `‖r‖^{1/2^i}` (`rpow_inv_two_pow_sub_ge_min`, stated for
reals: `a = ‖r(x_j)‖`, `b = ‖r(x_{j+1})‖`, `R = ‖r(x_0)‖`, so the unconstrained measure `‖∇Φ_ℓ‖`
and the constrained `ω_{Φ_ℓ,𝒞,1}` are both instances). Consolidation: that node was planned by
plan-ch0607 in the former `Optimization/Complexity/ResidualPower`, now merged here.
'''

[[node]]
id = "residualPow"
kind = "def"
desc = '''
`residualPow (r : E → F) (ℓ : ℝ) (x : E) : ℝ := ‖r x‖ ^ ℓ / ℓ` (book (5.1.3); real exponent,
`Real.rpow`; for natural `ℓ` it agrees with the natural power — simp lemma part of the node).
'''
source = "Cartis–Gould–Toint, (5.1.1)–(5.1.3)"

[[node]]
id = "contDiff_residualPow"
kind = "theorem"
desc = '''
Lemma 5.1.1 content. If `ContDiff ℝ p r` then `ContDiff ℝ p (residualPow r ℓ)` provided either `ℓ`
is an even natural number (`ℓ = 2m`: `‖r x‖^ℓ = (⟪r x, r x⟫)^m`, Mathlib `ContDiff.inner`/`pow`) or
`ℓ` is real with `2 p ≤ ℓ` (composition of `ContDiff.norm_sq` with `Real.contDiff_rpow_const_of_le`
for the exponent `ℓ/2 ≥ p`; the book states `ℓ > 2p`, the proof gives `ℓ ≥ 2p`).
'''
deps = ["residualPow"]
source = "Cartis–Gould–Toint, Lemma 5.1.1"

[[node]]
id = "gradient_residualPow"
kind = "theorem"
desc = '''
(5.1.63) For `r` differentiable at `x`, `ℓ ≥ 2` (real), `F` complete:
`fderiv ℝ (residualPow r ℓ) x = ‖r x‖ ^ (ℓ - 2) • (innerSL ℝ (r x)).comp (fderiv ℝ r x)`, so
`‖fderiv ℝ (residualPow r ℓ) x‖ = ‖r x‖ ^ (ℓ - 1) * (‖(fderiv ℝ r x)† (r x)‖ / ‖r x‖)` for `r x ≠ 0`
(adjoint `†` of the Jacobian, `ContinuousLinearMap.adjoint`). Hence
`‖∇Φ_ℓ(x)‖ / ‖r(x)‖^{ℓ-1} = ‖∇Φ₂(x)‖ / ‖r(x)‖ = ‖J(x)^T r(x)‖ / ‖r(x)‖`.
'''
deps = ["residualPow"]
source = "Cartis–Gould–Toint, (5.1.4), (5.1.63)"

[[node]]
id = "norm_fderiv_residualPow_ge"
kind = "theorem"
desc = '''
(5.1.64), (5.3.2) If `s₀ ‖v‖ ≤ ‖(fderiv ℝ r x)† v‖` for all `v : F` (in finite dimension: `s₀`
the smallest singular value of the Jacobian's adjoint, cf. Numlib `SingularValues`; the book's
"smallest singular value of the Jacobian bounded away from zero") and `ℓ ≥ 2`, then
`s₀ * ‖r x‖ ^ (ℓ - 1) ≤ ‖fderiv ℝ (residualPow r ℓ) x‖`, i.e. `ψ_{ℓ,1}(x) ≥ s₀` ((5.1.62)).
'''
deps = ["gradient_residualPow"]
source = "Cartis–Gould–Toint, (5.1.62)–(5.1.64), (5.3.2)"

[[node]]
id = "residualPow_le_of_norm_fderiv_ge"
kind = "theorem"
desc = '''
(5.3.3) If `ℓ > 1`, `ψmin > 0` and `‖fderiv ℝ (residualPow r ℓ) x‖ ≥ ψmin * ‖r x‖ ^ (ℓ - 1)` then
`residualPow r ℓ x - 0 ≤ (1/ℓ) * ψmin ^ (-(ℓ/(ℓ-1))) * ‖fderiv ℝ (residualPow r ℓ) x‖ ^ (ℓ/(ℓ-1))`:
`Φ_ℓ` is measure dominated of level `μ = ℓ/(ℓ-1)` at `x` for `ψ = ‖∇Φ_ℓ‖`, `f_* = 0`,
`κψ = ψmin^{-ℓ/(ℓ-1)}/ℓ` (`IsMeasureDominated` on any set of such points).
'''
deps = ["residualPow", "IsMeasureDominated"]
source = "Cartis–Gould–Toint, (5.3.3)"

[[node]]
id = "rpow_inv_two_pow_sub_ge"
kind = "theorem"
desc = '''
Lemma 5.1.3 (cascading differences). For reals `a ≥ b ≥ 0`, `a > 0`, naturals `i` and `ℓ ≥ 1`:
`a ^ (1/2^i : ℝ) - b ^ (1/2^i : ℝ) ≥ (a ^ ℓ - b ^ ℓ) / (2 ^ i * ℓ * a ^ ((2^i - 1)/2^i + ℓ - 1 : ℝ))`.
Proof: `a^ℓ - b^ℓ ≤ ℓ a^{ℓ-1} (a - b)` (geometric sum) and, by induction on `i` with
`A² - B² = (A - B)(A + B)`, `a^{1/2^i} - b^{1/2^i} ≥ (a - b)/(2^i a^{(2^i-1)/2^i})`. (For `a = 0`
both sides vanish under Lean's conventions; the book assumes `a ≥ b ≥ 0` only.)
'''
source = "Cartis–Gould–Toint, Lemma 5.1.3 and its proof (Appendix B, Chapter 5)"

[[node]]
id = "rpow_inv_two_pow_sub_ge_min"
kind = "theorem"
desc = '''
Decrease of the potential `‖r‖^{1/2^i}` on a successful iteration that does not terminate.
Let `p ≥ 1`, `ℓ ≥ 1`, `i` be naturals with `ι₁ := (2^i - 1)/2^i - (ℓ - 1)/p ≥ 0` (true under
(5.1.38) or (5.1.39), Lemma 5.1.6), `β ∈ (0,1)`, `κ₁ > 0`, `ε₀ > 0`, `ε₁ > 0`, and reals
`R ≥ a ≥ b > ε₀`, `ω > ε₁ * b ^ (ℓ - 1)` with `a ^ ℓ - b ^ ℓ ≥ ℓ * κ₁ * ω ^ ((p+1)/p : ℝ)`
(the decrease of Lemma 4.1.4 / 6.2.4 for `Φ_ℓ`, i.e. (5.1.15) / the display before (6.3.3)). Then
`a^(1/2^i) - b^(1/2^i) ≥ min κr0 κr1 * min (ε₀ ^ (1/2^i)) (ε₁ ^ ((p+1)/p)) / max 1 (R ^ ι₁)`
with `κr0 = 1 - β^(1/2^i)` (5.1.28) and `κr1 = κ₁ β^((ℓ-1)(p+1)/p) / 2^i` (5.1.21).
Proof: if `b > β a`, combine with `rpow_inv_two_pow_sub_ge` ((5.1.20) / (6.3.3)); otherwise
`a^{1/2^i} - b^{1/2^i} ≥ (1 - β^{1/2^i}) b^{1/2^i} > κr0 ε₀^{1/2^i}` ((5.1.27)).
'''
deps = ["rpow_inv_two_pow_sub_ge"]
source = "Cartis–Gould–Toint, Lemma 5.1.4, (6.3.3), proofs of Theorems 5.1.7 and 6.3.1"
