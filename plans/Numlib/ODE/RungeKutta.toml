id = "rk4"

[[node]]
id = "rk4_hasOrderFor"
kind = "theorem"
desc = '''The classical method has order four: for `f` with `(t, v) ↦ f t v` of class `C⁴` with
bounded derivatives up to order 4 on `Icc t₀ (t₀ + T + 1) ×ˢ univ` and `y` a solution there,
`OneStep.HasOrderFor (rk4.explicitIncrement f) t₀ T y 4`. Proof: Taylor-expand `K₂, K₃, K₄` to
`O(h⁴)` in the elementary differentials of `F(t, v) = f t v` (with `D = DF(·)(1, ·)`-type
notation: `F`, `F'F`, `F''(F,F)`, `F'F'F`, `F^{(3)}(F,F,F)`, `F''(F'F, F)`, `F'F''(F,F)`, `F'F'F'F` —
the eight rooted trees of order `≤ 4`), compare with `y^{(k)}` expressed in the same
differentials, and check the eight order conditions `∑ b_i = 1`, `∑ b_i c_i = 1/2`,
`∑ b_i c_i² = 1/3`, `∑ b_i a_ij c_j = 1/6`, `∑ b_i c_i³ = 1/4`, `∑ b_i c_i a_ij c_j = 1/8`,
`∑ b_i a_ij c_j² = 1/12`, `∑ b_i a_ij a_jk c_k = 1/24` (each `norm_num` for `rk4`). Honest
estimate: ★★★ and large — several hundred lines even in the scalar autonomous case
(`f : ℝ → ℝ`, `iteratedDeriv`), where every elementary differential is a product of derivatives
of `f` at `y t` and the comparison is a polynomial identity; the `E`-valued nonautonomous case
multiplies the bookkeeping by the multilinear-map API. Recommended split: (i) the eight algebraic
order conditions for `rk4` as a separate ★ node `rk4_orderConditions`; (ii) the scalar autonomous
case; (iii) the general case only if a B-series framework is built (not planned). The one-step
theory then gives fourth-order convergence.

Blocked: not attempted this round. The two-stage theorem `ButcherTableau.hasOrderFor_two_of`
fixes the pattern (explicit Fréchet derivatives `F'`, `F''` of `(t, v) ↦ f t v` on `ℝ × E`, the
Taylor bounds `norm_sub_sub_smul_apply_le_of_hasFDerivAt` along a segment and
`norm_sub_sub_smul_sub_smul_le_mul_pow_three_div_six` for the curve, the chain rule
`y'' = F'(t, y)(1, y')` by `UniqueDiffWithinAt.eq_deriv`); order four needs the same with the
third and fourth Fréchet derivatives, a fifth-order Taylor bound for `y`, the expansions of
`K₂, K₃, K₄` to `O(h⁴)` and the identification of the third and fourth derivatives of `y` with
the elementary differentials, then the eight conditions `rk4_orderConditions`. Estimate: 400–600 lines with
the present tools; a B-series framework would be the right investment before attempting it.'''
deps = ["ODE.rk4", "ODE.OneStep.HasOrderFor"]

