[[node]]
id = "ButcherTableau.mem_absStabilityRegion_iff"
kind = "theorem"
wrong = '''False as stated: the invertibility clause is not necessary for absolute stability.
Counterexample: `A = !![0, 1; 1, 0]`, `b = (1/2, 1/2)`, `z = -1`: `I - zA = !![1, 1; 1, 1]` is
singular, but the stage system `K₁ + K₂ = z u` is solvable for every datum and every solution
gives the same step `v = u (1 + z/2)`, so every datum has an orbit and every orbit is
`(1/2)^n u₀ → 0`: `z ∈ absStabilityRegion` in the sense of `OneStep.IsAbsStable`, while
`R(z) = 1` with Mathlib's `Matrix.inv` (which is `0` on a singular matrix). The corrected
statement is `mem_absStabilityRegion_iff_of_isUnit`, the equivalence under the invertibility
hypothesis, together with `mem_absStabilityRegion_iff_of_isExplicit` (no clause needed for an
explicit tableau) and `not_mem_absStabilityRegion_of_forall_ne` for the singular case in which
the stage system has no solution.'''
desc = '''`z ∈ OneStep.absStabilityRegion tab.stepRel ↔ IsUnit (1 - z • A.map _) ∧ ‖tab.stabilityFunction z‖ < 1`
(the region of §11.8.4; the invertibility clause is the existence clause of `IsAbsStable`, which
fails exactly when `1 - zA` is singular — then some datum has no orbit or the stage system has
several solutions with orbits that do not all decay). `stepRel_testField_iff`,
`tendsto_pow_atTop_nhds_zero_iff_norm_lt_one`, and `OneStep.absStabilityRegion_eq_of_scaleInvariant`
(the stage system depends on `(h, λ)` only through `hλ`). ★★'''
deps = ["ODE.ButcherTableau.stepRel_testField_iff", "ODE.OneStep.absStabilityRegion", "ODE.OneStep.absStabilityRegion_eq_of_scaleInvariant"]

