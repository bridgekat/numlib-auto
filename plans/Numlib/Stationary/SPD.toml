[[node]]  # staged by ch11
id = "Stationary.Splitting.spectrum_complexify_iterationOperator_subset"
kind = "theorem"
desc = '''
For a real splitting `s : Stationary.Splitting A` with `A.PosDef`, `s.m` symmetric and `s.m − A`
positive semidefinite: `spectrum ℂ (Matrix.complexify s.iterationOperator) ⊆ Complex.ofReal '' Set.Ico 0 1`
— the eigenvalues of `G = M⁻¹N` are real, nonnegative and below `1` ([golub2013matrix] Theorem 11.2.4
for SSOR; [quarteroni2000numerical] Property 4.5 read correctly). Real and nonnegative: `A G` is
symmetric positive semidefinite (`Stationary.Splitting.mul_iterationOperator_posSemidef`), so `G` is
self-adjoint and positive semidefinite in the `A`-inner product
(`Stationary.Splitting.isSelfAdjoint_energyIterationOperator` on `Stationary.Splitting.euclidean`);
below `1`: `M + Mᵀ − A = M + (M − A)` is positive definite, so
`Stationary.Splitting.complexSpectralRadius_lt_one_of_posDef`. ★★ (~50 lines)
'''
deps = ["Stationary.Splitting.mul_iterationOperator_posSemidef", "Stationary.Splitting.euclidean",
  "Stationary.Splitting.complexSpectralRadius_lt_one_of_posDef", "Matrix.complexSpectralRadius"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 11.2.4'

[[node]]  # staged by ch11
id = "Matrix.ssorSplitting_m_posDef_of_diag_pos"
kind = "theorem"
desc = '''
For symmetric `A` with positive diagonal (not necessarily positive definite) and `0 < ω < 2`, the SSOR
preconditioner `(ω(2−ω))⁻¹ (D + ωL) D⁻¹ (D + ωLᵀ)` is positive definite: `X D⁻¹ Xᵀ` with `X = D + ωL`
nonsingular lower triangular and `D⁻¹` positive definite ([golub2013matrix] §11.2.7, after (11.2.24)).
Generalizes `Matrix.ssorSplitting_m_posDef`, whose proof uses only these facts; that lemma should then
delegate. ★
'''
deps = ["Matrix.ssorSplitting", "Matrix.ssorSplitting_m_posDef"]
source = 'Golub–Van Loan, Matrix Computations, Equation (11.2.24)'
