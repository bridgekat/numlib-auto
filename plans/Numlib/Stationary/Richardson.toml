desc = '''
Richardson's iteration with a preconditioner, `x_{k+1} = x_k + α P⁻¹ (b - A x_k)`, stationary
(`α` fixed) and nonstationary (`α_k`), for matrices over `ℝ` (Quarteroni–Sacco–Saleri §4.3.1,
(4.23)–(4.30); Saad Example 4.1 is `P = 1`; Kress §4.4 and Atkinson–Han Exercise 5.2.3 are the
unpreconditioned case). The stationary method is the splitting `M = α⁻¹ P`
(`Stationary.Splitting.preconditionedRichardson`), which specializes to `Splitting.richardson`
(`P = 1`) and to `Matrix.jorSplitting` (`P = D`) of `Numlib/Stationary/SPD`; its
iteration matrix is `R_α = 1 - α P⁻¹ A`.

Three results carry the section, all statements about a real matrix `M` (`= P⁻¹ A`) and the pencil
`1 - α M`, none of which needs `M` symmetric:

* the general convergence criterion in terms of the complex eigenvalues `λ` of `M`,
  `ρ(1 - α M) < 1 ↔ ∀ λ, 2 Re λ / (α |λ|²) > 1` (Theorem 4.8);
* for real positive eigenvalues in `[λ_n, λ_1]`, `ρ(1 - α M) < 1 ↔ 0 < α < 2/λ_1`, with the optimal
  parameter `α_opt = 2/(λ_1 + λ_n)` and the optimal radius `(λ_1 - λ_n)/(λ_1 + λ_n)` (Theorem 4.9),
  which is `Stationary.Splitting.richardson_complexSpectralRadius_lt_one_iff`/`isMinOn_*` of the
  SPD module with the symmetry hypothesis replaced by the spectral one — the existing private lemmas
  `complexSpectralRadius_affine`, `le_max_abs_one_sub_mul`, `max_abs_one_sub_mul_optimal` of that
  file are exactly the tools and should be made public alongside
  `Matrix.spectrum_complexify_affine`;
* the energy-norm contraction `‖e_{k+1}‖_A ≤ ρ(R_α) ‖e_k‖_A` for symmetric positive definite `P`
  and `A` (Corollary 4.1 in the generality of the book's closing remark), which is the SPD module's
  `Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius` at
  `M = α⁻¹ P`.

The nonstationary iteration `Richardson.iterate` is here as the object §4.4 of the book builds the
Krylov methods on: its residuals are `∏ (1 - α_j A) r_0` (4.51) and its iterates lie in
`x_0 + 𝒦_k(A, r_0)` (4.53); the gradient method (`α_k = ⟪r_k, r_k⟫/⟪A r_k, r_k⟫`) is the instance
whose step is `Projection.steepestDescentStep` of `Numlib/Projection/OneDimensional`,
and the gradient method with preconditioner is the same step for `P⁻¹ A` in the `P`-inner product
(`Krylov.IsPreconditioner` of `Numlib/Krylov/Preconditioned`).

Prototype: `notes/qss/ch04/proto/Richardson.lean` (elaborates with `sorry`).
'''

[[node]]
id = "Stationary.Splitting.preconditionedRichardson"
kind = "definition"
desc = '''For `A P : Matrix n n ℝ` with `hP : IsUnit P` and `hα : α ≠ 0`, the splitting of `A` with
`m = α⁻¹ • P` (Quarteroni–Sacco–Saleri (4.23)); `n = α⁻¹ • P - A`. Over a general field, as
`Matrix.jorSplitting` is. ★'''
deps = ["Stationary.Splitting", "Stationary.Splitting.richardson"]

[[node]]
id = "Stationary.Splitting.preconditionedRichardson_iterationOperator"
kind = "theorem"
desc = '''`(preconditionedRichardson A hP hα).iterationOperator = 1 - α • (P⁻¹ * A)`, the matrix `R_α` of
Quarteroni–Sacco–Saleri §4.3 (`R_P = 1 - P⁻¹ A` at `α = 1`). From `Splitting.one_sub_iterationOperator`
and `(α⁻¹ • P)⁻¹ = α • P⁻¹`. ★'''
deps = ["Stationary.Splitting.preconditionedRichardson", "Stationary.Splitting.one_sub_iterationOperator"]

[[node]]
id = "Stationary.Splitting.preconditionedRichardson_one"
kind = "theorem"
desc = '''`preconditionedRichardson A isUnit_one hα = richardson A hα`: the unpreconditioned method is `P = 1`
(`Splitting.ext`, `α⁻¹ • 1 = algebraMap`). ★'''
deps = ["Stationary.Splitting.preconditionedRichardson", "Stationary.Splitting.richardson"]

[[node]]
id = "Stationary.Splitting.preconditionedRichardson_diagPart"
kind = "theorem"
desc = '''`preconditionedRichardson A h hω = Matrix.jorSplitting A h hω` for `h : IsUnit (diagPart A)`: JOR
is Richardson with `P = D` and `α = ω` (Quarteroni–Sacco–Saleri, sentence after (4.24)); Jacobi and
Gauss–Seidel are the cases `α = 1`, `P = D` and `P = D - E`. ★'''
deps = ["Stationary.Splitting.preconditionedRichardson", "Matrix.jorSplitting"]

[[node]]
id = "Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff_forall"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri, Theorem 4.8: for `M : Matrix n n ℝ`, `[Nonempty n]` and every real `α`,
`complexSpectralRadius (1 - α • M) < 1 ↔ ∀ μ ∈ spectrum ℂ (complexify M), 1 < 2 * μ.re / (α * ‖μ‖ ^ 2)`.
Applied to `M = P⁻¹ A` and `preconditionedRichardson_iterationOperator` this is the book's
statement for any nonsingular `P`. The eigenvalues of `1 - α M` are `1 - α μ`
(`Matrix.spectrum_complexify_affine`), `|1 - α μ|² < 1 ⟺ α² |μ|² < 2 α Re μ ⟺ 1 < 2 Re μ/(α |μ|²)`
for `α ≠ 0`, `μ ≠ 0`, and Lean's `x / 0 = 0` makes the right-hand side false when `α = 0` or `μ = 0`,
exactly when the left-hand side is (an eigenvalue `1` survives). `[Nonempty n]` because for an empty
index type the left side is true and the right side vacuous — actually both hold, but the `α = 0`
case then needs no witness; keep the hypothesis unless the proof goes through without it. ★★'''
deps = ["Matrix.spectrum_complexify_affine", "Matrix.complexSpectralRadius"]

[[node]]
id = "Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri, Theorem 4.9, first clause: for `M : Matrix n n ℝ` whose complex spectrum is
real and contained in `[lmin, lmax]`, `spectrum ℂ (complexify M) ⊆ Complex.ofReal '' Set.Icc lmin lmax`,
with both endpoints attained (`lmin, lmax ∈ spectrum ℝ M`) and `0 < lmin`: for every real `α`,
`complexSpectralRadius (1 - α • M) < 1 ↔ 0 < α ∧ α < 2 / lmax`. This is
`Stationary.Splitting.richardson_complexSpectralRadius_lt_one_iff` (SPD module) with the Hermitian
hypothesis on `A` weakened to the spectral hypothesis on `M`, which is all that proof uses: the
private `complexSpectralRadius_affine` computes `ρ(1 - α M) = max |1 - α lmin| |1 - α lmax|` from
the spectral inclusion, and the case split on the sign of `α` is `le_max_abs_one_sub_mul`. Also
record the value `complexSpectralRadius (1 - α • M) = ENNReal.ofReal (max |1 - α * lmin| |1 - α * lmax|)`
as a separate clause `Stationary.Splitting.complexSpectralRadius_one_sub_smul_eq`. ★★'''
deps = ["Matrix.spectrum_complexify_affine", "Stationary.Splitting.richardson_complexSpectralRadius_lt_one_iff", "Stationary.Splitting.richardson_complexSpectralRadius_eq"]

[[node]]
id = "Stationary.Splitting.isMinOn_complexSpectralRadius_one_sub_smul"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri, Theorem 4.9, (4.27)–(4.28): under the spectral hypotheses of
`complexSpectralRadius_one_sub_smul_lt_one_iff`, `α_opt = 2 / (lmin + lmax)` minimizes
`fun α => complexSpectralRadius (1 - α • M)` on `Set.Ioi 0` (`IsMinOn`), and the minimum value is
`ENNReal.ofReal ((lmax - lmin) / (lmax + lmin))`. The two existing nodes
`isMinOn_richardson_complexSpectralRadius` and `richardson_complexSpectralRadius_optimal_eq` are the
Hermitian case (`M = A`); the proofs (the private `max_abs_one_sub_mul_optimal`) transfer verbatim.
With `M = P⁻¹ A` and `Matrix.spectrum_inv_mul_subset_of_posDef` this covers the preconditioned case
the book means. ★★'''
deps = ["Stationary.Splitting.complexSpectralRadius_one_sub_smul_lt_one_iff", "Stationary.Splitting.isMinOn_richardson_complexSpectralRadius", "Stationary.Splitting.richardson_complexSpectralRadius_optimal_eq"]

[[node]]
id = "Stationary.Splitting.energyNorm_preconditionedRichardson_mulVec_le"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri, Corollary 4.1 (and the remark after it): for real `A.PosDef`, `P.PosDef`
and `α ≠ 0`, with `R = 1 - α • (P⁻¹ * A)` and `ρ = (complexSpectralRadius R).toReal`,
`(A *ᵥ (R *ᵥ e)) ⬝ᵥ (R *ᵥ e) ≤ ρ ^ 2 * ((A *ᵥ e) ⬝ᵥ e)` for every `e`, i.e. `‖e_{k+1}‖_A ≤ ρ(R_α) ‖e_k‖_A`
along the iteration. It is
`Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius` for the
splitting `preconditionedRichardson A hP hα`, whose `m = α⁻¹ • P` is symmetric. No hypothesis on
`P⁻¹ A` (the book's "provided `P`, `A` and `P⁻¹ A` are symmetric positive definite" asks for more
than the proof needs, as its own closing remark says). Note that (4.30) holds for every `α`, and
that the *convergence* clause of the Corollary additionally needs `0 < α < 2/λ_1`, which the book
omits; see the chapter errata. ★'''
deps = ["Stationary.Splitting.preconditionedRichardson_iterationOperator", "Stationary.Splitting.energyNorm_mulVec_iterationOperator_le_complexSpectralRadius"]

[[node]]
id = "Stationary.Splitting.complexSpectralRadius_one_sub_smul_optimal_eq_condNumber"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri (4.29): for a real symmetric positive definite `M` (the book's `P⁻¹ A`
when it happens to be symmetric), with `κ = NormedRing.condNumber M` in the `ℓ²` operator norm,
`complexSpectralRadius (1 - (2 / (lmin + lmax)) • M) = ENNReal.ofReal ((κ - 1) / (κ + 1))` and
`2 / (lmin + lmax) = 2 * ‖M⁻¹‖ / (κ + 1)`, where `lmin`, `lmax` are the extreme eigenvalues. From
`isMinOn_complexSpectralRadius_one_sub_smul`, `Matrix.IsHermitian.l2_opNorm_eq` (`‖M‖ = lmax`) and
`Matrix.IsHermitian.l2_opNorm_inv_eq` (`‖M⁻¹‖ = 1/lmin`), so `κ = lmax/lmin`. The book writes
`‖A⁻¹ P‖₂` for `‖M⁻¹‖₂`. ★★'''
deps = ["Stationary.Splitting.isMinOn_complexSpectralRadius_one_sub_smul", "Matrix.IsHermitian.l2_opNorm_eq", "Matrix.IsHermitian.l2_opNorm_inv_eq", "NormedRing.condNumber"]

[[node]]
id = "Richardson.iterate"
kind = "definition"
desc = '''The nonstationary preconditioned Richardson iteration (Quarteroni–Sacco–Saleri (4.24)): for
`A : E →ₗ[𝕜] E`, a preconditioner inverse `Pinv : E →ₗ[𝕜] E`, parameters `α : ℕ → 𝕜`, right-hand
side `b` and start `x₀`, `iterate A Pinv α b x₀ 0 = x₀` and
`iterate … (k + 1) = x_k + α k • Pinv (b - A x_k)`. Stated on a module over a field (no norm is
used); `Pinv = id` is the unpreconditioned method. The stationary case `α = const` is
`Stationary.step` for `1 - α Pinv A`. ★'''
deps = ["Stationary.step"]

[[node]]
id = "Richardson.residual_iterate_succ"
kind = "theorem"
desc = '''The residual update of the algorithm (4.25): with `r_k = b - A x_k` and `z_k = Pinv r_k`,
`r_{k+1} = r_k - α k • A z_k`. Unfold and `map_sub`. ★'''
deps = ["Richardson.iterate"]

[[node]]
id = "Richardson.residual_iterate_eq_prod"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri (4.51), for `Pinv = id`: `b - A (iterate A id α b x₀ k) = (∏ j ∈ range k, (1 - α j • A)) (b - A x₀)`,
the product taken in `Module.End 𝕜 E` (any order, the factors commute); equivalently
`r_k = p_k(A) r_0` with `p_k = ∏ (1 - α_j X)` of degree `k` and `p_k 0 = 1`. Induction with
`residual_iterate_succ`. This is the observation that opens the Krylov chapter of the book. ★'''
deps = ["Richardson.residual_iterate_succ"]

[[node]]
id = "Richardson.iterate_sub_mem_subspace"
kind = "theorem"
desc = '''Quarteroni–Sacco–Saleri (4.53): `iterate A id α b x₀ k - x₀ ∈ Krylov.subspace A (b - A x₀) k`,
i.e. the Richardson iterate lies in `W_k = x_0 + 𝒦_k(A, r_0)`, since `x_k - x_0 = ∑_{j<k} α_j r_j`
and `r_j ∈ 𝒦_{j+1}` by `residual_iterate_eq_prod` and `Krylov.aeval_apply_mem_subspace`. ★'''
deps = ["Richardson.residual_iterate_eq_prod", "Krylov.subspace", "Krylov.aeval_apply_mem_subspace"]

[[node]]
id = "Richardson.iterate_gradient_eq_steepestDescentStep"
kind = "theorem"
desc = '''The gradient method of Quarteroni–Sacco–Saleri §4.3.3 is nonstationary Richardson with
`α_k = ⟪r_k, r_k⟫ / ⟪A r_k, r_k⟫` (4.37), and one step of it is `Projection.steepestDescentStep A b`:
for the parameter sequence defined by that formula along the iteration,
`iterate A id α b x₀ (k + 1) = Projection.steepestDescentStep A b (iterate A id α b x₀ k)`. Since the
parameter depends on the iterate, state it for the sequence `x` defined by
`x (k+1) = steepestDescentStep A b (x k)` and prove `x k = iterate A id (fun k => ⟪r_k, r_k⟫/⟪A r_k, r_k⟫) b x₀ k`
by induction; on an inner product space. ★'''
deps = ["Richardson.iterate", "Projection.steepestDescentStep"]
