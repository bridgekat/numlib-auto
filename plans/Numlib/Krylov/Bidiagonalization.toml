# The module doc of `Numlib.Krylov.Bidiagonalization` is the group description (Golub–Kahan
# bidiagonalization as Arnoldi vectors of the two Gram operators; Paige–Saunders as the process of
# the adjoint pair; the link to Lanczos of `Aᴴ A` and of the Hermitian dilation; the matrix form).
# The intertwining lemmas it rests on, `Krylov.map_subspace_of_semiconj` and
# `Arnoldi.inner_vec_apply_vec_of_semiconj`, live in `Numlib/Krylov/Subspace` and
# `Numlib/Krylov/Arnoldi`, whose plans track them.

