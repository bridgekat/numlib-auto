[[node]]
id = "Lanczos.apply_residual_minRes_eq"
kind = "theorem"
desc = '''Choi Lemma 2.19: `A r_k = ‖r_k‖ (γ_{k+1}^{(1)} • v_{k+1} + δ_{k+2}^{(1)} • v_{k+2})` and hence
`‖A r_k‖ = ‖r_k‖ √((γ_{k+1}^{(1)})² + (δ_{k+2}^{(1)})²)`, in terms of the entries of the rotated
tridiagonal factor; and Lemma 2.20, `‖A x_k‖² = ‖t_k‖²` for the rotated right-hand side, which
makes `‖A x_k‖` computable from the small problem.

**Blocked on the source.** `books/iterative-methods-for-singular-linear-equations-and-least-squares-problems-choi.pdf`
is password-protected and cannot be opened, and this desc is the only record of the statement; it
names `γ^{(1)}_{k+1}` and `δ^{(1)}_{k+2}` without saying which entries of which rotated matrix they
are, so the coefficients cannot be pinned down without the book. What *is* determined, and is the
structural half of the lemma, is that `A r_k` lies in `span {v_k, v_{k+1}}` — `A r_k ∈ 𝒦_{k+2}`
because `r_k ∈ 𝒦_{k+1}`, and `A r_k ⟂ 𝒦_k` because `⟪v_j, A r_k⟫ = ⟪A v_j, r_k⟫` vanishes for
`j < k` by minimality of the residual over `A 𝒦_k` — so that
`‖A r_k‖² = |⟪v_k, A r_k⟫|² + |⟪v_{k+1}, A r_k⟫|²`, with the two coefficients computable from
`Lanczos.residual_minRes_succ_eq` (now proved) and the three-term `Lanczos.apply_vec`: writing
`r_k = γ_k ∑_i conj (Q_k)_{k,i} v_i`, the coefficient of `v_j` in `A r_k` is
`γ_k conj ((T̄_k q)_j)` for `q` the last row of `Q_k`. Anyone attempting this should first check that
form against Choi's `γ^{(1)}`/`δ^{(1)}` rather than guess the normalization.'''
deps = ["Lanczos.residual_minRes_succ_eq", "Krylov.rotated", "Krylov.gvec", "Lanczos.apply_vec"]
source = "Choi, Iterative Methods for Singular Linear Equations and Least-Squares Problems, Lemmas 2.19 and 2.20"
