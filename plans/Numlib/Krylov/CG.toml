# Planned additions (GVL round): the module doc of `Numlib.Krylov.CG` is the group description;
# when the Golub–Van Loan nodes staged below are formalized, extend it as follows.
# (ch11) extend the "Identification with the Lanczos vectors" bullet: besides the vectors
# (`CG.arnoldi_vec_eq`), the Lanczos *coefficients* of `r₀` are read off the CG coefficients —
# `α^L_0 = 1/α_0`, `α^L_{k+1} = 1/α_{k+1} + β_k/α_k`, `β^L_k = √β_k/α_k` ([saad2003iterative]
# (6.101)–(6.103); [golub2013matrix] §11.3.5–11.3.6; [meurant2006lanczos] §3) — and the Lanczos
# tridiagonal factors as `T_m = L D Lᵀ` with `D = diag(1/α_j)` and `L` unit lower bidiagonal with
# subdiagonal `‖r_{j+1}‖/‖r_j‖` (`CG.lanczos_tridiag_eq_ldl`). These were proved in the Saad surface
# (`SaadSparse.Chapter06.equation_6_101`–`equation_6_103`) and are needed again by Golub–Van Loan's
# Lanczos form of CG (Algorithm 11.3.2), so they move down; the Saad nodes then delegate.
