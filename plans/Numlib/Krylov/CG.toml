id = "norm_iterate_lt_of_re_inner_apply_direction_pos"
kind = "theorem"
desc = '''Steihaug's theorem for symmetric, possibly indefinite `A` (Steihaug 1983, Thm 2.1; Fong–Saunders,
*CG versus MINRES*, §4.2): for the CG iterates from `x₀ = 0`, if `0 < re ⟪A p_j, p_j⟫` for all
`j < k`, then `‖x_i‖ < ‖x_{i+1}‖` for all `i < k`. The local argument: `⟪r_i, p_j⟫ = ‖r_j‖²` for
`i ≤ j` while the denominators used so far are positive, hence `re ⟪p_i, p_j⟫ ≥ 0`, hence
`re ⟪x_i, p_i⟫ ≥ 0`, and `‖x_{i+1}‖² - ‖x_i‖² = 2 α_i re ⟪x_i, p_i⟫ + α_i² ‖p_i‖² > 0` with `α_i > 0`.
The positive definite `norm_iterate_monotone` becomes its corollary through
`re_inner_apply_direction_pos`.'''
deps = ["iterate", "step", "norm_iterate_monotone", "re_inner_apply_direction_pos", "inner_residual_direction_eq", "re_inner_direction_nonneg"]
source = "Steihaug, The conjugate gradient method and trust regions in large scale optimization (1983), Theorem 2.1; Fong–Saunders, CG versus MINRES, Section 4.2"
