kind = "theorem"
desc = '''Choi Lemma 2.20 / (3.21): for symmetric `A` and minimal-residual iterates from `x₀ = 0`, `‖A x_k‖`
is nondecreasing in `k`: `A x_k = b - r_k` with `r_k ⟂ A 𝒦_k ∋ A x_k`, so
`‖A x_k‖² = ‖b‖² - ‖r_k‖²` and `‖r_k‖` is nonincreasing (`IsMinResIterate.norm_residual_antitone`).'''
deps = ["IsMinResIterate", "IsMinResIterate.norm_residual_antitone"]
source = "Choi, Iterative Methods for Singular Linear Equations and Least-Squares Problems, Lemma 2.20"
