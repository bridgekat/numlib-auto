namespace = "Matrix"
desc = '''
Difference approximations of the Jacobian matrix on `EuclideanSpace ℝ ι` (Quarteroni–Sacco–Saleri
§7.1.2, (7.9)): the forward-difference matrix `J_h` with increments `h j` along the canonical
basis, its column-wise Taylor error `(L/2) |h j|` when the derivative is `L`-Lipschitz, and the
resulting operator-norm error of `toEuclideanLin J_h`. Kept out of `Numlib/Nonlinear/Newton.lean`,
which is a Banach-space file with no basis: the difference Jacobian needs coordinates, and the
Newton-with-approximate-derivative theorems there take an arbitrary operator `B k`, of which this
module supplies the instance. Property 7.1 is assembled in the surface from the two.
'''

[[node]]
id = "differenceJacobian"
kind = "definition"
desc = '''`Matrix.differenceJacobian F x h : Matrix ι ι ℝ` for `F : EuclideanSpace ℝ ι →
EuclideanSpace ℝ ι`, `x : EuclideanSpace ℝ ι`, `h : ι → ℝ`, with entries
`(F (x + h j • EuclideanSpace.single j 1) i - F x i) / h j` — column `j` is the forward difference
quotient of `F` along the `j`-th axis, (7.9). Increments `h j = 0` give junk columns `0`. ★'''
deps = []

[[node]]
id = "norm_differenceJacobian_col_sub_le"
kind = "theorem"
desc = '''Column-wise error. If `HasFDerivAt F (F' y) y` for `y ∈ ball x r`, `F'` is `L`-Lipschitz on
`ball x r`, `0 < |h j| < r`, then
`‖(toEuclideanLin (differenceJacobian F x h) - F' x) (EuclideanSpace.single j 1)‖ ≤ L / 2 * |h j|`.
Proof: the column is `(F (x + h e_j) - F x - F' x (h e_j)) / h`, bounded by the sharp Taylor
inequality `Convex.norm_image_sub_sub_le_of_norm_hasFDerivAt_sub_le` (`Numlib/Analysis/Calculus/MeanValue`)
by `(L/2) |h|² ‖e_j‖² / |h|` with `‖e_j‖ = 1`. ★★'''
deps = ["Matrix.differenceJacobian"]

[[node]]
id = "opNorm_toEuclideanLin_differenceJacobian_sub_le"
kind = "theorem"
desc = '''Operator-norm error: under the hypotheses of `norm_differenceJacobian_col_sub_le` for
every `j`, and `∀ j, |h j| ≤ η`,
`‖toEuclideanLin (differenceJacobian F x h) - F' x‖ ≤ Real.sqrt (Fintype.card ι) * (L / 2) * η`.
Proof: `‖D v‖ ≤ ∑ j |v j| ‖D e_j‖ ≤ (L/2) η ∑ j |v j| ≤ (L/2) η √n ‖v‖` (Cauchy–Schwarz on
`∑ |v j|`). The book states Property 7.1 in the `‖·‖₁` norm, where the constant is `L/2` with
no `√n`; the factor is irrelevant to the convergence conclusions and the Euclidean norm is the
one the rest of the library uses. ★★'''
deps = ["Matrix.norm_differenceJacobian_col_sub_le"]
