[[node]]
id = "RegulaFalsi.convergesWithOrder_one_iterate"
kind = "theorem"
desc = """**Regula falsi converges linearly** (the order quoted in [quarteroni2000numerical] §6.2.2,
citing Ralston and Rabinowitz 8.3 without proof): under the hypotheses of
`RegulaFalsi.tendsto_iterate` together with `ContDiffAt R 2 f a`, `deriv f a != 0` and
`iteratedDeriv 2 f a != 0`, the iterates converge to `a` with order `1`.

Blocked: only the convergence half is proved (`RegulaFalsi.tendsto_iterate`). What is missing is
the eventually-fixed-endpoint analysis: near the root the sign of the second derivative is
constant, so from some index on one end of the bracket is never replaced again and the method
becomes the chord method with a variable slope `f[x_k, x_k1] -> f[a, x_k1] = q`; the ratio
`|e_{k+1}|/|e_k|` then tends to `|f[a, x_k1, a]/f[a, x_k1]| = |1 - f'(a)/q|`, which lies strictly
between `0` and `1` by convexity. Identifying the fixed endpoint is the whole difficulty, and it
is not shortened by assuming `f` convex on the interval. The pieces that exist are
`Secant.sub_root_eq_mul_newton` (the secant error identity), `Chord.tendsto_sub_div_sub` and
`RegulaFalsi.state_mem_uIcc`. Estimated 150-250 lines."""
deps = ["ConvergesWithOrder", "RegulaFalsi.tendsto_iterate", "Secant.sub_root_eq_mul_newton", "Chord.tendsto_iterate"]
source = "Quarteroni–Sacco–Saleri, Numerical Mathematics, §6.2.2"

