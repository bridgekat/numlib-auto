[[node]]
id = "exists_unique_fixedPoint_Icc_of_abs_deriv_le"
kind = "theorem"
desc = '''**Theorem 6.1 (convergence of fixed-point iterations), scalar Banach on an interval.** For
`a ≤ b`, `φ : ℝ → ℝ` with `MapsTo φ (Icc a b) (Icc a b)`, `∀ x ∈ Icc a b, HasDerivWithinAt φ (φ' x)
(Icc a b) x` and `∀ x ∈ Icc a b, |φ' x| ≤ K` with `K < 1`: there is a unique `α ∈ Icc a b` with
`φ α = α`, and for every `x₀ ∈ Icc a b` the orbit `φ^[k] x₀` stays in `Icc a b`, converges to `α`, and
`|φ^[k] x₀ - α| ≤ K ^ k * |x₀ - α|`. Packaging of the existing `lipschitzOnWith_of_hasFDerivWithinAt`
(here Mathlib's `Convex.lipschitzOnWith_of_nnnorm_hasDerivWithin_le` on `convex_Icc`),
`exists_unique_fixedPoint_of_mapsTo` (`isClosed_Icc`, `nonempty_Icc`) and
`dist_iterate_le_of_mapsTo`; the book's `φ ∈ C¹[a, b]` is weakened to differentiability within the
interval. The limit (6.18) is `tendsto_sub_div_sub_of_hasDerivAt` in `Nonlinear/Order`, which needs
only differentiability at `α` and the orbit to avoid `α`. ★'''
deps = ["lipschitzOnWith_of_hasFDerivWithinAt", "exists_unique_fixedPoint_of_mapsTo", "dist_iterate_le_of_mapsTo"]

[[node]]
id = "tendsto_iterate_of_norm_fderiv_lt_one"
kind = "theorem"
desc = '''**Ostrowski's theorem (Property 6.3) in a normed space.** Let `E` be a normed space over `ℝ`
(or `RCLike 𝕜`), `φ : E → E`, `φ α = α`, `HasFDerivAt φ φ' α` and `‖φ'‖ < 1`. Then for every `q` with
`‖φ'‖ < q < 1` there is `δ > 0` such that `‖φ x - α‖ ≤ q ‖x - α‖` for `‖x - α‖ < δ`; consequently
`∀ x₀ ∈ Metric.ball α δ, ∀ k, φ^[k] x₀ ∈ Metric.ball α δ`, `‖φ^[k] x₀ - α‖ ≤ q ^ k ‖x₀ - α‖` and
`Tendsto (fun k => φ^[k] x₀) atTop (𝓝 α)`. Proof: `HasFDerivAt` gives
`‖φ x - α - φ' (x - α)‖ ≤ (q - ‖φ'‖) ‖x - α‖` near `α` (`HasFDerivAt.isLittleO`, `IsLittleO.def`),
add `‖φ' (x - α)‖ ≤ ‖φ'‖ ‖x - α‖`. No continuity or differentiability away from `α` is used — the
book's "continuous and differentiable in a neighbourhood `J`" (Ortega–Rheinboldt 10.1.3) is more than
needed. ★★'''
deps = []

[[node]]
id = "tendsto_iterate_of_abs_deriv_lt_one"
kind = "theorem"
desc = '''**Ostrowski's theorem, scalar form (Property 6.3 as printed):** `φ : ℝ → ℝ`, `φ α = α`,
`HasDerivAt φ φ' α`, `|φ'| < 1` ⟹ `∃ δ > 0, ∀ x₀, |x₀ - α| < δ → Tendsto (fun k => φ^[k] x₀) atTop (𝓝 α)`,
with the orbit in the `δ`-ball and the geometric bound `|φ^[k] x₀ - α| ≤ q ^ k |x₀ - α|` for any
chosen `q ∈ (|φ'|, 1)`. Instance of `tendsto_iterate_of_norm_fderiv_lt_one` with
`HasDerivAt.hasFDerivAt` and `‖φ' • 1‖ = |φ'|`. This is the local convergence theorem every
one-step scalar method (chord, Newton, Aitken, Steffensen) is reduced to. ★'''
deps = ["tendsto_iterate_of_norm_fderiv_lt_one"]

[[node]]
id = "not_tendsto_iterate_of_one_lt_abs_deriv"
kind = "theorem"
desc = '''**Remark 6.2: repulsion.** If `φ α = α`, `HasDerivAt φ φ' α` with `1 < |φ'|`, and `x` is an
orbit `x (k+1) = φ (x k)` with `x k ≠ α` for all `k`, then `¬ Tendsto x atTop (𝓝 α)`. If it
converged, `(x (k+1) - α)/(x k - α) → φ'` (`tendsto_sub_div_sub_of_hasDerivAt`) would make
`|x (k+1) - α| > |x k - α|` eventually, so the positive sequence `|x k - α|` would be eventually
increasing and could not tend to `0`. For `|φ'(α)| = 1` nothing can be said (Example 6.6 has both
behaviours). The `x k ≠ α` hypothesis is necessary: an orbit that lands on `α` converges. ★'''
deps = ["tendsto_sub_div_sub_of_hasDerivAt"]

[[node]]
id = "tendsto_iterate_of_exists_norm_pow_fderiv_lt_one"
kind = "theorem"
desc = '''Ostrowski's theorem with a power: if some power of the derivative at the fixed point is a
strict contraction, the iteration converges locally. Same hypotheses as
`tendsto_iterate_of_norm_fderiv_lt_one` with `‖G' xstar‖ < 1` replaced by
`∃ m : ℕ, ‖(G' xstar) ^ m‖ < 1`; conclusion `∃ δ > 0, ∀ x₀ ∈ ball xstar δ,
Tendsto (fun k => G^[k] x₀) atTop (𝓝 xstar)`, together with an `∃ δ' ≤ δ` such that the
iterates from `ball xstar δ'` stay in `ball xstar δ`. Proof: `HasFDerivAt.iterate` gives
`G^[m]` the derivative `(G' xstar) ^ m` at `xstar`, and near `xstar` the derivative
`∏ G' (G^[j] x)`, continuous at `xstar`; apply the `k = 1` theorem to `G^[m]`, then interleave
the `m` subsequences `k ↦ G^[m k + j] x₀ = G^[j] (G^[m k] x₀) → G^[j] xstar = xstar` as in
`tendsto_iterate_of_iterate_contractingWith`. In finite dimension `∃ m, ‖A ^ m‖ < 1` is
`ρ(A) < 1` (`Matrix.tendsto_pow_iff_complexSpectralRadius_lt_one`), which is how Property 7.3
is obtained without re-norming `ℝⁿ`: the ε-norm of `Numlib/LinearAlgebra/Matrix/EpsilonNorm`
produces a `Seminorm`, not a `NormedAddCommGroup` structure, and the mean value inequality is
not available for it. ★★★'''
deps = ["tendsto_iterate_of_norm_fderiv_lt_one", "tendsto_iterate_of_iterate_contractingWith"]

[[node]]
id = "exists_ball_mapsTo_iterate_of_exists_norm_pow_fderiv_lt_one"
kind = "theorem"
desc = '''The invariance clause of Property 7.3: under the hypotheses of
`tendsto_iterate_of_exists_norm_pow_fderiv_lt_one` and for any neighbourhood `D ∈ 𝓝 xstar`, there
is `S ∈ 𝓝 xstar` with `S ⊆ D` such that every orbit started in `S` stays in `D` for all `k`.
Proof: choose `δ` with `ball xstar δ ⊆ D`; the iterates of `G^[m]` contract towards `xstar` in a
smaller ball, and the finitely many intermediate maps `G^[j]`, `j < m`, are continuous at
`xstar`, so a small enough ball is carried into `ball xstar δ` by all of them. ★★'''
deps = ["tendsto_iterate_of_exists_norm_pow_fderiv_lt_one"]
