desc = '''
Broyden's method for nonlinear systems (Quarteroni–Sacco–Saleri §7.1.3–7.1.4; Dennis–Schnabel
Ch. 8): the rank-one secant update `Q₊ = Q + ((y - Q s) ⊗ s) / ⟪s, s⟫` on a real inner product
space, written with Mathlib's `rankOne`, the secant condition `Q₊ s = y`, the fact that `Q₊`
agrees with `Q` on `s^⊥` (the least-change reading of the book's derivation of (7.14)), least
change in the operator norm and, on `Matrix n n ℝ`, in the Frobenius norm, the bounded
deterioration estimate that opens the Dennis–Moré superlinear convergence proof, and the
iteration `Broyden.step` / `Broyden.iterate` on the state `(x, Q)`. The superlinear convergence
theorem itself (Property 7.2) is not planned; see the surface node
`QuarteroniSaccoSaleri.Chapter07.property_7_2`. The symmetric updates for minimization (SR1, PSB,
DFP, BFGS) are `Numlib/Optimization/QuasiNewton.lean`.
'''

[[node]]
id = "Broyden.update"
kind = "definition"
desc = '''`Broyden.update (Q : E →L[ℝ] E) (s y : E) : E →L[ℝ] E := Q + (1 / ⟪s, s⟫) • rankOne ℝ (y - Q s) s`
on a real inner product space `E`, where `rankOne ℝ u v : E →L[ℝ] E` is `z ↦ ⟪v, z⟫ u`
(`Mathlib/Analysis/InnerProductSpace/LinearMap.lean`). This is (7.14) with `s = δx_k`,
`y = b_k = F x_k - F x_{k-1}`. ★'''
deps = []

[[node]]
id = "Broyden.update_apply_self"
kind = "theorem"
desc = 'The secant condition (7.12) with `j = 1`: for `s ≠ 0`, `Broyden.update Q s y s = y`. ★'
deps = ["Broyden.update"]

[[node]]
id = "Broyden.update_sub_apply_of_inner_eq_zero"
kind = "theorem"
desc = '''The update changes `Q` only along `s`: `⟪s, v⟫ = 0 → (Broyden.update Q s y - Q) v = 0`.
With `update_apply_self` this is exactly the book's characterization: `(Q_k - Q_{k-1}) s` vanishes
for every `s ⟂ δx_k` while (7.12) holds. ★'''
deps = ["Broyden.update"]

[[node]]
id = "Broyden.norm_update_sub_le"
kind = "theorem"
desc = '''Least change in the operator norm: if `s ≠ 0` and `Q' s = y` then
`‖Broyden.update Q s y - Q‖ ≤ ‖Q' - Q‖`. Proof: `(update Q s y - Q) v = (⟪s, v⟫ / ‖s‖²) • (Q' - Q) s`,
and `|⟪s, v⟫| ≤ ‖s‖ ‖v‖`. ★'''
deps = ["Broyden.update"]

[[node]]
id = "Broyden.State"
kind = "definition"
desc = '''The state of Broyden's iteration: the current point `x : E` and the current Jacobian
approximation `Q : E →L[ℝ] E`. ★'''
deps = []

[[node]]
id = "Broyden.step"
kind = "definition"
desc = '''One step of (7.11)–(7.14): `δ := -(Q.inverse (Fn x))` (junk `0` when `Q` is not
invertible, as in `Newton.step`), `x' := x + δ`, `Q' := Broyden.update Q δ (Fn x' - Fn x)`. ★'''
deps = ["Broyden.State", "Broyden.update"]

[[node]]
id = "Broyden.iterate"
kind = "definition"
desc = '''`Broyden.iterate Fn x₀ Q₀ k := (Broyden.step Fn)^[k] ⟨x₀, Q₀⟩`, with the recurrence lemma
`Broyden.iterate_succ` and the fact that a root is a fixed point of the `x`-component. ★'''
deps = ["Broyden.step"]

[[node]]
id = "Matrix.broydenUpdate"
kind = "definition"
desc = '''The matrix form of (7.14): `Matrix.broydenUpdate (Q : Matrix n n ℝ) (s y : n → ℝ) :=
Q + (1 / (s ⬝ᵥ s)) • vecMulVec (y - Q *ᵥ s) s`, together with the bridge
`Matrix.toEuclideanLin_broydenUpdate : toEuclideanLin (broydenUpdate Q s y) =
Broyden.update (toEuclideanLin Q) s y` (as maps of `EuclideanSpace ℝ n`). ★'''
deps = ["Broyden.update"]

[[node]]
id = "Matrix.frobenius_norm_broydenUpdate_sub_le"
kind = "theorem"
desc = '''Least change in the Frobenius norm (Dennis–Schnabel Lemma 8.1.1), with
`Matrix.frobeniusNormedAddCommGroup` as a local instance: for `s ≠ 0` and `Q' *ᵥ s = y`,
`‖broydenUpdate Q s y - Q‖ ≤ ‖Q' - Q‖`. Proof: `broydenUpdate Q s y - Q = (Q' - Q) * P` with
`P = vecMulVec s s / (s ⬝ᵥ s)` the orthogonal projector onto `span {s}`, `‖P‖_F = 1`, and
`Matrix.frobenius_nnnorm_mul` (submultiplicativity). ★★'''
deps = ["Matrix.broydenUpdate"]

[[node]]
id = "Matrix.frobenius_norm_broydenUpdate_sub_le_add"
kind = "theorem"
desc = '''Bounded deterioration (Dennis–Schnabel Lemma 8.2.1), the first step of every superlinear
convergence proof for Broyden's method. If `J : EuclideanSpace ℝ n → Matrix n n ℝ` is the Jacobian
of `F` with `toEuclideanLin (J y)` `L`-Lipschitz (in the Frobenius norm) on a convex set `D`
containing `x` and `x₊ = x + s`, and `y = F x₊ - F x`, then for every `z ∈ D`,
`‖broydenUpdate Q s y - J z‖_F ≤ ‖Q - J z‖_F + (L / 2) * (‖x₊ - z‖ + ‖x - z‖)`. Proof:
`broydenUpdate Q s y - J z = (Q - J z) (1 - P) + ((y - J z s) sᵀ) / (sᵀ s)`, `‖1 - P‖₂ = 1`, and
`‖y - J z s‖ ≤ (L/2) (‖x₊ - z‖ + ‖x - z‖) ‖s‖` from the integral form of the mean value theorem.
★★★'''
deps = ["Matrix.broydenUpdate", "Matrix.frobenius_norm_broydenUpdate_sub_le"]
