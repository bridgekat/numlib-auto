[[node]]  # staged by ch04
id = "tendsto_iterate_scalarStep_of_concaveOn"
kind = "theorem"
desc = '''Monotone convergence of Newton's method (Fourier's condition, the case used by [golub2013matrix] (4.7.10)):
let `f : ℝ → ℝ` be differentiable on `[α, x₀]` with derivative `f'` (`HasDerivAt f (f' x) x`),
`f' x < 0` and `f'` antitone there (`f` decreasing and concave), `f α = 0`, `α ≤ x₀`. Then the
iterates `x_k = (Newton.scalarStep f f')^[k] x₀` satisfy `α ≤ x_{k+1} ≤ x_k` and tend to `α`. Step:
`f(x_k) ≤ 0` and `f' < 0` give `x_{k+1} ≤ x_k`; concavity, `0 = f(α) ≤ f(x_k) + f'(x_k)(α − x_k)`,
gives `x_{k+1} ≥ α`; the limit `ℓ` satisfies `ℓ = ℓ − f(ℓ)/f'(ℓ)` by continuity (`f'` is bounded
away from `0` on the compact interval), so `f(ℓ) = 0`, `ℓ = α` by strict monotonicity.
`ConcaveOn.le_slope`-type lemmas (`ConcaveOn` from `Antitone` derivative: `antitoneOn_deriv…`),
`tendsto_atTop_ciInf`. ★★ (~100 lines)'''
deps = ["Newton.scalarStep"]
