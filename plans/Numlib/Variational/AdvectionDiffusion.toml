[[node]]
id = "seminorm_sub_stabilized_le_sg_quadratic"
kind = "theorem"
desc = '''**Theorem 12.4, (12.86), Scharfetter-Gummel with `k = 2`**: for the model problem (12.70)
with `u` in `H^3(0, 1)` and the trial space `X_h^{2,0}`, the stabilized Galerkin error satisfies
`|u - u_h|_{H^1} <= C h^2 (|u|_{H^1} + |u|_{H^3})` with `C` independent of `h` and of `u`.  This
is `AdvectionDiffusion.seminorm_sub_stabilized_le` with `w = Pi_h^2 u` together with
`phiSG_le_sq` (which turns the consistency term `eps phi^SG(Pe)/eps_h` into `O(h^2)`) and the
interpolation estimate `|u - Pi_h^2 u|_{H^1} <= h^2 |u|_{H^3}`.

Blocked: the `P_2` shape functions and their basis are now in place
(`FiniteElement.quadraticShape`, `quadraticBasis`), and the interpolation estimate itself is
proved in broken form as `sobolevSeminorm_sub_piecewisePolyInterp_le` (`k = 2`, `m = 1`) in
`Numlib/Approximation/SobolevInterpolation.lean`.  What is missing is the `P_2` analogue of the
`P_1` interpolation layer of `Numlib/Variational/FiniteElementInterval.lean`: an operator
`quadraticInterp : H^1(a, b) -> H^1(a, b)` landing in `X_h^{2,0}`, the identification of its
weak derivative with the panelwise derivative of the local Lagrange polynomials (the analogue of
`coeFn_deriv_lagrangeInterp`, which for `P_1` is the panelwise difference quotient and is the
longest proof in that file), and the bridge from the broken sum of
`sobolevSeminorm_sub_piecewisePolyInterp_le` to the `H^1` seminorm of the error.  Estimated one
day.'''
deps = ["AdvectionDiffusion.seminorm_sub_stabilized_le", "AdvectionDiffusion.phiSG_le_sq", "FiniteElement.quadraticShape"]
