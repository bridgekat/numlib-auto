[[node]]
id = "seminorm_sub_stabilized_le_sg"
kind = "theorem"
desc = '''**Theorem 12.4, Scharfetter-Gummel, k = 1 and k = 2**: (i) for `k = 1`,
`|u - u_h|_1 <= C_2 h |u|_2` - even the book's factor `(1 + 2 Pe_gl C_P)` is absent, because by
`sg_nodal_exact` `u_h = Pi_h^1 u` exactly, so the error *is* the interpolation error; (ii) for
`k = 2`, `|u - u_h|_1 <= C h^2 (|u|_1 + |u|_3)` for `u` in `H^3`, from
`seminorm_sub_stabilized_le` with `w = Pi_h^2 u`, the estimate `|u - Pi_h^2 u|_1 <= C h^2 |u|_3`
and `phiSG_le_sq`. **

Blocked: the finite element space and the `P_1` interpolant are now in place
(`FiniteElement.lagrangeInterp`, `FiniteElement.seminorm_sub_lagrangeInterp_le`), and the
analogue of the upwind bound with `phiSG_le_sq` in place of `phi^UP <= Pe` is immediate; what is
missing is the *sharp* form the plan asks for. Clause (i) needs the bridge "the `P_1` Galerkin
solution of the stabilized problem is the piecewise linear function whose nodal values solve the
viscosity difference scheme" - which is `FiniteElement.galerkin_iff_centredScheme` applied with
`eps := AdvectionDiffusion.viscosity eps beta h phiSG` (the stabilized form *is*
`EllipticInterval.form` at that constant, and `FiniteElement.constLinfty` and
`AdvectionDiffusion.constLinf` are the same element) - followed by `sg_nodal_exact` and the
identification of the exact weak solution with `AdvectionDiffusion.exactSolution`, which is a
chain of four surface-level steps. Clause (ii) needs `FiniteElement.quadraticShape` and the `P_2`
interpolant, which are not written. Estimated half a day for (i), a day for (ii).'''
deps = ["AdvectionDiffusion.seminorm_sub_stabilized_le", "AdvectionDiffusion.sg_nodal_exact", "AdvectionDiffusion.phiSG_le_sq", "FiniteElement.lagrangeInterp", "AdvectionDiffusion.seminorm_sub_stabilized_le_upwind"]
