namespace = "FiniteElement"
desc = '''
Lagrange finite elements on an interval: the spaces `X_h^k` of continuous piecewise polynomials
of degree `≤ k` on a partition of `[a, b]`, seen inside `H^1(a, b)`
(`Numlib/Analysis/Sobolev/Interval.lean`), their subspaces `X_h^{k,0}` of functions vanishing at
the endpoints inside `H^1_0(a, b)`, their dimensions, the Lagrangian shape functions (hat
functions for `k = 1`, the vertex and bubble functions for `k = 2`), the reference element and
the affine map, the hierarchical basis, and the stiffness and mass matrices of the elliptic form
of `Numlib/Variational/EllipticInterval.lean` in the nodal basis — tridiagonal for `k = 1`,
pentadiagonal for `k = 2`, and explicitly `(ε/h) tridiag(-1, 2, -1) + (β/2) tridiag(-1, 0, 1) +
(γ h/6) tridiag(1, 4, 1)` for constant coefficients on a uniform mesh. Quarteroni–Sacco–Saleri
§12.4.5–12.4.6 and §8.3 (the space (8.22)); chapter 13 (§13.3) uses the mass and stiffness
matrices of `X_h^1` for the semi-discrete heat equation, so they are here and not in an
advection–diffusion module.

Relation to the existing library: the *functions* of `X_h^1` already exist as
`piecewiseLinearRamp`/`piecewiseLinearInterpCLM` in `Numlib/Approximation/Interpolation.lean`
(on `C(Icc a b, ℝ)`) and as the `L²` subspace `piecewiseLinearLp` of
`Numlib/Approximation/PiecewiseLinearL2.lean`; the degree-`k` interpolant is
`piecewisePolyInterpCLM`. What is new is the `H^1` structure: membership in `H^1(a, b)` by
`memSobolevInterval_of_piecewise_contDiffOn`, the weak derivative (piecewise constant for
`k = 1`), and the identification of the Galerkin system with `IsGalerkinSolution.iff_gramMatrix_mulVec`.
The interpolation error in Sobolev seminorms (Theorem 8.3) is chapter 8's
`Numlib/Approximation/SobolevInterpolation.lean`, which this module does not need.
'''

[[node]]
id = "lagrangeSpace"
kind = "definition"
desc = '''`FiniteElement.lagrangeSpace hab k x : Submodule ℝ (SobolevInterval 1 a b)` for `hab : a < b`, a
degree `k ≥ 1` and a partition `x : Fin (N + 2) → ℝ` (`StrictMono x`, `x 0 = a`, `x (Fin.last _) = b`,
bundled as `IsPartition a b x`): the space `X_h^k` (8.22) of the elements of `H^1(a, b)` whose
continuous representative restricts to a polynomial of degree `≤ k` on every panel `Icc (x j) (x (j+1))`.
Membership of every such function in `H^1` is `memSobolevInterval_of_piecewise_contDiffOn`;
`FiniteElement.lagrangeSpaceZero hab k x := lagrangeSpace hab k x ⊓ SobolevIntervalZero a b`, the space
`X_h^{k,0}` (12.57), equivalently (`mem_lagrangeSpaceZero_iff`) the elements of `X_h^k` with
`g(a) = g(b) = 0` (`mem_sobolevIntervalZero_iff`). `meshSize x = max_j (x (j+1) - x j)`, the `h`. This
is the copy inside `H¹(a, b)` of the function space `Spline.splineSpace a b n x k 0` of
`Numlib/Approximation/Spline` (`lagrangeSpace_eq_map_splineSpace`), not a third definition of the
continuous piecewise polynomials. ★★'''
deps = ["SobolevInterval", "SobolevIntervalZero", "memSobolevInterval_of_piecewise_contDiffOn", "mem_sobolevIntervalZero_of_toContinuousMap_eq_zero"]

[[node]]
id = "hatFunction"
kind = "definition"
desc = '''The hat (shape) functions (12.61) of `X_h^1`: `FiniteElement.hatFunction hab x i : SobolevInterval 1
a b` for `i : Fin (N + 2)`, the continuous piecewise linear function with `φ_i (x j) = δ_ij` — on
`[x_{i-1}, x_i]` it is `(t - x_{i-1})/(x_i - x_{i-1})`, on `[x_i, x_{i+1}]` it is `(x_{i+1} - t)/(x_{i+1}
- x_i)`, zero elsewhere (the two end functions have one ramp). Its function is
`piecewiseLinearRamp` combinations of `Numlib/Approximation/Interpolation.lean`
(`hatFunction_fn_eq`), its weak derivative is `±1/h_j` on the two adjacent panels
(`hatFunction_deriv`), its support is `[x_{i-1}, x_{i+1}]` (`hatFunction_support`), and
`hatFunction_apply_node : toContinuousMap (hatFunction i) (x j) = if i = j then 1 else 0`. ★★'''
deps = ["FiniteElement.lagrangeSpace", "piecewiseLinearInterpCLM", "SobolevInterval.toContinuousMap"]

[[node]]
id = "hatBasis"
kind = "definition"
desc = '''The hat functions are a basis: `FiniteElement.hatBasis hab x : Module.Basis (Fin (N + 2)) ℝ
(lagrangeSpace hab 1 x)`, with `hatBasis_repr : (hatBasis.repr v) i = g_v (x i)` — a continuous
piecewise linear function is determined by its nodal values, and `v = ∑ v_i φ_i`
(`eq_sum_hatFunction`). Hence `finrank_lagrangeSpace_one : finrank ℝ (lagrangeSpace hab 1 x) = N + 2`
(the book's `n + 1` nodes) and, dropping the two end functions, `hatBasisZero : Module.Basis (Fin N) ℝ
(lagrangeSpaceZero hab 1 x)` with `finrank_lagrangeSpaceZero_one = N` (the book's `n - 1`). ★★'''
deps = ["FiniteElement.hatFunction", "FiniteElement.lagrangeSpace"]

[[node]]
id = "finrank_lagrangeSpace"
kind = "theorem"
desc = '''Dimensions for general degree: `finrank ℝ (lagrangeSpace hab k x) = (N + 1) * k + 1` and
`finrank ℝ (lagrangeSpaceZero hab k x) = (N + 1) * k - 1` (the book's `nk + 1` and `nk - 1` with `n`
panels), through the Lagrangian nodal basis at the `k + 1` equispaced nodes of each panel
(`FiniteElement.nodalBasis hab k x`, unisolvence of Lagrange interpolation on each panel,
`Lagrange.isUnisolvent_polyLE` of `Numlib/Approximation/Interpolation.lean`, glued by continuity at
the panel endpoints). For `k = 2` the nodes are the panel endpoints and midpoints, giving the
even/odd labelling of (12.63)–(12.64). ★★★'''
deps = ["FiniteElement.lagrangeSpace", "Lagrange.isUnisolvent_polyLE"]

[[node]]
id = "referenceShape"
kind = "definition"
desc = '''The reference element: `FiniteElement.affineMap x j : ℝ → ℝ`, `ξ ↦ x j + ξ (x (j+1) - x j)` (12.62),
mapping `[0, 1]` onto the panel `I_j`; the reference shape functions `referenceHat 0 ξ = 1 - ξ`,
`referenceHat 1 ξ = ξ`; `referenceQuadratic 0 ξ = (1 - ξ)(1 - 2ξ)`, `referenceQuadratic 1 ξ = 4 (1 - ξ) ξ`,
`referenceQuadratic 2 ξ = ξ (2ξ - 1)` (12.65); and the hierarchical `referenceHierarchical 0 = 1 - ξ`,
`referenceHierarchical 1 = (1 - ξ) ξ`, `referenceHierarchical 2 = ξ` (12.66). Theorems:
`hatFunction_eq_referenceHat_comp` (on `I_j`, `φ_j = φ̂₀ ∘ ξ`, `φ_{j+1} = φ̂₁ ∘ ξ` with `ξ = (affineMap x j)⁻¹`),
`quadraticShape_eq_referenceQuadratic_comp` likewise for (12.63)–(12.64), and
`referenceHierarchical_linearIndependent : LinearIndependent ℝ referenceHierarchical` (as functions
on `[0, 1]`: `α₀ + ξ(α₁ - α₀ + α₂) - α₁ ξ² = 0` forces `α₀ = α₁ = α₂ = 0`). ★'''
deps = ["FiniteElement.hatFunction"]

[[node]]
id = "quadraticShape"
kind = "definition"
desc = '''The shape functions of `X_h^2` (12.63)–(12.64): with the `2(N+1) + 1` nodes `x_0 < x_1 < ⋯` (panel
endpoints at even indices, midpoints at odd), `FiniteElement.quadraticShape hab x i : SobolevInterval 1
a b` is the continuous piecewise quadratic with `φ_i(x_j) = δ_ij`: for even `i` two quadratic pieces on
the two adjacent panels, for odd `i` the bubble `((x_{i+1} - t)(t - x_{i-1}))/((x_{i+1} - x_i)(x_i - x_{i-1}))`
supported in one panel. `quadraticShape_apply_node`, `quadraticShape_support` (one panel for the
bubble, two for a vertex function), and `quadraticBasis : Module.Basis (Fin (2 (N + 1) + 1)) ℝ
(lagrangeSpace hab 2 x)`. ★★'''
deps = ["FiniteElement.lagrangeSpace", "FiniteElement.finrank_lagrangeSpace"]

[[node]]
id = "stiffnessMatrix"
kind = "definition"
desc = '''The stiffness matrix `A_fe` of the elliptic form in the nodal basis of `X_h^{k,0}`:
`FiniteElement.stiffnessMatrix hab α β γ (φ : ι → SobolevInterval 1 a b) : Matrix ι ι ℝ :=
(EllipticInterval.form hab α β γ).gramMatrix φ`, i.e. `A_ij = a(φ_j, φ_i)` (`SesqForm.gramMatrix` of
`Numlib/Variational/Galerkin.lean`), and the load vector `loadVector f φ i = ∫ f φ_i`. The Galerkin
problem in `X_h^{k,0}` is the linear system `A_fe u = f` (12.48): `IsGalerkinSolution.iff_gramMatrix_mulVec`.
Also the mass matrix `FiniteElement.massMatrix hab φ := (EllipticInterval.form hab 0 0 1).gramMatrix φ`,
`M_ij = ∫ φ_j φ_i`, for chapter 13. ★'''
deps = ["EllipticInterval.form", "SesqForm.gramMatrix", "FiniteElement.hatBasis"]

[[node]]
id = "stiffnessMatrix_eq_zero_of_lt"
kind = "theorem"
desc = '''Sparsity from local supports: in the hat basis (`k = 1`),
`stiffnessMatrix hab α β γ (hatFunction hab x) i j = 0` whenever `|i - j| > 1` (the supports of `φ_i`
and `φ_j` meet in a null set), so `A_fe` is tridiagonal (`Matrix.IsTridiagonal` of
`Numlib/LinearAlgebra/Matrix/Hessenberg.lean`); in the quadratic basis the entries vanish for
`|i - j| > 2` (pentadiagonal; the book states it, and a bandwidth predicate is chapter 1's
`Matrix.HasLowerBandwidth`/`HasUpperBandwidth` EXT of `Hessenberg.lean` — state with the explicit
inequality until it exists). Same for the mass matrix. ★'''
deps = ["FiniteElement.stiffnessMatrix", "FiniteElement.hatFunction", "Matrix.IsTridiagonal"]

[[node]]
id = "stiffnessMatrix_uniform_eq"
kind = "theorem"
desc = '''The stiffness matrix for constant coefficients `ε β γ` on the uniform mesh `uniformGrid a b N`
(`h = (b - a)/(N + 1)`), in the interior hat basis of `X_h^{1,0}`:
`stiffnessMatrix = (ε / h) • tridiag(-1, 2, -1) + (β / 2) • tridiag(-1, 0, 1) + (γ h / 6) • tridiag(1, 4, 1)`
with `Matrix.symmTridiagonalToeplitz` and `Matrix.tridiagonalToeplitz` of
`Numlib/LinearAlgebra/Matrix/TridiagonalToeplitz.lean` — the entries Program 95 assembles and the
`k = 1` computation of §12.5.1: `∫ φ_{i-1}' φ_i' = -1/h`, `∫ φ_i'² = 2/h`, `∫ φ_{i-1}' φ_i = -1/2`,
`∫ φ_i' φ_i = 0`, `∫ φ_{i+1}' φ_i = 1/2`, `∫ φ_{i±1} φ_i = h/6`, `∫ φ_i² = 2h/3`. For `γ = 0` and
`β = 0`, `A_fe = (ε/h) tridiag(-1, 2, -1) = ε h · A_fd`, so the Galerkin `P_1` system for `-εu'' = f`
is the centred finite difference system up to the scaling and the load vector. ★★'''
deps = ["FiniteElement.stiffnessMatrix", "FiniteElement.hatFunction", "Matrix.symmTridiagonalToeplitz", "Matrix.tridiagonalToeplitz", "FiniteDifference.uniformGrid"]

[[node]]
id = "stiffnessMatrix_posDef"
kind = "theorem"
desc = '''`A_fe` is symmetric positive definite for `β = 0`, `α ≥ α₀ > 0`, `γ ≥ 0` (§12.4.4: "if `β = γ = 0`
the matrix `A_G` is s.p.d."), and positive definite (not symmetric) under (12.50): from
`SesqForm.gramMatrix_posDef` with `form_isCoerciveWith_seminorm`/`form_isCoerciveWith_seminorm_of_le`
and the linear independence of the nodal basis. The spectral condition number for the model problem,
`K₂(A_fe) = cot² (π h / 2)` on the uniform mesh with `α = 1`, `β = γ = 0`, is
`Matrix.condNumber_symmTridiagonalToeplitz_neg_one_two` through `stiffnessMatrix_uniform_eq`
(`condNumber_stiffnessMatrix_model`); the book's `K₂(A_fe) = O(h⁻²)` for general coefficients is quoted
from [QV94] and not planned. ★'''
deps = ["FiniteElement.stiffnessMatrix", "SesqForm.gramMatrix_posDef", "EllipticInterval.form_isCoerciveWith_seminorm", "FiniteElement.stiffnessMatrix_uniform_eq", "Matrix.condNumber_symmTridiagonalToeplitz_neg_one_two"]

[[node]]
id = "galerkin_iff_centredScheme"
kind = "theorem"
desc = '''**Galerkin `P_1` on a uniform mesh is the centred difference scheme** (12.75): for constant `ε > 0`
and `β`, `u_h ∈ lagrangeSpace hab 1 (uniformGrid 0 1 N)` with nodal values `u_i` satisfies
`form hab ε β 0 u_h v_h = 0` for all `v_h ∈ lagrangeSpaceZero` if and only if
`(ε/h) (-u_{i-1} + 2u_i - u_{i+1}) + (β/2) (u_{i+1} - u_{i-1}) = 0` for `i = 1, …, N`. From
`stiffnessMatrix_uniform_eq` and `IsGalerkinSolution.iff_gramMatrix_mulVec`, keeping the boundary
columns (the nonhomogeneous Dirichlet data `u_0 = 0`, `u_{N+1} = 1` of (12.72) enter the right-hand
side). With `f ≠ 0` the load vector is `∫ f φ_i`, which is `h f(x_i)` only after the trapezoidal
quadrature — the point where Galerkin and finite differences differ. ★'''
deps = ["FiniteElement.stiffnessMatrix_uniform_eq", "IsGalerkinSolution.iff_gramMatrix_mulVec", "FiniteElement.hatBasis"]

[[node]]
id = "lagrangeSpace_eq_map_splineSpace"
kind = "theorem"
desc = '''`X_h^k` is the spline space with no smoothness: for `hab : a < b`, a partition `x` and `k ≥ 1`,
`u ∈ lagrangeSpace hab k x ↔ ∃ f ∈ Spline.splineSpace a b n x k 0, u.toContinuousMap = f` — the
continuous functions on `[a, b]` that are polynomials of degree `≤ k` on every panel
(`Numlib/Approximation/Spline`), read inside `H¹(a, b)` through
`memSobolevInterval_of_piecewise_contDiffOn`; equivalently `lagrangeSpace` is the image of that
subspace under the resulting linear map `C(Icc a b, ℝ) ⊇ splineSpace → SobolevInterval 1 a b`, which
is injective. This is the one definition of the continuous piecewise polynomials: `Spline.splineSpace`
is the function space, `lagrangeSpace` its copy inside `H¹` that the Galerkin theory needs, and
`BrokenPolynomial.continuous` (`Numlib/Approximation/BrokenPolynomial`,
`BrokenPolynomial.toContinuousMap_range_eq_splineSpace`) its per-panel representation; a fact about
one transfers to the others through these bridges instead of being proved three times. ★'''
deps = ["lagrangeSpace", "Spline.splineSpace", "memSobolevInterval_of_piecewise_contDiffOn", "SobolevInterval.toContinuousMap"]
