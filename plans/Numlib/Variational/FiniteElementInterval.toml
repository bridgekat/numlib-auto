[[node]]
id = "stiffnessMatrix_uniform_eq"
kind = "theorem"
desc = '''The stiffness matrix for constant coefficients `ε β γ` on the uniform mesh `uniformGrid a b N`
(`h = (b - a)/(N + 1)`), in the interior hat basis of `X_h^{1,0}`:
`stiffnessMatrix = (ε / h) • tridiag(-1, 2, -1) + (β / 2) • tridiag(-1, 0, 1) + (γ h / 6) • tridiag(1, 4, 1)`
with `Matrix.symmTridiagonalToeplitz` and `Matrix.tridiagonalToeplitz` of
`Numlib/LinearAlgebra/Matrix/TridiagonalToeplitz.lean` — the entries Program 95 assembles and the
`k = 1` computation of §12.5.1: `∫ φ_{i-1}' φ_i' = -1/h`, `∫ φ_i'² = 2/h`, `∫ φ_{i-1}' φ_i = -1/2`,
`∫ φ_i' φ_i = 0`, `∫ φ_{i+1}' φ_i = 1/2`, `∫ φ_{i±1} φ_i = h/6`, `∫ φ_i² = 2h/3`. For `γ = 0` and
`β = 0`, `A_fe = (ε/h) tridiag(-1, 2, -1) = ε h · A_fd`, so the Galerkin `P_1` system for `-εu'' = f`
is the centred finite difference system up to the scaling and the load vector. ★★

