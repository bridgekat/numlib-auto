[[node]]
id = "lagrangeSpace"

[[node]]
id = "hatFunction"
kind = "definition"
desc = '''The hat (shape) functions (12.61) of `X_h^1`: `FiniteElement.hatFunction hab x i : SobolevInterval 1
a b` for `i : Fin (N + 2)`, the continuous piecewise linear function with `φ_i (x j) = δ_ij` — on
`[x_{i-1}, x_i]` it is `(t - x_{i-1})/(x_i - x_{i-1})`, on `[x_i, x_{i+1}]` it is `(x_{i+1} - t)/(x_{i+1}
- x_i)`, zero elsewhere (the two end functions have one ramp). Its function is
`piecewiseLinearRamp` combinations of `Numlib/Approximation/Interpolation.lean`
(`hatFunction_fn_eq`), its weak derivative is `±1/h_j` on the two adjacent panels
(`hatFunction_deriv`), its support is `[x_{i-1}, x_{i+1}]` (`hatFunction_support`), and
`hatFunction_apply_node : toContinuousMap (hatFunction i) (x j) = if i = j then 1 else 0`. ★★

Blocked: not reached this round (`agent/bvp` spent its budget on `FiniteDifference/BoundaryValue`
and the chapter-12 surface). The spine is in place: `lagrangeSpace` is the preimage of
`Spline.splineSpace a b n x k 0` under `SobolevInterval.toContinuousMap`, and
`FiniteElement.lagrangeSpaceEquiv` identifies the two, so a fact proved for one transfers.
The hat functions still have to be built as elements of `H¹(a, b)`: `Spline.cardinalBasis`
is a *cubic* cardinal spline, so the piecewise-linear hat has to be assembled (from
`Approximation/Interpolation`'s `piecewiseLinearRamp`) and put in `H¹` through
`FiniteElement.exists_mem_lagrangeSpace`; its weak derivative is `±1/h_j`, which is what the
stiffness-matrix integrals need through `EllipticInterval.form_apply`.'''
deps = ["FiniteElement.lagrangeSpace", "piecewiseLinearInterpCLM", "SobolevInterval.toContinuousMap"]

[[node]]
id = "hatBasis"
kind = "definition"
desc = '''The hat functions are a basis: `FiniteElement.hatBasis hab x : Module.Basis (Fin (N + 2)) ℝ
(lagrangeSpace hab 1 x)`, with `hatBasis_repr : (hatBasis.repr v) i = g_v (x i)` — a continuous
piecewise linear function is determined by its nodal values, and `v = ∑ v_i φ_i`
(`eq_sum_hatFunction`). Hence `finrank_lagrangeSpace_one : finrank ℝ (lagrangeSpace hab 1 x) = N + 2`
(the book's `n + 1` nodes) and, dropping the two end functions, `hatBasisZero : Module.Basis (Fin N) ℝ
(lagrangeSpaceZero hab 1 x)` with `finrank_lagrangeSpaceZero_one = N` (the book's `n - 1`). ★★

