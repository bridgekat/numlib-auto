[[node]]
id = "referenceShape"
kind = "definition"
desc = '''The reference element: `FiniteElement.affineMap x j : ℝ → ℝ`, `ξ ↦ x j + ξ (x (j+1) - x j)` (12.62),
mapping `[0, 1]` onto the panel `I_j`; the reference shape functions `referenceHat 0 ξ = 1 - ξ`,
`referenceHat 1 ξ = ξ`; `referenceQuadratic 0 ξ = (1 - ξ)(1 - 2ξ)`, `referenceQuadratic 1 ξ = 4 (1 - ξ) ξ`,
`referenceQuadratic 2 ξ = ξ (2ξ - 1)` (12.65); and the hierarchical `referenceHierarchical 0 = 1 - ξ`,
`referenceHierarchical 1 = (1 - ξ) ξ`, `referenceHierarchical 2 = ξ` (12.66). Theorems:
`hatFunction_eq_referenceHat_comp` (on `I_j`, `φ_j = φ̂₀ ∘ ξ`, `φ_{j+1} = φ̂₁ ∘ ξ` with `ξ = (affineMap x j)⁻¹`),
`quadraticShape_eq_referenceQuadratic_comp` likewise for (12.63)–(12.64), and
`referenceHierarchical_linearIndependent : LinearIndependent ℝ referenceHierarchical` (as functions
on `[0, 1]`: `α₀ + ξ(α₁ - α₀ + α₂) - α₁ ξ² = 0` forces `α₀ = α₁ = α₂ = 0`). ★

