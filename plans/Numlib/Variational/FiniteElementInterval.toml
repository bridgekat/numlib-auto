[[node]]
id = "galerkin_iff_centredScheme"
kind = "theorem"
desc = '''**Galerkin `P_1` on a uniform mesh is the centred difference scheme** (12.75): for constant `ε > 0`
and `β`, `u_h ∈ lagrangeSpace hab 1 (uniformGrid 0 1 N)` with nodal values `u_i` satisfies
`form hab ε β 0 u_h v_h = 0` for all `v_h ∈ lagrangeSpaceZero` if and only if
`(ε/h) (-u_{i-1} + 2u_i - u_{i+1}) + (β/2) (u_{i+1} - u_{i-1}) = 0` for `i = 1, …, N`. From
`stiffnessMatrix_uniform_eq` and `IsGalerkinSolution.iff_gramMatrix_mulVec`, keeping the boundary
columns (the nonhomogeneous Dirichlet data `u_0 = 0`, `u_{N+1} = 1` of (12.72) enter the right-hand
side). With `f ≠ 0` the load vector is `∫ f φ_i`, which is `h f(x_i)` only after the trapezoidal
quadrature — the point where Galerkin and finite differences differ. ★

