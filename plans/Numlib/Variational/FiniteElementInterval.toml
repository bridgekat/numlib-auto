[[node]]
id = "quadraticShape"
kind = "definition"
desc = '''The shape functions of `X_h^2` (12.63)–(12.64): with the `2(N+1) + 1` nodes `x_0 < x_1 < ⋯` (panel
endpoints at even indices, midpoints at odd), `FiniteElement.quadraticShape hab x i : SobolevInterval 1
a b` is the continuous piecewise quadratic with `φ_i(x_j) = δ_ij`: for even `i` two quadratic pieces on
the two adjacent panels, for odd `i` the bubble `((x_{i+1} - t)(t - x_{i-1}))/((x_{i+1} - x_i)(x_i - x_{i-1}))`
supported in one panel. `quadraticShape_apply_node`, `quadraticShape_support` (one panel for the
bubble, two for a vertex function), and `quadraticBasis : Module.Basis (Fin (2 (N + 1) + 1)) ℝ
(lagrangeSpace hab 2 x)`. ★★

