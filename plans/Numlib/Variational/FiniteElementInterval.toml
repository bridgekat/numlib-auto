[[node]]
id = "stiffnessMatrix_eq_zero_of_lt"
kind = "theorem"
desc = '''Sparsity from local supports: in the hat basis (`k = 1`),
`stiffnessMatrix hab α β γ (hatFunction hab x) i j = 0` whenever `|i - j| > 1` (the supports of `φ_i`
and `φ_j` meet in a null set), so `A_fe` is tridiagonal (`Matrix.IsTridiagonal` of
`Numlib/LinearAlgebra/Matrix/Hessenberg.lean`); in the quadratic basis the entries vanish for
`|i - j| > 2` (pentadiagonal; the book states it, and a bandwidth predicate is chapter 1's
`Matrix.HasLowerBandwidth`/`HasUpperBandwidth` EXT of `Hessenberg.lean` — state with the explicit
inequality until it exists). Same for the mass matrix. ★

