[[node]]
id = "stiffnessMatrix"
kind = "definition"
desc = '''The stiffness matrix `A_fe` of the elliptic form in the nodal basis of `X_h^{k,0}`:
`FiniteElement.stiffnessMatrix hab α β γ (φ : ι → SobolevInterval 1 a b) : Matrix ι ι ℝ :=
(EllipticInterval.form hab α β γ).gramMatrix φ`, i.e. `A_ij = a(φ_j, φ_i)` (`SesqForm.gramMatrix` of
`Numlib/Variational/Galerkin.lean`), and the load vector `loadVector f φ i = ∫ f φ_i`. The Galerkin
problem in `X_h^{k,0}` is the linear system `A_fe u = f` (12.48): `IsGalerkinSolution.iff_gramMatrix_mulVec`.
Also the mass matrix `FiniteElement.massMatrix hab φ := (EllipticInterval.form hab 0 0 1).gramMatrix φ`,
`M_ij = ∫ φ_j φ_i`, for chapter 13. ★

