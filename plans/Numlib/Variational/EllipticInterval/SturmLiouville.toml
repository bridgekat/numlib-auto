is `ContinuousLinearMap.IsSymmetric.eigenvectorHilbertBasis (isSymmetric_solutionOperator h) (isCompactOperator_solutionOperator h) (ker_solutionOperator h) (MeasureTheory.Lp.not_finiteDimensional_of_isOpen …)`,
and `eigenvalue h n : ℝ := (ContinuousLinearMap.IsSymmetric.eigenvalueSeq … n)⁻¹` (`λₙ = 1/μₙ`),
with `solutionOperator_eigenfunction : T (eₙ) = μₙ • eₙ` (`apply_eigenvectorHilbertBasis`),
`eigenvalueSeq_pos : 0 < μₙ` (`μₙ ≥ 0` from `inner_solutionOperator_nonneg` on the eigenvector,
`μₙ ≠ 0` from injectivity), `tendsto_eigenvalue_atTop : Tendsto (eigenvalue h) atTop atTop`
(`tendsto_eigenvalueSeq_zero` and positivity), and `eigenvalue_pos`. ★★'''
deps = ["isCompactOperator_solutionOperator", "isSymmetric_solutionOperator", "MeasureTheory.Lp.not_finiteDimensional_of_isOpen", "ContinuousLinearMap.IsSymmetric.eigenvectorHilbertBasis", "ContinuousLinearMap.IsSymmetric.tendsto_eigenvalueSeq_zero", "ContinuousLinearMap.IsSymmetric.apply_eigenvectorHilbertBasis"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.22"

[[node]]
id = "exists_contDiffMapIcc_eigenfunction"
kind = "theorem"
desc = '''**Theorem 8.22, regularity of the eigenfunctions**: for each `n`, there is
`e : ContDiffMapIcc hab.le 2` with `(eigenfunction h n : ℝ → ℝ) =ᵐ[volume.restrict (Ioo a b)] e`,
`e a = 0`, `e b = 0`, and `∀ x ∈ Icc a b, -(deriv (p * e') x) + q x * e x = eigenvalue h n * e x`
(as the pointwise identity `−(p e')' + q e = λₙ e`, with `p e' ∈ C¹[a, b]`). From
`T (λₙ eₙ) = eₙ`: `eₙ`'s `H¹` element `u` is the weak solution with datum `λₙ eₙ`, which is
(the class of) a function continuous on `[a, b]` since `u ∈ H¹ ⊆ C[a, b]`; the Sturm–Liouville
regularity `exists_contDiffMapIcc_of_continuous` (`EllipticInterval/BoundaryConditions`, the
`α = p ∈ C¹` case) gives `e ∈ C²`, the boundary values from `u ∈ H_0^1`
(`mem_sobolevIntervalZero_iff`), and the equation from Step D. Also the book's parenthetical
`eₙ ∈ C^∞(Ī)` when `p, q ∈ C^∞(Ī)` (bootstrapping Remark 23) — optional. ★★ (~200 lines)'''
deps = ["eigenfunction", "EllipticInterval.exists_contDiffMapIcc_of_continuous", "mem_sobolevIntervalZero_iff", "EllipticInterval.isClassicalSolution_of_contDiffMapIcc"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.22"

[[node]]
id = "sineHilbertBasis"
kind = "theorem"
desc = '''**§8.6, Example (`p ≡ 1`, `q ≡ 0`)**: with `sₙ = sinBasisUnit n` (`√2 sin ((n+1) π x)`, a
Hilbert basis of `L²(0, 1)`): `−sₙ'' = (n+1)²π² sₙ`, `sₙ(0) = sₙ(1) = 0` (a direct computation,
`Real.hasDerivAt_sin`, `Real.sin_nat_mul_pi`; `sinBasisUnit_mem_sobolevIntervalZero`: the class
of `sₙ` is an element of `H_0^1(0, 1)` by `mem_sobolevIntervalZero_iff` and
`memSobolevIntervalLp_of_contDiffOn`), hence `solutionOperator_sinBasisUnit :
solutionOperator h (sₙ) = ((n+1)²π²)⁻¹ • sₙ` for the `Hypotheses` of `p = 1`, `q = 0`
(`∫ sₙ' v' = (n+1)²π² ∫ sₙ v` for `v ∈ H_0^1`, integrating by parts once,
`SobolevIntervalLp.integral_deriv_mul_add_mul_deriv`; uniqueness of the weak solution). Then
`eigenvalue_eq_sq_pi_sq`: the set of eigenvalues of Theorem 8.22 for this operator, i.e. the range
of `eigenvalue h`, is exactly `{(n+1)²π² : n : ℕ}`, and `eigenvalue h` is injective (each eigenvalue
simple): an eigenvector `e` of `T` with eigenvalue `μ` expands as `e = ∑ₙ ⟪sₙ, e⟫ sₙ`
(`HilbertBasis.hasSum_repr`), `T e = ∑ₙ ((n+1)²π²)⁻¹ ⟪sₙ, e⟫ sₙ` (continuity of `T` and
`solutionOperator_sinBasisUnit`), so `⟪sₙ, e⟫ (((n+1)²π²)⁻¹ − μ) = 0` for every `n`
(`HilbertBasis.repr` injective), which forces `μ = ((n+1)²π²)⁻¹` for the unique `n` with
`⟪sₙ, e⟫ ≠ 0` and `e ∈ span {sₙ}`; conversely each `sₙ` is an eigenvector. The abstract basis
`eigenfunction h` is therefore `n ↦ ± s_{σ n}` for a bijection `σ` (not needed by the surface,
which asks for the eigenvalue set and simplicity). ★★ (~200 lines)'''
deps = ["sinBasisUnit", "eigenfunction", "solutionOperator", "Hypotheses", "mem_sobolevIntervalZero_iff", "memSobolevIntervalLp_of_contDiffOn", "SobolevIntervalLp.integral_deriv_mul_add_mul_deriv", "ContinuousLinearMap.IsSymmetric.apply_eigenvectorHilbertBasis"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.6, Example"

[[node]]
id = "eq_smul_sin_of_dirichlet"
kind = "theorem"
desc = '''**The Dirichlet eigenfunctions of `−u''` on `(0, 1)` are sines** (Comments on Chapter 8, 3(i)
at `p = 1`, `q = 0`): if `e : ContDiffMapIcc (zero_le_one) 2` on `[0, 1]` satisfies `−e'' = λ e` on
`[0, 1]`, `e 0 = 0`, `e 1 = 0` and `e ≠ 0`, then `λ = (n+1)²π²` for some `n` and
`e = c • sin ((n+1) π ·)` on `[0, 1]` for some `c ≠ 0`. A corollary of `sineHilbertBasis`, not
an ODE-uniqueness argument: such an `e` is (the class of) an element of `H_0^1(0, 1)` with
`∫ e' v' = λ ∫ e v` for all `v ∈ H_0^1`, so `T e = λ⁻¹ e` (`λ ≠ 0` since `λ ∫ e² = ∫ e'² > 0`), and
the expansion argument of `sineHilbertBasis` puts `e` in `span {sₙ}` for the `n` with
`λ⁻¹ = ((n+1)²π²)⁻¹`; the a.e. identity `e = c sₙ` is an identity on `[0, 1]` because both sides
are continuous. Optional for the surface (`sineEigenfunctions_eigenvalue` uses
`eigenvalue_eq_sq_pi_sq` directly); kept because it is the statement the book's Example asserts
in words. ★ (~80 lines)'''
deps = ["sineHilbertBasis", "exists_contDiffMapIcc_eigenfunction"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.6, Example"
