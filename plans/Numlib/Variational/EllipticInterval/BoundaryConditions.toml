namespace = "EllipticInterval"
desc = '''
The boundary value problems of [brezis2011functional] §8.4 beyond the homogeneous Dirichlet
problem that `Numlib/Variational/EllipticInterval.lean` treats: the regularity "Steps C and D"
in the generality every example needs (a weak solution tested against `H_0^1` alone is in `H²`;
it is `C²` when the data are continuous; a `C²` weak solution is classical; `f ∈ H^k ⇒ u ∈ H^{k+2}`,
Remark 23), the recovery of natural boundary conditions from a weak formulation on a space larger
than `H_0^1` (the one lemma behind Examples 3–7), the inhomogeneous Dirichlet lift and the closed
convex Dirichlet class of Example 1, the Neumann load of Example 4, the mixed, Robin and periodic
spaces and the Robin form of Examples 5–7, and the problem on `ℝ` of Example 8 in `H¹(ℝ)`.

### Vocabulary

Everything is on `SobolevInterval 1 a b = H¹(a, b)` (the parent module's form
`EllipticInterval.form a b α β γ`, its load `load a b f`, `IsGalerkinSolution` for the weak
problem), with the boundary functionals `SobolevInterval.evalCLM hab ⟨a, _⟩`, `⟨b, _⟩` of
`Interval.lean` (point evaluation of the continuous representative); the model operator
`−u'' + u` is `form a b 1 0 1` with `constLinf`. The `H²` conclusions are elements of
`SobolevInterval 2 a b` with `inclusionCLM 1 a b Φ = u` (the parent's
`exists_sobolevInterval_two`), and "`u ∈ C²(Ī)`" is `∃ v : ContDiffMapIcc hab.le 2, rep u = v` on
`[a, b]` (`Numlib/Analysis/Calculus/ContDiffMapIcc.lean`). Example 8 lives on
`SobolevIntervalLp 1 2 ⊤ = H¹(ℝ)` of `Numlib/Analysis/Sobolev/Interval/Basic.lean`, where the
bilinear form is the inner product and Lax–Milgram is `InnerProductSpace.toDual`.

### What the parent already has

`existsUnique_isWeakSolution` (Dirichlet, `α ≥ α₀ > 0`, `γ ≥ 0`), `form_isCoerciveWith_of_pos`
(coercivity on all of `H¹` when `γ ≥ γ₀ > 0`, the Neumann case), `isWeakSolution_of_classical`
and `isWeakSolution_of_classical_neumann` (Step A with the boundary terms),
`form_sub_eq_of_forall` (the lifting identity of Example 1, Method 1),
`isWeakSolution_mem_sobolevInterval_two` and `exists_sobolevInterval_two_of_isWeakSolution`
(`H²` regularity, but stated for a solution *in* `H_0^1`), `form_comm`. The regularity lemma is
generalized here because Examples 1, 3–8 and Problem 47 B all have solutions outside `H_0^1`.
'''

[[node]]
id = "mem_sobolevInterval_two_of_forall_testFunction"
kind = "theorem"
desc = '''**Step C, general form (`H²` regularity from the test functions alone)**: for `a < b`,
coefficients `αL βL γL : Lp ℝ ⊤ (volume.restrict (Ioo a b))` with `αL` the class of a function
`α` `C¹` on `[a, b]` with `α ≥ α₀ > 0` (as in the parent's `isWeakSolution_mem_sobolevInterval_two`),
`f ∈ L²(a, b)` and `u : SobolevInterval 1 a b` — *not* assumed in `H_0^1` — with
`∀ v ∈ SobolevIntervalZero a b, form a b αL βL γL u v = load a b f v`, then
`MemSobolevInterval (fn u) 2 a b`, and `exists_sobolevInterval_two_of_forall_testFunction`:
`∃ Φ : SobolevInterval 2 a b, inclusionCLM 1 a b Φ = u ∧ deriv Φ 2 =ᵐ (βL u' + γL u − f − α' u')/α`
with the estimate of the parent's `exists_sobolevInterval_two_of_isWeakSolution`. The parent's
proofs (`hasWeakDerivOn_mulL_deriv` onwards) use `hu` only through the test functions
(`deriv_ae_eq_of_fn_ae_eq` and `SobolevIntervalZero.exists_mem_fn_ae_eq`), so this is a
restatement with the weaker hypothesis; the parent's two lemmas become its corollaries. ★'''
deps = ["hasWeakDerivOn_mulL_deriv", "isWeakSolution_mem_sobolevInterval_two", "exists_sobolevInterval_two_of_isWeakSolution", "exists_sobolevInterval_two"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Steps C and D"

[[node]]
id = "exists_contDiffMapIcc_of_continuous"
kind = "theorem"
desc = '''**Step C, the `C²` clause**: under the hypotheses of `mem_sobolevInterval_two_of_forall_testFunction`
with `α = 1` (the model operator) — or with `α ∈ C¹`, the Sturm–Liouville case of Example 2 —
and `f` the class of a function continuous on `[a, b]` (and `β`, `γ` continuous on `[a, b]`), the
weak solution is `C²`: `∃ v : ContDiffMapIcc hab.le 2, ∀ x ∈ Icc a b, rep u x = v x`, with
`v'' = β v' + γ v − f` pointwise on `[a, b]` when `α = 1`. Proof: `u'' = (βu' + γu − f)/α` a.e. is
(the class of) a function continuous on `[a, b]` once `u'` is (`u' ∈ H¹ ⊆ C[a, b]`), so
`u' ∈ C¹[a, b]` by Remark 6 (`SobolevIntervalLp.contDiffOn_rep_of_continuousOn_deriv`, or the
parent-level `SobolevInterval.exists_contDiff_ae_eq` at `k = 1` plus the identification of the
derivative with a continuous function), hence `u ∈ C²[a, b]` (`ContDiffMapIcc.ofContDiffOn`).
For the Sturm–Liouville operator: `p u' ∈ H¹` with `(p u')' = q u − f ∈ C`, so `p u' ∈ C¹`,
`u' = (p u')/p ∈ C¹`. ★★ (~200 lines)'''
deps = ["mem_sobolevInterval_two_of_forall_testFunction", "SobolevIntervalLp.contDiffOn_rep_of_continuousOn_deriv", "ContDiffMapIcc.ofContDiffOn"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Steps C and D"

[[node]]
id = "isClassicalSolution_of_contDiffMapIcc"
kind = "theorem"
desc = '''**Step D (a `C²` weak solution is a classical solution)**: for `v : ContDiffMapIcc hab.le 2`
with `-v'' + v = f` a.e. on `(a, b)` (`f` continuous on `[a, b]`), the identity holds at every
point of `[a, b]`; and the weak formulation `∀ w ∈ H_0^1, ∫ v' w' + ∫ v w = ∫ f w` for a `C²` `v`
gives `-v'' + v = f` a.e. (`IsOpen.ae_eq_zero_of_integral_contDiff_smul_eq_zero` after integrating
by parts against test functions — Corollary 4.24 of the book), hence everywhere by continuity
(`Continuous.ae_eq_iff_eq`-type: two continuous functions equal a.e. on `(a, b)` are equal on
`[a, b]`, `eqOn_Icc_of_ae_eq` of `Interval.lean`). This is §8.1's Step D and the converse of
`isWeakSolution_of_classical`. ★'''
deps = ["isWeakSolution_of_classical", "exists_contDiffMapIcc_of_continuous"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.1, Step D"

[[node]]
id = "memSobolevInterval_add_two_of_isWeakSolution"
kind = "theorem"
desc = '''**Remark 23**: for the model problem `−u'' + u = f` (weak form tested against `H_0^1`), if
`MemSobolevInterval f k a b` then `MemSobolevInterval (fn u) (k + 2) a b`. Induction on `k`:
`u'' = u − f` a.e. (Step C), and `u − f ∈ H^k` gives `u' ∈ H^{k+1}` (the chain
`memSobolevInterval_succ_iff`: `u' ∈ L²`, `(u')' = u − f ∈ H^k`), then `u ∈ H^{k+2}`. The same
for `−(pu')' + qu = f` with `p, q` of class `C^{k+1}`, `C^k` (the product rule in `H^k` —
`SobolevIntervalLp.memSobolevIntervalLp_mul` iterated; state the model case only, remark the
general one). ★★ (~150 lines)'''
deps = ["mem_sobolevInterval_two_of_forall_testFunction", "memSobolevInterval_succ_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Chapter 8, Remark 23"

[[node]]
id = "natural_boundary_eq_of_forall"
kind = "theorem"
desc = '''**Recovery of natural boundary conditions** (the common step of Examples 3–7 and
Propositions 8.17–8.18): for `a < b`, `U : SobolevInterval 2 a b`, `g : Lp ℝ 2 (volume.restrict (Ioo a b))`,
`w₀ w₁ : ℝ` and a subspace `K ≤ SobolevInterval 1 a b` containing `SobolevIntervalZero a b`, if
`∀ v ∈ K, ∫ x in a..b, deriv U 1 x * deriv v 1 x = ∫ x in a..b, g x * rep v x + w₁ * rep v b - w₀ * rep v a`
then (i) `deriv U 2 =ᵐ -g` (`U'' = −g`, testing `v ∈ H_0^1` and Green's formula
`SobolevInterval.integral_deriv_mul_add_mul_deriv` for `U' ∈ H¹` against `v`), and (ii)
`∀ v ∈ K, (rep (derivCLM 1 a b U) b - w₁) * rep v b = (rep (derivCLM 1 a b U) a - w₀) * rep v a`
(the boundary terms that remain). Corollaries by the choice of `K` and of `v` (affine functions
`x ↦ (x − a)/(b − a)` and `x ↦ (b − x)/(b − a)` lie in `H¹`, `ContDiffMapIcc.toSobolevInterval`):
`K = ⊤` ⇒ `U'(a) = w₀ ∧ U'(b) = w₁` (Neumann, `natural_boundary_neumann`); `K = {v : v(a) = 0}` ⇒
`U'(b) = w₁` (mixed); `K = {v : v(a) = v(b)}` ⇒ `U'(b) − w₁ = U'(a) − w₀` (periodic). Here
`U'(a)` means `rep (derivCLM 1 a b U) a`, the value of the continuous representative of
`U' ∈ H¹`, which is what "`u ∈ H² ⇒ u ∈ C¹(Ī)` so the condition makes sense" (footnote 13) is.
★★ (~200 lines)'''
deps = ["SobolevInterval.integral_deriv_mul_add_mul_deriv", "SobolevInterval.derivCLM", "SobolevInterval.evalCLM", "ContDiffMapIcc.toSobolevInterval", "SobolevIntervalZero.exists_mem_fn_ae_eq"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.17, proof"

[[node]]
id = "affineLift"
kind = "definition"
desc = '''The affine function with prescribed endpoint values as an element of `H^m(a, b)`:
`affineLift hab m (α β : ℝ) : SobolevInterval m a b`, the image under
`ContDiffMapIcc.toSobolevInterval` of `x ↦ α + (β − α)(x − a)/(b − a)` (`ContDiffMapIcc.ofContDiff`),
with `rep_affineLift_left : rep (affineLift …) a = α`, `rep_affineLift_right`, and its second
derivative zero. The "smooth `u₀` with `u₀(0) = α`, `u₀(1) = β`" of Example 1, Method 1
(footnote 12: affine). ★'''
deps = ["ContDiffMapIcc.toSobolevInterval", "ContDiffMapIcc.ofContDiff", "SobolevInterval.rep"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.16, proof"

[[node]]
id = "dirichletSet"
kind = "definition"
desc = '''**The Dirichlet class of Example 1, Method 2**:
`dirichletSet hab α β : Set (SobolevInterval 1 a b) := {v | rep v a = α ∧ rep v b = β}`
(`K = {v ∈ H¹(I) : v(0) = α, v(1) = β}`), with `isClosed_dirichletSet` (the preimage of `{(α, β)}`
under the continuous `(evalCLM a, evalCLM b)`), `convex_dirichletSet`, `nonempty_dirichletSet`
(`affineLift`), and `dirichletSet_eq_affineLift_add : dirichletSet hab α β = affineLift hab 1 α β +ᵥ (SobolevIntervalZero a b : Set _)`
by `mem_sobolevIntervalZero_iff`. ★'''
deps = ["affineLift", "SobolevInterval.evalCLM", "mem_sobolevIntervalZero_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.16, proof"

[[node]]
id = "existsUnique_dirichletSet_of_variationalInequality"
kind = "theorem"
desc = '''**Proposition 8.16, Method 2**: for `f ∈ L²(0,1)` (any `a < b`) there is exactly one
`u ∈ dirichletSet hab α β` with `∀ v ∈ dirichletSet hab α β, form a b 1 0 1 u (v − u) ≥ load a b f (v − u)`
(the inequality (17)), by Stampacchia (`existsUnique_isVariationalInequalitySolution_of_isCoercive`
with the coercive form `form a b 1 0 1 = ⟪·,·⟫_{H¹}` and the closed convex `dirichletSet`); it
minimizes `½ ∫ (v'² + v²) − ∫ f v` over `dirichletSet` (`SesqForm.existsUnique_isMinOn_energy`);
and taking `v = u ± w`, `w ∈ H_0^1` (`dirichletSet_eq_affineLift_add`), it satisfies
`∀ w ∈ SobolevIntervalZero a b, form a b 1 0 1 u w = load a b f w`, so it is in `H²`
(`mem_sobolevInterval_two_of_forall_testFunction`) and `C²` when `f` is continuous
(`exists_contDiffMapIcc_of_continuous`), with `u(a) = α`, `u(b) = β`. Method 1 is the surface's
`proposition_8_16` through the parent's `form_sub_eq_of_forall` with the lift `affineLift`
(`ũ = u − u₀ ∈ H_0^1` solves the problem with data `f + u₀'' − u₀ = f − u₀`). ★★'''
deps = ["dirichletSet", "existsUnique_isVariationalInequalitySolution_of_isCoercive", "SesqForm.existsUnique_isMinOn_energy", "mem_sobolevInterval_two_of_forall_testFunction", "form_isCoerciveWith_of_pos", "form_sub_eq_of_forall"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.16"

[[node]]
id = "existsUnique_neumann"
kind = "theorem"
desc = '''**Proposition 8.17 (homogeneous Neumann)**: for `a < b` and `f ∈ L²(a, b)`, there is exactly
one `Φ : SobolevInterval 2 a b` with `deriv Φ 2 =ᵐ fn Φ − f` (`−u'' + u = f` a.e.) and
`rep (derivCLM 1 a b Φ) a = 0 ∧ rep (derivCLM 1 a b Φ) b = 0` (`u'(a) = u'(b) = 0`); its
inclusion `u = inclusionCLM Φ` is the unique `u ∈ H¹(a, b)` with
`∀ v, form a b 1 0 1 u v = load a b f v` and minimizes `½ ∫ (v'² + v²) − ∫ f v` over all of
`H¹(a, b)` (`SesqForm.isMinOn_energy_iff` with `K = ⊤`); `u ∈ C²[a, b]` when `f` is continuous.
Existence and uniqueness of the weak solution: `SesqForm.laxMilgram` on `H¹(a, b)` with
`form_isCoerciveWith_of_pos` (`γ = 1 ≥ 1`, constant `1`); regularity:
`mem_sobolevInterval_two_of_forall_testFunction`; the boundary condition:
`natural_boundary_eq_of_forall` with `K = ⊤`, `g = f − u`, `w₀ = w₁ = 0`. Uniqueness of `Φ`: a
solution of the strong problem is a weak solution (`isWeakSolution_of_classical_neumann`-style
Green's formula for `H²`, i.e. the reverse of `natural_boundary_eq_of_forall`), and weak
solutions are unique. ★★ (~200 lines)'''
deps = ["SesqForm.laxMilgram", "form_isCoerciveWith_of_pos", "mem_sobolevInterval_two_of_forall_testFunction", "natural_boundary_eq_of_forall", "SesqForm.isMinOn_energy_iff", "exists_contDiffMapIcc_of_continuous"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.17"

[[node]]
id = "neumannLoad"
kind = "definition"
desc = '''**The inhomogeneous Neumann load of Example 4**:
`neumannLoad hab f α β : SobolevInterval 1 a b →L[ℝ] ℝ := load a b f - α • evalCLM hab ⟨a, _⟩ + β • evalCLM hab ⟨b, _⟩`,
`v ↦ ∫ f v − α v(a) + β v(b)`, continuous "by Theorem 8.8" (the evaluation functionals of
`Interval.lean`); `neumannLoad_apply`. ★'''
deps = ["load", "SobolevInterval.evalCLM"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.18, proof"

[[node]]
id = "existsUnique_neumann_inhomogeneous"
kind = "theorem"
desc = '''**Proposition 8.18 (inhomogeneous Neumann)**: for `f ∈ L²(a, b)` and `α β : ℝ`, exactly one
`Φ : SobolevInterval 2 a b` with `−u'' + u = f` a.e., `u'(a) = α`, `u'(b) = β`; the weak solution
`u ∈ H¹(a, b)` of `∀ v, form a b 1 0 1 u v = neumannLoad hab f α β v` minimizes
`½ ∫ (v'² + v²) − ∫ f v + α v(a) − β v(b)` over `H¹(a, b)`, and is `C²` when `f` is continuous.
As `existsUnique_neumann` with `natural_boundary_eq_of_forall` at `w₀ = α`, `w₁ = β`. ★'''
deps = ["neumannLoad", "existsUnique_neumann", "natural_boundary_eq_of_forall"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Proposition 8.18"

[[node]]
id = "mixedSpace"
kind = "definition"
desc = '''**The spaces of Examples 5–7**, closed subspaces of `H¹(a, b)` cut out by the evaluation
functionals: `mixedSpace hab := LinearMap.ker (evalCLM hab ⟨a, _⟩)` (`{v : v(a) = 0}`, Example 5),
`robinSpace hab := LinearMap.ker (evalCLM hab ⟨b, _⟩)` (`{v : v(b) = 0}`, Example 6),
`periodicSpace hab := LinearMap.ker (evalCLM hab ⟨a, _⟩ - evalCLM hab ⟨b, _⟩)` (`{v : v(a) = v(b)}`,
Example 7), each `IsClosed` (`ContinuousLinearMap.isClosed_ker`), hence a Hilbert space for the
`H¹` inner product, and each containing `SobolevIntervalZero a b`
(`sobolevIntervalZero_le_mixedSpace`, …, by `mem_sobolevIntervalZero_iff`). ★'''
deps = ["SobolevInterval.evalCLM", "mem_sobolevIntervalZero_iff"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Examples 5, 6, 7"

[[node]]
id = "robinForm"
kind = "definition"
desc = '''**The Robin form of Example 6**: `robinForm hab k : SesqForm ℝ (SobolevInterval 1 a b) :=
form a b 1 0 1 + k • (evalCLM hab ⟨a, _⟩).smulRight (evalCLM hab ⟨a, _⟩)` — i.e.
`a(u, v) = ∫ u' v' + ∫ u v + k u(a) v(a)` (`robinForm_apply`), symmetric (`robinForm_comm`),
bounded, and coercive on `H¹(a, b)` with constant `1` for `k ≥ 0`
(`robinForm_isCoerciveWith : 0 ≤ k → (robinForm hab k).IsCoerciveWith 1`, since
`a(v, v) = ‖v‖² + k v(a)² ≥ ‖v‖²`). The `SesqForm` is `V →L⋆[ℝ] V →L[ℝ] ℝ`; the rank-one term is
`ContinuousLinearMap.smulRight`/`ContinuousLinearMap.smulRightL` of the two evaluation
functionals. Footnote 15 (coercive for small `k < 0`, and a `k < 0` with no solution for some `f`,
Exercise 8.21) is not planned. ★★'''
deps = ["form", "SobolevInterval.evalCLM", "SesqForm.IsCoerciveWith"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Example 6"

[[node]]
id = "existsUnique_mixed"
kind = "theorem"
desc = '''**Examples 5, 6, 7 (mixed, Robin, periodic boundary conditions)**: for `f ∈ L²(a, b)`,
(5) exactly one `Φ ∈ H²(a, b)` with `−u'' + u = f` a.e., `u(a) = 0`, `u'(b) = 0`: Lax–Milgram
(`SesqForm.laxMilgram`) for `form a b 1 0 1` restricted to `mixedSpace hab` (`SesqForm.restrict`,
coercive with constant `1`), regularity by `mem_sobolevInterval_two_of_forall_testFunction`
(`H_0^1 ≤ mixedSpace`), the natural condition `u'(b) = 0` by `natural_boundary_eq_of_forall` with
`K = mixedSpace`, `w₁ = 0`, the essential condition `u(a) = 0` by membership;
(6, `existsUnique_robin`, `0 ≤ k`) exactly one `Φ ∈ H²` with `−u'' + u = f`, `u'(a) = k u(a)`,
`u(b) = 0`: `robinForm hab k` on `robinSpace hab`, the natural condition from
`natural_boundary_eq_of_forall` with `w₀ = k u(a)` (the term `k u(a) v(a)` moves to the right
side); (7, `existsUnique_periodic`) exactly one `Φ ∈ H²` with `−u'' + u = f`, `u(a) = u(b)`,
`u'(a) = u'(b)`: the form on `periodicSpace hab`, the natural condition from
`natural_boundary_eq_of_forall`'s clause (ii) with `v(a) = v(b)` arbitrary. Each is `C²` when `f`
is continuous. Three nodes in the Lean file (`existsUnique_mixed`, `existsUnique_robin`,
`existsUnique_periodic`), planned as one. ★★ (~250 lines for the three)'''
deps = ["mixedSpace", "robinForm", "SesqForm.laxMilgram", "mem_sobolevInterval_two_of_forall_testFunction", "natural_boundary_eq_of_forall", "_root_.SesqForm.restrict", "exists_contDiffMapIcc_of_continuous"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Examples 5, 6 and 7"

[[node]]
id = "Line.form"
kind = "definition"
desc = '''**Example 8, the problem on `ℝ`**: `EllipticInterval.Line.form : SesqForm ℝ (SobolevIntervalLp 1 2 ⊤) := innerSL ℝ`,
`a(u, v) = ∫_ℝ u' v' + ∫_ℝ u v = ⟪u, v⟫_{H¹(ℝ)}` (`SobolevIntervalLp.inner_eq`), coercive with
constant `1`, and `Line.load f : SobolevIntervalLp 1 2 ⊤ →L[ℝ] ℝ`, `v ↦ ∫_ℝ f v` for
`f ∈ L²(ℝ)` (`innerSL` composed with `derivL 0`). The weak solution of (30) is
`Line.solution f := (InnerProductSpace.toDual ℝ _).symm (Line.load f)`, the unique `u ∈ H¹(ℝ)`
with `∀ v, ⟪u, v⟫ = ∫ f v` (Riesz–Fréchet, which is Lax–Milgram here). ★'''
deps = ["SobolevIntervalLp.inner_eq", "SobolevIntervalLp.deriv"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Example 8"

[[node]]
id = "Line.memSobolevIntervalLp_of_classical"
kind = "theorem"
desc = '''**Example 8, a classical solution lies in `H¹(ℝ)`**: if `u : ℝ → ℝ` is `C²`, `−u'' + u = f`
with `f ∈ L²(ℝ)`, and `u(x) → 0` as `|x| → ∞` (`Tendsto u (cocompact ℝ) (𝓝 0)`), then
`MemSobolevIntervalLp u 1 2 ⊤` (indeed `u, u' ∈ L²(ℝ)`). The book's cut-off argument
(lines 8567–8583): multiply by `ζ_n u` (`SobolevIntervalLp.tendsto_cutoff_smul`'s `ζ_n`) and
integrate by parts twice, `∫ ζ_n (u'² + u²) = ∫ ζ_n f u + ½ ∫ ζ_n'' u²`; the last term is
`≤ (C/n²) ∫_{n < |x| < 2n} u² ≤ (C/n) sup_{|x| > n} u² → 0` and `∫ ζ_n f u ≤ ½ ∫ ζ_n u² + ½ ∫ f²`,
so `∫ ζ_n (u'² + u²)` stays bounded and monotone convergence gives `u, u' ∈ L²`. Then
`Line.isWeakSolution_of_classical`: such a `u` satisfies `⟪u, v⟫ = ∫ f v` for all `v ∈ H¹(ℝ)`
(integration by parts against test functions, then density — Theorem 8.7 at `I = ℝ`,
`sobolevIntervalLpZero_top`, or directly: `v ∈ H¹(ℝ)` has `ζ_n v → v` and the identity holds for
compactly supported `v ∈ H¹` by `SobolevIntervalLp.integral_deriv_mul_add_mul_deriv` on a large
interval). ★★★ (~300 lines)'''
deps = ["Line.form", "SobolevIntervalLp.tendsto_cutoff_smul", "SobolevIntervalLp.integral_deriv_mul_add_mul_deriv", "sobolevIntervalLpZero_top"]
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, §8.4, Example 8"

[[node]]
id = "Line.exists_classical_solution"
kind = "theorem"
desc = '''**Example 8, conclusion**: for `f ∈ L²(ℝ)` the weak solution `u = Line.solution f` lies in
`H²(ℝ)` (`MemSobolevIntervalLp (fn u) 2 2 ⊤`: `u'' = u − f` weakly, from the weak form tested
against test functions — the argument of `mem_sobolevInterval_two_of_forall_testFunction` on
`⊤`), `rep u → 0` at infinity (Corollary 8.9, `SobolevIntervalLp.tendsto_rep_cocompact`), and if
moreover `f` is continuous then `rep u ∈ C²(ℝ)` with `−u'' + u = f` pointwise
(`SobolevIntervalLp.contDiffOn_rep_of_continuousOn_deriv` twice): so for `f ∈ L²(ℝ) ∩ C(ℝ)`
