[[node]]  # staged by ch11
id = "IsStieltjes.schurComplementSingle"
kind = "theorem"
desc = '''
One step of symmetric Gaussian elimination keeps a Stieltjes matrix Stieltjes:
`A.IsStieltjes → (A.schurComplementSingle p).IsStieltjes`. `Matrix.IsMMatrix.isMMatrix_schurComplementSingle`
(Ky Fan), symmetry of the Schur complement of a symmetric matrix, and
`Matrix.IsMMatrix.posDef_of_isSymm`. ★
'''
deps = ["Matrix.IsStieltjes", "Matrix.IsStieltjes.isMMatrix", "Matrix.IsMMatrix.isMMatrix_schurComplementSingle",
  "Matrix.IsMMatrix.posDef_of_isSymm", "Matrix.schurComplementSingle"]

[[node]]  # staged by ch11
id = "IsStieltjes.isStieltjes_sub_drop"
kind = "theorem"
desc = '''
[golub2013matrix] Theorem 11.5.2, backbone form: for `A.IsStieltjes`, a pivot `p` and any set `S` of
non-pivot indices, the matrix `B̃ i j = A i j − ṽ_i ṽ_j / A p p` on `{i // i ≠ p}` with
`ṽ_i = if i ∈ S then A i p else 0` (the pivot column with the entries outside `S` dropped) is
Stieltjes. Proof: `B̃ ≥ A.schurComplementSingle p` entrywise, because `ṽ_iṽ_j ∈ {0, A i p · A p j}` and
`A i p · A p j ≥ 0` (both `≤ 0`), `A p p > 0`; the Schur complement is Stieltjes
(`Matrix.IsStieltjes.schurComplementSingle`) and `B̃` is symmetric with nonpositive off-diagonal
entries, so `Matrix.IsStieltjes.of_entrywiseLE`. (The book's proof via `B⁻¹ ≥ 0` and
Sherman–Morrison is the alternative.) Statement shape settled by
`notes/gvl/ch11/proto/Shapes.lean` (c). ★★ (~40 lines)
'''
deps = ["Matrix.IsStieltjes.schurComplementSingle", "Matrix.IsStieltjes.of_entrywiseLE"]
source = 'Golub–Van Loan, Matrix Computations, Theorem 11.5.2'

[[node]]  # staged by ch11
id = "IsStieltjes.exists_isIC"
kind = "theorem"
desc = '''
Incomplete Cholesky exists for Stieltjes matrices (Meijerink–van der Vorst 1977, symmetric case;
[golub2013matrix] §11.5.8): for `A.IsStieltjes` over a finite linear order `n` and a symmetric zero
pattern `P` with `(i, i) ∉ P`, there is a lower triangular `L` with positive diagonal and
`Matrix.IsIC P A L`. Proof: induction on `Fintype.card n` by the recursion of the book's `incChol`:
pivot at the least index, keep the entries of the pivot column off `P`, form `B̃` (Stieltjes by
`Matrix.IsStieltjes.isStieltjes_sub_drop`), zero its entries on `P` (Stieltjes by
`Matrix.IsStieltjes.of_entrywiseLE`), recurse, and assemble `L = [√α 0; w L₁]`; `L Lᵀ` agrees with `A`
off `P` by the bordered identity. Uniqueness is `Matrix.IsIC.eq_of_diag_pos`. The surface's
`incChol_spec` is the same induction run on the program; the formalizer should share the step
lemma. ★★★ (~120 lines)
'''
deps = ["Matrix.IsStieltjes.isStieltjes_sub_drop", "Matrix.IsStieltjes.of_entrywiseLE", "Matrix.IsIC",
  "Matrix.IsIC.eq_of_diag_pos", "Matrix.IsStieltjes.submatrix"]
source = 'Golub–Van Loan, Matrix Computations, §11.5.8'
