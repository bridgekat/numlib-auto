source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 4.10 (exponent conventions)"

[[node]]
id = "Lp.not_finiteDimensional_of_isOpen"
kind = "theorem"
desc = '''`L^p` of a nonempty open set is infinite-dimensional: for a finite-dimensional real normed
space `E` with an additive Haar measure `μ` (`[μ.IsAddHaarMeasure]`), `U ⊆ E` open and nonempty,
`1 ≤ p < ∞`, `¬ FiniteDimensional ℝ (Lp ℝ p (μ.restrict U))`. Chapter 8 uses it for
`E = ℝ`, `μ = volume`, `U = Ioo a b`, `p = 2` (the "infinite dimension" hypothesis of
`eigenvectorHilbertBasis` in `exists_eigenbasis`); chapter 9b's Theorem 9.31
(`Elliptic/Spectral`, `Elliptic.eigenbasis`) uses it for `E = ℝ^N`, so the general statement is
proved here once and the `Spectral` module imports it (it is a `_root_` lemma with no dependence
on this module's content; its final home is `Numlib/MeasureTheory`, to be relocated when the
orchestrator next clears the relocation backlog).

Proof: pick `x₀ ∈ U` and `r > 0` with `ball x₀ r ⊆ U`; the annuli
`A n = ball x₀ (r/(n+1)) \ closedBall x₀ (r/(n+2))` are pairwise disjoint, measurable, of positive
finite measure (`Measure.addHaar_ball_pos`/`Measure.addHaar_ball_lt_top`, difference of two balls of
distinct radii; on `ℝ` these are the subintervals `(a + (b − a)/(n + 2), a + (b − a)/(n + 1))`).
Their indicators `indicatorConstLp p _ _ (1 : ℝ)` are nonzero (`eLpNorm_indicator_const`) and
linearly independent because a finite linear combination vanishing in `L^p` vanishes a.e. on each
`A n`, where it equals the corresponding coefficient (`indicatorConstLp_coeFn`, `ae_restrict` on
`A n`); for `p = 2` one may instead normalize and use `Orthonormal.linearIndependent` with
`L2.inner_indicatorConstLp_indicatorConstLp`. An infinite linearly independent family
contradicts `FiniteDimensional` (`LinearIndependent.finite` /
`Module.Finite.not_linearIndependent_of_infinite`). ★ (~80 lines).'''
deps = []
source = "Brezis, Functional Analysis, Sobolev Spaces and PDE, Theorem 8.22, proof"
