namespace = "Polynomial"
desc = '''
The parity clause of Descartes' rule of signs. Mathlib's `Mathlib/Algebra/Polynomial/RuleOfSigns.lean`
defines `Polynomial.signVariations` and proves the bound `P.roots.countP (0 < ·) ≤ signVariations P`
over any linearly ordered commutative ring (`roots_countP_pos_le_signVariations`, line 379); the
second half of the rule as textbooks state it — `ν - k` is even — is absent (grepped `even`,
`parity`, `odd` in that file: nothing). It is proved here over `ℝ`, where the intermediate value
theorem is available: a polynomial with no positive root does not change sign on `(0, ∞)`, so its
lowest and leading coefficients have the same sign.

Sources: Quarteroni–Sacco–Saleri, Numerical Mathematics, Property 6.5 (stated without proof);
Isaacson–Keller §3.4.
'''

[[node]]
id = "signVariations_mod_two_eq"
kind = "theorem"
desc = '''For `P : R[X]` over a linearly ordered semiring with `P ≠ 0`: `signVariations P % 2 = if
SignType.sign P.leadingCoeff = SignType.sign (P.coeff P.natTrailingDegree) then 0 else 1`. Walking
the destuttered list of nonzero coefficient signs from the leading to the trailing coefficient, the
number of changes is odd exactly when the two ends differ. Induction over `coeffList` with Mathlib's
`signVariations_eq_eraseLead_add_ite` (`RuleOfSigns.lean:79`). ★★'''
deps = []

[[node]]
id = "even_signVariations_sub_roots_countP_pos"
kind = "theorem"
desc = '''**Descartes' rule of signs, parity clause (Property 6.5, second half):** for `P : ℝ[X]`,
`P ≠ 0`, `Even (signVariations P - P.roots.countP (0 < ·))` (natural subtraction; the difference is
nonnegative by Mathlib's `roots_countP_pos_le_signVariations`, so `Even` of the truncated difference
is the honest statement, equivalently `signVariations P % 2 = P.roots.countP (0 < ·) % 2`). Proof:
factor `P = X ^ t * (∏ (X - C r_i)) * Q` over the positive roots `r_i` (with multiplicity;
`Polynomial.exists_prod_multiset_X_sub_C_mul` / `roots` API) where `Q` has no positive root and
`Q.coeff 0 ≠ 0`. `Q` has constant sign on `(0, ∞)` by `intermediate_value_Ioo` applied to
`Q.eval`, and `Q.eval x` has the sign of `Q.leadingCoeff` for large `x`
(`Polynomial.tendsto_atTop_of_leadingCoeff_nonneg` in `Analysis/Polynomial/Basic.lean`, or the
Cauchy bound) and of `Q.coeff 0` near `0`; so `sign Q.leadingCoeff = sign (Q.coeff 0)`. Each factor
`X - C r_i`, `r_i > 0`, has opposite end signs and multiplying by it flips the parity of the end
comparison (`leadingCoeff_mul`, `coeff_zero_mul`, `natTrailingDegree` of a product); `X ^ t` changes
nothing. Conclude with `signVariations_mod_two_eq` on `P`. ★★'''
deps = ["Polynomial.signVariations_mod_two_eq"]
