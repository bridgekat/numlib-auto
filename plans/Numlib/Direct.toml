desc = '''
Direct methods for `A x = b`: the substitution solves for triangular systems and the inverse of a
triangular matrix (`Substitution`), and the two accuracy-improving devices of Quarteroni–Sacco–Saleri
§3.11–3.12 — scaling and iterative refinement as a stationary iteration (`Refinement`) — and
condition-number estimation (`ConditionEstimation`, [golub2013matrix] §3.5.4: the lower bounds
`‖y‖ ≤ ‖A⁻¹‖ ‖A y‖` and `κ̂ ≤ κ` that every condition estimator built on a solve satisfies, in the
induced `p`-norms of `Analysis/Matrix/OperatorNorm`, derived from its operator-level forerunners
`condEstimate`, `norm_apply_div_le_norm_inverse` of `Refinement`, which refactor task R1 moves there). The factorizations
themselves are `LinearAlgebra/Matrix/LU`, `LinearAlgebra/Matrix/Cholesky` and
`LinearAlgebra/Matrix/QR`; their rounding-error analyses are `FloatingPoint/Substitution` and
`FloatingPoint/LU`.

Golub–Van Loan Chapter 4 adds the theory of the structured solvers that is not algorithms:
`SymmetricIndefinite` (the Bunch–Parlett growth bounds and the Stewart–Todd bound (4.4.21); the Aasen and
block `L D Lᵀ` specifications are in `LinearAlgebra/Matrix/SymmetricIndefinite` and the equilibrium matrix
is `Matrix.saddleMatrix` of `LinearAlgebra/Matrix/SchurComplement`, both moved at the review of the
Golub–Van Loan round), `Vandermonde` (the Björck–Pereyra factorization `V⁻ᵀ = Lᵀ Uᵀ`), `Levinson` (the
Durbin, Levinson and Trench recurrences as specifications of the symmetric positive definite
Toeplitz solve, the reflection coefficients and Cybenko's bounds, the unsymmetric bordering, the
secular function of the Cybenko–Van Loan eigenvalue method), `CyclicReduction` (block cyclic
reduction for constant commuting blocks) and `FastPoisson` (the Kronecker-sum solver in eigenvector
bases; the second-difference matrices are in `LinearAlgebra/Matrix/TridiagonalToeplitz`, their fast
eigensystems in `Analysis/Fourier/{SineCosineTransform,Circulant}`). The book's algorithms
themselves are surface (`NumlibSurface/GolubVanLoan/Chapter04`).

Updating a factorization after a low-rank change — the QR factorization after a rank-one change
or a row/column insertion or deletion, the Cholesky factorization after `± z zᵀ` by plane and
hyperbolic rotations — is `Updating` ([golub2013matrix] §6.5).
'''
