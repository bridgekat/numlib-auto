desc = '''
Phase 2. The Rayleigh-Ritz layer over the compression of `InnerProductSpace/Projection/Compression`:
Ritz pairs are the eigenpairs of `compression A K`, so the definitions need only an inner product
and it is the sharp bounds that need finite dimension.

Courant-Fischer is the missing Mathlib brick — Mathlib has only the extreme eigenvalues, through
`hasEigenvalue_iSup_of_finiteDimensional`. The dimension-counting proof, `S ⊓ span{u_k, …, u_n} ≠ ⊥`
with `Submodule.finrank_sup_add_finrank_inf_eq`, is about a hundred lines and also yields Weyl's
inequalities and the interlacing that Lanczos and the Ritz-value estimates want. Do it first;
everything else here rests on it. See §4.2 of `backbone.md`.
'''

[[node]]
id = "Krylov.IsRitzPair"
kind = "definition"
desc = 'Ritz pairs of `A` on `K`: `u ∈ K`, `u ≠ 0`, and `A u - θ • u ∈ Kᗮ`.'

[[node]]
id = "Krylov.isRitzPair_iff_hasEigenvector"
kind = "theorem"
desc = 'A Ritz pair is exactly an eigenvector of the compression `compression A K`.'
deps = ["Krylov.IsRitzPair"]

[[node]]
id = "Krylov.IsObliqueRitzPair"
kind = "definition"
desc = 'Oblique (Petrov-Galerkin) Ritz pairs: `u ∈ K` with `A u - θ • u` orthogonal to `L`.'

[[node]]
id = "Krylov.IsRitzPair.hasEigenvector_of_invt"
kind = "theorem"
desc = 'On an `A`-invariant `K` every Ritz pair is an exact eigenpair.'
deps = ["Krylov.IsRitzPair"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Proposition 4.3"

[[node]]
id = "Krylov.compression_residual_le"
kind = "theorem"
desc = '''With `γ = ‖P_K A (1 - P_K)‖` and an exact unit eigenpair `(λ, u)`,
`‖(A_K - λ) P_K u‖ ≤ γ ‖(1 - P_K) u‖` and `‖(A_K - λ) u‖ ≤ √(|λ|² + γ²) ‖(1 - P_K) u‖`. Holds in
any Hilbert space for bounded `A` and closed `K`.'''
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Theorem 4.3"

[[node]]
id = "Krylov.IsRitzPair.mem_Icc"
kind = "theorem"
desc = '''For symmetric `A` the Ritz values are min-max values over subspaces of `K`, so they
interlace from below and lie in `[lmin, lmax]`.'''
deps = ["Krylov.IsRitzPair", "LinearMap.IsSymmetric.eigenvalues_eq_iSup_iInf"]
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Proposition 4.4"

[[node]]
id = "LinearMap.IsSymmetric.ritz_value_error_le"
kind = "theorem"
desc = '''`0 ≤ λ₁ - θ₁ ≤ ‖A - λ₁‖ tan²θ(u₁, K)`, from
`|λ - ⟪A P_K u, P_K u⟫/‖P_K u‖²| ≤ ‖A - λ‖ ‖(1 - P_K) u‖²/‖P_K u‖²`.'''
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Lemma 4.1 and Theorem 4.5"

[[node]]
id = "LinearMap.IsSymmetric.sin_angle_ritzVector_le"
kind = "theorem"
desc = '''`sin θ(u, ũ) ≤ √(1 + γ²/δ²) sin θ(u, K)` for the Ritz vector of the closest Ritz value,
with `|λ - θ| ≤ ‖A - λ‖ sin²θ(u, ũ)`.'''
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Theorem 4.6 and Proposition 4.5"

[[node]]
id = "LinearMap.IsSymmetric.eigenvalues_eq_iSup_iInf"
kind = "theorem"
desc = '''Courant-Fischer: `λ_k = max_{dim S = k} min_{x ∈ S} R(x)`, with Rayleigh's recursive
form. Not in Mathlib, and the prerequisite for everything else in this module.'''
source = "Saad, Numerical Methods for Large Eigenvalue Problems, Theorem 1.9"

[[node]]
id = "Krylov.Arnoldi.charpoly_compression_isMinOn"
kind = "theorem"
desc = '''The characteristic polynomial of the compression to the Krylov subspace minimizes
`‖p(A) v‖` over monic `p` of that degree.'''
source = "Saad, Iterative Methods for Sparse Linear Systems, Theorem 6.1"

[[node]]
id = "Krylov.Arnoldi.norm_ritz_residual_eq"
kind = "theorem"
desc = '''For a Ritz pair `(θ, V_m y)` of the Arnoldi compression the residual is cheap:
`‖(A - θ) ũ‖ = h_{m+1,m} |y_m|`.'''
source = "Saad, Iterative Methods for Sparse Linear Systems, Proposition 6.8"
