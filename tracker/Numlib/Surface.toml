desc = '''
The surface: one library per textbook, with statements faithful to the book and proofs that
specialize the backbone. A surface proof that does not go through a backbone result is a demand on
the backbone, not a licence to do new mathematics here. Citing a book by number is correct in this
layer and wrong in the backbone.

Each book's reasoning — its conventions, how each book-specific definition maps to the backbone,
what was deferred and what was left out — is in the Markdown at the root of the plan directory:
`saadsparse-ch1-4-5.md`, `saadsparse-ch6.md`, `fongsaunders.md`, `atkinsonhan-ch2-3.md`,
`atkinsonhan-ch5.md`, `atkinsonhan-ch8-9.md`.
'''
