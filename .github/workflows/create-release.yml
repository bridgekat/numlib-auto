name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Resolve release tag commit range
      id: range
      run: |
        set -euo pipefail
        before="${{ github.event.before }}"
        after="${{ github.sha }}"

        if git rev-parse --verify --quiet "${before}^{commit}" > /dev/null; then
          resolved_before="$before"
        else
          echo "::warning::Commit ${before} is unavailable (for example after a history rewrite). Falling back to the root commit."
          resolved_before="$(git rev-list --max-parents=0 "$after" | head -n 1)"
        fi

        {
          echo "before=$resolved_before"
          echo "after=$after"
        } >> "$GITHUB_OUTPUT"

    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        before: ${{ steps.range.outputs.before }}
        after: ${{ steps.range.outputs.after }}
