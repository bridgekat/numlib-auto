name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: bridgekat/tracker-graph-explorer # its default branch; pin with `ref:`
          path: .explorer

      - uses: leanprover/lean-action@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 8 wants ^20.19 || >=22.12
          cache: npm
          cache-dependency-path: .explorer/package-lock.json

      # The site is `docs/`: the graph explorer is its front page and the API docs sit under
      # it, at `docs/docs/`, where docgen-action puts them. This step has to run before that
      # action, because the action is what uploads `docs/` -- anything written into it
      # afterwards is built but never published, and the job still goes green.
      #
      # The graph is this commit's, exported here and baked into the page, so the page is
      # pinned to it rather than waiting for a file to be dropped on it. The tracker reads
      # the oleans lean-action has just built, and refreshes its cache itself.
      - env:
          # An absolute path, since the npm build runs from the explorer's own checkout,
          # and a docs root relative to where the page is published, so that the links
          # hold wherever the site is served from.
          TRACKER_GRAPH: ${{ github.workspace }}/numlib.json
          TRACKER_DOCS: docs
        run: |
          lake exe tracker check
          lake exe tracker graph > numlib.json
          (cd .explorer && npm ci && npm run build)
          mkdir -p docs
          cp .explorer/dist/index.html docs/index.html

      - uses: leanprover-community/docgen-action@main
        with:
          api-docs: true
          blueprint: false
          build-page: false # `docs/` is ours, not a Jekyll site
          references: references/references.bib
          use-github-cache: false # Fix: sometimes this leads to incomplete API docs
