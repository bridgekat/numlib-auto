name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: bridgekat/tracker-graph-explorer # its default branch; pin with `ref:`
          path: .explorer

      - uses: leanprover/lean-action@v1

      - name: Build API docs
        if: github.event_name == 'push'
        uses: leanprover-community/docgen-action@main
        with:
          api-docs: true
          blueprint: false
          build-page: false
          deploy: false
          references: references/references.bib

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 8 wants ^20.19 || >=22.12
          cache: npm
          cache-dependency-path: .explorer/package-lock.json

      - name: Export dependency graph
        run: |
          lake exe tracker check
          lake exe tracker graph --all --metrics > numlib.json

      # docgen-action puts the API docs in docs/docs/. The explorer is the site front page.
      # On pushes, use doc-gen4's generated citation tags. Other events build with BibTeX keys.
      - name: Build graph explorer
        working-directory: .explorer
        env:
          TRACKER_GRAPH: ${{ github.workspace }}/numlib.json
          TRACKER_DOCS: docs
          TRACKER_REFERENCES: ${{ github.workspace }}/${{ github.event_name == 'push' && 'docbuild/.lake/build/doc-data/references.json' || 'references/references.bib' }}
        run: |
          npm ci
          npm run build
          mkdir -p ../docs
          cp dist/index.html ../docs/index.html

      - name: Upload combined site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
